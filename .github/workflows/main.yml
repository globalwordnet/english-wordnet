# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push to main
# or on any pull request, avoiding duplicate runs for PRs from this repo.
on:
  push:
    branches: [main]
  pull_request:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2

    - name: Generate XML
      run: python scripts/from_yaml.py

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install libxml2-utils
      
    - name: Verify XML
      # TODO: Once WN-LMF-1.5.dtd (globalwordnet/schemas#106) is published,
      # replace this with `xmllint --noout --valid wn.xml`; the DOCTYPE in
      # wn.xml will then resolve to it directly.
      run: |
        curl -fsSL -o WN-LMF-1.5.dtd https://raw.githubusercontent.com/globalwordnet/schemas/issue-106/WN-LMF-1.5.dtd
        xmllint --noout --dtdvalid WN-LMF-1.5.dtd wn.xml

    - name: Verify Structure
      run: python3 scripts/validate.py
