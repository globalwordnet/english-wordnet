senseId: 'allophone%1:10:00::'
synsetId: 07126641-n
simpleMeaning: In linguistics, one of many ways of saying the same sound unit, the smallest one that can
  change what a word means, where the ways sound different.
scope: This one is not a new sound unit of its own, but a different way of saying the same one.
examples:
- The two sounds are allophones of the same sound, not two sounds of their own.
- In their speech, the tapped sound is an allophone of the plain t sound.
