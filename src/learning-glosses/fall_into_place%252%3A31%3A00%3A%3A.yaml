simpleMeaning: To come to one's mind as something plain, or to settle in one's thoughts and feelings.
scope: This one is also called click, dawn, and penetrate, and come home, get across, get through, and
  sink in are other names for it.
examples:
- At last the whole plan fell into place, and they saw how it would work.
- After the talk, the pieces fell into place in their minds.
