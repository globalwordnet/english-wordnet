simpleMeaning: A programming language for writing scripts that an interpreter runs in a particular environment
  to automate tasks a person could otherwise do one at a time.
scope: This sense is also called script language, for a program language holding scripts, code to run
  in a runtime world built for it.
examples:
- Scripting languages make sense of code instead of compiling it.
- Scripting languages carry out jobs a human could do singly.
