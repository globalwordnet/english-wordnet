simpleMeaning: A state in which the kidneys fail to clear enough waste out of the body
scope: It names kidneys clearing too little waste from the body, not kidneys that have stopped working
  altogether.
examples:
- The doctor warned that renal insufficiency was leaving waste in the body.
- Renal insufficiency leaves waste in the body because the kidneys cannot clear enough of it.
