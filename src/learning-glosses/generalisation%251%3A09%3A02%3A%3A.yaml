simpleMeaning: The carrying over of a learned reaction from one trigger to a similar one.
scope: This sense is also called generalization, stimulus generalisation, and stimulus generalization.
examples:
- The generalisation meant the dog feared the new bell as well as the old one.
- After the training, generalisation showed when the rat froze at the new sound too.
