simpleMeaning: Any box or pot in which the thin bread used in the Christian Communion service is kept.
scope: Also called a pyx. It is not the chest that holds coins from the mint.
examples:
- The priest placed the wafers in the pix after the service.
- A silver pix stood on the altar.
