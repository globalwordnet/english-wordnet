simpleMeaning: To drink liquid with or after food to help swallow it. Also used figuratively for making
  something easier to accept.
scope: It is a way of eating, not of cleaning.
examples:
- She washed down her dinner with a bottle of red wine.
- After the bad news, they washed down their worries with a glass of whisky.
