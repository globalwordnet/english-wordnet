simpleMeaning: Selenium, a toxic nonmetal related to sulfur and tellurium. Of its several forms, metallic-looking
  gray selenium conducts better in light, enabling photocells. It occurs in sulfide ores such as pyrite.
scope: Not sulfur or tellurium, nor other poisonous nonmetals; also called Se and selenium.
examples:
- Atomic number 34 is selenium.
- The element with atomic number 34 is used in light cells.
