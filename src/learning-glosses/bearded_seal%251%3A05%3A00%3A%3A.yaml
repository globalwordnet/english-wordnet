simpleMeaning: A medium-sized grayish to yellow seal of the Arctic Ocean with stiff whiskers on either
  side of its muzzle.
scope: Also called a square flipper, a square flipper seal, or a squareflipper, this middle-sized sea
  animal of the Arctic Ocean has stiff hairs on each side of its nose.
examples:
- We saw a bearded seal in the Arctic Ocean.
- A bearded seal swam by.
