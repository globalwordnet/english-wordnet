simpleMeaning: Sending the ball from one's own end of the field, after the other side has put it past
  the line at that end.
scope: This word is used of a play in soccer.
examples:
- The goal-kick went long, up to the halfway line.
- After the shot missed, the keeper took the goal-kick.
