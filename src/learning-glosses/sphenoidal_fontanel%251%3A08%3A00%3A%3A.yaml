senseId: 'sphenoidal_fontanel%1:08:00::'
synsetId: 05551174-n
simpleMeaning: An irregular soft spot on each side of a baby's skull where the frontal, parietal, temporal,
  and sphenoid bones meet. After hardening, this junction is called the pterion.
scope: One of the soft side gaps at the temple, distinct from the big gap on the crown and the tiny one
  at the back.
examples:
- The sphenoidal fontanel is found on the side of the skull.
- In newborns, the sphenoidal fontanel is still open.
