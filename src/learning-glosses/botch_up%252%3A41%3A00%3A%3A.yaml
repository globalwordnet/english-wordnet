simpleMeaning: To make a mess of something or ruin it by doing it badly.
scope: This one is also called blow, fumble, spoil, fluff, bumble, botch, bungle, muff, bobble, mishandle,
  flub, ball up, bodge, bollix, bollix up, bollocks, bollocks up, foul up, fuck up, louse up, mess up,
  muck up, and screw up.
examples:
- They botched up the whole job and had to start again.
- The pianist screwed up the difficult passage in the second movement.
