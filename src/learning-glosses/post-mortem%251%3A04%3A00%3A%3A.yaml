synsetId: 00142216-n
simpleMeaning: A close look at and cutting open of a dead body to find what caused the death or what the
  sickness did to the body.
scope: It is also called autopsy, postmortem, necropsy, post-mortem examination, postmortem examination,
  or PM.
examples:
- The post-mortem showed that death came from a weak heart.
- Doctors asked for a post-mortem to find the cause of death.
