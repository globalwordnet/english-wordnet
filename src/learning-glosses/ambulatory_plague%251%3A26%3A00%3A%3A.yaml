simpleMeaning: A mild form of bubonic plague, the disease that causes swollen lymph nodes.
scope: Also called ambulant plague or pestis ambulans, this one does not hit as hard as the usual form.
examples:
- The ambulatory plague reached the port, and the sick were far less ill than the doctors feared.
- The traders brought ambulatory plague with them, and the town took it for a mild sickness.
