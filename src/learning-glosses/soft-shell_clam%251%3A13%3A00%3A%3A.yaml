simpleMeaning: A sea animal that lives in a hard covering and is most often cooked by steam while still
  in that covering.
scope: Also called steamer, long-neck clam, and steamer clam. It is a sea animal.
examples:
- They ordered soft-shell clams steamed in the shell.
- The soft-shell clam is best eaten soon after it is steamed.
