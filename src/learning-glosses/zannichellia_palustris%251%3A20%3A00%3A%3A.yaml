simpleMeaning: An aquatic plant of still or slow-moving water, either fresh or slightly salty. It helps
  supply oxygen to cool ponds and aquariums.
scope: Also called horned pondweed; it is a water plant that puts air into ponds, not a weed that only
  grows on land.
examples:
- Zannichellia palustris grows in the still water at the edge of the pond.
- We planted Zannichellia palustris in the aquarium to help put air into the water.
