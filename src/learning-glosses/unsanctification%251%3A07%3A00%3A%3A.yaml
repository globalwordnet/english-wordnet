simpleMeaning: The state of lacking holiness because something is ordinary or treated without religious
  respect.
scope: Also called profaneness. It is a state, not an act.
examples:
- The unsanctification of the old hall shocked the town.
- Years of unsanctification had stripped the shrine of its awe.
