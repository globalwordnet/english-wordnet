simpleMeaning: The opening that leads from the heart's lower left chamber into the main vessel that carries
  blood out of the heart.
scope: This one is not about the opening that lets blood into the heart's lower left chamber.
examples:
- Blood passes through the aortic orifice as it leaves the lower left chamber.
- The surgeon checked the aortic orifice for any narrowing.
