simpleMeaning: A tall herb of eastern North America and Asia with blue berrylike fruit and a thick, knotted
  rootstock formerly used in traditional medicine.
scope: This sense is also called blue cohosh, blueberry root, papoose root, papooseroot, and squaw root.
examples:
- A squawroot grew in the east.
- Squawroots bore blue fruit.
