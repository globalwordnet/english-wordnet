simpleMeaning: A written promise to repay money borrowed, sold to pay for building the services that supply
  power and water to the public.
scope: Also called utility bond. It is a kind of debt paper.
examples:
- The utility revenue bond will pay for the new power station.
- The town issued a utility revenue bond to build new water pipes.
