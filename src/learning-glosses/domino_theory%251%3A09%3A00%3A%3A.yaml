simpleMeaning: The idea in politics that when one country falls under communist rule, the countries next
  to it will fall under it too.
scope: This one is about a political idea.
examples:
- The domino theory held that once one country turned communist, its neighbours would follow.
- Many did not believe the domino theory, and said each country would choose its own path.
