simpleMeaning: A person, often a lawyer or a politician, who uses dishonest or unfair ways to get what
  they want.
scope: Also called a shyster. It is a person.
examples:
- The pettifogger twisted the rules to win the case.
- Voters grew tired of the pettifogger and the dirty tricks used to win.
