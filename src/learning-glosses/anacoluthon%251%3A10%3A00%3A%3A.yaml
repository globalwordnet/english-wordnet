synsetId: 07113655-n
simpleMeaning: This is a sentence that suddenly leaves one pattern and ends in another.
scope: Also called anacoluthia, it names the break in the sentence itself, not the adjective used to describe
  such a break.
examples:
- The anacoluthon in the speech made the crowd murmur in surprise.
- A clear anacoluthon appears when the speaker starts one way and ends another.
