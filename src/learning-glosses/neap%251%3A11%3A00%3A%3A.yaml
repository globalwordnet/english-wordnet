simpleMeaning: A tide smaller than usual, coming when the moon is in its first or third quarter.
scope: Also called a neap tide. It is a kind of tide.
examples:
- During the neap, the high tide barely rose above the sand.
- The fishermen waited out the neap before setting sail.
