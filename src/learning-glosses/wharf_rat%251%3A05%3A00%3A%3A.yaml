simpleMeaning: A brown animal with a long tail that lives in large numbers around the platforms at the
  water's edge where ships load and unload goods.
scope: It is an animal, not a person who lives near the water and steals from ships or warehouses.
examples:
- The wharf rat ran across the wooden boards as the men unloaded the crates.
- Wharf rats had gnawed holes in the sacks of grain left near the water.
