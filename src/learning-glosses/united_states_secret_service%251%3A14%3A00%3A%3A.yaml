simpleMeaning: Federal agents protect presidents, vice presidents, their families, certain former officeholders
  and families, and distinguished foreign visitors. They catch counterfeiters and combat forgery of government
  securities and documents.
scope: Not the FBI or the CIA, other American spy agencies; also called SS, the Secret Service, the US
  Secret Service, and USSS.
examples:
- The United States Secret Service guards the president.
- A United States Secret Service agent stood by the door.
