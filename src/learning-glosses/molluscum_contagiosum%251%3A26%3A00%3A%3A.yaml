simpleMeaning: A viral skin disease that causes round white bumps. It spreads between people and is most
  common in children and adults with weakened immune systems.
scope: This skin illness from a germ shows round white bumps, passes from one person to the next, and
  is seen most often among children or grown people with weak body defences.
examples:
- The child had molluscum contagiosum with round white bumps.
- The molluscum contagiosum passed from one child to the next.
