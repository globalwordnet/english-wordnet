simpleMeaning: A square matrix with the same number everywhere on its main diagonal and zeros in all other
  positions.
scope: It is a table with one number repeated down its main line, unlike a table with different numbers
  down that line.
examples:
- The scalar matrix in the sum has the same number all along its main line.
- Each scalar matrix keeps one number repeated down its diagonal line.
