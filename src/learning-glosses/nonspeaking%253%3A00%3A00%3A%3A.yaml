senseId: 'nonspeaking%3:00:00::'
synsetId: 00154507-a
simpleMeaning: Said of a person who cannot say words aloud, or, above all, of a part in a play that has
  no words to say.
scope: Also called walk-on. It is an adjective.
examples:
- Had a nonspeaking role in the play.
- The actor took a nonspeaking part and said nothing all evening.
