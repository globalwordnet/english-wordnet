schema: oewn-learning-gloss-v2
senseId: 'active_placebo%1:06:00::'
synsetId: 02681028-n
simpleMeaning: A substance given as if it were a drug, but with no real drug in it, used in trials of
  a drug whose side effects can be felt.
scope: This one is not the drug being tested.
examples:
- The active placebo mimicked the side effects of the experimental drug.
- The active placebo was used in the trial because the real drug made people feel sick.
