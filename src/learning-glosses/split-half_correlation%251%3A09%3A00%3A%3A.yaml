simpleMeaning: A number showing how closely scores on two halves of a test agree, used to estimate the
  test's reliability.
scope: Also called a chance-half correlation, this number says how steady a test is, from marks on its
  two parts.
examples:
- The split-half correlation for the exam was high.
- A split-half correlation was worked out for the exam.
