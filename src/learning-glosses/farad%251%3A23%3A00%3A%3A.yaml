simpleMeaning: A unit of capacitance. A capacitor has one farad of capacitance when opposite charges of
  one coulomb on its plates produce a potential difference of one volt.
scope: A unit of electric charge storage, not a volt and not a coulomb.
examples:
- This capacitor is rated at one farad.
- A farad is a large unit, so most capacitors are rated in microfarads.
