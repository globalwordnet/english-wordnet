simpleMeaning: A shrub with white flowers and sticky stems and leaves that produce a fragrant mixture
  of oil and resin, used especially to make perfume scents last.
scope: A white-flowered shrub whose sticky stems and leaves yield a sweet-smelling thick oil used in perfumes
  to make the scent last; common gum cistus and Cistus ladanum are other names for it.
examples:
- Cistus ladanifer blooms with white flowers.
- Perfume makers use Cistus ladanifer oil to make scent last.
