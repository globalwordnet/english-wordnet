senseId: 'eutrophication%1:22:00::'
synsetId: 13497793-n
simpleMeaning: Nutrients from sources such as fertilizer, sewage, or animal waste enter water and fuel
  dense plant or algal growth. Decay then uses up oxygen, sometimes killing aquatic animals.
scope: Of a lake or other water with too much feed washed in from the land, growing plants thick and draining
  oxygen.
examples:
- Eutrophication grows plants thick in the lake.
- Eutrophication kills animals.
