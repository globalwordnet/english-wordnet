simpleMeaning: A unit of weight in the metric system, the same as 100 kilograms.
scope: Doppelzentner, hundredweight and metric hundredweight are other names for this one in the metric
  system, not the one used in some countries of Europe.
examples:
- Two centners of sugar came to 200 kilograms on the scale.
- They stacked centners of flour against the warehouse wall.
