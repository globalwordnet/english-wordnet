simpleMeaning: An iris native to the Pyrenees that grows from a bulb. It is widely grown for large, delicate
  flowers in many colors except yellow.
scope: A garden bulb plant, not a wild water plant and not a yellow flower; also called Iris xiphioides.
examples:
- The English iris bloomed in soft blue in the garden.
- English iris flowers come in many colours except yellow.
