simpleMeaning: To make a process run or be controlled automatically.
scope: Also called automatise and automate, this one does not turn a person into a machine, as the other
  sense of this word does.
examples:
- The plant automatized the welding so the robots did the work on their own.
- The office automatized the filing so the papers were sorted with no one touching them.
