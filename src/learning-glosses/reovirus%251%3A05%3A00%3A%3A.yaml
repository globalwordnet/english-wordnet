senseId: 'reovirus%1:05:00::'
synsetId: 01343576-n
simpleMeaning: A virus in a group that includes rotavirus, which causes intestinal illness in babies.
  Viruses in this group are not carried by arthropods.
scope: A germ of a group not spread by bugs, not a germ spread by a bug bite and not the flu.
examples:
- A reovirus can make a young child sick in the gut.
- The lab found a reovirus in samples from sick babies.
