simpleMeaning: A paper that tells the office that handles mail to pay a named person a sum of money, and
  that can be bought and cashed there.
scope: It is also called money order.
examples:
- The postal order was made out for fifty pounds.
- They paid the bill with a postal order bought at the post office.
