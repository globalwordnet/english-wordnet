simpleMeaning: An electrically neutral baryon, a type of subatomic particle, with an isospin of zero.
scope: This sense names the neutral lambda baryon. Isospin is a property physicists use to classify particles.
  Its value for this particle is zero.
examples:
- The lambda hyperon has no electric charge.
- Physicists found a lambda hyperon in the cloud chamber.
