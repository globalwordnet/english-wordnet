senseId: 'unregenerate%3:00:00::'
synsetId: 01964264-a
simpleMeaning: Said of a person who has not been changed for the better in how they live or what they
  believe.
scope: Also called unregenerated. It is a word for a person, not for one who cannot change.
examples:
- Their unregenerate human nature showed in the way they treated others.
- The old club held to its unregenerate conservatism, turning away each new idea.
