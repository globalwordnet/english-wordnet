simpleMeaning: The spot on the elbow where the ulnar nerve lies near the skin. Bumping the nerve against
  the bone causes a sharp tingling sensation.
scope: This sense is also called funny bone, a spot on the elbow where the arm nerve runs near the skin,
  a sharp tingle following when the nerve is hit on the bone.
examples:
- Crazy bones tingle when knocked.
- The crazy bone sits on the elbow.
