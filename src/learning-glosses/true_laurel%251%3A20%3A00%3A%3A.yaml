simpleMeaning: A small Mediterranean evergreen tree with dark berries and glossy, fragrant leaves used
  in cooking. The ancient Greeks used its leaves to crown victors.
scope: This sense is also called bay, bay laurel, and bay tree, a small winter-green tree of the Mediterranean
  with dark berries and shiny, sweet-smelling leaves used to flavor food, which the ancient Greeks also
  used to crown winners.
examples:
- A true laurel crowned the winner.
- True laurels flavor food.
