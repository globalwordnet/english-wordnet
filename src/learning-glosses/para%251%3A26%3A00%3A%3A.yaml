simpleMeaning: In obstetric records, the number of pregnancies in which a person gave birth after reaching
  a specified stage, including stillbirths.
scope: Each qualifying pregnancy counts once, including a pregnancy with twins.
examples:
- Her record showed para 1 after she gave birth to twins.
- The midwife recorded para 2 for a patient who had given birth after two qualifying pregnancies.
