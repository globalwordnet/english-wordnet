simpleMeaning: Said of the earliest example of a kind, the one later examples take as their guide.
scope: Also called archetypal, archetypical, prototypal, or prototypic. It is a word.
examples:
- The prototypical farmhouse set the pattern for every house built in the valley after it.
- Builders still copy the prototypical barn first raised on the old farm.
