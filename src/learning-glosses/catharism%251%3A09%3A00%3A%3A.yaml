simpleMeaning: A Christian movement in twelfth- and thirteenth-century southern France, thought to descend
  from Manichaeism. It taught that good and evil coexist as opposing principles. The Inquisition eradicated
  it as heretical.
scope: Not Manichaeism itself, nor other medieval Christian movements; also called Albigensianism.
examples:
- Catharism spread in southern France.
- The Inquisition wiped out Catharism.
