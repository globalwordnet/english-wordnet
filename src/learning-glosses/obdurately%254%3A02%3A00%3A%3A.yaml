senseId: 'obdurately%4:02:00::'
synsetId: 00200274-r
simpleMeaning: In a stubborn way, holding fast to old ways and refusing to change.
scope: Also called stubbornly, obstinately, mulishly, cussedly, and pig-headedly. It is an adverb.
examples:
- They held obdurately to the old plan, though everyone else had moved on.
- They answered obdurately, refusing to change their mind.
