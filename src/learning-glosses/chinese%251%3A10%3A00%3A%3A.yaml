simpleMeaning: Any Sino-Tibetan language of China traditionally considered a dialect of one language because
  speakers share a character-based writing system, even when they cannot understand one another's speech.
scope: Not a person from China or the adjective; this is the group of tongues.
examples:
- Chinese has many forms that sound very different.
- Written Chinese uses one set of signs.
