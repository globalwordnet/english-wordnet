simpleMeaning: The tie in meaning between two words that can say the same thing in one set of words around
  them.
scope: Synonymity and synonymousness are other names for it.
examples:
- The synonymy of 'big' and 'large' means either one fits here.
- In the list, the synonymy of 'happy' and 'glad' was plain to see.
