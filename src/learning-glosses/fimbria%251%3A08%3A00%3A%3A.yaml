simpleMeaning: Thin projections forming a fringe, especially at the end of a fallopian tube nearest the
  ovary.
scope: These thin parts stick out and form a fringe, above all around the end of the tube that carries
  eggs from the ovary.
examples:
- The fimbria waved gently at the end of the tube.
- She could see the fimbria at the end of the tube in the picture.
