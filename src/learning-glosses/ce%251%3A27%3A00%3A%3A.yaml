simpleMeaning: Cerium, a gray lanthanide metal that can be drawn into wire. Used in lighter flints, it
  is the most abundant rare-earth element.
scope: Also called cerium, atomic number 58; not the other rare-earth metals.
examples:
- Ce is used in lighter flints.
- Ce is the most abundant rare-earth metal.
