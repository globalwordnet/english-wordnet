senseId: 'antigram%1:10:00::'
synsetId: 06304928-n
simpleMeaning: A word or phrase made by moving the letters of another word or phrase around, meaning the
  opposite of it.
scope: This one does not keep the meaning of the word its letters come from.
examples:
- The words 'Santa' and 'Satan' form an antigram, since they use the same letters but mean opposite things.
- The word 'live' is an antigram of 'evil', since the letters are reversed and the meaning is the opposite.
