simpleMeaning: A stony coral shaped like a flat disk. It usually lives alone and is unattached to the
  sea floor.
scope: This round, hard sea growth most times lies alone on the sea floor, not fixed to anything.
examples:
- A mushroom coral lay flat and loose on the sea floor.
- The diver picked up a mushroom coral and set it down again.
