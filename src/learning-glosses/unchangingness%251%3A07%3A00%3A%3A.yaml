simpleMeaning: Staying the same nearly all the time is what this word names in a thing.
scope: Also called changelessness, unchangeability, and unchangeableness, this word is for the lasting
  state of a thing, not for a single act it does.
examples:
- The unchangingness of the desert was plain to see.
- They liked the unchangingness of village life.
