synsetId: 00897451-v
simpleMeaning: To give someone a reason that clears them, or a story that says they were somewhere else,
  so as to hide their guilt.
scope: This one is about helping someone hide guilt, not about showing it.
examples:
- I won't lie and cover for you.
- A worker covered for a friend who came in late.
