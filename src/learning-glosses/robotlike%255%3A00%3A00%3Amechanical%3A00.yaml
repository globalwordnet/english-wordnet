simpleMeaning: Said of an action done in a fixed way, without any thought behind it, as a machine does.
scope: Also called automatic, robotic, automatonlike, and machinelike. It is an adjective.
examples:
- The robotlike movements stayed the same through the whole dance.
- The clerk gave a robotlike nod and went back to work.
