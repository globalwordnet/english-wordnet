simpleMeaning: The fraction of the radiation hitting a surface that bounces back from it.
scope: Also called reflectance, reflection factor, and coefficient of reflection. It is a share.
examples:
- The white roof has high reflectivity, sending back most of the sun's heat.
- They measured the reflectivity of the new paint to see how much light it would send back.
