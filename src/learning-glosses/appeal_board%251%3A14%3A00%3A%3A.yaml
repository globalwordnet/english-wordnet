synsetId: 08340231-n
simpleMeaning: A group of officials, not judges, chosen to hear requests for a decision to be looked at
  again.
scope: Also called appeals board and board of appeals, this one is not a court of law.
examples:
- The appeal board agreed to hear their case after the first ruling went against them.
- They took the matter to an appeal board when the first decision seemed unfair.
