simpleMeaning: In basketball, a way to start play or resume it after disputed possession. A referee tosses
  the ball between two players, who jump to tap it to a teammate.
scope: In basketball, it is the toss-up a referee uses when two sides both claim it.
examples:
- The jump ball opened the game.
- The jump ball came after the two sides both claimed it.
