simpleMeaning: A drug taken to ease worry or strain, with the mind left clear.
scope: Also called tranquilizer, tranquillizer, antianxiety agent, ataractic, ataractic drug, and tranquilliser,
  this is not a drug that clouds the mind.
examples:
- The doctor prescribed an ataractic agent to ease their worry.
- They took an ataractic agent each morning to keep their worry down.
