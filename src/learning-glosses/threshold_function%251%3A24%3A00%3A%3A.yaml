simpleMeaning: A function that gives 1 if a specified working of the inputs goes past a given mark, and
  0 if it does not.
scope: This is a rule that gives 1 or 0, not a rule that gives any other number.
examples:
- They used a threshold function that gave 1 when the figure from the inputs went past the mark.
- A threshold function gave 0 when the figure from the inputs stayed below the mark.
