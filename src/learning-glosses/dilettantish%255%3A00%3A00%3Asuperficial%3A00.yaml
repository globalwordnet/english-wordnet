senseId: dilettantish%5:00:00:superficial:00
synsetId: 01880299-s
simpleMeaning: Taking a thing up only as a pastime, in a light and shallow way, like one who does it for
  fun rather than for a living.
scope: This one is also called dilettante, dilettanteish, and sciolistic.
examples:
- His dilettantish efforts at painting never got past a few rough sketches.
- The new member took a dilettantish interest in chess, playing a game now and then but never reading
  a book about it.
