simpleMeaning: Pollution from materials that living organisms cannot readily break down. These materials
  accumulate in the environment and can enter the food chain.
scope: It is a kind of waste.
examples:
- Nonbiodegradable pollution from the factory still coats the riverbed.
- The town banned nonbiodegradable pollution that would linger in the soil for years.
