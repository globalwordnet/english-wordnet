simpleMeaning: People who cover chairs and sofas use one of several kinds of very heavy needles, sometimes
  curved, to sew the cloth covers on.
scope: This one is not for light sewing.
examples:
- They used an upholstery needle to sew the thick cover back onto the chair.
- The upholstery needle was too heavy for the thin cloth, so they set it aside.
