simpleMeaning: To drain a person of all strength, or to lose all of one's own strength, by too much use
  or great strain or stress.
scope: This one is also called wear, tire, weary, fatigue, jade, fag, outwear, tire out, wear down, wear
  out, and wear upon.
examples:
- We wore ourselves out on this hike.
- Hours of digging fagged the workers out.
