simpleMeaning: A family of Indigenous languages spoken in the northwestern United States and western Canada,
  sometimes included in the proposed Mosan grouping.
scope: This is a family of Mosan languages of the north-west United States and western Canada, also called
  Salishan, not the people who speak these languages.
