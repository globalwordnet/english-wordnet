simpleMeaning: Said of something with a dusty pink colour, tinged with purple.
scope: Also called rose and roseate. It is an adjective; it does not mean belonging to a plant family.
examples:
- The rosaceous light of the morning filled the room.
- The rosaceous walls of the old house had a soft pink glow.
