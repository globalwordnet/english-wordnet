simpleMeaning: A medical treatment for certain severe psychiatric illnesses in which a controlled stimulus,
  usually electrical, produces a brief seizure.
scope: Shock treatment is another name for this care, strong jolts that bring on fits.
examples:
- The patient was given shock therapy.
- Doctors used shock therapy to bring on fits.
