simpleMeaning: A person with hemophilia, whose blood clots poorly and who can have bleeding that is hard
  to stop.
scope: This person is also called a bleeder, a haemophile, a hemophile, or a hemophiliac.
examples:
- The haemophiliac wore a bracelet naming the condition.
- Doctors warned the haemophiliac about contact sports.
