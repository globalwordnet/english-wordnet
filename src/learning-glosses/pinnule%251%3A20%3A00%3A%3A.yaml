simpleMeaning: One part of a leaf, usually divided into smaller parts shaped like little leaves and set
  along a middle stalk.
scope: Also called pinna. It is a part of a leaf.
examples:
- Each pinnule was set along the middle stalk of the leaf.
- The pinnule looked like a tiny leaf of its own.
