simpleMeaning: A type of MRI scan that tracks activity by measuring natural changes in how much oxygen
  the blood's hemoglobin carries.
scope: A magnetic resonance scan that tracks natural shifts in blood oxygen; also called blood-oxygenation
  level dependent functional magnetic resonance imaging.
examples:
- Doctors used BOLD FMRI to watch activity in the body.
- The BOLD FMRI scan showed changes in blood oxygen.
