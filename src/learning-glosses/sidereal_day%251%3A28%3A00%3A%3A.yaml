senseId: 'sidereal_day%1:28:00::'
synsetId: 15233129-n
simpleMeaning: The time Earth takes to turn once relative to a distant star, about four minutes shorter
  than an average solar day.
scope: Day is another name for this time, in which Earth turns once against one far star, about four minutes
  less than the time the sun marks out.
examples:
- A sidereal day runs about four minutes short of a solar day.
- The sidereal day ends when the same star stands overhead again.
