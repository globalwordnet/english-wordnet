simpleMeaning: Perennial Old World tropical vine with three-part leaves, fragrant purple pealike flower
  clusters, and maroon edible-seed pods. Grown ornamentally and as a vegetable in South Asia, sometimes
  classified under Dolichos.
scope: A climbing vine of warm lands, also called bonavist, hyacinth bean, Dolichos lablab, Indian bean
  and Lablab purpureus; not a bean of the New World.
examples:
- Egyptian bean grows in South Asia.
- Egyptian bean bears purple flowers and red pods.
