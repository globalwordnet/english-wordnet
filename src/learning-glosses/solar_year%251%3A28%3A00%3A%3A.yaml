simpleMeaning: From one spring equinox to the next, the time Earth needs for one full round of the sun.
scope: Astronomical year, equinoctial year and tropical year are other names for this time.
examples:
- The solar year passed, and the spring equinox came round again.
- We counted the solar year from one spring equinox to the next.
