simpleMeaning: A place outside the official system where people buy and sell goods for less than the price
  fixed by the body that controls trade.
scope: This sense is also called grey market.
examples:
- They bought the camera on the gray market for less than the official price.
- The gray market sells goods below the price set by the regulators.
