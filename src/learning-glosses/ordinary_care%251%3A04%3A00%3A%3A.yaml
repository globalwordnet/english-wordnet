simpleMeaning: How much caution a reasonable person would use in the situation, used as the standard for
  deciding legal duty.
scope: Also called due care and reasonable care. It is a noun.
examples:
- The driver showed ordinary care on the wet road.
- They took ordinary care when crossing the busy street.
