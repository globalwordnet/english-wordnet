simpleMeaning: In some Protestant churches, a member of the church who helps the minister with duties
  such as worship or care for the congregation.
scope: The entry describes a lay deacon. Some Protestant churches ordain deacons.
examples:
- The Protestant deacon helped the minister with the service.
- A Protestant deacon stood beside the minister during the service.
