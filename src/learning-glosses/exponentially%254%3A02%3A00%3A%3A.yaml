simpleMeaning: By growing or shrinking by the same factor over each equal interval.
scope: This is growing by ever bigger steps, faster and faster; not growing by a steady amount and not
  simply growing quickly.
examples:
- Inflation is growing exponentially.
- The cost rose exponentially as the work went on.
