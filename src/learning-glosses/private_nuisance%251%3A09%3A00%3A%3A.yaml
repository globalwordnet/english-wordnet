senseId: 'private_nuisance%1:09:00::'
synsetId: 05839736-n
simpleMeaning: Something that gets in the way of a person's rights in their own land and of how they use
  and enjoy it.
scope: It is a wrong done to one landowner, not to the public at large.
examples:
- The smoke from a neighbour's bonfire was a private nuisance that stopped them enjoying their garden.
- Loud music late at night can be a private nuisance to the people living next door.
