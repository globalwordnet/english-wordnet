simpleMeaning: A pufferfish with stiff spines or spines that can stand upright.
scope: This names a fish whose spines are stiff or can stand up, not a fish whose spines stay soft and
  flat.
examples:
- The spiny puffer raised its spines so that they stood up from its body.
- The spiny puffer's spines stood stiff and upright.
