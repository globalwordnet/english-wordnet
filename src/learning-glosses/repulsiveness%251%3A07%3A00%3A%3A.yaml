simpleMeaning: The quality of being so foul that it turns the senses or the feelings away in disgust.
scope: Also called wickedness, vileness, sliminess, loathsomeness, and lousiness. It is a noun.
examples:
- The repulsiveness of the rotting food made them leave the room.
- Even the sight of it had a repulsiveness that turned their stomachs.
