simpleMeaning: A substance added to man-made materials or other materials so that they can be bent and
  shaped more easily without breaking.
scope: Also called plasticiser. It is a substance.
examples:
- The factory adds a plasticizer to the mix to keep the sheets soft.
- Without the plasticizer, the cover would crack when bent.
