simpleMeaning: Either of the two folds above the true vocal cords that normally play no part in producing
  the voice.
scope: Also called false vocal cord, false vocal fold, superior vocal cord, and ventricular fold. It is
  a flap.
examples:
- The doctor pointed to the vestibular fold on the chart.
- The vestibular fold showed up clearly in the scan.
