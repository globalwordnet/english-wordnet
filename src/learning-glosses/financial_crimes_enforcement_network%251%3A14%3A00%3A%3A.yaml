simpleMeaning: A US Treasury law enforcement agency that sets and carries out policies to detect money
  laundering, the practice of disguising the source of criminal earnings.
scope: 'Also called FinCEN: a law body of the Treasury Department that sets rules to spot the washing
  of crime money, unlike other law bodies that chase street crime or collect taxes.'
examples:
- The Financial Crimes Enforcement Network tracks money laundering.
- Banks report suspect deals to the Financial Crimes Enforcement Network.
