senseId: 'pithiness%1:10:00::'
synsetId: 07103216-n
simpleMeaning: The quality of saying a lot with only a handful of words, whether written or spoken.
scope: Also called conciseness, concision, and succinctness. It is a quality.
examples:
- The pithiness of the writing made it a pleasure to read.
- Good speeches gain from pithiness, not from long words.
