simpleMeaning: A food fish resembling shad that swims upriver to spawn. It is often salted or smoked and
  is sometimes classified in the genus Pomolobus.
scope: A food fish like a shad that swims up rivers to lay eggs, also called alewife and also called Alosa
  pseudoharengus, not a sea fish that stays at sea and not a fish eaten fresh only.
examples:
- Pomolobus pseudoharengus swims up the river in spring.
- Smoked Pomolobus pseudoharengus is sold in the market.
