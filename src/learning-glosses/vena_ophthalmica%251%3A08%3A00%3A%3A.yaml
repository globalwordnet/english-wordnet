simpleMeaning: Two blood vessels serve the eye and carry blood back toward the heart, and each one empties
  into the cavernous sinus, a blood-filled hollow in the skull.
scope: These are two blood vessels of the eye, also called ophthalmic vein, not one of many.
examples:
- Blood from the eye runs back through the vena ophthalmica.
- The surgeon followed the vena ophthalmica from the eye to the hollow in the skull.
