simpleMeaning: Two or more speakers, fed by two microphones, make sound seem deep and all around.
scope: Stereo, stereo system, and stereophony are other names for this set of speakers and microphones.
examples:
- The music sounded fuller through the stereophonic system.
- In the hall, a stereophonic system made the sound seem to come from all around.
