simpleMeaning: People leave their most valuable things locked away in a metal case that fire cannot burn
  through, most often kept in a bank.
scope: This case is also called a lockbox, a deposit box, a safe-deposit, a safe-deposit box, and a safety-deposit.
examples:
- They put their valuables in a safety deposit box.
- They opened the safety deposit box to take out what they had stored there.
