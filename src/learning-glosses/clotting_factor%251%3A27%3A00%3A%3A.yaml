senseId: 'clotting_factor%1:27:00::'
synsetId: 15047343-n
simpleMeaning: Any of the things in the blood whose work is needed for the blood to turn solid.
scope: This one is a thing in the blood, not the process by which blood turns solid; coagulation factor
  is another name for it.
examples:
- The test showed that one clotting factor was missing from the patient's blood.
- Doctors give a missing clotting factor to patients whose blood will not clot.
