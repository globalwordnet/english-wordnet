senseId: verticillate%5:00:00:cyclic:03
synsetId: 00680988-s
simpleMeaning: Arranged in one or more rings around a central point, especially leaves growing from the
  same level around a stem.
scope: Also called whorled and verticillated, this word describes growth in rings, not growth one by one
  along a stem.
examples:
- They counted the verticillate leaves in each ring around the stem.
- The verticillate flowers opened in rings along the tall stem.
