simpleMeaning: A field-effect transistor, an electronic component in which an electric field across a
  channel changes its resistance and controls the current flowing through it.
scope: A switch in a circuit, also called a field-effect transistor; not a big power switch and not a
  wire.
examples:
- The FET controls the flow in the radio.
- A FET sits in the amp.
