simpleMeaning: A skirt made from a rectangle of calico or printed cotton, worn by Polynesian people, especially
  Samoans.
scope: A skirt of one flat piece of calico or printed cotton cloth, worn by Pacific islanders, above all
  Samoans.
examples:
- She wrapped a bright lavalava around her waist for the dance.
- He bought a lavalava in Samoa as a gift.
