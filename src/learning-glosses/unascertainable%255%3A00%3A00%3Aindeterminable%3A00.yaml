simpleMeaning: Said of a thing that no one can find out, and that will not let itself be found.
scope: Undiscoverable is another name for it.
examples:
- The cause of the fire was unascertainable, even after weeks of work.
- The reasons stayed unascertainable, and no one could guess them.
