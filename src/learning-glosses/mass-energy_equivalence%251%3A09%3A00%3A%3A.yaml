simpleMeaning: The principle in relativity that a measured amount of mass is equivalent to a corresponding
  amount of energy.
scope: The relationship concerns mass and energy as measurable physical quantities.
examples:
- The equation E = mc² expresses mass-energy equivalence.
- The lecture explained how mass-energy equivalence relates a measured mass to an amount of energy.
