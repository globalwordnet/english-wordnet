simpleMeaning: A hypothetical creature once thought to represent a stage between apes and humans.
scope: Also called a missing link, this being was once thought to stand halfway between wild animals and
  people, but it was only made up.
examples:
- Long ago, people believed an ape-man stood halfway between wild animals and people.
- In old books, an ape-man stood halfway between wild animals and people.
