simpleMeaning: Said of ideas or work with nothing fresh or unplanned in them, already out of date.
scope: It is also called cold, dusty, and stale.
examples:
- Those moth-eaten theories about race won no new followers.
- The play was moth-eaten, with jokes the crowd had heard a hundred times.
