simpleMeaning: A complex of two proteins, actin and myosin, in muscle fibers. When a fiber is stimulated,
  the proteins slide past each other and the muscle contracts.
scope: For a protein in muscle fibres, made of myosin and actin, that makes muscles contract.
examples:
- Actomyosin shortens in muscle.
- Actomyosin makes muscles contract.
