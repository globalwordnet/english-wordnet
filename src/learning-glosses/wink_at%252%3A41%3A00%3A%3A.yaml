senseId: 'wink_at%2:41:00::'
synsetId: 02422489-v
simpleMeaning: To show agreement with something by saying nothing.
scope: Also called connive at. It is not about closing one eye.
examples:
- The guard winked at the children and let them through the gate.
- They winked at the plan and said nothing against it.
