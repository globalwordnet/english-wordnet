simpleMeaning: The debt gets paid off bit by bit, in a run of small payments or money moved over.
scope: Also called amortisation, this one pays off what is owed bit by bit, while the other sense of this
  word is about a thing losing value over years.
examples:
- The amortization of the debt went on for twenty years.
- Each month brought another step in the amortization of what they owed.
