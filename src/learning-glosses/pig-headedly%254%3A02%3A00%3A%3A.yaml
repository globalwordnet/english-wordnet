senseId: 'pig-headedly%4:02:00::'
synsetId: 00200274-r
simpleMeaning: In a fixed, stubborn way, refusing to change one's mind.
scope: Also called stubbornly, obstinately, mulishly, cussedly, and obdurately. It is a word.
examples:
- They stuck pig-headedly to the old plan even when it failed.
- The committee held pig-headedly to its first choice.
