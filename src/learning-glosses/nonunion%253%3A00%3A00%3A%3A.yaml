simpleMeaning: Said of a person or place that does not belong to a workers' group that bargains for pay
  and conditions, or does not let workers join one.
scope: It is an adjective.
examples:
- The job was done by nonunion carpenters.
- They worked at a nonunion shop where the workers had no group to speak for them.
