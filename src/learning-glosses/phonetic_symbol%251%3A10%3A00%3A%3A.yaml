simpleMeaning: A written mark used in a system for writing down sounds, standing for one particular speech
  sound.
scope: It is a written mark, not a sound.
examples:
- The phonetic symbol 'ʃ' stands for the sound at the start of 'ship'.
- Each phonetic symbol in the dictionary shows one sound of the word.
