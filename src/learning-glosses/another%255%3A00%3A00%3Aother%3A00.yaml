senseId: another%5:00:00:other:00
synsetId: 02077592-s
simpleMeaning: A different one among several possibilities, or some other one. It can stand for a single
  entity or indicate one other member of a group.
scope: Before a singular noun, as in another way; the sense "one more" is left to the numeral one.
examples:
- Let us try another way.
- She chose another dress.
