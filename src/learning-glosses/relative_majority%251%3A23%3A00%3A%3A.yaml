senseId: 'relative_majority%1:23:00::'
synsetId: 13602421-n
simpleMeaning: In a vote with more than two choices, the most votes any one side gets, when that is still
  less than half of all the votes
scope: Also called plurality, it is the largest share of the votes in a vote with more than two choices,
  where that share is still under half, unlike a share of more than half.
examples:
- They won by a relative majority, with more votes than any rival but less than half in all.
- No one reached half the votes, so the winner held only a relative majority.
