senseId: 'refractivity%1:07:00::'
synsetId: 05018752-n
simpleMeaning: The strength with which a thing bends light that passes through it, set by the speed of
  light in the thing.
scope: 'This is also called refractiveness: the bending power itself, not the number that measures it.'
examples:
- The refractivity of the crystal changed how the light bent as it passed through.
- The refractivity of the lens made the words on the page look larger.
