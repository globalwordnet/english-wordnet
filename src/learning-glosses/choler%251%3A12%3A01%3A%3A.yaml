senseId: 'choler%1:12:01::'
synsetId: 07531593-n
simpleMeaning: A strong feeling aimed at something thought to be wrong, whether it really is wrong or
  only seems so.
scope: This strong feeling is also called anger and ire, not the old humor once thought to come from the
  liver.
examples:
- Their choler rose when they heard the unfair decision.
- They said things in choler that they later regretted.
