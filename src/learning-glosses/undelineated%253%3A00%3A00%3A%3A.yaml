simpleMeaning: Describing something whose shape, features, or limits have been represented imprecisely
  or left unclear.
scope: It is a way of describing how a thing is shown.
examples:
- Their undelineated sketch gave only a rough idea of the house.
- The undelineated drawing did not show the edges clearly.
