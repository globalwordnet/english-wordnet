senseId: 'unsecured_bond%1:21:00::'
synsetId: 13360859-n
simpleMeaning: A bond backed by the issuer's promise to repay, with no specific property pledged as security.
  The lender trusts the issuer to pay later.
scope: Also called debenture and debenture bond. It is a kind of credit.
examples:
- The shop let the buyer take the coat on an unsecured bond, with no money down.
- An unsecured bond let the family get a fridge before payday.
