simpleMeaning: A procedure in which blood is taken out and separated into parts so that selected parts
  can be collected and the rest returned to the person.
scope: Also called apheresis. It can be used to collect part of a donor’s blood.
examples:
- The donor gave platelets by pheresis.
- During pheresis, the donor received most of her blood back.
