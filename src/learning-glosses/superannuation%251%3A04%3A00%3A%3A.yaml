simpleMeaning: The act of sending an old worker away from a job so that the worker stops work and lives
  on a pension.
scope: It names the act, not the pension paid after the act.
examples:
- The firm used superannuation to end the old clerk's service.
- After forty years, the teacher faced superannuation.
