senseId: 'parallelepipedon%1:25:00::'
synsetId: 13907397-n
simpleMeaning: A block with six flat faces, with a four-sided shape at each end whose opposite edges stay
  the same distance apart and never meet.
scope: Also called a parallelepiped, a parallelopipedon, or a parallelopiped. It is a solid.
examples:
- They built a model of a parallelepipedon from wood.
- The stone was cut as a parallelepipedon with six flat faces.
