simpleMeaning: A solid with six faces, each a parallelogram, a four-sided shape with opposite sides parallel.
scope: Also called a parallelepiped, a parallelopipedon, or a parallelopiped. It is a solid.
examples:
- They built a model of a parallelepipedon from wood.
- The stone was cut as a parallelepipedon with six flat faces.
