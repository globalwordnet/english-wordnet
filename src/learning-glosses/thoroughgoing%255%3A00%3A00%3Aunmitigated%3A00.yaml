simpleMeaning: The word after it comes out stronger, with no limit at all, in everyday talk, and often
  in a bad way.
scope: This is also called perfect, complete, staring, utter, pure, thorough, gross, stark, everlasting,
  consummate, unadulterated, sodding, arrant, and double-dyed, and it does not mean a task done fully
  and completely.
examples:
- They called it a thoroughgoing mess.
- They described it as a thoroughgoing failure.
