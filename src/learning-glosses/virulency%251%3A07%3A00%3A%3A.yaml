simpleMeaning: The ability to cause great harm, for example the ability of a germ to cause severe illness.
scope: Also called virulence. It is a property, not a sickness.
examples:
- The virulency of the new flu strain alarmed the doctors.
- Scientists measured the virulency of the germ in the lab.
