simpleMeaning: The part of the skeleton made up of the shoulder girdle, pelvic girdle, arms, and legs.
scope: This name covers the limb bones and the bones that join the limbs to the body.
examples:
- The fracture was in the appendicular skeleton, in the upper arm.
- A break in the appendicular skeleton kept the runner off the track.
