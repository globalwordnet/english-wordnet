simpleMeaning: A common nonmetallic element that can form four bonds. Its forms include graphite, diamond,
  and amorphous carbon, and it occurs in every organic compound.
scope: This is the stuff in all organic stuff, also called C and atomic number 6, not a copy and not a
  piece of coal.
examples:
- Carbon is in every living thing.
- Diamonds are one form of carbon.
