simpleMeaning: Phosphorus, a multivalent nonmetal of the nitrogen family found in phosphate rocks and
  as organic phosphates in all living cells. It is highly reactive and has several forms.
scope: Also called P and phosphorus; a non-metal element of the nitrogen family, not a metal.
examples:
- Atomic number 15 is the place of phosphorus in the list of elements.
- Phosphorus has atomic number 15.
