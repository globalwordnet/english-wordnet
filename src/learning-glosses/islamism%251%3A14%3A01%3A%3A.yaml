simpleMeaning: A movement that seeks to revive Islam and apply its values throughout life. It generally
  favors traditional moral rules and takes the words of the Quran literally.
scope: A strict revival movement within Islam, not the religion of Islam itself and not a liberal reform
  movement.
examples:
- Islamism spread quickly among young believers in the 1980s.
- Critics of Islamism say it mixes faith with politics.
