simpleMeaning: A rule that lets a group that meets to talk and decide bring a debate to an end, or keep
  it from going on too long.
scope: This one is a rule for a debate; closure, gag law and gag rule are other names for it.
examples:
- The speaker called for cloture to end the long debate.
- The members voted for cloture, and the debate came to an end.
