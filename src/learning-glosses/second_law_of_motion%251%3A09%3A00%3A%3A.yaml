simpleMeaning: The rate at which an object's momentum changes equals the net force acting on it and points
  in the same direction as that force.
scope: Also called Newton's second law and Newton's second law of motion. It is a rule.
examples:
- The teacher showed how a push changes the motion of a cart when a force acts on it.
- A bigger force makes the motion of the ball change faster.
