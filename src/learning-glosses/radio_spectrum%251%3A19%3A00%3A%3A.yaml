simpleMeaning: The full range of electromagnetic frequencies used for communication, including those used
  for radio, radar and television.
scope: The whole range of wave lengths used to send messages; also called radio-frequency spectrum, not
  the range of light the eye can see, and not one wave length used by a single station.
examples:
- The radio spectrum is shared by many users.
- Television uses part of the radio spectrum.
