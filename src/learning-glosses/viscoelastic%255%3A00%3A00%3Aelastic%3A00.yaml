simpleMeaning: Said of a thing that is both thick and slow to flow, and springs back after being stretched.
scope: It is said of a thing, not of a person.
examples:
- The viscoelastic putty stretches and then slowly returns to shape.
- This viscoelastic gel flows slowly but springs back when pressed.
