simpleMeaning: A halogen element that usually forms one bond. Its pale yellow gas is toxic and irritating,
  and a powerful oxidizer. Sources include fluorite, cryolite, and fluorapatite.
scope: This element is also called F and atomic number 9; it is not chlorine and not another gas of the
  halogen group.
examples:
- Fluorine is a yellow gas that can burn the skin.
- Fluorine is used to make many other chemicals.
