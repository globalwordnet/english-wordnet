senseId: 'heroic%1:10:00::'
synsetId: 06397799-n
simpleMeaning: A rhythm used in poetry about heroes or other grand subjects, especially dactylic hexameter,
  with six metrical feet per line, or iambic pentameter, with five.
scope: A verse form for high themes, not a word for brave acts and not a word for grand size.
examples:
- The poet wrote in heroic verse for the long tale.
- The heroic form suits tales of war and kings.
