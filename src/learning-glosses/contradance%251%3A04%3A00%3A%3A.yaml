senseId: 'contradance%1:04:00::'
synsetId: 00540158-n
simpleMeaning: An old way of moving in step to music, with pairs standing in sets or facing each other
  across a line.
scope: Also called contra danse, contredanse, country dancing, and country-dance; this one is about pairs
  moving in step, not the act of performing one.
examples:
- The couples formed a contradance, standing in two long rows.
- A contradance began, and the pairs moved in step to the fiddle.
