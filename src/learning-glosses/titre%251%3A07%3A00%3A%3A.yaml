simpleMeaning: The strength of a liquid, worked out by adding a second liquid a drop at a time until it
  changes.
scope: Also called titer. It is a kind of value.
examples:
- The titre of the acid was noted in the lab book.
- They checked the titre twice to be sure of the strength.
