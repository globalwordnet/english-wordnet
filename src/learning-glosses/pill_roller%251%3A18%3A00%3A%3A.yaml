simpleMeaning: An informal term for a pharmacist, a healthcare professional trained to prepare and dispense
  medicines.
scope: Also called pharmacist, chemist, apothecary, druggist, and pill pusher. It names a trained health
  worker, not a person who takes the drugs.
examples:
- The pill roller counted out the tablets for the patient.
- The pill roller handed the bottle to the waiting customer.
