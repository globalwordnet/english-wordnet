simpleMeaning: A lens thicker in the middle than at the edges that brings parallel light rays to a focus.
scope: Also called converging lens; this one is about curved glass.
examples:
- The convex lens in the glasses bends light to a point.
- A convex lens held up to the sun can focus light on a sheet of paper.
