schema: oewn-learning-gloss-v2
senseId: 'synecdoche%1:10:00::'
synsetId: 07123138-n
simpleMeaning: A broad word or phrase can stand in for a narrow one, and a narrow word or phrase can stand
  in for a broad one.
scope: This is the use of a broad word or phrase in place of a narrow one, or the other way round.
examples:
- The teacher called 'all hands on deck' a synecdoche.
- In the poem, the word 'sails' was a synecdoche for the whole ship.
