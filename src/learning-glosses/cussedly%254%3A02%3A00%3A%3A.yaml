simpleMeaning: With a fixed and stubborn mind that will not give way.
scope: Stubbornly, obstinately, mulishly, obdurately, and pig-headedly are other names for this one.
examples:
- The driver cussedly refused to move, even when the rain started.
- The manager cussedly held to the plan, though everyone said to drop it.
