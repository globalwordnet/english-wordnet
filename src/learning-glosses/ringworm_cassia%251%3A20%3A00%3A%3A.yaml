simpleMeaning: A tropical shrub, especially of the Americas, with yellow flowers and large leaves whose
  juice is traditionally used for ringworm and venomous bites. Sometimes classified in the genus Cassia.
scope: This sense is also called ringworm bush and ringworm shrub, for a shrub of warm climes, especially
  in the Americas, with yellow blooms and broad leaves.
examples:
- Ringworm cassia juice cured the bite.
- Ringworm cassia grew in the yard.
