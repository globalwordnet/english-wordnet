simpleMeaning: A paper that sets out, at the close of a money period, how much a firm earned or gave up,
  counting costs in or leaving them out.
scope: Also called profit and loss. It is a paper.
examples:
- The profit and loss account showed a small gain for the year.
- They checked the profit and loss account before signing the loan.
