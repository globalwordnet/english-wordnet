simpleMeaning: A person put forward for the smaller of two linked posts, the greater post going to another.
scope: Of two linked posts, this name belongs to the smaller one, not the greater post.
examples:
- The running mate stood for the smaller of the two linked posts.
- The party named a running mate for the smaller post.
