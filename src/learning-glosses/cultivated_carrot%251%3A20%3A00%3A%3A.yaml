simpleMeaning: A carrot plant widely grown as an annual for its long, cone-shaped, edible orange root.
  Many varieties are grown in temperate and tropical regions.
scope: A cultivated carrot is grown for its edible root, usually harvested in its first year.
examples:
- The cultivated carrot grew long orange roots.
- They pulled a cultivated carrot from the bed.
