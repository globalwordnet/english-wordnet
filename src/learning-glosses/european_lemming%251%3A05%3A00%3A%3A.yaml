simpleMeaning: A small European rodent known for mass migrations, during which some animals drown while
  attempting water crossings, including at the coast.
scope: Also called Lemmus lemmus; this animal moves in huge groups, not on its own.
examples:
- The European lemmings moved together toward the sea, and many drowned.
- When European lemmings move in great numbers, many die in the sea.
