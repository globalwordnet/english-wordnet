simpleMeaning: A red rash of many shapes, brought on by the body's over-strong reaction to a drug, an
  illness, or some other thing that sets it off.
scope: This one is about a rash.
examples:
- The erythema multiforme broke out after they took the new drug.
- Their erythema multiforme faded once the drug was stopped.
