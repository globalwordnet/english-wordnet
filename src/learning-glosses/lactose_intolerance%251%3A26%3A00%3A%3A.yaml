senseId: 'lactose_intolerance%1:26:00::'
synsetId: 14530258-n
simpleMeaning: Digestive symptoms after consuming milk sugar, sometimes present from birth but usually
  developing later. They arise when the body makes too little lactase to break down lactose.
scope: People vary in how much lactose they can tolerate.
examples:
- Her lactose intolerance became noticeable in adulthood.
- Because of his lactose intolerance, he often buys lactose-free milk.
