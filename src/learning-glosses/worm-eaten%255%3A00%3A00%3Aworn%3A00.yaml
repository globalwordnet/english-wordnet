simpleMeaning: Infested with worms or damaged as though worms have eaten into it.
scope: Also called wormy or vermiculate, this is about what tiny creatures do to a thing, not about its
  shape.
examples:
- The old beams were worm-eaten, and dust fell from them with every step.
- They threw out the worm-eaten apples from the bottom of the basket.
