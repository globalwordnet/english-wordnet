senseId: 'force_majeure%1:11:00::'
synsetId: 07329950-n
simpleMeaning: A natural disaster that cannot be avoided and that breaks what was expected to happen.
scope: Also called an inevitable accident, an unavoidable casualty, vis major, or an act of God; this
  one is about a natural event.
examples:
- The flood was called a force majeure after it stopped all work on the site.
- Their claim of force majeure was accepted after the storm closed the roads.
