simpleMeaning: The base of a hollow organ, or the part farthest from its opening.
scope: Its position depends on the organ. The fundus of the stomach lies above the opening where food
  enters.
examples:
- The fundus of the stomach sits above the opening where food comes in.
- The doctor looked at the fundus of her womb.
