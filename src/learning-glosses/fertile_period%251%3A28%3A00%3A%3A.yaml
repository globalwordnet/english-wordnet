simpleMeaning: The days around ovulation when conception is most likely, usually the five days before
  an egg is released and the day of release.
scope: The interval around ovulation when a pregnancy is most likely to begin. Its timing varies.
examples:
- The timing of the fertile period can vary from cycle to cycle.
- The fertile period includes several days before ovulation.
