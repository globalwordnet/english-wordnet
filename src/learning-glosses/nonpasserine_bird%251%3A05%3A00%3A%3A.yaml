simpleMeaning: A bird outside the order of perching birds called passerines, such as a kingfisher in the
  order Coraciiformes.
scope: The group includes birds that live in trees, on land, and on water.
examples:
- The nonpasserine bird spent the day high in the branches.
- This nonpasserine bird belongs to the Coraciiformes, a group of tree-living birds.
