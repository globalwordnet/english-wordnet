simpleMeaning: In an older classification, a single-celled organism that usually reproduces by budding
  or splitting and gets nutrients by absorption or makes food using sunlight or chemical energy.
scope: This sense is also called moneron, for life forms that usually breed by budding or splitting without
  sex, and feed by soaking up food, or by sunlight, or by chemical means.
examples:
- Monerans breed without sex.
- Monerans feed by soaking up food.
