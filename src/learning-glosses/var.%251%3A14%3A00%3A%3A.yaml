simpleMeaning: In biology, one kind of living thing holds a set that differs from like sets in ways that
  matter little.
scope: Form, strain, and variant are other names for this, not a new kind of living thing.
examples:
- They found a new var. that differed from the rest in small ways only.
- The var. grew beside others of its kind, unlike them in small ways only.
