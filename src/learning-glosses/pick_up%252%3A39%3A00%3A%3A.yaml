simpleMeaning: To notice something through the senses quickly, suddenly, or for a brief moment.
scope: Also called catch. It is an act, not taking a rider along or taking in a signal.
examples:
- The dog picked up the scent as they walked past the kitchen.
- They picked up the smell of rain before the storm.
