senseId: 'definitive_host%1:05:00::'
synsetId: 01388519-n
simpleMeaning: A living thing inside which a creature that feeds off it makes its young by mating.
scope: This is not the creature that lives off another living thing, and not a living thing where young
  are made without mating.
examples:
- The cat is the definitive host of the worm, since the worm has its young by mating inside it.
- They traced the illness to the definitive host, the animal in which the creature makes its young by
  mating.
