simpleMeaning: A highly poisonous protein found in castor beans. It is used in chemical research and has
  been used as a biological weapon.
scope: 'Also called ricin toxin: a poisonous protein taken from castor beans and used to test chemicals,
  not a poison made in a lab.'
examples:
- One milligram of ricin can kill an adult.
- Ricin was used as a weapon that spreads sickness.
