senseId: 'universal_time%1:28:00::'
synsetId: 15155157-n
simpleMeaning: Wherever you are, this is the time on the line through Greenwich in England that marks
  nought degrees.
scope: Also called UT, GMT, Greenwich Mean Time, Greenwich Time, and UT1, this is the local reading at
  the 0 meridian, not the reading on a clock in any other place.
examples:
- They set the ship's clocks by universal time before leaving port.
- The message gave the hour in universal time, so every station read the same time.
