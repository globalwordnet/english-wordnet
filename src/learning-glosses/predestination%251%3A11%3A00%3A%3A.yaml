simpleMeaning: A fixing of what will happen beforehand, as though fate had already settled it.
scope: It is about fate settling what is to come, not about God foreordaining every event.
examples:
- Their predestination seemed fixed by fate, not by choice.
- The novel treats predestination as a force no one can escape.
