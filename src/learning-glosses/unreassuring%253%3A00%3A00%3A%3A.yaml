senseId: 'unreassuring%3:00:00::'
synsetId: 00199039-a
simpleMeaning: Said of a thing that does not calm a person, and tends to make them worry.
scope: Also called worrisome. It is a word for a thing or a manner, not for a feeling itself.
examples:
- The unreassuring news made the family worry through the night.
- The unreassuring tone of the speaker left the room uneasy.
