simpleMeaning: Water, a compound normally clear, colorless, odorless, and tasteless as a liquid. At standard
  pressure it freezes at 0°C and boils at 100°C. It dissolves many substances.
scope: H2O is the chemical formula for water, including ice, liquid water, and water vapor.
examples:
- H2O is the chemical formula for water.
- The bottle was full of H2O.
