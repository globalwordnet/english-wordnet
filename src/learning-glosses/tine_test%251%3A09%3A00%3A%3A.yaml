simpleMeaning: A tuberculosis skin test using a disk with tuberculin-coated prongs. A firm red patch suggests
  past or present exposure to tuberculosis bacteria and calls for further testing.
scope: For a skin test showing past or present brush with tubercle germs, a hard red patch calling for
  more tests.
examples:
- A tine test pricked the skin.
- Tine tests show past brush with germs.
