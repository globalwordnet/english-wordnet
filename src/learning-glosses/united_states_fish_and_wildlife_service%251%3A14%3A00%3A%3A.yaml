simpleMeaning: An Interior Department agency protecting fish, wildlife, and habitats. It studies environmental
  effects of pesticides, nuclear power sites, hydroelectric dams, and waste heat.
scope: A body in the Department of the Interior that guards water animals, wild animals and their homes,
  also called FWS and US Fish and Wildlife Service.
examples:
- The United States Fish and Wildlife Service guards water animals and wild animals.
- The United States Fish and Wildlife Service weighs the harm of farm sprays on wild animals.
