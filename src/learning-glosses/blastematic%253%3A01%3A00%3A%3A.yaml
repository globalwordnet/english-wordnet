simpleMeaning: Relating to a mass of cells that have yet to specialize and can develop into an organ or
  other body part.
scope: Also called blastemal and blastemic. It is about cells.
examples:
- The blastematic cells had not yet formed into a limb.
- Doctors studied the blastematic mass under the microscope.
