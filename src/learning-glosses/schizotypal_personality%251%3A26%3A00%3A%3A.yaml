simpleMeaning: A way of thinking and acting with signs like those of schizophrenia, a serious illness
  of the mind, but weaker.
scope: This way of thinking and acting shows signs like those of schizophrenia, only weaker, also called
  schizoid, and it is not schizophrenia itself.
examples:
- Schizotypal personality shows signs like those of schizophrenia, only weaker.
- With schizotypal personality, the signs are like those of schizophrenia, only weaker.
