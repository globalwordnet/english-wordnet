simpleMeaning: The act of packing goods together so they can be moved as a standard load.
scope: Also called unitization. It is not the joining of oil fields, and it is not the grouping of ideas
  in the mind.
examples:
- The unitisation of the cargo took a full day at the port.
- Unitisation lets workers move many boxes at once.
