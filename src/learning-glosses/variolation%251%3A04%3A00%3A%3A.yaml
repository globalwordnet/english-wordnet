simpleMeaning: An obsolete and dangerous practice that deliberately exposed people to smallpox in hopes
  of protecting them against future illness.
scope: 'Another name for variolization: an old, no-longer-used way to guard against smallpox, not a modern
  shot and not a cure for smallpox.'
examples:
- Doctors once used variolation to protect people from smallpox.
- Variolation was an early way to give protection against smallpox.
