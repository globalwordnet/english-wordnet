synsetId: 01910928-n
simpleMeaning: A biological family of animals such as jellyfish, corals, or sea anemones that have stinging
  cells.
scope: A group of soft-bodied sea animals with stinging arms, all of one kind; not a single animal of
  the group, and not other groups of sea animals.
examples:
- Scientists place jellyfish in the coelenterate family.
- The coelenterate family covers many soft-bodied sea animals.
