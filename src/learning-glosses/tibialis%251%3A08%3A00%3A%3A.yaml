senseId: 'tibialis%1:08:00::'
synsetId: 05599011-n
simpleMeaning: Each leg has two muscles that start at the shinbone, and either one moves the foot.
scope: This is also called musculus tibialis or a tibialis muscle, one of a pair in each leg, for the
  foot, not the hand.
examples:
- They felt the tibialis in their leg work as they moved the foot.
- They lifted the foot, and the tibialis in their leg pulled tight.
