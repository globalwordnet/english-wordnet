simpleMeaning: The money paid by an insurance company for a life policy if it is ended before the person
  whose life it covers dies.
scope: It is about life insurance, not about the money paid when the person dies.
examples:
- The cash surrender value of their policy was enough to pay off their debts.
- They took the cash surrender value when they ended the policy early.
