simpleMeaning: A sum of money paid once, usually to the county, when someone asks for land to be put in
  a new zone.
scope: Also called rezoning fee. It is a sum of money.
examples:
- They paid the zoning change fee before the hearing.
- The zoning change fee had to be paid before the board would hear the case.
