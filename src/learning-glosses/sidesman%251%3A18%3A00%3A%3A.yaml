simpleMeaning: A male helper in the Church of England takes in gifts of money in the church for the churchwarden,
  the person who looks after the church.
scope: In the Church of England, this male helper takes in gifts of money in church, while a sideswoman
  does the same work as a woman.
examples:
- The sidesman collected the offerings of money in the church.
- A new sidesman was asked to help the churchwarden.
