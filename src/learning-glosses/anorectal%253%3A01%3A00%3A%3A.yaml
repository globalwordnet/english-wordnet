simpleMeaning: Said of something to do with the anus and the rectum taken together.
scope: This word is used of the two parts at the end of the bowel, taken as one, not of either part on
  its own.
examples:
- The doctor ordered an anorectal exam to check both parts at once.
- Pain in the anorectal area can make sitting hard for a while.
