senseId: 'severable_contract%1:10:00::'
synsetId: 06536543-n
simpleMeaning: A written deal that can still count as a set of separate deals joined in one paper, even
  when one side breaks it.
scope: It is about a written deal.
examples:
- If one side breaks the severable contract, the rest can still stand.
- The lawyer said the severable contract could be read as several deals.
