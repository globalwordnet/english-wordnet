simpleMeaning: A family of related Fulani languages of West Africa, the best known of the region, used
  as a shared tongue across the Sahel from Senegal to Chad.
scope: Also called Fula or Fulani. People with different first languages use it to communicate.
examples:
- Peul is spoken across West Africa from Senegal to Chad.
- She learned Peul because it is widely used in the region.
