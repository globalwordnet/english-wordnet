senseId: 'transexual%1:18:00::'
synsetId: 10745370-n
simpleMeaning: An older term, still used by some people for themselves, for a person whose gender identity
  differs from the sex assigned to them at birth.
scope: This person is also called a transsexual, not someone whose identification is only partly with
  the opposite sex.
examples:
- They told their friends they were a transexual because they felt in every way they were of the opposite
  sex.
- As a transexual, they lived as a person of the opposite sex.
