senseId: 'anti-dumping_duty%1:21:00::'
synsetId: 13338781-n
simpleMeaning: A tax charged on goods coming in from abroad, meant to stop them being sold at unfairly
  low prices.
scope: This charge falls on goods from abroad sold at unfairly low prices, not on goods in general.
examples:
- The government put an anti-dumping duty on cheap steel from abroad.
- The new anti-dumping duty raised the price of the imported panels.
