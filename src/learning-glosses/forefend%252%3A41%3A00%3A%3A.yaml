simpleMeaning: To keep anything unwanted away, stopping it before it happens.
scope: Also called avoid, avert, deflect, obviate, debar, fend off, forfend, head off, stave off, or ward
  off; this one is about an act.
examples:
- They forefended trouble by checking the ropes before the climb.
- A fence forefends the garden from deer.
