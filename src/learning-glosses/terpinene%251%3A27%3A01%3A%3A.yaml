simpleMeaning: All of one chemical family, these chemicals are made only of hydrogen and carbon, with
  the same parts put together in different ways.
scope: This is one of a group of chemicals of one family, not a chemical made of other things.
examples:
- They found terpinene among the chemicals made only of hydrogen and carbon.
- One terpinene differs from another only in how its parts are put together.
