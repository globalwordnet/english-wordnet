simpleMeaning: A thing or a state of affairs that changes suddenly and sharply, moving above all between
  high and low points.
scope: It is a figure of speech, not the ride with steep drops in a fairground.
examples:
- The economy has been on a roller coaster all year.
- The share price has been on a roller coaster all month.
