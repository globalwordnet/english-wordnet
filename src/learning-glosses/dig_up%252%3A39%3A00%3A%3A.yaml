simpleMeaning: To loosen the ground around a thing and lift it out, for use or for keeping.
scope: Also called dig and dig out, this is not about putting a thing into the ground.
examples:
- The workers dug up the old pipes and carried them away.
- The miners dug up coal from the old pit.
