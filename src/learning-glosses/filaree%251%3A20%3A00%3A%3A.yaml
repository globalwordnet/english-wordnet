simpleMeaning: European weed established in the southwestern US and Mexico, with reddish trailing stems,
  small fernlike leaves, small deep reddish-lavender flowers, then slender upright fruits. Often grown
  for animal feed.
scope: This is the low forage weed also called pin grass, not the similar musk clover and not a garden
  geranium.
examples:
- Filaree came up first in the burned pasture.
- Cattle grazed the filaree on the hillside all spring.
