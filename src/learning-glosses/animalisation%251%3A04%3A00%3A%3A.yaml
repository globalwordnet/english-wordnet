senseId: 'animalisation%1:04:00::'
synsetId: 00272723-n
simpleMeaning: An act that turns people cruel or takes away the qualities that make them human.
scope: This is not a trait people are born with but an act that changes them, also called animalization,
  brutalisation, or brutalization.
examples:
- The animalisation of the prisoners turned them cruel and cold.
- The guards' animalisation of the prisoners left them without pity for anyone.
