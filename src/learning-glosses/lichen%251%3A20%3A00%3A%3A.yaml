simpleMeaning: A fungus living together with an alga or a photosynthetic bacterium, often forming crusty
  patches or branching tufts on bark, rocks, or bare ground.
scope: This sense describes the organism that grows on surfaces outdoors.
examples:
- Lichen covered the old stone wall in grey-green patches.
- The lichen on the tree trunk felt dry and crusty to the touch.
