simpleMeaning: A move made to hide what is really happening and to leave people unsure of the truth.
scope: Also called smoke screen. It is a noun.
examples:
- Requesting new powers of surveillance is just a smokescreen to hide their failures.
- The promise was a smokescreen to cover the delay.
