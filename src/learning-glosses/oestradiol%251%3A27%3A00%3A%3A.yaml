simpleMeaning: The most potent of the body’s main estrogens. Manufactured oestradiol treats estrogen deficiency
  and has occasionally been used for advanced breast cancer.
scope: Oestradiol is another spelling of estradiol. Its occasional use for advanced breast cancer is a
  specialist treatment.
examples:
- A low level of the hormone was treated with oestradiol.
- The laboratory measured the amount of oestradiol in her blood.
