senseId: 'chromosomal_aberration%1:26:00::'
synsetId: 14527705-n
simpleMeaning: Any change in the usual shape or number of chromosomes, which often leads to bodily or
  mental differences.
scope: It is also called chromosomal abnormality, chromosomal anomaly, and chromosomal disorder. It is
  a medical matter.
examples:
- The test found a chromosomal aberration in the baby.
- A chromosomal aberration can change how a child grows.
