simpleMeaning: Said of something that looks like a ghost, or has the feel of one.
scope: Also called ghostly, spiritual, spectral, ghostlike, and phantasmal, this one is about looking
  like a ghost, not about being one.
examples:
- An apparitional face seemed to watch them from the dark window.
- The apparitional figure drifted across the stage without a sound.
