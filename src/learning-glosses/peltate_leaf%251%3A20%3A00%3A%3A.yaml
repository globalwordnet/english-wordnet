simpleMeaning: A shield-shaped leaf like that of a nasturtium, with the stalk attached to the underside
  away from the edge.
scope: A plant part shaped like a shield, not a long thin plant part and not a part shaped like a needle.
examples:
- The peltate leaf of the nasturtium is shaped like a shield.
- The peltate leaf in the pot was shaped like a shield.
