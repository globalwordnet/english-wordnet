senseId: 'spina_bifida%1:26:00::'
synsetId: 14494808-n
simpleMeaning: A relatively common birth condition in which spinal bones form incompletely. Symptoms may
  be mild unless several bones or the spinal cord are involved. Amniotic fluid testing can aid diagnosis.
scope: This sense is also called rachischisis and schistorrhachis.
examples:
- Spina bifida is a birth flaw.
- A spina bifida was found by testing womb fluid.
