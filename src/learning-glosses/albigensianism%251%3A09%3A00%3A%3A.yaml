simpleMeaning: A twelfth- and thirteenth-century southern French Christian movement thought to descend
  from Manichaeism. It taught that good and evil were opposing powers. The Inquisition destroyed it as
  heretical.
scope: Not Manichaeism itself, nor other medieval Christian movements; also called Catharism.
examples:
- Albigensianism spread in southern France.
- The Inquisition wiped out Albigensianism.
