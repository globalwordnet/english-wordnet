simpleMeaning: Temporary protection from disease through antibodies received from another source, such
  as a mother's antibodies passing through the placenta or antibodies given by injection.
scope: 'In medicine: short-lived defence won through the afterbirth or by antiserum shots.'
examples:
- Passive immunity lasts a short time.
- Passive immunity comes through the placenta.
