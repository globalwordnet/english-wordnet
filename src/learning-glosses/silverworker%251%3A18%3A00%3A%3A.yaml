simpleMeaning: Someone who makes or repairs objects made of silver.
scope: A maker and mender of things in that pale grey-white metal, also called silver-worker and silversmith;
  not a person who only sells such things and not a worker in gold.
examples:
- The silverworker mended the broken cup.
- A silverworker in the town made the fine chain.
