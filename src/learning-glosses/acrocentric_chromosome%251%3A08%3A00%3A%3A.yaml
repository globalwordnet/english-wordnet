simpleMeaning: A chromosome whose centromere lies near one end, dividing it into one short arm and one
  long arm.
scope: This one is not one whose middle part sits in the middle.
examples:
- The acrocentric chromosome in the slide has one arm much shorter than the other.
- They found an acrocentric chromosome with its middle part close to one end.
