simpleMeaning: A tall rainforest tree that keeps its leaves year-round and has a broad crown and yellowish-white
  flowers. People grow it for decoration in parks and large gardens.
scope: This is a tall rain-forest tree with a wide-spreading top, not a small garden tree and not a tree
  of dry lands.
examples:
- Parkia javanica grows tall in the rain forest.
- Parkia javanica is grown for show in big gardens.
