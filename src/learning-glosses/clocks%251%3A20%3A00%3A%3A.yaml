simpleMeaning: European weed naturalized in the southwestern US and Mexico, with reddish trailing stems,
  small fernlike leaves, small deep reddish-lavender flowers, and slender upright fruits. Often grown
  for livestock feed.
scope: This is the low forage weed, not the timepieces spelled the same way and not the similar musk clover.
examples:
- Clocks had spread across the disturbed ground behind the barn.
- A patch of clocks grew beside the track, their seed pods standing upright.
