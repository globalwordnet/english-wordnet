simpleMeaning: A statistic measuring how closely two rankings agree, without assuming a particular distribution
  for the data.
scope: Also called Kendall's tau and Kendall rank correlation. It is a count used with ranks.
examples:
- The tau coefficient of correlation was 0.8 for the two lists.
- They used the tau coefficient of correlation to match the two rankings.
