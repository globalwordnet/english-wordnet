simpleMeaning: A person whose work is to look after woody plants with a trunk and branches that are sick
  or hurt.
scope: Arborist is another name for it. It is not a doctor who treats people.
examples:
- The tree surgeon came to look at the old oak in our garden.
- We called a tree surgeon when the big branch broke off.
