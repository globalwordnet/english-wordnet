senseId: 'sporozoan%1:05:00::'
synsetId: 01424448-n
simpleMeaning: A tiny one-celled living thing that lives on or in another living thing, taking food from
  it, and makes tiny cells able to grow into new living things.
scope: This word names the small living thing that feeds on another living thing, not the living thing
  it feeds on.
examples:
- The sporozoan lived inside its host and fed on it.
- Tiny cells that can grow into new living things are made by a sporozoan.
