simpleMeaning: Said of pictures made of two images in different colours, seen as one deep picture through
  coloured glasses, and of making them.
scope: Also called anaglyphic, anaglyphical and anaglyptical. It is used to describe things.
examples:
- The anaglyptic print came alive when we put on the coloured glasses.
- They hung an anaglyptic picture in the hall for visitors to try.
