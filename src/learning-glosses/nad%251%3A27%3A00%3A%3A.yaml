simpleMeaning: A helper molecule found in most living cells and made from the B vitamin nicotinic acid.
  It carries electrons between reactions that break down food or build substances.
scope: Not NADP or FAD; also called nicotinamide adenine dinucleotide.
examples:
- NAD helps cells turn food into energy.
- NAD is found in most living cells.
