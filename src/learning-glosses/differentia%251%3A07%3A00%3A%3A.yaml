simpleMeaning: The marks that set things apart from one another, above all the marks that set apart kinds
  of living things that belong to one group.
scope: This is a quality that a kind can have.
examples:
- The differentia of the two kinds lay in the shape of their leaves.
- To tell the kinds apart, the book lists the differentia of each one.
