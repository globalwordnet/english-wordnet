simpleMeaning: A typewriter-like printer connected to a telegraph that prints incoming messages one character
  at a time.
scope: This is also called a teleprinter, a teletype machine, telex, or a telex machine.
examples:
- They typed the message on the teletypewriter and sent it down the wire.
- They kept a teletypewriter for messages from far away.
