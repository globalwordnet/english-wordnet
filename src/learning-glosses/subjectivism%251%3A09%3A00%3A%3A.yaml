simpleMeaning: The philosophical view that what people can know or value depends on their own experiences.
scope: This is the philosophy doctrine that knowledge and value rest only on personal experience, not
  the mere quality of judging by one's own feelings.
examples:
- They argued for subjectivism in the debate.
- The lecture set out subjectivism as a view of knowledge and value.
