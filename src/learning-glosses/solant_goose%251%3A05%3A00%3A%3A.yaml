simpleMeaning: A white bird of the sea, a gannet, very big, with black on the ends of its wings.
scope: Also called solan and solan goose, and by its Latin name Sula bassana. It is a sea bird.
examples:
- A solant goose flew over the cliffs with its black-tipped wings spread wide.
- We watched a solant goose dive into the sea for fish.
