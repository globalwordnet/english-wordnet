simpleMeaning: The quality of things that stay unclear, with nothing fixed.
scope: Also called indeterminacy, indefiniteness, indefinity, and indetermination.
examples:
- The indeterminateness of the wording left two readings open.
- Such indeterminateness makes the rule hard to follow.
