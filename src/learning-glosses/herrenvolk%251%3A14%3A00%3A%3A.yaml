simpleMeaning: A group of people who believe their race is superior to all others and that they have the
  right to rule them.
scope: 'Also called master race: a people who hold themselves better than all others and fit to rule them,
  not a nation that merely takes pride in itself.'
examples:
- The pamphlet praised the Herrenvolk as born to rule over other peoples.
- He warned that the idea of a Herrenvolk had led to terrible harm.
