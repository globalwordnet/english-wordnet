senseId: 'chimeral%3:01:00::'
synsetId: 02704984-a
simpleMeaning: Said of a thing that is a chimera, a made-up creature with parts of different animals,
  or like one, or has to do with one.
scope: Also called chimeric and chimerical. It is an adjective.
examples:
- The chimeral beast in the story had a lion's head and a snake's tail.
- Their chimeral design joined parts of old and new styles.
