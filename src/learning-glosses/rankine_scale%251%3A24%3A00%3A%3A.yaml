senseId: 'rankine_scale%1:24:00::'
synsetId: 13875395-n
simpleMeaning: A temperature scale starting at absolute zero, with degrees the size of Fahrenheit degrees.
  Water freezes at 491.69 degrees and boils at 671.69 degrees.
scope: A way of measuring true heat in Fahrenheit steps; not the common Fahrenheit scale and not the Celsius
  scale.
examples:
- On the Rankine scale, water freezes at 491.69 degrees.
- The Rankine scale measures true heat in Fahrenheit steps.
