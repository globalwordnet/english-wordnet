simpleMeaning: A pressurized-water reactor uses water to cool its core and slow neutrons. Heat from the
  reactor produces steam that can drive a turbine.
scope: This is a kind of nuclear reactor that uses water to cool it and to keep the reaction going; pressurized
  water reactor is another name for this sense, and it is one of the nuclear reactors, close to the boiling
  water reactor and the gas-cooled reactor.
examples:
- A PWR uses water to cool it and to keep the reaction going.
- The steam from a PWR can turn a turbine.
