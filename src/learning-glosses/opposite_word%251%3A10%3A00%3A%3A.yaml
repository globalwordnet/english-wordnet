simpleMeaning: A term meaning the direct contrary of what another term means; the pair are antonyms of
  each other.
scope: Also called opposite or an antonym. It is a noun.
examples:
- In the test, they had to give the opposite word of 'hot'.
- The teacher asked for the opposite word of 'rich', and they said 'poor'.
