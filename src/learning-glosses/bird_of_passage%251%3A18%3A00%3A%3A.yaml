simpleMeaning: This person moves from place to place and never settles.
scope: Also called a wanderer, a roamer, and a rover, this one is about the person, not the animal.
examples:
- They were a bird of passage, never staying in one town for long.
- A bird of passage drifts from town to town, with no home to go back to.
