simpleMeaning: Soil left behind after its soluble components have dissolved.
scope: This is earth left behind when the parts that can come apart in water have gone, also called residual
  soil.
examples:
- They dug down and found residual clay below the topsoil.
- Tests showed the residual clay held almost no parts that could dissolve.
