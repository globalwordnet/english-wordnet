simpleMeaning: Said of a thing that has to do with the jointed feelers on the head, used for sensing.
scope: Also called antennary. It is about the feelers, not the head itself.
examples:
- The antennal senses of insects help them find food.
- The scientist studied the antennal organs of the ant.
