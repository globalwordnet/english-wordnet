simpleMeaning: A fit in which the person loses consciousness and the whole body shakes violently.
scope: This one is also called generalized seizure and grand mal, and it is about one fit, not the illness
  as a whole.
examples:
- The epilepsia major left the patient unconscious on the floor.
- Doctors watched for signs of epilepsia major after the first fit.
