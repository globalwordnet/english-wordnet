simpleMeaning: This foot of a bird has its first and fourth toes pointing back, while the second and third
  point forward.
scope: This one belongs to a bird, not to a mammal.
examples:
- The zygodactyl foot grips the branch with two toes back and two forward.
- Each zygodactyl foot of the parrot has two toes pointing back.
