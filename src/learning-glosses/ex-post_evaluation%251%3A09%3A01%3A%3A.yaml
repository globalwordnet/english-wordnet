simpleMeaning: A summing-up judgement of a plan or scheme, made once the work on it is done.
scope: This one is about a judgement.
examples:
- This ex post evaluation of exceptional access under the 2010 stand-by arrangement on Greece was prepared
  by a staff team of the International Monetary Fund.
- They ordered an ex-post evaluation of the school meals scheme once it had run for a year.
