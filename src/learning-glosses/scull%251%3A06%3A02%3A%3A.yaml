simpleMeaning: At the back of a boat, one long oar works the boat forward as it sweeps from side to side.
scope: One long oar at the back of a boat goes by this name, and it is not the racing boat itself and
  not the act of rowing.
examples:
- He worked the scull at the back of the boat to move it forward.
- The scull swung from side to side as the boat moved ahead.
