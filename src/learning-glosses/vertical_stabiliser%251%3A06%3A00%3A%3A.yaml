simpleMeaning: The tail of a plane has an upright part that holds the plane steady as it flies.
scope: Also called a tail fin, a tailfin, a vertical fin, and a vertical stabilizer, this is the name
  for the upright piece at the back of a plane, not the flat piece there.
examples:
- Without its vertical stabiliser, the plane could not hold a straight course.
- The vertical stabiliser held the plane steady as it climbed.
