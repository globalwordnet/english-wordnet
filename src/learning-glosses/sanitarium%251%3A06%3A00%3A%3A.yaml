simpleMeaning: A hospital where sick people go to get their strength back, or to have care for an illness
  that lasts a long time.
scope: Also called sanatorium and sanatarium. It is a hospital.
examples:
- They went to a sanitarium to get better after an illness.
- They visited a friend at the sanitarium every Sunday.
