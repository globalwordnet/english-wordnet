simpleMeaning: A hormone made by the outer part of the adrenal glands that helps regulate how the body
  uses carbohydrates and proteins. Its medical brands include Hydrocortone and Cortef.
scope: Cortisol is another name for this body chemical, made in the glands above the kidneys.
examples:
- They measured the hydrocortisone in her blood.
- The glands above her kidneys make hydrocortisone.
