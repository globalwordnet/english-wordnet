simpleMeaning: Pictures of things at rest or in motion reach watchers far away.
scope: This is also called television, video, or TV, and it is the act of sending pictures out, not a
  set that shows them.
examples:
- The station is telecasting pictures of the parade for people far away.
- They watch the pictures the station is telecasting of still and moving things.
