simpleMeaning: A member of the US Navy's women's reserve, organized during World War II and later integrated
  into the regular Navy.
scope: This is a woman in the sea force of America kept in reserve, not a man in the navy or a woman in
  the reserve of another service.
examples:
- She joined the Wave during the war.
- The Wave served in the navy reserve.
