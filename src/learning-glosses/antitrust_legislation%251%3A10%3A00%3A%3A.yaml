simpleMeaning: A set of rules that keeps the market open to all by banning control of a whole market by
  one company.
scope: This one is also called antitrust law.
examples:
- The antitrust legislation stopped the merger that would have left one company in charge.
- They welcomed the new antitrust legislation as a guard against single-company control.
