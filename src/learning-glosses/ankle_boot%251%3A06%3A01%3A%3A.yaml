simpleMeaning: A boot that comes up to the joint between the foot and the leg, or just above it.
scope: This is not one that stops below the joint between the foot and the leg.
examples:
- The hiker laced up the ankle boots before heading out into the snow.
- For the muddy walk, they wore ankle boots that came up just above the joint.
