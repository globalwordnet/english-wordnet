simpleMeaning: A green colour, or a pigment of that colour, like the colour of growing grass.
scope: Also called green and greenness. It is a colour, not a plant.
examples:
- The viridity of the lawn pleased the gardener.
- The viridity of the new leaves stood out in the spring sun.
