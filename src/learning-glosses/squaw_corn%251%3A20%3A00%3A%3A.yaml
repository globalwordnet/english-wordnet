simpleMeaning: A kind of maize in which nearly the whole of each grain is soft starch.
scope: Also called flour corn, soft corn, and Zea mays amylacea. It is a kind of maize.
examples:
- The squaw corn kernels were soft and starchy when ground.
- They milled the squaw corn into soft flour.
