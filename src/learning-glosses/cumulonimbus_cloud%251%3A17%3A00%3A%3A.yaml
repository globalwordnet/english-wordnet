simpleMeaning: A tall, dark cloud that builds up an electric charge and is associated with thunderstorms.
scope: This is a tall dark storm cloud full of electric charge; thundercloud and cumulonimbus are other
  names for this sense.
examples:
- The cumulonimbus cloud darkened the whole sky.
- A cumulonimbus cloud formed before the storm.
