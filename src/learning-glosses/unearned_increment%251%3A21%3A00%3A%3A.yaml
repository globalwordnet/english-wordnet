senseId: 'unearned_increment%1:21:00::'
synsetId: 13332701-n
simpleMeaning: A rise in what a piece of property is worth, that no one worked for, coming only from the
  way the market as a whole moves.
scope: It is a kind of rise in value.
examples:
- The unearned increment on the old house paid for their retirement.
- The city taxed the unearned increment when the land was sold.
