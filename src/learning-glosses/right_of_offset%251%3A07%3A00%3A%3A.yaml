simpleMeaning: 'In banking, what the law lets a bank do when a loan is not paid: take money the borrower
  has put in the bank to cover what is owed'
scope: In banking, this is the bank's power to seize a borrower's deposit when a loan is in default.
examples:
- The bank used its right of offset to take the money in the savings account.
- Under the right of offset, the bank kept the deposit to cover the unpaid loan.
