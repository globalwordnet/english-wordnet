senseId: cross-sectional%5:00:00:crosswise:00
synsetId: 01449131-s
simpleMeaning: Showing a thing as it looks inside, after a cut through it from one edge to the other,
  with the cut made square to the length of the thing.
scope: Cross-section is another name for this sense.
examples:
- The doctor looked at a cross-sectional view of the patient's neck.
- The engineer studied a cross-sectional plan of the bridge.
