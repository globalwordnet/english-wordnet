simpleMeaning: An operation in which military forces keep the peace, especially when international troops
  enforce a truce between hostile groups or nations.
scope: Also called peacekeeping or peacekeeping mission. It is an activity.
examples:
- They took part in a peacekeeping operation abroad.
- The peacekeeping operation kept the truce in place.
