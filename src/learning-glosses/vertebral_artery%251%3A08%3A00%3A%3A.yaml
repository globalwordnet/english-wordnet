simpleMeaning: An artery that usually branches first from the artery beneath the collarbone. Its course
  is described in four sections.
scope: Also called arteria vertebralis, this names the first tube off the large vessel under the collar
  bone that carries blood away from the heart, not a later branch of that vessel.
examples:
- The scan showed the vertebral artery splitting into four parts.
- The surgeon traced the vertebral artery back to the large vessel under the collar bone.
