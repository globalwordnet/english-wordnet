simpleMeaning: An upright fin at the back of a plane keeps it steady in the air.
scope: This is also called a tail fin, a vertical fin, a vertical stabiliser, or a vertical stabilizer,
  and it is not one of the decorations that stick up above the back wheels of a car.
examples:
- The tailfin helped the plane hold a straight course.
- Mechanics checked the tailfin for cracks after the flight.
