simpleMeaning: A rectangular bag for carrying clothes on a trip.
scope: Also called a bag, a grip, a suitcase, and a traveling bag, this is what a person packs clothes
  in to carry along, not a trunk that stays in one place.
examples:
- They packed clothes into the travelling bag before leaving.
- They carried the travelling bag with them on the trip.
