simpleMeaning: The change of a plain sound made by stopping the air into one made by stopping the air
  and then letting it out slowly.
scope: This one is not the sound that comes out of it.
examples:
- In some words, affrication turns the 't' sound into a 'ch' sound.
- The teacher showed how affrication works with the sound at the start of 'chair'.
