simpleMeaning: In ancient Rome, a religious official who read signs of what was to come, to help guide
  the decisions of the state.
scope: Also called an augur, this one is about a religious office in ancient Rome.
examples:
- The auspex studied the flight of birds before the senate voted.
- Before the new law was passed, the auspex was asked to read the omens.
