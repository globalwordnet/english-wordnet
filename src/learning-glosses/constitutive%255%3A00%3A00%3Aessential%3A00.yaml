senseId: constitutive%5:00:00:essential:00
synsetId: 00904519-s
simpleMeaning: Said of a feature that belongs to the basic make-up of a thing, above all to the make-up
  of a body.
scope: Also called constituent. Another name for it is constitutional. It is about a thing.
examples:
- Good food is a constitutive part of a healthy body.
- Trust is a constitutive part of their friendship.
