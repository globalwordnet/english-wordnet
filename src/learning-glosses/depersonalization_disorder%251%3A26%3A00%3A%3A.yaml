senseId: 'depersonalization_disorder%1:26:00::'
synsetId: 14417499-n
simpleMeaning: A disorder in which a person repeatedly feels detached from their own thoughts, feelings,
  or body, as though watching themself from outside.
scope: A mind sickness in which a person loses touch with their own real self and feels strange and unreal,
  also called depersonalisation, depersonalisation disorder, depersonalisation neurosis, depersonalization,
  depersonalization neurosis; not ordinary daydreaming and not the feeling of being a nameless part of
  a big machine.
examples:
- Depersonalization disorder made her feel unreal, as if she were watching herself.
- He sought help for depersonalization disorder after months of feeling strange.
