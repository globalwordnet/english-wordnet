simpleMeaning: A US Interior Department agency that protects fish, wildlife, and habitats and assesses
  environmental effects of pesticides, nuclear power sites, hydroelectric dams, and heated wastewater.
scope: A body in the Department of the Interior that guards water animals, wild animals and their homes,
  also called FWS and United States Fish and Wildlife Service.
examples:
- The US Fish and Wildlife Service guards water animals and wild animals.
- The US Fish and Wildlife Service weighs the harm of farm sprays on wild animals.
