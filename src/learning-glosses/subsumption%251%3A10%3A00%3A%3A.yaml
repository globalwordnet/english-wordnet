senseId: 'subsumption%1:10:00::'
synsetId: 06767126-n
simpleMeaning: In logic, the premise of a syllogism that contains the term used as the subject of its
  conclusion.
scope: The starting statement of a three-part argument in logic, holding the smaller term that the ending
  is about.
examples:
- In the subsumption, the smaller term was the one the ending spoke about.
- They pointed to the subsumption as the starting statement that held the smaller term.
