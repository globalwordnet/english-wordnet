simpleMeaning: An ancient Indian language used in the Vedas and other Hindu texts. India recognizes it
  constitutionally. It remains in religious, scholarly, and limited everyday use.
scope: In Hinduism, an old tongue of India, the tongue of the Vedas and of Hinduism, still an official
  tongue of India though now used only for religion; Sanskrit and Sanskrit language are other names for
  this sense, and it is set apart from other tongues of India by its use in the Vedas and for religion.
examples:
- Sanskritic language is the old tongue of the Vedas.
- Sanskritic language is still used in worship in India.
