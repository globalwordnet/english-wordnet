simpleMeaning: Something odd or uncommon about a thing, by which it can be told from others.
scope: Also called peculiarity and distinctive feature. This one is about a quality.
examples:
- The long neck is a distinguishing characteristic of the giraffe.
- A distinguishing characteristic of this plant is the smell of its leaves.
