senseId: 'symbolic_representation%1:09:00::'
synsetId: 05773412-n
simpleMeaning: A visible object or image that stands for an idea through association or shared convention.
scope: The word here names the seen thing that does the standing-for, also called symbol, symbolisation,
  or symbolization.
examples:
- The eagle is a symbolic representation of the United States.
- The teacher pointed to the symbolic representation and asked what it meant.
