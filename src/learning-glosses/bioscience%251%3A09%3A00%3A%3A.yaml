simpleMeaning: any study of nature that covers how living things are built and how they act
scope: This one names a study of nature, and its partner life science names the same study of nature.
examples:
- Their work in bioscience looks at how bees are built and how they act.
- A course in bioscience shows how frogs are built and how they act.
