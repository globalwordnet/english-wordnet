simpleMeaning: A kind of speech built from word parts, in which one small part of a word can carry several
  bits of meaning at once.
scope: This one is about a kind of speech.
examples:
- In a fusional language, a single ending can show tense and person at once.
- Latin is often given as a fusional language, since its word endings carry several meanings.
