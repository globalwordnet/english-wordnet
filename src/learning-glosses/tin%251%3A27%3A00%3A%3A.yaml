simpleMeaning: A shiny, silvery metal that bends easily and resists corrosion, used in alloys and protective
  metal coatings. Its main source is cassiterite, which contains tin oxide.
scope: This is a silver-grey metal that can be hammered flat and does not rust, also called atomic number
  50 and Sn, not a can for food and not a thin sheet.
examples:
- Tin does not rust.
- They coated the pan with tin.
