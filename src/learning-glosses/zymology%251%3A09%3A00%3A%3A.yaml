simpleMeaning: The branch of chemistry that studies fermentation, including how yeast turns sugars into
  alcohol when making wine or brewing beer.
scope: This is the study of fermentation, also called zymurgy; not the making of wine itself and not the
  study of all chemistry.
examples:
- She took a course in zymology to learn how beer is brewed.
- His zymology book explains why wine turns sour if air gets in.
