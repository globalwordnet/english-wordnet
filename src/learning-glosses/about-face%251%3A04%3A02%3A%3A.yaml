simpleMeaning: Turning the body to the opposite side, above all in a line of soldiers.
scope: This one is also called about turn, and it is not a change of mind.
examples:
- On the command, the whole platoon did an about-face.
- The sergeant ordered an about-face, and the line turned as one.
