simpleMeaning: An electrical device that holds a lamp to provide light. In a traditional fixture, its
  body contains a socket for a replaceable bulb.
scope: Also called a light fitting or light fixture. A fixture can run on mains power or batteries.
examples:
- The luminaire lit the room.
- She changed the bulb in the luminaire.
