senseId: 'hydroxyl_radical%1:27:00::'
synsetId: 14938926-n
simpleMeaning: In older chemical usage, a group containing one oxygen and one hydrogen atom, attached
  to the rest of a molecule by a single bond.
scope: Here radical is an older term for a group of atoms. Modern chemists distinguish the attached hydroxyl
  group from the free hydroxyl radical.
examples:
- The old chemistry text called the OH group in alcohol a hydroxyl radical.
- Its diagram showed a hydroxyl radical attached to carbon by a single bond.
