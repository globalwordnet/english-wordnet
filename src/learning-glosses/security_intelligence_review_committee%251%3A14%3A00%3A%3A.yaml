simpleMeaning: A former Canadian oversight committee that reviewed the Canadian Security Intelligence
  Service, including its handling of private information in investigations of suspected spies and terrorists.
scope: This is a Canadian government body that watches the country's criminal spy services; SIRC is another
  name for it, and its nearest neighbours are Canada's other government watch bodies.
examples:
- The Security Intelligence Review Committee looked into the spy service's work.
- A complaint went to the Security Intelligence Review Committee.
