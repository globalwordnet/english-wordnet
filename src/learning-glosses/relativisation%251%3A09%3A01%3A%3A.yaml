simpleMeaning: The act of treating something as holding only in one setting and not on its own, or the
  result of doing so.
scope: Also called relativization. It is an act.
examples:
- The relativisation of time in Einstein's work still puzzles many readers.
- They argued about the relativisation of old rules.
