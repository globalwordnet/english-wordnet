simpleMeaning: The Bureau of Justice Statistics, the US Justice Department agency that serves as the main
  source of criminal justice statistics for federal and local policymakers.
scope: This is the Justice Department office that gives the main crime figures, also called the Bureau
  of Justice Statistics, not a court or a police force.
examples:
- The BJS released new crime figures for the year.
- Law makers turned to the BJS for crime figures.
