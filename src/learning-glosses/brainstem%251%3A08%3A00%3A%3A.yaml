simpleMeaning: The part of the brain that continues into the spinal cord and includes the medulla oblongata,
  pons, midbrain and parts of the hypothalamus.
scope: 'Also called brain-stem and brain stem: the part of the brain that joins the spinal cord, not the
  whole brain and not the spinal cord itself.'
examples:
- The brainstem is the lowest part of the brain.
- The brainstem joins the brain to the spinal cord.
