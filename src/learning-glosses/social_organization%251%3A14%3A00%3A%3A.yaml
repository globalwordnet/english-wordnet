simpleMeaning: All the people in a community, taken together as a single whole shaped by the set ways
  they relate to one another.
scope: Also called structure, social organisation, social structure, and social system. It is the people
  of a community.
examples:
- The social organization of the town rests on family ties and local clubs.
- A change in jobs can alter the social organization of a whole town.
