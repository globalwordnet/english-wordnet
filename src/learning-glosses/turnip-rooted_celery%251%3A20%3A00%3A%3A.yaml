simpleMeaning: People grow this kind of celery for the thick part under the ground, which they eat for
  its strong, pleasant smell.
scope: Also called celeriac, celery root, knob celery, root celery, and Apium graveolens rapaceum, this
  name is for a plant grown for its thick underground part, eaten for its strong, pleasant smell.
examples:
- They dug up the turnip-rooted celery to eat the thick root.
- They ate the thick root of the turnip-rooted celery for its strong smell.
