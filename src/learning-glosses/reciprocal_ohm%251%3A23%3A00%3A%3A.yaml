simpleMeaning: a unit that measures how well a material lets electric current pass, equal to one divided
  by the unit of resistance
scope: It is a unit of conductance, also called a mho, a siemens, or S.
examples:
- The conductance of the copper wire was three reciprocal ohms.
- The lab notes gave the result in reciprocal ohms.
