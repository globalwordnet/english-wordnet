simpleMeaning: A broad open stretch of ground covered by the crust that briny water leaves when it dries
  away.
scope: It is also called a salt flat, a wide open stretch of ground covered with the crust that briny
  water leaves behind.
examples:
- We walked across the salt plain and back.
- The salt plain stretched out as far as we could see.
