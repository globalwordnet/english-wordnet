simpleMeaning: Salmon cured in brine to taste less salty than most cured salmon. Sugar is sometimes added
  during curing.
scope: Also called Nova lox, Nova Scotia lox, Nova Scotia salmon, and Nova style salmon; a fish cured
  in salt water and less salty than most, not smoked salmon.
examples:
- Nova salmon is cured in salt water, and sugar is sometimes used too.
- We bought Nova salmon for the weekend brunch.
