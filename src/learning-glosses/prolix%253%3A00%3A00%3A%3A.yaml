senseId: 'prolix%3:00:00::'
synsetId: 00551001-a
simpleMeaning: Using tediously many words, or tending to speak or write at such length that the listener
  or reader tires.
scope: Also called verbal. It is not said of brief speech or writing.
examples:
- The prolix report went on for pages after it had made its point.
- They tried to stay awake through the prolix speech.
