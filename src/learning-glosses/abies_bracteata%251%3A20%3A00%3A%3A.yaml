simpleMeaning: A pyramid-shaped fir of southwestern California with sharp, pointed leaves and long spines
  on its cone scales.
scope: A pyramid-shaped cone tree of south-west California with spiny leaves; bristlecone fir, Abies venusta
  and Santa Lucia fir are other names for this sense, not the balsam fir of the north-east and not a fir
  with soft leaves.
examples:
- Abies bracteata grows on the dry hills of south-west California.
- The Abies bracteata leaves are spiny and pointed.
