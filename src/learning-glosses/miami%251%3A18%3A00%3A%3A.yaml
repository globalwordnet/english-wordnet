simpleMeaning: A member of an Algonquian people whose homelands include areas of northern Indiana and
  southern Michigan.
scope: This use identifies an individual by membership in the Miami people.
examples:
- The author, a Miami from Indiana, wrote about her community.
- As a Miami, he took particular interest in the history of his people.
