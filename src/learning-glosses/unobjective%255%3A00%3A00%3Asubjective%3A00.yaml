senseId: unobjective%5:00:00:subjective:00
synsetId: 01620502-s
simpleMeaning: Said of things like evidence, this means it rests on personal feeling and is hard to check.
scope: This is also called unverifiable, and it is used of evidence, not of facts.
examples:
- The judge set aside the unobjective account because it could not be checked.
- Their unobjective reading of the data favoured one side from the start.
