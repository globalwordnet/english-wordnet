senseId: self-contradictory%5:00:00:inexplicable:00
synsetId: 00943164-s
simpleMeaning: Containing statements or ideas that seem to contradict each other, even though they might
  be true.
scope: Also called paradoxical. It is an adjective.
examples:
- It is self-contradictory to say the plan saves money while spending more than before.
- The claim sounds self-contradictory, yet the figures back it up.
