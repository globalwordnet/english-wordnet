senseId: divisional%5:00:00:fractional:00
synsetId: 00518935-s
simpleMeaning: Making up a division, or a part of the main unit of money that fits into it a whole number
  of times.
scope: This one is also called fractional, and it is about a part of money, not about splitting things
  or a military group.
examples:
- The dime is a divisional coin, a small part of a dollar.
- The divisional coins in the drawer are parts of the main unit of money.
