simpleMeaning: A small perennial herb forming tufts in central and southern European mountains, with tiny
  flowers on usually leafless stems. It is sometimes classified in the genus Lepidium.
scope: 'Also called chamois cress and Pritzelago alpina: a small bunched long-lived herb of the mountains
  of central and southern Europe, with very small flowers on stems most often bare of leaves.'
examples:
- Lepidium alpina grows in the mountains of central Europe.
- The small flowers of Lepidium alpina grow on stems bare of leaves.
