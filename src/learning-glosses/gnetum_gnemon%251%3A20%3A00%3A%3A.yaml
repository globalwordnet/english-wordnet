simpleMeaning: A small tropical tree with layered branches, spreading twigs, and broad, shiny dark-green
  leaves. People eat its young leaves and grind its seeds into fine flour.
scope: 'Also called gnetum: a small tropical tree with flat layers of branches, not a tall forest tree.'
