simpleMeaning: A sung or instrumental part that supports the other parts in a piece of music.
scope: 'Also called support: a musical part behind the main part, not a pile-up caused by a blockage.'
examples:
- She sang backup on the chorus.
- The band's backup gave the song a fuller sound.
