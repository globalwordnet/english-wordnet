simpleMeaning: A verb form called an aorist, made by adding the Greek letter sigma or an s sound to the
  verb stem.
scope: In grammar, this is a past-tense verb form made by adding an s sound to the base form of the verb.
examples:
- The sigmatic aorist has disappeared in Baltic.
- A sigmatic aorist adds an s sound to the stem of the verb.
