simpleMeaning: A short piece for the stage, most often funny, shown when the play before it has ended.
scope: This one is not the play itself.
examples:
- The afterpiece was a short comic sketch following the main play.
- They stayed for the afterpiece, a funny little sketch that came when the play had ended.
