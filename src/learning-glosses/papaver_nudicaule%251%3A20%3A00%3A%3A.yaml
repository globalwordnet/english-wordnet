simpleMeaning: A poppy that lives for several years in subarctic regions of both the Eastern and Western
  Hemispheres. Its fragrant flowers can be white, yellow, orange, or peach-colored.
scope: This is a poppy of cold northern lands, also called arctic poppy and Iceland poppy, not a poppy
  of warm lands.
examples:
- Papaver nudicaule grows in cold northern lands.
- The white flowers of Papaver nudicaule smell sweet.
