simpleMeaning: A living thing's part that keeps the tiny cells able to grow into new living things, or
  makes them.
scope: This is also called a sporangium or a spore sac, and it is not the leaf branch of certain water
  ferns.
examples:
- The tiny cells that can start new living things sit inside a spore case.
- They found a spore case on the plant.
