simpleMeaning: Making people feel bothered and cross.
scope: Also called annoying, teasing, irritating, pestering, vexing, galling, pesky, bothersome, nettlesome,
  plaguey, vexatious, or plaguy. It is a quality.
examples:
- The pestiferous buzzing of the flies kept everyone awake all night.
- A pestiferous leak in the roof dripped on the table through dinner.
