simpleMeaning: Said of a thing that shows the mark of poor skill, not fit to be made or used by one skilled
  in a trade.
scope: It is said of a thing, not of a person.
examples:
- The join left an unworkmanlike result.
- They threw away the unworkmanlike tool.
