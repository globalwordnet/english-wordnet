simpleMeaning: A person who thinks about events from the standpoint of life's big questions.
scope: Also called a philosophiser. It is a person, not a set of ideas.
examples:
- The philosophizer looked at the quarrel and asked what each side really wanted.
- Every philosophizer in the group wondered whether the plan was right or wrong.
