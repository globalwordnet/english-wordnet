senseId: squint-eyed%5:00:00:indirect:00
synsetId: 00766264-s
simpleMeaning: Doubt, distrust, or envy shows in a look that goes to one side, said above all of looks.
scope: This is also called squint, sidelong, askance, squinty, askant, and asquint, and it names a look,
  not the sight itself.
examples:
- They gave a squint-eyed look.
- A squint-eyed glance greeted them.
