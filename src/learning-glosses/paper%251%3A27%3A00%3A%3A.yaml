simpleMeaning: A material made from plant fibers that have been broken down into pulp, usually from wood,
  cloth rags, or certain grasses. It is used for writing and printing.
scope: Not a newspaper, an essay or an official document; it is only the thin material itself.
examples:
- We need more paper for the printer.
- He wrapped the fish in paper.
