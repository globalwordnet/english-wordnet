simpleMeaning: A person whose reasoning is hard to follow and often seems right but is wrong.
scope: Sophist is another name for this kind of thinker.
examples:
- The casuist argued that the rule did not cover this one case.
- Only a casuist could make such a weak excuse sound like good sense.
