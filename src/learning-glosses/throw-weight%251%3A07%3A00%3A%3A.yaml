simpleMeaning: How heavy the load carried by a missile is, not counting the rocket itself.
scope: It is the load alone, not the rocket or the missile as a whole.
examples:
- The throw-weight of the missile was far less than its full weight.
- They cut the throw-weight to let the missile fly farther.
