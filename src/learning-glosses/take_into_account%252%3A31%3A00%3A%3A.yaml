senseId: 'take_into_account%2:31:00::'
synsetId: 00725507-v
simpleMeaning: To keep in mind that a thing may happen or be true when making plans.
scope: Also called allow. It is not about forgetting a thing that may happen.
examples:
- They took into account the rain when they planned the trip.
- They took into account the cost before they bought the car.
