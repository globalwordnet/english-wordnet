senseId: 'verruca_acuminata%1:07:00::'
synsetId: 04704145-n
simpleMeaning: A small, noncancerous wart on or around the genitals or anus.
scope: Also called condyloma acuminatum, genital wart, and venereal wart, this is the benign wart of the
  genitals and anus, not one on the hands.
examples:
- The doctor found a verruca acuminata near the patient's anus.
- A verruca acuminata had grown on the skin around the genitals.
