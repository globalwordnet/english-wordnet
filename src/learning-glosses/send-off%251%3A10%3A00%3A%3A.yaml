simpleMeaning: For someone about to set out on a trip or begin a new venture, a planned show of good wishes
  marks the start.
scope: Also called bon voyage, this planned show of good wishes marks the start of a trip or new venture.
examples:
- They gave him a send-off before he left for his new job.
- Her send-off came just before she set out on her trip.
