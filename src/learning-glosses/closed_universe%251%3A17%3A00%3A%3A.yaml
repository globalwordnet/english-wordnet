simpleMeaning: A spatially closed universe containing enough matter to halt expansion after the Big Bang.
  Visible matter supplies only a tenth of what's needed. Dark matter may supply the rest.
scope: 'In cosmology: a universe closed in space, with enough matter to halt expansion.'
examples:
- Closed universes halt their spread.
- The closed universe holds dark stuff.
