simpleMeaning: Zirconium, a strong, shiny gray metal resembling titanium, used in reactor fuel cladding
  because it absorbs few neutrons. It occurs in baddeleyite and comes mainly from zircon.
scope: Not titanium or hafnium, other grey metals; also called zirconium and atomic number 40.
examples:
- Zr is used in nuclear reactors.
- The engineer chose Zr for the reactor parts.
