simpleMeaning: Fat-rich bone marrow with a yellow appearance, found mainly in the shafts of long bones
  in adults.
scope: Also called yellow bone marrow, this one is found at the ends of the long bones, not in the middle.
examples:
- The yellow marrow in the bone was gold with fat.
- Doctors found yellow marrow at the ends of the long bones in the adult patient.
