simpleMeaning: Said of a place or a group where people of different races are no longer kept apart.
scope: Also called desegrated and nonsegregated. It is a word for a place, not for a person.
examples:
- The town's first unsegregated school opened in 1960.
- Riders took the unsegregated bus to work each morning.
