simpleMeaning: A kind of mammal whose feet end in nails or claws.
scope: Also called unguiculate mammal. It is the name of a mammal, not of a claw.
examples:
- The unguiculate uses its claws to grip the bark of trees.
- A dog is an unguiculate, but a horse is not.
