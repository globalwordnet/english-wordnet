simpleMeaning: A way to arrange a firm's business so it pays less money to the state on what it earns
  now.
scope: Also called shelter. It is not a building or place that keeps people safe.
examples:
- The firm set up a tax shelter to cut the money it owed.
- They asked their lawyer about a tax shelter for the new firm.
