simpleMeaning: The North Atlantic Council, made up of permanent representatives of every NATO member country.
  It makes NATO's political decisions.
scope: A group of standing envoys from all the member states of NATO, also called North Atlantic Council,
  not a military command.
examples:
- The NAC met in Brussels to agree a joint position.
- NAC members voted on the new policy.
