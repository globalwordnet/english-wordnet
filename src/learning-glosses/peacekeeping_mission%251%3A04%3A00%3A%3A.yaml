simpleMeaning: Work by soldiers to hold hostile groups or nations to a truce, most of all when the soldiers
  come from more than one country.
scope: Also called peacekeeping or peacekeeping operation. It is work done by soldiers.
examples:
- They joined a peacekeeping mission in the region.
- The peacekeeping mission lasted two years.
