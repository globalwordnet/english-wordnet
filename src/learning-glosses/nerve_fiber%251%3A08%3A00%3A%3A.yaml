simpleMeaning: A thin, threadlike part that sticks out from a cell that carries signals.
scope: Also called nerve fibre. It is a thin part of a cell, not the whole cell.
examples:
- The nerve fiber carried the signal from the toe to the spine.
- Damage to a nerve fiber can stop signals from the skin.
