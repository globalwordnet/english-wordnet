simpleMeaning: A light-emitting diode. Where two semiconductor regions meet, it produces light in proportion
  to the current flowing through it. The material determines the color.
scope: A light-giving part, also called a light-emitting diode; not a lamp bulb, and not a lead for a
  dog.
examples:
- The LED glows red.
- This LED uses little power.
