simpleMeaning: The amount by which the value of a country's exports exceeds the value of its imports.
scope: It is a gap in buying and selling with other lands, not one in the opposite direction.
examples:
- The trade surplus grew as exports rose.
- A big trade surplus pleased the finance minister.
