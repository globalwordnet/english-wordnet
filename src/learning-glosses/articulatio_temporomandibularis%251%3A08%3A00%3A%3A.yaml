simpleMeaning: The joint where the lower jaw meets the bone at the side of the head.
scope: Also called mandibular joint and temporomandibular joint, this one is a jaw joint, not a neck joint.
examples:
- The articulatio temporomandibularis clicked each time they opened their mouth.
