simpleMeaning: A right to buy or sell a share or bond at a set price, held by one who owns none of the
  shares or bonds behind the deal.
scope: It is a kind of deal.
examples:
- They sold a naked option on the company's shares.
- They warned new traders that a naked option can lose a lot of money.
