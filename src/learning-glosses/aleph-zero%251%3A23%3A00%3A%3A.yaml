senseId: 'aleph-zero%1:23:00::'
synsetId: 13776034-n
simpleMeaning: The smallest infinite cardinal number, equal to the number of elements in the set of all
  natural numbers.
scope: This one is also called aleph-nought and aleph-null.
examples:
- The smallest endless whole number, aleph-zero, comes first in the list of endless sizes.
- If you count all the whole numbers, their size is aleph-zero.
