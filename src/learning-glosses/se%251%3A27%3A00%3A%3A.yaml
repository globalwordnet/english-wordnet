simpleMeaning: Selenium, a toxic nonmetal related to sulfur and tellurium, has several forms. Its stable
  gray form conducts electricity better in light and serves in photocells. Sulfide ores contain selenium.
scope: A chemical element, also called selenium and atomic number 34; a nonmetal found in sulfide ores
  and used in light cells.
examples:
- Se is used in photocells.
- Se turns up in sulfide ores.
