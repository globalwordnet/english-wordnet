simpleMeaning: A ceremony, or a formal or official assembly, attended by people.
scope: Also called a function, an occasion, an affair, a social affair, a social gathering, and a social
  occasion. It is a meeting.
examples:
- The dinner was a social function held to honor the new mayor.
- They attended a social function at the town hall last night.
