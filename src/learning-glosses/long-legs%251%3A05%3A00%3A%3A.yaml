simpleMeaning: A black-and-white wading bird with long legs and three toes. It lives around inland ponds,
  marshes, and lagoons where fresh and salt water mix.
scope: 'Also called stilt, longlegs, stilt plover, and stiltbird: a black-and-white wading bird of ponds
  and marshes.'
examples:
- We watched the long-legs wading in the shallow pond.
- The long-legs stood on one thin leg at the edge of the marsh.
