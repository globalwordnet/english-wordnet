simpleMeaning: Used of a person who has no breath moving in or out, or who gets breath only by working
  hard for it.
scope: This one is also called breathless, dyspneal, dyspneic, and dyspnoeal.
examples:
- The dyspnoeic runner bent double at the side of the track.
- A dyspnoeic patient sat propped up, fighting for each breath.
