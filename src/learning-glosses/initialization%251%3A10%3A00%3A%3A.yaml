simpleMeaning: The act of arranging the parts on a hard disk drive's face so the system that runs the
  computer can get at them, and fixing a starting place.
scope: It is also called initialisation and low-level formatting.
examples:
- The initialization of the disk took several minutes.
- After initialization, the computer could read the new drive.
