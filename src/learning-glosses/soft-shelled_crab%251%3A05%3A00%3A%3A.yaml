simpleMeaning: An edible crab that has recently shed its old shell and whose new shell has yet to harden.
scope: Also called soft-shell crab, it is not one whose new cover has already formed but is still bendy.
examples:
- They ate a soft-shelled crab.
- The soft-shelled crab had just shed its old hard cover.
