simpleMeaning: A European and Asian bird of prey formerly grouped with the northern harrier of North America.
  It nests on the ground in marshes and other open country.
scope: Older books may use hen harrier for birds on both continents. Current classifications distinguish
  Circus cyaneus from the North American Circus hudsonius.
examples:
- A hen harrier hunted low over the marsh at dawn.
- We saw a hen harrier nesting in the open moorland.
