simpleMeaning: Relating to the Russian writer Fyodor Dostoevsky or resembling his writing style.
scope: Of that writer or in his way of writing; Dostoyevskian is another name for this sense, and it is
  not about any other writer.
examples:
- Her Dostoevskian novel explored guilt and faith.
- The novel had a Dostoevskian feel, dark and full of troubled minds.
