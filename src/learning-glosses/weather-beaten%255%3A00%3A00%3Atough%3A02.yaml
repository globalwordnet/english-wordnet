simpleMeaning: Said of skin that has turned brown and rough from spending time outside.
scope: It is said of skin. It does not describe a thing worn out by being outside.
examples:
- The sailor's weather-beaten face showed years of work at sea.
- The farmer's hands were weather-beaten from decades of work outdoors.
