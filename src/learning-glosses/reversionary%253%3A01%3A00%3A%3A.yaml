senseId: 'reversionary%3:01:00::'
synsetId: 03122733-a
simpleMeaning: To do with a thing or a right going back to the person who had it before, above all in
  law.
scope: This word marks a thing or a right as one that goes back to the person who had it before, above
  all in law, rather than staying with the person who has it now.
examples:
- The reversionary interest meant the land would come back to its first owner.
- The cottage was held under a reversionary right.
