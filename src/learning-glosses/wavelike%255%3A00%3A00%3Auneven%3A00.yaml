simpleMeaning: It has small folds and wrinkles that make it uneven.
scope: This is also called rippled, wavy, crinkled, or crinkly, and it is not a word for something flat.
examples:
- The old floorboards had a wavelike surface with folds running across them.
- The sand left a wavelike pattern on the beach after the tide went out.
