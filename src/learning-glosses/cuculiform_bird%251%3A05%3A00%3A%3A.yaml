simpleMeaning: A group of feathered animals whose feet have two toes pointing forward and two pointing
  back, apart from the touracos.
scope: This one is about a group of animals, and the touracos are not part of it.
examples:
- The cuculiform bird gripped the branch with its two front toes and two back toes.
- We watched the cuculiform bird climb along the branch, holding on with its feet.
