senseId: 'pneumothorax%1:26:00::'
synsetId: 14173018-n
simpleMeaning: Air in the space around a lung that makes it collapse; it may happen on its own, after
  a chest injury, or be induced as a past treatment for tuberculosis.
scope: Air collects between the lung and the chest wall. The resulting collapse may affect part or all
  of the lung.
examples:
- The scan showed a small pneumothorax at the top of the lung.
- The medical history described an artificial pneumothorax used in early tuberculosis care.
