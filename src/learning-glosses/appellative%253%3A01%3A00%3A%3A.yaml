senseId: 'appellative%3:01:00::'
synsetId: 02646150-a
simpleMeaning: Said of a word that works as an ordinary name for a kind of thing, not as a name for one
  single thing.
scope: This one is the adjective sense of this word, not the noun for a naming word.
examples:
- The word 'city' is appellative, naming a kind of place rather than one place.
- The class agreed that 'dog' is appellative, since it names a kind of animal.
