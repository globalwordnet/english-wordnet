simpleMeaning: Describing water with many submerged reefs, sandbanks, or shallow areas.
scope: Also called reefy, shelfy and shoaly, this is a word for water where reefs, sandbanks or shoals
  lie hidden just under the surface.
examples:
- The shelvy water hid the sandbanks from view.
- They sailed across the shelvy water.
