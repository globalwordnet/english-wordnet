simpleMeaning: Clots are kept from forming in the blood by this medicine, or made to form more slowly.
scope: Also called anticoagulant medication or decoagulant, this one does not help blood clot.
examples:
- The doctor gave them an anticoagulant after the operation.
- The nurse checked the dose of anticoagulant before giving the injection.
