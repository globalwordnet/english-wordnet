simpleMeaning: Talk meant to get people to agree, smooth and quick and sounding true, and most useful
  to someone who sells goods.
scope: It is also called patter, and a spiel is another name for it.
examples:
- The line of gab worked on the crowd at the fair.
- They listened to the line of gab, half believing it.
