simpleMeaning: A North American herb that bears poisonous white berries.
scope: This North American herb is also called doll's eyes, a white baneberry, a white cohosh, and Actaea
  alba, and its pale berries can poison, unlike the harmless berries of other herbs.
examples:
- We saw white bead with pale berries growing in the damp woods.
- They warned the children not to eat the white bead by the shady edge of the garden.
