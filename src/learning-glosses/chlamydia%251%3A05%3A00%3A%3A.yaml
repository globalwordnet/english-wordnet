simpleMeaning: A rounded bacterium of the genus Chlamydia. These bacteria infect birds and mammals and
  can cause infections of the eyes, lungs, or urinary and reproductive organs.
scope: Round germs that infest birds and beasts, bringing on infections of eyes, lungs, and the parts
  for sex and passing water; not a sexually passed infection brought on by germs of the group Chlamydia.
examples:
- Their chlamydia spread through the flock.
- The chlamydia was found in the eye.
