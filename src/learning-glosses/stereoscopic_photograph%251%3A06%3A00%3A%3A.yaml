simpleMeaning: A pair of pictures of one scene, shot from points a little apart, which the eyes blend
  into a single view with depth.
scope: Stereo and stereoscopic picture are other names for this two-view picture.
examples:
- The stereoscopic photograph showed the garden in three dimensions.
- A stereoscopic photograph of the bridge hung on the wall.
