simpleMeaning: A former classification that grouped all hoofed mammals together. Two groups traditionally
  distinguished are Perissodactyla, the odd-toed mammals, and Artiodactyla, the even-toed mammals.
scope: A former large group of hoofed mammals, not meat-eaters and not rodents; it is now split into odd-toed
  and even-toed kinds.
examples:
- Ungulata once held all the hoofed mammals.
- Horses and cows were both in Ungulata under the old books.
