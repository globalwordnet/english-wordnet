senseId: 'differentiation%1:04:01::'
synsetId: 00872318-n
simpleMeaning: The process of finding a function's derivative, which measures how fast its output changes
  as its input changes.
scope: This is the maths sense, not telling things apart as different, and not the biology sense where
  a body part changes for one job.
examples:
- In maths class, differentiation helped us find how fast the speed was changing.
- She used differentiation to find how steep the curve was at one point.
