simpleMeaning: In everyday talk, a word for someone full of a high view of themselves.
scope: Snotty, snooty, bigheaded, persnickety, stuck-up, too big for one's breeches, and uppish are other
  names for this word, used in everyday talk of someone full of a high view of themselves, not of someone
  dirty with discharge.
examples:
- He was called snot-nosed by the other boys.
- The snot-nosed clerk looked down on everyone.
