senseId: 'spondylitis%1:26:00::'
synsetId: 14379306-n
simpleMeaning: Pain and stiffness in the back, from a joint there that has swollen up.
scope: This names a swelling of a joint in the back, with pain and stiffness, not a swelling of a joint
  somewhere else in the body.
examples:
- A scan showed spondylitis in one joint of the back.
- The spondylitis was the cause of the pain in the back.
