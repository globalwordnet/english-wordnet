senseId: 'non_sequitur%1:09:00::'
synsetId: 05789660-n
simpleMeaning: In logic, a claim that does not follow from the reasons given before it.
scope: It is a claim in logic, not a reply that has nothing to do with what came before.
examples:
- 'The report ends in a non sequitur: the figures do not lead to the claim it makes.'
- Saying the rain proves the roof is sound is a non sequitur.
