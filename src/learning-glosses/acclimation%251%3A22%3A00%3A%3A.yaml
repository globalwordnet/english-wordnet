simpleMeaning: Getting used to the weather of a new place, with its heat or cold, its height, or its surroundings.
scope: This one is also called acclimatisation and acclimatization.
examples:
- Their acclimation to the mountain town took a while.
- By the sea, their acclimation was complete and the heat no longer bothered them.
