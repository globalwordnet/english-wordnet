simpleMeaning: A system for testing whether statements are consistent and arguments valid by examining
  their logical structure independently of their subject matter.
scope: Mathematical logic and symbolic logic are other names for this set of rules, which looks only at
  the shape of claims, not at what they say.
examples:
- She took a course in formal logic to learn how to test claims.
- She studied formal logic to test whether claims hold together.
