senseId: 'molarity%1:07:00::'
synsetId: 05047235-n
simpleMeaning: The number of moles of dissolved substance per liter of solution.
scope: How much of a dissolved stuff is in a liquid, counted by the number of moles in each litre of the
  liquid; molar concentration is another name for this measure, not the weight of the dissolved stuff.
examples:
- The molarity of the salt water was two moles per litre.
- To find the molarity, divide the moles by the litres of liquid.
