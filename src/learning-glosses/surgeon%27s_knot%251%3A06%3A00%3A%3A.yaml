simpleMeaning: Any of a few twists of thread used to tie stitches or the threads that tie off blood vessels.
scope: This is the name for any of a few twists of thread used to tie stitches or the threads that tie
  off blood vessels, not an ordinary twist of thread used for tying things in general.
examples:
- The doctor tied a surgeon's knot to close the cut.
- The stitch was finished with a surgeon's knot.
