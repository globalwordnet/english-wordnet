senseId: 'antepenult%1:10:00::'
synsetId: 06316213-n
simpleMeaning: In a word, the syllable that stands two places before the last one.
scope: Also called antepenultima and antepenultimate, this word names the third syllable from the end
  of a word, not the last one.
examples:
- In 'elephant', the antepenult is the first syllable, 'el'.
- The teacher asked the class to find the antepenult in a long word.
