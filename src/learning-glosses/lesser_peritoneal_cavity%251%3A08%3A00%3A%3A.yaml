senseId: 'lesser_peritoneal_cavity%1:08:00::'
synsetId: 05435713-n
simpleMeaning: A pocket behind the stomach in the space lined by the abdominal membrane, connected by
  a small opening to the rest of that space.
scope: Also called the lesser sac or omental bursa. A small opening connects it to the rest of the peritoneal
  cavity.
examples:
- The lesser peritoneal cavity lies behind the stomach.
- Fluid can collect in the lesser peritoneal cavity after surgery.
