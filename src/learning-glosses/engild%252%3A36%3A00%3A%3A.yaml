simpleMeaning: To dress a thing up with thin sheets of a yellow metal, or with that metal in liquid form,
  or as if it had been so dressed.
scope: This one is also called gild, and begild is another name for it.
examples:
- They engilded the frame to make it shine.
- The engilded dome caught the morning light.
