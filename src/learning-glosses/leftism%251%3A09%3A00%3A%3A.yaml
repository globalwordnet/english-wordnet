simpleMeaning: The set of ideas of the side in politics against the right, and belief in or support of
  the ideas of the side in politics against the right.
scope: It is the body of ideas itself, not a person who holds those ideas.
examples:
- Leftism shaped the party's platform for years.
- Their leftism showed in every speech they gave.
