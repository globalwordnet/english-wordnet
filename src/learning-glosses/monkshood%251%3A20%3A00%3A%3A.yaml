simpleMeaning: A poisonous northern European herb with hood-shaped blue-purple flowers. Its dried leaves
  and roots yield a substance called aconite.
scope: Also called helmet flower or helmetflower, a poisonous plant from northern Europe with hooded blue-purple
  flowers, whose dried leaves and roots give a strong poison.
examples:
- Monkshood grew wild along the northern path.
- The monkshood flowers were hooded and deep blue-purple.
