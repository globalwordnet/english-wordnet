simpleMeaning: A brand of medicine that reduces stomach acid by blocking the action of histamine. It is
  used for peptic ulcers, inflammation of the stomach lining, and acid reflux.
scope: This is one named drug that blocks histamine, also called famotidine.
examples:
- Pepcid treats stomach sores.
- Her doctor gave her Pepcid for stomach acid flowing back up.
