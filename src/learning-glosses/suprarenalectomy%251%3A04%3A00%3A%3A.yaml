simpleMeaning: An operation to remove one or both adrenal glands, which sit above the kidneys.
scope: Adrenalectomy is another name for this operation that takes out one or both of the organs near
  the kidney.
examples:
- The team planned a suprarenalectomy to take out one of the organs.
- The suprarenalectomy took out both of the organs near the kidneys.
