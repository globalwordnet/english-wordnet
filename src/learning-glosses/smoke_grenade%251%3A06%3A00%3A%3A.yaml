simpleMeaning: A bomb that bursts and fills the air with a thick cloud, to hide what is behind it or to
  mark a spot.
scope: People also call this a smoke bomb, and it is not the cloud itself.
examples:
- The smoke grenade went off and hid the move.
- They set off a smoke grenade to mark the spot.
