simpleMeaning: A way of acting that someone has learned so well by long practice that it feels like something
  they were born with.
scope: It is a habit, not something a person is born with.
examples:
- After years of practice, playing the piano had become second nature to them.
- Checking the locks before bed was second nature to the whole family.
