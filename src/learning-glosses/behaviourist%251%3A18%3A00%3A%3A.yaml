simpleMeaning: This is a person who looks into the working of the mind and takes it as given that people's
  actions are all that can be studied.
scope: Also called a behaviorist, this one names a person who studies the mind, not the adjective.
examples:
- The behaviourist studied how the rats learned to press the lever.
- They invited a behaviourist to talk about how children learn.
