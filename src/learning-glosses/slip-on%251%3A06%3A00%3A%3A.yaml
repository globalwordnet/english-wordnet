simpleMeaning: Something you wear that goes into place and comes away with ease, whether it is a shoe
  or another piece of clothing.
scope: This word is said of a shoe or another piece of clothing that goes into place and comes away with
  ease.
examples:
- They put their slip-on shoes on with ease.
- The slip-on boots came away with ease.
