senseId: voidable%5:00:00:revocable:00
synsetId: 01764805-s
simpleMeaning: Said of a thing that can be undone or made to have no force.
scope: Also called rescindable. It is said of a thing, not of a person.
examples:
- The court ruled that the old agreement was voidable and could be set aside.
- The voidable clause was struck from the final draft of the deal.
