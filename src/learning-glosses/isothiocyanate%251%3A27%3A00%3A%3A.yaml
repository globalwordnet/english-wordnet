simpleMeaning: One of a group of compounds found in plants such as horseradish, radishes, and mustard.
  These compounds give the plants and foods made from them their sharp, hot taste.
scope: This is one of the group of stuffs that give horseradish, radishes, onions, and mustards their
  heat.
examples:
- The isothiocyanate in mustard gives the sauce its bite.
- Horseradish owes its heat to an isothiocyanate.
