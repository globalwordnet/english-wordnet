simpleMeaning: New blood cells are built by a living body, with the soft filling of bones doing most of
  the work.
scope: This process is also called haematogenesis, haematopoiesis, haemogenesis, haemopoiesis, hematogenesis,
  hematopoiesis, hemopoiesis, or sanguification.
examples:
- Doctors study hemogenesis to learn how the body renews its blood.
- After the illness, hemogenesis slowly returned to normal.
