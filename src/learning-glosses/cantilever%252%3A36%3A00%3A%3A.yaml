simpleMeaning: To build something out of beams and girders, holding it fast at one end only and leaving
  the other end free.
scope: This one is about the act of building, not the other senses of the same word.
examples:
- Frank Lloyd Wright liked to cantilever his buildings.
- They cantilevered the new wing so that it hung out over the garden.
