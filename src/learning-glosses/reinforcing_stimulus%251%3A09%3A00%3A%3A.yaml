senseId: 'reinforcing_stimulus%1:09:00::'
synsetId: 05836876-n
simpleMeaning: In psychology, something that follows a behavior and makes the behavior more likely to
  happen again.
scope: Also called reinforcement or reinforcer, it is the signal that comes after an act, not the act
  it follows.
examples:
- The light served as a reinforcing stimulus after each right answer.
- A reinforcing stimulus can make a child repeat the same act.
