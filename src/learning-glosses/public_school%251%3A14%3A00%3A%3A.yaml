simpleMeaning: A U.S. school that charges no tuition, is paid for by taxes, and is run by a school board.
scope: It is not the kind in Great Britain that charges for teaching.
examples:
- The children walked to the public school at the end of their street.
- They sent their son to the public school because it costs nothing to attend.
