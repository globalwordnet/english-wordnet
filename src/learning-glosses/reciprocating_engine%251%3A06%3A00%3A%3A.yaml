simpleMeaning: An engine that burns fuel inside cylinders, where pistons move up and down to turn a crankshaft.
scope: It is a motor whose main shaft is turned by parts moving up and down in tubes.
examples:
- The mechanic opened up the reciprocating engine to check the parts inside.
- The lorry's reciprocating engine moved its parts up and down as it ran.
