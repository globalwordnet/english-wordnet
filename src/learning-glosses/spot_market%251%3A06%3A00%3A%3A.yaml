synsetId: 04293934-n
simpleMeaning: For handing over at once, or very soon after the deal, goods are bought or sold in this
  market.
scope: This word is used of a place where the handover comes at once, not one where it waits for a later
  date.
examples:
- They bought the grain on the spot market for handing over at once.
- The goods were sold on the spot market and handed over very soon after.
