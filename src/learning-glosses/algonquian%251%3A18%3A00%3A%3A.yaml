simpleMeaning: A member of an Algonquian-speaking Indigenous group originally from subarctic eastern Canada.
  Many such groups moved south into woodlands between the Mississippi River and the Atlantic coast.
scope: 'Also called Algonquin: a member of one of these Indian groups, not a speaker of the language family
  as a whole and not the adjective for things of these peoples.'
examples:
- An Algonquian elder told stories of the old northern camps.
- Many Algonquian families moved south into the woodlands long ago.
