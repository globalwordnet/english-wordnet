senseId: 'outer_planet%1:17:00::'
synsetId: 09404392-n
simpleMeaning: A major planet orbiting beyond the asteroid belt, such as Jupiter, Saturn, Uranus, or Neptune.
  Pluto, once included, is now classified as a dwarf planet.
scope: A large planet whose path round the sun lies beyond the ring of rocks, not one of the planets inside
  it.
examples:
- Jupiter is an outer planet.
- An outer planet moves round the sun beyond the ring of rocks.
