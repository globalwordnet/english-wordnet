simpleMeaning: With an air of superiority, as though the other person needs simple things explained to
  them.
scope: This sense is also called condescendingly and patronizingly, for a look down, in a lofty way.
examples:
- She spoke patronisingly, with a look down.
- He smiled patronisingly, in a lofty way.
