simpleMeaning: Likely to speak of someone or something in a way that takes away from their worth.
scope: This one is also called deprecating, belittling, slighting, deprecative, depreciative, and depreciatory,
  and it is not about money worth going down.
examples:
- The deprecatory remarks about the book made it sound dull and weak.
- The speaker's deprecatory smile took the warmth out of the praise.
