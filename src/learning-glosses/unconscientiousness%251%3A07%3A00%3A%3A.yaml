simpleMeaning: The quality of being ready to set aside what one's conscience says is right.
scope: It is a quality of the will, not carelessness in one's work.
examples:
- They showed unconscientiousness by ignoring the rules they knew were right.
- The manager's unconscientiousness cost the firm its good name.
