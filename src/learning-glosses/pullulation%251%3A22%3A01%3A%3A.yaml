senseId: 'pullulation%1:22:01::'
synsetId: 13565276-n
simpleMeaning: The way a living thing makes a new one without mating, when a small growth on it or in
  it breaks away and lives on its own.
scope: Also called gemmation. It is a noun.
examples:
- In pullulation, a new plant starts as a small lump on the parent plant.
- Pullulation lets a single plant make many new plants from its own buds.
