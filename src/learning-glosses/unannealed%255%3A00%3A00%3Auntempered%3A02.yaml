senseId: unannealed%5:00:00:untempered:02
synsetId: 01526333-s
simpleMeaning: Of metal or glass, left without heat treatment to relieve internal stress, so it cracks
  or breaks more easily.
scope: Also called brittle, this word is for metal or glass that was never made soft, not for metal or
  glass made soft that way.
examples:
- They handled the unannealed metal with care.
- A crack ran through the unannealed glass.
