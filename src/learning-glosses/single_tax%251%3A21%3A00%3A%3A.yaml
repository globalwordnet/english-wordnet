senseId: 'single_tax%1:21:00::'
synsetId: 13331113-n
simpleMeaning: A way of raising money for the government in which a charge is put on just one kind of
  good, usually land.
scope: It is not a set of charges on many goods.
examples:
- The single tax fell on land alone, and nothing else was charged.
- They argued that a single tax would be fairer than many small ones.
