simpleMeaning: In mathematics, the numbers that can go into one rule that turns one number into another,
  where the rule gives an answer.
scope: This one is also called domain.
examples:
- The teacher asked the class to find the domain of a function before they drew its graph.
- We worked out the domain of a function by testing which numbers gave an answer.
