senseId: 'acoustic_resistance%1:19:00::'
synsetId: 11524896-n
simpleMeaning: The part of a surface's opposition to sound flow that dissipates energy. It is the real
  component of acoustic impedance, alongside the imaginary component, reactance.
scope: This sense is also called acoustic impedance and acoustic reactance.
examples:
- Acoustic resistance slowed the sound.
- An acoustic resistance stood against the flow.
