senseId: 'anapaestic%3:01:00::'
synsetId: 02950026-a
simpleMeaning: Said of a group of syllables with a set beat, when two short ones come before one long
  one.
scope: Also called anapestic, this is not a beat pattern in which a long beat comes before the short ones.
examples:
- The line the poet wrote was anapaestic, with two quick beats before a long one.
- The teacher marked the verse as anapaestic because the short beats came first.
