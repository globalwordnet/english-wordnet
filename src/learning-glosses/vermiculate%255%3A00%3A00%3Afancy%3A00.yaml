simpleMeaning: Winding lines like worms mark this surface, put there to make it look fine.
scope: Also called vermicular or vermiculated, this is a surface with worm-like tracery, not one spoiled
  by worms.
examples:
- The vermiculate stonework on the arch had lines that wound like worms.
- They chose a vermiculate design for the floor, with winding lines like worms.
