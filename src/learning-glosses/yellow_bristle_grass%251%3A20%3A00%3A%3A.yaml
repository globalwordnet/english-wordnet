simpleMeaning: Rough with stiff hairs, this common grass grows like a weed in nearly all places with mild
  weather.
scope: Also called glaucous bristlegrass, yellow bristlegrass, yellow foxtail, and Setaria glauca, this
  one grows like a weed.
examples:
- Along the edge of the field, yellow bristle grass grew in thick patches.
- They pulled up the yellow bristle grass before it spread across the garden.
