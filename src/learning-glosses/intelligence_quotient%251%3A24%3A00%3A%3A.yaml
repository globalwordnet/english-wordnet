simpleMeaning: A score from an intelligence test, traditionally calculated by dividing mental age by actual
  age and multiplying by 100.
scope: This is a number that comes from a test of thinking, worked out from mind age against real age
  times one hundred.
examples:
- Their intelligence quotient was worked out from the test.
- They took the test to find their intelligence quotient.
