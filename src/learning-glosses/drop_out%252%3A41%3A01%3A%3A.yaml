simpleMeaning: To leave the life most people share, above all because the usual beliefs about what is
  good no longer seem true.
scope: This one is not about giving up after a loss.
examples:
- She hasn't heard from her brother in years — he dropped out after moving to California.
- After years in the city, the teacher dropped out and lived alone in the hills.
