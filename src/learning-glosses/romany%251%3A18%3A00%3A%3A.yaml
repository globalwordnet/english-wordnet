simpleMeaning: A member of the Romani people, whose ancestors came from northern India and whose communities
  live worldwide, especially in Europe, North Africa, and North America.
scope: A member of the Romani people, with dark skin and hair, speaking Romany and living by seasonal
  work and fortune-telling; also called Gypsy, Gipsy, Bohemian, Roma, Romani and Rommany, and not the
  language or the adjective use of the word.
examples:
- The Romany travel from town to town for seasonal work.
- Many Romany speak Romany at home.
