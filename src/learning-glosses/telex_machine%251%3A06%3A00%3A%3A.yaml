simpleMeaning: To get words that arrive over wires onto paper, this machine prints them, its keys working
  like a typewriter's.
scope: This sense is also called teleprinter, teletype machine, teletypewriter, and telex.
examples:
- The telex machine in the office printed the message.
- The telex machine gave them the reply in print.
