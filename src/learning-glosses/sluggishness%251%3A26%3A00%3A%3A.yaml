senseId: 'sluggishness%1:26:00::'
synsetId: 14038461-n
simpleMeaning: A state of lying still and barely awake, as found in sleeping sickness.
scope: Lethargy and lassitude are other names for this state of lying still and barely awake, as found
  in sleeping sickness, not the slow pace of things that move slowly.
examples:
- A deep sluggishness came over them with the sickness.
- They lay still in a sluggishness brought on by the sleeping sickness.
