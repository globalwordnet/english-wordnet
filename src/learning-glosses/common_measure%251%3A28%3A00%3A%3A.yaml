simpleMeaning: A mark in written music showing that each bar holds four beats.
scope: Common time, four-four time, and quadruple time are other names for this thing, not the meter of
  a ballad.
examples:
- The choir sang the hymn in common measure, four beats to every bar.
- We clapped along as the band played the march in common measure.
