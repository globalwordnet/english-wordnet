simpleMeaning: Three bodies in the sky, such as the sun, the earth, and the moon, lined up straight in
  a group held together by gravity.
scope: It names the line-up, not the three bodies themselves.
examples:
- The coming syzygy will line up the sun, the earth, and the moon.
- Astronomers watched the syzygy through the night.
