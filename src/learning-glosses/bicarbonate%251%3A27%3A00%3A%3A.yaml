simpleMeaning: An acid carbonate salt formed when one hydrogen of carbonic acid is replaced, leaving the
  bicarbonate ion HCO₃⁻.
scope: A salt of carbonic acid, also called hydrogen carbonate.
examples:
- Bicarbonate of soda helps the cake rise.
- The doctor gave bicarbonate to settle the acid in her stomach.
