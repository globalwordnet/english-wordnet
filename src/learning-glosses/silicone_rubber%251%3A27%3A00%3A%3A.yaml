simpleMeaning: A rubber made from stretchy silicone polymers that stays flexible, springs back, and resists
  breaking when pulled over a wide range of temperatures.
scope: This is one of the man-made stretchy stuffs that keep their bend and strength in heat and in cold.
examples:
- The seals are made of silicone rubber.
- In heat and in cold, silicone rubber keeps its bend.
