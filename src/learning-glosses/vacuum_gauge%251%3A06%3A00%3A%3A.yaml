simpleMeaning: An instrument that measures how far a pressure is below the surrounding atmospheric pressure.
scope: Also called vacuum gage. It is a tool, not the air itself.
examples:
- The vacuum gauge read zero when the chamber was full of air.
- They watched the vacuum gauge as the pump drew the air out.
