simpleMeaning: A flaw in how a round surface bends light, so the picture it forms comes out bent out of
  shape.
scope: This flaw bends light the wrong way, so the picture comes out bent out of shape.
examples:
- The photo showed signs of spherical aberration.
- They could see the spherical aberration in the photograph.
