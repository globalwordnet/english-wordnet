simpleMeaning: An electronic component made from a material such as silicon whose ability to conduct electricity
  can be controlled.
scope: This is the part made to carry power, not the material itself that the part is made from.
examples:
- The radio uses a small semiconductor to control the electric power.
- He replaced the broken semiconductor in the circuit.
