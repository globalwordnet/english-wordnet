simpleMeaning: A nerve toxin sold as Botox. Small doses treat crossed eyes, facial spasms and other neurological
  disorders involving abnormal muscle contractions. Cosmetic surgeons use it to smooth frown lines temporarily.
scope: Not other nerve poisons, nor other wrinkle treatments; also called Botox.
examples:
- Botulinum toxin A smooths frown lines.
- Doctors use botulinum toxin A in tiny amounts.
