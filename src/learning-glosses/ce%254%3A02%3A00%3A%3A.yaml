simpleMeaning: Short for Common Era, a term for the same years as AD that some writers prefer because
  it avoids a religious reference.
scope: Also called the Common Era and C.E.; not BC and not AD.
examples:
- The temple was built in 200 CE.
- Writers use CE for dates after the birth of Christ.
