simpleMeaning: A group of people posed to look good, as if they were figures in a painting.
scope: Also called tableau. It names the posed group, not the painting it looks like.
examples:
- The tableau vivant held its pose as the curtain rose.
- They formed a tableau vivant of a famous painting.
