simpleMeaning: A tree or shrub of northern temperate regions with toothed leaves and cone-shaped fruit.
  Its wood resists rot, and its bark is used for tanning leather and dyeing.
scope: This sense is also called alder.
examples:
- An alder tree grew in the north.
- Alder trees bear cone-like fruit.
