simpleMeaning: Below the surface, a pull carries the water back out from the shore after the waves have
  broken.
scope: This pull of water is also called undertow, sea-poose, sea-purse, sea purse, and sea puss.
examples:
- The sea-puss carried the water back out from the shore.
- After the waves broke, the sea-puss pulled below the surface.
