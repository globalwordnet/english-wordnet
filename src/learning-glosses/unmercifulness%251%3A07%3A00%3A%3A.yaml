simpleMeaning: This hardness shows in a person who will not be kind or forgive.
scope: Also called mercilessness, this is inhumaneness, not a readiness to be kind or to forgive.
examples:
- Their unmercifulness showed when they would not forgive the debt.
- The unmercifulness of the ruler left no room for kindness.
