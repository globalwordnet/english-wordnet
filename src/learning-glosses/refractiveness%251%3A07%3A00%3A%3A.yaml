senseId: 'refractiveness%1:07:00::'
synsetId: 05018752-n
simpleMeaning: How strongly a thing turns light aside, fixed by the number that says how much the light
  slows in it.
scope: 'This is also called refractivity: the bending power itself, not the number that measures it.'
examples:
- The refractiveness of the glass made the straw look bent in the water.
- The refractiveness of the oil was tested by watching how the light bent through it.
