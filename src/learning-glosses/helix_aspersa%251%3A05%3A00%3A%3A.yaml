simpleMeaning: A common garden snail found almost worldwide. It has a brown shell with lighter zigzag
  markings and can cause serious damage to plants.
scope: This is a serious garden pest also called brown snail and Cornu aspersum, not a harmless snail
  or a snail found in one place only.
examples:
- Helix aspersa eats the leaves in our garden.
- The brown shell of Helix aspersa has paler zigzag lines.
