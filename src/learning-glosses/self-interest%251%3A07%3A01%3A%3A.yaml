senseId: 'self-interest%1:07:01::'
synsetId: 04842719-n
simpleMeaning: Using every chance to gain, with no care for what it costs others.
scope: Also called expedience, opportunism, and self-seeking. It is a noun.
examples:
- Self-interest led them to take the deal and leave their partners with nothing.
- They acted out of self-interest, not out of care for the team.
