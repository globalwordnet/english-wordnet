simpleMeaning: A person of this kind shows none of the kindness people look for in someone living next
  door.
scope: This is also called unneighbourly, and it is used of an unfriendly person.
examples:
- The new tenant was unneighborly and never once spoke to the people next door.
- Their unneighborly silence made the whole street feel unwelcome.
