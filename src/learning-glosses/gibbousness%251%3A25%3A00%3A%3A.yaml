senseId: 'gibbousness%1:25:00::'
synsetId: 13917127-n
simpleMeaning: A bulge in a surface, where one part juts out past the rest.
scope: This sense is also called bump, bulge, swelling, hump, jut, prominence, protrusion, protuberance,
  excrescence, extrusion, and gibbosity.
examples:
- The gibbousness of the vase made it hard to fit on the shelf.
- The gibbousness in the wooden panel was easy to feel.
