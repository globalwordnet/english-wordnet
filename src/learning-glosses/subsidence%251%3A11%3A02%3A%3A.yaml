senseId: 'subsidence%1:11:02::'
synsetId: 07434560-n
simpleMeaning: A drop in how strong or how great something is, such as the signs of a disease.
scope: It is also called remission and remittal. It is not the sudden fall of something into a hole below
  it.
examples:
- The subsidence of the fever showed that the drug was working.
- After the rain, they saw a subsidence in the level of the flood water.
