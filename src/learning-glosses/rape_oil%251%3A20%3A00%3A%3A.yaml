simpleMeaning: An edible pale yellow to brown oil from rapeseed, also used to lubricate moving parts or
  fuel lamps.
scope: Also called colza oil and rapeseed oil, this is a pale yellow to brown stuff from a kind of seed,
  not a cooking fat from animals and not a fuel for cars.
examples:
- We fry with rape oil because it stays light and clear.
- The lamp burned rape oil all night.
