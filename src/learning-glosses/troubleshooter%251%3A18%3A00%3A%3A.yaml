simpleMeaning: Finding the cause of a breakdown and mending it is this worker's job, above all when the
  breakdown is in a machine.
scope: Also called trouble shooter, this worker's work starts with a fault that is already there, not
  with the building of a new machine.
examples:
- They asked a troubleshooter to find out why the lift kept stopping.
- The troubleshooter traced the fault to a worn belt and mended the machine.
