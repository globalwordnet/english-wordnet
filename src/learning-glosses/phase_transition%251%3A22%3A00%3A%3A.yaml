senseId: 'phase_transition%1:22:00::'
synsetId: 13557219-n
simpleMeaning: A shift of matter from solid, liquid, or gas into another state, while its make-up stays
  the same.
scope: Also called phase change, physical change, and state change. It is a shift.
examples:
- Boiling is a phase transition from liquid to gas.
- Freezing is a phase transition from liquid to solid.
