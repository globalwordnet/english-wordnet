simpleMeaning: A bird's tail feathers are fixed to the back part of its body.
scope: This is the back part of a bird's body, not the tail feathers themselves.
examples:
- A hunter looked at the uropygium of the bird to see where the tail feathers joined the body.
- They felt the uropygium at the back of the bird and counted the tail feathers growing from it.
