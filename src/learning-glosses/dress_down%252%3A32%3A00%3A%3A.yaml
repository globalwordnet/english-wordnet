senseId: 'dress_down%2:32:00::'
synsetId: 00826456-v
simpleMeaning: To blame someone in sharp, angry words for a wrong they did.
scope: This one is also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce, remonstrate,
  lambaste, lambast, bawl out, call down, call on the carpet, chew out, chew up, have words, and take
  to task; it has nothing to do with wearing plain clothes for everyday life.
examples:
- The customer dressed down the waiter for bringing cold soup.
- The teacher dressed the class down for talking during the test.
