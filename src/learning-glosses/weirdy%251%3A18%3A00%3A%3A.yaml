simpleMeaning: Someone others find odd and off-putting because of strange habits or manners.
scope: Also called creep, spook, weirdo and weirdie. It is a person, not a thing.
examples:
- The weirdy at the end of the street rarely spoke to anyone.
- They avoided the weirdy who talked to the garden plants.
