simpleMeaning: Pressure from fluids inside the eye, regulated by resistance to the outward flow of the
  clear fluid called aqueous humor.
scope: This is the push of the fluids inside the eyeball, kept in check by how hard the watery fluid inside
  the eye can flow out; also called intraocular pressure.
examples:
- High IOP can lead to glaucoma.
- The doctor measured my IOP at the check-up.
