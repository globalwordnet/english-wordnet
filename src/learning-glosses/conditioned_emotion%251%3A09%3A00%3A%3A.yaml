simpleMeaning: A feeling that has been learned because it was paired with something else again and again.
scope: Also called conditioned emotional response. It is about a feeling.
examples:
- The conditioned emotion made the child jump each time the bell rang.
- The dog showed a conditioned emotion when it heard the bell.
