simpleMeaning: A controller combining a Kalman filter, which estimates a system's state from noisy measurements,
  with a linear-quadratic regulator, which uses that estimate to control the system.
scope: A device that joins a filter and a regulator, not a single filter; also called LQG controller.
examples:
- The linear-quadratic-Gaussian controller keeps the drone steady in wind.
- Engineers tuned the linear-quadratic-Gaussian controller for the robot arm.
