simpleMeaning: These blood vessels drain the lips of the vulva and carry blood back toward the heart.
scope: These are blood vessels of the lips of the vulva, also called labial vein, not the ones that drain
  the lips of the mouth.
examples:
- Blood leaves the lips of the vulva through the vena labialis.
- In the textbook picture, the vena labialis ran beside the lips of the vulva.
