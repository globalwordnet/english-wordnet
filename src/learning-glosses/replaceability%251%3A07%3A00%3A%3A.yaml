simpleMeaning: The ability to be exchanged for something else that can take its place.
scope: Also called commutability and substitutability. It is a quality.
examples:
- The new part has high replaceability, so the old one can be swapped out quickly.
- Engineers test the replaceability of each part before they fit it into the machine.
