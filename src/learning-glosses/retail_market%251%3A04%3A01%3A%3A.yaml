simpleMeaning: The buying and selling of goods or services to the people who will use them, not to makers
  or to sellers who pass them on.
scope: This is where goods or services are sold to everyday buyers, not to makers or to sellers who pass
  goods on.
examples:
- The retail market sells goods straight to the people who will use them.
- Prices in the retail market are what everyday buyers pay.
