simpleMeaning: Eyes fill with watery drops from this gas, but it leaves them unharmed, and it breaks up
  crowds.
scope: This is also called a lachrymator, a lacrimator, and teargas, not the act of attacking with it.
examples:
- They used tear gas to break up the crowd.
- The tear gas left their eyes watering but unharmed.
