simpleMeaning: A male horse that is still young, with testicles that stay inside its body.
scope: Also called ridgel, ridgil, and ridgling. It is a colt.
examples:
- They bought a ridgeling at the horse sale last spring.
- The vet checked the ridgeling and found its testicles had not come down.
