simpleMeaning: A common sexually transmitted infection caused by the bacterium Neisseria gonorrhoeae.
  It can cause painful urination and pain around the tube that carries urine out of the body.
scope: This is a common disease caught through sex, also called the clap or gonorrhea.
examples:
- Pain when passing water can be a sign of gonorrhoea.
- Gonorrhoea is spread through sex and is caused by a germ.
