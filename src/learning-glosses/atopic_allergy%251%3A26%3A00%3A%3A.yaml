simpleMeaning: A sudden, harmful answer by the body, showing only minutes after contact in a person already
  made ready to react.
scope: Also called atopy, immediate allergy, or type I allergic reaction, this one is not a slow answer
  that comes days later.
examples:
- The child's atopic allergy appeared only minutes after touching the cat.
- They knew the atopic allergy was at work when the rash came on so fast after the meal.
