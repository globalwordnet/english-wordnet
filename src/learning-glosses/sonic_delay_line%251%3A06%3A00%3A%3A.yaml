senseId: 'sonic_delay_line%1:06:00::'
synsetId: 02678951-n
simpleMeaning: A device that holds a sound back, then sends it on after a wait as long as sound takes
  to cross it.
scope: Also called an acoustic delay line. It is a device.
examples:
- The sonic delay line held the sound back for a split second.
- A sonic delay line in the hall let the far speakers sound in time.
