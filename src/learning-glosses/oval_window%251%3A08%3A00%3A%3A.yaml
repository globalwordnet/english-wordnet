simpleMeaning: An opening into the inner ear to which the base of the tiny stirrup-shaped bone called
  the stapes is attached.
scope: It is also called fenestra of the vestibule, fenestra ovalis, and fenestra vestibuli.
examples:
- The oval window is the opening between the middle ear and the inner ear.
- The small bone rests against the oval window.
