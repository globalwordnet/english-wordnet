simpleMeaning: Said of words that speak straight to a person or a thing that is not there, as if it could
  hear.
scope: It is about a way of speaking, not about a mark used in writing.
examples:
- The speech rose to a passage of apostrophic grandeur.
- The lines turn in apostrophic address to the sea itself, as if it could hear.
