simpleMeaning: A diagram with circles for sets inside a rectangle representing everything under consideration.
  Items shared by sets appear in the area where their circles overlap.
scope: A drawing that uses rings to show groups in maths or logic, also called Venn diagram, with things
  in more than one group where the rings cross.
examples:
- A Venn's diagram uses rings to show groups inside a box shape.
- In a Venn's diagram, things in two groups sit where the rings cross.
