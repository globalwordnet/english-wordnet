simpleMeaning: To bring up mucus from the lungs and expel it through the mouth.
scope: Expectorate, cough out, cough up, and spit up are other names for clearing phlegm from the lungs
  through the mouth, not for saying words in anger or contempt.
examples:
- They spit out the phlegm.
- The phlegm came up, and they spit it out.
