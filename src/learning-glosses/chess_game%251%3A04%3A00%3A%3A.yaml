simpleMeaning: A contest on a board for two people, each moving 16 pieces by set rules, with the aim of
  leaving the other person's king with no move that saves it.
scope: This one is also called chess.
examples:
- They played a chess game every Friday night, and it often ran past midnight.
- The chess game ended when the king had nowhere safe to go.
