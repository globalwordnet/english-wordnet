simpleMeaning: Neodymium, a rare-earth metal with a yellowish tint that commonly forms ions with a charge
  of +3. It occurs with cerium, lanthanum, and praseodymium in monazite and bastnasite.
scope: A metal, also called atomic number 60 and neodymium; not iron and not a rock.
examples:
- Nd is a yellow metal of the rare earth group.
- Nd turns up in monazite rock.
