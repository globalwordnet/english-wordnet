simpleMeaning: The edible seed of the mung bean plant, or food made from that seed.
scope: 'Also called golden gram, green bean, green gram, green soy, mash bean, monggo, moong, mung, or
  munggo: the seed of a bean plant, eaten as food, and food made from that seed; not a red bean and not
  a soy bean.'
examples:
- The mung bean plant bears seeds that are eaten as food.
- Mung beans are soaked before cooking.
