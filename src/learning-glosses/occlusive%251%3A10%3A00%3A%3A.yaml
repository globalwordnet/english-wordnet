senseId: 'occlusive%1:10:00::'
synsetId: 07130622-n
simpleMeaning: A speech sound made when the air is blocked for a moment and then let out in a sudden burst.
scope: Also called a stop, a plosive, a plosive consonant, a plosive speech sound, or a stop consonant.
  It is a noun.
examples:
- The sound 'p' is an occlusive.
- An occlusive stops the air and then lets it out all at once.
