simpleMeaning: A purple or black-and-blue mark that a bruise leaves behind.
scope: This one is not about blood escaping from broken vessels.
examples:
- The ecchymosis on the arm was purple and black-and-blue after the fall.
- The nurse looked at the ecchymosis and asked how the bruise had happened.
