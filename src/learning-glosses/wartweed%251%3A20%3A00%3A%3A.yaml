simpleMeaning: A European plant, fair to look at, whose flowers turn to face the sun.
scope: This plant is also called wartwort, sun spurge, devil's milk, or Euphorbia helioscopia, and it
  is not an ugly plant.
examples:
- A patch of wartweed grew along the path, its flowers facing the sun.
- The wartweed by the fence was in full flower, all its blooms turned to the sun.
