senseId: 'suicide_squeeze%1:04:00::'
synsetId: 00565934-n
simpleMeaning: A baseball play in which the runner waiting on third base runs home at the same moment
  the pitcher lets go of the ball.
scope: It is also called suicide squeeze play; the runner moves before the ball is hit, not after.
examples:
- They tried a suicide squeeze with two outs in the ninth inning.
- The suicide squeeze caught the other team off guard.
