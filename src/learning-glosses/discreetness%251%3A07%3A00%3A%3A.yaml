simpleMeaning: The skill of handling a situation in a quiet, careful way that draws no notice.
scope: This one is also called delicacy, diplomacy, and finesse.
examples:
- The manager's discreetness in handling the complaint kept the matter out of the newspapers.
- The discreetness of the talks helped both sides reach an agreement.
