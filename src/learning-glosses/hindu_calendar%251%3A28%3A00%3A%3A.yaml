simpleMeaning: A calendar using lunar months and the solar year to date Hindu festivals. In many traditions
  a lunar month with no change of solar zodiac sign is an extra month.
scope: Hindu calendars vary by region and tradition. Some follow the solar year alone.
examples:
- The Hindu calendar gives the dates of many festivals.
- In the Hindu calendar used by her family, this year had an extra lunar month.
