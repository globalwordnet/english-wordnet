simpleMeaning: To do with a cuticle, a thin layer of skin on the outside of a plant or animal.
scope: This one is also called dermal, epidermal, or epidermic.
examples:
- The cuticular coat of the leaf stops it drying out in the sun.
- The manicurist trimmed the cuticular skin at the base of the nails.
