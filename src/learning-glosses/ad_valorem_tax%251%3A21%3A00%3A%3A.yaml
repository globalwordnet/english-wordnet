senseId: 'ad_valorem_tax%1:21:00::'
synsetId: 13337744-n
simpleMeaning: A tax charged on the gap between what a thing sells for before this tax and what it cost
  to make.
scope: This one is not charged on the whole selling price.
examples:
- They paid an ad valorem tax on the goods, worked out from the price and the cost of making them.
- The shop worked out the ad valorem tax from the price of the goods and the cost of making them.
