simpleMeaning: A risky bond, typically rated BB or lower, that offers high interest. Companies with weak
  credit may issue it to finance takeovers, including those funded with borrowed money.
scope: It is also called a junk bond.
examples:
- The firm sold high-yield bonds to pay for the takeover.
- Investors bought the high-yield bond despite its low rating.
