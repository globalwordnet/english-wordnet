simpleMeaning: That changes its body form little, or not at all, as it grows.
scope: Also called ametabolic, this one leaves no room for a big change of body form.
examples:
- The ametabolous insect keeps its body form as it grows.
- They watched an ametabolous insect that stayed the same shape.
