simpleMeaning: A network of blood vessels round the bladder takes in deep blood vessels from a small organ
  at the front of the vulva.
scope: These are deep blood vessels, not ones near the surface.
examples:
- Blood from the small organ drained through the venae profundae clitoridis.
- On the scan, the venae profundae clitoridis could be seen joining the network of blood vessels round
  the bladder.
