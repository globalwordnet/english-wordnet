simpleMeaning: A resin from Australian trees that dissolves in alcohol. It is used in varnishes and in
  making paper.
scope: Also called acaroid resin, accroides, accroides gum, accroides resin, and gum accroides, this sticky
  tree stuff from Australia dissolves in alcohol and is used for varnish and paper.
examples:
- Varnish makers melt accaroid resin in alcohol.
- Paper makers use accaroid resin from Australian trees.
