simpleMeaning: A word, phrase, or way of saying a word that belongs only to the states in the bottom half
  of the country.
scope: It is a way of speaking.
examples:
- The word 'y'all' is a southernism heard across the lower states.
- The southernism in their speech told listeners they came from Georgia.
