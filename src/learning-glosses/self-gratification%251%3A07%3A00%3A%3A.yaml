senseId: 'self-gratification%1:07:00::'
synsetId: 04892012-n
simpleMeaning: Letting the wish for pleasures of the senses run free, with no check on it.
scope: Incontinence and dissoluteness are other names for this lack of control over pleasures of the senses,
  not a single act of satisfying one's own desires.
examples:
- His self-gratification showed in the way he chased one pleasure after another.
- Her self-gratification showed in how little she held back from pleasures of the senses.
