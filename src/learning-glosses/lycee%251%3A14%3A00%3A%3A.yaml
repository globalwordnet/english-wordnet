simpleMeaning: A school that takes students after the first school and before college, usually in grades
  9 to 12.
scope: Also called a gymnasium, a lyceum, a middle school, or a secondary school. It is a kind of school.
examples:
- Students start at the lycee when they are fourteen.
- French is taught at the lycee near the station.
