simpleMeaning: A bundle of nerve fibers that carries visual signals farther into the brain after fibers
  from the eyes meet and partly cross.
scope: The optic tract is part of the visual pathway beyond the optic chiasm.
examples:
- The diagram shows the optic tract just beyond the optic chiasm.
- Damage to the optic tract can take away sight in part of what a person sees.
