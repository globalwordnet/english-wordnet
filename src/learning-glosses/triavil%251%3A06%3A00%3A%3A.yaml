simpleMeaning: A brand of medicine that acts as a tranquilizer and antidepressant and is sometimes used
  to prevent vomiting in adults.
scope: Also called perphenazine, this is a calming drug and a drug against low mood, with an extra use
  at times to stop sickness in grown-ups.
examples:
- Triavil calmed him and lifted his mood.
- The doctor gave her Triavil to stop the sickness.
