senseId: 'doula%1:18:00::'
synsetId: 10260721-n
simpleMeaning: A trained birth companion who offers practical and emotional support during labor, including
  encouragement to use techniques learned in childbirth classes.
scope: This is a support person during birth, often the father, not the doctor or nurse who gives medical
  care for the birth.
examples:
- As her doula, he held her hand and reminded her how to breathe.
- The doula stayed with the mother through the long night of labour.
