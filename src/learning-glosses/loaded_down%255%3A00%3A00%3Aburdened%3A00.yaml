simpleMeaning: Under great strain from a lot of work or worry.
scope: It is also called overburdened, bowed down, and weighed down; it does not mean bearing a heavy
  physical weight.
examples:
- They felt loaded down with work after the busy week.
- The carers were loaded down with cares for their patients.
