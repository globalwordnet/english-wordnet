senseId: 'sphacelus%1:19:00::'
synsetId: 11507108-n
simpleMeaning: A patch of living tissue in one place that has died, because infection has killed it or
  because its blood supply has been cut off.
scope: Also called mortification, gangrene, and necrosis. It is a condition.
examples:
- Sphacelus set in after the blood flow to the toe was cut off.
- The doctor warned that sphacelus could follow if the infection was not treated.
