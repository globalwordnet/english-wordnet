simpleMeaning: The quality of deserving contempt because of a lack of moral principles.
scope: This one is also called baseness, sordidness, contemptibility, and despicability.
examples:
- The despicableness of the lie was plain to everyone who heard it.
- The despicableness of the betrayal angered all who heard of it.
