simpleMeaning: Uneven breathing in a newborn, with fast spells followed by pauses; it is believed to be
  linked to sudden infant death syndrome.
scope: Periodic apnea of the newborn is a breathing pattern.
examples:
- The newborn's breathing was uneven, with fast bursts and long pauses.
- The nurse noted periodic apnea of the newborn in the chart.
