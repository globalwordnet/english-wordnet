simpleMeaning: To make a person able in law to do a thing, or to give them the standing the law asks for.
scope: This one is about the law, not about changes in sperm that let them fertilize an egg.
examples:
- The court capacitated the young person to sign the agreement.
- The new rule capacitated them to act for the company.
