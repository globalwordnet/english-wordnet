simpleMeaning: The spending of money got by borrowing, done by a government to get its economy moving
  again.
scope: Also called compensatory spending or deficit spending. It is a noun.
examples:
- The new leaders tried pump priming to lift the country out of hard times.
- Pump priming put borrowed money into roads and schools.
