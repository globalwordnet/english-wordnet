simpleMeaning: Large reddish-brown upper-right abdominal organ that makes bile, processes fats, proteins
  and carbohydrates, produces clotting proteins, converts carotene to vitamin A, detoxifies chemicals
  and helps clear old red blood cells.
scope: This is the body organ, not animal liver sold as food and not a person who lives somewhere.
examples:
- The scan showed a small shadow on her liver.
- Years of heavy drinking had damaged his liver.
