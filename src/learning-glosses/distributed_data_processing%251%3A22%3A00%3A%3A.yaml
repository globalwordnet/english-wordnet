simpleMeaning: Computer processing in which parts of the work take place at different locations connected
  by communication links.
scope: Also called remote-access data processing and teleprocessing. This one is about a kind of computer
  work.
examples:
- The bank uses distributed data processing, with its records kept in three towns.
- With distributed data processing, the offices share the work over the lines between them.
