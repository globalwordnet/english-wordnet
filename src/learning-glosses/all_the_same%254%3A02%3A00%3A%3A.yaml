senseId: 'all_the_same%4:02:00::'
synsetId: 00027761-r
simpleMeaning: It still holds, even when something said before points another way, and most often it comes
  right before giving in.
scope: This word is also called still, however, yet, nevertheless, nonetheless, notwithstanding, withal,
  at the same time, or even so.
examples:
- It was raining hard, but we went out all the same.
- They knew the work was hard, and all the same they took it on.
