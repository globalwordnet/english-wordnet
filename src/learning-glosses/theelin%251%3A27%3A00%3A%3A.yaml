simpleMeaning: Estrone, a relatively weak estrogen produced naturally by mammalian ovaries. A manufactured
  form has been sold as Estronol to treat estrogen deficiency.
scope: Also called estrone and oestrone, this is a feeble sex hormone of females, made by nature in mammal
  ovaries, also made in a lab under the name Estronol, a trade name, and given for low estrogen, where
  estrone is a feeble sex hormone of females from mammal ovaries, made by nature and also in a lab, sold
  as Estronol, given for low estrogen.
examples:
- Theelin treats low estrogen.
- Doctors give theelin for hormone loss.
