simpleMeaning: This muscle pulls a part of the body to the side, away from the line down the middle of
  the body.
scope: This one is also called an abductor.
examples:
- The abductor muscle in their hip moved their leg out to the side.
- They felt the abductor muscle pull when they stepped sideways.
