simpleMeaning: Planes in the sky are what this set of equipment on a ship fires its flying weapons at.
scope: This is a set of equipment on a ship that fires flying weapons at planes in the sky, not a set
  on land that does the same thing, and not a ship's weapons that fire at other ships.
examples:
- The crew trained with the surface-to-air missile system.
- The ship's surface-to-air missile system was ready for use.
