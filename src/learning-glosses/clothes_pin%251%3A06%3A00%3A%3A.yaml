simpleMeaning: A grip of wood or plastic, pressed onto washing to keep it on the line.
scope: This one is about a peg, and clothes peg and clothespin are other names for it.
examples:
- They pinned the wet sheets to the line with wooden clothes pins.
- The clothes pin snapped, and the shirt fell to the ground.
