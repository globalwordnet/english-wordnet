simpleMeaning: A consonant made by blocking the flow of air and then releasing it suddenly.
scope: A stop, a plosive, an occlusive, a plosive consonant, and a stop consonant are other names for
  it.
examples:
- The first sound in 'tin' is a plosive speech sound.
- The plosive speech sound at the start of the word came out with a pop.
