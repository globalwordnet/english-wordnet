simpleMeaning: A vehicle designed to travel in space. A spacecraft in orbit around the Sun is also one
  of its satellites.
scope: A vehicle that can travel in outer space, not an aeroplane that flies in the air and not a balloon
  that floats in the air.
examples:
- The spacecraft carried three astronauts to the moon.
- A new spacecraft will explore the outer planets.
