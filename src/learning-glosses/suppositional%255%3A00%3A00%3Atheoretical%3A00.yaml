simpleMeaning: Having to do with something that rests mostly on guessing, not on solid proof.
scope: It is also called supposed, hypothetical, conjectural, divinatory, hypothetic, suppositious, and
  supposititious.
examples:
- The suppositional claim rested on little more than a guess.
- They treated the suppositional story with care, since no proof backed it.
