simpleMeaning: Epilepsy with seizures that reduce awareness and leave gaps in memory. Arm or leg movements
  often look deliberate, and some people see or hear things that seem real.
scope: An older term for epilepsy involving seizures that affect awareness.
examples:
- During psychomotor epilepsy, he stared blankly and later could not recall what had happened.
- Her psychomotor epilepsy often made her arms move as if she were reaching for something.
