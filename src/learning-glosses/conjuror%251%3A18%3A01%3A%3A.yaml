simpleMeaning: A performer who does magic tricks for people watching, making them laugh and feel wonder.
scope: Also called a conjurer, an illusionist, a magician, or a prestidigitator; it is not the witch doctor
  of the other sense of the same word.
examples:
- The conjuror pulled a rabbit out of a hat, and the children laughed.
- We watched the conjuror make coins vanish from a hat.
