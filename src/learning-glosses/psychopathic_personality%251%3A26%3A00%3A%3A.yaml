senseId: 'psychopathic_personality%1:26:00::'
synsetId: 14411544-n
simpleMeaning: An older term for a personality disorder marked by little feeling or conscience, in which
  someone might hurt others without guilt.
scope: Historical texts also used “sociopathic personality.” Modern antisocial personality disorder has
  its own diagnostic criteria.
examples:
- The report described the prisoner as having a psychopathic personality.
- Older psychiatric texts often used the term psychopathic personality for this condition.
