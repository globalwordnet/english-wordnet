simpleMeaning: A national and official language of Pakistan with a literary tradition, closely related
  to Hindi, widely used in India, especially by Muslims, and written in a form of Arabic script.
scope: Also called Urdu; the set book tongue of Pakistan, close kin to Hindi and written in Arabic letters,
  not Hindi itself.
examples:
- She studied the Urdu language at school.
- He speaks Urdu language with his grandparents.
