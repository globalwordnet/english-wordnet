simpleMeaning: A bend or lean of an organ or body part toward the back.
scope: Also called retroflexion and retroversion. It is a movement, not a way of shaping sounds with the
  tongue.
examples:
- Retroflection of the uterus can be seen on a scan.
- The doctor noted the retroflection of the organ.
