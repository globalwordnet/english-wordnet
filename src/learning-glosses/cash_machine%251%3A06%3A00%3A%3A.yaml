simpleMeaning: A device outside some banks pays out money on its own to a person who puts in a card with
  a number only its owner knows.
scope: Automated teller, automated teller machine, automatic teller, automatic teller machine, cash dispenser,
  and ATM are other names for this one.
examples:
- The cash machine by the station gave them fifty pounds.
- They stopped at a cash machine to get money for the taxi.
