simpleMeaning: A unit of information based on logarithms to base ten. Choosing one of ten equally likely
  possibilities gives one hart of information.
scope: Not a bit or a nat; also called ban, dit and hartley.
examples:
- The Hart counts information in tens, not in twos.
- One Hart is the same as one ban.
