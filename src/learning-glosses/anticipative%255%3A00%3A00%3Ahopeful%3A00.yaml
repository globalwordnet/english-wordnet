simpleMeaning: To do with looking forward eagerly to something that has not happened yet.
scope: Also called expectant or anticipant, this word is not about how someone feels after something has
  happened.
examples:
- They sat in anticipative silence while the judges read out the scores.
- Their anticipative smiles showed how much they looked forward to the trip.
