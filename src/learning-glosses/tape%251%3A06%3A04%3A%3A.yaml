simpleMeaning: A long, thin strip of plastic coated with iron oxide, used to record sound and video or
  store computer data.
scope: A long thin strip of plastic used to hold sounds, pictures, or computer files, not the strip used
  to measure lengths.
examples:
- He took a dozen tapes to record the interview.
- The film was kept on tape in the archive.
