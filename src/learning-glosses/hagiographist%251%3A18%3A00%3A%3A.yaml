senseId: 'hagiographist%1:18:00::'
synsetId: 10175252-n
simpleMeaning: A person who writes an account of someone's life that praises them highly, or shows them
  as better than they were.
scope: This person is also called a hagiographer, or a hagiologist.
examples:
- The hagiographist described the saint as a person without a single fault.
- In the hagiographist's book, the subject comes across as perfect in every way.
