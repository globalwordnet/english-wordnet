senseId: 'coefficient_of_expansion%1:23:00::'
synsetId: 13609828-n
simpleMeaning: The share by which a thing grows in length, in area, or in bulk for each degree the temperature
  changes, while the pressure stays the same.
scope: This one is also called expansivity.
examples:
- The book lists the coefficient of expansion for iron and steel.
- They checked the coefficient of expansion before choosing the metal.
