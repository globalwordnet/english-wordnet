simpleMeaning: A woman who sells sex for money.
scope: Also called a whore, a tart, a prostitute, a harlot, a cocotte, a cyprian, a fancy woman, a lady
  of pleasure, a sporting lady, a woman of the street, or a working girl, this one is about a woman.
examples:
- The bawd waited by the door for customers with money to spend.
- In the old play, a bawd ran the house where the sailors drank.
