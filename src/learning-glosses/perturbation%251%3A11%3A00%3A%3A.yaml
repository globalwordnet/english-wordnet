simpleMeaning: A disturbance caused by something going wrong, interfering or interrupting normal activity.
scope: An activity that breaks in and disturbs things, also called a disturbance; not a troubled state
  of mind and not a small physical influence.
examples:
- The perturbation in the signal cut the broadcast short.
- Any perturbation of the network slows the whole system.
