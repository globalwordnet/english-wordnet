senseId: 'alcoholize%2:30:01::'
synsetId: 00139728-v
simpleMeaning: To soak a thing in the liquid in wine and beer that makes people drunk, or put that liquid
  into it.
scope: Also called alcoholise. It is not about making the liquid inside a thing by fermenting.
examples:
- Alcoholize the fruit and let them sit in the refrigerator.
- The cook alcoholized the cherries before baking the cake.
