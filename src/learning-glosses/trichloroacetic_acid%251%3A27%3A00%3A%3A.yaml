simpleMeaning: A strong acid derived from acetic acid, with three chlorine atoms in each molecule.
scope: Also called trichloracetic acid, this strong, sour chemical is made by adding atoms of a chemical
  to another sour chemical, not by leaving that chemical as it is.
examples:
- They poured trichloroacetic acid into the water to make it more acid.
- They wore gloves when they used the trichloroacetic acid because it is a strong acid.
