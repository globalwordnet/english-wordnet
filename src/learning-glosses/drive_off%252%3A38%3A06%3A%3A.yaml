simpleMeaning: To force someone or something to leave, or to make a feeling or thought disappear.
scope: This one is also called dispel, chase away, drive away, drive out, run off, and turn back.
examples:
- The farmer used noise to drive off the crows from the field.
- The speaker tried to drive off doubts before the talk.
