simpleMeaning: Said of things made to set sizes and sold ready from a shop, most of all for clothes, not
  cut for one person.
scope: Also called off-the-peg, off-the-shelf, or ready-to-wear. It is an adjective.
examples:
- They found an off-the-rack dress that fit well.
- They bought off-the-rack shirts for work.
