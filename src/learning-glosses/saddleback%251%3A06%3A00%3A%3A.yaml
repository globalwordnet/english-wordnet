senseId: 'saddleback%1:06:00::'
synsetId: 03414501-n
simpleMeaning: A roof with a high ridge down its middle and a gable at each end, its two sides sloping
  away.
scope: Its ridge runs between gables at the ends, also called a gable roof, a saddle roof, or a saddleback
  roof, not a pass between two peaks.
examples:
- The saddleback sloped down on both sides.
- Rain ran off both sides of the saddleback.
