simpleMeaning: A statistical method for predicting the value of one variable from the value of another.
scope: 'It does more than note that two things move together: it uses the figures of one to work out the
  figures of the other.'
examples:
- A regression analysis worked out the missing figures from the figures we had.
- With a regression analysis, the figures for one thing came out of the figures for another.
