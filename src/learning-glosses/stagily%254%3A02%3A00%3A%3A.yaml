simpleMeaning: In an artificial way, full of mannerisms, like someone performing for an audience.
scope: Also called theatrically. It is an adverb for how someone acts.
examples:
- They waved their arms stagily and bowed to the empty room.
- The actor spoke stagily, pausing after every word for effect.
