simpleMeaning: An equation relating observed values of y to selected values of x. It predicts a typical
  value of y for a given x.
scope: Also called regression equation, foretelling y's likeliest values, this maths statement lays out
  how chosen values from one thing, called x, go with noted values from the other thing, y.
examples:
- The regression of y on x foretells y's likeliest values.
- Regression of y on x shows the link between chosen values of x and noted values of y.
