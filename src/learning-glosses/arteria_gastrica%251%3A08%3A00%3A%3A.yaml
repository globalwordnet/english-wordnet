simpleMeaning: Any of the arteries that carry blood to the walls of the stomach.
scope: Also called gastric artery, these are not vessels that carry blood away from the walls of the stomach.
examples:
- Blood reached the walls of the stomach through the arteria gastrica.
- They tied off the arteria gastrica during the operation.
