simpleMeaning: The glass pane at the front of a store, facing the street, put there so people passing
  by can see what is for sale inside.
scope: Also called shopwindow, display window, and show window. It is a noun.
examples:
- The shop window showed the new winter coats.
- They stopped to look at the toys in the shop window.
