simpleMeaning: A beta blocker, a drug that slows the heart, that can slow heart failure getting worse
  in people whose disease is still in its early stages.
scope: This one is about a drug for the heart.
examples:
- The doctor prescribed carvedilol after the patient's heart began to fail.
- They stayed on carvedilol, and the heart failure did not get any worse.
