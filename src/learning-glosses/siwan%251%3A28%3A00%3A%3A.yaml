simpleMeaning: A Jewish calendar month falling in May and June, ninth in the civil year and third in the
  religious year.
scope: A month of the Jewish calendar, also called Sivan, ninth in the civil year and third in the church
  year, not any other month of the year.
examples:
- Siwan falls in May and June.
- Siwan is the ninth month of the civil year.
