simpleMeaning: A gentle phrase for death, picturing it as someone lying in bed, and lying in a grave.
scope: This one is also called rest, sleep and quietus, and its same-batch mate is eternal sleep.
examples:
- They spoke of eternal rest when the old man died.
- The stone was carved with words of eternal rest.
