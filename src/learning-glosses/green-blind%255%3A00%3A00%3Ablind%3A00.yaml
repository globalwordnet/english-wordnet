senseId: green-blind%5:00:00:blind:00
synsetId: 02167202-s
simpleMeaning: Being unable to make out the colour of grass, or to tell it from a red that leans toward
  purple.
scope: This sense is also called deuteranopic.
examples:
- A green-blind person cannot tell the green thread from the purplish-red thread.
- Green-blind people may find it hard to tell green leaves from purplish-red berries.
