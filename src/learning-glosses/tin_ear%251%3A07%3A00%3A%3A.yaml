simpleMeaning: A lack of feeling for what fits well in words, or for the fine shades of what words mean.
scope: It is about words, not about telling one note from another.
examples:
- He has a tin ear for dialogue.
- A tin ear kept the new writer from hearing how rude the words sounded.
