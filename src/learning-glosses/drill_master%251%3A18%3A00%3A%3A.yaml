senseId: 'drill_master%1:18:00::'
synsetId: 10053745-n
simpleMeaning: A noncommissioned officer responsible for teaching recruits military marching and discipline.
scope: An officer of lower rank who teaches new soldiers to march and to follow orders; drill instructor
  is another name for this sense, not a general and not a civilian teacher.
examples:
- The drill master taught the recruits to march in step.
- Our drill master made the new soldiers march for hours.
