simpleMeaning: A hawthorn of the southern United States whose leaves have lobes arranged along both sides
  of a central rib.
scope: Also called parsley-leaved thorn, Crataegus apiifolia, or Crataegus marshallii. It is a tree.
examples:
- The parsley haw grows wild across the southern United States.
- They planted a parsley haw at the edge of the yard.
