senseId: 'blab_out%2:32:00::'
synsetId: 00939238-v
simpleMeaning: To say aloud a thing that others wanted kept quiet.
scope: Also called talk, sing, peach, babble, blab, tattle, babble out, let the cat out of the bag, and
  spill the beans, this one names an action.
examples:
- They blabbed out the surprise before the party even started.
- Be careful what you say around them — they blab out everything they hear.
