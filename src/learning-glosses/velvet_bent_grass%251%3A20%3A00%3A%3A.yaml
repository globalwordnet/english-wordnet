simpleMeaning: Its stems are thin and its leaves are narrow, and this grass grows in many places.
scope: People also call this one velvet bent, brown bent, dog bent, Agrostis canina, or Rhode Island bent,
  and it is not one with thick stems or wide leaves.
examples:
- They planted velvet bent grass around the pond for its fine leaves.
- The velvet bent grass on the bank was mown short every week.
