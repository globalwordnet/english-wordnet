simpleMeaning: A North American shrub that lives for years and has rough, tongue-shaped leaves and pale
  blue to purple flowers.
scope: A North American shrub with rough leaves and pale blue to purple flowers, not the hound's-tongue
  of Europe and western Asia with dark reddish-purple flowers.
examples:
- Hound's-tongue grew by the fence with pale blue flowers.
- The hound's-tongue leaves felt rough to the touch.
