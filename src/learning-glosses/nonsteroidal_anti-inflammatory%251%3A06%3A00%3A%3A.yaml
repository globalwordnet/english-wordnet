simpleMeaning: A drug that brings down swelling and soreness and has no steroids, body chemicals related
  to hormones, in it.
scope: Also called nonsteroidal anti-inflammatory drug and NSAID. It is a noun.
examples:
- The doctor gave them a nonsteroidal anti-inflammatory for the sore knee.
- A nonsteroidal anti-inflammatory eased the swelling in their ankle.
