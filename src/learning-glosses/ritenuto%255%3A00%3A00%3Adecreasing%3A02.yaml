simpleMeaning: A musical direction to slow down or hold the tempo back, usually immediately.
scope: Also called rallentando, rit., and ritardando. It is an adjective.
examples:
- The choir sang the last verse ritenuto, slower with each line.
- Mark the ending ritenuto, so the music eases off bit by bit.
