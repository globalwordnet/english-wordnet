simpleMeaning: The mark a person who tells what will happen next leaves on words or ways.
scope: Words or ways like a prophet's or like a prophecy are also called divinatory, mantic, sibylline,
  vatic and vatical.
examples:
- She gave a sibyllic answer to the question.
- The old priest spoke in a sibyllic tone.
