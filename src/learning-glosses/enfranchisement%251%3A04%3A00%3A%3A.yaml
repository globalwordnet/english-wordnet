senseId: 'enfranchisement%1:04:00::'
synsetId: 01142151-n
simpleMeaning: Giving a person a right, or putting in writing that they hold it.
scope: This one is also called certification, and it is not a right that a government grants.
examples:
- The enfranchisement of new voters took place before the election.
- Their enfranchisement gave them a voice in the town's affairs.
