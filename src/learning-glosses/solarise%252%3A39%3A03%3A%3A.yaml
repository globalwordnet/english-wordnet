senseId: 'solarise%2:39:03::'
synsetId: 02118916-v
simpleMeaning: To reverse some light and dark tones in a photographic negative or print by briefly exposing
  it to light, then washing and redeveloping it to produce distinct outlines.
scope: This sense is also called solarize.
examples:
- They solarise the print, turning back some tones.
- Solarise the film to bring in sharp rims.
