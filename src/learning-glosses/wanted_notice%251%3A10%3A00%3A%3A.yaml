simpleMeaning: A body that keeps the law puts this notice out in public when it wants to ask a person
  questions or take them in.
scope: This is also called a wanted poster, and it is not a private note.
examples:
- A wanted notice on the wall said the police wanted to question the person named in it.
- The wanted notice was read out in the town square, naming a person the police wanted to arrest.
