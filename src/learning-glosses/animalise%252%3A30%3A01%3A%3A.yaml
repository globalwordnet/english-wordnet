senseId: 'animalise%2:30:01::'
synsetId: 00113860-v
simpleMeaning: To strip someone of feeling and of the qualities that make people human, so that they act
  with cruelty.
scope: Also called animalize, brutalize, or brutalise, this is about making someone else cruel, not about
  growing cruel oneself.
examples:
- Life in the camps had animalised him.
- The cruel regime animalised its prisoners until they showed no pity.
