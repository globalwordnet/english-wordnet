simpleMeaning: A nonbarbiturate general anesthetic and sedative injected into veins or muscles, mainly
  in veterinary medicine or minor surgery for children and older adults. Large doses can cause PCP-like
  hallucinations.
scope: Also called ketamine and ketamine hydrochloride; a sleep drug and calmer, not a barbiturate and
  not a pain drug.
examples:
- The vet gave the dog Ketalar before the operation.
- Ketalar was used for the child's minor surgery.
