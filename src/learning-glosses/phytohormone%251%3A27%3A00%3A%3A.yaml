simpleMeaning: In botany, a thing made by a plant that acts like a chemical in the body that tells parts
  how to grow and work.
scope: Also called growth regulator and plant hormone. It is a thing.
examples:
- The phytohormone made the cuttings grow roots faster.
- A phytohormone tells the plant's cells when to grow and when to rest.
