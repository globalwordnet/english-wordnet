simpleMeaning: Amusing on purpose, with a sly edge, said as a joke rather than straight.
scope: Also called bantering and facetious. It is an adjective for a way of speaking.
examples:
- The teacher's tongue-in-cheek advice made the class laugh.
- The tongue-in-cheek note on the board made everyone smile.
