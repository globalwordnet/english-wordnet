simpleMeaning: A vaccine that protects against disease caused by certain types of pneumococcal bacteria.
  The Pneumovax 23 vaccine covers 23 types.
scope: Other pneumococcal vaccines cover different sets of types.
examples:
- The nurse gave him a pneumococcal vaccine.
- She asked which types of pneumococcal bacteria her vaccine covered.
