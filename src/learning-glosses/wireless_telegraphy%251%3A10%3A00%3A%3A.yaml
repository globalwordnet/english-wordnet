simpleMeaning: The sending of coded messages by radio waves rather than along cables.
scope: Also called radiotelegraph and radiotelegraphy. It is a system, not a single use.
examples:
- Wireless telegraphy lets ships send messages with no cable at all.
- The station used wireless telegraphy to pass on the news.
