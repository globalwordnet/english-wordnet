senseId: 'tacit_consent%1:10:00::'
synsetId: 06701870-n
simpleMeaning: Approval of someone's wrongdoing inferred from their conduct or silence in the circumstances.
scope: In law, this is also called connivance or secret approval.
examples:
- The manager said nothing while the rule was broken, and that silence was tacit consent.
- By looking away, the officer gave tacit consent to the theft.
