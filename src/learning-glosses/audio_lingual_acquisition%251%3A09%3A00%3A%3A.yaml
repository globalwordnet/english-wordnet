simpleMeaning: A way of learning a language that puts all its focus on listening and speaking.
scope: This sense is about how a language is learned, not about the language itself.
examples:
- The course used audio lingual acquisition, so the class spent most of its time listening and speaking.
- With audio lingual acquisition, the first lessons were all listening and speaking.
