senseId: 'gag_order%1:10:00::'
synsetId: 06569576-n
simpleMeaning: A court order that limits what people taking part in a legal case may say about it or make
  public.
scope: It can restrict comments by lawyers or other participants in the case.
examples:
- The judge issued a gag order limiting what the lawyers could tell reporters about the trial.
- The lawyers waited until the gag order was lifted before discussing the evidence publicly.
