simpleMeaning: Thoughts that wander while you are awake and not paying attention.
scope: Daydream, reverie, daydreaming, revery, castle in the air, oneirism and castle in Spain are other
  names for this sense, and it is not a dream that comes in sleep.
examples:
- They built air castles about a house by the sea instead of listening to the lesson.
- Their air castle of becoming a famous singer faded when the bell rang.
