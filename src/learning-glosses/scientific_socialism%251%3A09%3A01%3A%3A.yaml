simpleMeaning: A form of socialism associated with Marxism that sees economic forces and class struggle
  as driving society toward socialist goals, often through violent change.
scope: Of Marxian socialism, built on the belief that past forces decide the winning of socialist goals.
examples:
- Scientific socialism trusts historical forces.
- Scientific socialism seeks socialist goals by violent means.
