simpleMeaning: Where two different metals join, a voltage appears, the push that moves a current.
scope: It joins two different metals, not two pieces of the same metal.
examples:
- They joined the two metals with a thermojunction and watched for the voltage.
- The thermojunction gave a voltage when the two metals met.
