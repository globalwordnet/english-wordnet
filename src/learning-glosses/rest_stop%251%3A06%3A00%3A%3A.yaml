simpleMeaning: A paved place at the side of a main road, where a car can pull in for a short break before
  going on.
scope: Also called rest area, lay-by, layby and pull-off, this is a paved place beside a main road where
  cars pull in for a short break, not a place where a car is left for a long time.
examples:
- The family used the rest stop for a short break.
- A rest stop gave them a place to pull in for a short time.
