simpleMeaning: A hard outer layer, most often of stone or brick, that holds up a bank of earth.
scope: Also called revetment or stone facing, this is what holds up a bank of earth from the outside.
examples:
- The bank stood firm behind its revetement.
- A revetement of stone ran along the bank.
