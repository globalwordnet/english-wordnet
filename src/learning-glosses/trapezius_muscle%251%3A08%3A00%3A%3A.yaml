simpleMeaning: One of a pair of flat, three-sided muscles that lie over the shoulder and upper back and
  help move the shoulders and arms.
scope: This sense is also called trapezius, cowl muscle, and musculus trapezius, and it is about a part
  of the shoulder and upper back.
examples:
- They felt a pull in their trapezius muscle after lifting the box.
- The trapezius muscle helps raise the shoulders when you shrug.
