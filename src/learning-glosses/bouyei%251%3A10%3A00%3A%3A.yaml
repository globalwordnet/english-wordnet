simpleMeaning: Tai language branch on the Guizhou-Yunnan plateau, mainly southern/southwestern Guizhou’s
  Buyi-Miao and Miao-Dong autonomous prefectures and Zhenning and Guanling counties, plus Yunnan’s Luoping
  and Sichuan’s Ningnan and Huidong counties.
scope: Also called Buyi and Yay; one branch of the Tai languages, not the other Tai branches of the same
  area.
examples:
- Bouyei is spoken in Guizhou.
- Many Bouyei speakers live in southwest China.
