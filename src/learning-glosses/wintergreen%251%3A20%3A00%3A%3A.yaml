simpleMeaning: One of several kinds of plant in the group called Pyrola, a plant that keeps its leaves
  through the year and comes back year after year.
scope: This plant is also called pyrola, and it is not the spicy red berrylike fruit that shares its name.
examples:
- The wintergreen in the north bed keeps its leaves all year and comes back each spring.
- The gardener chose wintergreen for the shady corner, one of the Pyrola plants that return year after
  year.
