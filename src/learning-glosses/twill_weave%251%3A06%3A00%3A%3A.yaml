simpleMeaning: Cloth made with this weave shows raised lines running slantwise side by side.
scope: Also called twill, this name is for a way of making cloth, not for one that leaves the cloth smooth.
examples:
- The twill weave of the jacket showed raised lines running slantwise.
- They chose a twill weave for the cloth because of its raised lines.
