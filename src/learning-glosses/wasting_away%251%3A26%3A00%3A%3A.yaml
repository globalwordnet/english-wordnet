simpleMeaning: A part of the body getting smaller because illness or lack of use has made it shrink.
scope: Also called wasting and atrophy. It is a change in the body.
examples:
- The muscle began wasting away after months without use.
- Doctors watched the organ wasting away as the illness went on.
