simpleMeaning: In golf, the ground is hit by the club head before the ball, making a poor stroke.
scope: This is a poor golf stroke in which the club head hits the ground before the ball, and not a clean
  hit on the ball itself.
examples:
- The sclaff came from the club head striking the ground first.
- After the sclaff, the golfer took the next stroke with more care.
