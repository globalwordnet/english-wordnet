synsetId: 04930201-n
simpleMeaning: The tendency for traits to be inherited together when their genes lie on the same chromosome.
  Nearby genes are less likely to be separated when chromosomes exchange segments.
scope: Gene linkage concerns the inheritance of traits whose genes are on the same chromosome.
examples:
- Linkage explains why the two traits appear together.
- The genes showed linkage on the same chromosome.
