senseId: 'chimerical%3:01:00::'
synsetId: 02704984-a
simpleMeaning: Said of a thing that is a chimera, a made-up creature with parts of different animals,
  or like one, or has to do with one.
scope: Also called chimeral and chimeric. It is an adjective.
examples:
- The chimerical city in the book floated above the clouds.
- The chimerical garden in the story mixed desert flowers with snow-covered trees.
