senseId: 'stop-loss_order%1:10:00::'
synsetId: 06542403-n
simpleMeaning: An instruction to a broker to sell when a security falls to a set price or to buy when
  it rises to a set price.
scope: This sense is also called stop order.
examples:
- The stop-loss order sold the shares as soon as the price fell to the set level.
- A stop-loss order was placed to buy if the price rose to the set level.
