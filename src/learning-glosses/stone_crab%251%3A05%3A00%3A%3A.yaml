simpleMeaning: A big sea animal with a hard shell and claws, eaten as food, found along the south coast
  of America, most of all in Florida.
scope: It is also called Menippe mercenaria. It is the whole animal, not only its flesh.
examples:
- They caught stone crabs off the Florida coast.
- They saw a stone crab walking on the sand near the water.
