senseId: 'systematisation%1:04:00::'
synsetId: 01011132-n
simpleMeaning: The act of setting things out by a fixed scheme or a clear reason.
scope: Also called systematization, rationalization, and rationalisation. It is an act, not a finished
  plan.
examples:
- The systematisation of the library took a year, but now every book has its place.
- Good systematisation helps workers find what they need without delay.
