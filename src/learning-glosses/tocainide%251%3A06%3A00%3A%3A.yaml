senseId: 'tocainide%1:06:00::'
synsetId: 04451052-n
simpleMeaning: A medicine sold as Tonocard that treats irregular rhythms in the heart's lower chambers
  when safer medicines have failed.
scope: Also called Tonocard, this is a drug kept as a later choice for an uneven heartbeat, not as a first
  choice.
examples:
- They were given tocainide after safer drugs had failed to steady the heartbeat.
- They took tocainide to keep the lower rooms of the heart beating in step.
