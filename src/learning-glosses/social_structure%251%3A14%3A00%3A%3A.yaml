senseId: 'social_structure%1:14:00::'
synsetId: 08395550-n
simpleMeaning: People in a community, looked at as a whole that is put together by the fixed ways its
  members link with each other.
scope: Also called structure, social organisation, social organization, and social system. It is the people
  of a community.
examples:
- The social structure of the village shapes who talks to whom.
- In that social structure, elders hold the most respect.
