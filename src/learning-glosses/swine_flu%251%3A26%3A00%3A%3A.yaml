simpleMeaning: A contagious respiratory illness in pigs caused by influenza viruses. Some strains are
  related to the virus responsible for the 1918 flu pandemic.
scope: Also called swine influenza, this is a sickness of pigs, not a sickness of people.
examples:
- The swine flu hit the pigs' breathing tubes.
- Many pigs caught the swine flu.
