simpleMeaning: The medical study of serum, especially blood serum and what it can reveal about disease.
scope: This branch of medicine works with the clear fluids from blood, and it looks most closely at those
  fluids and at sickness.
examples:
- The serology lab tested the blood sample for signs of past sickness.
- A serology test can show whether the blood holds signs of an old sickness.
