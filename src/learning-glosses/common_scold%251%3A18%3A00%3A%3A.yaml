synsetId: 10581289-n
simpleMeaning: Someone, above all a woman, who keeps finding fault with people and annoys them by doing
  it all the time.
scope: Scold, nag, nagger, and scolder are other names for this thing.
examples:
- The common scold next door found fault with the noise, the garden, and the children's games.
- She was known as the common scold of the street, always picking at her neighbours' faults.
