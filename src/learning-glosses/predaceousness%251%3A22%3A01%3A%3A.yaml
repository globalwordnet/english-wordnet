simpleMeaning: The quality of an animal, often a bird, that lives by catching and eating other live animals.
scope: It is also called predaciousness, rapaciousness, or rapacity. It is a quality of an animal that
  hunts, not of one that eats plants.
examples:
- The predaceousness of the hawk showed in the way it hunted small birds.
- Owls are known for their predaceousness at night.
