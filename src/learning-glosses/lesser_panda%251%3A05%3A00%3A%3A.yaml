simpleMeaning: A reddish-brown, raccoon-like Asian mammal in the carnivore order that eats mostly bamboo.
  It belongs to a different family from the giant panda.
scope: Another name for the red panda. The giant panda belongs to the bear family.
examples:
- The lesser panda in the picture looked much like a raccoon.
- The lesser panda stripped leaves from a bamboo stem.
