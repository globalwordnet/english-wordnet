simpleMeaning: Used of a thing that can be made into a gas.
scope: Also called evaporable, vaporific, vapourific, vapourisable, volatilisable, and volatilizable.
  It is used of a thing, not of a gas itself.
examples:
- The vaporizable oil became a gas and filled the room.
- A vaporizable cleaner should be kept in a closed bottle.
