simpleMeaning: The front part of a horse's back foot has a crack in it.
scope: This is a split at the front of a horse's back foot, not one on a front foot and not one further
  back on the leg.
examples:
- They found a toe crack on the front of the horse's back foot.
- The front of the horse's back foot was split by a toe crack.
