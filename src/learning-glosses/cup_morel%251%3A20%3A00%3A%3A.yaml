simpleMeaning: A morel with a cup- or saucer-shaped fruiting body up to 20 centimeters across. Its fertile
  inner surface has wrinkles radiating from the center. Inedible mushrooms can look similar.
scope: A cup-shaped fungus with a wrinkled inner surface. Its resemblance to other fungi makes visual
  identification unreliable.
examples:
- The guide pictured a cup morel.
- Its wrinkled inner surface gave the cup morel its distinctive appearance.
