senseId: 'precipitateness%1:07:00::'
synsetId: 05067645-n
simpleMeaning: The quality of happening in great haste or without warning.
scope: It is also called suddenness, abruptness, precipitance, precipitancy, or precipitousness. It is
  a quality of how something happens, not how steep a slope is.
examples:
- The precipitateness of the storm caught the town off guard.
- They were shocked by the precipitateness of the decision to leave.
