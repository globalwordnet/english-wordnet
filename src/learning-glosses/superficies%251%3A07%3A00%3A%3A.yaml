simpleMeaning: A thing may be quite different within, but this word covers only its outer look.
scope: This is the name for a thing's outer look.
examples:
- The audience loved the play for its story, not for the superficies of the show.
- Do not be fooled by the superficies of a place; look at what goes on inside it.
