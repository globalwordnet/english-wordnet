senseId: 'thermohydrometric%3:01:00::'
synsetId: 03014539-a
simpleMeaning: To do with measuring how heavy liquids are for their size when they are heated.
scope: Also called thermogravimetric. It is not about weighing things as they are heated.
examples:
- The thermohydrometric reading changed as the liquid warmed up.
- They used a thermohydrometric gauge to check the liquid at different heats.
