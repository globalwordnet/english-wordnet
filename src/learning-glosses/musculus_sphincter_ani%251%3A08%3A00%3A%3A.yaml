simpleMeaning: The ring of flesh around the body's back opening that tightens to hold waste in and loosens
  to let it out.
scope: It is also called anal sphincter and sphincter ani.
examples:
- The musculus sphincter ani tightens to hold waste inside the body.
- The doctor tested how well the musculus sphincter ani could close.
