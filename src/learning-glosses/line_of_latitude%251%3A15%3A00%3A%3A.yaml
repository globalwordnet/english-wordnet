simpleMeaning: An imaginary circle round the Earth, at the same distance from the equator all the way
  round.
scope: It is also called a parallel; latitude and a parallel of latitude are other names for it.
examples:
- The tropic is a line of latitude south of the equator.
- They sailed south until they crossed a new line of latitude.
