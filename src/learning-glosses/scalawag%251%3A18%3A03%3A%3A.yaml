simpleMeaning: A disparaging name for a white Southerner who supported Reconstruction policies after the
  American Civil War, often seen as acting for personal gain.
scope: A white Southerner who backed the rebuilding after the Civil War, usually for gain; also called
  scallywag; not a cheating, lying rogue who cannot be trusted.
examples:
- Their scalawag voted with the North.
- The scalawag held office for years.
