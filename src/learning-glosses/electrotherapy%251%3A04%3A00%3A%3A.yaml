simpleMeaning: The use of electricity on the body as a medical treatment, for example for some forms of
  paralysis.
scope: This one is also called electric healing, electrical healing and galvanism.
examples:
- The doctor ordered electrotherapy for a stiff shoulder.
- The electrotherapy was tried after the medicine failed to help.
