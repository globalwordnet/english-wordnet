simpleMeaning: In music, the note that comes sixth in a major or minor scale, which is also the third
  note below the tonic, the first note of the scale.
scope: It is one note of a scale.
examples:
- The singer held the submediant a little longer than the rest.
- They played the submediant after the fifth note.
