simpleMeaning: A person whose body stays small and childlike, yet who thinks and learns as other people
  do.
scope: Also called ateleiosis, this is about the body, not about the mind.
examples:
- They lived with ateliosis, which kept their body small, but they learned as quickly as anyone.
- The doctor said ateliosis would not hold back their mind.
