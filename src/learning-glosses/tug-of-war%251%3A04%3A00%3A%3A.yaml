simpleMeaning: A hard struggle in which the groups on each side are so evenly matched that neither can
  win.
scope: It is not a game in which teams pull a rope in opposite directions.
examples:
- The two parties were locked in a tug-of-war over the budget.
- Their tug-of-war over the land lasted for years.
