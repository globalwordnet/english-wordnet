simpleMeaning: Describing something that has to do with the study of things from long ago that people
  dig out of the ground.
scope: Also called archaeological, archeological, and archaeologic, this one is not about the digging
  itself.
examples:
- The archeologic dig uncovered walls under the field.
- The archeologic discovery made the front page of every paper.
