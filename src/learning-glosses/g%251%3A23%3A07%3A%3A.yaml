simpleMeaning: A unit equal to standard gravitational acceleration, used to express the load felt by a
  person or object during acceleration.
scope: A load of 3 g makes a pilot feel three times as heavy as usual.
examples:
- The pilot felt 3 g in the sharp turn.
- At 5 g, the test pilot could barely lift his arm.
