simpleMeaning: A person who sends messages by telegraph, often using Morse code.
scope: Also called a telegraph operator or a telegrapher. The job is done at the sending end, not the
  receiving end.
examples:
- The telegraphist relayed the message to the next station.
- The telegraphist worked through the night during the storm.
