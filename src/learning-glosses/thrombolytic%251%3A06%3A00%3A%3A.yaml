senseId: 'thrombolytic%1:06:00::'
synsetId: 04436303-n
simpleMeaning: A drug that can break up clots blocking the flow of blood to the heart muscle.
scope: This is also called a clot buster and a thrombolytic agent, and it is not a drug that stops clots
  from forming.
examples:
- They gave a thrombolytic to break up the clot blocking blood to the heart muscle.
- A thrombolytic broke up the clot and let blood reach the heart muscle again.
