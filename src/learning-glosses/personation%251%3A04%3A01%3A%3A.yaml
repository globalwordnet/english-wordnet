simpleMeaning: Playing a role on stage, showing the character in a dramatic way through words, movements,
  and gestures.
scope: Also called portrayal, characterization, and enactment. It is an act.
examples:
- Their personation of the queen drew applause.
- Their personation of the old sailor made the play come alive.
