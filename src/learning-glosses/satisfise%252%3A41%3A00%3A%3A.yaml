senseId: 'satisfise%2:41:00::'
synsetId: 02374122-v
simpleMeaning: To stop looking once a way of reaching a goal does no more than the least that is asked,
  and to keep to that way.
scope: Also called satisfice, it takes the first way that works instead of seeking the best way of all.
examples:
- They agreed to satisfise and use the plan that met the least the goal asked for.
- When the plan was good enough, the team chose to satisfise and follow it through.
