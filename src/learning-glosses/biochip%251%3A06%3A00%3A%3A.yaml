simpleMeaning: A microchip that uses tiny DNA strands to bind and quickly recognize thousands of genes
  at once. It is designed for use in a biological environment.
scope: This tiny electronic part uses small bits of DNA to spot thousands of genes at once, and it is
  made for use with living matter, not for a computer on its own.
examples:
- The biochip spotted thousands of genes at once.
- A biochip uses small bits of DNA to catch genes.
