simpleMeaning: The lean flesh of a fish caught in warm waters off the southern Atlantic coast of the United
  States.
scope: Warm southern waters give this fish, also called porgy, and it is not the flesh of the same fish
  from colder northern waters.
examples:
- The fishmonger sold fresh scup caught off the southern coast.
- The lean scup on the plate came from warm southern waters.
