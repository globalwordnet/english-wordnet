simpleMeaning: Said of a thing that has to do with an opening in an early embryo that leads into the hollow
  that becomes its gut.
scope: Also called blastoporic. It is about an opening.
examples:
- The blastoporal opening is the way into the young gut.
- They traced the blastoporal rim as the embryo grew.
