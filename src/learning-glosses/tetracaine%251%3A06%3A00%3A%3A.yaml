senseId: 'tetracaine%1:06:00::'
synsetId: 04423336-n
simpleMeaning: Feeling in one small part of the body is taken away by this compound that forms crystals,
  used as a hydrochloride, a salt with hydrogen and chlorine.
scope: This is for numbing one small part of the body, not the whole body.
examples:
- The tetracaine took away feeling in one small part of the body.
- One small part of the body went numb after the tetracaine.
