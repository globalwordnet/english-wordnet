simpleMeaning: The loss of the colouring matter in the skin or hair, so that it has no colour or less
  colour than it should have.
scope: This one is about a change in the skin or hair.
examples:
- The depigmentation left pale patches on the skin where the colour had gone.
- After the illness, depigmentation took the colour from parts of the hair.
