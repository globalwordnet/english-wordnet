simpleMeaning: A recurring sleep state without rapid eye movements, during which dreaming is possible.
  It accounts for roughly three quarters of a typical adult’s sleep.
scope: The proportion of sleep spent in this state varies with age.
examples:
- The graph labeled the recurring periods of deeper sleep “nonrapid eye movement sleep.”
- The chart showed how much time the adult sleeper spent in nonrapid eye movement sleep.
