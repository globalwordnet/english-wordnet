simpleMeaning: An ancient Middle Indo-Aryan language related to Sanskrit and used in the sacred texts
  and worship of Theravada Buddhism.
scope: Also called Pali language; among the old tongues of India, it is the one used for the holy books
  and worship of Theravada Buddhism.
examples:
- Monks chant in Pali during the service.
- The holy books of Theravada Buddhism are written in Pali.
