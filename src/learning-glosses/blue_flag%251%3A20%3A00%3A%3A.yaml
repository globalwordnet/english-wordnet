simpleMeaning: A common iris of the eastern United States with blue or blue-violet flowers. Its root was
  once used medicinally.
scope: This common iris of the east, with sky-coloured blooms, has a root once used as a cure.
examples:
- This blue flag grew in the east of the United States.
- They dug up blue flag root for the old cure.
