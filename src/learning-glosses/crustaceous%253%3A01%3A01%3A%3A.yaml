simpleMeaning: Relating to or belonging to the crustaceans (Crustacea), the group that includes crabs
  and shrimp.
scope: Also called crustacean. It is about animals of one group, not about a thing with a hard outer covering.
examples:
- A crab is a crustaceous animal.
- The crustaceous creatures in the rock pool moved slowly.
