simpleMeaning: A harvest holiday on November's fourth Thursday in the US and October's second Monday in
  Canada. The US tradition recalls a 1621 Pilgrim and Wampanoag feast.
scope: Also called Thanksgiving; a feast day in the United States on the fourth Thursday in November and
  in Canada on the second Monday in October, marking the 1621 feast of the Pilgrims and the Wampanoag.
examples:
- Thanksgiving Day falls on the fourth Thursday in November.
- On Thanksgiving Day, families share a feast.
