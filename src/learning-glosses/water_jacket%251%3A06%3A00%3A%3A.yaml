simpleMeaning: A machine stays cool because liquid in a container wraps round it, above all round the
  block of cylinders in an engine.
scope: This is the liquid-filled container that sits round the block of cylinders in an engine to cool
  it.
examples:
- They drained the water jacket before they took the engine apart.
- The water jacket kept the engine cool on the long drive.
