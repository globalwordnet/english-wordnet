simpleMeaning: An image that appears where light rays seem to come from, as when you see your reflection
  behind a mirror.
scope: It is a kind of picture, not one printed on paper.
examples:
- The virtual image in the mirror showed a face.
- They studied the virtual image in the flat mirror.
