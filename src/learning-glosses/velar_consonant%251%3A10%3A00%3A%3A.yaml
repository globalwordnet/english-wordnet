simpleMeaning: The back of your tongue touches or comes close to the soft roof of your mouth to make this
  consonant.
scope: This is one sound, also called a velar, not one made with the front of the tongue.
examples:
- The velar consonant in 'king' comes from the back of the tongue.
- They practised the velar consonant at the start of 'go' until it sounded clear.
