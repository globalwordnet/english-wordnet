simpleMeaning: A single solid, deep view made from two photos of the same thing, taken from angles a little
  apart.
scope: Stereo and stereoscopic photograph are other names for this two-view image.
examples:
- The stereoscopic picture showed the street in three dimensions.
- A stereoscopic picture of the old bridge hung in the hall.
