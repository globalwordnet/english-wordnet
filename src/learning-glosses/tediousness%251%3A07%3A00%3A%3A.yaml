synsetId: 05213505-n
simpleMeaning: The feeling of being bored because something lasts too long or moves too slowly.
scope: Also called tedium or tiresomeness. It is the dullness itself, not the long thing that causes it.
examples:
- The tediousness of the long meeting wore everyone down.
- They left early because of the tediousness of the slow train ride.
