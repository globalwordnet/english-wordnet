simpleMeaning: The law code of old Rome, set down in writing under Justinian, on which many present-day
  systems of law in the Roman tradition rest.
scope: It is also called civil law, Roman law, or the Justinian code.
examples:
- The class studied jus civile to learn how the law of old Rome worked.
- Later lawmakers built on jus civile when they wrote new codes.
