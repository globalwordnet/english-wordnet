simpleMeaning: Cobalt, a hard, strongly magnetic, silver-white metal that forms divalent or trivalent
  compounds. Plants and animals need tiny amounts of it.
scope: This is a hard silver-white metal drawn to a magnet, needed in tiny amounts by plants and animals;
  Co and cobalt are other names for this sense.
examples:
- Atomic number 27 is the metal cobalt.
- Cobalt, atomic number 27, is needed in tiny amounts by plants.
