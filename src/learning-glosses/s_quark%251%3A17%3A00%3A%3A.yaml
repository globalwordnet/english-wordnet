simpleMeaning: A type of elementary particle called a strange quark. Its electric charge is minus one-third
  of a proton's charge, and its strangeness is minus one.
scope: Also called strange quark. It is a noun.
examples:
- When the particle hit the detector, the team knew it was an s quark.
- Physicists sort s quarks from other kinds of quark by their charge and mass.
