simpleMeaning: The power to tell how high or low a tone sounds, with no other tone to set it against.
scope: This one is also called perfect pitch.
examples:
- With absolute pitch, the singer named each note before the piano played it.
- The tuner relied on absolute pitch to tell when the string was exactly in tune.
