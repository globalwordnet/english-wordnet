simpleMeaning: Having to do with, or made of, the cells that hold the nerve cells in place and feed them.
scope: It is a word about the helpers of the nerve cells, not a word about the nerve cells themselves.
examples:
- They stained the neuroglial tissue so they could see it under the microscope.
- The doctors looked at the neuroglial cells around the damaged nerve.
