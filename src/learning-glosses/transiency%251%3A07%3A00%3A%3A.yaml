simpleMeaning: An impermanence that brings to mind how everything must end or die.
scope: Transience and transitoriness are other names for this sense, which is about how things pass away
  rather than about death itself.
examples:
- The poem dwells on the transiency of youth and beauty.
- They felt the transiency of all earthly things as autumn came.
