simpleMeaning: Said of rubber left soft, never put through the sulfur and heat treatment that toughens
  it.
scope: Also called unvulcanised. It is used of rubber, not of other materials.
examples:
- The unvulcanized strip stretched and would not spring back.
- The worker handled the unvulcanized rubber with care, as it marked easily.
