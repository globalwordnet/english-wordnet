senseId: 'extrinsic_fraud%1:04:00::'
synsetId: 00779514-n
simpleMeaning: Dishonest dealing that keeps one side in a trial from learning what the law allows them,
  or from having their case heard fairly before a judge.
scope: This one is also called collateral fraud.
examples:
- The judge ruled that the extrinsic fraud had kept the defendant from learning of a key right.
- The extrinsic fraud stopped one side from putting its case to the court.
