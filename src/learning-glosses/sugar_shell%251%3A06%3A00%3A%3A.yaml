simpleMeaning: A spoon for serving the white crystals used to sweeten drinks and food, often made in the
  shape of the hard outer covering of a sea animal.
scope: Also called a sugar spoon. It is for serving, not for stirring.
examples:
- They passed the sugar shell so everyone could take some sugar.
- The sugar shell had a curved bowl like a shell from the sea.
