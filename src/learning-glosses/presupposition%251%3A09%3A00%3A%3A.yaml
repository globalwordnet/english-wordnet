senseId: 'presupposition%1:09:00::'
synsetId: 05787920-n
simpleMeaning: Assuming something before knowing it to be true, or an assumption made this way, for example
  as the starting point of an argument.
scope: It is an act of thought.
examples:
- Their argument rested on a presupposition nobody had checked.
- The writer's presupposition was that the town would grow.
