simpleMeaning: 'Nothing surprises this person any more: too much of everything has left them knowing the
  world inside out.'
scope: Also called worldly, this one names a quality of a person, not the quality of being uninterested.
examples:
- The blase traveler called the ocean he had crossed 'the pond'.
- They gave a blase shrug at the news that once would have thrilled them.
