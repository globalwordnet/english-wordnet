simpleMeaning: In American football, a play in which the ball becomes dead in the receiving team's end
  zone after an opponent's kick, allowing play to restart farther upfield.
scope: It is a play in American football.
examples:
- The kick went into the end zone for a touchback.
- Their punt ended in a touchback when it rolled into the end zone.
