simpleMeaning: Having to do with the land, or living on it, not the sea or the air.
scope: Also called terrestrial, tellurian, and telluric. It is not the sense that means earthly as opposed
  to heavenly.
examples:
- The terrene animals live on land, not in the sea.
- Terrene plants grow in soil, not in water.
