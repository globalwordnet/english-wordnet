senseId: 'seize_with_teeth%2:35:00::'
synsetId: 01448551-v
simpleMeaning: To close the jaws on something and hold it fast, cut a piece off, or rip it, or to act
  as if doing that.
scope: This way of holding, cutting or tearing with the jaws is also called bite, not a grip made with
  the hands.
examples:
- The animal seized the rope with its teeth and tore at it.
- Gunny invariably tried to seize her with teeth.
