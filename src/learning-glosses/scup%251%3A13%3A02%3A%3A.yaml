simpleMeaning: The flesh of a fish caught in colder waters off the northern Atlantic coast of the United
  States.
scope: Cold northern waters give this fish, and it is not the lean flesh of the same fish from warm southern
  waters.
examples:
- The market sold scup caught in the cold northern waters.
- The scup on the plate came from the cold northern waters.
