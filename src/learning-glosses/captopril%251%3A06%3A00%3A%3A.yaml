senseId: 'captopril%1:06:00::'
synsetId: 02961438-n
simpleMeaning: A drug sold as Capoten that reduces formation of angiotensin II, allowing blood vessels
  to widen. It treats high blood pressure and congestive heart failure.
scope: A blood-pressure drug, not a painkiller and not a drug for the heart's rhythm.
examples:
- Her doctor gave her captopril for high blood pressure.
- Captopril helped his heart failure, and his breathing eased.
