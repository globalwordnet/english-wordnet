simpleMeaning: The upper artery supplying the cerebellum, the part of the brain at the back of the head
  that helps coordinate movement.
scope: This is the name for the upper fork of the vessel feeding the small brain.
examples:
- Blood reaches the small brain through the superior cerebellar artery.
- The surgeon traced the superior cerebellar artery back to the small brain.
