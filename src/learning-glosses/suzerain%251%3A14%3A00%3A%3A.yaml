senseId: 'suzerain%1:14:00::'
synsetId: 08187434-n
simpleMeaning: A state that holds some rule over another state that depends on it, above all in its dealings
  with other states.
scope: It does not describe a state that rules only itself.
examples:
- The suzerain set the terms for the small state's trade with other lands.
- Under the suzerain, the small state kept its own king but lost control of its foreign policy.
