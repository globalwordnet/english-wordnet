senseId: 'xerophile%1:20:00::'
synsetId: 13141863-n
simpleMeaning: A plant adapted to scarce water. Compare a hydrophyte, adapted to water, and a mesophyte,
  adapted to moderate moisture.
scope: This one is also called a desert plant, a xerophilous plant, a xerophyte, and a xerophytic plant,
  and it stands apart from plants that need plenty of water or a middling amount.
examples:
- A xerophile can grow in the dry soil at the edge of the desert.
- They planted a xerophile in the rock garden because it needs very little watering.
