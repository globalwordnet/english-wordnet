simpleMeaning: An international organization founded in 1920 for peace and cooperation. Woodrow Wilson
  proposed it. The US never joined. It remained weak. It dissolved in 1946 after the United Nations formed.
scope: The League of Nations was founded in 1920 and dissolved in 1946, after the United Nations was formed.
examples:
- The League of Nations was formed in 1920.
- The League of Nations ended in 1946.
