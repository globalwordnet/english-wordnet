simpleMeaning: It shows dream-like scenes where odd things sit side by side, so what you see feels strange
  and not quite real.
scope: This word marks a thing by dream-like scenes where odd things sit side by side; surreal, phantasmagorical
  and phantasmagoric are other names for it.
examples:
- The surrealistic painting joined a fish, a staircase and a cloud in one strange scene.
- Critics called the play surrealistic for its dream-like scenes that made no plain sense.
