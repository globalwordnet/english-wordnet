simpleMeaning: Tubes grow in it, carrying fluids round and round.
scope: This word names growth inside a thing itself, also called vascularise, and does not make another
  thing grow them.
examples:
- The new tissue vascularized within days.
- The graft vascularized and began to carry blood.
