senseId: 'mean_sun%1:09:00::'
synsetId: 05898628-n
simpleMeaning: An imaginary sun traveling at constant speed along the celestial equator, completing a
  yearly circuit in the same time as the real sun, whose apparent speed varies.
scope: This light exists only in thought, and it is not the real light in the sky.
examples:
- The mean sun keeps a steady speed all year round.
- Unlike the real sun, the mean sun never speeds up or slows down.
