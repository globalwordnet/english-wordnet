simpleMeaning: 'A middle rank in the order of living kinds: above it stands a larger group, below it a
  smaller one.'
scope: In biology, this names a set of living things ranked just above the next smaller group.
examples:
- They placed the newly found animals in this subphylum.
- The subphylum groups together the smaller ranks below it.
