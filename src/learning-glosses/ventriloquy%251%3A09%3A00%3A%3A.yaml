simpleMeaning: The art of speaking so that your voice seems to come out of something else, for example
  a wooden figure.
scope: Also called ventriloquism. It is a skill, not the dummy itself.
examples:
- They learned ventriloquy from their grandfather and now perform with a dummy.
- Ventriloquy takes years of practice before the voice sounds natural.
