senseId: 'stop_consonant%1:10:00::'
synsetId: 07130622-n
simpleMeaning: A sound in speech that comes from holding back the air at one place, then freeing it in
  one sudden burst.
scope: It is also called a plosive, an occlusive, a plosive consonant, and a plosive speech sound, and
  stop is another name for it.
examples:
- The first sound of the word 'top' is a stop consonant.
- Stop consonants close the air flow and then release it in a burst.
