senseId: 'tartaric%3:01:00::'
synsetId: 03134964-a
simpleMeaning: A thing is this when it has to do with a certain substance, comes from it, or is like it.
scope: This word marks a link to a certain substance, not the substance itself.
examples:
- The tartaric acid was made from a certain substance.
- The tartaric acid looks like a certain substance.
