simpleMeaning: An instrument that measures small variations in optical density, or how much light passes
  through different points in a tiny area.
scope: It is the sense of a measuring device.
examples:
- The microphotometer mapped the density of the film point by point.
- With a microphotometer, the team checked how the darkness of the plate changed across a tiny spot.
