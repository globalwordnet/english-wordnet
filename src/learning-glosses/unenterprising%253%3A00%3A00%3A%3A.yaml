senseId: 'unenterprising%3:00:00::'
synsetId: 00888657-a
simpleMeaning: Little drive to try new things, and no liking for risk, are seen in this person.
scope: Also called nonenterprising, this word is used of a person, not of one who takes a chance.
examples:
- The unenterprising manager never tried a new idea.
- Investors called the firm unenterprising because it never took a chance on anything new.
