simpleMeaning: At least three officers hear the case when soldiers are tried for wrongs less grave than
  those done in battle.
scope: It is the hearing for soldiers charged with wrongs less grave than those done in battle, and at
  least three officers hear the case, not one alone.
examples:
- The soldier faced a special court-martial after the charge was laid.
- Three officers sat on the special court-martial that tried the case.
