senseId: 'phenyl_salicylate%1:27:00::'
synsetId: 15034997-n
simpleMeaning: A pleasant-smelling, pleasant-tasting white powder used to absorb light in suntan lotions,
  prevent spoilage, kill germs or coat pills so they release medicine in the intestine.
scope: This sense is also called salol, for a white powder with a nice taste and smell, soaking up light
  in sun creams, or keeping things, killing germs, coating pills whose drug frees in the gut.
examples:
- Phenyl salicylate soaks up light.
- Phenyl salicylate coats pills.
