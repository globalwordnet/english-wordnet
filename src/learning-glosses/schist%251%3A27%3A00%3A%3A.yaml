simpleMeaning: A stone changed by heat and pressure that comes apart in thin sheets.
scope: Among rocks, this one is set apart by the way it peels off in thin sheets after heat and pressure
  have worked on it.
examples:
- The schist came apart in thin layers.
- Thin layers of schist fell away from the rock.
