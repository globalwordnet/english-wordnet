simpleMeaning: A large vein formed where the two brachiocephalic veins join. It receives the azygos vein
  and carries blood from the head, arms and chest to the heart’s right atrium.
scope: The precava is also called the superior vena cava.
examples:
- The precava carries blood from the head to the heart.
- Blood from the arms flows into the precava.
