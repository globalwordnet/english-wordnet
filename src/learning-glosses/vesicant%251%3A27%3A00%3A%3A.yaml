simpleMeaning: It raises blisters on the skin, and mustard gas is above all one such chemical.
scope: This chemical is also called vesicatory, and it is not only mustard gas.
examples:
- The soldiers were warned that the vesicant in the shells would raise blisters on their skin.
- The workers wore gloves when they handled the vesicant, since it raises blisters on the skin.
