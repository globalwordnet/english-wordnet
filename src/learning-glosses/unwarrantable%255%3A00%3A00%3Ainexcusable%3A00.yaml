simpleMeaning: Said of a thing that no one can show to be right or make clear.
scope: Also called unwarranted, indefensible, insupportable, and unjustifiable. It is a word for a thing,
  not for a person.
examples:
- The unwarrantable delay angered everyone waiting.
- The unwarrantable claim fell apart under questioning.
