senseId: 'unprejudiced%3:00:00::'
synsetId: 00287080-a
simpleMeaning: A person of this kind judges a thing on its own facts, with no unfair lean and no set view
  held in advance.
scope: This is also called impartial, and it is said of a person who weighs each side fairly, not of one
  who has made up their mind in advance.
examples:
- They gave an unprejudiced appraisal of the pros and cons.
- The scientist's unprejudiced eye saw the result as it was.
