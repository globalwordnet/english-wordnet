simpleMeaning: A leaf whose base stays plain, while its outline runs to a point like an arrow head.
scope: This shape of leaf is also called arrow-shaped and sagittiform.
examples:
- A sagittate leaf tapers to a point at its tip.
- We found a sagittate leaf with a plain base.
