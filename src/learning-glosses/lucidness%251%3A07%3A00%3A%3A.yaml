simpleMeaning: Clear words that are easy to follow, with nothing that hides the sense and nothing hard
  to grasp.
scope: It is also called clarity, lucidity, clearness, limpidity, and pellucidity.
examples:
- The lucidness of the report made the plan easy to follow.
- We liked the lucidness of the talk.
