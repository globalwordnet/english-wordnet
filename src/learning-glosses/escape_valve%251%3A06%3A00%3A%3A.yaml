senseId: 'escape_valve%1:06:00::'
synsetId: 04134734-n
simpleMeaning: A valve on a pressurized container, such as a steam boiler, that opens automatically to
  release fluid when the pressure becomes dangerously high.
scope: This tap is also called escape, escape cock, relief valve, and safety valve.
examples:
- The escape valve on the boiler opened with a hiss.
- A new escape valve was fitted to the tank.
