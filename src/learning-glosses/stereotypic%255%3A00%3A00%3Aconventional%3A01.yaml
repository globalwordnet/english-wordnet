simpleMeaning: Done or said in the same fixed way, with nothing fresh, new, or of one's own in it.
scope: Stereotypical, unimaginative, and stereotyped are other names for this fixed way of thinking or
  acting.
examples:
- The speech was full of stereotypic phrases of praise.
- Even the jokes in the talk were stereotypic.
