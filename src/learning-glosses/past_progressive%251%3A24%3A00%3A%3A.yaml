simpleMeaning: A verb tense used to show an action that was going on at a time before now.
scope: Also called past progressive tense. It is a verb tense.
examples:
- In 'They were reading when the phone rang', 'were reading' is in the past progressive.
- The sentence 'They had been waiting for hours' uses the past progressive.
