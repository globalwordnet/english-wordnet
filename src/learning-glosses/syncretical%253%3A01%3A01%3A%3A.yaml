senseId: 'syncretical%3:01:01::'
synsetId: 02818598-a
simpleMeaning: Of a language that, over time, uses fewer word endings.
scope: Also called syncretic, syncretistic, or syncretistical. It is not about the mixing of different
  beliefs.
examples:
- The syncretical speech of the valley has lost most of its old word endings.
- In the syncretical dialect, the old verb endings have almost all gone.
