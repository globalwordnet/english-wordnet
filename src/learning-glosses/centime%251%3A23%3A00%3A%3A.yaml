synsetId: 13688070-n
simpleMeaning: A monetary unit usually worth one hundredth of a franc or another main unit, used in countries
  including Switzerland, Haiti, and Morocco, and formerly in France and Belgium.
scope: This is a small money unit used in several countries, not the main money unit itself and not the
  centavo of Latin America and elsewhere.
examples:
- The coin was worth ten centimes.
- She counted out the centimes for the bread in France.
