senseId: 'attracter%1:09:00::'
synsetId: 05859350-n
simpleMeaning: A pleasing side of a thing that draws people toward it.
scope: Attraction and magnet are also names for this pleasing side, as are attractor and attractive feature,
  not the other sense of this word, which is about a performer.
examples:
- The flowers are an attracter for bees in the garden.
- The soft music was an attracter that kept people in the room.
