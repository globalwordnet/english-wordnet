simpleMeaning: A rhythm used in poetry about heroes or other grand subjects, especially dactylic hexameter,
  with six metrical feet per line, or iambic pentameter, with five.
scope: Also called heroic and heroic verse, this is a verse form for great deeds, not free verse with
  no set beat.
examples:
- The poet wrote the epic in heroic meter.
- Heroic meter suits the telling of great deeds.
