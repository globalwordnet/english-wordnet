senseId: 'single-member_system%1:09:00::'
synsetId: 05912907-n
simpleMeaning: A way of choosing lawmakers in which just one person is picked for each voting area.
scope: Also called scrutin uninomial system, scrutin uninominal voting system, uninominal system, and
  uninominal voting system. It is a way of voting.
examples:
- Under the single-member system, each district sends one person to the assembly.
- They changed to a single-member system so that each area would have just one voice.
