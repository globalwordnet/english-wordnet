senseId: 'auspicate%2:30:00::'
synsetId: 00348074-v
simpleMeaning: To mark the start of something with an act meant to bring good luck.
scope: This one is about the way something is started, not about how it turns out in the end.
examples:
- They auspicated the trip with a bottle of champagne.
- The owners auspicated the new shop by hanging a lucky charm above the door.
