simpleMeaning: This drug, sold as Coumadin, keeps blood from clotting, stopping clots from forming or
  clearing clots that have formed or moved.
scope: This drug is also called Coumadin, and it is not a drug that makes blood clot.
examples:
- They took warfarin each day to stop a clot from forming in their leg.
- The doctor gave them warfarin to clear the clot that had formed in their lung.
