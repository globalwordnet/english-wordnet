simpleMeaning: And elsewhere in a piece of writing, when the same thing crops up in other places.
scope: This one is also called et al, and et al. is its same-batch mate too.
examples:
- The note says 'et alibi' where the same passage turns up later in the book.
- They wrote et alibi beside the first mention, meaning it comes up elsewhere too.
