simpleMeaning: Tissue that surrounds and supports nerve cells in the brain and spinal cord. Its glial
  cells and the nerve cells together form the tissue of the central nervous system.
scope: This sense is also called glia, for holding-up tissue that rings and bears up nerve cells in the
  middle nerve web, glial and nerve cells together making up the web's tissue.
examples:
- Neuroglia holds up nerve cells.
- Neuroglia rings the neurons.
