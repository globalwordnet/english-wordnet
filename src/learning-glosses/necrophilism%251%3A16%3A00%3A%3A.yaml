simpleMeaning: A sexual pull toward dead bodies that a person cannot resist.
scope: Also called necromania and necrophilia. It is not a pull toward living people.
examples:
- The report told of a person whose necrophilism drew them to the bodies of the dead.
- The villain in the novel suffered from necrophilism and spent nights among the graves.
