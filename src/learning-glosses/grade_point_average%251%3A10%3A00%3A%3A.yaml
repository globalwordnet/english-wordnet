simpleMeaning: A measure of college performance found by dividing total grade points earned by the number
  of course credits attempted.
scope: This is the one number that shows how well a student has done at college or university, worked
  out by dividing the marks earned by the marks tried for.
examples:
- Her grade point average was high.
- They asked for his grade point average.
