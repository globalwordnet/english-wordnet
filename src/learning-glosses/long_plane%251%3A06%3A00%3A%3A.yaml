simpleMeaning: A carpenter's tool for smoothing the edges of boards, of a greater length than most, so
  the boards join well.
scope: It is also called a jointer, a jointer plane, and a jointing plane.
examples:
- The carpenter used the long plane on the edge of the board.
- They smoothed the board with a long plane.
