senseId: 'sanguification%1:22:00::'
synsetId: 13513656-n
simpleMeaning: A living body makes new blood cells, and the soft filling inside its bones does most of
  that making.
scope: Also called haematogenesis, haematopoiesis, haemogenesis, haemopoiesis, hematogenesis, hematopoiesis,
  hemogenesis, and hemopoiesis. It is a process.
examples:
- Most sanguification happens in the soft filling inside the bones.
- Sanguification goes on inside the living body.
