simpleMeaning: An older adjective for someone whose gender identity differs from the sex assigned at birth.
  The usual term today is transgender.
scope: This word is also called transgender, not one that covers only a full change.
examples:
- They are transgendered, having changed from male to female.
- The transgendered role was only partly reversed.
