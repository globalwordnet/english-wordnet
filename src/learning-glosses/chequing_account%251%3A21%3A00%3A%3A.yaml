simpleMeaning: An arrangement at a bank by which money kept there can be taken out with written orders
  to pay, whenever the money's owner asks for it.
scope: This one is also called checking account and current account.
examples:
- Their chequing account lets them pay the rent with a written order each month.
- The shop asked for payment from the chequing account.
