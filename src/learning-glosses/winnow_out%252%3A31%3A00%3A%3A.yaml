senseId: 'winnow_out%2:31:00::'
synsetId: 00687320-v
simpleMeaning: To set a person or an idea to one side, no longer thinking about it or keeping it in a
  contest.
scope: Also called reject, eliminate, and rule out. It is an act.
examples:
- They winnowed out the weakest plan and kept the best one.
- The judges winnowed out three singers and kept nine for the next round.
