simpleMeaning: A person who follows the teaching that the law of God no longer binds Christians.
scope: This one names a person, not a word used to describe something that the teaching has shaped.
examples:
- The antinomian argued that faith alone was enough to save a person.
- Some called the writer an antinomian for saying the old laws no longer bind Christians.
