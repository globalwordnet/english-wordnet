simpleMeaning: A brand of labetalol, also sold as Trandate, that lowers blood pressure by blocking alpha
  and beta receptors in the sympathetic nervous system.
scope: Also called labetalol, labetalol hydrochloride, and Trandate; a drug that lowers blood pressure
  by blocking nerve signals of the body's fight-or-flight system.
examples:
- The doctor gave her Normodyne for high blood pressure.
- Normodyne lowered his blood pressure within days.
