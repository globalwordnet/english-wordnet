senseId: 'degras%1:27:01::'
synsetId: 92431264-n
simpleMeaning: A thick, partly liquid mixture produced when oxidized fish oil extracts soluble proteins
  from certain animal skins.
scope: This thick, half-liquid mix is made by treating some skins with fish oil changed by air, and it
  takes out the parts of the skins that can dissolve.
examples:
- The workers treated the skins with degras.
- Some skins were treated with degras in the tannery.
