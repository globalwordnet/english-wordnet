simpleMeaning: Able to bind substances to a surface through chemical bonds rather than through physical
  attraction.
scope: This is also called chemosorptive.
examples:
- The chemisorptive coating takes in gas and holds it fast.
- A chemisorptive surface will not let the gas go once it has taken it in.
