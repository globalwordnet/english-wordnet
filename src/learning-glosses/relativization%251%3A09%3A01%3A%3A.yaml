senseId: 'relativization%1:09:01::'
synsetId: 92448715-n
simpleMeaning: The act or result of judging a thing only by how it stands next to other things, not as
  true in itself.
scope: Also called relativisation. It is an act.
examples:
- The relativization of length and time still seems strange to many people.
- Many readers find the relativization of old ideas hard to follow.
