senseId: 'sequestration%1:04:01::'
synsetId: 00088038-n
simpleMeaning: Goods taken from their owner stay held until the money they bring in settles the claim
  that led to the taking.
scope: Also called requisition, this is a holding of another's goods until what they earn clears the claim,
  not a court order for taking goods and not the act of keeping things apart.
examples:
- The sequestration of the land ended when its rents paid what was owed.
- Under the sequestration, the house was held until its income met the claim.
