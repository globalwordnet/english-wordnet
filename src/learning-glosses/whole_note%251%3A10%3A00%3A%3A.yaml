simpleMeaning: A long musical note lasting four beats in common time, equal in length to two half notes.
scope: This one is also called semibreve, and it is a sound, not a silence.
examples:
- The whole note at the start of the line lasts for four beats.
- They held the whole note until the conductor gave the sign to stop.
