schema: oewn-learning-gloss-v2
senseId: 'constructed_script%1:10:01::'
synsetId: 92460991-n
simpleMeaning: A way of writing put together by a single person or a team, rather than a way that grew
  up with a language or a culture.
scope: Artificial script is another name for this sense; this is a made-up way of writing, not a natural
  one.
examples:
- Balin-Silel is a constructed script invented by Aayush Chaturvedi in November 2014 to write his conlang
  by the same name.
- The novelist invented a constructed script for the language in the story.
