simpleMeaning: One of two body forms in animals such as jellyfish, the free-swimming stage that reproduces
  sexually. It has a jellylike, umbrella-shaped body with tentacles.
scope: This sense is also called medusa and medusoid, for one of two forms taken by soft sea beasts, the
  free-swimming breeding stage in their life round, in which it has a jelly-like, umbrella-shaped body
  and feelers.
examples:
- Medusans swim freely to breed.
- A medusan drifts with its tentacles trailing.
