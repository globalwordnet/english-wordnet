simpleMeaning: In a way that laughs at someone and shows no respect for them.
scope: Also called mockingly, derisively, and derisorily. It is an adverb.
examples:
- '"Of course you would say that," the clerk said scoffingly.'
- They laughed scoffingly at the idea.
