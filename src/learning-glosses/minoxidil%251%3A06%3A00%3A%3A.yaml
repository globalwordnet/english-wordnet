simpleMeaning: A drug that widens blood vessels, sold as Loniten for severe high blood pressure. Because
  it can stimulate hair growth, Rogaine uses it to treat male-pattern baldness.
scope: 'It is sold under two trade names: Loniten for very high blood pressure and Rogaine for male-pattern
  hair loss.'
examples:
- Minoxidil lowered the blood pressure.
- Minoxidil helped hair grow back.
