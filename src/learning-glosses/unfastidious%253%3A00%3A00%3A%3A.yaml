simpleMeaning: This person skips the care small things need and does not mind when things are dirty.
scope: This word marks a careless person, not a living thing that is not fussy about food.
examples:
- They were unfastidious in their dress.
- They were unfastidious about cleanliness, leaving things dirty for days.
