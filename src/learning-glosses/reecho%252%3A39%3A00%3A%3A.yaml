senseId: 'reecho%2:39:00::'
synsetId: 02188711-v
simpleMeaning: A sound is heard, then heard again, because it has been sent back a second time
scope: An echo is sent back again, not merely heard over and over without being sent back.
examples:
- The reecho of the shout came back a second time from the far wall.
- The valley seemed to reecho every call that was made in it.
