simpleMeaning: The nerves and related structures outside the brain and spinal cord.
scope: Also called systema nervosum periphericum. It is a network in the body.
examples:
- The peripheral nervous system carries messages from the brain to the hands.
- Damage to the peripheral nervous system can cause numbness in the feet.
