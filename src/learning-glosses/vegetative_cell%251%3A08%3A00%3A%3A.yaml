senseId: 'vegetative_cell%1:08:00::'
synsetId: 05438205-n
simpleMeaning: A plant or animal cell used for ordinary growth or function that plays no part in producing
  reproductive cells.
scope: Also called somatic cell. It is a part, not a whole plant or animal.
examples:
- A vegetative cell divides to make more of the same kind.
- Skin is made of vegetative cells, not the kind that makes young.
