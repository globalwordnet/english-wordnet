simpleMeaning: A typewriter-like printer connected to a telegraph that prints incoming messages one character
  at a time.
scope: This is also called a teleprinter, a teletypewriter, telex, or a telex machine.
examples:
- They typed the order on the teletype machine and waited for the reply.
- A teletype machine stood in the corner, printing messages as they arrived.
