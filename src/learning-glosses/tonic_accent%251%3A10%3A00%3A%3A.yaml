senseId: 'tonic_accent%1:10:00::'
synsetId: 07100153-n
simpleMeaning: The stress given to a sound by the height of the voice, not by its loudness.
scope: Also called pitch accent. It is a kind of stress in speech.
examples:
- The tonic accent fell on the last word, with the voice rising instead of growing louder.
- In the song, the tonic accent comes from a rise in pitch, not from a louder beat.
