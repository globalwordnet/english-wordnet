simpleMeaning: A brand of enalapril, an ACE inhibitor that widens blood vessels by reducing angiotensin
  II formation and may be used after a heart attack.
scope: Also called enalapril; a kidney drug that stops a body chemical from forming, so blood tubes widen,
  given after heart attacks.
examples:
- The doctor gave her Vasotec after her heart attack.
- Vasotec helps the blood tubes widen by acting in the kidney.
