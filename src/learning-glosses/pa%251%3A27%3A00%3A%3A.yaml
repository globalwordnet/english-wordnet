simpleMeaning: The symbol for protactinium, a radioactive metal. One form occurs as uranium decays and
  changes into actinium in a chain that eventually produces lead.
scope: Pa stands for protactinium, element 91. Different forms of the element have different half-lives.
examples:
- The periodic table shows Pa at atomic number 91.
- The students looked up the symbol Pa and found protactinium.
