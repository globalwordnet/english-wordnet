senseId: 'semiparasite%1:20:00::'
synsetId: 13141534-n
simpleMeaning: A plant that lives off another plant yet makes some of its own food from sunlight, with
  the help of the green stuff in its leaves.
scope: Also called hemiparasite, this plant takes some food from another plant while still making some
  of its own food from sunlight.
examples:
- A semiparasite takes part of what it needs from the plant it grows on.
- This semiparasite still makes food from sunlight, even while it feeds on its host.
