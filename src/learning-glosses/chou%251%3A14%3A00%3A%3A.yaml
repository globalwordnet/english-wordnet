simpleMeaning: The Zhou dynasty, which ruled China from about 1046 to 256 BC, a period that saw the rise
  of Confucianism and Taoism.
scope: This ruling house is also called Chow, the Chou dynasty, the Chow dynasty, Zhou and the Zhou dynasty;
  it is not the Han dynasty and not another ruling house of China.
examples:
- The Chou ruled China for hundreds of years.
- Confucianism rose under the Chou.
