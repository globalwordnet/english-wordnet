simpleMeaning: A handheld phone that uses radio signals across a network of small areas, each with its
  own short-range transmitter and receiver.
scope: A small radio set you carry, used in small land parts each with its own sender and receiver; cell,
  cellphone, cellular phone and mobile phone are other names for this sense.
examples:
- He answered the cellular telephone on the second ring.
- A cellular telephone lets you call from almost anywhere.
