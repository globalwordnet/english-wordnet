simpleMeaning: A unit that combines how far the average temperature falls below a reference temperature
  with how long it stays there, used to estimate building heating needs.
scope: This is not a date in the year.
examples:
- The heating bill was worked out with degree days for the cold months.
- Each degree day helped them guess how much fuel the building would need.
