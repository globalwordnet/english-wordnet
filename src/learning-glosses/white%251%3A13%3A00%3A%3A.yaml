simpleMeaning: The clear, jellylike part of an egg around the yolk. It protects and nourishes the developing
  chick and consists mainly of water and proteins such as albumin.
scope: Egg only; not the colour.
examples:
- Beat the egg whites until stiff.
- Separate the yolk from the white.
