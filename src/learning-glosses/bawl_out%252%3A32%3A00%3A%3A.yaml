simpleMeaning: To scold someone severely or angrily.
scope: Also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce, remonstrate, lambaste,
  lambast, call down, call on the carpet, chew out, chew up, dress down, have words, or take to task,
  this one is about telling someone off.
examples:
- The mother bawled out the child for entering a stranger's car.
- The customer bawled out the waiter for bringing cold soup.
