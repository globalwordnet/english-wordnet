simpleMeaning: The hours of work that fall in the dark part of the day, such as from midnight to 8 in
  the morning.
scope: It is also called a graveyard shift. It is the hours of work, not the people who work them.
examples:
- They work the night shift from midnight to eight in the morning.
- The night shift ends when the day workers arrive.
