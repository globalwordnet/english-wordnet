simpleMeaning: A disease linked to psoriasis that causes pain and swelling in joints, often in the fingers
  or toes.
scope: Psoriatic arthritis and rheumatoid arthritis are distinct forms of inflammatory arthritis.
examples:
- Psoriatic arthritis made her fingers stiff in the morning.
- His psoriatic arthritis came with red patches on the skin.
