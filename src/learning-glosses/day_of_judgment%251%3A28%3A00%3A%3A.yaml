simpleMeaning: In the New Testament, the day at the end of time after Armageddon when God judges each
  person according to their good and evil deeds.
scope: 'Also called doomsday, crack of doom, day of reckoning, end of the world, eschaton, Doomsday, Day
  of Judgement, Judgement Day, Judgment Day, Last Day, Last Judgement and Last Judgment: the last reckoning
  after Armageddon, when God settles each person''s fate.'
examples:
- The Day of Judgment comes after Armageddon, at the end of time.
- They believed the Day of Judgment would settle every fate.
