simpleMeaning: The inferior epigastric vein, which drains the lower abdominal wall into the external iliac
  vein.
scope: This is one blood vessel, also called inferior epigastric vein, not one that carries blood away
  from the blood vessel by the hip bone in the lower belly.
examples:
- The surgeon tied off the vena epigastrica inferior during the operation on the lower belly.
- They found the vena epigastrica inferior emptying into the blood vessel by the hip bone.
