senseId: 'chew_out%2:32:00::'
synsetId: 00826456-v
simpleMeaning: To let a person know, in hard and angry words, that what they did was wrong.
scope: Jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce, remonstrate, lambaste, lambast,
  bawl out, call down, call on the carpet, chew up, dress down, have words and take to task are other
  names for this sense.
examples:
- The teacher chewed out the students for fighting in the hall.
- When the report came back full of mistakes, the boss chewed out the whole team in front of everyone.
