simpleMeaning: In computer science, a way to count how fast a computer system works, where one teraflop
  means a thousand billion calculations with decimal numbers in one moment.
scope: In computer science, this unit is also called a teraflop.
examples:
- They said the machine could do a trillion floating point operations per second.
- The test showed a trillion floating point operations per second on the screen.
