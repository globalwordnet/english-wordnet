senseId: 'sickle_cell%1:08:00::'
synsetId: 05462409-n
simpleMeaning: A crescent-shaped red blood cell containing an abnormal form of hemoglobin, the protein
  that carries oxygen.
scope: Unlike a healthy red blood part, this one is bent like a crescent moon and carries the wrong kind
  of the stuff that brings oxygen through the blood.
examples:
- The lab found a sickle cell in the blood sample.
- A sickle cell bends like a crescent moon.
