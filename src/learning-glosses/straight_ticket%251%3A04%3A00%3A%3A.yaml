senseId: 'straight_ticket%1:04:00::'
synsetId: 00185501-n
simpleMeaning: A ballot cast for every person one party puts up, by a voter who backs the whole party
  list.
scope: This is a vote that backs one party's whole list, not people picked from different parties.
examples:
- The voter cast a straight ticket for the party's candidates.
- The clerk counted the straight ticket with the rest of the votes.
