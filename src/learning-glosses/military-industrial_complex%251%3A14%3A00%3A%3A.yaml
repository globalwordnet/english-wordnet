simpleMeaning: A country's armed forces and the makers of arms and other gear for war.
scope: It names the armed forces and the arms makers as one thing, not each on its own.
examples:
- We must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial
  complex.
- The military-industrial complex grew as arms makers won more orders from the armed forces.
