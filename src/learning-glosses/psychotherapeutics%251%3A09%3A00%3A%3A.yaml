simpleMeaning: A part of the study and care of the mind that helps people feel better by talking with
  them.
scope: Also called psychotherapy or mental hygiene. It is a field of study.
examples:
- They teach psychotherapeutics to new doctors who will treat troubled minds by talking.
- The book on psychotherapeutics sets out ways of helping people through talk.
