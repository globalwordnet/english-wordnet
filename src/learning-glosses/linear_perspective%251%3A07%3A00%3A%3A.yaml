senseId: 'linear_perspective%1:07:00::'
synsetId: 04683665-n
simpleMeaning: The way things seem to stand next to each other, set by how far each one is from the person
  looking at them.
scope: It is also called perspective.
examples:
- Linear perspective makes the far wall look small in the picture.
- They used linear perspective to show depth in the drawing.
