simpleMeaning: With the sides level or nearly level in a race, a comparison, or a competition, and the
  result still in doubt.
scope: This word is also called neck and neck, or nip and tuck.
examples:
- The two runners were head-to-head at the finish line.
- The head-to-head contest ended with no clear winner.
