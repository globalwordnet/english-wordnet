simpleMeaning: A derogatory label applied to early Buddhist schools, including Theravada. Theravada continued
  in Sri Lanka and spread from there into Southeast Asia.
scope: Historically used by some Mahayana writers. Theravada is the name of the surviving tradition discussed
  here.
examples:
- The historian explained why the label Hinayana is offensive.
- The older text used Hinayana when discussing Theravada.
