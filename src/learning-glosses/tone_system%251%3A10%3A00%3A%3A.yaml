simpleMeaning: All the pitch patterns a language, or one way of speaking it in one place, has for telling
  one meaning from another.
scope: Also called a tonal system. It is a set of sounds used in speech.
examples:
- Students of the language must learn its tone system.
- The tone system of Mandarin is described in the book.
