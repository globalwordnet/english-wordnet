simpleMeaning: A person who is much thinner than usual, with almost no flesh covering the frame of the
  body.
scope: Also called scrag, thin person. It is a noun.
examples:
- After months of illness, the patient was all skin and bones.
- The old photo showed a child who was all skin and bones after the long winter.
