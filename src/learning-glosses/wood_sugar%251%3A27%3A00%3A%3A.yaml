simpleMeaning: People whose bodies cannot handle sugar in the usual way eat foods made with this sugar,
  taken from timber or straw.
scope: This one is also called xylose, and it comes from timber or straw, unlike the kind from cane or
  beet.
examples:
- The baker used wood sugar in the cake for guests who could not eat ordinary sugar.
- They made the jam with wood sugar so that everyone at the table could eat it.
