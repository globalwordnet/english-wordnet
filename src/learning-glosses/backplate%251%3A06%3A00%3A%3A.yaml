simpleMeaning: A piece of plate armour worn over the back as part of the armour covering the chest and
  back.
scope: Plate armour protecting the back, worn as part of a cuirass, the armour that covers the trunk of
  the body.
examples:
- The knight's backplate bore the dents of many blows.
- He buckled on his backplate before the fight.
