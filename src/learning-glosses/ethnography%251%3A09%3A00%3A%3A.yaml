simpleMeaning: The study of single human societies, describing each one carefully and on the facts, as
  part of anthropology, the study of peoples.
scope: This one is also called descriptive anthropology.
examples:
- The ethnography of the islanders took ten years of living among them.
- They wrote an ethnography of the fishing village after a year there.
