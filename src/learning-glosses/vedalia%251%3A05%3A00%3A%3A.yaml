simpleMeaning: A beetle from Australia, brought in elsewhere to keep down small insects that suck the
  sap of plants.
scope: Also called Rodolia cardinalis. It is a kind of beetle.
examples:
- Farmers brought in the vedalia to keep scale insects down.
- The vedalia was set free in the fields to fight the scale insects.
