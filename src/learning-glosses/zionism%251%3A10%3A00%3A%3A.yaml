simpleMeaning: A policy supporting the establishment and development of a national homeland for the Jewish
  people in Palestine.
scope: A policy for a Jewish homeland in Palestine, not the movement that arose to create a Jewish state
  there.
examples:
- Zionism called for a national homeland for Jews in Palestine.
- Many supporters of Zionism worked to build a homeland in Palestine.
