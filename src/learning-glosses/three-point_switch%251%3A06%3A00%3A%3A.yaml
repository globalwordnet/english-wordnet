simpleMeaning: An electric switch with 3 places where wires join it, used to work a circuit from either
  of two places.
scope: This is also called a three-way switch, and it does not work a circuit from one place only.
examples:
- They fitted a three-point switch so they could work the lights from either end of the room.
- With a three-point switch, they turned the lights off from the far door.
