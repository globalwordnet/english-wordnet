simpleMeaning: a children's game that goes on until a set sign is given, when every player dancing round
  in a circle crouches down
scope: This is also called ring-a-rosy or ring-around-the-rosy.
examples:
- The class played ring-around-a-rosy.
- At the signal, the children playing ring-around-a-rosy all crouched down.
