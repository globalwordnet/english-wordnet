simpleMeaning: Said of a thing made by heating wood, especially by heating it with no air until it breaks
  apart.
scope: Also called pyrolignic. It is an adjective.
examples:
- Pyroligneous acid is made by heating wood with no air.
- The pyroligneous liquid was made by heating wood until it broke apart.
