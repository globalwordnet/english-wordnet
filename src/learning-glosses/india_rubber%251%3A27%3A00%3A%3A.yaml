simpleMeaning: Natural rubber from the milky sap of trees, especially Hevea and Ficus. It can be vulcanized,
  a treatment that makes it tougher, for use in many products.
scope: This is a stretchy material got from milky tree sap, most of all from Hevea and Ficus trees, that
  can be heated and made into many kinds of things; also called rubber, caoutchouc, gum elastic and natural
  rubber.
examples:
- India rubber comes from the milky sap of trees.
- They made the soles from India rubber.
