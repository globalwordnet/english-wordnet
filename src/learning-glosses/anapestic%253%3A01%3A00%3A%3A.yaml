senseId: 'anapestic%3:01:00::'
synsetId: 02950026-a
simpleMeaning: To do with a set-beat group of syllables in which two short beats lead to one long beat.
scope: Also called anapaestic, this word does not describe a beat pattern that opens with a long beat.
examples:
- The chorus sang an anapestic line that moved with two short beats and then a long one.
- The class clapped an anapestic rhythm, short-short-long, as they read the verse aloud.
