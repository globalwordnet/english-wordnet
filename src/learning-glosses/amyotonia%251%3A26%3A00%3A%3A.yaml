simpleMeaning: A lack of the usual tightness a muscle keeps at rest.
scope: Also called atonia, atonicity, or atony, this word names the slack state, not the tight one.
examples:
- The doctor noted amyotonia in the baby's limp arms.
- The therapist tested the child for amyotonia after the illness.
