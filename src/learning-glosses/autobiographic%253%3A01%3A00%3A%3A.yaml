senseId: 'autobiographic%3:01:00::'
synsetId: 02661949-a
simpleMeaning: Said of a thing that has to do with a book a person writes about their own life, or is
  written in the way of such a book.
scope: Also called autobiographical. It is said of a thing.
examples:
- They wrote an autobiographic account of their years at sea.
- The film tells their life in an autobiographic way.
