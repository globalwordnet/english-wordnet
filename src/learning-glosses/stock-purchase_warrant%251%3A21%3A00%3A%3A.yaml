simpleMeaning: The right to buy a set amount of ordinary shares at a set price, on a paper from a firm,
  usually with a loan paper or another share paper.
scope: This sense is also called warrant and stock warrant.
examples:
- As a sweetener they offered stock-purchase warrants along with the fixed-income securities.
- The stock-purchase warrant let its holder buy shares at the set price.
