senseId: 'many%3:00:00::'
synsetId: 01555990-a
simpleMeaning: A word used before plural count nouns or alone as a plural pronoun for a large, unspecified
  number, often after as, too, so, or that.
scope: With things you can count; not much with things you cannot count.
examples:
- Many people came to the show.
- She has many friends.
