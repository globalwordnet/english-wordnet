simpleMeaning: To look at something with soft, tender feeling, or to make it something that stirs such
  feeling.
scope: Also called sentimentalize. It is a verb.
examples:
- The writer sentimentalised the old house, seeing it only through happy memories.
- The film sentimentalised the town into a place of lost charm.
