senseId: tautological%5:00:00:prolix:00
synsetId: 00552046-s
simpleMeaning: Said of words that repeat the same sense with different words.
scope: Also called redundant, pleonastic and tautologic. It describes the words, not the repetition itself.
examples:
- The phrase ‘a beginner who has just started’ is tautological.
- The line 'a round circle' is tautological, since a circle is round by definition.
