simpleMeaning: People get rid of matter they do not use, seeing no worth in it and wanting it no more.
scope: This stuff is also called waste, waste material, and waste product, and it is not stuff people
  hold on to for later use.
examples:
- They put the waste matter out for collection once a week.
- Much of the waste matter from the factory goes into the sewers.
