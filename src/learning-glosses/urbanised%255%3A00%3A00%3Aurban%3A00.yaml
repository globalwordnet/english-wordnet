simpleMeaning: Said of a place that has taken on the ways of a town or city, and looks and feels like
  one.
scope: Also called urbanized. It is a word for a place that has changed.
examples:
- The once small town is now urbanised, with tall blocks and busy streets.
- Much of the land round the old port is urbanised now.
