simpleMeaning: A person whose blood will not set, so bleeding goes on and on.
scope: This person is also called a bleeder, a haemophile, a haemophiliac, or a hemophile.
examples:
- The hemophiliac wore a bracelet that named the condition.
- Doctors taught the young hemophiliac how to treat a bleed.
