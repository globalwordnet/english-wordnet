simpleMeaning: A cut made into a kidney, usually to take out a stone in it.
scope: It is a cut into a kidney, not the taking out of the kidney itself.
examples:
- They did a nephrotomy and took out the stone.
- The nephrotomy left the kidney in place once the stone was out.
