simpleMeaning: The shape of one part of a long musical work, with an opening part, a middle part working
  the tunes over, and a closing part bringing them back.
scope: It is a shape.
examples:
- The first movement follows sonata form, with its tunes set out, worked over, and brought back.
- In sonata form, the opening tunes come back at the end.
