simpleMeaning: A low-growing evergreen perennial found from Virginia to South Carolina, with strong-smelling,
  heart-shaped leaves mottled green and silvery gray.
scope: Also called heartleaf, this is a low plant of Virginia to South Carolina, not the wild ginger with
  the same name.
examples:
- The heart-leaf keeps its leaves all year in the garden.
- A heart-leaf has spotted green and silver leaves with a broad base and a point.
