simpleMeaning: An event at which goods said to have been harmed by a blaze are put up for buyers.
scope: This one is not a disposal of goods forced by a seller facing bankruptcy.
examples:
- The shop held a fire sale after the blaze in the back room.
- Shoppers crowded into the fire sale on Saturday morning.
