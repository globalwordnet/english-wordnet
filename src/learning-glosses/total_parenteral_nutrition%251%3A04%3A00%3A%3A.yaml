simpleMeaning: Delivery of complete nutrition through a catheter into a large central vein, sometimes
  needed during prolonged coma, after severe burns, or when the digestive system cannot absorb enough
  nutrients.
scope: Also called hyperalimentation, this is the giving of a food liquid with enough nourishment through
  a pipe into the great vena cava, that big vein, for coma lasting long, bad burns, or severe gut troubles,
  where hyperalimentation is the giving of food liquid with enough nourishment through a pipe into the
  great vena cava, that big vein, for coma lasting long, bad burns, or severe gut troubles.
examples:
- Total parenteral nutrition feeds through a tube.
- Doctors use total parenteral nutrition in a coma.
