simpleMeaning: A piece of ground that rises by itself above the ground around it, above all a rock that
  stands out into the sea.
scope: This one is about high ground, also called a head, a headland, or a promontory.
examples:
- The foreland rose above the beach, with waves breaking on both sides.
- They built the lighthouse on the foreland so ships could see it from far away.
