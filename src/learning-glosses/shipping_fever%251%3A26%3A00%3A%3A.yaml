simpleMeaning: A potentially fatal infection of cattle and sheep that can spread through the blood. It
  causes high fever and pneumonia and often follows exposure or exhaustion during transport.
scope: This sense is also called shipping pneumonia.
examples:
- Shipping fever struck the cattle.
- Shipping fever kills sheep.
