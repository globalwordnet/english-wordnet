simpleMeaning: Someone who gives goods to another person to take care of.
scope: Consigner is another name for this sense; this is the sender of the goods, not the one who receives
  them.
examples:
- The consignor listed every box on the delivery note.
- The consignor asked the carrier to keep the goods dry.
