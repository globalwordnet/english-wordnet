senseId: 'reflexion%1:09:00::'
synsetId: 05793513-n
simpleMeaning: A long, unhurried spell of thinking hard about one thing, weighing it with care.
scope: 'This is also called reflection, contemplation, musing, thoughtfulness and rumination: the thinking
  itself, not the remark it may lead to and not light turning back off a surface.'
examples:
- After the long reflexion, the decision was clear at last.
- The reflexion on the year's work went on for hours.
