simpleMeaning: A design cut into a plate, used to copy a picture.
scope: Also called halftone or halftone engraving. It is a design on a plate, not the picture it copies.
examples:
- The photoengraving of the map took hours to cut into the plate.
- They used a photoengraving to print the picture in the book.
