simpleMeaning: A smaller blood vessel that drains into the stomach's blood vessel on the right.
scope: Also called prepyloric vein. It is a blood vessel, not an artery.
examples:
- The surgeon tied off the vena pylorica during the operation on the stomach.
- The doctor followed the vena pylorica on the scan to the larger blood vessel it joins.
