simpleMeaning: A smooth, translucent cartilage found in joints and airways. It forms much of the fetal
  skeleton before bone replaces it.
scope: Before birth, most of a baby's bones are made of this clear gristle, found in joints and air passages.
examples:
- The baby's bones were mostly hyaline cartilage before it was born.
- The sample from the joint was hyaline cartilage.
