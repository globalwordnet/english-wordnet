schema: oewn-learning-gloss-v2
senseId: 'cross-fertilise%2:29:01::'
synsetId: 00053606-v
simpleMeaning: To become fertile when the male cells of one living thing join the female cells of another
  of the same kind.
scope: Cross-fertilize is another name for this sense; it is not the sense where one living thing makes
  another fertile.
examples:
- The roses cross-fertilised with pollen from the next row.
- After the bees brought pollen from another plant, the flowers cross-fertilised.
