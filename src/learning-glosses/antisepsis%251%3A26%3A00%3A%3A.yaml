simpleMeaning: For things that are not alive, the state of having no harmful living things in them.
scope: Also called asepsis, sterileness, or sterility, this one names a state, not a process.
examples:
- The lab kept strict antisepsis so that no germs could live on its surfaces.
- They checked the antisepsis of the instruments before each use.
