simpleMeaning: A spindle with a spiral groove that compensates for the weakening pull of a clock’s mainspring
  as it unwinds.
scope: This grooved rod in a clock is also called a fusee.
examples:
- The fusee drive kept the clock's power steady.
- He repaired the fusee drive in the old clock.
