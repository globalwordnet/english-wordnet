simpleMeaning: The body's weak or missing answer to one substance that makes it fight back.
scope: This is about the body's answer, not about the substance that sets it off.
examples:
- The test showed anergy, with no answer from the body at all.
- Their anergy showed in the test, where the body gave no fight-back.
