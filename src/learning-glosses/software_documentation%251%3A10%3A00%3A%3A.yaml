simpleMeaning: Written guides that set out a computer program's code in lists, or handbooks that explain
  what the program does and how a person runs it.
scope: Also called documentation. It is a written aid.
examples:
- The software documentation told them how to set up the new program.
- They read the software documentation before trying the new tools.
