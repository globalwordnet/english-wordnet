simpleMeaning: A tree of the Amazon and Orinoco river regions with leathery leaves shed yearly and fragrant
  yellow-white flowers. Its milky sap supplies most commercial natural rubber.
scope: Also called caoutchouc tree and Hevea brasiliensis; a tree of the Amazon and Orinoco rivers whose
  milky juice is the main source of the elastic gum sold in trade.
examples:
- The Para rubber tree grew along the river.
- Para rubber trees gave the milky juice for tires.
