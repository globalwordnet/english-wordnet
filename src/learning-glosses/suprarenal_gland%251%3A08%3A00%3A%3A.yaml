simpleMeaning: One of two glands near the tops of the kidneys that release hormones into the blood, also
  called adrenal glands.
scope: Adrenal and adrenal gland are also names for this organ near the kidney.
examples:
- The doctor checked the suprarenal gland on the scan.
- The patient had a scan of the suprarenal gland.
