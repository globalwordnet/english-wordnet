simpleMeaning: The process by which one substance takes another into itself or holds it on its surface.
scope: This names the taking-in-or-holding process itself, whether the other stuff is drawn inside or
  held on the outside.
examples:
- They watched sorption pull the colour in.
- Sorption kept the colour held fast on the outside.
