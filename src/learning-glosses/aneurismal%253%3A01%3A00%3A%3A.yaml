senseId: 'aneurismal%3:01:00::'
synsetId: 03017370-a
simpleMeaning: About a weak place where a blood vessel wall swells out, or about someone hurt by one.
scope: Also called aneurismatic, aneurysmal, and aneurysmatic, this is a word that describes something,
  not the weak spot itself.
examples:
- The scan showed an aneurismal bulge in the wall of the vessel.
- An aneurismal change in the vessel worried the doctors.
