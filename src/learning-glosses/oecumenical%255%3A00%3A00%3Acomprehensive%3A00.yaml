simpleMeaning: Said of something that holds for the whole world or can apply to it.
scope: Also called general, universal, worldwide, cosmopolitan, ecumenical, or world-wide. It is an adjective.
examples:
- The oecumenical council drew members from every land.
- An oecumenical rule must hold in every country alike.
