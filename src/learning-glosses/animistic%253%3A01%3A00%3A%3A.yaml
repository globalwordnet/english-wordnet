simpleMeaning: Describing something as part of the belief that all things have a spirit.
scope: Also called animist, this one is used to describe things tied to the belief, not to name a person
  who holds it.
examples:
- The animistic carvings showed faces on trees and rocks.
- The old animistic songs spoke of spirits in the wind and water.
