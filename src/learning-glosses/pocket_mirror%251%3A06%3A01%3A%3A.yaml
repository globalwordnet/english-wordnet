simpleMeaning: A small hand-held piece of glass that shows one's face, usually kept in a round metal or
  plastic case, and mostly used away from home to fix make-up.
scope: Also called a compact mirror. It is a piece of glass.
examples:
- They took the pocket mirror from a coat and checked their make-up in it.
- They opened the pocket mirror before going out.
