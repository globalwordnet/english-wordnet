schema: oewn-learning-gloss-v2
senseId: 'voicelessness%1:10:00::'
synsetId: 07145049-n
simpleMeaning: Speaking so softly that only breath comes out, with the folds in the throat not moving.
scope: This is also called a whisper, whispering, or susurration, and it is not loud speech with the throat
  shaking.
examples:
- Their voicelessness made every word hard to catch.
- The nurse spoke with voicelessness so the sleeping child would not wake.
