simpleMeaning: A small, slow-growing Rocky Mountain pine with dense branches, cracked rust-brown bark,
  short needles in fives, and spine-tipped cone scales. Among Earth's oldest trees, some bristlecones
  exceed 4,500 years.
scope: The high-mountain pine of the American West, not other pines and not the giant sequoia.
examples:
- Bristlecone pines on high ridges are among the oldest trees on Earth.
- A bristlecone pine grows slowly on a dry mountain slope.
