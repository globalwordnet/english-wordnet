simpleMeaning: Said of something to do with the people a country sends to speak for it in another country.
scope: This one is about the people sent, not about the country that sends them.
examples:
- The ambassadorial visit brought gifts and fine words from the neighbouring state.
- They kept an ambassadorial silence through the whole meeting.
