senseId: chemosorptive%5:00:00:adsorbent:00
synsetId: 00008462-s
simpleMeaning: Able to bind substances to a surface through chemical bonds rather than through physical
  attraction.
scope: This one is also called chemisorptive.
examples:
- The new lining is chemosorptive, so it locks the fumes to its surface instead of letting them drift
  away.
- Grains in the filter are chemosorptive and catch the gas and hold it fast.
