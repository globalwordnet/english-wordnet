simpleMeaning: To read a story as one with a hidden meaning beyond the words.
scope: Also called allegorize. It is not about making a story into one.
examples:
- The teacher asked the class to allegorise the old tale, finding a hidden meaning in every part.
- The class would allegorise every fable, looking for a lesson beneath the tale.
