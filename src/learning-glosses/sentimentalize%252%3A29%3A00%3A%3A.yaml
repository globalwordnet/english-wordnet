senseId: 'sentimentalize%2:29:00::'
synsetId: 00012937-v
simpleMeaning: To let soft, fond feeling shape what you say and do, and to linger in it.
scope: Sentimentalise, sentimentise and sentimentize are other names for this sense, which keeps the feeling
  in the person who acts, not in a person or thing made full of it.
examples:
- They would sentimentalize the smallest things, and turn them into fond stories.
- The speaker liked to sentimentalize old memories.
