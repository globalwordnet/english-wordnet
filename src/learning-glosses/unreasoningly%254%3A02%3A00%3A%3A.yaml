simpleMeaning: In a way that comes from deep feeling, not from thought.
scope: Also called viscerally. It is a word for how a person acts, not for what they think.
examples:
- They acted unreasoningly, lashing out before they had time to think.
- The crowd reacted unreasoningly, shouting down every speaker.
