simpleMeaning: A style of music that developed in the 1970s, combining jazz and rock and using instruments
  such as electric guitars and synthesizers.
scope: Also called jazz fusion, it is music of the 1970s that mixes loose swinging styles with hard-driving
  band music.
examples:
- The band played jazz-rock on guitars and synthesizers.
- Jazz-rock was new in the 1970s.
