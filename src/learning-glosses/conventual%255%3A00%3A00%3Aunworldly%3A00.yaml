simpleMeaning: Said of a life shared by people living together in a convent, a religious house, shut away
  from the world under holy promises.
scope: Also called cloistered, monastic, cloistral, and monastical; this one is about a shared life in
  a religious house, not a life lived alone.
examples:
- The conventual routine began before dawn with prayer and work.
- They chose a conventual life and left the busy town behind.
