senseId: 'runtime_error%1:11:00::'
synsetId: 07314934-n
simpleMeaning: A logic or arithmetic error that becomes apparent only when a computer program runs.
scope: This name covers a fault in what a program means or counts, also called run-time error and semantic
  error, found only while the program is at work.
examples:
- The runtime error showed up only while the program was at work.
- A runtime error in the sums made the program give the wrong answer.
