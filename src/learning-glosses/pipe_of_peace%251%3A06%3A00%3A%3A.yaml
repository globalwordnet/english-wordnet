simpleMeaning: A richly decorated pipe used by some Native American peoples. It is smoked at ceremonies,
  especially as a sign of peace.
scope: It is also called calumet and peace pipe.
examples:
- They smoked the pipe of peace at the ceremony.
- The pipe of peace was smoked as a sign of goodwill.
