simpleMeaning: A word or phrase that says no, breaking the rules of good grammar but making the no stronger.
scope: This one is not about the kind that turns two nos into a yes.
examples:
- My teacher circled 'I don't never go' and said the sentence uses a negative twice.
- Saying 'I ain't got none' uses a negative twice to make the no stronger, though the grammar is wrong.
