senseId: 'animalization%1:04:00::'
synsetId: 00272723-n
simpleMeaning: People are made cruel, or stripped of what makes them human, by this act.
scope: Also called animalisation, brutalisation, or brutalization, this is a change worked on people,
  not a picture in the shape of a living creature.
examples:
- The animalization of the prisoners in the camp made them cruel to each other.
- The animalization of the prisoners stripped them of pity and kindness.
