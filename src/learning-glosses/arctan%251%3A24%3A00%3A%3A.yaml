simpleMeaning: 'The inverse of the tangent function: it gives the angle whose tangent is a given number.'
scope: 'Also called arc tangent, arctangent, and inverse tangent: the angle worked out from a given number,
  not the tangent itself and not the angle from a different triangle ratio.'
examples:
- The arctan of 1 is 45 degrees.
- She used arctan to find the angle.
