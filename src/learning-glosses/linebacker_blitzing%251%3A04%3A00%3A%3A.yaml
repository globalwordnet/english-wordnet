simpleMeaning: In American football, a rush by players on defense to get past the row of players who block.
scope: It is also called a blitz; a safety blitz is another name for it.
examples:
- The linebacker blitzing caught the quarterback by surprise.
- Linebacker blitzing left the middle of the field open.
