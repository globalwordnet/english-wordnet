synsetId: 11883304-n
simpleMeaning: Southwestern US plant with upright stems, narrow fleshy leaves, and one reddish-orange
  flower where each upper leaf meets the stem. Indigenous people once cooked its fleshy roots.
scope: This is the low Southwestern plant with one orange blossom in each upper leaf joint, not the tall
  red-hot-poker with drooping spikes of red or yellow flowers.
examples:
- The flameflower keeps water in its thick roots and narrow leaves.
- A flameflower was blooming among the rocks, one reddish-orange blossom at each upper leaf joint.
