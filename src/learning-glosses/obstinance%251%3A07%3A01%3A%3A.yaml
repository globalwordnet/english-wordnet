simpleMeaning: A firm refusal to let go of what you yourself think or want, even when others press you
  to change.
scope: Also called stubbornness, obstinacy, pigheadedness, bullheadedness, or self-will. It is a noun.
examples:
- Their obstinance made them refuse every compromise.
- Their obstinance kept the two sides arguing long after midnight.
