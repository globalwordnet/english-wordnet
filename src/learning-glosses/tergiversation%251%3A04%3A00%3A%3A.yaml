senseId: 'tergiversation%1:04:00::'
synsetId: 00753122-n
simpleMeaning: Making a false claim by using unclear words that could mean different things.
scope: Also called equivocation. It is not a plain lie told in clear words.
examples:
- The tergiversation left the committee unsure what had actually been promised.
- The report was full of tergiversation, and no one could tell what it meant.
