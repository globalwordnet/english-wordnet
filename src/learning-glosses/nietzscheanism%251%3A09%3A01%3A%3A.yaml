simpleMeaning: Nietzsche’s philosophy of rethinking values to overcome nihilism and “slave morality,”
  emphasizing the will to power, the overman, and the eternal recurrence of all things.
scope: Nietzsche used “slave morality” in his criticism of values he associated with historical Christianity.
examples:
- Nietzscheanism rejects slave morality and calls for new values.
- She studied Nietzscheanism and its idea of the superman.
