simpleMeaning: In classical mythology, the wealthy yet irreligious second age of the world. More broadly,
  a period whose achievements fall short of a golden age.
scope: In old Greek and Roman stories, this second time of the world falls short of a golden time in what
  it achieved.
examples:
- They told tales of the silver age.
- Men of the silver age forgot the gods.
