simpleMeaning: The fraction of the radiation hitting a surface that bounces back from it.
scope: Also called coefficient of reflection, reflectance, and reflectivity. It is a share.
examples:
- The reflection factor of snow is higher than that of soil.
- Engineers used the reflection factor to work out how bright the room would be.
