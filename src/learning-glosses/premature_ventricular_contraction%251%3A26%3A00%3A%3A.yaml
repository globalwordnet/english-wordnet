senseId: 'premature_ventricular_contraction%1:26:00::'
synsetId: 14386246-n
simpleMeaning: An early heartbeat that starts in a lower chamber of the heart. Repeated episodes can precede
  ventricular fibrillation, a dangerous quivering of those chambers.
scope: This break in the steady beat of the heart can, if it keeps coming back, come before a fast, wild
  beating of the lower rooms of the heart.
examples:
- Her heart showed a premature ventricular contraction.
- A premature ventricular contraction made her heart skip a beat.
