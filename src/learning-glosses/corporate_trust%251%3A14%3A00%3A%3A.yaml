simpleMeaning: A joining of separate firms into one body that holds down rivals by fixing how much of
  a product or a service is made and sold.
scope: Also called a trust, a combine, or a cartel, this one is about separate firms that act as one.
examples:
- They set up the trust in the hope of gaining a monopoly.
- The corporate trust decided how much of the product would be made that year.
