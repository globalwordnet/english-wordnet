simpleMeaning: Heating raw rubber with sulfur makes a hard rubber that does not spring back.
scope: This hard rubber is also called ebonite or hard rubber, not rubber that springs back.
examples:
- The vulcanite handle felt hard in their hand.
- A vulcanite comb did not bend when they pressed it.
