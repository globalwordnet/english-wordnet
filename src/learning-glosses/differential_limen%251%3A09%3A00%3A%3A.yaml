senseId: 'differential_limen%1:09:00::'
synsetId: 05720839-n
simpleMeaning: A change in what comes in through the senses so small that a person can just barely notice
  it.
scope: This one is also called difference limen, difference threshold, and differential threshold.
examples:
- In the test, the listeners heard no change until the pitch passed the differential limen.
- The teacher dimmed the lamp step by step, and the class only saw the room grow darker once the change
  passed the differential limen.
