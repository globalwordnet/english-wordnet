senseId: 'rigidify%2:30:01::'
synsetId: 00419035-v
simpleMeaning: To make a thing stiff so it cannot bend or change, and to fix it in the usual way of doing
  things.
scope: Also called petrify and ossify. It is a verb, not the act of becoming stiff on its own.
examples:
- The new rules rigidify the training schedule.
- Years of habit rigidify the way the office works.
