simpleMeaning: To cause sperm cells to undergo the changes they need to fertilize an egg.
scope: To bring about body changes in male seed cells so they can join with an egg, not to make the cells
  and not to join the cells with an egg by hand.
examples:
- The fluid helps capacitate the sperm before it can fertilize the egg.
- Scientists watched the cells capacitate in the dish.
