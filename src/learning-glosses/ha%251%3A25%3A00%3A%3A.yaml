simpleMeaning: The angle measured westward from the local meridian to a sky object along the celestial
  equator. It equals local sidereal time minus the object’s right ascension.
scope: HA stands for hour angle. The local meridian runs north to south across the sky through the point
  overhead.
examples:
- The HA of the star was three hours.
- The star’s HA was zero as it crossed the local meridian.
