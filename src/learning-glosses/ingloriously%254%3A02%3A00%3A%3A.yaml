simpleMeaning: Done without honour, whether in the act itself or in how far it reaches.
scope: Shamefully, disgracefully, dishonorably, ignominiously, discreditably and dishonourably are other
  names for this way of acting.
examples:
- The losing side left the field ingloriously.
- The speech ended ingloriously, with the crowd already leaving.
