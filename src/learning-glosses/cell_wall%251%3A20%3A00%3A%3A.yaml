simpleMeaning: A rigid outer layer, typically containing sugar chains, around the membrane of plant cells
  and many prokaryotic cells. It protects the cell and maintains its shape.
scope: The rigid layer around plant and prokaryotic cells, keeping the cell's shape.
examples:
- Cell walls hold the cell's shape.
- The cell wall guards the cell.
