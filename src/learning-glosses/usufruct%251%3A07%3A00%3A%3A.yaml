senseId: 'usufruct%1:07:00::'
synsetId: 05197624-n
simpleMeaning: The right, given by law, to use a thing that belongs to someone else and take the gain
  from it, while keeping the thing itself unharmed.
scope: It is a legal right, not ownership itself.
examples:
- The will gave the usufruct of the house to the surviving spouse for life.
- Under the usufruct, the farm could be worked but not sold.
