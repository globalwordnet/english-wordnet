simpleMeaning: A set of nerve parts in the head, linked by what they do, that have to do with feelings
  and the way we act.
scope: It is also called the limbic system and the visceral brain.
examples:
- The limbic brain takes part in how we feel.
- Damage to the limbic brain can change a person's feelings.
