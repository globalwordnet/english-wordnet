simpleMeaning: A link between changing things, where how fast each one changes is never steady.
scope: Also called curvilinear correlation and nonlinear correlation. It is a noun.
examples:
- They found a skew correlation between hours of sleep and test scores.
- A skew correlation showed up in the data, so the team looked for a better model.
