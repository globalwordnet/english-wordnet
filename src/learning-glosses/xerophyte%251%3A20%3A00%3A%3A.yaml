senseId: 'xerophyte%1:20:00::'
synsetId: 13141863-n
simpleMeaning: A plant adapted to scarce water. Compare a hydrophyte, adapted to water, and a mesophyte,
  adapted to moderate moisture.
scope: This one is also called a desert plant, a xerophile, a xerophilous plant, and a xerophytic plant,
  and it is unlike the kinds that need a middling amount.
examples:
- A xerophyte grew in the dry sand where few other plants could live.
- They put a xerophyte on the sunny balcony and watered it only once a month.
