simpleMeaning: One of 20 temporary hard white biting parts in a young mammal, the first set in a child.
scope: Also called a baby tooth, a deciduous tooth, and a milk tooth. It is a body part.
examples:
- The child lost a first biting part at age six.
- The dentist said the loose one was one of the child's first set.
