senseId: 'sentimentalize%2:30:03::'
synsetId: 00580182-v
simpleMeaning: To steep a person or a thing in soft, fond feeling, until it runs through them.
scope: Sentimentalise is another name for this sense, which puts the feeling into a person or a thing,
  not into the one who acts.
examples:
- Too much poetry sentimentalizes the mind.
- These experiences have sentimentalized her.
