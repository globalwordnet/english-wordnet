simpleMeaning: The time between one point where the moon comes closest to the earth and the next, about
  27.5546 days.
scope: This is not about the points where the moon is farthest from the earth.
examples:
- They worked out the anomalistic month from the dates of two perigees in a row.
- Astronomers use the anomalistic month to track the moon's path.
