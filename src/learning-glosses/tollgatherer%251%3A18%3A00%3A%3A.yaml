simpleMeaning: A person whose job is to take in the money paid for the use of a road or a bridge.
scope: Also called a toll agent, a toll collector, a toll taker, a toller, and a tollkeeper. It is a kind
  of worker.
examples:
- The tollgatherer took our coins at the bridge.
- A tollgatherer sat in the small booth by the road.
