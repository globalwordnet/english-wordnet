simpleMeaning: How easily a thing catches fire and keeps burning.
scope: Burnability and combustibleness are other names for this; this one is not about how hard a thing
  is to burn.
examples:
- The combustibility of dry leaves makes them a fire risk in summer.
- Firefighters test the combustibility of building materials before approving them.
