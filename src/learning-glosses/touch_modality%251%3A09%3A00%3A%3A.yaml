simpleMeaning: With the body, above all with the hands, a person feels what is outside it, whether things
  or forces.
scope: Also called touch, cutaneous senses, sense of touch, and skin senses, this sense works through
  contact, not by sight.
examples:
- Only sight and touch modality let us tell where things are around us.
- They tested touch modality by asking them to tell what they felt with their hands.
