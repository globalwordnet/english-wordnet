simpleMeaning: One who writes a life story that treats its subject with deep respect, or makes them seem
  flawless.
scope: This writer is also called a hagiographer, or a hagiographist.
examples:
- The hagiologist wrote a life of the leader that left out every flaw.
- Readers trusted the hagiologist's account, though it praised its subject without end.
