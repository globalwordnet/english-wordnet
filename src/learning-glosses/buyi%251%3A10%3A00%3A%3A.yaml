simpleMeaning: Tai languages spoken on the Guizhou-Yunnan Plateau, mainly in southern/southwestern Guizhou
  (Buyi-Miao, Miao-Dong prefectures, Zhenning, Guanling counties), Yunnan (Luoping County), and Sichuan
  (Ningnan, Huidong counties).
scope: Also called Bouyei and Yay; one branch of the Tai languages, not the other Tai branches of the
  same area.
examples:
- Buyi is spoken in Guizhou.
- Buyi speakers live in southwest China.
