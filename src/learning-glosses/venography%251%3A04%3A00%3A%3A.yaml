simpleMeaning: An examination of the blood tubes that bring blood back to the heart, using X-rays to make
  pictures of them.
scope: It is a kind of medical examination, not a treatment.
examples:
- The doctor ordered a venography to look at the blood tubes in their leg.
- A venography showed where the blood tube was blocked.
