senseId: 'simplism%1:10:00::'
synsetId: 06752094-n
simpleMeaning: An explanation that cuts out so much of what something really is that it gives a false
  picture of it.
scope: Also called oversimplification. It is an explanation, not an act.
examples:
- The simplism in the book gave readers a false idea of how the war began.
- They saw through the simplism in the short account and asked for the full story.
