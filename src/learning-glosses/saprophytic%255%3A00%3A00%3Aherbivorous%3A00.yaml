simpleMeaning: Some plants and fungi live on dead or rotting matter.
scope: This sense is about plants or fungi living on dead matter, not about food passing through a thin
  wall.
examples:
- Some fungi are saprophytic and live on fallen leaves.
- The saprophytic plant feeds on dead wood.
