simpleMeaning: This quality means something is full and final, with nothing held back and no limits set
  on it.
scope: This word names a quality that sets no terms, not one that holds only if something else happens.
examples:
- They praised the unconditionality of the grant.
- They accepted the offer because of its unconditionality.
