simpleMeaning: The quality of a round shape that is flat at the top and the bottom.
scope: Also called ellipticity. It is a noun.
examples:
- The oblateness of the planet can be seen in its flattened shape at the poles.
- A ball with some oblateness looks flat at the top and bottom.
