simpleMeaning: A US religious group founded in 1966 on Vedic scripture. Members joyfully chant Hare Krishna
  and other Krishna mantras, usually wear saffron robes, eat vegetarian food, and practice celibacy.
scope: 'Also called Hare Krishna and ISKCON: a religious group started in the United States in 1966, not
  a single worshipper.'
examples:
- The International Society for Krishna Consciousness was started in 1966.
- Members of the International Society for Krishna Consciousness chant in the park.
