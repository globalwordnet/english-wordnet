simpleMeaning: A thin, clear plastic film that shrinks when heated to fit tightly around an object.
scope: This thin clear plastic film stretches round a thing and clings to it, covering it tight.
examples:
- They put shrink-wrap round the parcel.
- The shrink-wrap clung to the box.
