senseId: 'megaloblastic_anemia%1:26:00::'
synsetId: 14191255-n
simpleMeaning: Anemia in which bone marrow contains many unusually large, immature red blood cells that
  function poorly. Pernicious anemia is one form.
scope: 'Another name for megaloblastic anaemia: a blood state with many large young red cells that do
  not work right.'
examples:
- Megaloblastic anemia showed in the many large young cells in her blood.
- His megaloblastic anemia was linked with another illness of the blood.
