simpleMeaning: Being clean inside, with no wrong done and no sense of what evil is.
scope: People call this clean inner state innocence, whiteness, purity and pureness, and it means never
  having known evil.
examples:
- People spoke of the sinlessness of her life.
- His sinlessness meant he had never even thought of doing wrong.
