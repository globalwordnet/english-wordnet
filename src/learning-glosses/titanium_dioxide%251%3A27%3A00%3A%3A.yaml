simpleMeaning: Because it covers well and lasts a long time, this white powder is used to colour things.
scope: Titania, titanic oxide and titanium oxide are other names for this white powder, not one that fades
  fast or lets old colours show through.
examples:
- The paint got its white cover from titanium dioxide.
- They chose titanium dioxide because the paint had to last.
