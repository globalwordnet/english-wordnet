simpleMeaning: a computer program that keeps and sorts facts held in linked tables, so they can be found
  and changed
scope: It is a computer program that keeps facts in linked tables, unlike a plain list keeper that stores
  facts with no links between them.
examples:
- The bank stores its accounts in a relational database management system.
- A relational database management system lets clerks find any record they need.
