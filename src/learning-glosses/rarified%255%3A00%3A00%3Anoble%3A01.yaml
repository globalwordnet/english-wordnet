simpleMeaning: Worth a great deal in morals or in thought, and fine in character or in manner of expression.
scope: It is also called grand, elevated, lofty, idealistic, exalted, sublime, rarefied, high-flown, high-minded,
  or noble-minded.
examples:
- The professor held rarified views about art and duty.
- They spoke in rarified terms about the good life.
