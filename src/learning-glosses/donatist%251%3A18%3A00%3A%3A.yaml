simpleMeaning: A follower of Donatism, an early North African Christian movement that emphasized the moral
  standing of clergy.
scope: This word is for a person who holds to that teaching, not for things of that teaching.
examples:
- He became a Donatist after hearing that teaching.
- The Donatist spoke of the teaching with great care.
