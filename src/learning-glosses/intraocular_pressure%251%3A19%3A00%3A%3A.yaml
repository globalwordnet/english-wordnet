simpleMeaning: Pressure from the fluids inside the eye, regulated by resistance to the outward flow of
  the clear fluid called aqueous humor.
scope: Too much of this push inside the eyeball can bring on glaucoma.
examples:
- Glaucoma can result from increased intraocular pressure.
- The doctor checked his intraocular pressure.
