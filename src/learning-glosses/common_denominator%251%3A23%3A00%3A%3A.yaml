simpleMeaning: A whole number that is a multiple of each of the bottom numbers of two or more fractions.
scope: This one is about a number in maths, not a quality shared by members of a group.
examples:
- To add the fractions, first find a common denominator.
- Twelve is a common denominator for thirds and quarters.
