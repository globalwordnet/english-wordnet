simpleMeaning: An unstable acid with the formula CNOH. Its atoms are arranged differently from those in
  cyanic acid. It occurs mainly as explosive salts and esters.
scope: Of unstable acids found chiefly as explosive salts and esters, isomeric with cyanic acid.
examples:
- Fulminic acid forms bursting salts.
- The lab stored fulminic acid with care.
