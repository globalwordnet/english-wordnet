simpleMeaning: Inherited or eligible to be inherited under established rules of descent, usually legal
  ones.
scope: Also called ancestral, hereditary, or transmissible. It describes what comes down through a family.
examples:
- The patrimonial estate passed to the next generation under the old rules.
- They argued over the patrimonial land for years.
