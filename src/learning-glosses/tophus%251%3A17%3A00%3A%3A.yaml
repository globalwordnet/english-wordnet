simpleMeaning: A hard layer that builds up on the teeth and gums.
scope: Calculus and tartar are other names for it. It is not the deposit of gout that forms around a joint.
examples:
- The dentist found a tophus on the patient's teeth.
- A tophus can form on the gums over time.
