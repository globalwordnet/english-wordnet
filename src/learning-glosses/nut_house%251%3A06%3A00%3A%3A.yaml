simpleMeaning: An insulting name for a hospital for people with troubled minds.
scope: Also called a madhouse, a sanatorium, a nuthouse, a booby hatch, a crazy house, a cuckoo's nest,
  a funny farm, a funny house, a loony bin, a snake pit, or Bedlam. It is a noun.
examples:
- They joked that the old building was a nut house.
- In the old film, the men escaped from the nut house.
