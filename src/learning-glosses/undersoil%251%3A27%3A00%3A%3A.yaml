senseId: 'undersoil%1:27:00::'
synsetId: 14719999-n
simpleMeaning: This is the middle layer of earth in the ground, with the top layer above it and rock below
  it.
scope: Also called subsoil, this name is for a layer of earth, not for the top layer itself or the rock
  below it.
examples:
- They dug through the undersoil to reach the rock.
- Roots grow down through the topsoil into the undersoil.
