simpleMeaning: A tree-like biennial shrub of tropical Africa and southern Asia with woolly stems, prickly
  silvery-white branches, blue or white flower clusters, and bright red holly-like berries.
scope: Not other shrubs with red berries, nor the true hollies of cooler lands; also called Solanum giganteum.
examples:
- African holly grows in tropical Africa.
- The African holly has bright red berries.
