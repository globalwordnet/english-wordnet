simpleMeaning: Said of someone who is not breathing, or who can breathe only by struggling hard for air.
scope: This one is also called breathless, dyspneal, dyspneic, and dyspnoeic.
examples:
- The dyspnoeal man leaned on the table, fighting for air.
- The nurse watched the dyspnoeal child struggle to breathe.
