simpleMeaning: Describing a plant whose seeds come about with no male and female cells joining.
scope: This one is also called apomictic, and it is not about a plant that needs male and female cells
  to join before it can make seeds.
examples:
- The apomictical hawkweed kept the same form from parent to offspring.
- They grew apomictical plants that matched the parent in every way.
