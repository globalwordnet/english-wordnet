simpleMeaning: A state of not knowing whether a thing is true, a fact, or even there at all.
scope: This one is also called doubt, question, and doubtfulness.
examples:
- The dubiousness of his claim made the committee pause.
- The report spoke of the dubiousness of the whole plan.
