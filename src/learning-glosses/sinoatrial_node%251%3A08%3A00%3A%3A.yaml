simpleMeaning: The heartbeat keeps its steady pace because this tiny bit of heart tissue tells it when
  to beat.
scope: This bit of heart tissue is also called a pacemaker, a cardiac pacemaker and the SA node.
examples:
- The sinoatrial node sends out the signal that starts each heartbeat.
- The sinoatrial node sets the pace, and the rest of the heart follows.
