simpleMeaning: An early embryo formed by egg division, a fluid-filled sphere with a wall one cell thick.
  In humans the corresponding stage implants in the uterus about eight days after fertilization.
scope: This sense is also called blastula.
examples:
- The blastosphere is a liquid-filled ball.
- A blastosphere settles in the womb wall.
