simpleMeaning: This wheel cuts a row of small holes because small points stick out round its edge.
scope: Also called roulette, this is a tool that punches a row of small holes, not one made for rolling.
examples:
- The toothed wheel pressed a row of small holes along the edge of the paper.
- They turned the toothed wheel slowly to punch the holes in a straight line.
