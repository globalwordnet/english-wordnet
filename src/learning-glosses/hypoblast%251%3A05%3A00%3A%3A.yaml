simpleMeaning: An older name for the inner layer of an embryo that forms the lining of the digestive tract
  and airways.
scope: In modern human embryology, hypoblast names an earlier layer that contributes to the yolk sac lining.
  The older sense here means endoderm.
examples:
- The older textbook calls the inner germ layer the hypoblast.
- Its diagram labels the future gut lining as tissue derived from the hypoblast.
