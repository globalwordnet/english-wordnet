simpleMeaning: An infection often affecting the nose, caused by an organism once classified as a fungus.
  It is associated with swimming in contaminated water.
scope: An illness of the nose caused by a fungus, often caught while swimming, not a cold and not a nosebleed.
examples:
- The swimmer was treated for rhinosporidiosis after the infection took hold in his nose.
- He caught rhinosporidiosis while swimming.
