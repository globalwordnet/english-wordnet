simpleMeaning: A sharp-tasting red fruit, round and small, gives the oil called wintergreen oil.
scope: Also called boxberry, checkerberry, teaberry and wintergreen, this sharp-tasting red fruit gives
  wintergreen oil, not the shrub with coral-red fruit of the same name.
examples:
- They tasted a spiceberry and found the taste sharp.
- They bit into a spiceberry and winced at the sharp taste.
