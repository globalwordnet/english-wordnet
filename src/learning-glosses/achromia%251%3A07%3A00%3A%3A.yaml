senseId: 'achromia%1:07:00::'
synsetId: 04966238-n
simpleMeaning: A lack of the usual colour, above all in the skin, as in albinism, a state with no skin
  colour, or in the red cells of the blood.
scope: This one names the lack, not the place where it shows.
examples:
- They found achromia in the skin of the patient's hands.
- The blood test showed achromia in the red cells as well.
