simpleMeaning: A lack of normal coloring, especially in the skin, as in albinism, or in red blood cells.
scope: This one names the lack, not the place where it shows.
examples:
- They found achromia in the skin of the patient's hands.
- The blood test showed achromia in the red cells as well.
