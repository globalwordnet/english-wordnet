senseId: liege%5:00:00:loyal:00
synsetId: 00965495-s
simpleMeaning: Describing a feudal relationship in which a subject owes loyalty and service to a lord,
  or the lord is entitled to receive them.
scope: The adjective for such loyalty, not the person who holds land and not the lord.
examples:
- He swore to serve his liege lord in war and in peace.
- A liege subject owed the lord both work and fighting men.
