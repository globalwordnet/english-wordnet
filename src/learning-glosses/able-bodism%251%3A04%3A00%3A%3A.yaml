simpleMeaning: Discrimination that favors people without disabilities over disabled people.
scope: This one is also called ableism, able-bodiedism, or ablism.
examples:
- The hiring panel showed able-bodism by picking the runner over the clerk in a wheelchair.
- They said the new policy would end able-bodism in the workplace.
