simpleMeaning: A verb form for an action in the middle of happening at some earlier time.
scope: Also called past progressive. It is a verb form.
examples:
- The sentence 'We were eating when the guests came' shows the past progressive tense.
- In 'They had been working all day', 'had been working' is in the past progressive tense.
