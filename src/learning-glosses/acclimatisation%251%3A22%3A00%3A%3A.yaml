senseId: 'acclimatisation%1:22:00::'
synsetId: 13445816-n
simpleMeaning: This change lets a living thing settle into the weather of a new place, with its heat or
  cold, its height, or its surroundings.
scope: This one is also called acclimation and acclimatization.
examples:
- Their acclimatisation to the desert took a while, with slow walks in the sun.
- The acclimatisation of the newcomers went well once they drank plenty of water.
