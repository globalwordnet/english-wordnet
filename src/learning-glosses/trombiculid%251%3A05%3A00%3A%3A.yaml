simpleMeaning: A mite whose young larvae live as parasites on land animals with backbones. Its later stages
  feed on the young of small arthropods, such as insects.
scope: A mite whose youngest live on land animals with backbones, while the nymphs and adults eat young
  small jointed animals.
examples:
- The trombiculid larvae lived on a small land animal.
- Adult trombiculids feed on the early stages of tiny arthropods.
