simpleMeaning: An angle picked out by the fact that one divided by its sine comes to a given number.
scope: Also called arc cosecant and inverse cosecant, this one is the angle you end up with, not the number
  you start from.
examples:
- They looked up the arccosecant of three in the table.
- The arccosecant gave them the angle they needed for the drawing.
