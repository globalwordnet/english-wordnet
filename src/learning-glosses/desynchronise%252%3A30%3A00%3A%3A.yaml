senseId: 'desynchronise%2:30:00::'
synsetId: 00395469-v
simpleMeaning: To stop things from happening at the same time, making them happen at times that have nothing
  to do with each other.
scope: This one is also called desynchronize.
examples:
- The new plan will desynchronise the two teams' start times.
- A fault in the wiring can desynchronise the clocks in the building.
