senseId: 'trophobiosis%1:24:00::'
synsetId: 13865040-n
simpleMeaning: One living thing guards another and gets some kind of food from it in return, while the
  two live side by side.
scope: Two living things share a life in which one guards the other for food, not one living off the other
  while giving nothing back.
examples:
- The ants guard the aphids and take food from them, living in trophobiosis.
- In trophobiosis, the guard gets food from the one it guards.
