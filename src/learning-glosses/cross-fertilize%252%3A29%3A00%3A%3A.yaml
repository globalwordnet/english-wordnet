senseId: 'cross-fertilize%2:29:00::'
synsetId: 00053373-v
simpleMeaning: To cause an egg from one individual to be fertilized by a male reproductive cell from another
  of the same species.
scope: Also called cross-fertilise. It is about making new life start, not about new life starting.
examples:
- The gardener cross-fertilized the apple trees with pollen from another tree.
- Bees cross-fertilize the flowers as they move from plant to plant.
