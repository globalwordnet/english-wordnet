simpleMeaning: Dryness caused by too little moisture, especially where there is a lasting lack of rain.
scope: Also called aridity and thirstiness, this is a state of too little wetness when rain has been gone
  for good.
examples:
- With the rain gone for good, aridness set in.
- The ground showed aridness after the rain had been gone for good.
