senseId: 'voicelessness%1:26:00::'
synsetId: 14423911-n
simpleMeaning: A disorder of the organs that produce the voice, causing loss of the ability to make voiced
  sounds.
scope: Also called aphonia. It is a disorder, not a soft way of speaking.
examples:
- After the operation, the singer's voicelessness left them unable to speak above a whisper.
- The doctor treated the voicelessness that had taken the patient's speech away.
