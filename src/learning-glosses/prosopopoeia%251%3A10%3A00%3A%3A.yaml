senseId: 'prosopopoeia%1:10:00::'
synsetId: 07122808-n
simpleMeaning: The act of showing an abstract idea or quality in the form of a person or another living
  being.
scope: Also called personification. It is a way of speaking.
examples:
- The poet's prosopopoeia gave the wind a voice and a will of its own.
- In the poet's prosopopoeia, Death walked into the room and spoke to the guests.
