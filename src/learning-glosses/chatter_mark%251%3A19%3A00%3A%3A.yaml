senseId: 'chatter_mark%1:19:00::'
synsetId: 11456277-n
simpleMeaning: Scratches on a rock that ice has scraped over, left by the slow slide of a great sheet
  of ice.
scope: This one is about lines a glacier leaves on rock, not lines a tool leaves on a workpiece.
examples:
- The chatter marks on the boulder showed where the glacier had dragged stones across it.
- The guide pointed out the chatter marks on the rock where the ice had passed.
