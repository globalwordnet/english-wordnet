simpleMeaning: The quality of sending out light, or of sending back light that has fallen on a thing.
scope: It is a kind of quality, also called light and brightness, and also known as luminosity, luminance,
  and brightness level.
examples:
- The luminousness of the fireflies made the whole field glow after dark.
- The luminousness of the new lamp was measured against the old one.
