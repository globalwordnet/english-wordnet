simpleMeaning: A stroke of the bat that gets the batter to the second bag without being put out.
scope: It is also called a double, a two-bagger, and a two-baser.
examples:
- Their two-base hit landed in the gap and they stopped at second.
- Their two-base hit put them on second with two outs.
