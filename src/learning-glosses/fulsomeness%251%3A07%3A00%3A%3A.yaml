senseId: 'fulsomeness%1:07:00::'
synsetId: 04875718-n
simpleMeaning: Earnestness that is pleased with itself and serves its own ends.
scope: Also called unction, oiliness, oleaginousness, smarminess, and unctuousness, this sense is not
  about too much praise given with charm that is only on the surface.
examples:
- The fulsomeness of their manner put the guests on guard.
- The welcome speech was thick with fulsomeness, and no one believed a word.
