simpleMeaning: Nearly all places with mild weather have this common grass, which grows like a weed and
  feels rough with stiff hairs.
scope: Also called glaucous bristlegrass, yellow bristle grass, yellow foxtail, and Setaria glauca, this
  one feels rough with stiff hairs.
examples:
- The yellow bristlegrass spread across the dry field and crowded out the other plants.
- Along the roadside, yellow bristlegrass grew thick and rough.
