simpleMeaning: Said of something that calms a person down and takes away worry.
scope: Also called sedative, tranquilizing, tranquillising, tranquilising, tranquillizing, and ataractic,
  this adjective is about a calming quality.
examples:
- The ataraxic tea helped them relax before bed.
- They felt the ataraxic effect of the medicine, and their worry faded.
