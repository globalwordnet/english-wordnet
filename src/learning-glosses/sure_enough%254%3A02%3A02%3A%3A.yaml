simpleMeaning: In a firm way that leaves nothing in doubt.
scope: It is also called sure, certainly, surely, for certain, for sure, and sure as shooting.
examples:
- The letter will come sure enough, so there is no need to worry.
- Sure enough, the old bridge held up under the heavy load.
