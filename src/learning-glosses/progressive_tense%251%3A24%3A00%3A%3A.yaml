simpleMeaning: A form of a verb used for talking about an action still going on.
scope: Also called imperfect, progressive, continuous tense, or imperfect tense. It is a verb form.
examples:
- In 'They are reading', the progressive tense shows the reading still going on.
- The progressive tense in 'They were walking' shows the walking still going on.
