simpleMeaning: A substance put into food to make it taste or look better, or last longer.
scope: Also called food additive, this one is put into food on purpose, not found in it by nature.
examples:
- The artificial additive kept the bread soft for days.
- They checked the label for any artificial additive in the juice.
