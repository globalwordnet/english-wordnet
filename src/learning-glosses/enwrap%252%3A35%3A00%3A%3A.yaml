simpleMeaning: To put a cover right round a thing, or to fold round it till no part shows.
scope: This one is also called wrap, and envelop, enclose, and enfold are other names for it.
examples:
- They enwrapped the gift in bright paper.
- The mist enwrapped the hills before dawn.
