senseId: 'significant_digit%1:23:00::'
synsetId: 13764151-n
simpleMeaning: A digit that conveys a number's precision. Count from the first nonzero digit through the
  last meaningful digit, including a final zero when it indicates precision.
scope: This sense is also called significant figure.
examples:
- A significant digit is known for sure.
- Significant digits start with the first non-nought figure.
