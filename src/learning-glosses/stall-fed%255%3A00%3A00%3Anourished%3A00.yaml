simpleMeaning: To grow fat for sale, farm animals are kept in a pen and given food there.
scope: This word is used of farm animals kept in a pen and fattened for sale, not of animals left out
  in the open.
examples:
- The stall-fed animals were ready for sale.
- They sold the stall-fed animals at the market.
