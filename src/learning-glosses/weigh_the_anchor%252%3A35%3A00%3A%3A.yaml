simpleMeaning: When sailors haul up a heavy iron hook that holds a ship still, a ship is ready to set
  sail.
scope: This act is also called weigh anchor, not dropping a hook to hold a ship still.
examples:
- They weighed the anchor at dawn and sailed out of the harbour.
- The crew weighed the anchor before the ship left port.
