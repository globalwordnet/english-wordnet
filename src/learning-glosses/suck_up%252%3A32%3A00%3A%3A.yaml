senseId: 'suck_up%2:32:00::'
synsetId: 00882499-v
simpleMeaning: To try to win the good will of someone by acting humble or praising them too much.
scope: Also called fawn, kowtow, toady, truckle, bootlick, or kotow. It is a way of acting toward a person,
  not a way of taking in liquid.
examples:
- They suck up to the manager with praise and humble acts.
- They were sucking up to the teacher, praising every word the teacher said.
