simpleMeaning: An emotional illness that takes away a person's strength until they cannot work.
scope: Also called nervous prostration. It is an illness of the feelings, not a tiredness of the body.
examples:
- Months of worry brought on nervous exhaustion.
- Nervous exhaustion left them too weak to work.
