simpleMeaning: A tree that is bare of leaves through the winter, found from the south-east of America
  south into Mexico.
scope: This one is also called black haw, chittimwood, false buckthorn, shittimwood, or Bumelia lanuginosa.
examples:
- A chittamwood stood at the edge of the field, bare of leaves in January.
- They planted a chittamwood near the house for shade in summer.
