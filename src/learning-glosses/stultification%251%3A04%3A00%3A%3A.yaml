schema: oewn-learning-gloss-v2
senseId: 'stultification%1:04:00::'
synsetId: 00273722-n
simpleMeaning: The act of making something serve no purpose, as when it is done over and over in the same
  fixed way.
scope: It is also called impairment, constipation, or deadening; it is not mockery.
examples:
- The committee's stultification of the plan left it useless.
- Stultification grew as the same steps were repeated year after year.
