simpleMeaning: A trailing plant from southern Africa, often grown for its pink flowers and ivy-shaped
  leaves, whose stalks attach to the underside of the blade.
scope: The scientific name is Pelargonium peltatum. Its trailing stems make it popular in hanging baskets.
examples:
- The ivy geranium trails as it grows.
- Ivy geraniums bear pink-red flowers.
