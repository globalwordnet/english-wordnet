simpleMeaning: To have a quality or identity, linking a subject to an adjective or noun, as in “she is
  happy” or “he is a teacher.”
scope: The linking use only, with an adjective or a noun after it; not existing or happening.
examples:
- The soup is hot.
- He is a doctor.
