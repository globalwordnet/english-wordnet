simpleMeaning: Music from the 1900s that lets the performer decide what luck, or unfixed parts, will do.
scope: Also called aleatoric music and chance music.
examples:
- The aleatory music in the programme gave the pianist free choices.
- They listened to aleatory music in which the ending was never fixed.
