simpleMeaning: A chemical used in photography to keep a developed image stable when it is exposed to light.
scope: Also called hypo and sodium thiosulphate. It is a compound.
examples:
- The darkroom worker mixed sodium thiosulfate into the fixing bath.
- Without sodium thiosulfate, the print would keep on darkening.
