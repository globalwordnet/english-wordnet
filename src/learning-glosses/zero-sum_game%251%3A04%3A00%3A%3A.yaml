simpleMeaning: A contest in which the wins and losses of all the players together add up to nothing.
scope: It is about a contest, not one in which every player can win at once.
examples:
- They played a zero-sum game in which the winner took the loser's money.
- In a zero-sum game, one side can only gain what the other side loses.
