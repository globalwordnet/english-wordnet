simpleMeaning: An electrical device that cuts down the flashes made when electrical contacts are opened
  or closed.
scope: It is about an electrical device, not a wire net that stops burning bits from flying out of a fire.
examples:
- The spark arrester cut down the flashes at the contacts.
- A spark arrester was fitted where the contacts open and close.
