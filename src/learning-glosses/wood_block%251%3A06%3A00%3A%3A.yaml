simpleMeaning: A piece of timber with a picture cut into its surface, used to press copies onto paper.
scope: Also called wood engraving and woodcut. It is not the print made from it.
examples:
- The artist inked the wood block and pressed it onto paper.
- They carved a wood block with a design of a ship.
