senseId: 'necrosis%1:19:00::'
synsetId: 11507108-n
simpleMeaning: The death of living cells in one place, as from an infection or from blood no longer reaching
  them.
scope: Also called mortification, gangrene, and sphacelus. It is not the death of the whole body.
examples:
- The wound showed necrosis where the blood had stopped reaching the skin.
- After the infection, necrosis set in around the cut.
