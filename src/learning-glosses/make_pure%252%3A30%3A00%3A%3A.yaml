simpleMeaning: To clean a liquid of unwanted matter, raise the share of the wanted part, and draw it off
  by boiling it to steam and turning the steam to liquid again.
scope: It is also called distill, purify, sublimate, and distil.
examples:
- They make pure alcohol by heating the mix and cooling the steam.
- The plant makes pure water from sea water by boiling and cooling.
