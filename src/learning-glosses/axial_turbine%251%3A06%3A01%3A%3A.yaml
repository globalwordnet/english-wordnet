simpleMeaning: A turbine driven by fluid flowing along its shaft, reversing the energy transfer of a compressor
  that pushes fluid along its shaft.
scope: Axial flow turbine is another name for this spinning part.
examples:
- Air moving along the middle line kept the axial turbine spinning.
- The axial turbine slowed when the moving air grew weak.
