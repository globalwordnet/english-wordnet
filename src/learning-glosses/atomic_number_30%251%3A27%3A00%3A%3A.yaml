simpleMeaning: Zinc, a shiny bluish-white metal, brittle at ordinary temperatures but easily shaped when
  heated. It is used in alloys and galvanized iron and occurs as zinc sulfide in zinc blende.
scope: 'Also called Zn and zinc: a blue-white metal that is brittle when cold but easy to shape when heated,
  not a soft yellow metal and not iron.'
examples:
- Zinc has atomic number 30.
- The metal with atomic number 30 is used to coat iron.
