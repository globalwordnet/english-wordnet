simpleMeaning: Said of a person whose mind is taken over by madness or by a loss of reason.
scope: Sick, crazy, mad, disturbed, unbalanced, demented, and unhinged are other names for this state.
examples:
- The man was brainsick, and the family did not know what to do.
- The neighbours whispered that the old sailor was brainsick.
