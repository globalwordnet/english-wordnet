simpleMeaning: To take a piece from something by pressing it hard between finger and thumb, or by cutting
  it with small quick cuts.
scope: Also called clip, snip, nip, or snip off. It is a verb.
examples:
- The gardener began to nip off the dead flowers from the rose bushes.
- The worker nipped off the end of the rope with the small shears.
