simpleMeaning: A prolonged seizure or repeated seizures without recovery of consciousness between them.
  This medical emergency can cause brain damage or death.
scope: This is the name for unbroken fits of epilepsy.
examples:
- They called for help when the status epilepticus would not stop.
- The status epilepticus kept the patient from waking.
