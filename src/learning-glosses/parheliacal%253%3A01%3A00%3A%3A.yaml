simpleMeaning: Relating to or like a bright patch beside the sun that looks like a second sun.
scope: Also called parhelic. It is a quality of light in the sky.
examples:
- The parheliacal glow beside the sun faded as the clouds thickened.
- The parheliacal spots shone bright on either side of the sun.
