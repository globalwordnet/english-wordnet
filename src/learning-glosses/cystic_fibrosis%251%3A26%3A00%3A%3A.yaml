simpleMeaning: An inherited disease caused by changes in the CFTR gene. Thick mucus affects the lungs,
  intestines, and pancreas. It can be treated, but there is currently no cure.
scope: An inherited disorder affecting organs such as the lungs and pancreas.
examples:
- Cystic fibrosis clogs the lungs with mucus.
- The child with cystic fibrosis needed care.
