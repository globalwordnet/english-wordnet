simpleMeaning: An outward curve at the neck or lower back, where the spine usually curves inward.
scope: Doctors can describe this as cervical or lumbar kyphosis, depending on which part of the spine
  curves outward.
examples:
- The X-ray showed kyphosis in the neck.
- The specialist measured the angle of the lumbar kyphosis.
