simpleMeaning: A worm that lives as a parasite in the intestines of an animal with a backbone. Examples
  include roundworms, tapeworms, and flukes.
scope: Also called helminth, this is one of the creatures that live in the gut of a backboned animal.
examples:
- The parasitic worm lived in the gut of the animal.
- A parasitic worm was found in the gut.
