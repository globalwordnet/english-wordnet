simpleMeaning: An electrical part that lets a strong electric flow pass one way only, usually used to
  turn power that changes direction into power that flows one way.
scope: It is a part.
examples:
- The radio uses a rectifier diode to change the power from the wall into steady power.
- A rectifier diode lets power flow only one way through the circuit.
