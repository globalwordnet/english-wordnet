senseId: 'synesthetic%3:01:00::'
synsetId: 02818949-a
simpleMeaning: Of a link where one sense sets off another, so that more than one sense is at work.
scope: This word marks a case where one sense starts another one working, also called synaesthetic, with
  more than one sense at work.
examples:
- The music gave the listener a synesthetic response, and colours came with the notes.
- The poet used a synesthetic metaphor that joined sound and sight.
