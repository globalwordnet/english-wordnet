simpleMeaning: Blood leaves the two halves of the brain through any of several blood vessels, and each
  one carries it back toward the heart.
scope: This is one of several blood vessels of the brain, also called cerebral vein, not the only one.
examples:
- The scan showed the vena cerebri carrying blood away from the two halves of the brain.
- The surgeon had to take care near the vena cerebri during the operation on the brain.
