simpleMeaning: A sexual position with the man on top, facing the woman. A traditional explanation links
  the name to missionaries' beliefs about how Indigenous people should have sex.
scope: A way for a man and a woman to lie facing each other during sex, the man on top; not any other
  way of lying together and not a religious rite.
examples:
- They lay in the missionary position, facing each other.
- The missionary position was once thought the proper one by missionaries.
