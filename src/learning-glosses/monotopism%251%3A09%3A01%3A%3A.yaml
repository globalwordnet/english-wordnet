simpleMeaning: How a group of living things that scientists class together first came to be, at one place
  only or once only, such as by a sudden change in them.
scope: It is an origin.
examples:
- Monotopism explains why this group of plants is found in only one valley.
- The scientist used monotopism to show that the group began at a single place.
