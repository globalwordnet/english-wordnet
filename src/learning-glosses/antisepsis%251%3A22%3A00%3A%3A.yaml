simpleMeaning: The work of keeping tiny living things from growing and making more of themselves.
scope: Also called asepsis, this one is a process, not a state of being clear of germs.
examples:
- Good antisepsis in the operating room keeps wounds from getting infected.
- The nurse followed strict antisepsis rules before touching the patient.
