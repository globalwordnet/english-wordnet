simpleMeaning: A theory in economics that says changes in joblessness and in how fast prices rise usually
  come from changes in the amount of cash in use.
scope: It is a theory.
examples:
- Monetarism says that printing more cash brings higher prices.
- The professor taught monetarism to explain why prices kept rising.
