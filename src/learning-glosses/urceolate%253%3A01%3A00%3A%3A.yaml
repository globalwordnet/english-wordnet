simpleMeaning: Said of a thing shaped like a wide jar, big at the bottom and narrow at the top where it
  opens.
scope: It is a word for the shape of a thing, not for the thing itself.
examples:
- The cup had an urceolate bowl, wide at the base and narrow at the rim.
- Urceolate leaves swell out below and close in near the tip.
