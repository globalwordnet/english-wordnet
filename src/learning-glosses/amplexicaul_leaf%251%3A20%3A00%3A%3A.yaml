simpleMeaning: A leaf whose lower end wraps round the stem and holds it tight.
scope: This word names it by the grip it takes, not by the stem it holds.
examples:
- The gardener showed me the amplexicaul leaf that hugs the stem of the young plant.
- An amplexicaul leaf holds the stem tight where its foot joins it.
