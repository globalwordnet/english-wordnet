simpleMeaning: Seeds are kept safe from birds by this figure in the shape of a person.
scope: This sense is also called scarecrow, bird-scarer, scarer, and strawman, and is not the weak argument
  of the same name.
examples:
- A straw man stood among the seeds to scare the birds.
- The straw man kept the birds from the seeds.
