simpleMeaning: A living thing rooted in soil that makes fruit only once in its life, then dies.
scope: It is also called monocarp and monocarpic plant.
examples:
- The monocarpous plant bore fruit once and then died.
- We left the monocarpous plant alone until it bore fruit and died.
