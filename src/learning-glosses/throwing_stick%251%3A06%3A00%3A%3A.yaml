simpleMeaning: A curved piece of wood that comes back to the person who sent it when sent through the
  air the right way.
scope: This is also called a boomerang and a throw stick, not the sling-like device that sends a dart
  or a spear.
examples:
- The throwing stick left their hand and came back to them.
- When sent the right way, the throwing stick came back to the person who sent it.
