senseId: 'capacitive_sensor%1:06:01::'
synsetId: 92461509-n
simpleMeaning: A sensor that detects objects by a change in capacitance when they conduct electricity
  or respond to an electric field differently from air.
scope: A device that finds things that carry charge or hold a dielectric, not a switch and not a meter
  that measures heat.
examples:
- The capacitive sensor switched on when her hand came near.
- A capacitive sensor can tell a metal key from a plastic one.
