simpleMeaning: A person who harms another person's good name by spreading false and damaging statements
  about them.
scope: Backbiter, defamer, libeler, maligner, slanderer, and vilifier are other names for it.
examples:
- The traducer spread false stories to ruin a neighbour's good name.
- No one believed the traducer who tried to blacken a teacher's name.
