simpleMeaning: Said of one whose mind is unwell in a way that has not yet been found and named.
scope: Also called psychopathic or psychopathologic. It is a word.
examples:
- The psychopathological patient spoke of voices that no test could explain.
- They called the child psychopathological, though no doctor had yet named the trouble.
