simpleMeaning: In medicine, the use of energy given off by a substance to treat a disease, above all cancer.
scope: In medicine, it is also called radiation, radiotherapy, actinotherapy, or irradiation.
examples:
- The doctor gave radiation therapy for the cancer in the neck.
- They chose radiation therapy to treat the cancer.
