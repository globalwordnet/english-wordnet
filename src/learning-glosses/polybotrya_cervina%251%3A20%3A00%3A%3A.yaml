simpleMeaning: A tropical American fern that grows on land and has leathery, spear-shaped leaves. It is
  sometimes placed in the genus Polybotrya.
scope: Also called hart's-tongue, hart's-tongue fern, Olfersia cervina and Polybotria cervina, this is
  a land fern of tropical America with tough spear-shaped leaves, not a water fern.
examples:
- The Polybotrya cervina grew on the forest floor.
- A Polybotrya cervina shaded the path.
