simpleMeaning: An anticancer drug sold as Alkeran, used to treat multiple myeloma, a cancer affecting
  bone marrow, and some other cancers.
scope: This is a drug that fights cancer, used for a cancer of the bone marrow and other cancers, not
  a drug for pain and not a cure for all cancers.
examples:
- The doctor gave her melphalan to treat the myeloma.
- Melphalan is sold under the trade name Alkeran.
