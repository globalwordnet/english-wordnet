simpleMeaning: How strongly a thing that picks up sound or radio waves favours one side over the rest.
scope: This one is also called directionality, and is about a microphone or antenna, not about telling
  people what to do.
examples:
- The directivity of the antenna meant it worked best when aimed at the tower.
- Engineers measured the directivity of the microphone before fitting it in the hall.
