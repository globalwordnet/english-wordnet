simpleMeaning: A deliberate attempt to frighten or confuse someone, usually to gain an advantage.
scope: The expression refers to calculated psychological manipulation.
examples:
- The football players tried to play mind games with the opposition.
- His claim that the match had been moved was a mind game meant to confuse his opponent.
