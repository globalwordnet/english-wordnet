simpleMeaning: A wall in a church, set between where the people sit and where the choir sings and the
  altar stands.
scope: This church wall keeps the people's seats on one side and the choir and altar on the other.
examples:
- The rood screen stood between the seats and the choir.
- They walked past the rood screen on their way to their seats.
