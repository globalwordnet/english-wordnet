simpleMeaning: In religious belief, a place where those condemned after death are punished by fire that
  burns forever.
scope: This sense is the imagined place of endless fire used as punishment, not a fire that burns in the
  real world.
examples:
- She feared she would burn in hellfire after death.
- The preacher warned the crowd about hellfire.
