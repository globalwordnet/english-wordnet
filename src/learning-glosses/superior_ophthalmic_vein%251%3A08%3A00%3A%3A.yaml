simpleMeaning: A vein that starts at the inner corner of the eye socket and passes through the superior
  orbital fissure, a gap leading to the cavernous sinus, where it drains.
scope: For the vein that drains the eye into the cavernous sinus.
examples:
- The superior ophthalmic vein drains the eye.
- Doctors trace the superior ophthalmic vein.
