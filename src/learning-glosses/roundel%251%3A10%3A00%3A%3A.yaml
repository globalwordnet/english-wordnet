senseId: 'roundel%1:10:00::'
synsetId: 06392757-n
simpleMeaning: An English form of a rondeau, a short poem in a fixed shape, of three three-line parts
  with the same lines repeated after the first and third.
scope: This is a poem, not the piece of armour that shares its name.
examples:
- The roundel they wrote had a refrain after the first and third triplets.
- They chose a roundel as the form for the poem.
