simpleMeaning: Someone who points out faults or blames someone for them.
scope: A rebuker, a reprover, and an upbraider are other names for this person, who points out what is
  wrong and lays the blame on someone.
examples:
- The reproacher pointed out the error in the figures and blamed the clerk for it.
- A reproacher told him plainly that the late report was his fault.
