senseId: 'paraduodenal_smear%1:08:00::'
synsetId: 05273595-n
simpleMeaning: A thin layer of material from the duodenum, the first part of the small intestine, spread
  on a slide for examination.
scope: A thin spread of gut matter for close study, also called duodenal smear; not a blood spread and
  not a swab.
examples:
- The lab made a paraduodenal smear from the sample.
- A paraduodenal smear showed cells from the gut.
