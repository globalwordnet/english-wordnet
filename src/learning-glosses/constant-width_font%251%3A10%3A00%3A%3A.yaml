simpleMeaning: A typeface in which every character occupies the same width, as on a typewriter.
scope: Fixed-width font, monospaced font, and typewriter font are other names for this sense.
examples:
- The old printer used a constant-width font for its tables.
- A constant-width font makes the columns line up neatly on the page.
