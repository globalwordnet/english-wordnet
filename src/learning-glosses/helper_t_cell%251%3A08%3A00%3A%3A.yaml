simpleMeaning: An immune cell with a marker called CD4. It recognizes pieces of foreign material displayed
  by other cells and signals B cells and killer T cells. HIV can destroy it.
scope: Not other T cells, nor other white blood units; also called helper cell, CD4 cell, and CD4 T cell.
examples:
- Helper T cells fight infection.
- The AIDS virus kills helper T cells.
