simpleMeaning: A tall tropical American grass that grows in clumps year after year. It now grows wild
  in the southern United States and provides pasture and livestock feed.
scope: This sense is also called dallisgrass and paspalum, a tall tufted long-lived warm-land American
  grass, now at home as feed grass in the south of the United States.
examples:
- Dallis grasses feed stock in the south.
- The dallis grass grows tall and tufted.
