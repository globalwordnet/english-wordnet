simpleMeaning: This paper stands for a stake in a company, but it says nothing about who owns it, and
  the person holding it counts as the owner.
scope: Also called a bearer share, this one is about a paper.
examples:
- In some countries, bearer stocks are banned, because of their potential for abuse.
- They keep their money in bearer stock, so no one can tell from the paper that they own it.
