senseId: 'drug_enforcement_agency%1:14:00::'
synsetId: 08158374-n
simpleMeaning: An informal name for the US Drug Enforcement Administration, which enforces controlled-substance
  laws and works to disrupt drug trafficking organizations.
scope: This is the federal body that makes people obey the laws and rules for narcotics and controlled
  substances; Drug Enforcement Administration and DEA are other names for this sense, and it stands apart
  from other federal bodies by its goal of stopping the gangs that move narcotics.
examples:
- The Drug Enforcement Agency seized the narcotics.
- The Drug Enforcement Agency works to stop the gangs that move narcotics.
