simpleMeaning: Inflammation of the aorta, the body's main artery, during rheumatic fever.
scope: The swelling of the body's main artery, not the fever that brings it on, is the thing named here.
examples:
- The scan showed rheumatic aortitis in the main artery.
- Treatment for rheumatic aortitis began once the swelling was found.
