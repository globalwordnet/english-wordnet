simpleMeaning: A box or set of parts that picks up weak sound signals, boosts them, and plays them out
  loud.
scope: A loudspeaker is its near kin, but this is the whole set of parts that picks up weak sound signals,
  boosts them, and plays them out loud.
examples:
- They switched on the reproducer and the sound came through loud and clear.
- The reproducer failed, and no sound came out at all.
