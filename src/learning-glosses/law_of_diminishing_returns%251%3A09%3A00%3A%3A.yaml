simpleMeaning: A general statement saying that going on past a certain point in doing well will make things
  work less well.
scope: It is a general statement about keeping on with a task.
examples:
- The law of diminishing returns set in after the third hour of study.
- They hit the law of diminishing returns when extra practice stopped helping.
