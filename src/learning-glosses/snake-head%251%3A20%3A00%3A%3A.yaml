simpleMeaning: A showy perennial of eastern and central North American marshes, with waxy, spear-shaped
  leaves and flowers that are creamy white below and pale pink to deep purple above.
scope: This sense is also called turtlehead, shell-flower, shellflower, and snakehead.
examples:
- Snake-heads grow in the marsh.
- A snake-head bloomed pink and white.
