simpleMeaning: '''Potential of hydrogen'', approximately the negative base-ten logarithm of hydrogen-ion
  concentration. On the usual 0–14 scale at room temperature, 7 is neutral, lower values acidic and higher
  values alkaline.'
scope: Also called pH; a measure of how acid or basic a liquid is, not a measure of heat and not a measure
  of salt.
examples:
- On the pH scale, pure water reads 7.
- The pH scale showed the liquid was more acid than neutral.
