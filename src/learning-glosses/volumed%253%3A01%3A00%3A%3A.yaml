simpleMeaning: Used especially in compound words to describe a work consisting of a specified number or
  kind of volumes.
scope: It is said of a thing, not of a rounded mass.
examples:
- The poet's volumed works fill three shelves in the library.
- They bought a two-volumed history of the old town.
