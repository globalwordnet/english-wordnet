senseId: 'refractory_anemia%1:26:00::'
synsetId: 14191658-n
simpleMeaning: Anemia that responds poorly to treatment and is unrelated to another primary illness. Blood
  transfusions may be needed to manage it.
scope: Also called refractory anaemia. It is a blood illness.
examples:
- Their refractory anemia did not answer to any drug, so they needed regular blood transfusions.
- After years of refractory anemia, only blood transfusions kept them on their feet.
