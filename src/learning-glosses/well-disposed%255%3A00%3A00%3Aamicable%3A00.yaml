simpleMeaning: Said of a person or a group that leans toward helping and backing others, and does not
  act against them.
scope: Also called friendly and well disposed. It is said of a person.
examples:
- The new neighbors were well-disposed toward the families moving in.
- A well-disposed host offered help before anyone asked for it.
