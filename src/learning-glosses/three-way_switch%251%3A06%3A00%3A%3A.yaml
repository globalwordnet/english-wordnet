senseId: 'three-way_switch%1:06:00::'
synsetId: 04435143-n
simpleMeaning: A circuit worked from either of two places runs through this electric switch, which has
  3 places where wires join it.
scope: This is also called a three-point switch, and it does not work a circuit from one place only.
examples:
- They put a three-way switch by each door so the same lights could be worked from either one.
- A three-way switch let them turn the lights on from downstairs or from upstairs.
