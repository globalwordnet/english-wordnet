simpleMeaning: A tool that measures the size of a thing very exactly, with a sliding scale marked in fine
  steps.
scope: Also called vernier micrometer. It is a measuring tool, not a plain ruler.
examples:
- The worker used the vernier caliper to check the width of the metal bar.
- With a vernier caliper, the worker measured the pipe to a tiny fraction of a millimetre.
