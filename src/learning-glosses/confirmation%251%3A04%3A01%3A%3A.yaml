senseId: 'confirmation%1:04:01::'
synsetId: 01040927-n
simpleMeaning: A synagogue ceremony, usually at Pentecost, that admits young men and women as adult members
  of the Jewish community after they complete a course in Judaism.
scope: A Jewish rite making young people adult members, not the Christian sacrament and not the act of
  making a thing valid.
examples:
- Her confirmation took place at Pentecost.
- The confirmation class studied Judaism for two years.
