simpleMeaning: To make someone lose by using tricks or deceit against them.
scope: Screw, cheat, shaft, jockey and chouse are other names for this sense, not the noun that names
  the use of tricks.
examples:
- The rival team chicaned its way to the title with fake injuries and dishonest referees.
- The lawyers chicaned the witness into changing the story.
