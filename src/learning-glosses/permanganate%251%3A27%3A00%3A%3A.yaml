senseId: 'permanganate%1:27:00::'
synsetId: 15003969-n
simpleMeaning: A dark purple salt of permanganic acid. In water it can be used to kill germs on surfaces
  or as an antiseptic.
scope: A dark purple salt used in water as a cleaner that kills germs, not a purple dye and not a medicine
  taken by mouth.
examples:
- The nurse used permanganate to clean the wound.
- Permanganate turned the water a deep purple.
