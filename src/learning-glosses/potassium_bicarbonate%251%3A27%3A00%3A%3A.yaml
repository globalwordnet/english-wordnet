simpleMeaning: A crystalline salt (KHCO3) used in baking powder and to neutralize excess stomach acid.
scope: This is a salt used in baking powder and to calm an upset stomach; potassium acid carbonate and
  potassium hydrogen carbonate are other names for it, not baking soda.
examples:
- The cook added potassium bicarbonate to the baking powder.
- Potassium bicarbonate can calm an upset stomach.
