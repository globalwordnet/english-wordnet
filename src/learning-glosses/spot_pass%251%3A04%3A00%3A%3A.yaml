simpleMeaning: A throw to a set place on the field, made so the ball and the player meant to catch it
  reach the place at the same time.
scope: It is a kind of throw.
examples:
- The quarterback threw a spot pass to the ten-yard line.
- They ran a spot pass on the next play.
