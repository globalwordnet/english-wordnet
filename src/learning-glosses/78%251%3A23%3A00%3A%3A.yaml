simpleMeaning: This number is the total of seventy and eight.
scope: This one is also called seventy-eight and LXXVIII, and it is a number, not a record.
examples:
- Seventy apples and eight oranges make 78 pieces of fruit in the basket.
- They counted 78 chairs in the hall, seventy in rows and eight by the door.
