simpleMeaning: A fine-leaved spike rush that grows in water, often used to supply oxygen in aquariums.
scope: A thin-leaved water plant used to put air into fish tanks, also called hair grass, needle rush
  and slender spike rush; not a pond weed and not a water lily.
examples:
- The needle spike rush in the aquarium keeps the water full of air.
- She planted needle spike rush along the edge of the pond.
