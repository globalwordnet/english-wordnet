simpleMeaning: Said of someone slow to take things in and knowing little, the way old stories show country
  people.
scope: This one describes a dull, blank look, not a sharp, clever one.
examples:
- The boy's yokel-like expression showed he had not understood a word.
- They gave a yokel-like stare when asked about the city.
