simpleMeaning: A group of civilians organized like a military unit, especially to help regular troops
  or take their place.
scope: A band of ordinary people run like soldiers, also called paramilitary, paramilitary force, paramilitary
  organisation and paramilitary organization; not regular troops and not a band of rebels.
examples:
- The paramilitary unit guarded the road into town.
- A paramilitary unit stood in for the army during the unrest.
