simpleMeaning: Said of a thing that can gather a substance on a surface or make it gather there.
scope: Adsorptive and surface-assimilative are other names for this sense, and the noun is a different
  sense of the same word.
examples:
- The adsorbent cloth gathers the liquid on its surface.
- They chose an adsorbent powder that makes the gas gather on a surface.
