simpleMeaning: An antifungal antibiotic discovered in New York State and sold as Nystan and Mycostatin.
  It comes from soil bacteria called actinomycetes.
scope: A drug that kills fungi and germs, found in New York State.
examples:
- The doctor gave her nystatin for the fungal infection.
- Nystatin is made from tiny fungi found in the soil.
