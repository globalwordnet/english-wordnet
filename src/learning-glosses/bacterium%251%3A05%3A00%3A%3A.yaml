senseId: 'bacterium%1:05:00::'
synsetId: 01351171-n
simpleMeaning: A round, spiral or rod-shaped microbe lacking chlorophyll, described as single-celled or
  noncellular, reproducing by splitting. Bacteria matter in disease and biochemistry, are hard to classify,
  and were considered plants.
scope: 'The singular: one such organism, not the group as a whole.'
examples:
- A single bacterium can multiply into millions within hours.
- The illness is caused by a bacterium found in unpasteurised milk.
