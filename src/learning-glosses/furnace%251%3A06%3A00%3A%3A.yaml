simpleMeaning: An enclosed chamber that produces heat for purposes such as heating buildings, burning
  waste, or smelting and refining ores.
scope: A closed place where heat is made, not an oven for cooking food and not an open fire.
examples:
- The furnace heats the whole school in winter.
- They burned the old papers in the furnace.
