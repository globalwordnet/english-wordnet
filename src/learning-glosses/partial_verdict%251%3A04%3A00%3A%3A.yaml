simpleMeaning: In criminal law, a decision that the person on trial is guilty of some of the charges but
  not guilty of the others.
scope: It is a decision.
examples:
- The jury gave a partial verdict on the three charges.
- The partial verdict found the driver guilty of speeding but not of drink-driving.
