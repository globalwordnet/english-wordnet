simpleMeaning: A worker answers to a boss who keeps making unwanted moves to do with sex that the worker
  does not want.
scope: This names unwanted acts to do with sex that a boss directs at a worker under them, not the same
  acts between two workers of equal standing.
examples:
- The worker reported the sexual harassment to the office.
- The office acted on the report of sexual harassment.
