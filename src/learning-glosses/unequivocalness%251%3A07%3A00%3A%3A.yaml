senseId: 'unequivocalness%1:07:00::'
synsetId: 04829033-n
simpleMeaning: Words have this quality when they can be read in one way only.
scope: Also called unambiguity, this name is for words, not for words that can be taken two ways.
examples:
- The unequivocalness of the instructions meant no one could read them two ways.
- Their unequivocalness left no room for doubt about what they meant.
