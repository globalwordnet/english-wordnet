simpleMeaning: To use up a person's energy, or to use up one's own, by too much use or by heavy strain
  or stress.
scope: Also called wear, tire, weary, fatigue, jade, fag, fag out, outwear, tire out, wear out, and wear
  upon. It is an action.
examples:
- The long climb wore down the hikers by noon.
- Too much work will wear down even the strongest person in the end.
