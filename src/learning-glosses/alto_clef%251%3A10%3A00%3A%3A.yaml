simpleMeaning: A clef that marks the third line of the five lines as middle C, the note C in the middle
  of the piano.
scope: Also called viola clef, this one marks the third line, not another line.
examples:
- They printed the viola part in the alto clef.
- The middle part of the piece is written in the alto clef.
