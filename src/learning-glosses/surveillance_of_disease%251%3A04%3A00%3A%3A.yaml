synsetId: 00882713-n
simpleMeaning: A steady watch over an infectious illness, kept by gathering facts about it by a set plan
  and studying them, so it can be stopped or kept from spreading.
scope: It names the watching itself, not the illness watched.
examples:
- Surveillance of disease helped the town act before the illness spread.
- The team set up surveillance of disease after the first cases appeared.
