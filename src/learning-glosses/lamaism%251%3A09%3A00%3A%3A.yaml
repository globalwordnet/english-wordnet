simpleMeaning: An older name for Tibetan Buddhism, which draws on Indian Buddhist teachings and incorporates
  elements of earlier religious traditions.
scope: A form of Buddhism, also called Tibetan Buddhism; not Buddhism in its plain form and not shamanism
  on its own.
examples:
- Lamaism shapes daily life in many Tibetan villages.
- The old temple follows Lamaism, with its mix of Buddhist and shaman ideas.
