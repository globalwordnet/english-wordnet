simpleMeaning: In dated usage, unable to speak, with that inability attributed to inherited deafness.
scope: This historical label can cause offense. Many deaf people use speech.
examples:
- The old register described a deaf pupil who did not speak as “mute.”
- The historian explains how the school once used the label “mute” for some deaf pupils.
