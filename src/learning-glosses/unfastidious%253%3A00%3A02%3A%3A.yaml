senseId: 'unfastidious%3:00:02::'
synsetId: 00989100-a
simpleMeaning: Said of a living thing that is not fussy about the food it needs.
scope: It is said of a living thing and its food, not of a person's care or cleanliness.
examples:
- The goat is unfastidious and will eat almost any plant.
- Some fish are unfastidious, taking whatever food drifts their way.
