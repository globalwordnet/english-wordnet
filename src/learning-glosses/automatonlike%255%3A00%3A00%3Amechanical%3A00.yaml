senseId: automatonlike%5:00:00:mechanical:00
synsetId: 01503678-s
simpleMeaning: Said of something that works like a machine, with no thought behind what it does.
scope: Also called automatic, robotic, machinelike, and robotlike, this one is about the way something
  works, not about a machine itself.
examples:
- The automatonlike reply came out with no thought at all.
- Their automatonlike movements went through the same steps again and again.
