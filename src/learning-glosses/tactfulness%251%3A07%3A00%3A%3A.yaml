senseId: 'tactfulness%1:07:00::'
synsetId: 04849041-n
simpleMeaning: Care in dealing with others, weighing how they will take your words and acts and holding
  back whatever would hurt them.
scope: Also called tact, this is the care itself, not the acts that show it.
examples:
- Her tactfulness showed when she chose her words with care.
- His tactfulness kept him from saying anything hurtful.
