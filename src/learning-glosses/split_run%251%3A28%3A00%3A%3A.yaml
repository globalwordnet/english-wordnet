simpleMeaning: A printing of a newspaper in which some stories or ads are changed, so that a different
  version of the paper comes out.
scope: It is a printing.
examples:
- The split run carried a new front page, while the early run kept the old one.
- They changed one ad in the split run before the presses stopped.
