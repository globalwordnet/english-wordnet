senseId: 'succinctness%1:10:00::'
synsetId: 07103216-n
simpleMeaning: The quality of using very few words to say a great deal, in speech or on paper.
scope: Also called conciseness, concision, or pithiness. It is a quality of words, not the words themselves.
examples:
- The succinctness of the report made it easy to read.
- They praised the succinctness of the speech.
