simpleMeaning: A stroke, caused by a blocked or ruptured blood vessel in the brain. It can suddenly affect
  movement, speech, or consciousness.
scope: Also called a stroke or cerebrovascular accident. A brain blood vessel is blocked or ruptures,
  sometimes causing loss of consciousness.
examples:
- He suffered a CVA and lost consciousness.
- A CVA can follow the rupture of a blood vessel in the brain.
