simpleMeaning: The Iranian language of the Tajik people, a variety of Persian closely related to Farsi
  as spoken in Iran and widely used in Tajikistan.
scope: 'Also called Tadzhik, Tadzhik language, Tajik, Tajiki and Tajiki language: the Iranian tongue of
  the Tajik people, close to Farsi, not Farsi itself and not the ethnic group of the same name.'
examples:
- Tajik language is close to Farsi.
- She learned Tajik language at school.
