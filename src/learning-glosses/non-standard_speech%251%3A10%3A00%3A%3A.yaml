senseId: 'non-standard_speech%1:10:00::'
synsetId: 07169789-n
simpleMeaning: The way people talk when it differs from the usual accepted talk of grown-up native speakers,
  the kind that is easy to recognize.
scope: It is a kind of talk.
examples:
- They spoke in non-standard speech at home, and in the usual way at work.
- Their non-standard speech was easy to follow, though some words sounded strange to me.
