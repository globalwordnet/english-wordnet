simpleMeaning: A slender European mustard plant with yellow flowers, often a troublesome weed. It was
  formerly used to treat intestinal worms.
scope: This thin European plant bears yellow blooms and is often a troublesome weed, though it was once
  used as a medicine for the gut.
examples:
- Farmers pulled wormseed mustard as a weed.
- Wormseed mustard was once given as a medicine for worms in the gut.
