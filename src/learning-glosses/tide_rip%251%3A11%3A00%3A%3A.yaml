simpleMeaning: Water that turns rough where two flows meet or cross, in a river or the sea.
scope: It is also called a rip, a riptide, a crosscurrent, or a countercurrent.
examples:
- The boat rocked in the tide rip near the river mouth.
- They steered clear of the tide rip where the two flows met.
