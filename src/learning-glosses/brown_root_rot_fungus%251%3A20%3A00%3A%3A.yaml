simpleMeaning: A fungus that causes brown, decaying roots in plants belonging to the pea, potato, and
  cucumber families.
scope: This growth attacks pea, potato and cucumber plants from below the ground.
examples:
- The brown root rot fungus spread through the pea plants.
- Cucumber plants died after the brown root rot fungus reached their roots.
