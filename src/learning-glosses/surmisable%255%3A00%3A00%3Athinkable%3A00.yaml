simpleMeaning: Possible to guess from limited evidence.
scope: This word says a thing can be figured out from only a few small signs; presumable and supposable
  are other names for it.
examples:
- From a few small signs, the truth of the matter was surmisable.
- The reason for the delay was surmisable from the empty desk.
