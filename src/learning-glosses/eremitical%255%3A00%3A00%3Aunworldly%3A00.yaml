simpleMeaning: Said of something that shows a lone life without everyday comforts.
scope: This one is also called anchoritic, eremitic, hermitic, and hermitical; it is not about what suits
  a lone life of self-denial.
examples:
- The monks kept an eremitical rule of silence.
- They lived an eremitical life in the hills.
