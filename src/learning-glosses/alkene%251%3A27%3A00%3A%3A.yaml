simpleMeaning: Any compound of hydrogen and carbon, not built like a ring, that can take in more hydrogen.
scope: Also called olefin and olefine, this one can take in more hydrogen, unlike a compound that is already
  full of it.
examples:
- The alkene took in more hydrogen when they added it.
- The alkene joined with hydrogen in the test.
