simpleMeaning: A grass grown for edible, starchy grain, such as wheat, rice, rye, oats, maize or millet.
  Buckwheat, a similar food crop, belongs to a different plant family.
scope: This sense covers grasses grown for their edible grain. Buckwheat is a related example of a food
  crop in a different plant family.
examples:
- Cereal grasses feed folk with starchy grains.
- The cereal grass bears starchy grains.
