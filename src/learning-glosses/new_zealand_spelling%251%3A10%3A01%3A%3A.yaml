simpleMeaning: A system of English spelling used in New Zealand and shared with Britain, Ireland, and
  much of the Commonwealth, with forms such as “analyse” and “centre.”
scope: 'Also called British English orthography, British English spelling, British spelling, Commonwealth
  English orthography, Commonwealth English spelling, Commonwealth spelling, Irish English orthography,
  Irish English spelling, Irish spelling, New Zealand English orthography, and New Zealand English spelling:
  the way of writing the tongue used in the United Kingdom, Ireland and most of the Commonwealth, marked
  by ''analyse'', ''centre'' and ''useable''.'
examples:
- New Zealand spelling writes 'centre' with 're'.
- In New Zealand spelling, 'analyse' takes an 's'.
