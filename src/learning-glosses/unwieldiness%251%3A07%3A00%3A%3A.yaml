senseId: 'unwieldiness%1:07:00::'
synsetId: 04718941-n
simpleMeaning: The trouble of carrying or handling a thing because it is big or awkwardly shaped.
scope: Also called awkwardness and cumbersomeness. It is a word for a trouble, not for the thing itself.
examples:
- The movers cursed the unwieldiness of the big piano.
- The unwieldiness of the old wardrobe made it hard to get through the door.
