simpleMeaning: This joint in the skull lies where the bone at the back meets the bones at the sides.
scope: This is the seam in the skull where the rear bone joins the side bones; lamboid suture is another
  name for it.
examples:
- The sutura lamboidea runs across the back of the skull.
- The X-ray showed the sutura lamboidea where the back of the skull meets the sides.
