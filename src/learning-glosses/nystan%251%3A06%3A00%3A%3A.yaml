simpleMeaning: An antifungal antibiotic discovered in New York State and sold as Nystan and Mycostatin.
  It comes from soil bacteria called actinomycetes.
scope: This is a drug that kills fungi and germs; nystatin and Mycostatin are other names for it, not
  a drug that eases pain and not a drug that fights viruses.
examples:
- The doctor gave her Nystan for the mouth infection.
- Nystan comes from soil fungi found in New York State.
