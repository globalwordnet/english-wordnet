senseId: 'major_term%1:10:00::'
synsetId: 06767369-n
simpleMeaning: The chief word or phrase in a piece of reasoning with two statements and a closing statement,
  naming what is said about the subject of that closing statement.
scope: It is a word in a system of reasoning.
examples:
- Students learn to pick out the major term from the closing statement of a syllogism.
- In the old syllogism about Socrates, 'mortal' is the major term.
