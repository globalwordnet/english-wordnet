simpleMeaning: A Eurasian garden lily with drooping flowers shaped like medieval leprosy bells, usually
  veined and checkered in purple or maroon against a pale background. It is widely grown for display.
scope: This is a plant, not the spotted bird its name comes from.
examples:
- The guinea-hen flowers opened in April, hanging like small bells above the grass.
- He pointed out a guinea-hen flower among the meadow grasses.
