senseId: 'precis%1:10:00::'
synsetId: 06480622-n
simpleMeaning: A brief written account that gives only the chief points of a longer piece of writing or
  talk.
scope: It is also called an outline, an abstract, or a synopsis. It is a short written account, not the
  full argument itself.
examples:
- They wrote a precis of the long report for the meeting.
- The student wrote a precis of the book before class.
