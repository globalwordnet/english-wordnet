simpleMeaning: Not knowing, or being afraid, can make people hold a belief that no sound reason backs.
scope: This belief is also called superstition.
examples:
- The idea that a broken mirror brings bad luck is a superstitious notion.
- They would not open an umbrella indoors, held back by a superstitious notion.
