simpleMeaning: Eight leaves come from folding one sheet of paper three times, and a book of that size
  is called octavo, from the Latin for eighth.
scope: This one is also called eightvo and octavo.
examples:
- They chose 8vo for the new poetry book.
- They printed the guide in 8vo so it would fit in a small bag.
