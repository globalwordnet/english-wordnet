simpleMeaning: The moving of goods from one place to another in large road vehicles built for carrying
  them.
scope: Hauling and trucking are other names for it; it is the work itself, not the fee charged for it.
examples:
- The company arranged truckage for the furniture to the new house.
- Truckage by road is the usual way to move the harvest to market.
