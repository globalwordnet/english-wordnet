simpleMeaning: Said of someone or something given a standing that is holy and cannot be questioned, or
  that carries the weight of authority.
scope: Glorified and canonized are other names for this.
examples:
- Over time, the old customs were canonised as the only proper way to do things.
- The poet's early verses were canonised and taught in every school.
