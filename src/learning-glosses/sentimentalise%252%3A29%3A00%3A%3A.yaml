senseId: 'sentimentalise%2:29:00::'
synsetId: 00012937-v
simpleMeaning: To let soft, fond feeling run the way you act and speak, and to dwell in it rather than
  hold it back.
scope: Sentimentalize, sentimentise and sentimentize are other names for this sense, which keeps the feeling
  in the person who acts, not in a person or thing made full of it.
examples:
- They would sentimentalise the past, and turn plain days into fond stories.
- When they spoke of the past, they would sentimentalise every memory.
