simpleMeaning: A hypothetical heavy subatomic particle that interacts only weakly with ordinary matter,
  including through gravity, and is a possible constituent of dark matter.
scope: A supposed heavy particle that barely touches ordinary matter except through gravity, not any particle
  yet found.
examples:
- A weakly interacting massive particle would pass through the Earth almost untouched.
- Physicists hunt for a weakly interacting massive particle in deep mines.
