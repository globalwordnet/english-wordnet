simpleMeaning: An X-ray examination of a joint with an injected substance that shows up on X-rays. The
  resulting image is called an arthrogram.
scope: An X-ray look at a joint after dye is put into it, not a plain X-ray with no dye.
examples:
- The arthrography showed the torn tissue inside the knee joint.
- After the arthrography, the joint could be seen clearly on the picture.
