senseId: 'red_tide%1:27:00::'
synsetId: 15028063-n
simpleMeaning: Sea water that takes on a colour it does not usually have, when huge numbers of some kinds
  of tiny sea creature grow and give off the poison saxitoxin.
scope: This is sea water whose colour has changed because poison-making tiny creatures have grown in it
  in huge numbers.
examples:
- The sea water changed colour during the red tide.
- People talked about the red tide all week.
