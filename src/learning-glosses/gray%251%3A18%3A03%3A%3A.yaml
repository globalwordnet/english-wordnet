simpleMeaning: Louis Harold Gray (1905–1965), an English scientist who studied radiation and living things.
  The SI unit of absorbed radiation dose bears his name.
scope: An English man who studied rays, in whose name the gray unit was named (1905-1965); also called
  Louis Harold Gray, and not the colour, and not the unit.
