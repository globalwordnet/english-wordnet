simpleMeaning: To swell so that a part sticks beyond the surface of a thing.
scope: Also called bulge. It is not a whole thing growing larger.
examples:
- The wall began to bulge out after the rain soaked it.
- Their eyes seemed to bulge out when they saw the bill.
