simpleMeaning: A thinker who follows the teaching that knowledge comes from living through things.
scope: The word names a person, not the teaching itself.
examples:
- The empiricist argued that the mind learns only from what it meets in life.
- The young empiricist trusted what could be seen and tested over grand systems of thought.
