simpleMeaning: Any of four pairs of muscles running from the neck bones to the second rib, helping to
  move the neck and to breathe.
scope: Scalene muscles run from the cervical vertebrae to the upper ribs.
examples:
- The diagram labels a muscle on the side of the neck as musculus scalenus.
- A musculus scalenus can help lift an upper rib during breathing.
