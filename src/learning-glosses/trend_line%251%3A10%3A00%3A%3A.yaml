simpleMeaning: On a graph, this line shows which way numbers are moving.
scope: This mark on a graph stands for the way a whole set of numbers is heading, not for any one number
  in the set.
examples:
- The trend line on the graph showed sales rising.
- They drew a trend line to show where the numbers were heading.
