simpleMeaning: Thulium, a soft, silvery rare-earth metal. Its isotope thulium-170 emits X-rays and is
  used in portable X-ray machines. It occurs in monazite, apatite, and xenotime.
scope: Also called thulium and atomic number 69; a soft rare earth metal, not iron and not a metal used
  in building.
examples:
- Tm is used in small X-ray machines.
- The lab keeps Tm sealed from air.
