simpleMeaning: An inflammatory disorder involving immune cells and altered cholesterol processing, mainly
  in young children, with hollow areas in the skull and diabetes insipidus, which causes excessive urination.
scope: A childhood illness of the skull and water balance, also called Schuller-Christian disease; not
  ordinary diabetes.
examples:
- Hand-Schuller-Christian disease left hollow spots in the child's skull.
- The doctor knew it was Hand-Schuller-Christian disease from the scans.
