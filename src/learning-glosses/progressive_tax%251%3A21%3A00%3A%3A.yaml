simpleMeaning: A payment to the government whose rate goes up as the sum it is charged on goes up.
scope: Also called graduated tax. It is a payment to the government.
examples:
- A progressive tax takes a bigger share from a big pay packet than from a small one.
- Under a progressive tax, the rate climbs as earnings climb.
