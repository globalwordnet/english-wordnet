synsetId: 01458135-v
simpleMeaning: With a small rope, a thing is tied fast after it has been lifted high or drawn in.
scope: Also called trice, this is the act of lifting a thing and making it fast with a small rope, not
  lifting it and leaving it loose.
examples:
- They triced up the sail and tied it fast with a small rope.
- The sailors triced up the boat's gear with a small rope.
