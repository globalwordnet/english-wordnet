senseId: 'nephrosis%1:26:01::'
synsetId: 14331151-n
simpleMeaning: A kidney disorder with swelling, excess protein in urine, and usually high blood cholesterol.
  It can accompany inflammation of kidney filters or diseases affecting the whole body.
scope: This sense is also called nephrotic syndrome, for a set of signs marked by swelling and much protein
  in the urine and usually raised cholesterol, usually tied to kidney sickness or ills that follow various
  whole-body sickness.
examples:
- Nephrosis swells the body.
- Nephrosis puts protein in the urine.
