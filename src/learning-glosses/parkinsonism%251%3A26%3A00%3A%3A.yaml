simpleMeaning: A group of movement problems involving tremor and poor muscle coordination, often caused
  by degeneration in the central nervous system.
scope: This is a sickness that slowly breaks down the nervous system, also called Parkinson's, paralysis
  agitans, shaking palsy, Parkinson's disease and Parkinson's syndrome.
examples:
- Parkinsonism makes his hands shake.
- She has Parkinsonism and finds it hard to control her muscles.
