simpleMeaning: To force what the stomach holds up through the mouth and out.
scope: Also called sick, cat, cast, vomit, puke, chuck, purge, retch, honk, spew, barf, disgorge, regurgitate,
  upchuck, be sick, spue, throw up, and vomit up. It is a verb.
examples:
- After the bad meal, they regorged in the bathroom.
- The baby regorged the milk it had just drunk.
