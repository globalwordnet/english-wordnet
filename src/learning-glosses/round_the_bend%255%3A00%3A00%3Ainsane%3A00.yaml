simpleMeaning: An informal, sometimes insulting expression for someone considered mentally unstable.
scope: Also called cracked, nuts, bats, crackers, buggy, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, bonkers, haywire, loony, barmy, loco, kooky, around the bend, kookie, and whacky, this is loose,
  joking talk for a mind that is not working right.
examples:
- The noise was driving them round the bend.
- They laughed and said they must be going round the bend.
