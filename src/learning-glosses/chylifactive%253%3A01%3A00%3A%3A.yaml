simpleMeaning: Said of a thing that makes the milky liquid made from food in the gut, or turns something
  into it.
scope: This one is also called chylifactory and chylific.
examples:
- The chylifactive lining of the gut makes the milky liquid from digested food.
- After a meal, the chylifactive tissue starts to make the milky liquid.
