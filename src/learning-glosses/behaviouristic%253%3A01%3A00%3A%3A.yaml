simpleMeaning: Said of a thing that deals with outward acts rather than inner thoughts as the cause of
  what a creature does.
scope: Also called behaviorist, behavioristic, and behaviourist. It is about a theory.
examples:
- They took a course in behaviouristic psychology.
- A behaviouristic account traces acts to what went before.
