simpleMeaning: A workplace that can hire people outside the labor union if they join the union within
  a set time.
scope: It is a kind of company, not a kind of worker.
examples:
- The factory became a union shop, so every new worker had to join the group within a month.
- They took a job at a union shop and signed up with the workers' group in their first week.
