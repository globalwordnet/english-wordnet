senseId: 'styptic%1:06:00::'
synsetId: 02753840-n
simpleMeaning: Body tissue and tubes pull together and close up when this drug is used.
scope: This sense is also called astringent and astringent drug; it names the drug, not the adjective
  for what tends to check bleeding.
examples:
- They put a styptic on the cut.
- The cut stopped bleeding after a styptic was put on it.
