senseId: transversal%5:00:00:crosswise:00
synsetId: 01448808-s
simpleMeaning: It lies across a thing from one side to the other, making a right angle with the long way
  the thing runs.
scope: This sense is also called cross, transverse, and thwartwise, and it is not lying along the length.
examples:
- They laid transversal steel bars across the frame.
- The transversal beams ran across the bridge deck from one side to the other.
