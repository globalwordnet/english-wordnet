synsetId: 14333931-n
simpleMeaning: A nerve and muscle disorder causing twitching, cramps and sometimes seizures. It can accompany
  low calcium from underactive parathyroid glands, vitamin D deficiency or unusually alkaline body fluids.
scope: One of several names for this calcium-linked nerve disorder, not the infectious disease tetanus
  that causes lockjaw.
examples:
- The doctor suspected apyretic tetanus when the patient's muscles began twitching.
- Blood tests confirmed that his apyretic tetanus was caused by low calcium.
