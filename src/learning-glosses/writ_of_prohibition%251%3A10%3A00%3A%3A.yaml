synsetId: 06568141-n
simpleMeaning: This order from a court above another keeps the court below it from taking up one case.
scope: This one comes from a court above, not from the court that takes up the case.
examples:
- The higher court sent a writ of prohibition to stop the lower court from hearing the case.
- They asked for a writ of prohibition when the lower court took up a matter outside its power.
