simpleMeaning: Sodium lauryl sulfate, a strong detergent that removes grease. Common in shampoos and toothpastes,
  it can irritate skin and should not be swallowed.
scope: A harsh soap-like cleaner that takes grease off things, often put in shampoos and toothpastes,
  but it can irritate the skin and should not be swallowed; sodium lauryl sulfate and sodium lauryl sulphate
  are other names for it.
examples:
- SLS takes grease off the dishes.
- 'Check the label: SLS can irritate the skin.'
