simpleMeaning: A large light-gray African rhinoceros with two horns. Some populations are critically endangered.
  Formerly placed in Diceros, it is now classified in Ceratotherium.
scope: This animal is one of the big horned kinds of Africa, and it is in danger of dying out.
examples:
- A white rhinoceros grazed quietly.
- The white rhinoceros moved slowly away.
