simpleMeaning: Of a hull with planks placed so that each upper plank covers the lower one.
scope: It is also called clincher-built, clinker-built, lap-strake, lap-straked, or lap-streak.
examples:
- The lap-streaked canoe had planks that overlapped along the hull.
- They chose a lap-streaked design for the rowboat.
