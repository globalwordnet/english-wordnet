simpleMeaning: Cystic fibrosis, an inherited disease caused by changes in the CFTR gene. Thick mucus affects
  the lungs, intestines, and pancreas. Treatments help, but there is currently no cure.
scope: An older name for cystic fibrosis, an inherited disorder affecting organs including the lungs and
  pancreas.
examples:
- Fibrocystic disease of the pancreas clogs the lungs.
- They treat fibrocystic disease of the pancreas.
