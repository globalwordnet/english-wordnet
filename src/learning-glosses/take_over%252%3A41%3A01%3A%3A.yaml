simpleMeaning: A person accepts a title, a post, a duty, or a responsibility as their own.
scope: This is also called assume, adopt, or take on, and it is not paying someone else's debts or seizing
  control by force.
examples:
- She took over as head of the department.
- He took over the duties of the retiring manager.
