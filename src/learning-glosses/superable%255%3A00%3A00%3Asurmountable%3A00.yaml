senseId: superable%5:00:00:surmountable:00
synsetId: 02365562-s
simpleMeaning: Can be got past, or beaten by something better.
scope: Also called conquerable. It says what can be done to a hard task, not how hard the task is.
examples:
- The wall looked high, but the climbers found it superable.
- The old record seemed out of reach, yet it proved superable.
