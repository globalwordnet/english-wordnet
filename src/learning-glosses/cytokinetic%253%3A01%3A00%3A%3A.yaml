simpleMeaning: Relating to the division of the cytoplasm, the material outside a cell’s nucleus, after
  the nucleus divides.
scope: This one is about one step in the dividing of a cell.
examples:
- In the cytokinetic part of cell division, the cytoplasm splits.
- The cytokinetic step starts only after the nucleus has split.
