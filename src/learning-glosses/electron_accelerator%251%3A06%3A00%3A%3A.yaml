simpleMeaning: In this sense, a machine that accelerates electrons and their positively charged counterparts,
  called positrons, so they collide.
scope: A machine that smashes tiny bits of matter with their opposite bits, not a machine that makes light
  and not a medical scanner.
examples:
- The electron accelerator smashed electrons and positrons together.
- Scientists use an electron accelerator to study tiny bits of matter.
