simpleMeaning: Relating to or using a poetic rhythm with one stressed syllable followed by two unstressed
  ones, or one long syllable followed by two short ones.
scope: It is about beats.
examples:
- The dactylic meter of the poem has one long beat and two short beats.
- They read the dactylic verse aloud, keeping the long-short-short beat.
