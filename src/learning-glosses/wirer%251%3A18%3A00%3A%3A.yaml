simpleMeaning: A worker whose job is putting in electric cables and mending them.
scope: This worker may be of either sex, unlike the male wireman and the female wirewoman.
examples:
- The wirer arrived to put in the cables for the new lights.
- They hired a wirer to mend the cables in the old house.
