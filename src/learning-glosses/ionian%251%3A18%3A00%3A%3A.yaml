simpleMeaning: A prehistoric Greek from one of four language groups, found on Asia Minor's central west
  coast, Chios, Samos, the central Aegean islands, and Euboea north of Athens.
scope: One of a people of old Greece, not a Greek of Athens and not a speaker of modern Greek.
examples:
- The Ionian farmer lived on Euboea.
- An Ionian trader sailed from Chios.
