senseId: 'unhurriedness%1:07:00::'
synsetId: 05069146-n
simpleMeaning: No rush and no speed show in the pace at which a person does things.
scope: Also called deliberation, slowness, and deliberateness, this name is for a slow pace of working.
examples:
- They walked with an unhurriedness that made the others wait.
- The unhurriedness of their work meant it took all day.
