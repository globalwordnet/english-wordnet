simpleMeaning: A light vacuum cleaner you hold in one hand to clean up small messes. It runs on rechargeable
  batteries or power from a wall socket.
scope: Also called hand-held vacuum, hand-held vacuum cleaner and handheld vacuum cleaner, this is a light
  machine for small spills, not a big machine for whole rooms.
examples:
- A handheld vacuum is handy for crumbs on the car seat.
- She emptied the handheld vacuum after the spill.
