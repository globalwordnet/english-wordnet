simpleMeaning: The testing of a sample of urine with chemicals, to tell what illness a person has.
scope: Also called uranalysis. It is a test of urine, not a test of blood.
examples:
- The doctor asked for a urinalysis to check the patient's health.
- Urinalysis showed sugar in the urine.
