senseId: 'pluralist%1:18:00::'
synsetId: 10463056-n
simpleMeaning: A person who holds that different peoples, ways of life, and faiths can live side by side
  in one society.
scope: It is a person, not a thinker who says no one account explains all of nature or a church worker
  holding several paid posts.
examples:
- The pluralist welcomed new neighbours from every background.
- As a pluralist, the mayor argued that many faiths could share one city.
