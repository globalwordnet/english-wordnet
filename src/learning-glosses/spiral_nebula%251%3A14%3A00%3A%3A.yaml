simpleMeaning: Younger stars lie along curving arms that wind outward from older stars at the middle of
  this great cloud of stars.
scope: Also called spiral galaxy, this is one kind of star cloud, not a cloud of stars with no winding
  arms.
examples:
- The spiral nebula had young stars along arms that wound out from its middle.
- They could see a spiral nebula with young stars along its curving arms.
