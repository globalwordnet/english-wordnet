synsetId: 13948373-n
simpleMeaning: In chemistry, the stage at which a liquid or gas already holds all it can of another stuff,
  and takes in none more.
scope: In chemistry, it is the limit of how much of one stuff can go into another.
examples:
- The stuff reached its saturation point and would take in no more.
- Once the liquid reached its saturation point, no more of the other stuff would go in.
