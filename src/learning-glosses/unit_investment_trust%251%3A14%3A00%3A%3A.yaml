simpleMeaning: A regulated investment company whose professional managers issue shares that investors
  can sell back. Each share represents part of a collection of different investments.
scope: This firm run by paid experts under set rules is also called unit trust, and it gives out shares
  that buyers can sell back.
examples:
- She put money into a unit investment trust.
- Buyers sold back their shares in the unit investment trust.
