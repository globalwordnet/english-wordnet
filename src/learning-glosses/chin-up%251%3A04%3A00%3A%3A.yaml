simpleMeaning: An exercise for the arms, in which a person lifts their body on a bar fixed sideways, until
  the bottom of their face is as high as the bar.
scope: This one is also called pull-up.
examples:
- They did ten chin-ups before breakfast, each time lifting their body until their chin was level with
  the bar.
- The coach showed them how to do a chin-up without swinging their legs.
