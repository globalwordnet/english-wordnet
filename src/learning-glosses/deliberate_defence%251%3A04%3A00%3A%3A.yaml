simpleMeaning: A way of fighting back, planned before meeting the other side, with time to spare, most
  often with a guarded area, concrete guard posts, and lines for passing messages.
scope: This one is also called deliberate defense.
examples:
- The general built a deliberate defence before the enemy arrived.
- They set up a deliberate defence on the high ground before the attack.
