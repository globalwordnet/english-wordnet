simpleMeaning: To restate a weight or measure in the decimal system when it was given in another system.
scope: Metricate, metricise, and metrify are other names for it.
examples:
- The guide metricized the trail lengths for visitors from abroad.
- The class metricized its old notes so every length was in metres.
