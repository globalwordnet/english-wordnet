simpleMeaning: No patience at all for behaviour that harms others, most often shown by applying the law
  with no exceptions.
scope: This one is extreme, not a mild dislike.
examples:
- The school adopted a zero tolerance policy for bullying.
- After the scandal, the diocese announced zero tolerance for abuse by its priests.
