simpleMeaning: A giant plant-eating dinosaur of the Jurassic and Cretaceous, with a small head, long neck
  and tail, and five-toed limbs. Sauropods included the largest known land animals.
scope: Also called sauropod dinosaur, it was a huge plant-eater of long ago, not one of the meat-eaters
  of long ago.
examples:
- No land animal known was as big as the sauropod.
- The sauropod walked on five-toed legs.
