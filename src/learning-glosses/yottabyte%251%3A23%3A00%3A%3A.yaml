simpleMeaning: One measure of information holds 2^80 groups of eight smallest pieces, or 1024 measures
  each of 2^70 groups of eight smallest pieces.
scope: Also called yobibyte, YB, and YiB. It is a unit.
examples:
- The archive holds three yottabytes.
- They gave the size in yottabytes.
