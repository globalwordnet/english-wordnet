senseId: 'conform_to%2:34:00::'
synsetId: 01185870-v
simpleMeaning: To meet a need, satisfy a wish or comply with a condition or restriction.
scope: Also called fill, fit, fulfil, fulfill, meet, or satisfy, this one covers wishes, needs, set terms,
  and limits.
examples:
- The new design must conform to the safety rules before it goes on sale.
- Their plan did not conform to the terms the council had set.
