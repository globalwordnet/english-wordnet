simpleMeaning: A bushy perennial mint from the Old World with small white or yellowish flowers and fragrant,
  lemon-flavored leaves. It has escaped gardens in northern Europe and North America.
scope: This sense is also called bee balm, beebalm, garden balm, and lemon balm.
examples:
- Sweet balm grew in the garden.
- A sweet balm smelled of lemon.
