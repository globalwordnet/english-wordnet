simpleMeaning: Someone who forcefully expels saliva or mucus from the mouth.
scope: An expectorator is another name for a person whose mouth sends saliva or phlegm out with force,
  not a pitcher who puts spit on a ball.
examples:
- The spitter sent saliva onto the ground.
- The spitter sent phlegm out of the mouth.
