simpleMeaning: A sometimes offensive name for a Romani person, from a people traditionally speaking Romany,
  with roots in northern India and communities worldwide, especially in Europe, North Africa, and North
  America.
scope: Also called Gypsy, Bohemian, Roma, Romani, Romany, or Rommany; a member of the Romany-speaking
  people, not a member of any other people.
examples:
- The Gipsy family camped near the fair.
- A Gipsy told her fortune at the market.
