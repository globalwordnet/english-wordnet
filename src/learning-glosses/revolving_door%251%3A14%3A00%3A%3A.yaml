simpleMeaning: A firm or a place of work where people come and go so fast that few stay long.
scope: This is a firm or a place of work where people come and go fast, not a round turning entrance that
  lets people walk through it.
examples:
- Staff called the place a revolving door because few people stayed long.
- The revolving door kept bringing in new workers as old ones left.
