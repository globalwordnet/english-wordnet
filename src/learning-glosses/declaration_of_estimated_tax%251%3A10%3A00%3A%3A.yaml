simpleMeaning: A form that must be sent in by someone whose pay has had too little taken from it to cover
  what they owe the government for the year.
scope: Also called estimated tax return, this one is about a form.
examples:
- The declaration of estimated tax was filed after too little had been withheld from pay.
- A declaration of estimated tax is due when the year's withholding falls short.
