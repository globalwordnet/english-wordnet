simpleMeaning: The state of a sound that can be picked up by the ear, and how clearly it comes through.
scope: Audibility is another name for this sense.
examples:
- The audibleness of the whisper was so low that only those nearby could hear it.
- Engineers measured the audibleness of the new speaker in a large hall.
