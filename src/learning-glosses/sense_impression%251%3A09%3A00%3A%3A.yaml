senseId: 'sense_impression%1:09:00::'
synsetId: 05720023-n
simpleMeaning: A first, bare feeling left by something that reaches the body, before thought adds anything
  to it.
scope: Also called sensation, aesthesis, esthesis, sense datum and sense experience, this is a first bare
  feeling left by something that reaches the body, before thought adds anything.
examples:
- A sense impression of warmth on the skin reached them before they knew what it was.
- The sense impression of a sharp sound came before any thought about it.
