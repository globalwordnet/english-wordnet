simpleMeaning: To put more money into a business than the business or its hopes of profit call for.
scope: It is also called overcapitalize.
examples:
- They overcapitalised the new shop, putting in far more money than it could ever earn back.
- The firm overcapitalised the hotel and could not make enough profit to pay for it.
