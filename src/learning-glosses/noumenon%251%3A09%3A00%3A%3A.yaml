senseId: 'noumenon%1:09:00::'
synsetId: 05821558-n
simpleMeaning: The idea of a thing as it is on its own, apart from how it is known through the senses.
scope: Also called thing-in-itself. It is a noun.
examples:
- The noumenon lies beyond what the senses can show.
- They spoke of the noumenon as the thing itself, apart from how it seems.
