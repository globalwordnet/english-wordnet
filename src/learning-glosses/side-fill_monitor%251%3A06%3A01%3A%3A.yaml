simpleMeaning: Parts of a stage the floor speakers do not reach still get sound from this speaker, which
  stands upright at the stage's edge.
scope: Unlike a floor speaker, this one stands upright at the edge of a stage and gives sound to the parts
  the floor speakers do not reach.
examples:
- The side-fill monitor stood at the edge of the stage.
- The side-fill monitor gave sound where the floor speakers could not reach.
