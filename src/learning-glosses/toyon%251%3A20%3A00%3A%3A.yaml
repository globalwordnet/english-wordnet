simpleMeaning: An ornamental evergreen shrub of the US Pacific coast, resembling a small tree with white
  flowers and red berrylike fruits. Some classifications place it in the genus Photinia.
scope: Also called tollon, a pretty evergreen shrub like a small tree, with large white flowers and red
  berrylike fruits, often put in the group called Photinia.
examples:
- The toyon in the garden had red berries in winter.
- Toyon grows wild along the Pacific coast.
