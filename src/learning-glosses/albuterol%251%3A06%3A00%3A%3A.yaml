simpleMeaning: A medicine sold as Ventolin or Proventil that opens airways in asthma, emphysema, and other
  lung conditions. Taken by mouth or inhaled, it can cause rapid heartbeat and shaking.
scope: 'For asthma, emphysema, and other lung ills: a lung-opener sold as Ventolin or Proventil, as pills
  or breathers.'
examples:
- Albuterol opened the lungs.
- An albuterol dose shook them.
