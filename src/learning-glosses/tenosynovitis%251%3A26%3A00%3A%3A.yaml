simpleMeaning: The cover round the tough cord joining muscle to bone is swollen and sore, and so is the
  cord.
scope: This is also called tendonous synovitis or tendosynovitis.
examples:
- With tenosynovitis, the cord and the cover round it were swollen and sore.
- The cord and the cover round it ached with tenosynovitis.
