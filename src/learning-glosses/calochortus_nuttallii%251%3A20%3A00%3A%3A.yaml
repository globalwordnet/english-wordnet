simpleMeaning: Perennial with 1–4 showy white bells on upright unbranched stems and edible famine bulbs,
  from eastern Montana and western North Dakota to northern Arizona and northwestern New Mexico.
scope: Not other lilies with white flowers, nor other plants with edible bulbs; also called sego lily.
examples:
- Calochortus nuttallii grows in the west.
- The bulbs of Calochortus nuttallii are edible.
