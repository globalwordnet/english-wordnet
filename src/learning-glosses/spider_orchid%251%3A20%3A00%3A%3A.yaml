simpleMeaning: Any of several European orchids in the genus Ophrys.
scope: This is a European flower of the kind called Ophrys, not the South American kind with pale yellow
  to pale green flowers and not the Central American kind with prominent green warts.
examples:
- A spider orchid grew among the grass.
- They stopped to look at a spider orchid on the ground.
