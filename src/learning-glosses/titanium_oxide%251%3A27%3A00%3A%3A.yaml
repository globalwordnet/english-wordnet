simpleMeaning: A white powder that colours things and lasts a long time, hiding what lies below it.
scope: Titania, titanic oxide and titanium dioxide are other names for this white powder, not one that
  lets what lies below show through or soon fades.
examples:
- They stirred titanium oxide into the paint to hide what lay below.
- The paint stayed white because of the titanium oxide.
