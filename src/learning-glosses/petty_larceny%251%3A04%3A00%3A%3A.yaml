simpleMeaning: Stealing a thing that is worth less than a fixed amount, where that amount is not the same
  in every place.
scope: Also called petit larceny or petty. It is a crime.
examples:
- The driver was charged with petty larceny for stealing a bicycle worth very little.
- The court dealt with the petty larceny case on Monday.
