simpleMeaning: A lizard of the New World, one of many kinds, known for speed and for staying watchful.
scope: Also called a whiptail, this New World creature is one of numerous very agile and alert kinds,
  not a slow kind from the Old World.
examples:
- For a moment the whiptail lizard froze, then it darted away across the sand.
- We barely saw the whiptail lizard as it shot across the path.
