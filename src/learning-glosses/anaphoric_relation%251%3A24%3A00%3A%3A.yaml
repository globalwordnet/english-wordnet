senseId: 'anaphoric_relation%1:24:00::'
synsetId: 13825017-n
simpleMeaning: The link between a word that stands for an earlier word and that earlier word itself.
scope: This is the link itself, not either of the words it joins.
examples:
- The anaphoric relation in the sentence joins 'she' to the name of the teacher in the first clause.
- They explained the anaphoric relation by showing how 'they' takes its sense from the word 'workers'
  earlier in the text.
