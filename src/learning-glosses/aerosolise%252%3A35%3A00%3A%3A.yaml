senseId: 'aerosolise%2:35:00::'
synsetId: 01380423-v
simpleMeaning: To spread something through the air as tiny drops of liquid or bits of solid material.
scope: Also called aerosolize. It is done to a thing by something else, not by the thing itself.
examples:
- The farmer aerosolised the liquid and used it on the crops.
- They aerosolised the medicine and gave it to the patient.
