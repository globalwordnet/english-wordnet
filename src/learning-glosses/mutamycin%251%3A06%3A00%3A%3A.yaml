simpleMeaning: Mitomycins are antibiotics from Streptomyces bacteria. Mutamycin is a brand name for one
  of them, mitomycin C, used to treat cancer.
scope: The brand name identifies mitomycin C, one member of the mitomycin family.
examples:
- The cancer drug appeared under the brand name Mutamycin.
- The pharmacist identified the active ingredient in Mutamycin as mitomycin C.
