schema: oewn-learning-gloss-v2
senseId: 'unacceptability%1:07:00::'
synsetId: 04801174-n
simpleMeaning: A thing falls short of the standards people have agreed on and is not good enough, and
  that is this state.
scope: Also called unacceptableness, this is a state of falling short of agreed standards, not the state
  of a thing that meets them.
examples:
- They pointed out the unacceptability of the new rules.
- No one could deny the unacceptability of the living conditions.
