senseId: 'recission%1:04:00::'
synsetId: 00233730-n
simpleMeaning: The act of calling off a contract in law, so that each side goes back to where it stood
  before the contract was made.
scope: It is also called rescission. It is an act in law.
examples:
- Recission may be brought about by decree or by mutual consent.
- The court ordered recission of the deal after finding that one side had been misled.
