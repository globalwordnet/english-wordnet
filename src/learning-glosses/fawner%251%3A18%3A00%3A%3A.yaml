simpleMeaning: One who bends low before others as a mark of respect, behaving as though they counted for
  nothing.
scope: This one is also called bootlicker, groveller, apple polisher, groveler, and truckler.
examples:
- The fawner bowed low before the manager and praised everything they said.
- The fawner knelt before the guest and spoke of themself as unworthy.
