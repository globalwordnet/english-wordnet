senseId: abolishable%5:00:00:destructible:00
synsetId: 00741726-s
simpleMeaning: Said of a thing that can be done away with.
scope: It is said of a thing, not of a thing that has already been ended.
examples:
- The old rule is abolishable, and the council may vote to end it.
- They called the tax abolishable because a new law could end it.
