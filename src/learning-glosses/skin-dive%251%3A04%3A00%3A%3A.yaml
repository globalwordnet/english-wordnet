simpleMeaning: Under water, a swimmer uses no breathing gear but a tube that reaches the air above.
scope: People call this skin diving, not the verb that tells a person to do it.
examples:
- They went for a skin-dive in the sea.
- They took a skin-dive with only a tube for breathing.
