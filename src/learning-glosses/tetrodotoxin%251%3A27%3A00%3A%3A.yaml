simpleMeaning: A strong poison that harms the nerves, found in the ovaries of pufferfish.
scope: It is not the pufferfish itself, and not a poison from another animal.
examples:
- The pufferfish's ovaries hold tetrodotoxin.
- The chef removed the ovaries to keep tetrodotoxin out of the dish.
