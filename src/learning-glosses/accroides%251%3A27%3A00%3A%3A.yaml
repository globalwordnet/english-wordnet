simpleMeaning: A resin from Australian trees that dissolves in alcohol. It is used in varnishes and in
  making paper.
scope: This sticky tree stuff from Australia, which dissolves in alcohol, is also called acaroid resin,
  accaroid resin, accroides gum, accroides resin, and gum accroides.
examples:
- Varnish makers use accroides from Australian trees.
- The paper was made with accroides.
