simpleMeaning: One thousand liters of space, or of what a thing can hold, in metric measure.
scope: Cubic meter, kiloliter, and kilolitre are other names for this one.
examples:
- The pool holds forty cubic metres of water.
- The builders ordered six cubic metres of concrete.
