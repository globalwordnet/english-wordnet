simpleMeaning: Of or relating to the study of the links between living things and the places they live
  in.
scope: Also called ecological. It is about a field of study, not about living things depending on each
  other.
examples:
- Ecologic research studies how living things live with each other.
- The ecologic survey counted the birds in the forest.
