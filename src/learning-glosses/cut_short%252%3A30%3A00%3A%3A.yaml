synsetId: 00293639-v
simpleMeaning: To bring something to an end before the end it was meant to reach, or to trim it before
  it reaches its full extent.
scope: This is also called clip or curtail.
examples:
- My speech was cut short.
- The meeting was cut short by the fire alarm.
