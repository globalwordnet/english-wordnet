simpleMeaning: In this shape, four simple arms or legs of people, or bent lines, run out from a middle
  point.
scope: This is also called a tetraskele, and four is the count, not five.
examples:
- They carved a tetraskelion with four bent lines round a middle point.
- The tetraskelion had four arms of people set round a middle point.
