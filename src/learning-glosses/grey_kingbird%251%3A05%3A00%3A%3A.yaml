simpleMeaning: A kingbird that breeds in the southeastern United States and winters in tropical America.
  It resembles the eastern kingbird but is larger.
scope: Also called a gray kingbird or a petchary, this bird is larger than its eastern kin and breeds
  in the southeastern United States, wintering in warm parts of America.
examples:
- The grey kingbird sang from the wire above the road.
- Grey kingbirds breed in the southeastern United States and fly south for the winter.
