simpleMeaning: The principle in psychology that consequences shape behavior. Actions with satisfying results
  tend to be repeated, while those with unpleasant results become less likely.
scope: 'In mind-study: the rule that good ends make acts repeat.'
examples:
- The law of effect says acts with good effects tend to repeat.
- Trainers use the law of effect, since good effects bring repeats.
