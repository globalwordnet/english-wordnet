senseId: 'unemotionality%1:12:00::'
synsetId: 07498922-n
simpleMeaning: A lack of interest or concern shown by little emotional reaction.
scope: Also called indifference, phlegm, impassivity, stolidity, impassiveness, and emotionlessness, this
  is a quality of a person, not feeling held back.
examples:
- Their unemotionality showed when they heard the news without any change in their face.
- They spoke about the loss with complete unemotionality, as if it meant nothing to them.
