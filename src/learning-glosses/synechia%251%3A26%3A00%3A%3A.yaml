simpleMeaning: An abnormal attachment of the iris to the lens or cornea after injury, surgery, or complications
  of glaucoma or cataract. It can lead to blindness.
scope: Of stickings between the iris and the lens or clear front of the eye, that can bring blindness.
examples:
- A synechia stuck the iris to the lens.
- Synechiae can blind.
