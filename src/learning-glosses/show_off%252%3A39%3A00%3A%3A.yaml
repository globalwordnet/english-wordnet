simpleMeaning: To let others see what you have or what you can do, in a way that makes clear you think
  highly of yourself.
scope: Flash, flaunt, swank and ostentate are other names for letting others see what you have or what
  you can do in a way that makes clear you think highly of yourself.
examples:
- He showed off his new sports car to everyone at work.
- She loves to show off her new dress when friends come round.
