simpleMeaning: How far a sound reaches and how clearly it stands out from the noise around it.
scope: This one is also called sound projection.
examples:
- The hall was built so the acoustic projection of a single voice could reach the back rows.
- They praised the acoustic projection of the choir, which stayed clear above the noise of the crowd.
