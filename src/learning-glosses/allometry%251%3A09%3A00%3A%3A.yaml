simpleMeaning: The study of how a part of a living thing grows compared with the whole.
scope: This one names the study, not something that has to do with it.
examples:
- They used allometry to show how a leg grows faster than the body.
- By allometry, they worked out how fast the pup's ears grew beside the rest of its head.
