simpleMeaning: An insulting term for a timid man or boy seen as childish or unwilling to stand up for
  himself.
scope: Also called a pansy, a sissy, a milksop, or a Milquetoast. It is a name for a man or boy.
examples:
- The other boys called the new boy a pantywaist for running away from the fight.
- No one wanted to be called a pantywaist on the playground.
