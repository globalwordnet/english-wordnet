senseId: 'prostate_gland%1:08:00::'
synsetId: 05338952-n
simpleMeaning: A firm, partly muscular gland about the size of a chestnut, surrounding the urethra below
  the male bladder. It produces a thick liquid that forms part of semen.
scope: Another name for this organ is the prostate; this is the gland itself, not the adjective meaning
  'relating to the prostate'.
examples:
- The prostate gland sits just below the bladder.
- The prostate gland makes the fluid that carries sperm.
