simpleMeaning: A person a firm pays to speak for it, selling what it has to offer to buyers in a shop
  or at their homes.
scope: Also called salesperson and sales rep, this is a person a firm pays to speak for it and sell its
  goods.
examples:
- The sales representative met buyers in the shop and at their homes.
- The sales representative visits buyers where they live and work.
