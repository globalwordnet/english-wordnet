simpleMeaning: A brand of dopamine, a chemical messenger essential to normal nervous system function.
  Dopamine, also sold as Intropin, can treat shock and low blood pressure.
scope: This is a brain chemical the brain needs to work in the normal way, used as a drug to treat shock
  and low blood pressure; dopamine and Intropin are other names for this sense, and it stands apart from
  other brain chemicals by its use against shock and low blood pressure.
examples:
- Doctors gave the patient Dopastat for shock.
- Dopastat helps the brain work in the normal way.
