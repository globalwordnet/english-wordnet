simpleMeaning: A print made by a process in which the picture is cut into a plate, and the ink in the
  cuts makes the print.
scope: This sense is also called heliogravure and photogravure.
examples:
- The artist made a gravure of the old bridge.
- A gravure hung on the wall of the gallery.
