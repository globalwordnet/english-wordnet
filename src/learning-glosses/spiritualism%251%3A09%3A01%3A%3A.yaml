simpleMeaning: In theology, this is any teaching that God is not part of the world.
scope: In theology, this is any teaching that God is not part of the world, not the belief that the dead
  can reach the living and not a care for things of the spirit.
examples:
- Their spiritualism held that God exists apart from the world.
- They taught spiritualism, the teaching that God stands apart from the world.
