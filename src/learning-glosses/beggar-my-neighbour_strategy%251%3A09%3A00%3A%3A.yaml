simpleMeaning: One side wins only because the other side loses; countries do this above all.
scope: Also called a beggar-my-neighbor policy, a beggar-my-neighbor strategy, and a beggar-my-neighbour
  policy, this one names the same plan.
examples:
- The beggar-my-neighbour strategy was meant to protect jobs at home.
- Economists warned that a beggar-my-neighbour strategy would hurt everyone.
