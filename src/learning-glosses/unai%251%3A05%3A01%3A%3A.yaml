simpleMeaning: A sloth, small for its kind and quick to move, with long claws, two to a front foot.
scope: Two-toed sloth, unau, and Choloepus didactylus are other names for it. It is not the kind with
  three long claws on each hind foot.
examples:
- The unai hung from a branch by its long claws.
- An unai moved quickly through the trees.
