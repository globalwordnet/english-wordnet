simpleMeaning: With a string covered in chalk, builders leave a straight mark on a wall that stands upright.
scope: Also called chalk line and snap line, builders leave a straight mark on a wall that stands upright
  with this chalk-covered string.
examples:
- A snapline left a straight chalk mark on the wall.
- The carpenter reached for a snapline before marking the wall.
