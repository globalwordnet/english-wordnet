simpleMeaning: A brand name for griseofulvin, a medicine originally obtained from a mold that slows the
  growth of fungi.
scope: Doctors use this medicine for certain fungal infections of the skin, hair, or nails.
examples:
- The doctor prescribed Fulvicin for a fungal infection of the scalp.
- The label on the Fulvicin package listed griseofulvin.
