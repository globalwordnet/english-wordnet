simpleMeaning: A fungal infection that often begins in the lungs, where small lumps may form, and can
  spread to the nervous system.
scope: This fungus sickness starts in the lungs and spreads to the nerve system, not one that stays in
  the lungs alone.
examples:
- Cryptococcosis had spread from the lungs to the nerve system.
- Cryptococcosis had made small lumps in her lungs.
