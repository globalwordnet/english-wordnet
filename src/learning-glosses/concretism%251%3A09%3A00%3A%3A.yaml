simpleMeaning: A way of showing an idea that has no shape or form by means of things that can be seen
  or touched.
scope: Concrete representation is another name for this thing.
examples:
- The concretism of the painting turned hope into a bird in flight.
- The writer's concretism made the idea of freedom into a key in an open hand.
