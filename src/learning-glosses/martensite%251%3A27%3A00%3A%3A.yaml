senseId: 'martensite%1:27:00::'
synsetId: 14972515-n
simpleMeaning: A structure within steel that forms when rapid cooling traps carbon in the iron before
  pearlite can form. It gives quenched steel much of its hardness.
scope: Martensite is a constituent of hardened steel.
examples:
- The microscope image showed martensite in the steel sample.
- The metalworker attributed the hardness of the steel to martensite.
