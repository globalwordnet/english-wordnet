senseId: 'tenesmus%1:26:00::'
synsetId: 14595295-n
simpleMeaning: A painful tightening of the muscles around the anus, with an urgent need to pass stool
  even when little comes out. It can occur with irritable bowel syndrome.
scope: In bowel illness, for a painful cramp with an urgent need to pass stools but little stool made.
examples:
- Tenesmus cramped the back passage.
- A tenesmus brought a pressing need.
