simpleMeaning: A long-lived grass that tolerates drought, with long creeping underground stems and short
  or absent flower bristles, found in Europe and temperate Asia.
scope: A drought-hardy grass of Europe and temperate Asia, with awns missing or very short.
examples:
- Awnless bromegrass grows in dry fields.
- The awnless bromegrass spreads by root-stems.
