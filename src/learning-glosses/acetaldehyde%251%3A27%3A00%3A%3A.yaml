simpleMeaning: A colorless aldehyde that evaporates easily and dissolves in water. It is used mainly to
  make acetic acid, perfumes, and medicines.
scope: This sense is also called ethanal.
examples:
- Acetaldehyde makes sour acid.
- An acetaldehyde smells sharp.
