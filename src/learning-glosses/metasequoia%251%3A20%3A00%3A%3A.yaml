simpleMeaning: A large fast-growing Chinese tree bearing both sexes, flat bright-green deciduous leaves
  and small round cones. Commonly grown ornamentally in America, it was known from fossils before discovery
  in China.
scope: This sense is also called dawn redwood, for a big, fast-growing Chinese tree, both-sexed, with
  green, falling leaves and small, round cones, often grown in the States for show, a fossil first, then
  found in China.
examples:
- Metasequoia grows fast in China.
- Metasequoia was known from fossils first.
