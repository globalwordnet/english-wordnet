simpleMeaning: Blood on its way back to the heart passes through one of two large spaces inside the skull.
scope: This blood space inside the skull is also called a cavernous sinus.
examples:
- Blood from the brain passes through the sinus cavernosus on its way back to the heart.
- The sinus cavernosus sits inside the skull, one on each side.
