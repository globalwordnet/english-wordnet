senseId: 'shammer%1:18:01::'
synsetId: 10306236-n
simpleMeaning: Someone who avoids a duty by pretending to be sick or unable to do it.
scope: Also called a malingerer and a skulker, this is the name for one who dodges a duty by putting on
  an illness they do not have.
examples:
- The shammer stayed home, acting ill to get out of the day's work.
- The others soon saw that the shammer was only acting ill to avoid work.
