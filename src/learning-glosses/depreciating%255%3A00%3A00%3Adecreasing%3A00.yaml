simpleMeaning: Tending to bring the money worth of a thing down, or to make it fall.
scope: This one is also called depreciative and depreciatory, and it is not about words that make someone
  seem of less worth.
examples:
- A depreciating currency buys less abroad than it did before.
- The depreciating stock lost part of its money worth after the bad news.
