simpleMeaning: Used of the usual monthly flow of blood that stops for any reason other than pregnancy.
scope: Also called amenorrheal, amenorrheic, or amenorrhoeal, this one describes something to do with
  the stopping, not the stopping on its own.
examples:
- The nurse wrote down the amenorrhoeic signs for the doctor to see.
- They asked about amenorrhoeic causes that had nothing to do with pregnancy.
