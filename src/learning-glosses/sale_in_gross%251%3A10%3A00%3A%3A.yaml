simpleMeaning: The passing of a whole piece of land to a new owner, with no guarantee about how big it
  is.
scope: Also called contract of hazard. It is a noun.
examples:
- The farm was sold in a sale in gross, with no word on its acreage.
- They bought the land in a sale in gross and never learned its exact size.
