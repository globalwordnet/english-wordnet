simpleMeaning: A large study that checks how well a treatment works and monitors side effects after earlier
  trials. Its results can support an application for FDA approval.
scope: Also called phase III clinical trial; not an early test of a new drug and not a test on animals.
examples:
- The phase III trial tested the new drug on thousands of patients.
- After the phase III results, the drug won approval.
