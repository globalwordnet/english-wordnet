simpleMeaning: A computer that keeps a count of bets and hands out the full sum taken in to the people
  who win.
scope: Pari-mutuel machine, totalisator, totaliser, and totalizator are other names for it. It is not
  a machine for doing sums.
examples:
- The totalizer kept a count of the bets and paid the winners their share.
- They put a bet in through the totalizer at the track.
