simpleMeaning: In philosophy, a theory of signs and symbols and the work they do.
scope: Also called semiology, it is a theory of the work signs and symbols do, not the signs themselves.
examples:
- The class in semiotics showed how signs send messages.
- The book on semiotics explains how signs work.
