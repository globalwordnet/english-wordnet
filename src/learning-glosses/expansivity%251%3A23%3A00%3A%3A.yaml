senseId: 'expansivity%1:23:00::'
synsetId: 13609828-n
simpleMeaning: The fractional change in a material's length, area, or volume per degree of temperature
  change at constant pressure.
scope: This one is also called coefficient of expansion, and it is not about how open and talkative a
  person is.
examples:
- The expansivity of the metal rod tells engineers how much it will grow when heated.
- They worked out the expansivity of the glass from measurements taken at two temperatures.
