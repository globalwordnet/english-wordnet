simpleMeaning: A method of preparing for natural childbirth through education, exercise, nutrition, breathing
  exercises and relaxation techniques, with help from the baby’s father.
scope: A way of preparing a mother for birth without drugs, with the father helping; also called Bradley
  method of childbirth.
examples:
- They took a Bradley method class before the baby was born.
- The Bradley method teaches breathing and relaxation for labour.
