simpleMeaning: Spiral-shaped bacteria that can live independently or in a host. Many cause disease in
  humans or other animals.
scope: Also called spirochete, this names living things that live off others or on their own, many able
  to make people and animals ill.
examples:
- They found a spirochaete in the sample.
- Some spirochaete live free, while others feed off animals.
