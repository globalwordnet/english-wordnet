simpleMeaning: The whole number of bytes a disk can hold, counting the room its own set-up will take.
scope: It is a word for a number, not for a disk itself.
examples:
- The unformatted capacity of the drive was larger than the space left after set-up.
- Check the unformatted capacity before you buy a disk for the new machine.
