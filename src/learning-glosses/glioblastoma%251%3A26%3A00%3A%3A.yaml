senseId: 'glioblastoma%1:26:00::'
synsetId: 14260354-n
simpleMeaning: A fast-growing brain cancer made of immature cells that normally develop into support cells
  for nerves. It is almost always fatal.
scope: A brain growth that grows fast, is harmful and almost always kills; not a slow harmless growth
  and not a brain injury.
examples:
- The scan showed a glioblastoma in her brain.
- Glioblastoma grows fast and is hard to treat.
