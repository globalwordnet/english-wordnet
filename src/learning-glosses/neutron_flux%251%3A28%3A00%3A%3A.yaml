simpleMeaning: The speed at which the tiny parts of atoms with no charge move, counted as how many pass
  through a set area in a set time.
scope: It is a rate.
examples:
- The neutron flux rose as more of the tiny parts streamed through the area.
- They measured the neutron flux through a small patch of the wall.
