senseId: 'triple-spacing%1:10:00::'
synsetId: 06414613-n
simpleMeaning: A way of typing in which each line of typing has two blank lines after it.
scope: It is about typed text, not about handwriting.
examples:
- They used triple-spacing so the teacher could write notes between the lines.
- The essay was printed with triple-spacing to leave room for marks.
