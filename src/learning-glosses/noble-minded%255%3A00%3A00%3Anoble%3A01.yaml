senseId: noble-minded%5:00:00:noble:01
synsetId: 01593026-s
simpleMeaning: Showing high moral or intellectual worth, or an elevated character or style.
scope: Also called grand, elevated, lofty, idealistic, exalted, sublime, rarefied, high-flown, high-minded
  or rarified. It is an adjective.
examples:
- They took a noble-minded stand and refused the bribe, even though it cost them the job.
- The noble-minded plan put the good of the town before any gain for the people behind it.
