synsetId: 00534107-s
simpleMeaning: A person who feels embarrassed, ashamed, upset, or worked up finds the skin of the head
  turning rose-pink.
scope: This word is also called blushing or blushful, and it is used when the skin turns rose-pink from
  embarrassment, shame, upset or being worked up, not from hard work or strong feeling alone.
examples:
- The red-faced student stood before the class.
- The red-faced speaker could not meet the eyes of the crowd.
