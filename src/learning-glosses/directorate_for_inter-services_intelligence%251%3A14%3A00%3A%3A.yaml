simpleMeaning: Pakistan's intelligence agency, a largely independent political and military force historically
  linked to acquiring nuclear and delivery technology and to the Taliban and other militant Islamist groups.
scope: This is Pakistan's spy service, a strong political and military power that answers to almost no
  one; Inter-Services Intelligence and ISI are other names for this sense, and it stands apart from other
  spy services by its nuclear arms and its ties to the Taliban.
examples:
- The Directorate for Inter-Services Intelligence works in Pakistan.
- The Directorate for Inter-Services Intelligence has close ties to the Taliban.
