simpleMeaning: Ships and boats stop beside this flat deck, which runs out from the shore on posts over
  the water.
scope: Dock, pier and wharf are other names for this one, not a fee for using it.
examples:
- They tied the boat to the wharfage and walked ashore.
- They waited on the wharfage for the boat to come in.
