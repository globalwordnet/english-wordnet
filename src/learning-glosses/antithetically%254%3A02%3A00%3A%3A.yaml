senseId: 'antithetically%4:02:00::'
synsetId: 00275080-r
simpleMeaning: In a way that puts two opposite ideas side by side in sharp contrast.
scope: This word is not used when something is said plainly, with no contrast between opposite ideas.
examples:
- They spoke antithetically, setting hope against fear in every sentence.
- They answered antithetically, pairing each claim with its opposite.
