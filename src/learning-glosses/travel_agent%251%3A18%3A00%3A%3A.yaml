simpleMeaning: A person who sells trips or tours to customers, or plans them for them.
scope: Customers buy their trips and tours from this person, who plans them but does not go on the trip
  with them.
examples:
- They asked their travel agent to plan a tour of Italy.
- The travel agent booked their flights and hotel for the tour.
