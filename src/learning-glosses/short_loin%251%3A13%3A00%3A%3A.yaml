simpleMeaning: Porterhouse steaks are taken from this cut of meat on an animal's back.
scope: This is the part of the back from which porterhouse steaks are cut, not the steaks themselves and
  not the whole back.
examples:
- The butcher cut the porterhouse steaks from the short loin.
- The cook asked for a piece cut from the short loin.
