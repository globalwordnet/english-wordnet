simpleMeaning: The yard has one person in charge of it, and that person is this dispatcher, working for
  the railway.
scope: This is also called a trainmaster or a yardmaster, and it is not a person who drives the engines.
examples:
- The train dispatcher held the freight train in the yard until the track was clear.
- They asked the train dispatcher which track the train should use.
