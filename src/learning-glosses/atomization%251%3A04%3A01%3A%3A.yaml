simpleMeaning: Breaking a thing down to the tiniest bits of matter until nothing of it is left.
scope: Atomisation is another name for this one, which does not build a thing up from small parts.
examples:
- The machine caused the atomization of the sample in a single flash.
- They spoke of atomization as the end of everything in the blast.
