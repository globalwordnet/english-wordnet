simpleMeaning: A game in which players on opposite sides must touch each other with their bodies.
scope: This one is about games where touching the other side is part of the game, not games where players
  keep apart.
examples:
- Rugby is a contact sport with plenty of tackling.
- Players often get bruised playing a contact sport.
