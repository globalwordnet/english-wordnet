senseId: 'reprehensibly%4:02:00::'
synsetId: 00305019-r
simpleMeaning: So that blame is earned, whether by how it is done or by how far it goes
scope: Also called culpably, it is a word for the way an act is done when the act earns blame.
examples:
- They acted reprehensibly when they lied to the court.
- Someone spoke reprehensibly about friends behind their backs.
