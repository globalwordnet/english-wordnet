senseId: 'vena_vestibularis%1:08:00::'
synsetId: 05433158-n
simpleMeaning: Blood vessels from the saccule and the utricle, two small sacs in the inner ear, carry
  blood away.
scope: These are the blood vessels that drain the saccule and utricle, also called vestibular veins, not
  the ones that drain the rest of the ear.
examples:
- The doctor traced the vena vestibularis back to the saccule on the scan.
- Blood left the utricle through the vena vestibularis.
