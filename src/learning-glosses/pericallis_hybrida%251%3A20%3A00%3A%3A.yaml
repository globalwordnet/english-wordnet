simpleMeaning: A garden plant bred from Pericallis cruenta. Its many varieties produce masses of small
  flowers in white, pink, red, purple, violet, or blue.
scope: Also called florist's cineraria; not a wild herb.
examples:
- The Pericallis hybrida flowered in pink and blue pots.
- She grew Pericallis hybrida for its many bright flowers.
