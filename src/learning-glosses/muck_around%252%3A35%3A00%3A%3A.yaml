simpleMeaning: To take up one job after another with no plan, or to pass the day doing nothing much.
scope: It is also called monkey, tinker, potter, putter, mess around, monkey around, or muck about.
examples:
- They spent the morning mucking around in the garage.
- The old man was mucking around in the little house all day.
