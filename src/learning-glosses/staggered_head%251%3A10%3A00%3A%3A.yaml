simpleMeaning: A story's big print title, set with its first line at the left edge and the rest moved
  in from the right.
scope: Drop line, dropline, stagger head, stephead and stepped line are other names for it.
examples:
- The staggered head filled the top of the page.
- They read the staggered head before the story.
