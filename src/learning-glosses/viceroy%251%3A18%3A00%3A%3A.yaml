simpleMeaning: This governor stands in for the king or ruler, ruling a country or province.
scope: This is a governor who rules as a sovereign's representative, not a butterfly.
examples:
- The viceroy ruled the province for the king, signing laws in his name.
- They sent a viceroy to govern the province until the sovereign chose a new one.
