simpleMeaning: The ratio of the stress applied to an elastic material to its strain, the resulting proportional
  change in its shape or size.
scope: It is also called the coefficient of elasticity or the elastic modulus.
examples:
- The engineer looked up the modulus of elasticity for steel.
- They used the modulus of elasticity to work out how far the rod would stretch.
