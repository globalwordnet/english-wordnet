simpleMeaning: To overwhelm someone, as a wave of feeling or a rush of sights and sounds might.
scope: Also called overwhelm, overcome, overpower, overtake, or whelm, this is what strong feelings, or
  much to see and hear, do to a person.
examples:
- Sadness sweeps over them.
- The noise and lights sweep over them.
