senseId: nitwitted%5:00:00:stupid:00
synsetId: 00443382-s
simpleMeaning: Said above all of a person who cannot think clearly, take in what things mean, or judge
  what is right.
scope: Also called senseless, witless, or soft-witted. It is an adjective.
examples:
- The nitwitted plan failed because no one had thought it through.
- Their nitwitted scheme lost all the money in a week.
