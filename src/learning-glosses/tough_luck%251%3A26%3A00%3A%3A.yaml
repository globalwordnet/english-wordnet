synsetId: 14498989-n
simpleMeaning: An unfortunate state left by things going wrong.
scope: Also called misfortune, bad luck, and ill luck, this is a sad state, not the bad turn itself.
examples:
- It was tough luck that the rain ruined the whole day.
- They called it tough luck when the shop closed after only a year.
