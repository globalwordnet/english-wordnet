simpleMeaning: In computer work, how fast a box that links a computer to a phone line sends bits, counted
  in bits each second.
scope: Also called a baud rate, this one is about a speed.
examples:
- The baud of the modem was too slow for the large files they wanted to send.
- Engineers checked the baud before they linked the two machines.
