senseId: 'transistorize%2:40:00::'
synsetId: 02345732-v
simpleMeaning: A person fits transistors, small parts that switch electric signals, into an electronic
  circuit or device.
scope: Transistorise is another name for this sense, which is about a circuit or device that already exists,
  not about building the device.
examples:
- The engineers transistorized the radio, and it worked on transistors from then on.
- They transistorized the circuits in the new model.
