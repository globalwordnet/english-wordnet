simpleMeaning: One of two solutions that form when two liquids mix only partly. Each solution contains
  a smaller amount of one liquid dissolved in the other.
scope: This sense is also called conjugate, a mix of two half-mixing fluids A and B that yields two twin
  mixes, one of A in B and one of B in A.
examples:
- Conjugate solutions mix A in B and B in A.
- The conjugate solution yields twin mixes.
