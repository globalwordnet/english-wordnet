senseId: 'sacrifice_operation%1:04:00::'
synsetId: 00733054-n
simpleMeaning: A way of killing other people in an attack that also ends the life of the person who carries
  it out, most often with a bomb.
scope: This attack takes other lives along with the attacker's own, also called a martyr operation or
  a suicide mission.
examples:
- The sacrifice operation killed the attacker and other people.
- After the sacrifice operation, there was no attacker left alive.
