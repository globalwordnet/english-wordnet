simpleMeaning: Healthy cells are likely to turn into the cells of a cancerous growth when this gene is
  at work in them.
scope: This is also called an oncogene, not one that leaves cells as they are.
examples:
- They found a transforming gene in the cells that had turned into cancer cells.
- A transforming gene can turn healthy cells into cancer cells.
