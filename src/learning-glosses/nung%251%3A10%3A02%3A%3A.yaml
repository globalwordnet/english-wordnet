simpleMeaning: A Tai language of northern Vietnam's Cao Bang, Lang Son, Bac Kan, Tuyen Quang, Ha Giang,
  Lao Cai and Thai Nguyen, possibly also Ho Chi Minh City and elsewhere south.
scope: One branch of the Tai languages of northern Vietnam; not the other Tai branches of the same area.
examples:
- Nung is spoken in the north of Vietnam.
- Nung speakers live in Cao Bang province.
