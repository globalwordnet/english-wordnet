simpleMeaning: A brand of the antibiotic amoxicillin, a semisynthetic penicillin taken by mouth for bacterial
  infections. Other brands include Amoxil, Larotid, and Polymox. Augmentin combines amoxicillin with clavulanate.
scope: A drug that fights germs, a man-made penicillin taken by mouth, also called amoxicillin, Amoxil,
  Augmentin, Larotid and Polymox.
examples:
- The doctor gave him Trimox for the infection.
- Trimox is taken by mouth to treat infections caused by germs.
