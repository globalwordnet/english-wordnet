simpleMeaning: A church leader who ranks below the one in charge of a church district and helps that leader.
scope: Also called a suffragan. It is not the leader in charge of the district.
examples:
- The suffragan bishop visited the small churches in the district.
- They asked the suffragan bishop to lead the service.
