simpleMeaning: A tube in a television camera that rapidly scans an image formed by light and converts
  it into electronic signals.
scope: Also called television pickup tube, this part takes in a picture made of light and gives back electric
  signals.
examples:
- The television-camera tube scanned the scene and sent out electric signals.
- A television-camera tube sat inside the camera.
