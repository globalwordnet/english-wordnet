simpleMeaning: A planned attack on what people think of a person, meant to leave them with a bad name.
scope: This sense is also called assassination and blackwash.
examples:
- The newspaper's character assassination of the mayor cost the mayor the election.
- The gossip column tried a character assassination, but readers saw through the lies.
