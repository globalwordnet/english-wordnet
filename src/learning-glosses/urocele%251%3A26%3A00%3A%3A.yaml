simpleMeaning: Urine leaks out of its usual path and gathers in the sac that holds the testicles.
scope: This is a leak of urine into the sac that holds the testicles, not urine that stays in its usual
  path.
examples:
- The doctor found a urocele after the injury and drained the urine from the sac.
- A urocele left the sac swollen until the urine was drained away.
