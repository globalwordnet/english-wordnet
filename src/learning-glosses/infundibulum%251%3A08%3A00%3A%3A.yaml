simpleMeaning: Any funnel-shaped part of the body, especially the stalk connecting the pituitary gland
  to the brain.
scope: A funnel-shaped body part, most of all the stalk below the brain; not a funnel used in the kitchen
  and not a tube for pouring.
examples:
- The infundibulum connects the pituitary gland to the brain.
- The doctor pointed out the infundibulum on the scan.
