simpleMeaning: Said of someone who is quick to pass on things that were meant to stay secret.
scope: Also called leaky, tattling, and talebearing, this one names a quality.
examples:
- No one told them secrets any more — they were known to be blabbermouthed.
- The blabbermouthed clerk told the whole office about the deal before it was signed.
