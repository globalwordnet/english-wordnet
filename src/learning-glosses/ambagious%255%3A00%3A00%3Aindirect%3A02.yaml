senseId: ambagious%5:00:00:indirect:02
synsetId: 00771186-s
simpleMeaning: Said of words that go round about, using far more than they need.
scope: Also called circumlocutious, circumlocutory, or periphrastic, this one says too much, not too little.
examples:
- Their ambagious letter took three pages to say what one short note could have said.
- The speaker's ambagious style wore the crowd out before the point was made.
