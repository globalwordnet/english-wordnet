simpleMeaning: In bridge, the player who plays the winning side's contract after being the first partner
  to bid its trump suit or no-trump.
scope: Also called contractor, this one is about a player.
examples:
- The declarer chose hearts as trumps and led the first card.
- The declarer named spades, and spades beat every other suit.
