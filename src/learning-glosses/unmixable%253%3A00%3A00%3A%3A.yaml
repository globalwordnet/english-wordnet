senseId: 'unmixable%3:00:00::'
synsetId: 00511660-a
simpleMeaning: In chemistry and physics, things of this kind cannot blend into one at all.
scope: This is also called immiscible or non-miscible, and it names things that stay apart, not things
  that join together.
examples:
- Oil and water are unmixable, so they form two layers in the glass.
- They tried to stir the paint and the oil, but the two stayed unmixable.
