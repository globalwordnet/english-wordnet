simpleMeaning: Sight in which straight lines look bent out of shape.
scope: This word is about sight that bends straight lines, not sight that shows them as they are.
examples:
- With anorthopia, the edge of the table seemed to bend in the middle.
- The patient drew a door frame, but anorthopia made the straight sides look curved.
