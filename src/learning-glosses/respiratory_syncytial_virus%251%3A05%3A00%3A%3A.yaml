simpleMeaning: A virus that can make cells fuse and cause serious lung infections, especially in babies
  and young children.
scope: Often called RSV. It belongs to the family Pneumoviridae and can cause bronchiolitis or pneumonia.
examples:
- Respiratory syncytial virus can cause bad breathing sickness in small children.
- The baby caught respiratory syncytial virus and had trouble breathing.
