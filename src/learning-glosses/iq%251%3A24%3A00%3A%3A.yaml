simpleMeaning: A score from an intelligence test, traditionally calculated by dividing mental age by actual
  age and multiplying by 100.
scope: This is a score for how clever a person is, worked out from a test, the mind age over the real
  age times 100; intelligence quotient and I.Q. are other names for it; not a test of strength and not
  a school grade.
examples:
- Her IQ was measured with a test at school.
- An IQ of 100 is taken as the middle score.
