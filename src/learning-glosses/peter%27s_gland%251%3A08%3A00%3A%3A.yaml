simpleMeaning: A cluster of tissue that helps defend the body against infection, found in the wall of
  the small intestine, especially near its lower end.
scope: Another name for a Peyer's patch.
examples:
- The doctor pointed to a Peter's gland in the wall of the gut.
- Peter's glands sit near the end of the small intestine.
