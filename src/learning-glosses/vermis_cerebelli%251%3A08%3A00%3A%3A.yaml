simpleMeaning: The narrow central strip of the cerebellum, between its two halves.
scope: Also called vermis. It is a part of the small brain, not one of its two halves.
examples:
- The surgeon avoided the vermis cerebelli during the operation.
- The scan showed the vermis cerebelli clearly.
