senseId: 'viosterol%1:27:00::'
synsetId: 15116794-n
simpleMeaning: A preparation of vitamin D, a fat-soluble vitamin that helps prevent rickets, a disease
  that weakens growing bones.
scope: Calciferol, cholecalciferol, ergocalciferol, D and vitamin D are other names for this substance,
  not one that dissolves in water.
examples:
- They took viosterol every day to keep their bones hard and straight.
- Without viosterol, their bones grew soft and bent.
