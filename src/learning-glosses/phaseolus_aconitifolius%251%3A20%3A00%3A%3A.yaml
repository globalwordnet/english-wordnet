simpleMeaning: An Indian bean with hairy leaves, small yellow flowers and cylindrical pods. In India it
  feeds people and livestock and improves soil. Some botanists classify it in the genus Phaseolus.
scope: Grown especially in India for food, feed, and to make soil better; also called moth bean and Vigna
  aconitifolia.
examples:
- Phaseolus aconitifolius feeds the soil as it grows.
- Phaseolus aconitifolius bears small yellow flowers in India.
