simpleMeaning: A court order allowing officers to search for people or objects connected to a crime and
  bring them before the court. It specifies where officers may search.
scope: This court paper lets officers of the law look for things or people tied to a crime and bring what
  is found before a judge, naming where they may look.
examples:
- The officers needed a search warrant to look for things tied to a crime.
- A search warrant names where officers of the law may look.
