senseId: 'versify%2:36:00::'
synsetId: 01706373-v
simpleMeaning: To make a poem out of something, or to put plain words into lines of poetry.
scope: Also called verse, poetise and poetize. It is a kind of writing, not a kind of reading.
examples:
- He versified the ancient saga.
- The poet versified the old tale for the winter festival.
