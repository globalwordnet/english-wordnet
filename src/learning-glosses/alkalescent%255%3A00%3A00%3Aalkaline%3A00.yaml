simpleMeaning: Tending to become alkaline or already slightly alkaline.
scope: Also called alcalescent, this one has not gone the whole way toward the opposite of an acid.
examples:
- They tested the alkalescent water and found it only a little alkaline.
- This alkalescent soil will turn more alkaline over time.
