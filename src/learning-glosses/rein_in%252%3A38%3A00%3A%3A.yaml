simpleMeaning: by a tug on the guiding straps, or only as if by such a tug, to slow a horse or yourself
  down or bring either to a stop
scope: Also called rein, it is the check that slows or halts a horse or yourself by a pull on the guiding
  straps.
examples:
- The rider reined in the horse before the gate.
- They reined in their horses at the top of the rise.
