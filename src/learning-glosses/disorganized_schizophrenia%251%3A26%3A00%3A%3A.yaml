senseId: 'disorganized_schizophrenia%1:26:00::'
synsetId: 14422842-n
simpleMeaning: A former schizophrenia subtype involving severe personality breakdown, erratic speech,
  immature mannerisms, and unusual behavior, historically described as usually appearing at puberty and
  most often diagnosed in psychiatric hospitals.
scope: Also called hebephrenia, hebephrenic schizophrenia or disorganized type schizophrenia; not schizophrenia
  as a whole, and not the catatonic or paranoid forms.
examples:
- His disorganized schizophrenia made his speech hard to follow.
- She was diagnosed with disorganized schizophrenia in her late teens.
