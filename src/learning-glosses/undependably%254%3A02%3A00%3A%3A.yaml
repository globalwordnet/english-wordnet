senseId: 'undependably%4:02:00::'
synsetId: 00225252-r
simpleMeaning: A person who acts in this way breaks trust and cannot be counted on.
scope: Also called unfaithfully and unreliably, this word marks a way of acting, not one that keeps trust.
examples:
- They acted undependably, promising help and then never coming.
- The worker behaved undependably, missing deadlines they had agreed to meet.
