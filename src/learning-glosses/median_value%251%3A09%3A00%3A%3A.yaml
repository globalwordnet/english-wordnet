synsetId: 06033170-n
simpleMeaning: The middle value when numbers are arranged in order. If there are two middle values, the
  median is their average.
scope: It is also called median.
examples:
- The median value of 3, 5 and 8 is 5.
- With four numbers, the median value falls between the two in the middle.
