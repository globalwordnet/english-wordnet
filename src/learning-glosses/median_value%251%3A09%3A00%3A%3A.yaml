senseId: 'median_value%1:09:00::'
synsetId: 06033170-n
simpleMeaning: The number that falls halfway between the two middle numbers of a list, whether the list
  has an even or an odd count of items.
scope: It is also called median.
examples:
- The median value of 3, 5 and 8 is 5.
- With four numbers, the median value falls between the two in the middle.
