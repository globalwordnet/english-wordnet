simpleMeaning: A member of the Tuscarora people, whose ancestors lived in North Carolina and later joined
  the Haudenosaunee Confederacy in New York.
scope: This is one of a people of the Iroquois who once lived in North Carolina and then moved to New
  York State, not the tongue they speak and not the Iroquois as a whole.
examples:
- The Tuscarora moved from North Carolina to New York State.
- She is a Tuscarora from New York State.
