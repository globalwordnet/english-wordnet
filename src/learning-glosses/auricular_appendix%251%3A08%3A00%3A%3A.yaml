simpleMeaning: A pouch that projects from the upper front of each upper chamber of the heart.
scope: Also called auricula and auricular appendage, this pouch sits at the top of the heart.
examples:
- The auricular appendix stuck out from the top of the heart's upper chamber.
- The scan showed the auricular appendix at the front of the heart.
