simpleMeaning: A long, eel-like sea creature of the Atlantic that stays on the ocean floor and has a big,
  nearly upright mouth.
scope: This sense is also called wrymouth and Cryptacanthodes maculatus.
examples:
- A ghostfish lay still on the sea floor, its large mouth pointing up.
- Divers spotted a ghostfish on the sea floor off the coast.
