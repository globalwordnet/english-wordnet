simpleMeaning: A large wagon with broad wheels and an arched canvas cover, used by US pioneers crossing
  the prairies in the 1800s.
scope: Also called covered wagon, prairie schooner, prairie wagon and Conestoga, this is a large cart
  of the United States pioneers, not a small farm cart.
examples:
- The Conestoga wagon crossed the prairie in the 1800s.
- A Conestoga wagon carried the family west.
