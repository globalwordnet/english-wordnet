simpleMeaning: Said of a person who has given up, and waits for nothing better.
scope: Also called abject. It is said of a person, not of a thing.
examples:
- The unhopeful crowd stood in silence after the last defeat.
- They gave an unhopeful shrug and walked away from the closed door.
