simpleMeaning: One of a group of viruses that includes the viruses responsible for mumps and measles.
scope: A set of germs that bring on mumps and measles, not a single germ and not the germs that bring
  on a cold.
examples:
- Mumps is caused by a paramyxovirus.
- Scientists study each paramyxovirus in the group to find how it spreads.
