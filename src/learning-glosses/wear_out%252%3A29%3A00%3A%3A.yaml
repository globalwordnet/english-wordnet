senseId: 'wear_out%2:29:00::'
synsetId: 00074774-v
simpleMeaning: To use up all the strength a person has, or to use up all of one's own, from too much use
  or from heavy strain or stress.
scope: Also called wear, tire, weary, fatigue, jade, fag, fag out, outwear, tire out, wear down, and wear
  upon. It is an action.
examples:
- The long hike wore out the whole group by noon.
- The heat soon wore out the runners.
