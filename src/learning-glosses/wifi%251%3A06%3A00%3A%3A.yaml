simpleMeaning: A local wireless network that sends and receives data by radio, often over a few hundred
  feet. Its wireless links use the IEEE 802.11 standards.
scope: Also called wireless fidelity, a wireless local area network or WLAN; a local network using radio
  waves over short distances, not a wired network or a mobile phone network.
examples:
- The WiFi in the café is fast.
- She joined the WiFi network at the hotel.
