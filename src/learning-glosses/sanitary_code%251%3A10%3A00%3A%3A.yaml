simpleMeaning: A body of rules laid down and enforced by the government, setting health standards, covering
  such things as pipes and drains.
scope: A health code is another name for this set of government rules on health standards.
examples:
- The sanitary code covers the pipes and drains in the building.
- Builders must follow the sanitary code when they put in new pipes.
