senseId: wash-and-wear%5:00:00:washable:00
synsetId: 02544514-s
simpleMeaning: Cloth treated this way cleans easily or quickly in water, dries easily or quickly, needs
  hardly any ironing, then is ready to put on.
scope: This word, also called drip-dry, describes cloth, not the cloth itself.
examples:
- They packed a wash-and-wear shirt for the trip because it dries quickly and needs no ironing.
- The wash-and-wear blouse needed no ironing after cleaning.
