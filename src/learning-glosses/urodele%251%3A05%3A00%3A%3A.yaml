simpleMeaning: An animal that spends part of its life in water and part on land, and has the shape of
  a lizard.
scope: Also called caudate. It is a kind of animal, not a lizard itself.
examples:
- The urodele hid under a wet stone by the pond.
- A urodele swam in the shallow pool at dusk.
