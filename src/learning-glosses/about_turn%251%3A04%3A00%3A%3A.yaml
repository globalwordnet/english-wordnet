simpleMeaning: A quick move, above all made by soldiers in formation, in which they face the opposite
  way.
scope: This one is also called about-face.
examples:
- On the command, the whole platoon did an about turn and marched back the way they had come.
- The sergeant called for an about turn, and the ranks faced the opposite direction at once.
