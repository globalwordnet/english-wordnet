simpleMeaning: Said of a person who lives alone and gives up everyday comforts.
scope: Also called eremitic, eremitical, hermitic, or hermitical, this solitude can be part of life in
  a religious group, not only a life far from everyone.
examples:
- After years of city life, the writer chose an anchoritic life in a small hut.
- Few visitors ever reached the anchoritic home at the edge of the woods.
