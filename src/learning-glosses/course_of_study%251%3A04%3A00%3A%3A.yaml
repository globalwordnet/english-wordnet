simpleMeaning: Learning passed on in lessons or meetings held one after another.
scope: Also called a course, a class, or a course of instruction, this one is about learning in lessons,
  not an integrated academic programme.
examples:
- They took a course of study in basket weaving.
- A course of study in first aid ran through the spring.
