simpleMeaning: To take out what may shock or offend, so a thing is milder and easier to accept.
scope: Sanitize is another name for this word, which is about making a thing less shocking, not about
  making it clean.
examples:
- They had to sanitise the document before giving it to the press.
- The writer agreed to sanitise the language in the book.
