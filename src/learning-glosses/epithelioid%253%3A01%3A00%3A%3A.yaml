simpleMeaning: Having to do with the thin layer of cells that covers the outside of the body and lines
  the inside of organs.
scope: Also called epithelial. It is about a describing word, not a thing.
examples:
- The epithelioid cells looked like skin cells under the microscope.
- The epithelioid layer covered the surface of the organ.
