simpleMeaning: In animals with backbones, the skull and the top jaw form one fixed piece.
scope: This is also called the maxilla, the maxillary, and the upper jawbone, and it does not move, unlike
  the lower one.
examples:
- The dentist looked at the upper jaw to check how it joined to the skull.
- The upper jaw of the fish was fixed to its skull.
