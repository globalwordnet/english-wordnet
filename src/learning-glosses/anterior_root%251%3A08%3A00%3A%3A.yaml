simpleMeaning: One of two roots of a spinal nerve. It extends from the front of the spinal cord and contains
  nerve fibers that control movement.
scope: This sense is also called anterior horn, ventral horn, and ventral root.
examples:
- An anterior root ran from the cord.
- Anterior roots carry mover threads.
