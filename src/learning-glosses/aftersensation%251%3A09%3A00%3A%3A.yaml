senseId: 'aftersensation%1:09:00::'
synsetId: 05944848-n
simpleMeaning: An image that remains visible after the original stimulus is gone, often with light and
  dark areas or colors reversed.
scope: Also called afterimage, this one is not a picture seen while the thing is still before the eyes.
examples:
- The aftersensation of the bright light stayed in their mind once they looked away.
- They closed their eyes, but the aftersensation of the flash was still there.
