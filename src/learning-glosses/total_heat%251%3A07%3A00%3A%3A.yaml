simpleMeaning: The energy inside a system, added to its size times its push, gives this quantity in thermodynamics.
scope: Also called enthalpy, heat content, or H, this is a quantity in thermodynamics, not the energy
  inside the system on its own.
examples:
- They worked out the total heat of the system from its size and push.
- The total heat rose when the push inside grew.
