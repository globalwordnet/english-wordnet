senseId: 'registered_nurse%1:18:00::'
synsetId: 10536120-n
simpleMeaning: A nurse who has completed an approved nursing program and passed the examinations required
  for registration.
scope: Also called an RN, this is a person on the official list who trained to care for the sick and passed
  the set tests.
examples:
- The registered nurse gave the medicine and wrote down the dose.
- A registered nurse took the patient's temperature and pulse.
