simpleMeaning: An official appointed to check the accounts of banks in a particular area.
scope: A person who checks a lender's books, not the lender's own worker and not a judge.
examples:
- The bank examiner spent a week going through the lender's books.
- A bank examiner found that the figures did not add up.
