simpleMeaning: Said of someone who opposes others because they insist on having their own way.
scope: Also called cross-grained; this one is about a person, not a thing.
examples:
- The contrarious teenager refused every suggestion, just to have their own way.
- The meeting dragged on because one contrarious member opposed every proposal.
