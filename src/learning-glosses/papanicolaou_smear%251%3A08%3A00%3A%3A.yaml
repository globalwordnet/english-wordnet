synsetId: 05273738-n
simpleMeaning: A sample of fluid and surface cells from the cervix and uterus, checked under a microscope
  for cells that look abnormal.
scope: 'Also called cervical smear and Pap smear: a test in which a small amount of fluid and cells from
  the neck of the womb is looked at under a microscope to find unhealthy cells.'
examples:
- The nurse took a Papanicolaou smear to check the cells of her cervix.
- Her Papanicolaou smear showed no unhealthy cells.
