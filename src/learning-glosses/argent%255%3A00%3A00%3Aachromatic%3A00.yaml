simpleMeaning: Shiny gray, or covered with or tinged with the color of silver.
scope: Also called silver, silvery, and silverish, this one is not the colour used on coats of arms.
examples:
- Their argent hair caught the light as they turned.
- The argent threads in the cloth shone like metal.
