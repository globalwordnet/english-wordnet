simpleMeaning: Swelling and soreness of the thin skin lining the heart's inner chambers and of the flaps
  that guard the flow of blood through the heart.
scope: It is a noun that names a disorder of the heart.
examples:
- The doctors found endocarditis when they looked at the lining of the patient's heart.
- The cardiologist explained endocarditis to the patient and their family.
