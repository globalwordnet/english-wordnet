senseId: 'contrapuntal%3:00:00::'
synsetId: 01548336-a
simpleMeaning: Said of music in which two or more tunes, each standing on its own, sound together in harmony.
scope: Also called polyphonic; this one is about music, not the rules for writing it.
examples:
- The contrapuntal lines of the fugue wove in and out of each other.
- A contrapuntal passage lets two tunes sound at once.
