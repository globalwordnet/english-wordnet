simpleMeaning: The Cyrillic letter ь represented a short front vowel in Old Church Slavonic. Today it
  can mark the preceding consonant as soft.
scope: Also called the soft sign. Its modern use differs from its use as a vowel letter in Old Church
  Slavonic.
examples:
- In this Old Church Slavonic word, the front yer stood for a short vowel.
- The front yer tells the reader that the consonant before it is soft.
