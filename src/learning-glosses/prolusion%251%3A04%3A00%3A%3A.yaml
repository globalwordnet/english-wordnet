simpleMeaning: Exercise done first to get the body ready for hard physical work.
scope: Also called a tune-up or a warm-up. It is not a short piece of writing at the start of a book.
examples:
- Their prolusion was a light jog and some stretches before the match.
- A good prolusion loosens the muscles before strenuous work.
