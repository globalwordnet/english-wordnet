simpleMeaning: A measure relating weight to height. Divide weight in pounds by height in inches squared
  and multiply by 703. Adult categories include overweight (25 to under 30) and obesity (30+).
scope: Not other measures of weight, nor other health numbers; also called body mass index.
examples:
- My BMI is 24.
- A BMI over 30 means obese.
