simpleMeaning: Run on the idea that the land, factories, and tools used to make things belong to the state
  or to everyone.
scope: This one is also called collectivized, and it is about a system run on shared ownership, not a
  person who holds the belief.
examples:
- The collectivised farms were run by the state.
- Under the collectivised system, the factories belonged to everyone.
