simpleMeaning: A stream in which the tide causes the water level to rise and fall far upstream.
scope: Also called tidal river, tidal stream, and tidewater river, this is not a flow beyond the sea's
  reach.
examples:
- The tidewater stream still showed the tide far upstream.
- The tidewater stream rose with the tide far from the sea.
