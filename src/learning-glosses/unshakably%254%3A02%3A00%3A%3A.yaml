senseId: 'unshakably%4:02:00::'
synsetId: 00213506-r
simpleMeaning: In a way that stays with a choice, and does not change.
scope: Also called determinedly and unfalteringly. It is a way of acting, not a feeling.
examples:
- The committee held unshakably to its decision through the long debate.
- They clung unshakably to the old rules, and would not let them go.
