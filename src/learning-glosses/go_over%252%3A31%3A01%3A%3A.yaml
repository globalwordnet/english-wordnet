simpleMeaning: To study a thing with care, to find whether it is right, good, or sound.
scope: This sense is also called check, check into, check out, check over, check up on, look into, and
  suss out.
examples:
- They went over the report before sending it out.
- They went over the figures twice to catch mistakes.
