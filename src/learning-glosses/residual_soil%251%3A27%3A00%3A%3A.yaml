senseId: 'residual_soil%1:27:00::'
synsetId: 14719749-n
simpleMeaning: Soil that remains after its soluble components have dissolved.
scope: This is the ground that stays put after the parts that can come apart in water have gone, also
  called residual clay.
examples:
- The residual soil lay just below the topsoil.
- Samples of the residual soil showed that the parts that could dissolve were already gone.
