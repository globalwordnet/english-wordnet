senseId: 'excitability%1:09:00::'
synsetId: 05661555-n
simpleMeaning: Unusually high sensitivity in an organ or other part of the body.
scope: This one is also called irritability, and it is said of an organ or a body part, not of a person
  who is easily stirred up.
examples:
- The excitability of the injured hand made even a light touch painful.
- They tested the patient's excitability by tapping the knee gently.
