senseId: 'do-si-do%1:04:00::'
synsetId: 00541738-n
simpleMeaning: A set pattern of steps in a square dance, in which two dancers come close, move round each
  other back to back, and go back to where they started.
scope: This one is about a single pattern of steps, not a whole dance.
examples:
- They did a do-si-do in the middle of the dance.
- The caller showed them how to do a do-si-do.
