simpleMeaning: A drug that wakes up the brain and the nerves running from it.
scope: This sense is not about a drug that calms the nervous system down.
examples:
- The doctor gave the patient an analeptic to rouse the brain and nerves.
- In the ward, the nurse reached for an analeptic when the patient would not wake.
