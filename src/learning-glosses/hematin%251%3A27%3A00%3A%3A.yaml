simpleMeaning: A dark iron-containing pigment formed when the iron in heme, part of hemoglobin, is oxidized.
scope: This is a red colouring matter holding iron and other atoms to which oxygen sticks, also called
  haem, haematin, heme, and protoheme, and not the red cells that carry it or any other blood part.
examples:
- Hematin gives blood its red colour.
- The lab studied hematin and how it binds oxygen.
