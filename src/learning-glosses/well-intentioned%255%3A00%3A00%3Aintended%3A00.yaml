simpleMeaning: They mean it for the best, yet what they do often turns out badly.
scope: This is also called well-meaning and well-meant, and it is not about doing harm on purpose.
examples:
- The well-intentioned waiter spilled soup on a guest while trying to help.
- Their well-intentioned advice only made the quarrel worse.
