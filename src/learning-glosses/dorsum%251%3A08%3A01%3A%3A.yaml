simpleMeaning: The back part of a person's or an animal's body, from the neck down to the end of the backbone.
scope: This one is also called back; it is about a person or an animal, not the surface of an organ.
examples:
- The dorsum of the horse was sore after the long ride.
- They rubbed the dorsum gently after the fall.
