simpleMeaning: 'To colour things, this white powder is used: it covers well what lies below and lasts
  a long time.'
scope: This white powder is also called titania, titanium dioxide and titanium oxide, not one that wears
  off fast or lets old colours show through.
examples:
- They added titanic oxide to the paint for a lasting white cover.
- The titanic oxide hid the old colour under the new paint.
