simpleMeaning: Officials who are not judges are picked to listen to pleas for a ruling to be checked again.
scope: Also called appeal board and board of appeals, this one does not make the first decision on a case.
examples:
- The appeals board met on Tuesday to hear the shop owner's case.
- They took their complaint to the appeals board after the first ruling went against them.
