simpleMeaning: Treatment of sickness, above all cancer, that works by leaving the sick part in rays from
  a radioactive substance.
scope: It is also called radiation, radiotherapy, actinotherapy, and radiation therapy.
examples:
- The doctor ordered irradiation for the tumour.
- Irradiation was given in the hospital's new wing.
