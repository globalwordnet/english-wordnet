simpleMeaning: A yobibyte, a unit of data equal to 1,024 zebibytes or 2 to the power of 80 bytes.
scope: Also called YB, yobibyte and yottabyte, this is a unit of bytes, not a unit of bits.
examples:
- The file was one YiB in size.
- One YiB equals one thousand twenty-four zebibytes.
