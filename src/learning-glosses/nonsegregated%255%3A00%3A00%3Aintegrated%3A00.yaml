simpleMeaning: Rid of the keeping of different groups of people apart, and having had that keeping ended.
scope: Also called desegrated and unsegregated. It is an adjective.
examples:
- The nonsegregated school took in children from all parts of town.
- After the ruling, the town's pools were nonsegregated and open to everyone.
