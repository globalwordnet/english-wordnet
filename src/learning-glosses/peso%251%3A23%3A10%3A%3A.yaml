simpleMeaning: The former basic unit of money in Guinea-Bissau, equal to 100 centavos.
scope: Guinea-Bissau used this peso before adopting the West African CFA franc in 1997.
examples:
- In 1990 she paid for the cloth in pesos in Bissau.
- The museum displayed a note worth fifty Guinea-Bissau pesos.
