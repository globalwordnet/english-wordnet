simpleMeaning: A tree from the south-eastern United States and Mexico, one that sheds all its leaves each
  winter.
scope: This one is also called black haw, chittamwood, false buckthorn, shittimwood, or Bumelia lanuginosa.
examples:
- The chittimwood by the road had lost all its leaves by December.
- They stopped to rest under a chittimwood on the walk home.
