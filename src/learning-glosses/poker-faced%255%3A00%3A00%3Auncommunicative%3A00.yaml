simpleMeaning: Hiding what one feels on purpose, so that one's looks give nothing away.
scope: Also called impassive, expressionless, deadpan, or unexpressive. It is a word.
examples:
- The witness stayed poker-faced while the news was read out.
- A poker-faced look gave nothing away during the game.
