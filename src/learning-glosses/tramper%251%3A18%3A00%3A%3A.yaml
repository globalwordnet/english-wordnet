simpleMeaning: A person whose steps come down hard and loud as they walk, or who stamps on the ground.
scope: This person is also called a stamper, a stomper or a trampler, not someone out for a long walk
  for pleasure.
examples:
- They could hear the tramper coming down the hall long before they saw them.
- The tramper stamped on the ground as they walked past.
