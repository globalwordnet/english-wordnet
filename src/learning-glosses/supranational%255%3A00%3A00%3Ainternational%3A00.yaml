senseId: supranational%5:00:00:international:00
synsetId: 01573759-s
simpleMeaning: Having to do with things that stand above single countries, beyond the borders and interests
  they already have.
scope: It is an adjective used with a noun, not a name for a country or a group.
examples:
- They belong to a supranational group that makes rules for several countries at once.
- A supranational court can hear cases from more than one country.
