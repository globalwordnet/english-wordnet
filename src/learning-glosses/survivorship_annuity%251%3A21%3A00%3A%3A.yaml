synsetId: 13316206-n
simpleMeaning: A payment made every year to one person when the person meant to get it cannot take it.
scope: It is also called reversionary annuity.
examples:
- The survivorship annuity paid out each year after the first named person died.
- They set up a survivorship annuity so the money would go to one person if the other could not take it.
