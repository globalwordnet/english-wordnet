senseId: 'end-stopped%3:00:00::'
synsetId: 00876695-a
simpleMeaning: A line of verse where the sense is complete as the line closes, with a pause before the
  next line begins.
scope: Verse is the field where this term belongs.
examples:
- The actor paused at the close of each end-stopped line, letting the sense settle before moving on.
- In this end-stopped couplet, every line comes to a rest before the next one starts.
