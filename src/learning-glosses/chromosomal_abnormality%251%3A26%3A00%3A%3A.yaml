senseId: 'chromosomal_abnormality%1:26:00::'
synsetId: 14527705-n
simpleMeaning: Any change in the usual build or count of chromosomes, which often brings bodily or mental
  problems.
scope: Also called chromosomal aberration, chromosomal anomaly, and chromosomal disorder. It is about
  the body.
examples:
- The test showed a chromosomal abnormality before the baby was born.
- The family learned to care for a child with a chromosomal abnormality.
