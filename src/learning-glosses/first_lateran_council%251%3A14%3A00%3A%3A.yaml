simpleMeaning: The Western Church's first council at the Lateran Palace, held in 1123. It addressed church
  discipline and planned to retake the Holy Land from Muslim rulers.
scope: One of the Western Church's meetings, held in a palace in 1123 to settle church rules and plan
  to win back the Holy Lands.
examples:
- The First Lateran Council met in 1123.
- Church discipline was a chief concern of the First Lateran Council.
