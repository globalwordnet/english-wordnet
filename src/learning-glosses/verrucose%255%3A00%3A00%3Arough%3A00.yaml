simpleMeaning: Warts, or lumps that look like warts, cover the skin.
scope: Also called warty and wartlike, this word describes skin with warts on it, not smooth skin.
examples:
- The verrucose skin on the back of their hand made a watch sit badly.
- They felt the verrucose skin on their arm, rough with small lumps.
