simpleMeaning: The middle spot where an infection gathers in a living body.
scope: Also called focus or focal point. It is not the sense about eggs laid by spiders or insects.
examples:
- The doctors found the nidus of the infection in the wound.
- They traced the infection back to a small nidus deep in the tissue.
