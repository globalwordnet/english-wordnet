simpleMeaning: An extract from the inner wood of Acacia catechu, used for dyeing, tanning, and protecting
  fishing nets and sails. It was once used as medicine.
scope: This sense is also called catechu.
examples:
- Black catechu dyes cloth.
- They used black catechu to tan leather.
