simpleMeaning: A red blood part of an odd shape, seen as a dark ring round a dark middle, found in people
  with a lack of healthy blood.
scope: It is not a part with a set place for a germ or a hormone.
examples:
- The doctor saw target cells in the blood sample.
- Target cells showed up in the blood test.
