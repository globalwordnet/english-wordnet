simpleMeaning: Said of a thing that comes into being from things that never had life.
scope: It is said of a thing, not of a thing born from a living thing.
examples:
- The abiogenetic start of life on earth is still a puzzle for scientists.
- Some old books claimed an abiogenetic birth for tiny creatures in rotting meat.
