simpleMeaning: When a thing is pulled it grows longer, and it can also bend or take a new shape.
scope: Also called pliable, malleable, pliant, tensile, and ductile, this word is for a thing that can
  be worked into another form, not one that keeps its shape and cannot be changed.
examples:
- They bent the tractile metal into a curved bar.
- They pulled the tractile glass out into a long thin thread.
