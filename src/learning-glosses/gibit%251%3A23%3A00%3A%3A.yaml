simpleMeaning: A unit of information equal to 1,024 mebibits, or 2 to the 30th power (1,073,741,824) bits.
scope: Also called gibibit; a unit of information, not a unit of weight and not a unit of length.
examples:
- The file was three Gibit in size.
- A Gibit holds more than a billion bits.
