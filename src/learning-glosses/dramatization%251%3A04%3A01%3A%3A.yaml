senseId: 'dramatization%1:04:01::'
synsetId: 00932683-n
simpleMeaning: The making of an acted version from something in another form.
scope: Also called dramatisation. It is about the act, not the thing made.
examples:
- The play was a dramatization of a short story.
- The dramatization took the novel's plot and set it in the present day.
