simpleMeaning: A computer that takes in bets and divides all the money put in among the people whose bets
  win.
scope: Pari-mutuel machine, totalisator, totalizator, and totalizer are other names for it. It is not
  a machine for doing sums.
examples:
- The totaliser took in the bets and shared the money among the winners.
- They looked at the totaliser to find out how much the winning bet had earned.
