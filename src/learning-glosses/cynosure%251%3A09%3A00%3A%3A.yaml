senseId: 'cynosure%1:09:00::'
synsetId: 05820748-n
simpleMeaning: A thing or person that strongly draws the notice and the high regard of people around it.
scope: This one is not the sense that means a guide for travellers, like the North Star.
examples:
- If he was the cynosure of all eyes, he didn't notice.
- The new singer became the cynosure of the whole town.
