simpleMeaning: With no practice first and no earlier knowledge of the piece, this performer looks at the
  music and plays it at once.
scope: This is a performer who plays music with no practice first and no earlier knowledge of it; it is
  not a performer who has learned the piece by heart.
examples:
- The sightreader took up the music and played it straight away.
- A good sightreader can play a piece never seen before.
