simpleMeaning: An organ control that produces a sound like that of a reed instrument.
scope: In an organ, pulling this control gives the sound of a music-maker with a shaking strip.
examples:
- The player pulled the reed stop to change the sound of the organ.
- The organist chose a reed stop for the last verse.
