simpleMeaning: A fee-charging place of learning in Great Britain, free of state control, for older children,
  kept going by gifts of money and by fees.
scope: It is not the free kind in the United States.
examples:
- They went to a public school in Great Britain, where their parents paid the fees.
- Parents paid high fees to send their children to the public school.
