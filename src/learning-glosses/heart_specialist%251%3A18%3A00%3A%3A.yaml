simpleMeaning: A doctor who specializes in cardiology, the study of the heart's structure, function, and
  disorders.
scope: 'Also called cardiologist and heart surgeon: a doctor who treats the blood pump in the chest, not
  a doctor for the lungs and not a doctor who only does operations.'
examples:
- Her heart specialist checked the beat of her chest.
- The heart specialist explained what was wrong with the valve.
