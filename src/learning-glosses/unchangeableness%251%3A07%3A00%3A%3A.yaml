senseId: 'unchangeableness%1:07:00::'
synsetId: 04745174-n
simpleMeaning: A thing with this quality stays the same nearly all the time and hardly ever alters.
scope: Also called changelessness, unchangeability, and unchangingness, this word names the way a thing
  holds its form, not a deed it does.
examples:
- The unchangeableness of the old law was clear to everyone.
- They counted on the unchangeableness of the seasons.
