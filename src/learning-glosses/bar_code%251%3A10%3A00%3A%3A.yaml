senseId: 'bar_code%1:10:00::'
synsetId: 06366181-n
simpleMeaning: A laser-readable pattern of vertical lines of varying widths, printed on product packaging
  so a computer can identify the item, give its price, and track stock.
scope: This is the printed stripe pattern read at a checkout, not a QR code or another square-pattern
  code.
examples:
- The cashier scanned the bar code on the cereal box.
- Each bar code gives the computer the item's price and stock number.
