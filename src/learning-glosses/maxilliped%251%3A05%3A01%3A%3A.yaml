senseId: 'maxilliped%1:05:01::'
synsetId: 92436092-n
simpleMeaning: One of six feeding limbs arranged in three pairs on the middle body section of a ten-legged
  crustacean, just behind its jaws.
scope: The term identifies the appendage by its position and role in feeding.
examples:
- The maxilliped helped the crab feed.
- A crab has three pairs of maxillipeds on the middle part of its body.
