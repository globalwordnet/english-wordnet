simpleMeaning: A trade name for a drug that stimulates circulation and breathing and was used in larger
  doses to induce convulsions in shock therapy.
scope: This is a drug, not a treatment name on its own; also called pentamethylenetetrazol and pentylenetetrazol.
examples:
- Metrazol was used to wake up the breath.
- Large amounts of Metrazol bring on fits.
