senseId: 'vena_cephalica%1:08:00::'
synsetId: 05368671-n
simpleMeaning: In the arm, a large blood vessel carries blood back toward the heart and empties into another
  blood vessel in the armpit that carries it on toward the heart.
scope: This is one blood vessel of the arm, also called cephalic vein, not a small one.
examples:
- The nurse felt for the vena cephalica in the arm before they put the needle in.
- The doctor traced the vena cephalica up the arm toward the shoulder.
