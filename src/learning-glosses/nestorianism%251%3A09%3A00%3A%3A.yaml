simpleMeaning: A teaching associated with Nestorius that stresses a distinction between Christ’s humanity
  and divinity so strong that critics understood it as dividing Christ into two persons.
scope: The controversy concerned how the human and divine are united in Christ.
examples:
- The council condemned what it understood as Nestorianism.
- The class discussed why critics of Nestorianism emphasized the unity of Christ.
