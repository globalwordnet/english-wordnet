simpleMeaning: Car insurance that pays an injured person up to a stated amount through their own insurer,
  regardless of who caused the accident.
scope: A plan of car cover where a hurt person is paid by their own firm no matter who caused the crash;
  no fault insurance is another name for this, not cover that pays only when the other driver is at fault
  and not health cover.
examples:
- No fault automobile insurance paid for her hospital bills after the crash.
- He claimed on his no fault automobile insurance even though the other driver caused it.
