simpleMeaning: A large two-legged meat-eating dinosaur with huge serrated teeth, known from late Cretaceous
  North America. It hunted prey and likely also ate animals already dead.
scope: This sense is also called tyrannosaurus.
examples:
- A tyrannosaur may have fed on dead beasts in North America.
- Tyrannosaurs had huge teeth.
