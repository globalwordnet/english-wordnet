senseId: 'thermogravimetric%3:01:00::'
synsetId: 03014539-a
simpleMeaning: To do with weighing things as they are heated, to see how their weight changes.
scope: Also called thermohydrometric. It is not about measuring liquids.
examples:
- The thermogravimetric test showed the sample losing weight as it heated up.
- A thermogravimetric study tracked the powder's weight through the heating.
