simpleMeaning: Different wordings of a work, or notes on it by different learned people and editors, come
  together in this edition.
scope: This book is also called a variorum edition, not one with a single wording.
examples:
- The variorum prints the poem in several wordings side by side.
- They consulted the variorum for the notes by its editors.
