simpleMeaning: An unusually fast heartbeat, generally over 100 beats per minute in a resting adult.
scope: This is the name for a heartbeat that is too fast, not a slow one.
examples:
- The doctor found tachycardia when checking the pulse.
- They watched the tachycardia on the monitor as the heart beat too fast.
