simpleMeaning: A weight division in combat sports for fighters above middleweight and below super heavyweight.
  Its exact limits depend on the sport and governing body.
scope: This is a weight class between middleweight and super heavyweight; light heavyweight is another
  name for this sense.
examples:
- He fights at cruiserweight.
- The cruiserweight title bout lasted twelve rounds.
