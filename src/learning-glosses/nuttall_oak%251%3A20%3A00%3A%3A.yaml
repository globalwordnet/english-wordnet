simpleMeaning: An oak similar to the pin oak that grows in damp places in the Mississippi River basin.
scope: Also called Nuttall's oak and Quercus nuttalli; a tree like the pin kind that grows in wet ground
  in the lands round the Mississippi River.
examples:
- Nuttall oak grows in the wet ground near the river.
- We saw a Nuttall oak growing in the wet ground near the Mississippi River.
