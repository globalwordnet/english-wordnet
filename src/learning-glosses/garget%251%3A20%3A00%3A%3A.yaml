simpleMeaning: A tall American plant with white flowers and hanging clusters of dark berries. Young shoots
  historically eaten as greens can poison people. The berries and roots are poisonous too.
scope: Garget is a name for American pokeweed. Every part of the plant can cause poisoning.
examples:
- Garget grew beside the fence, its dark berries hanging in clusters.
- The gardener recognized the garget and warned the children about its berries.
