simpleMeaning: If the whole underside of the foot touches the ground, the foot arch has gone flat.
scope: Also called a fallen arch, this is the flattened curve under the middle of the foot.
examples:
- The sunken arch was clear in the footprint.
- The footprint showed a sunken arch with no gap in the middle.
