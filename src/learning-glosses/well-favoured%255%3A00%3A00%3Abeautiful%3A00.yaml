simpleMeaning: Looks that please, above all because they live up to people's ideals of shape and balance.
scope: Handsome, better-looking, fine-looking, good-looking, on fleek, and well-favored are also names
  for this, not for looks that fall short of the ideal.
examples:
- Our southern women are well-favoured.
- She was well-favoured, prettier than her sister.
