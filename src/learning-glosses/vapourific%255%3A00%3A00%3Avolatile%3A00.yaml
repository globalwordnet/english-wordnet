simpleMeaning: Said of a thing that can change into a gas.
scope: Also called evaporable, vaporific, vaporizable, vapourisable, volatilisable, and volatilizable.
  It is said of a substance, not of a gas itself.
examples:
- The vapourific salt passed into gas in the open dish.
- A vapourific powder can vanish into the air.
