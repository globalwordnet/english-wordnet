simpleMeaning: An amino acid that forms crystals, occurs in proteins, and is found naturally in sugar
  beets and sugar cane.
scope: A building block of proteins found in sugar beets and sugar cane, not a sugar itself.
examples:
- Aspartic acid is found in sugar beets.
- The protein held aspartic acid among its building blocks.
