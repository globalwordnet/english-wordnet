senseId: 'twice-pinnate%1:20:00::'
synsetId: 13178244-n
simpleMeaning: Describing a leaf divided twice, with its main branches each bearing smaller leaflets.
scope: Also called bijugate leaf and bijugous leaf, this name is for a feather-like leaf, not for a leaf
  with leaflets in one pair.
examples:
- The twice-pinnate leaf on the page showed leaflets in two pairs.
- You can tell the twice-pinnate leaf by its two pairs of leaflets.
