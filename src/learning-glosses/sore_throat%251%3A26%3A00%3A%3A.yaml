senseId: 'sore_throat%1:26:00::'
synsetId: 14196966-n
simpleMeaning: Heat, swelling, and pain in the tissues where the mouth meets the passage that carries
  food and air down, and in that passage itself.
scope: Also called pharyngitis and raw throat. It is a condition of the mouth.
examples:
- Their throat was so sore that they could hardly swallow.
- They stayed home because their throat hurt too much to talk.
