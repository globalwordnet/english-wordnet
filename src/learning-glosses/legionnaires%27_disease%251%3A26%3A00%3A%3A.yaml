simpleMeaning: Acute, sometimes fatal bacterial pneumonia first recognized after Philadelphia's 1976 American
  Legion convention outbreak. Symptoms include fever, muscle and chest pain, headache, chills, and a dry
  cough.
scope: Not other lung illnesses, nor other fevers with a cough; this is the one first spotted after the
  1976 Legion meeting.
examples:
- Legionnaires' disease causes a dry cough.
- He caught Legionnaires' disease in 1976.
