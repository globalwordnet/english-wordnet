simpleMeaning: Said of a cell that has a middle part holding the matter that tells it how to grow and
  work, or of something found in that middle part.
scope: Also called nucleated. It is an adjective.
examples:
- Under the glass, the nucleate cells showed a clear middle part in each one.
- The nucleate cells in the dish grew and split through the night.
