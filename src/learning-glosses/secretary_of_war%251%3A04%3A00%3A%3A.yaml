simpleMeaning: The former head of the US War Department. In 1947 its functions and those of the Navy Department
  came under the new Secretary of Defense.
scope: The head of a past government office; not the head of the navy and not the head of defence today.
examples:
- The secretary of war met the generals.
- In 1947 the secretary of war's office joined with the navy.
