simpleMeaning: The region of the brain's outer layer that receives sound information from the medial geniculate
  body, a structure deep in the brain.
scope: This is the part of the outer layer of the brain that takes in sound signals from a small deep
  part of the brain; auditory cortex is another name for it, not the part that takes in what the eyes
  see and not the part that moves the body.
examples:
- The auditory area takes in sound signals from deep in the brain.
- Damage to the auditory area can make it hard to make sense of sounds.
