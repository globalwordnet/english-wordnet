simpleMeaning: A Jewish holy day on the 22nd or 23rd of Tishri marking the completion of the annual cycle
  of Torah readings.
scope: Also called Rejoicing in the Law, Rejoicing of the Law, Rejoicing over the Law, Simchas Torah,
  Simchat Torah, Simhat Torah, and Simhath Torah; the Jewish holy day that ends the year's cycle of readings.
examples:
- Shimchath Torah falls on the 22nd or 23rd of Tishri.
- On Shimchath Torah the last reading of the year is finished.
