simpleMeaning: Graphite, a material used to reduce friction between moving parts and to slow neutrons
  in nuclear reactors.
scope: Also called graphite and plumbago, this is a material used to ease movement and to slow nuclear
  reactions, not the metal used in pipes and paint.
examples:
- Black lead keeps the hinge moving smoothly.
- Engineers use black lead in the reactor core.
