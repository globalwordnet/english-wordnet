simpleMeaning: Someone who questions a witness closely, especially about evidence the witness gave earlier.
scope: Cross-examiner is another name for this sense.
examples:
- The cross-questioner pressed the witness about the earlier statement.
- The cross-questioner asked the witness to go over the earlier testimony once more.
