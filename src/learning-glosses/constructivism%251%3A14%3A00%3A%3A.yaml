simpleMeaning: A Russian abstract art movement after World War I whose artists used industrial materials
  to build objects that did not depict recognizable things.
scope: An art movement in Russia after the First World War making plain shapes from factory stuff, not
  art that shows real things and not art made only with paint.
examples:
- Constructivism grew in Russia after the First World War.
- The artist worked in constructivism, building shapes from steel.
