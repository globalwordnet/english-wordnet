simpleMeaning: Music from the 1900s in which luck, or parts left unfixed, are decided by the performer.
scope: Also called aleatory music and chance music.
examples:
- The aleatoric music at the concert left much to the players.
- They played a piece of aleatoric music that sounded different each time.
