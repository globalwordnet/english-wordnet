senseId: 'electrometer%1:06:00::'
synsetId: 03281607-n
simpleMeaning: An instrument that measures voltage differences due to static charge while drawing essentially
  no current from the source.
scope: A meter for gaps in power that takes no power itself, not a meter for flow of power and not a battery
  tester.
examples:
- The electrometer showed a difference in voltage.
- He read the charge with an electrometer.
