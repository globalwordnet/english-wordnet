simpleMeaning: A person who stands up for a policy or an institution, making the case that it is right.
scope: Apologist and justifier are other names for this person, not one who only agrees.
examples:
- The vindicator of the new law spoke at length about why it was needed.
- They hired a vindicator to make the case for the unpopular policy.
