senseId: 'stabilise%2:30:01::'
synsetId: 00271625-v
simpleMeaning: To make a thing steady, to stop it changing all the time, or to set it where it stays level.
scope: Also called stabilize. It is not about holding a thing up with a support.
examples:
- Doctors used the drug to stabilise blood pressure after the operation.
- The new rules helped stabilise prices after the sudden rise.
