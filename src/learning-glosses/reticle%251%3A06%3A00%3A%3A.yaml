senseId: 'reticle%1:06:00::'
synsetId: 04089998-n
simpleMeaning: A pattern of fine lines, dots, crosshairs, or wires at the focal plane of an optical instrument's
  eyepiece.
scope: The markings lie in the plane where the image comes into focus.
examples:
- The reticle in the eyepiece showed a set of fine lines.
- The observer could see the reticle against the image of the star.
