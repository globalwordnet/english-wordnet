simpleMeaning: Sweet risen bread, sliced and baked once more, turns brown, hard and crisp.
scope: Among sweet risen breads, this one is sliced and baked a second time until brown, hard and crisp,
  also called twice-baked bread, zwieback and Brussels biscuit, and not a loaf baked only once.
examples:
- The rusk was brown, hard and crisp.
- A rusk broke with a snap when bitten.
