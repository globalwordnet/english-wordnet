simpleMeaning: A tree from northern India and China with purple flowers and small, inedible yellow fruits.
  It grows wild in the southern US and is cultivated there for shade.
scope: This is a tree of northern India and China with purple blossoms, also called chinaberry, azedarach,
  azederach, chinaberry tree, China tree, Melia azedarach, Melia azederach and pride-of-India, not the
  small shrub that shares its name.
examples:
- Persian lilac grows in northern India and China.
- A Persian lilac gives shade in the southern United States.
