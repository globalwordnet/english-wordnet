simpleMeaning: A claim that a slip or a bad deed was your doing.
scope: It is also called blame, and incrimination is another name for it.
examples:
- The inculpation came from a coworker who said the files had gone missing.
- No one believed the inculpation once the records showed the mistake was someone else's.
