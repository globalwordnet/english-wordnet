simpleMeaning: A laboratory way of separating, with a current passed through the sample, the substances
  that set off the body's defences and the ones the body makes to fight them.
scope: It is a laboratory test.
examples:
- Immunoelectrophoresis showed two clear bands.
- The lab used immunoelectrophoresis to sort the samples.
