simpleMeaning: To instruct an editor or printer to keep material that was marked for deletion or correction.
scope: This word does not mean to cancel a change, but to keep the marked matter as it is.
examples:
- The editor wrote stet beside the crossed-out line.
- They put stet next to the deleted paragraph.
