simpleMeaning: The doing of what was planned or ordered, so that it is finished.
scope: Execution and implementation are other names for this, not for using what one knows rather than
  merely having it.
examples:
- They praised the carrying out of the rescue.
- The carrying out of the order fell to the youngest clerk.
