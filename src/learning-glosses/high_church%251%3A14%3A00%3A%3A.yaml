simpleMeaning: A group within the Anglican Church that emphasizes Catholic traditions, especially the
  sacraments, formal worship, and obedience to church authority.
scope: This is a group in England's national faith also called High Anglican Church, not a group that
  puts weight on the plain Protestant way.
examples:
- The High Church keeps many Catholic rites.
- Members of the High Church follow their bishops closely.
