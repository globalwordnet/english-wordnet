simpleMeaning: Said of a thing linked to the opening in a young embryo that opens into the tube that will
  be its gut.
scope: Also called blastoporal. It is about an opening.
examples:
- The blastoporic opening marks where the gut begins.
- They watched the blastoporic lips close over the opening.
