simpleMeaning: Blood and the fluids the body gives off stay held back when soft tissue draws together.
scope: This sense is also called astringency.
examples:
- The stypsis in the soft tissue slowed the bleeding.
- Without stypsis, fluids would keep leaking from the tissue.
