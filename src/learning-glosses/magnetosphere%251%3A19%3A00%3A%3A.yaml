senseId: 'magnetosphere%1:19:00::'
synsetId: 11497441-n
simpleMeaning: A planet's magnetic field and the region around it where this field influences charged
  particles more strongly than the sun's magnetic field does.
scope: The space round a planet where the planet's own pull rules, rather than the pull of the sun.
examples:
- Tiny charged bits move in the magnetosphere.
- The magnetosphere surrounds the planet.
