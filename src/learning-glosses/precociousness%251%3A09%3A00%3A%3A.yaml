senseId: 'precociousness%1:09:00::'
synsetId: 05628077-n
simpleMeaning: Cleverness that shows up much sooner than the usual course of growing up would lead one
  to expect.
scope: It is also called precocity. It is about the timing of cleverness, not about how clever a person
  is in the end.
examples:
- The precociousness of the young pianist surprised the teachers.
- Teachers noticed the precociousness of the child in the class.
