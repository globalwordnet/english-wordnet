simpleMeaning: An organ just beginning to grow, the base on which its later growth builds.
scope: Also called an anlage. It is an organ, not a full-grown one.
examples:
- The primordium of the leaf appears first as a tiny bump.
- In the embryo, the primordium grows into a full organ.
