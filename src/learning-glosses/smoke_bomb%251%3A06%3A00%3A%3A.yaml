simpleMeaning: A bomb that goes off in a thick cloud, made to hide movements behind it or to mark a place.
scope: People also call this a smoke grenade, and it is not the cloud itself.
examples:
- They set off a smoke bomb to hide the move.
- A smoke bomb marked the place.
