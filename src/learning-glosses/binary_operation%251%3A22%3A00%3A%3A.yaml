simpleMeaning: An operation following the rules of Boolean logic, in which each input and the result can
  take one of two values.
scope: It is another name for binary arithmetic operation and for boolean operation.
examples:
- A binary operation takes in two yes-or-no values and gives back one of the same two.
- The chip does the binary operation and hands back the answer.
