simpleMeaning: An airplane's weight divided by its wingspan, the distance from one wingtip to the other.
scope: It is a number used when talking about how a plane flies.
examples:
- The new plane has a high span loading, so it needs a long runway to take off.
- Engineers check the span loading before they approve a plane for flight.
