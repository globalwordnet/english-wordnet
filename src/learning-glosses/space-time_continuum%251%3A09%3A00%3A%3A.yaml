simpleMeaning: The full set of measures for place and moment, three marking where a thing is and one marking
  when it is, in which physical events sit.
scope: Also called space-time and spacetime. It is a system.
examples:
- The physicist described the space-time continuum as four measures that fix where and when an event is.
- In the space-time continuum, every event has its own place and moment.
