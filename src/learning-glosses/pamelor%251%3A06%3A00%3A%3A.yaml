simpleMeaning: A brand of nortriptyline, a tricyclic antidepressant used with talk therapy for persistent
  depression. It can interact dangerously with other medicines.
scope: This is one named drug for long-lasting low mood, also called nortriptyline; it is taken with talking
  treatment, not instead of it.
examples:
- Pamelor lifted her long-lasting low mood.
- The doctor gave him Pamelor with talking treatment.
