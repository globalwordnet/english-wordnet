simpleMeaning: A common North American deer whose tail is white underneath.
scope: This common North American animal is also called a whitetail, a white tail, a whitetail deer, Odocoileus
  virginianus, and a Virginia deer, and the pale underside at its back sets it apart from other animals
  of North America.
examples:
- A white-tailed deer grazed at the edge of the woods as we drove past.
- The white-tailed deer raised its tail, showing the pale underside.
