senseId: 'mass_deficiency%1:19:00::'
synsetId: 11502224-n
simpleMeaning: The difference between the combined masses of the separate particles in an atomic nucleus
  and the smaller mass of the nucleus itself.
scope: How much less the core of an atom weighs than its parts weighed together; mass defect is another
  name for this sense, not the weight of the whole atom and not the energy given out when the core forms.
examples:
- The mass deficiency of the nucleus is small but real.
- Physicists measure the mass deficiency to find the binding energy.
