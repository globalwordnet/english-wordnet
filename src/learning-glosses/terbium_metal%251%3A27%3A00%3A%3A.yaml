simpleMeaning: A group of related rare-earth elements including terbium, europium, gadolinium, and sometimes
  dysprosium.
scope: A group of related elements, not one element alone and not another group of elements.
examples:
- Terbium metal belongs to a small group of related metals.
- The terbium metal group also holds europium and gadolinium.
