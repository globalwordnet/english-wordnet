simpleMeaning: A compound with a ring of different kinds of atoms, in which a metal ion forms coordinate
  bonds with at least two nonmetal ions.
scope: 'Also called chelate compound: a ring-shaped chemical holding a metal bit by bonds, not a metal
  bit left free on its own.'
examples:
- The chelate held the metal bit fast.
- The chelate held the metal bit with bonds to two other bits.
