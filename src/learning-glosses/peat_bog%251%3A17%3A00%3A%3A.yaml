simpleMeaning: Wet, springy ground made of decaying plants. It drains more slowly than a swamp. The ground
  is unsuitable for farming, but the peat can be cut and dried for fuel.
scope: This sense is also called bog, for wet, springy ground of rotting green stuff, that drains worse
  than swamp ground, its soil unfit for farming but sliced and dried to burn.
examples:
- Peat bogs drain badly.
- Peat bog burns when dried.
