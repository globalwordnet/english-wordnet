simpleMeaning: An antibiotic taken by mouth for bacterial infections. This semisynthetic penicillin is
  sold as Amoxil, Larotid, Polymox and Trimox. Augmentin combines it with clavulanate.
scope: Amoxicillin is the oral penicillin antibiotic in this sense. Augmentin contains it together with
  clavulanate.
examples:
- Amoxicillin treats bacterial infections.
- The doctor gave amoxicillin.
