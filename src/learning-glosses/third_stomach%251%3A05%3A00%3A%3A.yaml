simpleMeaning: One part of the food bag of a ruminant, a cud-chewing animal, the part after the first
  two parts.
scope: Also called the omasum or the psalterium. It is not the whole food bag.
examples:
- Food passes through the third stomach on its way through the gut.
- The vet checked the third stomach of the cow.
