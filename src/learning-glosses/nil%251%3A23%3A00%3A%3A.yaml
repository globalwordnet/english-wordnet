simpleMeaning: A quantity of zero; nothing at all, no single thing, not anything.
scope: Nil names a quantity of zero. In a score, two goals to nil means the other side scored zero goals.
examples:
- The score was nil for both teams after the first half.
- His chances of help were nil, so he did the work alone.
