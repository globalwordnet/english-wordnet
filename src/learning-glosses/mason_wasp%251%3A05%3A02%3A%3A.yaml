simpleMeaning: A solitary wasp that builds a nest of mud or clay for its young. The nest hardens as it
  dries.
scope: This kind of lone insect builds for its young, using mud or clay that has gone hard.
examples:
- A mason wasp built a nest of hard mud.
- The mason wasp made its nest of clay for its young.
