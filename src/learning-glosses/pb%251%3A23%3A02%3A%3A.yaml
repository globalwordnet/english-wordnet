simpleMeaning: A petabit, a unit of information equal to 1,000 terabits or one quadrillion bits.
scope: A unit of information of 1000 terabits, also called a petabit and Pbit, and not the byte units,
  which are rival senses.
examples:
- The link moves data at 2 Pb per second.
- One Pb equals 1000 terabits.
