simpleMeaning: A gray metal with a valence of four, chemically similar to zirconium and found in its minerals.
  It releases electrons easily and is used in filaments.
scope: Also called atomic number 72 and Hf; a grey metal like zirconium, not zirconium itself.
examples:
- Hafnium is used in filaments.
- The alloy contained hafnium.
