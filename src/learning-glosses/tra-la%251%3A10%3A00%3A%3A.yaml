simpleMeaning: People hum these sounds, which mean nothing, as the repeated part of a song.
scope: Also called tra-la-la, these are sounds hummed in a song, not words with sense in them.
examples:
- They hummed tra-la in place of the words of the song.
- They filled the refrain with tra-la as they hummed along.
