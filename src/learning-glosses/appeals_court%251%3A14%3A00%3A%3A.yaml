simpleMeaning: A body of judges with the power to look again at decisions made by lower judges or by government
  offices.
scope: Also called appellate court and court of appeals, this one is not where a case is heard for the
  first time.
examples:
- The appeals court agreed to look at the case again after the lower ruling.
- A lawyer asked the appeals court to set aside the first decision.
