simpleMeaning: A form of leishmaniasis, a parasitic disease, that affects internal organs such as the
  spleen and liver.
scope: A disease harming the inner organs, not the skin form of the same disease and not other diseases
  of the inner organs.
examples:
- The doctor diagnosed visceral leishmaniasis after weeks of fever.
- Visceral leishmaniasis affects the inner organs.
