senseId: 'suck_in%2:43:00::'
synsetId: 02771650-v
simpleMeaning: A force no one can resist, a temptation, or other means of that kind pull people or things
  close.
scope: This sense is also called suck.
examples:
- The current boom in the economy sucked many workers in from abroad.
- The promise of easy money sucked in many people.
