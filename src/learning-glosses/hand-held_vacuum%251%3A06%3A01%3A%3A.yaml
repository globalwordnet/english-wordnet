simpleMeaning: A lightweight cleaner held in one hand that sucks up small spills and runs on rechargeable
  batteries or power from a wall socket.
scope: Also called hand-held vacuum cleaner, handheld vacuum and handheld vacuum cleaner, this is a light
  machine for small spills, not a big machine for whole rooms.
examples:
- I keep a hand-held vacuum in the car for crumbs.
- She used the hand-held vacuum on the spilled rice.
