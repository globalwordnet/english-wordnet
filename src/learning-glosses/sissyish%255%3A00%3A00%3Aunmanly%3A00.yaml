simpleMeaning: An insulting way to describe a boy or man whose behavior someone considers too feminine.
scope: Also called sissy, emasculate, effeminate, epicene, cissy, and sissified. It is an adjective.
examples:
- The coach called the player sissyish for crying.
- They used sissyish as a taunt in the locker room.
