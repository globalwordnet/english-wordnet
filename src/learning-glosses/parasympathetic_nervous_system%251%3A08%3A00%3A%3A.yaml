senseId: 'parasympathetic_nervous_system%1:08:00::'
synsetId: 05513330-n
simpleMeaning: A nerve network from the brainstem and lower spinal cord that counters sympathetic effects
  by increasing digestive secretions, slowing the heart, narrowing the pupils, and widening certain blood
  vessels.
scope: This division helps regulate digestion, the heart, and other organs.
examples:
- The parasympathetic nervous system calms the body once danger has passed.
- Damage to the parasympathetic nervous system can leave digestion sluggish.
