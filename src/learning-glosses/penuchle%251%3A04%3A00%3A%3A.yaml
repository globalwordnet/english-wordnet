simpleMeaning: A card game played with a 48-card deck containing two copies of each of the six highest
  cards in every suit. Play is similar to whist.
scope: Also called pinochle, bezique, and pinocle. It is a card game.
examples:
- They played penuchle with forty-eight cards on Friday night.
- We learned penuchle from our neighbours and played it all evening.
