senseId: 'wipe_out%2:30:02::'
synsetId: 00479761-v
simpleMeaning: Things written down disappear for good when someone crosses them through to be cut or rubs
  them away until nothing is left.
scope: This verb is also called kill and obliterate, and it acts on lines of writing, not on living things.
examples:
- The editor asked them to wipe out the last two lines of the speech.
- They wiped out the old notes from the board before the next class.
