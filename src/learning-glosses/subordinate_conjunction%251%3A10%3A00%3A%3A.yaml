senseId: 'subordinate_conjunction%1:10:00::'
synsetId: 06337219-n
simpleMeaning: A word such as “because” or “although” that introduces a dependent clause and connects
  it to a main clause.
scope: This sense is also called subordinating conjunction.
examples:
- They used a subordinate conjunction to join the two clauses.
- In 'They left after the rain stopped', after is a subordinate conjunction.
