simpleMeaning: In this source, the point where a floating object's weight balances. In naval architecture,
  the term means the center of the area enclosed by its waterline.
scope: Center of flotation is another name for this.
examples:
- The centre of flotation of the raft was near its middle.
- When the cargo shifted, the centre of flotation moved too.
