simpleMeaning: One gram of a substance needs this much warmth to rise by one degree on the centigrade
  scale.
scope: It is measured for one gram at a time, not for a whole lump.
examples:
- Water has a high specific heat, so it warms up slowly.
- They worked out the specific heat of the sample.
