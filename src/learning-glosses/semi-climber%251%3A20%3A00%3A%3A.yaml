simpleMeaning: A plant that tends to climb and can sometimes grow like a vine.
scope: This names a plant that mostly climbs and at times grows like a vine, not one that always climbs.
examples:
- The semi-climber wound its way upward.
- The semi-climber grew like a vine at times.
