simpleMeaning: A painful, recurring headache associated with the release of a substance called histamine
  from cells.
scope: A pain in the head that keeps coming back, also called a cluster headache; not a single pain in
  the head from a cold.
examples:
- Her histamine headache came back every night for a week.
- The histamine headache struck again the next morning.
