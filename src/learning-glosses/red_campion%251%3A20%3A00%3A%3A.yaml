simpleMeaning: A European flowering plant that lives for two years and bears red or pink flowers. It is
  sometimes classified in the genus Lychnis.
scope: Also called red bird's eye, this is a European plant with rose-tinted or pink blooms that lives
  for two years.
examples:
- In its second year, red campion blooms.
- Pink blooms opened on the red campion.
