simpleMeaning: The work of using chemistry, the study of what things are made of, to solve problems in
  the real world.
scope: This one is about work that uses chemistry, not the field that designs, builds and runs plants
  for making things by chemistry.
examples:
- A course in chemical engineering teaches students how to build plants that make medicines.
- The town's drinking water was cleaned with help from chemical engineering.
