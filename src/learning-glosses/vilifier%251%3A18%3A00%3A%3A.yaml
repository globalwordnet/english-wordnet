senseId: 'vilifier%1:18:00::'
synsetId: 10018655-n
simpleMeaning: Someone who harms a person's good name with lies, spoken or written.
scope: Also called backbiter, defamer, libeler, maligner, slanderer, and traducer. It is a person, not
  the lies themselves.
examples:
- The vilifier spread lies about the mayor for months.
- No one trusted the vilifier after the truth came out.
