simpleMeaning: A brand of ibuprofen, a nonsteroidal medicine also sold as Advil and Motrin. It reduces
  inflammation, relieves arthritis pain, and lowers fever.
scope: This is a pain-easing drug that cuts swelling; ibuprofen, isobutylphenyl propionic acid, Advil
  and Motrin are other names for it, not a steroid drug.
examples:
- She took Nuprin for her sore knee.
- Nuprin brought his fever down.
