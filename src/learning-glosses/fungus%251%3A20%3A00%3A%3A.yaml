simpleMeaning: An organism without chlorophyll that feeds on organic matter. Fungi include single cells,
  many-celled forms, and networks that produce spores.
scope: Mushrooms, molds, and yeasts are examples of fungi.
examples:
- This fungus feeds on dead leaves and other organic matter.
- Some fungi are single cells too small to see without a microscope.
