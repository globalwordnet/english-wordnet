simpleMeaning: Retinol, a form of vitamin A found in marine fish liver oils. It is an alcohol with double
  bonds that living organisms can make from carotene.
scope: Also called retinol; a kind of alcohol with open bonds from sea fish-liver oils, made in living
  things from carotene.
examples:
- Vitamin A1 occurs in fish-liver oil.
- The body makes vitamin A1 from carotene.
