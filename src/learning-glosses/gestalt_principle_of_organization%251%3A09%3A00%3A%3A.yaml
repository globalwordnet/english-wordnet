simpleMeaning: A principle of Gestalt psychology explaining what makes us perceive separate elements as
  a group or pattern.
scope: 'Also called Gestalt law of organization: a rule of Gestalt psychology about the factors that make
  what is seen take on set grouped forms.'
examples:
- The Gestalt principle of organization explains why we see rows as groups.
- Under the Gestalt principle of organization, near dots look like one shape.
