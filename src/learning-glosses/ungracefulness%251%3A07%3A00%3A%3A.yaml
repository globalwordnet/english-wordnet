senseId: 'ungracefulness%1:07:00::'
synsetId: 05011697-n
simpleMeaning: A person's way of standing, looking, moving, and showing feelings is stiff and awkward,
  and others find it unpleasant.
scope: Also called gracelessness, this name is for a lack of grace in a person.
examples:
- They noticed the ungracefulness in the way they crossed the room.
- The ungracefulness of their walk made people turn away.
