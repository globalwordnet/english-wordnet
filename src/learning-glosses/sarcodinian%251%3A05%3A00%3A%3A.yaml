simpleMeaning: Like false feet, short parts of the body stretch out so these tiny one-celled creatures
  can move and catch food.
scope: This sense is about one-celled creatures that stretch out short parts of their bodies to move and
  catch food, also called sarcodine.
examples:
- A sarcodinian moved across the water by stretching out a false foot.
- The sarcodinian caught its food with a short push-out of its body.
