simpleMeaning: In a way that keeps the parts of one thing in the same relation to the parts of another.
scope: It is an adverb.
examples:
- The height of this wall must be reduced proportionately to give the room pleasant dimensions.
- They cut each piece proportionately so the model kept the shape of the real bridge.
