simpleMeaning: Someone who spoils a thing, making it poorer in quality, character, or worth, for example
  by putting cheaper metal in coins.
scope: This one is also called a degrader.
examples:
- A debaser mixed cheap metal into the coins.
- Everyone blamed the debaser for the poor coins.
