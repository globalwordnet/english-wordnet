senseId: 'vasopressor%1:06:00::'
synsetId: 04530496-n
simpleMeaning: By narrowing the tubes that carry blood, this thing makes the blood push harder, most often
  in the tubes that carry blood from the heart.
scope: This word names an agent, not one that lets the blood's force drop.
examples:
- The doctor gave the patient a vasopressor to lift the blood pressure after the operation.
- They added a vasopressor to the drip when the patient's blood pressure kept falling.
