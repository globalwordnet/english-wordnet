senseId: 'solarise%2:39:00::'
synsetId: 02117029-v
simpleMeaning: To set a thing in the path of the sun's rays, letting them work on it.
scope: Sun, solarize and insolate are other names for this act, not the photographic sense that turns
  the tones of a print back.
examples:
- The paper may solarise until it turns yellow and crumbles.
- These herbs suffer when solarised.
