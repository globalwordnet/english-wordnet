senseId: 'teleconferencing%1:10:00::'
synsetId: 07160666-n
simpleMeaning: A meeting of people in different places, held with the help of equipment that lets them
  hear and see each other, such as a video link between rooms.
scope: Also called a teleconference. It is not a meeting in one room.
examples:
- They used teleconferencing to bring the far-flung offices together.
- The teleconferencing session joined teams in three cities.
