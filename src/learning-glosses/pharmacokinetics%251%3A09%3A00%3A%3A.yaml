simpleMeaning: The study of what happens to a drug in the body, including how the body gets rid of it,
  how quickly this happens and how long its effects last.
scope: It is a branch of knowledge.
examples:
- Pharmacokinetics shows how fast a drug leaves the body.
- The class in pharmacokinetics covered how long each drug keeps working.
