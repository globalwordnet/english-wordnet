simpleMeaning: A slow-moving African primate with grey-brown fur that lives in trees and is active at
  night.
scope: In this sense, potto refers to the western potto, Perodicticus potto, a member of the loris family.
examples:
- The potto's grey-brown fur was hard to see in the dim light.
- At the zoo, the potto slept curled up all day.
