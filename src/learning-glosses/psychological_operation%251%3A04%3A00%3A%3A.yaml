simpleMeaning: Steps taken by an army to change what people, groups, and the governments of other lands
  think and feel.
scope: Also called psyop. It is an act.
examples:
- The general ordered a psychological operation to turn the town's people against the old rulers.
- They ran a psychological operation that spread true news about the army's plans.
