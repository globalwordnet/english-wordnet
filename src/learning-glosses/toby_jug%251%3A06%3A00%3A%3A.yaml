simpleMeaning: A mug for drinking, shaped like a heavy man in a hat with three corners.
scope: This is also called a toby and a toby fillpot jug, and it is not a plain cup.
examples:
- They poured their drink into the toby jug shaped like a heavy man in a hat.
- They drank from the toby jug shaped like a stout man in a three-cornered hat.
