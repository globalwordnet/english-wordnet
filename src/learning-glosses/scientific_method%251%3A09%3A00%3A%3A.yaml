simpleMeaning: A set way of looking closely at things and forming ideas about them, used to check whether
  guesses about the world around us are right.
scope: It is the way the work is done, not the work itself.
examples:
- The class learned the scientific method by testing which soil helps seeds grow best.
- They used the scientific method to check whether plants grow faster in sunlight.
