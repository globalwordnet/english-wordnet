simpleMeaning: Said of two areas that sit next to each other, touching along a line they share.
scope: This one is also called adjacent, conterminous, neighboring, and neighbouring.
examples:
- Utah and the contiguous state of Idaho share a common border.
- The two farms are contiguous, sharing one long fence.
