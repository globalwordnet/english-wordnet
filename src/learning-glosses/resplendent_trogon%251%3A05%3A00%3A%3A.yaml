simpleMeaning: One of the rarest birds of Central America, a bird almost no one ever sees, and Guatemala's
  own emblem bird.
scope: Also called resplendent quetzal and Pharomacrus mocino, this is Guatemala's emblem bird, one of
  the rarest birds of Central America, not a bird people often see.
examples:
- The resplendent trogon is a bird few people ever see in the wild.
- The resplendent trogon stands for Guatemala as its national bird.
