simpleMeaning: A stout amphibian with no tail and long hind legs for jumping. Some species divide their
  time between water and land, while others live on land.
scope: An animal with no tail, a thick body, and long back legs for jumping, that lives both in water
  and on land, not a pretty loop of cord on clothes.
examples:
- A frog jumped from the bank into the pond.
- We saw a frog sitting on a wet stone by the river.
