simpleMeaning: A shrub or a low woody plant that grows in southern Florida, in Central America, and in
  South America.
scope: Bay-leaved caper and Capparis flexuosa are other names for this shrub, not the one that grows only
  as far as the West Indies.
examples:
- They saw a caper tree in a garden in Central America.
- A caper tree grew beside the house in South America.
