simpleMeaning: A tapping sound, made by a horse's feet on hard ground.
scope: This one is also called clip-clop, clop, clopping, clumping, and clunking.
examples:
- The clippety-clop rang out as the cart horse passed the house.
- We listened to the clippety-clop of the horse's feet on the stones.
