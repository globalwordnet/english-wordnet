simpleMeaning: A small shorebird resembling a sandpiper, with lobes along its toes that help it swim well.
  It breeds in the Arctic and spends the winter in the tropics.
scope: This sandpiper-like shorebird has flap-toed feet and a gift for swimming, and it breeds in the
  far north and winters in the tropics.
examples:
- We saw a phalarope swimming near the shore.
- Phalaropes breed in the Arctic and spend the winter in the tropics.
