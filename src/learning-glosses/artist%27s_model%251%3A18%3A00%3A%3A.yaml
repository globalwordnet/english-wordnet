simpleMeaning: A person who holds a still pose while a painter or a maker of statues makes a likeness
  of them.
scope: Also called a sitter, this one is the person shown in the work, not the person who makes the work.
examples:
- The artist's model sat still while the painter worked on the portrait.
- They asked them to be the artist's model for the new statue.
