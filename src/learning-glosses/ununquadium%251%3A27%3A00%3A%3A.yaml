simpleMeaning: A former temporary name for flerovium, the radioactive element with atomic number 114,
  higher than uranium's.
scope: A heavy element past uranium that gives off rays, with the number one hundred and fourteen, also
  called atomic number 114, element 114, and Uuq.
examples:
- Ununquadium has the atomic number 114.
- Ununquadium was made by scientists.
