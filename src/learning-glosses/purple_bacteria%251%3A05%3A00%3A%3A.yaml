simpleMeaning: Free-living bacteria that range from pink to purplish brown, contain a pigment that absorbs
  light, and are Gram-negative.
scope: These bacteria contain bacteriochlorophyll. Gram-negative bacteria appear pink in a standard Gram
  stain.
examples:
- The pond sample contained purple bacteria.
- Purple bacteria use pigments to absorb light.
