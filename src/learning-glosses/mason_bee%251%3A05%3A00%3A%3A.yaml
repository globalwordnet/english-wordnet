simpleMeaning: Any of several kinds of solitary bee that build nests from mud and sand that harden into
  walls.
scope: Lone nest-makers of this kind use mud and sand that has gone hard, and there are many kinds of
  them.
examples:
- A mason bee built its nest of mud and sand.
- Mason bees live alone, each in a nest of its own.
