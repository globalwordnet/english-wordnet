senseId: 'pledgee%1:18:00::'
synsetId: 10461108-n
simpleMeaning: A person to whom a promise is made, or a person with whom something is left as security
  for a promise.
scope: It is a person, not the one who makes the promise.
examples:
- The pledgee held the deposit until the promise was kept.
- The promise was made to the pledgee in writing.
