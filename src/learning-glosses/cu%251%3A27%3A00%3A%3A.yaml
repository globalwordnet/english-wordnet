simpleMeaning: Copper, a reddish-brown metal easily shaped or drawn into wire. It resists corrosion, weakly
  repels magnets, occurs in minerals and large natural masses, and conducts electricity and heat.
scope: Not iron or tin or other metals; also called copper and atomic number 29.
examples:
- Cu wires carry power into the house.
- The roof was made of Cu that had turned green.
