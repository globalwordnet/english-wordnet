simpleMeaning: Using the notes of a standard major or minor scale, arranged in five whole steps and two
  half steps within an octave.
scope: Of music built on the usual major or minor scales, with no shift by accidentals.
examples:
- Their tune was diatonic in feel.
- The scale was diatonic by form.
