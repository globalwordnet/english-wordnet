simpleMeaning: This fault keeps the brain from growing as it should, so its two halves end up small or
  gone.
scope: Anencephalia is another name for this one, a brain fault, not a fault elsewhere in the body.
examples:
- The anencephaly was clear on the scan, with the brain's two halves missing.
- The baby's anencephaly left it with only a small part of a brain.
