senseId: 'secondary_coil%1:06:00::'
synsetId: 04171063-n
simpleMeaning: A coil in which a changing current in a primary coil induces a voltage that can drive a
  current.
scope: Secondary and the secondary winding are other names for this wound length of wire, which takes
  power from a first loop and not the other way round.
examples:
- The secondary coil picked up power from the primary coil.
- Power flowed in the secondary coil only when the first loop was switched on.
