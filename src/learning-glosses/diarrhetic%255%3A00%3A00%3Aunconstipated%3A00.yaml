simpleMeaning: To do with the passing of loose, watery waste from the gut.
scope: Also called diarrheal, diarrheic, diarrhoeal, diarrhoeic, and diarrhoetic. It is a describing word.
examples:
- The diarrhetic condition lasted two days.
- They took diarrhetic pills after the bad meal.
