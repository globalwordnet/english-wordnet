simpleMeaning: Tiny particles of inorganic material, such as minerals, suspended in water in lakes or
  seas.
scope: This is dead matter floating in water; not living things in water and not dirt on the bottom.
examples:
- The tripton in the lake made the water look cloudy.
- Fine tripton drifted through the sea water.
