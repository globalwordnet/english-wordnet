simpleMeaning: Magnesium, a light, silvery-white, ductile metal with a valence of two. Pure magnesium
  burns bright white. In nature it occurs only in compounds, including magnesite and dolomite.
scope: This metal is also called magnesium and atomic number 12; it is not calcium and not another light
  metal.
examples:
- Mg burns with a bright white flame.
- The alloy contained Mg and aluminium.
