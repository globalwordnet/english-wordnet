simpleMeaning: A squint with the look turned in toward the nose, on one side or on both sides.
scope: Also called convergent strabismus, crossed eye or esotropia, this one is about a squint.
examples:
- The child had a cross-eye that made one eye turn in.
- Their cross-eye turned one eye in toward the nose.
