simpleMeaning: A heart condition in which the mitral valve bulges into the left atrium, sometimes allowing
  blood to leak backward from the left ventricle.
scope: This heart sickness comes from the flap between the two left rooms failing to control the flow
  of blood between them.
examples:
- He lives with mitral valve prolapse.
- The scan showed mitral valve prolapse.
