senseId: 'anathematization%1:04:00::'
synsetId: 00207449-n
simpleMeaning: In a formal act, a person or a thing is declared cursed.
scope: Also called anathematisation, this curse is spoken aloud, not kept as a private wish of harm.
examples:
- The anathematization of the old monk was read out before the whole church.
- After the long quarrel, they feared an anathematization would follow.
