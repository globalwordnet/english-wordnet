senseId: 'comprehendible%3:00:00::'
synsetId: 00535112-a
simpleMeaning: Said of a thing that a person can take in and make sense of.
scope: Comprehensible is another name for this sense, and it does not mean a thing that no one can follow.
examples:
- The new guide makes the rules comprehendible to everyone who reads it.
- The clear, comprehendible account of the accident helped the police see what had happened.
