simpleMeaning: Said of a place where living things lean on each other to live.
scope: This one is also called ecological; it is not about the study of living things.
examples:
- The ecologic links between the plants and the birds kept the valley alive.
- The ecologic web of the marsh held together plants, birds, and fish.
