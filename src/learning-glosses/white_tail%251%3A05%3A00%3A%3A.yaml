simpleMeaning: This common deer of North America shows a pale underside on the long thin part at its back.
scope: This deer is also called whitetail, white-tailed deer, whitetail deer, Odocoileus virginianus,
  and Virginia deer.
examples:
- A white tail bounded across the field and showed the pale underside of its tail.
- Hunters often spot a white tail by the pale flash at its rear.
