simpleMeaning: One of the two blood vessels that drain the voice box.
scope: Also called laryngeal vein. It is a blood vessel, not an artery.
examples:
- The surgeon worked near the vena laryngea during the operation on the voice box.
- The vena laryngea was tied off to stop the bleeding in the throat.
