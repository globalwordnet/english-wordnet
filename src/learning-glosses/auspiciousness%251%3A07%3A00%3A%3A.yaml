simpleMeaning: How strongly something points to a good end.
scope: Also called propitiousness, this one names a quality, not the result it points to.
examples:
- The auspiciousness of the clear morning sky cheered the whole town.
- Everyone noted the auspiciousness of the first day's good sales.
