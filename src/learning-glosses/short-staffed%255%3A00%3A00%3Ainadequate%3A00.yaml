simpleMeaning: Used of a workplace that lacks some of the workers or helpers it needs.
scope: Also called understaffed, undermanned, and short-handed. It is an adjective.
examples:
- The hospital ward was short-staffed on the night shift.
- They closed one desk because the office was short-staffed.
