simpleMeaning: Surgery through an open chest to repair the heart, sometimes using a heart-lung machine
  while the heart is stopped.
scope: Open-heart surgery includes operations on valves and coronary arteries.
examples:
- Her open-heart surgery involved a heart-lung machine while the surgeon repaired a valve.
- The baby recovered well after open-heart surgery.
