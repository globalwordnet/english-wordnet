simpleMeaning: A film made by photographing a series of drawings and projecting them rapidly in sequence
  so they appear to move.
scope: This is a moving film made from drawings, not a single funny drawing in a newspaper or magazine
  and not the act of drawing.
examples:
- The children watched a cartoon about a talking cat.
- This cartoon was made from thousands of drawings shown in order.
