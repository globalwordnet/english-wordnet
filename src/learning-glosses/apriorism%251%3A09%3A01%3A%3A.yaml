simpleMeaning: Belief in reasoning from principles independent of experience, especially the view that
  knowledge rests on principles reason finds self-evident or that experience already assumes.
scope: 'Of knowing: trust in first principles, or the teaching that knowing stands on rules clear to reason
  or taken as given by life.'
examples:
- Apriorism trusts first principles.
- An apriorism rests on first rules.
