simpleMeaning: A tall grass with cattail-like spikes, grown for grain in Africa and Asia and mainly for
  animal feed in the United States. It is sometimes used to make beer.
scope: 'Also called bulrush millet and pearl millet: a tall grain grass, not a grass grown only for lawns
  and not a wild grass with no use.'
examples:
- Cattail millet grows tall in the fields of Africa.
- Farmers cut cattail millet for animal feed.
