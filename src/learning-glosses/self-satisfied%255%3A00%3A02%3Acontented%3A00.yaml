synsetId: 00592141-s
simpleMeaning: A person so at ease with what they have done that they see no fault in it.
scope: Also called smug, this names a person marked by too much complacency, unlike the other sense of
  the same word, which is about being pleased with one's own deeds to a fault.
examples:
- A self-satisfied smile stayed on their face.
- There was a self-satisfied glow about them.
