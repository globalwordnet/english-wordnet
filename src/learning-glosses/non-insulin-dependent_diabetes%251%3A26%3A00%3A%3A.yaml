simpleMeaning: An older name for type 2 diabetes, which often develops gradually. Excess weight can raise
  the risk. Treatment may include diet changes, medicines or insulin.
scope: Non-insulin-dependent diabetes is an older name for type 2 diabetes.
examples:
- Her non-insulin-dependent diabetes is managed with tablets and a careful diet.
- An older chart calls his type 2 diabetes ‘non-insulin-dependent diabetes.’
