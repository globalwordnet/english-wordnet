senseId: 'spondee%1:10:00::'
synsetId: 07110441-n
simpleMeaning: Two beats in a row in a line of verse, both of them strong.
scope: In poetry, this names a pair of beats that are both strong, not a pair that mixes a strong beat
  with a weak one.
examples:
- The spondee falls in the middle of the line.
- The second half of the line is a spondee.
