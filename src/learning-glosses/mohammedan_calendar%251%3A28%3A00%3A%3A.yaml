simpleMeaning: An older name for the Islamic lunar calendar, dating from Muhammad's migration in 622 CE.
  Its new year moves through the seasons in roughly 32 solar years.
scope: 'Also called Islamic calendar, Moslem calendar, Muhammadan calendar and Muslim calendar: a moon
  count for followers of Islam, from 622 AD, the year of the Hegira, whose year start moves back through
  the sun year, not a sun count.'
examples:
- The Mohammedan calendar counts its years from 622 AD.
- Under the Mohammedan calendar, the new year moves back through the seasons.
