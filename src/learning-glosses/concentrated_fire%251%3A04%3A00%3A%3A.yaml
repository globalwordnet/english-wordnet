simpleMeaning: Shots from two or more guns all aimed at one place or one thing, as from several warships
  at once.
scope: Massed fire is another name for this.
examples:
- The concentrated fire from the hills kept the soldiers pinned down.
- The concentrated fire on the bridge stopped the advance.
