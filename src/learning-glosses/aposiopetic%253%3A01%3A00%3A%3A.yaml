simpleMeaning: Said of speech or writing that breaks off in the middle of a sentence, leaving it unfinished.
scope: This is not about a sentence that runs on to its end.
examples:
- The speaker's aposiopetic pause left the threat hanging in the air.
- The aposiopetic dash in the letter showed where the writer had stopped short.
