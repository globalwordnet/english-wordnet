simpleMeaning: The monthly or yearly rate of change in prices, measured using a price index.
scope: Also called the inflation rate, this figure says how prices have moved over a month or a year.
examples:
- The rate of inflation was higher this year than last year.
- A low rate of inflation means prices barely move.
