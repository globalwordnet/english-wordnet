simpleMeaning: Simple organisms that mostly live in water and contain chlorophyll. Their cells have nuclei,
  and they lack true stems, roots, and leaves.
scope: Simple water-living things that make food from sunlight, with no real stems, roots or leaves; not
  a land plant, and not a fungus.
examples:
- Algae turned the pond water green.
- The rocks were covered in slippery algae.
