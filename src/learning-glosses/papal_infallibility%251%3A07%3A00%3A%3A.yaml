simpleMeaning: The Roman Catholic belief that God protects the pope from error when, as head of the Church,
  he definitively teaches the whole Church about faith or morals.
scope: Catholics call this speaking ex cathedra.
examples:
- The theologian explained the conditions for papal infallibility.
- The council discussed papal infallibility in definitive teachings on faith and morals.
