simpleMeaning: A disorder of the feelings that wears a person out so they cannot do their job.
scope: Also called nervous exhaustion. It is a trouble of the feelings, not ordinary tiredness.
examples:
- Nervous prostration kept them from their job for a month.
- After the long trial, they sank into nervous prostration.
