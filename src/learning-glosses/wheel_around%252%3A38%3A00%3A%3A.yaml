simpleMeaning: To turn and go the other way, as if turning on one fixed point.
scope: Also called wheel. It is a turn, not the moving of another person or thing.
examples:
- The riders wheeled around and rode back the way they had come.
- The soldiers wheeled around to face the sound behind them.
