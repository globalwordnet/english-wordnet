simpleMeaning: A vehicle headlamp that lights the road ahead and to the sides without dazzling others,
  for use when other vehicles are ahead.
scope: The term names the lamp that produces the dipped beam.
examples:
- The mechanic replaced the cracked low beam headlamp on the driver's side.
- Switch to your low beam headlamps when a car comes toward you.
