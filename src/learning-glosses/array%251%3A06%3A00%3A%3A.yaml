simpleMeaning: A set of antennas spaced so they transmit or receive radio signals more effectively in
  particular directions.
scope: A set of rods that send or take in radio waves in the wanted directions, not a line of things set
  out in order.
examples:
- The array of aerials stood on the hill.
- The radio array picked up signals from far away.
