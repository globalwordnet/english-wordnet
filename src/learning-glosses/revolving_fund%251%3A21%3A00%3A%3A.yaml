senseId: 'revolving_fund%1:21:00::'
synsetId: 13380436-n
simpleMeaning: 'A sum of money meant to keep going round: lent or spent, paid back in, and then lent or
  spent again.'
scope: This is money meant to keep going round, lent or spent and then paid back in, not money given once
  and gone.
examples:
- Borrowers paid back into the revolving fund so others could use it.
- The revolving fund lent money out and took it back in for the next loan.
