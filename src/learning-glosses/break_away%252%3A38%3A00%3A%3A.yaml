senseId: 'break_away%2:38:00::'
synsetId: 02079296-v
simpleMeaning: To flee by turning and running away quickly.
scope: This one names the same act as run, escape, and bunk, and it is also called lam, scat, scarper,
  fly the coop, head for the hills, hightail it, run away, take to the woods, and turn tail.
examples:
- They broke away from the crowd and ran for the gate.
- When the alarm sounded, the thieves broke away into the night.
