simpleMeaning: Swelling and soreness affect the tough cord that joins muscle to bone and the cover that
  wraps round it.
scope: This is also called tendonous synovitis or tenosynovitis.
examples:
- Soreness in the cord and its cover came from tendosynovitis.
- The cover round the cord was swollen with tendosynovitis.
