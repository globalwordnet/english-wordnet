senseId: 'signalise%2:32:01::'
synsetId: 01041202-v
simpleMeaning: To let others know what you mean by a look, a gesture, or a movement, without a sound.
scope: This is also called sign, signal, or signalize, and it is not the work of putting up lights to
  guide road traffic.
examples:
- A guest signalised disapproval with a dismissive hand gesture.
- The diner signalised the waiters to bring the menu.
