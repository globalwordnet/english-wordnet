senseId: 'demagnetise%2:32:00::'
synsetId: 01000807-v
simpleMeaning: To wipe clean a thing that stores information with magnetism, so nothing is left on it.
scope: This one is also called demagnetize, and it is not about taking the pull out of a thing.
examples:
- The clerk had to demagnetise the old tapes before throwing them away.
- They demagnetised the disk so no one could read what was on it.
