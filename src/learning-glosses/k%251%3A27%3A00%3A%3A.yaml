simpleMeaning: Potassium, a light, soft, silver-white alkali metal, oxidizes rapidly in air and reacts
  violently with water. Its compounds are abundant in seawater and minerals including carnallite, kainite,
  and sylvite.
scope: A soft light metal that burns in air and bursts in water, also called potassium and atomic number
  19; not the unit of temperature, and not the letter.
examples:
- The symbol K stands for potassium.
- Potassium is the metal with the sign K.
