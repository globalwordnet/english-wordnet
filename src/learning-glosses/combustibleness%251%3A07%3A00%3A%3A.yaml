simpleMeaning: The ease with which something takes fire and goes on burning.
scope: Burnability and combustibility are other names for this; this one is not about how hard a thing
  is to burn.
examples:
- The combustibleness of the fabric worried the safety inspector.
- They measured the combustibleness of the new foam before using it in seats.
