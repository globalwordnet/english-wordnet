simpleMeaning: A shrubby tree widespread on tropical coasts. Its light, tough wood supports canoe outriggers,
  and its fibre makes rope and seals gaps. People often grow it for decoration.
scope: This sense is the shrubby tree of tropical coasts, grown for ornament and cut for light wood and
  fiber; mahagua and mahoe are other names for it, and the upright forest tree of Cuba and Jamaica is
  a different plant.
examples:
- A row of balibago shaded the path down to the beach.
- Fishermen twist balibago fiber into strong cord for their nets.
