senseId: 'universal_proposition%1:10:00::'
synsetId: 06764081-n
simpleMeaning: A statement in logic about all the members of a group, saying the same thing holds for
  each one.
scope: Also called universal. It is a statement in logic, not a statement about one member only.
examples:
- The teacher wrote a universal proposition on the board about metals and heat.
- They tested the universal proposition by checking one member after another.
