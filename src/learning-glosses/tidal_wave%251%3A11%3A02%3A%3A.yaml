senseId: 'tidal_wave%1:11:02::'
synsetId: 07363669-n
simpleMeaning: A feeling or happening that comes on so strongly that people cannot stand against it.
scope: This is about something that comes over people too strongly to hold back, not sea water pulled
  back and forth by the moon and sun, and not a rise of water along the shore after a storm.
examples:
- They felt a tidal wave of grief.
- A tidal wave of nausea came over them.
