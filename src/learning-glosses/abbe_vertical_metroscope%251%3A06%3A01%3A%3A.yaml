simpleMeaning: An instrument for measuring dimensions using Abbe's principle, which aligns the measuring
  scale with the length being measured.
scope: A measuring tool that worked by Abbe's rule, not a ruler and not a tool for weighing.
examples:
- The Abbe vertical metroscope measured the part to a fine degree.
- With an Abbe vertical metroscope, the worker checked the size of the piece.
