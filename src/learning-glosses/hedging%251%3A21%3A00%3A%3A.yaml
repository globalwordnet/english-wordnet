simpleMeaning: A way to reduce or eliminate financial risk, such as holding two investments whose gains
  and losses offset each other when prices change.
scope: Also called a hedge; a way of lessening money risk, not a vague statement that commits to nothing.
examples:
- Hedging saved the fund when prices fell.
- By hedging, the trader cut the risk of a sharp loss.
