simpleMeaning: Flat pieces of wood cover a wall, or cover all the walls of a room at once.
scope: This is also called wainscoting, and it is the wall itself, not the loose panels it is made from.
examples:
- The wainscotting in the hall was painted white.
- They put new wainscotting along the lower walls of the dining room.
