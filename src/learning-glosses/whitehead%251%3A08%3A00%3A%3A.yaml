simpleMeaning: A closed, clogged skin pore that appears as a small whitish bump. A pore with an exposed,
  dark-tipped plug is called a blackhead.
scope: This plug is also called blackhead and comedo.
examples:
- A whitehead appeared on their chin where a pore was blocked.
- They left the whitehead alone until the plug came out of the pore.
