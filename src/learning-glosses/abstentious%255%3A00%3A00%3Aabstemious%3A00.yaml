simpleMeaning: Showing self-control by holding back from satisfying an appetite, especially for food or
  drink.
scope: This one is also called abstinent.
examples:
- They were abstentious at the table, taking only a little bread and water.
- Even when the cakes came round, they stayed abstentious and took none.
