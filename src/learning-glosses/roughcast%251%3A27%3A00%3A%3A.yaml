simpleMeaning: A coarse plaster used to cover the outside walls of buildings.
scope: This is a coarse coat for the outside walls of a building, not the act of shaping stone without
  finishing its surface and not a first model.
examples:
- They covered the outside wall with roughcast.
- The outside walls were finished with roughcast.
