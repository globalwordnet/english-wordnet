senseId: 'reticule%1:06:01::'
synsetId: 04089998-n
simpleMeaning: A network of fine lines, dots, cross hairs, or wires in the focal plane of the eyepiece
  of an optical instrument.
scope: The markings lie in the plane where the eyepiece image comes into focus.
examples:
- The reticule in the telescope showed a set of fine lines.
- Through the telescope, she saw the lines of the reticule across the image of the moon.
