schema: oewn-learning-gloss-v2
senseId: too_big_for_one's_breeches%5:00:00:proud:00
synsetId: 01896449-s
simpleMeaning: In everyday talk, this is said of a person who thinks much more highly of themselves than
  they should and looks down on other people.
scope: Also called snotty, snooty, bigheaded, persnickety, snot-nosed, stuck-up and uppish, this is said
  of a person full of pride in themselves, not about a person who is merely sure of themselves.
examples:
- They have grown too big for their breeches and now treat the staff with scorn.
- They got too big for their breeches and stopped listening to anyone else.
