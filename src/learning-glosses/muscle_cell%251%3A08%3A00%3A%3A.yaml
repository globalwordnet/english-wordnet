simpleMeaning: One of the tiny living units of the body, long in shape, able to tighten and loosen, that
  makes up the flesh that moves the body.
scope: Also called a muscle fiber or a muscle fibre.
examples:
- Each muscle cell can shorten to pull the bone.
- Under the microscope, the muscle cell looked long and thin.
