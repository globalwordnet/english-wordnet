simpleMeaning: A semisolid mass that forms when blood coagulates, trapping red and white blood cells.
scope: It is a lump, not the liquid itself.
examples:
- A blood clot in the leg can block the flow of liquid to the foot.
- The cut stopped bleeding once a blood clot formed.
