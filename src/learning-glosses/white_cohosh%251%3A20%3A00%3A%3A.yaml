simpleMeaning: A North American herb that bears poisonous white berries.
scope: This North American herb is also called doll's eyes, a white baneberry, a white bead, and Actaea
  alba, and its pale berries can poison, unlike the harmless berries of other herbs.
examples:
- We found white cohosh growing beside the stream, its pale berries shining in the shade.
- They warned us not to pick white cohosh in the woods.
