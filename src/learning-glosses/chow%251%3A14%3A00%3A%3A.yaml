simpleMeaning: The Zhou dynasty, which ruled China from about 1046 to 256 BC, a period that saw the rise
  of Confucianism and Taoism.
scope: Also called the Chou or Zhou dynasty, the Chou dynasty, the Chow dynasty, or the Zhou dynasty;
  a ruling house of old China, not the Ming dynasty and not a modern state.
examples:
- The Chow dynasty ruled China for centuries.
- Confucianism rose during the Chow dynasty.
