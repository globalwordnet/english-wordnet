simpleMeaning: People who are not signed up as students in the usual way can still learn from a college
  or a place of higher learning.
scope: Also called extension and extension service, this is an educational opportunity open to people
  outside the student body, not a course for students signed up in the usual way.
examples:
- They took a class through university extension although they were not full students there.
- The university extension let people study without signing up as students in the usual way.
