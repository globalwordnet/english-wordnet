simpleMeaning: A fish that lives in the gut of animals such as sea cucumbers or between the shells of
  pearl oysters in or near shallow seagrass beds.
scope: This sense is also called pearlfish, for a fish found living inside the gut tubes of, say, sea
  cucumbers, or between the shells of pearl oysters in or near shallow sea-grass beds.
examples:
- Pearl-fish live inside sea cucumbers.
- Pearl-fish hide between oyster shells.
