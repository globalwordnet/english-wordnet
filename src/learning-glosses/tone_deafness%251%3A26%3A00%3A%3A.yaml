simpleMeaning: One pitch sounds the same as another to a person with this.
scope: Also called tin ear, this is about pitch alone, not a loss of hearing as a whole.
examples:
- They had tone deafness and could not tell the notes apart.
- They could not hear the change in pitch because of tone deafness.
