simpleMeaning: The belief that each person should stand on their own in social and money matters, with
  freedom to act for themselves and to compete freely with others.
scope: This is the belief that puts personal liberty, self-reliance, and free competition first in social
  and money matters.
examples:
- They ran their business by rugged individualism.
- They believed in rugged individualism and stood on their own.
