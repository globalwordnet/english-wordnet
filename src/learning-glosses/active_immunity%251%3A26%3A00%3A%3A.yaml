senseId: 'active_immunity%1:26:00::'
synsetId: 14551155-n
simpleMeaning: Protection that develops when the body makes its own antibodies in response to an antigen,
  such as a substance on a germ.
scope: The body gains this protection by making its own guards that fight the bits of germs that cause
  sickness.
examples:
- After the jab, active immunity grew as the body made its own guards.
- The child built up active immunity after the illness passed.
