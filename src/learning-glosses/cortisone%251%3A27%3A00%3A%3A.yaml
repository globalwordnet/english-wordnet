simpleMeaning: A corticosteroid hormone normally produced by the outer adrenal gland and sold as Cortone
  Acetate. The body converts it to hydrocortisone.
scope: Of a steroid hormone sold as Cortone Acetate, given to ease pain.
examples:
- Their cortisone eased the pain.
- The cortisone was given at noon.
