simpleMeaning: To spread something through the air as tiny drops of liquid or bits of solid material.
scope: Also called aerosolise. It is done to a thing by something else, not by the thing itself.
examples:
- The bacteria suspension was aerosolized.
- The worker aerosolized the paint and covered the wall.
