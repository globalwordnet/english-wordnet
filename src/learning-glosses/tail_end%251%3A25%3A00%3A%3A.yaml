simpleMeaning: A bit of a thing that sticks out and looks like the back part of an animal.
scope: Also called tail. It does not name the rear part of an animal itself.
examples:
- The tail end of the pipe stuck out from the wall.
- A tail end of wood jutted out from the side of the box.
