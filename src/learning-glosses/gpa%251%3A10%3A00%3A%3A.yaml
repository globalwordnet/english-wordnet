simpleMeaning: A number showing a student's academic performance, calculated by dividing total grade points
  earned by the credit hours counted toward the average.
scope: GPA stands for grade point average. Courses with more credit hours usually carry more weight.
examples:
- Her GPA shows how well she has done at the university.
- Earning 12 grade points for four graded credit hours gives a GPA of 3.0.
