synsetId: 00872561-s
simpleMeaning: Said of a title, especially a legal right to own land or a house, that has no claim, charge,
  or limit on it that a court could dispute.
scope: Also called clear. It is a word for a title, not for a person.
examples:
- The house came with an unmortgaged title, so the sale went through without delay.
- The buyer checked that the land was unmortgaged before agreeing to buy it.
