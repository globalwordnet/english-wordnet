simpleMeaning: A fever caused by rickettsial bacteria and spread by wood ticks.
scope: This is also called mountain fever or Rocky Mountain spotted fever, an illness from woodland blood-suckers,
  not one caught from another person.
examples:
- They caught tick fever after a tick bite in the woods.
- They learned that tick fever comes from a tick bite in the woods.
