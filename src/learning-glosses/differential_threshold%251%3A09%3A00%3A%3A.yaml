simpleMeaning: The smallest change in a stimulus, such as a sound, that a person can detect.
scope: This one is also called difference limen, difference threshold, and differential limen.
examples:
- The differential threshold was crossed as soon as the water grew a little hotter.
- The lab workers raised the light bit by bit to find the differential threshold for the eye.
