simpleMeaning: A coronavirus disease first reported in mainland China in 2002, with an international outbreak
  in 2003. Symptoms include fever, cough, breathing difficulty, and low oxygen. It can be fatal.
scope: A disease of the breathing system, also called severe acute respiratory syndrome; not flu and not
  a common cold.
examples:
- SARS spread quickly in 2003.
- Patients with SARS often had fever and a bad cough.
