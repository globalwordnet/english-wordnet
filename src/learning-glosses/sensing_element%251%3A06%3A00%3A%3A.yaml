simpleMeaning: A device that responds in a specific way to a signal or change, such as heat, pressure,
  light, or movement.
scope: Also called sensor and detector, this tool takes in a sign, like heat, pressure, light, or movement,
  and gives back its own set answer.
examples:
- The sensing element picked up the heat.
- A sensing element answered the movement.
