simpleMeaning: A flower much like its nearest kin, but with bigger flowers than that kin has.
scope: This flower is also called Gentiana clausa or blind gentian, not the kind with tubular flowers
  that barely open.
examples:
- The closed gentian had larger flowers than the ones beside it.
- The gardener pointed out a closed gentian, noting its large flowers.
