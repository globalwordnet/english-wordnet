simpleMeaning: A unit of information equal to 1,024 mebibytes, or 2 to the 30th power (1,073,741,824)
  bytes.
scope: This sense is also called gigabyte, G, GiB, and GB.
examples:
- The new drive holds 500 gibibytes of data.
- The backup took up four gibibytes.
