simpleMeaning: This measure of computer information is 1,024 mebibytes, or 1,073,741,824 groups of eight
  binary digits, two raised to the thirtieth power.
scope: This sense is also called gigabyte, G, GiB, and GB.
examples:
- The new drive holds 500 gibibytes of data.
- The backup took up four gibibytes.
