simpleMeaning: Wires that carry voices from one place to another run high above the ground on this tall
  upright pole.
scope: This is also called a telegraph pole or a telegraph post, and it is not the wires themselves.
examples:
- They hung new wires on the telephone pole beside the lane.
- The wind bent a telephone pole across the road, and the wires it held sagged low.
