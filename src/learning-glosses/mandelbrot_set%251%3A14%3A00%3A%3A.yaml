simpleMeaning: A set of complex numbers with an intricate fractal boundary. For each number, repeatedly
  squaring the result and adding that number, starting from zero, keeps the results bounded.
scope: This is a group of complex numbers with a much-twisted fractal edge when drawn; it has no other
  name in this set.
examples:
- The Mandelbrot set has a much-twisted edge.
- The Mandelbrot set is made of points that stay within bounds.
