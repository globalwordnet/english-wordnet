senseId: 'ventilatory%3:01:00::'
synsetId: 02834362-a
simpleMeaning: Air moves through a thing with this quality, or it has to do with air moving in and out
  of the lungs.
scope: This word is used of a thing provided with moving air, not of one with still air.
examples:
- They fitted a ventilatory fan in the hall so that air kept moving through it.
- The ventilatory muscles help air move in and out of the lungs.
