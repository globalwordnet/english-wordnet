simpleMeaning: Food that an animal such as a cow brings back up from its stomach to chew again.
scope: It is also called cud. It is a mouthful.
examples:
- The cow lay in the field, bringing up its rechewed food to grind a second time.
- A sheep will rest after eating, then bring up the rechewed food and grind it again with its teeth.
