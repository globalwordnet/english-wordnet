simpleMeaning: The use of the wrong word by mistake, because it sounds like the right one.
scope: It is also called malapropism.
examples:
- Calling the dance a 'flamingo' instead of 'flamenco' is a malaprop.
- The speaker's malaprop made the crowd laugh.
