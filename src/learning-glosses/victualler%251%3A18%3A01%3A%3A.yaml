simpleMeaning: A person who keeps an army fed and stocked with what it needs.
scope: Also called provisioner, sutler, and victualer. It is a person, not a soldier.
examples:
- The victualler loaded the wagons with flour and salt.
- They thanked the victualler for the fresh bread.
