simpleMeaning: Matching cups, plates, and pots in thin white clay or silver, kept together for pouring
  out a hot drink brewed from leaves.
scope: Also called tea service. It is a group that goes together, not one cup on its own.
examples:
- They washed the tea set after the guests left.
- The tea set sat on a tray by the window.
