simpleMeaning: A group of towns and cities joined together, with no breaks between them.
scope: Also called sprawl and urban sprawl; this one is about towns and cities, not about one town on
  its own.
examples:
- The conurbation stretches from the coast to the hills, with no break in the houses.
- The new road runs through the middle of the conurbation.
