senseId: 'apogamy%1:22:00::'
synsetId: 13454635-n
simpleMeaning: The development of a plant embryo without fertilization, especially when a fern's spore-producing
  generation grows directly from its sex-cell-producing generation.
scope: In plants, this is how a new plant grows without the joining of male and female cells.
examples:
- Apogamy lets the fern make a new plant without fertilization.
- In apogamy, the new plant grows straight from the gametophyte.
