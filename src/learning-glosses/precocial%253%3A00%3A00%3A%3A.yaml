synsetId: 00102213-a
simpleMeaning: 'Of a baby bird: covered in soft feathers, with its eyes open, and able to leave the nest
  a few days after hatching.'
scope: It is a word for a young bird, not for one that stays helpless in the nest.
examples:
- The precocial chicks left the nest two days after hatching.
- Ducklings are precocial, with their eyes open from the start.
