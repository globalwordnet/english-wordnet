simpleMeaning: Paint that artists use, with water as its base, carrying pigments that dissolve in water.
scope: Also called watercolor, watercolour, and water-color. It is a paint, not the art of painting or
  a finished picture.
examples:
- The artist mixed the water-colour on a white plate.
- A little water-colour goes a long way on wet paper.
