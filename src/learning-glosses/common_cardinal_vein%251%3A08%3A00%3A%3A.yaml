simpleMeaning: One of the embryo's main veins carrying blood back to the heart, formed where the anterior
  and posterior cardinal veins join.
scope: The main tubes that carry blood back to the heart, not tubes that carry blood away from the heart
  and not small tubes in the skin.
examples:
- The common cardinal vein returns blood to the heart.
- Blood flows back through the common cardinal vein.
