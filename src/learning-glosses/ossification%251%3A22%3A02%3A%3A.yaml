senseId: 'ossification%1:22:02::'
synsetId: 13550218-n
simpleMeaning: The process by which soft parts of the body turn hard and bone-like as calcium builds up
  in them.
scope: It is not bone forming as a body grows, and not a fixed pattern of thought or behavior.
examples:
- Ossification in the muscle made the leg stiff.
- The scan showed ossification where soft tissue had turned hard.
