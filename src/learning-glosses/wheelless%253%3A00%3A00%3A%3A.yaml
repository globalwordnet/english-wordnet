senseId: 'wheelless%3:00:00::'
synsetId: 02566547-a
simpleMeaning: Said of a thing that has no round parts to roll on, or of a place that has no carts, cars,
  or other things that roll on round parts.
scope: It is said of a thing or a place.
examples:
- They dragged a wheelless stoneboat filled with rocks.
- The wheelless societies had no carts at all.
