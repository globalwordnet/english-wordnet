simpleMeaning: The outer layer of the cerebrum, made of gray matter containing many nerve cell bodies
  and fibers without a myelin covering.
scope: This layer of grey matter is also called cerebral mantle, cortex, or pallium.
examples:
- The scan showed a small mark on the cerebral cortex.
- The doctor pointed to the cerebral cortex on the model of the brain.
