simpleMeaning: The male monarch of Great Britain after England and Scotland united in 1707.
scope: The title applies to George I and George II. It is not the same as King of England.
examples:
- The King of Great Britain addressed the people on the radio.
- The King of Great Britain sailed to the north last summer.
