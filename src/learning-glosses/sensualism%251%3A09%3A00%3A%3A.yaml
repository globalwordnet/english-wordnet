simpleMeaning: In philosophy, the teaching that only how something feels can show whether it is good.
scope: Sensationalism is another name for this sense, which takes feeling alone as the test of what is
  good, not a hunger for pleasures of the body.
examples:
- By sensualism, they meant that feeling alone could tell good from bad.
- The book defends sensualism as the one true test of what is good.
