simpleMeaning: A turbine that burns liquid fuel in compressed air to produce mechanical power. The hot
  gases expand through the turbine, making it turn.
scope: Of a turbine that burns liquid fuel inside to turn its stored power into moving power, its burnt
  gases swelling through the turbine.
examples:
- The gas turbine drove the pump.
- Gas turbines burned fuel.
