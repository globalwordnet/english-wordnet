simpleMeaning: Relating to the windpipe, or resembling it in shape or function.
scope: This word is for the air tube and things that look or work like it, not for the lungs that take
  the air in.
examples:
- Air passed down the tracheal tube to the lungs.
- They could hear air moving through the tracheal tube.
