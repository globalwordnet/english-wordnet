simpleMeaning: Blood flows out of the cord in the back through these blood vessels.
scope: These are the blood vessels that drain the cord in the back, also called spinal veins, not the
  ones that feed it.
examples:
- The vena spinalis runs along the cord in the back, carrying blood away from it.
- A cut to the vena spinalis would let blood out of the cord in the back.
