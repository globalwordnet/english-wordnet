simpleMeaning: Several words joined that stand for a person or thing, as 'he' or 'they' does.
scope: Also called pronominal. It is a set of words.
examples:
- The pronominal phrase 'the first two' takes the place of the runners' names.
- In the story, the pronominal phrase 'the poor' stands for poor people.
