simpleMeaning: In the Middle Ages, a member of the clergy who raised money for the church by selling papal
  indulgences, which promised to reduce punishment for sins.
scope: A churchman of the Middle Ages who sold pardons from the Pope for church money, not a person who
  simply forgives a wrong.
examples:
- The pardoner travelled from town to town selling pardons.
- The pardoner sold indulgences to raise money for the church.
