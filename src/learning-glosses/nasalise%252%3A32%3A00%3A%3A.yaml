senseId: 'nasalise%2:32:00::'
synsetId: 00953238-v
simpleMeaning: To speak a sound with the soft flap at the back of the mouth lowered, so that air flows
  through the nose as well as the mouth.
scope: Also called nasalize. It is the way a single sound is formed, not a way of speaking as a whole.
examples:
- The singer nasalises the vowels in the last line of the song.
- They nasalise the sound at the end of the word.
