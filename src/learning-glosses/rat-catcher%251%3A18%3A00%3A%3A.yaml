simpleMeaning: A person paid to rid a place of the small, gnawing animals that spoil things, by killing
  them or driving them off.
scope: Also called a disinfestation officer, this worker is hired to clear a place of small, gnawing pests.
examples:
- They sent for a rat-catcher when the rats would not leave.
- A rat-catcher works where rats have made their home.
