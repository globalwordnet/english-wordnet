synsetId: 00782068-a
simpleMeaning: Nearest to the point where a part of the body attaches or begins.
scope: In anatomy, closest to the point of attachment or origin.
examples:
- The proximal end of the upper arm bone meets the shoulder.
- The elbow is proximal to the wrist because it is closer to where the arm joins the body.
