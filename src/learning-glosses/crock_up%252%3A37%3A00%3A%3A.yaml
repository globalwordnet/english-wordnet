simpleMeaning: To have one's mind give way under strain, so that one cannot cope any more.
scope: Also called crack, collapse, break up or crack up, this one names a breakdown of the mind.
examples:
- After months of worry, they felt they were about to crock up.
- The long nights of work made them crock up at last.
