simpleMeaning: A type of corn whose kernels contain hard and soft starch and develop a dent as they ripen.
scope: A kind of corn whose grains hold hard and soft starch and sink in when ripe, not sweet corn and
  not popcorn.
examples:
- The farmer grew dent corn for animal feed.
- Dent corn kernels sink in when they ripen.
