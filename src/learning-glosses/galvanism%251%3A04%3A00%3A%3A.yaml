simpleMeaning: Using electric current on the body to treat illness, as with some kinds of paralysis.
scope: This sense is also called electric healing, electrical healing, and electrotherapy.
examples:
- The clinic used galvanism to treat patients with paralysis.
- The doctor used galvanism on the patient's stiff leg.
