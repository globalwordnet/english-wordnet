simpleMeaning: The words of an opera from another land, or of a choir piece, put into the watchers' own
  speech and shown on a screen over the stage.
scope: This is also called surtitle, and it puts the words over the stage, not at the foot of the screen.
examples:
- We read the supertitle to follow the words of the opera.
- The supertitle over the stage gave the words in our own speech.
