simpleMeaning: Cells do not split at the wrong time because this gene stops them.
scope: This is a part of the body's building plans, not one that lets cells split whenever they like.
examples:
- When the tumor suppressor gene is switched off, cells split at the wrong time.
- They checked the tumor suppressor gene in cells that had split too soon.
