simpleMeaning: A vitamin that dissolves in fat and helps the blood form clots.
scope: This one is also called naphthoquinone and vitamin K.
examples:
- Doctors give the antihemorrhagic factor to patients whose blood will not clot.
- The antihemorrhagic factor helps the blood form a clot after an injury.
