simpleMeaning: An antibiotic made of linked amino acids with a known structure. It treats several kinds
  of Gram-positive bacteria and is usually applied directly to the affected area.
scope: This germ-killing drug of known build is most often put on the skin.
examples:
- The cut was covered with bacitracin.
- A thin smear of bacitracin went on the cut.
