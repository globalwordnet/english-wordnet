senseId: 'unruliness%1:07:00::'
synsetId: 04915573-n
simpleMeaning: A person with this trait often refuses to do as told and shows no self-control.
scope: Willfulness, fractiousness and wilfulness are other names for this trait, not for one single act
  of disobedience.
examples:
- The teacher grew tired of the unruliness in the class, where pupils talked over every lesson.
- Their unruliness showed in small things, like refusing to queue and ignoring every rule.
