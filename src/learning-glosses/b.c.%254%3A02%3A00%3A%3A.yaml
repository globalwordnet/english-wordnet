simpleMeaning: Meaning before the Christian era, this abbreviation follows a year to show it comes before
  the traditional date of Christ's birth.
scope: Also called BC and before Christ, this marks a year as coming before the time of Christ, not after
  it.
examples:
- The temple was built in 200 B.C.
- The date was written as 500 B.C. on the stone.
