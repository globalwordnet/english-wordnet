senseId: suppositious%5:00:00:theoretical:00
synsetId: 00864403-s
simpleMeaning: Made up mostly from guesses, with too little proof to show it is true.
scope: It is also called supposed, hypothetical, conjectural, divinatory, hypothetic, suppositional, and
  supposititious.
examples:
- The suppositious account of the battle had no proof behind it.
- They took the suppositious tale as a guess, not as a fact.
