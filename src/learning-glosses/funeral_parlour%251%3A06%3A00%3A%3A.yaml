simpleMeaning: A building where a dead person’s body is kept and friends or family can come to pay their
  last respects.
scope: This sense is also called funeral-residence, funeral chapel, funeral church, funeral home, and
  funeral parlor.
examples:
- They held the viewing at the funeral parlour on Main Street.
- The funeral parlour was quiet as friends came to pay their last respects.
