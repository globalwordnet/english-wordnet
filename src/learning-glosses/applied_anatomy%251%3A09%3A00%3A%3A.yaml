simpleMeaning: The use in real work of knowledge about the parts of the body to find out what is wrong
  and to treat it.
scope: This is also called clinical anatomy, and it is not the study of the body for its own sake.
examples:
- The surgeon studied applied anatomy to plan the operation.
- The course in applied anatomy showed students how to find the cause of a pain.
