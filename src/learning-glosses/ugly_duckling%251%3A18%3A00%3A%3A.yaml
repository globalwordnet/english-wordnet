schema: oewn-learning-gloss-v2
senseId: 'ugly_duckling%1:18:00::'
synsetId: 10755509-n
simpleMeaning: This child does not look good and seems unlikely to do well, yet grows up to be good-looking
  and admired by others.
scope: This is about a child who changes for the better as they grow up, not about a child who stays the
  same.
examples:
- They were called an ugly duckling as a child, but they grew into a fine adult.
- No one guessed the ugly duckling would grow into a fine adult.
