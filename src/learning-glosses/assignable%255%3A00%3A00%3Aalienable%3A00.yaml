senseId: assignable%5:00:00:alienable:00
synsetId: 00094409-s
simpleMeaning: Said of a thing that the law lets pass to someone else as their own.
scope: Also called transferable, negotiable, conveyable, and transferrable, this one is not about something
  that must stay with its owner.
examples:
- The bonds were assignable, so they could be sold to another buyer.
- They asked whether the lease was assignable to a new tenant.
