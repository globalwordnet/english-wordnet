senseId: 'deduction%1:21:01::'
synsetId: 13350069-n
simpleMeaning: An amount subtracted from taxable income. The tax saving depends on the amount deducted
  and the tax rate for that portion of income.
scope: A cut in the sum on which tax is worked out; not a sum taken off pay, and not a conclusion drawn
  from facts.
examples:
- She claimed a deduction for her work clothes.
- The deduction cut the tax he had to pay.
