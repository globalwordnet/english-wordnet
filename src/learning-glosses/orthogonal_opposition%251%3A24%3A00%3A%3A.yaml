simpleMeaning: How two things set against each other stand at right angles.
scope: Also called orthogonality or perpendicularity. It is a relation between things.
examples:
- The two lines were in orthogonal opposition, crossing at right angles.
- They drew the two roads in orthogonal opposition on the map.
