simpleMeaning: A sound shaped much like the open sounds of speech, but used as a consonant.
scope: Also called glide. It is a noun.
examples:
- The semivowel at the start of 'yes' works as a consonant.
- The semivowel at the start of 'wet' sounds almost like one of the open sounds.
