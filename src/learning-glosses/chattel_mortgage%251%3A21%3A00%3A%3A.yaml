simpleMeaning: Money lent to buy a thing of one's own, with the thing itself standing as a promise that
  the money will be paid back.
scope: This one is about a loan.
examples:
- They took out a chattel mortgage to buy the tractor, and the tractor itself stood as security for the
  loan.
- A chattel mortgage let them buy the piano now and pay for it over time.
