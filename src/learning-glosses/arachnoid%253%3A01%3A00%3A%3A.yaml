senseId: 'arachnoid%3:01:00::'
synsetId: 02647462-a
simpleMeaning: Describing something that has a link to the group of spiders, scorpions, ticks, and mites,
  or that looks like one of them.
scope: This word is also called spidery, spiderlike, arachnidian, and spiderly, and it is a describing
  word, not the noun for the animal itself.
examples:
- The guide pointed out the arachnoid shape of the animal in the tank.
- The book had a chapter on arachnoid animals and their habits.
