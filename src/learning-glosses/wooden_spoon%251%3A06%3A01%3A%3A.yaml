simpleMeaning: The person who comes last gets this joke prize, a spoon made of timber.
scope: This joke prize goes to the loser, not the winner, and is not a tool for eating.
examples:
- They gave the wooden spoon to the team that finished last.
- Nobody wanted to win the wooden spoon at the end of the season.
