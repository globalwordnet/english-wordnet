senseId: 'rh_incompatibility%1:26:00::'
synsetId: 13998891-n
simpleMeaning: A mismatch in Rh blood type. After a transfusion, anti-D antibodies in an Rh-negative recipient
  can destroy donated Rh-positive red cells and cause anemia.
scope: Rh incompatibility is a transfusion reaction involving the Rh blood group.
examples:
- The blood bank checked for Rh incompatibility before the transfusion.
- The report identified Rh incompatibility as the cause of the reaction.
