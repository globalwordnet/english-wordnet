simpleMeaning: A sample of cells taken from the vaginal lining for examination under a microscope.
scope: This is the name for a sample from the lining of the vagina, taken to study its cells, not a sample
  from elsewhere in the body.
examples:
- The nurse took a vaginal smear to check the cells.
- The vaginal smear was sent to the lab for study.
