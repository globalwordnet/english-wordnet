simpleMeaning: Where skin was hurt or burned, a piece taken from elsewhere on the body is fixed in place
  by surgery.
scope: This names a patch moved from one part of the body to a hurt or burned place.
examples:
- A skin graft was put over the burn.
- A skin graft was used to cover the burn.
