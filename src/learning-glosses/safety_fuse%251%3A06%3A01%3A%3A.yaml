senseId: 'safety_fuse%1:06:01::'
synsetId: 03412279-n
simpleMeaning: An electrical part that cuts off the current in a line when the load on it grows past what
  it can bear.
scope: This is also called a fuse and an electrical fuse, not the slow-burning cord used to light a charge
  from far away.
examples:
- The safety fuse cut off the current when the load grew too great.
- A fresh safety fuse was fitted in its place.
