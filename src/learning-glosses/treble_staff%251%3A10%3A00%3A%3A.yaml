simpleMeaning: With this clef, the second line of a set of five lines stands for the G above middle C.
scope: Also called treble clef and G clef, this name is for the sign, not for the five lines.
examples:
- They sang the notes written on the treble staff, beginning with the G above middle C.
- They wrote the tune on the treble staff, with the G above middle C on the second line.
