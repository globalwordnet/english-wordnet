simpleMeaning: A US Defense Department intelligence agency that designs, builds, and operates satellite
  systems to identify global trouble spots, monitor arms agreements and environmental issues, and support
  military planning.
scope: This is a spy arm of the United States that runs space spy systems; also called NRO.
examples:
- The National Reconnaissance Office runs space spy systems.
- The National Reconnaissance Office helps plan army work.
