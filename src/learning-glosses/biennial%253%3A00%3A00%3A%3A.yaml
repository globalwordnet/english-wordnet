simpleMeaning: Said of a plant that lives through two seasons and then dies.
scope: Also called a two-year, this one is not the noun for the plant itself.
examples:
- Parsnips and carrots are biennial plants, often grown as annuals.
- The biennial plant flowered in its second season and then died.
