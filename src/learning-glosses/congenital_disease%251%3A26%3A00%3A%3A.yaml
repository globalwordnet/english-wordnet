senseId: 'congenital_disease%1:26:00::'
synsetId: 14174621-n
simpleMeaning: A sickness or a health problem that a person is born with, passed down in the family.
scope: Also called genetic abnormality, genetic defect, genetic disease, genetic disorder, hereditary
  condition, hereditary disease, inherited disease, and inherited disorder, this one is about a sickness
  handed down through the parents, not one caught later in life.
examples:
- The baby was born with a congenital disease that runs in the family.
- Doctors found the congenital disease early because both parents carried it.
