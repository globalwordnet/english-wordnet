simpleMeaning: Said of a thing that has copper in it, where each copper atom is joined to one other atom.
scope: Cuprous means copper in the +1 state; cupric is the +2 state. The standard source wrongly says
  divalent for this sense.
examples:
- The cuprous powder was stored in a dry place.
- A cuprous compound appeared on the list of chemicals.
