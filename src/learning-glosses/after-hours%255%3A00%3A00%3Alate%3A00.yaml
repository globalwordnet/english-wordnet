senseId: after-hours%5:00:00:late:00
synsetId: 00820573-s
simpleMeaning: Said of things that happen when a place has closed for the day, above all when the closing
  time is set by law.
scope: This one is not about what happens while a place is still open.
examples:
- They met for after-hours drinks once the shop had closed.
- Dancing went on in the after-hours club after the doors had closed to new guests.
