simpleMeaning: To sprinkle liquid over something so that it becomes slightly wet.
scope: Sprinkle and besprinkle are other names for this way of wetting a thing a little with drops of
  liquid, not by stirring air or gas into a liquid.
examples:
- The lawn was sparged with water.
- The path was sparged with water.
