simpleMeaning: The glands that make the watery drops send them away through any one of several small ducts.
scope: This is also called a lachrymal duct and a lacrimal duct.
examples:
- Their eye kept watering because a tear duct was blocked.
- They dabbed their eye while a tear duct kept the watery drops coming.
