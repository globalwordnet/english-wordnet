senseId: deuteranopic%5:00:00:blind:00
synsetId: 02167202-s
simpleMeaning: Not able to see the colour green, or to tell green from a red colour with purple in it.
scope: This one is also called green-blind.
examples:
- A deuteranopic person may find green and red traffic lights hard to tell apart.
- The eye test showed that they were deuteranopic, because green and purple-red patches looked the same
  to them.
