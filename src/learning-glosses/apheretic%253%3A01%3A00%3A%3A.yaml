senseId: 'apheretic%3:01:00::'
synsetId: 02642606-a
simpleMeaning: To do with the dropping of a sound or a letter from the start of a word, or made by such
  a dropping.
scope: This word is also called aphaeretic, and it is not about adding a sound or a letter to a word.
examples:
- In the apheretic form, the word has lost the sound it once began with.
- They wrote the apheretic spelling without the first letter of the older word.
