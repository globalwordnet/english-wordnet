simpleMeaning: A bookkeeper’s chronological list of related debits and credits, kept as part of a ledger.
scope: The term refers to the record in the ledger.
examples:
- The method of accounting lists every debit and credit in time order.
- Our method of accounting forms part of the ledger of accounts.
