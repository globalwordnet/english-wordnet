simpleMeaning: The northern lapwing, a bird of Europe and Asia with a long, thin crest and a call that
  sounds like its name.
scope: Also called a peewit or green plover. Here the name refers to the lapwing.
examples:
- A pewit stood in the wet field, its crest lifted in the wind.
- We heard the pewit calling over the marsh at dusk.
