simpleMeaning: A baseball play in which the runner on third starts for home as the pitcher throws, counting
  on the batter to bunt.
scope: It is also called suicide squeeze; the runner leaves third base early, before the ball is hit.
examples:
- The coach called for a suicide squeeze play in the last inning.
- Their suicide squeeze play scored the winning run.
