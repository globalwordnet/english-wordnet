senseId: 'aneurysmal%3:01:00::'
synsetId: 03017370-a
simpleMeaning: Describing a blood vessel, or a person, with a weak place in the wall of the vessel that
  swells outward, or suffering because of one.
scope: Also called aneurismal, aneurismatic, or aneurysmatic, this one is not the weak spot itself.
examples:
- The aneurysmal part of the vessel was weak and thin.
- They found an aneurysmal swelling during the scan.
