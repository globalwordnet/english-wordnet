simpleMeaning: A tiny arachnid, such as a mite, that lives freely or as a parasite on animals or plants.
  These animals are related to ticks.
scope: This one is not a tick itself.
examples:
- The gardener found tiny acarids living on the leaves of the rose bush.
- They looked at the acarid under a lens and saw its eight legs.
