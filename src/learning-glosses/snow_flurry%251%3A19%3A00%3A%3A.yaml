simpleMeaning: A brief, light fall of snow with a gust of wind, or something that resembles it.
scope: Flurry is another name for this short, light fall of white flakes in a gust of wind, or anything
  that comes down in that quick, light way.
examples:
- A snow flurry dusted the ground.
- A snow flurry of feathers rose and fell.
