simpleMeaning: A theatrical verse line with six iambic feet that allows many rhythmic variations, used
  by Roman playwrights including Plautus and Terence.
scope: Poets such as Plautus and Terence used this six-beat line of verse for plays, and it allows many
  changes in the beat.
examples:
- The actor spoke lines in iambic senarius, six beats to a line.
- Terence used iambic senarius for the theatre, with many changes in the beat.
