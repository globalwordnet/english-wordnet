schema: oewn-learning-gloss-v2
senseId: 'cross-fertilize%2:29:01::'
synsetId: 00053606-v
simpleMeaning: To have one's female cells joined by the male cells of another living thing of the same
  kind, and so become fertile.
scope: Cross-fertilise is another name for this sense; it is not the sense where one living thing makes
  another fertile.
examples:
- The apple trees cross-fertilized with pollen from the trees in the next field.
- When the wind carried pollen from another plant, the lilies cross-fertilized.
