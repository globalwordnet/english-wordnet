simpleMeaning: A brewer’s yeast used to make lager that settles to the bottom during fermentation.
scope: A living thing brewers add to make lager, not a thing that rises to the top of the tank and not
  a powder for baking bread.
examples:
- The brewer added bottom fermenting yeast to the lager.
- Bottom fermenting yeast works low down in the tank.
