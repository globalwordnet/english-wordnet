simpleMeaning: Said of a person who can make out only a small part of what is in front of them.
scope: Also called purblind, dim-sighted, near-blind, sand-blind, and visually challenged. It is said
  of a person, not of a thing.
examples:
- The visually impaired woman uses a white cane.
- A guide dog helps a visually impaired person cross the street.
