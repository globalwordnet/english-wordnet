senseId: 'synonymity%1:24:00::'
synsetId: 13830373-n
simpleMeaning: Either word can say the same thing in one set of words around them, and that is the tie
  in meaning between the two words.
scope: This word names the tie in meaning between two words that can say the same thing in one set of
  words around them, also called synonymy and synonymousness.
examples:
- The synonymity of 'big' and 'large' means we can use either one here.
- The teacher showed the synonymity of 'quick' and 'fast' in one line of the book.
