simpleMeaning: Someone who often complains, cries, or whines excessively.
scope: This is also called a crybaby, a whiner, a complainer, a grumbler, a moaner, a bellyacher, and
  a sniveller, and it names a person, not a cry itself.
examples:
- Everyone called them a squawker.
- Do not be such a squawker.
