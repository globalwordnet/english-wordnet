senseId: 'rank-difference_correlation%1:09:00::'
synsetId: 06043831-n
simpleMeaning: The most common way to measure the relationship between two sets of scores by comparing
  each item's rank in one set with its rank in the other.
scope: Also called rank-difference correlation coefficient, rank-order correlation, or rank-order correlation
  coefficient.
examples:
- The rank-difference correlation showed the two tests moved together.
- They used rank-difference correlation to compare the two sets of marks.
