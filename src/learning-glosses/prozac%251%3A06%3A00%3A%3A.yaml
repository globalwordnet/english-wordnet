simpleMeaning: A brand of fluoxetine, also sold as Sarafem, used for depression. It selectively slows
  serotonin reuptake, which is thought to increase serotonin activity in the brain.
scope: A drug for low mood that acts on serotonin in the brain; also called fluoxetine, fluoxetine hydrocholoride
  and Sarafem.
examples:
- Prozac lifted her low mood after a few weeks.
- His doctor prescribed Prozac for his depression.
