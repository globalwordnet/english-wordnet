senseId: 'metabolically%4:02:00::'
synsetId: 00115099-r
simpleMeaning: In relation to the chemical processes that sustain life, including how the body uses energy
  and builds or breaks down substances.
scope: Of how the body turns food into energy, not of the body in general and not of food itself.
examples:
- Metabolically important substances help the body use food.
- The drug works metabolically, changing how food is used.
