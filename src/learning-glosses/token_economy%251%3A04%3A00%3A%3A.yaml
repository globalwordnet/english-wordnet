simpleMeaning: A form of behavior therapy used in some psychiatric hospitals. Patients earn tokens for
  particular behaviors and exchange them for rewards they value.
scope: This is a way of helping people change how they act, used in some hospitals for the mind, where
  good acts earn small pieces that can be swapped for things wanted.
examples:
- Under the token economy, patients earned tokens for good behavior.
- He earned tokens under the token economy and swapped them for things he wanted.
