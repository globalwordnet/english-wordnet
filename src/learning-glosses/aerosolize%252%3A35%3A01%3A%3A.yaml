simpleMeaning: To come apart into tiny drops that hang in the air.
scope: Also called aerosolise. It is about a thing coming apart on its own, not about something else spreading
  it.
examples:
- The dust aerosolized and hung in the air.
- The mist aerosolized quickly and spread through the room.
