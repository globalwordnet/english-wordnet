simpleMeaning: Gold, a soft, yellow, ductile, malleable metal with valences one and three. Nuggets occur
  in rock and river deposits. It resists most chemicals except chlorine and aqua regia.
scope: 'Also called gold and atomic number 79: a soft yellow metal found as lumps in rocks, not silver
  and not brass.'
examples:
- Au does not rust or tarnish in air.
- Miners find Au as lumps in rocks.
