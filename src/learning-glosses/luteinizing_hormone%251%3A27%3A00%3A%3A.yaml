senseId: 'luteinizing_hormone%1:27:00::'
synsetId: 14773451-n
simpleMeaning: A hormone released by the front of the pituitary gland that triggers egg release in female
  mammals and androgen release in male mammals.
scope: Also called interstitial cell-stimulating hormone, a hormone of the sex glands, from the gland
  at the base of the brain, which spurs egg release in female beasts and male hormone release in male
  beasts.
examples:
- Luteinizing hormone spurs egg release.
- Luteinizing hormones act in beasts.
