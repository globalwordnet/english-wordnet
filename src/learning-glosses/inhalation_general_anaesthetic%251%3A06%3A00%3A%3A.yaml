simpleMeaning: A gas that produces general anesthesia, making a person unconscious and unable to feel
  pain during a procedure.
scope: Inhalation anaesthetic, inhalation anesthetic and inhalation general anesthetic are other names
  for this gas.
examples:
- The surgeon chose inhalation general anaesthetic for the long operation.
- Inhalation general anaesthetic is used for operations that take hours.
