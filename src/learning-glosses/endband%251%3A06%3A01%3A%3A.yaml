simpleMeaning: A small cord or strip near a book's spine, especially on hardcovers, that strengthens the
  binding and can also decorate it.
scope: 'A part of a book, most often with hardcover bindings: a small cord or strip of material by the
  spine, bracing the book and sometimes decking it.'
examples:
- Endbands brace books by the spine.
- The endband decks hard covers.
