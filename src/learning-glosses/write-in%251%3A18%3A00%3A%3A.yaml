synsetId: 10813439-n
simpleMeaning: A person who seeks a public post, whose name is missing from the list of names given to
  voters, so each voter must add the name by hand.
scope: Also called write-in candidate. It is a person.
examples:
- The write-in won the seat even though the name was missing from the list.
- They chose a write-in on the day.
