simpleMeaning: Two places to set the parts let these pliers take a bigger grip, opening the jaws wider
  than a tool that cannot change.
scope: These take a bigger grip than a tool whose parts stay put, because their parts can be set in two
  places.
examples:
- They reached for the slip-joint pliers and set the parts wide.
- The slip-joint pliers opened wide enough for the job.
