simpleMeaning: Something that asks nothing of a person and leaves them bored.
scope: Also called commonplace, unglamorous, prosaic, and humdrum, this word is used of things, not of
  things that test them.
examples:
- They took an unglamourous job greasing engines.
- Life in the small town was unglamourous, with nothing new ever happening.
