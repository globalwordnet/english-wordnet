simpleMeaning: A brand name for ceftazidime, a cephalosporin antibiotic given by injection for bacterial
  infections, including moderate infections. It is also sold as Fortaz.
scope: Also called ceftazidime and Fortaz; a drug given by needle, of the cephalosporin kind, used to
  treat middling infections.
examples:
- Tazicef was given by needle to treat the infection.
- The doctor ordered Tazicef for a middling infection.
