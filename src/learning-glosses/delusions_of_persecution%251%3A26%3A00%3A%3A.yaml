senseId: 'delusions_of_persecution%1:26:00::'
synsetId: 14400780-n
simpleMeaning: A false belief that people are plotting to harm, embarrass, or obstruct someone, often
  associated with paranoia. The imagined plot may be elaborate.
scope: A false belief, common in paranoia, that others are out to get you; a tangled conspiracy is often
  imagined.
examples:
- Delusions of persecution dream up tangled plots.
- The delusion of persecution says others mean to get you.
