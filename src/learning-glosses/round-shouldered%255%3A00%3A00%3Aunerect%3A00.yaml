simpleMeaning: The back and shoulders stay bent in a curve, and the body stays bowed.
scope: Also called crooked, hunched, stooped, stooping, and round-backed. It is an adjective.
examples:
- The old gardener walked round-shouldered to the gate.
- Years of carrying heavy loads left the porter round-shouldered.
