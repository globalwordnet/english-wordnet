synsetId: 10044087-n
simpleMeaning: One of two people who share a home and a long-term sexual relationship, though the two
  need not be married to each other.
scope: Domestic partner, significant other, and spousal equivalent are other names for this person.
examples:
- They live together, and each calls the other a spouse equivalent.
- They moved in together, one as the other's spouse equivalent.
