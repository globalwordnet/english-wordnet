simpleMeaning: A string of words put together by the rules of word order, forming part of a larger string
  of the same kind.
scope: Also called syntagma. It is a group of words.
examples:
- The phrase 'in the garden' is a syntagm in the sentence.
- They broke the sentence into syntagms to study its shape.
