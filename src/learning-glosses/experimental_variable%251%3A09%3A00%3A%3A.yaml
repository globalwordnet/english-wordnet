simpleMeaning: In statistics, something that can take different values, and is not changed by changes
  in the values of other such things.
scope: This one is also called independent variable.
examples:
- The experimental variable in the trial was the amount of light the plants got.
- They changed the experimental variable in steps and watched the plants grow.
