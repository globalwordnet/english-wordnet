simpleMeaning: A sugar, such as fructose or glucose, that cannot be chemically broken down into simpler
  sugars. Monosaccharides are the simplest carbohydrates.
scope: 'Monosaccharose and simple sugar are other names for this sense: a sugar that does not break down
  into other sugars, not a sugar made of two joined sugars.'
examples:
- Glucose is a monosaccharide.
- A monosaccharide does not break down into other sugars.
