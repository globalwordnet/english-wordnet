senseId: 'zalcitabine%1:06:00::'
synsetId: 03195447-n
simpleMeaning: An antiviral drug formerly used to treat HIV infection. It is a nucleoside analogue that
  blocks reverse transcriptase, an enzyme HIV uses to copy its genetic material.
scope: 'Also called dideoxycytosine: a drug that fights HIV, not a drug that cures a cold and not a vitamin.'
examples:
- The doctor gave him zalcitabine to fight the HIV infection.
- Zalcitabine blocks the virus from copying itself.
