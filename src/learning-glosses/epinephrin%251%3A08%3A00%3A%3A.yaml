senseId: 'epinephrin%1:08:00::'
synsetId: 05415731-n
simpleMeaning: A catecholamine hormone released by the adrenal gland's inner region during stress, sold
  as Adrenalin. It stimulates the nerves that control involuntary functions.
scope: It is also called adrenaline and epinephrine, the chemical the glands above the kidneys send out
  under strain.
examples:
- The glands above the kidneys sent out epinephrin when he was under strain.
- His body made epinephrin as the strain grew.
