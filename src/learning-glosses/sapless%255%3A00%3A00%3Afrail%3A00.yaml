simpleMeaning: Having so little bodily strength that even small efforts tire one out.
scope: Weak, weakly, feeble, rickety, infirm, decrepit, and debile are other names for this want of bodily
  strength, not for a thing with no sap left in it.
examples:
- The body looked sapless, with little strength left in it.
- A sapless arm hung at the side, too weak to lift.
