simpleMeaning: From older stars at its middle, curving arms of younger stars wind outward through this
  great cloud of stars.
scope: Also called spiral nebula, this is one kind of star cloud, not a cloud of stars with no winding
  arms.
examples:
- The spiral galaxy had young stars spread along its curving arms.
- They saw the spiral galaxy's arms winding out from older stars at its middle.
