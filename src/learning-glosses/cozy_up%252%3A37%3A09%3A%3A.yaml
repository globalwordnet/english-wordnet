simpleMeaning: To make oneself liked by someone, often by acting without honesty.
scope: Also called cotton up, play up, shine up, sidle up or suck up, this one is about behaviour towards
  someone.
examples:
- She is playing up to the chairman.
- They cozied up to the new boss on the first day.
