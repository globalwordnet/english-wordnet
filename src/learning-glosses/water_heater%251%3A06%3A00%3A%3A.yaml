simpleMeaning: A device that heats water and stores it in a tank ready for use.
scope: Also called a hot-water heater or a hot-water tank, it is not a tank on its own, since it also
  warms what it stores.
examples:
- The water heater broke, so they had no hot water for a bath.
- They set the water heater to warm the tank before the guests arrived.
