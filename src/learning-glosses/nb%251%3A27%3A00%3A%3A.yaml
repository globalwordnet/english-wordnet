simpleMeaning: Niobium, a soft gray metal that can be drawn into wire and mixed with other metals. It
  occurs in niobite and was formerly called columbium.
scope: This is a metal, not a steel; also called atomic number 41 and niobium.
examples:
- Nb is a soft grey metal used in mixes.
- Nb was once called columbium.
