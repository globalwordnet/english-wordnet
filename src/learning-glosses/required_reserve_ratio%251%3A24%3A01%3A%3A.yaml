senseId: 'required_reserve_ratio%1:24:01::'
synsetId: 92411756-n
simpleMeaning: The percentage of its total deposits that a bank must keep in reserve to meet withdrawals,
  even when many customers want their money at once.
scope: The ratio compares required reserves with total deposits in this definition.
examples:
- The required reserve ratio rose after the bank scare.
- The central bank sets the required reserve ratio.
