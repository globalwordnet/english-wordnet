simpleMeaning: An inactive form of the digestive enzyme pepsin. It is stored in the stomach wall and becomes
  active pepsin when it comes into contact with hydrochloric acid in the stomach.
scope: A substance kept in the stomach walls that turns into pepsin, not pepsin itself and not stomach
  acid.
examples:
- Pepsinogen is stored in the stomach walls until it is needed.
- Acid in the stomach turns pepsinogen into pepsin.
