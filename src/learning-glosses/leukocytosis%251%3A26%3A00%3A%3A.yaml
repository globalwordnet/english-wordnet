simpleMeaning: An unusually high number of white blood cells in the blood, which can occur with an infection
  or with conditions such as leukemia.
scope: It is also called leucocytosis.
examples:
- The doctor noted leukocytosis in the blood count.
- Leukocytosis appeared when the wound became infected.
