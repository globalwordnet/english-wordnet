simpleMeaning: This check is a written promise of money from a bank or a carrier firm, paid when shown
  to any office that works with the firm that gave it out.
scope: Also called a traveller's check and a banker's check, this is paper you show to get money, not
  coins or notes in the hand.
examples:
- They paid with a traveler's check at the shop.
- The bank gave them a traveler's check when they asked for one.
