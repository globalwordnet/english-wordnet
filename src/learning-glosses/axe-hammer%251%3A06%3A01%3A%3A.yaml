simpleMeaning: A weapon that has a heavy tool for striking on one side and a sharp tool for cutting on
  the other.
scope: This is also called a hammer-axe and a hammer axe.
examples:
- The warrior's axe-hammer had a blunt head on one side and a sharp blade on the other.
- With one swing of the axe-hammer, they split the wood and smashed the lock.
