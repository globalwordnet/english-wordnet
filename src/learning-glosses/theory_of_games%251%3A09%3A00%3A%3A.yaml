simpleMeaning: In economics, a way to think about contests between rivals, worked out from what each side
  wins and loses.
scope: This is also called game theory; it is not about one player on their own.
examples:
- They used the theory of games to weigh what each side would win or lose.
- The theory of games helped them work out the wins and losses on each side.
