simpleMeaning: This word is used in everyday talk for a person who thinks they are better than everyone
  else and lets it show.
scope: In everyday talk, this word is also called snotty, snooty, bigheaded, persnickety, snot-nosed,
  stuck-up, and too big for one's breeches.
examples:
- The uppish new manager acted as if no one else knew the work.
- Their uppish talk about their own work went on all evening.
