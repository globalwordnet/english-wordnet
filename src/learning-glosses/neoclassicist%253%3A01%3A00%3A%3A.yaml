simpleMeaning: Having to do with, or speaking for, a return to the old Greek and Roman style.
scope: Also called neoclassicistic. It is an adjective, not a person who follows the style.
examples:
- The neoclassicist painter looked back to ancient Greece for models.
- The committee held neoclassicist views on the new hall.
