simpleMeaning: Allergic or unusually sensitive, especially to a particular substance or other trigger.
scope: Also called allergic, hypersensitive, sensitized, hypersensitised, hypersensitized, sensitised,
  supersensitive, and supersensitized, this is the word for such a person.
examples:
- The supersensitised children kept away from pollen.
- The doctor warned that the supersensitised patient might react to the dye.
