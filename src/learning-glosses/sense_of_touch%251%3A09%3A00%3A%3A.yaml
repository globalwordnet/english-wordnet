simpleMeaning: Above all with the hands, this lets a person learn what things and forces outside the body
  are like by feeling them.
scope: Also called touch, cutaneous senses, skin senses and touch modality, this lets a person learn what
  outside things and forces are like by feeling them, above all with the hands.
examples:
- Only sight and a sense of touch let us tell where things are around us.
- A sense of touch lets a person tell rough wood from smooth glass.
