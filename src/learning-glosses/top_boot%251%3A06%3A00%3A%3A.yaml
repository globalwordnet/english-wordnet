simpleMeaning: This boot ends halfway between the foot and the knee.
scope: Also called buskin, combat boot, desert boot and half boot, this reaches only halfway to the knee,
  not one that covers the whole leg.
examples:
- They wore top boots that stopped well below the knee.
- The top boots came up only to the middle of their lower legs.
