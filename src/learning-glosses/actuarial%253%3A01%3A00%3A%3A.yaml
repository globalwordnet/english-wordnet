simpleMeaning: Related to the work of calculating financial risks from statistics, especially for insurance
  or pensions.
scope: Of the work of an actuary, the person who works out risks and chances in numbers.
examples:
- Her work was actuarial, full of tables of risk and chance.
- The report was actuarial in its detail, with tables for every age.
