simpleMeaning: In a way that is a little bit mad.
scope: Also called daftly, dottily, nuttily, or wackily, this one is about how someone acts.
examples:
- The old lady smiled balmily and asked the same question again.
- They talked balmily about the neighbours as if everyone were spying on them.
