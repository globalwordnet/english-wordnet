simpleMeaning: To add short rules or headings, called rubrics, to a text, or to set the text out by them.
scope: This verb belongs with the verbs for setting a text out by its rubrics, not with painting its letters
  red or marking a saint's day in red.
examples:
- The editor decided to rubricate the new prayer book.
- They will rubricate the manual before it is printed.
