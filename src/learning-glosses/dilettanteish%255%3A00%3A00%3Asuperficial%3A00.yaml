simpleMeaning: Showing shallow or casual interest, or the limited skill of an amateur.
scope: Also called dilettante, dilettantish, and sciolistic, this is not about deep study or real skill.
examples:
- Their dilettanteish interest in music never went past a few songs.
- The dilettanteish talk about art showed no wish to learn more.
