simpleMeaning: A solid with six faces, each a parallelogram, a four-sided shape with opposite sides parallel.
scope: Also called a parallelepipedon, a parallelopipedon, or a parallelopiped. It is a solid.
examples:
- The box was shaped like a parallelepiped, with flat faces on all sides.
- They drew a parallelepiped to show the shape of the crystal.
