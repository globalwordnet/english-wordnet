simpleMeaning: A walker whose feet fall heavy, each step taken with great effort.
scope: This word names a walker whose feet fall heavy, also called a plodder or a trudger, and not the
  boxer of the same name.
examples:
- The slogger walked on, one heavy step at a time.
- The slogger came on, one heavy step at a time.
