senseId: 'scauper%1:06:00::'
synsetId: 04151716-n
simpleMeaning: It is the cutting tool that hollows out wide spaces as wood or metal is carved.
scope: Also called scorper, it is the tool for wide spaces, not a fine tool for thin lines.
examples:
- The scauper hollowed out a wide space in the block of wood.
- A wide space in the metal plate was hollowed out with a scauper.
