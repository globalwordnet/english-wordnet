simpleMeaning: 'Two parts joined together make this truck: a front part that pulls and a back part that
  carries the load.'
scope: Also called semi, rig, articulated lorry, trailer truck, and trucking rig, this is a truck in two
  joined parts, not a truck made in a single piece.
examples:
- The tractor trailer pulled into the yard with a full load.
- The tractor trailer's back part was loaded while its front part waited.
