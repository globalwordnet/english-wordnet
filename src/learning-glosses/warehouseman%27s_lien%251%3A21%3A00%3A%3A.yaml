simpleMeaning: The person who runs a storehouse may keep goods there until all the charges for keeping
  them are paid.
scope: This right covers goods kept for storage charges that are still unpaid, not goods kept for good.
examples:
- The warehouseman's lien let them hold the crates until the storage bill was paid.
- They could not get their goods back until they had paid, because of the warehouseman's lien.
