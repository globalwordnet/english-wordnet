simpleMeaning: A woody plant of the eastern United States that grows close to the ground and has twigs
  with a coat of fine, soft hairs.
scope: Also called minnie bush, or by its Latin name Menziesia pilosa.
examples:
- The minniebush by the trail had twigs soft to the touch.
- A minniebush grew at the edge of the field.
