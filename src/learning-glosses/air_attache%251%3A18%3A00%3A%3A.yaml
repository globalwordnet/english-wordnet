simpleMeaning: A military attache of officer rank, commissioned or warrant, serving in the part of the
  armed forces that flies planes.
scope: This one does not serve in the army or the navy.
examples:
- The air attache met the foreign minister to discuss the new planes.
- The air attache wore the uniform of an officer in the air force.
