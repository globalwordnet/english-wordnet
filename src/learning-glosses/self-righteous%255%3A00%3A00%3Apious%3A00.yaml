simpleMeaning: Far too sure that one is good, or putting on a show of goodness while hiding worse aims.
scope: Also called sanctimonious, holier-than-thou, pharisaic, pharisaical, pietistic, and pietistical.
  It is an adjective.
examples:
- A self-righteous tone put the whole room off.
- They spoke in a self-righteous way about the faults of others.
