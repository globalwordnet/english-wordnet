simpleMeaning: A hairy perennial with branched clusters of yellow flower heads, widespread in dry areas
  from Canada to the west-central and western United States. Some classifications place it in Chrysopsis.
scope: Also called hairy golden aster, this hairy plant with yellow flower heads in branching bunches
  grows in dry ground across much of North America.
examples:
- Dry ground suits the prairie golden aster.
- The prairie golden aster bears yellow flower heads in branching bunches.
