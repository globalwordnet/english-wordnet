simpleMeaning: The steady beat of a clock, one short sound after another.
scope: Also called ticktock and tictac, this is the sound of a clock going, not one sound on its own.
examples:
- They lay awake listening to the tocktact of the clock.
- They counted the tocktact as the clock ran on.
