simpleMeaning: A bean or lentil that has begun to sprout, especially a mung bean, lentil or edible soybean.
scope: This is the sense of young plants grown from seeds, one of many kinds, above all mung seeds, lentils,
  or soy seeds fit to eat.
examples:
- The bean sprouts grew from mung seeds.
- Bean sprouts grow from lentils as well as from mung seeds.
