simpleMeaning: An acrobatic move in which the body rolls all the way over, forward or backward, with the
  feet passing over the head.
scope: It is also called a flip, a somersault, somersaulting, a somerset or a summerset.
examples:
- The clown did a summersault and the crowd cheered.
- The gymnast practised a summersault on the mat each day.
