simpleMeaning: A trick meant to fool others and win an advantage for the person who planned it.
scope: Also called fraud, hoax, humbug, fraudulence, or dupery. It is a trick.
examples:
- The whole story was a put-on to get their money.
- They saw through the put-on at once.
