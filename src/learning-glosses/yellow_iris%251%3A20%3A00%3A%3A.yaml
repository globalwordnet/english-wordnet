simpleMeaning: A common yellow-flowered iris native to Europe and North Africa, widely grown in gardens
  and established in the wild in the United States.
scope: A common bright-gold flowered plant, also called yellow flag and yellow water flag; not a white
  iris and not a garden lily.
examples:
- The yellow iris by the stream blooms in late spring.
- Yellow iris is often grown in gardens.
