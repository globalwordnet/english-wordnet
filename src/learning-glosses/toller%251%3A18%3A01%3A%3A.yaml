simpleMeaning: This person rings the church's bells so the church's people come together.
scope: Also called a ringer and a bell ringer, this is the person who sounds the church bells, not one
  who takes money from travellers.
examples:
- The toller rang the church bells to call the church's people together.
- People hurried to church when they heard the toller ringing the bells.
