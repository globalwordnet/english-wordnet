simpleMeaning: A singer, usually a woman, who specializes in sad songs about lost or unreturned love.
scope: This person is not one who sings every kind of song, but one who gives most of their singing to
  one kind.
examples:
- The torch singer sang the same kind of song all evening.
- They only ever heard the torch singer sing that one kind of song.
