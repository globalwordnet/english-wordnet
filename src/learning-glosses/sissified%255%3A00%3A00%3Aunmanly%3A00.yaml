simpleMeaning: An insulting way to describe a boy or man whose behavior someone considers too feminine.
scope: Also called sissy, emasculate, effeminate, epicene, cissy, and sissyish. It is an adjective.
examples:
- They called the new student sissified for liking dolls.
- The other children teased them as sissified.
