simpleMeaning: An animal other than a bird or mammal whose body temperature changes with the temperature
  around it.
scope: The word can describe cold-blooded animals. Some birds and mammals also show heterothermy.
examples:
- The lizard is heterothermic, so its body cools on a cold night.
- Heterothermic animals warm up again when the sun comes out.
