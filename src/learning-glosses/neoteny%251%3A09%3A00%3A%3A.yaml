senseId: 'neoteny%1:09:00::'
synsetId: 06207818-n
simpleMeaning: An evolutionary change in which adults keep features of their young because some parts
  of the body develop more slowly.
scope: The animal reaches reproductive maturity while keeping juvenile features.
examples:
- 'The axolotl shows neoteny: it keeps its young gills as a grown animal.'
- Through neoteny, the species keeps the looks of its young into adult life.
