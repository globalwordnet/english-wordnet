simpleMeaning: The leaves of the shrub Catha edulis, chewed like tobacco or brewed as tea. They act as
  a stimulant and can produce intense happiness.
scope: 'Also called cat, khat, qat and quat: these leaves chewed or made into tea, not the bush itself
  and not tobacco.'
examples:
- In Yemen, many adults chew kat every day.
- She made tea from kat leaves.
