simpleMeaning: An antibiotic taken by mouth to treat bacterial infections, combining the semisynthetic
  penicillin amoxicillin with clavulanate.
scope: Also called amoxicillin, Amoxil, Larotid, Polymox, and Trimox; a drug taken by mouth that kills
  bacteria, not a drug rubbed on the skin and not a drug that kills viruses.
examples:
- The doctor gave her Augmentin for the bacterial infection.
- Augmentin is taken by mouth to fight a bacterial infection.
