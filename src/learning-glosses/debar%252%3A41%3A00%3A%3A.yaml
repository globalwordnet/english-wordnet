simpleMeaning: To stop something before it happens, and to keep anything bad away.
scope: This one is also called avoid, avert, deflect, obviate, fend off, forefend, forfend, head off,
  stave off, and ward off.
examples:
- The new rules debar visitors from entering the club at night.
- They took steps to debar another strike.
