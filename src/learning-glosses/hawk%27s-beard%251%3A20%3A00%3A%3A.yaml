simpleMeaning: Any of several Northern Hemisphere plants of the genus Crepis with loose clusters of yellow
  flowers atop a long, branching, leafy stem.
scope: Also called hawk's-beards, it is one of several kinds in the group Crepis, and hawkweed is a different
  plant.
examples:
- We found hawk's-beard with loose heads of yellow flowers on top of long leafy stems.
- Each hawk's-beard plant bore loose heads of yellow flowers.
