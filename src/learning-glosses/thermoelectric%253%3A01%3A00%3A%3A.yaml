simpleMeaning: To do with heat turning into the power in wires, or the power in wires turning into heat.
scope: Also called thermoelectrical. It is not about heat alone.
examples:
- A thermoelectric device turns waste heat into the power in wires.
- The thermoelectric plate grew cold when the power in wires ran through it.
