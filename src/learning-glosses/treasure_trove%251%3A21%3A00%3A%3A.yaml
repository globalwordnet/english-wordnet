simpleMeaning: This treasure was found hidden, and no one knows who owns it, most often buried in the
  ground.
scope: Also called a trove, this is a hidden thing found with no one to claim it, not a find with a known
  owner.
examples:
- They found a treasure trove buried in the ground.
- No one knew who owned the treasure trove they had found.
