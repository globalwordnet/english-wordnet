simpleMeaning: In wrestling, the other person's body or head is caught between legs that have closed round
  it, feet together, pressing in hard.
scope: This is also called scissors, scissor grip, scissor hold and scissors grip, and it traps the other
  person with the legs alone.
examples:
- The wrestler caught the other in a scissors hold.
- A scissors hold held the other wrestler fast.
