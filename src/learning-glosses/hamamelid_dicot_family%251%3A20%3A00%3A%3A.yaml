simpleMeaning: A family of mostly woody flowering plants with two seed leaves. Their flowers often have
  only one sex and often grow in narrow clusters called catkins.
scope: This group holds mostly woody plants with two seed leaves, whose flowers are often of one sex only
  and often grow in hanging clusters.
examples:
- The hamamelid dicot family is a group of mostly woody plants.
- Many plants of the hamamelid dicot family bear flowers of one sex only.
