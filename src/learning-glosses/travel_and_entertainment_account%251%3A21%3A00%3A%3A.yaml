simpleMeaning: An account used by salespeople or executives to charge business travel and entertainment
  costs.
scope: Also called an expense account, this is a work record for costs charged by salespeople or top staff.
examples:
- They put the hotel bill on the travel and entertainment account after the sales trip.
- They checked the travel and entertainment account to see what the trip had cost.
