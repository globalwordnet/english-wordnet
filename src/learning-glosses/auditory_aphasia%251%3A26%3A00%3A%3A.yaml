senseId: 'auditory_aphasia%1:26:00::'
synsetId: 14121375-n
simpleMeaning: A person hears spoken language but cannot follow what it means, and the trouble is not
  that their hearing has failed.
scope: Also called acoustic aphasia and word deafness, this one is not about losing the sense of hearing.
examples:
- With auditory aphasia, they could not follow spoken language, even though their hearing was fine.
- The therapist worked with them on auditory aphasia, helping them make sense of words they heard.
