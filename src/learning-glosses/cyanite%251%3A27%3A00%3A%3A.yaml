simpleMeaning: A gray or greenish-blue mineral made of crystalline aluminum silicate. It occurs in metamorphic
  rock and is used in materials that withstand high temperatures.
scope: This sense is also called kyanite, a grey or green-blue stone of glassy aluminium silicate, found
  in changed rock, used where heat must be borne.
examples:
- Cyanites bear great heat.
- The cyanite is grey or green-blue.
