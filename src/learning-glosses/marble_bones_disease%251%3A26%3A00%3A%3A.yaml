senseId: 'marble_bones_disease%1:26:00::'
synsetId: 14233601-n
simpleMeaning: An inherited disorder that makes bones unusually dense and sometimes brittle. In severe
  cases, bone can fill the space where marrow normally forms blood cells.
scope: Also called osteopetrosis. Bone density and bone strength are different properties.
examples:
- The scan revealed unusually dense bones consistent with marble bones disease.
- In severe marble bones disease, little space may remain for bone marrow.
