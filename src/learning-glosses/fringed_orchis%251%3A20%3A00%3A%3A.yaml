simpleMeaning: An American orchid that flowers in summer and has a distinctive lower petal with a fringed
  or deeply cut edge.
scope: Also called a fringed orchid, this names an American plant of one of several kinds that bloom in
  summer, with a lip whose edge is cut or torn.
examples:
- The fringed orchis stood among the tall grass.
- Fringed orchis blooms in summer near the marsh.
