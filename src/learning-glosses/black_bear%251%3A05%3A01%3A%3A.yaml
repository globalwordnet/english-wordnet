simpleMeaning: A wild animal of North America, from the colour of wood to the colour of coal, smaller
  and less fierce than its big brown relative.
scope: Also called American black bear. It is not the Asian kind.
examples:
- A black bear crossed the road in the Canadian woods.
- They watched a black bear catch fish in an Alaskan stream.
