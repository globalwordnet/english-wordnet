simpleMeaning: An annual herb from Kashmir in the Himalayas, with small purple flowers and a fragrant
  root whose oil evaporates readily and is used in perfumes and to preserve furs.
scope: Also called costusroot and Saussurea lappa; not a shrub.
examples:
- The Saussurea costus grew purple flowers in Kashmir.
- Perfumers prize the fragrant root of Saussurea costus.
