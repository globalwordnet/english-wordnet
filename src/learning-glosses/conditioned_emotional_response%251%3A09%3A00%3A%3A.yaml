simpleMeaning: A feeling that has been learned because it was paired with something else again and again.
scope: Also called conditioned emotion. It is about a feeling.
examples:
- The dog showed a conditioned emotional response when it heard the bell.
- The conditioned emotional response made the child jump each time the bell rang.
