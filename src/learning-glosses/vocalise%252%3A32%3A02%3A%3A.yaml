senseId: 'vocalise%2:32:02::'
synsetId: 00954214-v
simpleMeaning: You let the folds in your throat shake as you speak out loud.
scope: This is also called voice, sound, or vocalize, and it is not singing notes on one vowel.
examples:
- The teacher asked the class to vocalise each word slowly so every sound could be heard.
- They vocalised the words instead of whispering them, so everyone could hear.
