simpleMeaning: Said of a view or a judgement that is plainly mistaken and yet held on to with stubborn
  refusal to change.
scope: It is about a judgement or an opinion.
examples:
- They kept to a wrongheaded policy even after the facts showed it was failing.
- A wrongheaded view of the problem turned every talk into a quarrel.
