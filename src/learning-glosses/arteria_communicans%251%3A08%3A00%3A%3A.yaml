simpleMeaning: Any one of three blood vessels in the brain that join to form a ring.
scope: Also called communicating artery, this one is not a vessel that stands on its own.
examples:
- The arteria communicans joined the other two to form a ring in the brain.
- They found the arteria communicans where the ring of vessels meets.
