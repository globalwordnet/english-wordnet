simpleMeaning: Two pieces of wood join when this part, sticking out from the end of one piece, fits into
  a slot cut in the other.
scope: This is the part that sticks out, not the slot it fits into.
examples:
- The tenon at the end of the board fit into the slot.
- They cut a tenon to join the two pieces of wood.
