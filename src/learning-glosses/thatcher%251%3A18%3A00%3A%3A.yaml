simpleMeaning: Covering roofs with plant stalks or leaves is the work this person is good at.
scope: It names the person who puts plant stalks or leaves on a roof, not someone who builds roofs of
  any kind.
examples:
- They hired a thatcher to cover the roof with straw.
- The thatcher laid stalks and leaves over the roof.
