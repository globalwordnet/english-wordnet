schema: oewn-learning-gloss-v2
senseId: 'ossification%1:22:01::'
synsetId: 13550055-n
simpleMeaning: The process by which a person's way of thinking or acting becomes fixed in the usual pattern
  and stops changing.
scope: It is not the forming of bone in a growing body, and not the hardening of soft tissue into bone.
examples:
- Their ossification showed in the way they refused every new idea.
- The ossification of their thinking made change hard to accept.
