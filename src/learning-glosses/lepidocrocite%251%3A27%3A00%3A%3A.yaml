simpleMeaning: A red to reddish-brown mineral made of iron oxide hydroxide, often found alongside goethite
  in iron ores.
scope: In iron rock, goethite's rust-red neighbour is a mineral of iron joined with oxygen and hydrogen.
examples:
- Lepidocrocite was among the minerals in the iron ore sample.
- The rust-red grains beside the goethite were lepidocrocite.
