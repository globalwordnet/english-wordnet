simpleMeaning: The branch of mathematics that develops step-by-step methods for finding approximate solutions
  to problems, including problems in calculus.
scope: In mathematics, the part of the subject that works out near answers by steps to problems about
  things that change bit by bit.
examples:
- They used numerical analysis on the problem.
- She used numerical analysis to work out the problem step by step.
