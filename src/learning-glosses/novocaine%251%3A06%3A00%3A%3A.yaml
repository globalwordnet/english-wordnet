simpleMeaning: Procaine hydrochloride, a local anesthetic sold under the name Novocain.
scope: A drug also called procaine hydrochloride; not a drug that puts the whole body to sleep and not
  a painkiller taken by mouth.
examples:
- The dentist gave her a shot of novocaine before filling the tooth.
- Novocaine numbed his jaw while the dentist worked.
