simpleMeaning: A lot of room to move around in, above all inside a building.
scope: Spaciousness, capaciousness, and roominess are other names for this thing.
examples:
- The commodiousness of the hall surprised us; there was room for everyone to move around.
- They praised the commodiousness of the new library, with its wide halls and open rooms.
