senseId: 'intensifier%1:10:00::'
synsetId: 06332047-n
simpleMeaning: A modifier that adds hardly any sense of its own, used only to make the word it goes with
  stronger.
scope: It is also called an intensive.
examples:
- The student kept adding intensifiers like 'very' and 'really' to the praise.
- The speech was full of intensifiers, but it said very little.
