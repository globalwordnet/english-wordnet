simpleMeaning: A tall palm from northern Brazil with featherlike leaves and hard-shelled nuts that yield
  valuable oil and a hard, ivorylike plant material.
scope: This sense is also called babassu and babassu palm, a lofty feather palm from the north of Brazil,
  its hard nuts yield fine oil with some veggie ivory.
examples:
- Coco de macao nuts yield rich oil.
- The coco de macao grows in north Brazil.
