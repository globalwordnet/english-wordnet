simpleMeaning: A written order to pay, drawn up by a bank on money held for it by a different bank.
scope: Also called a bank draft, this is one kind of written order to pay.
examples:
- They paid the bill with a banker's draft from their bank.
- The shop took the banker's draft and gave them the goods.
