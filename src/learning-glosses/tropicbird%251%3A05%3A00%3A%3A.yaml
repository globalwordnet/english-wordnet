simpleMeaning: A winged animal of the sea, mostly white, with skin joining its toes, living in warm seas
  and often found a long way from land.
scope: Boatswain bird and tropic bird are other names for it.
examples:
- The tropicbird flew far from land over the open sea.
- We watched a tropicbird with white feathers glide above the waves.
