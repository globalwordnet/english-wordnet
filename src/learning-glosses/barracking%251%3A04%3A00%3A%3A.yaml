simpleMeaning: People shout at a speaker to cut them off when they do not agree with what is said.
scope: Also called heckling, this one names a kind of shouting.
examples:
- The crowd kept barracking the minister until they gave up trying to speak.
- They started barracking as soon as the speaker mentioned the new tax.
