simpleMeaning: A big sign of the alphabet that begins a proper name when it is written or printed, used
  now and then to lend a word force.
scope: Also called capital, capital letter, majuscule, and uppercase. It is a kind of written sign.
examples:
- The first word of the sentence starts with an upper-case letter.
- Write your name with an upper-case letter at the start.
