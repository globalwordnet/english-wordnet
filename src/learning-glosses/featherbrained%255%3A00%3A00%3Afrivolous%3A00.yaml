simpleMeaning: Lacking any sense of what is serious, and ready to turn to play and laughter.
scope: This one is also called silly, dizzy, giddy, lightheaded, airheaded, empty-headed, and light-headed.
examples:
- The featherbrained student giggled through the whole lesson.
- Their featherbrained remarks made it hard to take the meeting seriously.
