senseId: 'telophase%1:22:02::'
synsetId: 13587244-n
simpleMeaning: The last step of meiosis, the splitting of a cell, when the strands inside it move toward
  opposite ends of the frame that pulls them apart.
scope: This is the last step of meiosis, not an early one.
examples:
- By telophase, the strands had moved to opposite ends.
- The cell had nearly finished splitting by telophase.
