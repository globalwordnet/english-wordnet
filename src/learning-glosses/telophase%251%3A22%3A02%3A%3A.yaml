synsetId: 13587244-n
simpleMeaning: The final stage of a meiotic division, when chromosomes reach opposite ends of the spindle
  and new nuclei usually form.
scope: This is the last step of meiosis, not an early one.
examples:
- By telophase, the strands had moved to opposite ends.
- The cell had nearly finished splitting by telophase.
