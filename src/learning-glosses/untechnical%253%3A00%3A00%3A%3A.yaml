simpleMeaning: Said of a person or a thing that shows no knowledge of the practical arts and sciences,
  and no skill in them.
scope: Also called nontechnical. It is said of people or things.
examples:
- An untechnical reader needs plain words, not hard terms.
- The untechnical guide used plain words for the new machine.
