simpleMeaning: A temperature taken on the scale that begins where nothing can be colder.
scope: This one is not measured from a point part-way up the scale.
examples:
- They worked out the absolute temperature of the gas, counting up from the coldest point there is.
- The absolute temperature of the liquid was 280, counted from the very bottom of the scale.
