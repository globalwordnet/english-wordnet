simpleMeaning: Show this person a sign, and they can work out what it means and put that meaning across
  to others.
scope: This is a person who works out what signs mean and puts the meaning across, also called symbolist
  or symbolizer.
examples:
- The symboliser read the signs and told us what they meant.
- The students asked the symboliser to explain the signs.
