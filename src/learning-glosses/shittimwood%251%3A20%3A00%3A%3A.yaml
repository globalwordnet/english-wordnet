simpleMeaning: Builders of the ark — the holy chest kept in the tent where the Hebrews worshipped — used
  timber from the tree the Bible names.
scope: This timber came from the tree, not the tree itself, and went into building the ark.
examples:
- The ark was built of shittimwood.
- They chose shittimwood for the ark.
