simpleMeaning: The way the parts on the face of a computer's hard disk are laid out so the operating system
  can reach them, with a set starting point.
scope: It is also called initialization and low-level formatting.
examples:
- The technician began the initialisation of the new hard disk.
- The initialisation of the disk took only a few minutes.
