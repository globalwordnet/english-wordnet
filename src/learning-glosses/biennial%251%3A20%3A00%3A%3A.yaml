senseId: 'biennial%1:20:00::'
synsetId: 11573427-n
simpleMeaning: A plant that usually lives for two growing seasons from sprouting to death. Flowering kinds
  usually bloom and produce fruit in the second season.
scope: In botany, a two-season plant, not a plant that lives one season and not one that lives many years.
examples:
- The gardener grew biennials that would flower next year.
- A biennial takes two seasons from seed to death.
