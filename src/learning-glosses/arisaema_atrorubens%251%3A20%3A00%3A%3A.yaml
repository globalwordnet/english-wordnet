simpleMeaning: A common American woodland plant flowering in spring, with stem-sheathing leaves, an upright
  club-shaped flower spike beneath a green and purple hood, and scarlet berries.
scope: Also called jack-in-the-pulpit, wake-robin, Arisaema triphyllum, and Indian turnip; an American
  woodland plant with a club-shaped flower spike, not a tall shrub and not a garden flower with plain
  round leaves.
examples:
- Arisaema atrorubens grows in the damp woods in spring.
- The scarlet berries of Arisaema atrorubens ripen in late summer.
