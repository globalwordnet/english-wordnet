simpleMeaning: In a loud, showy way that shows bad taste.
scope: Also called garishly and gaudily. It describes the manner of an act.
examples:
- They dressed tawdrily, in clashing colours and cheap gold jewellery.
- They painted the shop front tawdrily, with bright pink and orange signs.
