simpleMeaning: A mix of a poison and the stuff that fights it, given to guard against a disease.
scope: This is a mix that guards against a disease, not a cure for a disease already there.
examples:
- They gave them toxin antitoxin before the disease could start.
- They were given toxin antitoxin to guard them against the disease.
