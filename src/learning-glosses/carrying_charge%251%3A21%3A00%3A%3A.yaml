simpleMeaning: A fee for keeping an account going, or for goods sold and paid for bit by bit over time.
scope: This one is about a fee, not about the cost of owning things that earn nothing.
examples:
- The bank added a carrying charge to the account.
- They asked why a carrying charge appeared on the bill.
