synsetId: 13455579-n
simpleMeaning: The gradual change in which a consonant, a speech sound made by closing off the air for
  a moment, turns into a hissing sound.
scope: This one is not the other sense of this word, which is about a hiss in the way a word is said.
examples:
- Over time, assibilation can turn a hard 't' sound into a hissing 's' sound.
- In the dialect, assibilation turned every 'k' before 'i' into a hissing sound.
