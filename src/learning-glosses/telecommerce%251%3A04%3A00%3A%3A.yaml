simpleMeaning: Goods are promoted and sold through phone calls that let buyer and seller talk back and
  forth.
scope: This is also called telemarketing or teleselling, and it is selling done over the phone, not face
  to face.
examples:
- Many firms use telecommerce to reach buyers far away.
- Small firms use telecommerce to tell buyers about new goods.
