senseId: 'repulsor%1:06:01::'
synsetId: 92463847-n
simpleMeaning: A made-up device from the Star Wars stories that lets a craft float up off the ground,
  free of gravity's pull.
scope: A repulsorlift and a repulsorlift engine are other names for it, and it belongs to the Star Wars
  stories, not the drives in the gloves of the Iron Man stories.
examples:
- The repulsor kept the craft floating just above the ground.
- Without a repulsor, the vehicle could not rise into the air.
