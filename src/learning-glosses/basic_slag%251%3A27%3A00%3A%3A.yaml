simpleMeaning: A byproduct of steelmaking that contains little silica and a large amount of calcium phosphate.
  It can be used as fertilizer.
scope: This is the left-over stuff from steel-making that farmers spread on fields to feed plants.
examples:
- The farmer spread basic slag on the field to feed the crop.
- The steel works' basic slag helped the poor soil grow.
