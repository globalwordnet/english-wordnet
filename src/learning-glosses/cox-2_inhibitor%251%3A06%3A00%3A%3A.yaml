simpleMeaning: An anti-inflammatory pain medicine that blocks Cox-2 while leaving Cox-1 active. It increases
  the risk of heart attacks.
scope: This is a drug that fights swelling and pain by blocking one body chemical and not a second one;
  near kinds are other drugs that fight pain and swelling in other ways.
examples:
- A Cox-2 inhibitor eased the pain in her joints.
- Cox-2 inhibitors fight swelling without blocking a second body chemical.
