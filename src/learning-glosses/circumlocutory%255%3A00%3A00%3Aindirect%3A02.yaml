senseId: circumlocutory%5:00:00:indirect:02
synsetId: 00771186-s
simpleMeaning: Describing speech or writing that takes a long way round, using many more words than are
  needed.
scope: Ambagious, circumlocutious and periphrastic are other names for this one.
examples:
- The circumlocutory reply took five minutes to say yes.
- They asked a plain question and got a circumlocutory answer that went on for pages.
