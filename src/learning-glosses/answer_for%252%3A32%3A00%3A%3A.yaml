simpleMeaning: To put forward reasons that make what was done seem right.
scope: Also called account, this word puts forward reasons in favour of what was done, not blame against
  the doer.
examples:
- The manager had to answer for the missing money at the meeting.
- They will answer for the delay with a full report on what went wrong.
