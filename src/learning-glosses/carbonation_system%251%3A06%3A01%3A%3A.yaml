simpleMeaning: Automatic equipment that carbonates large volumes of liquid, using a carbonator, a tube
  supplying carbon dioxide, a holding tank, and a transfer pump.
scope: A set-up that adds fizz to products in large amounts, not a hand tool for opening bottles.
examples:
- The factory uses a carbonation system to add fizz to its drinks.
- A carbonation system can fill hundreds of bottles an hour.
