schema: oewn-learning-gloss-v2
senseId: 'satisfice%2:41:00::'
synsetId: 02374122-v
simpleMeaning: To choose and pursue an option that meets a goal's minimum requirements, without searching
  further for a better option.
scope: Also called satisfise, it stops at the first plan that works instead of seeking the best plan of
  all.
examples:
- We will satisfice and take the first plan that meets the goal.
- The team decided to satisfice and follow the plan that was good enough.
