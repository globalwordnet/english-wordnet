senseId: 'synchronic%3:00:00::'
synsetId: 02385754-a
simpleMeaning: Looking at things, especially language, as they are at one time, without asking how they
  came to be.
scope: It does not describe kinds of living things from the same stretch of the earth's past.
examples:
- In the course on synchronic linguistics, students look at how the language works today.
- A synchronic study of the town's speech looks at how people talk now, not at how the speech grew over
  the years.
