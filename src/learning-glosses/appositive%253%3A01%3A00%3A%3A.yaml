senseId: 'appositive%3:01:00::'
synsetId: 02646592-a
simpleMeaning: Said of a noun or a phrase that stands beside another noun and names the same person or
  thing.
scope: Also called appositional. It is said of nouns and phrases.
examples:
- The word 'doctor' in 'my friend the doctor' is an appositive noun.
- An appositive phrase gives more detail about the noun it stands beside.
