senseId: 'apothegmatic%3:01:00::'
synsetId: 02645872-a
simpleMeaning: Describing a person who fills their talk with short, wise sayings.
scope: Also called apothegmatical, this one is about a person, not about a saying that is itself short
  and witty, which is the other sense of this word.
examples:
- The apothegmatic teacher always had a short, wise saying ready for every occasion.
- They admired the apothegmatic way the speaker talked, always in short, wise sayings.
