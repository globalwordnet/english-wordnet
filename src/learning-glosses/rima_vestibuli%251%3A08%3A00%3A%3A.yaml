simpleMeaning: A gap in the throat between two folds of tissue that stay quiet while a person speaks.
scope: Also called false glottis, glottis spuria, and rima respiratoria. It is an opening.
examples:
- The rima vestibuli appears in the drawing of the throat.
- The doctor pointed to the rima vestibuli during the examination.
