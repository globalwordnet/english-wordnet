simpleMeaning: Found in a place that is neither very wet nor very dry, or suited to such a place.
scope: It is used of plants and of the places where plants grow.
examples:
- These mesophytic plants grow well in the garden soil.
- We found mesophytic habitats along the river, between the marsh and the dry field.
