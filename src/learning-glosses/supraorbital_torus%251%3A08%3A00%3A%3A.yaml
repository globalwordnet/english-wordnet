simpleMeaning: A thick, rounded, raised band of bone sits just above the eye socket, on the forehead.
scope: This thick band of bone is also called superciliary arch or superciliary ridge, and supraorbital
  ridge is another name for it.
examples:
- The skull showed a strong supraorbital torus above each eye.
- They measured the supraorbital torus on the old skull.
