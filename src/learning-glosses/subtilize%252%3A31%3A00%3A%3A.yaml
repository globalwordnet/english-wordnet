senseId: 'subtilize%2:31:00::'
synsetId: 00651886-v
simpleMeaning: To point out very small differences between things, as between words.
scope: It is not about making a thing smaller, and it is not about sorting things by size.
examples:
- They subtilized the two words until the small difference in meaning was clear.
- The writer subtilized the two ideas to show they were not quite the same.
