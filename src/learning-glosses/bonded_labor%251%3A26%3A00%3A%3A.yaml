simpleMeaning: Workers take loans at high interest from bosses, and their whole families then work for
  low pay to clear the debt; the United States forbids this way of working.
scope: This one is about a way of working.
examples:
- Whole families were caught in bonded labor.
- They campaigned against bonded labor in the villages.
