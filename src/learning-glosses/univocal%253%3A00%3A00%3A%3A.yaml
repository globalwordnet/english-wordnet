schema: oewn-learning-gloss-v2
senseId: 'univocal%3:00:00::'
synsetId: 00899848-a
simpleMeaning: It can be read in one way only, so no one doubts it or takes it wrongly, and it leads to
  one answer.
scope: Also called unambiguous and unequivocal, this is a word with only one meaning, not one that can
  be taken two ways.
examples:
- The univocal answer left no room for doubt.
- The univocal statement pointed to one answer and one only.
