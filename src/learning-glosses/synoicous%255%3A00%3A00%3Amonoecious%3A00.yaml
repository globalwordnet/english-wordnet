simpleMeaning: Of a plant where the male and the female parts for making new plants sit mixed in a single
  group.
scope: This word marks a plant whose male and female parts for making new plants share one group, also
  called synoecious.
examples:
- The plant was synoicous, with both kinds of parts for making new plants tangled together in one group.
- The gardener found the plant synoicous, with male and female parts in one shared group.
