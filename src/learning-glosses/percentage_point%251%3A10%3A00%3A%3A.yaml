simpleMeaning: The dot that stands just before the figures of a number that show a part of one.
scope: Also called point or decimal point. It is a mark, not a figure.
examples:
- I missed the percentage point and read 5 instead of 0.5.
- The student put the percentage point in the wrong place and the sum came out ten times too big.
