simpleMeaning: It is how things go, for people and for events, more often than not.
scope: People also call this the way of the world, and it is about everyday behaviour and everyday happenings.
examples:
- He was amazingly innocent of the ways of the world.
- She was well-versed in the ways of the world before she had taken the veil.
