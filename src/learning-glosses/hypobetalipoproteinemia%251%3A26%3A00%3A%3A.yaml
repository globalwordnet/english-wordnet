senseId: 'hypobetalipoproteinemia%1:26:00::'
synsetId: 14182294-n
simpleMeaning: An inherited disorder in which blood levels of beta-lipoproteins, the particles that carry
  certain fats, are unusually low, along with levels of fats and cholesterol.
scope: Blood holding too little fat-carrying matter and cholesterol marks this inherited condition, not
  blood holding too much.
examples:
- Hypobetalipoproteinemia meant the blood held too little cholesterol.
- Hypobetalipoproteinemia runs in families.
