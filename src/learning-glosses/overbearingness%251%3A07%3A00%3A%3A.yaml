senseId: 'overbearingness%1:07:00::'
synsetId: 04895983-n
simpleMeaning: The trait of telling other people what to do as if one ruled them, and of acting as if
  what they want does not matter.
scope: It is also called domineeringness and imperiousness.
examples:
- The overbearingness of the new boss made everyone at the table fall silent.
- They complained about the overbearingness of the new boss, who acted as if every order had to be obeyed
  at once.
