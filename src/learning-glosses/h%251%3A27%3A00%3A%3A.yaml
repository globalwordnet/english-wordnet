simpleMeaning: Hydrogen, the simplest, lightest and most abundant element in the universe. This nonmetal
  forms one bond and normally occurs as a colorless, odorless, highly flammable gas of two-atom molecules.
scope: This is the light gas, not the fixed number in physics, the unit of inductance, or the 8th letter,
  and it is also called hydrogen and atomic number 1.
examples:
- H burns fast in air.
- H is the lightest of all the gases.
