simpleMeaning: This is how a transitive verb ties itself to its object in grammar.
scope: Transitiveness is another name for this sense, which is about grammar, not the logic rule where
  a relation passes from one thing to another through a third.
examples:
- The transitivity of 'catch' shows in 'They caught the ball'.
- The transitivity of 'hit' means it must take an object.
