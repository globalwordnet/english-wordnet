simpleMeaning: The cheating act of taking money or goods that someone left in your care, though they belong
  to someone else.
scope: Also called embezzlement, defalcation, misappropriation, or misapplication. It is an act.
examples:
- The treasurer was charged with peculation after the audit.
- Peculation by the clerk left the fund empty.
