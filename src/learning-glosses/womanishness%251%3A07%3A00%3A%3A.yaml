simpleMeaning: The trait of a man acting in ways people see as too feminine, spoken of with scorn.
scope: Also called softness, unmanliness, effeminacy, effeminateness, and sissiness. It is a trait.
examples:
- Classmates mocked the boy's womanishness at every chance.
- The old book used womanishness as an insult for a gentle man.
