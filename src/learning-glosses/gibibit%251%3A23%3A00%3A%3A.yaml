simpleMeaning: A unit of computer information, 1,024 lots of 2 to the power of 20 binary digits, or 2
  to the power of 30, that is, 1,073,741,824 binary digits.
scope: This sense is also called Gibit.
examples:
- The file was just over one gibibit in size.
- The video was nearly three gibibits in size.
