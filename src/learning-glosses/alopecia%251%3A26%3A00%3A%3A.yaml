simpleMeaning: Loss of hair, especially on the head, or loss of wool or feathers. Human causes include
  heredity, hormone imbalance, disease, medicines, and treatments such as chemotherapy.
scope: Of loss of hair on the head, or of wool or feathers, coming after a cure.
examples:
- Their alopecia thinned the hair.
- The alopecia came after the cure.
