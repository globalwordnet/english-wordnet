simpleMeaning: A sturdy perennial herb of the western United States with drooping orange-yellow outer
  florets that causes a vomiting illness called spewing sickness in sheep.
scope: 'Also called orange sneezeweed and owlclaws: a stout plant of the west of the United States with
  drooping orange-yellow flower heads, which makes sheep sick to the stomach.'
examples:
- Helenium hoopesii grows in the west with drooping orange-yellow flowers.
- Sheep that eat Helenium hoopesii grow sick.
