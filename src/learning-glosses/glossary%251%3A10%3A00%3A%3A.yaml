simpleMeaning: An alphabetical list explaining the special terms used in a subject, usually at the end
  of a text about that subject.
scope: This sense is also called a gloss, for a letter-ordered list of hard words in one field of lore,
  usually printed at a book's back.
examples:
- The glossary lists hard words.
- Glossaries list hard words in one field.
