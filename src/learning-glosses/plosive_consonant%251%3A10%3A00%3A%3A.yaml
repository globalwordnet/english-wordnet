senseId: 'plosive_consonant%1:10:00::'
synsetId: 07130622-n
simpleMeaning: A speech sound made by holding the air back at one place and then letting it out all at
  once.
scope: Also called a stop, a plosive, an occlusive, a plosive speech sound, or a stop consonant. It is
  a speech sound.
examples:
- The first consonant in 'pin' is a plosive consonant.
- The plosive consonant came out with a short burst of air.
