simpleMeaning: One of several immune signaling proteins that stimulate macrophages, killer T cells, B
  cells, and other parts of the immune system.
scope: These signals from the body stir up its germ-fighting cells and other parts of its defence system.
examples:
- The interleukin helped the body's defences wake up.
- The interleukin was found in her blood.
