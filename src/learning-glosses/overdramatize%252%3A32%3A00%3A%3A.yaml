simpleMeaning: To make something seem far more stirring or distressing than it truly is.
scope: It is also called overdramatise.
examples:
- They overdramatized the delay, acting as if the whole trip were ruined.
- The speaker overdramatized every point, raising a hand to the forehead at the smallest surprise.
