simpleMeaning: Glass you can see through, with no colour at all, formed almost wholly from the hard white
  stuff that makes up sand.
scope: Also called crystal, quartz, lechatelierite, and quartz glass. It is a kind of glass.
examples:
- The dish was made of vitreous silica.
- Vitreous silica looks like plain glass.
