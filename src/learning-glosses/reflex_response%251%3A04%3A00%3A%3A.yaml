senseId: 'reflex_response%1:04:00::'
synsetId: 00865191-n
simpleMeaning: Too fast for thought and needing no practice, the body answers a touch or startle on its
  own.
scope: This is also called reflex, inborn reflex, innate reflex, instinctive reflex, physiological reaction,
  reflex action and unconditioned reflex.
examples:
- The reflex response to the hot plate was to pull the hand back at once.
- A blink at the bright flash was a reflex response, quick and without thought.
