simpleMeaning: A rhythm used in poetry about heroes or other grand subjects, especially dactylic hexameter,
  with six metrical feet per line, or iambic pentameter, with five.
scope: Also called heroic and heroic meter, this is a verse form for great deeds, not free verse with
  no set beat.
examples:
- He read the tale aloud in heroic verse.
- Heroic verse gives the battle a grand sound.
