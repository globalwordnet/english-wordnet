simpleMeaning: To clear dirt from a thing by covering it with water or another liquid, and soap or a cleaner
  of another kind.
scope: Also called wash, wash away, and wash off. It is a cleaning act, not a way of freeing a thing from
  unwanted matter.
examples:
- He managed to wash out the stains.
- They washed out the coffee cups before putting them away.
