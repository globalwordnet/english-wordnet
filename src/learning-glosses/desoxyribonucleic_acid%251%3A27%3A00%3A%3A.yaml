simpleMeaning: DNA, the molecule that carries inherited information. It is made of chains of nucleotides,
  usually two strands twisted around each other, and is found in the cell nucleus.
scope: Also called deoxyribonucleic acid; not other long chains found in a cell.
examples:
- Desoxyribonucleic acid carries the instructions that make a living thing what it is.
- Scientists study desoxyribonucleic acid to learn how traits pass from parent to child.
