simpleMeaning: Showing childlike trust and a readiness to believe what others say.
scope: This is also called simple, childlike, dewy-eyed, and round-eyed, and it is not a clever or doubting
  way of looking at things.
examples:
- They listened with wide-eyed wonder to the story, believing every word of it.
- The wide-eyed child trusted the stranger at once.
