schema: oewn-learning-gloss-v2
senseId: 'determiner%1:09:00::'
synsetId: 05700384-n
simpleMeaning: A thing that fixes how something turns out, or helps to cause it.
scope: This one is also called determinant, determinative, causal factor, and determining factor, but
  it is not the grammar sense, about words like 'the' that come before a noun.
examples:
- Good soil is a determiner of how well the crops grow.
- The amount of rain was a determiner of the size of the harvest.
