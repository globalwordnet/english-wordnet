senseId: 'safety-deposit%1:06:00::'
synsetId: 04132358-n
simpleMeaning: A place for things of great worth, locked in a strong metal box that fire cannot harm,
  kept most often in a bank.
scope: It locks things of great worth away from fire, also called a lockbox, a deposit box, a safe-deposit,
  a safe-deposit box, or a safety deposit box.
examples:
- The safety-deposit at the bank held the coins and the deeds.
- The safety-deposit kept the deeds safe through the fire.
