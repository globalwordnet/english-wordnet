simpleMeaning: An early informal name for SARS-CoV-2, the virus that causes COVID-19, the disease behind
  the pandemic declared in 2020.
scope: 'Also called coronavirus, corona, coronavirus disease 2019, novel coronavirus pneumonia, 2019-nCoV
  acute respiratory disease, COVID-19, Wuhan coronavirus, Wuhan flu and Wuhan pneumonia: a sickness that
  spread all over the world in 2020, not a common cold.'
examples:
- The Wuhan virus spread around the world in 2020.
- Doctors worked day and night to fight the Wuhan virus.
