senseId: 'right_of_privacy%1:07:00::'
synsetId: 05196859-n
simpleMeaning: a claim under law to be left alone, to live without one's life being shown to others for
  no reason, though the United States Constitution does not spell it out
scope: This is a claim under law to be left alone, and it stands on what the United States Constitution
  leaves unsaid rather than on words written there.
examples:
- The actor sued, saying the paper had broken the right of privacy.
- The right of privacy lets a person keep their home life out of the news.
