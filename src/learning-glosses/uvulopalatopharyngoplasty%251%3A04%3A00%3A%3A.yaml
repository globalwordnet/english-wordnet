synsetId: 00690982-n
simpleMeaning: Surgery to widen the airway by removing some soft palate and throat tissue, used to treat
  severe snoring with or without obstructive sleep apnea.
scope: This sense is also called palatopharyngoplasty.
examples:
- An uvulopalatopharyngoplasty opened the air way.
- Uvulopalatopharyngoplasties cure snoring.
