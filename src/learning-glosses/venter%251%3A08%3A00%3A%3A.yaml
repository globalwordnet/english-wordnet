simpleMeaning: The part of the body of an animal with a backbone, between the chest and the hips.
scope: Also called stomach, belly, and abdomen. It is a region of the body, not a single organ or a bulging
  part.
examples:
- The venter of the fish was pale and smooth.
- A blow to the venter left them gasping.
