simpleMeaning: An old-fashioned term for a woman schoolteacher, especially one seen as strict.
scope: Also called mistress, schoolmistress, and schoolmarm. It is a noun.
examples:
- The schoolma'am kept the room quiet with one look.
- Our schoolma'am gave us extra work when we talked.
