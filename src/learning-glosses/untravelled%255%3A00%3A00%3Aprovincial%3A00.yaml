simpleMeaning: Said of a person with little knowledge of the world, because they have seldom gone to far
  places.
scope: Also called untraveled. It is said of a person, not of a place.
examples:
- The untravelled clerk dreamed of seeing the sea.
- They stayed untravelled all their life, happy in the home town.
