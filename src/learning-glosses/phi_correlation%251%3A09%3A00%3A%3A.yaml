senseId: 'phi_correlation%1:09:00::'
synsetId: 06044943-n
simpleMeaning: A number that shows how closely two characteristics are related when each has only two
  possible values.
scope: Also called the phi coefficient. Each person or item has a value for both characteristics.
examples:
- They used the phi correlation to see whether attending class was linked to passing the test.
- The phi correlation was close to zero in the second group.
