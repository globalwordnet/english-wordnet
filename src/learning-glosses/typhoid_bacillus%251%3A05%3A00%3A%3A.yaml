simpleMeaning: A tiny living thing of the salmonella kind, this germ brings on the fever it is named for.
scope: Also called Salmonella typhi and Salmonella typhosa, this name is for the germ, not for the fever
  it causes.
examples:
- The typhoid bacillus gave the patient a fever.
- They found the typhoid bacillus in the sample and linked it to the fever.
