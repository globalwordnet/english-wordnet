senseId: 'deficit_spending%1:04:00::'
synsetId: 01125075-n
simpleMeaning: Spending more than is received in revenue and borrowing to cover the difference. Governments
  sometimes do this to stimulate the economy.
scope: It is also called compensatory spending or pump priming.
examples:
- The government turned to deficit spending to lift the economy.
- Critics warned that deficit spending would add to the national debt.
