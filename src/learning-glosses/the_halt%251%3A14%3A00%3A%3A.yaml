simpleMeaning: In old use, people who cannot walk well, taken as a group, go by this name.
scope: In old use, it is a name for lame people as a group, not for blind people.
examples:
- The old text names the poor, and the maimed, and the halt, and the blind.
- The halt moved slowly together, each step hard for them.
