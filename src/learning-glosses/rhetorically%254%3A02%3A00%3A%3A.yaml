simpleMeaning: In a way that uses language for effect or to persuade people.
scope: A question can be asked rhetorically when the speaker wants the audience to consider a point.
examples:
- “Who could afford that?” she asked rhetorically.
- The two speeches were rhetorically similar, both using repetition to persuade the crowd.
