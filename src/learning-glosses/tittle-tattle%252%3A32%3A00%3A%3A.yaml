senseId: 'tittle-tattle%2:32:00::'
synsetId: 01038676-v
simpleMeaning: To talk without stopping, at speed, about small matters that do not count.
scope: Also called chatter, clack, prattle, gibber, gabble, blabber, blab, tattle, piffle, prate, twaddle,
  palaver, and maunder. It is a kind of talk.
examples:
- Stop your tittle-tattle and get on with the work.
- The two neighbours kept up their tittle-tattle all afternoon.
