simpleMeaning: Any of several ways of making young without the joining of male and female cells.
scope: This is not about young made when male and female cells join.
examples:
- The new plants grew by apomixis, with no joining of male and female cells needed.
- Through apomixis, the flower set seed even though no pollen had reached it.
