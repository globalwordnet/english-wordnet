simpleMeaning: A woman who looks good and goes her own way, not following what most people do.
scope: Tchotchke, chachka, tchotchkeleh, and tshatshke are other names for it, and it means a woman, not
  an inexpensive showy trinket.
examples:
- The tsatske at the party wore a bright red dress and laughed loudly.
- Everyone turned to look at the tsatske when she walked in.
