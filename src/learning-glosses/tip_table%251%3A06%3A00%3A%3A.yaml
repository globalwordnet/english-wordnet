simpleMeaning: On a hinge, the flat part of this table swings up to stand upright, and the whole thing
  stands on one leg.
scope: This is also called a tip-top table and a tilt-top table; it is the one-legged kind, not the kind
  with four legs.
examples:
- The tip table stood upright on one leg.
- They swung the tip table's flat part up to stand it upright.
