simpleMeaning: Fierce rivalry in which sellers keep lowering what they charge to win buyers.
scope: Also called a price war. It is rivalry between sellers.
examples:
- The price competition between the two shops drove costs down for buyers.
- A price competition broke out when both stores cut what they charged for bread.
