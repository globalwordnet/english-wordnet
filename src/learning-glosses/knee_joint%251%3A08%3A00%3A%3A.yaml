simpleMeaning: The joint in a person’s leg where the thighbone meets the shinbone, with the kneecap at
  the front. It lets the leg bend and straighten.
scope: The knee joint also allows a little rotation when bent.
examples:
- The knee joint lets the leg bend each time a person walks.
- The knee joint flexed when the leg was lifted.
