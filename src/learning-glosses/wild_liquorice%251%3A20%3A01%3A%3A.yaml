simpleMeaning: A North American plant resembling true liquorice, with a root that has similar properties.
scope: This plant is also called wild licorice, American licorice, American liquorice, and Glycyrrhiza
  lepidota, and it is not a bedstraw with sweetish roots.
examples:
- They dug up wild liquorice to use its root.
- In the dry fields of North America, wild liquorice grew in plenty.
