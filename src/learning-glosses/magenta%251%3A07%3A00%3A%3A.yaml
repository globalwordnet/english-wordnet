simpleMeaning: A primary color in subtractive color mixing, with a deep purplish-red appearance. The dye
  was discovered in 1859, the year of the Battle of Magenta.
scope: A dark purple-red colour used in mixing light, not pink and not a kind of purple dye for cloth.
examples:
- She wore a magenta scarf.
- The poster used magenta and yellow.
