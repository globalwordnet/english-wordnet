simpleMeaning: At every place, or going to every place, used like a pronoun that stands for a place and
  means every one of them.
scope: Also called everywhere and everyplace, this one means every place, not just one place.
examples:
- They looked all over the house for the missing keys.
- The news spread all over the town.
