simpleMeaning: The high standing that comes with being a viscount, or a lady of the same rank.
scope: This standing is also called a viscounty, and it is not the title itself.
examples:
- They spoke of the viscountcy as a great honour in the family.
- They inherited the viscountcy when their father died.
