simpleMeaning: Relating to, containing, or resembling silica, the main substance in quartz and many kinds
  of sand.
scope: Siliceous is another name for this word, used of things that hold silica, are made from it, or
  look like it.
examples:
- The sandstone was silicious.
- This stone is silicious.
