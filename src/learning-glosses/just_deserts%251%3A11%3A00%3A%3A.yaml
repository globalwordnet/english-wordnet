simpleMeaning: An event, good or bad, that gives someone exactly what their actions call for.
scope: It is also called comeuppance, comeupance, or poetic justice.
examples:
- They faced their just deserts after years of cheating their partners.
- The thief got their just deserts when the court sent them to prison.
