simpleMeaning: Someone who tells people bad stories, true or only said to be true, about someone else,
  most often to gain in politics.
scope: It is also called muckraker.
examples:
- The mudslinger spread bad stories about the mayor all through the campaign.
- Voters grew tired of the mudslinger's attacks.
