simpleMeaning: An older collective name used here for the San peoples of southern Africa, many of whose
  communities traditionally lived by hunting and gathering.
scope: Khoisan has also been used more broadly for San and Khoekhoe peoples, whose histories and ways
  of life differ.
examples:
- The old ethnography used Khoisan for the San communities it described.
- The historian explained the changing use of the name Khoisan.
