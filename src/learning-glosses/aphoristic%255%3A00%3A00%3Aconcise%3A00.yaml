senseId: aphoristic%5:00:00:concise:00
synsetId: 00549171-s
simpleMeaning: Said of words that say a lot in very few words, with wit, like a saying that gives a rule
  to live by.
scope: This is also called apothegmatic and epigrammatic, and it is not about the other sense of this
  word, which is about a work that holds short, wise sayings.
examples:
- The speaker's aphoristic reply summed up the whole debate in a single witty line.
- They liked the aphoristic turn of the sentence, short and clever and easy to remember.
