simpleMeaning: The oculomotor nerve, which controls most of the muscles that move the eye.
scope: Also called the nervus oculomotorius, the oculomotor nerve, or the oculomotor. It is a kind of
  cord that carries signals.
examples:
- The third cranial nerve carries signals to the muscles that move the eye.
- The doctor tested the third cranial nerve by asking the patient to follow a finger with their eyes.
