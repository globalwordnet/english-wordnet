simpleMeaning: A thing that carries no decoration and no added work meant only for show.
scope: Also called bare, plain, spare, and unembellished. It is a word for a thing, not for a person.
examples:
- The hall was built of stark unornamented concrete.
- They chose unornamented white walls for the small room.
