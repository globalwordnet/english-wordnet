synsetId: 01693210-s
simpleMeaning: Used of a phrase or an idea that has gone stale from being said too much.
scope: Also called tired, stock, threadbare, commonplace, banal, trite, timeworn, hackneyed, old-hat,
  and well-worn. It is an adjective.
examples:
- The shopworn joke got no laugh from the crowd.
- Their speech was full of shopworn phrases about hard work.
