simpleMeaning: Any of a group of viruses whose genetic material is RNA, including those that cause influenza
  and mumps.
scope: One of a group of tiny germs that bring on flu and mumps, not a germ that causes a cold and not
  a germ spread by dirty water.
examples:
- The myxovirus that causes flu spreads from person to person.
- Doctors found a myxovirus in the child with mumps.
