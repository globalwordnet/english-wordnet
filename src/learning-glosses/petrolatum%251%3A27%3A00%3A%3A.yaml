simpleMeaning: A thick, jelly-like mixture of hydrocarbons from crude oil. It is used in medicinal ointments
  and to reduce friction between moving surfaces.
scope: It is also called petroleum jelly and mineral jelly, the half-solid oily mix from crude oil for
  healing creams and greasing.
examples:
- She spread petrolatum on her skin.
- Petrolatum greased the moving parts.
