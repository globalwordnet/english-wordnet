simpleMeaning: To try to win someone's liking, often by acting in a way one does not mean.
scope: Also called cotton up, cozy up, shine up, sidle up, and suck up. It is an act, not a feeling.
examples:
- She is playing up to the chairman.
- They played up to the boss with praise they did not mean.
