senseId: tautologic%5:00:00:prolix:00
synsetId: 00552046-s
simpleMeaning: Saying the same thing twice, in words that look different but mean the same.
scope: Also called redundant, pleonastic, and tautological. It is a way of speaking.
examples:
- The phrase 'a true fact' is tautologic.
- Saying 'a beginner who has just started' is tautologic.
