simpleMeaning: A difference between two things, seen by setting one against the other.
scope: This one is about a difference, not the act of telling things apart.
examples:
- Sculpture in contradistinction to painting shows how the two arts differ.
- The teacher drew a contradistinction between poetry and prose.
