senseId: 'democratise%2:41:01::'
synsetId: 02539414-v
simpleMeaning: To bring in changes in a country that give ordinary people a say in how it is run.
scope: This one is also called democratize, but it is not about a country itself becoming more democratic.
examples:
- The new leaders promised to democratise the country after years of rule by one man.
- Reforms were passed to democratise voting in the provinces.
