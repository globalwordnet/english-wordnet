simpleMeaning: How much slower light moves through a thing than through empty space, shown as one number.
scope: This is also called index of refraction.
examples:
- The refractive index of water and glass was compared to see which slowed light more.
- The book gave the refractive index of the oil so the class could work out the speed of light in it.
