simpleMeaning: Something in a tube or pipe that stops things from passing through it.
scope: Also called a stop, a block, a closure, a blockage, or a stoppage. It is a noun.
examples:
- The occlusion in the drainpipe stopped the water from flowing away.
- They found an occlusion in the pipe and cleared it out.
