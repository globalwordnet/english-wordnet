simpleMeaning: A brand of indapamide, a drug that increases urine production and treats high blood pressure.
scope: Also called indapamide, this is a drug that makes people pass water to treat high blood pressure,
  not a drug used for pain.
examples:
- The doctor gave her Lozal to bring her blood pressure down.
- Lozal helps people with high blood pressure by making them pass water.
