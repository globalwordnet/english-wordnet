simpleMeaning: Said of a thing that clings to what it touches, the way glue does.
scope: It is also called sticky, pasty, gummy, viscous, gluey, glutinous, or viscid.
examples:
- The mucilaginous sap clung to my fingers when I touched the cut stem.
- The mucilaginous coat on the seed stuck to the wet cloth.
