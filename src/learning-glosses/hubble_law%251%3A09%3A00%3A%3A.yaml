simpleMeaning: The rule that distant galaxies move away at speeds proportional to their distance from
  the observer, as shown by the red shift of their light.
scope: This is a broad rule in astronomy about far-off star groups moving away from us faster the farther
  away they are; also called Hubble's law.
examples:
- Hubble law tells us that far-off galaxies rush away faster the farther they are.
- We used Hubble law to work out how far that galaxy is.
