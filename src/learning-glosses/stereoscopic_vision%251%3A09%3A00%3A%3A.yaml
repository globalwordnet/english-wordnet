simpleMeaning: Each eye sends the brain a view of one scene, a little different from the other, and the
  brain puts the two together into one view with depth.
scope: Stereoscopy is another name for this way of seeing.
examples:
- The test checked their stereoscopic vision.
- With stereoscopic vision, near and far things stand out clearly.
