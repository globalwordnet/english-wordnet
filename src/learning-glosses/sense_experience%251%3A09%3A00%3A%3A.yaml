senseId: 'sense_experience%1:09:00::'
synsetId: 05720023-n
simpleMeaning: What a person first knows through sight, touch, hearing, taste or smell alone, with nothing
  added by thought.
scope: Also called sensation, aesthesis, esthesis, sense datum and sense impression, this one is about
  an awareness.
examples:
- A sense experience of warmth on the skin reached them before they knew what it was.
- The sense experience of a sharp sound came before any thought about it.
