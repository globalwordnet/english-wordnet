simpleMeaning: A way to show a real number with figures in a fixed order, each figure's worth set by its
  place.
scope: Also called positional notation. It is a set of signs.
examples:
- The positional representation system we use puts the tens to the left of the ones.
- In this positional representation system, 101 means one hundred and one.
