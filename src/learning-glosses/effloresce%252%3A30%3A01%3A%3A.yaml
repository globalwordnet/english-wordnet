senseId: 'effloresce%2:30:01::'
synsetId: 00444625-v
simpleMeaning: To take the shape of crystals, or to change into crystal form.
scope: This one is also called crystallize, crystalize, and crystalise, and is not about growing a crust
  of crystals as water dries away.
examples:
- The salt solution began to effloresce as it cooled in the dish.
- Left in the dry air, the mineral started to effloresce on the shelf.
