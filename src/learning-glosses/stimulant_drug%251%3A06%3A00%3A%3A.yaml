simpleMeaning: A medicine that speeds up some body process needed to stay alive, for a short time.
scope: It is also called a stimulant or an excitant.
examples:
- The doctor gave the patient a stimulant drug to raise the heart rate.
- The athlete took a stimulant drug before the race to speed up the heart.
