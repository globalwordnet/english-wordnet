simpleMeaning: Someone who talks for two sides and passes messages between them.
scope: It is also called an intermediary, a mediator, a go-between, or an intercessor.
examples:
- The intermediator helped the two sides reach an agreement.
- They asked an intermediator to carry their terms to the other side.
