simpleMeaning: Too much carotene, a substance in the blood, can turn the skin pale yellow or red.
scope: This is also called carotenemia, and the carotene is in the blood, not in the skin.
examples:
- The doctor said the xanthemia came from too much carotene in their blood.
- Their skin turned pale yellow, and the doctor called it xanthemia.
