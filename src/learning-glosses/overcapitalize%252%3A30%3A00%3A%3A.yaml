senseId: 'overcapitalize%2:30:00::'
synsetId: 00162158-v
simpleMeaning: To give a business more money than its trade or its hopes of gain can justify.
scope: It is also called overcapitalise.
examples:
- They overcapitalized the small factory, and the extra money brought no extra trade.
- The new owners overcapitalized the restaurant, putting in more cash than the business could ever repay.
