simpleMeaning: Having two or more tunes that stand on their own but fit together in sound, heard at the
  same time.
scope: Also called contrapuntal. It is a word used of music.
examples:
- The choir sang a polyphonic piece with four voices moving on their own.
- In a polyphonic passage, each line keeps its own tune while fitting with the others.
