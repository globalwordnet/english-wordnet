simpleMeaning: To use another person's words or ideas as your own, without saying where they came from,
  when they belong to that person by law.
scope: Also called lift and plagiarize. It is a word.
examples:
- The student plagiarised whole pages from the book.
- The writer was caught after plagiarising the speech.
