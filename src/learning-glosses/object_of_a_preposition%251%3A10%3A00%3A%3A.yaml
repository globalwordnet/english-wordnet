senseId: 'object_of_a_preposition%1:10:00::'
synsetId: 06321439-n
simpleMeaning: The word ruled by words like in, on, at, and by, which join it to other words in the sentence.
scope: Also called prepositional object. It names one word in the sentence.
examples:
- In the sentence 'They sat by the river', 'river' is the object of a preposition.
- The word 'table' is the object of a preposition in 'the book on the table'.
