simpleMeaning: The upper part of a vertebrate's jaw, which in many species is firmly attached to the skull.
scope: This is also called the maxilla, the maxillary, and the upper jaw, and it is not a separate moving
  part.
examples:
- The doctor pointed to the upper jawbone on the X-ray, where it met the skull.
- In the skeleton, the upper jawbone stayed joined to the skull.
