simpleMeaning: A word people once used for a person who lives and acts as the other sex lives and acts.
scope: Also called inversion, this is the word people once used for taking on the other sex's role, and
  it is not the word in use now.
examples:
- In old writing, sexual inversion was the word for taking on the role of the other sex.
- Readers of old books still meet sexual inversion in its pages.
