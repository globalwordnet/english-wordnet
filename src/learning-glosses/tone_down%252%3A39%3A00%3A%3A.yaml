simpleMeaning: To make a sound or a noise less loud, above all by putting a cover round what makes the
  sound.
scope: Also called dull, damp, muffle, mute, and dampen. It is a verb.
examples:
- Please tone down the music.
- They toned down the sound by wrapping the bell in cloth.
