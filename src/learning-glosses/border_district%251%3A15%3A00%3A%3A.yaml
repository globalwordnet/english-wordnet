simpleMeaning: An area that lies on both sides of the line where one country or place ends and another
  begins.
scope: Also called borderland. It is about an area, not the line itself.
examples:
- The Welsh marches between England and Wales form a border district.
- People in the border district cross the line every day to work in the next country.
