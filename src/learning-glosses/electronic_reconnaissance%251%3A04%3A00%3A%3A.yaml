senseId: 'electronic_reconnaissance%1:04:00::'
synsetId: 00988166-n
simpleMeaning: The detection and assessment of electromagnetic signals from foreign sources to identify
  them and locate their origins. This sense excludes emissions from radioactive materials.
scope: The finding and placing of strange waves from other lands, not the sighting of ships and not the
  reading of letters.
examples:
- Electronic reconnaissance found the enemy's radio signals.
- The ship used electronic reconnaissance to place the foreign signals.
