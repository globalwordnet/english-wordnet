senseId: 'solar_apex%1:15:00::'
synsetId: 08511997-n
simpleMeaning: The direction, marked against stars that stay put, in which the sun and all that moves
  with it seem to travel.
scope: Apex and apex of the sun's way are other names for this point, set against the stars that stay
  put.
examples:
- Astronomers mark the solar apex against the fixed stars.
- They plotted the solar apex to show where the sun seems to be heading.
