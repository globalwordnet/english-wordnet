senseId: unpresentable%5:00:00:unattractive:00
synsetId: 00171088-s
simpleMeaning: Said of a person or a thing that makes a bad first impression, or no strong one at all.
scope: Also called unprepossessing. It is used of people and things.
examples:
- In that torn coat, the visitor looked unpresentable at the door.
- The unpresentable flat put off every viewer at first sight.
