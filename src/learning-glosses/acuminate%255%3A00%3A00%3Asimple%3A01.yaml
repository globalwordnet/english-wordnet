simpleMeaning: Said of a leaf shape that grows thinner toward the end until it comes to a fine point.
scope: This one says how a leaf shape looks, not how something is made sharp.
examples:
- They noted the acuminate shape of the leaf, thin at the end and pointed.
- The leaf had an acuminate tip that narrowed to a fine point.
