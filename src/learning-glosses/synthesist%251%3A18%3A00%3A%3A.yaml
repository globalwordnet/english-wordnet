simpleMeaning: A person who studies ideas and puts them together to make something new, or who follows
  ways of putting things together.
scope: Also called synthesiser and synthesizer. It is a person, not a machine.
examples:
- The synthesist joined ideas from art and science into one new way of seeing the world.
- A synthesist looks for links between things that seem to have nothing in common.
