senseId: 'esthetic%3:00:00::'
synsetId: 00070140-a
simpleMeaning: Said of something that shows a love of beauty or a fine sense of what looks good.
scope: This one is also called aesthetic and aesthetical, and its same-batch mate is esthetical; it is
  not about the study of beauty as a subject.
examples:
- The esthetic charm of the old garden drew visitors all year.
- They chose the curtains for their esthetic appeal, not for how warm they were.
