simpleMeaning: The act of finding how heavy a competitor is before a contest, above all to make sure the
  person falls inside the set limits.
scope: It is a step taken before a contest, not the contest itself.
examples:
- The boxer went to the weigh-in the day before the fight.
- At the weigh-in, each rider stepped on the scales.
