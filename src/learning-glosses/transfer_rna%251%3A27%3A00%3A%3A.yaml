simpleMeaning: A type of RNA that carries a specific amino acid to a ribosome, where the amino acid joins
  a growing protein according to instructions in messenger RNA.
scope: 'Also called acceptor RNA, soluble RNA and tRNA: cell molecules that carry amino acids to growing
  protein chains, not the messenger molecules that carry the orders.'
examples:
- Transfer RNA carries amino acids to the protein chain.
- Each kind of transfer RNA carries one amino acid.
