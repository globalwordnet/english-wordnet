simpleMeaning: News reports reach newspapers through this office, which gathers them and sends them on
  by electronic means.
scope: This office is also called news agency, news organisation, news organization, press agency, and
  press association, and it is not a newspaper itself.
examples:
- The wire service sent the story to newspapers across the country within the hour.
- Local papers depend on the wire service for news from far away.
