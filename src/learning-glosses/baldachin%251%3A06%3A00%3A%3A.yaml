simpleMeaning: A decorated canopy, often above an altar, that rests on columns, hangs from a roof or extends
  from a wall.
scope: A baldachin is a fine cloth roof held up by posts, or hung from a ceiling, or fixed to a wall,
  as over a holy table.
examples:
- A baldachin hung over the altar.
- A baldachin was fixed to the wall over the altar.
