simpleMeaning: Made to follow set patterns and rules of art to make a planned effect, and never left to
  nature or chance.
scope: It is also called stylized, conventionalised, or conventionalized.
examples:
- The play was staged in a stylised mode of theater production.
- The film's stylised sets looked nothing like real streets.
