simpleMeaning: An acute infection caused by streptococcal bacteria that produces deep-red, swollen skin
  and can affect mucous membranes.
scope: This sudden infection from one kind of germ turns the skin and the soft wet lining inside the body
  deep red.
examples:
- Erysipelas made her skin red and swollen.
- Her skin turned deep red with erysipelas.
