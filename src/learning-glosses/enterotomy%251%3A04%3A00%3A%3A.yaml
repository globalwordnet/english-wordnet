simpleMeaning: A surgical cut into the intestine.
scope: An enterotomy gives a surgeon access to the inside of the intestine. An enterostomy creates an
  opening from the intestine to another site.
examples:
- The surgeon did an enterotomy to make an opening into her gut.
- After the enterotomy, food could leave through the opening in her belly.
