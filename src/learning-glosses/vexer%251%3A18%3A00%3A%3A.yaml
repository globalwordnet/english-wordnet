simpleMeaning: By mocking others or stirring their curiosity, a person teases them again and again.
scope: Tease, teaser and annoyer are other names for this sense, not a person who teases only once.
examples:
- The vexer mocked their classmates until they laughed, then stirred their curiosity with a half-told
  story.
- They knew the vexer would tease them about the gift before telling them what it was.
