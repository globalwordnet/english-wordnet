simpleMeaning: To keep talking loudly, with strong feeling, in the manner of a speech.
scope: It is also called rant, rave, spout, jabber, or mouth off.
examples:
- The speaker rabbited on loudly about the match for an hour.
- They rabbited on until everyone stopped listening.
