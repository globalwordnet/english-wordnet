simpleMeaning: A photograph taken with a lens that makes distant subjects appear larger.
scope: This is the photo itself, not the special long lens used to make it and not a photo taken with
  a normal lens.
examples:
- He sent me a telephoto of the birds on the far hill.
- This telephoto shows the moon much larger than I could see it with my eyes.
