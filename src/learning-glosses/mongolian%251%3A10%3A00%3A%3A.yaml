simpleMeaning: A family of related languages spoken in Mongolia and nearby regions, traditionally grouped
  with the proposed Altaic languages.
scope: Also called Mongolic or Mongolic language, this is a family of tongues, not a member of the peoples
  of Mongolia.
examples:
- Mongolian belongs to the Altaic group of tongues.
- She studies Mongolian and its sister tongues.
