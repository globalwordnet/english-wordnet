senseId: 'theater_prompter%1:18:00::'
synsetId: 10501999-n
simpleMeaning: A person who gives a performer the next words when the performer has forgotten them.
scope: Also called a prompter. It is not the person who writes the play.
examples:
- The theater prompter whispered the next line from the wings.
- When the actor froze, the theater prompter fed them the line.
