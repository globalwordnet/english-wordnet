senseId: 'analytic_thinking%1:09:00::'
synsetId: 05780664-n
simpleMeaning: A way of looking at a whole thing by pulling it apart in the head into its pieces, then
  looking at each piece and how the pieces go together.
scope: This sense is also called analysis.
examples:
- The team used analytic thinking to split the big task into small parts and deal with each one in turn.
- The course trains students in analytic thinking, so they can take a problem apart and see how its parts
  fit together.
