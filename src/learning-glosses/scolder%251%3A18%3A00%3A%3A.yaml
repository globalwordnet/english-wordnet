simpleMeaning: Someone who annoys others by constantly finding fault, a label historically applied especially
  to women.
scope: Also called scold, nag, common scold, and nagger. It is a noun.
examples:
- The scolder in the next flat complained about every noise.
- No one wanted to sit near the scolder at dinner.
