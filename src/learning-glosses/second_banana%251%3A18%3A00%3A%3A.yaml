simpleMeaning: A partner to a comic who plays the silly part, letting the comic's jokes land.
scope: The comic's sidekick who takes the silly part is set apart from a person who merely holds a lower
  post in any work.
examples:
- The second banana played the fool while the comedian delivered the line.
- The second banana took the silly part in the act, and the comedian got the laugh.
