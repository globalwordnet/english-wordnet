simpleMeaning: Describes plant parts, especially leaves, located at the base of a plant or stem, particularly
  those growing directly from a root, rootstock, or rootlike stem.
scope: Also called radical; of leaves at the base of a plant or stem.
examples:
- Their leaf was basal in place.
- The growth was basal by form.
