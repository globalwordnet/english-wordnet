senseId: 'anisotropy%1:07:00::'
synsetId: 04924857-n
simpleMeaning: The fact that something has a different value when you measure it in different directions.
scope: It names a property of a thing, not the thing itself and not one fixed value that stays the same
  in every direction.
examples:
- The anisotropy of the crystal means its strength changes with direction.
- They measured the anisotropy of the wood by testing it along and across the grain.
