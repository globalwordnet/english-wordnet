simpleMeaning: The value shown in a company's books for the shares it has sold and not bought back.
scope: This one is about a company's shares, not the most shares it is allowed to sell.
examples:
- They worked out the capital stock from the company's books.
- The capital stock fell when the company bought back its own shares.
