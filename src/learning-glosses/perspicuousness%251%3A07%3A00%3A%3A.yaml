simpleMeaning: The quality of being clear because things are put in words that are easy to follow.
scope: Also called plainness or perspicuity. It is a quality.
examples:
- The perspicuousness of the instructions saved time for everyone.
- In a report, perspicuousness means readers never have to guess.
