senseId: 'encrustation%1:17:00::'
synsetId: 09283124-n
simpleMeaning: A hard coat on the outside of a thing, hiding what lies under it.
scope: This one is also called crust and incrustation, and it is not a coating put on for show.
examples:
- The encrustation on the old kettle came off in flakes when it was scrubbed.
- An encrustation of salt covered the rim of the glass.
