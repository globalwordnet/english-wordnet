simpleMeaning: A place in a bank, most often, where things of great worth are locked in a strong metal
  box that fire cannot harm.
scope: It is also called a lockbox, a deposit box, a safe-deposit, a safety-deposit, or a safety deposit
  box.
examples:
- The safe-deposit box at the bank held the will and the jewels.
- The safe-deposit box held the papers through the fire.
