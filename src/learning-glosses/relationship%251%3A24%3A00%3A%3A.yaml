senseId: 'relationship%1:24:00::'
synsetId: 13802931-n
simpleMeaning: A connection between people. The word also describes connections between other things,
  as in the relationship between inflation and unemployment.
scope: It is not a formal link between things or numbers; the preferred use here is for connections between
  people.
examples:
- The relationship between the two sisters has always been close.
- Trust is the basis of any good relationship.
