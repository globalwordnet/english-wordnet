senseId: two-faced%5:00:00:dishonest:00
synsetId: 01225960-s
simpleMeaning: Above all, they hide their real feelings and show a different set instead, acting on the
  hidden ones.
scope: Also called deceitful, duplicitous, ambidextrous, double-dealing, double-faced, double-tongued,
  and Janus-faced, this word is for a person who hides their real feelings on purpose, not for one who
  shows what they truly feel.
examples:
- Their two-faced friend praised them to their face and mocked them behind their back.
- The two-faced manager smiled at the staff and then cut their hours.
