simpleMeaning: The hollow that holds the eye has a raised line of bone over it, on the front of the skull.
scope: Also called a superciliary arch, a supraorbital ridge, or a supraorbital torus, this is the raised
  line of bone over the eye.
examples:
- They ran a finger along the superciliary ridge above the eye.
- They felt the superciliary ridge with a fingertip.
