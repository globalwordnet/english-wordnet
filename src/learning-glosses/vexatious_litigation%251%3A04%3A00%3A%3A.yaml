senseId: 'vexatious_litigation%1:04:00::'
synsetId: 01189720-n
simpleMeaning: A court case shown to have been brought maliciously and without reasonable grounds.
scope: This is a court action with no probable cause, not a case brought for a good reason.
examples:
- He got an injunction against vexatious litigation by his enemies.
- The company faced vexatious litigation started out of spite, with no good reason behind it.
