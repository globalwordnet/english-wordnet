senseId: 'ruled_surface%1:06:01::'
synsetId: 92471179-n
simpleMeaning: A shape traced by a straight edge as it moves, so that through each point of it a straight
  edge can lie flat upon it.
scope: It is a noun.
examples:
- In algebraic geometry, ruled surfaces were originally defined as projective surfaces in projective space
  containing a straight line through any given point.
- The surface of a cone is one such shape, traced by a straight edge turning round a fixed point.
