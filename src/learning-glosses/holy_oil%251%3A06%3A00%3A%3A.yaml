simpleMeaning: An ointment made by mixing oil with balsam, a fragrant tree resin, and blessing the mixture.
scope: A blessed cream for church use, not cooking oil and not plain scented oil; also called chrism and
  chrisom.
examples:
- The priest blessed the holy oil before the service.
- Holy oil is used to anoint the sick.
