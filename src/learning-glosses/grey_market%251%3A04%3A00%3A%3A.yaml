simpleMeaning: Trading that goes on away from official channels, where goods change hands at prices below
  those laid down by the trade authority.
scope: This word is another name for the gray market.
examples:
- They bought the watch on the grey market for half its shop price.
- Traders on the grey market sell goods without official approval.
