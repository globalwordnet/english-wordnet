simpleMeaning: Containing plenty of something. Usually followed by “with,” as in “filled with light,”
  or joined to another word, as in “cream-filled.”
scope: This describes something containing plenty of something else, not an order that has been completed.
examples:
- The hall was filled with cheering fans.
- Her letters are filled with warmth and humor.
