simpleMeaning: This pigeon flips over backward again and again, in the air or on the ground.
scope: Also called roller and tumbler, this name is for a bird that does backward somersaults in flight
  or on the ground.
examples:
- The tumbler pigeon flipped over backward in the air.
- They watched the tumbler pigeon turn backward somersaults on the ground.
