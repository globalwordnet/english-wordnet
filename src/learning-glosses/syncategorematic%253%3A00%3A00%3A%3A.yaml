schema: oewn-learning-gloss-v2
senseId: 'syncategorematic%3:00:00::'
synsetId: 02603584-a
simpleMeaning: Having to do with a word that cannot stand alone as subject or, above all, predicate of
  a statement, but must be used with other words.
scope: It describes words like 'or' and 'not', not words like 'dog' and 'run'.
examples:
- ‘Or’ is a syncategorematic term.
- In the sentence, 'and' is a syncategorematic word that joins two parts.
