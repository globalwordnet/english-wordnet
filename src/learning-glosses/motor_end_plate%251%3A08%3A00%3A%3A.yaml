simpleMeaning: The part of a muscle fiber that receives signals from a motor nerve.
scope: The motor end plate is the region of the muscle cell membrane that responds to the nerve impulse.
examples:
- The motor end plate lies where the nerve meets the muscle.
- Signals reach the muscle through the motor end plate.
