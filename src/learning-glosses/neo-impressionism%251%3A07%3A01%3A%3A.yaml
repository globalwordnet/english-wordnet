simpleMeaning: A late 19th-century French painting movement that developed Impressionism through systematic
  use of form and color, especially by applying paint in small dots.
scope: A late 1800s French painting movement, planned in its way of shaping forms and colours and built
  on small dots of paint, not the earlier painting style it tried to better.
examples:
- Neo-Impressionism used small dots of paint to build its forms.
- The show traced Neo-Impressionism from its first French painters.
