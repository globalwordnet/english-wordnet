senseId: 'chemosorption%1:22:00::'
synsetId: 13469096-n
simpleMeaning: The attachment of substances to a surface through chemical bonding rather than physical
  attraction, especially when the attachment is irreversible.
scope: This one is also called chemisorption.
examples:
- Nitrogen stays on the iron surface by chemosorption, so firmly that heat will not drive it off.
- The engineer relied on chemosorption to keep the gas fixed to the metal while the plant ran.
