simpleMeaning: A traditional way for partners to move together, in clusters or in two lines facing each
  other.
scope: Also called contra danse, contradance, contredanse or country dancing, this one is about a folk
  form.
examples:
- The country-dance began with the partners forming two lines that faced each other.
- Everyone at the fair joined in the country-dance after supper.
