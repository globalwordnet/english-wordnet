simpleMeaning: A visual pattern produced from an electronic recording of someone's voice, used to help
  identify the speaker.
scope: This tells people apart by how their speech sounds, using a picture drawn from a recording.
examples:
- The lab matched the voiceprint on the tape with the voiceprint in its files.
- The voiceprint was checked before the door was opened.
