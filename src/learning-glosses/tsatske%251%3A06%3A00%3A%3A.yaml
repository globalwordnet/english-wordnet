simpleMeaning: In Yiddish, this is the name for a small showy ornament that costs little.
scope: Also called tchotchke, chachka, and tshatshke, this Yiddish name is for a trinket, not an attractive
  unconventional woman.
examples:
- They bought a cheap tsatske and put it on the shelf for show.
- The tsatske on the desk was bright and had cost very little.
