simpleMeaning: A person whose job is to carry out the last step in a process that makes things.
scope: This one is about a kind of worker, not the painter, the pitcher, the driver, or the race car of
  the same name.
examples:
- The finisher checked every chair once more before it left the workshop.
- After years on the line, they became a finisher in the shoe factory.
