simpleMeaning: Veins that drain blood from the conjunctiva, the clear membrane lining the eyelids and
  covering the white part of the eye.
scope: Also called venae conjunctivales, this one is about blood vessels in the eye.
examples:
- The conjunctival veins drain the surface of the eye after long hours of reading.
- A doctor can see the conjunctival veins clearly when the eye is red and sore.
