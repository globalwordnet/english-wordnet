senseId: 'uncertified%3:00:00::'
synsetId: 00343800-a
simpleMeaning: A person or thing with no official papers or approval to show that it meets what is needed.
scope: This word is used of a person or thing that is missing what an authority should have given it,
  not of one that has it.
examples:
- The uncertified teacher could not take the job.
- They would not accept the uncertified copy of the record.
