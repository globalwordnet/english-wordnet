simpleMeaning: Said of people who earn their pay by doing jobs, above all jobs done with the hands or
  in factories.
scope: Also called blue-collar, propertyless, and wage-earning. It is said of people.
examples:
- They lived in a working-class street near the docks.
- Their working-class parents both did jobs in factories.
