simpleMeaning: In astronomy, maps of the sky for different times, for example one for each month, are
  usually drawn small and put together in a book.
scope: In astronomy, this is a set of maps of the sky for different times, kept together as a book.
examples:
- They looked in the star atlas for the map of this month's sky.
- They checked the star atlas to see the sky for next month.
