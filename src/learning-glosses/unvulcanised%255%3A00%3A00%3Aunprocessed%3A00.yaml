simpleMeaning: Said of rubber that has not been heated with sulfur to make it hard and lasting.
scope: Also called unvulcanized. It is used of rubber, not of other materials.
examples:
- The unvulcanised sheet tore easily in the cold.
- They stored the unvulcanised rubber away from the heat.
