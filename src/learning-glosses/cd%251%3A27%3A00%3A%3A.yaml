simpleMeaning: Cadmium, a soft, poisonous, bluish-white metal found with zinc ores. It can be drawn into
  wire or hammered flat and usually forms ions with a double positive charge.
scope: This metal is also called cadmium and atomic number 48; it is not zinc and not another soft metal.
examples:
- Cd is found with zinc ores.
- The battery contained Cd.
