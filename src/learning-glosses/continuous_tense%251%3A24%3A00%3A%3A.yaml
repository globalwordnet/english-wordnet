simpleMeaning: A form of a verb that shows an action still in progress.
scope: This one is also called imperfect, imperfect tense, progressive, and progressive tense.
examples:
- In 'They are reading,' the verb is in the continuous tense.
- The continuous tense shows that the work was still going on at that time.
