simpleMeaning: A helper T cell with a CD4 marker that recognizes displayed antigens and signals B cells
  and killer T cells. HIV can infect and kill it.
scope: Not other T cells, nor other white blood units; also called helper cell, CD4 cell, and helper T
  cell.
examples:
- CD4 T cells fight infection.
- The AIDS virus kills CD4 T cells.
