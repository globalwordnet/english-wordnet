simpleMeaning: Tiny tubes in the kidney of an animal with a spine pass waste out of the body, and this
  is one of them.
scope: This is also called nephron.
examples:
- Each uriniferous tubule in the kidney passes a little waste out of the blood.
- They traced the waste through one uriniferous tubule after another in the kidney.
