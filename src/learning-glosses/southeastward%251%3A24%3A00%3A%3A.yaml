simpleMeaning: The compass point halfway between south and east, 135 degrees clockwise from north.
scope: Also called southeast, sou'-east, and SE. It is a compass point.
examples:
- The wind came from the southeastward all day.
- A breeze from the southeastward cooled the deck.
