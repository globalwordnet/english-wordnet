senseId: 'southeastward%1:24:00::'
synsetId: 13855040-n
simpleMeaning: A point on a compass that lies halfway between the direction downward on the map and the
  sunrise side, at 135 degrees round from north.
scope: Also called southeast, sou'-east, and SE. It is a compass point.
examples:
- The wind came from the southeastward all day.
- A breeze from the southeastward cooled the deck.
