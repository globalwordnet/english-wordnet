simpleMeaning: The parts of a whole set out so that they sit well with each other, as in a design.
scope: Also called balance or proportion. It is a noun.
examples:
- The architect checked the proportionality of the windows against the height of the walls.
- Good proportionality makes a garden feel calm, with paths and beds in keeping with each other.
