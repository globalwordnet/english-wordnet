simpleMeaning: Resting on a list that tracks a group of shares, a deal to buy or sell later at a price
  set now — a bet on their future worth.
scope: This sense names a deal tied to a list that tracks a group of shares.
examples:
- They bought stock-index futures as a bet on the share list.
- The price of stock-index futures moves with the share list.
