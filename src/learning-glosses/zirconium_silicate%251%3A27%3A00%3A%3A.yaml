simpleMeaning: A common mineral found in small crystals, the main source of zirconium, used for heat-resistant
  materials when opaque and as a gemstone when transparent.
scope: Also called zircon, this common mineral in small crystals is the main source of the metal it is
  named for.
examples:
- The miner picked up a piece of zirconium silicate.
- The furnace was lined with zirconium silicate.
