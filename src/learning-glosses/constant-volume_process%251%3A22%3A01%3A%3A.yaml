senseId: 'constant-volume_process%1:22:01::'
synsetId: 92440968-n
simpleMeaning: A change to do with heat and energy, in which the amount of space inside a closed set-up
  stays the same.
scope: Isochoric process, isometric process, and isovolumetric process are other names for this sense.
examples:
- In a constant-volume process, the gas cannot expand as it warms up.
- The scientist measured the heat of a constant-volume process in the lab.
