senseId: 'xerophilous_plant%1:20:00::'
synsetId: 13141863-n
simpleMeaning: A plant adapted to scarce water. Compare a hydrophyte, adapted to water, and a mesophyte,
  adapted to moderate moisture.
scope: This one is also called a desert plant, a xerophile, a xerophyte, and a xerophytic plant, and it
  is not one of the kinds that need plenty of water.
examples:
- The xerophilous plant in their garden lived through the long dry summer.
- They chose a xerophilous plant for the sunny bed because it asks for very little water.
