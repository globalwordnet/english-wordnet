simpleMeaning: A simple valve with a flap hinged on one side that lets fluid flow in only one direction.
scope: This one is also called clack and clapper valve.
examples:
- The clack valve in the old pump stopped the water from running back.
- A clack valve lets water through in one direction and stops it from coming back.
