simpleMeaning: A plant that comes up, flowers, and dies within a single year, growing in North America
  with red or pink flowers.
scope: It is also called compass plant, prairie bird's-foot trefoil, prairie lotus, and Lotus americanus.
examples:
- The prairie trefoil spread its red flowers across the dry field.
- We found prairie trefoil growing beside the path.
