simpleMeaning: Large perennial grasses of riverbanks and ditches, with spreading underground stems, jointed
  stalks, and large, feathery clusters of gray-white flowers.
scope: Large long-lived grasses by rivers and ditches with jointed stems and feathery flower heads, not
  bamboo and not a small lawn grass.
examples:
- Giant reed grows in thick stands along the river bank.
- The giant reed by the ditch had tall jointed stems and feathery grey-white flower heads.
