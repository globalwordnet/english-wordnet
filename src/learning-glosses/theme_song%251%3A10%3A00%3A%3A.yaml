simpleMeaning: A tune that keeps coming back in a play or film with music, by which people come to know
  the show.
scope: It is about a tune that marks a show, not a performer or a show on radio or TV.
examples:
- They hummed the theme song from the film.
- The theme song came back again and again through the play.
