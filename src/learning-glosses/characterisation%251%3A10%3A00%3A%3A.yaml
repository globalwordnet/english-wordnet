simpleMeaning: A telling in words that makes a thing clear and lively.
scope: This sense is also called picture, depiction, characterization, delineation, word-painting, and
  word picture.
examples:
- The pamphlet contained brief characterizations of famous Vermonters.
- The characterisation of the old market in the book was so clear and lively that I felt I was there.
