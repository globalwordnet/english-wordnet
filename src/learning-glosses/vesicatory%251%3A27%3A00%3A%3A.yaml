simpleMeaning: The skin rises in blisters from this chemical, and mustard gas is above all one such chemical.
scope: This chemical is also called vesicant, and it does not leave the skin as it was.
examples:
- The nurse warned them that the vesicatory would raise blisters where it touched the skin.
- They washed the vesicatory off the skin at once, before blisters could form.
