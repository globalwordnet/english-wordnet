simpleMeaning: A substance that kills the seed cells able to begin a baby, keeping sex from making a baby.
scope: Also called spermatocide. It is a noun for a substance.
examples:
- The spermicide kills the cells before they can reach an egg.
- They used the spermicide each time they had sex.
