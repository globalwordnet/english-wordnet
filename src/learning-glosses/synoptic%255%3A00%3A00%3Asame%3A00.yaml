simpleMeaning: Showing a thing, or seeing it, in the same way as others do, above all in the first three
  gospels of the New Testament.
scope: This word marks a shared way of looking at a thing, used most of all for the first three gospels
  of the New Testament, also called synoptical.
examples:
- The class read the synoptic sayings in the first three gospels.
- The books take a synoptic view of the same events.
