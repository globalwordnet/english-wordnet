simpleMeaning: A person who holds that life first came from matter that was never alive.
scope: It is a person, not one who holds that life comes only from living things.
examples:
- The abiogenist argued that the first living things rose from lifeless matter.
- As an abiogenist, they held that life could start without a parent.
