simpleMeaning: A rare-earth metal with a yellowish tint that commonly forms ions with a charge of +3.
  It occurs with cerium, lanthanum, and praseodymium in monazite and bastnasite.
scope: This is a yellow metal of the rare earth group found with cerium, lanthanum and praseodymium; also
  called Nd and atomic number 60.
examples:
- Neodymium is a yellow metal of the rare earth group.
- Neodymium comes from monazite and bastnasite.
