senseId: 'voice_in_the_wilderness%1:18:01::'
synsetId: 92465797-n
simpleMeaning: A person, a group, or others speak up with an idea or a plea, but nobody listens.
scope: This is a person or group, not a leader others follow.
examples:
- Churchill's early warning of the danger of Nazism was a voice in the wilderness.
- Their warnings about the flood were a voice in the wilderness until the water came.
