simpleMeaning: A number that shows how far the values in a small group picked by chance sit from their
  average, the group picked from one whole set.
scope: Among numbers that sum up a set of values, this one shows how far the values in a chance-picked
  group sit from their average.
examples:
- They worked out the sample standard deviation of the marks.
- They worked out the sample standard deviation of the rainfall figures.
