simpleMeaning: To turn the hand or the lower arm so that its back faces down or to the back, or to turn
  the leg out to the side.
scope: It is a verb for a movement, not a word for lying down.
examples:
- The doctor asked the patient to supinate one hand so the palm could be seen.
- The nurse asked the patient to supinate one arm before taking a blood sample.
