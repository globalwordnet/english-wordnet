simpleMeaning: A sturgeon of the northwestern coast of North America that people catch for food and for
  sport and that lives in both sea and fresh water.
scope: Acipenser transmontanus, Pacific sturgeon, and Sacramento sturgeon are other names for this fish,
  not the one valued for caviar in the Black and Caspian seas.
examples:
- They caught a white sturgeon off the northwestern coast for dinner.
- The white sturgeon in the river spends part of its life in the sea.
