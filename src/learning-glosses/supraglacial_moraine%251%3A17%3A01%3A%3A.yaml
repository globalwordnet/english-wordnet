senseId: 'supraglacial_moraine%1:17:01::'
synsetId: 92430034-n
simpleMeaning: A buildup of rock, soil, and other debris on the surface of a glacier.
scope: This is a heap of stones and earth built up from bits that settled on top of the ice, not bits
  buried deep in it.
examples:
- Bits of rock had settled to form a supraglacial moraine on the ice.
- A supraglacial moraine covered the top of the ice.
