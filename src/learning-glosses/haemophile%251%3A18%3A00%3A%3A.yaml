simpleMeaning: A person with a condition in which blood does not clot, who bleeds without control.
scope: This person is also called a bleeder, a haemophiliac, a hemophile, or a hemophiliac.
examples:
- The haemophile carried medicine in case of a cut.
- A haemophile must take care to avoid injuries.
