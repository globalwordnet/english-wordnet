simpleMeaning: Yellow or orange-red colouring matter in plants that dissolves in fat.
scope: This one is about the colouring matter itself, not the other sense of the same word, which names
  one kind of it that turns into vitamin A in the liver.
examples:
- Carrots owe their orange colour to carotene.
- The leaves held carotene even after they dried.
