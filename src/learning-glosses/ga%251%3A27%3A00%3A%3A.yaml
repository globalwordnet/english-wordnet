simpleMeaning: A rare silvery metal, usually trivalent, found in traces in bauxite and zinc ores. It is
  brittle when cold and melts just above room temperature.
scope: A metal, also called atomic number 31 and gallium; not iron and not a rock.
examples:
- Ga is runny when warm.
- Ga is found in bauxite and zinc ores.
