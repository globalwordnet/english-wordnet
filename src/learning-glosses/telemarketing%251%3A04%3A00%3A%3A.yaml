simpleMeaning: A seller rings people up to tell them about goods and get them to buy, talking back and
  forth with each one.
scope: This is also called telecommerce or teleselling, and it is done by phone, not face to face.
examples:
- They use telemarketing to tell people about the new goods.
- The firm grew its sales through telemarketing.
