senseId: 'papanicolaou_test%1:09:00::'
synsetId: 05751241-n
simpleMeaning: A screening test in which stained cells from the cervix are examined under a microscope
  for abnormal changes, including changes that may lead to cervical cancer.
scope: The test screens cells from the cervix, the lower part of the uterus.
examples:
- Her Papanicolaou test showed changes in some cervical cells.
- The clinic offered a Papanicolaou test as part of cervical screening.
