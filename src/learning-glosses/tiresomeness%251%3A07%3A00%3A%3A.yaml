simpleMeaning: The dull feeling that comes from something going on too long or too slowly.
scope: Also called tedium and tediousness. It is a kind of dullness.
examples:
- The tiresomeness of the long speech made the room yawn.
- The tiresomeness of the slow train ride wore on everyone.
