simpleMeaning: Fluid outside the body's cells that contains proteins and electrolytes, including blood
  plasma and the fluid between cells.
scope: A body liquid, not blood itself and not the liquid inside cells; also called extracellular fluid.
examples:
- The body holds about 15 quarts of ECF outside the cells.
- ECF carries proteins and salts through the tissues.
