simpleMeaning: In genetics, whether a living thing is male or female is fixed by this thread-like part.
scope: In genetics, this thread-like part stands apart from the other parts inside a living thing by fixing
  whether it is male or female.
examples:
- Most mammals have two sex chromosomes.
- Whether it was male or female was fixed by a sex chromosome.
