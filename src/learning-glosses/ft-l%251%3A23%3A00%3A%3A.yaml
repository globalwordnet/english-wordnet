simpleMeaning: A unit of surface brightness, such as the brightness of a movie screen. One foot-lambert
  is the brightness of a perfectly diffusing white surface reflecting one lumen per square foot.
scope: The abbreviation ft-L stands for foot-lambert.
examples:
- The projectionist measured the center of the screen at 15 ft-L.
- The brightness at the edge of the screen was 2 ft-L lower.
