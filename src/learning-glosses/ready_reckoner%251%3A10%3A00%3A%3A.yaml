simpleMeaning: Tables in a book that give you the answers to sums, so you can look them up instead of
  working them out.
scope: Also called a reckoner, it is a book of tables that gives the answers to sums.
examples:
- They turned to the ready reckoner for the answer to the sum.
- The ready reckoner gave the answer in its tables.
