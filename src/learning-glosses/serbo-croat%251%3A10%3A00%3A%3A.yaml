simpleMeaning: A Slavic language of the Serbs and Croats. Serbian is commonly written in Cyrillic and
  Croatian in the Latin alphabet.
scope: Also called Serbo-Croatian; a Slavic tongue of the Balkans written in two scripts, with one form
  usually in Cyrillic letters and the other usually in Roman letters.
examples:
- She speaks Serbo-Croat at home with her family.
- The book was printed in Serbo-Croat with Roman letters.
