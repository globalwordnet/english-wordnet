senseId: 'expatriation%1:04:01::'
synsetId: 00056907-n
simpleMeaning: The act of leaving one place to live in another, above all leaving the country where one
  was born to settle in a different one.
scope: This one is also called emigration and out-migration.
examples:
- Their expatriation took them from the village where they grew up to a new home overseas.
- The expatriation of the whole family began with a single letter from abroad.
