simpleMeaning: A kind of smallpox germ that kills as many as one in four of the people it strikes.
scope: Also called variola major virus. It is the germ itself, not the illness it causes.
examples:
- Variola major killed one in four of those who caught it.
- They gave the vaccine to guard against variola major.
