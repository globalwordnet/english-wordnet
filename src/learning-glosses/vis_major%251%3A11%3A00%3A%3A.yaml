simpleMeaning: A natural disaster no one can stop, which breaks into the way things were meant to go.
scope: Also called force majeure, inevitable accident, unavoidable casualty, and act of God. It is a natural
  event, not a human act.
examples:
- The flood was a vis major that stopped all the trains.
- The vis major closed the port for a week.
