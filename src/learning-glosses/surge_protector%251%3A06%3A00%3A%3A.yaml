simpleMeaning: A device connected to a power line to protect electrical equipment from sudden surges of
  electricity.
scope: Lightning arrester, spike arrester and spike suppressor are also names for it, and surge suppressor
  is another name for it.
examples:
- They plugged the computer into a surge protector.
- The television was plugged into a surge protector.
