synsetId: 92419119-n
simpleMeaning: The habit of feeding on live animals one has caught, most often a bird.
scope: It is also called predaceousness, rapaciousness, or rapacity. It is about an animal that hunts
  live animals, not about one that eats plants.
examples:
- The predaciousness of the eagle was clear when it swooped on a rabbit.
- The owl's predaciousness helps it catch mice at night.
