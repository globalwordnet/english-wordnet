simpleMeaning: The third section of the stomach of an animal that brings its food back up to chew it again.
scope: Also called the omasum or the third stomach. It is a body part.
examples:
- Food passes through the psalterium before it reaches the last stomach.
- In a cow, the psalterium sits between the second and fourth stomachs.
