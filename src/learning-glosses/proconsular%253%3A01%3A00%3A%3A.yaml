simpleMeaning: To do with a Roman ruler who governed a land far from Rome, or like such a ruler.
scope: It is said of a person or a thing, not of the ruler himself.
examples:
- The proconsular offices stood at the edge of the town.
- They spoke of proconsular rule in the far lands of the empire.
