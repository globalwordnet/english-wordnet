senseId: 'demonetization%1:04:00::'
synsetId: 00155905-n
simpleMeaning: The act by which a country stops a thing, like gold or silver, from counting as money the
  law says must be accepted.
scope: This one is also called demonetisation.
examples:
- The demonetization of the old coins took place in a single year.
- People rushed to spend their notes before the demonetization took effect.
