simpleMeaning: A silvery radioactive metal whose atoms can split. It occurs in traces in uranium ores
  and is usually made in reactors. Its isotopes include plutonium-239.
scope: Plutonium is a chemical element with atomic number 94.
examples:
- Scientists study plutonium in the laboratory.
- A tiny amount of plutonium can give off a great deal of energy.
