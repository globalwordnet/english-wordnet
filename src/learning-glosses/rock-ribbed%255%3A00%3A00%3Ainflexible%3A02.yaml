simpleMeaning: They hold fast to old ways, and no argument changes their mind.
scope: A die-hard is another name for a person like this, who holds fast to old ways and refuses to change
  their mind, not a place full of rocky cliffs.
examples:
- A rock-ribbed republican refused to change their mind.
- The rock-ribbed members would not give way.
