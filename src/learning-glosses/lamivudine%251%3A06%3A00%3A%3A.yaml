simpleMeaning: A drug that blocks an enzyme HIV needs to copy itself. It works especially well with zidovudine
  in treating HIV infection, including AIDS.
scope: A drug used with zidovudine in treating AIDS and HIV, not zidovudine itself.
examples:
- The doctor gave lamivudine with zidovudine to treat the HIV infection.
- Lamivudine stops the virus from copying itself.
