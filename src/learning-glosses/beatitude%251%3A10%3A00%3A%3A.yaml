simpleMeaning: One of eight sayings of Jesus at the beginning of the Sermon on the Mount. In Latin, each
  begins with a form of beatus, meaning blessed.
scope: This is one of the eight sayings, not the whole Sermon and not a prayer.
examples:
- Her favourite Beatitude is 'Blessed are the meek'.
- The Beatitude was read aloud in church.
