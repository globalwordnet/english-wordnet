synsetId: 05551174-n
simpleMeaning: An irregular soft spot on each side of a baby's skull where the frontal, parietal, temporal,
  and sphenoid bones meet. After hardening, this junction is called the pterion.
scope: The side gap near the temple in a young skull, not the large gap on top of the head or the small
  one behind the ear.
examples:
- The sphenoid fontanelle lies close to the temple.
- A nurse can feel the sphenoid fontanelle on a newborn's head.
