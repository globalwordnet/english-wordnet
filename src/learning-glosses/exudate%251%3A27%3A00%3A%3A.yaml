simpleMeaning: A substance that seeps slowly out of the small openings in a plant.
scope: This one is also called exudation, and it is not about the act of letting a liquid out.
examples:
- A drop of exudate glistened on the cut stem.
- The gardener wiped the exudate from the bark before tying the branch.
