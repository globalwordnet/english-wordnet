simpleMeaning: Material in the cell nucleus that stains readily and contains DNA, proteins, and some RNA.
  It condenses into visible chromosomes during cell division.
scope: Cell-core stuff that takes dye with ease, also called chromatin.
examples:
- Chromatin granules pack into chromosomes.
- The nucleus holds chromatin granules.
