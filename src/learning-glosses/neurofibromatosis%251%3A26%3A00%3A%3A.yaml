senseId: 'neurofibromatosis%1:26:00::'
synsetId: 14181661-n
simpleMeaning: An inherited disorder causing many nerve tumors and spots on the skin, often with developmental
  problems. One altered copy of the gene can cause the disorder.
scope: A disease passed down in families, marked by many lumps on the nerves and spots on the skin, not
  by one lump alone.
examples:
- Neurofibromatosis brings many lumps on the nerves and spots on the skin.
- People with neurofibromatosis often show problems in how the body grows.
