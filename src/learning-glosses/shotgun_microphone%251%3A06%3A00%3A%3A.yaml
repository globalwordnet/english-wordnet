simpleMeaning: A microphone with a long tube that picks up sound mainly from the direction it points,
  even when the sound source is some distance away.
scope: It is also called a gun microphone, a gun mike, and a shotgun mike, and it is the tool for picking
  up one voice from far off.
examples:
- The sound man aimed the shotgun microphone at the speaker from across the hall.
- The crew used a shotgun microphone to pick up the birdsong from far away.
