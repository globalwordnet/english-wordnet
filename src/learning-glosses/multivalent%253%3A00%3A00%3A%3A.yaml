simpleMeaning: Said of three or more matching parts of a cell that carry its plans, joined together during
  the first stage of the cell division that makes sex cells.
scope: It is an adjective.
examples:
- The multivalent chromosomes pair up during the first division.
- Scientists study multivalent groupings in the early stages of cell division.
