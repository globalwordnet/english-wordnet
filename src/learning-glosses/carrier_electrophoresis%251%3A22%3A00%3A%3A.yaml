simpleMeaning: A way of sorting tiny parts of a thing with a charge on paper that soaks up liquid.
scope: Also called paper electrophoresis. It is about paper.
examples:
- Carrier electrophoresis was used to sort the proteins in the sample.
- The lab ran carrier electrophoresis on filter paper to tell the parts apart.
