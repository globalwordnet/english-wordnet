simpleMeaning: A severe allergic reaction after swallowing or receiving an injection of a substance, such
  as a protein or drug, to which previous exposure has made the body sensitive.
scope: Of a substance swallowed or injected after earlier contact.
examples:
- Their anaphylaxis struck at noon.
- The anaphylaxis was treated at once.
