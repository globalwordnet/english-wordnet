senseId: nescient%5:00:00:uneducated:00
synsetId: 00834764-s
simpleMeaning: Generally uneducated or lacking knowledge or sophistication.
scope: Also called ignorant, unlettered, or unlearned. It is about a general lack of teaching, not a gap
  in one small field.
examples:
- They were nescient of contemporary literature and had read almost none of it.
- A nescient worker may know the job well yet know little of the world outside it.
