simpleMeaning: Making images of internal organs from echoes of high-frequency sound waves, commonly to
  study organs or monitor a developing baby during pregnancy.
scope: This sense is also called ultrasound, echography, and ultrasonography.
examples:
- Sonography builds a picture of a body part.
- A sonography watched the babe grow.
