synsetId: 00638447-s
simpleMeaning: Said of a person who feels no regret for past wrongs and cannot be turned to better ways.
scope: Also called unreformable. It is a word for a person, not for one who simply has not changed.
examples:
- The court faced an unregenerate criminal who showed no regret.
- The unregenerate thief went back to stealing the week they got out.
