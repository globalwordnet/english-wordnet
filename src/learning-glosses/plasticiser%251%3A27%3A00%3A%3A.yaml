simpleMeaning: A substance that is mixed into a material that can be shaped, or into other materials,
  to make them bend more easily without breaking.
scope: Also called a plasticizer. It is a substance.
examples:
- The plasticiser in the film kept it soft and bendy.
- Too much plasticiser made the material weak.
