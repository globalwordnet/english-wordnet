simpleMeaning: A stock or bond not registered with the United States agency that controls the sale of
  shares and money promises, and so not for sale in the public market.
scope: It is a stock or a bond.
examples:
- They held letter securities they could not sell in the public market.
- Investors asked about the letter security, but it was not for sale in the public market.
