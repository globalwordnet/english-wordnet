simpleMeaning: A quantity whose value depends on the outcome of a chance event.
scope: Also called variant, random variable, stochastic variable, and variate.
examples:
- The chance variable took a new value each time the test ran.
- The chance variable in the study stood for the number of cars that passed each hour.
