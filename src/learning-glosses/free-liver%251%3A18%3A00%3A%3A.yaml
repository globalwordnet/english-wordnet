simpleMeaning: Someone who gives in to what the body wants, above all food and drink, and goes further
  in it than most people do.
scope: This one is about a person.
examples:
- The free-liver ate and drank far more than anyone else at the table.
- They lived as a free-liver, giving in to every appetite.
