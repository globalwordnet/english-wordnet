simpleMeaning: A written promise to pay money back, unregistered with the United States body overseeing
  the sale of stocks and money promises, so not for sale to the public.
scope: It is a promise about money.
examples:
- They bought letter bonds when the firm first needed money.
- They kept their letter bond for years, since it was not for sale to the public.
