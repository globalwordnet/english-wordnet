simpleMeaning: A strange person whose odd habits make others dislike being near them.
scope: Also called creep, spook, weirdo and weirdy. It is a person, not a thing.
examples:
- The neighbours thought the weirdie on the corner was best left alone.
- Nobody wanted to sit next to the weirdie at lunch.
