senseId: 'demoralization%1:04:00::'
synsetId: 00273557-n
simpleMeaning: The act of taking away the moral ground that a belief or a plan rests on.
scope: This one is also called demoralisation, but it is not the low feeling that comes when your confidence
  is worn down.
examples:
- The demoralization of the old policy left its supporters with nothing to stand on.
- Critics warned that the demoralization of the doctrine would follow the scandal.
