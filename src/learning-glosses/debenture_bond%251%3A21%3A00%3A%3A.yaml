synsetId: 13360859-n
simpleMeaning: The chance to get goods or have work done first and pay afterwards, given by a seller who
  trusts that payment will come.
scope: This one is also called a debenture or an unsecured bond, and it is not the paper that says a sum
  is owed.
examples:
- The debenture bond let the buyer take the furniture home before paying for it.
- The customer signed a debenture bond and took the goods home, promising to pay later.
