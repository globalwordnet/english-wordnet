simpleMeaning: Relating to or showing the ability of a chemical element to exist in different forms.
scope: Also called allotropic. It is about one chemical element.
examples:
- Sulfur takes allotropical forms when it is heated and cooled.
- Oxygen and ozone are allotropical forms of the same element.
