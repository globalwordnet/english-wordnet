simpleMeaning: The trait of staying firmly in charge of what one does, holding back one's own urges on
  purpose.
scope: Also called possession, willpower, self-command, self-control, self-will, and will power. It is
  a noun.
examples:
- They kept their self-possession while the crowd grew loud.
- A speaker needs self-possession to face a hard crowd.
