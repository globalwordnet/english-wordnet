simpleMeaning: A measure of computing speed equal to one septillion floating-point operations per second,
  or 10 to the 24th power such calculations per second.
scope: 'Also called yottaflop: a unit of computer speed, not a unit of size or of time.'
examples:
- The new machine runs at ten YFLOPS.
- Engineers measure the system in YFLOPS.
