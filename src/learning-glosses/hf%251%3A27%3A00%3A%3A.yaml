simpleMeaning: Hafnium, a gray metal usually forming compounds with valence four. It resembles zirconium,
  occurs in zirconium minerals, and readily releases electrons in filaments.
scope: Also called atomic number 72 and hafnium; a grey metal like zirconium, not zirconium itself.
examples:
- Hf is used in filaments.
- The sample contained Hf.
