simpleMeaning: Extremely fine or thin, as when a spectral line splits into two or more very closely spaced
  lines.
scope: Very, very thin, as of a line of light split into parts; not merely thin and not thick.
examples:
- The hyperfine lines in the spectrum were split into two parts.
- Physicists study hyperfine structure to learn about atoms.
