simpleMeaning: The chest walls send their blood out through these blood vessels.
scope: These are the blood vessels of the walls of the chest, also called thoracic veins, not the ones
  in the belly.
examples:
- The vena thoracica carried blood away from the walls of the chest.
- Blood from the walls of the chest flowed out through the vena thoracica.
