simpleMeaning: The amount of a substance held in a liquid, found by adding another liquid drop by drop
  until a change shows.
scope: Also called titre. It is a kind of value.
examples:
- The chemist wrote down the titer before the next test.
- A low titer meant the mix was too weak.
