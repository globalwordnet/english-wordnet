simpleMeaning: To make a sudden sharp movement away, out of anger, bitterness, or protest.
scope: It is a person's movement, not an animal rising on its hind legs.
examples:
- The workers reared back in protest when the manager cut their pay.
- They reared back at the rude remark, too angry to answer.
