simpleMeaning: An acetaminophen medicine for mild pain without an anti-inflammatory effect. It also lowers
  fevers. Other acetaminophen tablet trademarks include Datril, Tylenol, Panadol, Tempra and Anacin III.
scope: A mild painkiller, also called acetaminophen, Anacin III, Datril, Panadol, Tempra and Tylenol;
  not aspirin and not ibuprofen.
examples:
- She took Phenaphen for her headache.
- Phenaphen brought his fever down.
