simpleMeaning: In a way that breaks the law and fights against those in charge.
scope: This is not a way of acting that follows the law and obeys those in charge.
examples:
- The crowd acted anarchically, breaking rules and shouting against the guards.
- After the order broke down, the streets filled anarchically with people who answered to no one.
