simpleMeaning: Said of a thing that has to do with the small bones of the backbone, or that is one of
  those bones itself.
scope: It is an adjective about bones, not about the backbone as a whole.
examples:
- The X-ray showed a crack in one vertebral bone.
- The vertebral column is made of small bones stacked one on another.
