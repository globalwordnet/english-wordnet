simpleMeaning: Seventeenth-century teachings named for their founder, Jacobus Arminius, who rejected John
  Calvin's belief that salvation is fully predetermined and held that human free will fits with God's
  rule.
scope: A set of beliefs from the 1600s named for Jacobus Arminius, not Calvin's teaching that God fixes
  all that happens and not a set of rules for church life.
examples:
- Arminianism spread through the Dutch churches in the 1600s.
- He wrote about Arminianism and free will.
