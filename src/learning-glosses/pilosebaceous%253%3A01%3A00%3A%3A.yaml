senseId: 'pilosebaceous%3:01:00::'
synsetId: 02789340-a
simpleMeaning: Relating to a hair follicle, the pocket where a hair grows, and the oil gland attached
  to it.
scope: Said of a hair root and its oil-making gland, not of the hair shaft alone and not of the sweat
  glands.
examples:
- Each pilosebaceous part of the skin joins a hair root to its oil-making gland.
- The doctor looked at the pilosebaceous glands in the skin sample.
