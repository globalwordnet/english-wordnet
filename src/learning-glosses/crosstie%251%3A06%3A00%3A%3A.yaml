simpleMeaning: One of the beams that lie at right angles to the rails of a railway track and hold them
  up.
scope: Tie, sleeper, and railroad tie are other names for this thing.
examples:
- The workers laid a new crosstie under the rails.
- A cracked crosstie had to be pulled out and a sound one put in its place.
