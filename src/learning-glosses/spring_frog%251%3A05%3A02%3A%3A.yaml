simpleMeaning: In or near marshes and ponds in the United States and Canada lives a frog much like a bullfrog.
scope: Green frog, Lithobates clamitans, and Rana clamitans are other names for this animal; it is not
  the green or brownish one with white-edged dark oval spots.
examples:
- We heard a spring frog in the marsh near the pond.
- A spring frog lives in the ponds of the United States and Canada.
