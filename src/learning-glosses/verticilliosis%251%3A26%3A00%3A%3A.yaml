senseId: 'verticilliosis%1:26:00::'
synsetId: 14307027-n
simpleMeaning: A plant disease in which infection with a fungus from the genus Verticillium causes wilting.
scope: This word names a wilt caused by one kind of fungus, not a wilt caused by just any fungus.
examples:
- The farmer found verticilliosis in the tomato plants, and half the crop drooped.
- The lab found verticilliosis in the drooping stems, and the grower pulled up the sick plants.
