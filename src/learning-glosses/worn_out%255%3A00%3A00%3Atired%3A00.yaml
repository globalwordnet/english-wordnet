simpleMeaning: Completely exhausted, with little energy or ability to function left.
scope: Also called spent, gone, exhausted, fatigued, fagged, dog-tired, played out, washed-out, and worn-out.
  It is said of a person or a thing.
examples:
- They looked worn out after the long day in the fields.
- The worn out shoes could no longer keep the rain away.
