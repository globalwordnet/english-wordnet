senseId: 'majuscule%1:10:00::'
synsetId: 06837277-n
simpleMeaning: A large letter used at the start of a proper name in writing or print, and now and then
  to give a word extra force.
scope: It is also called capital, capital letter, upper-case letter, and uppercase.
examples:
- The majuscule at the start of the name stood out in the old letter.
- Printers once used a majuscule to mark the first word of a chapter.
