simpleMeaning: A drug sold as Purinethol that disrupts the body's use of purines and is used to treat
  acute lymphocytic leukemia, a blood cancer.
scope: It is sold as Purinethol and used for a sudden blood illness of white cells, working by getting
  in the way of how the body breaks down purine.
examples:
- Mercaptopurine was used to treat the sudden blood illness of white cells.
- The mercaptopurine got in the way of how the body breaks down purine.
