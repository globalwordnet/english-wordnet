senseId: 'war_zone%1:15:00::'
synsetId: 08706517-n
simpleMeaning: An area of military operations, especially a declared area at sea where warring parties
  may restrict the rights of neutral ships.
scope: A place of fighting where fighting is run from; not a whole country in a fight and not a safe place
  behind the lines.
examples:
- Ships were warned to keep out of the war zone.
- The war zone covered the sea where the fighting was.
