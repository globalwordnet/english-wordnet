synsetId: 13325687-n
simpleMeaning: In an auction, a seller sets this lowest price, and no bid below it is heard.
scope: At an auction, this is the floor a seller sets, not what the thing at last sells for.
examples:
- The upset price for the house was set so low that the bidding soon passed it.
- No one could bid below the upset price the seller had set.
