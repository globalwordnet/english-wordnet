simpleMeaning: A graph of the heart's electrical activity over a series of beats, recorded by an electrocardiograph.
scope: Also called cardiogram, electrocardiogram and ECG; the record is drawn by a machine that reads
  the heart's beats.
examples:
- The nurse ran an EKG after his chest pain.
- The EKG showed a steady heartbeat.
