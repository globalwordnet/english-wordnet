simpleMeaning: Of a thing split into boxes or groups, each kept apart from the others.
scope: Compartmentalised and compartmentalized are other names for this thing.
examples:
- The report was compartmental in form, with a box for each kind of cost.
- Their thinking was compartmental, keeping work and home in separate boxes.
