simpleMeaning: A curve over an opening that rises less than half as high as it is wide.
scope: Also called diminished arch, skeen arch, and skene arch. It is a noun.
examples:
- A scheme arch spans the wide doorway.
- Builders used a scheme arch to span the wide window.
