simpleMeaning: A rare fatal brain disease caused by an abnormal protein called a prion, usually in later
  adulthood. It rapidly impairs memory, thinking, and control of movement.
scope: Usually called Creutzfeldt-Jakob disease, or CJD.
examples:
- Jakob-Creutzfeldt disease affected his balance and memory.
- The neurologist recognized the rapid progression of Jakob-Creutzfeldt disease.
