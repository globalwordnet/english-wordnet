simpleMeaning: A large weapon built to shoot upward at planes flying overhead.
scope: This sense is also called flak, antiaircraft, ack-ack, ack-ack gun, flack, and pom-pom, and the
  weapon shoots upward at planes, not along the ground.
examples:
- The soldiers trained the antiaircraft gun on the approaching planes.
- The soldiers placed an antiaircraft gun beside the runway, ready for the next raid.
