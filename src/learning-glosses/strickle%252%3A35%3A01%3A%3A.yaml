simpleMeaning: To make the top of the contents of a measuring container flat by drawing a straight edge
  across it.
scope: It is a verb, not the tool for leveling grain in a measure, the tool for shaping a mold in sand,
  or the tool for sharpening a scythe.
examples:
- They strickled the sand in the measure and set it aside.
- They strickled the sand in the container with a long rod.
