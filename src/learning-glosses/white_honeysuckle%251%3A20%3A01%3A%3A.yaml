simpleMeaning: A bushy honeysuckle with twining branches and white or yellowish-white flowers, found in
  the southern United States.
scope: A thick bush with winding branches and pale or yellow-pale flowers of the south of the United States,
  not the swamp shrub of the same name and not a vine.
examples:
- White honeysuckle covered the fence in June.
- The white honeysuckle in the garden smelled sweet at dusk.
