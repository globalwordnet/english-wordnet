simpleMeaning: An older type of television camera whose lens focuses an image onto a light-sensitive surface
  scanned by an electron beam.
scope: Also called a camera and a television camera, this lens system throws a picture onto a surface
  that reacts to light and reads it with a stream of tiny charged bits.
examples:
- The tv camera sent the pictures.
- A tv camera was ready for the broadcast.
