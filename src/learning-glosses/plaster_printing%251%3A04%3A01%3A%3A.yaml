simpleMeaning: Printing from a plaster copy of an engraved plate. The grooves in the plate form raised
  lines on the plaster.
scope: The raised lines are on the plaster surface used to make the print.
examples:
- Plaster printing was used to copy fine lines from a cut plate.
- For plaster printing, she rolled ink over the raised lines of the cast.
