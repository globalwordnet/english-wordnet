simpleMeaning: Any of several grasses in the genus Eragrostis, especially useful as feed for grazing animals
  and for preventing soil erosion.
scope: This is any of several kinds of grass in the group Eragrostis, also called love grass, useful above
  all as food for farm animals and for stopping soil from washing away.
examples:
- Bay grass feeds farm animals and stops soil from washing away.
- The farmer cut bay grass to feed his animals.
