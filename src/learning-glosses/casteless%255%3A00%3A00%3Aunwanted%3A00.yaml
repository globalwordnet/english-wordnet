simpleMeaning: Said of a person who belongs to no fixed group in society, or has been thrown out of one,
  and so has no place or standing there.
scope: Outcaste is another name for this state.
examples:
- The foreigner was a casteless person.
- After the expulsion, they lived as casteless people, shut out of every gathering.
