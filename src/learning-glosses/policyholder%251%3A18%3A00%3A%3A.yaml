simpleMeaning: A person who holds an insurance policy, usually the customer in whose name the policy was
  issued.
scope: A person in whose name a written cover deal is made, not the firm that sells the cover and not
  a person with no cover at all.
examples:
- The policyholder must tell the firm about any change.
- As policyholder, she paid the yearly fee for the cover.
