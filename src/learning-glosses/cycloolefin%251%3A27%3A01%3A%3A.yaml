simpleMeaning: A hydrocarbon with a ring of carbon atoms containing a carbon–carbon double bond. The ring
  is nonaromatic.
scope: A chemical built from hydrogen and carbon that holds a closed ring of carbon bits; also called
  cycloalkene, not a straight-chain chemical and not a special ring chemical.
examples:
- Cycloolefins hold a closed ring of carbon atoms.
- The chemist studied a cycloolefin with a closed ring of carbon atoms.
