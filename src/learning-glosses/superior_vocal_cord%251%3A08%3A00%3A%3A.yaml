simpleMeaning: Either of the two folds above the true vocal cords that normally play no part in producing
  the voice.
scope: It is also called a false vocal cord, a false vocal fold, a ventricular fold, or a vestibular fold.
examples:
- The surgeon could see the superior vocal cords above the true cords.
- The superior vocal cord was swollen after the cold.
