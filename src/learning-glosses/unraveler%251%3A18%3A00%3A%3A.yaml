simpleMeaning: A person who takes the knots out of a thing, and frees it from its tangled state.
scope: Also called disentangler and unraveller. It is a person, not a tool.
examples:
- The unraveler worked through the knotted rope until it lay straight.
- They called in an unraveler to sort out the tangled yarn.
