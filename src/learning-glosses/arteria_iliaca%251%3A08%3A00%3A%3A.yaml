simpleMeaning: One of the large blood vessels bringing blood to the lower body, to the pelvis and the
  legs.
scope: Also called the iliac artery, this one is not a blood vessel that feeds the upper body.
examples:
- Blood reaches the legs through the arteria iliaca.
- The surgeon traced the arteria iliaca to find where the blood flow was blocked.
