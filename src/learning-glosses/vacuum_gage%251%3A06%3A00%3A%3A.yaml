simpleMeaning: An instrument that measures how far a pressure is below the surrounding atmospheric pressure.
scope: Also called vacuum gauge. It is a tool, not the air itself.
examples:
- The vacuum gage on the pump showed the pressure was low.
- The worker checked the vacuum gage before sealing the jar.
