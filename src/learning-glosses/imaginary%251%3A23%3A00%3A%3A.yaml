synsetId: 13751538-n
simpleMeaning: A number involving i, the square root of minus one. A purely imaginary number has the form
  bi, where b is real.
scope: The wider class of complex numbers has the form a + bi. Purely imaginary numbers have zero real
  part, as in 3i.
examples:
- The teacher wrote the imaginary number 4 + 3i on the board.
- In this lesson, every imaginary number on the page is written in the form a + bi.
