simpleMeaning: Deep under the ground, water sits in the earth and in rocks that let it seep through.
scope: This is also called ground water and spring water, and it is not the kind that runs on the surface.
examples:
- They dug down to reach well water held in the rocks below.
- The house has used well water from under the fields for years.
