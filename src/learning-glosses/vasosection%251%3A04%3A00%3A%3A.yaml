simpleMeaning: A surgeon cuts into, or cuts right through, the tube that carries sperm from the testicle.
scope: This operation is also called vasotomy.
examples:
- The surgeon did a vasosection, cutting into the tube that carries sperm from the testicle.
- After the vasosection, the tube that carries sperm was cut right through.
