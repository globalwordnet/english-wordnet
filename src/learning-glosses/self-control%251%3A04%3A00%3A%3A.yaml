simpleMeaning: The act of holding back sudden urges and refusing what one wants.
scope: Also called self-denial and self-discipline. It is a noun.
examples:
- They showed great self-control by leaving the cake alone and going for a walk instead.
- Their self-control kept them from shouting when the news came in.
