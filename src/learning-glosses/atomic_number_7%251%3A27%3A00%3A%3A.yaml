simpleMeaning: Nitrogen, a common nonmetal usually forming a colorless, odorless, tasteless, relatively
  unreactive two-atom gas. It makes up 78 percent of air by volume and occurs in all living tissues.
scope: 'Also called N and nitrogen: a common nonmetal gas of two atoms, not a metal and not a gas with
  a smell.'
examples:
- Atomic number 7 makes up most of the air we breathe.
- Nitrogen, atomic number 7, is found in all living things.
