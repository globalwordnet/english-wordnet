senseId: 'reentering_angle%1:25:00::'
synsetId: 13912757-n
simpleMeaning: Where the edge of a many-sided shape bends inward, the inside corner there is wider than
  a half-turn
scope: This is the inside corner where the edge of a many-sided shape bends inward, also called a reentrant
  angle, not a corner that juts outward.
examples:
- The reentering angle marked the dent in the side of the shape.
- You can spot a reentering angle where the edge turns back in on itself.
