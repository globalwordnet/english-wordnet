simpleMeaning: A big hare living in North America, with very large feet, and fur that goes white when
  winter comes.
scope: Also called snowshoe hare and varying hare. It is a noun, known by the Latin name Lepus americanus.
examples:
- The snowshoe rabbit sat still in the brush, its white coat hard to spot.
- A snowshoe rabbit crossed the trail on its big feet.
