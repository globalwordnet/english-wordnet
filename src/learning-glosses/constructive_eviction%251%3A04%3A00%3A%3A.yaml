schema: oewn-learning-gloss-v2
senseId: 'constructive_eviction%1:04:00::'
synsetId: 01197394-n
simpleMeaning: A landlord's actions that force a tenant to leave, for example by making the property unlivable,
  without physically removing the tenant or using eviction proceedings.
scope: 'Also called eviction: a landlord forcing a tenant out by making the place unfit to live in, not
  a court-ordered removal and not a lockout.'
examples:
- The tenant left after the constructive eviction made the flat unfit to live in.
- A constructive eviction needs no court order.
