simpleMeaning: A word shape that shows a greater amount of a quality, or a thing done more strongly, as
  in 'faster' for 'fast'.
scope: Comparative is another name for this thing.
examples:
- In class we practised the comparative degree by turning 'big' into 'bigger'.
- The test asked for the comparative degree of 'good', and most of us wrote 'better'.
