simpleMeaning: Sodium, a soft, silvery, waxy alkali metal found abundantly in natural compounds, especially
  in salt water. It burns yellow and reacts violently with water. Seawater and rock salt contain it.
scope: A soft metal, not potassium and not a salt; also called sodium and atomic number 11.
examples:
- Na burns with a yellow flame in water.
- Na is found in salt water and in rock salt.
