simpleMeaning: A highly poisonous protein found in castor beans. It is used in chemical research and has
  been used as a biological weapon.
scope: 'Also called ricin: a poison in the form of a protein from castor beans, not a poison made in a
  lab.'
examples:
- One milligram of ricin toxin can kill an adult.
- Ricin toxin was used as a weapon that spreads sickness.
