simpleMeaning: Allergic or unusually sensitive, especially to a particular substance or other trigger.
scope: Also called allergic, hypersensitive, sensitized, hypersensitised, hypersensitized, sensitised,
  supersensitised, and supersensitive, this is the word for such a person.
examples:
- The supersensitized workers kept clear of the dust.
- Once supersensitized to the drug, the patient could not take it again.
