simpleMeaning: How strongly a thing can send back beams or rays that strike it.
scope: Also called reflection and reflexion. It is a quality.
examples:
- The shiny metal has high reflectivity, so it sends back most of the light that hits it.
- They chose the paint for its reflectivity, to make the room brighter.
