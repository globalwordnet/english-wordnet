senseId: 'alcoholise%2:30:00::'
synsetId: 00139549-v
simpleMeaning: To cause something to contain alcohol, for example by fermentation.
scope: Also called alcoholize. It is about a change within the thing, not drink added from outside.
examples:
- They alcoholise the prunes before serving them.
- The juice will alcoholise if it is left to ferment.
