senseId: 'myasthenia_gravis%1:26:00::'
synsetId: 14102353-n
simpleMeaning: A lasting illness that causes muscles to tire and weaken, especially in the face and neck.
  It disrupts signaling by acetylcholine where nerves meet muscles.
scope: Another name for myasthenia, the same long-term muscle-weakening disease; not muscular dystrophy
  or ordinary fatigue.
examples:
- Myasthenia gravis causes lasting tiredness and weak face and neck muscles.
- In myasthenia gravis, the face and neck muscles are especially weak.
