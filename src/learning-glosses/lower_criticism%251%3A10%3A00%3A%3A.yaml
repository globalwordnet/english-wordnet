simpleMeaning: The close study of the text itself, from handwritten copies of the Bible that still exist,
  done to work out what the first text said.
scope: It is a kind of study.
examples:
- Lower criticism compares old copies of the Bible to find the first text.
- They used lower criticism to check the wording of an old passage.
