simpleMeaning: Eating earth, clay, or chalk. It occurs in some cultural traditions and sometimes in connection
  with a nutrient deficiency or compulsive behavior.
scope: This eating of soil, clay or chalk is also called geophagia.
examples:
- Geophagy was found among some early peoples.
- Geophagy was found in a woman short of food.
