simpleMeaning: A condition caused by taking in too much fluoride over time, often through drinking water.
  It can affect the teeth or bones.
scope: A condition caused by excessive fluoride intake over time.
examples:
- Excess fluoride intake can lead to fluorosis.
- Dental fluorosis can leave marks on the teeth.
