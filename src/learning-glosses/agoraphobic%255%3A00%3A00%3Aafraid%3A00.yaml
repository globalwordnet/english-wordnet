simpleMeaning: Suffering from a fear of open or public places that is far stronger than most people's
  fear.
scope: This one is not a fear of closed or private places.
examples:
- They became so agoraphobic that they would not leave the house to cross the market square.
- They grew agoraphobic and avoided crowded streets and open parks.
