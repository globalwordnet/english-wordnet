simpleMeaning: A freshwater fish from tropical America, Africa or Asia that resembles an American sunfish.
  Some species are eaten, and many small ones are popular in aquariums.
scope: This sense is also called cichlid, fishes of fresh water in warm Asia, Africa, and America, much
  like American sunfish, some eaten as food, small ones in plenty kept in home tanks.
examples:
- Cichlid fish swim in warm fresh water.
- The cichlid fish is kept in home tanks.
