simpleMeaning: This stream still rises and falls with the sea far upstream.
scope: Also called tidal river, tidal stream, and tidewater stream, this is not a stream cut off from
  the sea.
examples:
- The tidewater river rose with the incoming tide far upstream.
- They moored the boat on the tidewater river far upstream, where the tide still rose and fell.
