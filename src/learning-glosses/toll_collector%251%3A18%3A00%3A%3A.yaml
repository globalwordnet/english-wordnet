simpleMeaning: Someone paid to gather the money charged for passing.
scope: Also called toll agent, toll taker, toller, tollgatherer, and tollkeeper. It is not the driver
  who pays the charge.
examples:
- The toll collector took the coins from the driver.
- They worked as a toll collector on the bridge.
