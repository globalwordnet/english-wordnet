simpleMeaning: A scornful name for churchmen who use their standing to run worldly or state business.
scope: It is a scornful name, not a name for the skills of a churchman's work.
examples:
- Their priestcraft showed in the way they bent the town council to their will.
- The writer attacked the priestcraft of men who mixed the pulpit with politics.
