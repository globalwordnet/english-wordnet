simpleMeaning: A social gathering where people remove the outer leaves from ears of maize.
scope: Also called a husking bee, this one is about a social get-together, not the act of stripping the
  covering itself.
examples:
- The cornhusking brought the whole village together on a Saturday.
- At the cornhusking, neighbors worked side by side and shared food.
