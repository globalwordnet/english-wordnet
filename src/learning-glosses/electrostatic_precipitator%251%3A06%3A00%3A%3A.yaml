simpleMeaning: A device that uses electric charge to collect dust particles and remove them from a gas.
scope: A machine that takes dust out of gases, also called precipitator; not a cloth filter and not a
  fan.
examples:
- The electrostatic precipitator cleaned the dust from the factory smoke.
- An electrostatic precipitator took the dust out of the gas.
