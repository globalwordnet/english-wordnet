simpleMeaning: To shut a thing inside so that it is fully covered, in the way food is taken into the body.
scope: It is also called swallow, bury, immerse, and eat up.
examples:
- The fog swallowed up the whole valley before noon.
- The new road swallowed up the old path and the fields beside it.
