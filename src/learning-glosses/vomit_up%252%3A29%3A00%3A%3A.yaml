simpleMeaning: To make the stomach send out what it holds, through the mouth.
scope: Also called sick, cat, cast, vomit, puke, chuck, purge, retch, honk, spew, barf, disgorge, regurgitate,
  upchuck, be sick, regorge, spue, and throw up. It is a bodily act.
examples:
- After drinking too much, the students vomited up their dinner.
- The patient vomited up the food from last night's dinner.
