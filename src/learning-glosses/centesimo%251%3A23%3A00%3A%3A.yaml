simpleMeaning: A monetary unit worth one hundredth of the main unit, used in Panama and Uruguay and formerly
  in Italy and Chile.
scope: A small money unit of Panama, Italy, Uruguay and Chile; not the main coin of any of those lands.
examples:
- The centesimo is a small coin of Panama.
- A centesimo is worth less than the main coin.
