simpleMeaning: Round, spiral or rod-shaped microbes lacking chlorophyll, described as single-celled or
  noncellular, reproducing by splitting. They matter in disease and biochemistry, are hard to classify,
  and were once considered plants.
scope: 'The plural: many such organisms together, not one of them and not a virus.'
examples:
- Some bacteria in the soil break down dead leaves.
- The lab found bacteria in the water sample.
