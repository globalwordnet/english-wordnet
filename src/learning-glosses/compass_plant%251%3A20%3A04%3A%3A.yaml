simpleMeaning: A living thing rooted in the ground, from North America, that lives for one season and
  has red or rose-colored flowers.
scope: Lotus americanus, prairie bird's-foot trefoil, prairie lotus, and prairie trefoil are other names
  for this thing; it is not the kind whose leaves tell which way is north.
examples:
- The compass plant in the field had red flowers.
- We found a compass plant with rose-colored flowers on the prairie.
