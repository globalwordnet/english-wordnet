simpleMeaning: Full of tension, or making people tense, because what will happen next is still unknown.
scope: It is also called suspenseful, cliff-hanging, and nail-biting.
examples:
- The suspensive wait before the verdict kept everyone tense.
- The last chapter ended on a suspensive note, and readers waited for the next book.
