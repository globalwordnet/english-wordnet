simpleMeaning: People go down into this shelter below the ground and wait there until the storm has passed.
scope: Also called a cyclone cellar or a storm cellar, this is a place to go until a storm has passed,
  not a room where people live.
examples:
- They waited in the tornado cellar until the storm had passed.
- The family went down to the tornado cellar as the storm came near.
