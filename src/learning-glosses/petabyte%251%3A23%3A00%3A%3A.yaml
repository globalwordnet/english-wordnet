simpleMeaning: A unit of information is 1024 units of 2^40 sets of eight binary digits, equal to 2^50
  such sets.
scope: Also called pebibyte, PB, and PiB. It is a unit of information.
examples:
- The drive can store two petabytes of data.
- A petabyte is far bigger than a gigabyte.
