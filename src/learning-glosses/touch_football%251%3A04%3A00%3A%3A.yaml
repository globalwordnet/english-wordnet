simpleMeaning: No one is tackled in this kind of American football, and a hand laid on the player with
  the ball stops the play.
scope: This is a version of the American game, not the full game with tackles.
examples:
- They played touch football in the park, and a hand on the runner counted as a tackle.
- They chose touch football because a touch on the ball carrier was all it took to stop the run.
