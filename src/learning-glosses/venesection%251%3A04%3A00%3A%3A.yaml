senseId: 'venesection%1:04:00::'
synsetId: 00699862-n
simpleMeaning: A doctor cuts open a blood vessel that carries blood back toward the heart to treat a sickness
  in which the body stores too much iron.
scope: This is a cut into a blood vessel made to treat a sickness, also called phlebotomy, not a cut made
  for a test.
examples:
- The doctor ordered a venesection to lower the iron in their blood.
- They went to the clinic for a venesection to treat the sickness that made their body store too much
  iron.
