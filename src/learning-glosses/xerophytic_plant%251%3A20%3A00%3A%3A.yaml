senseId: 'xerophytic_plant%1:20:00::'
synsetId: 13141863-n
simpleMeaning: A plant adapted to scarce water. Compare a hydrophyte, adapted to water, and a mesophyte,
  adapted to moderate moisture.
scope: This one is also called a desert plant, a xerophile, a xerophilous plant, and a xerophyte, and
  it is unlike the kinds that need plenty of water or a middling amount.
examples:
- They grew a xerophytic plant in the poor dry soil at the back of the house.
- A xerophytic plant needs far less water than the flowers in the next bed.
