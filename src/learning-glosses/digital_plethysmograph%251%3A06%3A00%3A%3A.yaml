senseId: 'digital_plethysmograph%1:06:00::'
synsetId: 03201525-n
simpleMeaning: A tool used on a finger or toe to measure how much blood flows through the skin.
scope: This is not a tool for measuring blood flow through the whole body.
examples:
- The nurse put the digital plethysmograph on the patient's finger to check the blood flow.
- The digital plethysmograph showed that little blood was reaching the toe.
