synsetId: 08677777-n
simpleMeaning: A top layer on which a living thing grows or holds on.
scope: It is also called substrate. It is not a layer lying under another one.
examples:
- The moss spread over the damp substratum on the rock.
- The shell stayed fixed to the substratum under the water.
