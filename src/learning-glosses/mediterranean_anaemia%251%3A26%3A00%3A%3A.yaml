simpleMeaning: An inherited anemia in which the body makes too little of one component of hemoglobin,
  the protein in red blood cells that carries oxygen.
scope: 'Also called thalassaemia, thalassemia, or Mediterranean anemia: a sickness passed down in families
  in which the body makes faulty haemoglobin, not a sickness caught from another person.'
examples:
- Mediterranean anaemia runs in families.
- He has Mediterranean anaemia, so his body makes faulty haemoglobin.
