simpleMeaning: The long twigs of this willow bend easily, and people weave baskets from them.
scope: This willow is also called a common osier, a hemp willow, or Salix viminalis, not one with short
  stiff twigs.
examples:
- They cut velvet osier twigs to weave a basket.
- The velvet osier by the stream had long twigs that bent without breaking.
