simpleMeaning: To use up all of a person's strength, or to have no strength left yourself, through great
  strain, stress, or too much use.
scope: Wear, tire, weary, fatigue, jade, fag, fag out, outwear, wear down, wear out, and wear upon are
  other names for it.
examples:
- The long climb tired us out before noon.
- Too many late nights will tire you out.
