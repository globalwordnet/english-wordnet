simpleMeaning: A common tree of the woods in the east part of the United States and Canada, whose wood
  is used most of all to make wood pulp.
scope: Also called Canadian hemlock. It is about a tree, not a poison.
examples:
- The eastern hemlock grows tall in the woods behind our house.
- They cut the eastern hemlock for wood to make paper.
