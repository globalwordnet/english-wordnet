simpleMeaning: Goods such as grain traded under contracts that set the price now for delivery on a specified
  later date.
scope: In commodity markets, the plural futures can refer to the goods traded this way or to the contracts
  themselves.
examples:
- Farmers use futures to fix the price of their grain.
- He made money trading futures in wheat.
