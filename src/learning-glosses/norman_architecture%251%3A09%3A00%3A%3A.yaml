simpleMeaning: A Romanesque building style that appeared in Normandy around 950 and was used in Britain
  from the Norman Conquest until the 12th century.
scope: This is the Romanesque way of building of one time and place, first seen around 950 and used in
  Britain from the Conquest until the 1100s.
examples:
- Norman architecture can be seen in the old church with its round arches.
- The castle shows Norman architecture in its thick walls and round doors.
