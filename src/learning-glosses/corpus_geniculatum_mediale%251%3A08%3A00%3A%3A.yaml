senseId: 'corpus_geniculatum_mediale%1:08:00::'
synsetId: 05495593-n
simpleMeaning: The final processing station for hearing signals traveling from the cochlea in the inner
  ear to the temporal lobe of the cerebral cortex.
scope: This sense is also called medial geniculate and medial geniculate body, for a nerve part, the last
  of a row of work-stops on the hearing path from the ear-spiral to the side lobe of the brain's rind.
examples:
- The corpus geniculatum mediale sits on the hearing path.
- Signals pass through the corpus geniculatum mediale.
