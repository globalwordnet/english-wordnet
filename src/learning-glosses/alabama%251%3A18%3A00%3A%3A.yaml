simpleMeaning: A member of the Muskhogean people who formerly lived in what is now the state of Alabama.
scope: A member of a native people, not the way of speaking of that people.
examples:
- The Alabamas were members of the Creek Confederacy.
- An Alabama elder told stories of the old home.
