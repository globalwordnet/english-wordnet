senseId: 'arrogate%2:40:00::'
synsetId: 02279327-v
simpleMeaning: To take control of something without authority, sometimes by force, and treat it as one's
  own.
scope: Also called assume, seize, usurp, and take over, this one is not the other sense of this word,
  which only says that something is one's due and asks for it.
examples:
- After her husband died, she arrogated the throne to herself.
- They arrogated control of the town's offices, though nothing gave them the right to do so.
