simpleMeaning: Ibuprofen, a nonsteroidal anti-inflammatory pain reliever sold as Advil, Motrin, and Nuprin,
  used for arthritis pain and fever.
scope: A drug that eases pain and swelling and lowers fever; ibuprofen, isobutylphenyl propionic acid,
  Motrin and Nuprin are other names for this sense.
examples:
- She took Advil for her sore knee.
- Advil eased the pain of his arthritis.
