simpleMeaning: A table of numbers with the same count of rows and columns, for which the number worked
  out from the table is zero.
scope: It is a table of numbers.
examples:
- The teacher wrote a singular matrix on the board and asked the class to work out its determinant.
- Their homework asked them to find the determinant of a singular matrix.
