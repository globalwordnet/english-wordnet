senseId: unconfused%5:00:00:unperplexed:00
synsetId: 01771719-s
simpleMeaning: Things or words that pull in different ways do not mix this person up.
scope: Also called unbaffled, this word names a person who keeps a clear head when facts and words clash,
  not one who is lost in them.
examples:
- They stayed unconfused by the conflicting reports.
- The unconfused witness told the story straight.
