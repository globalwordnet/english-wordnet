simpleMeaning: To lay something on thick over a surface, the way one pastes up posters, so that it cannot
  be missed.
scope: Also called plaster, this one names an action.
examples:
- The demonstrators beplastered the hallways with posters.
- She let the walls of the apartment be beplastered with stucco.
