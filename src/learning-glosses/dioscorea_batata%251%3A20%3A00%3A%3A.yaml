simpleMeaning: A hardy Chinese vine established in the United States, grown for its glossy, heart-shaped,
  cinnamon-scented leaves and, in the tropics, for its edible tubers.
scope: 'Also called cinnamon vine or Chinese yam: a tough vine with cinnamon-smelling leaves, not a potato
  plant and not a grape vine.'
examples:
- The Dioscorea batata climbs the fence in our yard.
