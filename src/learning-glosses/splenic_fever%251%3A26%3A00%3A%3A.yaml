simpleMeaning: An older name for anthrax, a serious infectious disease especially of cattle and sheep
  that can also pass to humans.
scope: Anthrax is another name for a sickness that moves fast from one animal to another, above all among
  cattle and sheep, and can pass to people, not a sickness that stays only with animals.
examples:
- The cattle came down with splenic fever.
- People can catch splenic fever from animals.
