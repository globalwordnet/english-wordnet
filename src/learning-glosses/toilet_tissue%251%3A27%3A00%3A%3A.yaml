simpleMeaning: Thin soft sheets, able to soak up wetness, that are kept by the washroom fixture for use
  after it is used.
scope: Also called bathroom tissue and toilet paper. It is not a towel.
examples:
- They tore off a piece of toilet tissue.
- There was no toilet tissue left in the washroom.
