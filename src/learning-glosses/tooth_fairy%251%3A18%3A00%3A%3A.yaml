simpleMeaning: An imaginary fairy said to leave money under a child's pillow at night in exchange for
  a lost baby tooth.
scope: A make-believe person who leaves money under a child's pillow, not a real visitor and not a general
  story about growing up.
examples:
- She put her lost tooth under her pillow for the tooth fairy.
- The tooth fairy left a coin under his pillow.
