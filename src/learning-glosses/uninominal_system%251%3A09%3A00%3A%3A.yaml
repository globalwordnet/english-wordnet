senseId: 'uninominal_system%1:09:00::'
synsetId: 05912907-n
simpleMeaning: A way of choosing in which each electoral district picks just one person to speak for it,
  such as a lawmaker.
scope: Also called scrutin uninomial system, scrutin uninominal voting system, single-member system, and
  uninominal voting system. It is a way of choosing, not a way of counting votes.
examples:
- Under a uninominal system, each town sends a single person to the council.
- The country changed to a uninominal system so that each area would have a single voice.
