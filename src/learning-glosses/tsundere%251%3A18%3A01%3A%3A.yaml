simpleMeaning: Over time, this person turns from cold and even hostile toward another person to warm and
  kind.
scope: This name is for a person, not the process by which a character changes.
examples:
- The tsundere barely spoke to the new student at first, but they grew close over time.
- The tsundere glared at every greeting at first, then slowly started to smile and talk.
