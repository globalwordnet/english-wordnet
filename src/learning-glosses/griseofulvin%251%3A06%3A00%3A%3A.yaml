simpleMeaning: A medicine originally obtained from Penicillium molds that slows fungal growth and treats
  certain infections of the skin, hair, and nails.
scope: Fulvicin is a brand name for griseofulvin.
examples:
- The doctor prescribed griseofulvin for ringworm of the scalp.
- She took griseofulvin to treat a fungal infection.
