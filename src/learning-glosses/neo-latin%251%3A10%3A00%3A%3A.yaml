simpleMeaning: Latin as written since the Renaissance, used especially to give scientific names to living
  things and other subjects of study.
scope: Also called Neo-Latin language, New Latin, and New Latin language, this is the old tongue as people
  have used it since the time of the Renaissance, not the tongue of ancient Rome.
examples:
- Scientists still write new names in Neo-Latin.
- Many plant names come from Neo-Latin words.
