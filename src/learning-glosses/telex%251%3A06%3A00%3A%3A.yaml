senseId: 'telex%1:06:00::'
synsetId: 04411335-n
simpleMeaning: A printer that puts words arriving over wires on paper, using keys that work like a typewriter's
  keys.
scope: This sense is also called teleprinter, teletype machine, teletypewriter, and telex machine, and
  it is the printer itself, not the act of sending words by it.
examples:
- The telex printed the message as it arrived.
- They picked up the reply from the telex.
