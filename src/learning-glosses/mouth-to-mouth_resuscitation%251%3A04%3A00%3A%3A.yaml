synsetId: 00834287-n
simpleMeaning: 'An emergency procedure for a collapsed person with no pulse: pressing the chest and breathing
  into the mouth to restore blood flow and prevent brain damage or death.'
scope: The term is often shortened to mouth-to-mouth or CPR.
examples:
- The lifeguard gave the boy mouth-to-mouth resuscitation until the ambulance arrived.
- Doctors credit mouth-to-mouth resuscitation with saving her life after the drowning.
