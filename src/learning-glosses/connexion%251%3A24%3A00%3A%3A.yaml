senseId: 'connexion%1:24:00::'
synsetId: 13813601-n
simpleMeaning: A tie that joins two things or happenings, either because one brings about the other or
  because both have something in common.
scope: Also called connectedness or connection, it is not a thing that joins parts together or a shape
  that joins them.
examples:
- The teacher showed the class the connexion between rain and the growth of plants.
- No one could see any connexion between the two events.
