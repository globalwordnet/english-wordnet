simpleMeaning: A plant with grasslike basal leaves and narrow clusters of star-shaped yellow-orange flowers
  on leafless stalks, from the southwestern United States. It is North America's only Anthericum species.
scope: Also called amber lily; a plant with grass-like leaves and star-shaped yellow-orange flowers, not
  a tall shrub and not a garden flower with round leaves.
examples:
- Anthericum torreyi grows in the dry hills of the southwest.
- The yellow-orange flowers of Anthericum torreyi open on a tall stalk.
