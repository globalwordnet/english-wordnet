senseId: 'sou''-sou''-west%1:24:00::'
synsetId: 13855822-n
simpleMeaning: At 202.5 degrees round from north, a compass point just past straight down toward sunset,
  halfway between straight down and the point halfway between straight down and sunset.
scope: Also called south southwest and SSW. It is a point.
examples:
- They steered sou'-sou'-west after dark.
- The wind shifted to the sou'-sou'-west by morning.
