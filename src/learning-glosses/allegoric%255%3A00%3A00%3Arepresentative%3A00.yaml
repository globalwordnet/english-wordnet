simpleMeaning: Using, containing, or resembling an allegory, a story in which people and events stand
  for ideas.
scope: Also called allegorical, this one is not about a work that says only what it seems to say.
examples:
- The allegoric tale was really about greed, not about the fox at all.
- They read the allegoric poem as a warning about power.
