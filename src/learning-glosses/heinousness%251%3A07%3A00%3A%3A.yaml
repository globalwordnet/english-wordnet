simpleMeaning: The quality of cruelty so great that it shocks people, with no pity shown.
scope: This quality is also called an atrocity, barbarity, atrociousness, or barbarousness.
examples:
- The heinousness of the crime shocked the whole town.
- No one could excuse the heinousness of the attack.
