simpleMeaning: A storage device that retains data without power as tiny magnetized spots on a thin film
  of magnetic silicate. Most computers now use other storage technologies.
scope: It is a store that keeps files with no power, holding them as tiny spots on a film that pulls,
  and is now little used in most computers.
examples:
- The magnetic bubble memory kept its files when the power went off.
- The magnetic bubble memory held files as tiny spots.
