senseId: 'random_sample%1:09:01::'
synsetId: 06036311-n
simpleMeaning: A set of things picked from a larger set so that every member of the larger set has the
  same chance of being picked.
scope: It is a word for a pick from a whole group, not a pick grabbed with no plan at all.
examples:
- The teacher chose a random sample of twenty pupils, giving each child the same chance of being picked.
- The survey used a random sample drawn from the whole town.
