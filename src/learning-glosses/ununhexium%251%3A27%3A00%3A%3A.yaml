simpleMeaning: A former temporary name for livermorium, the radioactive element with atomic number 116,
  higher than uranium's.
scope: A heavy element past uranium that gives off rays, with the number one hundred and sixteen, also
  called atomic number 116, element 116, and Uuh.
examples:
- Ununhexium has the atomic number 116.
- Ununhexium was made by scientists.
