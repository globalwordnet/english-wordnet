simpleMeaning: Often kept in a cage, this greyish Old World dove wears a black band round its neck.
scope: This is the greyish dove with a black neck band, also called Streptopelia risoria, not the Eurasian
  pigeon with white patches on its wings and neck.
examples:
- The ringdove in the cage had grey feathers and a black band round its neck.
- We watched a ringdove with a black band round its neck land on the fence.
