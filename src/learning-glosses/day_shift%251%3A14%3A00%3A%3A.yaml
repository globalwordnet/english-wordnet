simpleMeaning: The group of people who work during the daytime, for example from eight in the morning
  to four in the afternoon.
scope: This sense is also called day watch; it names the workers, not the hours they work.
examples:
- The day shift gathered in the canteen before work.
- New workers joined the day shift this week.
