senseId: 'drag_coefficient%1:23:00::'
synsetId: 13608034-n
simpleMeaning: A number measuring an object's resistance to airflow, equal to drag force divided by the
  product of dynamic pressure and a reference area.
scope: This one is also called coefficient of drag.
examples:
- They worked out the drag coefficient of the new wing in a wind tunnel.
- The drag coefficient helps engineers shape a plane so it slips through the air.
