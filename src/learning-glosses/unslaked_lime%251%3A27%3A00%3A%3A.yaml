simpleMeaning: A white lime in tiny hard grains, formed when a metal takes in oxygen, and used to make
  another chemical called calcium hydroxide.
scope: Lime, burnt lime, calcined lime, calcium oxide, calx, fluxing lime and quicklime are other names
  for this white stuff, not for the chemical it is used to make.
examples:
- They added water to the unslaked lime to make calcium hydroxide for the mortar.
- A bag of unslaked lime stood in the yard, a fine white powder that had to stay dry.
