simpleMeaning: Refusing in the open to do what those in charge say, or standing against a force that pushes
  back.
scope: Defiant is another name for it.
examples:
- The noncompliant workers kept the factory gates shut in the face of the new rules.
- The noncompliant crowd would not move when the police told them to leave.
