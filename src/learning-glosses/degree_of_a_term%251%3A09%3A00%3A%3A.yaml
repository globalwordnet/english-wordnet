senseId: 'degree_of_a_term%1:09:00::'
synsetId: 05870047-n
simpleMeaning: The number reached by adding together the powers on each letter in the sum's part that
  is being counted.
scope: This is not about the whole sum.
examples:
- The degree of a term in 3x²y is three, since two and one make three.
- To find the degree of a term, add the powers on its letters.
