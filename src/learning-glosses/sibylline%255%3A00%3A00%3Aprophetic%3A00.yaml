simpleMeaning: Words or ways shaped as if by a person who tells what will happen next.
scope: Words or ways with the feel of a prophet's message are also called divinatory, mantic, sibyllic,
  vatic and vatical.
examples:
- He answered in a sibylline tone.
- The sibylline book promised answers to every question.
