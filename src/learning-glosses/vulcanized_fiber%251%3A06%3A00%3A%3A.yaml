simpleMeaning: Squeezing layers of paper or cloth tight makes a material that looks and feels like leather.
scope: This material is also called fiber or fibre, not from animal skin.
examples:
- They cut the vulcanized fiber into a shape for the case.
- The vulcanized fiber felt like leather but was made of paper.
