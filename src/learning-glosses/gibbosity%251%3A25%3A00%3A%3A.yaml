simpleMeaning: A raised lump on a surface, standing out from all that lies around it.
scope: This sense is also called bump, bulge, swelling, hump, jut, prominence, protrusion, protuberance,
  excrescence, extrusion, and gibbousness.
examples:
- The gibbosity on the old wall caught the light.
- A gibbosity under the carpet showed where the floorboard had warped.
