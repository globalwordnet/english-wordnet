simpleMeaning: Chlorine, a common nonmetallic halogen. This heavy, poisonous, irritating yellow gas purifies
  water, bleaches, and disinfects. It occurs naturally in salts, including those in seawater.
scope: 'Also called Cl and chlorine: a common nonmetal of the halogen group, a heavy yellow gas, not a
  metal and not a harmless gas.'
examples:
- Atomic number 17 is the gas that makes pool water safe.
