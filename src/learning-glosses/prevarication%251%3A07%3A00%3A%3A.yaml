schema: oewn-learning-gloss-v2
senseId: 'prevarication%1:07:00::'
synsetId: 04832614-n
simpleMeaning: The act of speaking or writing in a way that is vague on purpose, so the real meaning stays
  unclear.
scope: Also called equivocation or evasiveness. It is a way of speaking.
examples:
- The minister's prevarication left the reporters unsure of the real meaning.
- Their prevarication on the question made it clear they would not give a straight answer.
