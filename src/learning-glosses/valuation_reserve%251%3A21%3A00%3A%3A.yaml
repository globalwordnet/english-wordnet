simpleMeaning: This fund holds money taken from a firm's gains to meet changes in the worth of the things
  the firm owns.
scope: Also called allowance, an allowance account, and a valuation account, this is a fund a firm keeps
  for later, not money it pays out.
examples:
- The valuation reserve grew as the firm set aside more of its gains.
- They drew on the valuation reserve when the worth of their buildings fell.
