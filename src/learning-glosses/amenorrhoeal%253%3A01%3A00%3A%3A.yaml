senseId: 'amenorrhoeal%3:01:00::'
synsetId: 02627044-a
simpleMeaning: Describing the usual monthly flow of blood as stopped for any reason other than pregnancy.
scope: Also called amenorrheal, amenorrheic, or amenorrhoeic, this one is a word for things to do with
  the stopping, not for the stopping itself.
examples:
- The amenorrhoeal condition was noted during the check-up.
- They discussed the amenorrhoeal findings with the doctor.
