simpleMeaning: Relating to the former English royal house of Lancaster or its supporters.
scope: This word marks things of the past English royal house or its supporters, not things of the English
  city of the same name and not a person who backs the house.
examples:
- Lancastrian royalty ruled England after thirteen ninety-nine.
- She wore a Lancastrian rose on her dress.
