simpleMeaning: Any two places or parts of the world that lie exactly across from each other, at opposite
  ends of a line through its middle.
scope: This is not about one place on its own.
examples:
- The antipodes of their home town lay on the far side of the world.
- They pointed out the antipodes of the two cities on the globe.
