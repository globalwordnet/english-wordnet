simpleMeaning: An air force officer of high rank, not an officer with a commission, whose rank matches
  an army rank of the same level.
scope: Also called SMSgt, this is a high Air Force rank, at the same level as a matching rank in the Army.
examples:
- The senior master sergeant inspected the airmen before the parade.
- A senior master sergeant welcomed the new recruits to the base.
