simpleMeaning: The great curve of the stomach has two blood vessels serving it, and each one brings blood
  back to the heart.
scope: This is one of two blood vessels of the great curve of the stomach, also called gastroepiploic
  vein and gastroomental vein, not one of many.
examples:
- Blood from the great curve of the stomach runs back through the vena gastroomentalis.
- The surgeon saw the vena gastroomentalis on the great curve of the stomach during the operation.
