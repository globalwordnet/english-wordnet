simpleMeaning: Said of a mollusk, a soft-bodied creature with one shell, above all of snails and other
  such creatures.
scope: This is a word used of mollusks, not the name of the group of such creatures.
examples:
- The univalve snail carried its one shell on its back.
- Most univalve mollusks live in one shell.
