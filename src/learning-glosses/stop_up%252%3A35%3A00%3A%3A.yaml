simpleMeaning: To block a hole or gap so tightly that nothing can pass through it, as a plug would.
scope: It is also called secure and plug.
examples:
- They used rags to stop up the cracks in the old window frame.
- They stopped up the bottle with a cork so the liquid would not spill.
