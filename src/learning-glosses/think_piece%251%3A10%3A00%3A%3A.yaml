simpleMeaning: Opinions and ideas, talked over, are what this article gives, not just plain facts, in
  a newspaper, magazine, or journal.
scope: This is the kind of article that sets out views and ideas, not a plain account of the bare facts.
examples:
- In their think piece, they gave their views on the new law instead of just the facts.
- Their think piece in the magazine set out ideas about how the town should grow.
