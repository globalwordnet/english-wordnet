senseId: 'contact_mike%1:06:00::'
synsetId: 03098803-n
simpleMeaning: A device for catching sound that is made to be pressed right against the thing that makes
  the sound, or against a surface that shakes with it.
scope: Also called contact microphone. It is about a thing.
examples:
- They fixed a contact mike to the drum so the sound came through clear.
- The contact mike picked up the hum of the old fridge.
