simpleMeaning: Over a period of time, what a country earns by selling goods abroad, set against what it
  spends on goods from abroad.
scope: Also called balance of trade, trade balance, and visible balance, this is the amount by which a
  country's selling abroad stands above or below its buying from abroad, not the goods that cross its
  borders.
examples:
- The trade gap widened as imports grew faster than exports.
- The trade gap shrank when the country sold more goods abroad.
