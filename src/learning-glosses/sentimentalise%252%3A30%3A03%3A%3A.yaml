senseId: 'sentimentalise%2:30:03::'
synsetId: 00580182-v
simpleMeaning: To work soft, fond feeling into a person or a thing, so that it colours all of them.
scope: Sentimentalize is another name for this sense, which puts the feeling into a person or a thing,
  not into the one who acts.
examples:
- Too much poetry can sentimentalise the mind.
- These experiences have sentimentalised her.
