simpleMeaning: Chlorine, a common nonmetallic halogen, forms a heavy, yellow-green, irritating, poisonous
  gas used in water purification, bleaching, and disinfection. It occurs naturally in salts such as those
  in seawater.
scope: Not the gas fluorine or bromine, which are other halogen gases; also called chlorine and atomic
  number 17.
examples:
- The pool worker added Cl to the water to kill germs.
- Cl in sea water comes only in the form of salt.
