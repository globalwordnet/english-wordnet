simpleMeaning: A medium-sized fir of northeastern North America. Its crushed needles smell of balsam,
  and it is widely used for pulpwood and Christmas trees.
scope: A middle-sized cone tree whose crushed leaves smell of balsam; balsam fir, balm of Gilead and Canada
  balsam are other names for this sense, not other firs of the north-east whose leaves have no balsam
  smell.
examples:
- Abies balsamea grows across north-eastern North America.
- We cut an Abies balsamea for our Christmas tree.
