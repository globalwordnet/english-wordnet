simpleMeaning: A sickness of trees that bear cones, making their thin leaves drop off.
scope: Also called leaf cast and needle cast. It names a sickness, not a tree.
examples:
- The needle blight spread through the pine wood and left the trees bare.
- They cut down the firs that needle blight had struck.
