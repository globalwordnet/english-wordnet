senseId: 'weisenheimer%1:18:00::'
synsetId: 10803789-n
simpleMeaning: A person new to a group speaks up with rude, mocking remarks, as if they knew better than
  everyone else.
scope: Wiseacre, smart aleck, and wisenheimer are other names for this newcomer, not for one who keeps
  quiet and listens.
examples:
- They rolled their eyes when the weisenheimer at the back made another mocking remark.
- No one laughed at the weisenheimer's rude joke about the new teacher.
