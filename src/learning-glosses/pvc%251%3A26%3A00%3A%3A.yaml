simpleMeaning: A premature ventricular contraction, an early heartbeat that starts in a lower heart chamber.
  Repeated episodes can precede ventricular fibrillation, a dangerous quivering of those chambers.
scope: Also called premature ventricular contraction; an uneven beat of the heart, not the plastic called
  PVC used in cables.
examples:
- The doctor said the PVC in her heartbeat should be watched.
- Repeated PVC can come before a wild quivering of the heart.
