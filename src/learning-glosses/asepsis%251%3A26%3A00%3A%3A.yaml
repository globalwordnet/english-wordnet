simpleMeaning: A lifeless thing is in this state when no living thing that can cause disease is in it.
scope: Also called antisepsis, sterileness, or sterility, this one is a state, not the process that is
  the other sense of this word.
examples:
- The asepsis of the instruments meant no germs could reach the wound.
- After the cleaning, the asepsis of the room was complete.
