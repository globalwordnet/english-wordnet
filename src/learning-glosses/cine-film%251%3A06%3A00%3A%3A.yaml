simpleMeaning: A strip of material that holds pictures, hundreds of feet long and rolled round a spool,
  for use in a camera that makes moving pictures.
scope: This one is also called motion-picture film and movie film.
examples:
- They found a reel of cine-film in the attic.
- The cine-film broke as it ran through the camera.
