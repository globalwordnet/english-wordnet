senseId: 'palm_off%2:40:00::'
synsetId: 02249208-v
simpleMeaning: To cheat a buyer by selling a thing as real when it is not.
scope: Also called fob off and foist off. It is a way of selling something.
examples:
- They tried to palm off a copy as the real painting.
- The seller palmed off old wine as a rare bottle.
