simpleMeaning: To separate, purify, or concentrate substances in a liquid mixture by heating it and cooling
  the resulting vapor back into liquid.
scope: Also called distill, purify, sublimate, and make pure. This one is about a person doing the work,
  not about the liquid changing on its own.
examples:
- The workers distil the water to take out the salt and make it fit to drink.
- The chemist will distil the mixture to get a stronger liquid from it.
