simpleMeaning: A mark on the compass at 315 degrees, halfway between the side of the pole star and the
  sunset side.
scope: Also called northwest or northwestward, and NW for short. It is a noun.
examples:
- The needle pointed nor'-west through the storm.
- They held a course of nor'-west until dawn.
