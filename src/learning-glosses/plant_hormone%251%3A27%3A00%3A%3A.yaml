simpleMeaning: A substance from a living thing that grows in soil, working like a chemical that controls
  how parts of a living thing grow and work.
scope: Also called a growth regulator and a phytohormone. It is a substance.
examples:
- The plant hormone auxin makes the stems bend toward the light.
- Farmers spray a plant hormone on the fruit to help it ripen.
