simpleMeaning: A lightweight lens made of smaller lens sections arranged to give it a large diameter and
  a short focal length.
scope: Many small pieces set together into one light, wide piece with a short focus, not a single solid
  piece.
examples:
- The Fresnel lens focused the lighthouse beam.
- A Fresnel lens is lighter than a solid glass of the same size.
