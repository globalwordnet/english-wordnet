simpleMeaning: A member of an Indigenous people whose traditional homeland lies on the Columbia Plateau
  in the inland Pacific Northwest of the United States.
scope: This noun identifies a member of the Nez Perce people.
examples:
- The speaker introduced himself as a Nez Perce from Idaho.
- As a Nez Perce, she grew up learning about her people’s history on the Columbia Plateau.
