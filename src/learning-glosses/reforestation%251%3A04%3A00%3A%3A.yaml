senseId: 'reforestation%1:04:00::'
synsetId: 00401257-n
simpleMeaning: Trees are put back on ground left bare or thin after fire or the axe, so the trees grow
  again.
scope: 'This is also called re-afforestation: trees put back where they once grew, not trees planted where
  none ever grew.'
examples:
- After the fire, reforestation brought young trees back to the bare hillside.
- The reforestation plan called for new trees on the land the fire had cleared.
