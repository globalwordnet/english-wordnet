simpleMeaning: Describing what belongs to or comes from a person in poor health who fears illness and
  thinks of little else.
scope: Also called valetudinarian. It is an adjective, not a noun.
examples:
- They followed a valetudinary routine of rest and warm drinks.
- The valetudinary tone of the letter was all about aches and doctors.
