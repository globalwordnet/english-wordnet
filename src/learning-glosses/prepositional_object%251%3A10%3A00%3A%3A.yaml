senseId: 'prepositional_object%1:10:00::'
synsetId: 06321439-n
simpleMeaning: A word or group of words whose form a preposition decides.
scope: It is also called the object of a preposition. It is a word.
examples:
- In 'on the table', 'the table' is the prepositional object.
- The prepositional object in 'with friends' is 'friends'.
