simpleMeaning: Shut off from the traffic by a kerb, this part of the road gives people on foot a place
  to stand.
scope: This part of the road is also called a safety island, a safety isle, and a traffic island.
examples:
- They waited in the safety zone.
- The safety zone gave them a safe place to stand.
