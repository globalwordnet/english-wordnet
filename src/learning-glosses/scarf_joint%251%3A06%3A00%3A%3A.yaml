simpleMeaning: A way of joining two pieces of timber or metal, by cutting a notch in the end of each so
  the ends grip each other end to end.
scope: It is also called scarf.
examples:
- The carpenter cut a scarf joint to join the two beams end to end.
- They fixed the long board with a scarf joint.
