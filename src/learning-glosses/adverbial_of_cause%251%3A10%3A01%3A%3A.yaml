senseId: 'adverbial_of_cause%1:10:01::'
synsetId: 92464139-n
simpleMeaning: A word or phrase that tells what made a verb's action happen.
scope: It is also called an adverbial of reason.
examples:
- They ran the race for fun, and the phrase for fun is an adverbial of cause.
- They stayed home because they were ill, and that clause is an adverbial of cause.
