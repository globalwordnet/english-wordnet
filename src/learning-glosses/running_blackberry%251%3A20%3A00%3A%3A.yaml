simpleMeaning: Any of several blackberry plants with long stems that trail along the ground, especially
  in North America.
scope: Among the brambles of North America, this name covers several trailing kinds, also called dewberry
  and dewberry bush.
examples:
- The running blackberry sent out long stems that trailed along the ground.
- We found a running blackberry trailing along the ground.
