senseId: 'verbalizer%1:18:00::'
synsetId: 10649550-n
simpleMeaning: This is a person who talks and talks, above all to a crowd, saying what they think out
  loud.
scope: This person is also called a speaker, a talker, an utterer, or a verbaliser, and not a silent listener.
examples:
- The verbalizer talked at great length, and the crowd stayed to listen.
- They asked the verbalizer to speak first at the public meeting.
