simpleMeaning: A hernia in which a loop of intestine pushes into the inguinal canal in the groin. This
  is the most common type of hernia in males.
scope: This bulge at the top of the inner leg is the most common kind of bulge in men.
examples:
- He had an inguinal hernia.
- The doctor found the inguinal hernia.
