simpleMeaning: A measure of computing speed equal to one trillion floating-point operations per second.
scope: This is a unit for how fast a computer works, also called trillion floating point operations per
  second, not the computer itself and not a single calculation.
examples:
- The machine's speed is given in teraflops.
- They compared the two machines by their speed in teraflops.
