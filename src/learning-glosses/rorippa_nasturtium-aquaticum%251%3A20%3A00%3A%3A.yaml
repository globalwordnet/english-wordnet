simpleMeaning: A Eurasian perennial cress of springs and streams with fleshy, peppery leaves used in salads,
  cooked greens, or garnishes. It was introduced to North America and elsewhere.
scope: Also called common watercress and Nasturtium officinale.
examples:
- The Rorippa nasturtium-aquaticum grew in the clear spring water.
- We picked Rorippa nasturtium-aquaticum leaves for a salad.
