simpleMeaning: Said of pictures that look deep when seen through glasses with lenses of two colours, and
  of the making of such pictures.
scope: Also called anaglyphic, anaglyptic and anaglyptical. It is used to describe things.
examples:
- The anaglyphical effect made the flat picture seem deep.
- We tried an anaglyphical poster with the red and green glasses.
