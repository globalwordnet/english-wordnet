simpleMeaning: A set of political ideas that looks for a middle way between freedom for each person and
  fair treatment for all.
scope: It is a way of thinking about how a country should be run.
examples:
- The social liberalism of Roosevelt's vision for old age security was clearly expressed in his advocacy
  of contributory old age insurance as Governor of New York.
- Social liberalism tries to give each person freedom while also making sure all are treated fairly.
