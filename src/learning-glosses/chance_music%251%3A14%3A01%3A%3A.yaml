simpleMeaning: Twentieth-century music that leaves some elements to chance or allows the performer to
  decide how to play them.
scope: Also called aleatoric music and aleatory music.
examples:
- He based his idea of structured improvisation on similar processes in the aleatoric music of composer
  John Cage.
- The chance music left the ending open, and the player chose the last notes.
