simpleMeaning: 'If a letter or parcel cannot reach the person it was sent to, this is where it goes back
  to: the sender''s name and place.'
scope: On a letter or parcel, this is the sender's name and place, there so the item can go back if it
  cannot be delivered, not the name and place it is going to.
examples:
- The return address on the envelope showed where the letter had come from.
- If the letter could not be delivered, the return address showed where to send it back.
