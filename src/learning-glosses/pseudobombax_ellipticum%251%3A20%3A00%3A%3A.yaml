simpleMeaning: A tree found from Mexico to Guatemala whose densely hairy flowers have long, narrow petals
  and cluster at branch tips before the leaves appear.
scope: Also called shaving-brush tree, this is a tree of Mexico to Guatemala with hairy flowers at the
  branch ends before the leaves, not a tree that flowers after its leaves and not a small shrub.
examples:
- The Pseudobombax ellipticum bloomed before its leaves came out.
- A Pseudobombax ellipticum grew in the valley.
