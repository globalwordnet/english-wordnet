simpleMeaning: To make something move smoothly, silently, or so gently that its movement is hard to notice.
scope: To make a thing move quietly and smoothly, not to fly a glider and not a speech sound.
examples:
- She glided the tray across the table without a sound.
- The puppeteer glided the little boat across the stage.
