simpleMeaning: A part of the body, or a person's feelings, stays open and free.
scope: This word marks a part of the body or a state of mind, the opposite of the tight state called constricted.
examples:
- Blood moved easily through the unconstricted arteries.
- After the talk, they felt unconstricted, free to say what they thought.
