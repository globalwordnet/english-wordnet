simpleMeaning: A natural resource, such as wood or sunlight, that nature replenishes over time.
scope: Replenishment includes biological growth and continuing supplies of energy.
examples:
- Wood is a renewable resource because new trees grow to take the place of cut ones.
- The school uses sunlight as a renewable resource to generate electricity.
