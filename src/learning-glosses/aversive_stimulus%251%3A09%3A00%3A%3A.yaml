senseId: 'aversive_stimulus%1:09:00::'
synsetId: 05840437-n
simpleMeaning: Any unpleasant thing that acts on the senses, which a living thing learns to keep away
  from it.
scope: This is not something a living thing learns to seek out.
examples:
- The loud noise was an aversive stimulus for the mice.
- An aversive stimulus made the dog back away from the bowl.
