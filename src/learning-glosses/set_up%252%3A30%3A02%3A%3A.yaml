simpleMeaning: To get what is needed into working order before the time comes to use it.
scope: Ready, set, fix, prepare and gear up are other names for getting what is needed into working order
  beforehand, not for starting a new venture by giving it what it needs.
examples:
- They set up the hall for the fair.
- They set up the room for the meeting.
