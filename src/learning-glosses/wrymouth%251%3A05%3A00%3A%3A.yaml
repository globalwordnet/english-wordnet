simpleMeaning: A long, eel-like fish of the Atlantic sea floor, with a large opening at the front of its
  head running almost straight up and down.
scope: Also called ghostfish and Cryptacanthodes maculatus. It is a fish.
examples:
- The wrymouth hid under a rock on the sea floor.
- They caught a wrymouth while fishing off the Atlantic coast.
