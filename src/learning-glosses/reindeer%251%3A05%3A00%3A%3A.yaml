simpleMeaning: An Arctic deer whose males and females grow antlers. It is called reindeer in Eurasia and
  caribou in North America.
scope: A far-north deer with big horns on both sexes, called caribou in North America, not any other kind
  of deer.
examples:
- A herd of reindeer crossed the frozen plain.
- Reindeer pull the sled across the snow.
