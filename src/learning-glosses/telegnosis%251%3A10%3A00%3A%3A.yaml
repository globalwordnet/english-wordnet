senseId: 'telegnosis%1:10:00::'
synsetId: 07270898-n
simpleMeaning: Seeming knowledge of what happens far away, without any sense telling of it.
scope: This is knowledge that only seems to be there, not knowledge that comes through any sense.
examples:
- They said telegnosis let them know of the storm far away.
- They seemed to know of the quake far away through telegnosis.
