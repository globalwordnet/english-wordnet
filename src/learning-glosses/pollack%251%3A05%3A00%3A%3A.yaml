simpleMeaning: A food fish of the northern seas, most of all the northern Atlantic, much sought after
  for eating and for sport, and kin to the cod.
scope: Also called a pollock, and by its Latin name Pollachius pollachius. It is a fish.
examples:
- The fishermen brought in a fine catch of pollack from the northern seas.
- Pollack is a good fish for the table, and the anglers prize it too.
