simpleMeaning: The large gut has an S-shaped bend, and this word is about that bend.
scope: This is about the S-shaped bend in the large gut, also called sigmoidal; it is not about a curve
  shaped like the letter S in general.
examples:
- The surgeon worked on the sigmoid bend of the gut.
- The sigmoid bend is part of the large gut.
