simpleMeaning: The widely reported 1925 Tennessee evolution trial of teacher John Scopes. William Jennings
  Bryan helped prosecute him, Clarence Darrow defended him, and his conviction was later overturned.
scope: Not other famous court cases, nor other cases about what may be taught in schools; this is the
  1925 case about teaching evolution in Tennessee.
examples:
- The Scopes trial took place in 1925.
- People still talk about the Scopes trial today.
