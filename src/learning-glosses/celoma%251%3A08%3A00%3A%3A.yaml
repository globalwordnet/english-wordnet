simpleMeaning: A space in an embryo's middle tissue layer that develops in humans into the cavities around
  the lungs, around the heart, and inside the abdomen.
scope: This sense is also called celom and coelom, a gap in an embryo's middle layer that in humans becomes
  the chest hollow, the heart hollow, and the belly hollow.
examples:
- Celomas become chest hollows.
- The celoma forms in the embryo.
