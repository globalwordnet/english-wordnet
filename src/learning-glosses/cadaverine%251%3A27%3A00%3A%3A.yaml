simpleMeaning: A colorless, poisonous, foul-smelling compound called a ptomaine that forms as animal tissue
  decays.
scope: A poison with no colour and a bad smell that forms while the flesh of dead animals rots.
examples:
- Cadaverine gave off a bad smell from the rotting flesh.
- The cadaverine formed as the animal tissue rotted.
