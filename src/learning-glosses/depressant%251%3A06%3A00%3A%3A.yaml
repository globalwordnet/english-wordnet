senseId: 'depressant%1:06:00::'
synsetId: 04173614-n
simpleMeaning: A drug that makes a person less easily worked up and calmer.
scope: This one is also called sedative, downer, and sedative drug, and it is a drug, not the adjective
  sense about what a chemical agent can do.
examples:
- The doctor gave the patient a depressant to calm the nerves before the operation.
- After taking a depressant, the patient sat still and spoke in a low voice.
