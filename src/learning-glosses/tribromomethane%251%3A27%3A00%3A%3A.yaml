simpleMeaning: A colorless liquid called bromoform, with one carbon atom, one hydrogen atom, and three
  bromine atoms in each molecule.
scope: This liquid with no colour is also called bromoform, and it is not a liquid with a colour or a
  chemical with a single atom of a halogen.
examples:
- They poured the tribromomethane into a glass and saw that the liquid had no colour.
- They kept a bottle of tribromomethane on the shelf, and the liquid inside had no colour.
