simpleMeaning: A soft, dome-shaped rubber or plastic cup used to prevent pregnancy. It holds a substance
  that kills sperm and fits over the cervix, the opening to the womb.
scope: This sense is also called diaphragm and contraceptive diaphragm, for a birth-control tool of a
  bendy, dome-shaped cup of rubber or plastic, filled with sperm-killer and fitted over the womb's neck.
examples:
- Pessaries stop sperm reaching the womb.
- A pessary fits over the cervix.
