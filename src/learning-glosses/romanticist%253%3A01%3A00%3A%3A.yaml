simpleMeaning: Coming from the Romantic Movement in the arts, or showing what that movement stands for.
scope: Also called romantic or romanticistic, it marks a work as one of the Romantic Movement, and not
  a person who follows that movement.
examples:
- The new book was praised as a fine romanticist work.
- Critics called the play romanticist in style.
