simpleMeaning: A chemical messenger made from choline and released at nerve endings in the somatic and
  parasympathetic nervous systems.
scope: This is a nerve signal sent out at the ends of nerve threads, not the nerve threads that send it
  out.
examples:
- Acetylcholine is sent out at the ends of the nerve threads.
- The nerve signal acetylcholine comes from choline.
