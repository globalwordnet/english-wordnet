senseId: 'voiceless_consonant%1:10:00::'
synsetId: 07134605-n
simpleMeaning: A consonant made while the vocal cords remain still, as in the first sound of sun.
scope: Also called surd. It is a speech sound, not a vowel.
examples:
- The consonant at the start of 'tea' is made without any sound from the throat.
- The teacher showed how a voiceless consonant differs from the buzzing sound of its voiced twin.
