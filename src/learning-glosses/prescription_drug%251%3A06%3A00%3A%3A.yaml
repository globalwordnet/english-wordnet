senseId: 'prescription_drug%1:06:00::'
synsetId: 04005638-n
simpleMeaning: A medicine you can get only when a doctor or dentist writes down that you should have it,
  and gives the note to the pharmacist.
scope: It is also called prescription, ethical drug, and prescription medicine. It is a medicine.
examples:
- This drug needs a prescription; the pharmacist cannot sell it without one.
- The doctor wrote a prescription for the drug.
