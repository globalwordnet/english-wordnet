simpleMeaning: An inherited disorder affecting how the body processes certain amino acids. The urine can
  smell like maple syrup. Without treatment, brain damage and death can occur in early childhood.
scope: Also called branched-chain ketoaciduria. The unusual smell is one possible sign.
examples:
- The baby’s sweet-smelling urine prompted tests for maple syrup urine disease.
- Maple syrup urine disease runs in families.
