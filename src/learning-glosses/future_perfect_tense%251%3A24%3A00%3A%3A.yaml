simpleMeaning: A verb form that sets an action in time as complete ahead of a moment yet to come.
scope: Also called future perfect, this one is about a verb form.
examples:
- In the sentence 'They will have left by six', the verb is in the future perfect tense.
- We learned the future perfect tense with the sentence 'The builders will have finished the wall by Friday.'
