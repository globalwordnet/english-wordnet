simpleMeaning: A reflecting telescope with a plate that corrects image distortion so a wide area of sky
  can be photographed.
scope: A mirror-based star-watching tool whose flat glass plate fixes blur so a wide stretch of sky can
  be photographed; Schmidt telescope is another name for this sense.
examples:
- The Schmidt camera photographed a wide stretch of the night sky.
- Astronomers use a Schmidt camera to map large areas of sky.
