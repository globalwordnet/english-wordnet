simpleMeaning: A particle that carries cholesterol through the blood. It contains moderate amounts of
  protein and much cholesterol. High levels are linked to fatty buildup in arteries and coronary heart
  disease.
scope: Also called beta-lipoprotein or low-density lipoprotein; this is the blood fat that carries cholesterol,
  not the other blood fats.
examples:
- His LDL was high.
- The doctor said her LDL should come down.
