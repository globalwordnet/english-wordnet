simpleMeaning: While the infants' parents are at work, this person looks after the infants, most often
  in that person's own home.
scope: Also called a minder or a baby minder, this one is not about care in the infants' home.
examples:
- The babyminder looked after the twins while their parents were at work.
- They left the infant with the babyminder in the morning.
