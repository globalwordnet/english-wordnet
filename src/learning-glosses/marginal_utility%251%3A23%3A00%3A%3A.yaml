simpleMeaning: In economics, the extra benefit a thing gives when the amount of an economic good or service
  grows by one unit.
scope: It is a term used in economics.
examples:
- A shopper worked out the marginal utility of a second ticket before deciding to buy it.
- They compared the marginal utility of one more unit with its price.
