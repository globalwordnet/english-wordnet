simpleMeaning: A fat-soluble vitamin needed for normal reproduction. It also acts as an antioxidant, neutralizing
  free radicals in the body.
scope: A vitamin that dissolves in fat, needed for young to form in a normal way and for the body to fight
  harm; also called tocopherol and vitamin E, and not the metal, and not the letter.
