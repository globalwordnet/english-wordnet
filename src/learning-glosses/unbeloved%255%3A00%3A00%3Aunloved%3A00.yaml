senseId: unbeloved%5:00:00:unloved:00
synsetId: 01466336-s
simpleMeaning: Said of a person who is unhappy because the one they care for does not care back, and who
  suffers for it.
scope: Bereft and lovelorn are other names for it. It is about care that is not returned, not about being
  left alone.
examples:
- The unbeloved singer wrote songs about the one who had turned away.
- They felt unbeloved when their letters went unanswered.
