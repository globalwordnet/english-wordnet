simpleMeaning: Said of a leaf, having round ends, with a middle drawn in.
scope: Also called fiddle-shaped or pandurate. It is a leaf shape.
examples:
- The gardener pointed out a panduriform leaf, round at both ends and narrow in the middle.
- They found a panduriform leaf on the path and pressed it in a book.
