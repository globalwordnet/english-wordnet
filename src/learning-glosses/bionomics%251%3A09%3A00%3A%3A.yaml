simpleMeaning: the part of the study of living things that looks at the ties between living things and
  the world around them
scope: This one names a branch of study, and its partners ecology and environmental science name the same
  branch of study.
examples:
- The class in bionomics looks at how fish and the sea around them affect each other.
- Field work in bionomics shows how birds and the land they live on shape each other.
