simpleMeaning: Said of something that gives people joy and keeps them glad.
scope: Also called amusing or diverting, it is said of what cheers people, not of what bores them.
examples:
- The amusive tale kept the children laughing all evening.
- The amusive talk made the long wait pass quickly.
