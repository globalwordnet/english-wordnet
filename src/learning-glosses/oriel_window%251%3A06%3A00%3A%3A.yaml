simpleMeaning: A part of a room with glass that sticks out from a wall, held up by supports built into
  the wall or by beams fixed at one end.
scope: Also called an oriel. It is the kind that stands out from the wall.
examples:
- They sat in the oriel window to read in the daylight.
- The oriel window gave them a wide view of the street below.
