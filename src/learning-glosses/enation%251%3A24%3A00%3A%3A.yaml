simpleMeaning: The line of a family as it passes down through the mothers in it.
scope: This one is also called cognation and matrilineage, and it is not about a growth on a plant.
examples:
- The enation of the family ran through the women on the mother's side.
- They traced their enation back through three generations of mothers.
