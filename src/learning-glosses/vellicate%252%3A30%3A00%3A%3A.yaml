simpleMeaning: To cause a small sharp pain, as if by a nip, a pinch, or a tear.
scope: This word is also called pinch, and it is not a light touch that makes a person laugh.
examples:
- The rough edge of the cloth seemed to vellicate their skin with every move.
- The stiff collar began to vellicate the back of their neck as they worked.
