simpleMeaning: Said of a thing that has the look or the nature of a thin mist.
scope: Also called vaporous, vaporific, vaporish, vapourific, and vapourous. It is said of a thing, not
  of the mist itself.
examples:
- A vapourish haze covered the valley.
- The vapourish mist drifted across the field.
