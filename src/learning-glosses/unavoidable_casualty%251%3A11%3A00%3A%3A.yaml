senseId: 'unavoidable_casualty%1:11:00::'
synsetId: 07329950-n
simpleMeaning: A disaster from nature that nothing can stop, breaking in on the course of events people
  looked for.
scope: Force majeure, inevitable accident, vis major, and act of God are other names for it.
examples:
- The flood was an unavoidable casualty that cut short the harvest they had planned.
- An unavoidable casualty closed the roads on the day of their wedding.
