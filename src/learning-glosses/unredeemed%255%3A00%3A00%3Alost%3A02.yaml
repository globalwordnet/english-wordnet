simpleMeaning: Said of a person who is at risk of Hell's punishment, which goes on for ever.
scope: Also called cursed, damned, doomed, and unsaved. It is said of a person, not of a thing.
examples:
- The preacher warned the unredeemed crowd that Hell waits for them.
- They feared dying unredeemed, with no hope of escape.
