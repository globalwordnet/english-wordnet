simpleMeaning: Longer, rougher hairs on the outside hide a thick, soft fur next to the skin.
scope: Also called undercoat, this word names the soft layer that lies beneath the guard hair, not the
  guard hair itself.
examples:
- The cat's underfur felt soft when they stroked it.
- Beneath the long guard hairs lay the thick underfur.
