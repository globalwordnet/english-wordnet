simpleMeaning: A long woodworker's plane that shapes the edges of boards to make them fit.
scope: It is also called a jointer plane or a jointing plane, and a long plane is another name for it.
examples:
- The carpenter used the jointer to smooth the edge before making the joint.
- A jointer shapes a board edge so it will join cleanly with the next board.
