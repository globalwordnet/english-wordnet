simpleMeaning: An Asian wild crab apple tree grown in many varieties for its small, sour, usually red
  fruit, which is used to make preserves.
scope: This is a wild Asian fruit tree grown for its small sour fruit; cherry apple, cherry crab, Malus
  baccata and Siberian crab are other names for it, and its nearest neighbours are the other wild fruit
  trees grown for their fruit.
examples:
- The Siberian crab apple in the yard bore small red fruit.
- We picked Siberian crab apples for preserving.
