simpleMeaning: The mouth of an animal that has a spine opens because the hard part holding the teeth at
  the bottom swings on a joint.
scope: It is also called jowl, jawbone, mandible, lower jaw, mandibula, mandibular bone, and submaxilla.
examples:
- The lower jawbone of the horse swung down as it yawned.
- The vet checked the lower jawbone for a crack.
