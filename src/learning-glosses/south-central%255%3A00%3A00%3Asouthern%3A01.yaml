simpleMeaning: In or of the part of the United States that takes in the states along the lower Mississippi
  and the land east of the Rio Grande.
scope: It is an adjective.
examples:
- They farm in the south-central United States, east of the Rio Grande.
- South-central towns along the lower Mississippi share the same hot summers.
