simpleMeaning: This rare crane of North America has black and white feathers and makes a loud call like
  a trumpet.
scope: This bird is also called whooping crane and Grus americana, and it is not the Old World swan of
  the same name.
examples:
- A whooper stood in the shallow water, its black and white feathers bright in the sun.
- They heard the whooper's loud call long before they saw the bird.
