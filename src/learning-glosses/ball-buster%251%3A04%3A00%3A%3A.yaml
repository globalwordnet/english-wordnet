simpleMeaning: A job or a situation that grinds a person down, being exacting, exhausting, and cruel.
scope: Also called a ball-breaker, this one names a kind of job, not a kind of person.
examples:
- The harvest season was a ball-buster for everyone on the farm.
- That ball-buster of a job left them too tired to eat.
