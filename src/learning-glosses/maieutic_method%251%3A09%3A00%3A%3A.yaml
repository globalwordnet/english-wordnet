simpleMeaning: A way of teaching through questions and answers, used by Socrates to draw true answers
  out of his students.
scope: It is also called the Socratic method.
examples:
- The teacher used the maieutic method to lead the students to the answer.
- Socrates asked question after question, using the maieutic method, until his students saw the truth.
