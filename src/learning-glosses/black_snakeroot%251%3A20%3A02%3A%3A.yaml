simpleMeaning: A low-growing perennial plant of Canada and the eastern and central United States that
  loses its leaves seasonally.
scope: Also called Asarum canadense and Canada ginger, this one is not the bugbane of North America.
examples:
- The black snakeroot grows low among the trees in the shade.
- They planted black snakeroot along the edge of the wood.
