simpleMeaning: The idea of matter with no size at all, or of a thing that can be treated as having no
  size.
scope: Also called pointlike mass. It is an idea, not a real object.
examples:
- However unlike point particles, point mass can only apply to an object that is infinitely small.
- In the sum, the star was treated as a point mass.
