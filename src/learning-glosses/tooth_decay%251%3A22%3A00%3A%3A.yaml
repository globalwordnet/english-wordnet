simpleMeaning: A softened, damaged spot in a tooth. If the decay spreads, the living tissue inside the
  tooth can die.
scope: A soft, rotted patch that gets worse over time, also called cavity, caries or dental caries, and
  not a crack from a knock or sore gums.
examples:
- The dentist found tooth decay in her back molar.
- Brushing twice a day helps prevent tooth decay.
