simpleMeaning: Of or relating to the thin layer of cells that covers the outside of the body and lines
  the inside of organs.
scope: Also called epithelioid. It is about a describing word, not a thing.
examples:
- The epithelial cells form a thin layer over the wound.
- Doctors checked the epithelial tissue under a microscope.
