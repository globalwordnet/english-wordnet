simpleMeaning: Clearness that comes from expressing things in a way that is easy to understand.
scope: Also called plainness or perspicuousness. It is a quality.
examples:
- The perspicuity of the writing made the report easy to follow.
- Good perspicuity helps readers grasp hard ideas at once.
