simpleMeaning: Said of something made with fixed artistic forms for effect, rather than arising on its
  own.
scope: Also called stylized, conventionalised and stylised; this one is about a style of work.
examples:
- The conventionalized dance followed fixed steps, with nothing left to chance.
- Critics called the film conventionalized because it never broke from set forms.
