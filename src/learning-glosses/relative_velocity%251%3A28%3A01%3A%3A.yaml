senseId: 'relative_velocity%1:28:01::'
synsetId: 92443571-n
simpleMeaning: how one body moves, in both speed and direction, when judged from a second body taken as
  not moving
scope: Also called relative speed, it is the movement of one body judged from a second body taken as not
  moving, in both speed and direction.
examples:
- The relative velocity of the two ships showed how fast they drew apart.
- We found the relative velocity of the plane by watching it from the ground.
