simpleMeaning: A bright, star-like galactic nucleus that emits radiation, sometimes including radio waves.
  Many show large redshifts, with their light shifted toward longer wavelengths.
scope: In astronomy, a star-like object that sends out radio waves and other energy.
examples:
- Their quasar glowed at dawn.
- The quasar was seen at noon.
