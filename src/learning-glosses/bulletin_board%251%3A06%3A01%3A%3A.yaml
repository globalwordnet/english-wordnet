simpleMeaning: On this computer, software lets people leave messages and read information of general interest.
scope: BBS, bulletin board system, and electronic bulletin board are other names for this thing, not the
  other sense of the same word, which names a panel for notices hung on a wall.
examples:
- They left a message on the bulletin board.
- The bulletin board lets users share news.
