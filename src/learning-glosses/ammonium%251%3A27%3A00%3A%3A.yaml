simpleMeaning: The positively charged ion NH₄⁺, derived from ammonia, which behaves in many ways like
  an alkali metal ion.
scope: Also called an ammonium ion, this is a charged bit of matter made from ammonia that acts like a
  bit of an alkali metal.
examples:
- Ammonium salts are used in cleaning products.
- The chemist tested the solution for ammonium.
