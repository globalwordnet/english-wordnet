simpleMeaning: Planning how towns and cities are laid out and used is one branch of building design.
scope: This is a branch of building design, not deciding a community's future layout and state.
examples:
- The new mayor made urban planning the first task, and hired a team to map how the town's land was used.
- Students of urban planning spend a year learning how streets, parks, and homes fit together in a town.
