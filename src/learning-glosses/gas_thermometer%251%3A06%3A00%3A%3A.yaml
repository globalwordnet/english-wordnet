simpleMeaning: A device for finding how hot something is, by how the pressure of a substance like air
  inside it changes while its size stays the same.
scope: Also called air thermometer, this one is about a measuring device.
examples:
- The gas thermometer showed a rise in temperature.
- They read the gas thermometer every hour.
