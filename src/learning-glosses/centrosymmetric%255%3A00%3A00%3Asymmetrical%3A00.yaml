simpleMeaning: Having parts arranged around a central point so that each part has a matching part directly
  opposite it.
scope: Radially symmetrical is another name for this.
examples:
- They drew a centrosymmetric flower with petals all around the middle.
- The centrosymmetric pattern on the floor was made of small tiles.
