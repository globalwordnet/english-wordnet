senseId: 'physical_change%1:22:00::'
synsetId: 13557219-n
simpleMeaning: A change between solid, liquid, or gas in which the substance keeps the same chemical composition.
scope: It is also called phase change, phase transition, or state change.
examples:
- Melting ice is a physical change.
- When water boils, the physical change turns liquid into gas without changing what the water is made
  of.
