simpleMeaning: An electronic device that watches over the working of the organ that keeps blood moving
  around the body, without pause.
scope: This device is also called a cardiac monitor.
examples:
- The nurse checked the monitor beside the bed every hour.
- A small monitor on the wrist kept track of the pulse through the night.
