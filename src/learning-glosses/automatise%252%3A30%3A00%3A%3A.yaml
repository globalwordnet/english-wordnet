simpleMeaning: To hand a job over to a machine, so it runs with no one steering it.
scope: Also called automatize and automate, this one is not the other sense of this word, which turns
  a person into a machine.
examples:
- The factory automatised the packing line so the boxes moved on their own.
- They automatised the billing so no one had to send out each bill by hand.
