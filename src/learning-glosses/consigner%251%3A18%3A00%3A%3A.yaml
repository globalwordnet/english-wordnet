simpleMeaning: The person who hands goods over to someone else to look after.
scope: Consignor is another name for this sense; this is the giver of the goods, not the one who takes
  them in.
examples:
- The consigner handed the crates to the shipping firm on Monday.
- The consigner signed the papers before the goods left the warehouse.
