senseId: 'abocclusion%1:26:00::'
synsetId: 14077447-n
simpleMeaning: The state in which the top teeth miss the bottom teeth when the mouth closes.
scope: This one is the opposite of teeth that meet when the mouth closes.
examples:
- The dentist found abocclusion when the child's top teeth would not meet the bottom ones.
- Their abocclusion meant they could not bite through a crisp apple.
