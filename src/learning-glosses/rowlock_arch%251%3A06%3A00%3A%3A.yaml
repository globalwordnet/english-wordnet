simpleMeaning: An arch whose stones are laid in rings, one ring inside the next, with more than one ring
  in all.
scope: It is about a span of more than one ring of stones, not one of a single ring.
examples:
- The rowlock arch showed rings of stone set one inside another.
- The rowlock arch stood above the opening, its rings one inside another.
