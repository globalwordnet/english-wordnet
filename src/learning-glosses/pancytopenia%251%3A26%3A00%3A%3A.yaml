senseId: 'pancytopenia%1:26:00::'
synsetId: 13997216-n
simpleMeaning: Low counts of red blood cells, white blood cells, and platelets, sometimes associated with
  a bone marrow tumor or aplastic anemia.
scope: It is a state with too few of all kinds of blood cell, not a lack of one kind of cell only.
examples:
- Her pancytopenia left her with too few red cells, white cells and platelets.
- The doctors investigated several possible causes of his pancytopenia.
