simpleMeaning: Blood reaches the fingers and toes through vessels in the hand and foot.
scope: Also called digital arteries, these are not vessels that carry blood away from the fingers and
  toes.
examples:
- The fingers stayed warm because blood came through the arteria digitalis.
- The arteria digitalis in the foot was easy to find on the scan.
