simpleMeaning: A small, noncancerous wart that forms on or around the genitals or anus.
scope: This is a small growth on or near the sex organs or the anus, also called a genital wart, condyloma
  acuminatum, or verruca acuminata, not one that does harm.
examples:
- They found a venereal wart on the skin near the sex organs, and it did no harm.
- The venereal wart sat on the skin near the anus and did no harm.
