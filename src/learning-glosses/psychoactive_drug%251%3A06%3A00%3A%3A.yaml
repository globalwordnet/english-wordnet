simpleMeaning: A drug that can change your mood and the way you see, hear, or experience things.
scope: Also called a consciousness-altering drug, a mind-altering drug, or a psychoactive substance. It
  is a substance.
examples:
- The doctor warned that the psychoactive drug could change their mood.
- They took a psychoactive drug before the concert.
