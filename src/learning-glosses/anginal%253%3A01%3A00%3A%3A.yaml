simpleMeaning: Said of a thing that has to do with pain in the chest that comes and goes when the heart
  does not get enough blood.
scope: Also called anginose and anginous. It is said of a thing.
examples:
- The anginal pain came on after climbing the stairs.
- Anginal pain often follows hard exercise.
