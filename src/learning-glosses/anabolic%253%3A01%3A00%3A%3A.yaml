simpleMeaning: To do with the part of the body's chemical changes that builds things up.
scope: The adjective for the building-up phase itself, not the other sense of this word, which covers
  things that help the building along.
examples:
- During the anabolic phase, the body builds new muscle.
- Doctors watched the anabolic changes in the patient during recovery.
