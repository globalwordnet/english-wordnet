simpleMeaning: A person who looks for water under the ground with a rod that is said to point to where
  the water is.
scope: Also called a dowser. It is a person.
examples:
- The rhabdomancer walked across the dry field with their rod, looking for a place to dig a well.
- Villagers asked the rhabdomancer to find water before they dug the new well.
