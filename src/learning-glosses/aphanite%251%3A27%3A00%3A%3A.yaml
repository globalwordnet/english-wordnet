senseId: 'aphanite%1:27:00::'
synsetId: 14750494-n
simpleMeaning: A uniform, fine-grained rock such as basalt whose individual mineral grains are too small
  to see with the naked eye.
scope: This is a rock of very small grains, all of one kind, with bits of mineral too small for the bare
  eye to pick out.
examples:
- They found aphanite in the cliff.
- Basalt is an aphanite, its grains too fine to pick out.
