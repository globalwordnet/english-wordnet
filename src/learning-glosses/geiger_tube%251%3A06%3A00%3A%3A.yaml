simpleMeaning: A tube inside a Geiger counter containing a chamber where radiation gives gas atoms an
  electric charge.
scope: 'Also called Geiger-Muller tube: a chamber inside a radiation counter where gas turns into an electric
  charge when rays pass through, not the whole counter and not a chamber that works without gas.'
examples:
- The Geiger tube clicked faster near the old rock.
- He replaced the Geiger tube in the counter.
