simpleMeaning: A folded area of gray matter within the white matter on each side of the cerebellum, the
  part of the brain that helps coordinate movement.
scope: A paired structure of gray matter within the cerebellum.
examples:
- The dentate nucleus lies deep in the cerebellum.
- Each side of the cerebellum contains a dentate nucleus.
