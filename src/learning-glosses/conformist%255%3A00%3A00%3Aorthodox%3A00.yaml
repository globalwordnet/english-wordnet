simpleMeaning: Keeping to set customs or beliefs, above all those of religion.
scope: Also called conforming, this one is about following set ways, not the person who follows them.
examples:
- The conformist priest kept the old rites of the parish.
- Even as a student, the conformist scholar never broke with tradition.
