simpleMeaning: To do with words made by moving the letters of another word around, or with a word that
  holds or makes one.
scope: Also called anagrammatical, it is used of the words themselves, not of the letters they are made
  from.
examples:
- The anagrammatic puzzle asked readers to unscramble the letters.
- The anagrammatic play on the name made the class laugh.
