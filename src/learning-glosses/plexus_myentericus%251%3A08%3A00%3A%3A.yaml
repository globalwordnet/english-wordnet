senseId: 'plexus_myentericus%1:08:00::'
synsetId: 05515407-n
simpleMeaning: A network of unmyelinated nerve fibers and postganglionic autonomic nerve cell bodies in
  the muscular walls of the esophagus, stomach, and intestines.
scope: Also called the myenteric plexus; a nerve net in the gut wall, not the nerves of the brain or spinal
  cord.
examples:
- The plexus myentericus helps move food along the gut.
- Damage to the plexus myentericus can slow the stomach.
