simpleMeaning: A wingless insect with mouthparts adapted for biting. Most such lice live as parasites
  on birds.
scope: This small wingless insect that feeds mostly on feathered creatures is also called bird louse and
  louse.
examples:
- The biting louse bit the bird and stayed on it.
- More than one biting louse lived on the same bird.
