simpleMeaning: A liquid that has been stirred hard and will not lie still, but keeps heaving in rough
  waves.
scope: This word, also called churning, turbulent, roiling and roiled, fits a liquid that will not lie
  still.
examples:
- The roily river moved in rough waves.
- We waited until the roily water grew calm again.
