senseId: 'pentoxifylline%1:06:00::'
synsetId: 03919556-n
simpleMeaning: A medicine sold as Trental for walking pain from poor circulation. It may help red blood
  cells bend more easily and flow through vessels to the legs and feet.
scope: A drug for pain in the legs when walking, not a drug that takes pain away and not a drug for the
  heart.
examples:
- The doctor gave him pentoxifylline for the pain in his legs.
- Pentoxifylline helped the blood reach her feet.
