simpleMeaning: The way of playing back sound so it seems to come from all sides, with two microphones
  feeding two or more speakers.
scope: Stereo, stereo system, and stereophonic system are other names for this way of making sound.
examples:
- The concert recording used stereophony to make the music seem deep.
- With stereophony, the sound seemed to come from every side.
