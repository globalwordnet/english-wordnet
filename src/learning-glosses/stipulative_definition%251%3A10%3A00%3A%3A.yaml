simpleMeaning: A meaning for a word that someone sets down, even though most people do not use the word
  that way.
scope: It is one kind of word meaning, not the usual one.
examples:
- They agreed on a stipulative definition before they started the debate.
- The book opens with a stipulative definition of the key term.
