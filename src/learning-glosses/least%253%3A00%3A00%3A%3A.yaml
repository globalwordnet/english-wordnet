senseId: 'least%3:00:00::'
synsetId: 01560454-a
simpleMeaning: The superlative of 'little', often used with uncountable nouns and usually following 'the'.
  It means smallest in amount, extent or degree.
scope: This is about the smallest amount or degree, not about a small number of countable things.
examples:
- She has the least money of all of us.
- This is the least difficult of the three tasks.
