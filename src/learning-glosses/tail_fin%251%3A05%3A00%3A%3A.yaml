simpleMeaning: This fin is the back end of a fish, or of another water animal with a backbone.
scope: Also called a caudal fin, this is the part at the back end of a fish, not the part on an airplane
  and not the decoration on a car.
examples:
- The shark's tail fin cut through the water.
- The fish moved its tail fin as it swam.
