synsetId: 14162497-n
simpleMeaning: The most common form of plague in people, causing chills, severe weakness, confusion and
  swollen glands in the armpits or groin. It rarely spreads directly between people.
scope: An older medical name for bubonic plague.
examples:
- Pestis bubonica is the name used for bubonic plague in this historical medical text.
- The physician recorded swollen glands in a case of pestis bubonica.
