simpleMeaning: To do with, or causing, a change in the shape or size of a body made of matter or a figure
  in geometry.
scope: This is not the state of a thing that is already out of shape.
examples:
- The deformational change in the metal came from the heavy load.
- They studied the deformational effect of heat on the solid block.
