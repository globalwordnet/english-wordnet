simpleMeaning: A bill drawn up again for the amount of one gone unpaid, the second drawing's costs and
  charges added to that amount.
scope: This is the new bill drawn up for the sum of an unpaid bill, with the costs and charges of drawing
  it up again added, not the unpaid bill itself.
examples:
- The bank sent a redraft when the first bill went unpaid.
- He paid the redraft, costs and all.
