simpleMeaning: A tick feeding on Peromyscus mice and biting humans. It is the main Lyme disease carrier
  in the eastern US, especially New England. Northern ticks were once called Ixodes dammini.
scope: 'Also called black-legged tick: a tick that bites people and carries Lyme sickness, not a dog tick
  and not a flea.'
examples:
- The Ixodes scapularis bit the hiker in the woods.
- Ixodes scapularis carries Lyme sickness in the east.
