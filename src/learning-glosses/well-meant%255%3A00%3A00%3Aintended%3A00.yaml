simpleMeaning: Done with the best will, it often does more harm than good.
scope: This is also called well-intentioned and well-meaning, and it is not about something done to cause
  harm.
examples:
- The well-meant criticism stung, though it came from a kind place.
- They took the well-meant warning the wrong way and grew angry.
