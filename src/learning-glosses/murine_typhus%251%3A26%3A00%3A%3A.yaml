simpleMeaning: A sudden illness caused by rickettsia bacteria and spread by the bite of an infected flea,
  with fever, chills, aching muscles and a rash.
scope: Murine typhus is also called endemic typhus or rat typhus.
examples:
- Murine typhus is carried by fleas that live on rats and other small animals.
- Fever and aching muscles were among her symptoms of murine typhus.
