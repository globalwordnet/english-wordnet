simpleMeaning: A square array of numbers with ones on the diagonal from top left to bottom right and zeros
  everywhere else.
scope: Also called an identity matrix, this is a square of numbers with ones on its diagonal, not one
  with other numbers on that line.
examples:
- They wrote the unit matrix with ones down the line from corner to corner and zeros elsewhere.
- In the unit matrix, the numbers on the corner-to-corner line were all one.
