simpleMeaning: An antibiotic obtained from a type of bacterium called an actinomycete. Its sulfate form,
  sold as Neobiotic, is used in surgery to reduce germs in the intestine.
scope: Neomycin is another name for this drug that kills germs, got from a tiny living thing and used
  in surgery to clean the gut.
examples:
- Fradicin was used in surgery to clean the gut.
- Fradicin is sold as Neobiotic.
