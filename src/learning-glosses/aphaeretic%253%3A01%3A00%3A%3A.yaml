simpleMeaning: Said of a word that has lost a sound or a letter from its start, or of the loss itself.
scope: Also called apheretic, this one is not about a sound or a letter added at the start of a word.
examples:
- The aphaeretic form drops the first sound, so 'opossum' becomes 'possum'.
- They called the shortened word an aphaeretic form of the longer one.
