simpleMeaning: Said of a practice that has become fixed, as if it had sunk into a long cut in the ground.
scope: Also called grooved. It is a figure of speech, not a real cut.
examples:
- After years in the same job, their routine was well-grooved and hard to change.
- The well-grooved habits of the old office slowed every new plan.
