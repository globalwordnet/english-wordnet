simpleMeaning: A brand of hydrocortisone, a hormone from the adrenal glands that helps regulate how the
  body uses carbohydrates and proteins.
scope: This is a body chemical from the small glands on top of the kidneys that works on sugars and proteins;
  also called cortisol, hydrocortisone and Cortef.
examples:
- The patient took Hydrocortone each morning.
- Hydrocortone helps the body use sugars and proteins.
