simpleMeaning: Able to be taken in and made sense of.
scope: Also called understandable, intelligible, apprehensible, and graspable. It is a quality of an idea,
  not of a thing seen or heard.
examples:
- The plan was perceivable to the whole team.
- The meaning was perceivable once an example was given.
