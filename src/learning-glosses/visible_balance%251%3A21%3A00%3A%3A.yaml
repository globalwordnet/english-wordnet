senseId: 'visible_balance%1:21:00::'
synsetId: 13430536-n
simpleMeaning: What a country gains or loses over a period when the goods it sells abroad are set against
  the goods it buys in.
scope: This is also called a balance of trade, a trade balance, or a trade gap, and it is not the trade
  in services.
examples:
- The country's visible balance turned out well, since its exports were higher than its imports.
- They worked out the visible balance for the year from the trade figures.
