simpleMeaning: This telephone talks to others through the air by radio waves, with no cables between them.
scope: This one is also called radiophone and radiotelephone, and it is a single device, not the whole
  system of telephony.
examples:
- They spoke on a wireless telephone from the ship to the shore.
- The wireless telephone in the car let them call home without any cables.
