senseId: 'antagonistic_muscle%1:08:00::'
synsetId: 05300539-n
simpleMeaning: In physiology, a muscle that acts against the work of another muscle.
scope: This word is about one of a pair that acts against the other, like the biceps against the triceps,
  not about two that pull the same way.
examples:
- The biceps and triceps are antagonistic muscles, each undoing the other's pull.
- When one antagonistic muscle tightens, the other must loosen for the arm to move.
