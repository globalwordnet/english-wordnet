synsetId: 06360967-n
simpleMeaning: Something set down in writing, especially material copied into another form, such as a
  typed version of dictated words.
scope: This is also called transcription, and it is the version on paper, not the words as spoken.
examples:
- The written text of the speech was handed out after the talk.
- They read the written text of the interview in the magazine.
