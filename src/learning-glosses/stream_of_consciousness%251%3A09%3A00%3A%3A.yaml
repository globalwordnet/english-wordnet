senseId: 'stream_of_consciousness%1:09:00::'
synsetId: 05683281-n
simpleMeaning: The continuous flow of thoughts and feelings through a person's conscious mind.
scope: This is a person's own thoughts and feelings flowing on, not writing that shows a character's thoughts
  as they develop.
examples:
- The stream of consciousness kept moving from one thought to the next all morning.
- Ideas and feelings passed through the stream of consciousness without stopping.
