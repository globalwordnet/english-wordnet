simpleMeaning: To do with the world we live in, not with a perfect world above it.
scope: Also called mundane. It is not about the land as opposed to the sea or the air.
examples:
- They led a terrene life, full of ordinary work and plain food.
- Their hopes were terrene, set on this world and not on heaven.
