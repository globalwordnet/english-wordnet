simpleMeaning: Duchenne muscular dystrophy, the most common childhood form of muscular dystrophy, caused
  by a change on the X chromosome. It mainly affects boys.
scope: Pseudohypertrophic dystrophy is an older name for Duchenne muscular dystrophy.
examples:
- The older textbook called the condition pseudohypertrophic dystrophy.
- The doctor explained that pseudohypertrophic dystrophy gradually weakens the muscles.
