simpleMeaning: An herb with flat-topped clusters of white-rayed flower heads, scaly structures beneath
  them, and silky fruits that stay closed when ripe.
scope: This herb has pale rayed flowers in flat clusters, scaly bracts and silky fruits that stay shut.
examples:
- The white-topped aster bore flowers with pale rays.
- White-topped aster grows as a herb with silky fruits.
