simpleMeaning: Blood moves back and forth between the unborn young and the sac that holds its yolk.
scope: This flow of blood runs between the embryo and the yolk sac, not through the whole body.
examples:
- The embryo gets blood through the vitelline circulation.
- They traced the vitelline circulation from the embryo to the yolk sac.
