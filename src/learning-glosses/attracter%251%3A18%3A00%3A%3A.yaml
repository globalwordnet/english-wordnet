simpleMeaning: One who performs for big crowds, drawing them in.
scope: Draw and attraction are also names for this performer, as are attractor and drawing card, not the
  other sense of this word, which is about a pleasing feature of a thing.
examples:
- The singer was the biggest attracter on the bill, and the hall was packed.
- Crowds came from far away to see the attracter perform.
