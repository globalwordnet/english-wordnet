simpleMeaning: To write the parts that musical instruments will play in a piece of music.
scope: This is about writing music for players, not fitting a thing with measuring tools, not a music-making
  device, and not a law paper.
examples:
- He will instrument the new tune for the school band.
- They instrumented the old folk song so the band could play it at the fair.
