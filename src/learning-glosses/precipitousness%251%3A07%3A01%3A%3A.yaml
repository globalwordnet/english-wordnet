senseId: 'precipitousness%1:07:01::'
synsetId: 05067645-n
simpleMeaning: The quality of happening in a rush or without warning.
scope: It is also called suddenness, abruptness, precipitance, precipitancy, or precipitateness. It is
  a quality of how something happens, not how steep a slope is.
examples:
- The precipitousness of the attack left no time to prepare.
- Everyone was startled by the precipitousness of the change in weather.
