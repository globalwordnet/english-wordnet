simpleMeaning: A long, narrow microphone that picks up sound mainly from the direction it points, even
  at a distance.
scope: Also called a shotgun microphone. It can pick out a distant sound.
examples:
- He held a gun mike over the crowd to catch the speaker's voice.
- The gun mike picked up the whisper from the far end of the hall.
