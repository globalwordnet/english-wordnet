simpleMeaning: A bank plan for saving money, where money put in stays for a set time, or comes out only
  after telling the bank or with loss of what it earned.
scope: This one is also called time deposit account.
examples:
- The deposit account keeps the money in the bank for a set time.
- Money in a deposit account cannot be taken out at once without losing some of what it earned.
