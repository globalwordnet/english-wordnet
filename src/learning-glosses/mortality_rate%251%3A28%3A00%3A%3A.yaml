senseId: 'mortality_rate%1:28:00::'
synsetId: 15302104-n
simpleMeaning: A measure of how deaths in one place compare with those who live there, counted for every
  thousand people each year.
scope: It is also called mortality, death rate, deathrate, and fatality rate.
examples:
- The mortality rate in the town fell last year.
- They worked out the mortality rate for each town in the area.
