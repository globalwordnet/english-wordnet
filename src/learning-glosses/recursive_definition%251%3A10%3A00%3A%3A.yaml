simpleMeaning: A definition that uses earlier or simpler values of a function to calculate a given value
  in finitely many steps.
scope: This belongs to mathematics, where a function is set out so its values can be worked out step by
  step.
examples:
- The book gave a recursive definition of the factorial function.
- The class used a recursive definition to work out the next numbers in the series.
