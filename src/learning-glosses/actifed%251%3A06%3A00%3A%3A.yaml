simpleMeaning: A brand of medicine containing an antihistamine and a decongestant, used for upper respiratory
  conditions such as nasal congestion and for mild allergies.
scope: A drug with one part that fights allergy signs and one that clears a blocked nose; it treats upper
  breathing ills and mild allergies, which sets it apart from drugs for the lower chest.
examples:
- She took Actifed for her blocked nose.
- Actifed helped his mild allergy.
