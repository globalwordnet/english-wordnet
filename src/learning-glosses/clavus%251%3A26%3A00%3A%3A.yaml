senseId: 'clavus%1:26:00::'
synsetId: 14388207-n
simpleMeaning: A hard lump of skin, above all on the upper parts or the edges of the toes, made by shoes
  that do not fit well pressing on them.
scope: This one is also called a corn.
examples:
- The clavus on the little toe hurt with every step.
- A clavus formed where the new shoes pressed on the toes.
