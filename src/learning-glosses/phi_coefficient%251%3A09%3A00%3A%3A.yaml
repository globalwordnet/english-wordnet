senseId: 'phi_coefficient%1:09:00::'
synsetId: 06044943-n
simpleMeaning: A number that shows how closely two characteristics are related when each has only two
  possible values.
scope: Also called phi correlation. Each person or item has a value for both characteristics.
examples:
- They used the phi coefficient to see whether attending class was linked to passing the test.
- The phi coefficient was close to zero in the second group.
