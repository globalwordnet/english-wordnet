simpleMeaning: The extra oxygen the body needs after intense exercise and continues to take in while recovering
  at rest.
scope: After hard exercise the body is left short of the gas we breathe until rest makes up what is owed.
examples:
- After the hard race, they spoke of the oxygen debt they had built up.
- The oxygen debt from the long run eased only once they had rested.
