simpleMeaning: A length of 1,760 yards, that is, 5,280 feet, and exactly 1609.344 meters.
scope: Also called mile, mi, international mile, land mile, and stat mi. It is a unit of length.
examples:
- They walked a statute mile to the next town.
- The road runs for three statute miles through the valley.
