senseId: visually_challenged%5:00:00:blind:00
synsetId: 02167384-s
simpleMeaning: Said of a person whose sight is far weaker than most people's, so that much of what is
  around them cannot be seen.
scope: Also called purblind, dim-sighted, near-blind, sand-blind, and visually impaired. It is said of
  a person, not of a thing.
examples:
- The visually challenged man reads with a large-print book.
- A teacher helps visually challenged children cross the road.
