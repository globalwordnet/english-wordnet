senseId: 'signalize%2:32:01::'
synsetId: 01041202-v
simpleMeaning: To pass on what you mean by a gesture or a look, with no word spoken and no sound made.
scope: This is also called sign, signal, or signalise, and it is not the work of putting up lights to
  guide road traffic.
examples:
- The diner signalized the waiters to bring the menu.
- A guest signalized disapproval with a dismissive hand gesture.
