senseId: 'teleprocessing%1:22:00::'
synsetId: 13489745-n
simpleMeaning: Handling data in which some of the work is done in different places, connected by lines
  that carry signals.
scope: Also called distributed data processing and remote-access data processing. It is not work on data
  done all in one place.
examples:
- Teleprocessing lets the office in one city use machines in another.
- The bank uses teleprocessing to handle accounts from many places.
