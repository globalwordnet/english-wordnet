simpleMeaning: A person who moves goods in or out of a country and keeps back the tax that is due on them.
scope: This one is also called moon curser, moon-curser, runner, and smuggler.
examples:
- The contrabandist hid the goods under the floor of the boat.
- Police caught the contrabandist as the goods were loaded at night.
