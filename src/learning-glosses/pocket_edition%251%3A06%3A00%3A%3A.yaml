simpleMeaning: Printed pages bound in soft covers, small enough to slip into a coat.
scope: Also called a pocketbook or a pocket book. It is not a large hard-cover volume.
examples:
- The pocket edition fit in a coat and was easy to carry on the trip.
- A pocket edition is easy to carry, so many readers take one on a trip.
