simpleMeaning: A measure of distance equal to 1,760 yards or 5,280 feet, which is exactly 1609.344 meters.
scope: It is also called a mile, mi, an international mile, a stat mi, or a statute mile.
examples:
- They walked a land mile to the village.
- The old map marked distances in land miles.
