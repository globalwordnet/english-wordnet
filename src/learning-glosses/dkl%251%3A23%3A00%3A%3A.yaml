simpleMeaning: One metric unit of volume, the same as ten thousand cubic centimetres.
scope: Also called dal, decaliter, decalitre, dekaliter, and dekalitre, this one is a measure of volume,
  not of length.
examples:
- The jug holds one dkl of water.
- They poured a dkl of milk into the pot.
