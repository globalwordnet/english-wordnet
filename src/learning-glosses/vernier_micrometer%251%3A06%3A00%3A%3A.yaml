simpleMeaning: An instrument that reads the size of a thing to a tiny fraction, with a short scale that
  slides beside the main one.
scope: Also called vernier caliper. It is a measuring tool, not a plain ruler.
examples:
- The worker used the vernier micrometer to measure the wire's thickness.
- The vernier micrometer showed the bolt was a fraction too wide.
