senseId: 'sex-linked_disorder%1:26:00::'
synsetId: 14589277-n
simpleMeaning: A condition caused by a gene on a sex chromosome, often the X chromosome.
scope: This is any illness or fault whose form is fixed by the hormones that shape male and female bodies.
examples:
- A sex-linked disorder can be traced to a change in a gene on the X chromosome.
- Their sex-linked disorder came from the hormones that shaped their body.
