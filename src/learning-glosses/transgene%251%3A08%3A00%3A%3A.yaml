simpleMeaning: A gene introduced from outside an organism and incorporated into its genetic material.
scope: This bit of living material comes from outside, not from the living thing it is put into.
examples:
- They put a transgene into another living thing's genome.
- The transgene came from a different living thing than the one it was put into.
