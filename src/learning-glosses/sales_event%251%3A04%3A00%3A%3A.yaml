simpleMeaning: A spell, most often short, when prices fall well below their usual level, so buyers pay
  less.
scope: Also called sale and cut-rate sale, it marks a spell when things cost less than they usually do.
examples:
- We went to the sales event and bought things for less.
- I got some great bargains at the sales event.
