simpleMeaning: The laying down of colouring matter in animals, plants, or people.
scope: This sense is a process, not the colour that results in living tissue.
examples:
- As the fruit ripens, pigmentation builds up in the apple skin.
- Pigmentation in the leaves comes from colouring matter laid down as they grow.
