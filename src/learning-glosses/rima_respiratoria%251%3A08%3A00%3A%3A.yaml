simpleMeaning: A space in the throat, with a fold of tissue on each side that stays still while a person
  speaks.
scope: Also called false glottis, glottis spuria, and rima vestibuli. It is an opening.
examples:
- The doctor looked at the rima respiratoria through a small mirror.
- The chart labels the rima respiratoria in the throat.
