simpleMeaning: The severe form of smallpox, a contagious viral illness that caused fever, weakness, and
  pus-filled skin sores that often left scars.
scope: 'Also called smallpox and variola: a very catching viral sickness with pus-filled skin sores, not
  chickenpox and not measles.'
