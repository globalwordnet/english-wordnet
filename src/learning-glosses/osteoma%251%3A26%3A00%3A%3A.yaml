simpleMeaning: A slow-growing, noncancerous tumor made of bone tissue, usually found on the skull or lower
  jaw.
scope: On the skull or the jaw is where this slow-growing harmless growth of bone sits most often.
examples:
- The osteoma grew slowly on the jaw.
- The osteoma sat on the skull and grew slowly.
