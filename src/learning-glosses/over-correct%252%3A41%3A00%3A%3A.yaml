synsetId: 02526026-v
simpleMeaning: To change a thing too much in trying to put it right, because you are afraid of getting
  it wrong.
scope: It is also called overcompensate.
examples:
- They overcorrected the draft again and again, afraid of getting it wrong.
- They kept overcorrecting the figures until the numbers no longer made sense.
