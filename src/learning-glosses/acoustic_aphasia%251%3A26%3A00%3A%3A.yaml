senseId: 'acoustic_aphasia%1:26:00::'
synsetId: 14121375-n
simpleMeaning: A weakness in understanding spoken words, even though the ears still hear them.
scope: This one is also called auditory aphasia and word deafness.
examples:
- They had acoustic aphasia, so they heard the words clearly yet could not make sense of them.
- The doctor tested them for acoustic aphasia after they kept asking what people meant, though their hearing
  was fine.
