simpleMeaning: A sale where a whole plot is sold as one, with no promise about its size.
scope: Also called a sale in gross; this one is about a whole plot sold as one.
examples:
- They bought the farm under a contract of hazard, taking the whole plot as one.
- The contract of hazard said nothing about how many acres the land covered.
