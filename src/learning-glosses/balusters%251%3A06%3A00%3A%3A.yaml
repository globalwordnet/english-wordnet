simpleMeaning: Beside stairs or a balcony, people are kept from falling by this railing.
scope: Also called a banister, a balustrade, a handrail, or a bannister, this one is about what stands
  at the side, not the stairs themselves.
examples:
- They leaned on the balusters and looked down at the hall.
- The balusters along the stairs were painted white.
