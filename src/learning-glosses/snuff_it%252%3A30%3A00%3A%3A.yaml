simpleMeaning: An informal expression meaning to die.
scope: Die, go, pass, choke, exit, croak, perish, decease, expire, conk, buy the farm, cash in one's chips,
  drop dead, give-up the ghost, kick the bucket, pass away, and pop off are other names for this, reaching
  the point where life leaves the body and its work ends.
examples:
- The patient snuffed it peacefully.
- The old sailor snuffed it at the age of ninety.
