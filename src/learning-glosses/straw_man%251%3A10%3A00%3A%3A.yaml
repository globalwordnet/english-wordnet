senseId: 'straw_man%1:10:00::'
synsetId: 07197027-n
simpleMeaning: A weak or distorted version of an argument, presented so it can be easily defeated.
scope: This sense is also called strawman, and is not the figure set up to scare birds from seeds.
examples:
- A straw man looks strong until someone answers it.
- They set up a straw man and knocked it down with ease.
