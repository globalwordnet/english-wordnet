simpleMeaning: A failure to keep the terms of an agreement that does not wipe out its worth but can lead
  to a demand for money for the loss.
scope: It is a failure.
examples:
- The late delivery was a partial breach of the contract.
- A partial breach still lets the other side ask for money.
