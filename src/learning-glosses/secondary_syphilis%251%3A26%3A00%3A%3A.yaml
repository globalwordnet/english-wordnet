simpleMeaning: The second stage of syphilis, often marked by a rash or sores on the skin and moist body
  linings.
scope: This next stage of the illness, with sores on the skin and the wet lining, is set apart from the
  first stage that comes before it.
examples:
- Sores broke out on the skin when the illness reached secondary syphilis.
- The wet lining inside the body broke out in sores in secondary syphilis.
