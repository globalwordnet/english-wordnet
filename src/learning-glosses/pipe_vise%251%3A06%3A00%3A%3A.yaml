simpleMeaning: A clamp that holds a tube for cutting or for making a screw thread in it.
scope: Also called a pipe clamp. It is a tool, not a cutter.
examples:
- The pipe vise held the tube while the worker cut the thread.
- The pipe vise was tightened before the tube was cut.
