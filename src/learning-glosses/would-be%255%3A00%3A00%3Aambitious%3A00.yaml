simpleMeaning: Hoping for an ambition they have not yet reached, or held back from reaching it.
scope: Also called manque, this is not someone who has already won it.
examples:
- The would-be singer practised every day in the hope of a first real show.
- A would-be leader with no followers stood up to speak.
