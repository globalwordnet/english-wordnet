scope: A European tree with bright, hard, smooth leaves, also called a bay willow, not a common willow
  with long thin leaves and not a laurel bush.
examples:
- A laurel willow grows beside the pond, its leaves bright in the sun.
- They planted a laurel willow along the eastern fence.
