simpleMeaning: A celebration held 300 years after an event, or the day itself.
scope: Also called tercentenary and triennial. It is not a 200th anniversary.
examples:
- The tercentennial of the college fell in the same year as the town's.
- They opened a new hall for the tercentennial.
