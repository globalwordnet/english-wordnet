schema: oewn-learning-gloss-v2
senseId: 'independent_clause%1:10:00::'
synsetId: 06325416-n
simpleMeaning: A group of words that forms a full sentence on its own, even as part of a sentence that
  has other parts in it.
scope: Also called a main clause.
examples:
- The clause 'the rain stopped' can stand alone as a sentence.
- In the sentence 'When the rain stopped, we stayed', 'we stayed' is the independent clause.
