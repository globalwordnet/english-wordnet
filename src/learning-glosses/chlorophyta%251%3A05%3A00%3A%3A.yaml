simpleMeaning: Green algae, mainly freshwater, with chlorophylls a and b, starch stores, and cellulose
  walls. Older classifications grouped Chlorophyceae, Ulvophyceae, and Charophyceae together. Land plants
  arose within the charophyte lineage.
scope: Also called division Chlorophyta; a big group of fresh-water algae, not a single kind of seaweed
  and not a land plant.
examples:
- Chlorophyta includes the green algae of fresh water.
- Most Chlorophyta store food as starch.
