simpleMeaning: Above all by a surgeon as part of an operation, soft body parts or organs are cut away
  or cut into.
scope: This is a cut into soft body parts or organs, or a cutting of them away, done above all by a surgeon
  during an operation; section and incision are other names for it.
examples:
- The surgical incision was made along the side of the belly.
- After the surgical incision healed, the scar was barely visible.
