simpleMeaning: A baptism in which a person is dipped under water three times, each dip in the name of
  one of the three persons of God, in turn.
scope: It is a kind of baptism.
examples:
- The priest performed a trine immersion at the font.
- They chose trine immersion for the baby's baptism.
