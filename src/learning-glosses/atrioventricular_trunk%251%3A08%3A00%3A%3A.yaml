simpleMeaning: A bundle of specialized heart muscle that carries electrical signals from the atrioventricular
  node to the lower chambers, causing them to contract.
scope: This sense is also called atrioventricular bundle and truncus atrioventricularis.
examples:
- An atrioventricular trunk carried the spark.
- Atrioventricular trunks make rooms squeeze.
