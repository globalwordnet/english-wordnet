schema: oewn-learning-gloss-v2
senseId: 'exocentric%3:00:00::'
synsetId: 00874135-a
simpleMeaning: Said of a group of words that plays a part in a sentence that none of its own parts plays.
scope: This one is said of a group of words.
examples:
- When 'until last Easter' serves as an adverb it is an exocentric construction.
- '''On the table'' is an exocentric construction when it says where something is.'
