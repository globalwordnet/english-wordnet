simpleMeaning: A person who studies how peoples live, including how families are linked by blood and marriage.
scope: Social anthropologist is another name for this one.
examples:
- The cultural anthropologist spent a year living with the villagers to learn their ways.
- The cultural anthropologist asked the elders how marriages were arranged in the village.
