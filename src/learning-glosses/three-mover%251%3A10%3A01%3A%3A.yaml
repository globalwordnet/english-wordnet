senseId: 'three-mover%1:10:01::'
synsetId: 92444680-n
simpleMeaning: A chess problem in which White, moving first, must checkmate Black in no more than 3 moves,
  whatever Black does.
scope: This is a chess problem with a set limit on the moves, not a game played through to the end.
examples:
- In this three-mover, White mates Black in 3 moves.
- They solved the three-mover and showed how White mates in 3.
