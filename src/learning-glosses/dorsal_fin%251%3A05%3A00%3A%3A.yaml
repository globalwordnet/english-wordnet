simpleMeaning: A fin along the middle of the back of a fish or other aquatic vertebrate that helps the
  animal balance.
scope: This fin runs down the middle of the back as a single fin, not one of a pair at the sides.
examples:
- The dorsal fin on the fish's back helped it keep its balance.
- Some water animals have a dorsal fin down the middle of the back.
