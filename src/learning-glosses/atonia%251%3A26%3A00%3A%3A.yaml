simpleMeaning: The state of a muscle with none of the usual tightness in it at rest.
scope: Also called amyotonia, atonicity, or atony, this one is not the tightness itself.
examples:
- The doctor noted atonia in the patient's arm, which hung loose at their side.
- The baby's atonia showed in limbs that stayed soft and slack.
