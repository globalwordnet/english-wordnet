senseId: 'metaphysis%1:08:00::'
synsetId: 05600625-n
simpleMeaning: The part of a long bone that is still growing, set between the long middle shaft and the
  rounded end.
scope: It is a part of a bone.
examples:
- The metaphysis of the child's thigh bone was still growing fast.
- The doctor looked at the metaphysis on the X-ray to check a child's growth.
