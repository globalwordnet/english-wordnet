simpleMeaning: Something that makes a place look nice, put up on an inside surface or across a window,
  like a woven cloth picture.
scope: Also called hanging. It is a decoration, not a picture in a frame.
examples:
- A wall hanging covered the cold stone surface.
- They bought a wall hanging for the hall.
