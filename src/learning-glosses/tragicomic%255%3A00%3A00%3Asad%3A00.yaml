simpleMeaning: Having both tragic and comic elements.
scope: This is also called tragicomical, and it is not a thing that is only sad, or only funny.
examples:
- They spoke of the tragicomic gap between what he hoped for and what he got.
- The play was tragicomic, sad in one scene and funny in the next.
