simpleMeaning: A tuberculosis skin test using tuberculin placed within the skin. Firm swelling assessed
  two to three days later can indicate TB infection and prompt further tests.
scope: A trained clinician reads the test by measuring firm swelling. A positive result needs follow-up
  to assess for active disease.
examples:
- The nurse checked the firm swelling after the Mantoux test.
- She had a Mantoux test to check for tuberculosis infection.
