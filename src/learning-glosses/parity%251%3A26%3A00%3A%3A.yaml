simpleMeaning: In obstetrics, the number of pregnancies that reached a specified stage before delivery,
  including those ending in stillbirth.
scope: Each qualifying pregnancy adds one to the count, even when twins are born.
examples:
- The doctor recorded the mother's parity as two.
- Parity is written in the notes after each birth.
