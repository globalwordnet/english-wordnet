simpleMeaning: A southern European perennial with fragrant flower clusters in many colors, especially
  yellow and orange. Often established on old walls or cliffs, it is sometimes classified in Erysimum.
scope: A long-lived plant with sweet-smelling flower bunches, also called a wallflower or Erysimum cheiri.
examples:
- The Cheiranthus cheiri on the old wall was covered in yellow flowers.
- We planted Cheiranthus cheiri along the cliff path for its sweet smell.
