simpleMeaning: An attractive, small, round-topped tree that sheds its leaves, bears showy clusters of
  white flowers at branch tips, and produces heavy hardwood that yields yellow dye.
scope: Also called gopherwood, Cladrastis kentukea, or Kentucky yellowwood, this small tree stands out
  for its white flowers in bunches at branch ends and its hard wood that gives yellow dye.
examples:
- Cladrastis lutea bloomed white in May.
- The Cladrastis lutea gave yellow dye from its wood.
