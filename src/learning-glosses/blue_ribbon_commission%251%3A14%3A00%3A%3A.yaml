simpleMeaning: An independent group of specially chosen, politically nonpartisan public figures and experts
  who investigate an important government issue.
scope: This group is also called blue ribbon committee.
examples:
- A blue ribbon commission looked into the question.
- The blue ribbon commission met to study the issue.
