senseId: semiaquatic%5:00:01:aquatic:00
synsetId: 00125365-s
simpleMeaning: A living thing that spends part of its time in the water and the rest on land.
scope: Also called subaquatic, this names a living thing that spends part of its time in the water and
  the rest on land, unlike the other sense of the same word, which is about a creature with a water life
  as a young one and a land life as an adult.
examples:
- The semiaquatic plant spends part of its time in the water.
- These semiaquatic creatures move between water and land.
