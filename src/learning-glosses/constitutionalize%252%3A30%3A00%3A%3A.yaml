senseId: 'constitutionalize%2:30:00::'
synsetId: 00569738-v
simpleMeaning: To make something part of a country's set of governing rules.
scope: Constitutionalise is another name for this sense; this is about a country's rules, not about a
  walk for one's health.
examples:
- A woman's right to an abortion was constitutionalized in the 1970's.
- The new law will constitutionalize free health care for all children.
