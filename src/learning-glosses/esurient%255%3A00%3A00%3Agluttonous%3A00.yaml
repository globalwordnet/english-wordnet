simpleMeaning: Said of someone who eats in great gulps or hungers for food in great amounts.
scope: This one is also called ravenous, wolfish, ravening, voracious, rapacious and edacious, and it
  is not about wanting things in general.
examples:
- The esurient wolves tore at the meat.
- After days without food, they grew esurient and ate everything in sight.
