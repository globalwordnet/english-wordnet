simpleMeaning: Said of one of the body parts of an animal whose body is built from sections joined together.
scope: This one is about one joined part of the body, not the body as a whole.
examples:
- Each arthromeric segment of the animal bends a little as it moves.
- The arthromeric plates on the creature's back moved as it walked.
