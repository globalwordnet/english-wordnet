simpleMeaning: A gentle way of naming death, picturing it as lying in a bed without end, as in a grave.
scope: This one is also called rest and sleep, and quietus and eternal rest are other names for it.
examples:
- They had to put their family pet to sleep.
- In the poem, the hero finds eternal sleep beneath the old oak tree.
