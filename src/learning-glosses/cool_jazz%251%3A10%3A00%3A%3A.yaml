simpleMeaning: A smooth, restrained style of jazz with complex harmonies and phrasing that often falls
  slightly behind the beat.
scope: This is the calm, smooth kind of jazz, unlike the loud, hard-driving kind, and unlike jazz that
  pushes its beat hard ahead.
