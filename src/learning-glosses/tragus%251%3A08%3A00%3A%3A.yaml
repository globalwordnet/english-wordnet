simpleMeaning: A small flap in front of the ear hole, made of the firm, bendy stuff that gives the ear
  its shape.
scope: This flap lies in front of the ear's opening, and it is not the opening itself.
examples:
- They pressed the tragus at the front of the ear.
- They could feel the tragus move when they pressed it.
