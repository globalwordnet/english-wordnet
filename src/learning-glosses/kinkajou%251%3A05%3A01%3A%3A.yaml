simpleMeaning: An old name for the potto, a grey-brown African primate related to lorises.
scope: Kinkajou usually names a tropical American relative of raccoons. Older writers also used it for
  the African potto.
examples:
- In the old zoology book, the African potto appears under the name kinkajou.
- The author described the African kinkajou as a slow-moving tree dweller.
