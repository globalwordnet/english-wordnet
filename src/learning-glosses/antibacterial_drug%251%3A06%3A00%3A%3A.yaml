simpleMeaning: Bacteria are killed by this medicine, or kept from growing by it.
scope: Also called antibacterial or bactericide, this is a medicine, not the bacteria it acts on.
examples:
- The doctor gave them an antibacterial drug for the infection.
- The nurse put an antibacterial drug on the wound after cleaning it.
