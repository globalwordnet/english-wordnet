simpleMeaning: Cholesterol carried by low-density lipoproteins, often called bad cholesterol. High levels
  in the blood are linked to health problems, especially heart and blood vessel disease.
scope: It is the 'bad' kind of blood fat, not the 'good' kind and not all blood fat together.
examples:
- Her LDL cholesterol was high.
- LDL cholesterol is called the 'bad' cholesterol.
