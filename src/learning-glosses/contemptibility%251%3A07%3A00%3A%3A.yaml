senseId: 'contemptibility%1:07:00::'
synsetId: 04815223-n
simpleMeaning: Being so low in what one stands for that one deserves scorn.
scope: Also called baseness, despicability, despicableness, and sordidness; this one is about what a person
  lacks, not what a person does.
examples:
- The manager's contemptibility showed in every selfish choice.
- No one trusted the mayor once the contemptibility became plain.
