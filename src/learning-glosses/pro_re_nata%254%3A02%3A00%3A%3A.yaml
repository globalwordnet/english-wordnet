simpleMeaning: Only when it is needed, as written by a doctor on a medicine order.
scope: Also called as needed, as required, or PRN. It is said of a medicine order.
examples:
- The doctor wrote pro re nata on the order, so the nurse gave the medicine only when the pain came back.
- Take this pill pro re nata, when the fever rises.
