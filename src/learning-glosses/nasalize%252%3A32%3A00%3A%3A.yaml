senseId: 'nasalize%2:32:00::'
synsetId: 00953238-v
simpleMeaning: To form a sound by dropping the soft palate, letting air escape through the nose.
scope: Also called nasalise. It is the way a single sound is formed, not a way of speaking as a whole.
examples:
- She nasalizes all her vowels.
- The speaker nasalizes the last vowel of the word.
