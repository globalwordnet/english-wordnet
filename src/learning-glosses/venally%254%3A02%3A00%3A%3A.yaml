simpleMeaning: In a dishonest way that breaks trust and hides the truth.
scope: Also called dishonestly and deceitfully. It is a word for the manner of an act, not the act itself.
examples:
- The clerk venally stamped the papers after a quiet word and a gift.
- They venally gave the job to their friend instead of the best person for it.
