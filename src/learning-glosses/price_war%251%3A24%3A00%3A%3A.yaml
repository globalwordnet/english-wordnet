simpleMeaning: Hard rivalry in which shops keep dropping what they charge to pull in more trade.
scope: Also called price competition. It is rivalry between sellers.
examples:
- The price war between the two petrol stations left both with thin profits.
- A price war can help buyers for a while, but small shops often lose out.
