simpleMeaning: A piece of stone or wood that has been given its shape but left with its surface still
  coarse and unfinished.
scope: Also called roughhewn, it is not a thing that lacks good taste or good manners.
examples:
- The rough-cut stone was left with a coarse surface.
- They built the wall from rough-cut timber.
