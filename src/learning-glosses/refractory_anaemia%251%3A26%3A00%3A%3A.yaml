senseId: 'refractory_anaemia%1:26:00::'
synsetId: 14191658-n
simpleMeaning: Anemia that responds poorly to treatment and is unrelated to another primary illness. Blood
  transfusions may be needed to manage it.
scope: Also called refractory anemia. It is a blood illness.
examples:
- The doctor said the refractory anaemia would only answer to a blood transfusion.
- They have lived with refractory anaemia for years, and only blood transfusions keep them well.
