simpleMeaning: A prop pie with an open top and a filling of real or imitation custard, thrown for comic
  effect in slapstick performances.
scope: It is a stage prop thrown in broad comic plays, not a pie made to be eaten.
examples:
- The clown threw a custard pie in the comedy.
- The custard pie flew through the air.
