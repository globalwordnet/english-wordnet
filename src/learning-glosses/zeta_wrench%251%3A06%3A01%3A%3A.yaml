simpleMeaning: A six-sided bar that fits into the head of a screw to turn it.
scope: Also called zeta key, hex key, Allen key, Allen wrench, Inbus key, Inbus wrench, Unbrako key, and
  Unbrako wrench. It is a tool.
examples:
- They tightened the bolt with a zeta wrench.
- A zeta wrench fits the small screws on the bike.
