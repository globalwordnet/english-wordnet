senseId: 'antithyroid%3:01:00::'
synsetId: 02992940-a
simpleMeaning: Said of something that slows down the work of the gland in the neck that controls how the
  body uses energy, when that work is too strong.
scope: This word is not used for something that speeds up the work of the gland.
examples:
- The doctor gave them an antithyroid drug to calm the overactive gland.
- They took an antithyroid tablet each morning to keep the gland in check.
