senseId: 'worldly_concern%1:09:00::'
synsetId: 05678816-n
simpleMeaning: The things people care about here and now, not in heaven or in the life after death.
scope: Also called world, earth, or earthly concern, this is about this life, not the life to come.
examples:
- Their worldly concerns were food, money, and a roof over their heads.
- They set their worldly concerns aside and spent the evening in prayer.
