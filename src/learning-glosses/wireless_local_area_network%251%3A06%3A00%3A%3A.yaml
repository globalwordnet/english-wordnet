simpleMeaning: A network that connects nearby devices by radio, often over a few hundred feet. A common
  type is Wi-Fi, which uses the IEEE 802.11 standards.
scope: 'Also called wireless fidelity: a short-range net without cables, not a wired net and not a phone
  signal that covers a whole town.'
examples:
- The school's wireless local area network covers the whole building.
- We set up a wireless local area network in the new office.
