simpleMeaning: A set form of prayer in church, in which people ask God to show pity and give help.
scope: This is a church rite of asking God together for help, not a private prayer.
examples:
- The church held a rogation, and the people prayed together for God's help.
- At the rogation the congregation asked God for mercy.
