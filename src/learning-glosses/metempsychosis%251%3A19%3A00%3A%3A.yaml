simpleMeaning: The passing of a dead person's soul into another person's body, where it begins a new life.
scope: Rebirth is another name for it.
examples:
- The old priest spoke of metempsychosis, saying the soul lives again in another body.
- Some people believe in metempsychosis and hope to return as singers.
