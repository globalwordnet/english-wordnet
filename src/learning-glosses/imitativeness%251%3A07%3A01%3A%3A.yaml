simpleMeaning: The state of doing what others do, copying them, or not being original.
scope: This word is used of a state.
examples:
- The imitativeness of the young child is so great that he will repeat in almost every detail all the
  actions of his nurse as she carries out the daily routine.
- Imitativeness in a small child shows when the child copies all the nurse does.
