simpleMeaning: A person who has studied God and matters of faith deeply, or who thinks hard about questions
  with no sure answer.
scope: Theologian, theologist, and theologizer are other names for this sense.
examples:
- The theologiser wrote about whether God could suffer.
- As a theologiser, they spent their days reading old books on God.
