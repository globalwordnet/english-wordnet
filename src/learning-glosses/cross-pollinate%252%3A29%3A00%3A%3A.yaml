simpleMeaning: To make a flower able to bear seed by bringing pollen to it from another flower.
scope: Pollinate and pollenate are other names for this sense.
examples:
- Bees cross-pollinate the apple trees as they move from flower to flower.
- The gardener cross-pollinated the roses with pollen from another plant.
