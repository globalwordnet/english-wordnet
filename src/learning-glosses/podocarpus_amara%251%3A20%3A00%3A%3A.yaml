simpleMeaning: A large, fast-growing tropical evergreen with male and female cones and glossy, spear-shaped
  leaves. It grows in rainforests from Sumatra and the Philippines to northern Queensland.
scope: Also called Prumnopitys amara and Sundacarpus amara, this is a large fast-growing tropical tree
  of rain forests, not a small shrub and not a tree of dry land.
examples:
- The Podocarpus amara towered over the forest.
- A Podocarpus amara grew in the rain forest.
