simpleMeaning: One kind of plant gives a drug that makes a person see or hear things that are not there.
scope: Among drugs that change what a person sees or hears, this one comes from a plant.
examples:
- The salvinorin made her see colours that were not in the room.
- He took salvinorin and heard voices that no one else could hear.
