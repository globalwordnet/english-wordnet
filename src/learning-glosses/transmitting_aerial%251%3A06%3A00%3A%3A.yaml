simpleMeaning: Radio or television signals go out through this aerial and come in through it too, and
  it runs on electricity.
scope: This sense is also called antenna and aerial, and it is about a device that works with radio or
  television signals.
examples:
- They fixed the transmitting aerial to the roof to get a clear picture.
- The transmitting aerial sent the signal out across the valley.
