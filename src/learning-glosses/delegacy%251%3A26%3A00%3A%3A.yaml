senseId: 'delegacy%1:26:00::'
synsetId: 14023888-n
simpleMeaning: The position of acting for another person, with official leave to speak and act in their
  place.
scope: This one is also called agency or representation; it is about serving in the post, not about the
  appointment itself or a group of people holding it.
examples:
- The delegacy lasted for two years.
- The delegacy gave the envoy leave to sign the agreement.
