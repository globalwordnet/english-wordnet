simpleMeaning: A person who strongly backs replacing the whole political or social order with a new one.
scope: Also called a revolutionary, a subversive, or a revolutionist. It is a person, not an event.
examples:
- The subverter was jailed for plotting against the state.
- The pamphlet praised subverters who wanted the old order gone.
