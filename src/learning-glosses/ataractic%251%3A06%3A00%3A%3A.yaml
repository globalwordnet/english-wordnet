simpleMeaning: A medicine that takes down worry and strain yet leaves the mind clear.
scope: Also called tranquilizer, tranquillizer, antianxiety agent, ataractic agent, ataractic drug, and
  tranquilliser, this one is not the other sense of this word, which tends to soothe or tranquilize.
examples:
- The doctor gave them an ataractic to ease the strain before the test.
- With the ataractic, they stayed calm and clear-headed through the long wait.
