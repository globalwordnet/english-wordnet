simpleMeaning: Someone who moves goods across a border and pays none of the tax on them.
scope: It is also called runner, smuggler, contrabandist and moon-curser.
examples:
- The moon curser brought silk into the port without paying the tax on it.
- Customs officers caught the moon curser with cases of untaxed brandy.
