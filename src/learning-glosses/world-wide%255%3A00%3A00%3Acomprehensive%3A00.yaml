simpleMeaning: Said of a thing that holds over the whole earth or can be used everywhere.
scope: Also called general, universal, worldwide, cosmopolitan, ecumenical, and oecumenical. It is said
  of a thing.
examples:
- The new rule has world-wide use in every office.
- They hope the plan will have world-wide reach.
