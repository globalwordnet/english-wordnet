senseId: 'reinforcer%1:09:00::'
synsetId: 05836876-n
simpleMeaning: In psychology, something that follows a behavior and makes the behavior more likely to
  happen again.
scope: Also called reinforcement or reinforcing stimulus, it is the follow-up in psychology that comes
  after an act, not the act it follows.
examples:
- The trainer used praise as a reinforcer to make the dog sit again.
- A small treat acted as a reinforcer after each correct answer.
