simpleMeaning: Said of an activity that asks for little effort and stays the same, over and over.
scope: Also called vegetative. It is a word for an activity, not for a person.
examples:
- The vegetive routine of the long winter wore them down.
- A vegetive job leaves the mind with nothing to do.
