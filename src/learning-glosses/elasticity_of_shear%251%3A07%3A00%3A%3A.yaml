simpleMeaning: The power of a thing to go back to its first shape after a force pushing sideways has pulled
  it out of shape.
scope: It is about a property of a thing, not a kind of force.
examples:
- The elasticity of shear of the steel beam was measured in the lab.
- Engineers tested the elasticity of shear in the new alloy.
