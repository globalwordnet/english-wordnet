simpleMeaning: An orchid with long spurs, leaves at its base, and petals that come together beneath the
  upper sepal, the flower's outer covering.
scope: 'Also called Habenaria hookeri: a flower with long spurs and low leaves, not a common garden flower
  and not a flower with wide-open petals.'
examples:
- Hooker's orchid grows in damp woods.
- We found a Hooker's orchid by the stream.
