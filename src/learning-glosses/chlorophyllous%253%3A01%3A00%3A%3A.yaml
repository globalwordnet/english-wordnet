simpleMeaning: Said of a thing that holds or is chlorophyll, the substance that makes plants green, or
  has to do with it.
scope: This one is also called chlorophyllose.
examples:
- The chlorophyllous parts of the alga gave it its green colour.
- They tested the chlorophyllous tissue to see how much green pigment it held.
