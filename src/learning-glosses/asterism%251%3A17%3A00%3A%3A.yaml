simpleMeaning: In astronomy, stars that stand close together in the sky, or the small pattern they make
  there.
scope: This one is about stars in the sky, not the star-shaped figure seen in crystals.
examples:
- The Big Dipper is an asterism that most people can find on a clear night.
- On a clear night, they picked out an asterism low in the east.
