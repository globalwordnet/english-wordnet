simpleMeaning: The pushing up of a baby's first teeth through the gums.
scope: This one is also called teething or odontiasis; it is not about the kinds, numbers, and arrangement
  of teeth.
examples:
- During the dentition, a first tooth showed through the baby's gum.
- A tooth pushed up through the gum during the dentition.
