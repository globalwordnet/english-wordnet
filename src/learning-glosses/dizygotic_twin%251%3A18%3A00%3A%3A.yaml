simpleMeaning: One of a pair of children born together, who grew from two eggs joined with male cells.
scope: Also called a fraternal twin, this one is about a single child of the pair.
examples:
- Each dizygotic twin grew from its own egg.
- One dizygotic twin was born just before the other.
