simpleMeaning: An international labor union and radical workers’ movement founded in Chicago in 1905 to
  end capitalism. Its membership declined after World War I, but the union continued.
scope: IWW stands for Industrial Workers of the World.
examples:
- The IWW was set up in Chicago in 1905.
