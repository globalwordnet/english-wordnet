simpleMeaning: A wedding to someone from a different tribe or group, which custom or the law insists on.
scope: This one is also called intermarriage.
examples:
- In their village, exogamy is the rule, and a partner must come from another clan.
- They married outside their own tribe, following the rule of exogamy.
