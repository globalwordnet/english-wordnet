simpleMeaning: You look at a thing with care and figure out its kind, its goodness, its power, its size,
  and how much it matters.
scope: Also called value, measure, assess, evaluate, and appraise, this is a careful judgment of a thing,
  not a careless look at it.
examples:
- I will have the family jewels valuated by a professional.
- They valuated all the factors before taking the risk.
