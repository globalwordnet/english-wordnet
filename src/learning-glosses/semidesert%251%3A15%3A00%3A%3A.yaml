simpleMeaning: A dry region resembling a desert, usually lying between a desert and the wetter land around
  it.
scope: It names a dry stretch that is almost like the land it borders, but is not that land itself.
examples:
- Grass grows thinly across the semidesert.
- The road crossed the semidesert.
