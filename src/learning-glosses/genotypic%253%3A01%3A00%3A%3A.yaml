simpleMeaning: To do with, or forming part of, the makeup a living thing gets from its parents.
scope: This sense is also called genotypical.
examples:
- The genotypic pattern of the mice matched what their parents had passed down.
- Two plants can look alike but have a different genotypic makeup.
