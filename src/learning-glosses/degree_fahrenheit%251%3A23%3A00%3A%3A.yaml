simpleMeaning: A unit on the Fahrenheit temperature scale. At standard atmospheric pressure, water freezes
  at 32°F and boils at 212°F.
scope: A unit of temperature on the Fahrenheit scale, not the centigrade scale.
examples:
- Water boils at two hundred and twelve degrees Fahrenheit.
- It was seventy degrees Fahrenheit in the room.
