simpleMeaning: One of a group of minerals known as feldspars that form rocks, with crystals whose three
  sides differ in length and meet at angles that are not square.
scope: Also called oligoclase. It is a mineral, not a rock.
examples:
- The geologist found plagioclase in the rock sample.
- The rock held grains of plagioclase that shone in the light.
