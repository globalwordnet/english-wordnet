simpleMeaning: Any of a series of rock-forming feldspar minerals whose crystals have three unequal axes
  meeting at angles other than right angles.
scope: Also called oligoclase. It is a mineral, not a rock.
examples:
- The geologist found plagioclase in the rock sample.
- The rock held grains of plagioclase that shone in the light.
