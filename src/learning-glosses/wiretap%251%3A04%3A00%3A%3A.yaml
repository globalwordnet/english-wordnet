synsetId: 00655643-n
simpleMeaning: The act of listening in on a line that carries calls or sends messages by code, in order
  to learn what is said.
scope: Also called tap. It is an act, not a device.
examples:
- The police got a court order to wiretap the suspect's phone.
- Reporters feared someone might wiretap their office line.
