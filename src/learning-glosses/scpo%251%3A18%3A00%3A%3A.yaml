simpleMeaning: A senior chief petty officer in the Navy or Coast Guard, a noncommissioned officer comparable
  in rank to an Army master sergeant.
scope: A high-ranking officer below the commissioned ranks, also called senior chief petty officer, not
  a commissioned officer and not a junior sailor.
examples:
- The SCPO addressed the new sailors.
- She was promoted to SCPO last year.
