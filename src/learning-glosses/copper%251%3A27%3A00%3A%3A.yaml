simpleMeaning: A reddish-brown, corrosion-resistant metal, easily drawn into wire or hammered flat and
  weakly repelled by magnets. Found in minerals and large natural masses, it conducts electricity and
  heat.
scope: This is a soft red-brown metal that carries heat and power, also called Cu and atomic number 29,
  not a police officer and not a coin.
examples:
- Copper wires carry power.
- The pot is made of copper.
