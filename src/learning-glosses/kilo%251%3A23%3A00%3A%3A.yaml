simpleMeaning: A kilogram, equal to 1,000 grams. It is the basic unit of mass in the international system
  of units.
scope: A thousand grams, the main unit for weighing things, not a pound and not a litre.
examples:
- A kilo is about 2.2 pounds.
- The bag of flour weighs two kilos.
