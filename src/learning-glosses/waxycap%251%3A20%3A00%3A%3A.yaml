simpleMeaning: The gills look more or less soft and greasy, and this is a fungus of one group, called
  Hygrophoraceae.
scope: This fungus belongs to the family Hygrophoraceae, and it is not one whose gills look fully soft
  and greasy.
examples:
- They found a waxycap under the trees, with soft-looking gills beneath its cap.
- The waxycap in the field had gills that looked greasy in the light.
