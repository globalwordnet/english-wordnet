simpleMeaning: Having a tuft or other prominent growth on the head, usually for display. Often combined
  with another word in animal names, as in red-crested.
scope: A bird or animal with a tuft on its head; not a knight's helmet with a plume.
examples:
- The crested oriole sang from the branch.
- We saw a crested duck on the pond.
