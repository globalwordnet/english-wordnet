simpleMeaning: Marking the time when 50 years have passed since something began.
scope: Also called semicentennial, this word belongs to the 50th year, not to the anniversary as a thing
  in itself.
examples:
- The town planned semicentenary events to mark 50 years since its start.
- They planned semicentenary events for the school's 50th year.
