simpleMeaning: A sturgeon of the Black and Caspian seas, valued for its eggs, which provide caviar, and
  its swim bladder, which yields isinglass.
scope: 'Also called a hausen: a fish of the Black and Caspian seas, valued for the eggs and the jelly-like
  stuff taken from it.'
examples:
- Beluga caviar is among the most costly foods in the world.
- Fishermen once caught beluga in the Caspian Sea for its eggs.
