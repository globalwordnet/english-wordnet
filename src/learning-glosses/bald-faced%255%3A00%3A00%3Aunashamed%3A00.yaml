senseId: bald-faced%5:00:00:unashamed:00
synsetId: 00156411-s
simpleMeaning: Said of someone or something that shows no shame and holds nothing back, whatever polite
  custom or decency may say.
scope: Also called insolent, brazen, audacious, brassy, barefaced, bodacious, or brazen-faced, this one
  names a way of behaving.
examples:
- The bald-faced lies in the report shocked everyone in the room.
- The reporter's bald-faced claim that the money was never taken left the committee speechless.
