simpleMeaning: Paying what is owed a little at a time, in parts or by moving money from one place to another.
scope: Also called amortization, this one settles what is owed, while the other sense of this word is
  about a thing losing value over years.
examples:
- The amortisation of the loan took ten years of monthly payments.
- They spread the amortisation over five years to keep each payment small.
