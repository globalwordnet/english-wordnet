simpleMeaning: A condition in which the blood is more acidic than normal because its concentration of
  hydrogen ions is too high.
scope: It is a blood disorder in which too many hydrogen ions make the pH fall below 7, not a high acidity
  spread through the body's tissues as well.
examples:
- Acidemia left his blood pH below 7.
- The test showed acidemia after the hydrogen ions built up in his blood.
