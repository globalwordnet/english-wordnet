simpleMeaning: A genetically determined feature directly involved in reproduction, such as the genitals
  or internal reproductive organs.
scope: Also called primary sex character and primary sexual characteristic; the body parts tied to making
  babies, set from birth.
examples:
- The nurse explained primary sex characteristic as the parts set from birth.
- Primary sex characteristic is about the body parts that make babies possible.
