simpleMeaning: A young mind with no mark yet from what it has lived through, as John Locke saw it.
scope: It names a young mind, not an older mind shaped by life.
examples:
- At birth, the mind is a tabula rasa.
- Locke saw the child's mind as a tabula rasa.
