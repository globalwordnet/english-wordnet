senseId: 'coriolis_force%1:19:00::'
synsetId: 11460219-n
simpleMeaning: An apparent force due to Earth's rotation acting on objects moving in a rotating frame.
  Including it and centrifugal force alongside real forces lets Newton's second law apply there.
scope: A push that comes from the turning of the earth, acting on moving things; not a real push like
  gravity and not a push from wind.
examples:
- The Coriolis force bends the path of winds.
- Artillerymen must allow for the Coriolis force.
