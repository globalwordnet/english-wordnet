simpleMeaning: Iron mixed with carbon that keeps its hardness even when it glows red, used to make tools
  that cut metal.
scope: This word is also called high-speed steel.
examples:
- The smith chose hot-work steel because it stays hard when it glows red.
- The workshop buys hot-work steel for its cutting tools.
