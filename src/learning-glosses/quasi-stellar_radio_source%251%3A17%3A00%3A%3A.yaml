simpleMeaning: A bright, star-like galactic nucleus that emits radiation, sometimes including radio waves.
  Many show large redshifts, with their light shifted toward longer wavelengths.
scope: 'Also called a quasar: a thing like a star, not a real star and not a radio set.'
examples:
- Astronomers found a quasi-stellar radio source far away in the sky.
- The quasi-stellar radio source gave out strong waves.
