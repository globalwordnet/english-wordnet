simpleMeaning: A medicine you can get only with a written order from a doctor or dentist, given to a pharmacist.
scope: This one is also called prescription, and prescription drug and prescription medicine are other
  names for it.
examples:
- The drug needs a doctor's note before the pharmacist can hand it over.
- This drug is only sold when a doctor or dentist has written for it.
