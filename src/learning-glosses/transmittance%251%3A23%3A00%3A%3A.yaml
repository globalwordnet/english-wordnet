synsetId: 13610206-n
simpleMeaning: This number tells how much of the rays hitting a thing come out the other side.
scope: This sense is also called transmission, and it is a measure of what passes through a thing, not
  of what is stopped by it.
examples:
- The transmittance of the glass was high, so most of the light came through.
- They measured the transmittance of the film to see how much light it let through.
