simpleMeaning: One of the parts of a leaf that is usually split into smaller parts along a central stem,
  like a feather.
scope: Also called pinnule. It is a part of a leaf, not the outer part of an ear.
examples:
- Each pinna of the leaf was split into smaller parts.
- The botanist pointed to a pinna on the leaf.
