simpleMeaning: A dye with two nitrogen-containing rings joined by a link containing –CH=. These dyes are
  used in photography to make film sensitive to light.
scope: A dye used as a sensitizer in photography, with a -CH= link joining two nitrogen rings.
examples:
- Cyanine dyes make film quick to light.
- The cyanine dye links two rings.
