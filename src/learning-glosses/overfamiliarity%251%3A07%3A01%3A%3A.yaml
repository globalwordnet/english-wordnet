senseId: 'overfamiliarity%1:07:01::'
synsetId: 92419382-n
simpleMeaning: The state of being so common, or so often repeated, that people stop noticing it or grow
  annoyed by it.
scope: It is a state.
examples:
- A nearly perfect cast more than compensates for the overfamiliarity of the umpteenth coming-of-age drama
  to roll out of Indiewood.
- After hearing the same song on the radio every day, they grew tired of its overfamiliarity.
