simpleMeaning: A rein made to hold a horse's head where the rider wants it.
scope: Also called a checkrein, this one is about a strap.
examples:
- The bearing rein kept the horse's head high as it stepped into the ring.
- They fitted a bearing rein before the ride so the horse would hold its head up.
