simpleMeaning: Long-lasting inflammation of the airways that produces excess mucus, causes a persistent
  cough, and obstructs airflow.
scope: This long-lasting illness of the chest air tubes blocks the air, keeps the cough going, and makes
  too much thick stuff.
examples:
- His chronic bronchitis kept him coughing and coughing.
- Her chronic bronchitis made every breath an effort.
