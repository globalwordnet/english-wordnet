senseId: 'arbitrage%1:04:00::'
synsetId: 01095889-n
simpleMeaning: An investment strategy that limits exposure to price changes while seeking small price
  differences, buying an asset on one market and selling it simultaneously for more on another.
scope: The investment practice of buying and selling the same asset across markets to profit from a price
  difference.
examples:
- Their arbitrage paid off at noon.
- The arbitrage was done in a day.
