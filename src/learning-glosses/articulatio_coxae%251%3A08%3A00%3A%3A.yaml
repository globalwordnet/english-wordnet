simpleMeaning: A ball-and-socket joint where the round head of the thigh bone turns inside a hollow in
  the pelvis.
scope: Also called hip, coxa, and hip joint, this one joins the leg to the body, not the arm to the body.
examples:
- The articulatio coxae lets the leg swing in every direction.
- Pain in the articulatio coxae made walking hard.
