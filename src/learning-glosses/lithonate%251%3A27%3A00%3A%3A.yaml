simpleMeaning: A brand of lithium carbonate (Li₂CO₃), a white powder also used in glass and ceramics.
  Sold as Lithonate, Lithane or Eskalith, it treats mania and certain forms of depression.
scope: A white powder used as a drug for low and high moods; also called lithium carbonate, Eskalith,
  and Lithane.
examples:
- Lithonate is taken each morning with food.
- Lithonate helped lift the long low mood.
