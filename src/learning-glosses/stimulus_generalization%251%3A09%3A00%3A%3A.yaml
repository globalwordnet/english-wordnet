senseId: 'stimulus_generalization%1:09:00::'
synsetId: 05764411-n
simpleMeaning: In psychology, a learned response spreading from the thing that first brought it out to
  a like thing.
scope: It is also called a generalization, a generalisation, or a stimulus generalisation.
examples:
- The dog showed stimulus generalization when a new bell made it bark just like the old one.
- The child showed stimulus generalization, fearing a new loud sound as much as the first one.
