senseId: 'unguiculate%3:00:00::'
synsetId: 02499423-a
simpleMeaning: Said of a living thing, or a part of one, that has claws or nails, or looks as if it does.
scope: Also called unguiculated. It is said of a thing, not the name of a mammal.
examples:
- The unguiculate animals climbed the rocks with their claws.
- An unguiculate flower petal ends in a point like a claw.
