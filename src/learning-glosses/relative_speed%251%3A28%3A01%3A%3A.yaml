senseId: 'relative_speed%1:28:01::'
synsetId: 92443571-n
simpleMeaning: How fast one object moves relative to another, found from the magnitude of the difference
  between their velocities.
scope: Also called relative velocity, it is the pace of one thing judged from a second thing taken as
  standing still, unlike the pace it has on its own.
examples:
- The relative speed of the two trains told us how fast one gained on the other.
- We worked out the relative speed of the boat against the still shore.
