simpleMeaning: A living thing that moves by its own choice.
scope: Also called animal, creature, beast, brute, and fauna, this one stands apart from a plant, which
  stays rooted in one place and never moves itself.
examples:
- The child watched an animate being crawl slowly across the stone.
- A dog is an animate being, and it can choose where to go next.
