simpleMeaning: A drug that stimulates blood circulation and breathing. Larger doses were used to bring
  on convulsions in shock therapy. Metrazol is a brand name for it.
scope: 'Also called pentamethylenetetrazol: a drug that wakes up the heart and lungs, not a drug that
  puts a person to sleep.'
examples:
- Pentylenetetrazol was used to wake up the heart and lungs.
- The doctor knew pentylenetetrazol could bring on fits in big doses.
