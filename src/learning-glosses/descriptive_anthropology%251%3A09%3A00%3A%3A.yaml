simpleMeaning: The part of the study of peoples that gives careful, fact-based accounts of one people
  at a time.
scope: Ethnography is another name for this field of study.
examples:
- The student wrote a paper in descriptive anthropology about a fishing village.
- The class in descriptive anthropology looked at how one island people live.
