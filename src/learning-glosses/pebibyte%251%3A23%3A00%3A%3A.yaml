simpleMeaning: A unit of information that holds 2^50 groups of eight binary digits, or 1024 units, each
  of 2^40 groups of eight binary digits.
scope: Also called petabyte, PB, or PiB. It is a unit of information.
examples:
- They measured the drive in pebibytes.
- The drive held three pebibytes of data.
