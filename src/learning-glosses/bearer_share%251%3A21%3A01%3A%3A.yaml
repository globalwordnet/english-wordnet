senseId: 'bearer_share%1:21:01::'
synsetId: 92439656-n
simpleMeaning: A paper that shows part-ownership of a company, saying nothing about who owns it, so that
  whoever holds it is taken to own it.
scope: Also called a bearer stock, this one is about a paper.
examples:
- In some countries, bearer shares are banned, because of their potential for abuse.
- They bought a bearer share so that no one could tell from the paper that they owned it.
