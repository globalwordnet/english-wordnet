simpleMeaning: A North American herb that bears poisonous white berries.
scope: This North American herb is also called doll's eyes, a white bead, a white cohosh, and Actaea alba,
  and its pale fruit can poison, unlike the harmless fruit of other herbs.
examples:
- We found white baneberry growing by the path, its pale fruit bright against the leaves.
- Do not eat white baneberry; its berries can poison you.
