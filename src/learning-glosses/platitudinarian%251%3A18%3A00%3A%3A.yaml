senseId: 'platitudinarian%1:18:00::'
synsetId: 10459290-n
simpleMeaning: A dull person who uses platitudes far too often, remarks so often repeated that they say
  nothing new.
scope: It is a person, not the remarks themselves.
examples:
- Nobody wanted to sit next to the platitudinarian at dinner.
- The platitudinarian repeated the same old sayings all evening.
