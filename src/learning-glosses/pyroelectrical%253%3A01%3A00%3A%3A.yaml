simpleMeaning: Said of a thing that gives off a charge from its crystals when it warms up or cools down.
scope: Also called pyroelectric. It is an adjective.
examples:
- The pyroelectrical plates gave off a charge as they cooled.
- A pyroelectrical sensor works by the charge its crystals give off.
