simpleMeaning: An insect-eating frog with webbed feet, smooth moist skin and long hind legs that usually
  lives partly in water and partly on land.
scope: It is also called a true frog, and it is an insect-eating amphibian with webbed feet, smooth wet
  skin, and long back legs that most often lives half in water.
examples:
- The ranid jumped into the water on its long back legs.
- The ranid sat half in water, eating insects.
