simpleMeaning: The economic idea that people or firms seek income by changing rules or conditions in their
  favor instead of producing or trading goods and services.
scope: Also called rent-seeking. It is a theory.
examples:
- Rent seeking lets a firm seek wealth without making anything new.
- They found rent seeking wherever firms seek gain from rules rather than from work.
