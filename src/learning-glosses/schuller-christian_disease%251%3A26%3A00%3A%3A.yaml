simpleMeaning: An inflammatory disorder linked to altered cholesterol processing, mainly affecting young
  children, with hollow areas in the skull and excessive urination from diabetes insipidus.
scope: A swelling condition of young children, also called Hand-Schuller-Christian disease; not sugar
  diabetes and not other bone conditions of children.
examples:
- Schuller-Christian disease mostly affects young children.
- The doctor found gaps in the skull of a child with Schuller-Christian disease.
