simpleMeaning: A traditional apothecaries' weight equal to 12 troy ounces, or about 373.242 grams.
scope: Also called apothecaries' pound, this weight is used where medicines are made up, and it is not
  the one used for weighing ordinary goods.
examples:
- The old recipe gave the dose in troy pounds.
- The chemist weighed the powder in troy pounds.
