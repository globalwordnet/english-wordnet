simpleMeaning: Holding to your own ideas and wants with firm resolve, and never backing down.
scope: Also called stubbornness, obstinacy, pigheadedness, bullheadedness, and obstinance. It is a noun.
examples:
- Their self-will made them refuse every compromise.
- Self-will kept them arguing long after everyone else had agreed.
