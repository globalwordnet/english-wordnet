simpleMeaning: Any sedge in the genus Eriophorum, a bog plant with tufted flower spikes found in northern
  temperate regions.
scope: Also called cotton rush, this bog plant with thin leaves is one of many kinds of one group, growing
  in the cool north with soft white tufts.
examples:
- The cotton grass waved its white tufts over the bog.
- Cotton grass grows in the wet ground of the northern bogs.
