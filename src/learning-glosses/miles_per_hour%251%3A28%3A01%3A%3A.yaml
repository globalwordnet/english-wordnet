simpleMeaning: The ratio of the distance covered, counted in 1,760-yard lengths, to the time taken, counted
  in sixty-minute lengths.
scope: It is also called mph.
examples:
- The car was doing sixty miles per hour on the open road.
- At ten miles per hour, the trip took an hour.
