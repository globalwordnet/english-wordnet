senseId: 'sporogenous%3:01:00::'
synsetId: 02812464-a
simpleMeaning: Making tiny cells that can grow into new living things, with new living things coming forth
  through those cells.
scope: This word is used of a living thing or part that brings forth new living things by means of tiny
  cells that can grow into them.
examples:
- The growth was sporogenous, and tiny cells formed inside it.
- That part of the living thing is sporogenous, and new living things came from its tiny cells.
