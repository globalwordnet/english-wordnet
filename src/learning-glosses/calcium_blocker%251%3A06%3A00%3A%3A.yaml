simpleMeaning: A drug that blocks calcium flow involved in nerve signaling or muscle contraction, used
  for angina, irregular heartbeat, high blood pressure, or migraine.
scope: This sense is also called calcium-channel blocker.
examples:
- Calcium blocker treats high blood pressure.
- The doctor gave a calcium blocker for migraine.
