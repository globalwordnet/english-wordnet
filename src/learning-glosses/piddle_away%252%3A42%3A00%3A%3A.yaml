senseId: 'piddle_away%2:42:00::'
synsetId: 02713983-v
simpleMeaning: To spend time doing nothing useful, or to spend it in a wasteful way.
scope: Also called trifle, wanton, piddle, or wanton away. It is a way of passing time.
examples:
- They piddled away the whole morning and got nothing done.
- Do not piddle away your afternoon on small jobs that can wait.
