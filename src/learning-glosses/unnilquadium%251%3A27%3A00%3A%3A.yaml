senseId: 'unnilquadium%1:27:00::'
synsetId: 14677595-n
simpleMeaning: A former temporary name for rutherfordium, a radioactive element made artificially, with
  atomic number 104, higher than uranium's.
scope: An element made by people past uranium, also called atomic number 104, element 104, Rf, rutherfordium,
  and Unq; not a natural element and not the lighter elements.
examples:
- Unnilquadium was first made in a laboratory.
- Scientists made unnilquadium in the laboratory.
