simpleMeaning: The fact that a thing can be swapped because another thing can take its place.
scope: Also called replaceability and substitutability, this one is the quality itself, not the thing
  that has it.
examples:
- The commutability of the two parts made the repair easy.
- The commutability of the batteries meant either one worked in the torch.
