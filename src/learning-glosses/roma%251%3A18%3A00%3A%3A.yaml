simpleMeaning: A member of a people with roots in northern India and a shared Romani language heritage.
  Communities live worldwide, especially in Europe, North Africa, and North America.
scope: This sense refers to a member of the Romani people. Language use and livelihoods vary across communities.
examples:
- The Roma travel from town to town for seasonal work.
- Many Roma speak Romany at home.
