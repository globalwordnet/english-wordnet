simpleMeaning: These organs in the inner ear give the sense of balance and keep the body steady.
scope: This is also called the vestibular system, and it is not a single organ.
examples:
- The doctor said the vestibular apparatus was damaged, and that was why they felt dizzy.
- They tested the vestibular apparatus to find why the patient kept losing their balance.
