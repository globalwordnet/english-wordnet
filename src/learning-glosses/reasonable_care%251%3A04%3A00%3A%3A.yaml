senseId: 'reasonable_care%1:04:00::'
synsetId: 01134115-n
simpleMeaning: The caution a level-headed person would show in the same set of facts, the measure for
  telling whether a duty was met under the law.
scope: It is also called due care and ordinary care.
examples:
- The driver used reasonable care when the road was wet.
- The court found that the company had not used reasonable care.
