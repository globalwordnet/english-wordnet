simpleMeaning: A levy charged on what things are worth, taken in by the last seller.
scope: Also called value-added tax, VAT or GST, this one is about a charge on things.
examples:
- The shop added the goods and service tax to the bill at the till.
- The new rate of the goods and service tax took effect in January.
