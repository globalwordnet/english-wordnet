simpleMeaning: To cut a place into separate areas, above all areas drawn on the land by where they are.
scope: Sectionalise is another name for this word, used when a place is cut into separate areas, above
  all areas drawn on the land by where they are.
examples:
- The new plan will sectionalize the country.
- The plan sectionalized the country by region.
