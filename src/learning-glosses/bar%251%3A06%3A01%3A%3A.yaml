simpleMeaning: The Browning Automatic Rifle, a portable, gas-operated .30-caliber automatic rifle fed
  from a magazine. US troops used it in both world wars and the Korean War.
scope: A rifle, also called a Browning automatic rifle; not a rod of metal, and not a place that sells
  drinks.
examples:
- The BAR was used in World War I.
- He carried a BAR.
