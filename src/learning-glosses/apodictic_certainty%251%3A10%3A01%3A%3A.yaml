simpleMeaning: A claim that is true in every case, or that no sound line of thought can deny.
scope: This one is also called apodictic proposition.
examples:
- The apodictic certainty of the proof left no room for doubt.
- They took the apodictic certainty as settled, since no sound thinking could deny it.
