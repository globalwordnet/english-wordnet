simpleMeaning: A life-threatening syndrome associated with bacterial meningitis, involving sudden fever,
  discolored skin, tiny bleeding spots, bleeding into the adrenal glands, and circulatory collapse.
scope: A condition tied to a germ infection of the brain cover, not meningitis alone and not other fevers
  with a rash; it brings sudden fever, spots, and heart failure.
examples:
- Waterhouse-Friderichsen syndrome struck fast, with high fever and spots.
- Doctors feared Waterhouse-Friderichsen syndrome when the rash spread.
