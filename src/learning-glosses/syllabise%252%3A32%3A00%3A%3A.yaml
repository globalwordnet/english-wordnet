synsetId: 00982020-v
simpleMeaning: Each small sound part of a word comes out clear and apart when a speaker says the words.
scope: This names how a speaker sounds out words, also called syllabize, not the act of cutting words
  up into their sound parts.
examples:
- The poet would syllabise the verses when reading them aloud.
- The teacher asked the class to syllabise the words one by one.
