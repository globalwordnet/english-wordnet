simpleMeaning: Transfer RNA, found in at least twenty varieties, each carrying a specific amino acid to
  a ribosome for addition to a protein according to messenger RNA instructions.
scope: 'Also called acceptor RNA, transfer RNA and tRNA: cell molecules that carry amino acids to growing
  protein chains, not the messenger molecules that carry the orders.'
examples:
- Soluble RNA carries amino acids to the protein chain.
- Each kind of soluble RNA carries one amino acid.
