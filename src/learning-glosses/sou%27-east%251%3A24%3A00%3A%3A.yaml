simpleMeaning: Southeast, the compass direction halfway between south and east, 135 degrees clockwise
  from north.
scope: Also called southeast, southeastward, and SE. It is a point.
examples:
- The wind came from the sou'-east all day.
- They sailed sou'-east toward the islands.
