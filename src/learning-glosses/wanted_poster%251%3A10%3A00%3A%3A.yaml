simpleMeaning: This poster tells the public that a body that keeps the law wants to ask a person questions
  or take them in.
scope: This is also called a wanted notice, and it is not a note that stays out of sight.
examples:
- They saw the wanted poster at the bus stop and read the name of the person the police wanted to arrest.
- The wanted poster in the shop window named a person the police wanted to question.
