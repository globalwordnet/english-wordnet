simpleMeaning: A synthetic compound derived from triazine and widely used to kill weeds in agriculture.
scope: This is a man-made weed-killer used widely on farms, not a weed-killer that occurs in nature.
examples:
- Atrazine is thought to cause cancer and is banned in some European countries.
- The farmer sprayed atrazine on the field to kill the weeds.
