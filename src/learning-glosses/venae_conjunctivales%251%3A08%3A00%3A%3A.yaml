simpleMeaning: Blood vessels that carry blood away from the conjunctiva, the membrane that covers the
  white of the eye.
scope: Also called conjunctival veins. They are blood vessels, not arteries.
examples:
- The eye doctor looked at the venae conjunctivales during the check of the eye.
- The venae conjunctivales were easy to see on the white of the eye.
