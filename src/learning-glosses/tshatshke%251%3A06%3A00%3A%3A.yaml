synsetId: 03002303-n
simpleMeaning: A cheap showy ornament, called by this Yiddish name.
scope: Also called tchotchke, chachka, and tsatske, this Yiddish name is for a trinket, not an attractive
  unconventional woman.
examples:
- They set a bright tshatshke on the shelf, though it had cost very little.
- A bright tshatshke stood on the table, cheap and made for show.
