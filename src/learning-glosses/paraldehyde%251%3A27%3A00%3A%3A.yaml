simpleMeaning: A colorless liquid whose molecules contain three acetaldehyde units joined in a ring. It
  is used as a sedative and to dissolve other substances.
scope: Also called ethanal trimer, this is one of the clear liquids, the one made of three acetaldehyde
  parts joined in a ring.
examples:
- They took paraldehyde to calm down.
- They used paraldehyde to dissolve other things.
