simpleMeaning: Small, shrubby, deciduous south-central US yellowwood with spines, glossy dark-green leaves
  and inedible orange-like fruit. Native Americans used its hard orange wood for bows. Often planted as
  a boundary hedge.
scope: 'Also called bow wood, mock orange and osage orange: a shrubby tree of the south central United
  States with an inedible orange-like fruit, not a citrus tree and not a small garden shrub.'
examples:
- Maclura pomifera bears an inedible fruit.
- The wood of Maclura pomifera was used for bows.
