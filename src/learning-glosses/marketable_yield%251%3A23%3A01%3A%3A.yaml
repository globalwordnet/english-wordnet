senseId: 'marketable_yield%1:23:01::'
synsetId: 92414972-n
simpleMeaning: The amount of a crop of a particular variety fit for sale, often measured in kilograms
  per hectare.
scope: Growers measure the portion of the harvest that meets the market’s quality and size requirements.
examples:
- The marketable yield of peppers has increased by 5% this year.
- Farmers count the marketable yield in kilograms per hectare.
