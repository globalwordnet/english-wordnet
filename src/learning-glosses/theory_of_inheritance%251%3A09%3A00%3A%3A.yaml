simpleMeaning: In biology, ideas about how traits pass from one generation to those that come after it.
scope: In biology, this looks back to earlier generations, not to traits that appear from nowhere.
examples:
- They turned to the theory of inheritance when the new calf looked just like its mother.
- The theory of inheritance helped them see why the tall plants had tall young.
