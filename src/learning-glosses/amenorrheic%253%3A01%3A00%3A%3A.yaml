senseId: 'amenorrheic%3:01:00::'
synsetId: 02627044-a
simpleMeaning: Said of the usual monthly flow of blood when it has stopped for any reason other than pregnancy.
scope: Also called amenorrheal, amenorrhoeal, or amenorrhoeic, this one does not name the stopping, only
  something to do with it.
examples:
- The clinic recorded the amenorrheic state in the notes.
- They wanted to know if the amenorrheic change had any cause besides pregnancy.
