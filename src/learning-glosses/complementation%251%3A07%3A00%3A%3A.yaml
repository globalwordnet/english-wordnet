simpleMeaning: In linguistics, a pattern in which related speech sounds or forms occur only in different
  contexts.
scope: Complementary distribution is another name for this thing, not the word's grammar sense.
examples:
- The complementation of these two sounds means they never occur in the same place.
- Linguists use complementation to describe how related forms divide up the places they can appear.
