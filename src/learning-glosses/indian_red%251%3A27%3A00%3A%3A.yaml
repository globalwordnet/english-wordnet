simpleMeaning: Red soil containing iron(III) oxide, often used to provide color in paints and other materials.
scope: A soil of that colour holding ferric oxide, often used as a colouring matter; not the colour itself,
  and not the pigment.
examples:
- The painter ground Indian red into a fine powder.
- Indian red is a soil rich in ferric oxide.
