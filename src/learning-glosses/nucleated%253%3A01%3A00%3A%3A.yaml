simpleMeaning: Said of a cell in which the stuff that runs the cell sits in a part at its centre, or of
  a thing found inside that part.
scope: Also called nucleate. It is an adjective.
examples:
- Most of the cells in the sample were nucleated, and each one had a middle part you could see.
- They counted the nucleated cells one by one and wrote the number in a book.
