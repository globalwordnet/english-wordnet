simpleMeaning: Tularemia, an infectious disease of rabbits, squirrels, and other animals that people can
  catch from tick or fly bites or through contact with infected animals.
scope: This sense is also called rabbit fever, tularaemia, tularemia, and yatobyo, a fast-spreading ill
  of gnawers, especially rabbits and squirrels, at times passed to folk by ticks or flies or by touching
  sick beasts.
examples:
- Deer fly fevers spread fast in rabbits.
- The deer fly fever passes by ticks.
