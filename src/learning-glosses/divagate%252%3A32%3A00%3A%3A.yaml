schema: oewn-learning-gloss-v2
senseId: 'divagate%2:32:00::'
synsetId: 00782620-v
simpleMeaning: To stop being clear, or to go off in another direction, above all from the main point,
  when writing, thinking, or speaking.
scope: This one is also called wander, stray, or digress.
examples:
- The writer began to divagate and never came back to the main point.
- Do not divagate when you give a talk; keep to the point.
