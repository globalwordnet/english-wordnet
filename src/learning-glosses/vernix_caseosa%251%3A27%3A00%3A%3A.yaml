simpleMeaning: Before birth, a baby's skin is covered by a white, soft, creamy layer that shields it.
scope: Also called vernix, this is the protective material on a fetus's skin, not a layer that forms after
  birth.
examples:
- The doctor noted the vernix caseosa still on the baby's shoulders after delivery.
- They gently washed the vernix caseosa off the newborn's skin.
