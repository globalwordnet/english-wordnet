simpleMeaning: Relating to the view that a concept in the mind links a general term to the different things
  it describes.
scope: This one is about a view of what ideas are.
examples:
- The conceptualistic claim that numbers live only in the mind puzzled the class.
- The conceptualistic answer treated the word 'justice' as a thought, not a thing in the world.
