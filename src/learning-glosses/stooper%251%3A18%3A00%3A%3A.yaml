simpleMeaning: This person holds the body with head and shoulders bent forward most of the time.
scope: This sense names a person who holds the body bent forward, not the person at a racetrack who looks
  for winning tickets thrown away by others.
examples:
- The stooper walked with head and shoulders bent forward.
- Even standing still, the stooper kept head and shoulders bent forward.
