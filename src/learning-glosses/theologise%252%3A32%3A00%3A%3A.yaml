senseId: 'theologise%2:32:00::'
synsetId: 01035990-v
simpleMeaning: By what faith in God teaches, a subject is treated, or it is made a matter of faith in
  God.
scope: This is also called theologize, and it puts faith in God into a subject, not just talk about points
  of belief.
examples:
- They theologised the history of the town.
- They theologised their questions about suffering.
