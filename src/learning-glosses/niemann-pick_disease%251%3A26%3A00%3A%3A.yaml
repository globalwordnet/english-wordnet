simpleMeaning: An inherited disorder affecting how the body handles fats. It develops when someone inherits
  an altered copy of the relevant gene from each parent.
scope: A sickness of the way the body handles fats; its near kin are the other sicknesses of the way the
  body handles fats passed down in families.
examples:
- Niemann-Pick disease is inherited.
- Niemann-Pick disease affects lipid metabolism.
