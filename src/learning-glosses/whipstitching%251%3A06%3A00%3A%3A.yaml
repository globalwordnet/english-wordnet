simpleMeaning: Thread wound over the edge of cloth in slanting loops, used in sewing.
scope: Also called whipping or whipstitch, this thread runs over an edge in slanting loops, not straight
  along it.
examples:
- Along the hem, the whipstitching held the lining in place.
- They could see the whipstitching on the edge of the cloth, each loop slanting the same way.
