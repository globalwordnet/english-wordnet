senseId: 'artificial_joint%1:06:00::'
synsetId: 02748821-n
simpleMeaning: A metal or plastic part surgically implanted to replace a joint, usually a hip or knee
  and sometimes an elbow or wrist.
scope: A man-made part that takes the place of a bending body part, not the body part itself.
examples:
- Her artificial joint let her walk without pain.
- The artificial joint in his knee was made of metal.
