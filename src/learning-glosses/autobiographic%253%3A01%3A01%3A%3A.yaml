schema: oewn-learning-gloss-v2
senseId: 'autobiographic%3:01:01::'
synsetId: 02662173-a
simpleMeaning: Describing something that belongs to a person who writes the story of their own life, or
  that is typical of such a person.
scope: Also called autobiographical, this one is about the writer of the story, not about the style of
  the story, which is the other sense of this word.
examples:
- The autobiographic book told the story of the writer's own childhood.
- Readers liked the autobiographic parts best, where the writer spoke about their own life.
