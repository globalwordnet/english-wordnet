senseId: 'anamorphism%1:22:01::'
synsetId: 13452394-n
simpleMeaning: The slow change of one kind of living thing into a different kind over a very long time,
  through many small steps.
scope: Also called anamorphosis, this is not the other sense of this word about minerals changing deep
  under the earth, and not the other sense of this word about a picture that looks right only when seen
  in a special way.
examples:
- The museum display showed anamorphism in the slow shift from one kind of shellfish to another.
- The book follows anamorphism as one kind of bird slowly gives way to a new kind over a very long time.
