simpleMeaning: Said of something that has to do with, or shows, too little carbon dioxide in the blood.
scope: This one is also called acapnial and acapnotic.
examples:
- The blood test showed acapnic signs after the long breathing exercise.
- They watched the acapnic readings change over the next hour.
