simpleMeaning: A measurement unit in the international metric system. Its seven base units are the metre,
  kilogram, second, ampere, kelvin, mole, and candela.
scope: Not the older metric measures or a national set of measures; also called SI, the International
  System, the International System of Units, the SI system, Systeme International, and Systeme International
  d'Unites.
examples:
- The SI unit of length is the meter.
- Use the SI unit, not the old one, in your answer.
