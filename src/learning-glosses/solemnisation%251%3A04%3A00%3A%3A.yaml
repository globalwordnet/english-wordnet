simpleMeaning: Before people, a holy church act or other grave rite is done with every set act and word
  in its right place.
scope: Celebration and solemnization are other names for this public rite.
examples:
- The solemnisation of the marriage took place in front of a crowd.
- The solemnisation of the sacrament was carried out in public.
