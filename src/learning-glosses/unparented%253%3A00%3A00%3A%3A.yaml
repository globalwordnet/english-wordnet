senseId: 'unparented%3:00:00::'
synsetId: 01738231-a
simpleMeaning: Having no parent, or lacking care from someone who takes a parent's place.
scope: This is also called parentless, and it is used of a young person left without a mother or father.
examples:
- The unparented child grew up in a home run by the town.
- After the war, many unparented children were taken in by neighbours.
