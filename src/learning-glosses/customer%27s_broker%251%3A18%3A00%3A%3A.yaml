simpleMeaning: A person who looks after a client's account at an advertising firm, a firm that buys and
  sells for clients, or any other business that sells a service.
scope: This person is also called an account executive, an account representative, or a registered representative.
examples:
- The customer's broker called to go over the new advertising plan.
- Our customer's broker handles all the firm's advertising accounts.
