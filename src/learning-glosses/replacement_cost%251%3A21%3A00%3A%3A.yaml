simpleMeaning: The cost today of replacing a long-term business asset with a new one that works equally
  well.
scope: It is about a sum of money, counted now.
examples:
- They asked for the replacement cost of the old press before they bought a new one.
- The insurer asked for the replacement cost of the damaged press.
