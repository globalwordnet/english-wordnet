simpleMeaning: A poisonous, oily liquid that dissolves only slightly in water, used as a solvent and in
  making the chemical aniline.
scope: Its limited solubility in water is compatible with its industrial use as a solvent.
examples:
- The label identified the oily liquid as nitrobenzene.
- The reference book lists nitrobenzene as only slightly soluble in water.
