simpleMeaning: The flowering part of a plant, or the way its flowers are arranged on a stalk.
scope: The flowers of a plant on one stalk; not a single flower and not the leaves of the plant.
examples:
- The inflorescence of the wheat plant holds many small flowers.
- Gardeners cut back the inflorescence after the flowers fade.
