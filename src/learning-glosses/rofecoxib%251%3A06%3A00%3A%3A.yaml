simpleMeaning: A pain and inflammation medicine sold as Vioxx that blocks COX-2 and reduces certain digestive
  side effects. Its manufacturer voluntarily withdrew it in 2004.
scope: A pain drug sold as Vioxx, not aspirin and not a drug still on sale.
examples:
- The doctor once gave rofecoxib for her sore knee.
- Rofecoxib was taken off the market in 2004.
