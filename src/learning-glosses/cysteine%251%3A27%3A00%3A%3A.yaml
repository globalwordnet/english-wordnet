simpleMeaning: A sulfur-containing amino acid found in most proteins. In air, two cysteine molecules can
  join to form cystine.
scope: This is one of the protein building blocks, not the twin form cystine it turns into in air.
examples:
- Most proteins hold cysteine, an amino acid with sulfur.
- When cysteine is left in air, it turns into cystine.
