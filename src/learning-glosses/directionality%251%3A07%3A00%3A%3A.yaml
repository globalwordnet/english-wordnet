senseId: 'directionality%1:07:00::'
synsetId: 05073795-n
simpleMeaning: The way a microphone or antenna takes in sound or radio waves best from one side, and less
  well from other sides.
scope: This one is also called directivity, and is about a microphone or antenna, not about keeping to
  one direction in general.
examples:
- The directionality of the new microphone lets it pick up a voice from across the room.
- The antenna's directionality meant it picked up the signal best when it faced the tower.
