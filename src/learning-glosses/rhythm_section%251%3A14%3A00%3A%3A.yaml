simpleMeaning: One part of a band or orchestra, made up of the players whose instruments are hit, shaken,
  or scraped.
scope: Also called percussion and percussion section. It is a group.
examples:
- The rhythm section kept the beat steady all night.
- The rhythm section played behind the singer all evening.
