simpleMeaning: Oxygen, a two-bond nonmetal usually forming a colorless, odorless, tasteless, nonflammable
  gas of two-atom molecules. It makes up 21% of air by volume and is Earth's most abundant crustal element.
scope: A gas that makes up much of the air, not nitrogen and not a gas that burns; also called oxygen
  and atomic number 8.
examples:
- O makes up about a fifth of the air we breathe.
- O is the most common element in the earth's crust.
