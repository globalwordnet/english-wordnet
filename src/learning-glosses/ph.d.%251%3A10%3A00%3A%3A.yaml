simpleMeaning: A research doctorate usually earned through at least three years of graduate study and
  a written thesis presenting original research. It is the highest level of graduate degree.
scope: 'Also called PhD: the highest degree for study after a first degree, not a first degree and not
  a short course of study.'
examples:
- She finished her Ph.D. last year.
- He is working toward a Ph.D. in history.
