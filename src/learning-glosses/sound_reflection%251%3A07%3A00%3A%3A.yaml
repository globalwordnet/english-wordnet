simpleMeaning: A noise heard a second time, when its waves bounce back off something they hit.
scope: Echo, reverberation, and replication are other names for a noise heard again after its waves bounce
  back.
examples:
- She could hear a sound reflection of her own footsteps.
- They heard a sound reflection of their own steps.
