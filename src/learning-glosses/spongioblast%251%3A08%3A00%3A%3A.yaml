simpleMeaning: In the brain and spinal cord, tall, narrow lining cells that grow into the cells that hold
  nerve cells in place.
scope: These are tall, narrow lining cells in the brain and spinal cord that grow into the cells that
  hold nerve cells in place, not the nerve cells themselves.
examples:
- The spongioblast stood out from the nerve cells around it.
- In the brain and spinal cord, spongioblasts are found.
