synsetId: 00860463-v
simpleMeaning: Above all, loud cheers and shouts from a crowd push someone to keep going.
scope: This is also called cheer, urge, inspire, barrack, exhort, pep up, and root on.
examples:
- The crowd cheered the demonstrating strikers and urged them on until they reached the square.
- Fans at the match urged their team on with songs and shouts from the stands.
