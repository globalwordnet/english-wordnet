simpleMeaning: Living by hunting other animals for food, above all by catching them alive.
scope: It is also called predatory, ravening, rapacious, vulturous, or vulturine, and it is not about
  birds of prey as a kind.
examples:
- A raptorial bird circled above the field, watching for mice.
- The raptorial owl swept down on a mouse in the dark.
