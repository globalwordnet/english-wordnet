simpleMeaning: The electronic transmission of digitally encoded information, such as data sent between
  computers for storage or processing.
scope: Digital communication is another name for facts sent by machine in number form, so machines can
  keep them and work on them.
examples:
- Data communication lets one machine send its files to another.
- The office uses data communication to share files between computers.
