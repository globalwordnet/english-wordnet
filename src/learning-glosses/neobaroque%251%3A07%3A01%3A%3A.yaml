simpleMeaning: Building and art that takes its lead from study of the grand, ornate style of the 1600s.
scope: Also called neo-baroque. It is a style of art and building.
examples:
- The neobaroque hall copies the curves and gold leaf of 17th-century churches.
- Visitors admired the neobaroque front of the theatre.
