simpleMeaning: Zidovudine, sold as Retrovir, is an antiviral drug used to treat HIV, including in people
  with AIDS. It can damage the liver and reduce blood cell production in bone marrow.
scope: A drug that fights viruses and is used to treat AIDS, also called zidovudine, AZT, and Retrovir.
examples:
- ZDV is used to treat AIDS.
- The doctor gave her ZDV for AIDS.
