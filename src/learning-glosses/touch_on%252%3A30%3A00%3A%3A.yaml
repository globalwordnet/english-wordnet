simpleMeaning: To fix something damaged by putting in a fresh piece where the old one was, or by fastening
  the torn or broken parts together again.
scope: Doctor, fix, repair, restore, mend, bushel, and furbish up are other names for it.
examples:
- The tailor touched on the old coat, replacing its torn lining.
- The cobbler touched on my shoes, putting in new soles where the old ones had split.
