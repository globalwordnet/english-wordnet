simpleMeaning: A bird from North America, black and white, that strikes trees with its beak, with the
  part above its neck and its neck the colour of blood.
scope: Also called redhead and Melanerpes erythrocephalus. It is a bird.
examples:
- A redheaded woodpecker struck at the trunk of the old oak.
- We saw a redheaded woodpecker in the trees near the lake.
