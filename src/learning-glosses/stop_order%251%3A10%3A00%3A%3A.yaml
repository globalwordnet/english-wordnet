senseId: 'stop_order%1:10:00::'
synsetId: 06542403-n
simpleMeaning: Tell a broker to sell a paper of value once its price drops to a set level, or to buy one
  once its price climbs to that level.
scope: This sense is also called stop-loss order.
examples:
- The stop order went through when the price fell to the set level.
- They left a stop order with the broker to buy if the price rose.
