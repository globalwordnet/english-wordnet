simpleMeaning: The natural process by which organisms well suited to their surroundings tend to leave
  more offspring, making their inherited traits more common over generations.
scope: This is a process in nature, where creatures best matched to surroundings stay alive and leave
  young behind; survival, selection and natural selection are other names for this idea.
examples:
- The book explains survival of the fittest as a force shaping life on earth.
- In class, we learned how survival of the fittest works in nature.
