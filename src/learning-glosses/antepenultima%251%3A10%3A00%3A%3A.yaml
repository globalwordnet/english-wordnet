simpleMeaning: The syllable that comes third when a word is counted back from its end.
scope: This sense is also called antepenult and antepenultimate.
examples:
- In the word 'elephant', the antepenultima is the first syllable, 'el'.
- The stress in that word falls on the antepenultima.
