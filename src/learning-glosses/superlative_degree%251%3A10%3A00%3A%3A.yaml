simpleMeaning: The form of an adjective or adverb that shows the most or least of a quality.
scope: It is also called a superlative.
examples:
- '''Biggest'' is the superlative degree of the adjective ''big''.'
- '''Most quickly'' is the superlative degree of the adverb ''quickly''.'
