simpleMeaning: A soldier belonging to a military unit called the Guard or the Guards.
scope: This is a soldier of a unit called 'the Guard' or 'the Guards', not a person merely keeping watch,
  not the military unit itself, and not a football or basketball player.
examples:
- Each guard wore the red tunic of the regiment.
- A guard from the regiment marched at the head of the parade.
