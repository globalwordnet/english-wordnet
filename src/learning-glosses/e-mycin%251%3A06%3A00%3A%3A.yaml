simpleMeaning: Erythromycin, an antibiotic from Streptomyces erythreus, sold as Erythrocin, E-Mycin, Ethril,
  Ilosone, or Pediamycin. It acts against many Gram-positive and some Gram-negative bacteria.
scope: 'Also called erythromycin, Erythrocin, Ethril, Ilosone, or Pediamycin: a drug that kills germs,
  not a painkiller and not a drug that kills viruses.'
examples:
- The doctor gave her E-Mycin for the chest infection.
- E-Mycin works against many germs.
