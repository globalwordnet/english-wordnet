senseId: depreciatory%5:00:00:uncomplimentary:00
synsetId: 00909877-s
simpleMeaning: Inclined to speak ill of a person or thing, making it seem of little worth.
scope: This one is also called deprecating, belittling, slighting, deprecative, deprecatory, and depreciative,
  and it is not the other sense of this same word, about money worth going down.
examples:
- The depreciatory tone of the speech made the plan sound small and weak.
- A depreciatory laugh from the back of the room took the pride out of the win.
