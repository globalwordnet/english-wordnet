simpleMeaning: A tale too strange to be true, as if made up.
scope: This is a story that is strange and hard to believe, and it is not a plain account of what happened.
examples:
- Their tall tale about a fish as big as a boat made us laugh.
- They told a tall tale about finding gold in their garden.
