simpleMeaning: A strong, shiny gray metal resembling titanium. It is used in nuclear reactors because
  it absorbs few neutrons. It occurs in baddeleyite and comes mainly from zircon.
scope: This metal is also called Zr and atomic number 40; it is not titanium and not another grey metal
  of the same group.
examples:
- Zirconium is used in nuclear reactors.
- The tube was made of zirconium.
