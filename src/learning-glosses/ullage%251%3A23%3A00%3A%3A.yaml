simpleMeaning: How much more a container, such as a wine bottle or a tank, needs before it is full.
scope: This is what is still missing from a container, not what is already in it.
examples:
- They measured the ullage in the wine bottle before filling it.
- They checked the ullage in the tank to see how much space was left.
