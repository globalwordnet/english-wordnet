simpleMeaning: A woman who charms men with her looks and uses them to get what she wants.
scope: Also called tease, flirt, minx, coquette, vamp, and prickteaser. It is a kind of woman, not a kind
  of man.
examples:
- The vamper smiled and got a stranger to pay for dinner.
- The vamper used her charm to get free drinks all night.
