simpleMeaning: Argon, a colorless, odorless gas that rarely reacts with other substances. Traditionally
  counted among six inert gases, it makes up about one percent of Earth's atmosphere.
scope: Ar is the chemical symbol for argon, the largely unreactive gas with atomic number 18.
examples:
- Ar fills light bulbs and does not burn.
- About one part in a hundred of the air is Ar.
