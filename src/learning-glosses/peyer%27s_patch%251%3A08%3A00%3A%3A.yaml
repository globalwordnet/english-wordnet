simpleMeaning: A cluster of tissue that helps defend the body against infection, found in the wall of
  the small intestine, especially near its lower end.
scope: Peyer's patches are especially common near the point where the small and large intestines meet.
examples:
- The doctor pointed to a Peyer's patch in the wall of the gut.
- The Peyer's patches were swollen after the infection.
