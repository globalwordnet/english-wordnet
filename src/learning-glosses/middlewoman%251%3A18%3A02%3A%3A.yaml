simpleMeaning: A female performer who stands in the centre of a row of minstrel performers and talks with
  the others.
scope: It is a performer in a minstrel show, not a buyer who buys goods to sell them on to shops.
examples:
- The middlewoman kept the jokes going between songs.
- As middlewoman, the performer led the talk between the others.
