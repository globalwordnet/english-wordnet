simpleMeaning: In a many-sided shape, a dent in the outline makes an inside corner wider than a half-turn
scope: This is the inside corner a dent in the outline makes, also called a reentering angle, not a corner
  that juts outward.
examples:
- The reentrant angle showed where the side bent inward.
- A reentrant angle can be found in any shape with a dent in it.
