simpleMeaning: A vein near the surface of the lower abdomen that drains into the great saphenous vein.
scope: Also called vena epigastrica superficialis. It is not the great saphenous vessel itself.
examples:
- The superficial epigastric vein empties into the great saphenous vessel.
- The doctor traced the superficial epigastric vein near the skin of the belly.
