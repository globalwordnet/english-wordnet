simpleMeaning: A place where many roads cross over each other, one high road passing above another, in
  a tangle.
scope: This names a tangle of roads crossing over each other, where drivers change from one road to another.
examples:
- Drivers took the wrong road at the spaghetti junction.
- They missed their turn at the spaghetti junction.
