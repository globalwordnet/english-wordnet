simpleMeaning: In the back part of a ship or an aircraft, or in that direction.
scope: This one is also called aft and astern, and it is the opposite of toward the front.
examples:
- They sailed with the wind abaft and made good speed.
- The captain looked abaft to see what the fuss was about.
