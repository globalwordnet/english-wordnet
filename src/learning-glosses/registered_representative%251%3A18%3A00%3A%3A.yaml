simpleMeaning: The person who takes care of a client's business with an advertising agency, a brokerage,
  or another company that sells services.
scope: Also called account executive, account representative, and customer's broker. It is a person.
examples:
- Ask your registered representative about the new advertising plan.
- The registered representative handles our account with the brokerage firm.
