senseId: 'advance_death_benefit%1:21:00::'
synsetId: 13318420-n
simpleMeaning: A benefit, a share of the money paid when someone dies, given straight to people with a
  policy who have not long to live, usually 6 months.
scope: This one is not a payout made after the holder dies.
examples:
- They asked about an advance death benefit after learning that they would not live much longer.
- They claimed an advance death benefit once illness left them with little time.
