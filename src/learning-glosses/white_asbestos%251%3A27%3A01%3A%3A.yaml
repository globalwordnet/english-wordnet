simpleMeaning: This grey or green mineral, made of fine threads, is an important source of asbestos sold
  for trade.
scope: This grey or green mineral is also called chrysotile, and it is an important commercial source,
  not just any fibrous mineral.
examples:
- Samples of white asbestos showed grey-green fibres under the lens.
- The mine produced white asbestos for sale in many countries.
