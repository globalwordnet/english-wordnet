senseId: 'precipitousness%1:07:00::'
synsetId: 05076793-n
simpleMeaning: The quality of a slope that rises or falls very sharply, so it is hard to climb.
scope: It is also called abruptness or steepness. It is a quality of a slope, not of how fast something
  happens.
examples:
- The precipitousness of the cliff made the path dangerous.
- Climbers feared the precipitousness of the steep mountain face.
