simpleMeaning: Most often, people act and things happen in a usual fashion.
scope: People also call this the ways of the world, and it covers usual conduct and usual outcomes.
examples:
- An ordinary reader knows a lot about the way of the world.
- She knew the way of the world well before she took the veil.
