simpleMeaning: Made active, for example by being made radioactive, able to glow, sensitive to light, or
  able to conduct electricity.
scope: Made to work after a change, not made more able to react, not sewage treated with air and germs,
  and not troops put on active duty.
examples:
- The activated carbon filter cleaned the water.
- Heat activated the chemicals in the mixture.
