senseId: 'countersink%1:06:01::'
synsetId: 03122702-n
simpleMeaning: A hole, most often in wood, whose wider top lets a screw or bolt go in deep enough to rest
  below the surface.
scope: This one is about a hole, not the act of putting a screw into one.
examples:
- The carpenter drilled a countersink in the shelf before fitting the screws.
- A countersink in the door frame hid the heads of the bolts.
