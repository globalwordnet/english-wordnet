simpleMeaning: A very tall evergreen of California's western Sierra Nevada foothills, especially in the
  south. The largest individuals are the world's biggest trees by trunk volume.
scope: Also called big tree, giant sequoia, Sequoia gigantea, Sequoia wellingtonia and Sequoiadendron
  giganteum; a very tall evergreen tree of California, the largest living thing on earth.
examples:
- The Sierra redwood towers over the other trees in the park.
- A Sierra redwood can live for thousands of years.
