simpleMeaning: A tropical fish that glides underwater using huge, fan-shaped chest fins. It is unrelated
  to sea robins.
scope: This warm-sea animal has huge fan-like side fins for gliding under water and is no kin to searobins;
  it is also called flying gurnard and flying robin.
examples:
- The butterflyfish glided under the water.
- A butterflyfish spread its huge fins.
