simpleMeaning: The overall force on an object equals the rate at which its momentum changes. The change
  in momentum points in the direction of the force.
scope: 'Another name for second law of motion and Newton''s second law of motion: how fast the push of
  a moving thing changes, not the first or third law.'
examples:
- Newton's second law tells us how a push changes the motion of a thing.
- We used Newton's second law to work out how fast the cart would speed up.
