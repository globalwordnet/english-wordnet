simpleMeaning: Yeast used by brewers to make ale in the way where it rises to the surface.
scope: This is used to make ale and rises to the surface, not the kind that sinks to the bottom.
examples:
- They added top fermenting yeast to the ale and watched it rise to the surface.
- The top fermenting yeast rose to the surface as the ale worked.
