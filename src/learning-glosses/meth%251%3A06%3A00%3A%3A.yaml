simpleMeaning: Methamphetamine, sold as Methedrine in the form of a crystalline hydrochloride salt. It
  stimulates the nervous system and suppresses appetite.
scope: A drug made from amphetamine that wakes up the nerves and takes away hunger, sold under the trade
  name Methedrine; also called glass, ice, trash, chalk, and crank.
