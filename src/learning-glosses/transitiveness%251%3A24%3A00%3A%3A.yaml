senseId: 'transitiveness%1:24:00::'
synsetId: 13820330-n
simpleMeaning: In grammar, a transitive verb makes this link between itself and its object.
scope: Transitivity is another name for this sense, which is the grammatical tie between a verb and its
  object, not the verb on its own.
examples:
- The transitiveness of the verb 'kick' is what joins it to its object.
- In 'They hit the ball', the transitiveness of 'hit' links it to 'the ball'.
