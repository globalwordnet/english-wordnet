simpleMeaning: A maths rule about averages over many trials, saying the mean result gets closer and closer
  to the true mean as trials are run, and this is sure to happen.
scope: It does not describe one trial on its own.
examples:
- The strong law of large numbers tells us the mean result settles near the true mean.
- They used the strong law of large numbers to check the coin-toss results.
