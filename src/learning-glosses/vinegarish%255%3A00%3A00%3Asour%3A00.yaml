simpleMeaning: Said of a thing whose taste or smell is sharp and sour, like that of the liquid used to
  dress salads.
scope: Also called vinegary, acetose, and acetous. It is said of a thing, not of a person.
examples:
- The vinegarish wine had turned and was no longer fit to drink.
- A vinegarish smell rose from the jar of pickles.
