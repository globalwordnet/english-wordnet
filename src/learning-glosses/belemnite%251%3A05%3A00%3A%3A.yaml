senseId: 'belemnite%1:05:00::'
synsetId: 01976364-n
simpleMeaning: A pointed, cone-shaped fossil of calcium carbonate from an extinct squidlike animal. A
  hollow at its broad end may contain a small chambered part of the shell.
scope: The pointed stone fossil of the animal's inner shell, not the living squid-like creature or a modern
  shell.
examples:
- She found a belemnite in the soft chalk of the cliff.
- The museum displays belemnites beside a model of a squid.
