simpleMeaning: Describing something that carries no colour, or that lacks the power to make colour.
scope: Also called black-and-white, this one is the adjective, not the noun for a picture or for writing.
examples:
- They watched the old film in black and white.
- The new set can show pictures in black and white, but not in colour.
