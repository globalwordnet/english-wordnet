simpleMeaning: A rare condition caused by missing DNA on chromosome 7. Features can include learning difficulties,
  slow growth, distinctive facial features, sociability, and relative strengths in spoken language.
scope: Not Down syndrome or Fragile X, other disorders present from birth.
examples:
- Williams syndrome gives children elfin faces and a gift for words.
- The little girl with Williams syndrome chatted with everyone.
