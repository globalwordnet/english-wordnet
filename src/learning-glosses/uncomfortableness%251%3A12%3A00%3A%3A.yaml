simpleMeaning: The feeling of shame that comes when you think the people near you are watching you closely
  and finding fault.
scope: Uneasiness and self-consciousness are other names for it.
examples:
- They felt a deep uncomfortableness when the whole class turned to stare.
- The uncomfortableness faded once people stopped watching them.
