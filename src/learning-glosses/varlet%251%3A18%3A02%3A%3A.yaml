simpleMeaning: A sly person who tells lies, breaks promises, and cannot be trusted.
scope: Also called rogue, rascal, knave, scalawag, scallywag, and rapscallion. It is a kind of person,
  not an honest one.
examples:
- The varlet stole the purse and blamed the servant.
- No one trusted the varlet with the keys.
