simpleMeaning: Stress on a word that comes from how high or low the voice is, not from how loud it is.
scope: Also called a tonic accent. It is a kind of stress.
examples:
- In that language, a pitch accent can change the meaning of a word.
- The teacher marked the pitch accent on the first part of the word.
