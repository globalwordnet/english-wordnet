senseId: 'unconditioned_reflex%1:04:00::'
synsetId: 00865191-n
simpleMeaning: A reflex that a living thing is born with and that happens on its own when something stirs
  it, with no learning behind it.
scope: Also called reflex, inborn reflex, innate reflex, instinctive reflex, physiological reaction, reflex
  action, and reflex response, this word names a bodily answer to a stir from outside that needs no learning,
  not one that must be taught.
examples:
- A tap on the knee set off the unconditioned reflex, and the leg jerked.
- The unconditioned reflex made them blink when something flew at their eyes.
