simpleMeaning: An immune reaction in which an antigen bound to an antibody inactivates a complement protein,
  leaving it unavailable to react with another antigen-antibody pair.
scope: Of immune answers, where a germ-marker and defence-marker pair shuts down a complement.
examples:
- Complement fixation shuts down the complement.
- Complement fixation blocks a second pair.
