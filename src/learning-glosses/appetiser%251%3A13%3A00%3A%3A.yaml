simpleMeaning: Something to eat or drink that wakes up the wish to eat, most often served before a meal
  or as the first course.
scope: Also called starter and appetizer, this one is not served with the meal or after it.
examples:
- They ordered an appetiser of olives while they looked at the menu.
- The waiter brought an appetiser before the soup arrived.
