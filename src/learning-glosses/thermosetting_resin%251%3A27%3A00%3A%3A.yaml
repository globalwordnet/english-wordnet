simpleMeaning: Heat turns this material hard, and it keeps its shape after that.
scope: Also called thermosetting compositions. It is not a material that stays soft.
examples:
- The thermosetting resin hardened in the mould and could not be reshaped.
- Once the thermosetting resin had set, no heat could soften it again.
