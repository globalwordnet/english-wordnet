senseId: 'diametrical_opposition%1:24:00::'
synsetId: 13851456-n
simpleMeaning: The way two things sit at the ends of a straight line drawn through the middle of a round
  shape, facing each other.
scope: This one is also called antipodal and antipodal opposition.
examples:
- The two towns stood in diametrical opposition, one at each end of the road through the valley.
- The two plans were in diametrical opposition, one calling for a new road and the other against it.
