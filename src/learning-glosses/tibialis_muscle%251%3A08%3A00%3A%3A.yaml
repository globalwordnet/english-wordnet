simpleMeaning: The foot moves because one of two muscles in each leg, fixed to the shinbone, pulls it.
scope: Also called musculus tibialis or tibialis, this one is for the foot, not the hand.
examples:
- The tibialis muscle moved the foot when they stepped forward.
- Each tibialis muscle in their legs helped the feet move.
