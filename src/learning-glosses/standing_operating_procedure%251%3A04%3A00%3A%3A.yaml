simpleMeaning: A fixed routine for doing a task, set out beforehand and repeated without change.
scope: Also called standard operating procedure, standard procedure, and SOP. It is a way of working.
examples:
- The team follows a standing operating procedure for every safety check.
- They wrote a standing operating procedure so new workers would know the steps.
