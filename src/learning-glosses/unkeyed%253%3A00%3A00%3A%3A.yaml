senseId: 'unkeyed%3:00:00::'
synsetId: 02447392-a
simpleMeaning: Describing music that avoids organizing notes around a central key in the traditional Western
  way.
scope: Also called atonal. It is a word for music, not for a person.
examples:
- The unkeyed passage drifted without ever settling on one note.
- The composer wrote an unkeyed piece for the piano.
