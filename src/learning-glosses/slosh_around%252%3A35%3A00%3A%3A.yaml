simpleMeaning: Moving a liquid in a clumsy way makes a lot of it spill or splash about.
scope: Slosh, slush, and slush around are other names for this verb for a liquid spilling or splashing
  about in large amounts because it is moved in a clumsy way.
examples:
- Paint sloshed around all over the walls.
- Water sloshed around and splashed over the sides.
