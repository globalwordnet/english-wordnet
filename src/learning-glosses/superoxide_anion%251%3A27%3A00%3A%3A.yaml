simpleMeaning: An ion made of two oxygen atoms that together carry a single negative charge, written O₂⁻.
scope: It is also called superoxide.
examples:
- Much of the O2 supporting cellular respiration is reduced to the superoxide anion O2-.
- The superoxide anion forms when oxygen gains an extra electron.
