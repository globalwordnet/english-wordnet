simpleMeaning: Said of a thing that is open to the light, with nothing darkening it or hiding it from
  view.
scope: It is said of a thing, not of a person.
examples:
- On an unshadowed day the ice shone bright in the sun.
- The unshadowed wall caught the full light of the morning.
