simpleMeaning: A unit on the Celsius temperature scale. At standard atmospheric pressure, water freezes
  at 0°C and boils at 100°C.
scope: Also called degree centigrade; a unit of temperature on the Celsius scale, not the Fahrenheit scale.
examples:
- Water boils at one hundred degrees Celsius.
- It was twenty degrees Celsius outside today.
