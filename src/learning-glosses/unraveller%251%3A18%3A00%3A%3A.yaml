simpleMeaning: Someone who undoes knots and makes a tangled thing straight again.
scope: Also called disentangler and unraveler. It is a person, not a machine.
examples:
- The unraveller sat with the knotted net and worked until it was clear.
- Ask an unraveller to deal with the tangled thread.
