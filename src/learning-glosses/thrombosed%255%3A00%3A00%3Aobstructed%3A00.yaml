senseId: thrombosed%5:00:00:obstructed:00
synsetId: 01626369-s
simpleMeaning: A part of the body is this when a clot of blood that has set hard sits in it or blocks
  it.
scope: This word is used for a part of the body in which blood has set hard into a lump, not one where
  the blood still flows freely.
examples:
- Blood could not get through the thrombosed vein because a clot had set hard inside it.
- The blood vessel became thrombosed, and blood stopped flowing past the clot.
