simpleMeaning: The loss of a baby's life during sleep, striking without any warning, when the baby had
  seemed healthy.
scope: Cot death, crib death, sudden infant death syndrome, and SIDS are other names for it.
examples:
- The infant death came without warning while the baby slept.
- The doctors found no cause for the infant death, and the family was left with no answers.
