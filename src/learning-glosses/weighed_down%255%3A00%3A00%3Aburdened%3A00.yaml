senseId: weighed_down%5:00:00:burdened:00
synsetId: 00872998-s
simpleMeaning: Said of a person who carries a heavy load of work or worry.
scope: Also called overburdened, bowed down and loaded down. It is said of a person, not of a thing.
examples:
- The new manager felt weighed down by the pile of work on their desk.
- After the long week, they were weighed down with cares and deadlines.
