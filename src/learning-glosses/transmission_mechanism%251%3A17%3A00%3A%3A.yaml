simpleMeaning: Whatever way an infectious agent reaches a person from where it lives.
scope: This is about how a germ gets to a person, not the illness itself.
examples:
- The transmission mechanism of the disease was the bite of an infected mosquito.
- They traced the transmission mechanism back to the water where the germ lived.
