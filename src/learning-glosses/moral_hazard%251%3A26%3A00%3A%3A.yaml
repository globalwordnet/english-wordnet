simpleMeaning: In economics, the position of a person who need not guard against a risk, because insurance
  or something like it will cover the loss.
scope: It is a term from economics.
examples:
- Insurance companies are exposed to a moral hazard if the insured party is not honest.
- The new policy created a moral hazard for drivers who knew any crash would be paid for.
