simpleMeaning: A roof whose ends are gables and whose two sides slope up to meet along a top edge.
scope: Its two sides rise to a ridge between gables at the ends, also called a gable roof, a saddleback,
  or a saddleback roof.
examples:
- The saddle roof of the house had a gable at each end.
- Rain ran down both sides of the saddle roof.
