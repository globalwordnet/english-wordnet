simpleMeaning: To make someone unable to see by holding a flat piece of metal, heated until it glows,
  in front of their eyes.
scope: This one is done by captors to prisoners.
examples:
- Their captors abacinated the prisoners with a hot plate.
- They threatened to abacinate them if they would not talk.
