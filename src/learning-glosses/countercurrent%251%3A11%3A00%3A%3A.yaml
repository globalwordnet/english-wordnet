senseId: 'countercurrent%1:11:00::'
synsetId: 07419184-n
simpleMeaning: A stretch of rough, choppy water where a flow in a river or the sea meets another flow
  head-on or cuts across it.
scope: Also called rip, riptide, crosscurrent or tide rip, this one names water, not actions that go against
  what the main group does.
examples:
- The boat hit a countercurrent and was pushed back toward the bank.
- Swimmers were warned about the countercurrent near the river mouth.
