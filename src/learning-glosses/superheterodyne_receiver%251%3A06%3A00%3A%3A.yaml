senseId: 'superheterodyne_receiver%1:06:00::'
synsetId: 03522159-n
simpleMeaning: A radio receiver that mixes an incoming radio wave with one generated inside the receiver
  to produce an intermediate frequency above human hearing for amplification and signal recovery.
scope: This sense is also called heterodyne receiver and superhet.
examples:
- A superheterodyne receiver mixes two waves.
- Superheterodyne receivers make waves louder.
