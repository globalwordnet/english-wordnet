simpleMeaning: The type of smallpox virus that caused a milder form of smallpox. About one in a hundred
  people with this form died.
scope: Also called variola minor. It is the germ itself, not the mild illness it causes.
examples:
- Variola minor virus killed about one in a hundred of its victims.
- The vaccine guards people against variola minor virus.
