simpleMeaning: The name of a letter comes from a word that begins with the sound the letter makes.
scope: This one is not about a name taken from a later sound.
examples:
- In acrophony, the letter B gets its name from a word like 'ball'.
- The teacher used acrophony when the letter S took its name from 'sun'.
