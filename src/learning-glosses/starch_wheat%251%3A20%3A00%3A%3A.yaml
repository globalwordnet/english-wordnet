simpleMeaning: A kind of hard red grain grown especially in Russia and Germany, used in the United States
  as food for farm animals.
scope: Also called emmer, two-grain spelt, and Triticum dicoccum. It is a plant product.
examples:
- They grow starch wheat in Russia and Germany.
- In the United States, starch wheat is fed to farm animals.
