simpleMeaning: As a medicine, and to turn animal skins into leather, this plant chemical is used, one
  of several made of many parts and made with the chemical phenol.
scope: This is also called tannic acid, a chemical taken from plants, not the plant itself.
examples:
- The tannin turned the animal skin into leather.
- They used tannin as a medicine.
