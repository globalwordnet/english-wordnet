simpleMeaning: Something that exists only in the mind, though people often take it for real.
scope: Also called fairyland and fantasy world. It is not part of real life.
examples:
- In a phantasy world, dragons ruled the skies.
- Some people live half their lives in a phantasy world of their own making.
