senseId: 'notochord%1:05:00::'
synsetId: 01469113-n
simpleMeaning: A flexible rod supporting the body in some chordates, including certain vertebrates. It
  also forms in the embryos of animals with backbones.
scope: A bendy rod down the middle of the body that holds it up, not the backbone itself.
examples:
- The notochord runs down the middle of the young fish.
- In the embryo, the notochord holds the body up.
