simpleMeaning: A card game where players bet on the colour of the cards, or on which of two lines dealt
  out comes nearer to a set number.
scope: Also called trente-et-quarante, it is a game of chance played with two lines of dealt cards.
examples:
- They bet on the colour of the cards in rouge et noir.
- They sat down to a game of rouge et noir.
