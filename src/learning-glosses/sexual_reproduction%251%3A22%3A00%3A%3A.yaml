senseId: 'sexual_reproduction%1:22:00::'
synsetId: 13576443-n
simpleMeaning: A male cell and a female cell come together to start a new living thing.
scope: Also called amphimixis, this is the name for new life that starts when a male cell and a female
  cell join, and not for new life from one parent alone.
examples:
- In sexual reproduction, the young are made when a male cell and a female cell join.
- The class learned that sexual reproduction needs both a male and a female.
