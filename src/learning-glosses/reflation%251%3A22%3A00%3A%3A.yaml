simpleMeaning: In money matters, after prices have fallen for a time, they are pushed back up to where
  they stood before
scope: In money matters, this is prices pushed back up to where they stood before after a fall, not a
  first rise in prices.
examples:
- The government hoped that reflation would lift prices again.
- After prices had fallen, reflation began to lift them again.
