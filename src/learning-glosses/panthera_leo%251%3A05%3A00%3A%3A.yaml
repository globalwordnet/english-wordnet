simpleMeaning: The lion, a large African and Indian wild cat that hunts and lives in groups. It has tawny
  fur, and males usually have a shaggy mane.
scope: This is a large cat from Africa and India that lives in groups; lion and king of beasts are other
  names for it, not a cat that lives alone.
examples:
- The male Panthera leo has long thick hair around its head and neck.
- Panthera leo lives in groups in Africa and India.
