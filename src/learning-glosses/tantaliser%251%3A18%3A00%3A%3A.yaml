simpleMeaning: A person who torments someone by offering something wanted but keeping it just out of reach.
scope: Also called tantalizer. It is a kind of tormentor.
examples:
- The tantaliser held out the toy but would not let the child take it.
- The tantaliser showed them the prize and then hid it.
