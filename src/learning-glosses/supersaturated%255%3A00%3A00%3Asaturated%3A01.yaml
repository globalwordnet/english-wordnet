simpleMeaning: Holding more of a dissolved substance than it can normally hold, so it is unsteady.
scope: It is a word for the state of a solution, not for the solution itself.
examples:
- The supersaturated liquid began to form crystals as it cooled.
- The jar held a supersaturated solution with crystals at the bottom.
