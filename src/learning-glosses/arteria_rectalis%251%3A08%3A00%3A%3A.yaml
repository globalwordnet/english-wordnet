simpleMeaning: One of the arteries that supply the area around the rectum, the final section of the large
  intestine.
scope: Also called the rectal artery, this one is not a blood vessel of the upper bowel.
examples:
- Blood reaches the lowest part of the bowel through the arteria rectalis.
- The doctor checked the arteria rectalis for bleeding after the operation.
