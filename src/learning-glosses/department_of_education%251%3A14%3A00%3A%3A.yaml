simpleMeaning: The U.S. federal department established in 1979 that runs federal education programs, including
  financial aid for schools and students.
scope: 'Also called Education and Education Department: the country''s office that runs all country-wide
  schemes dealing with schooling, covering aid to schools and learners, distinct from schooling offices
  of single states.'
