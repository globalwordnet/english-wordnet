simpleMeaning: In psychology, the way a person grows more and more open to certain things that happen,
  above all to things that stir strong feeling.
scope: Also called sensitization, this is the way in psychology that a person grows more open to certain
  things that happen, not the making of a body open to a serum by shots.
examples:
- Small sounds upset them more and more once sensitisation had set in.
- Through sensitisation, the same sad song stirred stronger feeling each time.
