senseId: 'sweatshop%1:06:00::'
synsetId: 04377687-n
simpleMeaning: A factory where workers receive low pay for each item they make and are prevented from
  forming unions. Such factories are common in the clothing industry.
scope: A mill where piecework is done for poor pay, workers kept from forming unions, common in the clothing
  trade.
examples:
- Their sweatshop ran at dawn.
- The sweatshop was shut at noon.
