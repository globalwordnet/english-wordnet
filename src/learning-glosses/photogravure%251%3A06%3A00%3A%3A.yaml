simpleMeaning: A printed picture from a plate with the design cut into it.
scope: Also called gravure or heliogravure. It is the print itself, not the making of the plate.
examples:
- The photogravure showed fine lines in the dark parts of the picture.
- They framed the photogravure and hung it on the wall.
