senseId: 'reinsure%2:32:00::'
synsetId: 00893255-v
simpleMeaning: to hand on all or part of a risk you have already covered, getting a second firm to carry
  it, so you are covered a second time
scope: It is handing on a risk you have already covered to a second firm, not taking on a risk from a
  firm that already covers it.
examples:
- The firm chose to reinsure the storm risk with a larger company.
- The insurer moved to reinsure half the risk it had taken on.
