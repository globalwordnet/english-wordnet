senseId: 'adverbial_of_reason%1:10:01::'
synsetId: 92464139-n
simpleMeaning: A word or phrase that explains why an action happens.
scope: It is also called an adverbial of cause.
examples:
- They missed the bus because they woke late, and because they woke late is an adverbial of reason.
- They came back because they had left their keys, and because they had left their keys is an adverbial
  of reason.
