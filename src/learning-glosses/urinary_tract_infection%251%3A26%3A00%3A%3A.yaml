simpleMeaning: This infection can strike any part of the set of organs and tubes that make urine and carry
  it out of the body.
scope: This is a sickness that can strike any part of the body's urine system, not one part only.
examples:
- They were given medicine for a urinary tract infection that kept coming back.
- The infection had reached the kidney, so the doctor called it a urinary tract infection.
