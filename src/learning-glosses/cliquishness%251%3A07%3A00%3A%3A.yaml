senseId: 'cliquishness%1:07:00::'
synsetId: 04896532-n
simpleMeaning: The habit of sticking to one small group of people one has picked, and shutting others
  out.
scope: This one is also called clannishness and exclusiveness.
examples:
- Their cliquishness kept them from making friends outside their small group.
- The cliquishness of the team made new players feel left out.
