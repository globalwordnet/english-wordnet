senseId: 'time-fuse%1:06:00::'
synsetId: 04444804-n
simpleMeaning: To set off a bomb above all, this fuse is made to burn for a set while.
scope: This is not one that goes off the moment it is lit; it burns for a set while first.
examples:
- They fitted a time-fuse to the bomb so it would go off after a set while.
- The time-fuse burned down before the blast went off.
