simpleMeaning: An electrically neutral particle with very little mass, associated with the tau lepton.
scope: Also called tauon neutrino. It is not the one tied to the electron or the muon.
examples:
- The tau neutrino has almost no mass.
- A tau neutrino can pass through the whole Earth.
