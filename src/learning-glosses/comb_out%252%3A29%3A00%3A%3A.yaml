simpleMeaning: To use a toothed tool, or to do the same as if with one, to make something smooth and tidy.
scope: This one is not about taking knots from hair; comb and disentangle are other names for it.
examples:
- They combed out the wool until it was smooth and neat.
- The barber combed out the customer's hair and made it tidy.
