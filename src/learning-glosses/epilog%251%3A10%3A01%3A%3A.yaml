simpleMeaning: The closing words of a play, a short speech, often in verse, that an actor speaks straight
  to the audience.
scope: This one is also called epilogue.
examples:
- The actor stepped forward to deliver the epilog at the end of the play.
- The epilog was spoken in verse to the laughing audience.
