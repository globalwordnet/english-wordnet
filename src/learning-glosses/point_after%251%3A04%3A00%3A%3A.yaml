senseId: 'point_after%1:04:00::'
synsetId: 00190106-n
simpleMeaning: One mark added to a team's score in American football for kicking the ball off the ground
  once the team has reached the end zone.
scope: Also called extra point and point after touchdown. It is one mark in American football.
examples:
- After the touchdown, the team kicked for the extra point.
- They scored the point after on a good kick.
