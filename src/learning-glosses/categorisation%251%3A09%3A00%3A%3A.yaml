senseId: 'categorisation%1:09:00::'
synsetId: 05740701-n
simpleMeaning: The basic work of the mind in putting things into groups or kinds.
scope: Sorting, classification, and categorization are other names for this, not for a group already arranged
  by class.
examples:
- When the mind meets something new, categorisation puts it in a group that makes sense.
- Young children learn categorisation when they sort toys by colour and shape.
