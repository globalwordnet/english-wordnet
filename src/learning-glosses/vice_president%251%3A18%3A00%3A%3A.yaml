simpleMeaning: An officer who ranks just below the person in charge of a group, and who may act in that
  person's place when the need comes up.
scope: Also called V.P. It is an officer, not the person in charge.
examples:
- The vice president opened the meeting because the head of the firm was abroad.
- They served as vice president for six years.
