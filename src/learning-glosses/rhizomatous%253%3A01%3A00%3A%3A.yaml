simpleMeaning: A plant counts as this when it has, makes, or looks like thick stems that grow flat under
  the ground.
scope: A word that marks a plant as having, making, or looking like underground stems.
examples:
- This rhizomatous plant has stems that grow flat under the ground.
- That rhizomatous plant makes stems that grow flat under the ground.
