simpleMeaning: A shrinking of buying, selling, and work that makes prices fall.
scope: This is not the wearing away of soil by wind, which is the same word in geology.
examples:
- The deflation made prices fall while trade shrank.
- Shops cut prices during the deflation as fewer people bought goods.
