simpleMeaning: Involving softening that happens when something stays wet or soaks in liquid.
scope: Often used of changes to skin or other tissue after prolonged contact with moisture.
examples:
- The nurse noted macerative changes in the skin beneath the wet dressing.
- The pale, softened skin showed signs of macerative damage.
