senseId: 'modal%1:10:00::'
synsetId: 06329715-n
simpleMeaning: A helping word, such as 'can' or 'will', that comes before a main verb and shows whether
  something is possible, needed, or allowed.
scope: It is also called modal auxiliary, modal auxiliary verb, or modal verb.
examples:
- In 'They can swim', the word 'can' is a modal.
- '''Will'' is a modal in the sentence ''I will help you tomorrow''.'
