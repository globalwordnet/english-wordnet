simpleMeaning: An operation to strengthen a military force or help it carry out its task, often by sending
  additional troops and supplies.
scope: In war, this is what an army often gets in fresh troops and supplies, also called support and also
  called reinforcement.
examples:
- The general asked for a reenforcement of fresh troops.
- A reenforcement of new supplies reached the army.
