simpleMeaning: Said of a person or a thing that has to do with the idea that there is no god.
scope: Also called atheist and atheistic. It is about an idea, not about a person who turns away from
  belief.
examples:
- The atheistical writer argued that no god exists.
- Their atheistical views surprised the family.
