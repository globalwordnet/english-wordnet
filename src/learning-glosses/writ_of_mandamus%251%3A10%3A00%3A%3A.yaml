simpleMeaning: A special court order requiring an official to carry out a duty that the law leaves them
  no choice about, used when other legal remedies are inadequate.
scope: This sense is also called mandamus.
examples:
- A writ of mandamus told the officer to act.
- Writs of mandamus come last.
