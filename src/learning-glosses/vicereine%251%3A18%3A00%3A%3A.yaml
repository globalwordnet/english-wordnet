senseId: 'vicereine%1:18:00::'
synsetId: 85936342-n
simpleMeaning: A king or ruler puts a woman in charge of a country or province, and she governs it for
  them.
scope: This is a female governor who rules as a king's representative, not a male governor.
examples:
- The vicereine governed the province for the king while he was abroad.
- As vicereine, she ruled the country in the sovereign's name.
