simpleMeaning: Someone who speaks or expresses ideas in words, especially a public speaker or someone
  who talks a great deal.
scope: This person is also called a speaker, a talker, a verbaliser, or a verbalizer, and not one who
  passes false coins or a creature that makes sounds.
examples:
- The utterer at commencement spoke clearly to the crowd.
- As an utterer of useful maxims, they were asked to speak at every meeting.
