simpleMeaning: Optical glass that strongly bends light and spreads it into a wide range of colors.
scope: 'Also called optical flint: a clear hard material that bends light strongly and splits it into
  colours, not the plain kind used in windows and not a lens on its own.'
examples:
- The lens was made from flint glass.
- Flint glass bends light more than ordinary glass.
