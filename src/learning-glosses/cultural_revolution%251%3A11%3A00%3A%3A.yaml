simpleMeaning: Mao Zedong’s campaign launched in China in 1966. Red Guards attacked supposed enemies of
  the revolution, including intellectuals, causing widespread persecution and social and economic disruption.
scope: Also called the Great Proletarian Cultural Revolution, a political campaign launched in China in
  1966.
examples:
- The Cultural Revolution began in 1966.
- Her family suffered during the Cultural Revolution.
