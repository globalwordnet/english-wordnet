senseId: 'stay_relay%1:06:01::'
synsetId: 92463799-n
simpleMeaning: With no power sent to its coil, this switch holds its contacts in one place or the other,
  for as long as needed.
scope: Bistable relay, impulse relay, keep relay, and latching relay are other names for this sense.
examples:
- The stay relay kept the lights on with no power sent to its coil.
- They fitted a stay relay to hold the contacts in place.
