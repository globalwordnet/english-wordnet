simpleMeaning: A skin test for past or present infection with tuberculosis bacteria. It checks whether
  the skin reacts strongly to tuberculin.
scope: This is a check that shows if a person has had, or now has, the germ that causes tuberculosis,
  also called a tuberculin test; not a blood check and not a chest X-ray.
examples:
- The tuberculin skin test showed she had been exposed to the germ.
- He had a tuberculin skin test before starting the new job.
