simpleMeaning: A tall tropical American grass that grows in clumps year after year. It now grows wild
  in the southern United States and provides pasture and livestock feed.
scope: This sense is also called dallis grass and paspalum, a long-lived tall tufted grass of warm-land
  America, now grown as feed in the southern United States.
examples:
- Dallisgrasses grow tall in warm lands.
- The dallisgrass feeds stock.
