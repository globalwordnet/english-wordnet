senseId: 'zona_pellucida%1:08:00::'
synsetId: 05616370-n
simpleMeaning: A thick protective layer around a mammalian egg. A sperm passes through it during fertilization.
  The developing embryo sheds it shortly before attaching to the wall of the uterus.
scope: 'Of the mammal egg: a thick skin pierced by one sperm, staying round the egg until it beds in the
  womb wall.'
examples:
- A zona pellucida ringed the egg.
- Zonae pellucidae stay round the egg.
