simpleMeaning: A spike of metal with a hole that takes a rope, driven into ice or rock by climbers as
  something to hold on to.
scope: It is a piece of climbing gear.
examples:
- The climber hammered a piton into the rock face.
- They clipped the rope to the piton and moved on.
