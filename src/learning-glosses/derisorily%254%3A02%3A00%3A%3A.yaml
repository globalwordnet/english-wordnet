simpleMeaning: In a way that shows no respect, turning a person or an idea into a joke.
scope: Mockingly, derisively and scoffingly are other names for this sense.
examples:
- The clerk answered derisorily when asked for help, and the customer left at once.
- The speaker smiled derisorily at the question and gave no real answer.
