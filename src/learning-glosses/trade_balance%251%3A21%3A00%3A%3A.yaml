simpleMeaning: This is the amount by which what a country buys from abroad is more or less than what it
  sells abroad, over a period of time.
scope: Also called balance of trade, trade gap, and visible balance, this is a number that sets a country's
  buying from abroad against its selling abroad, not the goods that cross its borders.
examples:
- The country's trade balance turned in its favour when exports rose.
- They watched the trade balance to see if imports were outrunning exports.
