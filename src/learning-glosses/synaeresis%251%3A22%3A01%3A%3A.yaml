simpleMeaning: The drawing together of two vowels into a diphthong, a single sound made from two vowels.
scope: Also called syneresis. It is about vowels in speech, not about liquid leaving a gel.
examples:
- In fast speech, synaeresis can turn two vowel sounds into one.
- The poet used synaeresis to fit the line to the metre.
