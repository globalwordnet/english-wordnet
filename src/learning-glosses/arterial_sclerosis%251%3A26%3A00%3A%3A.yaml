simpleMeaning: Hardening and stiffening of the walls of arteries.
scope: Also called arteriosclerosis, coronary-artery disease, hardening of the arteries, and induration
  of the arteries, this one is not a hardening of the veins.
examples:
- The scan showed arterial sclerosis in the blood vessels of the leg.
- They watched the arterial sclerosis over the years to see how it changed.
