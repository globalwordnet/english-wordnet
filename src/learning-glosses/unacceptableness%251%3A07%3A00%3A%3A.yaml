schema: oewn-learning-gloss-v2
senseId: 'unacceptableness%1:07:00::'
synsetId: 04801174-n
simpleMeaning: A thing with this quality is not good enough because it does not meet the standards people
  have agreed on.
scope: Also called unacceptability, this name is for the quality of a thing that is not good enough, not
  for the standards themselves.
examples:
- They complained about the unacceptableness of the delay.
- Everyone agreed on the unacceptableness of the decision.
