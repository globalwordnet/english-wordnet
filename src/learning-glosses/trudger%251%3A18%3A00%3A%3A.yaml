simpleMeaning: A person who trudges along slowly, each step heavy with effort.
scope: Also called plodder and slogger, this person's way of walking is slow and heavy, not quick and
  light.
examples:
- The trudger moved along the road with slow, heavy steps.
- The trudger's heavy steps could be heard from far off.
