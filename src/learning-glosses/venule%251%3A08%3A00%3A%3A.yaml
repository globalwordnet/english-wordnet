simpleMeaning: A tiny vein that receives blood from capillaries, the body's smallest blood vessels.
scope: Also called capillary vein and venula. It is a blood vessel, not the capillary it joins.
examples:
- The doctor pointed to a venule on the scan.
- The venule was the smallest vessel the student could name.
