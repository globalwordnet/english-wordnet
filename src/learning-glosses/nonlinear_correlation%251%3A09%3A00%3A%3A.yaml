schema: oewn-learning-gloss-v2
senseId: 'nonlinear_correlation%1:09:00::'
synsetId: 06041187-n
simpleMeaning: A relationship between two variables in which a given change in one corresponds to different
  amounts of change in the other at different points.
scope: Also called curvilinear correlation and skew correlation. It is a noun.
examples:
- The data showed a nonlinear correlation between age and income.
- They found a nonlinear correlation between rainfall and crop growth.
