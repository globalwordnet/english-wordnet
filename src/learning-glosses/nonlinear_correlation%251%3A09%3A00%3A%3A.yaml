simpleMeaning: A link between things that change, in which how fast they change never stays the same.
scope: Also called curvilinear correlation and skew correlation. It is a noun.
examples:
- The data showed a nonlinear correlation between age and income.
- They found a nonlinear correlation between rainfall and crop growth.
