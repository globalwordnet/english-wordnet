simpleMeaning: Powdered or granular carbon that traps impurities on its surface. In medical care, a liquid
  mixture taken by mouth can bind certain poisons.
scope: A fine powder or grains that clean by taking in what is bad, also called activated carbon; its
  nearest kin are other powders used to clean, such as baking soda and chalk.
examples:
- Activated charcoal cleaned the water by taking in the bad taste.
- The nurse gave him activated charcoal mixed with water after he swallowed poison.
