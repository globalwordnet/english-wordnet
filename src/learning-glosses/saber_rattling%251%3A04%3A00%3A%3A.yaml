simpleMeaning: Others are made to fear that armed strength may be used, by a loud show of it.
scope: People also call this sabre rattling, a loud show of armed might that warns others it may be used.
examples:
- The saber rattling alarmed those who watched it.
- People saw the saber rattling as a warning, not as war itself.
