senseId: 'permanent_tooth%1:08:00::'
synsetId: 05314207-n
simpleMeaning: A tooth in the adult set of teeth that can last a lifetime. A full set usually has 32 teeth.
scope: Some permanent teeth replace baby teeth. Others grow behind them.
examples:
- A permanent tooth appeared in the gap where her baby tooth had been.
- His first permanent molar grew behind his baby teeth.
