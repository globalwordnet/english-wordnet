simpleMeaning: A set of ideas holding that the government should have full power over everything, with
  no limits on what it can do.
scope: Totalitarianism and absolutism are other names for it.
examples:
- Totalism holds that no part of life should be free from government control.
- Under totalism, the state claims the right to run every part of people's lives.
