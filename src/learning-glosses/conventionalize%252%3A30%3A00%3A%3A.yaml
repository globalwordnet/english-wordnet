senseId: 'conventionalize%2:30:00::'
synsetId: 00528447-v
simpleMeaning: To bring something into line with the accepted way of doing things.
scope: Also called conventionalise; this one changes the thing itself, it does not only show it in a set
  style.
examples:
- In the office, conventionalized behavior spread from desk to desk.
- The director conventionalized the ceremony, cutting out anything unusual.
