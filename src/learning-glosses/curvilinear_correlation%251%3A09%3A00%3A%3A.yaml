senseId: 'curvilinear_correlation%1:09:00::'
synsetId: 06041187-n
simpleMeaning: Any link between changing things in which the rate of change itself does not stay the same.
scope: Nonlinear correlation and skew correlation are other names for this one.
examples:
- The curvilinear correlation showed that the two measures did not move together at a steady rate.
- They found a curvilinear correlation between study time and test scores.
