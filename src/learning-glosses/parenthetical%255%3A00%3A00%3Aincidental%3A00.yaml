simpleMeaning: Describing words that explain something or limit its meaning and appear between round brackets
  or read like an aside.
scope: Added to qualify or explain, set in brackets or as if so; not a phrase set in brackets.
examples:
- Their remark was parenthetical and brief.
- The note was parenthetical in the text.
