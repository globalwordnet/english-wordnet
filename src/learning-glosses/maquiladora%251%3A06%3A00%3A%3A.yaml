simpleMeaning: A factory near Mexico's border with the United States where imported parts are assembled
  and the finished goods are shipped back across the border.
scope: A plant in Mexico near the United States border, not a plant far from the border and not a storehouse.
examples:
- She worked in a maquiladora near the border.
- The maquiladora ships its goods back over the border.
