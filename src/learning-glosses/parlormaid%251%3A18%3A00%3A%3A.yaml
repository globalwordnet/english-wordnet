simpleMeaning: A woman who works in a private house, looking after the sitting room and the meals and
  opening the door to callers.
scope: Also called a parlourmaid. It is a servant.
examples:
- The parlormaid opened the door and showed the guest into the sitting room.
- The parlormaid set the table before the family sat down to eat.
