simpleMeaning: The rate at which property loses value, used to calculate the amount deductible for tax
  purposes.
scope: It is also called depreciation rate.
examples:
- The rate of depreciation on the new machines was set at ten percent a year.
- They used the rate of depreciation to work out the tax they could claim.
