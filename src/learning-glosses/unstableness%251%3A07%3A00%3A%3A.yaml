simpleMeaning: The quality of being unsteady, and of being unable to settle on one choice.
scope: Also called instability. It is a quality, not a single act.
examples:
- The unstableness of the old bridge kept walkers away.
- The unstableness of the plan showed when the team kept changing its mind.
