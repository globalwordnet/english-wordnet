simpleMeaning: To do any job that comes up, with no plan, or to let time pass with nothing done.
scope: It is also called monkey, tinker, potter, putter, mess around, monkey around, or muck around.
examples:
- The old lady is usually mucking about in her little house.
- They spent the whole afternoon mucking about in the garden shed.
