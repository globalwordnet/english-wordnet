simpleMeaning: The particular meanings passed on by the way a person speaks, such as its tone, speed,
  and pauses.
scope: Also called paralinguistic communication. It is a kind of communication.
examples:
- The speaker's paralanguage showed anger, though the words stayed calm.
- They studied paralanguage to learn how tone changes meaning.
