simpleMeaning: A public body charged with renewing the parts of a town that have fallen into a poor state.
scope: This is the public body given the job of making a town's run-down parts new again.
examples:
- The redevelopment authority met to plan the work on the old streets.
- People in the run-down part of town waited to hear from the redevelopment authority.
