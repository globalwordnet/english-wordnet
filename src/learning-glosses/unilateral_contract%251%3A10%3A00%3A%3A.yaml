senseId: 'unilateral_contract%1:10:00::'
synsetId: 06537804-n
simpleMeaning: An agreement in which one side promises to do a thing, or to hold back from doing it, in
  return for the other side's act, not its promise.
scope: It is a kind of agreement.
examples:
- 'The store offered a unilateral contract: a free gift for the first customer who came in.'
- The worker signed the unilateral contract and then did the work it asked for.
