simpleMeaning: The outer case that holds peas. In some varieties of garden pea, the case itself is edible.
scope: 'Another name for a pea pod: the outer cover of a pea, which can be eaten in some garden peas,
  not the pea seeds inside and not the whole plant.'
examples:
- The peasecod split open to show the peas inside.
- We ate the peasecod with the peas still inside.
