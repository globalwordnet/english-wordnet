simpleMeaning: A formal expression containing variables that becomes a complete statement when constants
  replace those variables.
scope: This set form of words is not a sentence on its own, but turns into a full sentence once fixed
  words fill its blanks.
examples:
- She wrote a sentential function with x for the name.
- The sentential function waited for a fixed word to fill its blank.
