senseId: 'waistcloth%1:06:00::'
synsetId: 03442981-n
simpleMeaning: A skirt or trousers is made stronger by a band of material worn around the middle of the
  body.
scope: This is also called a sash, a waistband, a girdle, or a cincture, and it is a band, not the skirt
  or trousers themselves.
examples:
- They wore a waistcloth around the middle of the body to make their skirt stronger.
- The waistcloth kept their trousers from tearing at the top.
