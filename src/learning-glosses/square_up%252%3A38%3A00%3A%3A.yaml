simpleMeaning: To make the edges of a pile of paper straight and level in printing.
scope: Also called jog and even up. It is about paper, not about making a shape right-angled.
examples:
- The printer squared up the pile before binding the sheets.
- They squared up the stack so every edge lay straight.
