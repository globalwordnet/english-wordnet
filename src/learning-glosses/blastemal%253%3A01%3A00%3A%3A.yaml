simpleMeaning: Said of a thing that has to do with a mass of cells that can grow into a part of the body.
scope: Also called blastematic and blastemic. It is about a thing, not a grown organ.
examples:
- The blastemal mass grew larger each day.
- Blastemal cells were found in the wound.
