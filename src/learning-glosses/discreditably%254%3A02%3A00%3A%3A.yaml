simpleMeaning: In a way that brings shame, or to a shameful degree.
scope: This one is also called shamefully, disgracefully, dishonorably, ignominiously, dishonourably,
  and ingloriously.
examples:
- The student behaved discreditably by taking credit for work done by others.
- The marks were discreditably low for work that had been copied from others.
