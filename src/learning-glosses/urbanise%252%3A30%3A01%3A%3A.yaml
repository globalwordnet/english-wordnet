simpleMeaning: A person, a place, or a thing that comes into town life starts to follow its habits, its
  ways of living, and its duties.
scope: This is also called urbanize.
examples:
- People feeding birds in outdoor cafes urbanise them without knowing it.
- The new road and the shops along it urbanised the small village in a few years.
