senseId: 'ischemia%1:26:00::'
synsetId: 14189600-n
simpleMeaning: Insufficient blood flow to part of the body, caused, for example, by narrowing of a blood
  vessel or by a clot blocking it.
scope: Too little blood in one part of the body, sometimes from narrowing tubes, a clot or a blockage;
  ischaemia is another name for this sense, not a general lack of blood and not a stroke.
examples:
- Ischemia in his foot made it cold and pale.
- The doctor said the ischemia came from a narrowed blood tube.
