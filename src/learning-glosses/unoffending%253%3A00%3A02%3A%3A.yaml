simpleMeaning: Said of a person or a thing that makes no one angry or annoyed.
scope: Also called inoffensive. It is used of people and things.
examples:
- The new neighbour was unoffending, and no one had a bad word to say.
- The speaker kept every remark unoffending so the meeting stayed calm.
