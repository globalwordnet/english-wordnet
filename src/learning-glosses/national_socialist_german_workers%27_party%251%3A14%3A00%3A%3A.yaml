simpleMeaning: The Nazi Party, founded in Germany in 1919 under an earlier name and brought to power by
  Adolf Hitler in 1933.
scope: Also called the Nazi Party; the party Hitler brought to power, not any other group that sought
  power in Germany.
examples:
- The National Socialist German Workers' Party was set up in Germany after the First World War.
- Hitler led the National Socialist German Workers' Party to power.
