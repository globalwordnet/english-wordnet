simpleMeaning: The link in meaning between a part and the whole thing it belongs to.
scope: It is also called a part to whole relation.
examples:
- In meronymy, 'finger' stands as a part of the whole 'hand'.
- The book uses meronymy to show how 'wheel' is part of 'car'.
