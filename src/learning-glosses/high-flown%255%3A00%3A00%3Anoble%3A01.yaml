senseId: high-flown%5:00:00:noble:01
synsetId: 01593026-s
simpleMeaning: Of great worth in morals or in ideas, and raised above the ordinary in character and in
  how it is said.
scope: This word is also called grand, elevated, lofty, idealistic, exalted, sublime, rarefied, high-minded,
  noble-minded, or rarified.
examples:
- The speaker used high-flown words about duty and honour.
- Those high-flown ideals inspired the whole class.
