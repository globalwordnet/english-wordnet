senseId: 'typification%1:04:00::'
synsetId: 00902279-n
simpleMeaning: The act of showing what something is by treating it as an example of its kind or as a symbol
  of it.
scope: It is the act of doing this, not the form or model itself.
examples:
- The typification of the hero as a lone wanderer shaped the story.
- Typification lets a writer stand for a whole group with one figure.
