simpleMeaning: Said of a thing that has to do with a flow of electricity made by chemicals at work.
scope: Also called galvanic. It is said of a thing, not of a person.
examples:
- The voltaic cell lit the small lamp with power from its chemicals.
- A voltaic couple joins two metals in a liquid that makes power flow.
