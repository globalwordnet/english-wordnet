simpleMeaning: Someone who thinks about situations by asking the big questions of life.
scope: Also called a philosophizer. It is a person, not a set of ideas.
examples:
- The philosophiser sat quietly and thought about whether the new law was fair.
- As a philosophiser, they asked what the choice would mean for people's lives.
