simpleMeaning: An occasion when people march together to show opposition, often outside a government building.
  In the use described here, they march without a permit.
scope: Protest marches may also be held with permits. Permit rules vary from place to place.
examples:
- Hundreds joined the protest march outside the city hall.
- She took part in a protest march against the new law.
