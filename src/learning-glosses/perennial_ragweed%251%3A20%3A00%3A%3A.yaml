simpleMeaning: A coarse ragweed that grows year after year in dry, barren parts of the southwestern US
  and Mexico. Its roots spread underground.
scope: 'Also called western ragweed: a rough plant that lives for years in dry lands of the southwestern
  United States and Mexico.'
examples:
- Perennial ragweed spreads by creeping roots in dry lands.
- The perennial ragweed grows in the dry lands of Mexico.
