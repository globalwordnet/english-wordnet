senseId: 'defamer%1:18:00::'
synsetId: 10018655-n
simpleMeaning: A person who harms what others think of someone by saying or writing false things about
  them.
scope: It is also called a backbiter, a libeler, a maligner, a slanderer, a traducer, or a vilifier.
examples:
- The defamer spread lies about the mayor all over town.
- People stopped listening to the defamer once they saw the lies in the letters.
