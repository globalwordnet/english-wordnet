simpleMeaning: A large deciduous red oak of the southern and eastern US, with large oval leaves bearing
  seven to nine lobes, large acorns, and moderately hard, coarse-grained wood.
scope: Also called Quercus shumardii and Shumard oak; a red oak of the south and east United States with
  large seven- to nine-lobed leaves, large acorns and medium-hard coarse-grained wood.
examples:
- A Shumard red oak shades the front yard.
- The Shumard red oak drops large acorns each autumn.
