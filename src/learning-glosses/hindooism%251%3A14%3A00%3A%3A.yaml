simpleMeaning: Hinduism, a religion followed by most people in India and Nepal and by minority communities
  in Bangladesh and Sri Lanka.
scope: Also called Hinduism; the beliefs and ways of most people in India, Bangladesh, Sri Lanka and Nepal,
  not other faiths of those lands and not the body of Hindu belief as a whole.
examples:
- Hindooism is the main faith of most people in India.
- The old temple shows Hindooism at its height.
