simpleMeaning: A painting method that mixes pigments with water and a binder to hold the color in place,
  used for posters, murals, and stage scenery.
scope: This is a way of painting with colours mixed with water and a sticky stuff, not the painting made
  that way.
examples:
- She painted the poster in distemper.
- The stage scenery was painted with distemper.
