simpleMeaning: Stone or wood given its shape by a tool and then left alone, its surface still coarse and
  unfinished.
scope: Also called rough-cut, it names stone or wood that has been shaped and left unfinished.
examples:
- The roughhewn wood was left with no smooth finish.
- The fireplace was lined with roughhewn stone.
