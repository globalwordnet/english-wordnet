simpleMeaning: A hospital that cares for women during pregnancy and childbirth and for newborn babies.
scope: A place that cares for women in pregnancy and birth and for babies just born, not a place that
  cares for sick people in general and not a clinic for children.
examples:
- She gave birth in the maternity hospital.
- The maternity hospital cares for mothers and their new babies.
