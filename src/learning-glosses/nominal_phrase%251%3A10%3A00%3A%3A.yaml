synsetId: 06327473-n
simpleMeaning: A group of words that can function as a noun, for example as the subject or object of a
  verb.
scope: Also called nominal or noun phrase. It is a group of words, not a single word on its own.
examples:
- In the sentence, the nominal phrase 'the old house' acts as the subject.
- The teacher asked us to find the nominal phrase that served as the object of the verb.
