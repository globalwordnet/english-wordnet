simpleMeaning: Given to words that cut a person or thing down to less than their true worth.
scope: This one is also called deprecating, belittling, slighting, deprecative, deprecatory, and depreciatory,
  and it is not the other sense of this same word, about money worth going down.
examples:
- The depreciative comments made the young writer doubt the work.
- A depreciative note in the review took away from the film's good points.
