simpleMeaning: A person who treats rubber with sulfur and heat to make it stronger and springier.
scope: Also called vulcanizer. It is a worker, not a machine.
examples:
- The vulcaniser checked the rubber sheets as they came out of the heater.
- They asked the vulcaniser to mend the cracked tyre.
