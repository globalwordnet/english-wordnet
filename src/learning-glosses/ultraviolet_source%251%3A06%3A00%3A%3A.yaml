simpleMeaning: Any source of light that also gives off rays too far past violet for the eye to see.
scope: Also called ultraviolet lamp, this is any light that gives off rays too far past violet for the
  eye to see, not light the eye can see.
examples:
- The ultraviolet source in the room gave off light they could not see.
- They put the ultraviolet source where it would shine on the sample.
