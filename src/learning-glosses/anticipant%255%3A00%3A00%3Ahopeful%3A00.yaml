simpleMeaning: Said of something that shows eager waiting for what has still to come.
scope: Also called expectant or anticipative, this word describes a state of mind, not a person who looks
  ahead, which is the other sense of this word.
examples:
- There was an anticipant hush in the hall before the doors opened.
- The crowd waited in anticipant silence for the news.
