simpleMeaning: With an eager, overflowing show of feeling, especially when speaking or writing.
scope: Often used when someone's praise or excitement seems excessive.
examples:
- The reviewer wrote gushingly about the young singer's debut.
- The host spoke so gushingly about the hotel that I expected a palace.
