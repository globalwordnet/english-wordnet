simpleMeaning: Said of a person or a thing with no mark, spot, or stain on it, in body or in character.
scope: Also called unblemished and unmarred. It is used of people and things.
examples:
- The record stayed unmutilated through years of close checks.
- The old statue stood unmutilated, with every part still in place.
