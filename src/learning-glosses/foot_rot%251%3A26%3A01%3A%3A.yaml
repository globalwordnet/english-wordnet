simpleMeaning: A sickness that makes the stem or trunk of a plant go bad at the bottom.
scope: This one is about a sickness of plants, not an infection of hoofed animals.
examples:
- The farmer found foot rot on the wheat and cut the sick plants down.
- The foot rot spread through the field after the wet spring.
