senseId: 'rust_inhibitor%1:27:00::'
synsetId: 14749095-n
simpleMeaning: A substance that slows or prevents rust from forming on metal by limiting oxidation.
scope: This substance works before any red-brown layer forms, stopping oxygen from working on the metal,
  and not by taking the layer away once it is there.
examples:
- A rust inhibitor kept the red-brown layer from forming.
- The rust inhibitor kept the surface free of the red-brown layer.
