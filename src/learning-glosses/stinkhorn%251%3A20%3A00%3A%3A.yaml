simpleMeaning: In the group called Phallales, a brown-capped fungus that gives off a bad smell; it is
  one of many kinds.
scope: This sense is also called carrion fungus.
examples:
- The foul smell of the stinkhorn draws flies that carry the spores away on their feet.
- We stepped back from the smell of the stinkhorn.
