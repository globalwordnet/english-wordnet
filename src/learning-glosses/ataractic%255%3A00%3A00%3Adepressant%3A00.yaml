simpleMeaning: Makes a person feel calm and free of worry.
scope: Also called sedative, tranquilizing, tranquillising, tranquilising, tranquillizing, and ataraxic,
  this adjective is about a calming quality, not the noun sense of this word, which is a drug.
examples:
- The doctor gave them an ataractic drug to help them rest.
- The warm milk had an ataractic effect, and they soon felt calm.
