simpleMeaning: 'Words from the dead reach the living through a person who passes them on: some people
  believe this, above all.'
scope: This is the belief that the dead can reach the living, not the teaching that God exists apart from
  the world and not a care for things of the spirit.
examples:
- They believed the dead could reach them through spiritualism.
- Through spiritualism, words from the dead came to the living.
