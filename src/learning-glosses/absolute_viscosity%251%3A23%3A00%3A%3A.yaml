simpleMeaning: A measure of how hard a fluid is to move when something pushes on it.
scope: This one is also called coefficient of viscosity and dynamic viscosity.
examples:
- They measured the absolute viscosity of the oil before choosing the pump.
- The absolute viscosity of the syrup was high, so it poured slowly.
