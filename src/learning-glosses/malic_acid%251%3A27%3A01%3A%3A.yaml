simpleMeaning: An organic compound with the formula HO2CCH2CHOHCO2H. This dicarboxylic acid is made by
  living organisms, gives fruits a pleasantly sour taste and is used as a food additive.
scope: The sour-tasting fruit compound also used in foods; it is not citric acid from citrus fruit, nor
  tartaric acid.
examples:
- Malic acid gives green apples their sharp taste.
- The drink label lists malic acid as an additive.
