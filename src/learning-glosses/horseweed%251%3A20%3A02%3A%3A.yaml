simpleMeaning: A strongly scented plant of the eastern United States that grows upright year after year,
  with pointed, saw-edged leaves and loose clusters of yellowish flowers.
scope: Also called horse balm, richweed, stone-root, stone root, and stoneroot, this is a strong-smelling
  tall plant with yellowish flowers.
examples:
- Horseweed grew tall behind the barn.
- The horseweed smelled strong even from a few steps away.
