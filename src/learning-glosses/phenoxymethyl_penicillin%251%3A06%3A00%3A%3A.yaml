senseId: 'phenoxymethyl_penicillin%1:06:00::'
synsetId: 03917158-n
simpleMeaning: A crystalline form of penicillin that works much like penicillin G but is less easily broken
  down by stomach acid.
scope: This is not the older drug of its kind, though it works much like it; it stands up better to the
  acids of the stomach.
examples:
- They chose phenoxymethyl penicillin because it stands up better to the acids of the stomach.
- The phenoxymethyl penicillin formed hard, clear bits.
