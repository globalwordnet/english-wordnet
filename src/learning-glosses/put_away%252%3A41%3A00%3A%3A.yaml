simpleMeaning: To send someone to a prison, or to a place that works like one, to stay there, unable to
  go free.
scope: Also called jail, imprison, jug, lag, gaol, incarcerate, remand, immure, or put behind bars. It
  is a verb.
examples:
- The judge put away the thief for ten years.
- They put away the gang leader after the trial.
