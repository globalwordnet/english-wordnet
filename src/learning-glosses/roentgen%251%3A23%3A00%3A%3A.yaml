senseId: 'roentgen%1:23:00::'
synsetId: 13667510-n
simpleMeaning: A unit of radiation exposure. One roentgen produces one electrostatic unit of charge in
  one cubic centimeter of dry air under standard conditions.
scope: This is the unit for how much a thing is struck by rays, measured by the charge made in 1 cc of
  dry air.
examples:
- The doctor measured the dose in roentgens.
- The lab recorded the exposure as three roentgens.
