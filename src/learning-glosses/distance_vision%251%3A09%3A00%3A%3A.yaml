simpleMeaning: The power of seeing things that are 20 feet or more away from the person looking at them.
scope: This one is about seeing things far away, not things close by.
examples:
- Good distance vision lets a driver read a road sign from far away.
- The eye test first checks distance vision, then sight for things close by.
