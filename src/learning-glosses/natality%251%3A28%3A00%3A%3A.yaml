simpleMeaning: The rate of babies born alive in a place in a year, counted against every thousand people
  who live there.
scope: It is also called fertility, birthrate or birth rate, and fertility rate.
examples:
- The natality of the region rose after the new hospital opened.
- They compared the natality of two towns of the same size.
