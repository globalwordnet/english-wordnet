simpleMeaning: An aggressive cancer made of small round or oval cells with little material around their
  nuclei. It often occurs in the lungs, where it is called oat cell carcinoma.
scope: This sense is also called oat cell carcinoma.
examples:
- A small cell carcinoma grew in the lung.
- Small cell carcinomas have small round cells.
