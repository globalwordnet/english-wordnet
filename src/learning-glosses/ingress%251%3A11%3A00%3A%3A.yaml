simpleMeaning: In astronomy, the beginning of an eclipse or transit, when one object starts to move across
  the apparent edge of another.
scope: In star lore, the going of a sky body just before an eclipse; also called immersion.
examples:
- Their ingress came at dawn.
- The ingress was seen at noon.
