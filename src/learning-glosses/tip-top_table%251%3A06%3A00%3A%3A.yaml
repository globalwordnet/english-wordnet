simpleMeaning: If the flat part is swung up on its hinge, it stands upright, and the table stands on one
  leg.
scope: This is also called a tip table and a tilt-top table, and it is the one-legged kind, not the kind
  with four legs.
examples:
- They tilted the tip-top table until it stood upright.
- They swung the flat part of the tip-top table up on its hinge.
