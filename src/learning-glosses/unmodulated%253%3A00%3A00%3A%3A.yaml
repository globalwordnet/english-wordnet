senseId: 'unmodulated%3:00:00::'
synsetId: 01545800-a
simpleMeaning: A voice of this kind stays flat, never rising or falling in sound and never growing loud
  or soft.
scope: This word is used of a voice that keeps one level of sound.
examples:
- He lectured in an unmodulated voice that never rose or fell.
- The announcement came over the speaker in an unmodulated voice, flat from start to finish.
