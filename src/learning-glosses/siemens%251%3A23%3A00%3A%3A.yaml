simpleMeaning: One divided by an ohm, the unit that measures how much a thing holds current back, gives
  this unit for how well a thing lets electric current pass.
scope: This unit of conductance is also called mho, reciprocal ohm and S; it measures how easily current
  passes, not how much a thing holds it back.
examples:
- The conductance of the wire was given in siemens.
- The book lists conductance in siemens, not in ohms.
