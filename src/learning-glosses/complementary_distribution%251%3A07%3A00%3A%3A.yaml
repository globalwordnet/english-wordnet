senseId: 'complementary_distribution%1:07:00::'
synsetId: 05094871-n
simpleMeaning: In linguistics, a pattern in which related speech sounds or forms occur only in different
  contexts.
scope: Complementation is another name for this thing, which is about sounds and forms in speech.
examples:
- In the complementary distribution of two sounds, each one appears only where the other never does.
- The teacher showed how the complementary distribution works with two forms of the same word.
