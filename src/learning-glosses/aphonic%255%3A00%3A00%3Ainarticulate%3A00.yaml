senseId: aphonic%5:00:00:inarticulate:00
synsetId: 00152929-s
simpleMeaning: Said of a person who has lost the power to speak out loud after an injury or an illness,
  and can only whisper.
scope: This is also called voiceless.
examples:
- The illness left the teacher aphonic, able to do no more than whisper to the class.
- For weeks after the accident, the singer stayed aphonic and spoke only in a whisper.
