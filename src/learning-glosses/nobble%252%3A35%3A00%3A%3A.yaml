simpleMeaning: To take someone against their will to a secret location, usually to demand payment for
  their release.
scope: Also called snatch, kidnap, or abduct. It is a verb.
examples:
- They planned to nobble the rich man's son and ask for money.
- The gang would nobble travellers and hold them until money was paid.
