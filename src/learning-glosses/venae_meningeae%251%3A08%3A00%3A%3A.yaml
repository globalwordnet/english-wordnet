simpleMeaning: The membranes that cover the brain have arteries with blood vessels beside them.
scope: These are the blood vessels that run beside the arteries of the membranes round the brain, also
  called meningeal veins, not the arteries themselves.
examples:
- The surgeon saw the venae meningeae running beside the artery on the scan.
- Blood in the venae meningeae flows beside the meningeal arteries.
