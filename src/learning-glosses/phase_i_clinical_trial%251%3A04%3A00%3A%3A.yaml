simpleMeaning: A safety study of a new drug or invasive medical device in a small group of people. Drug
  studies also help identify suitable doses and when harmful effects occur.
scope: This is the first safety test, on a few people, of a new drug or a tool that enters the body, also
  called phase I, not a test on many people and not a test of a drug already in use.
examples:
- The phase I clinical trial tested the new drug on a few people.
- A phase I clinical trial checks whether a new drug is safe.
