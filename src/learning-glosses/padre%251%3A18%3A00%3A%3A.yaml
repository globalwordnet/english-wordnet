simpleMeaning: A form of address meaning “Father” for priests, especially in Catholic and Orthodox churches.
  It is often used for a military chaplain.
scope: Also called Father; a word used to speak to a priest, not the priest's own name.
examples:
- The men called the chaplain Padre.
- Padre, will you hear my confession?
