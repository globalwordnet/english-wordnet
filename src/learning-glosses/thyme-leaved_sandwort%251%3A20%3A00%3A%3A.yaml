simpleMeaning: This plant lives for one year, spreads low over the ground, comes from Europe and Asia,
  and now grows all over North America.
scope: This plant is also called Arenaria serpyllifolia, and it first came from Europe and Asia, not from
  North America.
examples:
- The thyme-leaved sandwort died after one year in the field.
- They found thyme-leaved sandwort growing low over the ground.
