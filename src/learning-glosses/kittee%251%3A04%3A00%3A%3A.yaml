simpleMeaning: A historical term for a form of torture involving severe pressure on a person's body, attributed
  in older accounts to Indigenous peoples of North America.
scope: Done by American Indians, this hurt pressed tender parts of the body hard between two boards until
  the person hurt could stand it no more.
examples:
- The prisoner dreaded the kittee and its two boards.
- They pressed the prisoner's fingers in the kittee between two boards.
