simpleMeaning: A medical treatment for certain severe psychiatric illnesses in which a controlled stimulus,
  usually electrical, produces a brief seizure.
scope: Shock therapy is another name for this care, strong jolts that bring on fits.
examples:
- The clinic offered shock treatment to its patients.
- Doctors gave shock treatment to bring on fits.
