simpleMeaning: A name for the related languages of the Mordvin peoples of Russia, Erzya and Moksha, traditionally
  grouped with the Finnic languages.
scope: Another name for this tongue is Mordva, also called Mordva language, Mordvin, Mordvin language
  and Mordvinian language; not a name for the people themselves.
examples:
- She learned Mordvinian from her grandmother.
- Mordvinian is one of the Finnic languages of Russia.
