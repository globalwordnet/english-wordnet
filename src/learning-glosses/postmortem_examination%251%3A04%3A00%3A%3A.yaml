synsetId: 00142216-n
simpleMeaning: A close look at a dead body, cutting it open to find why the person died or what a sickness
  did to it.
scope: Also called autopsy, postmortem, necropsy, post-mortem, post-mortem examination, and PM. It is
  done on a dead body, not on a living person.
examples:
- The postmortem examination showed the heart had failed.
- A postmortem examination was done to find the cause of death.
