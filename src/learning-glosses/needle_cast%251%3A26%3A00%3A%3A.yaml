simpleMeaning: A sickness that makes cone-bearing trees lose their thin leaves.
scope: Also called leaf cast and needle blight. It names a sickness, not a tree.
examples:
- The forester blamed needle cast for the pines losing their leaves.
- Needle cast turned the green branches brown by late summer.
