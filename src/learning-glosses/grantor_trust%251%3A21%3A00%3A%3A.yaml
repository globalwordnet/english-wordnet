simpleMeaning: A legal plan that moves income to a person whose tax rate is lower than the maker's, for
  ten years or more.
scope: Also called Clifford trust, this is a legal plan.
examples:
- The lawyer drew up a grantor trust for the family before the end of the year.
- The family set up a grantor trust with the help of their lawyer.
