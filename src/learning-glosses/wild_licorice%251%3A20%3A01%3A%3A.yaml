simpleMeaning: Its root has powers similar to those of true licorice, and the plant, a North American
  licorice, is similar to the true kind too.
scope: This plant is also called wild liquorice, American licorice, American liquorice, and Glycyrrhiza
  lepidota, and it is not the bedstraw with sweetish roots.
examples:
- They dug up wild licorice for its root.
- They found wild licorice growing in North America.
