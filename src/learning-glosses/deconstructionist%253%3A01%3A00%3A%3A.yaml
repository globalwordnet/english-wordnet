simpleMeaning: To do with a way of reading books that looks for the contradictions and shifting meanings
  inside them.
scope: It describes an approach to literature, not a literary work itself.
examples:
- The essay used a deconstructionist reading of the novel.
- The deconstructionist criticism in the book looks for contradictions in the text.
