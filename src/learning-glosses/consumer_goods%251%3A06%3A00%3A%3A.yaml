simpleMeaning: Things people buy to use or use up themselves, such as food or clothing.
scope: This one is about things bought to be used or used up, not things that last through years of use.
examples:
- Bread and soap are everyday consumer goods.
- The store stocks consumer goods such as food, clothes, and cleaning products.
