simpleMeaning: The loss of electrical resistance in certain materials when cooled below a critical temperature.
scope: This word names the loss of all push-back against power flow in the deep cold.
examples:
- The metal showed superconductivity once the cold grew deep enough.
- They cooled the metal until superconductivity set in.
