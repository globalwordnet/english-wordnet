simpleMeaning: A name people use for someone they know well, often a short form of the name the person
  was given at birth.
scope: Also called nickname, moniker, sobriquet, cognomen, and byname. It is a name.
examples:
- Everyone called them by the soubriquet Liz.
- The old sailor went by the soubriquet Cap.
