senseId: 'penny-pinching%1:07:00::'
synsetId: 04900720-n
simpleMeaning: Very great care with money, and a wish not to spend any of it unless it is needed.
scope: Also called thrift, parsimony, and parsimoniousness. It is a way of handling money.
examples:
- Their penny-pinching meant they never ate out.
- The family's penny-pinching saved enough for a new roof.
