simpleMeaning: Talk that goes nowhere, is silly and empty, and has nothing to do with the matter at hand.
scope: This one is also called prattle, prate, blether, and idle talk.
examples:
- The meeting was full of chin music, and nothing was decided.
- They sat through an hour of chin music about the weather and the neighbours.
