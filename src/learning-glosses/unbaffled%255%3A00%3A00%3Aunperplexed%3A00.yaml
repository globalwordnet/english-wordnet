senseId: unbaffled%5:00:00:unperplexed:00
synsetId: 01771719-s
simpleMeaning: When things that happen or things that are said go against each other, this person is not
  puzzled by them.
scope: Also called unconfused, this is the state of a person who is not puzzled, not of one who is puzzled
  by them.
examples:
- They stayed unbaffled by the two reports that said opposite things.
- The unbaffled manager sorted out the two clashing stories.
