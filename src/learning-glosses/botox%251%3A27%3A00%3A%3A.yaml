simpleMeaning: A branded nerve toxin used in tiny doses for crossed eyes, facial spasms and other neurological
  disorders involving abnormal muscle contractions. Cosmetic surgeons use it to smooth frown lines temporarily.
scope: Not other nerve poisons, nor other wrinkle treatments; also called botulinum toxin A.
examples:
- Botox smoothed her frown lines.
- Doctors use Botox in tiny amounts.
