simpleMeaning: Tending to talk about a person or thing as if they were worth less than they are.
scope: This one is also called deprecating, belittling, slighting, deprecatory, depreciative, and depreciatory,
  and it is not about money worth going down.
examples:
- The deprecative remarks made the new plan sound worthless.
- A deprecative tone in the letter took away from the team's hard work.
