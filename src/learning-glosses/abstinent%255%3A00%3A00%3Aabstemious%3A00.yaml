simpleMeaning: Holding back from what one wants, above all food and drink.
scope: This one is also called abstentious, and it is not of a person who keeps away from strong drink.
examples:
- At the feast they stayed abstinent, tasting only a little of each dish.
- They were not totally abstinent, but they held back from rich food and strong drink.
