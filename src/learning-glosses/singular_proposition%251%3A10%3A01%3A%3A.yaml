senseId: 'singular_proposition%1:10:01::'
synsetId: 92464548-n
simpleMeaning: A claim whose subject is a word that names one thing, or a general word narrowed to one
  thing by a pointing word.
scope: It is a claim.
examples:
- The singular proposition 'Socrates is wise' is about one man, not about men in general.
- In the singular proposition 'that dog is black', the words 'that dog' pick out one animal.
