senseId: 'uricosuric%3:01:00::'
synsetId: 03139490-a
simpleMeaning: Causing the body to release more uric acid in the urine.
scope: This is a substance that acts on one acid in the water the body passes, not one that cuts down
  how much of it comes out.
examples:
- The doctor gave them a uricosuric drug to help clear the acid from their body.
- They took the uricosuric pills each morning, and the acid in their water passed out more freely.
