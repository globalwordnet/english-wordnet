simpleMeaning: One of the great divisions of the ages since the earth began, usually broken into at least
  two shorter stretches.
scope: This sense is also called era.
examples:
- The dinosaurs lived in a geological era long before humans.
- They dated the fossil to a geological era millions of years ago.
