senseId: 'neon_lamp%1:06:00::'
synsetId: 03823883-n
simpleMeaning: A lamp containing neon gas at low pressure in a small tube. A high-frequency electric current
  in a coil around the tube makes the gas glow.
scope: This sense is also called neon induction lamp and neon tube, for a little gas-flow tube of neon
  under low push that shines, its light coming from high-tone flows coiled a few times about the tube.
examples:
- Neon lamps glow brightly.
- A neon lamp holds neon gas.
