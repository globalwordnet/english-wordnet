simpleMeaning: Glass with no colour in it, made from nearly pure silica, the hard white material that
  sand is mostly made of.
scope: It is also called crystal, quartz, quartz glass, and vitreous silica.
examples:
- The lechatelierite in the cabinet looked like a piece of clear glass.
- The lechatelierite showed no colour when it was held up to the light.
