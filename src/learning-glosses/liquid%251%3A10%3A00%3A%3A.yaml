senseId: 'liquid%1:10:00::'
synsetId: 07134351-n
simpleMeaning: A consonant such as “l” or “r” that can be sounded continuously, with air passing through
  the mouth without audible friction.
scope: In speech, a sound you can hold, made with no rubbing, not a thing that flows, and not the state
  of a thing that flows.
examples:
- The liquid l in love is easy to hear.
- The liquid r in her speech was soft and clear.
