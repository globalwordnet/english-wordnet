simpleMeaning: You leave behind what you once believed in, or the side you once stood with.
scope: This is also called apostatise and apostatize, and it is not merely having doubts.
examples:
- They began to tergiversate and left the side they had stood with.
- Their friends were shocked when they tergiversated.
