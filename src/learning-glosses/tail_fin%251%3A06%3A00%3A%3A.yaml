simpleMeaning: An airplane stays steady in the air thanks to this fin, standing upright at its back.
scope: Also called a tailfin, a vertical fin, a vertical stabiliser, or a vertical stabilizer, this is
  the part that stands upright at the back of an airplane, not the part of a fish and not the decoration
  on a car.
examples:
- The mechanic checked the tail fin for cracks.
- The pilot looked at the tail fin as he walked around the airplane.
