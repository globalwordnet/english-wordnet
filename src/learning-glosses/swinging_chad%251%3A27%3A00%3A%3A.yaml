simpleMeaning: A small piece of paper that has been partly punched out but remains attached at two corners.
scope: This is a piece that has come only part of the way off, not one that has come right off.
examples:
- They found a swinging chad still fixed at two corners.
- The card showed a swinging chad hanging on at two corners.
