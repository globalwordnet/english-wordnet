simpleMeaning: A tube formed where the duct from a seminal vesicle joins the sperm-carrying vas deferens.
  It passes through the prostate gland.
scope: Of the seminal duct, made by the duct from the seminal vesicle and the vas deferens, passing through
  the prostate gland.
examples:
- Ejaculatory ducts run through the prostate gland.
- The ejaculatory duct joins seed ducts.
