simpleMeaning: The act of bringing young into the world and so making more of a kind.
scope: Also called generation or multiplication. It is not the spreading of a belief or way of doing things.
examples:
- The propagation of the plants filled the garden with new shoots.
- Farmers rely on the propagation of wheat to grow more each year.
