senseId: 'grandfather_clause%1:26:00::'
synsetId: 14553214-n
simpleMeaning: An exception to a new rule based on earlier circumstances, historically used in the American
  South after the Civil War to let white people who could not read vote.
scope: This names the exception under which a right held before a new rule came in stays in place.
examples:
- The grandfather clause let him keep voting under the old rules.
- A grandfather clause in the new law kept his right to vote.
