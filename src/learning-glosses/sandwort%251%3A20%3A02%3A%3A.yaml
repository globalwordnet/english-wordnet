simpleMeaning: A herb that stays close to the ground, its small white blooms growing in bunches, each
  bloom having four petals.
scope: A low-growing herb, also called Moehringia lateriflora, is not the kind that lives on for years
  in rock gardens or the matted kind found in the mountains of Europe.
examples:
- The sandwort grew low and showed bunches of small white flowers.
- This sandwort bears small white flowers with four petals each.
