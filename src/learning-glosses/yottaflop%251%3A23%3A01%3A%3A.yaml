simpleMeaning: In computer science, a unit for measuring how fast a computer system works, equal to one
  septillion steps in arithmetic with decimal points every second.
scope: This one is also called YFLOPS, and it is a computer-science unit, not a unit from any other field.
examples:
- The new machine can reach ten yottaflops a second.
- The report gave the speed of the new system as three yottaflops.
