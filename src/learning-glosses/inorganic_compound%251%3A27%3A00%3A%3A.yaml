simpleMeaning: A chemical compound generally classed outside organic chemistry, such as a salt or mineral.
  Most contain no carbon, though some, such as carbon dioxide, do.
scope: It names a kind of chemical substance.
examples:
- Water is an inorganic compound with no carbon in it.
- Salt is an inorganic compound, not an organic one.
