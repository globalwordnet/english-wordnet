simpleMeaning: A disease of the brain and spinal cord that gets worse over time and causes shaking and
  difficulty coordinating movements.
scope: This is a sickness that slowly breaks down the nervous system, also called Parkinson's, paralysis
  agitans, shaking palsy, Parkinson's syndrome and Parkinsonism.
examples:
- Parkinson's disease makes his hands shake.
- She has Parkinson's disease and finds it hard to control her muscles.
