senseId: 'overutilization%1:04:00::'
synsetId: 00953544-n
simpleMeaning: Using something so much that the gain from each new use keeps falling.
scope: Also called overuse, overexploitation, and overutilisation. It is a kind of use.
examples:
- Overutilization of the well left the village short of water in summer.
- They blamed overutilization for the drop in the fish catch year after year.
