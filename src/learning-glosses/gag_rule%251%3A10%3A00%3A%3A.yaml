senseId: 'gag_rule%1:10:00::'
synsetId: 06679574-n
simpleMeaning: A procedure that a group which votes on things can use to stop a debate or keep it short.
scope: This sense is also called closure, cloture, and gag law.
examples:
- The chair put the gag rule into effect when the debate ran too long.
- The members voted to use the gag rule and end the debate.
