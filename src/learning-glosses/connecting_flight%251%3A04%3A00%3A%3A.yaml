senseId: 'connecting_flight%1:04:00::'
synsetId: 00302269-n
simpleMeaning: A journey by air with a stop on the way, where one gets off one plane and onto another,
  and the airline may change too.
scope: The stop and the change of plane happen inside one trip, not between two separate trips.
examples:
- Our connecting flight left two hours after we landed in Chicago.
- The connecting flight was full, so some travelers had to wait for the next one.
