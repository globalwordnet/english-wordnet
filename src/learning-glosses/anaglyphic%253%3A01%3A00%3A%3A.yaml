simpleMeaning: Said of a thing that has to do with pictures showing depth through glasses with one red
  lens and one of another colour, or their making.
scope: Also called anaglyphical, anaglyptic and anaglyptical. It is used to describe things.
examples:
- The anaglyphic image looked flat until we put on the glasses.
- The teacher used an anaglyphic print to show the class how depth can be faked.
