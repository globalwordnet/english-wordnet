simpleMeaning: In a length of thread, a soft lump or uneven patch may appear as a flaw, or be put there
  on purpose.
scope: Knot and burl are other names for this soft lump or uneven patch in a length of thread, which may
  be a flaw or made on purpose.
examples:
- The yarn had a slub where the thread grew thick.
- They kept the slub in the yarn because it was made on purpose.
