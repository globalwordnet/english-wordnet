simpleMeaning: A huge lump of stone deep in the earth, made when melted rock spread through rock that
  was already there and is believed to have gone hard.
scope: It is also called batholite, batholith, and plutonic rock.
examples:
- The geologist mapped the pluton under the valley.
- The quarry cut into the edge of the pluton.
