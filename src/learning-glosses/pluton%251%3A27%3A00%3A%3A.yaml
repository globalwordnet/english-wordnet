simpleMeaning: A large mass of rock thought to have formed when molten rock pushed into existing rock
  and hardened deep underground.
scope: It is also called batholite, batholith, and plutonic rock.
examples:
- The geologist mapped the pluton under the valley.
- The quarry cut into the edge of the pluton.
