simpleMeaning: In the suspension of some motor vehicles, a metal bar takes the place of a spring by twisting.
scope: This one gives like a spring when it twists, unlike a stiff piece of metal that cannot give at
  all.
examples:
- They set the torsion bar to make the ride less harsh.
- Over-rotating the torsion bars can make the ride harsh.
