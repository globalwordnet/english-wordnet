senseId: 'prevalence%1:24:00::'
synsetId: 13846326-n
simpleMeaning: The proportion of a population that has a disease or condition at a specified time or during
  a specified period.
scope: It is a figure from the study of diseases, not a word for how widespread a thing is.
examples:
- The prevalence of the flu was higher in the cold months than in summer.
- They worked out the prevalence of the illness in each town.
