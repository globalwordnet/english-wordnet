senseId: 'financial_forecast%1:10:00::'
synsetId: 06763228-n
simpleMeaning: A prediction of an organization's financial position, operating results, and cash coming
  in and going out, based on the conditions it expects.
scope: A reasoned guess about the money state and what will be earned and spent, not a report of past
  results and not a promise.
examples:
- The financial forecast expects profits to rise.
- Analysts set out a financial forecast for next year.
