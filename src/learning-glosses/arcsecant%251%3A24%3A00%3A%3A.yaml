simpleMeaning: 'The inverse of the secant function: it gives the angle whose secant is a given number.'
scope: 'Also called arc secant, arcsec, and inverse secant: the angle worked out from a given number,
  not the secant itself and not the angle from a different triangle ratio.'
examples:
- The arcsecant of 2 is 60 degrees.
- He worked out the arcsecant before drawing the angle.
