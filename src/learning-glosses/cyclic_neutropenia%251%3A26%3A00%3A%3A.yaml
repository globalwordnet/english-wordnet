senseId: 'cyclic_neutropenia%1:26:00::'
synsetId: 14220204-n
simpleMeaning: A fall in one kind of white blood cell, coming back again and again.
scope: This one is not about a blood count that stays low.
examples:
- The doctor found cyclic neutropenia when the blood tests kept showing the same low count.
- The nurse noted the cyclic neutropenia on the chart after the third low count.
