senseId: 'subscript%1:10:00::'
synsetId: 06833078-n
simpleMeaning: A sign or letter set a little lower than the one it goes with, just below it and off to
  one side.
scope: It is also called inferior. It is not a mark put above another mark, and it is not a mark on the
  same line.
examples:
- In H2O, the 2 is written as a subscript.
- They used a subscript to show the number of atoms in the formula.
