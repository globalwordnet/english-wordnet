senseId: 'anaphoric_pronoun%1:10:00::'
synsetId: 06336569-n
simpleMeaning: A pronoun that points back to the word it stands for.
scope: This is not one that points forward to a word that comes later in the sentence.
examples:
- In the sentence, the word 'they' is an anaphoric pronoun that stands for the workers named before it.
- They called 'it' an anaphoric pronoun because it points back to the dog in the first clause.
