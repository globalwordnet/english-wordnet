simpleMeaning: An edible crab that has recently shed its old shell and whose new shell has yet to harden.
scope: It is also called a soft-shelled crab, not one whose new cover has already formed.
examples:
- We ate soft-shell crabs.
- The soft-shell crab was still soft to the touch.
