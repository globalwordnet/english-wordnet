simpleMeaning: To give a sudden, harsh scream.
scope: People also call this one short, harsh cry a screech, a squawk, a screak, and skreigh, and it is
  not the steady high-pitched noise of the same name.
examples:
- The gull skreaked and fell silent.
- The parrot skreaked once and stopped.
