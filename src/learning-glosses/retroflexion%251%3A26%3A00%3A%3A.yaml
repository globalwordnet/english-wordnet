simpleMeaning: A bend or tilt of a body part or organ toward the back.
scope: Also called retroflection and retroversion. It is a movement, not a speech sound.
examples:
- After the birth, the doctor found a retroflexion of the uterus.
- The scan showed a retroflexion of the womb.
