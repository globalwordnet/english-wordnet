simpleMeaning: A yellow crystalline antibiotic from soil bacteria called actinomycetes, sold as Terramycin.
  It treats infections caused by various bacteria, including rickettsiae.
scope: A yellow drug from a tiny living thing in soil, also called hydroxytetracycline and oxytetracycline;
  not a pain drug and not a drug made from chemicals in a lab.
examples:
- The doctor gave her oxytetracycline hydrochloride for the infection.
- Oxytetracycline hydrochloride is used against many germ illnesses.
