senseId: 'conventionalisation%1:04:00::'
synsetId: 01162451-n
simpleMeaning: The act of making something follow the usual way of doing things, or of fitting it to the
  usual style.
scope: Also called conventionalization; this one is about an act.
examples:
- The conventionalisation of the ceremony dropped old customs one by one.
- The conventionalisation of the theatre left every play looking much the same.
