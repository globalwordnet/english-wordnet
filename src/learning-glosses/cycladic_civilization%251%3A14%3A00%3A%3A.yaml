simpleMeaning: The Bronze Age civilization of the Cyclades islands in the southern Aegean Sea, dating
  from about 3000 to 1100 BC.
scope: 'Also called the Cyclades, Cycladic civilisation and Cycladic culture: the Bronze Age civilization
  of the southern Aegean islands, distinct from later Greek ways of life.'
examples:
