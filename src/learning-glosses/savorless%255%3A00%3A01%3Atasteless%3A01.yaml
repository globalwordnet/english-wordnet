simpleMeaning: Having no taste or flavour in it, and no sharp taste either.
scope: Also called flat, bland, vapid, insipid, flavorless, flavourless, and savourless. It is an adjective.
examples:
- The savorless soup needed salt and herbs.
- The savorless bread went uneaten.
