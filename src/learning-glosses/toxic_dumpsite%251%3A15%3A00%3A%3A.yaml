simpleMeaning: Harmful rubbish can be put in this dumpsite, or has been put there, often against the law.
scope: Also called toxic waste dump and toxic waste site, this is a place for harmful rubbish, not a place
  for harmless rubbish.
examples:
- They found the toxic dumpsite where the rubbish had been left.
- The toxic dumpsite had been used against the law.
