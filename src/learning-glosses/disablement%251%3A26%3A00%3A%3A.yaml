senseId: 'disablement%1:26:00::'
synsetId: 14571935-n
simpleMeaning: The loss or limitation of the ability to do certain activities because of a physical or
  mental condition.
scope: Also called disability, impairment, and handicap. This one is about a state, not about a payment.
examples:
- The disablement left them unable to do the work they once did.
- Their disablement meant they could no longer do the things they used to do.
