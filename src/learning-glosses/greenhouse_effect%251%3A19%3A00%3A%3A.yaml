simpleMeaning: Warming that occurs when gases in the atmosphere let sunlight through but absorb heat given
  off by Earth's warmed surface.
scope: This sense is also called greenhouse warming, for warming that comes when the air holds in sun
  rays, brought on by air gases that let sunshine through but soak up heat sent back from the warmed ground.
examples:
- The greenhouse effect warms the earth.
- Greenhouse effects trap heat.
