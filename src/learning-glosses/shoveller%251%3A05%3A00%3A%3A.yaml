simpleMeaning: A duck found on fresh water in the northern half of the world, known by its broad, flat
  bill.
scope: It is also called a broadbill, a shoveler, Anas clypeata, and Spatula clypeata, and it is a duck,
  not a worker who digs with a spade.
examples:
- We saw a shoveller on the water.
- A shoveller dipped its broad bill in the water.
