simpleMeaning: A motor vehicle whose parts pass power straight to every one of the 4 round parts that
  touch the road.
scope: Also called 4WD, this one is about the vehicle itself, not the parts that pass the power.
examples:
- Their new car is a four-wheel drive, built for rough country roads.
- They bought a four-wheel drive to carry supplies across the farm.
