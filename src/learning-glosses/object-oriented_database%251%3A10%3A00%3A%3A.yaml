simpleMeaning: A store of information kept on a computer, in which the work done on each item of information
  counts as part of what that item is.
scope: It is a noun.
examples:
- The programmers moved the customer records into an object-oriented database.
- In the object-oriented database, each item of information carries the work that can be done on it.
