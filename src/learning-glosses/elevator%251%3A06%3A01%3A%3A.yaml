senseId: 'elevator%1:06:01::'
synsetId: 03286435-n
simpleMeaning: A movable surface on the tail of an aircraft that raises or lowers its nose to control
  a climb or descent.
scope: The flat part on the back wing of a plane that makes it go up or down, not a box that moves people
  up and down in a building.
examples:
- The pilot moved the elevator to lift the nose of the plane.
- Damage to the elevator made the plane hard to control.
