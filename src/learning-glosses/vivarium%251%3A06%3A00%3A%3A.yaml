simpleMeaning: Live animals and plants are kept and raised in this closed space indoors, and people watch
  them there in surroundings like those in nature.
scope: This holds animals and plants together, not fish alone and not plants alone.
examples:
- The school kept frogs and ferns in a vivarium so the children could watch them grow.
- They built a vivarium with soil, rocks, and small pools to copy the animals' home in nature.
