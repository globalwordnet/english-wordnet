simpleMeaning: In music, brass instruments sound a short, lively burst of notes.
scope: Also called flourish and fanfare, this is a short lively tune played on brass instruments, not
  a whole piece of music.
examples:
- They played a tucket on the brass instruments.
- A short tucket rang out from the brass instruments.
