simpleMeaning: Able to put thoughts into words with ease and plainly, in a way that stirs the people who
  hear them.
scope: Also called silver, fluent, eloquent, facile, and smooth-spoken. It is an adjective.
examples:
- The silver-tongued speaker kept the crowd listening for an hour.
- They praised the silver-tongued speech at the town meeting.
