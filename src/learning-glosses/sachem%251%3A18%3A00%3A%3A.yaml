simpleMeaning: A North American tribe, or several tribes joined together, has this person as its head,
  above all among the Algonquian peoples.
scope: This leader of a North American tribe or group of tribes is also called sagamore.
examples:
- The tribe followed its sachem.
- A sachem led the confederation.
