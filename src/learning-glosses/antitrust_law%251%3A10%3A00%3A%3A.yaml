simpleMeaning: A rule made by the state to keep trade free by making it illegal for one company to control
  a whole market.
scope: This one is also called antitrust legislation.
examples:
- The new antitrust law broke up the company that controlled the whole market.
- They passed an antitrust law to keep trade open to every company.
