simpleMeaning: To split a place into parts, above all parts marked out by where they lie on the land.
scope: Sectionalize is another name for this word, used when a place is split into parts marked out by
  where they lie on the land.
examples:
- The new plan will sectionalise the country.
- The plan sectionalised the country by region.
