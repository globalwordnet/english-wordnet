simpleMeaning: A citizen who gets involved in the community, for example by joining a neighborhood watch
  or helping prevent crime.
scope: This one is not a member who takes no part in the community.
examples:
- The active citizen joined the neighbourhood watch and helped patrol the streets.
- An active citizen helped organise the crime prevention meeting.
