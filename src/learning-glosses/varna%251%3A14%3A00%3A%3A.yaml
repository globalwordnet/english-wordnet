simpleMeaning: In Hinduism, the Vedic people were first split into four social groups, each split again
  into thousands of smaller groups called jatis, and this word names that split.
scope: This is the name for the original division, not for the smaller groups called jatis.
examples:
- The teacher explained how varna divided the Vedic people into four groups.
- Each varna was split again into thousands of jatis.
