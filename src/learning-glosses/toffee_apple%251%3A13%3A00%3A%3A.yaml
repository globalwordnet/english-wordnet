simpleMeaning: A sweet coat covers an apple, and the coat is usually made of browned sugar.
scope: Also called a candied apple, a candy apple, a caramel apple and a taffy apple, this is one with
  a sweet coat on it, not one with nothing on it.
examples:
- They held the toffee apple and licked its sweet coat.
- They bit into the toffee apple and tasted the sweet coat first.
