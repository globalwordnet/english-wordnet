simpleMeaning: An infestation by Schistosoma worms or the infection they cause. It is common in the tropics
  and Far East. Symptoms depend on which body part is infected.
scope: An illness caused by the Schistosoma creature, also called bilharziasis or schistosomiasis.
examples:
- Bilharzia is common near the river where children swim.
- The doctor treated him for bilharzia after the trip.
