senseId: 'obligato%1:10:02::'
synsetId: 07043068-n
simpleMeaning: A musical idea that keeps coming back, but stays in the background, never taking the lead.
scope: It is also called obbligato, spelled with two b's.
examples:
- The obligato in the second movement returns again and again, always under the main tune.
- They played the obligato softly, letting the singer stay in front.
