simpleMeaning: An antibiotic from Streptomyces erythreus, sold as Erythrocin, E-Mycin, Ethril, Ilosone,
  or Pediamycin. It works against many Gram-positive bacteria and some Gram-negative bacteria.
scope: 'Also called erythromycin, E-Mycin, Erythrocin, Ethril, or Pediamycin: a drug that kills germs,
  not a painkiller and not a drug that kills viruses.'
examples:
- The doctor gave her Ilosone for the chest infection.
- Ilosone works against many germs.
