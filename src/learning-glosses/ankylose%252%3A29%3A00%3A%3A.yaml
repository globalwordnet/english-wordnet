simpleMeaning: To grow stiff so that a joint can no longer bend or move.
scope: It is something that happens to a joint, not something a surgeon does to one.
examples:
- The joints in their fingers began to ankylose, and making a fist became hard.
- The doctor warned that the damaged joint might ankylose.
