simpleMeaning: Relating to a religious tradition that emphasizes freedom of belief and historically rejected
  the Christian doctrine of the Trinity.
scope: This word is used for that faith or what is like it, not for a person who holds to that faith.
examples:
- Unitarian ideas shaped the church.
- She held Unitarian views.
