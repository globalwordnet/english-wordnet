simpleMeaning: A substance able to change a person's mood and make things seem different from how they
  really are.
scope: It is also called a consciousness-altering drug, a psychoactive drug, or a psychoactive substance.
examples:
- The mind-altering drug left the user feeling strange for hours.
- The guide warned that the mind-altering drug could change how people saw the world.
