simpleMeaning: Sight that works in low light, as in moonlight, when the eyes have little light to work
  with.
scope: Also called night-sight, night vision, and twilight vision. It is a noun.
examples:
- Scotopic vision lets us see our way on a moonlit night.
- With scotopic vision, the stars seem bright against the dark sky.
