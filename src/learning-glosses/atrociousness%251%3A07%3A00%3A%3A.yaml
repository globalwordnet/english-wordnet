simpleMeaning: How cruel and without pity a thing is, so terrible that anyone who learns of it is shocked.
scope: Atrocity is another name for this one, and barbarity, barbarousness, and heinousness are also names
  for it.
examples:
- The atrociousness of the massacre left the whole town in shock.
- No one could speak of the atrociousness of the crime without anger.
