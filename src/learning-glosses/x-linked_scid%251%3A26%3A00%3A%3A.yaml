senseId: 'x-linked_scid%1:26:00::'
synsetId: 14152833-n
simpleMeaning: An inherited disorder, usually affecting boys, in which an altered X-linked gene disrupts
  a receptor protein that helps immune cells respond to growth signals, severely weakening immune defenses.
scope: A sickness of the body's defence system in boy children, also called X-SCID; not ADA-SCID, the
  kind that comes from a changed gene for adenosine deaminase.
examples:
- X-linked SCID affects only boy children.
- The boy with X-linked SCID has no working defence system.
