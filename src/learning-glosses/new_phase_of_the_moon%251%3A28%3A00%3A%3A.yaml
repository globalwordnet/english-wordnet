simpleMeaning: In calendars based on first sightings, the appearance of the first thin crescent as the
  Moon begins to wax.
scope: This visible crescent follows the astronomical new moon.
examples:
- In their calendar, the first sighting of a crescent marked the new phase of the moon.
- The observers looked for the new phase of the moon just after sunset.
