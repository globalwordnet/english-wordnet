simpleMeaning: A point in each month when Earth's satellite shows only a thin bright curve that grows
  wider night by night.
scope: Also called new moon. It is a noun.
examples:
- The new phase of the moon began last night, with only a thin curve of light in the sky.
- They marked the new phase of the moon on the calendar and watched it grow night by night.
