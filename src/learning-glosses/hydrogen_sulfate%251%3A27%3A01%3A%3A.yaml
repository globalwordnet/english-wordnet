simpleMeaning: A negatively charged group of atoms, HSO₄⁻, formed when sulfuric acid loses one hydrogen
  ion.
scope: Also called bisulfate. Salts such as sodium hydrogen sulfate contain this ion.
examples:
- In the formula for hydrogen sulfate, the minus sign represents its charge.
- Sodium hydrogen sulfate contains the hydrogen sulfate ion.
