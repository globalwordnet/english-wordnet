simpleMeaning: Thymine, a pyrimidine base found in DNA that pairs with adenine. RNA usually contains uracil
  in its place.
scope: This is the base seen in DNA, missing from RNA, not the body chemical made by neck glands, the
  small piece made from a DNA base, or the 20th letter, and it is also called thymine.
examples:
- T pairs with adenine in DNA.
- The chain had T where RNA would have U.
