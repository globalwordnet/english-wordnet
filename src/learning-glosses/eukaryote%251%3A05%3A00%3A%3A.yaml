synsetId: 01418267-n
simpleMeaning: An organism, such as an animal, plant, or fungus, whose cells characteristically contain
  a nucleus enclosed by a membrane, unlike bacteria and archaea.
scope: This sense is also called eucaryote, a life form whose cells match those of every life form bar
  tiny first-born life like germs — that is, a life form whose cells hold good, skin-bound cores.
examples:
- Eukaryotes hold skin-bound cores.
- The eukaryote has cells like all life forms.
