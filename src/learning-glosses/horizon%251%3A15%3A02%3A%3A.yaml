simpleMeaning: An imaginary great circle on the sphere of the sky, lying in a plane that passes through
  the visible horizon and Earth's center.
scope: A great ring on the round sky above us, not a layer of soil in the ground.
examples:
- The astronomer drew the celestial horizon on the star chart.
- The horizon of the sky passes through the centre of the Earth.
