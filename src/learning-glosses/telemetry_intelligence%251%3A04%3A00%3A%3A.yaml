simpleMeaning: Intelligence gained by intercepting and analyzing measurements transmitted remotely by
  foreign equipment.
scope: This is also called TELINT, and it is knowledge won from far-off signals, not word given freely
  by the other side.
examples:
- Analysts worked through the telemetry intelligence from the far-off signals.
- What the other side had sent out came through in the telemetry intelligence.
