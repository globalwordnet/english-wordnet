simpleMeaning: A former temporary name for nihonium, the radioactive element with atomic number 113, higher
  than uranium's.
scope: A heavy element past uranium that gives off rays, with the number one hundred and thirteen, also
  called atomic number 113, element 113, and Uut.
examples:
- Ununtrium has the atomic number 113.
- Ununtrium was made by scientists.
