simpleMeaning: The bone at the front of the skull has a raised line just above the hollow where the eye
  sits.
scope: This raised line of bone is also called superciliary arch or superciliary ridge, and supraorbital
  torus is another name for it.
examples:
- The doctor felt the supraorbital ridge above the patient's eye.
- They traced the supraorbital ridge across the front of the skull.
