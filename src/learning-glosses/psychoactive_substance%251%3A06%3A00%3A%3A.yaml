senseId: 'psychoactive_substance%1:06:00::'
synsetId: 04023531-n
simpleMeaning: A drug that can shift a person's mood and make what they see, hear, or feel seem wrong
  or untrue.
scope: Also called consciousness-altering drug, mind-altering drug, or psychoactive drug. It is a drug.
examples:
- After taking the psychoactive substance, they felt calm and then saw the walls move.
- The doctor warned them that a psychoactive substance can change how a person feels and sees things.
