senseId: 'umbilicus%1:08:00::'
synsetId: 05564228-n
simpleMeaning: A baby is joined to its mother before birth by a cord, and this is the scar left on the
  belly where that cord was joined.
scope: Also called navel, bellybutton, belly button, omphalos, and omphalus, this is the mark on the belly,
  not the cord itself.
examples:
- They argued about whether Adam had an umbilicus.
- She had a tattoo just above her umbilicus.
