simpleMeaning: A noncommissioned officer ranking below a master sergeant in the US Air Force, or historically
  in the Marine Corps.
scope: This is an officer with no commission in the air force or marines, one step below the next higher
  rank.
examples:
- They were made a technical sergeant in the air force.
- They asked the technical sergeant about the next rank.
