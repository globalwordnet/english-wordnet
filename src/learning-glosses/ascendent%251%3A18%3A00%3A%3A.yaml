senseId: 'ascendent%1:18:00::'
synsetId: 09811996-n
simpleMeaning: One of the people you come from, most often from further back in your family than your
  grandparents.
scope: Also called root, ancestor, antecedent, and ascendant, this one is a person in the family, not
  the adjective sense of this word, which is about rising.
examples:
- Their great-grandmother was an ascendent they had met.
- The old family tree listed ascendents going back many years.
