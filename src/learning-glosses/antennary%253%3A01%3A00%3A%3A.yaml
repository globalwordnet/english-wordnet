simpleMeaning: Said of a thing that is part of or about the feelers a creature uses to feel its way.
scope: Also called antennal. It is about the feelers, not the head itself.
examples:
- The antennary nerves carry signals from the feelers to the brain.
- The book describes the antennary system of the honeybee.
