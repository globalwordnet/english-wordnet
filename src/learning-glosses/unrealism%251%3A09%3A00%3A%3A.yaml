senseId: 'unrealism%1:09:00::'
synsetId: 05949587-n
simpleMeaning: A picture or work of this kind shows nothing you can touch and no single known case.
scope: This is also called abstractionism, and it names a work that pictures nothing known, not one that
  pictures known things.
examples:
- The painter's unrealism left the canvas free of any known place or face.
- Their unrealism in the play kept every scene free of known streets and names.
