simpleMeaning: The part of a living thing where spores, tiny cells that can grow into a new living thing,
  are held or made.
scope: Spore case and spore sac are other names for this part that holds or makes spores.
examples:
- Spores grow inside a sporangium.
- We found a sporangium on the plant.
