simpleMeaning: Putting a person into a dull, half-asleep state in which they notice almost nothing around
  them.
scope: It is also called narcotic or narcotising.
examples:
- The nurse gave the patient a narcotizing drug before the test.
- A narcotizing drug left the patient too dull to answer questions.
