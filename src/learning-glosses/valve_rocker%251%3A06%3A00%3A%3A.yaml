senseId: 'valve_rocker%1:06:00::'
synsetId: 04106097-n
simpleMeaning: A bar that turns on its middle point, used above all to push down the part that opens and
  shuts in a motor that burns fuel inside itself.
scope: Also called a rocker arm, this is a bar in a motor, not one that turns on a point at its end.
examples:
- The valve rocker pushed the valve down as the motor ran.
- A worn valve rocker may fail to push the valve down far enough.
