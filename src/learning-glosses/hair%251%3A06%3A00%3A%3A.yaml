simpleMeaning: Cloth woven from horsehair or camel hair, used to cover furniture or help clothing hold
  its shape.
scope: This is not the strands growing on a person's head or an animal's skin, but the woven cloth made
  from an animal's coat.
examples:
- The chair was covered in a smooth hair cloth woven from horsehair.
- The tailor chose a woven hair canvas to help the jacket hold its shape.
