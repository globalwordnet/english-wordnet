simpleMeaning: A form of iron stable at very high temperatures, from about 1,394°C up to iron’s melting
  point near 1,538°C.
scope: The form of pure iron stable from roughly 1,394°C to its melting point around 1,538°C.
examples:
- At 1,450°C, pure iron can be present as delta iron.
- Delta iron remains stable up to the melting point.
