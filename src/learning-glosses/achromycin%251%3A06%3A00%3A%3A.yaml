simpleMeaning: A brand of tetracycline, an antibiotic originally derived from Streptomyces bacteria and
  used to treat a range of bacterial infections.
scope: Also called tetracycline, this drug kills germs and is used widely to treat infections, made from
  tiny living things of the genus Streptomyces.
examples:
- The doctor gave her Achromycin for the infection.
- Achromycin comes from tiny living things of the genus Streptomyces.
