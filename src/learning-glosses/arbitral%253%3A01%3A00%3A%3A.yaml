simpleMeaning: To do with a quarrel settled by someone both sides pick to judge it, or coming from that
  settling.
scope: This word is also called arbitrational, and it is not about a dispute settled by the two sides
  on their own.
examples:
- The arbitral adjustment of the controversy pleased both sides.
- They agreed to accept an arbitral ruling on the matter.
