senseId: 'solemnization%1:04:00::'
synsetId: 00517142-n
simpleMeaning: All the set acts and words of a holy church act or other grave rite, done in the open in
  their right order.
scope: Celebration and solemnisation are other names for this public rite.
examples:
- The solemnization was held in the open, before all the people.
- The solemnization of the sacrament was carried out with all the set acts.
