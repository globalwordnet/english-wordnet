simpleMeaning: The habit, most often of a workers' union, of making a boss take on more hands than the
  work needs.
scope: This one is about a practice.
examples:
- The union's featherbedding forced the firm to keep extra staff on the payroll.
- The firm complained about featherbedding when the union demanded extra posts.
