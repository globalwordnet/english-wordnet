simpleMeaning: A court with the authority to review decisions made by lower courts or government agencies.
scope: Also called appeals court and court of appeals, this one is not where a case is first tried.
examples:
- The appellate court sent the case back to the lower judges for a new hearing.
- After months of waiting, the appellate court agreed to review the ruling.
