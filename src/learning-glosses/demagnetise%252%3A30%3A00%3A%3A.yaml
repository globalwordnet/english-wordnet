senseId: 'demagnetise%2:30:00::'
synsetId: 00401007-v
simpleMeaning: To rid a thing of the force that makes it act as a magnet, so metal no longer sticks to
  it.
scope: This one is also called demagnetize or degauss, and it is not about wiping a storage device clean.
examples:
- The worker had to demagnetise the tools before using them near the compass.
- The technician demagnetised the watch after it started running fast.
