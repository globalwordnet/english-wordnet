simpleMeaning: An unstated agreement among people that sets up the ordered life they share, in which each
  person gives up freedom in return for protection.
scope: It is an agreement.
examples:
- 'The islanders kept their social contract: each gave up freedom, and all lived under shared rules.'
- They explained the social contract as the deal by which people trade freedom for safety.
