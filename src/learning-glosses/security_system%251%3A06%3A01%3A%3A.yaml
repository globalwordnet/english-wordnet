simpleMeaning: In computing, the programs and rules that stop one computer net from reaching into another.
scope: In computing, a set of programs and rules goes by this name when it keeps computer nets apart,
  and it is not the alarm device that sounds when someone tries to break in.
examples:
- The security system kept the two computer nets apart.
- A security system stood between the two computer nets.
