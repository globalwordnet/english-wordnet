simpleMeaning: To set the sights of a gun by firing test shots, so that shots hit the mark aimed at.
scope: Also called zero. It is about a gun, not about steering a thing toward a mark.
examples:
- He zeroed in his rifle at 200 yards.
- They zeroed in the gun with a few test shots.
