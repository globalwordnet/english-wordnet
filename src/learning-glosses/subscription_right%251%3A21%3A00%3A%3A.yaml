senseId: 'subscription_right%1:21:00::'
synsetId: 13262305-n
simpleMeaning: The privilege of a person who owns shares in a firm to buy part of a new set of common
  stock before anyone else can buy it.
scope: It is not open to the public at large, and it is not the act of buying itself.
examples:
- Their subscription right let them buy the new shares before they went on sale.
- They used their subscription right to get more shares in the firm.
