simpleMeaning: A kind of check done on the skin, in which the substance thought to cause an allergy is
  put into the skin.
scope: It is also called a subcutaneous test.
examples:
- The test put a tiny amount of the substance into their skin.
- They had a test in which the substance was put into the skin.
