simpleMeaning: To take dirt away from a thing by pouring water or another liquid over it, with soap or
  a different cleaner.
scope: Also called wash, wash away, and wash out. It is an act of cleaning.
examples:
- They washed off the paint from their hands with soap and water.
- The children washed off the mud before going inside.
