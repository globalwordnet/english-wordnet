senseId: 'symbolist%1:18:01::'
synsetId: 10705336-n
simpleMeaning: A person to whom what signs stand for is clear, who can also make signs stand for other
  things.
scope: This is a person also called a symboliser or a symbolizer, not a member of an artistic movement
  that used signs to hint at ideas.
examples:
- The symbolist worked out what the sign stood for.
- The symbolist used a dove as a sign to stand for peace.
