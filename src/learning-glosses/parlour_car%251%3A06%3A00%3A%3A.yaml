simpleMeaning: A railway carriage for people travelling in the daytime, with seats of their own that cost
  more.
scope: Also called a chair car, a drawing-room car, a palace car, or a parlor car. It is a train carriage.
examples:
- They took a parlour car for the day trip and paid extra for their seats.
- The parlour car was quiet, and the seats were wide and soft.
