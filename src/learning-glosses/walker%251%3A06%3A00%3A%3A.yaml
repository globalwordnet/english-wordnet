simpleMeaning: A wheeled frame that supports a baby in an upright position and lets the baby move about
  before walking independently.
scope: A frame on small wheels that stands round a baby learning to walk, not the frame that helps old
  or ill people walk.
examples:
- The baby pushed her walker across the room.
- He put the baby in the walker so she could move about safely.
