simpleMeaning: A feeling that someone or something familiar is strangely unfamiliar. It can occur with
  certain types of epilepsy.
scope: It is a feeling about something familiar.
examples:
- They walked into their own kitchen and felt jamais vu, as if the room belonged to a stranger.
- The doctor said the jamais vu might be linked to the seizures.
