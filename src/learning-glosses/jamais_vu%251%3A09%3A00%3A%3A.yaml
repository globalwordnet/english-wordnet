senseId: 'jamais_vu%1:09:00::'
synsetId: 05692644-n
simpleMeaning: The feeling that a person or thing you know well is strange to you, sometimes felt by people
  with some forms of a disorder that brings on sudden fits.
scope: It is a feeling about something familiar.
examples:
- They walked into their own kitchen and felt jamais vu, as if the room belonged to a stranger.
- The doctor said the jamais vu might be linked to the seizures.
