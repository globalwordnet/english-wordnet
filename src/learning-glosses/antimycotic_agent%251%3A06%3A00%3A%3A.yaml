simpleMeaning: Any substance that kills off fungi or holds back their growth.
scope: Also called antifungal, antifungal agent, antimycotic, and fungicide, this one is not something
  that helps fungi grow.
examples:
- The lab tested the antimycotic agent on the mouldy sample.
- The antimycotic agent was added to the cream to kill the fungi.
