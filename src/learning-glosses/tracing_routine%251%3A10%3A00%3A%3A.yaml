synsetId: 06596712-n
simpleMeaning: A list, in time order, of each step a computer program takes as it runs.
scope: It is a kind of record, not the program itself.
examples:
- The tracing routine showed each step the program took before it stopped.
- The team ran the tracing routine to find where the program went wrong.
