simpleMeaning: A bony projection of the temporal bone just behind the ear at the base of the skull.
scope: A lump of bone behind the ear, also called mastoid bone, mastoid process, and mastoidal, not the
  ear itself and not the jaw.
examples:
- The mastoid sits just behind the ear at the base of the skull.
- The doctor pressed the mastoid to check for pain behind the ear.
