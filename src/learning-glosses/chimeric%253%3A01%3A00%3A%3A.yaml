senseId: 'chimeric%3:01:00::'
synsetId: 02704984-a
simpleMeaning: Said of a thing that is a chimera, a made-up creature with parts of different animals,
  or like one, or has to do with one.
scope: Also called chimeral and chimerical. It is an adjective.
examples:
- His Utopia is not as chimeric commonwealth but a practical improvement on what already exists.
- The plan was chimeric, a dream with no real basis.
