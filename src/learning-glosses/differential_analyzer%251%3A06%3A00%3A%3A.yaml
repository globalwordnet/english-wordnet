senseId: 'differential_analyzer%1:06:00::'
synsetId: 03198854-n
simpleMeaning: An analog computer that uses continuously varying physical quantities to solve equations
  involving rates of change.
scope: A computer built to work out sums about rates of change, not a modern computer that works with
  numbers and not a study of how people differ.
examples:
- The lab used a differential analyzer to solve the equations for the bridge.
- A differential analyzer filled one whole room in the old laboratory.
