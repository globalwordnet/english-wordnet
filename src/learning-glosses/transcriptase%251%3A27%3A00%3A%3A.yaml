simpleMeaning: This enzyme reads DNA, the cell's building plans, and makes RNA, the working copy a cell
  reads, from it.
scope: This enzyme is also called RNA polymerase, and it starts from DNA, not from RNA.
examples:
- They used transcriptase to copy the DNA into RNA.
- They added transcriptase so the DNA could be copied into RNA.
