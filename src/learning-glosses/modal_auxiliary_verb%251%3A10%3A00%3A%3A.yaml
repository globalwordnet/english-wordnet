synsetId: 06329715-n
simpleMeaning: A word that comes before a word of action, such as 'can' or 'will', and tells what the
  speaker feels about what is said.
scope: It is also called modal, modal auxiliary, or modal verb.
examples:
- In 'They can swim', 'can' is a modal auxiliary verb.
- '''Will'' is a modal auxiliary verb in ''I will help you''.'
