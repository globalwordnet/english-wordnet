simpleMeaning: To gain a lead over others, for example by scoring more points.
scope: Also called win, gain, advance, gain ground, get ahead, or make headway. It is something a person
  does.
examples:
- After defeating the Knicks, the Blazers pulled ahead of the Lakers in the battle for the number-one
  playoff berth in the Western Conference.
- They pulled ahead in the last minutes of the game.
