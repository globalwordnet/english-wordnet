simpleMeaning: An account that summarizes the totals recorded in a more detailed ledger.
scope: A set of figures that sums up a smaller book of records; not a bank book and not a single bill.
examples:
- The control account showed the totals from the sales ledger.
- She checked the control account against the smaller books.
