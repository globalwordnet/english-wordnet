simpleMeaning: A sterile preparation of antibodies from the plasma of immunized donors, used to provide
  short-term protection after possible exposure to tetanus.
scope: This sense is also called tetanus immunoglobulin.
examples:
- A tetanus immune globulin gave short-time safety.
- Tetanus immune globulins come from blood water.
