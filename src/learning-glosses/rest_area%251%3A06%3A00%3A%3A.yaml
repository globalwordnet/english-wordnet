senseId: 'rest_area%1:06:00::'
synsetId: 04027138-n
simpleMeaning: 'Drivers on a main road can pull off here for a short break: a paved patch of ground set
  aside for that purpose.'
scope: Also called rest stop, lay-by, layby and pull-off, this is a paved patch of ground beside a main
  road where drivers pull in for a short break, not a place where a car is left for a long time.
examples:
- The driver pulled into the rest area for a short break.
- A rest area gave the travellers a place to stop for a short time.
