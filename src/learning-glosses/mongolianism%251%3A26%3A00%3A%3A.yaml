senseId: 'mongolianism%1:26:00::'
synsetId: 14183105-n
simpleMeaning: An outdated, offensive term for Down syndrome, a condition caused by an extra copy of chromosome
  21. It typically causes intellectual disability, short stature, and a flatter facial profile.
scope: 'Mongolism and trisomy 21 are other names for this sense: a condition present at birth from an
  extra 21st chromosome, not an illness caught later in life.'
examples:
- Mongolianism is caused by an extra 21st chromosome.
- Doctors once used the word mongolianism for this condition.
