simpleMeaning: Its edge is jagged, with every sharp point leaning in toward the tip.
scope: Toothed, notched, serrate and serrated are other names for this edge with points tipping toward
  the far end.
examples:
- The leaf had a saw-toothed edge with points leaning toward the tip.
- The saw-toothed edge of the tool showed points leaning toward the tip.
