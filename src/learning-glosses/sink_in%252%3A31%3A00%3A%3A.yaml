simpleMeaning: To come to be understood, or to come into a person's thoughts or feelings.
scope: Also called click, dawn, penetrate, come home, fall into place, get across, and get through. It
  is a verb.
examples:
- The news took a while to sink in, but at last they understood what had happened.
- Let the idea sink in before you answer.
