simpleMeaning: The Organization of American States, which includes most countries of the Americas. It
  was founded in 1948 to promote military, economic, social, and cultural cooperation.
scope: Not the United Nations; also called the Organization of American States.
examples:
- The OAS was set up in 1948.
- Most countries of the Americas belong to the OAS.
