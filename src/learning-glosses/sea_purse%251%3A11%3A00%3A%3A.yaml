simpleMeaning: The broken waves leave a current that pulls the water back out from the shore below the
  surface.
scope: This pull of water is also called undertow, sea-poose, sea-purse, sea-puss, and sea puss.
examples:
- The sea purse pulled the water back after the wave broke.
- The sea purse ran below the surface after the waves broke.
