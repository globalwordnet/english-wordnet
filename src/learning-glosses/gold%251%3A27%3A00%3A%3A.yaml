simpleMeaning: Soft yellow metal, easily shaped into sheets or wire, forming +1 or +3 ions. Nuggets occur
  in rock and riverbeds. It resists most chemicals except chlorine and aqua regia.
scope: A yellow metal, also called Au or atomic number 79; not the colour alone, and not any other metal.
examples:
- Gold is a soft yellow metal.
- The ring is made of gold.
