senseId: 'vicious_circle%1:10:00::'
synsetId: 06768053-n
simpleMeaning: An argument that takes as true the very point it is meant to prove.
scope: It is an argument, not a chain of events that keep making things worse.
examples:
- Saying the book is true because the book says so is a vicious circle.
- They saw the vicious circle and asked for real proof.
