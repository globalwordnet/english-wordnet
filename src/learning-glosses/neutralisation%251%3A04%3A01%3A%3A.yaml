simpleMeaning: An act meant to keep a country from taking sides, or to keep it out of a war that may come.
scope: It is also called neutralization. It is not the killing of a threat.
examples:
- The neutralisation kept the small country out of the war.
- The two sides agreed to the neutralisation so that the land would stay out of the fighting.
