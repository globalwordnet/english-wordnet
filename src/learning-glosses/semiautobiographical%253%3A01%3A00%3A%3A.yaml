schema: oewn-learning-gloss-v2
senseId: 'semiautobiographical%3:01:00::'
synsetId: 02806463-a
simpleMeaning: 'Partly true and partly made up: a work that mixes events from the writer''s own life with
  invented parts.'
scope: It is used for a work built from the writer's own life and from things made up, so it is neither
  a plain life story nor pure fiction.
examples:
- Her semiautobiographical novel drew on her childhood and added scenes that never happened.
- Readers could not tell which parts of the semiautobiographical book were true.
