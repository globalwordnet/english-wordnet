simpleMeaning: A smaller rise and fall of the sea than usual, at the time of the moon's first or third
  quarter.
scope: Also called a neap. It is a kind of sea movement.
examples:
- The neap tide left the boats sitting on the mud.
- During the neap tide, the water barely rose.
