simpleMeaning: Phosphorous acid is H3PO3. The clear or yellow acid with one replaceable hydrogen and the
  formula H3PO2 is hypophosphorous acid.
scope: 'Also called hypophosphorous acid and orthophosphorous acid: a clear or yellow sour stuff, not
  the stronger phosphoric acid and not a household cleaner.'
examples:
- The chemist stored the phosphorous acid in a sealed bottle.
- The sample of phosphorous acid in the jar was yellow.
