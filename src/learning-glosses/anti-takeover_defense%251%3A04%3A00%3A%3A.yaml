simpleMeaning: Steps meant to fight off an attempt by outsiders to seize control of a company.
scope: These are steps meant to keep outsiders from seizing control of a company, not steps meant to seize
  control.
examples:
- The board adopted an anti-takeover defense after the bid arrived.
- The company's anti-takeover defense made the buyout far more costly.
