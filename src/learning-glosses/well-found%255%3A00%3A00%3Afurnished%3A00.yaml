simpleMeaning: Said of a place that has all the equipment and furnishings its use calls for.
scope: Also called well-appointed. It is said of a place.
examples:
- The well-found kitchen had a stove, an oven, and shelves full of pans.
- They moved into a well-found flat and bought nothing for it.
