senseId: 'strawman%1:10:00::'
synsetId: 07197027-n
simpleMeaning: A weak or distorted version of an argument, presented so it can be easily defeated.
scope: This sense is also called straw man, and is not the figure set up to scare birds from seeds.
examples:
- The strawman was knocked down at the first answer.
- No one took the strawman for a real claim.
