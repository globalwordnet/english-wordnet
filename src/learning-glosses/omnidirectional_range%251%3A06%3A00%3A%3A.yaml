senseId: 'omnidirectional_range%1:06:00::'
synsetId: 03852490-n
simpleMeaning: A navigation system using radio beacons that help pilots determine their position and their
  bearing relative to a beacon.
scope: A set of beacons that send out signals to tell planes where they are and which way they are headed;
  omnidirectional radio range and omnirange are other names for this sense, not a single beacon and not
  a map.
examples:
- The omnidirectional range helps planes find their exact place and bearing.
- Pilots use the omnidirectional range to learn where they are and which way to go.
