simpleMeaning: A sweet substance taken from wood or straw, put into foods for people whose bodies cannot
  handle sugar in the usual way.
scope: This one is also called wood sugar.
examples:
- The label said the biscuits were made with xylose instead of ordinary sugar.
- They baked a cake with xylose for a friend whose body cannot handle sugar in the usual way.
