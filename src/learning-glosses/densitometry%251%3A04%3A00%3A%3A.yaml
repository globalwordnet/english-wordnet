simpleMeaning: A method of measuring a material’s optical density by shining light on it and measuring
  how much passes through.
scope: This is a way of finding how much light a substance lets through, by shining light on it and finding
  how much gets through.
examples:
- Densitometry showed how much light the film let through.
- Densitometry was used to check the sample.
