simpleMeaning: To make work dull and the same over and over, or to turn it into a set routine that needs
  no fresh thought.
scope: It is also called mechanize.
examples:
- The job became mechanised after the new system took over the daily tasks.
- The work grew so mechanised that every day felt the same.
