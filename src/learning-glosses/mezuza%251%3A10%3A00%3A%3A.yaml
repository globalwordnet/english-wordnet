simpleMeaning: Passages from Deuteronomy written on parchment, rolled up, and placed in a case attached
  to the doorframe of many Jewish homes in accordance with Jewish law.
scope: This sense is also called mezuzah, for holy words from Deuteronomy written on skin paper and rolled
  in a case fixed to the doorframe of many Jewish homes, as Jewish law asks.
examples:
- A mezuza hangs on the doorframe.
- Mezuzas hold holy words.
