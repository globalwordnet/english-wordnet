simpleMeaning: An unusually high level of free hemoglobin, the oxygen-carrying protein of red blood cells,
  in the liquid part of the blood.
scope: This condition is also called haemoglobinemia.
examples:
- The test showed hemoglobinemia in the patient's blood.
- Doctors found hemoglobinemia after the transfusion.
