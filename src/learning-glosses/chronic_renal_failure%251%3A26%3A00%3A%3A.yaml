simpleMeaning: A condition that lasts a long time, in which the kidneys stop working, which can be caused
  by many different illnesses all through the body.
scope: This one is also called chronic kidney failure.
examples:
- The doctor said the renal failure had come from an illness affecting the whole body.
- An illness that spread through the whole body brought on renal failure.
