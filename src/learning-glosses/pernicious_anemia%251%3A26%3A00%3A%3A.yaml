senseId: 'pernicious_anemia%1:26:00::'
synsetId: 14190908-n
simpleMeaning: Long-term, worsening anemia often affecting older adults, linked to a lack of intrinsic
  factor, a stomach protein needed to absorb vitamin B12.
scope: This sense is also called malignant anaemia, malignant anemia and pernicious anaemia, for a long,
  worsening red-blood thinness in the old, from a lack of the stomach's factor, juice feeding vitamin
  B12 to the body.
examples:
- Pernicious anemia strikes older adults.
- Pernicious anemia comes from a lack of intrinsic factor.
