simpleMeaning: A unit used to say how heavy a thing is, the same as 100 kilograms, in the system that
  counts by tens.
scope: Centner, doppelzentner, and hundredweight are other names for it.
examples:
- The sack of grain weighed one metric hundredweight.
- Two metric hundredweight of coal came to 200 kilograms.
