senseId: 'net_curtain%1:06:01::'
synsetId: 92450647-n
simpleMeaning: A thin cloth for a window, through which light comes into the room, while people outside
  are kept from seeing in.
scope: Also called a lace curtain. It is not a heavy cloth that shuts out light.
examples:
- My grandma gave me these lovely net curtains, but I'm afraid my room is too modern for them.
- They hung a net curtain in the front room so that passers-by could not see in.
