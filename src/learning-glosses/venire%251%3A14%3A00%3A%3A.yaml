simpleMeaning: In law, a court calls a group of people to serve on juries, and the jury is picked from
  them.
scope: This is the whole group called for jury duty, also called a panel, not the jury itself.
examples:
- The venire waited in the hall while the court picked the jury.
- They were part of the venire but were not picked for the jury.
