senseId: 'short_vowel%1:10:01::'
synsetId: 92463289-n
simpleMeaning: In a language that distinguishes vowels by length, a vowel pronounced for less time than
  a long vowel.
scope: In tongues that tell long sounds from brief ones, this brief sound is one of the sounds set against
  long ones.
examples:
- She said a short vowel.
- We heard a short vowel.
