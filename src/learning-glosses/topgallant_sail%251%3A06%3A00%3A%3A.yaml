simpleMeaning: This sail hangs from a crossbar on the upper mast of a square-rigged ship.
scope: Also called topgallant, this belongs to the upper mast, not to one of the lower masts.
examples:
- They set the topgallant sail from the crossbar on the upper mast.
- The topgallant sail hung above the other sails on the ship.
