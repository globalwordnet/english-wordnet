simpleMeaning: A patch of low pressure or descending air that can cause an aircraft to lose altitude suddenly.
scope: People also call this a pocket or an air pocket, and it is not a place in the sky where a plane
  keeps its height.
examples:
- The plane hit an air hole and dropped fast before the pilot steadied it.
- Passengers felt the air hole as the plane fell without warning.
