simpleMeaning: Warming that occurs when gases in the atmosphere let sunlight through but absorb heat given
  off by Earth's warmed surface.
scope: This sense is also called greenhouse effect, for heat build-up when sun rays are caught and held
  by the air, from air gases which let sunshine pass yet take in heat thrown back from warmed earth.
examples:
- Greenhouse warming heats the earth.
- The greenhouse warming grew worse.
