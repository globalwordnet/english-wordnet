simpleMeaning: A mild form of bubonic plague, the disease that causes swollen lymph nodes.
scope: Also called ambulatory plague or pestis ambulans, this one is not the severe kind of the illness.
examples:
- Many in the town caught ambulant plague, yet the illness stayed mild.
- The ambulant plague passed from house to house, but no one grew as sick as in the bad years.
