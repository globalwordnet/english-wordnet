simpleMeaning: The earth goes once around the sun, and the time from one spring day when day and night
  match to the next such day is a year.
scope: Also called astronomical year, equinoctial year, and solar year, this is the time for one full
  round of the earth around the sun.
examples:
- They worked out the length of a tropical year.
- The tropical year ends at the next spring equinox.
