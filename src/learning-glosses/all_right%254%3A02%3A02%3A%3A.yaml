synsetId: 00015933-r
simpleMeaning: In a way that is satisfactory or good enough for the purpose.
scope: Also called okay, alright, or O.K., this one is about how something is done, not an expression
  of agreement at the start of a sentence.
examples:
- The old car still runs all right, even after so many years on the road.
- They did all right in the test, though none of them got top marks.
