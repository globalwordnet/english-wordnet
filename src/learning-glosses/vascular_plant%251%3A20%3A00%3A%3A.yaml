simpleMeaning: Tubes that move water and food around run through this green plant, as in ferns, plants
  with bare seeds, and flowering plants.
scope: This green living thing is also called a tracheophyte, not one without tubes to move water and
  food.
examples:
- They watered the vascular plant and watched the water rise up its stem.
- Water reaches the top leaves of a vascular plant through its tubes.
