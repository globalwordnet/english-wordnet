simpleMeaning: This record describes a 300th anniversary or its celebration, usually called a tercentenary.
  A triennial is an event held every three years.
scope: Tercentenary and tercentennial are other names for it.
examples:
- The town held a triennial to mark 300 years since its founding.
- A triennial brought the whole town out for a day of music.
