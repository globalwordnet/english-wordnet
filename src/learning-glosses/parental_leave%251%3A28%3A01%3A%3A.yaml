simpleMeaning: Time an employee takes away from work to care for a child or arrange for the child’s care,
  sometimes with pay.
scope: Eligibility and pay depend on local law and the employer’s policy.
examples:
- She took parental leave after her baby was born.
- His parental leave let him stay home with the twins.
