simpleMeaning: The nerve that controls several muscles that move the eyeball.
scope: Also called oculomotor, oculomotor nerve, and third cranial nerve. It is one of the cords that
  leave the brain.
examples:
- The nervus oculomotorius carries signals to the muscles that turn the eye.
- If the nervus oculomotorius is hurt, the eye cannot move as it should.
