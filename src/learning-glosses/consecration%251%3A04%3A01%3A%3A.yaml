simpleMeaning: The solemn giving of one's life or time to a purpose one holds dear, such as a service
  or a goal.
scope: It is not the making of a thing holy for God.
examples:
- His consecration to study filled his days.
- The nurse's consecration to the care of the sick shaped a whole life.
