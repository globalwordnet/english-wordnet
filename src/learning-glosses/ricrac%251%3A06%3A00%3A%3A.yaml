simpleMeaning: A pretty edge for clothes or cloth, made by folding a band of cloth back and forth in sharp
  points.
scope: This zigzag band, also called rickrack, is stitched along an edge as a pretty finish rather than
  a plain straight band.
examples:
- The edge was finished with ricrac.
- They sewed ricrac along the edge of the cloth.
