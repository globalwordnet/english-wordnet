simpleMeaning: A common condition in which blood pressure stays unusually high. A reading of 140/90 mm
  Hg or above is one widely used threshold.
scope: For a common disorder in which blood pressure stays far above normal, at 140 over 90 or more.
examples:
- His hypertension was found at a routine check-up.
- She takes pills each day for her hypertension.
