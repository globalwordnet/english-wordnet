simpleMeaning: A brand of amlodipine, a tablet that widens blood vessels, prescribed for high blood pressure
  and chest pain called angina.
scope: A drug that opens up blood tubes, also called amlodipine besylate; its near kin are the other drugs
  that open up blood tubes.
examples:
- Norvasc lowers high blood pressure.
- The doctor prescribed Norvasc for his chest pain.
