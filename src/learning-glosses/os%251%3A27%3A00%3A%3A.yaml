simpleMeaning: Osmium, a hard, brittle blue-gray or blue-black metal in the platinum group. It is the
  densest naturally occurring element under ordinary conditions.
scope: This is a hard metal of the platinum group, also called osmium, atomic number 76, not gold nor
  any light metal.
examples:
- Os is the heaviest metal known.
- The sample of Os was blue-grey.
