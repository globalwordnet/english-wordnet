simpleMeaning: A machine learning method that fits a flat boundary in a space with many or even infinitely
  many dimensions to classify data. Related versions predict numbers or perform other tasks.
scope: 'Also called a support vector machine or a support vector network: a sorting tool that draws flat
  dividing surfaces in a space with any number of measures, used for sorting, guessing numbers, or other
  jobs.'
examples:
- The SVM sorted the test results into two groups.
- We trained an SVM on the hospital data to spot sick patients.
