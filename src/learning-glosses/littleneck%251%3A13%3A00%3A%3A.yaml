simpleMeaning: A young, small hard-shell clam called a quahog. It is usually eaten raw and is an important
  and popular food in New York.
scope: 'Also called a littleneck clam: a young small clam usually eaten raw, not a grown clam and not
  an oyster.'
examples:
- We ordered a plate of littlenecks on the half shell.
- The littleneck is at its best when it is young and small.
