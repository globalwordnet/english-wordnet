simpleMeaning: In rhetoric, the use of a name that makes a thing seem less than it is.
scope: In rhetoric, this is naming a thing as less than it deserves.
examples:
- The speech used tapinosis to make the great event seem small.
- By tapinosis, they called the great hall a small room.
