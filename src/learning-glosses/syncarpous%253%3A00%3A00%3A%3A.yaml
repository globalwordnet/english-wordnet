simpleMeaning: The seed case of a flowering plant is one piece, its seed-holding parts joined into one.
scope: In flowering plants, this is the seed case, not one made of separate parts.
examples:
- The syncarpous ovary of the flower holds its seeds in one joined case.
- In the syncarpous flower, the seed-holding parts grow together into a single case.
