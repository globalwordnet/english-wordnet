senseId: unforesightful%5:00:00:improvident:00
synsetId: 01902113-s
simpleMeaning: Said of a person or a thing that takes no thought for what comes next, and looks only at
  what is close at hand.
scope: Also called short, shortsighted, and myopic. It is said of people or things.
examples:
- The unforesightful plan left no money for the winter.
- An unforesightful leader spends now and never asks what comes next.
