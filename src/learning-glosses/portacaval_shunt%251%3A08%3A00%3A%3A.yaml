simpleMeaning: A surgically created connection between the portal vein and the inferior vena cava that
  lets blood from abdominal organs bypass the liver.
scope: 'In surgery: a by-pass joining the gate vein and the lower great vein to skirt the liver.'
examples:
- Portacaval shunts bypass the liver.
- A portacaval shunt joins two veins.
