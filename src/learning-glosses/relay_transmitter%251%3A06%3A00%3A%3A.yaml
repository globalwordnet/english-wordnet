simpleMeaning: A device that sends on a signal it has picked up, after making the weak signal strong again
scope: This is a device that sends on a signal it has picked up, after making it strong again, also called
  a booster, a booster amplifier, a booster station, a relay link, or a relay station.
examples:
- The relay transmitter on the roof picked up the weak signal and sent it on strong.
- A relay transmitter halfway up the hill kept the broadcast from fading.
