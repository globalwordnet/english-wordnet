simpleMeaning: One of a set of coloured cloths, agreed by all nations, that ships use to pass messages
  between themselves.
scope: Also called code flag. It is one of a set, not a single cloth by itself.
examples:
- The ship flew a nautical signal flag to ask for help.
- They learned the nautical signal flags before their first voyage.
