simpleMeaning: A fern of North America and Europe whose underground stems and stalks yield an oily resin
  formerly used to expel tapeworms.
scope: A fern of North America and Europe whose thick stems give a sticky stuff that drives tapeworms
  out of the body.
examples:
- The male fern grows in North America and Europe.
- The male fern drives tapeworms out of the body.
