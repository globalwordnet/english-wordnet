simpleMeaning: A regulated investment company whose professional managers issue shares that investors
  can sell back. Each share represents part of a collection of different investments.
scope: This firm is also called unit investment trust, and its paid experts give out shares that buyers
  can sell back.
examples:
- He bought into a unit trust.
- The unit trust spread his money over a wide mix of money papers.
