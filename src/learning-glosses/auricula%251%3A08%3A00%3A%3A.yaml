simpleMeaning: A small bag-like part that sticks out from the front top of each upper room of the heart.
scope: Also called auricular appendage and auricular appendix, this is a part of the heart, not the yellow
  flower that is the other sense of this word.
examples:
- The auricula could be seen bulging from the top of the heart.
- Surgeons closed the small auricula after the operation on the heart.
