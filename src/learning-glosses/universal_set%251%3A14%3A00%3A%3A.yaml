simpleMeaning: In mathematics, the group that holds every thing or object that has to do with the problem
  being worked on.
scope: It is a group in mathematics, not a single thing.
examples:
- In this problem, the universal set holds every number we are working with.
- The teacher drew the universal set as a big box holding all the smaller groups.
