senseId: 'vertical_stabilizer%1:06:00::'
synsetId: 04537257-n
simpleMeaning: A plane stays steady in the air because of this upright part at its tail.
scope: Also called a tail fin, a tailfin, a vertical fin, and a vertical stabiliser, this names the upright
  part at the back of a plane, not the flat part at the tail.
examples:
- The vertical stabilizer kept the plane steady through the rough air.
- Ice on the vertical stabilizer made the plane hard to control.
