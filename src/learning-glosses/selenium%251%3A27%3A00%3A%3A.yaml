simpleMeaning: A toxic nonmetal related to sulfur and tellurium, with several forms. Its stable gray form
  conducts electricity better in light and serves in photocells. It occurs in sulfide ores.
scope: Not sulfur or tellurium, nor other poisonous nonmetals; also called Se and atomic number 34.
examples:
- Selenium is used in light cells.
- Selenium in a light cell carries more current in bright light.
