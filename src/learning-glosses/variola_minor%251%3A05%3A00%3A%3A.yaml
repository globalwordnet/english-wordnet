simpleMeaning: The type of smallpox virus that caused a milder form of smallpox. About one in a hundred
  people with this form died.
scope: Also called variola minor virus. It is the germ, not the sickness it brings.
examples:
- Variola minor killed about one in a hundred of those who caught it.
- They gave the vaccine to guard against variola minor.
