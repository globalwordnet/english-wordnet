simpleMeaning: Someone who may buy a whole firm has picked this one out as a good buy.
scope: This firm is also called target company, and it is the firm that may be bought, not the one doing
  the buying.
examples:
- The firm became a takeover target when a buyer showed interest in it.
- The takeover target drew bids from buyers.
