simpleMeaning: An extinct Jurassic bird with teeth, hollow bones, and a long feathered tail, traditionally
  considered one of the most primitive birds.
scope: Also called archaeopteryx, a long-dead early bird with teeth, from Jurassic times, its tail long
  and feathered, its bones hollow, usually thought the first bird of all.
examples:
- Archeopteryx had hollow bones.
- Archeopteryx lived in Jurassic times.
