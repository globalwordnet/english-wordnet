simpleMeaning: A strong reaction by people with pale skin who hate other races, against the steps Black
  people have won toward equal rights.
scope: Also called white backlash. It is a reaction.
examples:
- The whitelash grew after the new voting law passed.
- Many saw the whitelash as a sign that the fight for equal rights was far from over.
