simpleMeaning: A holder that keeps a tube still while it is cut or given a screw thread.
scope: Also called a pipe vise. It is a holder, not a cutter.
examples:
- The pipe clamp held the tube still while the thread was cut.
- The plumber fixed the pipe clamp around the tube before cutting it.
