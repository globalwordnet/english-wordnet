simpleMeaning: A shaped strip that runs along the top edge of the foot of a wall, a stand for a statue,
  or a raised platform.
scope: It names a part of a structure, not the whole structure.
examples:
- The painter ran a brush along the surbase where the wall meets the floor.
- The surbase on the old pedestal was carved with leaves.
