simpleMeaning: A person who puts themself down to show respect, acting as if they had no pride in themself.
scope: Also called bootlicker, groveller, fawner, groveler, and truckler, this one does not act proud.
examples:
- The new clerk was called an apple polisher for praising the boss all day.
- They all saw them as an apple polisher, always bowing to the manager.
