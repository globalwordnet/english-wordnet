simpleMeaning: A member of a secret group on horseback in the southern United States after the Civil War
  that used threats and acts of revenge.
scope: One of a secret band on horseback in the south of the United States after the Civil War who frightened
  people, also called night rider; not a soldier in the war and not a lone horseman.
examples:
- The nightrider came by dark to frighten the family.
- Nightriders burned the barn as an act of revenge.
