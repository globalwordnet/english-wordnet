simpleMeaning: The colorless fluid inside a chloroplast that surrounds its membrane structures.
scope: This is the closely packed frame with no colour inside the green part of a plant cell, not the
  tissue that holds an organ together or the mass of fungus tissue.
examples:
- The stroma filled the green part of the plant cell.
- They saw the stroma inside the green part of the cell.
