simpleMeaning: A person whose backing lets a proposal or a written request come up for talk and a vote.
scope: This is the person whose backing a proposal needs before it can be talked about or voted on.
examples:
- Without a seconder, the motion could not come up for a vote.
- The seconder backed the petition so it could be talked about.
