senseId: 'endocentric%3:00:00::'
synsetId: 00873922-a
simpleMeaning: Acting in a sentence with the same job in grammar as one of the parts inside it.
scope: It is an adjective from grammar.
examples:
- When 'three blind mice' serves as a noun, it is an endocentric construction.
- The phrase 'very old books' is endocentric because the whole phrase does the same job as 'books' alone.
