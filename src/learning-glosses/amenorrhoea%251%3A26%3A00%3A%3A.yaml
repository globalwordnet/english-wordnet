senseId: 'amenorrhoea%1:26:00::'
synsetId: 14325781-n
simpleMeaning: The stopping of the usual monthly flow of blood, or its complete absence.
scope: Also called amenia or amenorrhea, this one is the stopping itself, not a word for things to do
  with it.
examples:
- When the monthly flow did not come, the doctor noted amenorrhoea in the patient's chart.
- They asked what could cause amenorrhoea.
