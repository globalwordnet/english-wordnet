simpleMeaning: A bare patch on a surface where the top layer has been rubbed away or slowly carried off
  by wind or water.
scope: Also called fret. It is a mark on a surface.
examples:
- The worn spot on the rug showed where feet passed every day.
- They pointed to the worn spot on the chair arm.
