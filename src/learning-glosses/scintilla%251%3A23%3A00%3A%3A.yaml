senseId: 'scintilla%1:23:00::'
synsetId: 13795925-n
simpleMeaning: An amount so small that it can barely be seen or found.
scope: Also called whit, shred, iota, smidge, smidgen, smidgeon, tittle, and smidgin. It is an amount,
  not a bit of matter.
examples:
- There was not a scintilla of truth in the story.
- Not a scintilla of doubt remained after the test.
