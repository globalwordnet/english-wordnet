simpleMeaning: The power to move that a body has because of where it stands, held in store until it is
  used.
scope: It is a kind of power, also called P.E.
examples:
- The potential energy of a stone grows as it is lifted higher.
- A stretched bow holds potential energy until the arrow is let go.
