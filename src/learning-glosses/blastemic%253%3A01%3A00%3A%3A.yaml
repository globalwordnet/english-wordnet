simpleMeaning: Relating to a mass of cells that have yet to specialize and can develop into an organ or
  other body part.
scope: Also called blastemal and blastematic. It is about cells.
examples:
- The blastemic region of the embryo would later become a wing.
- They found blastemic cells in the sample from the young embryo.
