simpleMeaning: At the foot of a column, or along the floor by a wall, runs the lowest shaped strip.
scope: This sense names the lowest moulding of a column foot or of a skirting board.
examples:
- A subbase ran along the bottom of the wall.
- A new subbase was put in under the column.
