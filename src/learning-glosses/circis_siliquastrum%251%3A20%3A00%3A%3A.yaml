simpleMeaning: A small eastern Mediterranean tree, widely grown in mild climates, bearing abundant purplish-red
  flowers directly on old stems before leaves appear. Its wood is prized for thin decorative coverings.
scope: A small tree with purplish-red flowers that open before its leaves, also called a love tree, Cercis
  siliquastrum or a Judas tree.
examples:
- The Circis siliquastrum by the gate was covered in purplish-red flowers.
- We planted a Circis siliquastrum because its flowers open before the leaves.
