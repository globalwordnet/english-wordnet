simpleMeaning: A weekly holy day. Sunday is observed by most Christians and Saturday by Jews and some
  Christians. Friday is the main day for communal Muslim prayer.
scope: A day of rest and worship, Sunday for most Christians, Saturday for Jews and a few Christians,
  Friday for Muslims; not an ordinary working day.
examples:
- They kept the Sabbath holy.
- On the Sabbath the family rested and prayed.
