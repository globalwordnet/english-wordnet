simpleMeaning: A stretch of an ice hockey game in which one team has more players on the ice than the
  other team, because the other team has been punished.
scope: It is not a move to force someone to give in.
examples:
- The team was unable to capitalize on the power play.
- The crowd cheered as the power play began.
