simpleMeaning: A Eurasian thistle that lives for two years and has white hairs and pale purple flowers.
  It now grows wild in North America.
scope: Also called cotton thistle, this white hairy plant of Europe and Asia bears pale purple flowers
  and is now at home in North America.
examples:
- This woolly thistle bears pale purple flowers.
- Woolly thistle now grows wild in North America.
