senseId: 'nephrocalcinosis%1:26:00::'
synsetId: 14138936-n
simpleMeaning: A buildup of calcium in kidney tissue that can impair kidney function and may be associated
  with blood in the urine.
scope: The deposits form within the tissue of the kidney.
examples:
- The scan showed nephrocalcinosis in both kidneys.
- The doctor monitored her kidney function after the diagnosis of nephrocalcinosis.
