simpleMeaning: Congress's 1978 law establishing judicial approval procedures for foreign intelligence
  surveillance and creating the Foreign Intelligence Surveillance Court to strengthen US counterintelligence,
  separately from ordinary police surveillance.
scope: Also called FISA; the law that set up the secret spying court, not the court itself.
examples:
- The Foreign Intelligence Surveillance Act was passed in 1978.
- Under the Foreign Intelligence Surveillance Act, judges must approve the spying.
