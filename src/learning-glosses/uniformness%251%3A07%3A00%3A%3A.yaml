senseId: 'uniformness%1:07:00::'
synsetId: 04752610-n
simpleMeaning: Everything is the same all through, with no change and nothing new, until it grows dull.
scope: Also called uniformity, this is a lack of diversity, not a lively mix of different things.
examples:
- The uniformness of the long flat road made the drive feel endless.
- After weeks of the same meals day after day, their uniformness left them bored.
