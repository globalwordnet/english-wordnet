simpleMeaning: A way of eating planned for people who lack one or more of the substances the body needs
  to stay well.
scope: Also called high-vitamin diet. It is a way of eating.
examples:
- The doctor put the child on a vitamin-deficiency diet after the blood test.
- A vitamin-deficiency diet gives the child more of what the body lacks.
