simpleMeaning: The usual monthly flow of blood is missing, or it has been stopped.
scope: Also called amenorrhea or amenorrhoea, this one is the flow being gone, not the flow itself.
examples:
- The doctor asked about amenia when the monthly flow stopped.
- The young woman had amenia, and the doctor looked for the cause.
