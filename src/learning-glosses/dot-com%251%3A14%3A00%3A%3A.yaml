simpleMeaning: A company that does most of its business online using a web address ending in .com.
scope: A firm that does most of its trade on the web, with a web name ending in the letters c, o and m,
  also called dot com and dot com company; not a shop on a high street and not a firm that only puts adverts
  on the web.
examples:
- The dot-com sold books only on the web.
- Many dot-coms failed in 2001.
