simpleMeaning: A nickname for the U.S. Department of State, whose headquarters is in a low-lying part
  of Washington near the Potomac River.
scope: This name stands for the United States Department of State, not the low-lying area of Washington
  itself.
examples:
- Foggy Bottom announced new talks with the foreign minister.
- The statement came from Foggy Bottom yesterday.
