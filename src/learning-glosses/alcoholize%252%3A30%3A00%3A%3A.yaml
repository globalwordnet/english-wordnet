senseId: 'alcoholize%2:30:00::'
synsetId: 00139549-v
simpleMeaning: To cause something to contain alcohol, for example by fermentation.
scope: Also called alcoholise. It is about a change within the thing, not drink added from outside.
examples:
- The cider will alcoholize if left in the warm.
- They alcoholize the plums for the winter.
