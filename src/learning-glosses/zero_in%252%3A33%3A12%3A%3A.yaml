simpleMeaning: To guide a thing straight to a mark or goal, above all with machines that steer it on their
  own.
scope: Also called home in and range in. It is not about a gun's sights.
examples:
- The missile zeroed in on its target.
- The plane zeroed in on the runway with the help of its automatic controls.
