simpleMeaning: A sale of property for a price the seller and the buyer settle between them, with no agent
  in between.
scope: It is not a sale through an agent.
examples:
- They bought the house by private treaty, with no estate agent involved.
- The farm was sold by private treaty after the auction failed.
