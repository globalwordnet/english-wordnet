simpleMeaning: In physics, a way of thinking that tries to show the four basic powers that move and hold
  things are all tied together.
scope: In physics, this is a way of thinking that tries to show the four basic powers are tied together,
  not a proof that they are one.
examples:
- According to supersymmetry, each force came out on its own during the big bang.
- They worked on supersymmetry to join the four basic powers.
