simpleMeaning: This waterway still carries the tide's rise and fall far from the sea.
scope: Also called tidal river, tidewater river, and tidewater stream, this is not a waterway the tide
  never reaches.
examples:
- The tidal stream carried the tide far upstream.
- They rowed up the tidal stream while the tide still ran with them.
