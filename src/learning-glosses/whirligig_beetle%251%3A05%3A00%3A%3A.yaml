simpleMeaning: A beetle that lives in water and swims round in fast circles on the surface.
scope: This aquatic creature circles rapidly on the water's surface, not under it and not on dry land.
examples:
- On the still surface of the pond, a whirligig beetle spun in tight circles.
- They watched the whirligig beetle race across the water, turning in quick loops.
