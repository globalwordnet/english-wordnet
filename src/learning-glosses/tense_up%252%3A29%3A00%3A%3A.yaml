simpleMeaning: A person grows stiff, uneasy, nervous and afraid because of this.
scope: This is also called tense or strain, and it is not the act of growing stiff.
examples:
- They got a phone call from their lawyer that tensed them up.
- The news tensed them up and left them uneasy.
