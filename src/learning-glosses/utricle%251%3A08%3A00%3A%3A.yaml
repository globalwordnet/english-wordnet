simpleMeaning: A small pouch in the inner ear into which the semicircular canals open.
scope: Also called utriculus. It is a pouch, not a tube.
examples:
- Fluid in the utricle can make the room seem to spin.
- When the head tilts, the utricle helps the brain keep track of the movement.
