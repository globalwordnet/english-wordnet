simpleMeaning: To make a joint stiff by operating on it, leaving it unable to bend or move.
scope: It is something a surgeon does to a joint, not something that happens to a joint on its own.
examples:
- The surgeon decided to ankylose the damaged joint.
- The surgeon ankylosed the wrist joint.
