simpleMeaning: A personality questionnaire based on Hans Eysenck's analysis of three basic factors, especially
  extraversion versus introversion and neuroticism, the tendency to experience emotional distress.
scope: A set of questions a person answers about themselves, from Hans Eysenck's study of character, also
  called Eysenck Personality Inventory; it measures character.
examples:
- She filled in the EPI as part of the study.
- The EPI asks people to answer questions about themselves.
