senseId: 'anaglyptical%3:01:00::'
synsetId: 02630256-a
simpleMeaning: Said of pictures that seem deep through red and green glasses, and of the art of making
  such pictures.
scope: Also called anaglyphic, anaglyphical and anaglyptic. It is used to describe things.
examples:
- The anaglyptical poster seemed flat until we wore the glasses.
- An anaglyptical image needs two coloured lenses to show its depth.
