simpleMeaning: Between pH 3.0 and 4.6, this dye is useful for showing whether something is an acid or
  a base.
scope: This is also called bromophenol blue or bromphenol blue, and it works only between pH 3.0 and 4.6,
  not at every pH.
examples:
- They added tetrabromo-phenolsulfonephthalein to the mixture to see whether it was an acid or a base.
- They use tetrabromo-phenolsulfonephthalein when the pH lies between 3.0 and 4.6.
