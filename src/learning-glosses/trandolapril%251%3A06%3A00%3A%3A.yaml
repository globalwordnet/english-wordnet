simpleMeaning: After a heart attack, or to treat high blood pressure, some people are given this drug,
  which blocks ACE, a body chemical that raises blood pressure.
scope: This drug is also called Mavik, and it is not given to everyone.
examples:
- After the heart attack, they were given trandolapril.
- They take trandolapril to keep their blood pressure down.
