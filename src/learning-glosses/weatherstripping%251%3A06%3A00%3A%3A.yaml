simpleMeaning: Thin material in a band that seals the gap around a door or a window against the cold.
scope: Also called weather strip, weather stripping and weatherstrip. It is a band of material, not the
  door or window it seals.
examples:
- They replaced the weatherstripping on all the windows.
- New weatherstripping stopped the cold air from coming in.
