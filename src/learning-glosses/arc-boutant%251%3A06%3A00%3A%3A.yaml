simpleMeaning: A buttress set apart from the main building, with an arch joining it to the building.
scope: Also called a flying buttress, this one is not pressed against the main building.
examples:
- The old church is held up by an arc-boutant on each side.
- They repaired the arc-boutant that holds the high wall steady.
