simpleMeaning: In South Pacific islands above all, some things may not be put to everyday use.
scope: People also call this taboo, and it is not a ban that comes from social custom.
examples:
- The old stone was tabu, and no one would touch it.
- The spring was tabu, and people kept away from it.
