simpleMeaning: A style of printed letters in which every letter takes up the same amount of space, like
  the letters made by a typewriter.
scope: It is also called a constant-width font, a fixed-width font, or a typewriter font.
examples:
- The old report was typed in a monospaced font.
- A monospaced font gives every letter the same width on the page.
