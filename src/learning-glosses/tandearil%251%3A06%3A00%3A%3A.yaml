simpleMeaning: A brand name for an anti-inflammatory drug used to treat arthritis and bursitis, inflammation
  of the small fluid-filled sacs near joints.
scope: Also called oxyphenbutazone; a drug that fights swelling, used for sore joints and swollen joint
  sacs.
examples:
- Tandearil eased the swelling in her joints.
- The doctor gave him Tandearil for arthritis.
