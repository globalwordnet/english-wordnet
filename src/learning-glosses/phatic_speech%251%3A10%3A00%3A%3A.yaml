simpleMeaning: Everyday talk used to show friendliness rather than to pass on facts.
scope: Also called phatic communication. It is a kind of talk.
examples:
- At the party, guests used phatic speech to greet each other and be friendly.
- The phatic speech at the start of the meeting shared no news at all.
