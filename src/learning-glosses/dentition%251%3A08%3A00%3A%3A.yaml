simpleMeaning: The kinds, numbers, and ways teeth are placed in a person or an animal, taken together.
scope: This one is also called teeth, and it is not about baby teeth coming through the gums.
examples:
- The dentition of the dog showed teeth of many sizes set in neat rows.
- The dentition of the horse was drawn in the book, tooth by tooth.
