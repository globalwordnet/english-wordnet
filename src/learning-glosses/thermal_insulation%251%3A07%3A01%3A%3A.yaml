senseId: 'thermal_insulation%1:07:01::'
synsetId: 92423938-n
simpleMeaning: Heat passes less easily between things that touch, or between things close enough for heat
  given off to reach them.
scope: It is the lessening of heat passing between things, not the heat itself.
examples:
- They added thermal insulation to the walls to keep the house warm.
- Good thermal insulation means less heat escapes.
