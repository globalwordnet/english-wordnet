simpleMeaning: Part of a suit, this jacket for men ends at the hips, with a back that hangs straight.
scope: This sense names a man's suit jacket that ends at the hips, with a straight back, rather than a
  long overcoat.
examples:
- A sack coat was worn with the suit.
- The sack coat was buttoned up.
