simpleMeaning: From eastern Asia and North America, this avens is a plant covered with fine hairs and
  bearing gold flowers.
scope: Also called Geum macrophyllum, this one bears gold flowers and is not the upright bush with deep
  gold flowers of Europe.
examples:
- They found yellow avens growing along the stream in the mountains.
- The yellow avens in the garden had fine hairs on its stems and gold flowers.
