senseId: 'sensualize%2:36:00::'
synsetId: 01684368-v
simpleMeaning: To give a thing, in a painting or a statue, a form that rests wholly on flesh and matter.
scope: Carnalize is another name for this sense; it keeps a thing in a painting or a statue to flesh and
  matter, and is not a lowering of it through base pleasures, nor a claim that it comes from the senses.
examples:
- The painter would sensualize every figure they drew.
- In the new work, the artist chose to sensualize the scene.
