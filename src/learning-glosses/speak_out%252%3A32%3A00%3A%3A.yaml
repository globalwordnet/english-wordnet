simpleMeaning: To voice one's views plainly for all to hear, without fear and without holding back.
scope: Also called opine, animadvert, sound off, and speak up. It is a verb.
examples:
- They spoke out against the new rules at the staff meeting.
- The workers spoke out when the manager asked for views.
