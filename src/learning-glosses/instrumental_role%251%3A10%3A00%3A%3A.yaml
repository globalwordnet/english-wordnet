senseId: 'instrumental_role%1:10:00::'
synsetId: 06343724-n
simpleMeaning: In language, the role of what someone uses to perform an action or start a process, usually
  a nonliving thing.
scope: It is also called an instrument.
examples:
- The knife has the instrumental role in 'Cut the bread with a knife'.
- The hammer takes the instrumental role in 'Hit the nail with a hammer'.
