simpleMeaning: Describing moral or intellectual values that are noble, and a nature or style raised above
  the ordinary.
scope: This word is also called grand, elevated, lofty, idealistic, exalted, sublime, rarefied, high-flown,
  noble-minded, or rarified.
examples:
- The new leader holds high ideals and refuses to lower them for gain.
- Their talk showed a high sense of duty and honour.
