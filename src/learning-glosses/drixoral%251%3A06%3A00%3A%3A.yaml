simpleMeaning: A brand of cold and allergy medicine used to relieve upper respiratory congestion. The
  original formula combined an antihistamine with a decongestant that narrows blood vessels.
scope: 'Sold as Drixoral: a drug for a blocked nose and throat, made of three parts that stop over-reaction,
  open the airways, and narrow the blood tubes, not a drug made of one part alone.'
examples:
- He took Drixoral for his blocked nose.
- Drixoral helped her breathe through the cold.
