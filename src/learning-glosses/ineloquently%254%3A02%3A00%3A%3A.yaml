simpleMeaning: In a way that lacks smooth speech, using words that come out halting and hard to grasp.
scope: It is also called inarticulately.
examples:
- The new pupil spoke ineloquently, and the class strained to catch the sense.
- The speaker began ineloquently, with long pauses between short bursts of words.
