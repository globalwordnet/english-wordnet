simpleMeaning: A locoweed of the southwestern United States that grows in tufts and has purple flowers
  or flowers ranging from pink to white.
scope: A tufted weed of the southwestern United States, also called purple loco; not a tall bush and not
  a plant grown for food.
examples:
- The purple locoweed grows in tufts in the southwestern United States.
- Purple locoweed bears flowers of a deep blue-red or pink to white colour.
