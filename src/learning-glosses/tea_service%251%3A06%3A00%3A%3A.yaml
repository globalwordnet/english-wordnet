simpleMeaning: A set of cups, plates, and pots, made of thin white clay or of silver, for giving out a
  hot drink made by soaking dried leaves in hot water.
scope: Also called tea set. It is a set, not one cup on its own.
examples:
- They set out the tea service for the guests.
- The tea service was a gift from their grandmother.
