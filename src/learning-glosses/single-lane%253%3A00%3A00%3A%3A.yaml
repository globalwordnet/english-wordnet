senseId: 'single-lane%3:00:00::'
synsetId: 02229031-a
simpleMeaning: A road where cars going both ways share one strip, so one must pull off when two meet to
  let the other pass.
scope: This names a road with one strip for traffic in both directions.
examples:
- Cars met on the single-lane road, and one pulled off to let the other pass.
- They drove along a single-lane road.
