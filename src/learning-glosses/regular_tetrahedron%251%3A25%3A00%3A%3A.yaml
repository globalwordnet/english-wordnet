simpleMeaning: a solid shape with four flat faces, each a triangle with three sides the same length
scope: It sits beside the cube and the other solids whose faces are all the same shape and size.
examples:
- The teacher held up a regular tetrahedron and asked the class to count its faces.
- Each face of the regular tetrahedron was a triangle with three equal sides.
