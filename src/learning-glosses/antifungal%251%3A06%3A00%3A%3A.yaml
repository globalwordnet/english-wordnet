senseId: 'antifungal%1:06:00::'
synsetId: 02723112-n
simpleMeaning: Anything that kills the tiny living things that grow as mould or mushrooms, or stops them
  growing.
scope: Also called antifungal agent, antimycotic, antimycotic agent, and fungicide, this one is not something
  that lets mould or mushrooms grow.
examples:
- The doctor gave the patient an antifungal to clear the infection on the foot.
- They spread the antifungal cream on the rash to stop it spreading.
