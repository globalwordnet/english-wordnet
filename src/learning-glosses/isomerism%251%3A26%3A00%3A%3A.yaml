simpleMeaning: The way compounds with the same kinds and numbers of atoms can have different structures,
  together with the differences in their chemical and physical properties that can result.
scope: The state of being an isomer and the facts that go with such stuffs, not the stuff itself and not
  a change in weight.
examples:
- Isomerism lets one stuff take several shapes.
- The book explains isomerism with the two forms of butane.
