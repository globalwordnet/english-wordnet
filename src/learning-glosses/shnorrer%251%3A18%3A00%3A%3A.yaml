simpleMeaning: A Yiddish word for someone who takes advantage of other people's generosity, repeatedly
  asking for money, food, or favors.
scope: Also called schnorrer. It is a noun.
examples:
- The shnorrer came round every day for a free meal.
- The neighbors grew tired of the shnorrer asking for money.
