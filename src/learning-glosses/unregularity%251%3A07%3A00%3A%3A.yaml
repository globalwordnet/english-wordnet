senseId: 'unregularity%1:07:00::'
synsetId: 04777450-n
simpleMeaning: Without a fixed rule or steady rate, with uneven gaps between occurrences.
scope: This state is also called irregularity, and it is not a steady course that keeps to one rule.
examples:
- The unregularity of the bus times made it hard to plan the day.
- They complained about the unregularity of the rain, which came in bursts weeks apart.
