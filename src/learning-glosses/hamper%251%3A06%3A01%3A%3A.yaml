senseId: 'hamper%1:06:01::'
synsetId: 04188289-n
simpleMeaning: A restraint that limits freedom of movement, especially something used to hold a prisoner.
scope: A thing that keeps a person from going free, also called a bond and a shackle, and not a basket
  for food or clothes.
examples:
- The heavy chains acted as a hamper on the prisoner.
- The account describes the iron fetter as a hamper on the prisoner's movements.
