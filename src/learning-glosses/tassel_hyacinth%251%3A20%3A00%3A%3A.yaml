simpleMeaning: A large Mediterranean hyacinth with a tuft of blue-violet flowers above its fertile flowers.
  The tuft's flowers have fringed petals and produce no seeds.
scope: Of a big fair Mediterranean kind with barren blue-violet blooms whose fringed cups form a tuft.
examples:
- A tassel hyacinth bloomed blue.
- Tassel hyacinths form tufts.
