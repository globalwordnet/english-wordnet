simpleMeaning: A title the pope awarded before 1968 to senior clergy and to people outside the clergy,
  usually from prominent Italian noble families.
scope: This is a court title, not a job, given by the Pope before 1968 to high church leaders and lay
  folk, most often from famed Italian noble houses.
examples:
- A Papal Chamberlain attended the Pope in his private rooms.
- Papal Chamberlains were often drawn from prominent Italian families.
