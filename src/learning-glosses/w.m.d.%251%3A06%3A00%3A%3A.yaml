simpleMeaning: An abbreviation for weapon of mass destruction, such as a nuclear, chemical, or biological
  weapon capable of causing widespread harm to civilians and military personnel.
scope: 'Also called weapon of mass destruction and WMD: a weapon that kills or harms ordinary people as
  well as soldiers, such as nuclear, chemical and germ weapons.'
examples:
- The army feared the use of W.M.D.
- W.M.D. kill ordinary people as well as soldiers.
