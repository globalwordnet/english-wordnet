simpleMeaning: The Samoyedic branch of the Uralic language family, spoken by Indigenous peoples of northwestern
  Siberia.
scope: Samoyed, Samoyed language and Samoyedic language are other names for this sense, and it is set
  apart from the dog breed and the people of the same name by being the tongues those people speak.
examples:
- Samoyedic is one of the Uralic tongues of northwestern Siberia.
- The people of that name speak Samoyedic in northwestern Siberia.
