simpleMeaning: The habit of behaving like a person of higher rank than one really is.
scope: Also called uppishness. It is a way of behaving, not a rank.
examples:
- The uppityness of the new clerk showed in sharp words to the waiter.
- The guest's uppityness showed in the sharp tone used with the waiter.
