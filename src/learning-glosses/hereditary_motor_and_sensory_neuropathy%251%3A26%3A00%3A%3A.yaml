senseId: 'hereditary_motor_and_sensory_neuropathy%1:26:00::'
synsetId: 14232069-n
simpleMeaning: Inherited nerve disease often starting young, weakening and wasting lower-leg and hand
  muscles. It usually progresses slowly and lifespan can be normal. Some forms are X-linked.
scope: Also called Charcot-Marie-Tooth disease. Different forms can run in families in different ways.
examples:
- She was diagnosed with hereditary motor and sensory neuropathy after she began tripping and could no
  longer open jars.
- Hereditary motor and sensory neuropathy is passed down through families, so her siblings were offered
  genetic testing.
