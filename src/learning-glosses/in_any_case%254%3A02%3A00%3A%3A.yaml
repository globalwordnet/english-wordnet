synsetId: 00026948-r
simpleMeaning: Used to add a point that makes plain or backs up what was just said.
scope: Also called anyway, anyhow, anyways, at any rate and in any event.
examples:
- I don't know how it started; in any case, there was a brief scuffle.
- In any case, the meeting will go ahead.
