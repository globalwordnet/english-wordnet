simpleMeaning: How many lives end in a place each year, for every thousand people who live there.
scope: This one is also called death rate, fatality rate, mortality, and mortality rate.
examples:
- The deathrate in the city dropped over ten years.
- The report gave the deathrate for each part of the country.
