simpleMeaning: The colour of living tissue, from the colouring matter in it.
scope: This sense is a colour, not the laying down of colouring matter in animals, plants, or people.
examples:
- The pigmentation of the frog's skin helps it hide among leaves.
- Doctors noted the odd pigmentation of the patient's skin.
