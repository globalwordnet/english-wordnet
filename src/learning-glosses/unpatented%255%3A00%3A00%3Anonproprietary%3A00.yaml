senseId: unpatented%5:00:00:nonproprietary:00
synsetId: 01113493-s
simpleMeaning: Said of tools and ways of making things, this means no legal paper gives the maker the
  sole right to make or sell them.
scope: This word is used of tools and ways of making things with no protection, not of those kept for
  one maker alone.
examples:
- The unpatented inventions were free for any firm to build.
- They left the design unpatented so others could use it without paying.
