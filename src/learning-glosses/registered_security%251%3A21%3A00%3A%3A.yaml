synsetId: 13361594-n
simpleMeaning: the firm that put it out writes the owner's name in its books, or its agent does, and the
  paper stands for money put in
scope: Unlike a paper that passes from hand to hand with no name on it, this paper has its owner's name
  written in the books of the firm that put it out or of its agent.
examples:
- The registered security was listed under the owner's name in the firm's books.
- A registered security can be traced to its owner through the books.
