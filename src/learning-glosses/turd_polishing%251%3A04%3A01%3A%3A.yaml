simpleMeaning: A vulgar expression for trying to make something fundamentally poor seem impressive or
  appealing.
scope: This is the act of trying to make something weak look strong, not making it strong in fact.
examples:
- Calling it a fresh start was turd polishing on a failed plan.
- More turd polishing will not turn a weak idea into a strong one.
