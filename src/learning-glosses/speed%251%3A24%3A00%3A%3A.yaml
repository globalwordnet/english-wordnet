simpleMeaning: A measure of how much light a camera lens can admit, expressed as the ratio of its focal
  length to its effective aperture diameter.
scope: A number describing a camera lens, not the rate of movement or a stimulant drug.
examples:
- A lens with a speed of f/1.8 gathers a lot of light.
- Photographers pick a lens speed to suit the available light.
