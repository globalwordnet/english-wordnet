simpleMeaning: A poisonous salt with dark purple crystals that turn water reddish purple. It serves as
  an oxidizer, bleach, disinfectant, and antiseptic.
scope: 'Also called permanganate of potash: a poisonous purple salt used to bleach and kill germs, not
  common table salt.'
examples:
- Potassium permanganate turned the water purple-red.
- The nurse used potassium permanganate to clean the wound.
