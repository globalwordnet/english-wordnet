simpleMeaning: In the supplied source, the ability to buy now and pay later on trust, usually called credit.
  A debenture is a formal acknowledgment of debt.
scope: This one is also called a debenture bond or an unsecured bond, and it is not the paper that says
  a sum is owed.
examples:
- The debenture let the buyer take the goods home and pay for them later.
- The shop offered debenture to customers it trusted, and they paid after taking the goods home.
