simpleMeaning: A sloth that is small for its kind and moves quickly, with two long claws on every front
  foot.
scope: Two-toed sloth, unai, and Choloepus didactylus are other names for it. It is the small, fast-moving
  kind, not the Central American kind with three long claws on its hind feet.
examples:
- The unau hung from the branch, its long claws curled round the wood.
- An unau moved across the forest floor faster than the guide had expected.
