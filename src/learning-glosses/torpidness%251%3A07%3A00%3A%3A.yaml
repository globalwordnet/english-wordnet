senseId: 'torpidness%1:07:00::'
synsetId: 04644238-n
simpleMeaning: Dullness and a lack of strength leave one doing little and moving slowly.
scope: Also called torpor, listlessness, or torpidity, this is not a state in which feeling itself is
  partly cut off, but a state of doing little.
examples:
- The torpidness kept them from starting the work.
- They fought the torpidness and got up to walk.
