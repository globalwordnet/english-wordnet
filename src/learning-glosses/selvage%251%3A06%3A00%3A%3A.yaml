senseId: 'selvage%1:06:00::'
synsetId: 04177994-n
simpleMeaning: Where the weave itself holds the threads of a piece of cloth fast, so the side cannot come
  apart.
scope: Also called selvedge, this names the woven edge of cloth that does not come apart, unlike the other
  sense of the same word, which is a fringe at the end of a carpet.
examples:
- The selvage ran along the side of the cloth.
- They cut the cloth along the selvage.
