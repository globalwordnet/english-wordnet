simpleMeaning: Extending a long way downward, inward, backward, sideways, or outward from a center. The
  word often combines with others, as in knee-deep.
scope: This is about physical distance from the outside to the inside, not about strong feelings.
examples:
- The water is deep here, so be careful.
- They dug a deep hole in the garden.
