simpleMeaning: The pleasing way a person or an animal moves, bending with ease and without stiffness.
scope: It is a quality of movement, also called lissomeness and suppleness.
examples:
- The dancer's litheness made every step look easy.
- The cat's litheness let it slip through the narrow gap.
