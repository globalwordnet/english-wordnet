simpleMeaning: In computer science, a set of rules and steps in writing, with their papers, that a machine
  follows to work, kept in memory it can read and change.
scope: Also called package, software, computer software, software package, and software system, this names
  rules and steps in writing, with their papers, that a machine follows to work.
