simpleMeaning: A set of instructions stored in a computer's memory that directs how it performs tasks,
  together with any accompanying documentation.
scope: Also called package, software, computer software, software package, and software system, this names
  rules and steps in writing, with their papers, that a machine follows to work.
examples:
- The market for software programs is expected to expand.
- They loaded a software program into the machine.
