simpleMeaning: Fast-growing Chinese tree with male and female cones, flat bright-green deciduous leaves,
  and small round cones. Grown ornamentally in America and known from fossils before living trees were
  found.
scope: This sense is also called metasequoia, for a large fast-growing Chinese both-sexed tree, flat bright
  green shedding leaves, small ball cones, often grown in the States as a show plant, a fossil till found
  in China.
examples:
- The dawn redwood grew tall in the park.
- A dawn redwood stood by the lake.
