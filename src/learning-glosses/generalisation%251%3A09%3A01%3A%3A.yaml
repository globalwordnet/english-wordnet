simpleMeaning: Thinking that moves from small, exact facts to broad rules that cover many cases.
scope: This sense is also called generalization, induction, and inductive reasoning.
examples:
- The generalisation from a few cases to a broad rule needs care.
- Their generalisation about the town came from only two visits.
