senseId: 'unsatiably%4:02:00::'
synsetId: 00378403-r
simpleMeaning: You keep at it and never feel it is enough.
scope: Insatiably is another name for acting in this way, not for acting that stops once it is enough.
examples:
- He clawed unsatiably at the old rules, never happy with any answer he got.
- They worked unsatiably through the night, always wanting more done and never feeling it was enough.
