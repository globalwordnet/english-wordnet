simpleMeaning: A dye that is dark green in solid form and stains material blue. It is also used as an
  antiseptic and as a chemical indicator.
scope: Methylthionine chloride is the chemical name for methylene blue.
examples:
- The blue stain on the slide came from methylthionine chloride.
- The label listed methylthionine chloride under its other name, methylene blue.
