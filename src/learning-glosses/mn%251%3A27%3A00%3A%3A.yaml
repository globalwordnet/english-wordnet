simpleMeaning: Manganese, a hard, brittle gray metal with several oxidation states. It resembles iron
  but lacks its strong magnetism. Used in steelmaking, it occurs in many minerals.
scope: Also called manganese and atomic number 25; a hard grey metal, not iron and not a soft metal.
examples:
- Mn goes into most steel.
- The mine yields Mn in dark rock.
