simpleMeaning: Said of a thing that has to do with, or leans toward, one named belief.
scope: Also called universalistic. It is a kind of adjective, not a word about every member of a group.
examples:
- They held universalist views and wrote about them often.
- The universalist church stood on the corner of the square.
