simpleMeaning: A person who murders multiple victims in separate incidents over a period of time.
scope: Also called serial murderer, this is a person who takes one life after another, more than three
  in all, within a fairly short time.
examples:
- The serial killer chose victims one at a time.
- The town lived in fear of a serial killer.
