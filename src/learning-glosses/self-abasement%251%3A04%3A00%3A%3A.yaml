simpleMeaning: Punishment taken on by choice, to set right a wrong one has done.
scope: This punishment taken on by choice is also called penance and self-mortification, not punishment
  handed out by someone else.
examples:
- The wrong was followed by self-abasement.
- The self-abasement was meant to make up for the wrong done.
