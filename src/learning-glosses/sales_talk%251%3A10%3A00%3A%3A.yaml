simpleMeaning: Words that urge people to buy or take something, by giving reasons for it and showing how
  it works.
scope: Also called pitch and sales pitch. It is a noun.
examples:
- The talk lasted an hour, with the seller giving reasons and showing how the new tool worked.
- The talk urged the crowd to try the new soap, and the seller showed how it worked.
