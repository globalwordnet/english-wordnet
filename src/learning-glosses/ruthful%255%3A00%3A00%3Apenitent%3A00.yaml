simpleMeaning: The pain and sorrow of one who knows they have done wrong and owns it.
scope: Among the words for sorrow over wrongdoing, this one means pain and sorrow over what one has done,
  also called rueful, contrite and remorseful.
examples:
- The ruthful words showed sorrow for what had been done.
- A ruthful account told of the wrong that had been done.
