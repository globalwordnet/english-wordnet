simpleMeaning: An African tree often assigned to different plant families. Its wood structure, fruit,
  flowers, leaves, and seeds resemble those of the Costa Rican caracolito.
scope: Botanists often put this tree in other plant groups, though its wood, fruit, blooms, leaves and
  seeds match those of the Costa Rican caracolito.
examples:
- The lepidobotrys shares its wood and fruit with the Costa Rican caracolito.
- Botanists often put the lepidobotrys in other plant groups.
