schema: oewn-learning-gloss-v2
senseId: 'transparent_substance%1:27:00::'
synsetId: 15103117-n
simpleMeaning: If you look through this stuff, shapes behind it look dim and unclear, because the light
  that gets in spreads out as it comes through.
scope: This sense is also called translucent substance, and it is about a material that lets light through,
  not one that keeps light out.
examples:
- Light came through the transparent substance, but the shapes behind it were dim.
- They held the transparent substance up to the window and watched the light spread through it.
