simpleMeaning: A round flat plate read by light that keeps recorded pictures and sound in coded form,
  to be played on a computer or a television set.
scope: Also called videodisk and DVD. It is a plate, not the machine that plays it.
examples:
- We watched the film on videodisc last night.
- The library lends videodiscs to members.
