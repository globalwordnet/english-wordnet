simpleMeaning: A sick person is treated when cups with the air taken out are put onto their skin.
scope: This way of treating a sick person is also called cup, not giving blood to them.
examples:
- They transfused them by placing cups on their skin.
- Cups were placed on their skin when they were transfused.
