simpleMeaning: The National Trust, a British organization preserving historic buildings, monuments, and
  places of historical interest or natural beauty. Founded in 1895, it receives endowment income and private
  subscriptions.
scope: Also called National Trust; a group that guards old built things, not a government office and not
  a charity for the poor.
examples:
- The NT owns the old hall.
- She joined the NT to help save old houses.
