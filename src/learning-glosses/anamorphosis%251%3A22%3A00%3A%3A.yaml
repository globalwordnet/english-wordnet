senseId: 'anamorphosis%1:22:00::'
synsetId: 13452394-n
simpleMeaning: A very long, step-by-step passing of living things from one form into a new form.
scope: Also called anamorphism, this is not the other sense of this word about a picture that looks right
  only when seen in a special way.
examples:
- The class studied anamorphosis in fossils that show one form of life slowly passing into another.
- In the old bones, they saw anamorphosis at work as one kind of animal gave way to a different kind.
