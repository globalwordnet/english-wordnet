senseId: 'vena_femoralis%1:08:00::'
synsetId: 05374851-n
simpleMeaning: The thigh vein that runs beside the femoral artery in a shared sheath, continues from the
  popliteal vein behind the knee, and becomes the external iliac vein.
scope: This sense is also called femoral vein.
examples:
- A vena femoralis runs with the artery.
- Venae femorales turn into hip veins.
