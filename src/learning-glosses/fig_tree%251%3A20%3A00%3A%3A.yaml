simpleMeaning: A tropical tree of the genus Ficus in the mulberry family. Its closed, pear-shaped flower
  structure becomes fleshy and edible as it ripens.
scope: Of any mulberry-family tree of the tropical genus Ficus, its closed pear-shaped pod turning fleshy
  and fit to eat when ripe.
examples:
- The fig tree bears pear-shaped pods.
- Fig trees grow in the tropics.
