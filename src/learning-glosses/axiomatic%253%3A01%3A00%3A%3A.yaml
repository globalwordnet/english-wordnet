senseId: 'axiomatic%3:01:00::'
synsetId: 02664090-a
simpleMeaning: Said of something that rests on statements taken as true without proof, or comes from them.
scope: This is also called axiomatical and postulational, and it is not about the other sense of this
  word, which is about a work that holds short, wise sayings.
examples:
- The axiomatic base of the theory needs no proof.
- They built the whole proof on axiomatic statements taken as given.
