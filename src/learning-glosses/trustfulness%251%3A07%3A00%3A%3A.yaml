simpleMeaning: A person with this trait believes what others say and relies on them to keep their word.
scope: Also called trust and trustingness, this name is for the trait of believing others, not a belief
  about one single person.
examples:
- Their trustfulness made them believe the stranger's words without asking for proof.
- Their trustfulness showed when they lent tools to a person they had just met.
