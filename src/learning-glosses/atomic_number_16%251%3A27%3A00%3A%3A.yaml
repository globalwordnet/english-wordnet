simpleMeaning: Sulfur, an abundant, odorless, tasteless, multivalent nonmetal known for its yellow crystals.
  It occurs in sulfide and sulfate minerals and in pure form, especially near volcanoes.
scope: 'Also called S, sulfur, and sulphur: a yellow element, not a metal, and not a compound.'
