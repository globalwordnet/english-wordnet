simpleMeaning: A former US economic measure totaling the market value of goods and services produced by
  a nation’s people and capital over a period, usually a year.
scope: This word is also called GNP.
examples:
- The gross national product grew by three per cent last year.
- Economists stopped using the gross national product as their main measure.
