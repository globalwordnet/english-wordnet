senseId: conjectural%5:00:00:theoretical:00
synsetId: 00864403-s
simpleMeaning: Coming mostly from guessing, rather than from good proof.
scope: Also called divinatory, hypothetic, hypothetical, supposed, suppositional, suppositious, and supposititious,
  this one is about a guess, not a proven fact.
examples:
- Theories about the extinction of dinosaurs are still highly conjectural.
- The report gave a conjectural date for the old wall, since no records of it survived.
