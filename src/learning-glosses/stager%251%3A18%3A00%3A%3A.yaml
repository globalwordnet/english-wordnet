senseId: 'stager%1:18:00::'
synsetId: 10665050-n
simpleMeaning: The person who coordinates the practical details of a production and oversees what happens
  backstage during each performance.
scope: The person who looks after the physical side of a show and runs the raised platform while it is
  on; stage manager is another name for this sense; not the director, who guides the acting, and not an
  actor.
examples:
- The stager called for quiet before the curtain rose.
- Our stager checks every light before the show starts.
