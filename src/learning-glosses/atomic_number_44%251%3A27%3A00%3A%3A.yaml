scope: Also called Ru and ruthenium; a rare metal of the platinum group, found with platinum, able to
  join with other atoms in many ways.
examples:
- Atomic number 44 is ruthenium, a rare metal of the platinum group.
- Ruthenium, atomic number 44, is found with platinum.
