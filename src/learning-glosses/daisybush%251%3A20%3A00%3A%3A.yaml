simpleMeaning: An evergreen Olearia shrub, usually Australian, grown for its shape, attractive sometimes
  fragrant leaves, and abundant daisylike flower heads with white, purple, or blue outer petals.
scope: A flowering shrub of the genus Olearia, mostly from Australia, grown in gardens for its showy blooms;
  not the small lawn daisy or a low garden herb.
examples:
- The daisybush in the corner of the yard blooms for weeks in autumn.
- Several daisybush species tolerate salt wind better than most garden shrubs.
