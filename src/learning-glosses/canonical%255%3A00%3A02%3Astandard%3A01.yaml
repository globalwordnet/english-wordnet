simpleMeaning: Used for something cut down to its plainest shape that still holds for every case, with
  nothing of what matters left out.
scope: Basic and canonic are other names for this, not one of the other senses of the same word.
examples:
- Linguists study the canonical syllable pattern of the language.
- The teacher showed the class the canonical form of the equation.
