simpleMeaning: A person who holds right-wing political views and backs the movement that favours using
  a country's strength abroad to spread democracy.
scope: Also called neoconservative. It is a person.
examples:
- The neocon argued that the country should act abroad to spread democracy.
- As a neocon, they backed a strong foreign policy.
