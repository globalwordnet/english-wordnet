simpleMeaning: Using set artistic forms to make an effect, and not natural or unplanned.
scope: Also called stylized, conventionalized and stylised; this one is about a style of work.
examples:
- The play used conventionalised acting, with every gesture fixed in advance.
- The conventionalised painting showed no trace of real life.
