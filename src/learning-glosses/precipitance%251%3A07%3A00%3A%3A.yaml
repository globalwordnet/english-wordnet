simpleMeaning: The quality of an act that happens in a wild rush, with no warning at all.
scope: It is also called suddenness, abruptness, precipitancy, precipitateness, or precipitousness.
examples:
- Their precipitance cost them the deal, as they acted with no warning.
- The precipitance of their reply showed they had not thought it through.
