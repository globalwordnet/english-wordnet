simpleMeaning: A powerful tropical cyclone with sustained winds of at least 64 knots, usually bringing
  heavy rain. Its winds reach force 12 on the Beaufort scale.
scope: A very strong storm from warm seas, with heavy rain and very fast winds.
examples:
- The hurricane hit the coast with winds over a hundred knots.
- People left the island before the hurricane arrived.
