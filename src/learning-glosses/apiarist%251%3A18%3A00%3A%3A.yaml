simpleMeaning: Someone whose work is looking after bees for the honey they give.
scope: This is also called beekeeper and apiculturist, and it is not about a farmer who keeps animals
  other than bees.
examples:
- The apiarist opened the hive at dawn to check the frames of honey.
- Every spring, the apiarist moves the hives to the orchards in bloom.
