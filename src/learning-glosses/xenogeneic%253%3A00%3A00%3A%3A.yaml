simpleMeaning: Used of cells or tissues that come from a living thing of another kind.
scope: This word marks cells or tissues as from another kind, not the same kind.
examples:
- The doctors studied xenogeneic cells from another kind of animal.
- A xenogeneic tissue came from a pig, not from a person.
