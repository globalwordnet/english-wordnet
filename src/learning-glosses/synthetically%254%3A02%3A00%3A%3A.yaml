simpleMeaning: By joining separate parts together into one whole; in the manner of joining parts together.
scope: It describes a way of making something, not the thing made.
examples:
- Some of these drugs have been derived from opium and others have been produced synthetically.
- The new cloth was made synthetically, not from threads grown on a farm.
