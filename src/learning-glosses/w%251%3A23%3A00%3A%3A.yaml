simpleMeaning: The symbol for the watt, a unit of power equal to one joule per second or the power dissipated
  by one ampere flowing through one ohm.
scope: The unit for the rate of energy use, one joule each second; also called watt, and not the metal,
  and not the letter.
examples:
- The bulb uses sixty watts.
- One watt is a small amount of power.
