simpleMeaning: Long woolly hairs on the raised surface of a cloth make it feel rough.
scope: This is the name for the rough feel that long woolly hairs give to the raised surface of a cloth.
examples:
- The shagginess of the coat came from the long hairs standing out from its cloth.
- You could feel the shagginess of the rug as soon as you touched it.
