simpleMeaning: Blocking the passage of light or other radiation so that an observer cannot see through
  the material at those wavelengths.
scope: Opacity can vary with the type of radiation. An opaque surface can reflect light.
examples:
- The opaque windows of the jail let in no light.
- The screen is opaque to X-rays.
