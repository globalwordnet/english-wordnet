simpleMeaning: An older spelling of Eskimo, a term for Inuit and Yupik peoples of northern Canada, Greenland,
  Alaska, and eastern Siberia. Inuit means “the people.” The older term's origin is disputed.
scope: A member of an Arctic people, also called an Eskimo or an Inuit; not the language sense of the
  same word.
examples:
- An Esquimau hunter crossed the sea ice on a dogsled.
- The Esquimau elder told stories of the long Arctic winter.
