simpleMeaning: A sedimentary rock made mostly of calcium carbonate, often from the accumulated shells
  and skeletons of sea creatures.
scope: A rock made mostly of calcium from the remains of sea animals, not a loose stone and not a rock
  formed by heat.
examples:
- The cliffs here are made of limestone.
- Limestone forms from the shells of sea creatures.
