senseId: 'subduer%1:18:00::'
synsetId: 10687889-n
simpleMeaning: By force or by talking people round, this person defeats others and takes charge.
scope: This sense is also called overcomer and surmounter; it is a person who takes charge, not the act
  of taking charge itself.
examples:
- The subduer took charge of the town.
- No one dared to stand against the subduer.
