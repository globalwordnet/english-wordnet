simpleMeaning: A fondness that makes a person act from feeling, not sense or reason.
scope: This feeling is also called enamored, smitten, potty, infatuated, in love, and soft on, and it
  is not a calm liking based on reason.
examples:
- They were taken with the singer and could think of nothing else.
- They were taken with the young actor and talked about them all day.
