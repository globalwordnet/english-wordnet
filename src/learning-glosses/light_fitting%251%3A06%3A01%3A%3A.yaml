simpleMeaning: An electrical device that holds a lamp to provide light. In a traditional fitting, its
  body contains a socket for a replaceable bulb.
scope: Also called a light fixture or luminaire. A fitting can run on mains power or batteries.
examples:
- The light fitting held the bulb in its holder.
- The bulb in the light fitting can be changed.
