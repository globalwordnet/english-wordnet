simpleMeaning: The point on a compass midway between the Arctic side and the way that lies halfway from
  that side toward the sunrise side.
scope: Also called nor'-nor'-east, and NNE for short. It is a noun.
examples:
- The needle pointed north northeast at dawn.
- They set their course to north northeast.
