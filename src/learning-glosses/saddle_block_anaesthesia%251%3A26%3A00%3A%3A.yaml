senseId: 'saddle_block_anaesthesia%1:26:00::'
synsetId: 14053168-n
simpleMeaning: A form of spinal anesthesia that uses a local anesthetic in the fluid around the spinal
  nerves to numb the parts of the body that would touch a saddle.
scope: This sense is also called saddle block anesthesia.
examples:
- The saddle block anaesthesia left the patient feeling nothing.
- Once the saddle block anaesthesia took hold, the patient felt no pain.
