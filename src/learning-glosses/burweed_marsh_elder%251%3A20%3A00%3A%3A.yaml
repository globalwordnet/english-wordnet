simpleMeaning: A tall annual marsh elder common in moist, rich central North American soil. Touching it
  can cause a rash, and its abundant pollen is a major cause of hay fever.
scope: This sense is also called false ragweed.
examples:
- Burweed marsh elder causes skin rash on touch.
- Burweed marsh elder makes much pollen.
