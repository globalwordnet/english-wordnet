simpleMeaning: With large heads of flowers that are usually blue, this aster stands upright and lives
  for years in the south-east of the United States.
scope: This sense is also called cornflower aster and Stokesia laevis.
examples:
- We saw a stokes' aster with large blue flower heads.
- In the south-east, the stokes' aster grows upright.
