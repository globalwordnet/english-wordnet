simpleMeaning: A brand of lithium carbonate (Li₂CO₃), a white powder also used in glass and ceramics.
  Sold as Lithane, Lithonate or Eskalith, it treats mania and certain forms of depression.
scope: A white powder used as a drug for low and high moods; also called lithium carbonate, Eskalith,
  and Lithonate.
examples:
- Lithane steadied her moods over the winter.
- The doctor prescribed Lithane for his depression.
