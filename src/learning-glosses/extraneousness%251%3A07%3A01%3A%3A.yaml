senseId: 'extraneousness%1:07:01::'
synsetId: 92423543-n
simpleMeaning: The state of having no true place in a thing, so that it could go on without it.
scope: This one is also called extraneity.
examples:
- The extraneousness of the decorations did nothing for the plain hall.
- Critics noted the extraneousness of the subplot to the main tale.
