senseId: 'thalweg%1:25:00::'
synsetId: 13935701-n
simpleMeaning: The middle of the main channel of a waterway that boats can use, where the waterway marks
  the border between two states.
scope: It is a kind of border line.
examples:
- The treaty set the thalweg as the border between the two states.
- Boats followed the thalweg down the river.
