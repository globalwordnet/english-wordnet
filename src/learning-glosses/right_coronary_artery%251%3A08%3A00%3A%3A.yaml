synsetId: 05351621-n
simpleMeaning: An artery that branches from the right aortic sinus, a small widening at the base of the
  aorta. It supplies blood to the right side of the heart.
scope: This is the blood tube that feeds the side of the heart where its pouch sits, not the main tube
  leaving the heart.
examples:
- The scan showed a block in the right coronary artery.
- Blood flows through the right coronary artery to feed the heart.
