simpleMeaning: This word is tied to a thallus, a simple plant body with no true roots, stems, or leaves,
  whether a thing looks like one or is made of one.
scope: This word links a thing to a thallus, by likeness or by make-up.
examples:
- The thalloid lichen spread flat across the rock.
- The thalloid growth showed no true roots, stems, or leaves.
