senseId: 'fend_off%2:41:00::'
synsetId: 02458770-v
simpleMeaning: To keep something from coming about, and to guard against anything unwanted by keeping
  it away.
scope: This one is also called avoid, avert, deflect, obviate, debar, forefend, forfend, head off, stave
  off, and ward off.
examples:
- They fended off the cold with thick coats and hot soup.
- The town fended off the flood by raising the banks of the river.
