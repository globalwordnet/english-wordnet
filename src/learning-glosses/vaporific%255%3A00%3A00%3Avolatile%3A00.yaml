simpleMeaning: Said of a substance able to turn into gas.
scope: Also called evaporable, vaporizable, vapourific, vapourisable, volatilisable, and volatilizable.
  It is said of a substance, not of a gas itself.
examples:
- The vaporific substance turned to gas and rose away.
- Workers stored the vaporific liquid in a sealed jar.
