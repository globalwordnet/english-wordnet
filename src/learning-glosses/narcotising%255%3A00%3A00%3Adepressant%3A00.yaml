simpleMeaning: Said of a drug that brings on a deep, heavy sleep in which a person can hardly move or
  feel anything.
scope: It is also called narcotic or narcotizing.
examples:
- The doctor gave the patient a narcotising drug before the operation.
- After the narcotising drug, the patient could hardly stay awake.
