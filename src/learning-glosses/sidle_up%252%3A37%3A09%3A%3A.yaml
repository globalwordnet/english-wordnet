simpleMeaning: To win someone's favor by acting friendly, often without meaning it.
scope: Also called cotton up, cozy up, play up, shine up, and suck up. It is a verb.
examples:
- They sidled up to the new manager, praising every idea.
- The new worker sidled up to the boss with flattery and gifts.
