senseId: analogical%5:00:00:figurative:00
synsetId: 01422335-s
simpleMeaning: Said of something that takes its shape or its sense from a likeness between two different
  things.
scope: This sense is about a likeness, not about two things being the same.
examples:
- The teacher used an analogical comparison to show how a new idea matched an old one.
- The writer gave the idea an analogical turn, setting one thing beside another to show how they matched.
