simpleMeaning: A unit for measuring how fast a computer works, equal to a million calculations on numbers
  with decimal points each second.
scope: It is a unit of computer speed, also called MFLOP and a million floating point operations per second.
examples:
- The new machine ran at ten megaflops.
- Its speed was rated in megaflops.
