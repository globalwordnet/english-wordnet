simpleMeaning: To do with a plant that makes seeds without male and female cells joining.
scope: This one is also called apomictical, and it is about a plant, not about reproduction on its own.
examples:
- The apomictic dandelion spread across the lawn from a single parent.
- They studied the apomictic plants to see how the offspring stayed the same as the parent.
