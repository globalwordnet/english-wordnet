synsetId: 00492170-r
simpleMeaning: In a way that cannot be justified, or to a degree that cannot be justified.
scope: It is a word for a manner or a degree, not for a thing.
examples:
- The charge was unwarrantably high, and no one could justify it.
- They spoke unwarrantably of the work, with no reason behind their words.
