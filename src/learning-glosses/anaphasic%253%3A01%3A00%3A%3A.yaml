simpleMeaning: Said of a thing that has to do with the stage of cell division when the two sets of chromosomes
  move apart to opposite ends of the cell.
scope: It is about a stage of cell division.
examples:
- Under the microscope, they could see the anaphasic stage begin.
- By the anaphasic stage, the cell was ready to split in two.
