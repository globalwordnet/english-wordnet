simpleMeaning: To restore energy to a battery by passing current through it in the opposite direction
  from the current during discharge.
scope: This is refilling a battery with power, not giving an object a static electrical imbalance.
examples:
- You should charge your phone overnight so the battery is full.
- The mechanic charged the car battery with a small current.
