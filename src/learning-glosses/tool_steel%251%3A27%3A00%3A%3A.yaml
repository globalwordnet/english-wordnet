simpleMeaning: A type of steel used to make tools because it is hard, tough, and can hold a sharp cutting
  edge.
scope: A hard, tough metal mix for making things that cut, not plain metal for building and not a finished
  blade.
examples:
- The blade was forged from tool steel.
- Tool steel holds its edge longer than ordinary steel.
