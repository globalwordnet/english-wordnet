simpleMeaning: Said of a thing that has to do with or brings about the change tiny living things make
  in food or drink.
scope: Also called zymotic. It is said of a thing.
examples:
- The zymolytic action of yeast makes the bread rise.
- A zymolytic change turns the juice into wine.
