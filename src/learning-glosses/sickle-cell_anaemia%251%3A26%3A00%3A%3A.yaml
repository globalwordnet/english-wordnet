senseId: 'sickle-cell_anaemia%1:26:00::'
synsetId: 14192274-n
simpleMeaning: An inherited blood disorder causing anemia, especially common among people of African ancestry,
  in which red blood cells can become crescent-shaped.
scope: Crescent-cell anaemia, crescent-cell anemia, drepanocytic anaemia, drepanocytic anemia, sickle-cell
  anemia, and sickle-cell disease are other names for this sickness present from birth.
examples:
- Doctors found sickle-cell anaemia in the newborn child.
- The blood in sickle-cell anaemia showed bits shaped like a thin curved moon.
