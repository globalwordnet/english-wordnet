simpleMeaning: Two bones that form the sides of the skull meet at this join, which holds them together.
scope: This join in the skull is also called interparietal suture and sutura sagittalis.
examples:
- The sagittal suture showed as a thin line across the skull.
- The sagittal suture joins the two side bones of the skull.
