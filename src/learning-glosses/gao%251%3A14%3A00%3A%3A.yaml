simpleMeaning: An independent, nonpartisan US agency that investigates how the federal government works
  and spends money, helping Congress and the public hold it accountable.
scope: GAO stands for Government Accountability Office. Its former name was General Accounting Office.
examples:
- The GAO looked into the work of the government for Congress.
- Congress asked the GAO to check whether the government had kept to the rules.
