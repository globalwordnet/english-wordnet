simpleMeaning: A scanner that combines images of parallel slices to build a three-dimensional model of
  an object.
scope: This machine puts flat views together to build a picture with depth of a thing.
examples:
- The computerized axial tomography scanner built a picture with depth of the broken bone.
- The computerized axial tomography scanner built a picture with depth of her knee.
