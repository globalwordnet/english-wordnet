senseId: 'nerve_end%1:08:00::'
synsetId: 05476684-n
simpleMeaning: The last part of an axon, a thread that carries signals away from a cell, that stops before
  a synapse, where one cell passes a signal to the next.
scope: Also called nerve ending. It is an axon tip, not a join between cells.
examples:
- The nerve end in the skin felt the heat of the stove.
- The test touched a nerve end in the finger.
