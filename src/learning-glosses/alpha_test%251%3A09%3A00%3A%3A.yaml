simpleMeaning: In computer science, the first trial of a new product, such as a computer program, run
  by the person who made it.
scope: This one is a first trial by the maker, not a later trial by someone else.
examples:
- The team ran an alpha test on the new program before showing it to anyone else.
- They fixed three faults that the alpha test had found in the first week.
