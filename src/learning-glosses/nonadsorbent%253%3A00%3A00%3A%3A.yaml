simpleMeaning: Lacking the power to take things up and hold them on a surface, or to make them gather
  there.
scope: Also called nonadsorptive. It is an adjective.
examples:
- The nonadsorbent cloth let the spill run straight off it.
- A nonadsorbent wall stays clean because dirt will not stick to it.
