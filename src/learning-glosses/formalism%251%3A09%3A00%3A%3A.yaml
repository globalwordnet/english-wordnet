simpleMeaning: The philosophical view that logical or mathematical statements have no meaning of their
  own, but the patterns formed by their symbols as physical objects have practical uses.
scope: In philosophy, the view that formal claims have no meaning, but their signs show a shape with useful
  uses.
examples:
- Formalism holds that formal claims have no meaning.
- They study formalism in class.
