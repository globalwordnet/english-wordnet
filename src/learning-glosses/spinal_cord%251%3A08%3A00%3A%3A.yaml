simpleMeaning: The central nervous system pathway carrying sensory and movement signals between body and
  brain. It extends from the brain's base through the spinal canal into the upper lower-back region.
scope: This sense is also called medulla spinalis.
examples:
- The spinal cord bears nerve beats to the brain.
- A spinal cord runs down the spine.
