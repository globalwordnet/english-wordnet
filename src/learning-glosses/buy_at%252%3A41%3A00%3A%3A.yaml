simpleMeaning: A person gets goods from a place, does business with it, or is a customer or client of
  it.
scope: Shop, frequent, sponsor, patronize, patronise, and shop at are other names for this.
examples:
- We buy at the corner store every week.
- The family buys at the market on Saturdays.
