senseId: 'apical_placentation%1:20:00::'
synsetId: 11701724-n
simpleMeaning: The way one or a few ovules grow at the top of an ovary, whether the ovary is simple or
  made of joined parts.
scope: This is not about ovules growing at the base or the sides of the ovary.
examples:
- In the flower, apical placentation puts one or two ovules at the very top of the ovary.
- The botanist noted apical placentation in the bloom, with a single ovule at the top.
