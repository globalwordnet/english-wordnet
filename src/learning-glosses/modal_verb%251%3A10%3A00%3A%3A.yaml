synsetId: 06329715-n
simpleMeaning: A word that helps a word of action, like 'can' or 'will', and shows how the speaker sees
  what can happen, what must happen, or what may happen.
scope: It is also called modal, modal auxiliary, or modal auxiliary verb.
examples:
- In 'They can swim', 'can' is a modal verb.
- '''Will'' is a modal verb in ''I will help you tomorrow''.'
