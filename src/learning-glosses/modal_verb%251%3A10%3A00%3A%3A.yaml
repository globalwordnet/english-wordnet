simpleMeaning: A helping verb, such as 'can' or 'will', that expresses ideas such as possibility, obligation,
  or willingness.
scope: It is also called modal, modal auxiliary, or modal auxiliary verb.
examples:
- In 'They can swim', 'can' is a modal verb.
- '''Will'' is a modal verb in ''I will help you tomorrow''.'
