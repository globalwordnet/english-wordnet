simpleMeaning: A fast and hard spell of learning or study, most often done when trouble strikes.
scope: Also called crash program or crash programme, this one is about a spell of learning.
examples:
- He took a crash course in Italian on his way to Italy.
- His first job was a crash course in survival and in learning how to get along with people.
