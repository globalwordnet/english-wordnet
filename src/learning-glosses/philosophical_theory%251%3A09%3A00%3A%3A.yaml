simpleMeaning: A teaching that people who follow one way of thinking take as true.
scope: Also called a philosophical doctrine. It is one teaching within a way of thinking, not the whole
  way of thinking.
examples:
- The philosophical theory they debated held that only what can be seen is real.
- A philosophical theory of mind asks how thoughts come about.
