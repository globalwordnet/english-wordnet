simpleMeaning: An acrobatic move in which the body turns all the way over, forward or backward, with the
  feet passing over the head.
scope: It is also called flip, somersault, somersaulting, somerset, or summersault.
examples:
- The clown did a summerset in the middle of the show.
- The acrobat practiced a summerset on the grass until the landing came clean.
