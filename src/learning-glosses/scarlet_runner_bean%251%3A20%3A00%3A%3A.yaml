simpleMeaning: A tropical American perennial resembling the common bean, with red flowers and mottled
  black beans. It is popular as a food crop in Britain.
scope: This sense is also called runner bean and scarlet runner, for a bean plant from tropical America,
  with scarlet blooms and spotted black beans.
