simpleMeaning: A small mallee eucalyptus with rough, dark bark near the base of its trunk. It yields a
  red gum called kino.
scope: Also called black gum and black sally; a small gum tree with rough dark bark that gives a red gum,
  not a tall gum tree and not the black gum of eastern North America.
examples:
- The black mallee grows low with rough dark bark.
- Black mallee yields a red gum.
