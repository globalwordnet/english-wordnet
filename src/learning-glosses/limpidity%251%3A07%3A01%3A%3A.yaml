simpleMeaning: The quality of being easy to understand and free of obscurity, the ease of grasping clear
  words.
scope: It is also called clarity, lucidity, clearness, lucidness, and pellucidity.
examples:
- The limpidity of their writing made the hard idea easy to follow.
- Their limpidity in speech helped the class grasp the lesson.
