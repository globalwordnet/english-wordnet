simpleMeaning: A living thing that can make sounds with its voice.
scope: Also called vocaliser and vocalizer. It is said of living things, not only of one who speaks.
examples:
- The parrot is a fine utterer of words it has heard.
- That utterer of foul oaths was asked to leave the room.
