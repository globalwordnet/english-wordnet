simpleMeaning: Said of a way of reading holy writings that looks for a hidden meaning about heaven and
  the life to come.
scope: Also called anagogical. It is used to describe things.
examples:
- The preacher gave an anagogic reading of the passage, pointing to heaven.
- An anagogic view of the text looks past the plain words to the life to come.
