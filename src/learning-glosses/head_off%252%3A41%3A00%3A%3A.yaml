simpleMeaning: To stop a thing before it happens, and to hold anything unwanted back.
scope: This verb is also called avoid, avert, deflect, obviate, debar, fend off, forefend, forfend, stave
  off, or ward off.
examples:
- They worked through the night to head off a strike.
- The new law was meant to head off a water shortage.
