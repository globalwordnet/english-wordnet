simpleMeaning: The solid bits have settled at the bottom, and the liquid floating on top of them is called
  this.
scope: This says how a liquid sits on top of settled bits, and is not a name for the liquid itself.
examples:
- The supernatant fat was skimmed off the top.
- They poured off the supernatant liquid and left the solid bits behind.
