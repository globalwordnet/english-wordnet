simpleMeaning: A strong box of metal that fire cannot harm, kept most often in a bank for things of great
  worth.
scope: It is also called a lockbox, a deposit box, a safe-deposit box, a safety-deposit, or a safety deposit
  box.
examples:
- The jewels were kept in a safe-deposit at the bank.
- The safe-deposit kept the papers safe when the house caught fire.
