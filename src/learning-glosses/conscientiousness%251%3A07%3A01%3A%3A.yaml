simpleMeaning: Great care over every detail of what one does.
scope: Also called painstakingness; it is not the sense of the same word that is about one's inner sense
  of right and wrong.
examples:
- The editor's conscientiousness showed in the double-checking of every figure.
- Their conscientiousness meant no detail was missed.
