schema: oewn-learning-gloss-v2
senseId: 'coordinating_conjunction%1:24:00::'
synsetId: 13821867-n
simpleMeaning: The linking of words, phrases, or clauses of equal grammatical status by a conjunction
  such as and or or.
scope: This one is about the act of joining, not the word 'and' itself.
examples:
- The coordinating conjunction in 'cats and dogs' joins two words that do the same job.
- In 'small but strong', a coordinating conjunction joins two words that describe the same thing.
