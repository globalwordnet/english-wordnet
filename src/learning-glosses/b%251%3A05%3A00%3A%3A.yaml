simpleMeaning: A rod-shaped bacterium that uses oxygen and produces spores. These bacteria often grow
  in chains and are found mainly in soil.
scope: This is the tiny rod-shaped germ that needs air to live, not the metal, the unit of sound, the
  vitamin, or the 2nd letter, and it is also called bacillus.
examples:
- B lives in soil and forms chains.
- The lab grew B in a dish.
