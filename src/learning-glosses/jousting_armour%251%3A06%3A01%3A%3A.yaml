simpleMeaning: Heavy armor made of metal plates for jousting tournaments from the late 1400s through the
  1500s. Its design restricted its use in open combat.
scope: Heavy plate clothing for riding contests, not for free fighting; jousting armor is another name
  for it, not plate clothing made for free combat.
examples:
- The knight put on his jousting armour before the contest on horseback.
- He could barely walk in the heavy jousting armour.
