simpleMeaning: A point in a space of possible states that a moving thing draws near in a wild, uneven
  way as it nears its end.
scope: This one is also called strange attractor.
examples:
- The numbers moved in a wild way near the chaotic attractor.
- The researchers watched the system draw near the chaotic attractor.
