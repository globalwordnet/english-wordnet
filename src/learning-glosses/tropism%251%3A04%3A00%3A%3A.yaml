senseId: 'tropism%1:04:00::'
synsetId: 00863289-n
simpleMeaning: A turning of the body that happens without thought, toward the thing that acts on it or
  away from it.
scope: It is a movement the body makes without thought.
examples:
- The plant showed tropism when it bent toward the light.
- The roots showed tropism by growing away from the light.
