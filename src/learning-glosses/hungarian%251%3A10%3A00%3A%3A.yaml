simpleMeaning: The official language of Hungary, also spoken in Romania. It belongs to the Ugric group
  of languages.
scope: This is the official way of speaking of Hungary, also heard in Rumania, also called Magyar; near
  rivals are the word used for a person from Hungary and the word used for things of Hungary.
examples:
- Hungarian is the official language of Hungary, though it is also spoken in Rumania.
- She speaks Hungarian, a language of the Ugric family.
