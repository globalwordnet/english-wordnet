simpleMeaning: One of the traditional forms of matter. Solids keep shape and volume, liquids keep volume
  but take their container's shape, and gases fill their container.
scope: This is also called a state, one of the three old forms of stuff.
examples:
- Ice is one state of matter.
- Steam is one state of matter.
