simpleMeaning: Fluorine, a nonmetallic halogen with a valence of one, usually a yellow, irritating, toxic
  gas. A powerful oxidizer that promotes burning, obtained from fluorite, cryolite, or fluorapatite.
scope: A yellow gas that hurts and burns, also called fluorine and atomic number 9; not the unit of capacitance,
  and not the letter.
examples:
- Fluorine is a yellow gas.
- Fluorine can burn skin.
