simpleMeaning: A clear liquid, alcohol mixed with a poisonous chemical so no one drinks it, used in medicine
  above all to clean skin before a needle or an operation.
scope: In medicine, this clear liquid is used above all to clean skin before a needle or an operation,
  and it is not a drink.
examples:
- The nurse wiped the arm with surgical spirit before giving the injection.
- Before the operation, the skin was wiped with surgical spirit.
