simpleMeaning: In this source, the point where a floating object's weight balances. In naval architecture,
  the term means the center of the area enclosed by its waterline.
scope: Centre of flotation is another name for this.
examples:
- The center of flotation shifts when the load is moved toward the bow.
- They found the center of flotation by balancing the little boat on one finger.
