senseId: 'rhodopsin%1:27:00::'
synsetId: 15113436-n
simpleMeaning: A red light-sensitive pigment in the retinal rods of animals with backbones. Light changes
  its retinal component, triggering a visual signal.
scope: Not the red of blood, and not the dark stuff that fills the eye; also called retinal purple and
  visual purple.
examples:
- Rhodopsin helps the eye adjust to the dark.
- In bright light, rhodopsin breaks down fast.
