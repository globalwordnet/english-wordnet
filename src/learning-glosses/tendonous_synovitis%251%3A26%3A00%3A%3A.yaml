simpleMeaning: The tough cord that joins muscle to bone, and the cover that wraps round it, become swollen
  and sore.
scope: This is also called tendosynovitis or tenosynovitis.
examples:
- The tendonous synovitis left the cord and its cover swollen.
- The cord and its cover stayed sore from tendonous synovitis.
