simpleMeaning: Far from where it came from, a big rock lies on a beach.
scope: A big rock on a beach is called this when it lies far from where it came from, not when it still
  sits where it formed.
examples:
- We sat on a shore boulder and watched the waves.
- A shore boulder blocked the path along the beach.
