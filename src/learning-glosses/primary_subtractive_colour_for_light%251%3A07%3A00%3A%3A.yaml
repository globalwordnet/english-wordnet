simpleMeaning: Cyan, magenta, or yellow light, the subtraction of which from white light leaves red, green,
  or blue respectively.
scope: Also called primary subtractive color for light. It is a shade.
examples:
- The teacher held up a cyan sheet and called it a primary subtractive colour for light.
- Magenta and yellow are two of the primary subtractive colours for light in the printer's ink set.
