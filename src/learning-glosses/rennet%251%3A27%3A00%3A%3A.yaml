simpleMeaning: A substance that turns milk thick and lumpy when cheese or junket is made
scope: It names the substance that sets milk for cheese and junket, not the milk itself and not the finished
  cheese.
examples:
- The cheese maker added rennet to the milk to make it set.
- The cook stirred rennet into the milk when the cheese was started.
