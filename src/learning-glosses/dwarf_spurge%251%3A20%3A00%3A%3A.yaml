simpleMeaning: A European spurge that grows upright or close to the ground, lives for one year, and now
  grows wild as a weed in the northeastern United States.
scope: This is a short-lived weed from Europe that now grows wild in the north-east of the United States.
examples:
- We found dwarf spurge growing along the edge of the field.
- Dwarf spurge has spread through the north-east since it came from Europe.
