simpleMeaning: A distinct patch or grouping of plants that can be told from the rest.
scope: This names one patch of plants, not one plant on its own.
examples:
- They mapped each vegetation unit in the valley before they built the road.
- The meadow held three vegetation units, each with its own mix of plants.
