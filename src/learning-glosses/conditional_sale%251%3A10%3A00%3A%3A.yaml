senseId: 'conditional_sale%1:10:00::'
synsetId: 06540182-n
simpleMeaning: A deal in which the buyer gets the right to own a thing only after doing what was agreed,
  most often after paying the full price.
scope: It is about a deal.
examples:
- They bought the car by conditional sale and paid it off over a year.
- 'The shop offered a conditional sale: the title would pass only when the last payment was made.'
