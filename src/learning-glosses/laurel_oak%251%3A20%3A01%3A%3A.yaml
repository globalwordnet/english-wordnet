simpleMeaning: A large oak of the southeastern United States that keeps many leaves through winter and
  grows well in damp soil.
scope: Also called pin oak, this large tree of the southeastern United States keeps most of its leaves
  through the winter and does well in wet ground.
examples:
- A laurel oak grew in the wet ground.
- The laurel oak kept most of its leaves through the winter.
