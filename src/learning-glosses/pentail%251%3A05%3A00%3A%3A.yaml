simpleMeaning: A brown tree shrew with a mostly bare tail. Long, stiff hairs grow along both sides of
  the outer third of the tail. It lives in Malaysia.
scope: 'Also called pen-tail and pen-tailed tree shrew: a brown tree shrew of Malaysia with a bare back
  end fringed with stiff hairs.'
examples:
- The pentail lives in Malaysia.
- A pentail's bare back end is fringed with long stiff hairs on both sides of its far third.
