simpleMeaning: A way of life in which an animal, usually a bird, takes live animals for its food.
scope: It is also called predaceousness, predaciousness, or rapacity.
examples:
- The rapaciousness of the eagle showed in the way it hunted live prey.
- The hawk's rapaciousness showed each time it dived for live prey.
