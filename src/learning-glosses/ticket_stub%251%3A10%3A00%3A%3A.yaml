simpleMeaning: A torn part of a pass given back to the person holding it, as proof they paid.
scope: This is also called a stub, a torn-off part, not the whole pass.
examples:
- They kept the ticket stub as proof that they had paid.
- They handed over the ticket stub when asked for proof of payment.
