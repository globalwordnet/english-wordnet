simpleMeaning: An older name for type 2 diabetes, which often develops gradually. Excess weight can raise
  the risk. Treatment may include diet changes, medicines or insulin.
scope: Non-insulin-dependent diabetes mellitus is an older name for type 2 diabetes.
examples:
- Her old medical record calls type 2 diabetes ‘non-insulin-dependent diabetes mellitus.’
- His chart still said ‘non-insulin-dependent diabetes mellitus’ when he started insulin.
