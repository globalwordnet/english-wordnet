simpleMeaning: A former temporary name for copernicium, the radioactive element with atomic number 112,
  higher than uranium's.
scope: A heavy element past uranium that gives off rays, with the number one hundred and twelve, also
  called atomic number 112, element 112, and Uub.
examples:
- Ununbium has the atomic number 112.
- Scientists made ununbium in a laboratory.
