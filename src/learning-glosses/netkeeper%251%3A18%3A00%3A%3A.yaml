simpleMeaning: The player in a soccer or hockey side whose task is to keep the other side from scoring.
scope: Also called a goalie, a goalkeeper, a goaltender, or a netminder.
examples:
- The netkeeper dived to stop the ball from going in.
- Their netkeeper kept the other side out for the whole game.
