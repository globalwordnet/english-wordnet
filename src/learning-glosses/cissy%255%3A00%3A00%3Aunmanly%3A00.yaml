simpleMeaning: An insulting way to describe a boy or man whose behavior the speaker considers too feminine.
scope: This one is also called effeminate, emasculate, epicene, sissified, sissy and sissyish.
examples:
- The other boys called the new boy a cissy for crying at the film.
- A cissy manner made the other children laugh.
