simpleMeaning: A genus, or group of closely related species, of ferns or their relatives.
scope: Plant groups of one broad kind and their close kin, not a single plant and not a group of trees.
examples:
- The fern genus Osmunda holds several tall species.
- Botanists placed the plant in a new fern genus.
