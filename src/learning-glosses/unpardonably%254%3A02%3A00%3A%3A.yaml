senseId: 'unpardonably%4:02:00::'
synsetId: 00335065-r
simpleMeaning: In a way that cannot be forgiven, or to a degree that cannot be forgiven.
scope: Also called unforgivably and inexcusably. It is a word for a way of acting.
examples:
- The guard behaved unpardonably, and no apology could undo the harm.
- The delay was unpardonably long, and the crowd grew restless.
