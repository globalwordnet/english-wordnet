simpleMeaning: A tiny germ that attacks animals and gives them a sore, blistered mouth.
scope: This is a germ, not one that attacks plants.
examples:
- The vet found vesiculovirus in the sick cows, and their mouths were sore and blistered.
- The horses had sore, blistered mouths, and the vet said vesiculovirus was the cause.
