simpleMeaning: A former category for classifying plants whose relationships were unclear. The category
  called phylum replaced it in 1993.
scope: This made-up group name for plants whose true family ties are not known stands beside form division
  and form genus, which name other made-up ranks.
examples:
- The form division was dropped in 1993.
- Botanists once placed the fossil in a form division.
