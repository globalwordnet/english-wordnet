simpleMeaning: Rude and rough in behavior or looks, in a way that makes others look down on it.
scope: Also called boorish, loutish, oafish, neanderthal, or swinish. It is an adjective.
examples:
- Their neandertal manners shocked the guests at dinner.
- The neandertal jokes at the party offended everyone.
