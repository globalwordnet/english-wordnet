simpleMeaning: A solid whose two ends are the same shape with straight edges and equal sides and angles,
  and whose sides meet the ends at right angles.
scope: It is a solid.
examples:
- The height of a regular prism is the distance between the bases.
- The glass block was cut in the form of a regular prism.
