simpleMeaning: A clear resin made from urea and formaldehyde that hardens permanently when heated. It
  is used in electrical fittings, glues, and finishes.
scope: This clear hard stuff made from two chemicals sets hard when heated, and it goes into electric
  fittings, glues, and coatings.
examples:
- Urea-formaldehyde resin is used in electric fittings.
- The glue was made with urea-formaldehyde resin.
