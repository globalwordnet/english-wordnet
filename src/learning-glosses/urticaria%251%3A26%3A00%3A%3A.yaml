simpleMeaning: Hives, an itchy rash of raised patches that can have pale centers and red edges. Possible
  triggers include insect bites, foods, and medicines.
scope: This sense is also called hives, nettle rash, and urtication.
examples:
- Urticaria itched and reddened the skin.
- An urticaria came from a bug bite.
