simpleMeaning: Rock music with deliberately shocking lyrics expressing anger and a sense of exclusion.
  It developed partly in reaction to progressive rock.
scope: It is also called punk, and it is music with rude words and a feeling of not fitting in, made in
  part as an answer to progressive music.
examples:
- The band's punk rock was full of anger.
- The punk rock songs were full of anger and rude words.
