simpleMeaning: A gene at a different position on a chromosome from another gene, so the two are not alternative
  versions at the same position.
scope: It is a kind of gene.
examples:
- The two nonalleles sit at the same locus but do not compete.
- A nonallele does not fight its partner gene for the same place.
