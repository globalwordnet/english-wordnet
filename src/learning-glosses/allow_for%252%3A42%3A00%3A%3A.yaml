simpleMeaning: To take something into account when you plan, so that it can happen or be reached, or stay
  as it is.
scope: Also called leave, allow, or provide, this one names the planning, not the thing planned.
examples:
- They allow for mistakes in the plan.
- The plan allows for extra time.
