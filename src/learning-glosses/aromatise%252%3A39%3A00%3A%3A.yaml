simpleMeaning: To work a smell into something until it fills it, or goes right through it.
scope: Also called aromatize and perfume, this one adds a smell, not takes one away.
examples:
- The orange blossoms aromatised the air in the garden.
- They aromatised the room with lavender before the guests came.
