simpleMeaning: Noninfectious food poisoning caused by eating botulin toxin. It affects the central nervous
  system and can be fatal without prompt treatment.
scope: Poisoning from food that holds botulin, not passed from person to person, that harms the nerves
  and can kill if not treated at once.
examples:
- Botulism came from the badly canned beans.
- The doctors treated the botulism at once.
