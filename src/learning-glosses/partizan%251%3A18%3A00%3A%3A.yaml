simpleMeaning: A person who gives a person or an activity strong, eager support.
scope: Also called a partisan or an enthusiast. It is a person, not a long-bladed weapon.
examples:
- The partizan cheered the leader at every meeting.
- They were a partizan of the new art school and praised all its shows.
