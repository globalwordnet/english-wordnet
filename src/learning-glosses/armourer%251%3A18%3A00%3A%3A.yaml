simpleMeaning: This soldier, below officer rank, sees to it that the small guns, machine guns, and other
  such weapons stay in working order.
scope: Also called armorer and artificer, this one is the keeper, not the maker.
examples:
- The armourer checked every rifle before the patrol set out.
- They asked the armourer to clean the machine guns.
