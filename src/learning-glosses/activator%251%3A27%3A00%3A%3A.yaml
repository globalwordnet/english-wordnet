senseId: 'activator%1:27:00::'
synsetId: 14747240-n
simpleMeaning: In biology, something that increases activity, such as a molecule that helps an enzyme
  work faster or a protein that increases transcription of a gene into RNA.
scope: Any thing that starts a change going, not a thing that stops a change.
examples:
- The activator switched on the enzyme within seconds.
- Without the activator, the gene stayed silent.
