simpleMeaning: A state in which the walls of the blood vessels have gone hard.
scope: Arterial sclerosis, coronary-artery disease, hardening of the arteries, and induration of the arteries
  are other names for this one, which is not a hardening of the veins.
examples:
- The doctor found arteriosclerosis in the blood vessels of the arm.
- The vessels that feed the heart showed arteriosclerosis.
