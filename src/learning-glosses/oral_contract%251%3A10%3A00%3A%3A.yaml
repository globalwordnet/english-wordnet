simpleMeaning: A spoken agreement between parties. For certain kinds of agreement, the law may require
  a written record before a court can enforce it.
scope: Whether the agreement can be enforced depends on the law that applies and what the parties agreed
  to.
examples:
- They made an oral contract for the repairs.
- The lawyer checked whether local law would allow the court to enforce their oral contract.
