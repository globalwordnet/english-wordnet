simpleMeaning: A sour chemical that comes from toluene, one of several forms with the same parts put together
  in different ways.
scope: This is one of several forms of a chemical made from toluene, not the toluene itself.
examples:
- They worked with toluic acid made from toluene.
- This toluic acid has the same parts as the other forms, put together in a different way.
