senseId: 'appellative%1:10:00::'
synsetId: 06350278-n
simpleMeaning: A word or words that name a person or a thing and show what kind it is and how it differs
  from others.
scope: Also called designation, appellation, and denomination, this one is a noun, not the adjective sense
  of this word.
examples:
- The teacher explained that 'doctor' is an appellative, a word that names a job.
- In the list, each appellative stood for a kind of worker.
