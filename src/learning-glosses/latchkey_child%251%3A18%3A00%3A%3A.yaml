senseId: 'latchkey_child%1:18:00::'
synsetId: 10267216-n
simpleMeaning: A school-age young person who stays at home with no grown-up watching for part of the day,
  above all after school until a parent comes back from work.
scope: It is a young person.
examples:
- The latchkey child made a snack after school.
- A latchkey child lets itself in after school.
