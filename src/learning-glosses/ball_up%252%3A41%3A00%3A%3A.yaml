simpleMeaning: To make a mess of something or ruin it.
scope: Also called blow, fumble, spoil, fluff, bumble, botch, bungle, muff, bobble, mishandle, flub, bodge,
  bollix, bollix up, bollocks, bollocks up, botch up, foul up, fuck up, louse up, mess up, muck up, or
  screw up, this one names a bad mistake.
examples:
- They balled the whole plan up and had to start again.
- The new cook balled up the dinner and they had to eat out.
