senseId: 'unapproachability%1:07:00::'
synsetId: 04664601-n
simpleMeaning: People find it hard to come near or speak to a person with this quality, who is also unfriendly.
scope: This is a person's way of being toward others, not the way of one who is easy to come near and
  speak to.
examples:
- They were put off by the unapproachability of the manager.
- Everyone noticed the unapproachability of the guard.
