simpleMeaning: A small bit of matter inside a cell, found inside another one, often showing up when a
  person has one of certain illnesses.
scope: Inclusion and inclusion body are other names for this.
examples:
- Under the microscope, the doctor spotted an inclusion inside a cell from the sick child.
- The lab noted the inclusion and ran more tests on the sample.
