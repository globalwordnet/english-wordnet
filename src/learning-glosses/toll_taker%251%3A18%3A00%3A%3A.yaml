simpleMeaning: A person who takes the fee paid to pass through.
scope: Also called toll agent, toll collector, toller, tollgatherer, and tollkeeper. It is not the driver
  who pays the charge.
examples:
- The toll taker handed them a receipt.
- A toll taker sat in the booth at the bridge.
