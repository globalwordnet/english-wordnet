simpleMeaning: The British Labour Party, founded in 1900 to represent workers' interests. It formerly
  supported public ownership of major industries.
scope: A British party, also called Labour, the British Labour Party, or the Labour Party; not the work
  department of the same name, and not any other party.
examples:
- Labor was formed in Britain in 1900.
- Labor speaks for workers.
