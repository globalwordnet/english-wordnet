simpleMeaning: A figure used to stand for a life ruled by money, or for a wish to have more and more money.
scope: This one is also called a dollar mark or a dollar, and it is not a $ written before a number.
examples:
- The dollar sign meant everything to them, and nothing else counted.
- They chased the dollar sign all their lives.
