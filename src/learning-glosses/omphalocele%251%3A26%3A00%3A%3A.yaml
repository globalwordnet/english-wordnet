senseId: 'omphalocele%1:26:00::'
synsetId: 14320991-n
simpleMeaning: A birth defect where the bowel and belly lining push out through the wall near the navel;
  it often rights itself after birth.
scope: An omphalocele is not the same as a simple umbilical hernia.
examples:
- The baby was born with an omphalocele near the navel.
- The omphalocele closed on its own after birth.
