simpleMeaning: To add an acetyl group, a group of atoms written CH₃CO, to a chemical compound.
scope: Also called acetylise and acetylize; this is adding a small chemical part to a chemical, not taking
  a part out and not heating it.
examples:
- The chemist will acetylate the compound to change its shape.
- They acetylate the drug before testing it.
