synsetId: 00368069-v
simpleMeaning: To turn into a gas while passing through a thin layer that lets only some things through.
scope: It is what a liquid does, not what someone causes a liquid to do.
examples:
- Water can pervaporate through the thin layer in the device.
- The mixture will pervaporate if the layer is warm.
