simpleMeaning: A slang name for methamphetamine, a stimulant sold historically as Methedrine in crystalline
  hydrochloride form and used to suppress appetite.
scope: 'Also called glass and ice: a crystal drug that wakes up the nerves and takes away hunger, not
  rubbish or waste.'
examples:
- The police found a bag of trash in his pocket.
- He had been taking trash to stay awake at work.
