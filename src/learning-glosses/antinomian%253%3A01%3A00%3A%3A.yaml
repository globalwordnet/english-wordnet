senseId: 'antinomian%3:01:00::'
synsetId: 02640819-a
simpleMeaning: To do with the teaching that Christians are no longer bound by the law of God, or shaped
  by it.
scope: This word is used to describe something, not to name a person who follows the teaching.
examples:
- The antinomian view holds that the old laws no longer bind Christians.
- Their antinomian ideas spread quickly through the small group.
