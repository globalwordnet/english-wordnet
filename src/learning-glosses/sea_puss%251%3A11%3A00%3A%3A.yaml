simpleMeaning: The water that runs back out from the shore below the surface once the waves have broken.
scope: This pull of water is also called undertow, sea-poose, sea-purse, sea-puss, and sea purse.
examples:
- The sea puss dragged the water out as the waves broke.
- The sea puss runs beneath the surface after the waves break.
