simpleMeaning: An old expression for a decline in mental abilities in later life, sometimes associated
  with behavior seen as childish, such as a foolish infatuation.
scope: Dotage and senility are other names for this failing of the mind in old age.
examples:
- Foolish crushes formed late in life can mark a second childhood.
- A second childhood showed in foolish crushes late in life.
