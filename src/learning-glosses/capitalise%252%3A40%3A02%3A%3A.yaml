senseId: 'capitalise%2:40:02::'
synsetId: 02335738-v
simpleMeaning: To give a business the capital it needs, made up of money from investors and money borrowed
  from lenders.
scope: Capitalize is another name for this, which concerns a business's money rather than reserve funds,
  spending, or writing words with large first letters.
examples:
- The owners capitalised the business with their own money and a bank loan.
- The business was capitalised by a mix of shares and loans.
