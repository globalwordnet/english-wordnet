simpleMeaning: Dried leaves from an Asian kind of mugwort make a thin rod that is burnt on the skin as
  a treatment.
scope: This sense is also called moxa roll and moxa stick.
examples:
- They lit the stick moxa and held it close to the skin.
- They kept the stick moxa burning on the skin.
