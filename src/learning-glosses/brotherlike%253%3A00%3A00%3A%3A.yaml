simpleMeaning: Said of a person or thing that shows the ways of a male child of the same parents, or suits
  such a child.
scope: Also called brotherly. It is about a person or a thing.
examples:
- They showed a brotherlike care for the younger children.
- A brotherlike tie grew between the two friends.
