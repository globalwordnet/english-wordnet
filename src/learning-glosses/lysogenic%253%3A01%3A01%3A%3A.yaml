simpleMeaning: Relating to a state in which a bacterium carries a virus's genetic material as part of
  its own.
scope: Of or relating to the way a virus stays inside a germ; not the sense of being able to cause lysis.
examples:
- The lysogenic strain of the virus stayed quiet in the germs.
- Lysogenic viruses hide inside their hosts for a long time.
