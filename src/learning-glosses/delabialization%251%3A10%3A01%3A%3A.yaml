senseId: 'delabialization%1:10:01::'
synsetId: 92462369-n
simpleMeaning: Saying a sound with the lips held flat, not pushed out into a round shape.
scope: This one is about how a sound is said, not about the sound itself.
examples:
- The delabialization of the vowel turned a round sound into a flat one.
- In this word, delabialization has flattened the vowel sound.
