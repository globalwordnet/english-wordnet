synsetId: 05889322-n
simpleMeaning: A general rule saying that, over a long time, what is likely to happen will decide how
  things turn out.
scope: It is a general statement about chance over time.
examples:
- After losing ten games in a row, they counted on the law of averages for a win.
- The law of averages does not promise a win in the next game, only over many games.
