senseId: 'contact_microphone%1:06:00::'
synsetId: 03098803-n
simpleMeaning: A device made to pick up sound when it is set right against the thing that makes the sound,
  or against a surface that shakes with the sound.
scope: Also called contact mike. It is about a thing.
examples:
- The singer held a contact microphone against the guitar to catch its sound.
- A contact microphone on the table picked up every tap and knock.
