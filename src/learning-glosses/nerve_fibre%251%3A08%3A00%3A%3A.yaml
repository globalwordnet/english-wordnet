senseId: 'nerve_fibre%1:08:00::'
synsetId: 05471756-n
simpleMeaning: A thin thread that runs out from a cell that sends and takes in signals.
scope: Also called nerve fiber. It is a thin part of a cell, not the whole cell.
examples:
- The nerve fibre in the arm sent the signal to the spine.
- A cut nerve fibre no longer carries signals from the hand.
