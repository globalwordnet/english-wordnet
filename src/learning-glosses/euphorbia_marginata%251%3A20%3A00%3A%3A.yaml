simpleMeaning: An annual spurge of the western United States with showy white leaves surrounding its flower
  clusters and poisonous milky sap.
scope: 'Also called ghost weed, snow-in-summer and snow-on-the-mountain: a one-year spurge from the west
  of the United States, with bright white-bracted flower bunches and very poisonous milk.'
examples:
- Euphorbia marginata grew along the road in the west.
- Do not touch the milk of Euphorbia marginata; it is very poisonous.
