senseId: 'lingual_artery%1:08:00::'
synsetId: 05357804-n
simpleMeaning: An artery branching from the external carotid artery in the neck that supplies blood to
  the underside of the tongue.
scope: Also called arteria lingualis, this blood tube feeds the under side of the tongue, coming off the
  main blood tube in the neck.
examples:
- The lingual artery runs under the tongue.
- Blood reached the tongue through the lingual artery.
