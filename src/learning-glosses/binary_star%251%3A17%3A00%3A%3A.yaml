simpleMeaning: A pair of stars that orbit each other because of their mutual gravitational pull.
scope: Also called binary or a double star, this one names a pair of things in the sky.
examples:
- Through the telescope, the binary star showed itself as two points of light circling each other.
- The two stars stay together because each one pulls the other toward itself.
