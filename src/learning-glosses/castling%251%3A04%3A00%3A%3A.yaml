simpleMeaning: A chess move in which the king and a rook move together, with the rook crossing over the
  king to stand beside it.
scope: Castle is another name for this move in chess.
examples:
- White used castling to bring the king and a rook to new squares.
- Black answered with castling, and the rook came to stand beside the king.
