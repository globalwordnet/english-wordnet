simpleMeaning: A rank in the classification of living things below a phylum and above a class.
scope: It names a rank used in sorting living things, not one single kind of living thing.
examples:
- Scientists put the new fossil in a superclass above the old group.
- The superclass sits between a phylum and the ranks below it.
