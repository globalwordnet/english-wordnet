senseId: tripinnatifid%5:00:00:compound:00
synsetId: 02182341-s
simpleMeaning: Of a leaf shape, split into narrow feather-like parts, each part split the same way, and
  each of those parts split the same way again.
scope: This word describes the shape of a leaf, and it says nothing about the plant the leaf grows on.
examples:
- The tripinnatifid leaf had narrow lobes at every level.
- They drew the tripinnatifid leaf with all its narrow parts.
