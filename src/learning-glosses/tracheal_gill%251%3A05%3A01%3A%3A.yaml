simpleMeaning: A threadlike or leaflike gill connected to the breathing tubes of some young aquatic insects.
  It rarely remains in the adult insect.
scope: For the breathing parts of water insect young and nymphs.
examples:
- The tracheal gill helps the nymph breathe.
- Tracheal gills sit on the body.
