simpleMeaning: Meningitis caused by bacteria, an often fatal inflammation of the membranes around the
  brain and spinal cord.
scope: Cerebrospinal fever, cerebrospinal meningitis, and epidemic meningitis are other names for this
  illness.
examples:
- The fever swept through the town, and the doctors worked through the night.
- The old farmer died of the fever, and the whole village mourned.
