simpleMeaning: A soft, silver-white alkali metal that usually forms ions with one positive charge. It
  is the lightest metal and occurs in several minerals.
scope: Also called Li, atomic number 3; not the heavier metals of the same group.
examples:
- Lithium is the lightest metal known.
- Lithium salts are used in some drugs.
