simpleMeaning: Another way of calling a person, picked by them or given to them, used most of all in the
  central parts of a city.
scope: It is not the word a road is called by, or the word a firm uses for shares it holds for a customer.
examples:
- Her street name is Bonbon.
- People on the block called them by their street name.
