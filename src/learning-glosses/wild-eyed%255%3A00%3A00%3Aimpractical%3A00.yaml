simpleMeaning: Giving little thought to what can really be done, and full of grand hopes.
scope: This is also called romantic and quixotic, and it is not a cool look at the facts.
examples:
- They spoke of a wild-eyed dream of a world without war, with no plan for how to get there.
- The wild-eyed plan to rebuild the whole town ignored what the money could buy.
