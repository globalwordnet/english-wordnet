senseId: 'werdnig-hoffman_disease%1:26:00::'
synsetId: 14193552-n
simpleMeaning: An inherited disease caused by two altered gene copies. Brainstem and spinal nerve cells
  degenerate, causing muscle wasting and limp paralysis. Without treatment, death often occurs in early
  childhood.
scope: Not muscular dystrophy or polio, other illnesses that weaken muscles in children.
examples:
- Werdnig-Hoffman disease weakens a baby's muscles.
- The doctor said the child had Werdnig-Hoffman disease.
