simpleMeaning: One of the seven vertebrae, the hard parts that form the human spine, in the part of the
  body between the head and the shoulders.
scope: Also called a cervical vertebra.
examples:
- They broke a neck bone in the fall and had to wear a stiff collar.
- The doctor pointed to a neck bone on the X-ray.
