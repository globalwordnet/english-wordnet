senseId: 'forfend%2:41:00::'
synsetId: 02458770-v
simpleMeaning: To block anything bad, holding it back so that it never takes place.
scope: This sense is also called avoid, avert, deflect, obviate, debar, fend off, forefend, head off,
  stave off, or ward off.
examples:
- They took steps to forfend a strike by meeting the workers early.
- The new fence was built to forfend accidents on the road.
