simpleMeaning: Papers, or a guard travelling with a person, that let the person pass through a land without
  harm, above all in war.
scope: Also called safeguard. It is a noun.
examples:
- The safe-conduct let them cross the border without trouble.
- They showed the safe-conduct at every checkpoint.
