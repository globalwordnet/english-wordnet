simpleMeaning: Fragrant Old World perennial spreading by runners, with small white flowers and narrow
  leaves used in flavorings and sachets. Widely grown as ground cover, sometimes classed in Asperula.
scope: 'Also called fragrant bedstraw, sweet woodruff, waldmeister, woodruff, and Galium odoratum: a sweet-smelling
  Old World plant with small white flowers and narrow leaves, used for flavouring and in sachets.'
examples:
- Asperula odorata spread as ground cover beneath the old trees.
- We dried Asperula odorata leaves for the scent bags.
