senseId: 'noncallable_bond%1:21:00::'
synsetId: 13359795-n
simpleMeaning: A bond whose issuer cannot repay it before a specified date, usually the date the bond
  is due.
scope: The restriction governs the issuer’s right to redeem the bond early.
examples:
- The company issued a noncallable bond that would stay outstanding until maturity.
- Her noncallable bond protected her against early redemption by the issuer.
