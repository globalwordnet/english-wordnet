simpleMeaning: An inherited condition in which one altered gene copy can cause numerous tumors on nerves,
  patches of skin color, and sometimes developmental differences.
scope: A sickness passed down in families that brings many soft growths on nerves and spots on the skin,
  also called neurofibromatosis.
examples:
- Von Recklinghausen's disease runs in families.
- She was born with von Recklinghausen's disease.
