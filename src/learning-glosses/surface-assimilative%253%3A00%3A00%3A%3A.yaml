senseId: 'surface-assimilative%3:00:00::'
synsetId: 00008225-a
simpleMeaning: Able to gather bits of matter onto the outside of a thing, or to make them gather there.
scope: It is also called adsorbent and adsorptive.
examples:
- The surface-assimilative cloth picks up oil from the water.
- A surface-assimilative filter traps dust on its outer face.
