simpleMeaning: To do with the stopping of the usual monthly flow of blood for any reason other than pregnancy.
scope: Also called amenorrheic, amenorrhoeal, or amenorrhoeic, this one is not the stopping itself.
examples:
- The doctor noted the amenorrheal pattern in the patient's chart.
- They asked whether the amenorrheal signs pointed to a cause other than pregnancy.
