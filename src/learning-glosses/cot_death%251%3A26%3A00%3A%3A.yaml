simpleMeaning: The sudden and unexpected passing of a baby who seems healthy, while the baby sleeps.
scope: Also called crib death, infant death, sudden infant death syndrome, or SIDS, this one is about
  a baby, not a grown person.
examples:
- Their first child died of cot death when still a baby.
- The charity raises money to study cot death.
