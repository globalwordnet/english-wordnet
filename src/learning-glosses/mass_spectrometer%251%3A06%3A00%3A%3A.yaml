senseId: 'mass_spectrometer%1:06:00::'
synsetId: 03732007-n
simpleMeaning: An instrument that produces a mass spectrum by deflecting ions through a narrow slit and
  measuring their electric current with an electrometer.
scope: 'Also called spectrometer: it sorts charged bits of matter by weight, not a tool that only shows
  a spectrum of light.'
examples:
- The lab used a mass spectrometer to find the weight of the charged bits.
- A mass spectrometer bends the path of ions through a thin slit.
