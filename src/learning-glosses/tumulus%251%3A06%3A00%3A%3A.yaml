simpleMeaning: In archeology, a grave from long before people wrote things down lies under a pile of earth.
scope: Also called barrow, burial mound, and grave mound, this name is for a heap of earth over a very
  old grave, not the grave itself.
examples:
- They dug into the tumulus to reach the grave beneath it.
- Under the tumulus lay a grave from long before people wrote things down.
