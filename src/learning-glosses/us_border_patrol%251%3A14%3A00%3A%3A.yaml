simpleMeaning: The mobile US border enforcement agency that detects and prevents unauthorized entry between
  official ports of entry.
scope: The moving law force of the service for immigration and citizenship, also called the United States
  Border Patrol; not the coast guard that watches the shores and not the police of a single state.
examples:
- The US Border Patrol stopped the truck near the border.
- US Border Patrol agents watch the desert roads at night.
