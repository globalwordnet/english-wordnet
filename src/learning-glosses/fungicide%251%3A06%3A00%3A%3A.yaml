simpleMeaning: A substance that kills mushrooms, moulds, and other living things of their kind, or stops
  them from growing.
scope: This sense is also called antifungal, antifungal agent, antimycotic, and antimycotic agent.
examples:
- The gardener bought a fungicide to protect the roses.
- They sprayed fungicide on the leaves to stop the mould.
