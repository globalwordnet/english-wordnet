simpleMeaning: Said of a blood vessel whose wall has a weak, bulging spot, or of a person hurt by one.
scope: Aneurismal, aneurysmal, and aneurysmatic are other names for this one, which is said of the vessel
  or the person, not of the spot.
examples:
- The aneurismatic vessel needed watching, as its wall had thinned.
- They found the aneurismatic spot during the scan and kept the patient under watch.
