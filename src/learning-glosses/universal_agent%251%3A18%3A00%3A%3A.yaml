simpleMeaning: A person given power to act for someone else in all of that person's business dealings.
scope: Also called a general agent. It is a kind of representative, not the person who owns the business.
examples:
- The firm named a universal agent to act while the owner was abroad.
- The universal agent signed the papers for the sale of the house.
