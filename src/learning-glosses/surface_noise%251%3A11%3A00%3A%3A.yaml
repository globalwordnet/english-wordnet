simpleMeaning: The small needle of a machine that plays records rubs against the turning disc and makes
  a sound.
scope: This is the sound of the needle rubbing on the turning disc, not the music on the record itself.
examples:
- They could hear surface noise as the disc turned.
- The surface noise spoiled the quiet parts of the song.
