simpleMeaning: To stop something bad from happening, or to keep it away before it can do harm.
scope: Also called avoid, avert, deflect, obviate, debar, fend off, forefend, forfend, head off, and ward
  off. It is an action.
examples:
- They staved off the attack by acting early.
- Quick work staved off a worse result.
