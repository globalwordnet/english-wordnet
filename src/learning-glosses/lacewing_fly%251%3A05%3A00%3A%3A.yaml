simpleMeaning: An insect of the green or brown lacewing family, with delicate, netlike wings. Its larvae
  eat pests such as aphids.
scope: Also called lacewing, this is an insect whose young eat aphids, with thin clear sheets like fine
  net.
examples:
- A lacewing fly landed on the rose bush.
- Gardeners welcome the lacewing fly because its young eat aphids.
