simpleMeaning: Marine crustaceans, such as barnacles, that catch food with feathery limbs. Their larvae
  swim freely, and adults form hard shells and live attached to underwater surfaces.
scope: Another name for a barnacle; the shelled sea animal, not the goose.
examples:
- A cirripede sweeps the water with feathery limbs.
- Cirripedes crowd the tidal rocks.
