simpleMeaning: Blood from the lower leg drains through these veins into the one behind the knee.
scope: This is also called vena tibialis, a vessel of the lower leg, not the one behind the knee itself.
examples:
- The tibial vein in their lower leg carried blood to the vein behind the knee.
- They traced the tibial vein as it emptied into the vein behind the knee.
