simpleMeaning: Combining elements of tragedy and comedy.
scope: This is also called tragicomic, and it is not a thing that is sad all through, or funny all through.
examples:
- The film was tragicomical, with a sad end to a funny story.
- They called the evening tragicomical, because they laughed through tears.
