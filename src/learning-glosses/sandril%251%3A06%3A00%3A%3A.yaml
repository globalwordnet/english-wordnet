simpleMeaning: A brand of reserpine, a blood-pressure medicine derived from Rauwolfia serpentina and also
  sold as Raudixin, Rau-Sed, or Serpasil.
scope: Also called reserpine, Rau-Sed, Raudixin, and Serpasil; a drug that lowers high blood pressure,
  made from a chemical of the Rauwolfia plant.
examples:
- The doctor gave her Sandril to bring her blood pressure down.
- Sandril is one of the trade names for this blood-pressure drug.
