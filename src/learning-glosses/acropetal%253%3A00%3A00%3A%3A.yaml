simpleMeaning: Said of leaves or flowers, for ones that grow or open one after another from the base to
  the top.
scope: This one is not about growth that starts at the top.
examples:
- The acropetal flowers on the stem open from the base upward, one after another.
- These acropetal leaves grow in turn, the lowest ones first.
