senseId: 'phonogram%1:10:00::'
synsetId: 06834773-n
simpleMeaning: Any written mark that stands for a sound, a syllable, a part of a word that carries meaning,
  or a whole word.
scope: It is a written mark, not limited to one speech sound.
examples:
- The phonogram 'tion' stands for the sounds at the end of 'nation'.
- In this writing system, one phonogram can stand for a whole word.
