senseId: 'unitisation%1:09:00::'
synsetId: 05739513-n
simpleMeaning: In psychology, the joining of small bits of information into large groups that work together.
scope: Also called chunking and unitization. It is not the packing of goods, and it is not the joining
  of oil fields.
examples:
- Unitisation helps us remember a phone number as three groups, not ten single digits.
- Through unitisation, the mind turns many small facts into a few large ideas.
