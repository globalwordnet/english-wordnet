senseId: 'non_sequitur%1:10:00::'
synsetId: 07214474-n
simpleMeaning: An answer that has nothing to do with what was said just before it.
scope: It is an answer, not a claim in logic that fails to follow from its reasons.
examples:
- When asked about the cost, the speaker gave a non sequitur about the weather.
- '''I like trains,'' the guest said - a non sequitur in a talk about dinner.'
