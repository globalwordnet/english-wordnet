simpleMeaning: To deal with something in a hurry, or to dodge it instead of handling it well.
scope: This one is also called skate over, skimp over, slur over, and smooth over.
examples:
- The teacher glossed over the hard part of the lesson.
- They glossed over the details and moved on to the next topic.
