simpleMeaning: The addition of an acetyl group, a small group of atoms, to a chemical compound.
scope: This one is done to a compound by something else, not by the compound itself.
examples:
- The acetylation of the protein changed how it worked in the cell.
- They studied the acetylation that aspirin brings about in the body.
