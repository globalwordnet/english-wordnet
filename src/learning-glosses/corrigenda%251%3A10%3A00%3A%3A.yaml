simpleMeaning: A list in a book of the mistakes made in printing it, with the right wording given for
  each one.
scope: This one is about a list, not one single mistake.
examples:
- The corrigenda at the back of the book list the mistakes in the printing.
- They checked the corrigenda before they quoted the passage.
