simpleMeaning: The free-swimming young of a sea squirt, with a tadpole-like tail containing a flexible
  supporting rod called a notochord.
scope: This is the free-swimming young of a sea squirt, with a tail that holds the cord that becomes the
  backbone.
examples:
- The ascidian tadpole swam free in the sea.
- The ascidian tadpole moved by its tail through the water.
