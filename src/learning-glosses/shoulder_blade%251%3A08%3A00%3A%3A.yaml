simpleMeaning: One of the two flat bones, each shaped like a triangle, that lie at the back of a person's
  body, one on the left and one on the right.
scope: It is also called the scapula and a shoulder bone.
examples:
- The X-ray showed the shoulder blade clearly.
- The shoulder blade sits at the back of the shoulder.
