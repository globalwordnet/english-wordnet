schema: oewn-learning-gloss-v2
senseId: 'tautology%1:10:00::'
synsetId: 07105406-n
simpleMeaning: Saying the same thing again in different words, for no good reason.
scope: It is the repetition itself, not a word that describes it.
examples:
- To say that something is ‘adequate enough’ is a tautology.
- Saying 'a free gift' is a tautology, since a gift is free by definition.
