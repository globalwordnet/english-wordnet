senseId: 'ventricular_fold%1:08:00::'
synsetId: 05538290-n
simpleMeaning: Either of the two folds above the true vocal cords that normally play no part in producing
  the voice.
scope: Also called false vocal cord, false vocal fold, superior vocal cord, and vestibular fold. It is
  one of the upper pair, not one of the lower pair that makes sound.
examples:
- The doctor saw that the ventricular fold was red and swollen.
- The ventricular fold lay above the cord that makes the voice.
