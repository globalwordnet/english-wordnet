simpleMeaning: A railway car at the very back of a train, made to come off by itself while the train rolls
  on.
scope: Also called slip carriage. It is a noun.
examples:
- The slip coach was unhooked at the junction while the train kept going.
- They rode in the slip coach, which stopped at the small town.
