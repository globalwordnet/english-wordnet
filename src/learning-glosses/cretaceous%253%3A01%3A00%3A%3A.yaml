simpleMeaning: Relating to or naming the Cretaceous, the third and final period of the Mesozoic Era.
scope: To do with the third period of the Mesozoic era, not the periods before or after it.
examples:
- These rocks date from the Cretaceous period.
- The Cretaceous period is the third period of the Mesozoic era.
