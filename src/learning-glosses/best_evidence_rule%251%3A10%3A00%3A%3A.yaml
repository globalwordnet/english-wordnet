simpleMeaning: 'A rule that calls the original itself the strongest proof: to show what a written paper,
  a recording, or a photograph says, you must bring the original.'
scope: This one names a point of law.
examples:
- The lawyer cited the best evidence rule in court.
- Under the best evidence rule, the court wanted the original letter.
