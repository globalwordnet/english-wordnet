senseId: 'siderochrestic_anaemia%1:26:00::'
synsetId: 14191929-n
simpleMeaning: An anemia that can be difficult to treat, in which iron collects abnormally inside developing
  red blood cells in the bone marrow.
scope: A blood illness that does not get better with treatment, also called sideroblastic anaemia, sideroblastic
  anemia, or siderochrestic anemia; not a blood illness from too little iron and not a short illness of
  the blood.
examples:
- The doctor said she had siderochrestic anaemia.
- Siderochrestic anaemia does not get better with the usual treatment.
