scope: Red-backed sandpiper is another name for this small shore bird, which nests in the far north and
  spends the cold months in the southern United States or round the Mediterranean.
examples:
- A dunlin fed at the edge of the tide as the water went out.
- The dunlin spent the cold months in the south before flying north to nest.
