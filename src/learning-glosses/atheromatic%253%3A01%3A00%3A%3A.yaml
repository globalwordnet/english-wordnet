simpleMeaning: To do with a fatty deposit in the wall of a blood vessel, or looking like one.
scope: Also called atheromatous, this is about a deposit, not the vessel itself.
examples:
- The atheromatic lump in the wall of the artery worried the doctors.
- The scan showed atheromatic patches along the artery wall.
