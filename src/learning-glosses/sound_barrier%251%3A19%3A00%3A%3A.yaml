simpleMeaning: The increase in air resistance as an aircraft approaches the speed of sound.
scope: The sonic barrier is another name for the air pulling harder and harder against a plane as it closes
  on the speed of noise.
examples:
- The plane met the sound barrier as it neared the speed of noise.
- The sound barrier held the plane back.
