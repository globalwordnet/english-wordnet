simpleMeaning: How little what the senses take in must shift before a person can notice the shift.
scope: This one is also called difference threshold, differential limen, and differential threshold.
examples:
- The researchers measured the difference limen by raising the sound in tiny steps until the listeners
  noticed a change.
- The cook added salt a pinch at a time, staying below the difference limen so no one would taste the
  change.
