simpleMeaning: An older term for an abnormally enlarged lymph node, one of the small structures that help
  the body fight infection.
scope: In this sense, the word describes enlargement. The cause requires separate medical assessment.
examples:
- The doctor felt a lymphadenoma under her jaw.
- A lymphadenoma can stay swollen for weeks.
