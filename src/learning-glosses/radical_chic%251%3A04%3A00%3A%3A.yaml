simpleMeaning: A fashionable show of support for radical left-wing politics, including adopting the clothes
  and lifestyle associated with those views.
scope: A put-on show of far-left views with smart dress and way of life, not real far-left belief and
  not plain fashion.
examples:
- Her radical chic drew laughs at the party.
- He took up radical chic to seem bold among his rich friends.
