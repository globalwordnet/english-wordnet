simpleMeaning: A fairly small amount of money passed to someone in return for help, as to a waiter.
scope: This one is also called a tip, a gratuity, backsheesh, bakshis, bakshish, and pourboire.
examples:
- They left a baksheesh on the table for the waiter.
- The porter smiled when handed a baksheesh.
