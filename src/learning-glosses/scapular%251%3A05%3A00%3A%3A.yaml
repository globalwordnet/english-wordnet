simpleMeaning: A bird's shoulder is covered by this feather.
scope: This is the shoulder feather of a bird, not the garment worn over the shoulders and not a word
  for the shoulder blade itself.
examples:
- The scapular lay flat over the bird's shoulder.
- The bird shook its wing, and the scapular settled back over its shoulder.
