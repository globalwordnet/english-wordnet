senseId: 'trustingness%1:07:00::'
synsetId: 04902441-n
simpleMeaning: The trait of believing what others say as true and leaning on them to do what they promise.
scope: Also called trust and trustfulness, this name is for the trait of believing others, not a belief
  about one single person.
examples:
- Their trustingness made them accept the new worker's word about the delay.
- Their trustingness showed in the way they left the shop in the care of a helper.
