simpleMeaning: Meningitis, an illness in which germs make the coverings of the brain and the backbone
  swell, and which often kills the person who has it.
scope: Brain fever, cerebrospinal meningitis and epidemic meningitis are other names for this illness.
examples:
- The child was taken to hospital with cerebrospinal fever.
- Two pupils at the school were off sick with cerebrospinal fever.
