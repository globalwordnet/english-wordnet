simpleMeaning: To say out loud what displeases you, and how unhappy it has made you.
scope: Kick, plain, complain, kvetch, and quetch are other names for saying what displeases you, not for
  speaking your mind freely on any matter.
examples:
- Mother sounded off all day.
- They sounded off all day about the work.
