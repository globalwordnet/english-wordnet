simpleMeaning: A very large, heavy dog bred in Newfoundland, with a thick, rough, usually black coat.
  Dogs of this breed are intelligent and strong swimmers.
scope: 'Also called Newfoundland dog: a kind of very large heavy dog with a thick rough coat, most often
  black, very clever and a strong swimmer, first bred on the island of the same name.'
examples:
- The Newfoundland swam out to the boat with ease.
- Our Newfoundland is a very large heavy dog with a black coat.
