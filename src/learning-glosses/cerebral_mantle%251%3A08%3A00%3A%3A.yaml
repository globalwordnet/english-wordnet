simpleMeaning: The outer layer of the cerebrum, made of gray matter containing many nerve cell bodies
  and fibers without a myelin covering.
scope: This layer of grey matter is also called cerebral cortex, cortex, or pallium.
examples:
- In the textbook picture, the cerebral mantle was shown in grey.
- The surgeon worked with great care near the cerebral mantle.
