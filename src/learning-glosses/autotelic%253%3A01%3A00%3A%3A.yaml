simpleMeaning: Done for its own sake, or relating to the belief that an activity can be its own purpose.
scope: This one is about the purpose behind doing a thing.
examples:
- They painted in an autotelic way, caring only for the work itself.
- The music was autotelic, made for its own sake and not for fame.
