senseId: 'unconstitutionality%1:07:01::'
synsetId: 92417425-n
simpleMeaning: The state of a law or act that goes against the country's basic law and breaks its rules.
scope: This word is used when a law or act fails to fit the country's basic law, not when it fits it.
examples:
- The court ruled on the unconstitutionality of the act.
- They argued about the unconstitutionality of the law.
