senseId: 'subduedness%1:07:00::'
synsetId: 04963084-n
simpleMeaning: How little shine or force a light or a sound gives off.
scope: This sense is also called dimness; it is the softness of lights or sounds, not the lights or sounds
  themselves.
examples:
- They liked the subduedness of the lamps.
- The subduedness of the music was plain to hear.
