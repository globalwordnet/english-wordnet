simpleMeaning: Said of something that has to do with, or looks like, tiny living things with no fixed
  shape.
scope: Also called amoebic, ameban, amebous, amoeban, or amoebous, this one marks a likeness, not an identity.
examples:
- The doctor wrote down amebic dysentery as the cause of the illness.
- The amebic growth on the slide had no fixed shape.
