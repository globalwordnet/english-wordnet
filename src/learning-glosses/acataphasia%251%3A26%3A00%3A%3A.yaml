simpleMeaning: A disorder in which damage to the brain or spinal cord makes it difficult to form a statement
  or express thoughts in an organized way.
scope: It is a disorder of speech after damage to the brain and spinal cord, in which a person cannot
  put a sentence together or speak in an orderly way.
examples:
- Acataphasia left him unable to put a sentence together.
- Her acataphasia made every statement come out in a jumble.
