simpleMeaning: Said of an animal that lives by hunting others for food, above all by seizing live animals.
scope: Also called predatory, ravening, rapacious, vulturous, and raptorial. It is said of an animal,
  not of a plant.
examples:
- The vulturine bird circled above the field, watching for live prey.
- Vulturine hunters take their prey alive rather than feeding on dead animals.
