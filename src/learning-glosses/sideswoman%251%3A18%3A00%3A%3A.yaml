simpleMeaning: A female helper in the Church of England takes in gifts of money in the church for the
  churchwarden, the person who looks after the church.
scope: In the Church of England, this female helper takes in gifts of money in church, while a sidesman
  does the same work as a male helper.
examples:
- The sideswoman collected the offerings of money in the church.
- The churchwarden asked the sideswoman to take in the money gifts.
