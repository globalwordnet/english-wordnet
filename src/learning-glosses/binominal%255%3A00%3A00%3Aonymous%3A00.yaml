simpleMeaning: Having two names, especially the genus and species names used together to identify an organism.
scope: Also called binomial, this one is said of living things.
examples:
- The binomial nomenclature of bacteria gives every kind two names.
- A binominal name has two parts, one for the genus and one for the species.
