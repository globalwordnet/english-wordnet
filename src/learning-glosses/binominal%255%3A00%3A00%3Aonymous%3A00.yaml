senseId: binominal%5:00:00:onymous:00
synsetId: 00121993-s
simpleMeaning: Said of something that has two names, or is marked by two names, above all the two names
  of a living thing in the naming system.
scope: Also called binomial, this one is said of living things.
examples:
- The binomial nomenclature of bacteria gives every kind two names.
- A binominal name has two parts, one for the genus and one for the species.
