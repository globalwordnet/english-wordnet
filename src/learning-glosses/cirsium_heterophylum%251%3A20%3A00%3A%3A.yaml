simpleMeaning: A northern European thistle that lives for several years and spreads by runners. Its pointed,
  lance-shaped leaves grow at the base, and its reddish-purple flower heads usually grow singly.
scope: 'Also called melancholy thistle or Cirsium helenioides: a long-lived thistle of northern Europe
  that spreads by runners along the ground, with long narrow leaves at its base and usually single heads
  of reddish-purple flowers.'
examples:
- Cirsium heterophylum grew in the damp meadow.
- The Cirsium heterophylum had reddish-purple flowers.
