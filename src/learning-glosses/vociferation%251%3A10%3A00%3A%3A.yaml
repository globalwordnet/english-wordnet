senseId: 'vociferation%1:10:00::'
synsetId: 07135232-n
simpleMeaning: People say things out loud and strongly, most often when they are against something.
scope: This is also called a call, a cry, a shout, a yell, or an outcry, and it is not a quiet word said
  in private.
examples:
- Their vociferation filled the hall as they protested the new rules.
- The speaker was interrupted by vociferation from the rear of the audience.
