simpleMeaning: Believing whatever one hears, as a small child does, without asking whether it is true.
scope: Also called simple, childlike, dewy-eyed, and wide-eyed, it describes a person who believes whatever
  is said, not a pair of wide-open eyes.
examples:
- They listened in round-eyed wonder.
- The round-eyed child believed all that was said.
