simpleMeaning: The loss of the ability to tell what a thing is by holding it in the hand.
scope: This one is also called tactile agnosia.
examples:
- The test for astereognosis asked them to hold a coin in their hand and say what it was.
- They could not tell a cup from a plate by touch alone, because of astereognosis.
