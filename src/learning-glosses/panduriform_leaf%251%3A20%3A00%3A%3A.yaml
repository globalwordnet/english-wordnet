simpleMeaning: A leaf shaped like a fiddle, with rounded ends and a narrow middle.
scope: Also called a pandurate leaf. It is a part of a plant.
examples:
- A panduriform leaf lay pressed inside the old book, its fiddle shape still clear.
- The gardener showed us a panduriform leaf, wide at both ends and narrow in the middle.
