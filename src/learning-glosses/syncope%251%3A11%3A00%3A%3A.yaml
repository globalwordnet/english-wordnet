simpleMeaning: A loss of awareness that comes on by itself when too little blood reaches the brain.
scope: Also called faint, swoon, or deliquium. It is not the loss of sounds from inside a word.
examples:
- The heat made the runner suffer a syncope in the crowded hall.
- After the syncope, the doctor checked the blood flow to the patient's brain.
