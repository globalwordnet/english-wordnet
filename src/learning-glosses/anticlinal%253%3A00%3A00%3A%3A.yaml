simpleMeaning: Sloping down and away from a high ridge shared with other slopes.
scope: It is not used of slopes that rise up to meet a ridge.
examples:
- The geologists mapped the anticlinal ridge across the whole valley.
- They found the anticlinal structure by tracing the dip of the rock layers.
