senseId: 'weapon_of_mass_destruction%1:06:00::'
synsetId: 04573249-n
simpleMeaning: A weapon capable of causing widespread death or injury among civilians and military personnel,
  such as a nuclear, chemical, or biological weapon.
scope: The name covers atom bombs, poison gas, and germ weapons, each able to kill or hurt ordinary people
  as well as soldiers.
examples:
- The treaty bans every weapon of mass destruction.
- No country should use a weapon of mass destruction.
