simpleMeaning: The ratio of the stress applied to an elastic material to its resulting strain, a measure
  of how strongly it resists deformation.
scope: This one is also called elastic modulus and modulus of elasticity.
examples:
- The engineer looked up the coefficient of elasticity for steel.
- They used the coefficient of elasticity to work out how much the beam would bend.
