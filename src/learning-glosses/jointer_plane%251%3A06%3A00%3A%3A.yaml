simpleMeaning: A long smoothing tool for a woodworker, used to shape board edges so that boards fit together.
scope: It is also called a jointer or a jointing plane, and a long plane is another name for it.
examples:
- The carpenter reached for the jointer plane to smooth the edge of the board.
- The jointer plane took a thin shaving off the board edge.
