senseId: 'nerve_ending%1:08:00::'
synsetId: 05476684-n
simpleMeaning: The tip of an axon, a strand sending signals out of a cell, that does not stop at a synapse,
  where signals pass from one cell to the next.
scope: Also called nerve end. It is an axon tip, not a join between cells.
examples:
- The doctor pressed a nerve ending in the toe to test feeling.
- That nerve ending sends its signal no further than the skin.
