simpleMeaning: The symbol for the volt, a unit of electric potential equal to one watt per ampere, or
  the voltage across one ohm carrying one ampere.
scope: The unit that tells how hard power pushes through a wire; also called volt, and not the metal,
  and not the letter.
examples:
- The battery gives twelve volts.
- One volt is a small push.
