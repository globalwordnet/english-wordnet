synsetId: 13435727-n
simpleMeaning: A written agreement, property, or money given to a third person or put in trust by one
  side of a deal, to be returned when a set condition is met.
scope: It is about a holding, not the deal itself.
examples:
- The buyer put the money in escrow until the house was sold.
- The escrow held the papers until both sides signed.
