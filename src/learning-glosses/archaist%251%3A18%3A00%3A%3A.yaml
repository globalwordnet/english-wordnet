simpleMeaning: Someone whose work is the study of old things from long ago, or the gathering of them.
scope: Also called antiquarian and antiquary, this one is not a person who makes things look old.
examples:
- The archaist spent years tracking down Roman coins.
- They asked the archaist to value the old manuscripts.
