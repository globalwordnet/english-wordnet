simpleMeaning: A round worm gets into a person's body and lives there, and this often happens in warm
  lands where clean water and good toilets are hard to find.
scope: This is the name of a sickness caused by a round worm.
examples:
- People in warm lands with poor sanitation often get trichuriasis.
- A round worm got into their body and caused trichuriasis.
