simpleMeaning: Said of a person who does paid work, above all work with the hands or in a factory.
scope: Also called blue-collar, propertyless, and working-class. It is said of workers.
examples:
- The wage-earning families in the town worked in the mills.
- Wage-earning workers built the new houses.
