simpleMeaning: To keep sudden jumps in current from harming machines, this device is fitted into a power
  line.
scope: Also called lightning arrester, spike suppressor, surge protector and surge suppressor, this device
  is fitted into a power line so that sudden jumps in current do not reach the machines.
examples:
- They fitted a spike arrester into the power line.
- The spike arrester kept the machines safe when the current jumped.
