simpleMeaning: The act of opening a dead body and looking at it closely to learn why death came or how
  sickness changed the body.
scope: It is also called autopsy, postmortem, necropsy, post-mortem, postmortem examination, or PM.
examples:
- The post-mortem examination took three hours to finish.
- A post-mortem examination was done to find why the patient had died.
