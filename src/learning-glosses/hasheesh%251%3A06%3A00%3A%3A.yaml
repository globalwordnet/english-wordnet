simpleMeaning: A purified extract of cannabis resin used as a drug that can cause hallucinations.
scope: A cleaned sticky extract of the hemp plant, used as a drug that makes people see things that are
  not there, not the raw plant and not another drug; hash, hashish and haschisch are other names for this
  sense.
examples:
- He smoked hasheesh and saw strange visions.
- Hasheesh comes from the hemp plant.
