simpleMeaning: A plant-eating dinosaur that walked on two legs and had a bony dome up to ten inches thick
  on its head. It was the largest known dome-headed dinosaur.
scope: 'Also called pachycephalosaur: this two-legged plant-eater carries ten inches of bone on its head
  and is the biggest thick-headed kind ever found.'
examples:
- The pachycephalosaurus skull had ten inches of bone on top of its head.
- A pachycephalosaurus walked on two legs and ate plants.
