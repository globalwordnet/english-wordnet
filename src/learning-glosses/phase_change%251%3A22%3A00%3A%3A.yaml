senseId: 'phase_change%1:22:00::'
synsetId: 13557219-n
simpleMeaning: A move from one form of matter, solid, liquid, or gas, to another, with what it is made
  of staying the same.
scope: Also called phase transition, physical change, and state change. It is a move.
examples:
- When water freezes, a phase change turns it to ice.
- Melting is a phase change from solid to liquid.
