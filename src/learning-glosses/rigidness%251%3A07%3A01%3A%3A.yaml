simpleMeaning: A harsh strictness that allows no softening or change.
scope: Also called rigidity and inflexibility. It is a quality of manner, not the physical stiffness of
  a thing.
examples:
- The rigidness of the rules left no room for excuses.
- People feared the rigidness of the new head of the school.
