senseId: 'sellotape%1:06:00::'
synsetId: 02996250-n
simpleMeaning: A brand of clear or partly transparent adhesive tape used to seal, attach, or mend things.
  Scotch is another brand.
scope: cellulose tape and Scotch tape are other names for this sense; not glue and not plain paper tape.
examples:
- She fixed the torn page with Sellotape.
- A strip of Sellotape held the poster to the wall.
