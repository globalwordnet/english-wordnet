senseId: 'divisor%1:23:01::'
synsetId: 13755542-n
simpleMeaning: One of the whole numbers, two or more in all, that go into another whole number exactly,
  with nothing left over.
scope: This one is also called a factor.
examples:
- 3 is a divisor of 6, since 6 divided by 3 leaves nothing over.
- The divisors of 12 are 1, 2, 3, 4, 6, and 12.
