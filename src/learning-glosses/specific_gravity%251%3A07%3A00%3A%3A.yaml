simpleMeaning: The density of a substance divided by the density of water, comparing the masses of equal
  volumes.
scope: It is about a comparison, not about a weight on its own.
examples:
- Scientists use specific gravity to compare a sample with water.
- The specific gravity of the sample told them how dense it was.
