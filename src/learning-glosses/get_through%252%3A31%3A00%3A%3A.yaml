simpleMeaning: To turn plain in a person's mind, or to settle deep in their feelings.
scope: This sense is also called click, dawn, penetrate, come home, fall into place, get across, and sink
  in.
examples:
- It took a while, but the news finally got through to them.
- The joke got through to the crowd at last, and everyone laughed.
