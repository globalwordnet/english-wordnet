simpleMeaning: Water where reefs, sandbanks, and shallow places lie just below the surface, out of sight.
scope: Reefy, shelfy, and shelvy are other names for such water, where reefs, sandbanks, and shallow places
  lie just below the surface.
examples:
- The boat crossed the shoaly waters.
- The shoaly waters were full of sandbanks just under the surface.
