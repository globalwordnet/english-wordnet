simpleMeaning: A way of finding faults in a computer by seeing whether a count is even or odd.
scope: Also called odd-even check or redundancy check. It is a test.
examples:
- The parity check caught the fault before the file was saved.
- Every block of data goes through a parity check on its way into memory.
