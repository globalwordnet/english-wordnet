simpleMeaning: The point, currently in Pisces, where the Sun crosses the celestial equator heading north
  in March.
scope: This is the spring point in Pisces, not the autumn one.
examples:
- At the vernal equinox, day and night last the same time.
- They marked the vernal equinox as the first day of spring.
