simpleMeaning: An acute brain disorder caused by a shortage of thiamine, or vitamin B1, often associated
  with long-term heavy drinking.
scope: This is a brain illness from too little thiamine, a vitamin, that slowly breaks the brain down
  over time, and it is often, but not always, tied to heavy drinking.
examples:
- Wernicke's encephalopathy can follow years of heavy drinking.
- The doctor linked his Wernicke's encephalopathy to a lack of thiamine.
