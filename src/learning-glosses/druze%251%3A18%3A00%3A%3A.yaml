simpleMeaning: A member of a monotheistic religious community with esoteric teachings, historically centered
  in the mountains of Syria and Lebanon, whose beliefs include the divinity of al-Hakim.
scope: A follower of a secret faith that holds one God, also called a Druse; not a Muslim and not a Christian.
examples:
- A Druze elder welcomed us to the mountain village.
- Many Druze families have lived in the mountains of Lebanon for centuries.
