simpleMeaning: A chickweed whose hair-covered leaves are silver-grey, with white flowers that grow rather
  big.
scope: Love-in-a-mist and Cerastium tomentosum are other names for this chickweed, whose hair-covered
  leaves are silver-grey, not the poisonous spurge that shares its name.
examples:
- The snow-in-summer had large white flowers.
- The snow-in-summer spread its silver-grey leaves.
