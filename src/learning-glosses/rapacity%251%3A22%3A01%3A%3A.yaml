simpleMeaning: The quality of getting food from live animals taken as prey, most often by birds.
scope: It is also called predaceousness, predaciousness, or rapaciousness.
examples:
- The rapacity of carnivorous animals has been considered by some writers to have had a considerable effect
  on the distribution and even on the extinction of others.
- The owl's rapacity was plain to see as it hunted mice through the night.
