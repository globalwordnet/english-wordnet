simpleMeaning: A North American plant with large leaves and long clusters of yellowish-green flowers.
  It contains a poisonous alkaloid formerly used in medicine.
scope: 'Also called bugbane, white hellebore, Indian poke or Veratrum viride: a plant of North America
  with large leaves and yellowish-green flowers in long bunches, giving a poisonous substance used as
  a drug.'
examples:
- American hellebore grows in the wet meadow, its yellowish-green flowers in long bunches.
- The leaves of American hellebore are large and broad.
