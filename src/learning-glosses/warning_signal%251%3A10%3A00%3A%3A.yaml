simpleMeaning: With no one setting it off, this signal warns people of danger, most often by a sound.
scope: This is also called an alarm, an alert, or an alarum, and it is not one someone sets off by hand.
examples:
- The warning signal sounded when the fire started.
- They heard the warning signal in the night and knew something was wrong.
