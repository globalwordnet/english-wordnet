senseId: 'closed-circuit_television%1:06:00::'
synsetId: 03053051-n
simpleMeaning: A television system that sends pictures by cable to designated monitors, such as those
  in a factory or theater, without broadcasting publicly.
scope: A wired system for chosen screens in one building, not a broadcast service and not a home set for
  public shows.
examples:
- The factory uses closed-circuit television to watch the gates.
- Guards check the closed-circuit television screens every hour.
