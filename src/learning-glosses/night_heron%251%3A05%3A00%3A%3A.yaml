simpleMeaning: A long-legged bird that looks for food in the dark after the sun has set, or in the half-light
  of early morning and evening.
scope: It is also called a night raven.
examples:
- We saw a night heron standing in the reeds at dusk.
- The night heron flew over the marsh as the sun went down.
