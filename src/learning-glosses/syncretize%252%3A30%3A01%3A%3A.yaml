senseId: 'syncretize%2:30:01::'
synsetId: 00369175-v
simpleMeaning: It takes beliefs that clash, and rules of thought that clash, and makes them one.
scope: This is the act of joining beliefs that clash, or rules of thought that clash, into one; the same
  act is also called syncretise.
examples:
- The writer tried to syncretize the clashing beliefs into one.
- The new book tried to syncretize the old faith with the new one.
