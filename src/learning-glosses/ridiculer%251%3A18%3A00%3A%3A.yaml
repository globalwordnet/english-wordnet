simpleMeaning: One who gets laughs by mocking what others do, with mock praise and sharp, cutting remarks.
scope: One who gets laughs by mocking, also called an ironist or a satirist, rather than one who makes
  people laugh with kind jokes.
examples:
- The ridiculer mocked them with mock praise.
- The ridiculer's sharp remarks made people laugh.
