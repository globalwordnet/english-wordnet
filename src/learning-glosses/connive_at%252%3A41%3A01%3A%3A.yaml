senseId: 'connive_at%2:41:01::'
synsetId: 02422489-v
simpleMeaning: To let something happen by saying nothing against it, as if one agreed with it.
scope: Also called wink at, it is silent agreement, not open praise or a spoken yes.
examples:
- The guards connived at the prisoners' escape by doing nothing to stop it.
- The teacher connived at the late homework and said nothing about it.
