simpleMeaning: A lump breaks off from a clot and blocks a blood vessel.
scope: This is a blockage in a blood vessel, not one where the clot formed in place.
examples:
- They found a thromboembolism blocking a blood vessel.
- A thromboembolism blocks a blood vessel, so the blood cannot get through.
