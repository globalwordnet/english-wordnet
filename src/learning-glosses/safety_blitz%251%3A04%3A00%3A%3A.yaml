simpleMeaning: In American football, a play in which a safety rushes toward the quarterback to help the
  defense break through the offensive line.
scope: Also called blitz and linebacker blitzing. It is a noun.
examples:
- The safety blitz caught the other team's quarterback by surprise.
- They called a blitz on third down to stop the drive.
