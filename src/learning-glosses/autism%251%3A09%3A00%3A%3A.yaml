simpleMeaning: A developmental condition that varies from person to person and can involve differences
  in social communication and sensory processing, focused interests, and repetitive behaviors.
scope: A condition of the mind over a wide range, shaping talk, sense signals, keen interests, and repeated
  ways of acting, not a passing mood.
examples:
- Autism affects how people talk with others and take in the world around them.
- Support for autism helps each person in their own way.
