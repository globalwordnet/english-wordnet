simpleMeaning: Said of a thing that has to do with the feelings or ideas that a word brings to mind as
  well as its plain meaning.
scope: Also called connotative of. It is about words.
examples:
- The connotational side of the word 'home' brings to mind warmth and safety.
- They picked the word for its connotational colour, not its plain sense.
