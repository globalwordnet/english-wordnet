senseId: 'tercentenary%1:28:00::'
synsetId: 15276568-n
simpleMeaning: A day that marks 300 years since something happened, or a gathering held to mark it.
scope: Also called tercentennial and triennial. It is not the 100th anniversary.
examples:
- The town held a tercentenary to mark 300 years since its founding.
- They planned the tercentenary for the spring of next year.
