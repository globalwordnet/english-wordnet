senseId: 'congelation%1:22:00::'
synsetId: 13472681-n
simpleMeaning: The change of a liquid into a solid when it freezes, or as if it had frozen.
scope: Also called congealment, this one is about a change of state.
examples:
- The sauce showed congelation as it cooled on the stove.
- The doctor noted congelation in the sample after it sat in the cold.
