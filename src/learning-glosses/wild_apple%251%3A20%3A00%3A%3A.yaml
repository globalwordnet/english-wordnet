simpleMeaning: This apple tree grows on its own, one of many kinds, and most often bears small, sour fruit.
scope: This tree is also called crabapple and crab apple, and it is not one grown by people.
examples:
- A wild apple grew by the old wall, its small fruit sour to the taste.
- They found a wild apple growing on its own at the edge of the wood.
