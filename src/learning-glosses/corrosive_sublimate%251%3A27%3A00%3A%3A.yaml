simpleMeaning: Mercury chloride, a white, poisonous mercury compound that forms soluble crystals, used
  as a pesticide, antiseptic or wood preservative.
scope: This is a white, poisonous crystal of mercury used to kill pests, to keep wounds free of germs
  or to keep wood sound; bichloride of mercury, mercuric chloride and mercury chloride are other names
  for it.
examples:
- The corrosive sublimate in the jar was a white crystal.
- Corrosive sublimate can kill pests, but it is poisonous.
