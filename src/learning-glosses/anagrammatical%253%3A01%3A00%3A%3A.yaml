simpleMeaning: Said of a word built from the moved letters of another word, or of one that holds or makes
  such a word.
scope: Also called anagrammatic, it marks a word made by moving letters, not a word left as it is.
examples:
- The anagrammatical clue hid the answer in mixed-up letters.
- The children played an anagrammatical game on the rainy day.
