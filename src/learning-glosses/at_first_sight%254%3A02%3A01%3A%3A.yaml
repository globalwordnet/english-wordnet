synsetId: 00104016-r
simpleMeaning: After an early look, what seemed true is shown to be wrong.
scope: Also called at first glance, this one is not about a look that holds up.
examples:
- At first sight the old bridge looked safe, but the wood was rotten through.
- The room seemed small at first sight, until they opened the far doors.
