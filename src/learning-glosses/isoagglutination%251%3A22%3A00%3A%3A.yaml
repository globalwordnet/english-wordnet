senseId: 'isoagglutination%1:22:00::'
synsetId: 13524548-n
simpleMeaning: The clumping of cells or particles from one individual when antibodies in the blood serum
  of another of the same species bind to them.
scope: It involves a serum.
examples:
- The isoagglutination took place when the serum met the substance from the other person.
- They watched the isoagglutination happen under the microscope.
