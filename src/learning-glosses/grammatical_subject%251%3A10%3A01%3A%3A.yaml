senseId: 'grammatical_subject%1:10:01::'
synsetId: 92464977-n
simpleMeaning: A word such as “it” that fills the usual subject position and points ahead to a later phrase
  or clause that supplies its meaning.
scope: This use lets a speaker put a long subject later in the sentence.
examples:
- In “It was a relief to get home,” the grammatical subject “it” points ahead to “to get home.”
- In “It surprised me that Lee left,” the grammatical subject “it” anticipates “that Lee left.”
