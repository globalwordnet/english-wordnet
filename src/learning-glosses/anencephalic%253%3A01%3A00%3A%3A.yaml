simpleMeaning: Said of someone born with no brain at all, or only part of one.
scope: Also called anencephalous, this is a word about a person, not about the brain itself.
examples:
- The scan showed that the baby was anencephalic, with almost no brain at all.
- The anencephalic baby was born with the brain missing.
