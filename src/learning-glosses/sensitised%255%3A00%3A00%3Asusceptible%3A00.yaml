simpleMeaning: Easily stirred to a strong or odd response by one thing in particular, as in an allergy.
scope: Also called allergic, hypersensitive, sensitized, hypersensitised, hypersensitized, supersensitised,
  supersensitive and supersensitized, this is a person easily stirred to a strong or odd response by one
  thing in particular.
examples:
- The sensitised child broke out in a rash at the first touch of pollen.
- Once sensitised, a person may react strongly to that one thing.
