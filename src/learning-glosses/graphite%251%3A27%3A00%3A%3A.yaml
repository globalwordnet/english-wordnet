simpleMeaning: A form of carbon used to reduce friction between moving parts and to slow neutrons in nuclear
  reactors.
scope: Also called black lead or plumbago; a substance used in machines and in nuclear reactors, not a
  fuel and not a metal.
examples:
- The engineer used graphite to cut friction in the gears.
- Graphite slows the action inside the nuclear reactor.
