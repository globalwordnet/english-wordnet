senseId: 'cross-fertilise%2:29:00::'
synsetId: 00053373-v
simpleMeaning: To cause an egg from one individual to be fertilized by a male reproductive cell from another
  of the same species.
scope: Also called cross-fertilize. It is about making new life start, not about new life starting.
examples:
- Mendel cross-fertilized different kinds of beans.
- Bees carry pollen from one flower to another, so the plants cross-fertilise.
