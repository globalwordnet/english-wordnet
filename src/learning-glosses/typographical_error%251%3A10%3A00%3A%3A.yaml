senseId: 'typographical_error%1:10:00::'
synsetId: 06782461-n
simpleMeaning: Something printed comes out with a mistake in it when a machine fails in some way.
scope: Also called literal, typo, misprint, erratum, and literal error, this is a mistake in printed matter
  caused by a machine, not a mistake in what the writer meant to say.
examples:
- They found a typographical error on the first page of the book.
- The typographical error came from a key that stuck on the press.
