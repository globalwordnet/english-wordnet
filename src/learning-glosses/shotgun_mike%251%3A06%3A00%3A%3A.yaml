simpleMeaning: A long-tubed listening tool that hears only what lies in one line ahead of it, aimed from
  far off at a single voice.
scope: It is also called a gun microphone, a gun mike, and a shotgun microphone.
examples:
- The crew pointed the shotgun mike at the actor across the room.
- The sound team held a shotgun mike over the crowd to catch the chant.
