simpleMeaning: A team of soldiers gathered to let off a burst of shots at an army funeral, or to end the
  life of a person sentenced to death by the army.
scope: People also call this a firing party.
examples:
- The firing squad raised their rifles at the officer's word.
- The firing squad carried out the sentence at dawn.
