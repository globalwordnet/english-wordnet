simpleMeaning: Swelling and soreness of the urethra, the tube that carries urine out of the body, with
  no known cause.
scope: Also called NSU. It is a noun.
examples:
- The doctor wrote nonspecific urethritis on the chart when the tests showed no clear cause.
- They had nonspecific urethritis, and the cause was never found.
