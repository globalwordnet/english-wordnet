simpleMeaning: A tetracycline antibiotic sold as Minocin and used to treat various bacterial infections,
  including those caused by rickettsiae.
scope: A germ-fighting drug of the tetracycline kind; not a drug for allergies and not a painkiller.
examples:
- The doctor gave her minocycline for the infection.
- Minocycline treats many kinds of germ infections.
