simpleMeaning: A drug, sold as Kemadrin, that lessens the shaking of Parkinsonism.
scope: Also called Kemadrin. It is a drug, not the disease it treats.
examples:
- The doctor gave procyclidine to lessen the shaking in their hands.
- Procyclidine helped them hold a cup without shaking.
