simpleMeaning: An eastern North American trillium with foul-smelling pink to purple flowers and a root
  that makes tissues tighten, used in folk medicine especially to ease childbirth.
scope: This sense is also called purple trillium and red trillium.
examples:
- Birthroot grows in eastern North America.
- They used birthroot to ease childbirth.
