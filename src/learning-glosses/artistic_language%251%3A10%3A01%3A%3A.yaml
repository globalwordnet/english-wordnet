senseId: 'artistic_language%1:10:01::'
synsetId: 92465610-n
simpleMeaning: A language deliberately invented for the pleasure of its sound, appearance, or other artistic
  qualities.
scope: Also called artlang, this one is not a way of speaking that grew up on its own over time.
examples:
- The artistic language in the novel was made up by the writer for the beauty of its sounds.
- The actors learned the artistic language made up for the film.
