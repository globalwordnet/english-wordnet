simpleMeaning: Of the earth, or living on it, as opposed to the sea or the air.
scope: Also called terrestrial, telluric, and terrene. It does not describe the sea or sky.
examples:
- Tellurian animals live on land, not in the sea.
- The tellurian plants of the desert need little water.
