simpleMeaning: The lower leg has blood vessels that flow into the blood vessel behind the knee.
scope: These are blood vessels of the lower leg, also called tibial veins, not ones in the upper leg.
examples:
- The vena tibialis carried blood up from the lower leg.
- Blood from the vena tibialis flows into the blood vessel behind the knee.
