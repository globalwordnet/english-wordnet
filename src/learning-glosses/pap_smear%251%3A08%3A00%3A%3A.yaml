simpleMeaning: A sample of cells from the surface of the cervix, examined under a microscope to look for
  abnormal changes.
scope: Here the term refers to the sample collected during cervical screening.
examples:
- The nurse took a Pap smear to check the cells of her cervix.
- Her Pap smear showed no unhealthy cells.
