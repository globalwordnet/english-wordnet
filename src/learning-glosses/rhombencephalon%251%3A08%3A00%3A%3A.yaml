simpleMeaning: The back part of the brain, taking in the cerebellum, the small back brain that guides
  movement, and the brainstem, the stalk joining brain to spinal cord.
scope: The back part of the brain, also called hindbrain, set against the front and middle parts.
examples:
- The rhombencephalon sits at the back of the brain.
- The scan showed the rhombencephalon at the back of the brain.
