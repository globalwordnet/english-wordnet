simpleMeaning: An unusually fast, often regular heartbeat in the heart’s upper chambers. Some of these
  signals may be blocked on their way to the lower chambers.
scope: A too-fast beating of the upper rooms of the heart, not wings moving fast and not a thing moving
  fast and lightly.
examples:
- The doctor found a flutter in her heart.
- A flutter showed on the heart trace.
