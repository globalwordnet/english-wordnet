simpleMeaning: A very light, colorless, largely unreactive gas. It is the hardest gas to liquefy. Some
  natural gas deposits, including ones in Texas and Kansas, contain enough helium to sell.
scope: This is a very light gas that does not react, also called He, atomic number 2, not air nor any
  other gas.
examples:
- The balloon was filled with helium.
- Helium does not burn.
