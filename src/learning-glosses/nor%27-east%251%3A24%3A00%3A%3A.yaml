senseId: 'nor''-east%1:24:00::'
synsetId: 13854042-n
simpleMeaning: The point of a compass that lies halfway between the top of a map and the side where the
  sun rises; it stands at 45 degrees.
scope: Also called northeast or northeastward, and NE for short. It is a noun.
examples:
- The needle pointed nor'-east all morning.
- They set their course to nor'-east before dawn.
