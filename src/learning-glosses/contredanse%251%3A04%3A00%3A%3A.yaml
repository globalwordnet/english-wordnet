senseId: 'contredanse%1:04:00::'
synsetId: 00540158-n
simpleMeaning: In a folk form, couples arrange themselves in groups or in two lines opposite each other,
  and step together to music.
scope: Also called contra danse, contradance, country-dance and country dancing; this one is about the
  form itself, not about performing it.
examples:
- The villagers formed a contredanse in the square, partners facing each other in lines.
- They learned the steps of the contredanse before the harvest festival.
