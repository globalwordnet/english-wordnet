senseId: 'atonicity%1:26:00::'
synsetId: 14569447-n
simpleMeaning: A slackness in the muscles, with the tightness they should hold all gone.
scope: Amyotonia, atonia, and atony are other names for this one, which is the opposite of a muscle holding
  its tightness.
examples:
- The examination found atonicity in the muscles of the legs, which gave way under the body.
- The atonicity in the shoulders made the arms hang heavy and still.
