simpleMeaning: A labor union open to workers in the same industry, whatever trade or job each worker has.
scope: Also called industrial union. It is a workers' group, not one for a single craft.
examples:
- The vertical union took in drivers, clerks, and mechanics from the same trade.
- After the vote, the vertical union spoke for all the workers in the trade.
