simpleMeaning: A man who has only just risen in a group and answers back with proud, mocking words that
  show no respect.
scope: This is a male upstart, while the other upstart who makes the same remarks may be of either sex.
examples:
- The wise guy in the back kept making rude remarks about the speaker.
- They told the wise guy to stop making rude remarks.
