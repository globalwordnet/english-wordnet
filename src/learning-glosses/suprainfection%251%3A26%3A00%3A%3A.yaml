simpleMeaning: A germ that would leave a healthy person alone can bring on a new illness after a first
  illness.
scope: This names a new illness that comes after a first illness, not the first illness itself.
examples:
- The doctor found a suprainfection on top of the first illness.
- They treated a suprainfection that came after the first illness.
