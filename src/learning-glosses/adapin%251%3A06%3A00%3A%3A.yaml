simpleMeaning: A brand of doxepin, a tricyclic antidepressant that can cause dry mouth, drowsiness, and
  digestive problems. Sinequan is another brand.
scope: Also called doxepin, doxepin hydrochloride and Sinequan, this three-ring drug lifts low mood but
  has many side effects, such as dry mouth, sleepiness and gut troubles.
examples:
- The doctor gave him Adapin for low mood.
- Adapin left her mouth dry and made her sleepy.
