senseId: 'parabola%1:25:00::'
synsetId: 13909064-n
simpleMeaning: A curve formed by cutting a cone with a plane parallel to a straight line down its side,
  with the cut passing to one side of the tip.
scope: This is one special curve made by cutting a cone in a set way; it is not a circle and not a straight
  line.
examples:
- The teacher tilted the cutting plane until the intersection formed a parabola.
- The diagram showed a parabola on the cut face of the cone.
