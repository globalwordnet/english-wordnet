senseId: 'reflex_action%1:04:00::'
synsetId: 00865191-n
simpleMeaning: An automatic reaction of the body to something that touches or startles it, at once and
  before the mind has any say, with no practice behind it.
scope: This is also called reflex, inborn reflex, innate reflex, instinctive reflex, physiological reaction,
  reflex response and unconditioned reflex.
examples:
- When the doctor tapped the knee, the reflex action made the leg kick out before any thought could catch
  up.
- The reflex action jerked the foot away from the hot stove before the burn was felt.
