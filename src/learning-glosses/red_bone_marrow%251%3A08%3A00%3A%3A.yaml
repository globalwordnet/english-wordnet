simpleMeaning: The tissue inside children's bones and some adult bones where red blood cells are made.
scope: Also called red marrow, this is the kind found in children and in only some parts of a grown person's
  frame.
examples:
- Red bone marrow makes the blood cells that carry air.
- A child has red bone marrow inside the hard parts of the body.
