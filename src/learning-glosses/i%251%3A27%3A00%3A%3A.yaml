simpleMeaning: Iodine, a nonmetal in the halogen group, used in medicine, photography, and dyes. It occurs
  naturally in small amounts in compounds in seawater and rocks.
scope: An element, not a metal, in the halogen group; iodine, atomic number 53 and iodin are other names
  for this sense, and it is not the letter I nor the number one.
examples:
- I is used in medicine and in photography.
- A lack of I can harm the thyroid.
