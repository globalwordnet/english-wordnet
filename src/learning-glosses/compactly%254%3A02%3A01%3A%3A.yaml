simpleMeaning: Said of words that are few and exact, and that go straight to what matters.
scope: Succinctly is another name for this thing; it does not mean the way a thing is packed tight.
examples:
- He wrote compactly but clearly.
- The speaker put the whole story compactly, in just a few sentences.
