senseId: 'unpermissive%3:00:00::'
synsetId: 01767957-a
simpleMeaning: A person of this kind seldom says yes to what others ask, and keeps strict rules for them.
scope: This word is used of a person who is hard on those under them, not of one who lets them do as they
  please.
examples:
- The unpermissive head teacher refused every request for a day off.
- Life under the unpermissive warden meant strict rules and no favours.
