simpleMeaning: The layer of Earth's atmosphere above the mesosphere and below the exosphere.
scope: It is one of the layers of air around the earth, with one layer below it and one above it.
examples:
- The thermosphere lies between the mesosphere below it and the exosphere above it.
- The satellite moved through the thermosphere, above the mesosphere and below the exosphere.
