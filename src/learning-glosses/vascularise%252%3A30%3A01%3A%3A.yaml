simpleMeaning: To grow tubes that carry fluids round and round.
scope: This word names a change in a thing itself, also called vascularize, and does not make another
  thing grow them.
examples:
- The egg yolk vascularised, and tiny tubes spread through it.
- They watched the egg yolk vascularise over the next days.
