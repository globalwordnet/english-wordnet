simpleMeaning: When a sailing ship sails as close to the wind as it can, it moves sideways only a little.
scope: This is about a ship that moves sideways only a little, not one that drifts far sideways.
examples:
- Even close to the wind, the weatherly boat moved sideways only a little.
- They praised the weatherly ship for keeping its course when sailing into the wind.
