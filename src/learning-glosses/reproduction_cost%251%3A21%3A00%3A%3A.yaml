senseId: 'reproduction_cost%1:21:00::'
synsetId: 13324067-n
simpleMeaning: What it would take now to make the same physical property again, after taking off sums
  for wear and other losses.
scope: Physical value is another name for it, and it counts what making the same property again would
  take after sums are taken off for wear.
examples:
- They worked out the reproduction cost of the building.
- The reproduction cost had fallen after sums were taken off for wear.
