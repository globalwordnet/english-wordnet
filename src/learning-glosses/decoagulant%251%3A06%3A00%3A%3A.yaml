simpleMeaning: A medicine that stops blood from thickening into clots, or holds that thickening back.
scope: Also called anticoagulant or anticoagulant medication, this one is about a medicine.
examples:
- The doctor gave a decoagulant to keep the blood from clotting.
- A decoagulant was added to the blood sample so it would stay liquid.
