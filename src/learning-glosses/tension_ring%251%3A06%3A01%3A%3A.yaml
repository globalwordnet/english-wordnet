simpleMeaning: A ring worn around the base of the penis to slow the flow of blood out and help maintain
  an erection.
scope: People also call it a cock ring or an erection ring, and it is a band usually put round the base
  of a man's sex organ to slow blood flow from the hard part so it stays hard much longer.
examples:
- He bought a tension ring at the chemist's.
- The tension ring stayed on for half an hour.
