simpleMeaning: Telling a person off in hard, angry words for something bad they did.
scope: It is also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce, remonstrate,
  lambaste, lambast, bawl out, call down, call on the carpet, chew out, chew up, dress down, and have
  words.
examples:
- The teacher took the boy to task for cheating on the test.
- The manager took the assistant to task for losing the files.
