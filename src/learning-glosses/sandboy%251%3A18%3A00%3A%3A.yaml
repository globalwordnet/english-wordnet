simpleMeaning: A boy or young man who sold sand. The word now survives in “happy as a sandboy,” meaning
  very happy.
scope: This word once named a young man who sold fine grains, and now it is heard only in the saying for
  being very glad.
examples:
- They were happy as a sandboy.
- We felt happy as a sandboy.
