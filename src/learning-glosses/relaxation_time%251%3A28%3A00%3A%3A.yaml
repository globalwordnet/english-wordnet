senseId: 'relaxation_time%1:28:00::'
synsetId: 15300301-n
simpleMeaning: The time it takes a disturbed system to reduce its difference from equilibrium to about
  37 percent of its initial value during exponential recovery.
scope: In physics this is the fixed span that sets the pace of a disturbed system's return to balance,
  and not the whole return itself.
examples:
- The relaxation time of the heated metal was short, and it settled back to a steady state fast.
- We worked out the relaxation time of the gas from how fast it moved back toward a steady state.
