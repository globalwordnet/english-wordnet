simpleMeaning: A large northern deer whose males have huge flattened antlers. It is called an elk in Europe
  and a moose in North America.
scope: Also called elk in Europe, this is the large deer that lives in the north, not a different kind
  of deer.
examples:
- A moose stood by the lake.
- The male moose had huge flat antlers.
