simpleMeaning: A run of words that holds together as one part of a larger whole.
scope: Also called syntagm. It is a group of words, not one word alone.
examples:
- The syntagma ‘the old house’ works as one part of the whole sentence.
- In the sentence, they marked off each syntagma before they broke it into smaller parts.
