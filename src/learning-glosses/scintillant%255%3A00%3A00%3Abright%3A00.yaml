senseId: scintillant%5:00:00:bright:00
synsetId: 00280484-s
simpleMeaning: Shining in short, bright bursts that flash and fade.
scope: Also called glittering, glinting, sparkly, glittery, scintillating, aglitter, glistering, coruscant,
  and fulgid. It is a kind of brightness.
examples:
- The scintillant water caught the sun as the boat moved.
- Scintillant stars filled the clear night sky.
