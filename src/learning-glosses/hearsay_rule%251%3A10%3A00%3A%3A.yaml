simpleMeaning: A rule of evidence that generally bars statements made outside the hearing and offered
  as proof of what they say.
scope: This word is used of evidence.
examples:
- The hearsay rule kept the letter out of the trial.
- Under the hearsay rule, a witness must speak for themselves in court.
