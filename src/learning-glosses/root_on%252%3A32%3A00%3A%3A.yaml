simpleMeaning: To encourage someone, especially by cheering or shouting.
scope: Also called cheer, urge, inspire, barrack, exhort, pep up, or urge on, it is what a crowd does
  when it shouts for its side.
examples:
- The crowd rooted on the runners.
- They rooted on the team.
