simpleMeaning: The front division of the forebrain, including the cerebrum and associated structures near
  the hypothalamus.
scope: This is the part at the front, not the parts behind it.
examples:
- They found the telencephalon at the front of the brain, holding the large thinking part and the small
  base part.
- The small base part sits inside the telencephalon at the front of the brain.
