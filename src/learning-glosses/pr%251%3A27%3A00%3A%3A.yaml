simpleMeaning: Praseodymium, a soft, yellowish-white rare-earth metal that forms ions with a charge of
  +3. It can be recovered from bastnasite or monazite by ion exchange.
scope: 'Also called praseodymium and atomic number 59: a soft pale yellow metal of the rare earth group,
  not cerium and not neodymium.'
examples:
- Pr is found in the rocks bastnasite and monazite.
- Workers get Pr from monazite by swapping ions.
