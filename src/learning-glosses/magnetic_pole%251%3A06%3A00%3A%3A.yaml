simpleMeaning: Either end of a piece of metal that pulls iron toward it, where its pull seems strongest.
scope: It is also called a pole.
examples:
- Iron filings gathered at the magnetic pole of the bar magnet.
- The north magnetic pole of the magnet attracted the paper clip.
