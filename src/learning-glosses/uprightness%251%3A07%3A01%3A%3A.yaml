simpleMeaning: The quality of being honest and acting with honour, and so doing what is good and fair.
scope: Also called rectitude. It is a quality of character, not a way of standing.
examples:
- Uprightness showed when the clerk refused the bribe.
- People trusted the uprightness of the treasurer in all money matters.
