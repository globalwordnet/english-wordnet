simpleMeaning: A joke that goes on and on, and the fun of it is that it comes to nothing at all.
scope: This is the name for a joke that rambles on and on, with its fun in coming to nothing.
examples:
- The shaggy dog story went on and on, and its ending meant nothing at all.
- The speaker told a shaggy dog story that wandered on and finished with no point.
