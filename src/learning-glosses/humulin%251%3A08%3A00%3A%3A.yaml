simpleMeaning: A brand of manufactured insulin identical to human insulin. It can treat people with diabetes
  who are allergic to insulin from cattle or pigs.
scope: Also called recombinant human insulin; man-made insulin matching the human kind, not insulin from
  animals.
examples:
- Humulin controls her blood sugar.
- The doctor switched him to Humulin.
