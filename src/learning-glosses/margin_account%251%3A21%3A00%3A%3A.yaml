simpleMeaning: An account with a securities broker that lets the customer borrow from the broker to buy
  investments.
scope: A way to buy shares with money lent by a broker, not a plain bank account and not a deal paid for
  in cash.
examples:
- She opened a margin account with her broker.
- A margin account lets him buy shares with borrowed money.
