simpleMeaning: Someone who calls out a wrong act, naming it as wrong and holding the doer to blame.
scope: A rebuker, a reproacher, and an upbraider are other names for this person, who calls out a wrong
  act and holds the doer to blame.
examples:
- The reprover would not let the mistake pass without a word.
- The reprover blamed the guard for leaving the gate open.
