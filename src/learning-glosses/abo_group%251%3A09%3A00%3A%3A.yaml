simpleMeaning: A system for classifying human blood by markers on red blood cells. It helps match blood
  for transfusions and distinguishes four groups, A, B, AB and O.
scope: This sorting of blood by the marks on it is used before giving blood to a sick person, and the
  four kinds are A, B, AB, and O; ABO blood group system and ABO system are other names for it.
examples:
- Her ABO group is O.
- The ABO group tells doctors which blood to give.
