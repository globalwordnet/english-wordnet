simpleMeaning: Traditionally, the unmarried woman who acts as the bride's chief attendant at a wedding.
scope: It is also called a bridesmaid.
examples:
- The maid of honor held the bride's bouquet during the ceremony.
- The bride asked her oldest friend to be her maid of honor.
