simpleMeaning: A leafy annual with low branches and flower heads resembling zinnias. It grows in the southwestern
  United States and from Mexico to Guatemala.
scope: This low leafy plant of one year, branching low down, is known by flower heads much like those
  of a garden flower, and is found in southwest United States and Mexico to Guatemala.
examples:
- The creeping zinnia had flower heads much like those of a garden flower.
- Creeping zinnia is found in the southwest of the United States and Mexico to Guatemala.
