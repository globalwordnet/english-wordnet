simpleMeaning: Small lumps cover skin that has this look, and some of the lumps are warts while others
  only have a wart's shape.
scope: This word is also called warty or verrucose, and it is used of skin, not of other surfaces.
examples:
- The doctor looked at the wartlike growth on their elbow.
- Their wartlike hands were covered in small bumps.
