simpleMeaning: A brand of prednisone, a drug related to cortisol. It reduces inflammation in arthritis
  and suppresses the immune response. Other brands include Deltasone, Liquid Pred, and Meticorten.
scope: Also called prednisone, Meticorten, Deltasone, and Liquid Pred; a drug like cortisol, used for
  arthritis swelling and to hold back the body's defences.
examples:
- The doctor gave her Orasone for her arthritis.
- Orasone helped calm the swelling in his joints.
