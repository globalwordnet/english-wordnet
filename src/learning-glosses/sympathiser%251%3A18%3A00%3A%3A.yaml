simpleMeaning: Someone who feels the way you do about things and wants you to do well.
scope: Also called sympathizer, and well-wisher is another name for it. It is not a helper.
examples:
- The sympathiser wrote to say how sorry they were to hear the news.
- Every sympathiser in the room hoped the plan would work.
