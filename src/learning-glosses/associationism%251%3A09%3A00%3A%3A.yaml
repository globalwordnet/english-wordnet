simpleMeaning: In psychology, the view that the mind joins one thought to the next.
scope: Also called association theory. It is about the mind, not about a group of people.
examples:
- Under associationism, remembering one thing calls up another thing linked to it in the mind.
- They studied associationism to learn how thoughts link together.
