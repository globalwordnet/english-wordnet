senseId: 'degressive_tax%1:21:00::'
synsetId: 13335818-n
simpleMeaning: A charge by the government whose rate falls as the sum it is charged on grows.
scope: This is not a charge that stays the same, and not one that grows with the sum.
examples:
- The degressive tax took a smaller share as the firm's income grew.
- Under the degressive tax, the rate fell when the amount charged on rose.
