simpleMeaning: One named family of plants with two seed leaves, made up of herbs for the most part, with
  some trees and shrubs among them, more or less advanced.
scope: This one is about a group, not a single plant.
examples:
- The asterid dicot family takes in the daisy and the sunflower.
- The gardener planted several members of the asterid dicot family along the fence.
