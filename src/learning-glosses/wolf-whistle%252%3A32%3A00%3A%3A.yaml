simpleMeaning: To whistle or call out at a woman to express sexual interest, often in a way she may find
  unwelcome.
scope: Men do this to show admiration for a woman, unlike a catcall meant to mock or a cheer for a fine
  performance.
examples:
- The builders wolf-whistled as the woman walked past the site.
- A group of men wolf-whistled at the woman as she passed their table.
