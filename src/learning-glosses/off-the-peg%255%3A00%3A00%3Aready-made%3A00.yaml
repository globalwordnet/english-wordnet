simpleMeaning: Made in set sizes and kept ready in a shop, above all for clothes, not made to fit one
  person.
scope: Also called off-the-rack, off-the-shelf, or ready-to-wear. It is an adjective.
examples:
- They bought an off-the-peg suit for the wedding.
- The shop sells off-the-peg jackets in many sizes.
