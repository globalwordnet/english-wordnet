simpleMeaning: Above the hollow that holds the eye, a raised arch of bone runs across the front of the
  skull.
scope: Also called a superciliary ridge, a supraorbital ridge, or a supraorbital torus, this is the raised
  bone above the eye.
examples:
- They traced the superciliary arch above the eye with a finger.
- They pressed a finger to the superciliary arch.
