simpleMeaning: A bit of matter thought to be there but not yet seen, said to be the smallest bit in a
  way of thinking about space and time.
scope: This is a bit of matter in a way of thinking about space and time, not a bit of matter anyone has
  seen.
examples:
- The book said a superstring might be the smallest bit of all matter.
- They talked about a superstring as the smallest bit in their way of thinking about space and time.
