simpleMeaning: Said of a person or a thing that has to do with not being able to read words, or that shows
  this loss.
scope: Also called word-blind, this one is an adjective, not the person with the loss.
examples:
- The doctor noted the alexic signs when the patient could not read the words on the page.
- The alexic trouble meant they could no longer read the letters on the page.
