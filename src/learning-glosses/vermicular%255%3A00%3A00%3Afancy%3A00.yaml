simpleMeaning: A surface with this look has lines winding over it like worms, put there for show.
scope: Also called vermiculate or vermiculated, this is tracery put on for show, not plain work.
examples:
- They admired the vermicular stonework on the old wall, its lines winding like worms.
- A vermicular pattern of lines like worms ran across the face of the vase.
