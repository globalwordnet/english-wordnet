simpleMeaning: A small, invasive, self-pollinating weed with small white flowers, widely studied by plant
  geneticists and the first flowering plant whose entire genome was sequenced.
scope: This is a small weed that takes over new ground, with small white flowers, much studied by plant
  scientists; mouse-ear cress is another name for this sense.
