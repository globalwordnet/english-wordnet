simpleMeaning: A well-informed judgment of written works, looking closely at what they say and how good
  they are.
scope: It is a kind of judgment, also called literary criticism.
examples:
- The students wrote a lit crit of the novel for class.
- A good lit crit looks at both the story and the way it is told.
