simpleMeaning: An independent group of specially chosen public figures and experts who investigate an
  important government issue without taking political sides.
scope: This group is also called blue ribbon commission.
examples:
- The blue ribbon committee took up the question.
- A blue ribbon committee asked hard questions about the issue.
