simpleMeaning: A tiny extinct primate weighing 150–300 grams that lived 46–50 million years ago. Fossils
  occur in Algeria. Some experts consider it the earliest anthropoid candidate.
scope: A tiny primate, no longer living, of 46 to 50 million years ago, whose bones were found in Algeria,
  not a living monkey or ape.
examples:
- Algeripithecus minutus lived 46 to 50 million years ago.
- The bones of Algeripithecus minutus were found in Algeria.
