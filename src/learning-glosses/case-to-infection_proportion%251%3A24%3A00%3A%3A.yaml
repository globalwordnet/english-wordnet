simpleMeaning: The number of disease cases divided by the total number of infections with the organism
  that causes the disease.
scope: Case-to-infection ratio is another name for this.
examples:
- The case-to-infection proportion stayed low while the outbreak spread.
- They worked out the case-to-infection proportion for the new disease.
