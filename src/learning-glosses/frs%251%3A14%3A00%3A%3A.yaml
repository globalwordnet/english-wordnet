simpleMeaning: The U.S. central banking system, with twelve regional Reserve Banks and members including
  national banks, participating state-chartered banks, and some trust companies.
scope: FRS stands for Federal Reserve System. It is also called the Fed.
examples:
- The FRS seeks to control the United States economy by raising and lowering short-term interest rates.
- FRS branch banks work with all national banks in the country.
