simpleMeaning: A person who walks with each foot hitting the ground hard and loud, or who stamps on it.
scope: This person is also called a stamper, a stomper or a tramper, not someone who hurts others by walking
  over them.
examples:
- They heard the trampler thudding up the stairs.
- The trampler stamped on the ground and kept walking.
