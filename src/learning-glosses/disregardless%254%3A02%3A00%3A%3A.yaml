simpleMeaning: In a way that pays no mind to the bad points, whatever happens.
scope: This one is also called regardless, irrespective, disregarding, and no matter.
examples:
- The team played on disregardless of the rain and the mud.
- They kept the old hall open disregardless of the cost.
