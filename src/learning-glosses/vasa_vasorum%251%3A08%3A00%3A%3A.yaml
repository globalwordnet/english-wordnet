simpleMeaning: A large artery or vein has small tubes carrying blood that branch out over its outside.
scope: These are the small tubes, not the large artery or vein itself.
examples:
- The vasa vasorum branch over the outside of the aorta.
- Tiny vasa vasorum cover the outside of the vein.
