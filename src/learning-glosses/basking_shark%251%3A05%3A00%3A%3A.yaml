simpleMeaning: A large, harmless shark of northern waters that eats plankton. It often swims slowly or
  floats at the surface.
scope: This is the very big harmless sea fish of the cold north that eats tiny floating life.
examples:
- The basking shark drifted slowly just below the surface.
- The basking shark often swims slow at the top of the sea.
