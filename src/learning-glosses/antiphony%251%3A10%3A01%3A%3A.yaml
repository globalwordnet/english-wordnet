simpleMeaning: This is a verse or song, chanted or sung to answer the one sung before it.
scope: Also called antiphon, this one is not the singing of it in turn by a choir in two parts.
examples:
- The antiphony rang out as the choir answered from the far side.
- They closed the service with an antiphony sung in answer to the opening verse.
