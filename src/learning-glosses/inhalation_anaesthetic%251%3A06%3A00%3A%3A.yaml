simpleMeaning: A gas that produces general anesthesia, making a person unconscious and unable to feel
  pain during a procedure.
scope: Inhalation anesthetic, inhalation general anaesthetic and inhalation general anesthetic are other
  names for this gas.
examples:
- The doctor used inhalation anaesthetic to keep the patient still during the operation.
- Inhalation anaesthetic is given through a mask.
