simpleMeaning: To become spread through the air as tiny drops of liquid or bits of solid material.
scope: Also called aerosolize. It is about a thing coming apart on its own, not about something else spreading
  it.
examples:
- The powder aerosolised and filled the room.
- The bacteria quickly aerosolised.
