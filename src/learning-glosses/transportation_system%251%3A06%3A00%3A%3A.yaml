simpleMeaning: The vehicles, facilities, and equipment used to move passengers or goods.
scope: This sense is also called transportation and transit, and it covers a place's whole way of moving
  people and goods, not a single road or vehicle.
examples:
- Buses and trains are part of the city's transportation system.
- The transportation system moves people and goods around the city.
