simpleMeaning: The packing of goods into one load, so the whole load moves as a single piece.
scope: Also called unitisation. It is a kind of packing, not a kind of load, and it is about goods, not
  oil or the mind.
examples:
- The port workers finished the unitization of the crates before noon.
- The unitization of the shipment took all morning and needed three forklifts.
