simpleMeaning: Every nerve in the body that is not in the brain and not in the cord down the spine.
scope: Also called peripheral nervous system. It is a network, not a single nerve.
examples:
- The systema nervosum periphericum carries messages between the body and the brain.
- Damage to the systema nervosum periphericum makes hands and feet feel numb.
