simpleMeaning: A Nazi organization founded in Germany in 1925 as Adolf Hitler's personal guard. It later
  ran the concentration camps.
scope: Schutzstaffel is another name for this sense; not the United States Secret Service and not an ordinary
  police force.
examples:
- The SS ran the camps in the war years.
- An SS officer stood at the gate.
