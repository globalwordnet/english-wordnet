senseId: 'diathesis%1:26:00::'
synsetId: 14557935-n
simpleMeaning: A tendency, arising from how the body is made or works, to develop a particular illness
  or abnormal condition.
scope: This one is a tendency a person carries, not the illness itself.
examples:
- The diathesis in the family made doctors watch the children for early signs of the illness.
- A diathesis does not mean a person will fall ill, only that the risk is higher.
