senseId: 'anthropologism%1:09:01::'
synsetId: 92445777-n
simpleMeaning: A view that a person's nature comes wholly from the culture they live in, with no room
  for free choice.
scope: It is a belief about what shapes people.
examples:
- Under anthropologism, a person's choices are seen as fixed by the culture around them.
- The writer's anthropologism left no place for free will in their account of human life.
