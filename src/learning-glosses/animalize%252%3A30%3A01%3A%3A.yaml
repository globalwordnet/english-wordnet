simpleMeaning: To make someone brutal, unfeeling, or inhuman.
scope: Also called animalise, brutalize, or brutalise, this is something done to another person, not a
  change in the person themself.
examples:
- The camp guards animalized the new prisoners and stripped them of pity.
- Harsh treatment animalized the young soldiers.
