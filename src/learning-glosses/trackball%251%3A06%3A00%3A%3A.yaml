simpleMeaning: A round part turns in a case to move the mark on a computer screen and shift the pictures
  on it in this electronic device.
scope: This is a device for moving the mark on a computer screen, not a mouse.
examples:
- They rolled the trackball to move the cursor across the screen.
- The trackball on the desk let them move pictures on the screen without a mouse.
