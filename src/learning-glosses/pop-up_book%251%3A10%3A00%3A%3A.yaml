senseId: 'pop-up_book%1:10:00::'
synsetId: 06424903-n
simpleMeaning: A set of pages bound together, for children most of the time, with one or more pages that
  hold a shape lifting off the page when opened.
scope: It is also called a pop-up.
examples:
- They opened the pop-up book and a castle rose from the page.
- The child laughed when the pop-up book opened and a dragon stood on the page.
