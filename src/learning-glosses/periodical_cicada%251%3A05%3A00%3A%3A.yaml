simpleMeaning: A North American cicada whose young spend 13 or 17 years developing before large numbers
  of adults emerge together.
scope: 'Also called a seventeen-year locust: a North American insect that comes out in great numbers only
  once in many years, not a yearly insect and not a grasshopper.'
examples:
- Periodical cicadas filled the trees that summer.
- The periodical cicada sings loudly in the heat.
