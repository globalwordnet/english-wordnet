simpleMeaning: The person who sends this curved stick of wood through the air the right way gets it back.
scope: This is also called a boomerang and a throwing stick, and it is curved, not straight.
examples:
- They sent the throw stick through the air, and it came back to them.
- The throw stick came back to its owner because it was sent the right way.
