simpleMeaning: A cancerous growth that develops when cells spread from their original tumor to another
  part of the body.
scope: Malignant neoplasm and malignant tumor are other names for it.
examples:
- The doctors found a metastatic tumor that had spread to the lung from elsewhere.
- A metastatic tumor can turn up in a part of the body far from where it began.
