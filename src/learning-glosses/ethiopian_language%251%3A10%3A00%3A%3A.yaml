simpleMeaning: Amharic, a widely spoken working language of Ethiopia's federal government. It is a Semitic
  language shaped by long contact with Cushitic-speaking neighbors.
scope: 'Also called Amharic and Amharic language: the main, official way of speaking in Ethiopia, a Semitic
  tongue much shaped by Cushitic speech.'
examples:
- Ethiopian language is the official way of speaking in Ethiopia.
- Many people speak Ethiopian language at home and at work.
