senseId: 'writ_of_error%1:10:00::'
synsetId: 06567962-n
simpleMeaning: A court order that makes the trial court send its records up to a higher court that hears
  appeals, because a mistake in the trial is claimed.
scope: This comes from a higher court, not from the trial court itself.
examples:
- The lawyer filed a writ of error after the trial ended in a ruling they believed was wrong.
- A writ of error sent the trial papers up to the higher court for a fresh look.
