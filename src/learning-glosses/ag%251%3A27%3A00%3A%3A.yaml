simpleMeaning: Silver, a soft white precious metal with valence one and the highest thermal and electrical
  conductivity. Found free or in argentite, it is used in coins, jewelry, tableware, and photography.
scope: A metal, also called silver and atomic number 47; not gold and not a coin.
examples:
- Ag is used in coins and photos.
- Ag lets heat and power flow best of all metals.
