simpleMeaning: A trade name for a medicine combining several antibacterials, used as a skin ointment for
  minor irritations and as eye drops for minor eye infections.
scope: Neosporin skin ointment is for external skin use.
examples:
- The label on the Neosporin skin ointment said it was for minor cuts and scrapes.
- The prescription specified Neosporin eye drops, and the pharmacist checked the ophthalmic label.
