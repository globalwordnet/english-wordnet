senseId: 'absolute_deviation%1:09:01::'
synsetId: 92436719-n
simpleMeaning: In statistics, how far one number in a set of numbers stands from one fixed number, without
  counting whether it is above or below.
scope: This one is a measure of spread in statistics, not one of the numbers in the set.
examples:
- The absolute deviation of 9 from 5 is 4.
- They worked out the absolute deviation for each number in the set.
