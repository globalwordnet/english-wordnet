simpleMeaning: A long-cultivated rhubarb hybrid derived from Rheum palmatum. Its stems are often cooked
  in pies, sauces, or preserves.
scope: Also called garden rhubarb, pie plant, Rheum cultorum and Rheum rhaponticum; a long-grown garden
  plant whose stems are cooked, close to other rhubarbs of the same genus.
examples:
- Rheum rhabarbarum stems went into the sauce.
- The gardener planted Rheum rhabarbarum by the fence.
