simpleMeaning: This herb stings when touched, and it grows in the warm lands of America.
scope: Also called a devil nettle, a pica-pica, a spurge nettle, Cnidoscolus urens, Jatropha stimulosus,
  and Jatropha urens, this is a warm-land herb whose touch stings, not one that can be handled without
  hurt.
examples:
- They brushed against the tread-softly and felt the sting at once.
- They found the tread-softly growing in the warm lands of America.
