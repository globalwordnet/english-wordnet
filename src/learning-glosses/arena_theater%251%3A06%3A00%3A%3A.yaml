simpleMeaning: A place for plays where the seats run around at least three sides of the stage.
scope: Also called theater in the round, this one is not a place where the seats face the stage from one
  side only.
examples:
- The actors in the arena theater could be seen from nearly every seat.
- The new arena theater opened with a play that drew a full house.
