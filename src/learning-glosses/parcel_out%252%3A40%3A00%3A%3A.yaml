simpleMeaning: To share something among people by giving each one a small part.
scope: Also called lot, deal, distribute, administer, dispense, allot, deal out, dish out, dole out, mete
  out, or shell out. It is a way of giving.
examples:
- They parcel out the food among the hungry families.
- The teacher parcels out the pencils to the class.
