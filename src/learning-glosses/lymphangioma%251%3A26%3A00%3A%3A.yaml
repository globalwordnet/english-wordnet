simpleMeaning: A noncancerous growth made up of lymph vessels, the small tubes that carry lymph through
  the body.
scope: A lymphangioma can cause problems if it presses on nearby structures.
examples:
- The child had a lymphangioma on her cheek that caused no pain.
- Doctors watched the lymphangioma but did not remove it.
