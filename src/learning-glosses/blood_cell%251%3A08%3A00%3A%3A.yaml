simpleMeaning: One of two kinds of tiny living units in the body's red liquid, red ones and white ones,
  and sometimes also the small bits that help it clot.
scope: This one is also called corpuscle and blood corpuscle.
examples:
- The sample held both red blood cells and white blood cells.
- The doctor counted the white blood cells first.
