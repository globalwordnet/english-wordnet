simpleMeaning: Reasoning alone settles it, with no facts seen or measured.
scope: This one is about working something out, while the other sense of the same words is about claims
  that rest on no facts.
examples:
- They took it a priori, without testing it first.
- They argued a priori that the plan must fail.
