simpleMeaning: A drug that stimulates blood circulation and breathing. Larger doses were used to bring
  on convulsions in shock therapy. Metrazol is a brand name for it.
scope: 'Also called pentylenetetrazol: a drug that wakes up the heart and lungs, not a drug that calms
  them down.'
examples:
- Doctors gave pentamethylenetetrazol to wake up a patient's breathing.
- Large doses of pentamethylenetetrazol caused convulsions.
