simpleMeaning: A strong wish, full of ill will, to hurt someone back for a wrong they did.
scope: Also called vindictiveness. It is a feeling, not the act itself.
examples:
- Their vengefulness grew with each year that passed.
- Their vengefulness made them plan how to hurt the person who had wronged them.
