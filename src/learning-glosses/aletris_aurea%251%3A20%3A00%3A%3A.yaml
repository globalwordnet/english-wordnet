simpleMeaning: A colicroot with flowers arranged in clusters and backed by yellow bracts. It is smaller
  than Aletris farinosa and grows in the southeastern United States.
scope: This is a colicroot with yellow-sheathed flowers in long bunches, smaller than Aletris farinosa,
  also called yellow colicroot; not the bigger Aletris farinosa itself.
