simpleMeaning: The change in which cities grow bigger and the whole life of a people comes to follow the
  ways of city life.
scope: Also called urbanization. It is a change that takes place over a whole society, not in one place
  alone.
examples:
- Urbanisation has changed the small town into a busy city.
- The book looks at urbanisation in the east of the country.
