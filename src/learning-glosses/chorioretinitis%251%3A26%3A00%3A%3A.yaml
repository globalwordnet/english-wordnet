simpleMeaning: Inflammation of the retina, the light-sensitive layer of the eye, and the choroid, the
  layer beneath it.
scope: Swelling and soreness in a layer at the back of the eye; not a sore on the surface of the eye and
  not swelling of the eyelid.
examples:
- The doctor said the chorioretinitis was causing her blurred vision.
- Chorioretinitis made the back of his eye sore and swollen.
