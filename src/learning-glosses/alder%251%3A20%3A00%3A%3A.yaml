simpleMeaning: A tree or shrub of northern temperate regions with toothed leaves and cone-shaped fruit.
  Its wood resists rot, and its bark is used for tanning leather and dyeing.
scope: This sense is the living bush or tree, also called alder tree; it is not the wood that comes from
  such a tree.
examples:
- The alder grows well near the wet river bank.
- Small cones hang from the alder in winter.
