senseId: 'compatible_software%1:10:01::'
synsetId: 06579707-n
simpleMeaning: Programs that follow the same agreed rules, so they can be used together.
scope: This one is about programs that work together by following the same rules, not about code that
  can move from one machine to another.
examples:
- The two compatible software packages share the same file format, so we can use them together.
- Our office uses compatible software that lets us open each other's work without trouble.
