simpleMeaning: A picture cut into a piece of timber, inked and pressed onto paper to make copies.
scope: Also called wood block and woodcut. It is not the print made from it.
examples:
- The book was illustrated with a wood engraving of a forest.
- They pressed the wood engraving onto paper to make a copy.
