simpleMeaning: Arid southwestern African plant with yard-high, yard-wide turniplike trunk, deep taproot
  and two lasting, woody, strap-shaped basal leaves. Its ancient relatives disappeared. Estimated ages
  include 700–5,000 years.
scope: Also called welwitschia; a strange plant of dry southwestern Africa with a turnip-like trunk and
  two strap-like leaves, not a cactus and not a tree.
examples:
- Welwitschia mirabilis grows in the Namib Desert.
- A Welwitschia mirabilis can live for thousands of years.
