simpleMeaning: This wood rabbit lives in the wet low ground of the southeastern United States.
scope: Also called a canecutter, a swamp hare, or Sylvilagus aquaticus, this is a woodland animal of the
  lowlands of the southeastern United States, not of the marshy coast from North Carolina to Florida.
