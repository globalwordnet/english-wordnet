senseId: pleonastic%5:00:00:prolix:00
synsetId: 00552046-s
simpleMeaning: Said of words that say the same thing again in different words.
scope: Also called redundant, tautologic, and tautological. It is an adjective.
examples:
- ‘A true fact’ and ‘a free gift’ are pleonastic expressions.
- The pleonastic speech went on and on without saying anything new.
