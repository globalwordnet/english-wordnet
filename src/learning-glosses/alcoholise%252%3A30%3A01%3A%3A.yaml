simpleMeaning: To treat something with alcohol or let alcohol soak into it.
scope: Also called alcoholize. It is about adding drink from outside, not a change within the thing.
examples:
- The cook alcoholised the cherries before adding them to the cake.
- They alcoholise the peaches and serve them with cream.
