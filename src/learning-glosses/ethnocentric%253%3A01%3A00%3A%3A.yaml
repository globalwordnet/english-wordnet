senseId: 'ethnocentric%3:01:00::'
synsetId: 03146958-a
simpleMeaning: Said of a way of seeing things that puts one people, usually one's own, in the middle of
  everything.
scope: This one is said of a person.
examples:
- The ethnocentric book judged every custom by the writer's own people.
- An ethnocentric view treats one's own ways as the only right ones.
