simpleMeaning: A boundary built from stones fitted together, with no mortar between them.
scope: This one is also called dry-stone wall; it is not about the flat boards that cover the inside of
  a house.
examples:
- The dry wall along the field marked the edge of the farm.
- A gardener sat on the dry wall to rest.
