simpleMeaning: It has more than one side to it, and those sides are clearly unlike each other.
scope: Also called double, dual, treble, threefold, twofold, and three-fold, this word is for something
  whose parts are clearly unlike each other, not for something whose parts are all alike.
examples:
- The two-fold plan had a business side and a personal side.
- Their two-fold answer was both a yes and a no.
