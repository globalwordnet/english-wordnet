simpleMeaning: From British Columbia to central California and northern Colorado, this orchid has clustered
  short stems, each bearing two broad leaves and two to four drooping brownish-to-greenish flowers with
  purple-mottled pouches.
scope: The clumping orchid of the western mountains and coastal ranges, not the larger showy pink orchid
  of eastern forests.
examples:
- Clustered lady's slippers bloom in the dappled shade of mountain forests.
- We found a patch of clustered lady's slipper beside the trail.
