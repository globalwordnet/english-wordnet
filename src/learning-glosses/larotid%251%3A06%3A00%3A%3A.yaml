simpleMeaning: A brand of amoxicillin, an antibiotic. This semisynthetic oral penicillin treats bacterial
  infections. Brands include Larotid, Amoxil, Polymox and Trimox. Augmentin combines amoxicillin with
  clavulanate.
scope: Amoxicillin is the oral penicillin antibiotic in this sense. Augmentin contains it together with
  clavulanate.
examples:
- The doctor gave her Larotid for the ear infection.
- Larotid cleared up the infection within a week.
