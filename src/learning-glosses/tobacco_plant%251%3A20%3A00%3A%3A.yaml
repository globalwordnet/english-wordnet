simpleMeaning: An aromatic herb or shrub of the tobacco genus, Nicotiana. Some species live for one growing
  season and others for several years.
scope: This is also called tobacco, and it is not a tree.
examples:
- The tobacco plants gave off a sweet smell as they grew with soft stems.
- Some tobacco plants lived for one year, and others came back year after year as bushes.
