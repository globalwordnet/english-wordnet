simpleMeaning: The point at the base of the brain where some of the nerve fibers from each eye cross to
  the opposite side.
scope: Also called optic chiasma or chiasma opticum. It is a noun.
examples:
- The surgeon pointed to the optic chiasm on the scan.
- Damage to the optic chiasm can affect sight in both eyes.
