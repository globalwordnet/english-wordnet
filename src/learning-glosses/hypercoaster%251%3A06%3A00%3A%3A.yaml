simpleMeaning: A very tall roller coaster, usually around 200 feet high or higher. Some models use powerful
  motors for rapid acceleration.
scope: This is a ride on rails that climbs 200 feet or more and throws riders to 70 mph in 4 seconds,
  and no lower or slower ride counts.
examples:
- The hypercoaster climbs 200 feet or more.
- The hypercoaster's motors were first built to launch rockets.
