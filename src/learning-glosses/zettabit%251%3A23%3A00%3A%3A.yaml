simpleMeaning: A measure of information, 10^21 binary digits in all, the same as 1000 measures of 10^18
  binary digits each.
scope: Also called Zb and Zbit. It is a measure of information.
examples:
- The new drive could store a zettabit of data.
- The report counted the archive in zettabits.
