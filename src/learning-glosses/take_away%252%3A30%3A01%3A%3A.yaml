simpleMeaning: You move a solid thing or something with no body from where it is by lifting, pushing,
  or pulling it from its place.
scope: This is also called remove, take, pull, withdraw, or take off, and it is not buying food to eat
  elsewhere.
examples:
- The waiter took away the empty plates.
- The new law took away their right to vote.
