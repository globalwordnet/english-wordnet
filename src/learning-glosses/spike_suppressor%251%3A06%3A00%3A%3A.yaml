simpleMeaning: Put into a power line, this device holds back sudden jumps in current so they cannot harm
  machines.
scope: Also called lightning arrester, spike arrester, surge protector and surge suppressor, this is the
  device put into a power line to stop sudden jumps in current reaching the machines.
examples:
- They put a spike suppressor into the power line.
- When the current jumped, the spike suppressor held it back.
