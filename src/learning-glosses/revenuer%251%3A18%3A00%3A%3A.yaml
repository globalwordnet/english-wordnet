simpleMeaning: A government worker who takes in taxes and other money owed to the state, above all one
  who stops people making and selling drink against the law.
scope: Among government workers, this is the one who takes in money owed to the state, above all by stopping
  people who make and sell drink against the law.
examples:
- The revenuer was sent to stop people who made drink without a licence.
- When the revenuer arrived, the makers of the drink hid their work.
