simpleMeaning: A guarded post at the end of a road built over water or a gap, on the side nearest the
  enemy.
scope: It is a post, not a captured area held for more troops.
examples:
- The bridgehead held through the night while the enemy shelled it from the far bank.
- They set up a bridgehead at the near end of the crossing before dawn.
