simpleMeaning: A type of aster with arrow-shaped leaves, identified here as Aster sagittifolius.
scope: This is the kind with parts that come to a sharp point, not the other kinds of daisy-like flower.
examples:
- The arrow leaved aster by the path had leaves that came to a sharp point.
- They pressed an arrow leaved aster between the pages of a book.
