simpleMeaning: A blood vessel through which blood leaves the lips of the mouth.
scope: Also called labial vein. It is a blood vessel, not one that drains the lips of the vulva.
examples:
- The surgeon tied off the vena labialis to stop the bleeding from the lip.
- The doctor pressed on the vena labialis to slow the flow of blood from the lip.
