simpleMeaning: A large mass of igneous rock believed to have formed when molten rock pushed into surrounding
  rock and cooled deep underground.
scope: Also called a batholite, a pluton, or plutonic rock, this one is about a mass of stone.
examples:
- The batholith lay under the mountains, hidden from view.
- They drilled down toward the batholith, hoping to reach its hard stone.
