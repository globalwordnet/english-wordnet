simpleMeaning: A noncancerous, rounded lump that grows from the cells covering or lining a body surface.
scope: A harmless round lump of skin-like tissue, also called papillary tumour and papilloma; not a harmful
  growth and not a fluid-filled cyst.
examples:
- The doctor removed the papillary tumor.
- A papillary tumor grew slowly on his skin.
