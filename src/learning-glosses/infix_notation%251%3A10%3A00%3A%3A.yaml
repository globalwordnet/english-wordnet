simpleMeaning: A way of writing expressions with operators between the values they act on, as in 2 + 3.
  Parentheses and rules of precedence show which operation comes first.
scope: 'In maths: the usual way of writing sums, with signs set among the numbers.'
examples:
- Infix notation puts signs among the numbers.
- They wrote the sum in infix notation.
