simpleMeaning: The symbol for lanthanum, a soft, white metal that quickly tarnishes. It is found in rare-earth
  minerals and belongs to the rare-earth group.
scope: This is a soft white metal found with other rare earths, also called atomic number 57 and lanthanum,
  not the music note and not a name.
