simpleMeaning: It shows a word's grammar with two or more words, not by changing the word's shape.
scope: Also called analytic, this is a word form that expresses a grammatical category with two or more
  words, not one that changes its ending.
examples:
- The future here is uninflected, so we use two words, 'will go', to say it.
- The uninflected form of the verb stays the same, and other words show when it happens.
