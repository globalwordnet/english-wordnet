simpleMeaning: The difference in electrical energy per unit of charge between two points, measured in
  volts.
scope: Also called voltage. One volt corresponds to one joule of energy per coulomb of charge.
examples:
- The potential difference across the battery was twelve volts.
- A meter showed the potential difference between the two wires.
