simpleMeaning: A theory combining quantum mechanics and relativity to describe electromagnetic interactions
  involving photons, electrons, and muons.
scope: This theory covers how light bits, electrons, and muons act on each other.
examples:
- The theory of quantum electrodynamics tells how muons act on light bits.
- The muons in quantum electrodynamics follow rules of fast motion.
