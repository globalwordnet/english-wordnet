simpleMeaning: The Samoyedic branch of the Uralic language family, spoken by Indigenous peoples of northwestern
  Siberia.
scope: Samoyed language, Samoyedic and Samoyedic language are other names for this sense, and it is set
  apart from the dog breed and the people of the same name by being the tongues those people speak.
examples:
- Samoyed is one of the Uralic tongues of northwestern Siberia.
- The Samoyed people speak Samoyed in northwestern Siberia.
