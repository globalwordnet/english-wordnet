simpleMeaning: A sudden bad reaction of the body that appears only minutes after contact, in someone whose
  body has been made ready to react.
scope: Atopic allergy, atopy, and type I allergic reaction are other names for it.
examples:
- The immediate allergy showed within minutes of the bee sting.
- An immediate allergy appears fast, often before the patient leaves the clinic.
