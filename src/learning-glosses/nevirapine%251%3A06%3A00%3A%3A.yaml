senseId: 'nevirapine%1:06:00::'
synsetId: 03826799-n
simpleMeaning: An HIV medicine sold as Viramune. It slows the virus by blocking reverse transcriptase,
  an enzyme the virus needs to make copies of itself.
scope: It blocks the copying step of the AIDS germ, is sold under the trade name Viramune, and is used
  to treat AIDS and HIV.
examples:
- Nevirapine held the AIDS germ back.
- They took nevirapine to treat HIV.
