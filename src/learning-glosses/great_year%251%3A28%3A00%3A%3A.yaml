simpleMeaning: The time for one whole turn of the slow shift of the equinoxes, lasting about 25,800 times
  the length of a single journey of the earth round the sun.
scope: Also called Platonic year.
examples:
- The great year lasts about 25,800 years.
- One great year covers many human lifetimes.
