simpleMeaning: The work of taking moving pictures, changing them into a form a computer can keep, and
  saving them for the computer to use.
scope: It is a process, not a single moving picture on its own.
examples:
- Video digitizing turns old tapes into files a computer can keep.
- The library paid for video digitizing of its old tapes.
