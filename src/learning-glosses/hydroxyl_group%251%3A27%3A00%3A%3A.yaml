senseId: 'hydroxyl_group%1:27:00::'
synsetId: 14938926-n
simpleMeaning: An oxygen atom bonded to a hydrogen atom (–OH), forming a group that can attach to the
  rest of a molecule, as in alcohols and some acids.
scope: A part with one free link, made of oxygen and hydrogen, found in bases and in some sour liquids
  and alcohols, not a methyl group and not a water molecule; hydroxyl and hydroxyl radical are other names
  for this sense.
examples:
- The hydroxyl group is written as -OH.
- Each hydroxyl group can join to one other atom.
