simpleMeaning: For dirt that holds fast, short hard hairs scrape it away on a brush built for strong rubbing.
scope: Short, hard hairs for heavy cleaning mark this one, and a scrubbing brush and a scrubber are other
  names for it.
examples:
- He cleaned the floor with a scrub brush.
- The scrub brush took the dirt off the steps.
