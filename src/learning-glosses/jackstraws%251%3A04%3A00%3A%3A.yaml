simpleMeaning: A game where players lift thin sticks from a heap one by one, trying not to move any other
  stick.
scope: Also called spillikins, it is a game played with thin sticks.
examples:
- We played jackstraws after dinner, and each of us tried to lift a stick without shaking the heap.
- They won the round of jackstraws by taking the last stick while the others stayed still.
