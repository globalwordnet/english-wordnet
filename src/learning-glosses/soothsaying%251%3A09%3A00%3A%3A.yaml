simpleMeaning: The practice of claiming or being believed to predict the future through supernatural powers.
scope: Foretelling, divination and fortune telling are other names for this skill, real or pretended,
  of telling what will happen by powers beyond the natural world.
examples:
- People sought soothsaying about what the year would bring.
- Soothsaying tells what will happen, or claims to do so.
