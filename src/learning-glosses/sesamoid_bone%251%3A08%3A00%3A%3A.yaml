simpleMeaning: One of a set of small round pieces of hard tissue that grow in a tendon where it goes over
  a joint.
scope: Also called os sesamoideum and sesamoid. It is a noun.
examples:
- The X-ray showed a sesamoid bone near the joint of the big toe.
- The tendon slides over a sesamoid bone each time the toe bends.
