senseId: 'carnalize%2:31:00::'
synsetId: 00728974-v
simpleMeaning: To trace a thing back to what the senses report.
scope: Sensualize is another name for this, not for the other senses of the same word, which lower a thing
  through pleasures of the flesh or show it in a bodily form.
examples:
- In that book, even a vision is carnalized and put down to hunger.
- The critic carnalized the poem, finding its source in the senses.
