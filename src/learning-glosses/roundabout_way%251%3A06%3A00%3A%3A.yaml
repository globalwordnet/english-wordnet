synsetId: 03187172-n
simpleMeaning: A road that takes a longer path around, chiefly used for a short time while the main route
  is closed.
scope: Also called detour. It is a road.
examples:
- We took the roundabout way home because the bridge was closed.
- Drivers used the roundabout way while the main road was dug up.
