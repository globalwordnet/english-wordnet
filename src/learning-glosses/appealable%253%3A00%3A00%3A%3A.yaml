simpleMeaning: Describing a decision that can be challenged through a review, especially by a higher court.
scope: This is not about a decision that must stand as it is.
examples:
- The ruling was appealable to a higher court, so they asked for a fresh look.
- They knew the fine was appealable and asked for it to be looked at again.
