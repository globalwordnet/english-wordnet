simpleMeaning: A rare, endangered conifer from New Caledonia that bears male and female cones on the same
  plant and lives off a host. Its host is the conifer Falcatifolium taxoides.
scope: This is a rare tree of New Caledonia that lives on another tree, also called parasite yew, not
  a free-standing tree of its own.
examples:
- Parasitaxus ustus lives on another tree in New Caledonia.
- Parasitaxus ustus is rare and in danger of dying out.
