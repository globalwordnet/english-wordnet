simpleMeaning: A very leafy, foul-smelling tropical weed shrub whose seeds have been used to adulterate
  coffee. It is sometimes classified in the genus Cassia.
scope: 'Also called coffee senna, mogdad coffee, stinking weed, styptic weed, or Senna occidentalis: a
  very leafy bad-smelling tropical weedy bush whose seeds have been mixed into coffee as a low-cost addition.'
examples:
- Cassia occidentalis grew by the roadside.
- Cassia occidentalis seeds were once mixed into coffee.
