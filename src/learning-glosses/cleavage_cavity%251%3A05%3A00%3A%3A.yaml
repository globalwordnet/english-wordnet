simpleMeaning: A space full of fluid inside a blastula, a tiny ball of cells in an animal at the start
  of its life.
scope: This one is also called blastocele, blastocoel, blastocoele, and segmentation cavity.
examples:
- Under the microscope, they could see the cleavage cavity inside the ball of cells.
- The needle took a drop of fluid from the cleavage cavity.
