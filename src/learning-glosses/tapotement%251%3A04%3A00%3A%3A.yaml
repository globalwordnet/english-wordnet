simpleMeaning: A massage that uses rhythmic finger taps or quick taps with the sides of the hands. It
  can help loosen mucus in the chest in people with bronchitis.
scope: Of a rub where the body is tapped in time, to free chest-wall slime in those with bronchitis.
examples:
- Tapotement tapped the chest in time.
- A tapotement freed the slime.
