simpleMeaning: An older name for a person whose short height comes from a gene change, with normal body
  proportions and normal mind and adult development.
scope: The word appears in older medical records and requires context.
examples:
- The hypoplastic dwarf grew up with normal mind and body apart from his short size.
- Doctors said the hypoplastic dwarf would need no special care.
