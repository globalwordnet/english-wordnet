simpleMeaning: An Islamist political and armed movement that captured much of Afghanistan in the 1990s
  and established a government after taking Kabul in 1996.
scope: 'Also called Taliban: a strict Muslim armed group that took over Afghanistan in 1995 and Kabul
  in 1996 and set up a Muslim government, not a peaceful party and not an army of another land.'
examples:
- The Taleban took Kabul in 1996.
- The Taleban set up a Muslim government in Afghanistan.
