simpleMeaning: This tree grows in the south-east of the United States and Mexico, and loses its leaves
  in winter.
scope: Also called chittamwood, chittimwood, false buckthorn, shittimwood, and Bumelia lanuginosa, this
  one is a tree, not a shrub of the east.
examples:
- They planted a black haw in the garden.
- A black haw stood at the edge of the field.
