simpleMeaning: To make a horse in dressage rise straight up and kick out with its back legs at the highest
  point.
scope: The other senses of the same word name a playful jump, a trained horse's high jump with a kick,
  and a leap in ballet.
examples:
- The horse caprioled in the dressage ring.
- The rider asked the horse to capriole.
