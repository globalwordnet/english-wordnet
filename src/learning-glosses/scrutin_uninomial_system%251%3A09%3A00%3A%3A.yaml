simpleMeaning: A way of voting in which each voting area picks just one person to speak for it in a law-making
  body.
scope: Also called scrutin uninominal voting system, single-member system, uninominal system, and uninominal
  voting system. It is a noun.
examples:
- The scrutin uninomial system gives each district a single voice in the legislature.
- Under the scrutin uninomial system, voters in one area choose one person to send to the law-making body.
