senseId: self-complacent%5:00:00:contented:00
synsetId: 00591760-s
simpleMeaning: So pleased with the way things stand for you that you miss the faults in your own acts.
scope: Complacent and self-satisfied are other names for this way of resting easy with what you are and
  have done.
examples:
- He had become self-complacent, no longer seeing the faults in what he did.
- She grew self-complacent and stopped seeing the faults in her own acts.
