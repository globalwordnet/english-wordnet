simpleMeaning: Said of a person who cannot get their mind straight after blows that keep coming, or as
  if such blows had landed.
scope: Also called silly or slaphappy. It is a word.
examples:
- They were punch-drunk after ten rounds in the ring.
- They felt punch-drunk with love and could not think straight.
