simpleMeaning: Music created by African American musicians. Early songs had a distinct melody, a strong
  beat, and repeated choruses.
scope: These are songs and tunes made by African-American players, whose early forms had a clear tune
  and a strong beat with parts sung again and again.
examples:
- They loved the strong beat of the black music.
- The band played black music at the dance.
