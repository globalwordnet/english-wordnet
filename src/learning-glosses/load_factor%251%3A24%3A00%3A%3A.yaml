synsetId: 13844781-n
simpleMeaning: In aviation, the ratio of the external load on an aircraft to its weight, expressed in
  multiples of gravity, or g.
scope: In flying, this number counted in g puts the weight laid on a plane from outside beside the weight
  of the plane itself.
examples:
- The load factor tells how much weight the plane bears from outside.
- More weight from outside means a bigger load factor.
