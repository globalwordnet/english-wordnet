simpleMeaning: A stairway most often fixed to the outside of a building, put there so people can leave
  fast if a blaze or another sudden danger strikes.
scope: This one is about a way out of a building, also called an emergency exit.
examples:
- The fire escape at the back of the hotel was rusty but still usable.
- They climbed down the fire escape when the alarm rang.
