simpleMeaning: The part of an organization that brings in new workers, teaches them their work, gives
  them their posts, and makes the rules for looking after workers.
scope: Also called personnel, a personnel office, or a staff office. It is a part of an organization.
examples:
- The personnel department posted the new job openings on Monday.
- Workers go to the personnel department when they need help with training.
