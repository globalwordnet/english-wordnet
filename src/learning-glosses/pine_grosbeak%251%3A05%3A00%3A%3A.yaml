simpleMeaning: A large, thick-billed bird called a grosbeak, found in forests of cone-bearing trees in
  Eurasia and North America.
scope: A big bird of the needle-tree woods of the Old World and the New World, not the small finch of
  North American woods and not the dark brown marten.
examples:
- We saw a pine grosbeak in the northern woods.
- The pine grosbeak is much bigger than a pine finch.
