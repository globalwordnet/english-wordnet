simpleMeaning: To compel someone or something to leave, whether it is real or only a thought.
scope: This one is also called dispel, chase away, drive away, drive off, run off, and turn back.
examples:
- The villagers drove out the wolves that had come near the farms.
- The teacher helped the class drive out fears about the test.
