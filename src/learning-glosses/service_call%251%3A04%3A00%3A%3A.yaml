simpleMeaning: A repair worker's visit to the place where equipment needs maintenance or repair.
scope: A visit by a worker who mends things, made to the place where the thing is; not a call on the telephone
  and not a visit to buy something.
examples:
- He made a service call to fix the heater.
- The service call took less than an hour.
