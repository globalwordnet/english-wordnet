simpleMeaning: A term in an insurance policy that pays twice the amount stated in the policy if the person
  dies by accident.
scope: It is about an insurance policy.
examples:
- The double indemnity clause paid twice the policy's value after the accidental death.
- They bought a policy with double indemnity in case of an accident.
