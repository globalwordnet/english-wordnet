synsetId: 92435830-n
simpleMeaning: A financial contract whose value depends on an underlying asset or measure, negotiated
  and traded privately between two parties without an exchange or intermediary.
scope: 'Also called over-the-counter derivative: private deals between two sides, made straight from one
  to the other, with no market or middle man in between.'
examples:
- The bank sold an OTC derivative to the firm.
- An OTC derivative is traded straight between two sides.
