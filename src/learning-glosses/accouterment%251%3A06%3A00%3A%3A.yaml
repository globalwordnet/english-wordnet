simpleMeaning: The extras a person wears or carries with their clothes, which are not part of the main
  clothes.
scope: This one is also called accessory and accoutrement.
examples:
- The soldier's accouterment included a belt, a pack, and a water bottle.
- Their accouterment was laid out next to the uniform for the morning parade.
