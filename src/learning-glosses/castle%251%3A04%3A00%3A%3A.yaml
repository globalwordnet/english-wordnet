simpleMeaning: A chess move in which the king and a rook move together, with the rook crossing over the
  king to stand beside it.
scope: The chess move, also called castling, not the verb for making it, the rook-shaped piece, or the
  building.
examples:
- A castle on the queenside brought his king to safety.
- She used a castle to bring her rook into play.
