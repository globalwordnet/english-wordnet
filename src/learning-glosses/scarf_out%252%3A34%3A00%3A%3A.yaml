senseId: 'scarf_out%2:34:00::'
synsetId: 01195632-v
simpleMeaning: To keep eating long after one has had enough, with no regard for good manners.
scope: Also called stuff, gorge, binge, engorge, glut, overeat, satiate, overindulge, englut, gormandise,
  gormandize, gourmandize, ingurgitate, overgorge, and pig out, it is the word for eating past all sense.
examples:
- They scarfed out and ate far more than they needed.
- The kids scarfed out on the food and ate until they could eat no more.
