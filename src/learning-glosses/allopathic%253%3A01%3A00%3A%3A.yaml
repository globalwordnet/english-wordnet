simpleMeaning: Relating to the practice of treating disease with remedies whose effects differ from those
  of the disease itself.
scope: It is about the usual drug treatment of sickness, not about homeopathy.
examples:
- The doctor chose allopathic remedies to bring down the fever.
- The clinic gave allopathic care with drugs that work against the signs of the sickness.
