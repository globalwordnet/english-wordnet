simpleMeaning: An older term for loss of mental ability in later life, sometimes used dismissively of
  behavior such as sudden infatuations.
scope: Also called dotage and second childhood, this weakness of mind comes with great age and at times
  shows in silly crushes.
examples:
- In senility, a person of great age may form a silly crush.
- Their senility showed in silly crushes as they grew older.
