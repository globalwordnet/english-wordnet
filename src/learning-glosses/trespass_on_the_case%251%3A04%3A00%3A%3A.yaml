synsetId: 00736496-n
simpleMeaning: A court action that lets a harmed person claim money from one whose acts led to injury
  or loss in an indirect way.
scope: This court action is about an indirect cause, not things taken from an owner or a person going
  onto land belonging to someone else.
examples:
- A person who was hurt by stumbling over a log on the road could bring a trespass on the case.
- Their trespass on the case asked for money for the loss caused by the acts of another person.
