simpleMeaning: An electronic musical instrument played without touch. The player moves one hand near an
  antenna to control pitch and the other near a second antenna to shape volume and phrasing.
scope: A music-making box played in the air without touch.
examples:
- She played the theremin by waving her hands near the rods.
- The theremin sang a slow tune as his right hand moved between the rods.
