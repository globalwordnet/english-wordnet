senseId: diagonal%5:00:02:oblique:00
synsetId: 01724106-s
simpleMeaning: Joining two corners that are not next to each other in a flat shape, or two corners that
  share no face in a solid shape.
scope: A line joining corners that do not sit side by side, not the numbers in a square table and not
  a cut across cloth.
examples:
- She drew a diagonal line across the page.
- The diagonal joins the top corner to the bottom corner of the room.
