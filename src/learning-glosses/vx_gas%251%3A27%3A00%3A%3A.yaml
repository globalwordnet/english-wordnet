simpleMeaning: A lethal chemical warfare nerve agent. This liquid can enter through skin or lungs, disrupt
  nerve signals, and stop breathing. Released VX can remain hazardous for weeks.
scope: A nerve agent for chemical warfare, spread by blowing up a container over the target area and able
  to last weeks in the environment after release.
examples:
- VX gas soaks through the skin and stops breathing.
- VX gas can last weeks in the environment.
