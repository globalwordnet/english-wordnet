simpleMeaning: A sickness of the organ that pumps blood around the body, caused by a fault in the blood
  vessels that bring blood and oxygen to it.
scope: This one is about the pumping organ, not the vessels themselves.
examples:
- The nurse checked the blood flow of a patient with coronary heart disease.
- The patient with coronary heart disease came back for another check.
