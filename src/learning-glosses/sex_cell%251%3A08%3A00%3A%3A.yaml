simpleMeaning: A sperm or egg cell that carries DNA from a parent to the next generation.
scope: A germ cell or a reproductive cell is another name for the tiny part of the body, a sperm or an
  egg, that hands on to children what makes them who they are.
examples:
- Without a sex cell, nothing is passed on to the next generation.
- Each sex cell holds the makings of the next generation.
