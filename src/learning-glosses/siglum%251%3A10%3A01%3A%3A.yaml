senseId: 'siglum%1:10:01::'
synsetId: 92464160-n
simpleMeaning: In old hand-written books or on coins and medals, a mark, short form, letter or sign takes
  the place of words.
scope: This is a mark or short form standing for words in old books or on coins and medals, not a mark
  used in new books.
examples:
- The siglum RIP stands for words meaning rest in peace.
- The coin bore a siglum in place of the full words.
