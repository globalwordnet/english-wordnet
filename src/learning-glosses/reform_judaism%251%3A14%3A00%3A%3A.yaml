simpleMeaning: A liberal movement within Judaism whose members adapt Jewish tradition to modern life and
  interpret Talmudic teachings flexibly.
scope: The most liberal branch of the faith of Moses, not the beliefs and practices on their own, and
  not the stricter branches that keep the Talmud fully.
examples:
- Reform Judaism is the most liberal branch of the faith.
- In Reform Judaism, old forms are fitted to the modern world.
