senseId: 'wear_upon%2:29:00::'
synsetId: 00074774-v
simpleMeaning: To leave a person with no strength at all, or to end up with none yourself, by too much
  use or by too great a strain.
scope: Also called wear, tire, weary, fatigue, jade, fag, fag out, outwear, tire out, wear down and wear
  out. It is a verb.
examples:
- The hard climb wore upon them all before noon.
- Years of night shifts had worn upon their health.
