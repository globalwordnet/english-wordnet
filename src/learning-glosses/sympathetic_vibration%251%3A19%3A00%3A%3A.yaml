senseId: 'sympathetic_vibration%1:19:00::'
synsetId: 11498571-n
simpleMeaning: In physics, a shaking in one thing brought on by resonance, the shaking of another thing
  at the same rate.
scope: It is not a shaking that starts on its own.
examples:
- The sympathetic vibration of the string made the whole instrument hum.
- They heard the sympathetic vibration in the glass when the singer held the high note.
