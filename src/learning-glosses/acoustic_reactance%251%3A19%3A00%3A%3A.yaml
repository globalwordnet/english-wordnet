senseId: 'acoustic_reactance%1:19:00::'
synsetId: 11524896-n
simpleMeaning: The part of a surface's opposition to sound flow that comes from storing and releasing
  energy. It is the imaginary component of acoustic impedance, alongside the real component, resistance.
scope: This sense is also called acoustic impedance and acoustic resistance.
examples:
- Acoustic reactance slowed the sound.
- An acoustic reactance stood against the flow.
