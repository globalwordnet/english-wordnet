simpleMeaning: A small cap that Jewish people wear on the top of the head, above all when they pray.
scope: Also called yarmulke and yarmulka, this one covers only the top of the head, not the whole head.
examples:
- At the service, they put on a yarmelke before the prayers began.
- They keep a yarmelke in a pocket for visits to the synagogue.
