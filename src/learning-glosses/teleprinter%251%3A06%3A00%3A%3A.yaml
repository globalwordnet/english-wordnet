simpleMeaning: Letters sent along a wire come out printed from this device, which works in the same way
  as a typewriter.
scope: This is also called a teletype machine, a teletypewriter, telex, or a telex machine.
examples:
- They read the message as it came off the teleprinter.
- The office used a teleprinter to receive written messages from far away.
