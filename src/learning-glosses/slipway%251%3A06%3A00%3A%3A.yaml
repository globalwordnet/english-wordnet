simpleMeaning: Ships are built or repaired at the top of this slope, which runs down into the water.
scope: This slope is also called ways and a shipway, and it runs down into the water from the place where
  ships are built or repaired.
examples:
- The boat rested on the slipway before it went into the water.
- The hull was repaired on the slipway.
