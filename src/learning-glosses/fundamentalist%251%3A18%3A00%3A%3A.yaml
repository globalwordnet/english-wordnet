simpleMeaning: A person who supports a movement that calls for a strict return to what it sees as the
  basic teachings of a faith.
scope: Here the word names a supporter of religious fundamentalism.
examples:
- The fundamentalist argued that the old rules must not change.
- He was known as a fundamentalist who held fast to the first teachings.
