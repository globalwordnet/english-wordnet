simpleMeaning: Severe beta thalassemia inherited from both parents. Too little normal hemoglobin can cause
  fatal anemia without treatment, bone deformities, and enlargement of the heart, spleen, and liver.
scope: 'Also called thalassaemia major, thalassemia major or Cooley''s anaemia: a deadly blood illness
  passed down from both parents, with no red blood pigment, bones that grow wrongly, and heart, spleen
  and liver that grow too big.'
examples:
- Cooley's anemia is a deadly blood illness passed down from both parents.
- A child with Cooley's anemia has no red blood pigment and enlarged organs.
