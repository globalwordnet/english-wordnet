senseId: 'ultrasound%1:04:00::'
synsetId: 00903487-n
simpleMeaning: A method of making images from echoes of high-frequency sound waves, commonly used to examine
  organs or monitor a baby's growth before birth.
scope: Also called echography, sonography, or ultrasonography; a picture made from sound, not very high
  sounds themselves.
examples:
- The doctor ordered an ultrasound to check the baby's growth.
- An ultrasound showed the stone in her kidney.
