senseId: 'primidone%1:06:00::'
synsetId: 04009289-n
simpleMeaning: An anticonvulsant sold as Mysoline, used for tonic-clonic seizures, formerly called grand
  mal seizures, and for essential tremor, a condition causing involuntary shaking.
scope: A drug for shaking fits and steady shaking, not a drug for pain and not a drug for low mood.
examples:
- The doctor gave him primidone for his grand mal seizures.
- She takes primidone each morning to keep the tremor down.
