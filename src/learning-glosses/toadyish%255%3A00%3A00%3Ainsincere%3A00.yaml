senseId: toadyish%5:00:00:insincere:00
synsetId: 02188861-s
simpleMeaning: Praise that is not meant, given to people with power in the hope of winning their favour.
scope: Also called fawning, sycophantic, obsequious and bootlicking, this word is used for praise aimed
  at people with power, not at just anyone.
examples:
- They praised the boss in a toadyish way.
- They spoke to the people in charge with toadyish praise.
