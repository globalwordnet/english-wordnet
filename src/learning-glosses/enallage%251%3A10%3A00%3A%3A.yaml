simpleMeaning: Using one grammatical form in place of another, such as writing the editorial “we” in place
  of “I.”
scope: In this swap, one form of a word takes the place of another form, in speech, gender, number, or
  tense.
examples:
- In the poem, an enallage put 'we' in the place of 'I'.
- The writer used an enallage, writing 'we' where 'I' would fit.
