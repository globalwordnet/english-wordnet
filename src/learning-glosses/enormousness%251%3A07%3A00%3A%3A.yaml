simpleMeaning: The quality of being far larger than is usual, in size, in spread, or in number.
scope: This one is also called greatness, and vastness, immensity, grandness, wideness, immenseness and
  sizeableness are other names for it.
examples:
- The enormousness of the new hall surprised everyone.
- They had never seen such enormousness in a single building.
