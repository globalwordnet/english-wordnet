senseId: 'limerick%1:10:00::'
synsetId: 06392226-n
simpleMeaning: A humorous five-line poem, usually with two weak syllables followed by a strong one. Lines
  one, two, and five rhyme, as do lines three and four.
scope: This is a short funny poem of five lines with a set beat and end sounds, not a long story poem
  or a song.
examples:
- She read us a funny limerick with five short lines.
- The children laughed at the limerick he made up at school.
