simpleMeaning: Without necessarily being married to them, a person lives with another person and shares
  a long-term sexual relationship with them.
scope: Domestic partner, significant other, and spouse equivalent are other names for this person.
examples:
- They live together, and one is the other's spousal equivalent.
- They share a home, one as the other's spousal equivalent.
