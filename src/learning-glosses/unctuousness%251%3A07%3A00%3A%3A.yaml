simpleMeaning: The manner of a person who acts deeply serious and caring, with a pleased air, while really
  looking out for themself.
scope: Unction, fulsomeness, oiliness, oleaginousness, and smarminess are other names for it.
examples:
- The unctuousness in their voice made the praise hard to trust.
- They spoke with unctuousness about their own good deeds.
