senseId: 'troponymy%1:24:00::'
synsetId: 13831080-n
simpleMeaning: The link in meaning where one word for an action is a way of doing another action.
scope: It is a link in meaning between two words for actions.
examples:
- Troponymy links the verb 'march' to the verb 'walk'.
- To limp is a case of troponymy, since limping is walking in a certain way.
