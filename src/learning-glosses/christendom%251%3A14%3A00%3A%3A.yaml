simpleMeaning: Christians considered together worldwide and throughout history, including the historically
  large Christian populations of Europe, the Americas, and Australia.
scope: This is all Christians together, in every land and every age, also called Christianity; it is the
  whole body of Christians, not one church or one land.
examples:
- Christendom spread across Europe and the Americas over the centuries.
- The history of Christendom spans many lands and ages.
