simpleMeaning: A big animal from North America with very big feet, whose coat turns white in winter.
scope: Also called snowshoe rabbit and varying hare. It is a noun, known by the Latin name Lepus americanus.
examples:
- The snowshoe hare bounded across the clearing on its huge feet.
- In January, the snowshoe hare's coat was already white.
