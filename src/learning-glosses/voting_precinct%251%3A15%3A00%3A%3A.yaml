simpleMeaning: A city or town is split into several precincts, and each one holds one place where people
  cast their ballots.
scope: This area is also called an election district, and it is one of several, not the whole city or
  town.
examples:
- They voted at the school gym in their voting precinct.
- The voting precinct covered the streets near the river.
