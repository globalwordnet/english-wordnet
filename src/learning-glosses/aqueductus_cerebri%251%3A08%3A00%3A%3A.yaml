senseId: 'aqueductus_cerebri%1:08:00::'
synsetId: 05511052-n
simpleMeaning: A passage in the brain that joins the third and fourth ventricles, the hollow spaces inside
  it.
scope: This passage, also called the cerebral aqueduct and the Sylvian aqueduct, joins no other pair of
  hollow spaces.
examples:
- The scan showed a block in the aqueductus cerebri.
- Fluid moves through the aqueductus cerebri from one hollow space to the next.
