simpleMeaning: A very small tree resembling Rocky Mountain pinyon, with just one needle per bundle. Its
  range resembles that of Parry's pinyon.
scope: This is a very small tree like the Rocky Mountain pinon, with one needle per bundle and a range
  much like Parry's pinyon; Pinus californiarum is another name for it, not the Rocky Mountain pinon itself,
  and not Parry's pinyon.
