simpleMeaning: To work in a job that runs an organization or a service, or to watch over people and tell
  them what to do.
scope: Also called administer. It is an action.
examples:
- They administrate the office, setting the hours and keeping the records.
- One manager administrates a team of twenty people at the hospital.
