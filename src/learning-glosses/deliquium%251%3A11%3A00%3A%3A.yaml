simpleMeaning: A passing out that comes on by itself, when too little blood reaches the brain.
scope: This one is also called a faint, a swoon, or syncope.
examples:
- The deliquium came on in the hot room, and the person had to sit down.
- The deliquium struck while the person was standing in the queue.
