simpleMeaning: A poisonous, colorless, flammable gas used in organic chemistry and transistor manufacturing,
  and historically as a chemical weapon.
scope: A poison gas with no colour that catches fire easily, not a gas used to cook or heat a home.
examples:
- Arsine is a poison gas used in making electronic parts.
- Workers wore masks where arsine was used.
