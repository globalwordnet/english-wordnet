simpleMeaning: One of a pair of two-part numbers that share the same first part, but whose second parts
  are equal and opposite.
scope: This one is about a pair of numbers in maths.
examples:
- The complex conjugate of 3 + 2i is 3 - 2i.
- The teacher asked the class to find the complex conjugate of 5 - 4i.
