senseId: 'antiparticle%1:17:00::'
synsetId: 09222782-n
simpleMeaning: A particle with the same mass as its counterpart but opposite properties such as electric
  charge. When they meet, they can annihilate each other and release energy as radiation.
scope: This is the opposite partner of a small piece of matter, not the ordinary piece itself and not
  a whole atom.
examples:
- When a particle meets its antiparticle, both disappear and energy is released.
- The positron is the antiparticle of the electron.
