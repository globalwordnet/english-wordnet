schema: oewn-learning-gloss-v2
senseId: 'most%3:00:01::'
synsetId: 01560125-a
simpleMeaning: The highest degree of much, usually used with the and an uncountable noun, meaning the
  greatest amount, extent, or degree.
scope: Covers both the mass-noun use and the degree use; not "most" before count nouns, which is a separate
  entry.
examples:
- She spent most of her money on books.
- Most water in the lake is clean.
