simpleMeaning: To spoil something, ruin it, or make a mess of doing it.
scope: Also called blow, fumble, spoil, fluff, bumble, botch, bungle, muff, bobble, mishandle, flub, ball
  up, bodge, bollix, bollix up, bollocks, bollocks up, botch up, foul up, fuck up, louse up, mess up,
  and muck up. It is a verb.
examples:
- The pianist screwed up the difficult passage in the second movement.
- They screwed up the order and had to start again.
