simpleMeaning: Inside a group, an informant tells the public about wrong acts in the hope of stopping
  them.
scope: Also called a whistleblower or a whistle blower, this informant makes wrong acts inside a group
  public in the hope of stopping them, not one who keeps them secret.
examples:
- After a whistle-blower told reporters about the unsafe conditions, the hospital faced public pressure
  to change.
- The law gives little protection to a whistle-blower who speaks up about what is going on inside a company.
