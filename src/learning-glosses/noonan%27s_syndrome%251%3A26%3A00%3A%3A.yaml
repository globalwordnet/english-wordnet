simpleMeaning: A genetic condition affecting people of any sex. Features can include short stature and
  low-set ears, and males may have reduced fertility.
scope: This is a set of signs found together in boys and men only, not a sickness that strikes both sexes
  or a single sign on its own.
examples:
- Noonan's syndrome shows in short height and low-set ears.
- The boy with Noonan's syndrome was seen by the doctor.
