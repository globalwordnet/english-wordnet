simpleMeaning: To believe something, above all when the grounds are unsure or unsettled.
scope: Suppose, speculate, conjecture, theorize, hypothesize, hypothecate, and hypothesise are other names
  for this sense.
examples:
- They theorised that the old building had once been a school.
- They theorised about why the river had changed its course.
