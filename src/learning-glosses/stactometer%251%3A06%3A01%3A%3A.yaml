simpleMeaning: A tool for finding how strongly the top of a liquid pulls together, by counting the drops
  that fall from it.
scope: Also called stalagmometer and stalogometer. It is a tool.
examples:
- The stactometer showed the liquid had strong surface tension.
- They used a stactometer to test the new soap mix.
