simpleMeaning: Many kinds of bug belong to the large group Hemiptera, and this name covers any one of
  them, above all those of the smaller group Heteroptera.
scope: This name is for insects of the large group Hemiptera, above all its smaller group Heteroptera,
  and not for insects outside that group.
examples:
- The aphid on the rose is a true bug.
- Shield bugs are true bugs of the suborder Heteroptera.
