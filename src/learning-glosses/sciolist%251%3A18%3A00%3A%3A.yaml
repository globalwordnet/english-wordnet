simpleMeaning: Someone who acts as if they know a subject well, though they have only taken it up lightly
  and without real care.
scope: This person is also called a dilettante or a dabbler, and they take a subject up lightly rather
  than working at it with real care.
examples:
- The sciolist talked with great confidence and very little real knowledge.
- Listeners soon saw the sciolist knew far less than claimed.
