synsetId: 05739513-n
simpleMeaning: In psychology, the joining of small bits of information so they form big groups that act
  as one.
scope: Also called chunking and unitisation. It is a kind of grouping in the mind, not a kind of packing.
examples:
- The teacher used unitization to turn a string of numbers into a few easy groups.
- In the test, unitization helped the students remember the long list as a few groups.
