simpleMeaning: To do things without any plan, or to pass the time doing nothing in particular.
scope: It is also called monkey, tinker, potter, putter, mess around, muck about, or muck around.
examples:
- They spent the afternoon monkeying around in the yard.
- They just monkeyed around all day instead of working.
