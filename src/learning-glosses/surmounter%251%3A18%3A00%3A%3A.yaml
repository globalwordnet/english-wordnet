senseId: 'surmounter%1:18:00::'
synsetId: 10687889-n
simpleMeaning: This person beats others and rises above them, taking charge by force or by words that
  win them over.
scope: This is a person who gets control over others by force or by winning words; overcomer and subduer
  are other names for this sense.
examples:
- The new chief proved a surmounter, winning the group over with words alone.
- No rival could stand against the surmounter once control had been taken.
