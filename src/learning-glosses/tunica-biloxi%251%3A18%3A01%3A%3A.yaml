simpleMeaning: A member of the Tunica-Biloxi people, an Indigenous people of the southeastern United States
  with historical ties to Mississippi.
scope: One of the Siouan people of south-eastern Mississippi, also called Biloxi, not a member of another
  people.
examples:
- A Tunica-Biloxi elder told stories of the old days.
- The Tunica-Biloxi are one of the Siouan peoples.
