senseId: 'teach-in%1:10:00::'
synsetId: 07160491-n
simpleMeaning: People spend a long time together, such as on a college campus, hearing talks and talking
  over an important issue that usually stirs strong views.
scope: Such a meeting runs long and gives people room to talk over a big issue, not a single short talk
  with no room for views.
examples:
- Students held a teach-in on campus to talk over a big issue.
- People came to the teach-in to hear talks and share their views.
