simpleMeaning: A national and official language of Pakistan with a literary tradition, closely related
  to Hindi, widely used in India, especially by Muslims, and written in a form of Arabic script.
scope: Also called Urdu language; the set book tongue of Pakistan, close kin to Hindi and written in Arabic
  letters, not Hindi itself.
examples:
- She read an Urdu poem aloud in class.
- He writes letters in Urdu to his family in Pakistan.
