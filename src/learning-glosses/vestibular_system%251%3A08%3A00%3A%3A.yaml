simpleMeaning: Balance comes from a set of organs in the inner ear, and they work together to keep the
  body balanced.
scope: This is also called the vestibular apparatus, and it is not one organ on its own.
examples:
- The scan showed the vestibular system was swollen, and they could not stand straight.
- A blow to the head had hurt the vestibular system, so the room seemed to spin.
