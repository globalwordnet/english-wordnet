synsetId: 14117550-n
simpleMeaning: A long-term disease of the nervous system that can worsen over time as some nerve fibers
  lose their protective coating, called myelin.
scope: A long-lasting nerve illness, also called disseminated multiple sclerosis or multiple sclerosis;
  not a short illness of the nerves.
examples:
- Disseminated sclerosis had left her hands weak and shaky.
- The scan showed disseminated sclerosis where the nerve coating was gone.
