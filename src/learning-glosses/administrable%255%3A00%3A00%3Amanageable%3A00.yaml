senseId: administrable%5:00:00:manageable:00
synsetId: 01477949-s
simpleMeaning: Said of a thing that a person in charge can run or give out, or that can be looked after
  and kept in order.
scope: It is said of a thing, not of a person.
examples:
- The new drug is administrable by mouth, so patients can take it at home.
- The small fund is administrable by one clerk working part time.
