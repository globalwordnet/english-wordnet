senseId: 'reserve_clause%1:10:00::'
synsetId: 06405925-n
simpleMeaning: A now-dead term in a pro athlete's contract that held the player to the same team for a
  year past the contract's end.
scope: It once held a pro athlete to the same team for a year past the contract's end, and no such term
  is used in contracts today.
examples:
- The reserve clause was used to bind players to a particular ball club.
- He could not leave the club, for the reserve clause held him for another year.
