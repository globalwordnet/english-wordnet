simpleMeaning: Said of something that serves as the first model others like it are made to follow.
scope: Also called archetypal, archetypical, prototypal, or prototypical. It is a word.
examples:
- The prototypic bridge design was copied by builders all over the country.
- The old hall served as the prototypic building for the new town.
