simpleMeaning: A place of learning for students who have left the first school but have not yet reached
  college, most often taking grades 9 to 12.
scope: Also called a gymnasium, a lycee, a middle school, or a secondary school. It is a kind of school.
examples:
- The lyceum opened a new science wing last year.
- Students study Latin at the lyceum before going to college.
