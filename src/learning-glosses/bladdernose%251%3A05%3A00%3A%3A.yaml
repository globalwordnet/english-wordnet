simpleMeaning: A medium-sized blackish-gray seal with a large sac on its head that it can inflate. It
  lives in Arctic and northern Atlantic waters.
scope: This sense is also called hooded seal, a mid-sized blackish-grey seal with a big air-filled sac
  on its head, from Arctic and north Atlantic seas.
examples:
- Bladdernoses swim in Arctic seas.
- The bladdernose has a big sac on its head.
