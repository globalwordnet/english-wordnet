simpleMeaning: A small, thick-furred, egg-laying water mammal from Australia and Tasmania with a broad
  bill, broad tail, and webbed feet. The only species in the family Ornithorhynchidae.
scope: This sense is also called platypus, duck-billed platypus, and duckbill, a thick-furred water egg-layer,
  small, Australian and Tasmanian, with a duck bill, a tail, and feet webbed, the sole kind of Ornithorhynchidae.
examples:
- Duckbilled platypuses swim with webbed feet.
- The duckbilled platypus lays eggs.
