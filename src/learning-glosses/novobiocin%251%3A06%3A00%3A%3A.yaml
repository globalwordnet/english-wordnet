simpleMeaning: An antibiotic from bacteria called actinomycetes, used to treat infections caused by Gram-positive
  bacteria.
scope: A drug that kills germs, got from a tiny living thing; not a drug for every kind of germ and not
  a painkiller.
examples:
- Novobiocin was given to fight the infection.
- The doctor prescribed novobiocin for the skin infection.
