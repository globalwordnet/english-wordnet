simpleMeaning: An organ in the womb of most mammals, rich in blood vessels, that supplies the unborn young
  with oxygen and nutrients and carries away waste.
scope: The term names the organ involved in this exchange during pregnancy.
examples:
- The placenta supplied the developing baby with oxygen and nutrients.
- Doctors checked the placenta after the baby was born.
