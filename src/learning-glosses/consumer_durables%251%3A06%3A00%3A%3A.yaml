senseId: 'consumer_durables%1:06:00::'
synsetId: 03262580-n
simpleMeaning: Things people buy to use, which are not destroyed by being used.
scope: Also called durable goods and durables; this one is about things that survive use, not food and
  other things that get used up.
examples:
- A washing machine and a fridge are consumer durables.
- The shop sells consumer durables such as cookers and televisions.
