simpleMeaning: A huge two-legged meat-eating dinosaur with saw-edged teeth that lived in North America
  during the late Cretaceous. It hunted prey and likely scavenged as well.
scope: A huge meat-eating dinosaur on two legs, with enormous knife-edged teeth, perhaps a scavenger,
  not a hunter, of late Cretaceous North America; also called tyrannosaur.
examples:
- Their tyrannosaurus filled the hall.
- The tyrannosaurus stood in the museum.
