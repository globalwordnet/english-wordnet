simpleMeaning: They watch how fast a sick person's heart beats and how fast the person breathes while
  the person walks on a moving belt, to put the body under strain.
scope: This puts a sick person under strain and watches the heart and breathing, not one done while lying
  still.
examples:
- The treadmill test showed how the heart worked while the patient walked on the belt.
- During the treadmill test, they watched the speed of the breathing as the patient walked.
