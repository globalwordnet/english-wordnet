senseId: stuck-up%5:00:00:proud:00
synsetId: 01896449-s
simpleMeaning: In everyday speech, thinking far too well of oneself and looking down on others.
scope: This is also called snotty, snooty, bigheaded, persnickety, snot-nosed, too big for one's breeches,
  and uppish.
examples:
- They're snobs — stuck-up and uppity and persnickety.
- They found the stuck-up manner hard to bear.
