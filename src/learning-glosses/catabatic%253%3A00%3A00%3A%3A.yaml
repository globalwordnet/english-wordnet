simpleMeaning: Said of a current of air or a wind that flows down, or down a slope, as it gets colder,
  above all at night.
scope: Katabatic is another name for this.
examples:
- A catabatic wind blew down the valley after sunset.
- The catabatic flow chilled the town below.
