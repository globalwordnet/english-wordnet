simpleMeaning: A shape with flat faces that has a four-sided figure for its base, a figure whose sides
  across from each other never meet.
scope: Also called a parallelepiped, a parallelepipedon, or a parallelopiped. It is a solid.
examples:
- The teacher drew a parallelopipedon on the board to show the class.
- They cut the block into the shape of a parallelopipedon.
