simpleMeaning: The color of powdered tobacco, a shade of grayish brown to yellowish brown.
scope: Snuff, chukker-brown, and mummy-brown are other names for this colour between grey and dull gold,
  the shade of tobacco ground to powder.
examples:
- Her dress was snuff-brown.
- The old book was bound in snuff-brown cloth.
