simpleMeaning: Grasslike basal leaves and leafless stalks bearing narrow clusters of star-shaped yellow-orange
  flowers distinguish this plant of the southwestern United States, North America's only Anthericum species.
scope: The desert plant with grassy leaves and star-shaped orange flowers, not a garden lily or a water
  lily.
examples:
- The amber lily blooms in late summer among the rocks.
- You can find the amber lily on dry hillsides in the Southwest.
