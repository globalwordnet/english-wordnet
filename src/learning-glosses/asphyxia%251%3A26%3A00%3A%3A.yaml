simpleMeaning: A condition in which breathing exchanges too little oxygen and carbon dioxide, or none
  at all. Causes include choking, drowning, electric shock, and poisonous gas.
scope: 'Of breathing: a state where too little or no oxygen and carbon dioxide are swapped, from choking,
  drowning, electric shock, or poison gas.'
examples:
- Asphyxia stopped the breathing.
- An asphyxia came from choking.
