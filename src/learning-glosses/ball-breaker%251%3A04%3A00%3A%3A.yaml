simpleMeaning: Work or a state of affairs so hard, tiring, and punishing that it wears a person out.
scope: Also called a ball-buster, this one names a kind of job, not a kind of person.
examples:
- Vietnam was a ball-breaker.
- The first year of medical school was a real ball-breaker.
