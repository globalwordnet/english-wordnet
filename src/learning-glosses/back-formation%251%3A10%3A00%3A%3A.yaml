schema: oewn-learning-gloss-v2
senseId: 'back-formation%1:10:00::'
synsetId: 06299130-n
simpleMeaning: A new word made, often unknowingly, by removing a prefix or ending from a familiar word
  because people assume the familiar word came from it.
scope: It is a new word made by taking a bit off a known word, not by adding a bit to one.
examples:
- The word 'edit' is a back-formation from 'editor'.
- She explained that the new word came about by back-formation.
editorialStatus: reviewed-model-not-student-validated
