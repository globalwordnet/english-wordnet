simpleMeaning: A senior lawyer awarded a professional distinction called King’s Counsel while the monarch
  is a king.
scope: Often abbreviated KC. The title becomes Queen’s Counsel under a queen regnant.
examples:
- After years at the bar, she was appointed King’s Counsel.
- The company hired a King’s Counsel to argue its appeal.
