simpleMeaning: August 1, also the feast of Saint Peter's miraculous release from prison. In Scotland it
  is a traditional quarter day, and in England it marks a harvest festival.
scope: August 1 is associated with several traditions, including an English harvest festival and the feast
  of Saint Peter's release from prison.
examples:
- Lammas Day is a harvest festival in England.
- Lammas Day marks Saint Peter's escape from prison.
