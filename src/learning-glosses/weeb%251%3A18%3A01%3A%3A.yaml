simpleMeaning: An insulting term for a non-Japanese person, often imagined as white, whom the speaker
  sees as obsessed with Japanese culture.
scope: Also called weeaboo. It is a person.
examples:
- They are a weeb who watches anime all day.
- The weeb in our class knows a lot about Japan.
