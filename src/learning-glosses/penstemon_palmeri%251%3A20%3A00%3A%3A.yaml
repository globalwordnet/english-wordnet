simpleMeaning: A plant whose upright stems bear long, narrow clusters of fragrant, bulging flowers ranging
  from white to reddish pink. It grows from Arizona to New Mexico and Utah.
scope: Also called balloon flower and scented penstemon; found in Arizona, New Mexico, and Utah.
examples:
- The Penstemon palmeri smelled sweet in the desert garden.
- Penstemon palmeri grew in clusters along the Arizona trail.
