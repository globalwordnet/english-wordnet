simpleMeaning: A petroleum-derived mixture of hydrocarbons such as hexane, heptane, and octane that evaporates
  and burns easily. Its main use is fueling internal-combustion engines.
scope: This is the fuel for engines, not the air-like substance that spreads through a room.
examples:
- We stopped at the gas station to fill up the car.
- The price of gas has gone up again.
