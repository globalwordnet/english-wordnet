simpleMeaning: Christian teaching calls it a false belief to say God is three separate beings, the Father,
  the Son, and the Holy Spirit.
scope: In Christian teaching, this is the false belief that God is three separate beings, not one God.
examples:
- They were charged with tritheism for teaching that the Father, the Son, and the Holy Spirit are three
  separate gods.
- The council condemned tritheism as a false teaching about God.
