simpleMeaning: An organic compound in which a cyano group (–CN) and a hydroxyl group (–OH) are attached
  to the same carbon atom.
scope: An organic compound in which the -CN and -OH groups both cling to one carbon atom.
examples:
- Cyanohydrins cling to one carbon bit.
- The cyanohydrin holds -CN and -OH groups.
