senseId: substitutable%5:00:00:synonymous:00
synsetId: 02390181-s
simpleMeaning: The meaning stays the same when one word is put in for another in the same setting.
scope: This is about words in a setting, not about things that can be swapped for something of the same
  worth.
examples:
- The two words are substitutable in this sentence.
- In that sentence, fast and quick are substitutable.
