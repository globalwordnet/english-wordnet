simpleMeaning: Any saturated hydrocarbon with eight carbon atoms and eighteen hydrogen atoms, found in
  petroleum and used as a fuel and solvent. Its atoms can have different arrangements.
scope: A kind of hydrocarbon from oil, used as fuel and to dissolve things.
examples:
- High-octane fuel has more octane in it.
- The lab used octane to dissolve the sample.
