simpleMeaning: One of the most common of the five main antibody classes and the chief antibody in the
  linings of the digestive tract and airways.
scope: This is one of the most common of the five main kinds of proteins that fight sickness, and the
  main one that guards the linings of the gut and airways, also called IgA; near kinds are IgG and IgM.
examples:
- Immunoglobulin A is the main antibody in the linings of the gut and the airways.
- Doctors test immunoglobulin A levels when they check how well the body fights sickness.
