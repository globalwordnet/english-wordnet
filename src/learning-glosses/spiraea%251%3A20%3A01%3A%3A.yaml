simpleMeaning: Any plant in the rose-family genus Spiraea that bears sprays of small white or pink flowers.
scope: Any plant of one small group in the rose family with sprays of small white or pink flowers; spirea
  is another name for this sense, not a rose bush and not a plant with big red flowers.
examples:
- The spiraea in the garden has sprays of small white flowers.
- A spiraea blooms pink in early summer.
