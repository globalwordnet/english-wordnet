scope: A one-year tropical African plant with scarlet tassel-shaped flower heads; also called tassel flower,
  Cacalia lutea, Emilia coccinea, Emilia flammea and Emilia javanica, not a perennial plant.
examples:
- Cacalia javanica has scarlet tassel-shaped flower heads.
- The Cacalia javanica grew as an annual in tropical Africa.
