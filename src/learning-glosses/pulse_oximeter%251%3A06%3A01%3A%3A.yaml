senseId: 'pulse_oximeter%1:06:01::'
synsetId: 92459552-n
simpleMeaning: A device that uses light to estimate blood oxygen saturation without drawing blood and
  to record a waveform showing changes in blood volume in the skin.
scope: A noninvasive monitor that estimates blood oxygen through the skin; not a blood test and not a
  treatment device.
examples:
- The nurse clipped a pulse oximeter to my finger to check my oxygen level.
- A pulse oximeter uses light to measure oxygen in the blood.
