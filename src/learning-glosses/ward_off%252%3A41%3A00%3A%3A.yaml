synsetId: 02458770-v
simpleMeaning: To stop something from happening, or to protect against something unwanted by keeping it
  away.
scope: Also called avoid, avert, deflect, obviate, debar, fend off, forefend, forfend, head off, and stave
  off. It is said of a person or a thing.
examples:
- They planted trees to ward off the wind.
- They took medicine to ward off a cold.
