simpleMeaning: A written order to a bank to pay money that the bank turns down when it is shown, because
  there is not enough money in the account.
scope: Bad cheque is another name for this one.
examples:
- They wrote a bad check, and the bank turned it down because there was not enough money in the account.
- The shop refused the bad check when the bank would not pay it.
