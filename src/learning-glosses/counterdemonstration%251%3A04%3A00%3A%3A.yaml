synsetId: 01180480-n
simpleMeaning: A public protest held to stand against another public protest.
scope: This one is the protest that answers the first one, not the first protest itself.
examples:
- Supporters of the president organized a counterdemonstration in his support.
- A counterdemonstration gathered outside the hall while the first protest went on inside.
