simpleMeaning: A Eurasian butterfly with brown wings marked with white.
scope: This butterfly of Europe and Asia is also called Limenitis camilla, and its brown wings with pale
  marks set it apart from the North American butterfly of the same name.
examples:
- A white admiral settled on the path, its brown wings opening and closing.
- We saw a white admiral among the trees in the French woods.
