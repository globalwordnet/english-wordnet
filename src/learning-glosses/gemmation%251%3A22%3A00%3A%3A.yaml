simpleMeaning: Reproduction with no mating, where a growth in one spot on the outside or inside of the
  parent turns into a new living thing of its own.
scope: Also called pullulation, this one is about a kind of reproduction.
examples:
- Gemmation lets the organism make new life without mating.
- In gemmation, a bud on the parent grows into a new individual.
