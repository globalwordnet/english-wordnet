simpleMeaning: Shaped like an arrow head, this leaf has a plain base with no lobes spreading out.
scope: This shape of leaf is also called arrow-shaped and sagittate.
examples:
- A sagittiform leaf has a plain base and a pointed tip.
- The sagittiform leaf tapered to a point at its tip.
