senseId: 'apatetic_coloration%1:07:00::'
synsetId: 04986452-n
simpleMeaning: The shades on an animal's own body that hide it by blending in with what is around it.
scope: This one is not about shades put on by a person to hide something.
examples:
- The moth's apatetic coloration lets it rest unseen on the bark.
- They could hardly spot the apatetic coloration of the lizard against the leaves.
