simpleMeaning: A way of living, or a place, that leaves a person almost no freedom, as if they were shut
  in.
scope: Also called prison. It is not a real place where people are locked up as a punishment.
examples:
- Their prison house was a job they could never leave.
- The small town felt like a prison house to them.
