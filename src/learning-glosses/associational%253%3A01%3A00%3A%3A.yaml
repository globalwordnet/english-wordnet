simpleMeaning: To do with groups of people joined for a shared purpose, or with the idea that one thought
  brings another to mind.
scope: This one is about groups of people or about an idea, not about one person alone.
examples:
- The associational life of the town centred on its clubs and societies.
- Their associational theory held that every thought calls up another.
