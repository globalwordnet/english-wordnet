schema: oewn-learning-gloss-v2
senseId: 'tying_arrangement%1:10:01::'
synsetId: 92438500-n
simpleMeaning: The buyer cannot get the one thing they want unless they also buy a second thing, one that
  usually has nothing to do with it.
scope: This word is for a sale that forces a second purchase, not for a sale in which the buyer may buy
  only the one thing they want.
examples:
- Under the tying arrangement, they could buy the machine only if they also bought the spare parts.
- They agreed to the tying arrangement and bought the case as well as the phone.
