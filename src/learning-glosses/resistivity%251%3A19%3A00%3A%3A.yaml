simpleMeaning: A material’s opposition to the flow of electric current. Its unit is the ohm-metre.
scope: This is a number in ohms for a material, also called resistance, electric resistance, electrical
  resistance, impedance, and ohmic resistance.
examples:
- The resistivity of the wire was written down in ohms.
- They measured the resistivity of the material in ohms.
