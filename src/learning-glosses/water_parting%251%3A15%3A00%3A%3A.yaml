simpleMeaning: A ridge that separates two river systems, with water on each side flowing toward a different
  system.
scope: Also called divide and watershed. It is a ridge of land.
examples:
- The water parting runs along the top of the hills.
- Rain that falls on the water parting runs to one river or the other.
