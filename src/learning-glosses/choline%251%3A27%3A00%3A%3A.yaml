simpleMeaning: An essential nutrient related to the B vitamins. It is part of lecithin and helps the body
  process fats.
scope: A B vitamin that is part of lecithin and that the body needs to use fat; not a vitamin taken only
  in pills and not a fat itself.
examples:
- Eggs are rich in choline.
- The body needs choline to use fat well.
