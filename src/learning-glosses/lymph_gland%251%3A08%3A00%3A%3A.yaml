simpleMeaning: A small organ that serves as a source of lymph and of white blood cells called lymphocytes.
scope: A body part where the clear liquid and white cells that fight sickness come from, also called lymph
  node; not any body part and not the liquid itself.
examples:
- The doctor felt the lymph gland under his jaw.
- A swollen lymph gland can show the body is fighting sickness.
