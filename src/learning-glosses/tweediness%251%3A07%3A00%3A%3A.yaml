simpleMeaning: A cloth with this quality feels loose or rough.
scope: Also called coarseness and nubbiness, this name is for a quality of cloth, not for the homely outdoor
  look of people who wear tweeds.
examples:
- The tweediness of the coat made it feel rough in the hand.
- The tweediness of the jacket made it feel loose in the hand.
