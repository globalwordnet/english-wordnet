simpleMeaning: A person with this cannot tell apart sounds that are higher from sounds that are lower.
scope: This is also called tone deafness; it is about sounds, not about words.
examples:
- They have a tin ear and cannot tell one note from another.
- A tin ear kept them from hearing the difference.
