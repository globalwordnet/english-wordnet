simpleMeaning: A male servant employed as a personal attendant.
scope: Also called a man, a gentleman, a valet, and a gentleman's gentleman, this is a servant for one
  boss alone, not for a whole house.
examples:
- The valet de chambre waited on their employer through the whole evening.
- Jeeves served as Bertie Wooster's valet de chambre for years.
