simpleMeaning: A sudden burst of wild noise and confusion when people fall into disorder.
scope: Also called flutter, commotion, disruption, disturbance, kerfuffle, hoo-ha, hoo-hah, or hurly burly.
  It is a kind of outburst.
examples:
- The news set off a great to-do in the office.
- What a to-do the broken pipe caused in the hall!
