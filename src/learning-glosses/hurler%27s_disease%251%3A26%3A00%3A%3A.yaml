simpleMeaning: An inherited disorder in which two altered gene copies prevent normal breakdown of complex
  sugars. It can severely affect bone and cartilage growth and intellectual development.
scope: 'Also called dysostosis multiplex, gargoylism, lipochondrodystrophy, or Hurler''s syndrome: a sickness
  passed down in families, not a sickness caught from germs and not a bone break.'
examples:
- Hurler's disease runs in families.
- The child with Hurler's disease has slow learning.
