simpleMeaning: An expense left out of a budget or left unspecified, often referred to in the plural.
scope: Either an unbudgeted cost or an unspecified cost can fall under this heading.
examples:
- She kept some money aside for minor expenses that had been left out of the budget.
- The invoice grouped several unspecified costs under minor expenses.
