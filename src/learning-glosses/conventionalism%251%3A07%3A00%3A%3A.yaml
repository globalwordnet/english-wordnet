synsetId: 04808781-n
simpleMeaning: Holding to what is generally believed, because one follows accepted custom.
scope: Also called convention and conventionality; this one is about holding to accepted beliefs.
examples:
- The writer's conventionalism kept them from trying anything new.
- The conventionalism of the academy left no room for new ideas.
