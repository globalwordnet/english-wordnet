simpleMeaning: Often tamed by people, this Asian buffalo pulls loads for them.
scope: Also called a water buffalo, an Asiatic buffalo, or Bubalus bubalis, this Asian buffalo is often
  tamed by people, not left to live wild.
examples:
- They yoked the water ox to the cart and set off for the fields.
- The farmer kept a water ox to pull the plough.
