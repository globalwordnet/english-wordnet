simpleMeaning: The four measures that mark place and moment, three for where a thing sits and one for
  when it is, holding every physical event in its place and moment.
scope: Also called space-time and space-time continuum. It is a set.
examples:
- The scientist marked the crash in spacetime by its place and its moment.
- In spacetime, the rocket's path is a line through place and moment.
