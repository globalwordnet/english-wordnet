simpleMeaning: A group of facts or numbers put in order, each one in its own line across and its own line
  down.
scope: Also called a table. It is not a piece of furniture with a flat top.
examples:
- The tabular array showed the sales for each month.
- The clerk read the numbers from the tabular array.
