simpleMeaning: Tiredness so deep that the mind thinks less clearly and less keenly.
scope: It is also called brain-fag.
examples:
- After three nights without sleep, the mental exhaustion made every simple sum hard.
- The mental exhaustion of the long exam left the students unable to focus.
