synsetId: 00093820-r
simpleMeaning: In a way that is sad and bad, so that people wish it had not happened.
scope: This one is also called sadly, woefully, and lamentably.
examples:
- The house was deplorably cold, with no heat in any room.
- The work was done deplorably, and much of it had to be done again.
