senseId: 'uncommonness%1:07:00::'
synsetId: 04804195-n
simpleMeaning: Because a thing is rare and hardly ever met with, it stands out.
scope: This word is used when a thing draws notice because it is rare and seldom encountered, not because
  it is finer than others.
examples:
- The uncommonness of the flower drew them to look at it.
- They spoke of the uncommonness of snow.
