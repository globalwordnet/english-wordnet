simpleMeaning: A group of people who hear the evidence in a civil or criminal trial and decide the facts
  of the case.
scope: Also called a petit jury or trial jury. The number of members can vary.
examples:
- The petty jury listened to the facts for three days before giving its decision.
- A petty jury of twelve decided the case after hearing both sides.
