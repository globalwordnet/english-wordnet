simpleMeaning: A group of twelve people who hear the facts of a case and give a decision in court, whether
  the case is about a crime or a private dispute.
scope: Also called a petit jury. It is a group of people.
examples:
- The petty jury listened to the facts for three days before giving its decision.
- A petty jury of twelve decided the case after hearing both sides.
