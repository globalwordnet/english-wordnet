simpleMeaning: A vein that drains into the great saphenous vein, a long vein close to the skin of the
  leg.
scope: Also called superficial epigastric vein. It is a kind of tube.
examples:
- The vena epigastrica superficialis empties into the long blood vessel just under the skin of the leg.
- A vena epigastrica superficialis joins the blood vessel under the skin of the leg.
