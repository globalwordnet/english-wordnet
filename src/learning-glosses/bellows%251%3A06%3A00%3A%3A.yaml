simpleMeaning: A device that blows a strong stream of air to make a fire burn more fiercely or to sound
  a musical instrument. The word usually takes a plural form.
scope: A tool for blowing a strong blast of air, not a fan and not a pump.
examples:
- He worked the bellows until the fire roared.
- The organ bellows filled the pipes with air.
