simpleMeaning: Of a leaf shape, having ends that are round and a middle that is pinched in.
scope: Also called fiddle-shaped or panduriform. It is an adjective.
examples:
- They pointed out the pandurate leaf among the round ones.
- A pandurate leaf looks like a violin in shape.
