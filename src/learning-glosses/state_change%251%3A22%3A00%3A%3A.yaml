senseId: 'state_change%1:22:00::'
synsetId: 13557219-n
simpleMeaning: A shift from one form, solid or liquid or gas, to another, while what it is made of stays
  the same.
scope: Also called phase change, phase transition, and physical change. It is a shift.
examples:
- When water freezes, it is a state change from liquid to solid.
- Boiling is a state change from liquid to gas.
