simpleMeaning: To put out a flame, fire, or light by blowing on it.
scope: This one names the same act as extinguish and quench, and it also goes by snuff out, not the other
  sense of this word, which is about sudden bursting.
examples:
- The candles were blown out one by one as the room grew dark.
- The wind blew out the lantern on the porch.
