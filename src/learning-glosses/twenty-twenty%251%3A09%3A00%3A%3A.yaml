simpleMeaning: Standard visual sharpness, meaning that at 20 feet a person can see the detail someone
  with typical distance vision sees at 20 feet.
scope: Also called 20/20, this name is for normal sight.
examples:
- The eye test showed they had twenty-twenty.
- The chart at 20 feet was clear to them, and they had twenty-twenty.
