simpleMeaning: Describing something already cut up into sections or kinds, with each part on its own.
scope: Compartmental and compartmentalized are other names for this thing.
examples:
- The compartmentalised report kept each subject in its own section.
- After the change, the office was compartmentalised into teams for each kind of work.
