senseId: 'synthesiser%1:18:00::'
synsetId: 10706727-n
simpleMeaning: A thinker who joins separate things into a new whole, or who works by joining things in
  that way.
scope: Also called synthesist and synthesizer. It is a person, not a machine.
examples:
- The synthesiser showed how old ideas could join to form a new plan.
- The synthesiser worked with ideas from many fields to build one clear view.
