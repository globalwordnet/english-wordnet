simpleMeaning: A container for drinking with a bar inside the rim, made to keep the hair above a man's
  upper lip out of the drink.
scope: It is also called mustache cup.
examples:
- The man drank his tea from a moustache cup.
- He lifted the moustache cup and drank without getting the hair above his lip wet.
