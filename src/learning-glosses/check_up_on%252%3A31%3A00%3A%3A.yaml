simpleMeaning: To look closely at a person or thing to see how it is doing, and whether it is right, well
  done, or in a good state.
scope: This one is also called check, check into, check out, check over, go over, look into, and suss
  out.
examples:
- The nurse checked up on the patient twice during the night.
- I checked up on the delivery to see if it had arrived.
