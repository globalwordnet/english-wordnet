simpleMeaning: A fortune-teller who claims to read someone's future from the lines on their palms.
scope: Also called chiromancer and palmister. It is a person.
examples:
- The palmist looked at the lines on their hand and spoke about the future.
- They went to a palmist to hear what the lines on their hands might mean.
