simpleMeaning: A unit of processor speed equal to a million instructions carried out per second by a computer's
  central processor alone.
scope: 'Also called million instructions per second: in computer science, a measure of how fast the central
  processor runs, not of the whole machine.'
examples:
- This old machine runs at 4 MIPS.
- MIPS counts how fast the processor works.
