simpleMeaning: A brand of nystatin, an antifungal antibiotic discovered in New York State and also sold
  as Nystan. It comes from soil bacteria called actinomycetes.
scope: This is a drug that fights fungus and germs and comes from soil fungi, also called nystatin and
  Nystan.
examples:
- Mycostatin fights fungus and germs.
- Doctors use Mycostatin against skin fungus.
