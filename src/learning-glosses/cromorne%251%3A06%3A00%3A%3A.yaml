simpleMeaning: A Renaissance wind instrument with a curved tube and a double reed, made of two thin blades
  that vibrate together.
scope: This wind instrument from the Renaissance is also called a crumhorn or a krummhorn, and it has
  two reeds and a tube that bends like a crooked horn.
examples:
- The cromorne sounded soft and low in the old music.
- She played a cromorne in the Renaissance band.
