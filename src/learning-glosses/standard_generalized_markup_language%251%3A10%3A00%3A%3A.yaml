simpleMeaning: A standardized language for describing document structure, with rules for defining and
  using sets of markup tags.
scope: In computer science, this set of rules lets any set of labels be used for adding labels to writings,
  not one fixed set.
examples:
- The papers were written in standard generalized markup language.
- Writers use standard generalized markup language to pick any set of labels.
