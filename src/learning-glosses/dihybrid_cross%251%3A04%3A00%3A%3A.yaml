simpleMeaning: A genetic cross that follows two traits, each controlled by a gene with two forms.
scope: This is not a mating that uses only one trait.
examples:
- The dihybrid cross in the class showed how two traits pass to the young.
- They set up a dihybrid cross with peas that differ in seed shape and colour.
