simpleMeaning: Said of something that shows no blur from the way light bends at its edges, or has had
  that blur put right.
scope: This is not about something that still shows a blur from the way light bends at its edges.
examples:
- The aplanatic mirror gave a sharp image with no blur at the edges.
- They chose an aplanatic lens for the telescope because the old one blurred the stars.
