simpleMeaning: In psychology, the unease that pressure on the mind builds up in a person.
scope: Also called strain and mental strain. It is a state of the mind, not a pull on the body.
examples:
- Nervous strain made it hard for them to sleep.
- The nervous strain of the long wait showed in their hands.
