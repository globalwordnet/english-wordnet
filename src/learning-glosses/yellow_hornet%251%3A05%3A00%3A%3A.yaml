simpleMeaning: A small hornet that lives in groups and often makes its nest in the ground, marked with
  gold.
scope: Also called yellow jacket and Vespula maculifrons, this one lives in groups, not on its own.
examples:
- A yellow hornet flew out of the nest in the ground and circled the garden.
- They saw a yellow hornet with gold marks on its body near the fence.
