simpleMeaning: A mountain and Arctic lichen with flat, branching, partly upright growth. It has been used
  as food and medicine for people and livestock and as a source of glycerol.
scope: A mountain lichen used as food and medicine, also called Iceland lichen and Cetraria islandica;
  not a true moss.
examples:
- Iceland moss carpets the Arctic rocks.
- Reindeer eat Iceland moss in winter.
