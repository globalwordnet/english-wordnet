simpleMeaning: A clutch that transmits turning force through friction and allows its parts to slide against
  each other when the force becomes too great.
scope: This device is also called a slip clutch, and it keeps its hold by rubbing alone.
examples:
- They fitted a slip friction clutch to the machine.
- The slip friction clutch gave way when the load grew too great.
