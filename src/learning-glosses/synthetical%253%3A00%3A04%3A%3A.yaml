senseId: 'synthetical%3:00:04::'
synsetId: 00111940-a
simpleMeaning: Of a statement whose truth or falsity can only be settled by watching the world and checking
  what is so.
scope: Also called synthetic. It is about a claim, not about putting things together.
examples:
- The claim that all swans are white is a synthetical claim, since only looking at swans can settle it.
- 'The statement that the road is closed is synthetical: you can only know it by going to see.'
