simpleMeaning: A Eurasian lily with drooping, purple- or maroon-checkered flowers on pale backgrounds,
  shaped like bells carried by people with leprosy in medieval times. It is widely grown in gardens.
scope: This is a meadow flower named for its bud's shape, not an actual snake.
examples:
- Snake's head fritillaries were scattered across the wet meadow.
- The snake's head fritillary is easy to recognize by its nodding, patterned bells.
