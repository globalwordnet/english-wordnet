simpleMeaning: Describing a life lived alone, apart from other people, with few comforts and strict self-denial.
scope: This word is also called anchoritic, eremitic, eremitical, or hermitic.
examples:
- After years in the city, they chose a hermitical life in a small hut far from the village.
- The hermitical routine left little room for guests or talk.
