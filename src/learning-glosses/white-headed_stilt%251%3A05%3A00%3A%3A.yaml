simpleMeaning: A stilt from the southwestern Pacific, including Australia and New Zealand, with mostly
  white feathers, black wings, and black feathers on the back of its neck.
scope: This wader of the southwest Pacific, including Australia and New Zealand, has mostly pale feathers
  but black wings and a black back of the neck.
examples:
- The white-headed stilt has mostly pale feathers and black wings.
- White-headed stilts live in Australia and New Zealand.
