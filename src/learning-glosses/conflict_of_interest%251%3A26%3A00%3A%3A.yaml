simpleMeaning: A clash between an official's work for the public and what is good for them, shaping the
  official's choices.
scope: This one is about a public official.
examples:
- The mayor stepped aside from the vote because of a conflict of interest.
- The new rules ask every official to declare any conflict of interest before a vote.
