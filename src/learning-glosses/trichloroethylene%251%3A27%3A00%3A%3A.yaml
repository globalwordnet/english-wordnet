simpleMeaning: A dense, colorless, highly toxic liquid used as a solvent for cleaning electronics and
  clothes and as a fumigant. It causes cancer and can damage the liver and lungs.
scope: This sense is also called trichloroethane.
examples:
- Trichloroethylene washes wire parts.
- A trichloroethylene harms the lungs.
