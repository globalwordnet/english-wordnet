simpleMeaning: Something that puts an end to fungi, or stops them growing.
scope: Also called antifungal, antifungal agent, antimycotic agent, and fungicide, this one is not something
  that lets fungi grow.
examples:
- The antimycotic cleared the mould from the skin.
- They applied the antimycotic to stop the fungi spreading.
