senseId: 'verboseness%1:10:00::'
synsetId: 07103943-n
simpleMeaning: A style of speaking or writing that uses far too many words, or words that say nothing.
scope: Also called verbosity. It is a style, not a single word.
examples:
- The speech was full of verboseness and said very little.
- They cut the verboseness from the report and kept only the facts.
