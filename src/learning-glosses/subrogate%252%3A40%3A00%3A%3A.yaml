simpleMeaning: A firm that paid out after an accident takes over the claim of the person owed money and
  sues the one who caused it.
scope: This names a firm's move to take over a claim after paying out.
examples:
- The firm subrogated its claim after paying for the crash.
- Once it had paid out, the firm could subrogate the claim.
