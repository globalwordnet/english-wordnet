simpleMeaning: Zirconium, a strong, shiny gray metal resembling titanium. It is used in nuclear reactors
  because it absorbs few neutrons and occurs in baddeleyite but comes chiefly from zircon.
scope: Also called zirconium and Zr; a bright grey strong metal like titanium, not a soft metal.
