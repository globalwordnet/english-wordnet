simpleMeaning: Simple organisms that mostly live in water and contain chlorophyll. Their cells have nuclei,
  and they lack true stems, roots, and leaves.
scope: Also called algae, simple living things, mostly in water, with no true stems, roots, or leaves.
examples:
- The pond was green with alga after the warm week.
- Alga grows on the rocks where the stream runs slow.
