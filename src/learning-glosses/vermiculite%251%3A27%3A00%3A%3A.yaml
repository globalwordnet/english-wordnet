simpleMeaning: Any one of this group of minerals is yellow or brown, holds water, is made of silicon and
  oxygen, and peels apart in thin sheets.
scope: This is a mineral of one group, not one kind alone.
examples:
- They mixed vermiculite into the soil to hold water for the plants.
- The vermiculite in the sample was yellow and came off in thin sheets.
