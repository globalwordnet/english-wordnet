simpleMeaning: The most widely spoken modern Indo-Aryan language, used mainly in northern India. Hindi
  and English serve as official languages of India’s central government. Hindi usually uses the Devanagari
  script.
scope: 'Also called Hindi: the most widely spoken of the new Indian tongues, a main official tongue of
  India with English, not a dead tongue and not a tongue of south India.'
examples:
- The Hindi language is a main official tongue of India.
- He learned the Hindi language at school.
