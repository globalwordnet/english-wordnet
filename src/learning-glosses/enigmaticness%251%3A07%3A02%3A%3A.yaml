senseId: 'enigmaticness%1:07:02::'
synsetId: 92418480-n
simpleMeaning: The quality in a person of being hard to read, secretive, or at odds with oneself.
scope: This one is said of a person's character, and not of a thing that is hard to explain.
examples:
- She conveys Jesus's magnetism and charm, as well as how his enigmaticness must have stymied those closest
  to him.
- Their enigmaticness kept everyone guessing.
