simpleMeaning: Gold, a soft, yellow, ductile, malleable metal with valences one and three. Nuggets occur
  in rock and river deposits. It resists most chemicals except chlorine and aqua regia.
scope: Not other yellow metals, nor other soft metals; also called gold and Au.
examples:
- Atomic number 79 is gold.
- The element with atomic number 79 does not rust.
