senseId: 'dilation_and_curettage%1:04:00::'
synsetId: 00671493-n
simpleMeaning: An operation to widen the cervix and scrape the womb lining, usually under local anesthesia,
  to sample tissue, stop prolonged bleeding, remove small growths or remaining placenta, or end pregnancy.
scope: This is the womb-scraping operation, not an imaging test or removal of the whole womb; 'dilatation
  and curettage' names the same procedure.
examples:
- A dilation and curettage was scheduled for the following morning.
- The tissue was removed by dilation and curettage.
