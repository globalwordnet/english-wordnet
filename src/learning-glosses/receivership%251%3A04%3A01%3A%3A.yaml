senseId: 'receivership%1:04:01::'
synsetId: 01189068-n
simpleMeaning: A court step that hands property to a person the court puts in charge during a case, so
  it is kept safe for the good of all.
scope: It is a court step, not the job of the person in charge or the state of property in their hands.
examples:
- The court put the firm in receivership to keep its property safe while the case was fought.
- The judge ordered a receivership so the firm's goods would be kept safe for all.
