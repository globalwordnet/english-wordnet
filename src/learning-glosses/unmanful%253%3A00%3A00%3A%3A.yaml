simpleMeaning: Said of a male who shows none of the courage and firmness people look for in a male.
scope: Also called unmanly or unmanlike. It is a word for a male.
examples:
- The unmanful leader gave up at the first sign of trouble.
- No one called the unmanful soldier a coward out loud.
