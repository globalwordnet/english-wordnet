senseId: 'variorum_edition%1:10:00::'
synsetId: 06603004-n
simpleMeaning: In this edition, a work appears in more than one wording, or with notes from different
  learned people and editors.
scope: A variorum is another name for this book, not a book that prints one wording only.
examples:
- They read the play in a variorum edition that sets out each wording in turn.
- The variorum edition adds notes from the scholars who worked on the text.
