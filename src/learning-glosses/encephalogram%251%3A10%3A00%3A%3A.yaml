simpleMeaning: A chart of the power in the brain, traced out by a machine that reads the brain.
scope: This one is also called electroencephalogram and EEG, and it is not a picture made with X rays.
examples:
- The doctor studied the encephalogram to see how the brain was working.
- An encephalogram can show whether the brain is active during sleep.
