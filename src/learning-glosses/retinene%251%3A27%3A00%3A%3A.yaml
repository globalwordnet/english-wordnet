simpleMeaning: Either of two yellow to red colouring substances in the eye, formed from a light-sensitive
  substance when light acts on it.
scope: Also called retinal. It is a substance in the eye.
examples:
- Light turns rhodopsin into retinene in the eye.
- Retinene forms in the eye when light acts on rhodopsin.
