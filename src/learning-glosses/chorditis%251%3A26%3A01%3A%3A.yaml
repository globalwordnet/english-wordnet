simpleMeaning: Inflammation of the spermatic cord, which runs to a testicle, or of the vocal cords in
  the throat.
scope: This is a swelling and soreness of the cord that carries seed, or of the cords in the throat that
  make the voice.
examples:
- Chorditis left him with a sore throat.
- The singer rested her voice because of chorditis.
