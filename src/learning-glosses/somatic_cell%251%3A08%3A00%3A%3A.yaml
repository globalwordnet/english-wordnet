simpleMeaning: A body cell in a plant or animal, distinct from reproductive cells and those that produce
  eggs or sperm.
scope: Also called vegetative cell. It is not a reproductive part.
examples:
- Somatic cells are produced from preexisting cells.
- Somatic cells make up most of the skin.
