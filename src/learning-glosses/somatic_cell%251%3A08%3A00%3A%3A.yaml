senseId: 'somatic_cell%1:08:00::'
synsetId: 05438205-n
simpleMeaning: Any tiny part of a plant or animal that is not one of the parts that make young, and that
  takes no part in making those parts.
scope: Also called vegetative cell. It is not a reproductive part.
examples:
- Somatic cells are produced from preexisting cells.
- Somatic cells make up most of the skin.
