simpleMeaning: A living thing, above all a germ, that can live without air or free oxygen.
scope: A living thing that needs no air to live, not one that must have air to stay alive.
examples:
- The anaerobe grew well in the sealed jar with no air inside.
- Scientists found the anaerobe in mud at the bottom of the pond.
