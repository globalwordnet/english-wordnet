synsetId: 00861689-n
simpleMeaning: A change in the electrical properties of the skin during stress or anxiety, measured by
  recording either skin resistance or weak currents produced by the body.
scope: This sense is also called electrodermal response, galvanic skin response, and psychogalvanic response.
examples:
- The electrical skin response shifts under stress.
- They log the electrical skin response.
