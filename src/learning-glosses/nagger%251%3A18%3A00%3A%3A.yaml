simpleMeaning: A person who annoys others by always pointing out what is wrong, above all a woman.
scope: It is also called nag, common scold, scolder, and scold.
examples:
- The nagger complained about the noise, the food, and the service all evening.
- They are such a nagger that no one wants to sit near them at dinner.
