senseId: 'anamorphic%3:01:01::'
synsetId: 02631280-a
simpleMeaning: To do with a lens setup that bends light and changes the shape of the picture.
scope: This is the lens sense of the word, not the sense about slow change from one kind of living thing
  to another.
examples:
- The film used an anamorphic lens to squeeze a wide scene onto a narrow strip of film.
- Through the anamorphic lens, the round face on the poster looked tall and thin.
