simpleMeaning: A piece of iron with holes and cuts in it, used to hold metal while it is shaped cold.
scope: It is not for building walls.
examples:
- The smith set the cold bar in the swage block and struck it with a hammer.
- A swage block has holes of many shapes for holding metal still.
