simpleMeaning: To act with great force to show that one is unhappy or to object to something.
scope: It is also called 'make a stink' or 'raise hell'.
examples:
- When the council cut the bus service, residents raised a stink at the meeting.
- The fans raised a stink over the cancelled match.
