simpleMeaning: Bromine, a heavy, dark brown liquid halogen found in seawater. This nonmetallic element
  evaporates easily and can eat away at materials.
scope: This is the dark heavy liquid that gives off fumes, not the pale metal or the gas with no color,
  and it is also called bromine and atomic number 35.
examples:
- Br is a dark liquid that gives off fumes.
- The bottle held Br from sea water.
