simpleMeaning: Ready in a shop in set sizes, not shaped to fit one person, for clothes above all.
scope: Also called off-the-peg, off-the-rack, or ready-to-wear. It is an adjective.
examples:
- They bought an off-the-shelf suit instead of having one made.
- The shop had off-the-shelf coats in every size.
