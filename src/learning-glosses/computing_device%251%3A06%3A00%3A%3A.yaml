simpleMeaning: A tool that works out numbers by itself, with no person doing the sums.
scope: Computing machine, computer, data processor, electronic computer, and information processing system
  are other names for this.
examples:
- This computing device can add up long lists of numbers in seconds.
- The computing device on the desk runs the whole shop's accounts.
