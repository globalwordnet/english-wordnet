simpleMeaning: At the knee, or lower down, the leg bends away from its pair.
scope: This is also called a bandy leg, a bandyleg, a bow leg, a bowleg, or genu varum, a leg bent outward
  at the knee rather than inward.
examples:
- They had tibia vara, and their legs bent outward at the knees.
- The tibia vara in one leg bent outward just below the knee.
