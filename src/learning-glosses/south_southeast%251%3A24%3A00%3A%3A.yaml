simpleMeaning: A compass point at 157.5 degrees, a little past straight down on the way toward where the
  sun rises.
scope: Also called sou'-sou'-east and SSE. It is a point.
examples:
- The wind blew from the south southeast all afternoon.
- They sailed toward the south southeast.
