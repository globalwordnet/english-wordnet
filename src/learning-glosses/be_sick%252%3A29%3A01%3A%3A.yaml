simpleMeaning: To vomit, bringing the contents of the stomach up through the mouth.
scope: Also called sick, cat, cast, vomit, puke, chuck, purge, retch, honk, spew, barf, disgorge, regurgitate,
  upchuck, regorge, spue, throw up, and vomit up, this one names an action of the stomach.
examples:
- After drinking too much, the students were sick.
- They were sick all night after the bad meal.
