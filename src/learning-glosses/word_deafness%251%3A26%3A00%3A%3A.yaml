simpleMeaning: Trouble making sense of speech that is not caused by a loss of hearing.
scope: Also called acoustic aphasia and auditory aphasia. It is a condition, not a loss of hearing.
examples:
- They have word deafness, so they hear the talk but cannot tell what it means.
- Word deafness made it hard for them to follow a talk.
