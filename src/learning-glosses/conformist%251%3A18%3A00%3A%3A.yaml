simpleMeaning: A person who follows the set ways of behaving, most of all in matters of faith.
scope: It is about a person. It is not the adjective for a thing that holds to the usual beliefs.
examples:
- The conformist kept the church rules for many years.
- They were conformists who followed every rule.
