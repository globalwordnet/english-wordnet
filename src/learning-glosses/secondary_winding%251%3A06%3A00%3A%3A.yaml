senseId: 'secondary_winding%1:06:00::'
synsetId: 04171063-n
simpleMeaning: Once power runs through a first set of turns, this set of turns picks up power of its own.
scope: Secondary and the secondary coil are other names for this set of turns, which picks up power from
  a first set and not the other way round.
examples:
- Power appeared in the secondary winding when the first turns were switched on.
- Power flowed in the secondary winding only when the first turns were switched on.
