simpleMeaning: A seven-line stanza written in iambic pentameter, with five pairs of unstressed and stressed
  syllables per line. Chaucer introduced it into English poetry.
scope: One of the verse forms with a set shape, this one of seven lines with five beats each, first used
  by Chaucer.
examples:
- The poem was written in rhyme royal.
- Chaucer wrote in rhyme royal.
