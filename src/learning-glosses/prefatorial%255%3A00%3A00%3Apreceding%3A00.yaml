simpleMeaning: Serving to open a book or other work, as the part that comes first and leads into the rest.
scope: Also called introductory or prefatory, it is said of a part of a work.
examples:
- The prefatorial note thanks the people who helped with the book.
- They wrote a short prefatorial piece to lead readers into the story.
