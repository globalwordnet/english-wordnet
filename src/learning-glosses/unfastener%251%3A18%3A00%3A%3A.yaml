simpleMeaning: A person who undoes the joins that hold a thing shut, takes off its wrapping, or gets it
  open.
scope: Opener, undoer, and untier are other names for it.
examples:
- Every morning they were the unfastener of the shop's heavy shutters.
- They acted as unfastener of the parcels, cutting the string and peeling back the paper.
