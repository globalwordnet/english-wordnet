simpleMeaning: An extinct elephant-like mammal that thrived worldwide from the Miocene through the Pleistocene
  and had back teeth shaped differently from a mammoth's.
scope: A great beast like an elephant, now gone from the earth, also called mastodont.
examples:
- The mastodon roamed the forests long before people came.
- Mastodon teeth found in the bog were unlike a mammoth's.
