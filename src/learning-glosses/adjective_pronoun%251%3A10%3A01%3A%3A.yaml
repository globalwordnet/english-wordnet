synsetId: 92463531-n
simpleMeaning: A pronoun used to modify a noun, such as 'which' in 'Which dictionaries do you use?'
scope: This one is not an ordinary stand-in for a noun.
examples:
- In 'which book?', 'which' is an adjective pronoun, since it both points to a book and describes it.
- They used 'this' as an adjective pronoun before the noun.
