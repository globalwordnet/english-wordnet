simpleMeaning: A space of vectors with a way to measure lengths and angles, in which every Cauchy sequence
  has a limit within the space. It often has infinitely many dimensions.
scope: In maths, a set of points you can add and scale, with a way to measure gaps; it is a maths idea,
  not a place in the world.
examples:
- A Hilbert space is a set of points with a way to measure gaps.
- In a Hilbert space, every limit point stays inside the set.
