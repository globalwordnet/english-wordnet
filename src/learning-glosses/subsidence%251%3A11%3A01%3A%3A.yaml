senseId: 'subsidence%1:11:01::'
synsetId: 07376016-n
simpleMeaning: A hollow opens below, and something falls into it all at once.
scope: This sense is also called cave in, and it is a sudden fall into a hollow, not a lessening of something
  such as a disease.
examples:
- The ground gave way in a sudden subsidence.
- The subsidence took the road down into the hollow.
