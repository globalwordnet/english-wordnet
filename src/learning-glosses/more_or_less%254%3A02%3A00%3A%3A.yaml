simpleMeaning: Approximately, when an amount or quantity is fairly close to the correct figure.
scope: It is also called about, some, around, roughly, approximately, close to, just about, or so.
examples:
- The tank holds 3 gallons, more or less.
- The job took two hours, more or less.
