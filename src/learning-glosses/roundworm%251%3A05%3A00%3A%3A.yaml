simpleMeaning: A worm with a long, unsegmented, round body pointed at both ends. Most live independently,
  but some live as parasites.
scope: 'Also called a nematode or a nematode worm: a long thin creature with a smooth body that comes
  to a point at each end, not a flatworm and not an earthworm.'
examples:
- The vet found roundworms in the puppy.
- Roundworms can live inside animals or free in the soil.
