simpleMeaning: An amount with a size and a direction, got by adding two or more other such amounts together.
scope: Also called resultant. It is an amount, not one of the amounts added.
examples:
- The vector sum of the two forces pointed straight up.
- The teacher drew the vector sum on the board.
