simpleMeaning: Something that stands for putting money first in life, or for wanting far more money than
  one needs.
scope: This one is also called a dollar sign or a dollar, and it is not a $ written before a number.
examples:
- The dollar mark ruled their whole life, and nothing else seemed to matter.
- For them, the dollar mark stood for greed, not for need.
