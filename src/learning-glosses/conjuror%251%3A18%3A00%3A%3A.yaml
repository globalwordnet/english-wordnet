simpleMeaning: One who practises magic, called on to cure the sick or to do harm.
scope: Also called conjurer, this one is about a worker of magic of either sex, not one who does tricks
  to amuse.
examples:
- The conjuror was called to cure a sick child in the village.
- People trusted the conjuror to lift the curse from their house.
