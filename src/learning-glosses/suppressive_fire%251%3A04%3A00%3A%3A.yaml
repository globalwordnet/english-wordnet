simpleMeaning: Shots aimed at or near a weapon and all its gear, to wear down how well it works until
  it can no longer do its job.
scope: These are shots aimed at or near a weapon and all its gear, not the weapon itself.
examples:
- They laid down suppressive fire to wear down the weapon.
- Under suppressive fire, the weapon could no longer do its job.
