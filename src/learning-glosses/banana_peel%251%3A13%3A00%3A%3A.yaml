simpleMeaning: The skin of a banana, especially after someone has peeled it off and thrown it away.
scope: Also called a banana skin, this one is about the covering, not the fruit inside.
examples:
- They slipped on a banana peel and almost fell.
- They threw the banana peel in the bin after eating the fruit.
