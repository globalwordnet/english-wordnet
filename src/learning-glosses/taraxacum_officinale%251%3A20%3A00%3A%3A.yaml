simpleMeaning: A Eurasian dandelion that now grows widely as a weed in North America. Its leaves are eaten
  in salads, and the plant is used to make wine.
scope: 'Also called common dandelion and Taraxacum ruderalia: a plant from Europe and Asia grown wild
  in North America and used as salad leaves, not a dandelion grown for rubber.'
examples:
- Taraxacum officinale grows as a weed in the lawn.
- We picked Taraxacum officinale leaves for a salad.
