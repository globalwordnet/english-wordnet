simpleMeaning: A member of the Ho-Chunk people, historically based in eastern Wisconsin south of Green
  Bay. They were allies of the Menominee and opponents of the Fox and Sauk.
scope: One of the Siouan-speaking people of eastern Wisconsin, not the language they speak.
examples:
- The Winnebago lived south of Green Bay.
- A Winnebago elder told the story.
