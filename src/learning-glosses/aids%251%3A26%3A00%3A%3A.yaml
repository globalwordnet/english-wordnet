simpleMeaning: Advanced HIV disease that severely weakens immunity and can be fatal. HIV can spread through
  sexual contact, contaminated needles, or infected blood products.
scope: Also called acquired immune deficiency syndrome; a disease of the body's defence system, not a
  common cold or flu.
examples:
- He was diagnosed with AIDS in the 1980s.
- AIDS spreads through infected blood.
