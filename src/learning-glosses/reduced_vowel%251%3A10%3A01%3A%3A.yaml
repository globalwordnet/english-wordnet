senseId: 'reduced_vowel%1:10:01::'
synsetId: 92463296-n
simpleMeaning: A weaker sound made in the middle of the mouth, the form a fuller vowel takes when it loses
  its stress.
scope: This is the weak, middle-of-the-mouth form of a fuller speech sound, not the full sound spoken
  with stress.
examples:
- The reduced vowel in the word 'about' is a schwa.
- In 'sofa', the reduced vowel is the sound at the end.
