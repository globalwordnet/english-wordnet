senseId: 'sibilation%1:10:00::'
synsetId: 07143910-n
simpleMeaning: A sound that comes out with a hiss or a whistle in it, because of the way it is said.
scope: Assibilation is another name for this way of saying sounds with a hiss or whistle in them, not
  the hiss people make to show they do not like something.
examples:
- Her sibilation made every s sound hiss.
- The actor's sibilation gave each s a whistle.
