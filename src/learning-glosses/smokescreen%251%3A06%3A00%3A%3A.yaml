simpleMeaning: In war, troops hide what they are doing behind a thick cloud.
scope: Also called smoke screen, this thick cloud hides the moves of troops in war, not an action meant
  to conceal or confuse or obscure.
examples:
- A smokescreen rose over the field and hid the troops from view.
- The commander ordered a smokescreen to cover the advance.
