simpleMeaning: Its parts do not match, and its measures are not the same.
scope: Anisometric is another name for this, and it is not a thing whose parts all match.
examples:
- The unsymmetrical windows on the old house were all of different sizes.
- Their unsymmetrical smile rose higher on one side than on the other.
