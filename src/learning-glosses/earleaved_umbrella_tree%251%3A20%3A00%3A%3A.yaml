simpleMeaning: A small upright tree that sheds its leaves each year, with large leaves arranged in coils
  at the branch tips.
scope: A small upright plant with big leaves in coils at the ends of its branches, not a tall forest tree
  and not a shrub with small leaves.
examples:
- The earleaved umbrella tree stood alone in the clearing.
- Earleaved umbrella trees lose their leaves in autumn.
