senseId: 'analphabetic%3:01:00::'
synsetId: 02624852-a
simpleMeaning: Relating to or expressed in a writing system that uses a principle other than an alphabet,
  such as signs for syllables.
scope: This sense is about a way of writing, not about writing with letters.
examples:
- The old signs used an analphabetic script of marks and pictures, with no letters at all.
- Scholars study the analphabetic writing on the wall to learn how people sent messages without letters.
