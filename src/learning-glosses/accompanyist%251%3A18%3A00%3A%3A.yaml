simpleMeaning: A person who plays music along with the main singing or playing, most often on a piano.
scope: This one is also called accompanist, and it is a person, not the music itself.
examples:
- The accompanyist played softly while the singer sang the old song.
- They hired an accompanyist for the evening, and the piano sounded lovely behind the voices.
