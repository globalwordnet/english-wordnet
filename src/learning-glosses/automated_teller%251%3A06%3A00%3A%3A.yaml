simpleMeaning: A self-service bank machine that dispenses cash when a customer uses a bank card and personal
  code.
scope: Also called automated teller machine, automatic teller, automatic teller machine, cash dispenser,
  cash machine, and ATM, this one is a machine that gives out money.
examples:
- The automated teller outside the bank gave out cash when a card was put in.
- They stopped at an automated teller to take out money for the trip.
