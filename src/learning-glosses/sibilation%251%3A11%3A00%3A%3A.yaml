senseId: 'sibilation%1:11:00::'
synsetId: 07399498-n
simpleMeaning: A sound made as air escapes through a narrow space, above all to show that one does not
  like something.
scope: Also called hiss, hissing, fizzle, and hushing. It is a noun.
examples:
- The sibilation from the crowd grew louder as the speech went on.
- They answered the ruling with a long sibilation.
