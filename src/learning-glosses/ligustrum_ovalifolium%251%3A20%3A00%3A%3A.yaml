simpleMeaning: A Japanese shrub with foul-smelling flowers that keeps some leaves through winter. It is
  widely grown for hedges because it stays green more often than common privet.
scope: Also called California privet; this is the half-green shrub of Japan used for hedges, not the common
  privet.
examples:
- Ligustrum ovalifolium makes a good hedge.
- The Ligustrum ovalifolium flowers smell bad.
