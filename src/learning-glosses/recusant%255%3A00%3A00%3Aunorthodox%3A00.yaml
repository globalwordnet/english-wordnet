simpleMeaning: Used for a Catholic who stays away from Church of England services.
scope: This word is also called dissentient, and it is used for a Catholic who stays away from Church
  of England services, not for anyone who will not follow rules in general.
examples:
- The recusant families stayed away from the parish church.
- The recusant household kept its own ways of worship.
