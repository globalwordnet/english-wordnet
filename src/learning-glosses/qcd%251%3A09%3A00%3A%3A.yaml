simpleMeaning: Quantum chromodynamics explains the strong force, including the binding of protons and
  neutrons in nuclei. In this theory, gluons bind quarks together inside particles called hadrons.
scope: 'Also called quantum chromodynamics: a theory of the strong force between particles, including
  the force that holds protons and neutrons in the nucleus.'
examples:
- QCD explains how quarks are held together.
- Physicists use QCD to study the nucleus.
