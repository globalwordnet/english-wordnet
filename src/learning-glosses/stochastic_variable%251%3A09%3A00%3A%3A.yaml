simpleMeaning: A quantity whose value is set by chance rather than by a fixed rule.
scope: It is also called a variant, a chance variable, a random variable, or a variate.
examples:
- The stochastic variable in the model took a new value each time the test ran.
- They used a stochastic variable to stand for the daily rainfall.
