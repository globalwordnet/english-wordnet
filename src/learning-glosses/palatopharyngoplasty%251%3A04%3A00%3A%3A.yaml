simpleMeaning: Surgery to widen the airway by removing tissue from the roof of the mouth and throat. It
  aims to relieve severe snoring, with or without sleep apnea.
scope: This sense is also called uvulopalatopharyngoplasty, for a cutting away of spare mouth-roof and
  throat flesh to open the air road, meant to cure bad snoring, with or without sleep breath-stops.
examples:
- Palatopharyngoplasty opens the airway.
- Palatopharyngoplasty cures snoring.
