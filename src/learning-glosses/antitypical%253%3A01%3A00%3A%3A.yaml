senseId: 'antitypical%3:01:00::'
synsetId: 02641538-a
simpleMeaning: Said of someone or something that points ahead, as a symbol, to what is still to come.
scope: Also called antitypic, this word is used to describe something, not to name the person or thing
  itself.
examples:
- The antitypical image pointed forward to the event it stood for.
- They saw the antitypical dove as a sign of peace yet to come.
