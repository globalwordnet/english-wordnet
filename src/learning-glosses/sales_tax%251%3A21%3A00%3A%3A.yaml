simpleMeaning: A charge the buyer pays, worked out from what the thing bought costs.
scope: Also called nuisance tax, this charge falls on the buyer and rises with the price of the thing
  bought.
examples:
- The sales tax raised the price of the thing I bought.
- Buyers pay the sales tax when they buy the thing.
