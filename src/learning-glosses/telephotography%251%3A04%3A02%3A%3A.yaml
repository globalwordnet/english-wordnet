simpleMeaning: The sending from far away of photographs, charts, and pictures, which come out again here
  so you can see them.
scope: This is not the taking of pictures with a long lens.
examples:
- The office used telephotography to get charts sent from far away.
- With telephotography, pictures taken far away could be printed here for all to see.
