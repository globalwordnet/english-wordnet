synsetId: 00663742-v
simpleMeaning: To look through something from start to finish, to find out if it is correct, well put
  together, or in good order.
scope: This one is also called check, check into, check out, check up on, go over, look into, and suss
  out.
examples:
- I checked over the car before the trip and found a loose wire.
- The report was checked over twice before it was sent in.
