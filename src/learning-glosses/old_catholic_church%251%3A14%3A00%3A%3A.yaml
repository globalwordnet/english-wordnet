simpleMeaning: A group of Catholic churches independent of Rome, with roots in eighteenth-century Utrecht
  and in nineteenth-century opposition to papal infallibility.
scope: These churches have related histories and became independent at different times.
examples:
- The historian traced the Old Catholic Church in the Netherlands back to Utrecht.
- The lecture covered the nineteenth-century growth of the Old Catholic Church in Germany.
