simpleMeaning: The angle for which one divided by its sine equals a given number.
scope: Also called arccosecant and inverse cosecant, this one names the angle, not the number on its own.
examples:
- The teacher worked out the arc cosecant of two on the board.
- They used the arc cosecant to find the missing angle.
