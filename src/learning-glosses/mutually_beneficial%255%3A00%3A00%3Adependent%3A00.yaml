senseId: mutually_beneficial%5:00:00:dependent:00
synsetId: 00729889-s
simpleMeaning: Describing a relationship in which each side gains something from the other, here one in
  which they also depend on each other.
scope: In this sense the parties rely on the benefits they exchange. In broader use the phrase simply
  says that both sides gain.
examples:
- 'The fig tree and its pollinating wasp depend on their mutually beneficial relationship: one produces
  seeds and the other raises its young inside the figs.'
- The shops had a mutually beneficial arrangement. Each relied on customers sent by the other.
