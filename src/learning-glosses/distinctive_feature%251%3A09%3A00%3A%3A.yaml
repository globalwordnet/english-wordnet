simpleMeaning: A strange or uncommon mark that sets a thing apart from others like it.
scope: Also called peculiarity and distinguishing characteristic. This one is about a quality.
examples:
- The white stripe on the bird is a distinctive feature of that kind.
- A distinctive feature of the old house is its round tower.
