senseId: 'prokaryote%1:05:00::'
synsetId: 01418561-n
simpleMeaning: A single-celled organism without a membrane-bound nucleus. Bacteria are examples, including
  cyanobacteria, also called blue-green algae, as well as actinomycetes and mycoplasmas.
scope: Also called procaryote; a one-celled living thing without a nucleus, not a cell with its nucleus
  held in a skin.
examples:
- A prokaryote keeps its genetic material loose, with no nucleus.
- Blue-green algae are prokaryotes, like bacteria.
