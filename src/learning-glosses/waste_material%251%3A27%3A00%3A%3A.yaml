simpleMeaning: Any materials people do not use get thrown away because nobody wants them or finds them
  worth anything.
scope: This is also called waste, waste matter, or waste product, and it is not stuff that is still wanted.
examples:
- They put the waste material out for collection.
- Much of the waste material from the factory was carried off in the sewers.
