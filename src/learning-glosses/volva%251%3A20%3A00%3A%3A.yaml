simpleMeaning: A cup-shaped part that wraps round the foot of the stem of some mushrooms.
scope: It is found on some mushrooms, not on all of them.
examples:
- The volva at the foot of the mushroom stayed whole when the mushroom was picked.
- They cut the stem above the volva so the cup stayed in the ground.
