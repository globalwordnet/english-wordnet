simpleMeaning: Resting mostly on guessing, not on good proof.
scope: This one is also called supposed, hypothetical, conjectural, hypothetic, suppositional, suppositious,
  or supposititious, and it is about guessing, not about a prophet.
examples:
- The divinatory claim about the lost city rested on no real proof.
- The divinatory guess about the storm turned out wrong.
