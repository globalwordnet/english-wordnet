senseId: 'unreverberant%3:00:00::'
synsetId: 02018238-a
simpleMeaning: It sends no sound back, and sound does not ring on in it.
scope: Nonresonant is another name for this, and it is not a thing that sends sound back.
examples:
- The heavy curtains made the hall unreverberant, so every word died away at once.
- The new carpet left the room unreverberant, with no echo at all after a clap.
