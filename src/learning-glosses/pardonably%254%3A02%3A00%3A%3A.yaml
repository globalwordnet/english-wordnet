synsetId: 00334820-r
simpleMeaning: In a manner that can be let pass, or to an extent that can be let pass.
scope: Also called excusably or forgivably. It is a way of doing something.
examples:
- They arrived pardonably late because their bus broke down.
- They were pardonably angry when the show was called off.
