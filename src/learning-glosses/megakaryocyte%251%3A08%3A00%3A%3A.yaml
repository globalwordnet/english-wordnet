simpleMeaning: A large bone marrow cell that produces platelets, the small blood components that help
  form clots.
scope: This is a big cell from the soft stuff inside bones, not a red blood cell and not a white blood
  cell.
examples:
- The megakaryocyte in the sample was much larger than the other cells.
- Megakaryocytes in the bone marrow make the platelets that help blood clot.
