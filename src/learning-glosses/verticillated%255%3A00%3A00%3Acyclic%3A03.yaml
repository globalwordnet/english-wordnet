senseId: verticillated%5:00:00:cyclic:03
synsetId: 00680988-s
simpleMeaning: Arranged in one or more rings around a central point, especially leaves growing from the
  same level around a stem.
scope: Also called whorled and verticillate, this word describes rings around a stem, not leaves set one
  by one along it.
examples:
- The verticillated leaves stood out in rings around the tall stem.
- Each verticillated ring of leaves circled the stem at one height.
