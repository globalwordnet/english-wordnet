simpleMeaning: The ratio of stress to strain in a material that returns to its original shape when the
  force is removed.
scope: This one is also called coefficient of elasticity and modulus of elasticity.
examples:
- The elastic modulus of the steel beam was listed in the data sheet.
- Engineers use the elastic modulus to work out how much a beam will bend.
