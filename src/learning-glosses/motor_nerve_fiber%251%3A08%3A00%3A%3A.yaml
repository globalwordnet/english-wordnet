simpleMeaning: The long extension of a motor nerve cell that carries signals to a muscle.
scope: A motor nerve fiber is the axon of a motor neuron.
examples:
- A motor nerve fiber carries signals from the spinal cord to a leg muscle.
- Damage to a motor nerve fiber can weaken the arm.
