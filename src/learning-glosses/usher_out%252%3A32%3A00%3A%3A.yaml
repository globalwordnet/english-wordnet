senseId: 'usher_out%2:32:00::'
synsetId: 00902491-v
simpleMeaning: After you have met with someone, you send them away, or let them leave, and your time together
  is over.
scope: This end of an encounter is also called dismiss, when the person is made or allowed to leave.
examples:
- They ushered the visitor out once the meeting was over.
- The host ushered the guest out when the guest asked to go.
