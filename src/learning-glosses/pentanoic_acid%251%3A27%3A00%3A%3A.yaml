simpleMeaning: A carboxylic acid that takes the form of a clear liquid and is used to make perfumes and
  medicines.
scope: A clear liquid used in perfumes and drugs, not a solid acid and not a liquid used only for cleaning.
examples:
- Pentanoic acid is a clear liquid used in making perfume.
- The chemist added pentanoic acid to the drug mix.
