simpleMeaning: A lightweight electronic organizer that looks like a handheld computer and performs specific
  tasks. It can keep a diary, store contacts, make calls or sound an alarm.
scope: Also called a personal digital assistant, personal organizer, personal organiser, organizer, and
  organiser; a light hand-held device that does set jobs like a diary, phone, or alarm clock.
examples:
- She checked her PDA for the meeting time.
- His PDA held his diary and his phone numbers.
