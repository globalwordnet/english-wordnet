simpleMeaning: Metal pins are put in place and hammered flat by this worker.
scope: This worker, also called riveter, puts metal pins in place and hammers them flat, and is not a
  machine that drives pins.
examples:
- On the line, the rivetter hammered the metal pins into place.
- The crew watched the rivetter put in pins and hammer them flat.
