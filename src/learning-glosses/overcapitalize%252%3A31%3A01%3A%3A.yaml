simpleMeaning: To value a company in money at too high a level, beyond what is fair or beyond what the
  law allows.
scope: It is also called overcapitalise.
examples:
- They overcapitalized the company, valuing it in money at twice what its buildings and stock were worth.
- The firm was overcapitalized, and its shares sold for far less than the value put on them.
