simpleMeaning: A small plant of Europe and Asia with broad leaves and lilac-pink flower heads that lack
  an outer ring of petal-like rays. It grows in damp places.
scope: This is a small herb of damp places with broad leaves, also called bog rhubarb, butterbur and Petasites
  vulgaris, not a herb of dry ground.
examples:
- Petasites hybridus grows in damp places.
- The broad leaves of Petasites hybridus grow in Europe and Asia.
