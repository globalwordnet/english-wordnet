simpleMeaning: A series of reactions in plant and animal mitochondria in which enzymes oxidize acetyl
  compounds, helping cells make energy-rich phosphate compounds that supply usable energy.
scope: In all plants and beasts, a run of enzyme changes in the cell's powerhouses, also called tricarboxylic
  acid cycle.
examples:
- The citric acid cycle feeds cell power.
- Citric acid cycles run in mitochondria.
