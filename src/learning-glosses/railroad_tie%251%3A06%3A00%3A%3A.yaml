simpleMeaning: One of many beams set across the track, under the metal strips that trains run on, holding
  them up.
scope: It is also called a tie, a sleeper, or a crosstie.
examples:
- Workers replaced a cracked railroad tie under the track.
- The railroad tie keeps the two metal strips the right distance apart.
