simpleMeaning: A predatory insect, such as a dragonfly or damselfly, with two pairs of thin wings as an
  adult. Its young live in water.
scope: Among water insects, it stands out as a big hunter with two pairs of thin wings.
examples:
- The odonate caught a smaller insect over the water.
- An odonate flew over the water on two pairs of thin wings.
