simpleMeaning: The faith of the Sabians, whom the Quran names alongside Jews and Christians as entitled
  to religious toleration. They are usually identified with the Mandaeans or Elkesaites.
scope: The faith of a people named in the Koran, granted the same tolerance as Jews and Christians.
examples:
- Sabianism is the faith of a people named in the Koran.
- The group behind Sabianism is usually thought to be the Mandaeans.
