senseId: 'full-wave_rectifier%1:06:00::'
synsetId: 03407536-n
simpleMeaning: A device that makes current flow in one direction by using both halves of each alternating-current
  cycle.
scope: The output can still rise and fall even though the current flows in one direction.
examples:
- The full-wave rectifier in the radio produces a current that flows in one direction.
- A full-wave rectifier uses both halves of the current.
