simpleMeaning: Technetium, a crystalline metal found naturally in tiny amounts. It can form when uranium
  atoms split.
scope: Also called technetium and atomic number 43; a crystal-like metal element not found in nature,
  coming from the splitting of uranium, unlike metal elements that occur in nature.
examples:
- Tc does not occur in nature.
- Tc comes from the splitting of uranium.
