simpleMeaning: A tropical herb or small shrub widespread worldwide, with yellow flowers and slender curved
  pods. It grows as a weed and is sometimes classified in Cassia.
scope: Also called sicklepod and Senna obtusifolia; a tropical weed with yellow flowers and thin curved
  pods, found all over the world.
examples:
- Cassia tora grows as a weed in the field.
- Cassia tora has thin curved pods.
