simpleMeaning: A paper a buyer sends to a seller, setting out exactly what is wanted and in what amounts,
  and promising to pay for it.
scope: Also called order. It is a business document.
examples:
- IBM received an order for a hundred computers.
- They sent a purchase order for two hundred chairs.
