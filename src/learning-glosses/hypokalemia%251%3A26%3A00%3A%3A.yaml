senseId: 'hypokalemia%1:26:00::'
synsetId: 14293274-n
simpleMeaning: Abnormally low blood potassium, which can cause weakness and abnormal heart rhythms. Possible
  causes include adrenal tumors, starvation, and some medicines that increase urination.
scope: This is too little potassium in the blood, not a weak heart on its own.
examples:
- Hypokalemia left her weak, with her heart beating in an odd way.
- The doctor found hypokalemia after the patient had taken water pills for weeks.
