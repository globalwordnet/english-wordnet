simpleMeaning: A living thing that grows in the ground and produces fruit a single time before it dies.
scope: It is also called monocarp and monocarpous plant.
examples:
- The monocarpic plant in the back garden bore fruit once and then died.
- After the monocarpic plant bore fruit, the gardener pulled it up.
