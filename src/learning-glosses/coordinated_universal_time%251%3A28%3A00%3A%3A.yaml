simpleMeaning: The international time standard based on atomic clocks, adjusted with leap seconds to stay
  close to time based on Earth's rotation.
scope: Also called UTC; this one is about the world standard.
examples:
- The flight times are given in coordinated universal time.
- All clocks on the network show coordinated universal time.
