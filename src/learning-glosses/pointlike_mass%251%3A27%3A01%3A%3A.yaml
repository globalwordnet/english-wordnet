simpleMeaning: Matter considered infinitely small, or an object treated as if all its mass were concentrated
  at a single point.
scope: Also called point mass. It is an idea, not a real object.
examples:
- The moon was treated as a pointlike mass in the sum.
- For the sum, they took the rock as a pointlike mass.
