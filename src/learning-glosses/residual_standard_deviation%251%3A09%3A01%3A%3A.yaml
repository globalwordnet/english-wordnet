senseId: 'residual_standard_deviation%1:09:01::'
synsetId: 92443349-n
simpleMeaning: A measure of how far observed values typically lie from the values predicted by a fitted
  line.
scope: It measures the spread of observations around the line, in the same units as the quantity being
  predicted.
examples:
- The residual standard deviation was two centimeters when the team predicted plant height.
- With the same data and units, the better-fitting line had a smaller residual standard deviation.
