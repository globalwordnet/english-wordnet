simpleMeaning: The form of dopa that rotates polarized light to the left, sold as Bendopa, Brocadopa and
  Larodopa. It is used to treat Parkinson's disease.
scope: The left-turning form of dopa, sold as Bendopa, Brocadopa and Larodopa and used to treat Parkinson's
  disease, not a drug for high blood pressure and not the right-turning form of dopa.
examples:
- The doctor gave him levodopa for Parkinson's disease.
- Levodopa is sold as Larodopa in some countries.
