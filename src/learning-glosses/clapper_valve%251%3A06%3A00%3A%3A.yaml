synsetId: 03040686-n
simpleMeaning: A part that opens and shuts on a hinge at one edge, letting fluid pass one way and stopping
  it from flowing back.
scope: This one is also called clack and clack valve.
examples:
- The clapper valve in the tank let the water in but not out.
- A clapper valve keeps liquid moving in one direction only.
