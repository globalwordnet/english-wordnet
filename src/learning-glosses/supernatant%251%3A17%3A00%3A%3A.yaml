simpleMeaning: The clear liquid that sits on top of the solid bits at the bottom.
scope: It names the liquid itself, not a floating liquid.
examples:
- They poured off the supernatant and kept the solid at the bottom.
- The supernatant was clear, while the solid below was dark.
