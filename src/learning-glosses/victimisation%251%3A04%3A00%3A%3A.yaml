senseId: 'victimisation%1:04:00::'
synsetId: 00419916-n
simpleMeaning: One person gains from another by using them badly or by treating them unfairly.
scope: Using, exploitation and victimization are other names for this sense, not a fair deal between equals.
examples:
- Paying Blacks less and charging them more is a form of victimisation.
- The factory's victimisation of its workers meant low pay and long hours.
