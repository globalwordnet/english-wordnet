simpleMeaning: A crystalline compound derived from benzoic acid by adding a hydroxyl group (–OH).
scope: A crystal-like chemical made from benzoic, a sour chemical, by adding an oxygen-and-hydrogen part;
  not the plain benzoic chemical and not the other sour chemicals with such parts.
examples:
- The hydroxybenzoic acid formed white crystals in the dish.
- She tested the hydroxybenzoic acid sample in the lab.
