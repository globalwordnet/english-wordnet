simpleMeaning: A rule for estimating a baby's due date. Start on the first day of the last menstrual period,
  add a year, subtract three months, and add seven days.
scope: A way to work out when a baby is due, counted from the first day of the last monthly period, not
  a guess made without dates.
examples:
- Naegele's rule gave a due date in early May.
- The midwife used Naegele's rule to work out the expected date.
