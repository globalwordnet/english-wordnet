simpleMeaning: An oil separated from petroleum by distillation, especially one used as medicine to soften
  stools or help the bowels move.
scope: A liquid made from petroleum, used above all as a bowel medicine; not cooking oil and not fuel
  for cars.
examples:
- The doctor gave him mineral oil to loosen his bowels.
- Mineral oil is used as a mild laxative.
