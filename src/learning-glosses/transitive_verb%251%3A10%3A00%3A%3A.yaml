simpleMeaning: A verb that requires a direct object, as eat does in the sentence They ate lunch.
scope: Transitive and transitive verb form are other names for this sense, which is about an action word
  that takes an object, not one that stands alone.
examples:
- In 'They hit the ball', 'hit' is a transitive verb because it takes an object.
- A transitive verb like 'kick' needs an object after it, as in 'They kicked the ball'.
