senseId: 'nominal_price%1:21:01::'
synsetId: 92413447-n
simpleMeaning: An estimated price for an asset that may differ from the price it would fetch on the market.
scope: It is an amount of money.
examples:
- The shop listed the vase at a nominal price of five dollars, far below what such vases usually sell
  for.
- A nominal price was set for the shares before they were first sold to the public.
