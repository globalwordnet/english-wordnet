simpleMeaning: An aromatic herb belonging to the carrot family, such as parsley or coriander.
scope: Also called umbellifer, this name is for one herb in the family, not for the whole family at once.
examples:
- They kept an umbelliferous plant on the sill for its sweet smell.
- They brushed past an umbelliferous plant and caught its sweet smell.
