senseId: sylphic%5:00:00:thin:03
synsetId: 00994908-s
simpleMeaning: Slender and graceful as a sylph, a slim fairy-like being of the air, said of a woman or
  girl.
scope: Also called sylphlike. It is a word for how a woman or girl looks, not for how she acts.
examples:
- The sylphic dancer moved across the stage with light, easy steps.
- In her youth she was sylphic, with a slim figure and a graceful walk.
