senseId: 'unmindfulness%1:07:00::'
synsetId: 04672900-n
simpleMeaning: A person with this trait lets the duties they owe slip from thought or pays them no heed.
scope: This is also called heedlessness, inadvertence, or inadvertency, and it names a trait, not one
  single act of forgetting.
examples:
- Their unmindfulness of the bills left the lights unpaid for weeks.
- The team's unmindfulness about safety checks led to a missed inspection.
