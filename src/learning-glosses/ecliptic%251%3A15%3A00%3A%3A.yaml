senseId: 'ecliptic%1:15:00::'
synsetId: 08582743-n
simpleMeaning: The great circle marking the Sun's apparent yearly path in the sky. It lies in Earth's
  orbital plane, tilted about 23 degrees to the equator.
scope: This is the sun's yearly path in the sky, tilted against the equator, and it is not the equator
  itself.
examples:
- All the planets move round the sun in almost the same ecliptic.
- The sun stays on the ecliptic all year.
