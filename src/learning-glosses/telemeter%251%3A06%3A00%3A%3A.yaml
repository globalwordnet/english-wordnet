simpleMeaning: Far away, things are watched by this tool of science, which sends back what it finds to
  the person watching.
scope: This is a tool for watching from far away, not one used at the place itself.
examples:
- The team set up a telemeter to watch the storm from far away.
- Word of what it saw came back through the telemeter.
