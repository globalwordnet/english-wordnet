senseId: 'weekend_warrior%1:18:01::'
synsetId: 10792389-n
simpleMeaning: A homeowner who takes on major home improvements as their own contractor on weekends, often
  underestimating how much work the project involves.
scope: This is the homeowner who does the builder's job on days off, not one who hires a builder to do
  it.
examples:
- The weekend warrior spent Saturday fixing the roof.
- The weekend warrior neighbour tried to build a new room.
