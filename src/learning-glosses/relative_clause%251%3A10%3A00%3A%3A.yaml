senseId: 'relative_clause%1:10:00::'
synsetId: 06326089-n
simpleMeaning: A part of a sentence that starts with a word like who, which, or that, and says more about
  the noun it follows.
scope: It is a part of a sentence.
examples:
- The relative clause 'who lives next door' tells us which neighbour is meant.
- They added a relative clause to make clear which book they meant.
