senseId: commutable%5:00:00:exchangeable:00
synsetId: 00920882-s
simpleMeaning: Said of a thing that can be swapped for another thing, or for something else of the same
  worth.
scope: Also called substitutable, this one is said of the thing itself, not of the quality of being swappable.
examples:
- The two plugs are commutable, so either one will fit.
- These parts are commutable with the old ones.
