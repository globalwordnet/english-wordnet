simpleMeaning: How sharp and unkind words or a tone of voice sound to the hearer.
scope: This one is also called acridness, and it is not about a smell.
examples:
- The acridity of their reply made everyone in the room go quiet.
- They answered with an acridity that stung, though they had only been asked a plain question.
