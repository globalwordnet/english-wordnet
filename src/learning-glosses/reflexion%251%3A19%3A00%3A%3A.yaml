simpleMeaning: Light or sound that has been thrown back from a surface it met while travelling along.
scope: 'This is also called reflection: the throwing back itself, not the long thinking and not the remark.'
examples:
- The reflexion of a voice came back from the far wall.
- A reflexion in the mirror sent the light back across the room.
