senseId: 'sense_datum%1:09:00::'
synsetId: 05720023-n
simpleMeaning: The plain, first knowing that comes when something reaches a person through the body, before
  any thought about it.
scope: Also called sensation, aesthesis, esthesis, sense experience and sense impression, this is the
  plain first knowing a person has through the body, before thought adds anything.
examples:
- A sense datum might be the bare feeling of warmth on the skin.
- The sense datum of a sharp sound reached them before they knew what it was.
