simpleMeaning: A hospital providing treatment and care for people with serious mental health conditions.
scope: It is also called an institution, an asylum, an insane asylum, a mental home, a mental hospital,
  or a psychiatric hospital.
examples:
- The old mental institution stood at the edge of the village.
- The patient was moved to a mental institution after doctors agreed full-time care was needed.
