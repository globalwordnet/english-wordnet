simpleMeaning: A heavy man wearing a hat with three corners gives this drinking mug its shape.
scope: This is also called a toby and a toby jug, and it is not a plain round mug.
examples:
- They drank from the toby fillpot jug shaped like a heavy man in a hat.
- They filled the toby fillpot jug shaped like a stout man and passed it round.
