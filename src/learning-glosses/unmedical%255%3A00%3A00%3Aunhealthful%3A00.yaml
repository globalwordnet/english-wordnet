simpleMeaning: Said of a drug or a treatment that does not help a sick person get better, and that no
  doctor has ordered.
scope: Also called nonmedicinal, unmedicative, or unmedicinal. It is said of a drug.
examples:
- The unmedical powder did nothing for the fever.
- A doctor would never call that unmedical herb a cure.
