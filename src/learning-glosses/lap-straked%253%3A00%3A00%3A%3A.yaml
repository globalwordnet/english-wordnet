simpleMeaning: With the boards of the hull laid so each covers part of the one below.
scope: It is also called clincher-built, clinker-built, lap-strake, lap-streak, or lap-streaked.
examples:
- The lap-straked boat had overlapping planks along its sides.
- They built the skiff lap-straked, so the hull was strong and light.
