simpleMeaning: A shape with a sharp corner or a round curve, made by turning part of a surface back on
  itself.
scope: Also called a fold, a bend, a crease, a crimp, or a flexure. It is a shape, not the act of folding.
examples:
- The blouse had a plication on it.
- The paper had a plication along one edge.
