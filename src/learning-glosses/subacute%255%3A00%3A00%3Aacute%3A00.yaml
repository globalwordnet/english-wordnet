senseId: subacute%5:00:00:acute:00
synsetId: 00045207-s
simpleMeaning: Describing an illness that develops less suddenly or severely than an acute illness and
  may have few obvious symptoms.
scope: Of a sickness in one with no signs of it, less than sharp.
examples:
- The fever was subacute, less than sharp.
- The sickness was subacute, with no signs of it.
