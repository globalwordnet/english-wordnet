simpleMeaning: In a trade, firms with too little money behind them are removed, and only the stronger
  ones stay.
scope: This is the name for what happens in a trade.
examples:
- The firms glutted the market to cause a shakeout of their rivals.
- After the shakeout, only the strong firms were left in the trade.
