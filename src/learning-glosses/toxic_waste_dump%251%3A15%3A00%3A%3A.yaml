senseId: 'toxic_waste_dump%1:15:00::'
synsetId: 08591585-n
simpleMeaning: This dump is the place for harmful rubbish, which can be left there or has been left there,
  often against the law.
scope: Also called toxic dumpsite and toxic waste site, this is a place that takes harmful rubbish, not
  harmless rubbish.
examples:
- Harmful rubbish was left in the toxic waste dump.
- The toxic waste dump stood where the rubbish had been left.
