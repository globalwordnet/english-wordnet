simpleMeaning: To do with a lung illness in which the tiny air sacs in the lungs break down, or like that
  illness, or being that illness itself.
scope: This one is said of a lung illness.
examples:
- The emphysematous changes in the lungs made every breath hard work.
- The emphysematous lungs could no longer take in enough air.
