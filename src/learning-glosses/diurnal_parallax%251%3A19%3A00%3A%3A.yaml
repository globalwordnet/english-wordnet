senseId: 'diurnal_parallax%1:19:00::'
synsetId: 11549390-n
simpleMeaning: The change in where a thing in the sky seems to be, seen from two places on the earth as
  it turns each day.
scope: This one is also called geocentric parallax.
examples:
- The diurnal parallax of the moon is small.
- They worked out the diurnal parallax from two towns far apart.
