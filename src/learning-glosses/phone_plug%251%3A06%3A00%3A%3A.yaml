simpleMeaning: The piece at the end of a cord that fits into a socket and links a device for speaking
  with someone far away.
scope: Also called a telephone plug. It is the piece that goes into a socket, not the socket itself.
examples:
- The phone plug at the end of the cord would not stay in the socket.
- They pushed the phone plug into the socket until it clicked.
