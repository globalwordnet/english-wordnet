simpleMeaning: Any of several southern African geraniums with pink flowers and fragrant leaves divided
  into three to five lobes.
scope: Also called sweet-scented geranium, its pink flowers and sweet-smelling leaves, cut into three
  to five parts, mark it out among southern African plants.
examples:
- The rose geranium opened its pink flowers.
- Sweet-smelling leaves marked the rose geranium.
