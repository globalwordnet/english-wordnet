simpleMeaning: An illness that is always found, more or less, among people of one kind or in people living
  in one place.
scope: Also called endemic. It is about an illness.
examples:
- The endemic disease has been present in the valley for as long as anyone can remember.
- Doctors study the endemic disease to learn why it stays in one place.
