simpleMeaning: A frog or toad with a stout body, long back legs for jumping, and no tail as an adult.
  Some species are partly aquatic and others live on land.
scope: A tailless jumping animal that lives in water and on land, also called frog, toad, anuran, batrachian
  and toad frog.
examples:
- The salientian leapt into the water.
- Salientians live both in water and on land.
