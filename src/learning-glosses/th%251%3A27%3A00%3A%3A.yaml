simpleMeaning: Thorium, a soft, silvery-white radioactive metal that commonly forms four bonds. Thorium-232
  can provide fuel for nuclear reactors. It occurs in thorite and monazite sands.
scope: This is the soft pale metal giving off rays, not the hard dark crystal or the gas in the air, and
  it is also called thorium and atomic number 90.
examples:
- Th is used as a power source in reactors.
- The ore held Th in its sands.
