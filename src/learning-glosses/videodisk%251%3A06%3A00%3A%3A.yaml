simpleMeaning: A round plate read by light, on which a film is stored as coded marks, so a computer or
  a television set can play.
scope: Also called videodisc and DVD. It is the plate itself, not the film it holds.
examples:
- They bought the movie on videodisk for the weekend.
- The videodisk skipped during the last scene.
