simpleMeaning: Entitled to what remains of an estate after debts are paid and specific gifts are distributed.
scope: The adjective describes the beneficiary entitled to the remaining estate.
examples:
- The residuary beneficiary was named in the will.
- As the residuary heir, she received what remained after the named gifts were distributed.
