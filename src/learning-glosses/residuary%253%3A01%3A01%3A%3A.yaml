schema: oewn-learning-gloss-v2
senseId: 'residuary%3:01:01::'
synsetId: 03121613-a
simpleMeaning: the person with the right to what is left of an estate once its debts are paid and the
  gifts named in it are given
scope: This describes the person with the right to what is left of an estate, not something that merely
  has to do with a remainder.
examples:
- The residuary beneficiary was named in the will.
- The residuary part of the estate went to the person named in the will.
