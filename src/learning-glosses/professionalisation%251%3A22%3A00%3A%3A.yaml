simpleMeaning: The change in a society by which an activity becomes paid work that people do to earn a
  living.
scope: Also called professionalization. It is a process.
examples:
- The professionalisation of American sports meant players could earn a living from the game.
- The professionalisation of warfare brought paid soldiers into the field.
