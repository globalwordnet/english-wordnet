simpleMeaning: In music, the playing again of tunes first heard earlier in the piece, especially when
  the last part is being written.
scope: It is about music, not a summary of a talk or the growth of an embryo.
examples:
- The recapitulation brings back the opening tune of the symphony.
- They listened for the recapitulation near the end of the movement.
