simpleMeaning: Inside this hollow tube of metal, very short radio signals stay on a set course for use
  in radar.
scope: This hollow metal conductor is also called a wave guide.
examples:
- They fitted a waveguide between the radar set and the antenna.
- The waveguide kept the radar signals on course as they passed through it.
