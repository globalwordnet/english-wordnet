senseId: 'pleura%1:08:00::'
synsetId: 05395458-n
simpleMeaning: A thin membrane that covers the lungs and lines the inner chest walls, producing fluid
  that helps the layers slide past each other.
scope: This thin cover wraps round the lungs and lines the inside of the chest, and it is not the lungs
  themselves.
examples:
- The pleura round the lungs is a thin cover.
- The pleura lines the inside of the chest wall.
