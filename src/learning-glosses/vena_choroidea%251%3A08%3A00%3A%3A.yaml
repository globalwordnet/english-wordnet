simpleMeaning: The coat of the eye is served by two blood vessels, and each one carries blood back toward
  the heart.
scope: This is one of two blood vessels of the coat of the eye, also called choroid vein, not one of many.
examples:
- Blood leaves the coat of the eye through the vena choroidea.
- In the eye clinic, they watched blood move through the vena choroidea.
