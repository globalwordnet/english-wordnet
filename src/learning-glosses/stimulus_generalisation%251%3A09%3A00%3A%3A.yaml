synsetId: 05764411-n
simpleMeaning: In psychology, the carrying over of a response learned to one thing that causes it, to
  a similar thing.
scope: It is also called a generalization, a generalisation, or a stimulus generalization.
examples:
- The dog showed stimulus generalisation when it obeyed a new command like the old one.
- The child showed stimulus generalisation by using a new word the same way as a known one.
