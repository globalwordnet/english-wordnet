simpleMeaning: An elementary particle with a positive electric charge equal to two-thirds of a proton's
  charge. Up quarks are found in protons and neutrons.
scope: It is a kind of matter.
examples:
- An up quark is one of the bits that make up a proton.
- Two up quarks sit inside each proton.
