synsetId: 01156732-n
simpleMeaning: Discrimination that favors people without disabilities over disabled people.
scope: This one is also called ableism, able-bodism, or ablism.
examples:
- A job ad that asks only for people who can stand all day shows able-bodiedism.
- They spoke out against able-bodiedism after the club turned away a member in a wheelchair.
