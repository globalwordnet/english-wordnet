simpleMeaning: It describes someone or something that looks like a scarecrow, thin and ragged.
scope: It is said of someone or something thin and ragged, not of a real scarecrow set up in a field.
examples:
- The scarecrowish figure was thin and ragged.
- The scarecrowish stranger looked thin and ragged.
