simpleMeaning: A charge of wrongdoing that a grand jury brings on its own, without anyone asking it to.
scope: It is also called notification. It is a charge, not a verdict.
examples:
- The grand jury issued a presentment against the official.
- A presentment can start a case even when no one has filed a charge.
