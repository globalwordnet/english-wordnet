simpleMeaning: While a program is at work, a wrong step in its logic or its sums may come to light.
scope: Also called run-time error and runtime error, this names a mistake in meaning or counting that
  shows up only while a program runs.
examples:
- They found a semantic error while the program was running.
- The semantic error was in the program's logic.
