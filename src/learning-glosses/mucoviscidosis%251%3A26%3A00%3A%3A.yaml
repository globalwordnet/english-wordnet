simpleMeaning: An inherited disease caused by changes in one gene. Thick mucus affects the lungs, intestines
  and pancreas. Treatments help manage it, but there is currently no cure.
scope: Another name for cystic fibrosis, an inherited disease in which thick mucus can affect the lungs,
  intestines, and pancreas.
examples:
- Mucoviscidosis clogs the lungs with mucus.
- Mucoviscidosis comes from one faulty gene.
