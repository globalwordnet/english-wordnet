senseId: 'retarding_force%1:19:00::'
synsetId: 11525316-n
simpleMeaning: The holding-back a thing meets when it moves through a fluid, slowing it down as it goes.
scope: Also called drag, this is the holding-back a thing meets when it moves through a fluid, not the
  grip of a solid surface.
examples:
- The retarding force of the water slowed the swimmer down.
- A retarding force acts on the stone as it sinks through the water.
