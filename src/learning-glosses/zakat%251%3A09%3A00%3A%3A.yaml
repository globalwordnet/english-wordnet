simpleMeaning: Obligatory giving to people in need as an act of worship, one of the five pillars of Islam.
scope: This one is a set duty, not a gift a person gives when they choose.
examples:
- They paid their zakat to help the poor in their town.
- Each year they set aside part of their money as zakat.
