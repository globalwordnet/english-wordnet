senseId: 'unregenerated%3:00:00::'
synsetId: 01964264-a
simpleMeaning: Said of a person whose beliefs and ways of living show no change for the better.
scope: Also called unregenerate. It is said of a person, not of a thing.
examples:
- Their unregenerated nature showed itself in small ways every day.
- The unregenerated conservatism of the old club kept it from trying anything new.
