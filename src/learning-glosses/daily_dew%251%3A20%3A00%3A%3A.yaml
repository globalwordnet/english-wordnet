simpleMeaning: A sundew, a bog plant of the genus Drosera whose sticky leaf hairs trap insects that the
  plant digests. Sundews grow in many parts of the world.
scope: This sense is also called sundew and sundew plant, any of various bog plants, Drosera by genus,
  their leaves set with sticky hairs that snare and eat bugs, found the world over.
examples:
- Daily dews snare bugs with sticky hairs.
- The daily dew grows in bogs.
