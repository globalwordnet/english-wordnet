simpleMeaning: A disorder of the parts of the body used for making sounds, in which a person loses the
  voice.
scope: This is also called voicelessness.
examples:
- After the operation, the singer developed aphonia and could not make a sound.
- The doctor said the aphonia came from damage to the parts used for speaking.
