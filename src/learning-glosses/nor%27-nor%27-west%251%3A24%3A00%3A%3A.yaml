senseId: 'nor''-nor''-west%1:24:00::'
synsetId: 13857362-n
simpleMeaning: One of the points of a compass, halfway between the side toward the pole star and a direction
  itself halfway between that side and the sunset side.
scope: Also called north northwest, and NNW for short. It is a noun.
examples:
- The needle settled on nor'-nor'-west after the turn.
- The captain ordered the course set to nor'-nor'-west.
