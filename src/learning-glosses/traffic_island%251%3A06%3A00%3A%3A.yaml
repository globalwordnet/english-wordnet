senseId: 'traffic_island%1:06:00::'
synsetId: 04473404-n
simpleMeaning: In the road, people on foot can stand in safety on an area with a raised edge, kept apart
  from passing vehicles.
scope: This is also called a safety island, a safety isle, or a safety zone, and it is not a place where
  vehicles may drive.
examples:
- They waited on the traffic island until it was safe to cross.
- They stood on the traffic island while the cars went past.
