simpleMeaning: A theme, image, or convention that recurs in literature.
scope: This is a theme or idea that writers return to again and again, not a new idea no one has used
  before.
examples:
- The topos of the lost home turns up again and again in their poems.
- They used the topos of the wandering stranger again and again.
