simpleMeaning: Belonging to the land, or living there, and not to the sea or the air.
scope: Also called terrestrial, tellurian, or terrene. It does not describe a chemical element.
examples:
- Telluric creatures make their homes on land, not in the sea.
- The telluric plants of the island grow in the soil, not in the water.
