senseId: 'uncomparable%3:00:00::'
synsetId: 00506504-a
simpleMeaning: No other thing can be set beside this one to judge them, because it has no points that
  can be matched.
scope: Also called incomparable, this word names a thing that no other thing can be likened to, not one
  that is only hard to rank.
examples:
- No other place had the uncomparable beauty of this one.
- They spoke of an uncomparable week of rest and pleasure.
