simpleMeaning: Money given in a fairly small amount to a waiter or another person for work done for you.
scope: Also called a tip, a gratuity, backsheesh, baksheesh, bakshis, or bakshish. It is a sum.
examples:
- The pourboire we left for the waiter was only a few coins.
- They put a pourboire on the table after the meal.
