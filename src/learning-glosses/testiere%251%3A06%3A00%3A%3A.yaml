simpleMeaning: This flat metal covering went on a horse's head in the Middle Ages to keep it safe.
scope: This is also called a chamfron, a chanfron, a front-stall, or a frontstall, and it covers a horse's
  head, not the horse's body.
examples:
- They put a testiere on the horse's head.
- The horse's head was safe inside its testiere.
