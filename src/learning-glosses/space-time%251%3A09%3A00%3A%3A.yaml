simpleMeaning: A frame of four measures, three for place and one for moment, that fixes where and when
  a physical event happens.
scope: Also called space-time continuum and spacetime. It is a frame.
examples:
- The physicist plotted the rocket's path in space and time on one chart.
- They used a space chart to show where the comet was and when it passed.
