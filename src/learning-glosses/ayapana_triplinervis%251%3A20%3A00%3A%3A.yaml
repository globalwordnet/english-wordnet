simpleMeaning: A low, spreading tropical American shrub whose long, narrow leaves make a mildly stimulating
  tea-like drink. Some botanists place it in the genus Eupatorium.
scope: 'Also called ayapana and Eupatorium aya-pana: a low spreading shrub of tropical America with long
  thin leaves used to make a mild drink like tea, not a tall tree and not a plant grown for its flowers.'
examples:
- Ayapana triplinervis spread low across the warm garden bed.
- The leaves of Ayapana triplinervis make a mild drink like tea.
