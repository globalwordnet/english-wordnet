simpleMeaning: A person who has just got rich but is still not taken in by the rich people around them.
scope: Also called an upstart, an arriviste, or a nouveau-riche. It is a person.
examples:
- The parvenu bought a big house but found no welcome at the club.
- The neighbours still saw them as a parvenu, not as one of their own.
