simpleMeaning: The underground parts of a plant have got so twisted and pressed together that they form
  one tight mass.
scope: This word is for the underground parts of a plant grown into a thick, knotted mass, not only for
  a potted plant that has grown too large for its pot.
examples:
- They found the old shrub rootbound.
- The flowers had grown rootbound.
