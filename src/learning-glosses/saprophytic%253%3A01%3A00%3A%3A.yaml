schema: oewn-learning-gloss-v2
senseId: 'saprophytic%3:01:00::'
synsetId: 03032264-a
simpleMeaning: Through a thin wall, food passes in from matter that has broken down and spread through
  water.
scope: This sense is about food passing through a thin wall, not about plants or fungi feeding on dead
  matter.
examples:
- The organism is saprophytic and takes in food from the water around it.
- A saprophytic cell draws its food through a thin wall from matter in the water.
