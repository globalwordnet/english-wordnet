simpleMeaning: A businessman who brings two or more commercial companies together into one.
scope: This one names the person who does the joining, not the joining itself.
examples:
- The amalgamator met the owners of both firms to plan the joining.
- As an amalgamator, they had joined three small companies into one big group.
