schema: oewn-learning-gloss-v2
senseId: 'aphoristic%3:01:00::'
synsetId: 02664356-a
simpleMeaning: Said of a piece of writing or a talk that holds short, wise sayings, or sayings that lay
  down a rule for living.
scope: This is also called axiomatic, and it is not about the other sense of this word, which is about
  a short, witty way of saying things.
examples:
- The essay is full of aphoristic lines that sum up a whole idea in a few words.
- They enjoyed the aphoristic style of the old book, with a wise saying on every page.
