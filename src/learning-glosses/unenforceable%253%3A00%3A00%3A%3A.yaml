synsetId: 00559530-a
simpleMeaning: Said of a thing that cannot be made to happen by force.
scope: It is a word for a thing, not for a person.
examples:
- The new rule was unenforceable, so most shops paid no attention to it.
- They passed reforms that were unenforceable without the courts behind them.
