simpleMeaning: Both pitiful and laughable at the same time.
scope: Tragicomical is another name for it; it is about a single thing, not about the kind of play.
examples:
- The whole affair turned tragicomic when the grand plan ended in a farce.
- The tragicomic hero lost everything and still made the crowd laugh.
