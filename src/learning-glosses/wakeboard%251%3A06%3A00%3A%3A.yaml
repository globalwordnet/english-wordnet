simpleMeaning: A buoyant board like a surfboard, ridden over the water while a motorboat pulls the rider
  along.
scope: This is also called a wake board, and it is not a surfboard, though it looks like one.
examples:
- They stood on the wakeboard and held tight as the motorboat pulled them across the lake.
- The wakeboard bounced over the waves behind the motorboat.
