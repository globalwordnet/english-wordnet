simpleMeaning: European weed established in the southwestern US and Mexico, with reddish trailing stems,
  small fernlike leaves, small deep reddish-lavender flowers, then slender upright fruits. Often grown
  for animal feed.
scope: This is the plant name for a low forage weed, not the thread-like worm that lives in blood and
  tissues.
examples:
- Filaria grows along roadsides and in overgrazed pastures in the Southwest.
- Filaria and filaree are two names for the same low weed.
