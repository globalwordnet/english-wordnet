synsetId: 01477467-a
simpleMeaning: Relating to a small, flowing style of handwriting that developed from uncial, a script
  with large rounded letters, between the seventh and ninth centuries.
scope: To do with the small medieval handwriting, not the handwriting itself and not the older large-letter
  style.
examples:
- The minuscule writing in the old book dates from the 8th century.
- The scribe learned the minuscule style from an older book.
