simpleMeaning: In physiology, the normal breaking down and dying of living cells, such as the cells that
  form the skin and the linings inside the body.
scope: Also called cell death.
examples:
- The doctor explained that necrobiosis in the skin is normal and nothing to worry about.
- Necrobiosis affects the cells that line the mouth.
