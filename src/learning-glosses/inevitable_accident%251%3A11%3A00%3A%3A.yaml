senseId: 'inevitable_accident%1:11:00::'
synsetId: 07329950-n
simpleMeaning: A natural disaster that cannot be avoided and disrupts the expected course of events.
scope: It is also called force majeure, unavoidable casualty, vis major, and act of God.
examples:
- The flood was an inevitable accident, and no warning could have stopped it.
- An inevitable accident closed the road for a week.
