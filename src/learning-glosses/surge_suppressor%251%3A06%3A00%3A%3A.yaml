simpleMeaning: A device connected to a power line to protect electrical equipment from sudden surges of
  electricity.
scope: Lightning arrester, spike arrester and spike suppressor are also names for it, and surge protector
  is another name for it.
examples:
- They fitted a surge suppressor in the power line.
- A surge suppressor kept the machines safe.
