simpleMeaning: Said of a person or a thing that has no strength or power left and is extremely tired.
scope: Also called spent, gone, exhausted, fatigued, fagged, dog-tired, played out, worn-out, and worn
  out. It is a state.
examples:
- They felt completely washed-out after the long day.
- The washed-out climbers sat down and rested.
