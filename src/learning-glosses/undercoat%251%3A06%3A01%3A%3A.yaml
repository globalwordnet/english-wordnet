simpleMeaning: The first paint or sealer spread on a surface, as a base for what goes on top.
scope: Ground, primer, priming, flat coat, primer coat, and priming coat are other names for it. It is
  not the fur below an animal's outer hair, and not the seal on the bottom of a car.
examples:
- They put an undercoat on the wall before painting it.
- The painter gave the door an undercoat and let it dry.
