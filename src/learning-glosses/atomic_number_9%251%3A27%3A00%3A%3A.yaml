simpleMeaning: Fluorine, a nonmetallic halogen forming one bond. Its yellow gas is irritating, toxic,
  and highly reactive. A powerful oxidizing agent, it comes from fluorite, cryolite, or fluorapatite.
scope: 'Also called F and fluorine: a yellow gas, not chlorine, and not a compound.'
examples:
- Atomic number 9 is a yellow gas.
- Fluorine, atomic number 9, is got from fluorite.
