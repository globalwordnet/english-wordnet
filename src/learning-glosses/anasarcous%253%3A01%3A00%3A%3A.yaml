simpleMeaning: Said of a living body that has a swelling caused by water collecting in it.
scope: This is not a body with no swelling at all.
examples:
- The doctor noted the anasarcous leg, swollen with water that had collected under the skin.
- Water had collected under the skin of their anasarcous arm, and it looked puffed up.
