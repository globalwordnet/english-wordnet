simpleMeaning: Goods go from this person straight to the people who will use them, not to other sellers.
scope: Also called a retailer, this is the seller at the end of the chain, selling goods to the people
  who will use them.
examples:
- The retail merchant sells goods to the people who will use them.
- The retail merchant sold goods to the people who came to buy them for their own use.
