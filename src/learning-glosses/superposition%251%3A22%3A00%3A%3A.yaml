simpleMeaning: One layer of rock comes to lie on top of another, and in geology that laying down is this.
scope: This is the geology word for it, not the matching of two shapes in geometry or the rule that the
  lowest layer is the oldest.
examples:
- The sandstone rests on the shale by superposition.
- The rock layers formed by superposition.
