simpleMeaning: A light set among the ropes and wires of a ship held still in the water.
scope: Also called a riding lamp or a riding light, this one belongs to a ship held still in the water,
  not to a ship under way.
examples:
- The crew hung an anchor light in the rigging as night fell.
- From the shore, we could see the anchor light of the ship held still in the bay.
