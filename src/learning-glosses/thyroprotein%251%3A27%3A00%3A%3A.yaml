simpleMeaning: A preparation made from protein treated with iodine that acts like thyroxine, a thyroid
  hormone.
scope: This is a prepared mix, not the protein it is made from and not the body's own chemical it acts
  like.
examples:
- They took thyroprotein, and it acted in the body like the body's own chemical.
- They prepared the thyroprotein from protein treated with iodine.
