senseId: 'lactase_deficiency%1:26:00::'
synsetId: 14530258-n
simpleMeaning: A shortage of the enzyme needed to digest milk sugar, rarely present from birth but common
  later in life. Too little lactase leaves some lactose undigested.
scope: Lactase deficiency can cause symptoms of lactose intolerance. Some people with low lactase tolerate
  small amounts of milk.
examples:
- Lactase deficiency can make a glass of milk hard to digest.
- Her lactase deficiency became apparent in adulthood.
