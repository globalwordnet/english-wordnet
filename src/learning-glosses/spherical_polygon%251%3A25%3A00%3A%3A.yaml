simpleMeaning: A shape on the surface of a sphere bounded by arcs of three or more great circles.
scope: This shape is fenced in by the curved lines of three or more great rings on a ball.
examples:
- They drew a spherical polygon on the globe.
- The region on the globe formed a spherical polygon.
