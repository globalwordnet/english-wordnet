senseId: 'refulgence%1:07:00::'
synsetId: 04961131-n
simpleMeaning: The brightness of a thing that glows strongly, sending light out in rays.
scope: Also called shine, radiance, effulgence, radiancy, and refulgency. It is a quality, not a thing
  itself.
examples:
- The refulgence of the lantern lit the whole camp.
- We watched the refulgence of the morning sun on the snow.
