simpleMeaning: Said of a lake, or another stretch of water, that holds much food for plants, and is liable
  to grow richer in it.
scope: This one is said of water.
examples:
- The eutrophic lake looked green with algae in the summer sun.
- The pond had grown eutrophic, and its water was thick with weed.
