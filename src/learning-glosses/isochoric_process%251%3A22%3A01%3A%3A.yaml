simpleMeaning: A series of changes involving heat and energy, with the size of a closed system staying
  the same.
scope: It is also called a constant-volume process, an isometric process, and an isovolumetric process.
examples:
- In an isochoric process, the gas kept the same volume while it was heated.
- The isochoric process held the volume steady as the pressure rose.
