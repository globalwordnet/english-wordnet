simpleMeaning: A white or colorless, mildly acidic solid soluble in water and ethanol. Uses include making
  glass, paper and glue, detergents, welding flux, antiseptics and preserving food.
scope: This sense is also called orthoboric acid.
examples:
- Boric acid dissolves in water.
- They used boric acid as an antiseptic.
