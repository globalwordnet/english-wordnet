senseId: 'two-mover%1:10:01::'
synsetId: 92444679-n
simpleMeaning: A puzzle in which White must give checkmate in 2 moves, whatever Black does to defend.
scope: This word is for a puzzle that sets White one winning task, not for a puzzle with no set task at
  all.
examples:
- The two-mover gave White only 2 moves to win.
- They worked on the two-mover until White found the key move.
