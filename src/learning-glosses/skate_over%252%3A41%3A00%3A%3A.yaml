senseId: 'skate_over%2:41:00::'
synsetId: 02521921-v
simpleMeaning: To deal with a thing too fast to do it well, or to keep away from dealing with it as one
  should.
scope: Also called gloss over, skimp over, slur over, and smooth over. It is a verb.
examples:
- They skated over the hard questions in the meeting.
- The report skated over the missing money.
