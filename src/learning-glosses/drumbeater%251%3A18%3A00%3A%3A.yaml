simpleMeaning: A champion of a cause, backing it with fierce feeling and ready to fight for it.
scope: This one is also called partisan and zealot.
examples:
- The senator became a drumbeater for the new road long before anyone else backed it.
- Our neighbour turned into a drumbeater for the new park and talked about it for weeks.
