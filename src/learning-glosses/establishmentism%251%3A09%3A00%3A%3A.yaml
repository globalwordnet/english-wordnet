simpleMeaning: The doctrine that the social and political order in place deserves support.
scope: Also called establishmentarianism. It is about a set of ideas, not a person who holds them.
examples:
- The writer defended establishmentism in an essay about the old order.
- Establishmentism appealed to people who liked things as they were.
