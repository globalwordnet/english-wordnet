simpleMeaning: The smooth inner layer of some mollusk shells, also called mother-of-pearl, whose colors
  shimmer as the light changes.
scope: 'Also called mother-of-pearl: the bright layer inside a shell, not the hard outer shell and not
  a pearl itself.'
examples:
- The nacre inside the oyster shone pink and green.
- Jewellers prize nacre for its soft changing colours.
