simpleMeaning: To do with, or like, tiny living things with no set shape.
scope: Also called amoebic, ameban, amebic, amebous, or amoeban, this one names a likeness, not the tiny
  living things themselves.
examples:
- The amoebous cell kept changing shape under the microscope.
- They watched the amoebous blob stretch out one side and pull in the other.
