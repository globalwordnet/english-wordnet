simpleMeaning: A measure used in advertising, equal to one line of agate type (small print) appearing
  in a million copies of a publication.
scope: A measure used in advertising; not a measure of length and not a price.
examples:
- The ad cost was worked out in milline.
- One milline is one small line in a million copies.
