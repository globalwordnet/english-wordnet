simpleMeaning: A person who watches over the actors and shapes the action of a show while it is being
  put on.
scope: Also called a director and a theater director. It is not the person who pays for the show.
examples:
- The theatre director rehearsed the cast all week.
- They asked the theatre director how the final scene should look.
