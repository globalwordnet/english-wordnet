senseId: 'water_pore%1:20:00::'
synsetId: 13174524-n
simpleMeaning: Liquid seeps out of this pore onto the flat face or edge of a leaf of a plant with roots,
  stems, and leaves.
scope: Also called a hydathode or a water stoma, this opening lets liquid out of a leaf, and it does not
  take liquid in.
examples:
- They saw a water pore on the edge of the leaf give out a drop of liquid.
- A water pore on the leaf let out liquid after the rain.
