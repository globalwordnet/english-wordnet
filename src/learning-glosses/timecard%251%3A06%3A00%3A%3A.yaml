simpleMeaning: A slip marked by a clock at work to keep a record of when a worker starts and stops each
  day.
scope: It is not a record kept on its own.
examples:
- Workers slip their timecards into the clock when they arrive.
- The clock stamped the timecard as the worker left for the day.
