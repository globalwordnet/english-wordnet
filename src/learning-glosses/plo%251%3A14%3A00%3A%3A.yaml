simpleMeaning: A Palestinian political organization seeking an independent state. Founded in 1964 and
  later chaired by Yasser Arafat, it gained UN observer status in 1974 and represents Palestinians internationally.
scope: The PLO is the Palestine Liberation Organization.
examples:
- The PLO was formed in 1964.
- The UN General Assembly granted the PLO observer status in 1974.
