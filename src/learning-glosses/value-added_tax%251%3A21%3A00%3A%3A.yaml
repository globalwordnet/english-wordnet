simpleMeaning: A tax on the value added to goods or services at each stage of production and sale, usually
  borne by the final customer.
scope: Also called goods and service tax, VAT, and GST. It is a sum of money.
examples:
- The shop added value-added tax to the bill.
- Value-added tax raised the price of the goods.
