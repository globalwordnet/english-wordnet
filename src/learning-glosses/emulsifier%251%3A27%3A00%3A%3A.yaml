simpleMeaning: An agent that works where two liquids meet, helping liquids that will not blend on their
  own form one smooth mix.
scope: It is a noun for a helper in mixing, not for the mix itself.
examples:
- The emulsifier in the dressing keeps the oil and water from parting.
- They added an emulsifier so the sauce would stay smooth.
