simpleMeaning: Said of singing that has a tune, as opposed to recitative, singing that follows the rise
  and fall of speech.
scope: Also called songlike, this one is not the plain, speech-like singing of recitative.
examples:
- They opened the second half with an ariose song about the sea.
- The children learned the ariose chorus by ear.
