simpleMeaning: A set of words that takes the place of a subject or an object when used with a verb.
scope: Also called a nominal phrase, or just nominal. It is a set of words.
examples:
- The noun phrase 'the old house on the hill' is the subject of the sentence.
- In 'They bought a red car', the noun phrase 'a red car' is the object of the verb.
