simpleMeaning: Transistors, small parts that switch electric signals, are fitted inside an electronic
  circuit or device.
scope: Transistorize is another name for this sense, which is about a circuit or device fitted with transistors,
  not about making the device itself.
examples:
- They transistorised the old radio so it would work with transistors.
- The engineers transistorised the circuit and tested it again.
