simpleMeaning: The ease with which clear words can be taken in.
scope: Also called clarity, lucidity, clearness, limpidity, and lucidness. It is a quality.
examples:
- The pellucidity of the writing made the hard ideas easy to follow.
- They praised the pellucidity of the speaker's words.
