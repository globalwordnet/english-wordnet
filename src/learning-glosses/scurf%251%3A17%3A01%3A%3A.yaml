senseId: 'scurf%1:17:01::'
synsetId: 09448485-n
simpleMeaning: What comes off the skin as small dry flakes when the outer dead layer breaks up.
scope: Dead skin that flakes off the body goes by this name, also called scale or exfoliation, and it
  is not the scale-like covering on a plant.
examples:
- She noticed scurf on the shoulders of his dark coat.
- The scurf on his scalp came away when he brushed his hair.
