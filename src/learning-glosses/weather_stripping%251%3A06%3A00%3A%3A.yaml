simpleMeaning: Material in a thin band, put where a door or a window meets its frame so that cold air
  stays out.
scope: Also called weather strip, weatherstrip and weatherstripping. It is a band of material, not the
  door or window it covers.
examples:
- They bought weather stripping for the windows of the old house.
- The weather stripping around the door keeps out the cold air.
