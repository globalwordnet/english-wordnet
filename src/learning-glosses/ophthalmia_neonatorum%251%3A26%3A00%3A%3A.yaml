simpleMeaning: Inflammation of the lining of a newborn’s eyes. Some infections are acquired during birth.
  Silver nitrate drops were historically used to prevent the form caused by gonorrhea.
scope: This condition affects the eyes in the first month of life. Preventive practices vary by place
  and time.
examples:
- The doctor examined the newborn for ophthalmia neonatorum.
- A medical history described efforts to prevent ophthalmia neonatorum in maternity hospitals.
