senseId: circumlocutious%5:00:00:indirect:02
synsetId: 00771186-s
simpleMeaning: Said of what a person says or writes, going the long way round, with many more words than
  the point needs.
scope: This one is also called ambagious, circumlocutory and periphrastic.
examples:
- They had a preference for circumlocutious talk rather than forthright expression.
- Their circumlocutious answer took ten minutes to reach the point.
