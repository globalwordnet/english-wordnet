simpleMeaning: One unbroken stretch of built-up land where town joins town with no open space between.
scope: Also called sprawl and conurbation. It is a spread of towns, not a single town.
examples:
- The urban sprawl has joined the two towns into one.
- The urban sprawl around the city keeps growing.
