simpleMeaning: A swelling on a testicle or the coiled tube beside it, usually containing sperm cells.
scope: This is a lump on the coiled tube beside the male part that makes seed cells, or on that part itself.
examples:
- The spermatocele sat on the coiled tube beside the testis.
- Most often, a spermatocele holds spermatozoa.
