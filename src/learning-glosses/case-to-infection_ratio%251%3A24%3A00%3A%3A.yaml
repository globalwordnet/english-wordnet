simpleMeaning: The share of people sick with the disease among people who picked it up through the germ
  that brings it on, worked out by division.
scope: Case-to-infection proportion is another name for this.
examples:
- The case-to-infection ratio rose as more cases came to light.
- Health workers tracked the case-to-infection ratio through the winter.
