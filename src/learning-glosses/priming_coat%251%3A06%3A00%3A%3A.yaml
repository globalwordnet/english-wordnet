simpleMeaning: A surface takes an opening layer of paint or gluey sealer before the main layers go on.
scope: Also called ground, primer, priming, a flat coat, a primer coat, and an undercoat. It is a layer.
examples:
- The painter put a priming coat on the wall first.
- Without a priming coat, the paint peeled off the wood.
