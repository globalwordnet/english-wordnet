simpleMeaning: A trailing European mint relative with round leaves and small purplish flowers, often grown
  in hanging baskets. It grows wild in North America and is sometimes classified in Nepeta.
scope: A creeping mint-family plant with round leaves and small purplish flowers, often grown in hanging
  baskets; also called alehoof, field balm, gill-over-the-ground, ground ivy, runaway robin, Glechoma
  hederacea, Glechoma hederaceae, and Nepeta hederacea.
examples:
- Nepeta hederaceae trails over the garden wall.
- Nepeta hederaceae smells sweet in the evening.
