simpleMeaning: In psychology, the slow change by which certain things that happen, above all those that
  stir strong feeling, come to affect a person more and more.
scope: Also called sensitisation, this slow change in psychology makes certain things affect a person
  more and more, not the state of being open to something in the body.
examples:
- Every raised voice upset them more once sensitization had set in.
- With sensitization, a familiar smell could stir strong feeling again and again.
