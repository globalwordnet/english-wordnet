synsetId: 00816326-n
simpleMeaning: In wrestling, a hold in which the legs lock round the other person's body or head, press
  hard, and keep the feet joined.
scope: This is also called scissors, scissor hold, scissors grip and scissors hold, and it is a wrestling
  hold made with the legs.
examples:
- The wrestler locked a scissor grip round the other and squeezed.
- A scissor grip held the other wrestler fast.
