simpleMeaning: A brand of doxepin, a tricyclic antidepressant also sold as Adapin. Possible side effects
  include dry mouth, sleepiness, and digestive problems.
scope: This is a drug that lifts low mood, with many side effects; doxepin, doxepin hydrochloride and
  Adapin are other names for it, and its nearest neighbours are the other drugs that lift low mood.
examples:
- Sinequan left her with a dry mouth.
- The doctor gave him Sinequan for his low mood.
