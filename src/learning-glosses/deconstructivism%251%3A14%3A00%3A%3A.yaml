simpleMeaning: A style of building that follows the ideas of a school of thought that reads books to find
  the contradictions inside them.
scope: This is a style of building, not a style of writing.
examples:
- The architect's work shows the influence of deconstructivism.
- The new wing of the museum was built in the style of deconstructivism.
