simpleMeaning: A soft, sweet, pear-shaped fruit made of many small fruits joined together. It is yellowish
  or purple and eaten fresh, preserved, or dried.
scope: A soft sweet fruit, pear-shaped and yellow or purple, not the tree that bears it and not a picture
  in a book.
examples:
- She ate a fresh fig from the tree.
- Dried figs keep well through the winter.
