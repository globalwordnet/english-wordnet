simpleMeaning: A change of heat and energy that keeps a closed system the same size.
scope: Also called isochoric process, isovolumetric process, and constant-volume process.
examples:
- In an isometric process the gas stays in a vessel of fixed size.
- The textbook described an isometric process in which the volume did not alter.
