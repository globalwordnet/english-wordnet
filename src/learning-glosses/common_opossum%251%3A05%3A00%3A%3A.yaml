simpleMeaning: An eastern US opossum that eats plants and animals, plays dead when threatened, is prized
  as food locally and is considered the same species as South America's crab-eating opossum.
scope: This is the pouched animal of the eastern United States that plays dead in danger and is eaten
  in some places.
examples:
- The common opossum played dead when it was in danger.
- A common opossum eats plants and animals.
