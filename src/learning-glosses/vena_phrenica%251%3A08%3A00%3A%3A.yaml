simpleMeaning: Either of two blood vessels that take blood away from the diaphragm.
scope: Also called phrenic vein. It is a blood vessel, not an artery.
examples:
- The surgeon tied off the vena phrenica during the operation on the diaphragm.
- The vena phrenica was clamped during the operation on the diaphragm.
