simpleMeaning: A resin from Australian trees that dissolves in alcohol. It is used in varnishes and in
  making paper.
scope: Accaroid resin, accroides, accroides gum, accroides resin, and gum accroides are other names for
  this sticky tree stuff from Australia, which dissolves in alcohol and goes into varnish and paper.
examples:
- From Australian trees, acaroid resin melts in alcohol.
- The varnish was made with acaroid resin.
