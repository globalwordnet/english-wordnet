simpleMeaning: A tall Colombian shrub with large leaves made of paired leaflets and one end leaflet. Fragrant
  yellow flowers grow in clusters where the leaves meet the stem.
scope: 'Also called Panama redwood and Platymiscium pinnatum: a big tall bush of Colombia, with big leaves
  of large leaflets and sweet-smelling yellow flowers in side bunches, a shrub rather than a tall tree.'
examples:
- The Panama redwood tree stood tall beside the path, its yellow flowers filling the air.
- We planted a Panama redwood tree in the garden for its sweet-smelling flowers.
