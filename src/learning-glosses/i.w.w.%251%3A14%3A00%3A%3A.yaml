simpleMeaning: The Industrial Workers of the World, an international radical labor union founded in Chicago
  in 1905. It sought to end capitalism, and membership fell after World War I.
scope: This is a past radical workers' union and workers' movement in many lands and the United States,
  set up in Chicago in 1905 to end capitalism; also called Industrial Workers of the World and IWW.
examples:
- The I.W.W. was set up in Chicago in 1905.
- Membership of the I.W.W. fell after the First World War.
