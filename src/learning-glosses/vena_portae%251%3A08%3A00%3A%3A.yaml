simpleMeaning: The short blood vessel by which blood enters the liver.
scope: Also called portal, hepatic portal vein, and portal vein. It is a blood vessel, not an artery.
examples:
- The surgeon clamped the vena portae during the operation on the liver.
- The scan showed a block in the vena portae.
