simpleMeaning: Used to break up crowds, this gas fills the eyes with watery drops but leaves them unharmed.
scope: This is also called a lachrymator, a lacrimator, and tear gas, not the act of attacking with it.
examples:
- The wind carried teargas over the crowd, and eyes began to water.
- Their eyes filled with watery drops from the teargas, but no harm was done.
