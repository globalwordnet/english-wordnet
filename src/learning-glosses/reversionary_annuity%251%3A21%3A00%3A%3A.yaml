synsetId: 13316206-n
simpleMeaning: Regular payments that go to one person if someone else can no longer receive them.
scope: Also called survivorship annuity. It is a payment.
examples:
- The reversionary annuity went to the second person named when the first could not take it.
- Under the reversionary annuity, the money went to a friend if the first person could not take it.
