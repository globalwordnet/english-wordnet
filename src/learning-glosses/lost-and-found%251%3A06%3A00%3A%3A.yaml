simpleMeaning: A place in a public building where things left behind are kept after being handed in until
  the people who own them come to take them back.
scope: It is a place in a public building.
examples:
- I left my umbrella on the train, so I went to the lost-and-found office to ask for it.
- The lost-and-found box at the library holds hats and gloves until their owners come back for them.
