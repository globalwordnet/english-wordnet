senseId: 'superstrate%1:10:00::'
synsetId: 06916748-n
simpleMeaning: The language of invaders who impose it on the people already living in a region, leaving
  traces in the local language.
scope: This language is also called superstratum; it is the tongue of later invaders, not a layer laid
  over another.
examples:
- Many words in the speech of the place came from the superstrate.
- The people kept their own speech, but the superstrate left its marks on it.
