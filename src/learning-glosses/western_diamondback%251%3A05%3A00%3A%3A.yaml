simpleMeaning: One of North America's largest rattlesnakes, with a bite that can be dangerous to humans.
  It lives in the southwestern United States and Mexico.
scope: 'Also called Crotalus atrox or the Western diamondback rattlesnake: the largest and most dangerous
  snake of North America, not the eastern diamondback and not a harmless snake.'
examples:
- The Western diamondback is the largest snake in North America.
- Hikers keep clear of the Western diamondback in the desert.
