simpleMeaning: This oil smells or tastes of the plant it comes from, and makers use it to give scent or
  taste to things.
scope: This is also called an essential oil, and it is not one with no smell of its own plant.
examples:
- They added a few drops of volatile oil from lavender to the cream.
- The volatile oil of peppermint gives the sweets their cool taste.
