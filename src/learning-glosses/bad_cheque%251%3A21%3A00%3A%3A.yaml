simpleMeaning: This written order tells a bank to pay money, but the bank refuses it when the order is
  shown, because the account does not hold enough money.
scope: Bad check is another name for this one.
examples:
- They paid with a bad cheque, and the bank sent it back unpaid.
- The bank refused the bad cheque because the account held too little money.
