simpleMeaning: The chemical symbol for vanadium, a soft, silvery-white metal used in steel alloys. It
  occurs in minerals such as carnotite and vanadinite and can be toxic.
scope: A soft grey-white metal that harms the body, used in steel alloys; also called atomic number 23
  and vanadium, and not the unit of push, and not the letter.
examples:
- Vanadium is used in steel alloys.
- Vanadium is a grey metal.
