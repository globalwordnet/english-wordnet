simpleMeaning: Fast-growing East Asian vine with starchy tubers, hairy three-part leaves, purple flower
  clusters and long hairy many-seeded pods. Grown for fodder and root starch, widespread in the southern
  US.
scope: Not other fast-growing vines, nor other plants grown for animal feed; also called kudzu and kudzu
  vine.
examples:
- Pueraria lobata covers the hillside.
- Farmers grow Pueraria lobata for animal feed.
