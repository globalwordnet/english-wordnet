simpleMeaning: To join the smallest parts of words that carry meaning in a line, in a language that joins
  word parts together.
scope: This one is not the sense in which things stick together in a lump.
examples:
- In that language, speakers agglutinate small word parts to build long words.
- The teacher showed how the language can agglutinate parts of words into one long word.
