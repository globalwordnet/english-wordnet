simpleMeaning: A place at a bank where money is kept, and the person who put it in can take it out by
  written order, paid when asked.
scope: This one is also called chequing account and current account.
examples:
- I opened a checking account so my pay could go straight into it.
- They wrote a check from the checking account to pay the rent.
