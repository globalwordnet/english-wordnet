simpleMeaning: A plant common in the central United States that resembles the common sunflower and has
  thin stems that usually branch.
scope: A plant like the flower most people know, with thin stems that most often branch, growing in the
  middle of the United States; not the common flower itself.
examples:
- Prairie sunflowers stood tall along the fence.
- The prairie sunflower looks much like the common one, but its stems branch more.
