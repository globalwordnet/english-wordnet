simpleMeaning: A usual way of doing things by the armed forces, done to mark an event or a day remembered
  each year.
scope: It is not the sense of a formal show put on by soldiers.
examples:
- The military ceremony marked the end of the war.
- A military ceremony was held to mark the tenth year since the battle.
