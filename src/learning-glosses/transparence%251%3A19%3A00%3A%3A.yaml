senseId: 'transparence%1:19:00::'
synsetId: 11541052-n
simpleMeaning: With this quality, nothing in a thing stops light or other rays from passing through it.
scope: This sense is also called transparency, and it is not the clearness that lets you see through a
  thing.
examples:
- The transparence of the glass let the sunlight pour in.
- They chose the material for its transparence, so the rays would pass through.
