simpleMeaning: At 225 degrees round from north, the compass point that lies between the direction straight
  down and the sunset side.
scope: Also called southwest, southwestward, and SW. It is a point.
examples:
- The wind blew from the sou'-west all afternoon.
- They walked sou'-west along the shore.
