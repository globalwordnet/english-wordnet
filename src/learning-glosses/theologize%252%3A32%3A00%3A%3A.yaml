simpleMeaning: A person treats a subject by what faith in God teaches, or makes the subject a matter of
  faith.
scope: This is also called theologise, and it does more than discuss points of belief.
examples:
- They theologized the idea of forgiveness.
- The book theologizes the story of the flood.
