simpleMeaning: Either of two acute viral diseases of domestic poultry. Affected birds refuse food, have
  a high temperature, and develop a discolored comb on the head.
scope: One of two sudden virus sicknesses of farm birds.
examples:
- The vet said the fowl pest had spread through the whole flock.
- After the fowl pest struck, the hens would not eat and their combs turned dark.
