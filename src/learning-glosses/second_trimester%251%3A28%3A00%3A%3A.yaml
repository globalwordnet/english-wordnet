simpleMeaning: A pregnancy's weeks from the thirteenth to the twenty-seventh make up this stretch.
scope: This is the stretch of a pregnancy from the thirteenth week to the twenty-seventh, between the
  early and late stretches.
examples:
- The pregnancy entered the second trimester in the fourteenth week.
- By the twentieth week, the pregnancy was in the second trimester.
