synsetId: 02239333-v
simpleMeaning: To share out again, giving each part a new share.
scope: Also called reallocate, it means sharing things out again in new shares, not giving them out for
  the first time.
examples:
- The seats will be reapportioned after the next count of the people.
- New counts of the people mean the seats get reapportioned again.
