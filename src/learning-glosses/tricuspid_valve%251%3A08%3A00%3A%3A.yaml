senseId: 'tricuspid_valve%1:08:00::'
synsetId: 05401339-n
simpleMeaning: A heart valve with three flaps between the right atrium and right ventricle. It lets blood
  enter the ventricle and prevents backward flow when the ventricle contracts.
scope: This sense is also called right atrioventricular valve.
examples:
- A tricuspid valve shut to stop back-flow.
- Tricuspid valves sit in the heart.
