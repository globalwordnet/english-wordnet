simpleMeaning: The last historical stage of the Egyptian language, used in Coptic Christian worship. Its
  alphabet is mainly Greek. Ge'ez is the traditional liturgical language of Ethiopia.
scope: The worship language of the church of Egypt, also called Coptic; written in Greek letters.
examples:
- The priest read the prayer in the Coptic language.
- The Coptic language is used in the worship of the church in Egypt.
