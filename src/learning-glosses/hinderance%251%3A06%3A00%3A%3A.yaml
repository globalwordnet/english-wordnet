simpleMeaning: Something in the way that slows things down or weighs heavily on them.
scope: This word is also called hitch, interference, hindrance, preventative, preventive, encumbrance,
  or incumbrance.
examples:
- The fallen tree was a hinderance on the road.
- A lack of money is often a hinderance to new plans.
