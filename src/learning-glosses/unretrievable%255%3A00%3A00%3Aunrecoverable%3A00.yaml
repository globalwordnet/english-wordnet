simpleMeaning: Said of a thing that can never be got back, made up for, or got past.
scope: Also called irretrievable. It is a word for a thing, not for a person.
examples:
- The unretrievable loss left the family with nothing.
- One unretrievable error in the plan ruined the whole trip.
