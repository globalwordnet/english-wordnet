simpleMeaning: 'The inverse of the sine function: it gives the angle whose sine is a given number.'
scope: 'Also called arc sine, arcsin, and inverse sine: the angle worked out from a given number, not
  the sine itself and not the angle from a different triangle ratio.'
examples:
- The arcsine of 0.5 is 30 degrees.
- He worked out the arcsine before drawing the angle.
