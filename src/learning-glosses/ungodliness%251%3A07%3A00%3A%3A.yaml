simpleMeaning: The state of showing no honour to God, and living without care for what is holy.
scope: Also called godlessness. It is a word for a way of living.
examples:
- The old book warned that ungodliness would bring ruin to the town.
- They spoke of the town's ungodliness with sorrow, not with anger.
