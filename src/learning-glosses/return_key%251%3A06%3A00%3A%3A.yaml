simpleMeaning: The button on an electric typewriter or a computer that ends the line you are typing and
  starts a fresh one.
scope: Also called return, this is the button that ends one line and starts the next on an electric typewriter
  or a computer.
examples:
- Pressing the return key moved the typing to the start of a new line.
- Each press of the return key began a fresh line below the last.
