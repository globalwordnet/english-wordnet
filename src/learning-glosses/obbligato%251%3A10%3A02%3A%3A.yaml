simpleMeaning: A musical phrase that keeps coming back, but stays in the background behind the main part
  of the music.
scope: Also called obligato. It is a noun.
examples:
- The obbligato runs through the whole piece, quiet under the main tune.
- They played the obbligato while the singer took the lead.
