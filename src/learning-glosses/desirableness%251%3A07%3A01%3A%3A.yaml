simpleMeaning: The quality of being liked and wanted by people of the other sex.
scope: This one is also called oomph, desirability, and sex appeal, and it is not the general quality
  of being worthy of wanting.
examples:
- The actor's desirableness won many admirers among people of the other sex.
- Many people of the other sex found the new singer's desirableness hard to resist.
