simpleMeaning: The manner of a thing that comes down hard and loud in a single moment.
scope: This manner is also called slap-bang, and it is not the careless or reckless manner of the same
  name.
examples:
- The pans fell slam-bang and woke the whole house.
- The lid came down slam-bang.
