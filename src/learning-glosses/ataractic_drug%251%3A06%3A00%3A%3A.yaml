simpleMeaning: This is what a person takes to bring worry or strain down, with the mind staying clear.
scope: Also called tranquilizer, tranquillizer, antianxiety agent, ataractic, ataractic agent, and tranquilliser,
  this is a medicine for worry and strain.
examples:
- They were given an ataractic drug after the accident, and they stayed calm through the night.
- The ataractic drug helped them face the long day without worry.
