simpleMeaning: To put together something imagined or not true.
scope: Also called invent, manufacture, fabricate, vamp, make up, and vamp up; this one is about a story
  or an excuse, not about preparing food.
examples:
- The student cooked up a story about the dog eating the homework.
- The manager cooked up an excuse for the late delivery.
