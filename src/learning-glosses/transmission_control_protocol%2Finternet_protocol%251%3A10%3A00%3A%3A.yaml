simpleMeaning: To move data between machines on a network, this set of rules, including TCP, one rule
  in the set, was made in the 1970s for use online.
scope: TCP/IP is another name for this sense, which is a set of rules for networks, not one rule by itself.
examples:
- They set up the network with transmission control protocol/internet protocol so the computers could
  share data.
- Without transmission control protocol/internet protocol, the machines on the network could not pass
  data to each other.
