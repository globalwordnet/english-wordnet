simpleMeaning: A baby not yet born has a white, cheese-like coat over its skin that guards it.
scope: This is also called vernix caseosa, and it is the white material that covers a fetus's skin, not
  a layer that forms after birth.
examples:
- The nurse wiped the vernix from the newborn's skin after the birth.
- A thin coat of vernix had covered the baby's skin in the womb.
