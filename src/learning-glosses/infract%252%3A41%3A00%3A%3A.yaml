simpleMeaning: To treat a law, a rule, a contract, or a promise as if it did not bind one.
scope: Break, offend, breach, violate, transgress, and go against are other names for it.
examples:
- They did not want to infract the terms of the lease.
- The club warned members not to infract its rules.
