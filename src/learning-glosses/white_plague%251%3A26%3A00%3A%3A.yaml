simpleMeaning: A historical name for tuberculosis of the lungs, which can cause progressive weight loss
  and weakness.
scope: Consumption, phthisis, pulmonary tuberculosis and wasting disease are other names for this lung
  sickness.
examples:
- They lay in bed for months with white plague, growing weaker all the time.
- They watched their sibling grow thin with white plague.
