simpleMeaning: A protein containing heme that carries electrons from one molecule to another, especially
  when cells release energy from food.
scope: In biochemistry, this is a group of red proteins in cells whose main work is passing tiny charged
  bits along.
examples:
- Cytochrome helps cells pass tiny charged bits along.
- Without cytochrome, cells could not use air to make power.
