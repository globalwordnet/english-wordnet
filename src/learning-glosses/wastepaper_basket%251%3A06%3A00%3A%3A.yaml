simpleMeaning: A container left open at the top, where people put used sheets and other rubbish they no
  longer want.
scope: Also called wastebasket, circular file, waste-paper basket, and waste basket. It is a container.
examples:
- They tossed the crumpled draft into the wastepaper basket.
- The wastepaper basket under the table held only old envelopes.
