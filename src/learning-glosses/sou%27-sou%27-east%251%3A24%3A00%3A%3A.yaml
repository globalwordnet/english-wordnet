senseId: 'sou''-sou''-east%1:24:00::'
synsetId: 13855318-n
simpleMeaning: The compass point halfway between the way to the bottom of a map and the point halfway
  between that way and where the sun comes up.
scope: Also called south southeast and SSE. It is a point.
examples:
- The ship headed sou'-sou'-east through the night.
- A wind from the sou'-sou'-east brought warm air.
