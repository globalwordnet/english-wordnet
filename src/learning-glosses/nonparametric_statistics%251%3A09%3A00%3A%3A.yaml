simpleMeaning: The branch of statistics that analyzes data without assuming a particular form for the
  underlying distribution or particular values for its parameters.
scope: Here values are worked with without first supposing the shape of their spread or the set numbers
  that fix it.
examples:
- The values were studied with nonparametric statistics.
- Nonparametric statistics made no suppositions about the spread of the values.
