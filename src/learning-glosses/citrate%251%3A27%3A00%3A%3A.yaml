simpleMeaning: A salt or ester derived from citric acid. An ester is a compound formed from an acid and
  an alcohol.
scope: A salt or ester of citric acid, not the verb that makes a thing form one.
examples:
- The drink held sodium citrate to keep it fresh.
- Citrate from lemons gives the juice its sharp taste.
