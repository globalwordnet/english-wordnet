simpleMeaning: A lizard with a venomous bite. Familiar examples are large, heavy-bodied lizards such as
  Gila monsters and beaded lizards. Other lizards also produce venom.
scope: This is one of the two or three kinds of large, heavy animal, not one of the harmless kinds.
examples:
- They kept the venomous lizard behind glass because its bite carries poison.
- The venomous lizard lay in the sun, its large, heavy body flat on the rock.
