simpleMeaning: Being unable to remember or think of something you would normally remember, often because
  of strong feelings or tension.
scope: It is also called a block.
examples:
- I knew his name perfectly well but I had a temporary block.
- In the exam, the student had a mental block and could not think of the word used every day.
