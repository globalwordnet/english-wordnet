simpleMeaning: A tulip tree gives wood that is light and easy to cut, used in furniture and as thin sheets
  of wood over other wood.
scope: Also called true tulipwood, tulipwood, white poplar, and whitewood. It is wood, not a tree.
examples:
- The table was made of yellow poplar.
- The carpenter chose yellow poplar for the drawer fronts.
