senseId: 'meteor%1:19:00::'
synsetId: 11504390-n
simpleMeaning: A streak of light produced when a space rock enters Earth's atmosphere at night and heats
  up enough to melt, vaporize, or break apart.
scope: A bright line of light in the night sky from a small space rock burning up, not the rock itself
  and not a star.
examples:
- We saw a bright meteor shoot across the night sky.
- A meteor flashed above the hills and was gone in a second.
