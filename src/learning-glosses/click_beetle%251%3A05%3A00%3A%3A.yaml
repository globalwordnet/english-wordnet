simpleMeaning: A hard-shelled insect that turns itself the right way up when it lies on its back by jumping
  into the air with a short sharp sound.
scope: It is an insect, not a sound.
examples:
- The click beetle lay on its back and then jumped into the air.
- A click beetle landed on its feet after flipping itself over.
