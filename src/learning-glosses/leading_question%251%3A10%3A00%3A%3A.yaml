simpleMeaning: Words put to someone so that they point to the answer the asker wants, which a lawyer may
  use with the other side's witness.
scope: It is a way of putting words to someone.
examples:
- The lawyer asked a leading question to get the wanted answer.
- They answered the leading question with the answer the lawyer wanted.
