senseId: 'resting_potential%1:19:00::'
synsetId: 11514687-n
simpleMeaning: In a nerve cell that is not sending a signal, the charge that sits across the thin cover
  of the cell, higher on one side than the other.
scope: This is the charge across a nerve cell's thin cover while the cell is quiet, higher on one side
  than the other, not the charge that moves when a signal passes.
examples:
- The resting potential of the nerve cell stayed steady while it sent no signal.
- When the nerve cell is quiet, a resting potential sits across its thin cover.
