simpleMeaning: The voltage across a nerve cell's membrane when the cell is not transmitting an impulse.
scope: The term describes a difference in electrical potential between the two sides of the membrane.
examples:
- The resting potential of the nerve cell stayed steady while it sent no signal.
- The experiment measured the resting potential across the membrane.
