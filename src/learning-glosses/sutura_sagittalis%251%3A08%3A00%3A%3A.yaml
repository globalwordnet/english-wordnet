simpleMeaning: This joint in the skull holds the two bones at the sides together.
scope: This is the seam in the skull joining the two side bones; interparietal suture and sagittal suture
  are other names for it.
examples:
- The scan showed the sutura sagittalis between the two side bones of the skull.
- Surgeons take care near the sutura sagittalis during an operation.
