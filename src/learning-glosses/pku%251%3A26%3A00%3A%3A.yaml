simpleMeaning: An inherited metabolic disorder in which an enzyme deficiency prevents normal conversion
  of phenylalanine to tyrosine. Phenylalanine builds up in body fluids and can impair intellectual development.
scope: Also called phenylketonuria; not a disease caught from others.
examples:
- The baby was tested for PKU soon after birth.
- Children with PKU follow a special diet.
