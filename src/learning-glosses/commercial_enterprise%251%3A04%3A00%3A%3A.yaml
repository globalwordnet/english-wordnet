simpleMeaning: The work of supplying goods and doing services, with money matters, trade, and factory
  work all part of it.
scope: Business and business enterprise are other names for it, and this one is about the work itself,
  not a firm that does it.
examples:
- Running a commercial enterprise takes time, money, and a good team.
- The town's commercial enterprise supplied food, clothes, and tools to everyone in the area.
