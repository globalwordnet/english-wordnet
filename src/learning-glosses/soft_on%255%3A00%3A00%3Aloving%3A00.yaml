simpleMeaning: A fondness for someone that is silly and pays no heed to sense.
scope: Also called enamored, smitten, potty, infatuated, in love, and taken with, this is a fondness that
  lets feeling run ahead of sense.
examples:
- He was soft on her.
- They were soft on each other.
