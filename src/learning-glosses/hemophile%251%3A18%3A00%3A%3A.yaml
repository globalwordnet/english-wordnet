simpleMeaning: A person who suffers from blood that will not clot, and bleeds that cannot be held back.
scope: This person is also called a bleeder, a haemophile, a haemophiliac, or a hemophiliac.
examples:
- The hemophile carried medicine for sudden bleeding.
- A hemophile must take care to avoid injury.
