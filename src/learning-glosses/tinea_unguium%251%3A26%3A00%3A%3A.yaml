simpleMeaning: A fungal infection of the nails, especially the toenails.
scope: This is a sickness of the nails, above all of the toenails, not a sickness of the skin alone.
examples:
- They went to the doctor about the tinea unguium on their toenails.
- The tinea unguium had spread from one toenail to the next.
