simpleMeaning: To fix in advance, by God's will or command, what will happen to someone or something.
scope: It is also called predestine or foreordain. It is an act of God, not a choice made by a person.
examples:
- God predestinated the outcome before the world began.
- The old book says that God predestinates all who are called.
