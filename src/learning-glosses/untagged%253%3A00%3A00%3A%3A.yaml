simpleMeaning: Said of a thing with no label or mark on it to say what it is.
scope: Also called unlabeled and unlabelled. It is said of a thing, not of a person.
examples:
- The untagged box sat in the corner of the room.
- They picked up the untagged coat and asked whose it was.
