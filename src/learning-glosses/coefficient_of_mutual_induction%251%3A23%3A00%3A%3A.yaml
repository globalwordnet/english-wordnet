senseId: 'coefficient_of_mutual_induction%1:23:00::'
synsetId: 13608439-n
simpleMeaning: A measure of how two circuits interact, calculated from the voltage induced in one divided
  by the rate of current change in the other, usually expressed in henries.
scope: A gauge of the pull between two wire loops, also called mutual inductance.
examples:
- The coefficient of mutual induction is sized in henries.
- A high coefficient of mutual induction links the loops.
