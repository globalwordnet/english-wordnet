simpleMeaning: A Palestinian political movement formed in 1964, led by Yasser Arafat from 1968, recognised
  by the UN in 1974, seeking an independent state and now largely political.
scope: The Palestine Liberation Organization is also called the PLO.
examples:
- The Palestine Liberation Organization was formed in 1964.
- The Palestine Liberation Organization seeks an independent Palestine.
