senseId: 'unambiguity%1:07:00::'
synsetId: 04829033-n
simpleMeaning: The clearness that comes when nothing is left open to more than one meaning.
scope: Also called unequivocalness, this is clearness, not clearness that still leaves room for doubt.
examples:
- They praised the unambiguity of the contract.
- The lawyer checked the unambiguity of every line in the agreement.
