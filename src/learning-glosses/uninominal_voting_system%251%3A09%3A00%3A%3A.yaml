simpleMeaning: The rule that each electoral district chooses a single representative, such as a lawmaker.
scope: Also called scrutin uninomial system, scrutin uninominal voting system, single-member system, and
  uninominal system. It is a rule for choosing, not a way of adding up ballots.
examples:
- Under the uninominal voting system, each district elects a member to parliament.
- The uninominal voting system gives every district a single representative.
