simpleMeaning: A monetary system that defines the basic unit of currency as a specified quantity of silver.
scope: This names a money system in which the basic unit of a country's money is set by a stated amount
  of pale white metal.
examples:
- The bank holds pale white metal under the silver standard.
- A country on the silver standard backs its money with pale white metal.
