simpleMeaning: A method of keeping the books, where each item is written down as money is paid in or paid
  out.
scope: This one is about keeping the books, not about writing items down when they are earned or owed.
examples:
- The shop keeps its accounts on a cash basis.
- They changed to a cash basis so that income counted only when the money arrived.
