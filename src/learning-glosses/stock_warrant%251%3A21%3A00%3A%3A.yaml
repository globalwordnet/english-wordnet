simpleMeaning: A security issued by a company, usually with a bond or preferred stock, giving its holder
  the right to buy a fixed number of common shares at a stated price.
scope: This sense is also called warrant and stock-purchase warrant, and it is not the paper that works
  only for a set time.
examples:
- As a sweetener they offered stock warrants along with the fixed-income securities.
- They held a stock warrant from the firm.
