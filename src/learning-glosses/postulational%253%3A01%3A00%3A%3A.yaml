senseId: 'postulational%3:01:00::'
synsetId: 02664090-a
simpleMeaning: Having to do with first truths that need no proof, or with what follows from them.
scope: Also called axiomatic and axiomatical. It is a word for what rests on first truths, not for the
  truths themselves.
examples:
- The postulational method was applied to geometry.
- A postulational proof starts from claims taken as true without proof.
