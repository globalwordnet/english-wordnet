senseId: 'stultification%1:10:00::'
synsetId: 06729931-n
simpleMeaning: Called silly, absurd, or at odds with itself, a person or thing is met with laughter.
scope: This is also called befooling, and it is scorn for what is silly, not the act of making something
  useless.
examples:
- They answered the plan with stultification.
- They met the new idea with stultification.
