simpleMeaning: A person who knows a lot about old objects from the past or collects them.
scope: Also called antiquarian or archaist, this one names a person, not an old object itself.
examples:
- The local antiquary spent years tracking down Roman coins for the museum collection.
- They asked an antiquary to tell them whether the old vase was real.
