simpleMeaning: One of the muscles in the heart that help the valves between its upper and lower chambers
  close properly.
scope: It is a band of flesh.
examples:
- The papillary muscles contract during systole to prevent regurgitation of blood into the atria.
- The doctor looked at the papillary muscle on the scan of the heart.
