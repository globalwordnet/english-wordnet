simpleMeaning: A medium-sized fir of northeastern North America. Its crushed leaves smell of balsam. The
  tree is widely used for paper pulp and as a Christmas tree.
scope: A fir tree of north-eastern North America, also called balsam fir, Abies balsamea and Canada balsam;
  set apart from other fir trees and from other trees used for Christmas trees.
examples:
- The balm of Gilead grows across north-eastern North America.
- Crush a leaf of the balm of Gilead and it smells sweet.
