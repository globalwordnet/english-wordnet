simpleMeaning: The quality of doing things in a clumsy and awkward way, carried too far.
scope: This quality is also called ham-fistedness or ham-handedness.
examples:
- What seemed sharp and pointed onstage comes across pedantically in the film, which treats its subject
  with a clumsy heavy-handedness.
- Their heavy-handedness made the simple job take twice as long.
