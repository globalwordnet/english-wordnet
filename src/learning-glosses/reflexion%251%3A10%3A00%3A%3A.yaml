senseId: 'reflexion%1:10:00::'
synsetId: 06779826-n
simpleMeaning: Words spoken or put on paper that let others see the care that went into the thinking.
scope: 'This is also called reflection and observation: the remark itself, not the long thinking behind
  it and not light turning back off a surface.'
examples:
- The reflexion on the meeting was short but showed real care.
- The reflexion in the letter showed every word had been weighed with care.
