simpleMeaning: In psychoanalytic theory, a personality shaped by fixation at the oral stage of early childhood,
  characterized by generous optimism or aggressive, ambitious selfishness.
scope: 'In mind-study: a make-up from the mouth stage of childhood, hopeful or pushy and self-loving.'
