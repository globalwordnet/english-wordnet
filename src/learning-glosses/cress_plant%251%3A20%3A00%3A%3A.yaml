simpleMeaning: Any of various living things rooted in the ground, of the family Cruciferae, with leaves
  that are good to eat and have a sharp, strong taste.
scope: Also called cress, this one is about a living thing rooted in the ground, not the leaves on their
  own.
examples:
- A cress plant grew beside the stream.
- They picked leaves from the cress plant for a salad.
