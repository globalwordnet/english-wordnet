simpleMeaning: A widely grown walnut tree from Europe and Asia, valued for its large edible nuts and its
  hard, richly patterned wood.
scope: Also called Circassian walnut, English walnut, English walnut tree, or Persian walnut; this is
  the tree from Europe and Asia, not other kinds of walnut trees.
examples:
- The Juglans regia in the orchard gives large nuts.
- We planted a Juglans regia for its shade and nuts.
