simpleMeaning: A gemstone that can be polished to a high shine. It is usually green but can be whitish.
  It consists of either jadeite or nephrite.
scope: A hard green stone that shines when polished, not the pale green colour and not the green of a
  thing.
examples:
- She wore a jade ring carved from pale green stone.
- The jade beads shone bright green in the light.
