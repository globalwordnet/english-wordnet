simpleMeaning: A thing put where people can look at it, or the act of putting something where people can
  look at it.
scope: It is also called presentation and demonstration. It is a show, not an accusation.
examples:
- The presentment of the new plans drew a large crowd.
- Their presentment of the data was clear and easy to follow.
