simpleMeaning: A personality questionnaire based on Hans Eysenck's analysis of three basic factors, especially
  extraversion versus introversion and neuroticism, the tendency to experience emotional distress.
scope: A set of questions a person answers about themselves, from a study of character, also called EPI;
  it measures character, not knowledge or skill.
examples:
- The Eysenck Personality Inventory asks about how outgoing you are.
- She took the Eysenck Personality Inventory as part of the research.
