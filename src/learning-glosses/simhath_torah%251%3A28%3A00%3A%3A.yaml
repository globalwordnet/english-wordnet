simpleMeaning: A Jewish holiday on the 22nd or 23rd of Tishri celebrating the completion of the annual
  cycle of Torah readings.
scope: Also called Rejoicing in the Law, Rejoicing of the Law, Rejoicing over the Law, Shimchath Torah,
  Simchas Torah, Simchat Torah, and Simhat Torah; the Jewish holy day that ends the year's cycle of readings.
examples:
- Simhath Torah falls on the 22nd or 23rd of Tishri.
- On Simhath Torah the last reading of the year is finished.
