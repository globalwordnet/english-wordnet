senseId: 'unreconstructed%3:00:00::'
synsetId: 00289675-a
simpleMeaning: A person holds on to views that most people now see as old and out of date.
scope: This word names a person, not one who has taken up new ones.
examples:
- The farmers stayed unreconstructed in their views long after their neighbours had changed theirs.
- Even after the reforms, a few unreconstructed voices in the council kept arguing for the old rules.
