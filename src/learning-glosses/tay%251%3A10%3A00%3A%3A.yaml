simpleMeaning: A Tai language spoken in central and northeastern Vietnam near China, including Cao Bang
  and Lang Son, southward in Lam Dong, Tung Nghia, and Song Mao, and possibly in Laos.
scope: Also called Tho; not a different Tai language such as Thai or Lao.
examples:
- Tay is spoken in the north-east of Vietnam.
- Many Tay speakers live near the border with China.
