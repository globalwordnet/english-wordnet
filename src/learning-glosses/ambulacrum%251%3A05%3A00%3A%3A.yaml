simpleMeaning: One of five parts on the lower side of a sea animal with a hard, spiny skin, where its
  small walking tubes sit.
scope: This one is a part of the animal, not the animal itself.
examples:
- The ambulacrum runs along the lower side of the starfish.
- They found tube feet along each ambulacrum of the sea urchin.
