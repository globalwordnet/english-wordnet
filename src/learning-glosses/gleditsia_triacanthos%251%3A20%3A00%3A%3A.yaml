simpleMeaning: Tall, usually thorny North American tree bearing hanging greenish-white flower clusters,
  long twisted pods and hard, durable reddish-brown wood. People introduced it to temperate Old World
  regions.
scope: 'Also called honey locust: a tall North American tree with long twisting pods, not a black locust
  tree and not a thorn bush.'
examples:
- The Gleditsia triacanthos in the park has long twisting pods.
- We planted a Gleditsia triacanthos for shade.
