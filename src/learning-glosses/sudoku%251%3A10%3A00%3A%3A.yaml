simpleMeaning: A number puzzle in which each row, column, and three-by-three box of a nine-by-nine grid
  must contain every digit from one to nine once.
scope: A number puzzle with 1 to 9 in a grid, each number once in every row and line down, not a word
  puzzle and not a maths test.
examples:
- She does a sudoku every morning with her coffee.
- The sudoku in today's paper was hard to finish.
