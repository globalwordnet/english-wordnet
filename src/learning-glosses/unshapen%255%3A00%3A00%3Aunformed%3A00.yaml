senseId: unshapen%5:00:00:unformed:00
synsetId: 02159493-s
simpleMeaning: Said of a thing whose form is still not finished, or is finished poorly.
scope: Also called unshaped. It is used of things, not of people.
examples:
- The unshapen dough sat in the bowl, waiting for the baker.
- They left the unshapen timbers outside to dry.
