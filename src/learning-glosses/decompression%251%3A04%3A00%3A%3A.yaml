senseId: 'decompression%1:04:00::'
synsetId: 00358277-n
simpleMeaning: A reduction in pressure, especially a gradual return to normal atmospheric pressure for
  someone who has been under high pressure.
scope: Also called decompressing; the easing of pressure, especially bringing a person back to outside
  air pressure step by step, not the restoring of squeezed computer data.
examples:
- Decompression took an hour after the deep dive.
- The diver's decompression was slow and careful.
