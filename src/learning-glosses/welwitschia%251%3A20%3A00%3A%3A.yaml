synsetId: 11619775-n
simpleMeaning: Arid southwestern African plant with yard-high, yard-wide turniplike trunk, deep taproot
  and two lasting, woody, strap-shaped basal leaves. Its ancient relatives disappeared. Estimated ages
  include 700–5,000 years.
scope: The plant itself; the word has no other common sense, so it does not refer to a place, a person,
  or a product.
examples:
- The welwitschia survives on fog and dew in one of the driest parts of Namibia.
- Some welwitschias are thought to be over a thousand years old.
