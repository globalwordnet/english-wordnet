simpleMeaning: Leaving a place to live somewhere else, in particular leaving the country where one was
  born to settle in another country.
scope: Also called emigration or expatriation. It is a move.
examples:
- Out-migration from the town rose when jobs became scarce.
- The book looks at out-migration from the countryside.
