simpleMeaning: The bottom bone that holds the teeth, in a creature with a spine, swinging on a joint to
  open the mouth.
scope: It is also called jowl, jawbone, mandible, lower jawbone, mandibula, mandibular bone, and submaxilla.
examples:
- The lower jaw of the dog moved as it chewed.
- A broken lower jaw makes it hard to eat.
