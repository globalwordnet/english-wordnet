simpleMeaning: The amount of water a composite material takes up when immersed in water for a specified
  time.
scope: This is a measure of the liquid taken in, not of the material itself.
examples:
- They measured the water absorption of the new plastic after leaving it under water for a day.
- They compared the water absorption of several plastics before they chose one.
