simpleMeaning: A cart with two seats, whose axle hangs low underneath.
scope: Also called donkey cart, pony cart, and ponycart, this name is for a vehicle with its axle slung
  low, not for one with its axle high up.
examples:
- Two people sat side by side in the tub-cart.
- The tub-cart rolled past with its axle hung low underneath.
