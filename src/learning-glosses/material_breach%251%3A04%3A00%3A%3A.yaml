simpleMeaning: A failure to keep a deal so serious that it ruins what the deal was worth and gives grounds
  to sue over it.
scope: It is a matter of contract law.
examples:
- The builder's delay was a material breach of the contract.
- They sued for material breach after the firm failed to deliver.
