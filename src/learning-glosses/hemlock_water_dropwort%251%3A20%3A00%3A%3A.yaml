simpleMeaning: A highly poisonous European plant with thick roots and leaves that resemble celery. Every
  part of the plant is poisonous.
scope: Hemlock water dropwort is the common name for Oenanthe crocata. All parts of the plant are highly
  poisonous.
examples:
- The warning sign identified the plant as hemlock water dropwort.
- Every part of the hemlock water dropwort is extremely poisonous.
