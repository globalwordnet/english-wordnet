simpleMeaning: Said of work that needs long training or is done in an office, paid a set amount each month,
  or of the people who do such work.
scope: It is about a kind of work, not about a kind of clothing.
examples:
- The coal miner's son aspired to a white-collar occupation as a bookkeeper.
- Many white-collar workers in the city ride the train to their offices each day.
