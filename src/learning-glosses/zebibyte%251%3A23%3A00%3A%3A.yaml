simpleMeaning: A unit of information holding 1,180,591,620,717,411,303,424 groups of eight binary digits,
  which is 1024 groups of 1,152,921,504,606,846,976 groups of eight binary digits.
scope: Also called zettabyte, ZB, and ZiB. It is a unit.
examples:
- They measured the data centre's storage in zebibytes.
- The archive grew to several zebibytes over the years.
