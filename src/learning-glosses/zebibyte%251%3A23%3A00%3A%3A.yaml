simpleMeaning: A unit of data equal to 1,024 exbibytes, or 2 to the power of 70 bytes.
scope: Also called zettabyte, ZB, and ZiB. It is a unit.
examples:
- They measured the data centre's storage in zebibytes.
- The archive grew to several zebibytes over the years.
