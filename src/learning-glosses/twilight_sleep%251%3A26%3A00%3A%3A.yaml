senseId: 'twilight_sleep%1:26:00::'
synsetId: 14053566-n
simpleMeaning: A historical form of sedation during childbirth that left some awareness while reducing
  pain and memory, commonly associated with scopolamine and morphine.
scope: This state leaves a person with a small share of awareness while drugs dull the whole body.
examples:
- Twilight sleep left her half aware.
- A shot of morphine brought on twilight sleep.
