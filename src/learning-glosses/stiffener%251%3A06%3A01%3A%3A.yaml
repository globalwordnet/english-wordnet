senseId: 'stiffener%1:06:01::'
synsetId: 92460091-n
simpleMeaning: A piece fixed to the middle plate of a beam, to keep that plate from bending and the beam
  from losing strength.
scope: This is not the material used for stiffening something.
examples:
- The workers fitted a stiffener to the beam to stop the web bending.
- A stiffener keeps the beam strong when heavy loads press on it.
