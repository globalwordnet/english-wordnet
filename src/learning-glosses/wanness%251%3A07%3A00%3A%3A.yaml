simpleMeaning: The skin shows less colour than it should, after a bruise, an illness, or upset of the
  feelings.
scope: This is also called pallor, paleness, achromasia, lividity, lividness, luridness, or pallidness,
  and it is not the colour of healthy skin.
examples:
- The wanness of their face after the illness showed how weak they still were.
- They noticed the wanness in their skin where the bruise had been.
