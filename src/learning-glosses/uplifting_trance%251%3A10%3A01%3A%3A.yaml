simpleMeaning: Listeners say this big kind of trance music gives them a feeling they often call a rush,
  and the music is named for that feeling.
scope: This music is also called anthem trance, and it is not the darker Goa sound or the progressive
  kind.
examples:
- The uplifting trance track gave them the rush they had come for.
- They played uplifting trance at the party, and the crowd felt the rush.
