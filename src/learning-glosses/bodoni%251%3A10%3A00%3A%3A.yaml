simpleMeaning: A typeface based on Bodoni's 18th-century design, with regularly shaped letters, very thin
  finishing strokes, and thick downstrokes.
scope: A style of printed letters with thin end lines and heavy upright strokes; also called modern, modern
  font and Bodoni font, not a hand-written script.
examples:
- The book was set in Bodoni.
- Bodoni gives a page a sharp, formal look.
