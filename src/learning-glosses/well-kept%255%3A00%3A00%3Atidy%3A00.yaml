simpleMeaning: Said of something that shows good order, with everything neat and tidy and nothing out
  of order.
scope: Also called trim and shipshape. It is said of a place or a thing.
examples:
- The well-kept garden had neat rows and no weeds.
- They lived in a well-kept house with clean floors and tidy rooms.
