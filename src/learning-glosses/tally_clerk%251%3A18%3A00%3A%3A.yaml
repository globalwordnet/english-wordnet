simpleMeaning: By amount or by weight, this clerk keeps count of goods made, sent out, or taken in.
scope: This person records how much there is of goods made, sent out, or taken in.
examples:
- The tally clerk kept count of the goods as they came in.
- The tally clerk wrote down the weight of the goods sent out.
