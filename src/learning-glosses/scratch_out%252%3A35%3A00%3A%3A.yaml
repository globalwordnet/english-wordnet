simpleMeaning: To cancel something by rubbing it away or by putting a line through it, or as if that had
  been done.
scope: Cut out is another name for this way of cancelling by rubbing away or crossing through.
examples:
- Please scratch out my name on that list.
- The wrong entry was scratched out.
