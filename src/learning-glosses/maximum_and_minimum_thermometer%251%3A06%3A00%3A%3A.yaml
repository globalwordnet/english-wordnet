simpleMeaning: A thermometer that records the highest and lowest temperatures reached over a period.
scope: The readings show both extremes since the thermometer was last reset.
examples:
- The gardener checked the maximum and minimum thermometer each morning to see how cold the night had
  been.
- The maximum and minimum thermometer recorded a high of 24 degrees and a low of 12 degrees.
