simpleMeaning: A device for measuring temperature that keeps a record of the highest temperature reached
  in a stretch of time, as well as the lowest reached in the same stretch.
scope: It is a device.
examples:
- The gardener checked the maximum and minimum thermometer each morning to see how cold the night had
  been.
- The maximum and minimum thermometer in the greenhouse kept a record of the hottest and coldest hours.
