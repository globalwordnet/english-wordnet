senseId: 'antipodal%1:24:00::'
synsetId: 13851456-n
simpleMeaning: The way two things stand exactly across from each other on a straight line through the
  middle.
scope: Also called antipodal opposition and diametrical opposition, this one names a relation, not a word
  that describes places on opposite sides of the earth.
examples:
- The antipodal points lie at the two ends of the same line through the earth.
- They marked the antipodal spots on the globe with two small flags.
