senseId: 'dictyosome%1:08:00::'
synsetId: 05442133-n
simpleMeaning: A net-like structure in the jelly-like stuff inside the cells of animals, especially in
  the cells that make liquids the body gives out.
scope: This one is also called the Golgi apparatus, the Golgi body, or the Golgi complex.
examples:
- The dictyosome in the cell looked like a net under the microscope.
- The dictyosome helped the cell send out the liquids it makes.
