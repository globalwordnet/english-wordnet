synsetId: 13309360-n
simpleMeaning: Each tenant who shares a property holds this interest, with the same freedom as the others
  to use every part of it.
scope: Also called undivided right, this is the shared stake in a property, not a piece of it owned by
  one tenant alone.
examples:
- The tenants held an undivided interest in the house they shared.
- With an undivided interest, each tenant had the same right to enjoy the whole garden.
