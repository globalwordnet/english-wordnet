senseId: separative%5:00:00:distributive:00
synsetId: 00471161-s
simpleMeaning: Said of a word that picks out each member of a group one by one, leaving none out.
scope: It is an adjective.
examples:
- When the teacher said 'which of you is ready', the separative 'which' pointed to each pupil in turn.
- The separative use of 'every' takes the members of the class one at a time.
