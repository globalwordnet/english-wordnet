simpleMeaning: The use of one metonymy, a word that stands for something it is linked to, in place of
  another.
scope: It is a figure of speech.
examples:
- Calling the crew 'fifty sails' is metalepsis, since the word stands for the ship and then for the people
  on it.
- The teacher showed how metalepsis builds one figure of speech on top of another.
