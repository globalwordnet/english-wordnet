senseId: 'acclimatization%1:22:00::'
synsetId: 13445816-n
simpleMeaning: The state of feeling at home in the weather of a new place, with its heat or cold, its
  height, or its surroundings.
scope: This one is also called acclimation and acclimatisation.
examples:
- Their acclimatization to high places came with short walks.
- The team's acclimatization was helped by drinking water and resting in the shade.
