senseId: 'achlamydeous%3:00:00::'
synsetId: 00366761-a
simpleMeaning: Describing a flower that lacks both petals and sepals, the parts that usually surround
  its reproductive organs.
scope: This one is the opposite of a flower with a ring of leaves around it.
examples:
- The achlamydeous flower opened with no ring of leaves around its centre.
- They noted the achlamydeous bloom among the others, which all had green outer leaves.
