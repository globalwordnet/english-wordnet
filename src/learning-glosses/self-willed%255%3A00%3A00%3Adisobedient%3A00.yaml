simpleMeaning: One who refuses to be told what to do, and pushes back whenever others ask.
scope: Also called willful, headstrong, wilful and froward, this names the habit of refusing to be told
  what to do and pushing back whenever others ask.
examples:
- They were self-willed and would not obey the rules.
- Their self-willed ways showed whenever orders came.
