senseId: 'subordinating_conjunction%1:10:00::'
synsetId: 06337219-n
simpleMeaning: Words such as since, that, or who bring in a clause that leans on another clause to make
  sense.
scope: This sense is also called subordinate conjunction, and it is the word itself, not the act of joining
  one part of a sentence to another.
examples:
- In 'I will go when you call', when is a subordinating conjunction.
- They joined the two clauses with a subordinating conjunction.
