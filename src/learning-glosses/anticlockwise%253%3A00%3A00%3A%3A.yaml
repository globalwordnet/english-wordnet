simpleMeaning: Moving in the direction that is the reverse of the way a timepiece's hands turn.
scope: Also called counterclockwise or contraclockwise, this word is not about going with the hands of
  a timepiece.
examples:
- They turned the lid anticlockwise to open the jar.
- The dancers moved anticlockwise around the hall.
