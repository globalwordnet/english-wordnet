simpleMeaning: To do with plants, animals, or crystals that have parts like needles.
scope: This one is said of a whole plant, animal, or crystal, not of a single needlelike part.
examples:
- They studied the aciculate spines on the sea urchin.
- The aciculate crystals in the rock glittered in the sun.
