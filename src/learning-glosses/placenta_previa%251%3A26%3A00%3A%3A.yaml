senseId: 'placenta_previa%1:26:00::'
synsetId: 14072329-n
simpleMeaning: A condition in which the placenta covers the opening of the cervix. It can cause bleeding
  late in pregnancy and may require delivery by cesarean section.
scope: The cervix is the lower part of the womb that opens into the vagina.
examples:
- She had bleeding late in pregnancy because of placenta previa.
- She had a cesarean delivery because of placenta previa.
