senseId: connotative_of%5:00:00:connotative:00
synsetId: 00726839-s
simpleMeaning: Said of a thing that has to do with the feelings or ideas that a word brings to mind as
  well as its plain meaning.
scope: Also called connotational. It is about words.
examples:
- The word 'home' is connotative of warmth and safety.
- Their choice of words was connotative of anger, not calm.
