senseId: 'adulteration%1:26:00::'
synsetId: 14511027-n
simpleMeaning: The mixing of a thing with material from outside, or the thing made by such mixing.
scope: Debasement is another name for this sense, while the other sense of this word names only the act
  of mixing.
examples:
- They found adulteration in the milk, mixed with material from outside.
- The shop sold flour, but its adulteration with chalk was soon found out.
