simpleMeaning: A Chinese tree with separate male and female trees, fan-shaped leaves that fall yearly,
  and fleshy yellow seeds. Almost all are cultivated, especially to decorate streets.
scope: A Chinese tree that loses its leaves, with male and female trees, fan-shaped leaves and fleshy
  yellow seeds, also called gingko, ginkgo and maidenhair tree; not a pine and not a fruit tree.
examples:
- Ginkgo biloba lines the street with yellow leaves in autumn.
- A Ginkgo biloba grows in the park.
