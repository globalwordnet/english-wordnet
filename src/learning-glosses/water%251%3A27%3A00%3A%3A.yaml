simpleMeaning: A clear, colorless, odorless, tasteless compound of hydrogen and oxygen, liquid at room
  temperature. At standard pressure it freezes at 0°C and boils at 100°C. It dissolves many substances.
scope: Freezes at 0°C and boils at 100°C; not the old philosophical element.
examples:
- Drink plenty of water.
- Ice is frozen water.
