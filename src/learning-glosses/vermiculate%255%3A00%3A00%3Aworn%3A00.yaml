simpleMeaning: Worms have got into this thing and spoiled it, as if by eating it.
scope: This is also called wormy or worm-eaten, not a thing marked with worm-like lines.
examples:
- The vermiculate beams in the old barn were full of tiny holes.
- They threw out the vermiculate flour, spoiled by worms.
