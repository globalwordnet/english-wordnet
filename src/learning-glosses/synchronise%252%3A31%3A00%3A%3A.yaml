senseId: 'synchronise%2:31:00::'
synsetId: 00737871-v
simpleMeaning: To make events happen together in time, whether by setting them out or by showing them.
scope: This is also called synchronize, contemporise, or contemporize, and it is not making things run
  in step by changing their timing.
examples:
- The film makers synchronise the sound with the picture so the words match the lips.
- The writer tried to synchronise the two stories so that both reach the same point at once.
