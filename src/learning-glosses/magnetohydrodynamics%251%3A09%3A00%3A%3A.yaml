simpleMeaning: The study of how magnetic fields interact with electrically conducting fluids, such as
  plasma or molten metal.
scope: It names the study of charged fluids and the pulls that work on them.
examples:
- Magnetohydrodynamics looks at hot gas and the pulls that work on it.
- Melted metal and the pulls that work on it fall under magnetohydrodynamics.
