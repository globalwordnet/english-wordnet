simpleMeaning: A ring of smooth muscle in the colored part of the eye that tightens to make the pupil
  smaller.
scope: The muscle surrounds the pupil, the opening at the center of the iris.
examples:
- In bright light, the musculus sphincter pupillae makes the pupil smaller.
- The diagram shows the musculus sphincter pupillae inside the iris.
