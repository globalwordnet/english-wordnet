simpleMeaning: A boss who pushes the people under them to do far more work than is fair, with a hard,
  unkind hand.
scope: People also call such a boss Simon Legree, and this is not a person who watches over forced workers
  at work.
examples:
- The staff called their new manager a slave driver.
- Everyone knew the manager was a slave driver.
