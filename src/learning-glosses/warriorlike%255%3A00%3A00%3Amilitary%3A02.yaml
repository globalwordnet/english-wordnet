simpleMeaning: Said of a person who acts as a fighter should.
scope: Also called martial, soldierly, and soldierlike. It is said of a person, not of a thing.
examples:
- They faced the danger in a warriorlike way, without fear.
- The warriorlike stand won the crowd's praise.
