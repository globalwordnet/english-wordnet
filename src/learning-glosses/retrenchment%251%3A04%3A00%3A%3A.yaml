simpleMeaning: A reduction in spending intended to restore financial stability.
scope: It means cutting back on what is spent, so that the money is steady again, also called downsizing
  or curtailment, not an extra wall built inside a fort.
examples:
- The money grew steady again after retrenchment cut what was spent.
- Cuts in spending through retrenchment made the money steady again.
