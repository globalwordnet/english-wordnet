simpleMeaning: A rifle designed for accurate long-distance shooting, especially in military use. Some
  models are powerful enough to damage equipment.
scope: It is also called precision rifle, a very strong long gun made for soldiers that can wreck light
  armoured vehicles and planes from over a mile away.
examples:
- The sniper rifle wrecked the light vehicle from over a mile away.
- A sniper rifle can destroy a plane more than a mile away.
