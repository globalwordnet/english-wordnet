simpleMeaning: A furnace that extracts iron from iron oxide ores by smelting. A blast of air makes the
  fuel burn more intensely.
scope: This large oven is the one that melts iron out of iron-bearing rock, its fire made hotter by a
  strong rush of air.
examples:
- They melt iron out of rock in the blast furnace.
- A strong rush of air feeds the blast furnace.
