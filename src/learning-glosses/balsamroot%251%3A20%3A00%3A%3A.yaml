simpleMeaning: A Balsamorhiza plant with soft, hairy leaves in a ring at its base, yellow flowers, and
  long taproots that smell of balsam.
scope: A plant with soft hairy leaves in a flat ring at its base and yellow flowers, not a sunflower and
  not a daisy.
examples:
- Balsamroot covers the dry hillsides with yellow flowers in spring.
- The balsamroot has soft hairy leaves in a flat ring at its base.
