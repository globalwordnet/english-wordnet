simpleMeaning: The bonobo, a small great ape of the swamp forests of the Democratic Republic of the Congo,
  formerly Zaire. It is threatened with extinction.
scope: 'Also called a bonobo: a small ape of the wet forests of Zaire, not a common chimpanzee and not
  a monkey.'
examples:
- The pygmy chimpanzee swung through the trees near the river.
- A pygmy chimpanzee is smaller than the chimpanzees most people know.
