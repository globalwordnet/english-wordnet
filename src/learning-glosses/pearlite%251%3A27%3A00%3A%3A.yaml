senseId: 'pearlite%1:27:00::'
synsetId: 15002404-n
simpleMeaning: Thin alternating layers of cementite and ferrite that form as austenite cools. This mixture
  occurs in steel and cast iron.
scope: This layered mix is one part of steel and cast iron, and it is not a single metal on its own.
examples:
- The pearlite formed as the hot iron cooled.
- Cast iron holds pearlite among its parts.
