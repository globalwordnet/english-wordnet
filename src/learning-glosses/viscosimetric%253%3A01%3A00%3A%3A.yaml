senseId: 'viscosimetric%3:01:00::'
synsetId: 03155462-a
simpleMeaning: Said of a thing that works out a liquid's thickness, or how slowly it pours.
scope: Also called viscometric. It is said of a thing, not of a person.
examples:
- The viscosimetric gauge gave a steady reading.
- A viscosimetric check showed the syrup was slow to pour.
