simpleMeaning: To show a thing, or see it, the way others do is what this word marks, used most of all
  for the first three gospels of the New Testament.
scope: This word marks a way of seeing that matches how others see, used most of all for the first three
  gospels of the New Testament, also called synoptic.
examples:
- The class read the synoptical sayings in the first three gospels.
- The three books give a synoptical account, sharing one point of view.
