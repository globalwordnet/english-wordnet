senseId: 'at_the_same_time%4:02:06::'
synsetId: 00027761-r
simpleMeaning: Said when a point still stands, most often just before a point is given up.
scope: Also called still, however, yet, nevertheless, nonetheless, notwithstanding, withal, all the same,
  and even so, this one is not about a point falling.
examples:
- The work is dangerous, but at the same time I still want to try it.
- They disliked each other, and at the same time they agreed on the plan.
