senseId: 'uncheerfulness%1:12:00::'
synsetId: 07552456-n
simpleMeaning: A dull, sad feeling that sees the worst in things and expects little good.
scope: Cheerlessness is another name for it. It is the feeling itself, not the quality of something that
  fails to lift the spirits.
examples:
- A deep uncheerfulness settled over them as the rain went on.
- Their uncheerfulness showed in the way they spoke of the days ahead.
