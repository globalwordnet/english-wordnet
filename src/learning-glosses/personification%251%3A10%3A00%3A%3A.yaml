simpleMeaning: Showing an abstract idea or quality as if it were a human being or a creature.
scope: Also called prosopopoeia. It is a way of using words.
examples:
- The personification of death as a hooded figure is common in stories.
- The personification of justice as a blindfolded woman is common in art.
