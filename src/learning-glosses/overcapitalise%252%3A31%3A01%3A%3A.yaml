simpleMeaning: To put a money value on a company that is too high, beyond what is fair or what the law
  allows.
scope: It is also called overcapitalize.
examples:
- They overcapitalised the firm before selling it, putting a money value on it far above what it was really
  worth.
- The buyers found that the firm had been overcapitalised and refused to pay the asking price.
