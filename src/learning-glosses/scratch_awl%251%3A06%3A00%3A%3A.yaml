simpleMeaning: For wood or metal that must be cut, this sharp-pointed tool draws the line to follow.
scope: Scribe and scriber are other names for this sharp-pointed marking tool, not a tool for cutting.
examples:
- A line from the scratch awl showed where to cut the wood.
- The scratch awl left a thin mark on the metal.
