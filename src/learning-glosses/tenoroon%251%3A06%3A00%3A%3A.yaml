simpleMeaning: A small bassoon in the tenor range, pitched a musical interval called a fifth above an
  ordinary bassoon.
scope: A small bassoon that sounds higher than the common one, not a full-size bassoon and not a different
  wind instrument.
examples:
- The tenoroon played the high line in the small band.
- She took up the tenoroon because its sound sits above the bassoon.
