senseId: 'g-force%1:23:00::'
synsetId: 13670214-n
simpleMeaning: A load expressed in multiples of standard gravity, describing how heavy a person or object
  feels during acceleration.
scope: The force associated with a given g-force depends on the mass of the person or object.
examples:
- The pilot felt a strong g-force during the turn.
- A passenger under a g-force of two feels twice as heavy as usual.
