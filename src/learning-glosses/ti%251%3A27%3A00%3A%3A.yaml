simpleMeaning: Titanium, a light, strong, shiny gray metal that resists corrosion and forms lightweight
  alloys for aircraft parts. It comes mainly from rutile and ilmenite.
scope: A metal, also called titanium and atomic number 22; not steel and not iron.
examples:
- Ti is used in plane parts.
- Ti does not rust.
