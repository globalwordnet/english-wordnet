simpleMeaning: A disease of the eye in which a white spot that light cannot pass through forms on the
  cornea, the clear part at the front of the eyeball.
scope: It is also called leukoma.
examples:
- The doctor found a leucoma during the eye test.
- They treated the leucoma on the front of the eye.
