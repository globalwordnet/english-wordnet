simpleMeaning: A shrew-sized prehistoric animal from Alberta, Canada, about 55 million years ago. Its
  proposed classification as a late-surviving mammal-like reptile is disputed.
scope: A shrew-sized early mammal from Alberta, not a true shrew or a mammal-like reptile of much earlier
  times.
examples:
- Chronoperates paradoxus lived in Alberta about 55 million years ago.
- The bones of Chronoperates paradoxus were found in Canada.
