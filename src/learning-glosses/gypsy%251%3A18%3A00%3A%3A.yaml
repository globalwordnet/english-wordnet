simpleMeaning: An often offensive term for a Romani person. The traditionally Romany-speaking Roma trace
  their roots to northern India and live worldwide, especially in Europe, North Africa, and North America.
scope: Also called Gipsy, Bohemian, Roma, Romani, Romany, or Rommany; a member of the Romany-speaking
  people, not a member of any other people.
examples:
- The Gypsy family camped near the fair.
- A Gypsy told her fortune at the market.
