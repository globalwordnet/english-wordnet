simpleMeaning: The bit that matters most of all in what a person thinks or lives through.
scope: Also called heart, center, core, centre, meat, sum, substance, essence, marrow, kernel, nub, gist,
  pith, inwardness, or heart and soul. It is a noun.
examples:
- They got to the nitty-gritty of the plan in the first ten minutes.
- The nitty-gritty of their story was the night the shop burned down.
