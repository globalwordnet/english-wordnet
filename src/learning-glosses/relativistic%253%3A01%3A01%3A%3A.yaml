senseId: 'relativistic%3:01:01::'
synsetId: 02847046-a
simpleMeaning: About the idea that what is true or right changes with the person, place, or time that
  judges it
scope: This is about the idea in thought that truth changes with the person or time that judges it, not
  the idea in physics about space and time.
examples:
- The relativistic view says that what counts as right can change from one place to another.
- A relativistic reading of the old rule says it meant one thing then and another now.
