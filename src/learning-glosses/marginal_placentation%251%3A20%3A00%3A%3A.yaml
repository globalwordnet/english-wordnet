senseId: 'marginal_placentation%1:20:00::'
synsetId: 11702472-n
simpleMeaning: An arrangement in which ovules, which can develop into seeds, grow along the seam on the
  inner wall of a flower's single-carpel ovary.
scope: With small parts that can grow into seeds on the wall along the join on the front side of a plain
  seed box, not seeds on a middle post and not seeds on both walls.
examples:
- In marginal placentation, the parts that grow into seeds sit on one wall.
- The flower shows marginal placentation in its seed box.
