simpleMeaning: With this machine, two pieces of paper, film, or magnetic tape become one joined piece.
scope: This sense is a machine for joining paper, film, or tape, not a worker who joins ropes and not
  a woodworker who joins wood.
examples:
- They used a splicer to join the two ends of the film.
- The splicer joined the two pieces of tape.
