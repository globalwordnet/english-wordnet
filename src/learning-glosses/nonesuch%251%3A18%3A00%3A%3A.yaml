simpleMeaning: A person or thing taken as the best of its kind, with no other to match it.
scope: Ideal, saint, paragon, apotheosis, nonpareil, and nonsuch are other names for it.
examples:
- No other cook in the town could match the old chef, a true nonesuch.
- They called the new bridge a nonesuch, the finest of its kind ever built.
