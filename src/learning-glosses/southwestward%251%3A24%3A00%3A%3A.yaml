simpleMeaning: A compass point that sits halfway between the way toward the foot of a map and the evening
  side, at 225 degrees clockwise from north.
scope: Also called southwest, sou'-west, and SW. It is a compass point.
examples:
- A wind from the southwestward brought cool air.
- The wind shifted to the southwestward by evening.
