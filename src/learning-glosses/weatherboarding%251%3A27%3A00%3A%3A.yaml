simpleMeaning: Pieces of wood, long and thin and thick at one edge, cover a wall by lying one over the
  next below it.
scope: Clapboard and weatherboard are other names for this.
examples:
- The house was covered in weatherboarding to keep out the rain.
- They nailed the weatherboarding on so each piece overlapped the one below.
