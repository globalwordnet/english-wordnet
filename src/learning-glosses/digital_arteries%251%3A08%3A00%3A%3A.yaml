simpleMeaning: The tubes that carry blood to the fingers and toes, running through the hand and foot.
scope: Also called arteria digitalis, these are not tubes that carry blood away from the fingers and toes.
examples:
- The digital arteries in the hand were easy to see on the scan.
- The doctor felt for the digital arteries in the foot after the injury.
