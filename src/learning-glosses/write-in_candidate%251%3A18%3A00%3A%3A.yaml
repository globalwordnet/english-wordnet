simpleMeaning: One who stands for a public post but whose name is left off the voting paper, so voters
  have to add the name themselves.
scope: Also called write-in. It is a person.
examples:
- The write-in candidate won even though their name was left off the paper.
- Voters added the write-in candidate by hand on the day.
