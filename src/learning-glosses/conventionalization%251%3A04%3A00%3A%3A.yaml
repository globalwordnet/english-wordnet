senseId: 'conventionalization%1:04:00::'
synsetId: 01162451-n
simpleMeaning: The process of bringing something into line with accepted ways, so that it matches the
  common style.
scope: Also called conventionalisation; this one is about a process.
examples:
- The conventionalization of the old town gave every street the same look.
- The conventionalization of dress in the office made everyone look alike.
