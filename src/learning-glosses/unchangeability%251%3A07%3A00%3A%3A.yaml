senseId: 'unchangeability%1:07:00::'
synsetId: 04745174-n
simpleMeaning: Nothing in a thing with this quality shifts; it stays as it is nearly all the time.
scope: Also called changelessness, unchangeableness, and unchangingness, this word names a quality of
  a thing, not a single act it does.
examples:
- They admired the unchangeability of the old rules.
- The unchangeability of their daily routine surprised them.
