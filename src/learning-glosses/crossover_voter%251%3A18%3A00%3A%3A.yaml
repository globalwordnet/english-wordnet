simpleMeaning: A person on the list of one political party as a member who takes part in another party's
  first round of choosing who will stand for office.
scope: Crossover is another name for this thing.
examples:
- The crossover voter backed the other party's runner in the first round.
- A crossover voter belongs to one party yet takes part in another party's first round.
