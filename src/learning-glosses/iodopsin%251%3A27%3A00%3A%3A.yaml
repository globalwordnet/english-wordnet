simpleMeaning: A violet, light-sensitive pigment in the retinal cone cells of most animals with backbones.
  It helps them see in daylight.
scope: This violet stuff in the cone cells of the eye helps most animals with backbones see in daylight.
examples:
- Iodopsin helps the cones work in daylight.
- In bright daylight, iodopsin is at work in the cones of the eye.
