simpleMeaning: This tire is a metal hoop that goes round a wheel and takes the wear as its tread.
scope: This is a hoop of metal round a wheel, not a rubber ring and not the wheel itself.
examples:
- The wagon tire clanged as the wheel rolled over the stones.
- A loose wagon tire rattled with every turn of the wheel.
