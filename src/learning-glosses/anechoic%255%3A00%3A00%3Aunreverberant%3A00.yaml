simpleMeaning: Taking sounds in instead of sending them back.
scope: This is about what happens to sound in a room, not about the sound itself.
examples:
- They tested the new speaker in an anechoic chamber, where no sound came back.
- The walls of the anechoic room took in every sound and gave back none.
