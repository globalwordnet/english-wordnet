senseId: 'trespass_de_bonis_asportatis%1:04:00::'
synsetId: 00736315-n
simpleMeaning: A person brings a case in court to get money from someone who took things from the person
  they belong to.
scope: This court case is brought because things were taken from the person they belong to, not because
  harm came about in a roundabout way or because a person went onto another's land.
examples:
- They brought a trespass de bonis asportatis against the person who had taken their goods.
- In the trespass de bonis asportatis, they asked the court for money because their goods had been taken.
