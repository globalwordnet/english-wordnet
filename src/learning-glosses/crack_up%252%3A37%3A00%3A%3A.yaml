senseId: 'crack_up%2:37:00::'
synsetId: 01789398-v
simpleMeaning: To lose control of one's thoughts and feelings under heavy strain, so that one can no longer
  carry on.
scope: Also called crack, collapse, break up or crock up, this one is about what happens inside a person
  under strain.
examples:
- After months of worry, the new manager cracked up and could not face work.
- The long strain at last made the driver crack up.
