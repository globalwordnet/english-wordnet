simpleMeaning: Arranging things to follow a clear plan or reason.
scope: Also called rationalization, rationalisation, and systematisation. It is the act itself, not the
  set of rules it follows.
examples:
- They worked on the systematization of the old files.
- The systematization of the records took a whole week.
