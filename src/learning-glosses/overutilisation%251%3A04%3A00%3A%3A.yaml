senseId: 'overutilisation%1:04:00::'
synsetId: 00953544-n
simpleMeaning: The act of using something beyond the point where further use still pays.
scope: Also called overuse, overexploitation, and overutilization. It is a kind of use.
examples:
- The overutilisation of the river left too little water for the farms below.
- They warned that overutilisation of the forest would end in poor soil and thin trees.
