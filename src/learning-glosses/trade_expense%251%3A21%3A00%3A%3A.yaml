simpleMeaning: These are the usual costs a person who pays tax runs up while doing business, and the business
  cannot do without them.
scope: Also called a business expense, this covers the usual costs of a taxpayer's business, not spending
  on things outside the business.
examples:
- They wrote off the trade expense when they worked out the tax for the year.
- The trade expense covered the cost of fuel for the delivery van.
