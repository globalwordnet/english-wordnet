simpleMeaning: To become completely tired, or to make a person or thing completely tired, by too much
  use or by great strain or stress.
scope: It is also called wear, tire, weary, fatigue, jade, fag, fag out, tire out, wear down, wear out,
  and wear upon.
examples:
- They outwore their shoes on the long hike.
- The long climb outwore even the strongest walkers.
