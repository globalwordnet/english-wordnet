simpleMeaning: Said of a person or an eye that has no lens in it, or of anything to do with that lack.
scope: This is the adjective sense, not the noun that names the person.
examples:
- The aphakic eye had no lens after the operation.
- Doctors fitted the aphakic patient with a lens to replace the missing one.
