senseId: 'transcriber%1:18:01::'
synsetId: 10743768-n
simpleMeaning: A person who writes down the sounds of speech with marks that show how each sound is said.
scope: It is not a musician who reworks a piece of music, and not a person who turns writing from one
  language into another.
examples:
- The transcriber wrote down every sound the speaker made.
- A good transcriber knows the marks for each sound.
