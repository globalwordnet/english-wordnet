simpleMeaning: Any sedge in the genus Eriophorum, a bog plant with tufted flower spikes found in northern
  temperate regions.
scope: Also called cotton grass, this thin-leaved bog plant of the cool north is one of many kinds of
  a single group.
examples:
- The cotton rush stood white-tufted in the bog.
- Cotton rush grows in the bogs of the cool north.
