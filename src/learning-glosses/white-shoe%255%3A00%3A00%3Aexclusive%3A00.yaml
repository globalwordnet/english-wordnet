simpleMeaning: Describing an established company or law firm traditionally run by members of a wealthy,
  generally conservative white Anglo-Saxon Protestant elite.
scope: It marks a firm whose owners and managers come from the WASP elite, not from outside that small
  group of families.
examples:
- The firm was known as a white-shoe law firm, run by old families.
- He tried to hide his white-shoe background when he ran for office.
