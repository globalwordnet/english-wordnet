simpleMeaning: A word with a meaning of its own that changes or limits the meaning of a noun or a verb.
scope: It is also called a qualifier.
examples:
- In 'the tall tree', 'tall' is a modifier.
- The word 'quickly' is a modifier in 'she ran quickly'.
