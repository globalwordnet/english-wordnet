simpleMeaning: An ironweed of the eastern United States, a herb that comes back year after year and bears
  showy gold flowers.
scope: Also called golden honey plant, golden ironweed, wingstem, Actinomeris alternifolia, and Verbesina
  alternifolia, this one is an eastern plant, not a western one.
examples:
- The yellow ironweed by the road bore showy gold flowers.
- They found yellow ironweed growing in the eastern United States on their trip.
