simpleMeaning: Said of words that add a limit or an explanation, placed between round brackets or as if
  placed there.
scope: Also called parenthetical. It is a word or remark set apart from the rest.
examples:
- A parenthetic remark about the weather broke the flow of the talk.
- A parenthetic note at the end of the page explained the term.
