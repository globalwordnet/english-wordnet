senseId: 'twist_around%2:32:00::'
synsetId: 00934760-v
simpleMeaning: People are misled because someone argues with words whose meaning has been changed or left
  unclear on purpose.
scope: Also called twist, sophisticate, convolute, and pervert, this word is for arguing that misleads
  people on purpose, not for arguing that leaves the true meaning clear.
examples:
- They twisted around the words until no one knew what they meant.
- The speaker twisted around the words to mislead the crowd.
