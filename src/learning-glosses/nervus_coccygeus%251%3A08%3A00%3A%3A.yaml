simpleMeaning: The two cords of the spine that sit lowest, linking the body's signal paths to its base.
scope: Also called coccygeal nerve. It is a pair of cords, not a single cord.
examples:
- The nervus coccygeus runs from the base of the spine.
- Surgeons take care not to cut the nervus coccygeus.
