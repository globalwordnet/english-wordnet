simpleMeaning: Above the stage, a screen shows the words of a foreign opera or choral work in the language
  of the people watching.
scope: This is the translation of a foreign opera or choral work shown on a screen above the stage; supertitle
  is another name for it.
examples:
- The audience read the surtitle to follow the Italian opera.
- The surtitle above the stage gave the words in English.
