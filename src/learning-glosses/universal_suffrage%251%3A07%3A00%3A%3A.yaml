senseId: 'universal_suffrage%1:07:00::'
synsetId: 05193894-n
simpleMeaning: The right of every grown-up to vote, unless the law of the country says they may not.
scope: It is a kind of right, not a right to stand for office.
examples:
- The country brought in universal suffrage after years of debate.
- Under universal suffrage, every grown-up may vote.
