simpleMeaning: A nucleotide found in muscle cells that helps with metabolism and can be converted to ADP
  or ATP and back again.
scope: It is also called adenosine monophosphate, and it is a chemical found in muscle cells that helps
  turn food into power.
examples:
- The lab found adenylic acid in the muscle cells.
- Adenylic acid in the muscle could turn into ADP and back again.
