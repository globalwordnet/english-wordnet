simpleMeaning: A dense network of unmyelinated axons, dendrites, and branches of supporting cells. It
  forms most of the grey matter around nerve cell bodies in the brain and spinal cord.
scope: This sense is also called neuropile, for the tangled web of bare axons, dendrites and glial offshoots
  that make up most of the main nerve web's grey stuff, in which nerve-cell bodies sit.
examples:
- Neuropil fills the grey matter.
- Neuropil holds nerve cell bodies.
