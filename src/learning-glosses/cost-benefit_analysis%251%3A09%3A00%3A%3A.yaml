simpleMeaning: A close look at different choices to see whether what you gain is worth more than what
  you pay.
scope: This one is about a way of judging choices, not about the choices themselves.
examples:
- The council did a cost-benefit analysis before building the new road.
- A cost-benefit analysis showed the plan would save money.
