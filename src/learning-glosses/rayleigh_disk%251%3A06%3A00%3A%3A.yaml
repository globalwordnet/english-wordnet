simpleMeaning: A light disk hung from a quartz thread. Its twist in a passing sound wave measures how
  fast particles in the surrounding material move.
scope: The disk measures the motion of particles as sound passes.
examples:
- The Rayleigh disk hung still until the sound wave passed.
- They used a Rayleigh disk to measure the movement of air particles in the sound wave.
