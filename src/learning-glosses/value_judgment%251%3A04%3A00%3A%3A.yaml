simpleMeaning: A person making this kind of judgment shows more of what they think matters than of the
  thing itself.
scope: Also called a value judgement, this is one person's view, not a plain account of the thing itself.
examples:
- The value judgment at the end of the piece told us more about the writer than about the book.
- You can hear a value judgment in every line of the review, and it says little about the play.
