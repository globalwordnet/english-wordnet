simpleMeaning: An animal's skin is covered by a thick, soft fur, and longer, rougher hairs cover that
  fur.
scope: Also called underfur, this names an animal's inner fur, not a first layer of paint or a seal on
  a car.
examples:
- The vet parted the dog's long outer hairs to check the thick undercoat below.
- The dog shed its undercoat.
