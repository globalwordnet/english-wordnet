simpleMeaning: A person who sends messages by telegraph, often using Morse code.
scope: Also called a telegrapher or a telegraphist. It is a person, not the machine that sends the messages.
examples:
- The telegraph operator tapped out the message in code.
- They worked as a telegraph operator at the railway station.
