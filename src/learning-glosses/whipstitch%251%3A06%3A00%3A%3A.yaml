simpleMeaning: A thread loop in sewing that crosses an edge from one side to the other at a slant.
scope: Also called whipping or whipstitching, this is not one that runs straight along an edge.
examples:
- They used a whipstitch to join the two pieces of cloth along the edge.
- They finished the hem with a whipstitch, looping the thread over the edge again and again.
