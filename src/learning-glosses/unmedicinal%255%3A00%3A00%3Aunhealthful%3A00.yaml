simpleMeaning: Said of a drug that a doctor has not ordered, and that does nothing to cure an illness.
scope: Also called nonmedicinal, unmedical, or unmedicative. It is said of a drug.
examples:
- The unmedicinal syrup had no healing power at all.
- They bought the unmedicinal pills without a doctor's note.
