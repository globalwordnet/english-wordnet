simpleMeaning: Unlike solids and liquids, this form of matter has low density and viscosity, expands or
  contracts greatly with temperature and pressure, spreads readily, and fills a container evenly.
scope: This is the general state of matter, not the fuel used in car engines and not one particular air-like
  substance.
examples:
- Water can be a solid, a liquid or a gas.
- At high temperatures, the metal turns into a gas.
