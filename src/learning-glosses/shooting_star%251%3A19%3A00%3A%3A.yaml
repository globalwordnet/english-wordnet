simpleMeaning: A streak of light seen at night when a space rock enters Earth's atmosphere and heats up
  enough to melt, vaporize, or break apart.
scope: This sense is also called meteor.
examples:
- A shooting star crossed the night sky.
- Shooting stars streak the sky.
