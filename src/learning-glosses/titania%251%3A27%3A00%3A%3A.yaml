simpleMeaning: Things take their colour from this white powder, which covers well and lasts a long time.
scope: Titanic oxide, titanium dioxide and titanium oxide are other names for this white powder, not one
  that lets old colours show through or wears off fast.
examples:
- They mixed titania into the paint to make it cover better.
- The white paint owed its lasting cover to titania.
