senseId: 'parity_bit%1:23:00::'
synsetId: 13646953-n
simpleMeaning: A bit added to make each group's count of ones odd or even, as agreed. Receiving an even
  count when an odd count was expected signals an error.
scope: This sense is the bit itself, another name for a check bit, not the odd-or-even condition it creates.
examples:
- Every byte is followed by a parity bit.
- The parity bit caught the error before the file was saved.
