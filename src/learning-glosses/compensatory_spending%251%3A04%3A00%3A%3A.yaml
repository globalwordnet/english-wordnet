simpleMeaning: Money borrowed by a government and paid out to get its economy moving.
scope: Deficit spending and pump priming are other names for this thing, which is about borrowed money
  put to work by a government.
examples:
- The government used compensatory spending to lift the economy after the downturn.
- The new budget relied on compensatory spending to create jobs.
