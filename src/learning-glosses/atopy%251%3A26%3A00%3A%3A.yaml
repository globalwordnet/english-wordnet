simpleMeaning: In a person made ready to react, the body answers with harm only minutes after contact.
scope: Atopic allergy, immediate allergy, and type I allergic reaction are other names for this one, which
  does not wait days to show.
examples:
- The atopy flared up only minutes after they stroked the dog.
- The red, itchy skin showed the atopy minutes after contact with the pollen.
