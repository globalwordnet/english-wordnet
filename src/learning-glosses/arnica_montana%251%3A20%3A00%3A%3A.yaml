simpleMeaning: A pasture and open-woodland herb across most of Europe and western Asia. Its dried orange-yellow,
  daisylike flower heads serve as a stimulant and a remedy for bruises and swelling.
scope: A herb of pasture and open woods in most of Europe and western Asia, whose dried orange-yellow
  daisy-like heads are used as a stimulant and for bruises and swellings.
