simpleMeaning: A variable in an equation whose possible values are the solutions to that equation.
scope: Also called unknown. It is a number in a sum, not a hidden part of a situation.
examples:
- In the sum 3 + x = 7, x is the unknown quantity.
- They worked out the unknown quantity by taking 3 from both sides.
