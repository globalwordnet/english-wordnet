simpleMeaning: Being full of short true stories about real people and things that happened, most often
  funny or worth hearing about.
scope: This is a quality something has, not a short story itself.
examples:
- The old professor's lectures were full of anecdotalism, and every point came with a short true story.
- The field lost its anecdotalism only recently, when scholars began to demand hard proof.
