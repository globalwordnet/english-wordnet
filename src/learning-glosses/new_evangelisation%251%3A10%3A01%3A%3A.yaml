simpleMeaning: Efforts to renew the Christian faith in traditionally Christian regions, especially Europe.
  Pope John Paul II helped make the term widely known.
scope: 'Also called new evangelization: a term made well known by Pope John Paul the Second for work to
  wake up the faith again in lands long Christian, above all in Europe.'
examples:
- The new evangelisation calls Christians to share their faith again.
- He wrote about the new evangelisation in Europe.
