simpleMeaning: A way of speaking to someone far away by signals sent through the air, not along wires.
scope: Also called radiotelephony or wireless telephone. It is a system.
examples:
- They spoke to the shore station by radiotelephone, with no wires between them.
- Radiotelephone made it possible to talk across the sea.
