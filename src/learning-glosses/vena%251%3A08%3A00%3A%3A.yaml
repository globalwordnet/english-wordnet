simpleMeaning: A blood vessel that moves blood from the smallest vessels toward the heart.
scope: Also called vein and venous blood vessel. It is a kind of tube.
examples:
- The vena that runs along the arm carries blood back to the heart.
- A cut vena can bleed a lot before it is closed.
