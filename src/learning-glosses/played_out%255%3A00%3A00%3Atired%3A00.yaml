senseId: played_out%5:00:00:tired:00
synsetId: 02442263-s
simpleMeaning: With no strength or power left to work or do anything; extremely tired; completely without
  energy.
scope: Also called spent, gone, exhausted, fatigued, fagged, dog-tired, washed-out, worn-out, and worn
  out. It is a state, not an act.
examples:
- Their played out limbs trembled as they climbed the stairs.
- After the long match, the team felt played out and went straight to bed.
