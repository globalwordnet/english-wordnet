simpleMeaning: A time when a group of people will not do their jobs, in protest over low pay or bad conditions.
scope: Also called strike. It is a protest.
examples:
- The work stoppage began on Monday after the pay talks failed.
- The work stoppage ended when the firm agreed to raise wages.
