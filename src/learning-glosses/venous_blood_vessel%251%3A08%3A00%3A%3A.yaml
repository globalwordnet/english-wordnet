simpleMeaning: A vein, a blood vessel that carries blood from smaller vessels toward the heart.
scope: Also called vena and vein. It is a tube, not the heart itself.
examples:
- The surgeon tied off the venous blood vessel before removing the growth.
- A venous blood vessel in their leg had swollen and ached.
