senseId: 'cimetidine%1:06:00::'
synsetId: 03035538-n
simpleMeaning: A drug sold as Tagamet that treats peptic ulcers, sores in the stomach or upper small intestine,
  by reducing stomach acid production.
scope: This drug sold as Tagamet heals sores in the gut by cutting down the sour juice the stomach makes.
examples:
- He took cimetidine for his ulcer.
- Cimetidine helped his ulcer heal.
