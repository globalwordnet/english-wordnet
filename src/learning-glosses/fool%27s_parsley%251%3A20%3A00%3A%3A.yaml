simpleMeaning: A poisonous European weed that resembles parsley and now grows wild in America. Eating
  it can cause nausea and other signs of poisoning.
scope: A European weed that looks like a common cooking herb, also called lesser hemlock, not the cooking
  herb itself and not true hemlock.
examples:
- Fool's parsley grew along the path and looked just like the herb in the kitchen garden.
- Do not eat fool's parsley, as it can poison you.
