simpleMeaning: An act so impressive that the audience's reaction delays the rest of the show.
scope: Stopper and showstopper are other names for this act, which moves a crowd so much that the performance
  has to wait until the crowd falls quiet.
examples:
- The crowd loved the show-stopper so much that the play had to wait.
- Her song was the show-stopper of the night, and the crowd would not fall quiet.
