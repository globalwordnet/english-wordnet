simpleMeaning: A low grade of coal called lignite, between peat and bituminous coal in its degree of formation.
scope: This one is also called brown coal and lignite, and it is not a substance made by heating timber
  without air.
examples:
- They burned wood coal in the stove all winter.
- The miners dug wood coal from a seam that was neither peat nor a harder coal.
