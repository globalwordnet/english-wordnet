simpleMeaning: A large body orbiting the sun, shining by reflected light. Mercury, Venus, Earth, Mars,
  Jupiter, Saturn, Uranus, Neptune, historically Pluto, orbit counterclockwise viewed from Hercules.
scope: One of the sun's nine large orbiting bodies, not a moon circling one of them, and not a small object
  such as an asteroid.
examples:
- Jupiter is the largest major planet in the solar system.
- Astronomers once counted Pluto as a major planet.
