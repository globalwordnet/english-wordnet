simpleMeaning: A flap on the side of the head that catches sound, bent out of shape after being hurt,
  often seen in people who fight with their fists.
scope: This one is about the part of the head that hears.
examples:
- The boxer had a cauliflower ear after years in the ring.
- The doctor looked at the cauliflower ear and asked how it had been hurt.
