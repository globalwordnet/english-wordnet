simpleMeaning: A spurge that lives for one year as a weed in the north-east of North America, with leaves
  that have small points along their edges.
scope: Also called Euphorbia dentata, this is a one-year weed of the north-east of North America, not
  one with smooth leaves.
examples:
- They pulled the toothed spurge out of the ground.
- The toothed spurge they found had leaves edged with small points.
