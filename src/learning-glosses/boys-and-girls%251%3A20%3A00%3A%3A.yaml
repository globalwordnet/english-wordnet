simpleMeaning: A European and African annual plant that grows wild as a weed in America. Formerly dried
  to loosen the bowels, increase urination or treat syphilis.
scope: 'Also called herb mercury and herbs mercury: a one-year weed of Europe and Africa now wild in America,
  not a garden flower and not a food plant.'
examples:
- Boys-and-girls was once dried and used as a purge.
- The weed boys-and-girls now grows wild across America.
