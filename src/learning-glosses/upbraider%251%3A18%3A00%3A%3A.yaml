simpleMeaning: The doer of a fault hears about it from this person, who lays the blame on them.
scope: This person is also called a rebuker, a reproacher, and a reprover.
examples:
- The upbraider blamed the team for each fault in the plan.
- No one liked working with the upbraider, who found fault with every step.
