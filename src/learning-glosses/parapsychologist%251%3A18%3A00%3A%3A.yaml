schema: oewn-learning-gloss-v2
senseId: 'parapsychologist%1:18:00::'
synsetId: 10418505-n
simpleMeaning: Someone who studies evidence for claimed mental abilities such as moving objects by thought,
  reading minds, or perceiving things beyond the reach of the senses.
scope: A person who studies signs of mind powers, not an ordinary mind doctor and not a person who claims
  the powers.
examples:
- The parapsychologist tested the woman's claim to read minds.
- A parapsychologist spent years on reports of moving objects.
