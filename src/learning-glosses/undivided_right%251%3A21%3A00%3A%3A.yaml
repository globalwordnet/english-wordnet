senseId: 'undivided_right%1:21:00::'
synsetId: 13309360-n
simpleMeaning: A share in property held by several owners, each with an equal right to use the whole property.
scope: Also called undivided interest, this name is for a claim on a shared property, not a claim on one
  part of it.
examples:
- Each tenant had an undivided right to use the whole house.
- They bought the cottage with an undivided right, so each of them could enjoy all of it.
