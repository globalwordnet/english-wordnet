simpleMeaning: Taking the chances that come one's way, with no care for what happens to others.
scope: Also called expedience, opportunism, and self-interest. It is a noun.
examples:
- Self-seeking drove them to take the best post for themselves.
- Their self-seeking left the rest of the team with nothing.
