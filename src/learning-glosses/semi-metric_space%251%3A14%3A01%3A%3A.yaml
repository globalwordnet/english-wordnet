synsetId: 92444667-n
simpleMeaning: A set of points with a looser way of measuring distance than the usual kind, where two
  points set apart can still sit at no distance from each other.
scope: Also called pseudometric space, this names a set of points with a looser way of measuring distance,
  where two points set apart can be at no distance from each other.
examples:
- The two points lay at no distance in the semi-metric space.
- They found two points at no distance in a semi-metric space.
