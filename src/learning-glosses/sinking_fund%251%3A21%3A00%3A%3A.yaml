senseId: 'sinking_fund%1:21:00::'
synsetId: 13380601-n
simpleMeaning: Money set aside bit by bit in an account of its own, from which what is owed on papers
  promising repayment gets cleared.
scope: Money set aside this way is kept apart from other money until it clears the debt.
examples:
- The company paid into its sinking fund every month.
- The sinking fund held enough to pay off the debt.
