simpleMeaning: A guard for Britain's king or queen, standing beside fellow guards for show at formal events.
scope: This one is also called a yeoman or a beefeater, and serves for show, not for fighting.
examples:
- The yeoman of the guard stood at the palace gate in a bright uniform.
- They saw a yeoman of the guard marching in the parade.
