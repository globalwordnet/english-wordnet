simpleMeaning: One of a young mammal's first, temporary teeth. Children have twenty of them.
scope: It is also called a baby tooth, a deciduous tooth, or a primary tooth.
examples:
- The child lost a milk tooth at school.
- A milk tooth fell out while the child was eating an apple.
