simpleMeaning: A point used for measuring the skull, at the corner on each side where the lower jaw turns
  upward.
scope: This word names a point on the skull.
examples:
- The gonion sits at the corner of the jaw, where the lower jaw turns upward.
- Anthropologists mark the gonion on each side of the skull before they measure it.
