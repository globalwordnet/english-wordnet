simpleMeaning: A solar eclipse in which only a thin ring around the outer edge of the Sun remains visible.
scope: This is not one in which the whole sun can be seen.
examples:
- They watched the annular eclipse through dark glasses.
- The annular eclipse turned the midday light dim and strange.
