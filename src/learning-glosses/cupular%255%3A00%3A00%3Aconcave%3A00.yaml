simpleMeaning: Shaped like or supporting a small cup-like plant structure, such as the cup at the base
  of an acorn.
scope: Also called cupulate. It is about a shape.
examples:
- The cupular cap holds the acorn like a small bowl.
- A cupular leaf bends up at the edges to catch the rain.
