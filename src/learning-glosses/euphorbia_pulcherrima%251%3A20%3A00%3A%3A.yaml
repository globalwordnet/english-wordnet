scope: A plant of tropical America with poisonous milky sap and showy scarlet leaves like petals round
  small yellow flowers, also called poinsettia, lobster plant, painted leaf, Christmas flower, Christmas
  star and Mexican flameleaf.
examples:
- Euphorbia pulcherrima brightens the room with its scarlet leaves at Christmas.
