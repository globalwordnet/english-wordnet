simpleMeaning: A European woody plant with pink flowers, single-leaflet leaves, and long, tough roots.
  The plant spreads through underground runners.
scope: This is a woody plant from Europe with pink flowers; rest-harrow and restharrow are other names
  for it, not its spiny kin Ononis spinosa and not a plant with purple flowers.
examples:
- Ononis repens spreads by runners under the ground.
- The Ononis repens in the field has pink flowers and long tough roots.
