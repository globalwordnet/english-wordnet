simpleMeaning: A community's people, seen as one whole held together by the usual ways they link to each
  other.
scope: Also called structure, social organization, social structure, and social system. It is the people
  of a community.
examples:
- The social organisation of a small village can be very different from that of a big city.
- Historians study how the social organisation changed after the war.
