simpleMeaning: A thin band of material that keeps the cold out by covering the joint of a door or a window.
scope: Also called weather stripping, weatherstrip and weatherstripping. It is a band of material, not
  the door or window itself.
examples:
- They put new weather strip around the front door before winter.
- The weather strip on the back door had come loose.
