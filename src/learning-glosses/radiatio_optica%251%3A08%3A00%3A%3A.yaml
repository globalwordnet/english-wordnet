senseId: 'radiatio_optica%1:08:00::'
synsetId: 05236379-n
simpleMeaning: A nerve pathway carrying visual signals from a brain relay called the lateral geniculate
  body to the visual cortex, where the brain processes sight.
scope: A nerve path carrying sight signals; also called optic radiation, not the nerve that runs from
  the eye itself, and not a nerve path for hearing.
examples:
- Radiatio optica carries sight signals to the seeing part of the brain.
- Damage to the radiatio optica can blind one side of sight.
