senseId: 'suspense_account%1:21:00::'
synsetId: 13429949-n
simpleMeaning: A temporary account for payments, receipts, or differences in the books that need checking
  before they can be recorded in the proper account.
scope: This record is not a lasting account; it holds unsure sums only until they are checked.
examples:
- The unclear sum sat in a suspense account until it was checked.
- She put the unclear sum in a suspense account.
