simpleMeaning: A Pacific shark valued for its fins, used in Chinese soups, and for its liver, which is
  rich in vitamin A.
scope: Soup-fin and soupfin are other names for this Pacific shark, prized for its liver, rich in vitamin
  A, and for fins that go into a broth dish in China.
examples:
- The soupfin shark lives in the Pacific.
- People in China put soupfin shark fins into soup.
