simpleMeaning: A tall, symmetrical western North American pine with long blue-green needles in threes
  and elongated cones on spreading, slightly drooping branches. Sometimes classified as a variety of ponderosa
  pine.
scope: The western North American tree, not the Australian or New Zealand kinds or the Japanese and European
  ones.
examples:
- A black pine shaded the porch of the ranch house.
- The black pines on the ridge had long blue-green needles.
