simpleMeaning: To look at something closely, to find out whether it is right, well made, or in good shape.
scope: Check, check out, check over and check up on are other names for this, as are go over, look into
  and suss out.
examples:
- The mechanic will check into the noise the car makes when it starts.
- Before you buy the house, check into the state of the roof.
