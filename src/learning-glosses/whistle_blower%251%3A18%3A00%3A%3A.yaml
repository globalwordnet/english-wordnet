simpleMeaning: Someone inside a group who brings its wrong acts into the open so that they may be stopped.
scope: Also called a whistleblower or a whistle-blower, this person speaks up about wrong acts inside
  their own group in the hope of stopping them, not someone who keeps them secret.
examples:
- Documents from the whistle blower showed the newspaper how the company broke the law.
- By speaking up, the whistle blower hoped that telling the truth would put a stop to the abuse.
