simpleMeaning: An African plant with bright green evergreen leaves and many usually deep violet-blue flowers
  in umbrella-shaped clusters.
scope: A plant of Africa with bright green leaves that stay green all year, also called African lily,
  African tulip and Agapanthus africanus; not a plant that loses its leaves in winter and not a plant
  of Asia.
examples:
- The blue African lily has deep violet flowers.
- A blue African lily grew in a bunch by the path.
