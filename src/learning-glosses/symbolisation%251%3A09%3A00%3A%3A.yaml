senseId: 'symbolisation%1:09:00::'
synsetId: 05773412-n
simpleMeaning: People take a seen thing to stand for something unseen, linking the two or agreeing on
  the link.
scope: This is the seen thing itself, also called symbol, symbolic representation, or symbolization, not
  the act of giving things a meaning through such signs or of using such signs to carry a meaning.
examples:
- The eagle is a symbolisation of the United States.
- The class talked about the symbolisation in the picture.
