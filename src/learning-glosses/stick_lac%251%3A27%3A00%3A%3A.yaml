simpleMeaning: Lac, a natural resin left by insects on twigs, collected and dried in its raw form.
scope: This is the name for the stuff in the state it was in when first scraped from small branches and
  dried.
examples:
- They scraped stick lac from the twigs.
- The stick lac lay where it had been left to dry.
