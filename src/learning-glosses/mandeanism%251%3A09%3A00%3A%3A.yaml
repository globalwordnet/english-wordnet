simpleMeaning: A Gnostic religion dating to around the second or third century, honoring John the Baptist
  and combining Jewish and Christian elements with belief in opposing powers of light and darkness.
scope: A faith centred on John the Baptist, also called Mandaeanism; not Judaism and not early Christianity.
examples:
- Mandeanism honours John the Baptist as the Messiah.
- Followers of Mandeanism keep ancient baptism rites.
