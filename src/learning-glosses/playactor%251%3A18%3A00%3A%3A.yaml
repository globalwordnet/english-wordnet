simpleMeaning: A person who takes parts in stage shows and travels around the land putting them on.
scope: Also called trouper, barnstormer, and play-actor. It is a person, not a show.
examples:
- The playactor came to our town with a travelling show.
- They worked as a playactor for ten years.
