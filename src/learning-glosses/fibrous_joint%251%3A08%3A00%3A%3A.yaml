simpleMeaning: A place where bones meet and cannot move, above all one lying between the bones of the
  skull.
scope: This one is also called suture and sutura.
examples:
- The fibrous joint in the skull lets the bones hold fast.
- A fibrous joint keeps the plates of the skull fixed in place.
