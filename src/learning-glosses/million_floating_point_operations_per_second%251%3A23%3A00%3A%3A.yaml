simpleMeaning: A unit that measures how fast a computer system works, by counting 1,000,000 sums on decimal
  numbers done in each second.
scope: It is also called a megaflop or MFLOP.
examples:
- The new chip can do a million floating point operations per second.
- The manual lists the speed as a million floating point operations per second.
