simpleMeaning: A heated glass part with two metal ends that lets electric current pass one way only, turning
  current that flows back and forth into current that flows one way.
scope: This is a heated glass part with two metal ends, also called a diode or a rectifying valve.
examples:
- The old radio had a rectifying tube inside it.
- A new rectifying tube was fitted in the old radio.
