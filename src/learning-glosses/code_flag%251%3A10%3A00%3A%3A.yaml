simpleMeaning: One of the coloured cloths in a set of signals used by ships of all nations to send messages
  to each other.
scope: This one is also called nautical signal flag.
examples:
- The ship flew a code flag to ask for help.
- They raised the code flag that meant the ship was in quarantine.
