simpleMeaning: A verb, or a group of words built around a verb, takes this form when an object has to
  come after it for the sentence to be correct.
scope: Transitive and transitive verb are other names for this sense, which is about the shape of an action
  word that takes an object, not the shape of one that stands alone.
examples:
- In 'They caught the ball', 'caught' is in its transitive verb form because it takes an object.
- The transitive verb form of 'throw' needs an object, as in 'They threw the ball'.
