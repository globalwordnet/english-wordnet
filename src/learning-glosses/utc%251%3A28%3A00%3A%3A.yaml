simpleMeaning: Coordinated Universal Time, the global time standard based on atomic clocks and adjusted
  with leap seconds to stay close to Earth's rotation.
scope: 'Another name for this is coordinated universal time: the time at Greenwich, kept right by adding
  extra seconds, not the local time in any one place.'
examples:
- The flight leaves at ten o'clock UTC.
- Set your watch to UTC before you travel.
