simpleMeaning: A spoken or written account that makes a scene clear and lively in the mind.
scope: Also called picture, depiction, characterization, delineation, characterisation, and word-painting.
  It is a description.
examples:
- Their word picture of the old town made us feel we were there.
- The book opens with a word picture of a busy market.
