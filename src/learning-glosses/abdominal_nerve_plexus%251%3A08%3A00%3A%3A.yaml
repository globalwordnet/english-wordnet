simpleMeaning: A large network of sympathetic nerves behind the stomach that helps control involuntary
  activity in the abdominal organs.
scope: A large net of cords in the belly behind the stomach, also called coeliac plexus and plexus celiacus;
  not the spine and not a single cord.
examples:
- The abdominal nerve plexus lies behind the stomach.
- Pain spread through the abdominal nerve plexus.
