simpleMeaning: A load carrier whose front end rests on the truck that pulls it, with wheels only under
  its back end.
scope: Also called a semi, this load carrier has wheels only at the back, its front end resting on the
  truck that pulls it.
examples:
- The driver backed the semitrailer up to the loading dock.
- Workers loaded boxes into the semitrailer before the trip.
