schema: oewn-learning-gloss-v2
senseId: 'aneuploid%3:01:00::'
synsetId: 03017236-a
simpleMeaning: Said of a living thing whose count of chromosomes is not a whole number of times the count
  in one with a single set.
scope: This word is used when the count does not fit, not when it fits exactly.
examples:
- The aneuploid cell had one chromosome too many.
- They knew the cell was aneuploid when the count came out wrong.
