simpleMeaning: To do with the natural substances in plants that have nitrogen in them and act against
  acids, or made of them.
scope: This one says a thing has to do with those plant substances, not that it is one of them.
examples:
- The alkaloidal mix comes from plants and acts against acids.
- They studied the alkaloidal traits of the plant.
