simpleMeaning: A dye that is dark green in solid form and stains material blue. It is also used as an
  antiseptic and as a chemical indicator.
scope: Methylene blue is the common name for methylthionine chloride.
examples:
- Under the microscope, the areas stained with methylene blue stood out clearly.
- The label described methylene blue as a chemical indicator.
