simpleMeaning: An amphibian of the Alps whose eggs hatch inside the body, so its young are born alive.
scope: Also called Salamandra atra, this one is not one that lays its eggs outside the body.
examples:
- The alpine salamander lives high in the Alps, where the summers are short.
- They watched an alpine salamander give birth to live young on the mountain path.
