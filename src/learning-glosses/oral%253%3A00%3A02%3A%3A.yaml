simpleMeaning: In psychoanalytic theory, an early stage when a child finds pleasure through the mouth.
  Fixation at this stage was thought to lead to dependence, selfishness, and aggression.
scope: A stage in a child's growth of mind and sexual feeling, centred on the mouth; not a test given
  by speaking.
examples:
- The oral stage comes early in a child's growth.
- At the oral stage, a baby explores the world with its mouth.
