senseId: 'bryozoan%1:05:00::'
synsetId: 02316361-n
simpleMeaning: A fixed aquatic animal forming mosslike colonies on rocks or seaweed. Each member bears
  tentacles on a curved or circular ridge, and the colony grows by budding.
scope: This small colony-forming water animal, not the moss or seaweed it can look like, and not a coral.
examples:
- A bryozoan colony looks like a patch of moss on a rock.
- Bryozoans use their tentacles to catch tiny food particles.
