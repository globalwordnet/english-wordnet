simpleMeaning: A fixed opening in a building's wiring where a machine can be plugged in to take power.
scope: This is also called a wall plug, an outlet, an electric outlet, an electric receptacle, or an electrical
  outlet, and it stays in the wiring while a cord end goes into it.
examples:
- They plugged the heater into the wall socket.
- The wall socket by the bed was loose.
