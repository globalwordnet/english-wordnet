simpleMeaning: A word put in front of a point that makes clear or stands behind what was just said.
scope: Also called anyway, anyhow, anyways, in any case, and in any event, this one is not the other sense
  of this word, which means if nothing else.
examples:
- The work was hard, but at any rate they finished it on time.
- At any rate, the figures show the plan is working.
