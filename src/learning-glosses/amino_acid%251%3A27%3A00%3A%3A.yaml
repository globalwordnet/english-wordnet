simpleMeaning: An organic compound containing both an amino group and a carboxylic acid group. Many amino
  acids serve as building blocks of proteins.
scope: This small piece that builds proteins is also called aminoalkanoic acid.
examples:
- Proteins are made of about twenty common amino acids in different amounts.
- Each amino acid in the mix adds a different part to the protein.
