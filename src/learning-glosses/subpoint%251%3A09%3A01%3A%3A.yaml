simpleMeaning: A smaller idea that is one part of a bigger idea in a talk or debate.
scope: It is not the main idea of a talk, and it is not a dot on a page.
examples:
- The first subpoint in their talk was that buses should run more often at night.
- They agreed on the main idea but kept arguing about one subpoint.
