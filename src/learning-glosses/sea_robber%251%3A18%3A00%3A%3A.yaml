simpleMeaning: A person who steals from ships on the water, or steals from land after coming by ship,
  holding no license from any nation.
scope: Also called pirate, buccaneer, and sea rover. It is a noun.
examples:
- The sea robber took the ship's gold and sailed away.
- They feared the sea robber who came ashore at night.
