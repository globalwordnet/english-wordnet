simpleMeaning: A single piece of clothing worn under other clothes, with a top and bottom joined together.
scope: Also called long underwear. It is not two separate pieces of clothing.
examples:
- They wore a union suit under overalls on cold days.
- The union suit kept a person warm from neck to ankle.
