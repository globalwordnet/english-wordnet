simpleMeaning: Said of someone whose legs bend out at the knees, away from each other.
scope: Also called bowed, bandy, bowlegged, or bowleg, this is one way to describe a person's legs.
examples:
- The bandy-legged child ran across the field, knees pointing out.
- Their bandy-legged cousin ran onto the field, knees pointing out at every step.
