simpleMeaning: A hormone released by the front of the pituitary gland or by the placenta that stimulates
  the ovaries or testes and helps control reproduction.
scope: 'Also called gonadotrophic hormone, gonadotrophin, and gonadotropic hormone: a body chemical that
  wakes the sex glands and runs the making of young, not a sex gland itself and not a medicine.'
examples:
- Gonadotropin is made by the pituitary gland and the placenta.
- Gonadotropin tells the sex glands to start working.
