simpleMeaning: The middle part of the bit of a plant that will become a seed, holding the bag in which
  the young plant first forms.
scope: It is a part of a plant.
examples:
- The nucellus sits at the center of the ovule and holds the embryo sac.
- In the flower, the nucellus surrounds the tiny sac where the seed begins to grow.
