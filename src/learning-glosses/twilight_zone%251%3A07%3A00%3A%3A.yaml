simpleMeaning: A state that is neither one kind of thing nor the other, usually with marks of both in
  it.
scope: It is also called no man's land.
examples:
- The new rules put freelancers in a twilight zone between staff and outsiders.
- Their job sits in a twilight zone between teaching and research.
