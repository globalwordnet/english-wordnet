senseId: 'nouveau-riche%1:18:00::'
synsetId: 10760525-n
simpleMeaning: A person who has lately come into a lot of money but is still not taken in by others of
  the same standing.
scope: Also called an upstart, an arriviste, or a parvenu. It is a noun.
examples:
- The nouveau-riche bought the biggest house on the street, but the old families still kept their distance.
- They made a fortune in trade, yet the nouveau-riche were never asked to the best parties.
