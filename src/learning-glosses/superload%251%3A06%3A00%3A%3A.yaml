simpleMeaning: Like moving traffic, a weight on a bridge or other built thing keeps changing.
scope: Also called a live load, this is the changing weight carried on a structure.
examples:
- Moving traffic counts as a superload on the bridge.
- The engineers worked out the superload before they opened the bridge.
