simpleMeaning: A paper that sets out the loan on a house or land, giving the lender the right to take
  it if the loan is not paid back.
scope: It is the paper itself, not the loan or the house.
examples:
- The bank keeps the mortgage deed until the loan is paid off.
- They signed the mortgage deed when they bought the house.
