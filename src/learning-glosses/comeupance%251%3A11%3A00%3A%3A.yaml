simpleMeaning: The fair result of what a person did, good or bad.
scope: Comeuppance, just deserts, and poetic justice are other names for it.
examples:
- After years of cheating their workers, the boss got a comeupance when the firm went broke.
- The young clerk's comeupance was a promotion the whole office agreed was fair.
