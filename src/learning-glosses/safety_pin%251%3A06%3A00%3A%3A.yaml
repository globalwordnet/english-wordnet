senseId: 'safety_pin%1:06:00::'
synsetId: 04134350-n
simpleMeaning: A fastener in the form of a clasp, bent back on itself so its sharp end stays covered and
  cannot stick the wearer.
scope: This fastener is bent into a clasp, with a guard over the point.
examples:
- They fastened it with a safety pin.
- The safety pin held it in place.
