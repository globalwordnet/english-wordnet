simpleMeaning: The use of two or more different patterns of meter at the same time.
scope: It is a word for music.
examples:
- The typical polymetry of black music means that there are at least two, and usually more, rhythms going
  on alongside the listener's own beat.
- The drummer kept a polymetry going with two rhythms at once.
