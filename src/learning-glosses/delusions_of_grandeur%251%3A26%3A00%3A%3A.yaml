simpleMeaning: The false belief that you are far greater, more powerful, and more influential than you
  really are, a belief often found in paranoia.
scope: This one is about a belief that is not true.
examples:
- A person with delusions of grandeur believed they should rule the country.
- The speaker talked of delusions of grandeur as if they were a great ruler.
