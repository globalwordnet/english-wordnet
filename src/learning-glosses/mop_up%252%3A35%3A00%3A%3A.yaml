simpleMeaning: To wash or wipe dirt or liquid from a surface with a long-handled tool ending in a bundle
  of soft cloth, or with anything used in the same way.
scope: It is also called mop, and wipe up is another name for it.
examples:
- Mop up the water on the kitchen floor before someone slips on it.
- They mopped up the spill with a towel.
