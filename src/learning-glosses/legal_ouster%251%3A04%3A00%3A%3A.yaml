simpleMeaning: The forcing out of a person, such as a tenant, from land they hold, through court proceedings.
scope: It is also called eviction or dispossession.
examples:
- The farmer faced a legal ouster from the land they had worked for years.
- A legal ouster removed the tenant from the land.
