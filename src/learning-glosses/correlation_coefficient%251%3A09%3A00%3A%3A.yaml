senseId: 'correlation_coefficient%1:09:00::'
synsetId: 06041776-n
simpleMeaning: A statistic measuring how closely two variables change together, from −1 for perfect negative
  correlation through 0 for no correlation to +1 for perfect positive correlation.
scope: This sense is also called correlation and coefficient of correlation, a number gauging how close
  two things move as one, from minus one for full back-link, through nought for no link and to one more
  for full forward linking.
examples:
- Correlation coefficients run from minus one to plus one.
- The correlation coefficient gauges how close two things move.
