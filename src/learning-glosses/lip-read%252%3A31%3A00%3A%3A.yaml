simpleMeaning: To work out what a person is saying by watching the mouth move, said of people who cannot
  hear.
scope: It is also called lipread, and speech-read is another name for it.
examples:
- They lip-read the speaker from across the room.
- The deaf student lip-read the teacher's words.
