simpleMeaning: Silicon, a four-bond-forming metalloid. Only oxygen is more abundant in Earth's crust.
  It occurs in clay, feldspar, granite, quartz, and sand and serves as a semiconductor in transistors.
scope: A nonmetal common in the earth's crust, not oxygen and not a metal; also called silicon and atomic
  number 14.
examples:
- Si is found in sand and in quartz.
- Transistors are made with Si.
