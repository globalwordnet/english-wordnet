simpleMeaning: The chemical symbol for lithium, a soft, silver-white alkali metal with a valence of one.
  It is the lightest metal and occurs in several minerals.
scope: A soft silver-white metal, the least heavy metal known, found in several minerals; also called
  lithium and atomic number 3, and not the letter, and not the unit for amounts of liquid.
examples:
- Lithium is the lightest metal.
- Lithium is used in small batteries.
