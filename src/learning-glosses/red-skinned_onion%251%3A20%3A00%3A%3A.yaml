simpleMeaning: A bulb with an outer covering that runs from white to a deep colour like that of blood,
  found in California.
scope: Also called Allium haematochiton. It is a kind of bulb.
examples:
- The red-skinned onion in the market had an outer covering the colour of blood.
- They grew red-skinned onions in a California garden.
