simpleMeaning: Said of something that can make amends for a wrong, or is given to make amends or regain
  favour.
scope: This one is also called expiative and propitiatory.
examples:
- The priest called the offering an expiatory rite, meant to set things right.
- An expiatory fast was kept for three days after the offence.
