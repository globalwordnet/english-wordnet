senseId: 'north_northwest%1:24:00::'
synsetId: 13857362-n
simpleMeaning: A compass point that stands halfway between the map's top edge and the direction that is
  halfway from that edge toward the sunset side.
scope: Also called nor'-nor'-west, and NNW for short. It is a noun.
examples:
- The needle settled on north northwest.
- They held a course of north northwest until morning.
