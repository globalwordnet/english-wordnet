simpleMeaning: Said of a tale or a picture that lends an animal or a lifeless thing the ways of a person.
scope: This sense is also called anthropomorphous, and humanlike is another name for the same sense.
examples:
- The cartoon gives the anthropomorphic fox a grumpy voice and a morning routine.
- The children laughed at the anthropomorphic teapot that complained about the cold.
