simpleMeaning: A medium-sized, symmetrical evergreen tree with red flowers, widely grown in the tropics
  for the flower buds used as cloves.
scope: A tree grown for the spice; not the spice itself, not the dried bud, and not a piece of garlic,
  the other clove senses.
examples:
- Cloves grow on a clove tree in the tropics.
- The farmer planted a clove tree behind his house.
