simpleMeaning: A tuft or some other part stands up on the head of a bird or animal, most often for show,
  and it is often used with another word.
scope: Also called crested and tufted, this is said of a bird or animal with a tuft on its head, most
  often for show, not of one with a bare head.
examples:
- The topknotted bird had a tuft standing up on its head.
- They saw a topknotted duck with a tuft standing up on its head.
