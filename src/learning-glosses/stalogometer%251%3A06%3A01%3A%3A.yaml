simpleMeaning: A tool for finding how strongly the top of a liquid pulls together, by letting drops fall
  from a tube.
scope: Also called stactometer and stalagmometer. It is a tool.
examples:
- The scientist used the stalogometer to test the water.
- A stalogometer showed that soap made the top of the water pull less strongly.
