simpleMeaning: A large mackerel with a long, pointed snout, valued for food and sport along the Atlantic
  coast of the Americas as far south as Brazil.
scope: A big mackerel, also called cero and king mackerel; not a small mackerel and not a freshwater fish.
examples:
- The cavalla struck the lure off the Florida coast.
- A cavalla makes a fine catch for the table.
