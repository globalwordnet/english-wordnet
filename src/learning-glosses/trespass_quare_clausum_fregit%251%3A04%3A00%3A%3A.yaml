simpleMeaning: A person goes onto another person's land with no right to be there.
scope: This wrong is done by setting foot on land that belongs to someone else, with no right to be there,
  and it is not a court case for getting money back.
examples:
- A stranger had entered their land, so they brought a trespass quare clausum fregit.
- They sued for trespass quare clausum fregit when a hunter walked across their field.
