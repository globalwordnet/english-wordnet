simpleMeaning: One belief, or several beliefs together, that some group trusts and follows as right.
scope: Also called philosophy, doctrine, ism, and a philosophical system. It is a noun.
examples:
- One school of thought holds that markets fix themselves.
- The two schools of thought disagree about the role of the state.
