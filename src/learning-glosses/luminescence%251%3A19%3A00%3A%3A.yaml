simpleMeaning: Light given off at relatively low temperatures by a process other than heating something
  until it glows.
scope: Light that comes out without heat, not the light a very hot thing gives off when it glows.
examples:
- The luminescence of the deep-sea fish lit the dark water.
- Scientists measured the luminescence from the cold sample.
