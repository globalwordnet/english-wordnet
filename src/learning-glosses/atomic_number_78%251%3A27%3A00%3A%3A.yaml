simpleMeaning: Platinum, a heavy precious metal that is gray-white and resists corrosion. It occurs in
  some nickel and copper ores and also in pure form.
scope: Also called platinum and Pt; a heavy precious metal, grey-white and slow to rust, distinct from
  light metals and from metals that rust fast.
