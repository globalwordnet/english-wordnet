simpleMeaning: A quantity whose value depends on the outcome of a chance event.
scope: It is also called a variant, a chance variable, a stochastic variable, or a variate.
examples:
- The number shown by the dice is a random variable, since no one can tell what it will be.
- The height of the next pupil to walk in is a random variable.
