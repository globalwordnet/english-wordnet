simpleMeaning: An autosomal dominant form of muscular dystrophy that begins between ages 40 and 60 and
  causes weakness and wasting in the hands, forearms, and lower legs.
scope: A muscle-wasting illness setting in from 40 to 60, weakening the hands, forearms, and lower legs;
  passed on as a dominant trait.
examples:
- Distal muscular dystrophies waste hand muscles.
- The distal muscular dystrophy sets in from 40 to 60.
