simpleMeaning: Outside the group of players ranked highest before a tournament, usually because other
  competitors have a higher ranking.
scope: It is said of a player, not of a thing.
examples:
- The unseeded player beat a top-ranked rival in the first round.
- An unseeded newcomer reached the final against all odds.
