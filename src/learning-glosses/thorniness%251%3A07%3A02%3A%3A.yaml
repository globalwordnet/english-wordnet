senseId: 'thorniness%1:07:02::'
synsetId: 92418468-n
simpleMeaning: The state of having many hard problems, tangled details, or points people argue about.
scope: It is not about sharp points on a surface, and not a harsh way of acting.
examples:
- And, given the thorniness of the issues on the table, a work stoppage at all West Coast ports is not
  to be ruled out.
- The thorniness of the tax rules slowed the talks.
