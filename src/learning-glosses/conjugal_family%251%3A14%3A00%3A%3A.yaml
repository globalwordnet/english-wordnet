simpleMeaning: A household made up of parents and their children, together with the grandparents of one
  of the parents.
scope: Also called nuclear family, this one is about a household that reaches beyond parents and children.
examples:
- The conjugal family gathered for the photograph, grandparents and all.
- The conjugal family counted the grandparents of the father among its members.
