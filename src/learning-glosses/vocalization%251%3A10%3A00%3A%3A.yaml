simpleMeaning: Sound produced by vibrating vocal folds and shaped by the spaces in the throat, mouth,
  and nose.
scope: Also called voice, phonation, vocalisation, vocalism, and vox, it is a sound that comes from the
  shaking of small folds in the throat.
