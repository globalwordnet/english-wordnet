simpleMeaning: A liking that comes only after a lot of time spent with the thing.
scope: This one is learned over time, not liked from birth.
examples:
- At first they hated olives, but olives became an acquired taste after many meals.
- Coffee was an acquired taste for them; they only began to enjoy it after weeks of drinking it.
