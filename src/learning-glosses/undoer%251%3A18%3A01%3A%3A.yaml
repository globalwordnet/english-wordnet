simpleMeaning: A person who loosens ties and knots, takes wrapping off things, or opens what is shut.
scope: Opener, unfastener, and untier are other names for it; it is not a name for one who destroys things.
examples:
- Children are talented undoers of their shoelaces.
- The new guard was a quick undoer of jammed doors.
