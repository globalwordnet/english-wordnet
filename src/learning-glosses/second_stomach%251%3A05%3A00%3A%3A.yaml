simpleMeaning: A part of the belly of an animal that eats plants and brings them up again to chew, coming
  after the first part.
scope: Also called reticulum. It is a part of the belly.
examples:
- The vet said the blockage was in the cow's second stomach.
- Food moves from the first stomach into the second stomach.
