simpleMeaning: A stretch of water goes up and spills over onto land that is dry most of the time.
scope: Also called flood, deluge, or inundation, this one is not the new land the water makes, nor the
  clay it drops where it slows down.
examples:
- The alluvion covered the fields after the river rose.
- Farmers watched the alluvion spread across the dry land.
