simpleMeaning: An infection people can catch from birds that can cause pneumonia.
scope: Also called parrot fever. The infection is caused by the bacterium Chlamydia psittaci.
examples:
- A keeper caught psittacosis after handling a sick parrot.
- Psittacosis passed from sick birds to people.
