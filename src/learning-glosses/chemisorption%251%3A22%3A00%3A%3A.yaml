senseId: 'chemisorption%1:22:00::'
synsetId: 13469096-n
simpleMeaning: The attachment of substances to a surface through chemical bonding rather than physical
  attraction, especially when the attachment is irreversible.
scope: This is also called chemosorption.
examples:
- The nitrogen stays fast on the iron surface by chemisorption.
- The catalyst works by chemisorption, taking in gas that will not come off.
