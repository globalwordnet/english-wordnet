simpleMeaning: Without the tightness a muscle should hold at rest, the muscle stays slack.
scope: This one, also called amyotonia, atonia, or atonicity, is not a muscle keeping its tightness.
examples:
- The atony showed in a body that lay limp, with no firmness in the limbs.
- They found atony in the throat muscles, which stayed loose and open.
