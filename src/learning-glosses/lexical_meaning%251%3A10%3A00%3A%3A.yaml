simpleMeaning: The sense of a word that names a thing, action, or quality, which rests on the ideas outside
  language it stands for.
scope: It is a kind of sense.
examples:
- The lexical meaning of 'dog' is the animal it names.
- The lexical meaning of 'run' is the action it names.
