simpleMeaning: The people of a community seen as one whole, bound by the set patterns of how its members
  relate to each other.
scope: Also called structure, social organisation, social organization, and social structure. It is a
  group.
examples:
- The social system of the village changed slowly over the years.
- In a stable social system, neighbours know their roles and their ties to one another.
