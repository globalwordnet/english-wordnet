simpleMeaning: To make a mess of something or ruin it.
scope: It is also called blow, fumble, spoil, fluff, bumble, botch, bungle, muff, bobble, mishandle, flub,
  ball up, bodge, bollix, bollix up, bollocks, bollocks up, botch up, foul up, fuck up, louse up, mess
  up, or screw up.
examples:
- They mucked up the cake by adding salt instead of sugar.
- The new worker mucked up the order and had to start again.
