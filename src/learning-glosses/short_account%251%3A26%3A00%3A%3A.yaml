senseId: 'short_account%1:26:00::'
synsetId: 13952369-n
simpleMeaning: A brokerage account used by someone who sells securities they do not own, hoping to buy
  them back at a lower price.
scope: This is the broker's record for one person who sells securities they do not own, not the total
  of all such sales on the open market.
examples:
- The broker opened a short account for the trader.
- He sold the shares through a short account although he did not own them.
