simpleMeaning: Pain in the lower back. Possible causes include muscle strain, arthritis, poor blood supply,
  and a ruptured disc between the bones of the spine.
scope: The term describes the location of the pain. Its cause can vary.
examples:
- She reported lumbar pain after a long day of lifting boxes.
- In his case, arthritis contributed to the lumbar pain.
