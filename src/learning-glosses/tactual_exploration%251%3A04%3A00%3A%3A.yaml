simpleMeaning: Size, shape, firmness, or place can be found out by touch; when the thing is part of a
  body, a health worker does the checking.
scope: This is also called palpation.
examples:
- The doctor used tactual exploration to check the size of the swelling.
- Through tactual exploration, the nurse felt where the bone was broken.
