simpleMeaning: A roof in two sloping halves joined along a top ridge, with a gable closing each end.
scope: Its two halves meet along a top ridge between end gables, also called a gable roof, a saddle roof,
  or a saddleback.
examples:
- The saddleback roof had gables at both ends.
- Snow slid off the saddleback roof on both sides.
