simpleMeaning: To bend the body forward, or curl into a ball, most often from laughing or being in pain.
scope: This one is also called double and double over; it has nothing to do with a bet.
examples:
- Everyone doubled up with laughter at the joke.
- The runner doubled up in pain halfway through the race.
