senseId: 'reflexive_pronoun%1:10:00::'
synsetId: 06339200-n
simpleMeaning: A personal pronoun ending in -self or -selves, such as myself or themselves, used when
  an action affects the person or people who perform it.
scope: 'This is also called reflexive: in grammar, a word like ''myself'' that points back to the doer.'
examples:
- In 'I hurt myself', the reflexive pronoun 'myself' points back to 'I'.
- The sentence 'He blamed himself' uses a reflexive pronoun, with 'himself' pointing back to 'He'.
