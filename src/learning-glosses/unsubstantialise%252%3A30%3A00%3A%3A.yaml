simpleMeaning: To make a thing lose its body, so that no one can touch it.
scope: Also called immaterialise, immaterialize, and unsubstantialize. It is a verb, not a noun.
examples:
- The storyteller would unsubstantialise the ghost until it was only a voice.
- The magician seemed to unsubstantialise the solid wall before our eyes.
