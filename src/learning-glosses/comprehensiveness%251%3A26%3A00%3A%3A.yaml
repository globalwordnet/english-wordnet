simpleMeaning: The fact that a thing covers a wide range, leaving nothing out.
scope: Fullness is another name for this thing; it is not about one part alone.
examples:
- The comprehensiveness of the report surprised everyone; it left no question unanswered.
- We praised the comprehensiveness of the new guide to the city.
