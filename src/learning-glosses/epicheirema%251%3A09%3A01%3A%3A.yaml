simpleMeaning: A syllogism, or formal argument, that includes a statement supporting one or both of its
  premises.
scope: This one is about a kind of argument.
examples:
- An epicheirema is said to be of the first or second order according as the major or minor premiss is
  thus supported.
- The epicheirema in the speech backed its main claim with a further point.
