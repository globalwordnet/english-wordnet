simpleMeaning: In computing, the part of an instruction that specifies an operation, or the complete set
  of operations a computer can perform.
scope: Also called an operation code. It is a noun.
examples:
- The order code tells the computer to add the two numbers.
- Each order code names one operation the computer can do.
