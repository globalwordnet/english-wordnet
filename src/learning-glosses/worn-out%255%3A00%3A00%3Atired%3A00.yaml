simpleMeaning: Completely exhausted, with little energy or ability to function left.
scope: Also called spent, gone, exhausted, fatigued, fagged, dog-tired, played out, washed-out, and worn
  out. It is said of a person or a thing.
examples:
- After the long climb, they felt completely worn-out.
- The old battery was worn-out and would not hold a charge.
