simpleMeaning: A noncancerous tumor made of muscle cells of the kind found in the heart or the muscles
  that move bones.
scope: The tumor can occur in cardiac or skeletal muscle.
examples:
- The rhabdomyoma was found in the muscle.
- The rhabdomyoma did not spread to other parts of the body.
