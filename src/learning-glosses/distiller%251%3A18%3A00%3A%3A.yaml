simpleMeaning: A person who makes strong drink by heating a liquid until it turns to steam and then cooling
  the steam back to liquid.
scope: This one is about the person, not about the drink itself.
examples:
- The distiller in the small town makes whisky from grain.
- Visitors watched the distiller at work, heating the liquid in a big copper pot.
