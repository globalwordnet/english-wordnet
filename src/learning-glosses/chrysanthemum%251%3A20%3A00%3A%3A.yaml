simpleMeaning: Any of many widely grown perennial Old World plants with showy, brightly colored flower
  heads, including plants in the genera Chrysanthemum, Argyranthemum, Dendranthema, and Tanacetum.
scope: The whole plant, not a single bloom cut from it.
examples:
- Chrysanthemums grow along the back fence and return every autumn.
- The chrysanthemum by the shed grows taller each year.
