simpleMeaning: A grass grown for edible, starchy grain, such as wheat, rice, rye, oats, maize or millet.
  Buckwheat, a similar food crop, belongs to a different plant family.
scope: A grass whose starchy grains are eaten as food, not food made from those grains and not made of
  grain.
examples:
- Wheat is a cereal grown around the world.
- Farmers grow cereal on the plain.
