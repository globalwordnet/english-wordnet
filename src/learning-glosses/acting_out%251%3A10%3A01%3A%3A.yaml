senseId: 'acting_out%1:10:01::'
synsetId: 06901012-n
simpleMeaning: In psychiatry, expressing feelings previously held back, often through actions instead
  of words. In some circumstances this can help the person cope.
scope: Not a sudden burst of bad behaviour and not a stage performance.
examples:
- In therapy, his acting out let him show anger he had held back.
- Her acting out in the session helped her speak about her fear.
