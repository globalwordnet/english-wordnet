simpleMeaning: 'Brown, hard, and crisp: that is what a slice of sweet raised bread becomes when it is
  heated a second time.'
scope: Also called rusk, zwieback, and Brussels biscuit, this name is for a sweet raised loaf, not for
  one eaten soft.
examples:
- She broke the twice-baked bread into pieces.
- The twice-baked bread crunched when they bit it.
