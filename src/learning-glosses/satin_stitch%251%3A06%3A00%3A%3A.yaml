simpleMeaning: Stitches lie flat and close together, so the work has the shine of smooth cloth.
scope: This sense names flat stitches set so close that the work shines like smooth cloth.
examples:
- The satin stitch covered the cloth with flat, close stitches.
- They used satin stitch to fill the cloth with a smooth shine.
