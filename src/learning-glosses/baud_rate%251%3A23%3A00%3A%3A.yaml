simpleMeaning: In computer work, how quickly bits pass through a box that joins a computer to a telephone
  line, measured as bits sent each second.
scope: Also called a baud, this one names a measure of speed.
examples:
- The baud rate of the link was too slow for the large files.
- They raised the baud rate so the two machines could talk faster.
