simpleMeaning: Two small sacs in the inner ear are drained by these veins.
scope: Also called vena vestibularis, these drain blood away from the ear, not toward it.
examples:
- Blood leaves the two small sacs through the vestibular vein.
- They found the vestibular vein swollen where it drains the saccule and utricle.
