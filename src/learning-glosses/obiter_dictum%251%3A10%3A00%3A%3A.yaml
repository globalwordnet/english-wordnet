schema: oewn-learning-gloss-v2
senseId: 'obiter_dictum%1:10:00::'
synsetId: 06778678-n
simpleMeaning: An opinion a judge gives on a point of law with no direct bearing on the case being tried,
  so it does not have to be followed.
scope: Also called a dictum. It is a noun.
examples:
- The judge's obiter dictum on that point of law did not bind the court.
- In an obiter dictum, the judge spoke about a point of law outside the case.
