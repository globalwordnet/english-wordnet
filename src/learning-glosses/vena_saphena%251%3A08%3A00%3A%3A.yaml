simpleMeaning: Either of two main blood vessels lying near the surface of the leg and taking blood from
  the foot.
scope: Also called saphenous vein. It is a blood vessel, not an artery.
examples:
- The nurse put the needle into the vena saphena on the leg.
- The surgeon tied off the vena saphena to treat the swollen leg.
