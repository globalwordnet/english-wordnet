simpleMeaning: Describing something that follows rules that are accepted as right, or widely agreed on.
scope: Sanctioned and canonic are other names for this, not one of the other senses of the same word.
examples:
- The drinking of cocktails was as canonical a rite as the mixing.
- Wearing a tie to dinner was canonical in that house.
