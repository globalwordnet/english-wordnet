simpleMeaning: To take the pure part out of a liquid by turning it into steam and letting it cool back
  to liquid.
scope: Also called extract. Also called distill. It is about a part, not the liquid itself.
examples:
- They distil the essence of this compound.
- They distil rose oil from the flowers.
