simpleMeaning: A way of teaching beginners to read by linking each printed word as a whole to its spoken
  form.
scope: This way of teaching does not start by sounding out single letters.
examples:
- Their class learned to read by the whole-word method, matching printed signs to sounds.
- The whole-word method helped the beginners read whole signs at once, not letter by letter.
