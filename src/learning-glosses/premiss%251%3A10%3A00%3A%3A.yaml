synsetId: 06766514-n
simpleMeaning: A statement taken as true to start with, from which a finding is drawn.
scope: Also called an assumption or a premise, it is a statement.
examples:
- The premiss that all men are mortal leads to the finding that Socrates is mortal.
- They set out their premiss before they drew any finding from it.
