simpleMeaning: A gemstone that can be polished to a high shine. It is usually green but can be whitish.
  It consists of either jadeite or nephrite.
scope: Also called jade, this is a less costly gem made of two kinds of green mineral, most times green
  and at times pale, that can be polished till it shines.
examples:
- The polished jadestone shone green.
- The pale jadestone was polished till it shone.
