simpleMeaning: The quality of being hard to control, and of refusing to do what one is told.
scope: It is a quality, not a feeling of being nervous.
examples:
- The horse's restiveness made it hard for the rider to keep control.
- The restiveness of the child showed as a refusal to follow any order.
