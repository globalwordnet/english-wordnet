simpleMeaning: A large North American Atlantic horseshoe crab with a domed, horseshoe-shaped shell and
  stiff pointed tail. Its ancient lineage belongs to the arthropods, a group that also includes woodlice.
scope: A large sea animal with a horseshoe-shaped shell and a stiff pointed tail; also called horseshoe
  crab, king crab, and Xiphosurus polyphemus.
