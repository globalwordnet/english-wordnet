simpleMeaning: An ancient Middle Indo-Aryan language related to Sanskrit and used in the sacred texts
  and worship of Theravada Buddhism.
scope: Also called Pali; among the old tongues of India, it is the one used for the holy books and worship
  of Theravada Buddhism.
examples:
- The monks studied the Pali language so they could read the texts.
- The Pali language is still used in Theravada Buddhist chanting.
