simpleMeaning: Development of typically male secondary sex characteristics in a girl or woman, or their
  unusually early appearance in a boy.
scope: This is a development, not the usual growth of a boy into a man.
examples:
- The virilism showed in her deep voice and the hair on her face.
- The boy's virilism came on years before other boys his age changed.
