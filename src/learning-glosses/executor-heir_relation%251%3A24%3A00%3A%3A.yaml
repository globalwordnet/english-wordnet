simpleMeaning: The duty of the person who sorts out a dead person's money and goods to look after what
  is best for the one who inherits them.
scope: This one is about a duty.
examples:
- Under the executor-heir relation, the executor could not sell the house for less than it was worth.
- The court reminded them of the executor-heir relation before the estate was shared out.
