simpleMeaning: The lungs send blood full of oxygen to the upper left chamber of the heart through any
  of four blood vessels.
scope: This is one of four blood vessels of the lungs, also called pulmonary vein, not one that carries
  blood low in oxygen.
examples:
- Blood full of oxygen leaves the lungs through the vena pulmonalis.
- During the operation on the chest, the surgeon clamped the vena pulmonalis to stop the flow of blood.
