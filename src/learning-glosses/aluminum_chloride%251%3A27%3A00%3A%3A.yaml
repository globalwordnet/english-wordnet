simpleMeaning: A compound of aluminum and chlorine used to preserve wood or speed up chemical reactions.
scope: Also called aluminium chloride, this one speeds a change up rather than slowing one down.
examples:
- The aluminum chloride kept the garden stakes sound in the damp soil.
- They added aluminum chloride to speed up the change.
