simpleMeaning: The first covering of paint or sticky sealer spread over a surface.
scope: Also called ground, primer, priming, a flat coat, a priming coat, and an undercoat. It is a covering.
examples:
- We put a primer coat on the bare wood before painting it.
- The primer coat keeps the paint from soaking into the wall.
