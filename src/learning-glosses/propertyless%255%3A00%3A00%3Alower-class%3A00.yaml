simpleMeaning: Said of people paid for the work they do, in particular those who labour with their hands
  or on a factory floor.
scope: Also called blue-collar, wage-earning, or working-class. It is a word.
examples:
- The propertyless workers in the town lived on weekly wages.
- Propertyless labourers worked long hours in the factories.
