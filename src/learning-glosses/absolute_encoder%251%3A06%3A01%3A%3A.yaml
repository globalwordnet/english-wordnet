simpleMeaning: A device that measures the angle of a rotating shaft and retains position information when
  power is switched off.
scope: This one's reading stands on its own, not one counted from a starting mark.
examples:
- The absolute encoder on the motor told them the exact angle of the shaft.
- After the power cut, the absolute encoder still showed the right position.
