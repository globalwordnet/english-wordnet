simpleMeaning: The main iron ore, a mineral made of crystalline iron(III) oxide that also occurs in a
  red, earthy form.
scope: People also call this iron ore hematite, and it is iron oxide in crystal form, found as red earth.
examples:
- Haematite is the main ore from which iron is won.
- Red haematite is found as red earth.
