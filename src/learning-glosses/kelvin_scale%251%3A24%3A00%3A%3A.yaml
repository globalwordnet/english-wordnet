simpleMeaning: A temperature scale starting at absolute zero (0 K). At standard atmospheric pressure,
  pure water freezes at about 273.15 K and boils at about 373.15 K.
scope: Temperature on this scale is measured in kelvins. Each kelvin is the same size as one degree Celsius.
examples:
- The Kelvin scale starts at absolute zero.
- Water boils at 373.16 degrees on the Kelvin scale.
