simpleMeaning: Someone who writes a life story that treats its subject with great admiration or presents
  an idealized picture of them.
scope: This writer is also called a hagiographist or a hagiologist.
examples:
- The hagiographer praised every act of the old priest.
- Readers could see the hagiographer had left out all faults.
