simpleMeaning: A bush of the Rocky Mountains, much like Ledum groenlandicum, a shrub of the far north.
scope: This Rocky Mountain bush is also called glandular Labrador tea, and it is only much like Ledum
  groenlandicum, not that plant itself.
examples:
- They found trapper's tea growing on the Rocky Mountain slope.
- The trapper's tea bushes were in flower beside the trail.
