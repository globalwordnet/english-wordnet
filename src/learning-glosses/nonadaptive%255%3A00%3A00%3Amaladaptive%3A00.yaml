simpleMeaning: Said of a trait or condition that fails to help a living thing fit in with its surroundings.
scope: Also called dysfunctional. It is an adjective.
examples:
- The bright colour was nonadaptive; it made the bird easy to see.
- A nonadaptive trait gives the animal no help in staying alive.
