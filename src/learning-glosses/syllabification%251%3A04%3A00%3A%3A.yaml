simpleMeaning: The act of making or splitting words into small sound parts.
scope: Also called syllabication. It concerns the sounds of a word, not its meaning.
examples:
- The teacher showed the class the syllabification of 'butterfly'.
- Syllabification helps readers break long words into parts they can say.
