simpleMeaning: An antiviral drug sold as Retrovir and used to treat HIV, including in people with AIDS.
  It can harm the liver and reduce blood cell production in bone marrow.
scope: This virus-fighting drug treats AIDS and can harm the liver and hold back the bone marrow.
examples:
- He took zidovudine to treat his AIDS.
- She stayed on zidovudine through her AIDS treatment.
