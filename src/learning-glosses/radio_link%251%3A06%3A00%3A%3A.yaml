simpleMeaning: A system that sends messages both ways by waves, most often by very short waves, as part
  of a larger network carrying messages over long distances.
scope: It is also called a link.
examples:
- The radio link carried calls between the two towns.
- Engineers set up a radio link to join the island to the mainland network.
