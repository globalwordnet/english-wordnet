synsetId: 06117686-n
simpleMeaning: In quantum theory, this principle says you cannot measure both energy and time, or both
  where it is and its speed and weight, with full exactness at once.
scope: Also called indeterminacy principle, this rule in quantum theory is about the limits of measurement,
  not a rule that such measurement can be fully exact.
examples:
- The uncertainty principle says we cannot measure both the energy and the time exactly.
- By the uncertainty principle, we cannot measure both where a thing is and its speed and weight.
