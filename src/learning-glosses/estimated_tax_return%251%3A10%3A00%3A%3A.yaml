simpleMeaning: The paper someone files when the money taken from their pay during the year comes to less
  than the sum due.
scope: This one is also called declaration of estimated tax.
examples:
- They filed an estimated tax return after too little had been held back from their pay.
- An estimated tax return was due because the year's withholding fell short.
