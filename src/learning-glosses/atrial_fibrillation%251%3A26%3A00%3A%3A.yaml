simpleMeaning: A fast, uneven shaking of the muscles in the upper rooms of the heart.
scope: This one is about the upper rooms of the heart, not the lower ones.
examples:
- The doctor found atrial fibrillation in the patient, whose heartbeat was fast and uneven.
- The pulse felt weak and irregular at the wrist in atrial fibrillation.
