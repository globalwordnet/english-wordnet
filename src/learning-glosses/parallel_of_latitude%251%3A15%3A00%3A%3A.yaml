simpleMeaning: An imaginary line around the Earth that keeps an equal distance from the equator at every
  point.
scope: Also called parallel, latitude, or a line of latitude. It is an imaginary line.
examples:
- They drew the parallel of latitude across the map before the lesson.
- The ship crossed the parallel of latitude 30 degrees south at dawn.
