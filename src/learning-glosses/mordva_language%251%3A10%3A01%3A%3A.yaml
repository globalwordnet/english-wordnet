simpleMeaning: A name for the related languages of the Mordvin peoples of Russia, Erzya and Moksha, traditionally
  grouped with the Finnic languages.
scope: Also called Mordva, Mordvin, Mordvin language, Mordvinian and Mordvinian language, this is a tongue,
  not a member of that people.
examples:
- Mordva language is one of the Finnic tongues.
- She speaks Mordva language at home.
