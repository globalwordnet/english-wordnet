simpleMeaning: A garden plant that lasts a single season, with spikes of red or yellow flowers shaped
  like feathers.
scope: This one is also called common cockscomb, Celosia argentea cristata, and Celosia cristata, not
  the red crest on a bird's head.
examples:
- The cockscomb in the front bed showed red spikes all summer.
- They planted cockscomb along the path for its yellow flowers.
