simpleMeaning: A flexible investment company for a few large investors, usually requiring $1 million minimum,
  that can use risky methods barred to mutual funds, including short-selling and extensive borrowing.
scope: A money company with plans it can change, for a few big backers, also called hedge fund; not a
  common savings plan and not a bank.
examples:
- The hedgefund used risky ways to make money for a few big backers.
- Big backers usually put in a million dollars or more to join a hedgefund.
