simpleMeaning: A musician who plays jazz with the beat shifted off its usual place, usually in a band
  that plays for dancing.
scope: It is about a player, not about the music itself.
examples:
- The syncopator led the band through a fast jazz number.
- The young syncopator joined a dance band in New Orleans.
