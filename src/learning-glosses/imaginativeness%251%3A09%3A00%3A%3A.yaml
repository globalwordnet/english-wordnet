simpleMeaning: Forming in the mind a picture of something that the senses do not show as real and that
  is not there to be seen.
scope: Vision and imagination are other names for it.
examples:
- The child's imaginativeness filled the empty room with dragons and flying ships.
- Imaginativeness lets a reader see places that are not there to be seen.
