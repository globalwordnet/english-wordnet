simpleMeaning: A sea sponge of the Hyalospongiae group with a skeleton of tiny glasslike needles made
  of silica.
scope: A sea animal with a body of clear hard needles; not a soft sea animal used for washing and not
  a coral.
examples:
- Glass sponges grow in deep cold water.
- The glass sponge has a body of tiny needles.
