simpleMeaning: The branch of the Indo-European language family that includes the Indo-Aryan and Iranian
  language groups.
scope: This is one branch of the large family of tongues of Europe and Asia; Indo-Iranian language is
  another name for this sense, and it covers the tongues of India and Iran, not the whole family and not
  one group on its own.
examples:
- Indo-Iranian covers both the tongues of India and the tongues of Iran.
- Scholars group Hindi and Persian under Indo-Iranian.
