simpleMeaning: Small fishes found chiefly in fresh or brackish water, often in warm regions. Some are
  kept in aquariums, used as bait, or valued for eating mosquito larvae.
scope: Killifish include many species. Some also live in coastal salt water.
examples:
- The killifish swam in a group in the warm water.
- Killifish kept the mosquitoes down.
