simpleMeaning: Soap and dirt leave a thing when it is washed with water.
scope: This is the act of washing soap or dirt from a thing, also called rinse.
examples:
- You should rinse off the soap before you put the plate away.
- The dirt rinsed off the boots when they were washed.
