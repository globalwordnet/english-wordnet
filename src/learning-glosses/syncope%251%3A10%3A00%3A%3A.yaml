synsetId: 07147437-n
simpleMeaning: In the study of speech sounds, sounds drop out from inside a word, as when 'fo'c'sle' stands
  for 'forecastle'.
scope: This is also called syncopation, and it is not a sudden loss of consciousness.
examples:
- The word lost a sound from inside it through syncope, so 'forecastle' came out as 'fo'c'sle'.
- Through syncope, 'family' comes out as 'fam'ly'.
