simpleMeaning: The worth of a thing going down, as its cost is spread over years.
scope: Also called amortization, this one is about a thing losing value over years, while the other sense
  of this word is about paying off what is owed.
examples:
- The amortisation of the machine showed on the books each year.
- They worked out the amortisation before they set the price.
