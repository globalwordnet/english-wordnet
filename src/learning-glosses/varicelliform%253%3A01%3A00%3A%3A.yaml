simpleMeaning: Said of a thing with spots on the skin like the ones chickenpox makes.
scope: It is a word for a look, not for the illness itself.
examples:
- The varicelliform spots on the child's arms looked like chickenpox.
- A varicelliform rash can be hard to tell from the real thing.
