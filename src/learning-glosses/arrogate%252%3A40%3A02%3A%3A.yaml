senseId: 'arrogate%2:40:02::'
synsetId: 02280210-v
simpleMeaning: To demand something as one's due or claim that one has a right to it.
scope: Also called claim and lay claim, this one is not the other sense of this word, which takes power
  or a thing and keeps it, with force if need be.
examples:
- They arrogated the suitcases at the airline counter, saying the bags were theirs by right.
- They arrogated a special tax break, saying they were owed it as foreign residents.
