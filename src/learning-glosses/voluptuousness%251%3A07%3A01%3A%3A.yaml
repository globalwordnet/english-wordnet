simpleMeaning: Things that please the senses and are full and rich show this quality.
scope: This quality is also called lushness or luxuriance, not something that excites.
examples:
- The voluptuousness of the garden lay in its thick green growth and sweet smells.
- They loved the voluptuousness of the feast, with dish after dish set before them.
