senseId: 'threatened_abortion%1:04:00::'
synsetId: 00231691-n
simpleMeaning: Signs in early pregnancy, such as bleeding, that suggest a miscarriage is possible. The
  pregnancy may continue.
scope: This is also called imminent abortion, and it is the signs that point to a coming loss, not the
  loss itself.
examples:
- They said it was a threatened abortion after the signs showed up.
- They watched for the signs of a threatened abortion.
