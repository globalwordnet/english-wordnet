simpleMeaning: A district overseen by an archbishop or metropolitan, or a territorial division of a religious
  order.
scope: A church area under a high church leader, not a town or county and not a single church building.
examples:
- The US is divided into 33 ecclesiastical provinces.
- Each ecclesiastical province is led by an archbishop.
