simpleMeaning: A person who runs a client's work with a firm that sells advertising, or with a broker,
  or with another firm that sells a service.
scope: This one is also called account representative, customer's broker, and registered representative.
examples:
- The account executive called the client to talk over the new advertising plan.
- Their account executive arranged the meeting with the broker before lunch.
