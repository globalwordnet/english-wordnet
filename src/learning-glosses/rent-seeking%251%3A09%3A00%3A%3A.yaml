simpleMeaning: The idea that a person or firm tries to get rich by twisting the economic conditions to
  its own gain, instead of earning money by making or selling things.
scope: Also called rent seeking. It is a theory.
examples:
- Rent-seeking grows when firms seek favours from the state.
- They study rent-seeking in markets where firms seek profit without producing.
