simpleMeaning: Neither side can win, so the fight between them usually drags on.
scope: This is a fight with no winner, not soldiers fighting from ditches.
examples:
- They realized the election campaign had become a form of trench warfare.
- Neither side could win, and the trench warfare between the two companies dragged on.
