simpleMeaning: Said of an early look that turns out to be wrong.
scope: Also called at first sight, this one is not about a look that stays right.
examples:
- At first glance the house looked empty, but lights came on inside.
- The plan seemed simple at first glance, yet it took weeks to finish.
