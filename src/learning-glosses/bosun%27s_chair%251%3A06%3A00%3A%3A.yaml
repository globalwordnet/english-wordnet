simpleMeaning: A rope holds a board up so that someone working high up or over the side of a ship has
  somewhere to sit.
scope: This one is also called boatswain's chair.
examples:
- The sailor sat in the bosun's chair to paint the mast.
- They hauled the painter up in the bosun's chair to reach the top of the mast.
