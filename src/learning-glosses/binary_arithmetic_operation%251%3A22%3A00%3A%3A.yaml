simpleMeaning: An operation following the rules of Boolean logic, in which each input and the result can
  take one of two values.
scope: It is another name for binary operation and for boolean operation.
examples:
- The machine carries out a binary arithmetic operation on two yes-or-no values and gives back one of
  the same two.
- 'AND is one such binary arithmetic operation: it takes two values and returns one of them.'
