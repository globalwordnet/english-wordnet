scope: 'Also called bonobo and pygmy chimpanzee: a small ape of wet forests, not the common ape of dry
  land and not a monkey.'
examples:
- Pan paniscus lives in the wet forests of Zaire.
- The Pan paniscus is a small ape at risk of dying out.
