simpleMeaning: A white blood cell, part of the body's defense against infection. Some white blood cells
  engulf and digest microbes such as bacteria and fungi.
scope: Blood cells that take in and break down germs and fungi, also called leucocytes, leukocytes, white
  blood cells, white blood corpuscles, white cells and white corpuscles, an important part of the body's
  defence against disease.
examples:
- The nurse checked his WBC count.
- WBCs fight germs in the blood.
