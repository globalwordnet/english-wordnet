simpleMeaning: An assumption, or set of assumptions, on which a plan, calculation, or explanation is based.
scope: Used for the ideas a piece of reasoning rests on.
examples:
- The belief that people act in their own interest is the fundament of the theory.
- When that assumption failed, the argument lost its fundament.
