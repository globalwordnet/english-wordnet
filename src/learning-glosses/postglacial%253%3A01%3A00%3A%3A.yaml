simpleMeaning: Relating to or occurring after a period when glaciers covered large areas of land.
scope: It is a word for what comes after an ice age, not for the ice age itself.
examples:
- Postglacial lakes formed as the ice melted.
- The postglacial forest grew back slowly after the ice age.
