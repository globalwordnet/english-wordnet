simpleMeaning: A pull that carries the water back out from the shore once the waves have broken.
scope: This pull of water is also called undertow, sea-purse, sea-puss, sea purse, and sea puss.
examples:
- The sea-poose pulled the water back out after the waves broke.
- The sea-poose runs back out to sea under the broken waves.
