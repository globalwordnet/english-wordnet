simpleMeaning: A drink brewed from tea leaves that have undergone little oxidation, a chemical change
  involving oxygen.
scope: This one is brewed, unlike drinks made from leaves left in the air much longer.
examples:
- They spread the leaves in the air for a short time, then brewed white tea from them.
- The growers pick the leaves for white tea before they have spent long in the air.
