simpleMeaning: A lack of knowledge, above all about the beliefs a faith holds as true.
scope: Also called unknowing, unknowingness, or ignorantness.
examples:
- Their nescience about the church's teachings showed in every answer they gave.
- The nescience of the new members about the old beliefs worried the elders.
