senseId: 'eminent_domain%1:07:00::'
synsetId: 05194455-n
simpleMeaning: The right of the government to take what a person owns for everyone to use, with fair payment
  set by the Fifth Amendment to the Constitution of the United States.
scope: This one is about a right.
examples:
- The city used eminent domain to take the land for a new road.
- The state used eminent domain to build a highway through private land.
