simpleMeaning: A measure of weight used in Britain, equal to two thousand two hundred and forty pounds.
scope: This word is also called a ton, and a long ton is another name for the same weight.
examples:
- The cargo weighed three gross tons.
- The ship's cargo came to just over two gross tons.
