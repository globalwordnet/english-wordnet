simpleMeaning: This forked stick bends down over liquid or oil under the ground, or so people say.
scope: Also called a divining rod, a dowsing rod, a dowser, or a waterfinder, and it is said to work only
  for what lies under the ground, not for what lies on the surface.
examples:
- They held the water finder out over the dry field and watched for the stick to dip.
- They used the water finder to look for a place to dig a well.
