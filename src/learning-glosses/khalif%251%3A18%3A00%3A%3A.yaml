simpleMeaning: The one person who heads a Muslim state, in charge of both its rule and its faith, and
  held to act for Allah on earth.
scope: Other spellings are caliph, calif, kalif, kaliph, and khalifah.
examples:
- The khalif received the envoys in the palace.
- The khalif rode through the city at the head of a long procession.
