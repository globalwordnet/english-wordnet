simpleMeaning: An early twentieth-century movement of American and English poets who rejected Victorian
  sentimentality and used everyday speech, free verse, and clear images of concrete things.
scope: A way of writing poems in plain speech with clear pictures.
examples:
- His poems show imagism in their short, clear lines.
- She studied imagism and the poets who wrote in free verse.
