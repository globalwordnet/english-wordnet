simpleMeaning: A black-and-yellow beetle whose adults and larvae eat potato leaves. Originally from the
  eastern Rocky Mountains, it is now widespread around the world.
scope: Also called potato beetle, potato bug, Colorado beetle and Leptinotarsa decemlineata, this is a
  black-and-yellow bug of potato leaves, not the ladybird that eats greenfly.
examples:
- The Colorado potato beetle eats potato leaves.
- Colorado potato beetles spread worldwide from the Rockies.
