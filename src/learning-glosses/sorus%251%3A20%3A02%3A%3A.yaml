simpleMeaning: On some lichens and fungi, a part that gives off the tiny grains from which new ones grow.
scope: This names the spore-making part found on lichens and fungi, not the cluster of spore cases on
  the underside of a fern leaf.
examples:
- They found a sorus on the lichen.
- They saw a sorus on the fungus.
