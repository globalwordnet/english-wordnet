senseId: 'unreliably%4:02:00::'
synsetId: 00225252-r
simpleMeaning: You cannot count on what is done in this way, and it cannot be trusted.
scope: Undependably and unfaithfully are other names for acting in this way, not for acting in a way that
  can be counted on.
examples:
- The old clock ran unreliably, stopping for hours and then starting again without warning.
- They spoke unreliably about the plan, changing the story each time they told it.
