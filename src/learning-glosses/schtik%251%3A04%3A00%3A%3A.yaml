simpleMeaning: A performer plans this bit of stage business and uses it again and again to pull every
  eye their way.
scope: It is also called shtick, schtick and shtik, and it is a performer's repeated stage bit rather
  than a dishonest trick or a prank.
examples:
- The comic leaned on the same old schtik in every show.
- The crowd grew tired of the schtik long before the act ended.
