senseId: 'ring_containment%1:04:00::'
synsetId: 01150189-n
simpleMeaning: A way of stopping germs spread on purpose to harm people, by giving shots only to people
  who had been near the germs and to others near them.
scope: It is a health measure for use when disease is spread as a weapon.
examples:
- Ring containment is a proven method of halting a smallpox epidemic.
- Health workers used ring containment to stop the disease from spreading further.
