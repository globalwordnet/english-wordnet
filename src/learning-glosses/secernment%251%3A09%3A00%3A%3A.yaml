simpleMeaning: Two or more things that reach the senses are told apart by this work of the mind.
scope: Also called discrimination, it is the mind's work of telling apart what the senses bring in, not
  the making and giving out of a substance in the body.
examples:
- With secernment we can tell one thing from another.
- Secernment lets us tell two sounds apart.
