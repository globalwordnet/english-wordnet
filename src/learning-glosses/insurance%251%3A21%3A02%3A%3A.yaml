simpleMeaning: A promise to repay covered losses to people or businesses who pay an insurance company
  in advance for protection against those risks.
scope: This is the protection service itself, not the written paper that proves you have it.
examples:
- She bought insurance for her new house.
- The insurance paid for the damage to the roof.
