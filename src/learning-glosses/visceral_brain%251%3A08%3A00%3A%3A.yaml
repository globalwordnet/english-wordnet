simpleMeaning: A group of connected structures in the brain that help control emotions and emotional behavior.
scope: Also called limbic brain and limbic system. It is one part of the head, not the whole of it.
examples:
- The visceral brain shapes how we feel fear.
- Damage to the visceral brain can change a person's moods.
