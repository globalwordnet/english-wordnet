simpleMeaning: A red, enlarged nose with thick skin, wide pores, and visible blood vessels, usually due
  to rosacea. It was once wrongly blamed on heavy drinking.
scope: An older informal name for rhinophyma, a condition that can develop with rosacea.
examples:
- An old medical text used hammer nose as a name for rhinophyma.
- The patient sought treatment for what the book called hammer nose.
