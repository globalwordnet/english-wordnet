simpleMeaning: A round dial on a telephone that you turn a different distance for each digit you dial.
scope: Also called dial. It is not a disc that turns to set a clock or a radio.
examples:
- They turned the telephone dial and waited for the call to go through.
- The telephone dial clicked as it came back to its start.
