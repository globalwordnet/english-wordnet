senseId: unshaped%5:00:00:unformed:00
synsetId: 02159493-s
simpleMeaning: Said of a thing that has not yet been given its full form, or has been given it badly.
scope: Also called unshapen. It is said of a thing, not of a person.
examples:
- The potter set the unshaped dough aside to rise before working it again.
- The carpenter stacked the unshaped timbers in the yard.
