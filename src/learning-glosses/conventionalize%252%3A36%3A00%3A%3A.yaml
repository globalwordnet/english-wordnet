senseId: 'conventionalize%2:36:00::'
synsetId: 01691464-v
simpleMeaning: To show a thing in the usual style that people accept.
scope: It is about how a thing is shown, not about changing a thing to fit what people accept.
examples:
- They conventionalize the bird into a few curved lines.
- The old paintings conventionalize trees into simple green shapes.
