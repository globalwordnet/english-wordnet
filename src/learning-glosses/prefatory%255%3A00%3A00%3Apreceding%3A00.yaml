simpleMeaning: Said of the opening words of a work, which come before its main part.
scope: Also called introductory or prefatorial, it is said of a part of a work.
examples:
- The prefatory remarks thanked the audience and set the tone.
- They added a prefatory chapter to explain how the book came to be.
