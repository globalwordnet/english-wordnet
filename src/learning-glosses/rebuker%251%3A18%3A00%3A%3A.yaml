simpleMeaning: Someone who points out faults or blames others for something.
scope: It is a person who lays blame for a fault, also called a reproacher, a reprover, or an upbraider.
examples:
- The rebuker blamed the team when the plan went wrong.
- The rebuker found fault with the report before anyone else had read it.
