simpleMeaning: Done in a shameful way, or carried to a shameful point.
scope: This one is also called shamefully, disgracefully, dishonorably, ignominiously, discreditably,
  and ingloriously.
examples:
- The official acted dishonourably by hiding the report from the public.
- The work was dishonourably late, weeks after the date that had been agreed.
