simpleMeaning: One metric measure of length, the same as a thousand centimetres.
scope: Also called dam, decameter, decametre, dekameter, and dekametre, this one is a measure of length,
  not of volume.
examples:
- The rope is one dkm long.
- They marked a dkm along the road.
