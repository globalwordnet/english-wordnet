simpleMeaning: A device you slide by hand to move a pointer on a computer screen. In older models, a ball
  underneath rolls as the mouse moves.
scope: A small hand-held device that moves the pointer on a computer screen, not a swollen bruise by the
  eye and not the act of using such a device.
examples:
- She moved the mouse to click the icon.
- A mouse takes much more room than a trackball.
