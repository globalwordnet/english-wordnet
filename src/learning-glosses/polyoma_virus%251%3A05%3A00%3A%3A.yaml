simpleMeaning: A virus that can cause several kinds of tumors in mice.
scope: This is a germ that can start many kinds of growths in mice, also called polyoma, not a germ that
  starts growths in people.
examples:
- The polyoma virus caused growths in the mice in the lab.
- Scientists studied the polyoma virus to see how it starts growths in mice.
