senseId: 'wasteweir%1:06:00::'
synsetId: 04284172-n
simpleMeaning: Extra water runs off through this channel, over or round a dam or anything else in its
  way.
scope: This channel is also called a spill and a spillway, and it is not a channel that keeps water in.
examples:
- The wasteweir carried the flood water safely past the dam.
- They built a wasteweir so high water could go round the dam instead of over it.
