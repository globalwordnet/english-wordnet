simpleMeaning: A person whose job is to take the money paid to pass.
scope: Also called toll collector, toll taker, toller, tollgatherer, and tollkeeper. It is not the driver
  who pays the charge.
examples:
- The toll agent waved the car through.
- They asked the toll agent how much the crossing cost.
