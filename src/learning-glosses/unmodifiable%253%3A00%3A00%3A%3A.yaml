simpleMeaning: Said of a thing that no one can change in shape, in nature, or in how strong it is, even
  by making it less extreme.
scope: It is a word for a thing.
examples:
- These variations from custom are illogical, incomprehensible, and unmodifiable.
- The unmodifiable rule stayed the same no matter how often people asked to change it.
