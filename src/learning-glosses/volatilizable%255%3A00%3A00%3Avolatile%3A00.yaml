simpleMeaning: Describing a substance that can be turned into vapor.
scope: Also called evaporable, vaporific, vaporizable, vapourific, vapourisable, and volatilisable. It
  is said of a substance, not of a person.
examples:
- The volatilizable fuel must be kept away from any open flame.
- The nurse capped the volatilizable liquid so it would not drift away as a gas.
