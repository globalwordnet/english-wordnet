simpleMeaning: A device that helps a person breathe when their lungs cannot supply enough oxygen or remove
  enough carbon dioxide.
scope: This one is also called a breathing device, a breathing machine, and a ventilator.
examples:
- The breathing apparatus kept air moving in and out of the patient's lungs.
- The nurse switched on the breathing apparatus.
