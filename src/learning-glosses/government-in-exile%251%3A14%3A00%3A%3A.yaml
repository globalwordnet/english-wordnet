senseId: 'government-in-exile%1:14:00::'
synsetId: 08069442-n
simpleMeaning: A short-lived ruling body set up or moved to another country by people driven from their
  own land, who hope to take charge of it once it is free.
scope: This word is used of a ruling body outside its own land.
examples:
- The government-in-exile set up offices in London.
- Ministers of the government-in-exile waited for news from home.
