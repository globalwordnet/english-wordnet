simpleMeaning: This mosquito carries and passes on a sickness that brings high temperature and turns the
  skin gold, and dengue, another sickness it passes on as well.
scope: Also called Aedes aegypti, this one passes on two sicknesses, not one.
examples:
- Health workers warned that the yellow-fever mosquito was spreading in the town.
- A bite from a yellow-fever mosquito passed dengue to people in the village.
