simpleMeaning: For the 50th year after something started, or marking that year.
scope: Also called semicentenary, it belongs to a 50-year mark, not to the anniversary as a thing in itself.
examples:
- The school kept its semicentennial year with a week of events.
- They held semicentennial games to mark 50 years of the club.
