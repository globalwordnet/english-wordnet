simpleMeaning: An Asian buckwheat plant of the genus Fagopyrum. This annual has small pinkish-white flower
  clusters and edible triangular seeds used whole or ground into flour.
scope: 'Also called buckwheat and Fagopyrum esculentum: one of the group with the same name, an Asian
  plant that lives one year, with bunches of pinkish-white flowers and small three-sided seeds eaten whole
  or ground to flour.'
examples:
- The Polygonum fagopyrum grew in the field with pinkish-white flowers.
- Farmers grind Polygonum fagopyrum seeds into flour.
