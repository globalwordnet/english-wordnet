simpleMeaning: The dishonest taking of money or goods that were put in your care but belong to someone
  else.
scope: It is also called embezzlement, defalcation, misappropriation, or peculation.
examples:
- The treasurer's misapplication of the club's money led to an arrest.
- The misapplication of the funds was found out when the books were checked.
