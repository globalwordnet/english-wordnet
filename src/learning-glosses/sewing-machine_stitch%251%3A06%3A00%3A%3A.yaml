simpleMeaning: The loops a powered device leaves in cloth when it runs thread through, at times with two
  or more threads at once.
scope: A machine stitch is the name for the loops a powered device leaves in cloth when it runs thread
  through.
examples:
- A sewing-machine stitch joined the two pieces of cloth.
- The tailor checked each sewing-machine stitch for loose threads.
