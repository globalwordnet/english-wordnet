simpleMeaning: An unpaired channel that drains blood within the tough membrane covering the brain.
scope: This channel in the tough cover of the brain is also called sinus rectus and straight sinus, not
  one of a pair and not the cover itself.
examples:
- The scan showed the tentorial sinus alone in the tough cover of the brain, with no twin beside it.
- They traced the tentorial sinus through the tough cover of the brain.
