simpleMeaning: The boundary beyond which trees cannot grow, high on a mountain or far to the north.
scope: Timberline and timber line are other names for it.
examples:
- We climbed past the tree line, where the last pines gave way to bare rock.
- Above the tree line, only bare rock and low plants remain.
