simpleMeaning: A home where flying insects that sting and have thin middles live.
scope: Also called hornet's nest, hornets' nest, and wasp's nest. It is a home for insects, not a home
  for birds.
examples:
- A wasps' nest hung from the branch of the old tree.
- They stayed away from the wasps' nest in the garden.
