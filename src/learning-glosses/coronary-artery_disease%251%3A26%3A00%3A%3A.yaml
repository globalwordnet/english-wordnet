simpleMeaning: A sickness that makes the walls of the tubes bringing blood to the heart hard and stiff.
scope: Also called arterial sclerosis, arteriosclerosis, hardening of the arteries, or induration of the
  arteries, this one is about a sickness of the blood vessels.
examples:
- The doctor found coronary-artery disease when the vessels were checked.
- The test showed coronary-artery disease in the vessels that carry blood to the heart.
