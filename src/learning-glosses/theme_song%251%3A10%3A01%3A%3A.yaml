simpleMeaning: This tune tells listeners who is on, a performer, a band that plays for dancing, or a show
  on radio or TV.
scope: This is also called a signature or a signature tune, and it marks who is on, not a tune that stands
  for a play or film with music.
examples:
- The band opened with its theme song.
- They knew the show by its theme song.
