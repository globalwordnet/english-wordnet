simpleMeaning: Said of something that answers back, one side after the other.
scope: Also called responsive, this word is used to describe something, not to name a book of songs.
examples:
- The antiphonal singing filled the church as the two sides answered each other.
- Their antiphonal reading of the psalm moved back and forth between the groups.
