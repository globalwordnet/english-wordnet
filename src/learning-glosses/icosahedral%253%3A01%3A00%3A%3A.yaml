simpleMeaning: Having the shape of, or relating to, a solid with twenty flat faces.
scope: To do with a solid with twenty triangle faces, not a cube and not a pyramid.
examples:
- The icosahedral crystal had twenty flat faces.
- An icosahedral die is used in some games.
