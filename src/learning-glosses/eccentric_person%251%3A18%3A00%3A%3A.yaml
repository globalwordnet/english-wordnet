simpleMeaning: One whose thoughts and deeds run in odd ways that most people do not share.
scope: This one is also called a flake, an eccentric, a geek, and an oddball.
examples:
- The eccentric person next door wears a different hat every day and greets everyone by a made-up name.
- The eccentric person in the flat upstairs plays the same tune at dawn every morning.
