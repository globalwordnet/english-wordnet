simpleMeaning: This African bird is big, with a bright tuft of feathers on its head.
scope: Also called a turaco, a turacou, and a turakoo, this African bird is large and crested, not a small
  bird with no crest.
examples:
- They watched a touraco spread its bright crest in the African sun.
- The touraco stood out among the smaller birds with its bright crest.
