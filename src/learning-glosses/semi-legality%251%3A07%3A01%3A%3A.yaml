senseId: 'semi-legality%1:07:01::'
synsetId: 92429913-n
simpleMeaning: Being allowed by the rules only in part, or in a way people question.
scope: Also called semilegality. It is a noun.
examples:
- Farmers who are allowed by the provincial administration to live in semi-legality in the forest reserves
  are even more vulnerable to the arbitrary exercise of government power.
- The new rules left the street sellers in semi-legality, neither fully allowed nor clearly banned.
