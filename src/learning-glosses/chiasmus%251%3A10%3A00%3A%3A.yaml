simpleMeaning: A change in the order of words in the later of two phrases built the same way.
scope: This one is about a figure of speech.
examples:
- The poet used a chiasmus, swapping the order of words in the second half of the line.
- The teacher pointed out the chiasmus in the line 'Ask not what your country can do for you, ask what
  you can do for your country.'
