senseId: 'spoke_misalignment%1:07:01::'
synsetId: 92418482-n
simpleMeaning: A problem with the adjustment of a bicycle wheel's spokes that can make the wheel wobble
  as it turns.
scope: This is the state of a bicycle wheel that has been put together badly.
examples:
- The wheel wobbled side to side because of spoke misalignment.
- The wheel touched the brake pads because of spoke misalignment.
