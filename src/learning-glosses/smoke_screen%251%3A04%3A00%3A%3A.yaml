simpleMeaning: Something done on purpose to hide facts, to puzzle people, or to keep the truth from being
  seen.
scope: Also called smokescreen. It is a noun.
examples:
- The announcement was a smoke screen to hide the cuts.
- They used a smoke screen of kind words to hide the bad news.
