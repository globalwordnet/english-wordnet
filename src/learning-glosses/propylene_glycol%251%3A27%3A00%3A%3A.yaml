simpleMeaning: A sweet, colorless, thick liquid that absorbs moisture, used in antifreeze, brake fluids,
  and moisturizers in personal care products. Skin absorption can have harmful effects.
scope: Also called propanediol, it is used as antifreeze and in brake-fluid mixes, and to keep care goods
  and cosmetics wet, a thick, clear, sweet, water-loving liquid that skin can soak in, to harm.
examples:
- Propylene glycol keeps care goods wet.
- Propylene glycol is used as antifreeze.
