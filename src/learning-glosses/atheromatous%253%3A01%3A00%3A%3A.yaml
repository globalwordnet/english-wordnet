simpleMeaning: Describing something tied to a fatty deposit in the wall of a blood vessel, or that looks
  like one.
scope: Also called atheromatic, this is about a deposit in the wall, not the wall itself.
examples:
- The atheromatous degeneration of the arteries showed up on the scan.
- The wall of the blood vessel was lined with atheromatous patches.
