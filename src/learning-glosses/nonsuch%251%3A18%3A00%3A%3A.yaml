simpleMeaning: A perfect example of its kind, with nothing else that comes close to it.
scope: Also called ideal, saint, paragon, apotheosis, nonpareil, and nonesuch. It is a noun.
examples:
- They called the old violin a nonsuch among instruments of its kind.
- A nonsuch like that comes along once in a hundred years.
