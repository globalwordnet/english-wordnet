simpleMeaning: The soft jelly-like matter that makes up the middle part of a cell, the part that holds
  what tells the cell how it grows and works.
scope: Also called karyoplasm. It is a noun.
examples:
- They watched the nucleoplasm move slowly as the cell got ready to split.
- A drop of stain made the nucleoplasm stand out from the rest of the cell.
