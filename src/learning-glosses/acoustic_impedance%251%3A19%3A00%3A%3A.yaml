senseId: 'acoustic_impedance%1:19:00::'
synsetId: 11524896-n
simpleMeaning: A measure of opposition to sound flow through a surface. Its real part is acoustic resistance
  and its imaginary part is acoustic reactance.
scope: This sense is also called acoustic reactance and acoustic resistance.
examples:
- Acoustic impedance slowed the sound.
- An acoustic impedance stood against the flow.
