simpleMeaning: A clutch that transmits turning force through friction and allows its parts to slide against
  each other when the force becomes too great.
scope: This device is also called a slip friction clutch, and it lets go when the turning force grows
  too strong.
examples:
- The slip clutch gave way when the load grew too great.
- They put a slip clutch in the machine.
