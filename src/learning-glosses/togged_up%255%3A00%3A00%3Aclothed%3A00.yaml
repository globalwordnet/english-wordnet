simpleMeaning: This is how a person looks when they have dressed in fancy clothes or formal clothes.
scope: Also called dressed, dolled up, dressed-up, dressed to kill, dressed to the nines, spiffed up and
  spruced up, this word fits a person in smart clothes, not one in plain everyday clothes.
examples:
- They were togged up in fancy clothes.
- They were togged up in a formal suit and tie.
