senseId: 'tracheophyte%1:20:00::'
synsetId: 13104346-n
simpleMeaning: 'Ferns, seed plants with cones, and flowering plants all belong to this group: green plants
  whose tubes carry water and food through them.'
scope: Also called a vascular plant, this name covers the green plants with tubes for water and food,
  not plants with no such tubes.
examples:
- The tracheophytes in the glasshouse ranged from ferns to flowering plants.
- They watered the tracheophytes so the tubes inside could carry water up to the leaves.
