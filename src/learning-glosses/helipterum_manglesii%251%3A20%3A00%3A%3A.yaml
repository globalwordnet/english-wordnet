simpleMeaning: An Australian annual plant with drooping light pink flower heads that keep their shape
  when dried. Some classifications place it in the genus Helipterum.
scope: This is an Australian plant that lives one year, also called rhodanthe, Rhodanthe manglesii and
  Swan River everlasting, not a plant that lives many years or a plant with upright flower heads.
examples:
- Helipterum manglesii has light pink flower heads that hang down.
- Helipterum manglesii keeps its pink colour when dried.
