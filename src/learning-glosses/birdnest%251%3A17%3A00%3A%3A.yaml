simpleMeaning: A nest where birds lay eggs and hatch their young.
scope: A place built by a flying creature for its eggs and young; bird's nest and bird nest are other
  names for this sense, not a hole in the ground and not a cage.
examples:
- A birdnest hung from the branch above the path.
- She found a birdnest lined with soft feathers.
