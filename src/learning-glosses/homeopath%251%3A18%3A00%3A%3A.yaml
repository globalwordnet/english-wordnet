simpleMeaning: Someone who practices homeopathy, a method that uses very small doses of substances chosen
  to match a patient's symptoms.
scope: A person who treats sick people with tiny amounts of a substance; not a doctor who gives common
  drugs and not a seller of herbs.
examples:
- The homeopath gave her a tiny dose to take each day.
- He visited a homeopath for his long cough.
