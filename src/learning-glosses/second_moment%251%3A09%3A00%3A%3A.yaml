simpleMeaning: In maths, take the gaps between chance values and their starting point, square them, and
  average the result.
scope: In maths, the plain average of the values is set apart from this average of squared gaps from the
  starting point.
examples:
- The second moment grew when the chance values strayed further from the starting point.
- They found the second moment by squaring the gaps from the starting point and averaging them.
