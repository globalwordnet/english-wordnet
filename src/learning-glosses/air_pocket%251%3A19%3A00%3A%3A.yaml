simpleMeaning: A patch of low pressure or sinking air that can cause a plane to drop suddenly.
scope: People also call this a pocket or an air hole, and it is not a calm stretch of sky that holds a
  plane up.
examples:
- Flying through an air pocket, the plane sank all at once and the passengers gasped.
- The pilot warned them about the air pocket ahead, where the air was thin.
