simpleMeaning: A tall gentian found widely in eastern North America, with violet-blue or white flowers
  that have fringed edges.
scope: A tall plant of eastern North America with fringed violet-blue or white flowers, not a low garden
  flower or a gentian of the far north; also called Gentianopsis crinita.
examples:
- Gentiana crinita grew tall beside the stream.
- The fringed flowers of Gentiana crinita were violet-blue.
