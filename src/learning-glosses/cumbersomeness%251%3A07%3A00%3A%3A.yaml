simpleMeaning: How hard a thing is to carry or manage when it is big or has a shape that gets in the way.
scope: Awkwardness and unwieldiness are other names for this one.
examples:
- The cumbersomeness of the old wardrobe made it hard to get up the stairs.
- They laughed at the cumbersomeness of the giant teddy bear.
