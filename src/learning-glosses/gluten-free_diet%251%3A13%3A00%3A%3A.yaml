simpleMeaning: A way of eating prescribed for celiac disease that excludes gluten, a protein found in
  wheat, rye, and barley.
scope: Plain beans and fresh vegetables are naturally gluten-free. Oats can come into contact with gluten
  during growing or processing.
examples:
- The doctor put her on a gluten-free diet after she was diagnosed with celiac disease.
- He checks food labels for wheat, rye, and barley because he follows a gluten-free diet.
