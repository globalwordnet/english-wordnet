simpleMeaning: A body in some American states with the power to settle quarrels between family members,
  above all ones about children.
scope: Also called a domestic relations court or a family court, this one sits in some American states.
examples:
- The court of domestic relations heard the parents' quarrel over the children.
- They went to the court of domestic relations about the children.
