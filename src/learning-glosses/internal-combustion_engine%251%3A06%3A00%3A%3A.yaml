simpleMeaning: An engine that burns fuel inside itself. The heat expands gas, which pushes a piston or
  turns a turbine.
scope: Unlike a machine fed by heat from a fire outside it, this machine burns its fuel inside itself.
examples:
- The car has an internal-combustion engine that runs on petrol.
- They fitted the boat with a small internal-combustion engine.
