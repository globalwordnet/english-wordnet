simpleMeaning: A pain medicine sold as Talwin that is less likely than morphine to cause addiction.
scope: A drug that takes pain away, not morphine itself and not a drug that makes people need it just
  as much.
examples:
- The doctor gave her pentazocine for the pain.
- Pentazocine took the pain away after the operation.
