simpleMeaning: 'Its first line starts at the left edge and the lines after step in from the right: this
  big print title tops a story.'
scope: Drop line, dropline, staggered head, stephead and stepped line are other names for it.
examples:
- The stagger head stood out at the top of the page.
- A stagger head topped the story.
