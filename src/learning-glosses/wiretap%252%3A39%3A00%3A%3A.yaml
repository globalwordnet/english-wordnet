senseId: 'wiretap%2:39:00::'
synsetId: 02193294-v
simpleMeaning: To listen in secretly on a phone or telegraph line in order to find out things meant for
  others.
scope: This verb is also called tap, bug, and intercept, and it takes information from a line rather than
  giving any.
examples:
- The police got an order to wiretap the suspect's phone.
- They feared someone might wiretap the office line to learn their plans.
