simpleMeaning: A military operation that uses an attack to gather information about an opposing force,
  especially its strength.
scope: This is the offensive probe that tests the enemy's strength, unlike shots placed on a suspected
  position just to make hidden soldiers show themselves.
examples:
- The general ordered a reconnaissance in force to test the enemy.
- A reconnaissance in force went forward to test the enemy lines.
