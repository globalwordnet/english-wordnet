simpleMeaning: To get a thing from the ground by moving earth away, for use or for keeping.
scope: This one is also called dig and dig up; it is not about getting a thing from under earth or snow.
examples:
- The workers began to dig out the salt from the old mine.
- Every autumn, the farmers dig out the potatoes and store them for the winter.
