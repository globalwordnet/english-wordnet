simpleMeaning: The middle layer of cells in an early embryo, which develops into muscles, bones, cartilage,
  blood, and connective tissue.
scope: Mesoblast is another name for this middle layer of a young life, from which muscle, bone, gristle,
  blood, and the stuff that joins parts together all grow.
examples:
- The mesoderm turns into muscle and bone.
- Blood cells come from the mesoderm.
