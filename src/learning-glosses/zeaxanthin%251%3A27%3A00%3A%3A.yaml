simpleMeaning: A yellow carotenoid pigment chiefly responsible for the color of yellow corn. It often
  occurs alongside lutein, which has the same chemical formula but a different structure.
scope: The main yellow dye in Indian corn, close kin to lutein.
examples:
- Zeaxanthin gives yellow corn its colour.
- The lab measured the zeaxanthin in the cornmeal.
