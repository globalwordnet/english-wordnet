simpleMeaning: A $ placed before a figure to tell the reader the figure is a sum of money.
scope: This one is also called a dollar mark, and it is not a symbol of greed.
examples:
- Write the dollar sign in front of the amount, not after it.
- The dollar sign at the start of the figure shows it is money.
