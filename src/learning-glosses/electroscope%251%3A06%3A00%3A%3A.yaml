senseId: 'electroscope%1:06:00::'
synsetId: 03285127-n
simpleMeaning: An instrument that detects electric charge. In one form, two thin gold leaves spread apart
  because they carry charges of the same sign.
scope: A tool that finds power with two gold leaves that move apart, not a meter for flow of power and
  not a compass.
examples:
- The electroscope showed the rod was charged.
- Its gold leaves moved apart in the electroscope.
