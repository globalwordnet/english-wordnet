simpleMeaning: A small round bone, one of several, that forms inside a tendon as it crosses a joint.
scope: Also called os sesamoideum and sesamoid bone. It is a noun.
examples:
- The tendon slides over a sesamoid each time the toe bends.
- They found a small sesamoid in the tendon above the joint.
