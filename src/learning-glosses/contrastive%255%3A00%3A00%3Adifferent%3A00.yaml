senseId: contrastive%5:00:00:different:00
synsetId: 02073546-s
simpleMeaning: Different in a way that stands out, and tending to show the difference.
scope: Also called contrasting; this one is about things that stand out as different, not about words
  or sentences set against each other.
examples:
- The contrastive colours of the two walls made the room look bigger.
- The writer used contrastive images to set the rich house against the poor cottage.
