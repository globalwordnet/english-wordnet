simpleMeaning: Making new life without the sex cells joining to make it.
scope: Also called asexual reproduction, this one is not making new life by joining cells from two parents.
examples:
- Some plants use agamogenesis to make new life without any joining of cells.
- The tiny animal makes young by agamogenesis, with no mate at all.
