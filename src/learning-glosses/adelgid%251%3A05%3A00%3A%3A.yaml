simpleMeaning: One of many kinds of insects that feed on trees with cones and make lumps grow on them.
scope: This one is the insect, not the lump it makes on the tree.
examples:
- The gardener found adelgids feeding on the spruce and making lumps on its branches.
- The adelgids on the fir had made lumps on the young shoots.
