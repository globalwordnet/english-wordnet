simpleMeaning: In American football, the extra point a team earns by making a successful place kick after
  a touchdown.
scope: Also called extra point and point after. It is one mark in American football.
examples:
- The point after touchdown came right after the score.
- They kicked the point after touchdown to add one more mark.
