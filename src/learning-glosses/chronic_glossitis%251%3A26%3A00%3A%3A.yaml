simpleMeaning: Persistent inflammation of the tongue in which its tissue wastes away, sometimes associated
  with pernicious anemia.
scope: In this long-lasting swelling of the tongue, the flesh wastes away, and it sometimes goes with
  a serious illness of the blood.
examples:
- Her chronic glossitis had wasted the flesh of her tongue.
- His chronic glossitis sometimes went with a serious illness of the blood.
