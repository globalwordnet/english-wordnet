simpleMeaning: A unit of data equal to 1,000 petabytes, or 10 to the power of 18 bytes.
scope: This one is also called EB, and it is not the kind that counts 1024 of the next measure down.
examples:
- The archive holds about an exabyte of film.
- They moved an exabyte of records to the new store.
