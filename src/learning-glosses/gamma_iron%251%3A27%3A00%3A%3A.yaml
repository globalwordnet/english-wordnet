simpleMeaning: A nonmagnetic form of iron that forms the basis of austenite and is stable from 906 to
  1403 degrees Celsius.
scope: A form of this metal that is not magnetic and is the base of austenite, steady from 906 to 1403
  degrees centigrade, to be told apart from other forms of the same metal that are magnetic.
examples:
- Gamma iron is stable at high temperatures.
- Austenite forms from gamma iron.
