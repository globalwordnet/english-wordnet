simpleMeaning: An aromatic plant of Europe and Asia with oak-shaped leaves and many yellow-green flowers.
  It now grows wild in North America.
scope: This is a sweet-smelling plant of Europe and Asia with yellow-green flowers, now settled in North
  America; feather geranium, Atriplex mexicana, Chenopodium botrys and Mexican tea are other names for
  this sense.
examples:
- Jerusalem oak grows wild with many yellow-green flowers.
- The Jerusalem oak has spread and now grows in North America.
