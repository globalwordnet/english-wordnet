simpleMeaning: On a square-rigged ship, a mast fixed to the upper end of the topmast.
scope: Also called topgallant, this is the one set on the pole below it on a ship with square sails, not
  the pole below it itself.
examples:
- They fixed the topgallant mast to the upper end of the pole below it.
- The topgallant mast rose from the pole below it on the square-rigged ship.
