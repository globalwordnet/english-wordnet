simpleMeaning: Relating to the vagus nerve, a long nerve that runs from the brain to the organs of the
  chest and belly.
scope: Also called vagal. It is not about the lungs and stomach, but about the nerve that serves them.
examples:
- The pneumogastric nerve carries signals between the brain and the belly.
- The doctor tested the pneumogastric nerve by asking the patient to swallow.
