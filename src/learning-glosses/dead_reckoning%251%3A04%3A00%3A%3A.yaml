simpleMeaning: Estimating your position from a previous known position, your direction, and the distance
  traveled, without relying on observations of the sun or stars.
scope: This one is about navigation.
examples:
- The sailors used dead reckoning after the clouds hid the stars.
- They reached home by dead reckoning across the empty sea.
