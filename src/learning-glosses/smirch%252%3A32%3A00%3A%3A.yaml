senseId: 'smirch%2:32:00::'
synsetId: 00848188-v
simpleMeaning: To make false or malicious accusations about someone in order to damage their reputation.
scope: People also call this smear, sully, slander, besmirch, defame, denigrate, asperse and calumniate,
  but it is not the dirtying of a thing.
examples:
- They tried to smirch a good name with false stories.
- They would not smirch anyone with lies.
