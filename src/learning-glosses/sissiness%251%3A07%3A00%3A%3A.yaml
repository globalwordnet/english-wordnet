simpleMeaning: An insulting term for behavior that someone considers too feminine in a boy or man.
scope: Also called softness, unmanliness, effeminacy, effeminateness, and womanishness. It is a noun.
examples:
- They used sissiness as an insult against a classmate.
- Sissiness was the word they threw at anyone who cried in front of the class.
