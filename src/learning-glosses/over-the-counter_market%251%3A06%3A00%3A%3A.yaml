simpleMeaning: A stock exchange where stocks and bonds are bought and sold by phone and computer, not
  on an exchange floor.
scope: It is also called OTC market.
examples:
- They bought shares on the over-the-counter market, by phone rather than on a trading floor.
- The over-the-counter market lets buyers and sellers trade without going to a stock exchange.
