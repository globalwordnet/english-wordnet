simpleMeaning: The act of changing from a war footing to a peace footing, breaking up army units and sending
  soldiers home.
scope: This one is also called demobilization.
examples:
- After the war ended, the demobilisation of the army took months.
- The government planned the demobilisation of the troops stationed overseas.
