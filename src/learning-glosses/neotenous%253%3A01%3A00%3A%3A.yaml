senseId: 'neotenous%3:01:00::'
synsetId: 02779193-a
simpleMeaning: Marked by neoteny, in which young features stay in place in the adult animal.
scope: Also called neotenic. It is an adjective, not the name of the process itself.
examples:
- The neotenous salamander keeps its gills even as an adult.
- The neotenous frog kept its tail even after it became an adult.
