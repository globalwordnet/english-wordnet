simpleMeaning: A line across a billiard table, with the white balls set behind it when a game begins.
scope: Also called a balkline or a string line, this one is about a mark on the table.
examples:
- The baulk-line ran across the table near one end.
- Players placed the white balls behind the baulk-line before the break.
