simpleMeaning: This oak of the eastern United States grows medium to large, loses its leaves in autumn,
  and has long, narrow leaves pointed at both ends and soft, strong wood.
scope: This one is also called Quercus phellos, its Latin name.
examples:
- The willow oak in their yard loses its leaves every autumn.
- They cut soft, strong wood from the willow oak for the fence.
