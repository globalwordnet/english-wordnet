simpleMeaning: The bond that joins amino acids into chains in peptides and proteins. It links the carboxyl
  group of one amino acid to the amino group of the next.
scope: 'Also called peptide linkage: the main chemical link that holds every protein together.'
examples:
- A peptide bond joins one amino acid to the next.
- The peptide bond is the main link in every protein.
