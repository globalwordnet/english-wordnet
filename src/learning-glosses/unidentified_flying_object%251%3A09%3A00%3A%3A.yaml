simpleMeaning: A thing that seems to move through the air, which no one can say what it is, above all
  when people think it came from beyond the earth.
scope: Also called a UFO and a flying saucer, this name is for a thing in the sky, not for a thing people
  can name.
examples:
- They watched an unidentified flying object cross the sky and vanish.
- The unidentified flying object hovered for a time, then shot away.
