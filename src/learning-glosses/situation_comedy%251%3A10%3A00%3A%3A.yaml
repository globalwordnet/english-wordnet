simpleMeaning: On television, a show that finds its laughs in things that could happen in daily life.
scope: Also called a sitcom, this television show finds its laughs in things that could happen in daily
  life, not in a serious drama built around the same kinds of things.
examples:
- They watched a situation comedy and laughed.
- A situation comedy can make ordinary life look funny.
