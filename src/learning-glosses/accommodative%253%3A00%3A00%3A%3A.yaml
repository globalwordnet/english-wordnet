simpleMeaning: Ready to help things fit together in a smooth and friendly way.
scope: This one is also called accommodating, and it is not the sense about bending a little so people
  can agree.
examples:
- The warden was always accommodative in allowing visitors in, and the families were glad of it.
- They made a special effort to be accommodative when the new neighbours moved in.
