simpleMeaning: The SA, a Nazi paramilitary group founded in 1921 that helped Hitler gain power and lost
  influence to the SS after 1934.
scope: This is a Nazi armed group set up by Hitler in 1921 that helped him gain power; SA and Sturmabteilung
  are other names for it, not the SS and not the regular army of Germany.
examples:
- The Storm Troops helped Hitler gain power in the early 1920s.
- After 1943 the Storm Troops were pushed aside by the SS.
