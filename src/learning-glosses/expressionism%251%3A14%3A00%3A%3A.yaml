simpleMeaning: An early twentieth-century art movement that emphasized artists' inner experiences and
  conveyed feelings by distorting the appearance of reality.
scope: For painters who put inner feeling first, showing it through a bent view of the world.
examples:
- Their expressionism filled the show.
- The expressionism of the age was plain.
