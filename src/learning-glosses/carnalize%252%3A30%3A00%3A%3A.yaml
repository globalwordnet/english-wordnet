simpleMeaning: To drag a thing down through bodily pleasure.
scope: Carnalise, sensualise, and sensualize are other names for this, not for the other sense of the
  same word, which puts a thing down to what the senses report.
examples:
- The preacher warned that luxury would carnalize the town.
- They feared the new songs might carnalize the young.
