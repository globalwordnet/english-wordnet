simpleMeaning: To join hollow structures, such as blood vessels, so that their passages open into each
  other.
scope: Joining or opening passages into each other, as blood vessels in surgery, not cutting them apart
  and not closing them off.
examples:
- The surgeon will anastomose the blood vessels.
- The graft was made to anastomose the two tubes.
