simpleMeaning: A tool that measures the angle by which a compass needle points away from true north.
scope: Declinometer is another name for this sense, which is a measuring tool, not a compass.
examples:
- They used a transit declinometer to check the magnetic declination at the survey site.
- With a transit declinometer, they measured the angle between the compass needle and true north.
