senseId: 'dewey_decimal_system%1:09:00::'
synsetId: 05735372-n
simpleMeaning: A library system for grouping nonfiction by subject. Three digits identify the subject,
  and digits after a decimal point give details. Books are shelved in number order.
scope: A library sorting scheme, also called the Dewey decimal classification and the decimal system of
  classification.
examples:
- The Dewey decimal system puts each book in a numbered subject group.
- Our school library uses the Dewey decimal system for its nonfiction shelves.
