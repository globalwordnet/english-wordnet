simpleMeaning: A gypsum cement made of white calcium sulfate powder that forms a paste with water and
  hardens. It is used for molds, sculpture, and casts for broken limbs.
scope: Also called plaster.
examples:
- She mixed plaster of Paris with water for the mould.
- The plaster of Paris cast held his broken arm still.
