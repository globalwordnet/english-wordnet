schema: oewn-learning-gloss-v2
senseId: 'pentimento%1:06:00::'
synsetId: 03919048-n
simpleMeaning: An earlier image becoming visible through paint that once covered it, usually as the upper
  layer grows more transparent with age.
scope: An earlier picture showing through a later painting, not a new painting and not a crack in the
  paint.
examples:
- A pentimento of a horse showed through the portrait.
- The restorer found a pentimento beneath the landscape.
