senseId: 'hypothesise%2:31:00::'
synsetId: 00635105-v
simpleMeaning: To take a thing as true when the reasons for it are weak and unsure.
scope: It is also called suppose, speculate, conjecture, theorize, hypothesize, hypothecate and theorise.
examples:
- The study hypothesised that the birds returned to the same nest each year.
- A cure was hypothesised, but the tests did not back it up.
