simpleMeaning: Iron runs low when food gives too little of it or when bleeding takes it away.
scope: This is a shortage of iron that comes from too little iron in food or from bleeding.
examples:
- A diet with too little iron can lead to sideropenia.
- Bleeding can bring on sideropenia.
