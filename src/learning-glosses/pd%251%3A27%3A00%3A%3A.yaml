simpleMeaning: Palladium, a silver-white platinum-group metal resembling platinum. Found in some copper
  and nickel ores, it resists tarnishing at ordinary temperatures, and is mixed with gold for jewelry.
scope: Also called palladium and atomic number 46; a silver-white metal like platinum, not silver itself
  and not a gold alloy.
examples:
- Pd does not tarnish at ordinary temperatures.
- The ring was made of Pd mixed with gold.
