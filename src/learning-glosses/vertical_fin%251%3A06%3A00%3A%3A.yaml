simpleMeaning: This fin stands upright at the tail of a plane and keeps it steady in the air.
scope: This is also called a tail fin, a tailfin, a vertical stabiliser, and a vertical stabilizer, and
  it names the upright part at the tail of a plane, not the flat part there.
examples:
- The vertical fin on the plane's tail kept the plane steady in a crosswind.
- A crack in the vertical fin made the plane hard to keep straight.
