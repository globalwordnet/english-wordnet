simpleMeaning: On 3 round areas, shows go on at the same time in this circus.
scope: This has 3 round areas where acts go on at the same time, not one act after another.
examples:
- They went to a three-ring circus and watched three acts at once.
- At the three-ring circus, they watched one act while another went on beside it.
