simpleMeaning: To sink into soft, fond feeling when you speak and act, and to let it show.
scope: Sentimentalise, sentimentalize and sentimentize are other names for this sense, which keeps the
  feeling in the person who acts.
examples:
- They would sentimentise every parting, and make it sound fond and sad.
- In their talks, they would sentimentise the past.
