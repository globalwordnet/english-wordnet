simpleMeaning: An alcohol whose molecules each contain two hydroxyl groups, each made of one oxygen atom
  and one hydrogen atom.
scope: Also called glycol and diol, this is not a chemical with only one such part in each smallest bit.
examples:
- The lab keeps a dihydric alcohol on the shelf for tests.
- A dihydric alcohol was among the chemicals named in the report.
