simpleMeaning: A decibel, a unit used to compare sound intensity with a reference level. The value equals
  ten times the base-ten logarithm of the ratio between the intensities.
scope: decibel is another name for this sense; not a unit of pitch and not a unit of power.
examples:
- The noise reached 90 dB near the road.
- A whisper measures about 30 dB.
