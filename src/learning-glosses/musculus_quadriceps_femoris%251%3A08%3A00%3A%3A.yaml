simpleMeaning: A muscle at the front of the thigh that straightens the leg at the knee.
scope: It is also called quad, quadriceps, and quadriceps femoris.
examples:
- The musculus quadriceps femoris straightens the leg when a person stands up from a chair.
- The musculus quadriceps femoris ached after climbing the stairs.
