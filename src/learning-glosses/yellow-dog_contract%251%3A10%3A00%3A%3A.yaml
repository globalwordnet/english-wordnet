simpleMeaning: A work agreement, now against the law, in which the worker promises not to join a group
  of workers that acts together for their rights.
scope: It is an agreement about work.
examples:
- The yellow-dog contract kept them out of the union for years.
- They refused to sign a yellow-dog contract.
