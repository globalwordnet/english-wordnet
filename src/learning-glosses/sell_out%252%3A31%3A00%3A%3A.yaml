senseId: 'sell_out%2:31:00::'
synsetId: 00615215-v
simpleMeaning: To set aside the values one claims to hold, in exchange for money or for what suits one's
  own interests.
scope: This names giving up one's beliefs for money or for what suits one's own interests, unlike the
  other sense of the same words, which is about getting rid of all one's goods.
examples:
- They sold out for money.
- They sold out for a better job.
