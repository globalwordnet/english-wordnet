simpleMeaning: One of the small glands, usually four, at the back of the thyroid in the neck that help
  control calcium levels in the blood.
scope: Their exact number and position can vary.
examples:
- The parathyroid gland keeps the body's calcium in balance.
- Surgeons take care not to harm a parathyroid gland.
