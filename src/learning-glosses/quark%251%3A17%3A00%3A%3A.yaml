simpleMeaning: A fundamental particle in mesons and baryons. Six types form three pairs, each with corresponding
  antiparticles. Quarks carry electric charge of plus two-thirds or minus one-third of the elementary
  charge.
scope: 'Also called poppet valve: this is the engine valve sense, a part that rises straight up from its
  seat.'
examples:
- The mechanic replaced a worn poppet in the engine.
- Each poppet rises from its seat as the engine turns.
