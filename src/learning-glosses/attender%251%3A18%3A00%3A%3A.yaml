simpleMeaning: Someone whose place is at another person's side, looking after them and meeting their needs.
scope: Tender and attendant are also names for this helper, not the other sense of this word, which is
  about listening.
examples:
- The attender brought fresh water and stayed nearby in case they needed more.
- The attender at the door showed them to their seats.
