synsetId: 06822279-n
simpleMeaning: A way of writing real numbers in which figures stand in a set order and each figure's worth
  hangs on where it stands.
scope: Also called positional representation system. It is a system.
examples:
- In positional notation, the figure 2 in 25 is worth twenty.
- Positional notation lets the same figure mean one or ten by where it stands.
