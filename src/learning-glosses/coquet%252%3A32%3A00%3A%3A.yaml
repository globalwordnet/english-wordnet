simpleMeaning: To show love for someone in words or actions, without meaning it.
scope: This one is also called butterfly, flirt, romance, mash, dally, philander, coquette, and chat up;
  it is a verb, not the man who does it.
examples:
- The new secretary coquets with everyone in the office.
- They coquet with strangers at parties, but never mean it.
