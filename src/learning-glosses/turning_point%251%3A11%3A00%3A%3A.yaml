senseId: 'turning_point%1:11:00::'
synsetId: 07432451-n
simpleMeaning: A moment in history when things take a one-of-a-kind or important new direction, or when
  later events hang on what happens then.
scope: Landmark and watershed are other names for it.
examples:
- The fall of the wall was a turning point in the history of the country.
- The speech was a turning point for the whole movement.
