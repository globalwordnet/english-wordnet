simpleMeaning: To devise something false or not real.
scope: Also called invent, manufacture, fabricate, vamp, cook up, and make up. It is an act, not a thing.
examples:
- The clerk vamped up a false story about where the money had gone.
- They vamped up an excuse for missing the meeting.
