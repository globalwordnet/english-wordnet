senseId: 'uncouthness%1:07:00::'
synsetId: 04825019-n
simpleMeaning: This quality shows in a person whose acts are rude and graceless.
scope: Also called boorishness, this names a quality, not the rude person who shows it.
examples:
- They showed their uncouthness by talking over others and laughing at their mistakes.
- Their uncouthness came out when they ate noisily and shouted across the room.
