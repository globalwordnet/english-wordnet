simpleMeaning: An enzyme that transfers an amino group from an amino acid to another compound.
scope: Also called aminotransferase and transaminase, this body helper speeds the move of a nitrogen part
  from one acid to another compound.
examples:
- Aminopherase moved a nitrogen part from one acid to another.
- The nitrogen part moved with aminopherase.
