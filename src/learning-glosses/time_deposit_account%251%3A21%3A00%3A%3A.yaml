simpleMeaning: A savings plan at a bank where the money stays put for a set stretch, or comes out early
  only after warning the bank or giving up some interest.
scope: It is also called a deposit account.
examples:
- We put our savings in a time deposit account for two years.
- They cannot touch the money in their time deposit account until the term ends.
