simpleMeaning: To turn sugar into caramel, the brown substance that forms when sugar is heated.
scope: Also called caramelize. It is an action done to a thing, not a change in the thing itself.
examples:
- They caramelise the sugar for the pudding.
- Heat will caramelise the onions for the soup.
