simpleMeaning: In computing, the basic stage of setting up a hard drive, laying out storage blocks across
  its surface so the computer's system can use them, and setting where it starts.
scope: It is also called initialisation and initialization.
examples:
- The technician ran a low-level formatting on the old hard drive before reinstalling the system.
- The low-level formatting wiped the disk clean and laid out fresh sectors.
