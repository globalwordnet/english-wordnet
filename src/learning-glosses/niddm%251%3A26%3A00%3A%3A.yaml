simpleMeaning: An older name for type 2 diabetes, which often develops gradually. Excess weight can raise
  the risk. Treatment may include diet changes, medicines or insulin.
scope: NIDDM is an older abbreviation for non-insulin-dependent diabetes mellitus.
examples:
- Her old medical record used NIDDM for what her doctor now calls type 2 diabetes.
- When he started insulin, the older label NIDDM still appeared in his chart.
