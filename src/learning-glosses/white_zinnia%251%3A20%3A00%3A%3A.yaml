simpleMeaning: A low shrub with slender woolly stems, long narrow leaves, and white rays around its flower
  heads, found in the southern United States and northern Mexico.
scope: This low bushy plant of the south of the United States and the north of Mexico is the one with
  flower heads with pale rays, thin woolly stems, and long narrow leaves.
examples:
- White zinnia grew in the field.
- White zinnia bore flower heads with pale rays.
