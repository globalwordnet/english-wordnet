simpleMeaning: Illness caused by swallowing or breathing in cyanide. People may be exposed through smoke
  from fires or through industrial chemicals.
scope: This is illness from taking in a deadly chemical, often in fire smoke, not food poisoning and not
  a burn.
examples:
- Cyanide poisoning killed the firefighter.
- The doctors treated him for cyanide poisoning.
