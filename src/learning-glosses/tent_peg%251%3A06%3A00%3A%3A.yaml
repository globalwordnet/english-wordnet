simpleMeaning: A rope that holds up a cloth shelter is held fast by this peg, driven into the ground.
scope: This is the piece that keeps the rope of a cloth shelter fast, not the rope itself and not the
  shelter.
examples:
- They drove a tent peg into the ground to hold the rope of the shelter.
- One tent peg came loose, and the rope holding up the cloth shelter went slack.
