simpleMeaning: A person or an animal that is strikingly odd in form, or badly misshapen.
scope: It is a kind of creature, also called monster and freak, and also known as monstrosity.
examples:
- The two-headed calf at the fair was called a lusus naturae, and crowds came to stare at it.
- Old books of wonders are full of tales about a lusus naturae born with extra limbs.
