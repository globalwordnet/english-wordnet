simpleMeaning: To do with a thin sheet of cells on the inner side of a ball of cells at an early stage
  of an animal's growth.
scope: Also called blastodermatic. It is about cells.
examples:
- The blastodermic cells formed the inner wall of the ball.
- They noted blastodermic growth in the embryo.
