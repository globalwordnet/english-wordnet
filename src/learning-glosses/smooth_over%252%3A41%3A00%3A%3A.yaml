synsetId: 02521921-v
simpleMeaning: To give something only quick attention, or to leave it alone instead of handling it as
  it should be handled.
scope: Also called gloss over, skate over, skimp over, and slur over. It is a verb.
examples:
- They tried to smooth over the mistake with a quick apology.
- Do not smooth over the problem; fix it the right way.
