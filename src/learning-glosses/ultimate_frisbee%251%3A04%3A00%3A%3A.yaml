simpleMeaning: A team sport scored by catching a flying disc in the opponents' end zone. Possession changes
  after an interception, an incomplete pass, or an out-of-bounds throw.
scope: This game has two teams passing a disc to cross the other team's goal, and the disc changes hands
  when rivals catch it or it hits the ground or goes out of bounds.
examples:
- Ultimate frisbee is played by two teams.
- They play ultimate frisbee with a disc.
