simpleMeaning: In a law-making body or a court, the person whose job is to keep order and see that its
  orders are carried out.
scope: Sergeant at arms is another name for the person who keeps order in a law-making body or a court
  and sees that its orders are carried out.
examples:
- The serjeant-at-arms called the hall to order before the debate began.
- A serjeant-at-arms stood by the door of the court while the judge spoke.
