simpleMeaning: A psychedelic tryptamine alkaloid that acts on serotonin receptors, found in most psychedelic
  mushrooms alongside psilocybin, its phosphate-bearing counterpart.
scope: Also called psilocin, psilocine, and psilocyn, it is a substance that acts on serotonin, a base
  of tryptamine, changed in make-up, found in most mind-bending mushrooms, beside psilocybin, its phosphate
  twin.
examples:
- Psilotsin is found in most mind-bending mushrooms.
- Psilotsin acts on serotonin.
