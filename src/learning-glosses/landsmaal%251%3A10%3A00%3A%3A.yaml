simpleMeaning: An older name for Nynorsk, one of Norway's two official written forms of Norwegian, based
  on rural dialects.
scope: Also called Landsmal, New Norwegian and Nynorsk, it is one of the two official tongues of Norway,
  built on the speech of the countryside, not the other official tongue and not a tongue of another country.
examples:
- Landsmaal is one of the two official languages of Norway.
- Landsmaal is based on rural dialects.
