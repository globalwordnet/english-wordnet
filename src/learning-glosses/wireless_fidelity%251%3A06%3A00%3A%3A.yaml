simpleMeaning: A local wireless network that sends and receives data by radio, often over a few hundred
  feet. Its wireless links use the IEEE 802.11 standards.
scope: 'Also called wireless local area network: a short-range net without cables, not a wired net and
  not a phone signal that covers a whole town.'
examples:
- The café offers wireless fidelity for free.
- Our wireless fidelity drops when too many people join it.
