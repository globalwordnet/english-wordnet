simpleMeaning: Secobarbital, a white, odorless, slightly bitter barbiturate sold as Seconal. Its sodium
  salt is used for sedation and to treat convulsions.
scope: 'Also called secobarbital and secobarbital sodium: a sleep drug sold as Seconal, used to calm people
  and stop fits.'
examples:
- The doctor gave her a red devil to help her sleep through the night.
- He took a red devil after the fits began, and the shaking soon stopped.
