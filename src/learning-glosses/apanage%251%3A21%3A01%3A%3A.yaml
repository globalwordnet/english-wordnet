simpleMeaning: Any benefit that comes with a rank or a position in life, by custom and by right.
scope: Also called appanage, this one is not about a grant given to support a dependent member of a ruling
  family.
examples:
- For thousands of years the chair was an apanage of state and dignity, not an article of ordinary use.
- The fine house came with the office as an apanage of the rank.
