simpleMeaning: A cassava plant with soft, brittle stems and long roots used after safe processing, especially
  for tapioca and an alcoholic drink called cassiri.
scope: This sense refers to the bitter cassava plant. Its raw roots are poisonous.
examples:
- Farmers grew gari for its long roots.
- The museum display explained how gari has been grown as a source of tapioca.
