simpleMeaning: A virus that can cause respiratory illnesses such as colds and bronchiolitis, especially
  in children.
scope: A cold affects the upper airways. Bronchiolitis affects the small airways in the lungs.
examples:
- The doctor said a parainfluenza virus had caused the child’s cough.
- The leaflet lists bronchiolitis among the illnesses a parainfluenza virus can cause.
