simpleMeaning: A huge body of rock that pushed up into other rock and is thought to have turned hard far
  below the ground.
scope: Also called a batholith, a pluton, or plutonic rock, this one is about a body of rock.
examples:
- The batholite lay buried far below the hills, out of sight.
- The batholite beneath the valley was so wide that no one knew where it ended.
