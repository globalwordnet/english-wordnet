simpleMeaning: A big container for drink, with two handles on most kinds, that guests pass from one to
  the next at a feast, each taking a drink in turn.
scope: It is a kind of drinking vessel.
examples:
- The loving cup went round the table at the banquet, and each guest drank from it in turn.
- They raised the loving cup at the end of the feast and passed it along the table.
