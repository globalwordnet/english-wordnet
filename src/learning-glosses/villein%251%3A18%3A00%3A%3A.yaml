simpleMeaning: A medieval peasant legally bound to a lord's land and obliged to work for the lord.
scope: Also called serf and helot. It is a person, not the lord who owned the land.
examples:
- The villein worked the lord's fields from dawn to dusk.
- A villein could not leave the land without the lord's leave.
