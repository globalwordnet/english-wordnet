simpleMeaning: Trying to win the good will of others with false praise.
scope: Also called fawning, sycophantic, or bootlicking. It is not the sense that aims only at people
  with power.
examples:
- The toadyish praise made the room uneasy.
- They answered with toadyish words, hoping for a favor.
