senseId: 'wasting_disease%1:26:00::'
synsetId: 14167546-n
simpleMeaning: This disease harms the lungs, and the body grows thinner and weaker as time goes on.
scope: This is also called consumption, phthisis, pulmonary tuberculosis, and white plague, and it is
  not a sickness that strikes only the lungs.
examples:
- The wasting disease took hold of their lungs, and they grew thinner month by month.
- By the end of the year the wasting disease had left them thin and weak.
