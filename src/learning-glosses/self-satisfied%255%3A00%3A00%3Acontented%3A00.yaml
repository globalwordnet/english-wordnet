simpleMeaning: So pleased with one's own deeds that the pleasure itself counts as a fault.
scope: Also called complacent and self-complacent, this names being pleased with one's own deeds to a
  fault, unlike the other sense of the same word, which marks a person by too much complacency.
examples:
- They spoke in a self-satisfied way about their work.
- His self-satisfied dignity was plain to see.
