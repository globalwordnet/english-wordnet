simpleMeaning: With no power to draw things to a surface and hold them there, or to make them pile up
  on it.
scope: Also called nonadsorbent. It is an adjective.
examples:
- The nonadsorptive tray shed water at once.
- They chose a nonadsorptive paint so dust would not cling to the walls.
