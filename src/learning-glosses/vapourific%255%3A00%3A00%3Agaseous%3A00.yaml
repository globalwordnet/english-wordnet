simpleMeaning: Used of a thing that looks like a mist, or has the qualities of one.
scope: Also called vaporous, vaporific, vaporish, vapourish, and vapourous. It is used of a thing, not
  of the mist itself.
examples:
- Vapourific steam rose from the pot.
- The vapourific fog hid the road.
