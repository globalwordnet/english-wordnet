simpleMeaning: Smaller in number or amount, commonly used with measurements and sometimes informally with
  things counted one by one.
scope: Less than ten miles is standard. With individual countable items, formal writing usually uses fewer.
examples:
- less than ten miles to the coast
- He paid less than twenty pounds.
