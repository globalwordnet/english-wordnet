senseId: 'run-time_error%1:11:00::'
synsetId: 07314934-n
simpleMeaning: A logic or arithmetic error that becomes apparent only when a computer program runs.
scope: Of the faults that can hide in a program, this one is found only while the program is at work,
  also called runtime error and semantic error.
examples:
- The program gave the wrong answer because of a run-time error in its sums.
- No one saw the run-time error until the program was at work.
