simpleMeaning: To do with a person or thing that stands for something yet to come, as a symbol.
scope: Also called antitypical, this one is not about an opposite.
examples:
- The antitypic figure in the story stood for the hero who would come later.
- They read the antitypic lamb as a sign of the sacrifice to come.
