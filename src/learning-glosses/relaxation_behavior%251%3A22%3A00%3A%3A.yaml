senseId: 'relaxation_behavior%1:22:00::'
synsetId: 13570514-n
simpleMeaning: In physics, the way a thing settles back to its calm, steady state after a shock, with
  the gap to that state closing by the same share each time
scope: In physics this is the return of a disturbed system to balance, also called relaxation.
examples:
- The relaxation behavior of the metal bar showed in the way it settled back to its steady state after
  the knock.
- After the shock, the relaxation behavior of the gas could be followed as it moved back toward a steady
  state.
