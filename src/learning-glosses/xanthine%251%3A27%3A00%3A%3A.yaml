senseId: 'xanthine%1:27:00::'
synsetId: 15137617-n
simpleMeaning: A crystalline compound formed as the body breaks down nucleoproteins. The body converts
  it into uric acid. It occurs in many organs and in urine.
scope: This crystal-like stuff comes before uric acid; it is not uric acid itself.
examples:
- Xanthine comes before uric acid in the body.
- Xanthine is found in many organs and in urine.
