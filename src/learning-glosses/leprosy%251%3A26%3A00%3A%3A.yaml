simpleMeaning: A chronic infectious disease in tropical and subtropical regions, caused by Mycobacterium
  leprae. It can cause inflamed lumps under the skin and gradual wasting of body parts.
scope: A long-term bacterial disease of the skin and body tissue; it is not a temporary rash or a common
  skin infection.
examples:
- Leprosy can be cured with a course of antibiotics.
- Health workers screen for leprosy in remote villages.
