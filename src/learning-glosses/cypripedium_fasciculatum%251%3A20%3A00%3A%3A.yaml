simpleMeaning: Clustered orchid with two broad leaves per stem and 2–4 drooping brownish-green flowers
  with purple-mottled pouches, from British Columbia to central California and northern Colorado.
scope: 'Also called clustered lady''s slipper: a low plant with hanging brown-green flowers, not a tall
  orchid and not a garden rose.'
