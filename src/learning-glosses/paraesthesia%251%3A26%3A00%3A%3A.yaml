senseId: 'paraesthesia%1:26:00::'
synsetId: 14348204-n
simpleMeaning: Unusual skin sensations such as tingling, tickling, itching, or burning, often linked to
  damage to nerves outside the brain and spinal cord.
scope: 'It is also called paresthesia: odd skin feelings, usually with harm to the nerves at the edge
  of the body.'
examples:
- Paraesthesia made his skin prickle and burn.
- Her paraesthesia came with harm to the nerves at the edge of the body.
