simpleMeaning: Acting grand and important, as if one's place in life were higher than it is.
scope: Also called uppityness. It is a way of behaving, not a rank.
examples:
- The uppishness of the new manager showed in every order given to the staff.
- The new manager's uppishness made the whole office uneasy.
