simpleMeaning: From the lungs, phlegm or sputum comes to the mouth and leaves the body.
scope: Expectorate, cough out, cough up, and spit out are other names for moving phlegm from the lungs
  to the mouth so it leaves the body.
examples:
- They spit up the phlegm.
- The phlegm came up, and they spit it up.
