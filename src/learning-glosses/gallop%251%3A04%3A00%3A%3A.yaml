senseId: 'gallop%1:04:00::'
synsetId: 00289515-n
simpleMeaning: A fast way a horse runs, usually with four hoofbeats in each stride and a moment when all
  four feet are off the ground.
scope: A fast way for a horse to move, not a slow walk and not the act of riding.
examples:
- The horse broke into a gallop across the field.
- The photograph caught all four hooves in the air at full gallop.
