simpleMeaning: Someone or something is called cursed out loud in a formal act.
scope: Also called anathematization, this is not a curse kept silent and never spoken aloud.
examples:
- The council's anathematisation of the book was read aloud before the whole town.
- Their anathematisation named one person a cursed outcast in front of the crowd.
