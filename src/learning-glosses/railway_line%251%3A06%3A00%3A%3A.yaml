simpleMeaning: A track for trains, made of metal strips laid on a bed of earth and stone built up beneath
  it.
scope: It is also called a line or a rail line. It is the track itself, not the company that runs the
  trains.
examples:
- The railway line runs past the village and over the hill.
- They closed the railway line for repairs after the storm.
