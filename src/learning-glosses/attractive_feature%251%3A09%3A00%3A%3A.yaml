simpleMeaning: Something about a thing that makes people enjoy it and want to come closer to it.
scope: Attraction and magnet are other names for this sense, and attractor and attracter name it too.
examples:
- The glass roof was the attractive feature that made people want to visit the new hall.
- The garden was the attractive feature that drew visitors to the house all summer.
