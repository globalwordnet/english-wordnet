simpleMeaning: Said of a thing that is plain and open, with nothing hidden.
scope: Also called broad. It is said of a thing, not of a person.
examples:
- The play gave an unsubtle hint that it was time to leave.
- The unsubtle jokes left no one in doubt about what they meant.
