simpleMeaning: An older scientific name for the alpaca, a domesticated South American animal kept for
  its long, silky fleece. Its main wild ancestor is the vicuña.
scope: The alpaca is now generally classified as Vicugna pacos.
examples:
- The old catalog lists the alpaca as Lama pacos.
- The label Lama pacos appeared beside a sample of alpaca fleece.
