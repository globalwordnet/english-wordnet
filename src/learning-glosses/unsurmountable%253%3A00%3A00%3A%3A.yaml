simpleMeaning: Said of a problem or a task that no one can get past or deal with.
scope: Also called insurmountable. It is said of a thing, not of a person.
examples:
- The unsurmountable wall of debt kept the family from buying a house.
- They faced unsurmountable odds in the final game.
