senseId: 'material_witness%1:18:00::'
synsetId: 10320756-n
simpleMeaning: A witness whose testimony is relevant to the issue and needed to settle it.
scope: The importance of the testimony to the decision is what makes the witness material.
examples:
- As the only person who had seen the signature being added, she was a material witness.
- The court heard from a material witness who could identify the handwriting.
