senseId: substitutable%5:00:00:exchangeable:00
synsetId: 00920882-s
simpleMeaning: Having to do with a thing that can be put in the place of another thing, or of something
  else that is worth the same.
scope: It is also called commutable. It is not a word that can be used in place of another word with no
  change in meaning.
examples:
- The two parts are substitutable, so either one will fit.
- They looked for a substitutable fuel that cost less.
