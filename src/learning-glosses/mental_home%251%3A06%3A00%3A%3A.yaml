simpleMeaning: An older term for a hospital that provides inpatient care for people with serious mental
  health conditions.
scope: It is also called an institution, an asylum, an insane asylum, a mental hospital, a mental institution,
  or a psychiatric hospital.
examples:
- After the breakdown, the patient was sent to a mental home for care.
- Visitors came to the mental home on Sunday afternoons.
