simpleMeaning: The flowers of this European plant follow the sun, turning to face it, and the plant is
  not bad to look at.
scope: Wartweed, sun spurge, devil's milk, and Euphorbia helioscopia are other names for this plant, which
  is not an ugly one.
examples:
- A clump of wartwort grew by the door, its flowers facing the sun.
- The wartwort in the pot turned its flowers toward the sun.
