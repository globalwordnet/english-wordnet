simpleMeaning: A baseball play in which a runner is tagged out while away from a base.
scope: It is a fielding move against a runner, not a throw to a batter or a swing of the bat.
examples:
- The pitcher tried a pick-off, but the runner got back in time.
- That pick-off ended the inning with the runner caught at first.
