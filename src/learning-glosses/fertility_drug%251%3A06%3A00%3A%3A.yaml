simpleMeaning: A medicine used to improve a woman’s chance of becoming pregnant, for example by helping
  an ovary release an egg.
scope: A medicine that helps a woman's body make a baby more easily, not something that stops pregnancy
  and not a vitamin.
examples:
- Her doctor gave her a fertility drug to help her conceive.
- The fertility drug worked after three months of treatment.
