simpleMeaning: A punishment for a fault or mistake, in which something is lost or given up.
scope: This one is about the punishment itself, also called a forfeit, not the act of losing something.
examples:
- They faced forfeiture of their deposit after missing the deadline.
- They lost their license through forfeiture after filing late.
