simpleMeaning: The part of the brain's outer layer, in the left or right half of the brain, that lies
  at the back of the head.
scope: Also called the occipital lobe. It is a noun.
examples:
- The surgeon pointed to the occipital cortex at the back of the patient's head.
- The scan showed the occipital cortex clearly.
