senseId: 'mineralocorticoid%1:27:00::'
synsetId: 14776042-n
simpleMeaning: A steroid hormone made in the outer layer of the glands above the kidneys that helps control
  how the body handles sodium and potassium.
scope: In the body, this chemical from the glands above the kidneys guides how sodium and potassium are
  used.
examples:
- The mineralocorticoid helps the body use sodium.
- The mineralocorticoid helps the body use potassium.
