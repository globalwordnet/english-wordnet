senseId: 'rigor_mortis%1:22:00::'
synsetId: 13573026-n
simpleMeaning: Muscle stiffness after death, often beginning within two to four hours and sometimes lasting
  several days, depending on conditions.
scope: This is the stiffening of the muscles after death, with its set time of 2 to 4 hours after death
  and about 4 days, not just any stiffness of the joints after death.
examples:
- Two hours after death, rigor mortis had set in and the body was stiff.
- The body was stiff with rigor mortis.
