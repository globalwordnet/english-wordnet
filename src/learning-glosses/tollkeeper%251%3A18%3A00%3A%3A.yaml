simpleMeaning: Someone whose work is to take the money people must pay to pass, at a road or a bridge.
scope: Also called a toll agent, a toll collector, a toll taker, a toller, and a tollgatherer. It is a
  kind of worker.
examples:
- The tollkeeper lifted the bar after we paid.
- A tollkeeper waved us through once we had paid.
