simpleMeaning: In computing, ready-made programs and small sets of orders sit waiting, kept on hand so
  a computer can call on them at once.
scope: This sense is also called library and program library.
examples:
- The programmer took a ready-made program from the subroutine library.
- They added the new program to the subroutine library.
