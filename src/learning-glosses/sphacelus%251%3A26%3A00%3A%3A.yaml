senseId: 'sphacelus%1:26:00::'
synsetId: 14336867-n
simpleMeaning: A lump of body tissue that has died and stays where it is, no longer part of the living
  flesh around it.
scope: Also called slough and gangrene, this dead lump is not the dying of living cells itself.
examples:
- The surgeon cut away the sphacelus from the wound.
- They found a mass of sphacelus in the wound.
