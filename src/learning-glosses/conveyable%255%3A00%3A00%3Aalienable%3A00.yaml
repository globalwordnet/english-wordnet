simpleMeaning: Said of a thing that can by law pass to another person to own.
scope: Also called transferable, negotiable, assignable, and transferrable; this one is about a thing.
examples:
- The conveyable land passed to the buyer when the papers were signed.
- The conveyable shares changed hands after the sale was agreed.
