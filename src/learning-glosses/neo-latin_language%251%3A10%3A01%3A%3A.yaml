simpleMeaning: Latin as written since the Renaissance, used especially to give scientific names to living
  things and other subjects of study.
scope: Also called Neo-Latin, New Latin, and New Latin language, this is the old tongue as people have
  used it since the time of the Renaissance, not the tongue of ancient Rome.
examples:
- Botanists learn Neo-Latin language to read old plant names.
- She studied Neo-Latin language for her work in science.
