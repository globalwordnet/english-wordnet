senseId: 'sacrilegiousness%1:07:00::'
synsetId: 04863413-n
simpleMeaning: A lack of respect for what is holy, shown in words or acts that treat it as common.
scope: This names a state, not the single act that brings it about.
examples:
- The sacrilegiousness of the act was clear to everyone who saw it.
- The words were full of sacrilegiousness.
