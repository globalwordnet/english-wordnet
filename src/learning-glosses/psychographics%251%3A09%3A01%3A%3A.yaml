simpleMeaning: Market research or statistics grouping people by attitudes, values, or fears. Also the
  characteristics or trends that such research identifies.
scope: Marketers use the word for both the research and the patterns it reveals.
examples:
- Psychographics sorts people by their attitudes and fears, not just by age.
- The psychographics from the study showed patterns in what people valued and feared.
