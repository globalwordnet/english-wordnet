simpleMeaning: From the Cretaceous, a time long ago when dinosaurs lived, came this large dinosaur with
  a bill like a duck's.
scope: Also called trachodon, this names a big dinosaur with a duck's bill, from the Cretaceous, not a
  small one and not one with a pointed beak.
examples:
- A trachodont skeleton towered over the visitors in the museum hall.
- The trachodont's bill looked just like a duck's.
