simpleMeaning: Relating to a verb form that presents an action, usually in the past, without specifying
  whether it continued or finished.
scope: This one is not about a verb form that shows an action going on or finished.
examples:
- They spotted the aoristic ending on the Greek verb in the sentence.
- The teacher pointed out the aoristic use of the verb in the old text.
