simpleMeaning: A way of being that makes a person warm toward others and easy to talk to.
scope: Also called affability, bonhomie, geniality, amiability, or affableness, this one stays with a
  person, not just one kind act.
examples:
- People noticed their amiableness the moment they greeted guests at the door.
- The amiableness of the host put every guest at ease.
