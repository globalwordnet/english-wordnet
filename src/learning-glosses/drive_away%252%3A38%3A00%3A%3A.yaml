simpleMeaning: To make a person or a thing leave, in real life or in the mind.
scope: This one is also called dispel, chase away, drive off, drive out, run off, and turn back.
examples:
- The guard was told to drive away potential burglars from the gate.
- The student tried to drive away bad thoughts before the exam.
