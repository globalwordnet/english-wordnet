simpleMeaning: Cefuroxime, a cephalosporin antibiotic injected as Zinacef or taken as tablets under the
  name Ceftin, used for lung, throat, ear, urinary tract, or brain membrane infections depending on formulation.
scope: Not penicillin or amoxicillin, other infection-fighting drugs; also called cefuroxime and Ceftin.
examples:
- The doctor gave him Zinacef for the chest infection.
- Zinacef cleared up the ear infection.
