simpleMeaning: A historical name for a milder form of smallpox caused by a less severe variety of the
  smallpox virus.
scope: 'Also called alastrim, milk pox, pseudosmallpox, pseudovariola, variola minor, white pox, Cuban
  itch, and Kaffir pox: a mild form of the spotted illness, not the severe form and not chickenpox.'
examples:
- West Indian smallpox was a mild form of the disease.
- Doctors called the mild outbreak West Indian smallpox.
