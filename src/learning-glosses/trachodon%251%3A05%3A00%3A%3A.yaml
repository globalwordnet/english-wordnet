simpleMeaning: This large dinosaur had a bill like a duck's and lived in the Cretaceous, a time long ago
  when dinosaurs lived.
scope: Also called trachodont, this name is for a big dinosaur with a duck's bill from the Cretaceous,
  not a small one and not one with a sharp beak.
examples:
- The trachodon had a bill shaped like a duck's.
- The trachodon was one of the largest dinosaurs in the hall.
