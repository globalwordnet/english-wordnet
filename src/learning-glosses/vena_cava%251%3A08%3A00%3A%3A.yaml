simpleMeaning: Blood with no oxygen left comes back to the right upper room of the heart through either
  of these two large vessels.
scope: This is one of two large vessels, not one that carries blood with oxygen out to the body.
examples:
- Doctors watched the vena cava as it returned blood to the right side of the heart.
- They traced the vena cava up to the right side of the heart.
