simpleMeaning: To do with a way of writing that uses a set of letters, or shown by such writing.
scope: Also called alphabetical, this one says something uses letters, not that things are put in letter
  order.
examples:
- The book uses an alphabetic system, with one sign for each sound.
- The class studied alphabetic writing, where each sign stands for a sound.
