simpleMeaning: One of three European countries on the Baltic Sea, Estonia, Latvia, or Lithuania.
scope: Also called Baltic republic, these are countries in Europe on the edge of the sea in the north
  of Europe, not countries inland and not any other group of countries.
examples:
- Estonia is a Baltic state.
- The Baltic states joined the European Union in 2004.
