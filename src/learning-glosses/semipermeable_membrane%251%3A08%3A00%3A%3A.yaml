simpleMeaning: A thin layer, such as the one around a living cell, that lets some tiny bits pass through
  but holds others back.
scope: It is a noun.
examples:
- Water passed through the semipermeable membrane, but the salt stayed behind.
- The semipermeable membrane around the cell let oxygen in and kept larger bits out.
