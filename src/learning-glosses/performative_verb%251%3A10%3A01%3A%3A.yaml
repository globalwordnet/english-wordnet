senseId: 'performative_verb%1:10:01::'
synsetId: 92462257-n
simpleMeaning: A verb that carries out the action it names when spoken, as “promise” does in “I promise
  to come.”
scope: It is a word.
examples:
- When you say 'I promise,' the word 'promise' is a performative verb.
- '''Warn'' is a performative verb in ''I warn you.'''
