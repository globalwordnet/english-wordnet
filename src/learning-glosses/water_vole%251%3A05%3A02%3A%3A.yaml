simpleMeaning: No other vole in the west of North America grows as big as this one, known in Latin as
  Microtus richardsoni.
scope: Microtus richardsoni and Richardson vole are other names for this one, which is not one of the
  smaller kinds.
examples:
- They found a water vole by the stream, bigger than any other vole they had seen.
- The water vole in the cage was the biggest of all the voles they had caught.
