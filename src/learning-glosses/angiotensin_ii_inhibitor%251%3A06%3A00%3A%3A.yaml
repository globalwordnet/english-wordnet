simpleMeaning: A substance that slows or blocks the action of angiotensin II, a hormone that narrows blood
  vessels.
scope: This is a drug that slows one chemical's action in the body, not the chemical itself.
examples:
- The angiotensin II inhibitor slowed the action of the chemical.
- She takes an angiotensin II inhibitor to slow the action of the chemical in her body.
