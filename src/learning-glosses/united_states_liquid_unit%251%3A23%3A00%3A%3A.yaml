simpleMeaning: An official US customary unit for measuring liquid volume, such as a gallon.
scope: A measure for things that flow, used as the country's official measure; not a measure for dry goods
  and not a measure of the metric set.
examples:
- A pint is a United States liquid unit.
- The recipe used a United States liquid unit.
