simpleMeaning: A religion practiced especially in Haiti and elsewhere in the Caribbean. Its followers
  honor spirits through ceremonies and may seek their protection or help.
scope: Also called voodoo, hoodooism, and voodooism, this is a Caribbean faith that uses magic and calls
  on spirits.
examples:
- They practice vodoun in Haiti.
- In Haiti, vodoun followers call on spirits of nature.
