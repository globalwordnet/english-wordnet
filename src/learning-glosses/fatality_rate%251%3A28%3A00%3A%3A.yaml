synsetId: 15302104-n
simpleMeaning: The share of deaths among the people living in one place, given for every thousand of them
  each year.
scope: This one is also called mortality, death rate, deathrate, and mortality rate.
examples:
- The fatality rate in the town fell after the new hospital opened.
- They worked out the fatality rate for every thousand people in the area.
