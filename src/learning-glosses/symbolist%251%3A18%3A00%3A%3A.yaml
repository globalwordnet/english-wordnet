simpleMeaning: Ideas put across in a roundabout way, through signs, marked the group of artists this person
  belonged to.
scope: This is a member of the art movement that worked through signs, not a person good at reading and
  showing what signs mean.
examples:
- The symbolist put the idea across through signs rather than in plain words.
- The symbolist showed work with the group, and the signs in it carried the ideas.
