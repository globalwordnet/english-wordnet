simpleMeaning: Light wood from a tulip tree that is easy to shape and used for furniture and veneer, a
  thin decorative covering.
scope: True tulipwood, white poplar, whitewood, and yellow poplar are other names for it. It is not the
  streaked material made to decorate things.
examples:
- The cabinet maker chose tulipwood for the drawers.
- They sanded the tulipwood until it was smooth.
