simpleMeaning: A brand of trazodone, a nontricyclic antidepressant taken by mouth that can also act as
  a sedative.
scope: 'Also called trazodone and trazodone hydrochloride, and sold as Desyrel: a drug taken by mouth
  that lifts low mood and is used to calm people and help them sleep.'
examples:
- The doctor gave her Desyrel for her low mood.
- He takes Desyrel at night to help him sleep.
