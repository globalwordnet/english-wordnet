simpleMeaning: Numbers that go with a bass part set down in full show which chords to play.
scope: This is also called basso continuo, continuo, and figured bass, and it differs from a plain part
  in carrying numbers that show the chords.
examples:
- They looked at the numbers with the thorough bass and played the chords they showed.
- They learned to read a thorough bass by following the numbers.
