simpleMeaning: Rinderpest, a usually fatal viral disease of cattle that causes fever, diarrhea, and inflammation
  of the moist linings of organs such as the mouth.
scope: This sense is also called rinderpest, a sharp, catching sickness of cattle from a virus, usually
  deadly, marked by fever, loose bowels, and inflamed wet linings.
examples:
- Cattle plague killed the herd.
- Cattle plague brings fever and loose bowels.
