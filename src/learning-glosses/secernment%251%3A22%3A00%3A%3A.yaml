simpleMeaning: This work of the body makes a substance and gives it out.
scope: Also called secretion, it is the body's work of making a substance and giving it out, not the mind's
  work of telling things apart.
examples:
- The body gives out a substance through secernment.
- Secernment gives out the substance the body has made.
