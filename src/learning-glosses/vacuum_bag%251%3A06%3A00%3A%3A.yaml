simpleMeaning: A bag that holds the dirt a cleaning machine sucks up.
scope: This is also called a dust bag, and it is what dirt is sucked into, not the machine that does the
  sucking.
examples:
- The vacuum bag was full, so they put in a new one.
- They changed the vacuum bag when the cleaner lost power.
