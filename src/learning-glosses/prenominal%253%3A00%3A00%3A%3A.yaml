simpleMeaning: Said of a word that adds meaning to a noun and comes before the noun it adds meaning to.
scope: It is also called attributive. It is a word.
examples:
- In 'a red apple', 'red' is a prenominal adjective.
- A prenominal word always comes before the noun it describes.
