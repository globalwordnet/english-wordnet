simpleMeaning: A tree of New Zealand that keeps its leaves all year, prized for light wood that is easy
  to shape.
scope: It is also called Dacrycarpus dacrydioides, Podocarpus dacrydioides, New Zealand dacryberry, or
  New Zealand white pine.
examples:
- The builders chose kahikatea for its light wood.
- A kahikatea stood at the edge of the garden.
