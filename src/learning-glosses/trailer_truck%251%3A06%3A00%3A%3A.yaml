simpleMeaning: The back part carries the load while the front part pulls it, and the two are joined into
  one truck.
scope: This is also called a semi, a rig, an articulated lorry, a tractor trailer, or a trucking rig,
  and it is not one whole vehicle with no back part.
examples:
- The trailer truck's front part pulled the loaded back part up the hill.
- The trailer truck bent in the middle as the front part turned the corner.
