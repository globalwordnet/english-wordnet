simpleMeaning: Passover, the Jewish festival celebrating the Israelites' escape from Egypt. It begins
  on the fifteenth of Nisan and traditionally lasts eight days outside Israel.
scope: This is the Jewish feast marking the flight out of Egypt, also called Feast of the Unleavened Bread,
  Passover and Pesah, not a feast of another faith.
examples:
- Pesach marks the flight of the Israelites out of Egypt.
- Jewish families keep Pesach for eight days.
