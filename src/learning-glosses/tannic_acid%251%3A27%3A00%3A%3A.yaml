senseId: 'tannic_acid%1:27:00::'
synsetId: 15091592-n
simpleMeaning: Plant chemicals made of many parts, made with the chemical phenol, turn animal skins into
  leather and serve as a medicine; this is one of several such chemicals.
scope: This is also called tannin, a chemical taken from plants, not the plant itself.
examples:
- The tannic acid turned the animal skin into leather.
- They used tannic acid as a medicine.
