simpleMeaning: One of several complex plant substances with a chemical structure related to phenol, used
  to turn hides into leather and in medicine.
scope: This is also called tannin, a chemical taken from plants, not the plant itself.
examples:
- The tannic acid turned the animal skin into leather.
- They used tannic acid as a medicine.
