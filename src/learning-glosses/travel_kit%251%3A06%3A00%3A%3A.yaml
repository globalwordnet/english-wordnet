simpleMeaning: A person takes this kit on a trip to carry the things they use to wash and keep clean.
scope: Also called a toilet kit, this holds the things a person uses to wash and keep clean on a trip,
  not the clothes they wear.
examples:
- They packed the travel kit with the things they use to wash before the trip.
- They took the travel kit out of the bag when they stopped to wash.
