senseId: 'stabilise%2:35:02::'
synsetId: 01222557-v
simpleMeaning: To hold a thing in place with a stiff support, real or imagined, so it stays firm and does
  not move.
scope: Also called steady, brace, and stabilize. It is not about stopping a thing from changing up and
  down.
examples:
- The potter stabilised the wheel with a brace while working.
- They stabilised the shelf with a wooden brace before painting it.
