simpleMeaning: This medicine keeps blood liquid by stopping it from clotting, or by slowing the clotting
  down.
scope: Also called anticoagulant or decoagulant, this one does not help clots form.
examples:
- The doctor put them on anticoagulant medication after the clot was found.
- They stayed on the anticoagulant medication until the risk had passed.
