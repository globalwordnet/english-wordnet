simpleMeaning: A small group of soldiers formed to shoot rounds of shots at a funeral for a soldier, or
  to put to death a person the army has sentenced to die.
scope: People also call this a firing squad.
examples:
- The firing party stood ready at the edge of the grave.
- A firing party gave the salute as the coffin was lowered.
