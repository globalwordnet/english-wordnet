simpleMeaning: A member of a church formed in the nineteenth century by German Catholics who rejected
  the teaching that the pope can proclaim certain doctrines without error.
scope: A person of the church set up in the 1800s by Germans of the Roman church; not a person of the
  Roman church that takes the Pope as never wrong.
examples:
- An Old Catholic priest led the service in the small church.
- She is an Old Catholic who does not accept that the Pope can never be wrong.
