simpleMeaning: Paint traditionally applied to the face or body before battle by members of some Indigenous
  peoples of the Americas.
scope: This is a decoration, worn before a battle and not at other times.
examples:
- They put on war paint before the battle, painting their faces and arms for the fight.
- They washed the war paint from their faces and bodies after the battle was over.
