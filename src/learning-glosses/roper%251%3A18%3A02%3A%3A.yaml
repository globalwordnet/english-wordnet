simpleMeaning: A gambling house uses this person to bring in new customers by a trick, above all when
  the games are rigged.
scope: This names the person who brings people into a gambling house by a trick, not a cowboy who catches
  cattle or horses with a lasso.
examples:
- The roper led the visitors into the gambling hall.
- A roper drew in new customers.
