simpleMeaning: A nerve cell in the brain's outer layer with short receiving branches and either a long
  sending fiber or a short one that branches in the gray matter.
scope: Also called Golgi cell; this nerve unit sits in the outer layer of the brain, with short branch-like
  parts and a main thread that splits in the grey matter.
examples:
- The Golgi's cell sends its main thread through the grey matter.
- A Golgi's cell in the outer layer of the brain has short branch-like parts.
