senseId: 'tactile_agnosia%1:26:00::'
synsetId: 14079625-n
simpleMeaning: The loss of the power to know things by feeling them with the hands.
scope: Also called astereognosis. It does not mean the hands feel nothing.
examples:
- Tactile agnosia meant they could not tell a key from a coin by touch.
- A person with tactile agnosia can feel a cup but not know what it is.
