simpleMeaning: Able to be changed in shape, nature, or strength, most of all by being made less extreme.
scope: It is an adjective.
examples:
- The rhythm of physiological time is not modifiable except by interference with certain fundamental processes.
- The plan is modifiable if the weather turns bad.
