simpleMeaning: Spiral-shaped bacteria that can live independently or in a host. Many cause disease in
  humans or other animals.
scope: Also called spirochaete, this names germs that feed off others or live on their own, many able
  to cause illness in people and animals.
examples:
- A spirochete was found in the sample.
- Some spirochete feed off animals, while others live free.
