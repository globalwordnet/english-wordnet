senseId: 'stage_whisper%1:10:00::'
synsetId: 07145288-n
simpleMeaning: A whisper loud enough to overhear. In a play, the audience hears it while other characters
  are understood to hear nothing.
scope: It is the name for words in a play spoken low, yet meant only for the crowd to hear.
examples:
- The actor used a stage whisper in the scene.
- They caught every word of the stage whisper.
