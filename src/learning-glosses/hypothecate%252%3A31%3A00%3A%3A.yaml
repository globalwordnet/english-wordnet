senseId: 'hypothecate%2:31:00::'
synsetId: 00635105-v
simpleMeaning: To hold something true, above all on grounds that are shaky and unproven.
scope: It is also called suppose, speculate, conjecture, theorize, hypothesize, hypothesise and theorise.
examples:
- The team hypothecated that the old coins came from a Roman ship.
- The report hypothecated a link between the two events, though proof was lacking.
