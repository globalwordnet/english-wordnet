simpleMeaning: Mercury, a heavy, silvery, toxic metal with chemical valences of one and two. It is the
  only metal that is liquid at ordinary room temperature.
scope: This is the only metal that is liquid at normal heat, also called mercury, Hg, hydrargyrum, atomic
  number 80, not any solid metal nor water.
examples:
- Quicksilver is liquid at room heat.
- Old thermometers held quicksilver.
