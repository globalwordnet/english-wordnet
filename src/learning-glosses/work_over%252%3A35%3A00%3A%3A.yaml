simpleMeaning: One person keeps striking another, either to punish them or because they mean them harm.
scope: Also called beat or beat up, this is not a single blow struck by chance.
examples:
- They worked him over behind the closed doors of the bar.
- The gang worked over the newcomer to show them who was in charge.
