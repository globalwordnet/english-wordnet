simpleMeaning: A blood cancer involving cells called lymphocytes. Abnormal lymphocytes can build up in
  the blood and cause lymph nodes or other lymph tissues to enlarge.
scope: The word lymphocytic identifies the type of blood cell involved.
examples:
- Her swollen lymph nodes led to tests for lymphocytic leukemia.
- The specialist examined a blood sample for signs of lymphocytic leukemia.
