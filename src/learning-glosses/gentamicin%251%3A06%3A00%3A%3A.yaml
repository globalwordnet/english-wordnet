simpleMeaning: An antibiotic from a type of bacterium called an actinomycete, sold as Garamycin and used
  to treat urinary tract infections.
scope: Sold as Garamycin, this drug heals infections of the tubes that carry water out of the body.
examples:
- Gentamicin healed the infection in the tubes that carry water out of the body.
- The infection of the urinary tract was treated with gentamicin.
