senseId: 'velar%1:10:00::'
synsetId: 07134733-n
simpleMeaning: At the back of the mouth, the back of the tongue touches the soft roof, or comes close
  to it, to make this sound.
scope: This is one speech sound, also called a velar consonant, not the adjective that describes how such
  a sound is made.
examples:
- The velar at the start of the word 'go' is made with the back of the tongue.
- They said the velar in 'go' clearly, with the back of the tongue raised.
