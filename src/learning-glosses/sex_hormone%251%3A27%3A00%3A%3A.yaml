simpleMeaning: A hormone that influences how the reproductive organs grow and develop.
scope: A steroid or a steroid hormone is another name for any chemical the body makes that can change
  how the male and female parts grow.
examples:
- A sex hormone changed how the male and female parts grew.
- A sex hormone helps the male and female parts of the body grow.
