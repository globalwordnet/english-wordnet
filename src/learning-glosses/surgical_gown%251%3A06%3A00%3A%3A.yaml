simpleMeaning: A loose outer piece worn over other clothes that keeps a surgeon safe while working on
  a patient.
scope: This is the loose outer piece surgeons wear over their clothes during an operation; gown and scrubs
  are other names for it.
examples:
- The nurse handed the surgeon a fresh surgical gown before the operation began.
- They put on a surgical gown and gloves before stepping into the operating room.
