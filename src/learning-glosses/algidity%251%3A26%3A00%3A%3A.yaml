simpleMeaning: A state of being very weak, with cold, damp skin and blood pressure below normal.
scope: This one names a state of great weakness, not one of the signs that mark it.
examples:
- The patient sank into algidity, their skin cold and damp to the touch.
- By evening the algidity had left them too weak to sit up.
