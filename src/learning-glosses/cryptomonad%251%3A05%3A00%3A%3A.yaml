simpleMeaning: A microscopic, single-celled organism common in fresh and salt water that can multiply
  in large numbers near shores, forming an algal bloom.
scope: Also called cryptophyte; a water creature, not a seaweed and not a fish.
examples:
- Cryptomonads gather near the shore in summer.
- We found cryptomonads in the rock pools along the shore.
