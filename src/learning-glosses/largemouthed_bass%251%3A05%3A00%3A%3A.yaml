simpleMeaning: A large freshwater fish in the black bass group whose upper jaw extends behind the eye.
scope: Also called largemouth, largemouth bass, largemouth black bass and largemouthed black bass, this
  is a big dark fish whose mouth corner sits behind the eye, not a smallmouth bass and not any other dark
  fish.
examples:
- The largemouthed bass struck the lure hard.
- He has caught largemouthed bass in this lake for years.
