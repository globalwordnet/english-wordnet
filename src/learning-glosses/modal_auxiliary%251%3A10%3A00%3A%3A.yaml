senseId: 'modal_auxiliary%1:10:00::'
synsetId: 06329715-n
simpleMeaning: A word that goes with a main verb, like 'can' or 'will', to show what the speaker thinks
  about whether something can happen, must happen, or may happen.
scope: It is also called modal, modal auxiliary verb, or modal verb.
examples:
- In 'They can swim', 'can' is a modal auxiliary.
- '''Will'' is a modal auxiliary in ''I will come tomorrow''.'
