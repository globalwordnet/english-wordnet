simpleMeaning: A colorless, highly flammable liquid from petroleum that evaporates easily. It serves as
  a solvent and a standard for fuel octane ratings and has been used as an anesthetic.
scope: 'For fuel testing and dissolving things: a petroleum liquid also used to dull pain.'
examples:
- Heptane is used to work out octane marks.
- Heptane dissolves things.
