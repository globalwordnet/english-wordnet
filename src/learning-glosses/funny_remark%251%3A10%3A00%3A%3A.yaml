simpleMeaning: The telling of something amusing, most often with a last line that makes people laugh.
scope: This sense is also called funny, funny story, and good story.
examples:
- That funny remark about the burnt toast made us all laugh.
- The funny remark at the end of the speech made everyone laugh.
