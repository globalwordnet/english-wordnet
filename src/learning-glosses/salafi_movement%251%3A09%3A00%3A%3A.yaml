simpleMeaning: A Sunni movement modeled on early Muslims. Some militant factions reject other Muslims
  as unbelievers and seek to spread their interpretation worldwide.
scope: A militant Sunni group, also called Salafism; not all Sunnis and not the moderate Muslims it calls
  unbelievers.
examples:
- The Salafi movement seeks converts across the region.
- He joined the Salafi movement in his youth.
