simpleMeaning: A card game with chips on a separate deck’s ace, king, queen, and jack of different suits.
  Runs rise from the lowest card held. Matching layout cards wins their chips.
scope: A gambling card game in which chips go on high cards and rising runs win; also called stops, boodle,
  Chicago, and Newmarket.
examples:
- We played Michigan until midnight.
- Michigan needs chips, cards, and a second pack.
