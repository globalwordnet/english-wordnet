simpleMeaning: How much a thing or a material holds back a flow of heat is measured by a difference in
  temperature.
scope: This is a measure of a temperature difference, not of how hot the thing is on its own.
examples:
- They worked out the thermal resistance of the wall.
- The thermal resistance told them how much heat the roof would hold back.
