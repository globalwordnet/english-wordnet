simpleMeaning: Coming from traditional stories, or told in them, with no facts or real past behind it.
scope: It is also called fabulous, mythical, mythic, and mythological.
examples:
- The mythologic tale spoke of gods who lived on a high mountain.
- Their mythologic view of the past had no facts to back it up.
