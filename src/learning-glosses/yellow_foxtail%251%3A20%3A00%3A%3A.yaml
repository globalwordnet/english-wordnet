simpleMeaning: This common grass, a weed-like growth that is rough with stiff hairs, turns up in nearly
  all places with mild weather.
scope: Also called glaucous bristlegrass, yellow bristle grass, yellow bristlegrass, and Setaria glauca,
  this one is common, not rare.
examples:
- They pulled the yellow foxtail out of the field because it was spreading like a weed.
- The yellow foxtail along the path felt rough with stiff hairs when they brushed past it.
