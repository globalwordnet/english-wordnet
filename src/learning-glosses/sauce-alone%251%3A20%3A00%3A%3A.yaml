simpleMeaning: Garlic is what this European herb brings to mind by its smell.
scope: Also called garlic mustard, hedge garlic, jack-by-the-hedge and Alliaria officinalis, this herb
  only smells like garlic; it is not the garlic plant itself.
examples:
- The sauce-alone smells like garlic, and it grows in Europe.
- The sauce-alone gave off a smell of garlic.
