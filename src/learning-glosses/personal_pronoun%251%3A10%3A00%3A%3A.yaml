simpleMeaning: A word that stands in place of a name and shows if the one meant is speaking, is being
  spoken to, or is spoken about.
scope: It is a word.
examples:
- In 'You run', 'you' is a personal pronoun.
- We use the personal pronoun 'I' when we speak of ourselves.
