senseId: 'selvedge%1:06:00::'
synsetId: 04177994-n
simpleMeaning: Threads at the side of a piece of cloth, worked so they hold together and cannot come loose.
scope: Also called selvage, this names the woven edge of cloth that holds together, unlike the other sense
  of the same word, which is a fringe at the end of a carpet.
examples:
- The selvedge kept the cloth from fraying at the sides.
- They trimmed the cloth just inside the selvedge.
