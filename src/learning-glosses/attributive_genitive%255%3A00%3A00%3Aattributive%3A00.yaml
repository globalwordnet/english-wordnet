simpleMeaning: Describing a word that marks a thing as belonging to someone or something and goes before
  the noun it says more about.
scope: This is the adjective sense of this word, not the noun sense of this word.
examples:
- In 'John's mother', 'John's' is used as an attributive genitive.
- The attributive genitive 'John's' stands before the noun 'mother'.
