simpleMeaning: Said of someone who bends a little on what divides people, so that all can agree.
scope: This one is also called cooperative, and it is not the sense about helping things fit together
  in a friendly way.
examples:
- Both sides were accommodative at the talks, and a deal was reached by nightfall.
- They stayed accommodative through the long meeting until everyone agreed.
