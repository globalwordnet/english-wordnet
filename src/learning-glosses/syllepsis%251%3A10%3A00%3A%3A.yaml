senseId: 'syllepsis%1:10:00::'
synsetId: 07123342-n
simpleMeaning: The use of one word to set the form of two or more other words, though it matches only
  one of them in number or case or the like.
scope: It is a figure of speech in grammar, not a mistake.
examples:
- The poet used syllepsis when one verb carried two very different objects.
- Syllepsis can make a sentence witty when a single word fits two phrases in different ways.
