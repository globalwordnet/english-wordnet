simpleMeaning: The skin of a banana, especially after someone has peeled it off and thrown it away.
scope: Also called a banana peel, this one is about the covering, not the fruit inside.
examples:
- He slipped on a banana skin and almost fell.
- The banana skin went into the bin once the fruit was eaten.
