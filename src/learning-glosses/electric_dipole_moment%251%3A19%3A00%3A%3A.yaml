simpleMeaning: A measure of two opposite charges set apart, counting both how big they are and how far
  apart they sit.
scope: It is about a measure, not about the charges themselves.
examples:
- The electric dipole moment of the molecule was large.
- Scientists measured the electric dipole moment of water.
