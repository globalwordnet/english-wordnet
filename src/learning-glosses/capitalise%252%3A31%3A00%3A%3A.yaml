simpleMeaning: To treat what a business spends as capital assets, not as running costs.
scope: Capitalize is another name for this, which concerns spending rather than reserve funds, a business's
  money, or writing words with large first letters.
examples:
- The firm will capitalise the cost of the new building.
- They capitalised the money spent on the new machines.
