simpleMeaning: In the smooth muscles above all, this drug stops sudden tightenings or keeps them from
  starting.
scope: Antispasmodic and antispasmodic agent are other names for this drug, which stops sudden tightenings
  in the muscles, above all the smooth ones.
examples:
- A spasmolytic eased the cramps.
- The spasmolytic stopped the sudden tightening of the muscles.
