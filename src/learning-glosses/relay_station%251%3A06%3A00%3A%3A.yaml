simpleMeaning: A place with a device that picks up a weak sent signal, makes it strong again, and sends
  it on
scope: This is a place where a weak sent signal is made strong again and sent on, also called a booster,
  a booster amplifier, a booster station, a relay link, or a relay transmitter.
examples:
- The relay station on the hill caught the weak signal and sent it on strong.
- Engineers built a relay station halfway along the route so the signal would not fade.
