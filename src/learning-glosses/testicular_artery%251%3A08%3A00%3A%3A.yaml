simpleMeaning: Blood reaches the glands that make sperm through one branch of the body's main blood vessel.
scope: This is also called arteria testicularis or the internal spermatic artery; it branches off the
  main blood vessel and is not that vessel itself.
examples:
- Blood flows to the glands through the testicular artery.
- The testicular artery runs from the main blood vessel to the glands.
