simpleMeaning: Used of a material that can be changed to gas.
scope: Also called evaporable, vaporific, vaporizable, vapourific, volatilisable, and volatilizable. It
  is used of a substance, not of a gas itself.
examples:
- The vapourisable wax changed to gas as it stood.
- Keep vapourisable liquids in tightly closed jars.
