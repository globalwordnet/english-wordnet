senseId: 'trouble_shooter%1:18:00::'
synsetId: 10751217-n
simpleMeaning: Machines that have stopped working as they should are this worker's concern above all,
  and the worker tracks down the fault and puts it right.
scope: Also called troubleshooter, this worker is called on after something has gone wrong, not to build
  a new machine.
examples:
- The firm sent a trouble shooter to find why the press kept stopping.
- Our trouble shooter found the loose wire and had the line running again.
