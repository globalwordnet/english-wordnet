simpleMeaning: A part of the body's defence that turns against the body itself, most often found in the
  watery part of the blood of people with swollen, stiff joints.
scope: A marker in the blood that points to swollen, stiff joints, not the joint illness itself.
examples:
- The blood test looked for rheumatoid factor.
- The lab found rheumatoid factor in the patient's blood test.
