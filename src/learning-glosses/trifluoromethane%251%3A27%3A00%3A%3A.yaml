simpleMeaning: A colorless gas related to chloroform, with one carbon atom, one hydrogen atom, and three
  fluorine atoms in each molecule.
scope: This gas is also called fluoroform, and it is not chloroform itself.
examples:
- They used trifluoromethane, a gas with no colour, to fill the tank.
- The workers chose trifluoromethane because it is much like chloroform.
