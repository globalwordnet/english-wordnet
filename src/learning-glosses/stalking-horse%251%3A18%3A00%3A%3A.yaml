simpleMeaning: A person put forward to stand for election so that the other side is split or the real
  choice stays hidden.
scope: It is a person, not an animal used by a hunter.
examples:
- The party put up a stalking-horse to split the vote.
- Everyone knew the stalking-horse was not the real choice.
