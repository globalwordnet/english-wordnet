simpleMeaning: A steroid hormone produced by the outer adrenal gland or made synthetically. As a medicine,
  it reduces swelling and weakens the immune response.
scope: This sense is also called corticoid and corticosteroid.
examples:
- An adrenal cortical steroid cut swelling.
- Adrenal cortical steroids lower defence.
