simpleMeaning: A thing has this quality when it is made of fibers or filaments, or has them in it.
scope: This is a quality in what a thing is made of or holds, not the fibers or filaments themselves.
examples:
- The work went better than they had hoped, thanks to the threadiness of the yarn.
- They liked the threadiness of the cloth.
