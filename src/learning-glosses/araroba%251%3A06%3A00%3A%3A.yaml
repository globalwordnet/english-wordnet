simpleMeaning: A yellow powder with a bitter taste, used to treat diseased skin.
scope: This powder is also called chrysarobin and Goa powder, and it is not a powder for any other part
  of the body.
examples:
- The doctor mixed araroba into a paste for the patient's skin.
- They kept a jar of araroba on the shelf for skin troubles.
