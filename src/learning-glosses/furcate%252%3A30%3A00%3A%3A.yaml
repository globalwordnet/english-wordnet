senseId: 'furcate%2:30:00::'
synsetId: 00329612-v
simpleMeaning: To open out from a single point into arms that go off in two or more directions, like a
  fork.
scope: This sense is also called separate, branch, fork, and ramify.
examples:
- The road furcates just past the bridge, with one arm heading north and the other south.
- The river furcates into two streams as it nears the plain.
