simpleMeaning: A tiny vein that receives blood from capillaries, the body's smallest blood vessels.
scope: Also called capillary vein and venule. It is a blood vessel, not the capillary it joins.
examples:
- Under the microscope, the venula showed as a thin red line beside the capillary.
- The venula and the capillary lay side by side in the sample.
