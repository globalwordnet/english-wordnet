simpleMeaning: Made to look like a man, it keeps birds away from the seeds.
scope: Also called scarecrow, bird-scarer, straw man, and strawman, it is a made thing that looks like
  a man, not a real man standing in the field.
examples:
- A scarer kept the birds from the seeds.
- Birds kept away from the seeds where the scarer stood.
