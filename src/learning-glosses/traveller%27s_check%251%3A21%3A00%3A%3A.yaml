simpleMeaning: A paper promise given out by a bank or carrier firm, paid by any office that works with
  the firm when a person shows it there.
scope: Also called a traveler's check and a banker's check, this is a paper promise any office working
  with the firm that gave it out will pay, not coins or notes in the hand.
examples:
- They changed a traveller's check into cash at the bank.
- They showed a traveller's check at the office and got the money it promised.
