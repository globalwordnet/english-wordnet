simpleMeaning: An unusually high number of white blood cells in the blood, which can occur with an infection
  or with conditions such as leukemia.
scope: It is also called leukocytosis.
examples:
- The blood test showed leucocytosis after the infection.
- Leucocytosis can follow a bad infection.
