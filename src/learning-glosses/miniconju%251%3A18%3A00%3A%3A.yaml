simpleMeaning: A member of a Siouan people, one part of the Teton Sioux, who lived in western South Dakota,
  from the Black Hills to the Platte River
scope: A person's membership in this division of the Teton Sioux determines the sense.
examples:
- The guide identified the Lakota speaker as a Miniconju.
- As a Miniconju, she shared family stories about the Black Hills.
