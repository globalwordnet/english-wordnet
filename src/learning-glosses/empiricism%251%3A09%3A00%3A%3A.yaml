simpleMeaning: The belief that what we know comes from what we have lived through and seen.
scope: This is also called sensationalism and empiricist philosophy, and it has nothing to do with treating
  sick people.
examples:
- Their empiricism holds that all knowledge comes from what we see and live through.
- The lecture defended empiricism, saying that we learn only from what we live through.
