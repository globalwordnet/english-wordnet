simpleMeaning: A payment to a town or city, charged on what a person owns, worked out from what it is
  thought to be worth.
scope: Also called land tax. It is a noun.
examples:
- They paid the tax on their house to the town council each year.
- The tax bill for the shop was worked out from the value of the building.
