simpleMeaning: The fact that one thing can stand in for another and do the same job.
scope: It is also called commutability and replaceability. It is not the act of changing one thing for
  another.
examples:
- The substitutability of the two parts made repairs quick and cheap.
- They tested the substitutability of the new fuel in the old engine.
