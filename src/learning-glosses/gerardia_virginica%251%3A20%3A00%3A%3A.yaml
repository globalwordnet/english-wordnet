simpleMeaning: A North American perennial with few branches and bright yellow, foxglove-like flowers clustered
  at the stem tips. Some classifications place it in the genus Gerardia.
scope: Also called false foxglove and Aureolaria virginica; a yellow-flowered plant of North America,
  not a true foxglove.
examples:
- Gerardia virginica bloomed yellow in the meadow.
- We found Gerardia virginica along the path.
