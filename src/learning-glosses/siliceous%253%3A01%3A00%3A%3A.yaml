simpleMeaning: Relating to, containing, or resembling silica, the main substance in quartz and many kinds
  of sand.
scope: Silicious is another name for this word, which is used of things that hold silica, are made from
  it, or look like it.
examples:
- The rock they found was siliceous.
- This sand is siliceous.
