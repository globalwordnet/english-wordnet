senseId: 'enanthema%1:26:00::'
synsetId: 14345080-n
simpleMeaning: A rash on a moist lining inside the body, such as the lining of the mouth, that appears
  as a sign of disease.
scope: A spot that breaks out on a wet inner skin, like the inside of the mouth, as a sign of a sickness,
  also called enanthem; not a spot on outer skin and not a cut.
examples:
- The doctor saw an enanthema inside the child's mouth.
- An enanthema can be a sign of measles.
