simpleMeaning: A soft white precious metal, usually monovalent, conducting heat and electricity best among
  metals. Found in argentite and in pure form, it serves in coins, jewelry, tableware, and photography.
scope: A white metal, also called Ag or atomic number 47; not the colour alone, and not any other metal.
examples:
- Silver is used in coins and jewelry.
- The spoon is made of silver.
