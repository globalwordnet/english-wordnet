schema: oewn-learning-gloss-v2
senseId: 'empiricism%1:04:01::'
synsetId: 00634351-n
simpleMeaning: Treating sick people and giving advice from watching and past cases alone, with no knowledge
  of what science has found.
scope: This is also called quackery, and it is the medical sense of the word, not the one about where
  knowledge comes from.
examples:
- The empiricism of the old healer rested on watching, not on science.
- Their empiricism meant advice came from watching and past cases alone.
