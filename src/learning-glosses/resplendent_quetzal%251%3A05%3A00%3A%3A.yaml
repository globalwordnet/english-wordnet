simpleMeaning: A Central American bird so seldom seen that most people never come across it, and the bird
  that stands for Guatemala.
scope: Also called resplendent trogon and Pharomacrus mocino, this is the bird Guatemala has taken as
  its own emblem, one of the rarest birds of Central America.
examples:
- The resplendent quetzal is so rare that few birdwatchers ever see one in the wild.
- Guatemala chose the resplendent quetzal as its national bird.
