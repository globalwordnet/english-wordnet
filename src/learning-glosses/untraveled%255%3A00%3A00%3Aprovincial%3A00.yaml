senseId: untraveled%5:00:00:provincial:00
synsetId: 00640609-s
simpleMeaning: Said of a person who has not been to many places, above all to other lands, and has learned
  little from going about.
scope: Also called untravelled. It is said of a person, not of a place.
examples:
- The untraveled farmer had never left the home county.
- They felt untraveled beside friends who had seen the world.
