senseId: 'furbish_up%2:30:00::'
synsetId: 00261534-v
simpleMeaning: To bring a thing that is torn or broken back into good working order by fitting a replacement
  part or by joining its pieces.
scope: This sense is also called doctor, fix, repair, restore, mend, bushel, and touch on.
examples:
- They furbished up the old chair by fitting new legs and gluing its broken frame.
- After the storm, the torn tent was furbished up and used again.
