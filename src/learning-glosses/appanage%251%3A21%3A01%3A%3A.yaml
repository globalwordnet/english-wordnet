simpleMeaning: By custom and by right, this is what a person holds along with their rank in life.
scope: Also called apanage, this one is not about a grant of resources to keep a member of a ruling family.
examples:
- The fine chair was an appanage of high office, not a piece of everyday furniture.
- They saw the large house as an appanage of the rank they held.
