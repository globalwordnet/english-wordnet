simpleMeaning: A mild form of banishment, or assignment to a lower rank or less important position.
scope: This is being sent away to a low post as a light punishment, and not being thrown out of a place
  for good.
examples:
- After the row, the relegation to a small office in the north was hard to bear.
- The relegation to the night shift felt like a punishment.
