simpleMeaning: Several blood vessels drain the walls of the stomach, each one carrying blood back toward
  the heart.
scope: This is one of several blood vessels of the stomach walls, also called gastric vein, not the only
  one.
examples:
- Blood leaves the walls of the stomach through the vena gastrica.
- The doctor traced the vena gastrica along the wall of the stomach.
