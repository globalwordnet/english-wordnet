senseId: 'perviousness%1:07:00::'
synsetId: 04947907-n
simpleMeaning: The quality of letting light, people, or things thrown at something get into or through
  it.
scope: Also called penetrability. It is a quality.
examples:
- The perviousness of the cloth let the rain soak through to the skin.
- The perviousness of the old wall let stones fly through the gaps.
