simpleMeaning: Having painful, irritated eyes, especially from conjunctivitis, also called pinkeye.
scope: This names the state of having aching parts for seeing, as when the illness that turns them pink
  has set in.
examples:
- They could tell from the sore-eyed look that the illness had set in.
- The sore-eyed child sat still and waited.
