simpleMeaning: Fixed straight to a surface by its base, with no stalk in between.
scope: Also called stalkless. It is an adjective.
examples:
- These sessile flowers grow straight from the stem, with no stalk of their own.
- The shell of a sessile barnacle is attached directly to a substrate.
