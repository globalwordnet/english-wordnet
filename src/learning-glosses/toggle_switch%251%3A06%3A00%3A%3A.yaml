simpleMeaning: On a hinge, this switch can rest in one place or the other.
scope: Also called a toggle, an on-off switch and an on/off switch, this has only two places to sit in,
  never a third.
examples:
- They flipped the toggle switch from one side to the other.
- The toggle switch sat in its second place after they moved it.
