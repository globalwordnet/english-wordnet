simpleMeaning: Giving off quick, bright points of light, one after another.
scope: Also called glittering, glinting, sparkly, glittery, scintillating, aglitter, glistering, fulgid
  and scintillant, this one names a way of shining.
examples:
- The coruscant beads on the jacket flashed as the dancer turned.
- The coruscant frost on the grass glittered in the morning sun.
