simpleMeaning: A deadly mushroom, usually white, with a prominent cup-shaped base and white gills. It
  can be mistaken for edible mushrooms of the genus Agaricus.
scope: A common name for deadly mushrooms in the genus Amanita. Gill color alone cannot identify a wild
  mushroom safely.
examples:
- The guide warned that the destroying angel is deadly.
- Gill color alone cannot identify a destroying angel safely.
