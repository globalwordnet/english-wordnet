simpleMeaning: A scanner that detects radiation from a tracer in the body and produces cross-sectional
  images of metabolic activity.
scope: This machine belongs with the machines that make pictures of the inside of the body, showing how
  its inner workings go on.
examples:
- The positron emission tomography scanner showed slices through the body.
- The positron emission tomography scanner showed how the body's inner workings went on.
