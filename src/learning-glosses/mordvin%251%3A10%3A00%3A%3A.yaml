simpleMeaning: A name for the related languages of the Mordvin peoples of Russia, Erzya and Moksha, traditionally
  grouped with the Finnic languages.
scope: Also called Mordva, Mordva language, Mordvin language, Mordvinian and Mordvinian language, this
  is a tongue, not a member of that people.
examples:
- Mordvin is a Finnic tongue spoken by the Mordvinians.
- He learned Mordvin as a child.
