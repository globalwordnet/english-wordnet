simpleMeaning: The way tiny living things are kept from growing and from making more of themselves.
scope: Also called antisepsis, this one is a process, not the state that is the other sense of this word.
examples:
- The nurse followed strict asepsis before the operation.
- Strict asepsis in the operating room kept the wound free of germs.
