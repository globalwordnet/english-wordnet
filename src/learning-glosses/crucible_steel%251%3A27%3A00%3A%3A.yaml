simpleMeaning: Steel made by melting wrought iron, charcoal, and other materials together in a heat-resistant
  pot called a crucible.
scope: This is a metal made in a heat-proof melting pot, not ordinary iron and not a metal made in a large
  furnace.
examples:
- The sword was made of crucible steel.
- Crucible steel was prized for its fine edge.
