senseId: 'coefficient_of_correlation%1:09:00::'
synsetId: 06041776-n
simpleMeaning: A number showing how two variables vary together, from −1 for a perfect negative relationship
  through 0 for no linear correlation to +1 for a perfect positive relationship.
scope: This sense is also called correlation and correlation coefficient, a figure that shows how near
  two changing things move together, running from minus one, full back-link, past nought, no link, to
  plus one, full forward link.
examples:
- Coefficients of correlation run from minus one to plus one.
- The coefficient of correlation shows how near two things move together.
