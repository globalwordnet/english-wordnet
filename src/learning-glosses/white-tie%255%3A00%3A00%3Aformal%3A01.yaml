simpleMeaning: Said of a gathering where men must wear the most formal dress, with a pale band at the
  neck and a long coat.
scope: It is about a dress code.
examples:
- It was a white-tie occasion, and the men wore long coats.
- The invitation said the dinner was white-tie, so a tailcoat had to be rented.
