simpleMeaning: A test that counts each type of white blood cell in one cubic millimetre of blood. It can
  form part of a complete blood count.
scope: This one is about a test.
examples:
- The nurse sent the sample for a differential blood count after the fever would not go down.
- The doctor read the differential blood count before deciding what to do next.
