simpleMeaning: A Muslim festival on 10 Dhu al-Hijjah honoring Abraham’s willingness to sacrifice his son.
  Many Muslims gather for prayer and share meat from a sacrificed animal with people in need.
scope: 'Also called Feast of Sacrifice: the 10th day of Dhu''l-Hijja, a Muslim holy day of mosque services
  and giving meat to charity.'
examples:
- Id al-Adha falls on the 10th day of Dhu'l-Hijja.
- On Id al-Adha, families give meat to charity.
