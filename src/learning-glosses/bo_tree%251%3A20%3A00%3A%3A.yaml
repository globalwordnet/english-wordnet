simpleMeaning: An Indian fig tree known for its great size and long life. Unlike the banyan, it lacks
  supporting roots that grow from branches. Buddhists consider it sacred.
scope: This sense is also called peepul, pipal, pipal tree, pipul, and sacred fig, a fig tree of India
  famed for great size and long life, with no prop roots like the banyan, held holy by Buddhists.
examples:
- Bo trees live long in India.
- The bo tree is held holy by Buddhists.
