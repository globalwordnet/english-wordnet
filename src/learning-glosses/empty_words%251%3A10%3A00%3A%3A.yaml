simpleMeaning: Talk that is loud and all mixed up, and carries no meaning.
scope: This is also called rhetoric, palaver, empty talk, and hot air.
examples:
- The empty words came out loud and muddled, and they meant nothing.
- The empty words were loud and confused, and no one could follow them.
