simpleMeaning: Doubt about whether something is true or real, or whether it is there at all.
scope: This one is also called doubt, question, and dubiousness.
examples:
- There was doubtfulness about the result long after the votes were counted.
- The report was met with doubtfulness from readers who wanted more proof.
