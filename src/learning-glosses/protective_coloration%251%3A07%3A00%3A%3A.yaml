simpleMeaning: Coloring that helps an organism escape predators' notice or makes it less appealing to
  them.
scope: Protective coloration can conceal an organism or discourage a predator from attacking it.
examples:
- The moth's protective coloration made it blend into the tree bark.
- The frog's bright protective coloration warned birds away.
