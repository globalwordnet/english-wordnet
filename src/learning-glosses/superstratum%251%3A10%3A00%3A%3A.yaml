synsetId: 06916748-n
simpleMeaning: The language of invaders who impose it on the people already living in a region, leaving
  traces in the local language.
scope: Also called superstrate, this is the speech of later invaders forced on the people already there,
  not a layer laid over another.
examples:
- New words in the old speech came from the superstratum.
- They could still hear the superstratum in the old words of the place.
