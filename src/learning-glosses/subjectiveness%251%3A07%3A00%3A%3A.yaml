simpleMeaning: Outside facts do not decide it; what a person feels, thinks, and holds to be true does.
scope: This sense is also called subjectivity; it is judging by one's own feelings, not by facts from
  outside.
examples:
- There was much subjectiveness in the scores.
- The subjectiveness of the decision was plain to see.
