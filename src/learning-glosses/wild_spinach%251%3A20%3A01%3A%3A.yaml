simpleMeaning: A common weed from Europe, now found in North America, that people often cook and eat as
  a green vegetable.
scope: This plant is also called pigweed, lamb's-quarters, and in Latin Chenopodium album, and it is not
  the leafy greens gathered as a substitute.
examples:
- They picked wild spinach by the road and cooked it for supper.
- The field behind their house has wild spinach growing along the edge.
