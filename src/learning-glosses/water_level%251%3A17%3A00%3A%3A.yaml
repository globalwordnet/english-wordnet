simpleMeaning: The surface under the ground below which the earth is soaked right through with liquid.
scope: Also called groundwater level and water table. It is found under the ground, not on the surface
  of a lake or a river.
examples:
- After the spring rains, the water level under the field rose close to the surface.
- They dug a well until they reached the water level.
