simpleMeaning: Syphilis, a common sexually transmitted infection caused by Treponema pallidum. Symptoms
  change in stages, and the infection can pass through the placenta to an unborn child.
scope: A common disease spread through sex, also called pox, syphilis, lues venerea, and syph, not a cold
  and not a skin rash alone.
examples:
- Lues is a common disease spread through sex.
- The doctor explained that lues can pass from a mother to her unborn child.
