senseId: 'venous_pressure%1:19:00::'
synsetId: 11451172-n
simpleMeaning: Blood moving round the body pushes against the walls of the blood vessels that carry it
  back toward the heart.
scope: This is the push of the blood inside the blood vessels, not the push in the tubes that carry blood
  out from the heart.
examples:
- The doctor measured the venous pressure in their arm to see how hard the blood pushed against the walls
  of the blood vessels.
- The venous pressure in their arm went up when the band round it was pulled tight.
