simpleMeaning: The increase in air resistance that an aircraft encounters as it approaches the speed of
  sound.
scope: The sound barrier is another name for this growing pull of the air on a plane as it nears the speed
  of sound.
examples:
- The plane hit the sonic barrier as it neared the speed of sound.
- Near the speed of sound, the sonic barrier makes the air pull harder on the plane.
