simpleMeaning: Palladium, a silver-white platinum-group metal resembling platinum. It occurs in some copper
  and nickel ores, resists tarnishing at ordinary temperatures, and is mixed with gold for jewelry.
scope: Also called palladium and Pd; a silver-white metal of the platinum group that keeps its shine at
  normal heat.
examples:
- Atomic number 46 is the place of palladium in the list of elements.
- Palladium has atomic number 46.
