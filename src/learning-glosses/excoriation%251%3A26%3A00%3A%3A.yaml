simpleMeaning: A place on the body where skin has been torn or rubbed away, leaving a raw sore.
scope: This one is also called scratch, scrape, and abrasion.
examples:
- The fall left an excoriation on the child's knee.
- They cleaned the excoriation and covered it with a bandage.
