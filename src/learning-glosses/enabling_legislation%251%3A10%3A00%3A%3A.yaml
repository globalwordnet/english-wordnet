simpleMeaning: A law that gives the right officials power to carry out the law or make people obey it.
scope: This one is about a kind of law.
examples:
- The new enabling legislation gave the city power to close unsafe buildings.
- Under the enabling legislation, health officers could shut down a market that broke the rules.
