simpleMeaning: An opossum of the eastern US that eats plants and animals, plays dead in danger, and is
  valued as food locally. Older classifications grouped it with South America's crab-eating opossum.
scope: Also called common opossum and Didelphis virginiana; an opossum of the eastern United States that
  plays dead when in danger.
examples:
- Didelphis marsupialis plays dead when in danger.
- Didelphis marsupialis is prized as food in some places.
