simpleMeaning: This indicator turns a different colour to show whether a liquid is acid or basic.
scope: This one is for a liquid on its way from sour to basic, not for one that stays as it is.
examples:
- They added a drop of acid-base indicator to the liquid and watched it turn pink.
- The acid-base indicator stayed blue in the basic solution.
