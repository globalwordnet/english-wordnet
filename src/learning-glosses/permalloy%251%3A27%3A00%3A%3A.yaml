simpleMeaning: A metal made of 80 percent nickel and 20 percent iron. It can easily be made magnetic and
  can easily lose its magnetism again.
scope: This is a mix of four parts nickel to one part iron that takes up a magnet's pull easily, not steel
  and not plain nickel or iron.
examples:
- Permalloy cores are used in transformers.
- The Permalloy shield blocked the field.
