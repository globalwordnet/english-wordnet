simpleMeaning: The computers and phone lines of a business or institution stay in working order because
  this person looks after them.
scope: This is the person who runs the computers and phone lines of a business or institution.
examples:
- When the office network went down, the system administrator got it working again.
- Ask the system administrator if your password stops working.
