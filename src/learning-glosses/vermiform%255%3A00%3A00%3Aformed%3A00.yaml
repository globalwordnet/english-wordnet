simpleMeaning: Long and thin, this thing is round like a tube and looks like a worm.
scope: Also called worm-shaped, this word is used of a thing resembling a worm, not of one short and flat.
examples:
- The vermiform creature moved slowly through the damp soil.
- They found a vermiform growth on the tree, long, thin, and round.
