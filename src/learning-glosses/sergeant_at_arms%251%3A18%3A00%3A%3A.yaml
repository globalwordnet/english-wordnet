senseId: 'sergeant_at_arms%1:18:00::'
synsetId: 10600546-n
simpleMeaning: In a law-making body or a court, the person who keeps order and sees that its commands
  are carried out.
scope: Also called serjeant-at-arms, the post belongs to the person who keeps order in a law-making body
  or a court and sees its commands carried out.
examples:
- The sergeant at arms called the hall to order.
- The sergeant at arms carried out the judge's order.
