senseId: 'ergotrate_maleate%1:27:00::'
synsetId: 14737909-n
simpleMeaning: A brand of ergonovine, an alkaloid from ergot that is less toxic than ergot itself. It
  stimulates uterine contractions and is given after childbirth or abortion.
scope: 'Also called ergonovine: a drug from ergot that makes the womb squeeze, not a painkiller and not
  a drug that starts labour.'
examples:
- The nurse gave Ergotrate Maleate after the birth.
- Ergotrate Maleate helps the womb squeeze after delivery.
