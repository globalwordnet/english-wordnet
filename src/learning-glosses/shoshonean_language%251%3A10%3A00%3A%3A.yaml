simpleMeaning: A proposed grouping of Uto-Aztecan languages spoken mainly in the southwestern United States.
  Linguists differ on whether these languages form a single branch.
scope: Also called Shoshonean, Shoshonian, or Shoshonian language, it is a non-standard subfamily of Uto-Aztecan
  languages spoken mainly in the south-western United States.
examples:
- Shoshonean language is a group of languages within the Uto-Aztecan family.
- People speak the Shoshonean language in the south-west of the United States.
