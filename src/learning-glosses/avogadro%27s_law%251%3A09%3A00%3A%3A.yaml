simpleMeaning: The rule that equal volumes of different gases contain equal numbers of molecules when
  their temperature and pressure are the same.
scope: 'Also called Avogadro''s hypothesis: the rule that equal amounts of space hold equal numbers of
  tiny gas parts at the same heat and push, for every gas.'
examples:
- Avogadro's law tells us that equal volumes of gas hold equal numbers of molecules.
- By Avogadro's law, a litre of oxygen and a litre of nitrogen hold the same number of molecules at the
  same heat and push.
