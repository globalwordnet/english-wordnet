simpleMeaning: Someone who loses again and again, over a long time.
scope: Also called failure, loser, and nonstarter. It is a word for someone, not for a thing.
examples:
- The unsuccessful person kept applying for jobs, but no one would hire them.
- Everyone knew the unsuccessful person would lose the race too.
