simpleMeaning: Fish are cut open and have the spine taken out by this worker.
scope: This sense is a worker who prepares fish, not a person who sorts living things into groups and
  not a worker who cuts logs for fences.
examples:
- The splitter cut the fish open.
- The splitter took the spine out of the fish.
