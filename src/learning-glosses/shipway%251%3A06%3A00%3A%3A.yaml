simpleMeaning: From the yard where vessels are made or mended, this slope runs down to the water.
scope: Also called ways and slipway, this is a slope from the yard where vessels are made or mended down
  to the water, not a canal for seagoing vessels.
examples:
- The vessel slid down the shipway into the water.
- The shipway ran from the yard down to the water.
