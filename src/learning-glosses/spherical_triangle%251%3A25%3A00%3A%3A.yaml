simpleMeaning: A triangle on the surface of a sphere whose three sides are arcs of great circles.
scope: This shape has three sides, made by the curved lines of three great rings on a ball.
examples:
- The spherical triangle joined three points on the globe.
- They marked a spherical triangle on the globe.
