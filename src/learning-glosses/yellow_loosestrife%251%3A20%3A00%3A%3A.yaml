simpleMeaning: A loosestrife of Europe and Asia that people often take for a plant they do not want.
scope: Also called garden loosestrife and Lysimachia vulgaris, this one is often, not always, taken for
  a weed.
examples:
- They found yellow loosestrife growing along the stream in Europe.
- The yellow loosestrife in the garden was often pulled out as a weed.
