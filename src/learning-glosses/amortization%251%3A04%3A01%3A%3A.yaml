simpleMeaning: Spreading what a thing cost over years, so its worth falls little by little.
scope: Also called amortisation, this one spreads the cost of a thing over years, while the other sense
  of this word is about paying off what is owed.
examples:
- The amortization of the van cut its book value every year.
- Each year the amortization lowered the value of the truck a little more.
