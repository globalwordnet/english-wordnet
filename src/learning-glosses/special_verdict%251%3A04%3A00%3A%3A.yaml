simpleMeaning: The court puts set questions of fact, and the answer comes back without naming a winner.
scope: It settles the facts the court puts to it, and names no winner.
examples:
- The jury gave a special verdict on the facts the judge had set out.
- The court asked for a special verdict on the set questions of fact.
