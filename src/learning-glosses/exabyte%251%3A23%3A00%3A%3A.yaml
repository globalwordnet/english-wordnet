senseId: 'exabyte%1:23:00::'
synsetId: 13652325-n
simpleMeaning: A unit of data equal to 1,024 pebibytes, or 2 to the power of 60 bytes.
scope: This one is also called exbibyte, EB or EiB, and it is not the kind that counts a thousand of the
  next measure down.
examples:
- The data centre stores more than an exabyte of records.
- An exabyte of video would take years to watch.
