simpleMeaning: Said of a thing that has been repeated so often that it sounds stale and no longer new.
scope: Also called tired, stock, threadbare, commonplace, banal, trite, timeworn, hackneyed, old-hat,
  or shopworn. It is a quality.
examples:
- The well-worn joke got no laugh at all.
- They avoided the well-worn phrase and found a fresh one.
