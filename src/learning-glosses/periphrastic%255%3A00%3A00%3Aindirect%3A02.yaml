senseId: periphrastic%5:00:00:indirect:02
synsetId: 00771186-s
simpleMeaning: Said in a roundabout way, using more words than needed.
scope: Also called ambagious, circumlocutious, and circumlocutory. It is a kind of wording.
examples:
- The periphrastic answer took five minutes to say something simple.
- A periphrastic letter can hide the point in too many words.
