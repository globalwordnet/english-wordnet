senseId: 'baby_tooth%1:08:00::'
synsetId: 05314393-n
simpleMeaning: One tooth from the first set a young mammal grows, one of 20 in children, that does not
  last.
scope: Also called a deciduous tooth, a milk tooth, or a primary tooth, this one is not one of those that
  stay for life.
examples:
- The baby tooth came loose while they were eating an apple.
- The dentist checked the baby tooth and said it would fall out soon.
