senseId: 'hour_angle%1:15:00::'
synsetId: 08604064-n
simpleMeaning: The angle measured along the celestial equator from the observer's north-south line in
  the sky to the circle through a celestial body and both sky poles.
scope: It is counted from the line straight above you, not westward from the top of the sky as the other
  hour angle is.
examples:
- The hour angle of the star was nearly 30 degrees.
- We worked out the hour angle to find where the star would be.
