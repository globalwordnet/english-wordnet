simpleMeaning: An active form of vitamin B1 that helps enzymes release energy from food, including during
  the Krebs cycle in cells.
scope: This is also called cocarboxylase.
examples:
- Cells use thiamine pyrophosphate to free power from food.
- The body needs thiamine pyrophosphate for the round of changes that frees power from food.
