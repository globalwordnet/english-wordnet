simpleMeaning: Built chiefly on guesswork, with too little proof behind it.
scope: It is also called supposed, hypothetical, conjectural, divinatory, suppositional, suppositious
  and supposititious.
examples:
- That hypothetic plan rested on guesswork, not on facts.
- The hypothetic cause was never proved.
