simpleMeaning: Radar sends very short radio signals through a hollow tube of metal that keeps them on
  a set course.
scope: This metal path for signals is also called a waveguide, and it is hollow, not solid.
examples:
- The radar's wave guide carried the signals from the set to the antenna.
- The new radar sends its signals through a wave guide.
