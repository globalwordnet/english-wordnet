simpleMeaning: A slang term for two people having sex.
scope: Also called fuck, fucking, ass, screw, screwing, shag, nookie, nooky, piece of ass, roll in the
  hay, and shtup. It is a slang word, not something cut from an animal.
examples:
- They went out looking for a piece of tail on Saturday night.
- The joke in the film was all about finding a piece of tail.
