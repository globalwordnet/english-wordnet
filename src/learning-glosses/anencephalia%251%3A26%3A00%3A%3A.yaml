simpleMeaning: A fault in the way the brain grows, leaving its two halves small or gone.
scope: Also called anencephaly, this is a brain condition, not a condition of another part of the body.
examples:
- Doctors found anencephalia on the scan, with part of the brain missing.
- The baby's anencephalia meant its brain had not grown as it should.
