simpleMeaning: A low-fat cut of beef from the animal's leg, lying between the hindquarters and the lower
  leg.
scope: This is the cut from between the hindquarters and the lower leg, set apart from fattier cuts of
  beef by how little fat it has.
examples:
- A round steak lay on the tray.
- The round steak was lean, with little fat in it.
