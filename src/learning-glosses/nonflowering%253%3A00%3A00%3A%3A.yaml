simpleMeaning: Describing a plant that produces no flowers, such as a moss, which reproduces by spores.
scope: Nonflowering plants include seedless plants and seed-bearing plants such as conifers.
examples:
- Mosses are nonflowering and grow from spores, not seeds.
- Pines are nonflowering trees that produce seeds in cones.
