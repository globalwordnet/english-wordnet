simpleMeaning: A member of a mostly Muslim people of Kurdistan with a herding tradition, often described
  as the largest ethnic group without a state of its own.
scope: 'It names a people, not a place or a state: the largest group of people with no state of their
  own, mostly herders and followers of Islam in the land of their name.'
examples:
- Kurds form the largest people with no state of their own.
- A Kurd told us of life in his homeland.
