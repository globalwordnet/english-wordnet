simpleMeaning: A stocky burrowing rodent with coarse fur and a short bushy tail, found across the Northern
  Hemisphere. It hibernates in winter.
scope: Used for a thick-set animal seen on a rock, sleeping in its burrow all winter.
examples:
- A marmot stood on the rock, watching the valley.
- Marmots sleep in their burrows all winter.
