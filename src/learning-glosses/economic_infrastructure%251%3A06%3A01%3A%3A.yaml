simpleMeaning: The facilities and systems a place needs for its economy to function, such as roads, water
  supplies, and power networks.
scope: These are the set-ups a place needs for its trade to work, not one single road or the money system
  itself.
examples:
- The country is building new economic infrastructure.
- Good economic infrastructure helps trade grow.
