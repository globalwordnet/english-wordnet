simpleMeaning: A machine that makes pictures of slices through the body by detecting signals from a radioactive
  tracer, showing how organs and tissues are working.
scope: In a combined PET/CT scanner, the CT part takes the X-ray pictures.
examples:
- The PET scanner showed where the drug had gone in his body.
- She lay still while the PET scanner made its pictures.
