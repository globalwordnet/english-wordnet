simpleMeaning: Relating to a small, flowing style of handwriting that developed from uncial, a script
  with large rounded letters, between the seventh and ninth centuries.
scope: Also called minuscule, this small joined-up handwriting of the 7th to the 9th centuries grew out
  of uncial, an old style of large round letters.
examples:
- The minuscular script is hard to read at first.
- She copied the minuscular letters with care.
