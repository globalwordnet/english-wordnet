simpleMeaning: The clear jelly that fills the eye, or anything to do with it.
scope: This word is about the eye, not about glass itself and not about the shiny coating baked onto pots.
examples:
- The doctor checked the vitreous chamber to see if the jelly inside the eye was clear.
- After the operation, the vitreous humor in their eye slowly settled back into place.
