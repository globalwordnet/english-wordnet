simpleMeaning: A small round mark set just to the left of the figures that show the part of a number less
  than one.
scope: Also called point or percentage point, this one is about a mark.
examples:
- Put a decimal point between the 3 and the 5 to write three and five tenths.
- The price was written as 4.99, with a decimal point before the 99.
