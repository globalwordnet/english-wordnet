simpleMeaning: A burst of flame and gas that shoots out behind a weapon with no kick when it fires.
scope: Also called backblast, this one is not about what comes out in front of the weapon.
examples:
- The back-blast scorched the grass behind the gun.
- They stood clear of the back-blast before firing.
