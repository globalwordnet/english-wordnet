simpleMeaning: This snake has poison in its bite and lives in swamps in the south of the United States,
  spending part of its time on dry land.
scope: Also called a cottonmouth, a cottonmouth moccasin, or Agkistrodon piscivorus, this is the poisonous
  snake of southern swamps, not just any snake that lives in rivers and lakes.
examples:
- They saw a water moccasin slide into the swamp.
- A water moccasin bit the dog, and they rushed it to the vet.
