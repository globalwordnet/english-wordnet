simpleMeaning: A nurse who stands by a surgeon and does the work that gets an operation ready to start.
scope: This is a person whose work is to help a surgeon get ready for an operation.
examples:
- Before the operation, the scrub nurse set out the clean tools.
- The scrub nurse checked that everything was ready for the surgeon.
