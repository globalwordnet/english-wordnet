simpleMeaning: A holiday observed in parts of the southern United States honoring Confederate general
  Robert E. Lee, who was born on January 19.
scope: A holiday marking the birth date of Confederate General Robert E Lee, kept each year on January
  19 in the southern United States, not a national holiday or a battle anniversary, also called January
  19, Lee's Birthday and Robert E Lee's Birthday.
examples:
- Robert E Lee Day is marked on January 19 in the South.
- The town held a parade on Robert E Lee Day.
