simpleMeaning: A ripple in space and time that carries changes in gravity at the speed of light.
scope: In physics, a movement thought to carry the pull that draws things together; gravitational wave
  is another name for it, not a sea wave and not a sound wave.
examples:
- Scientists found signs of a gravity wave from two stars.
- A gravity wave moves as fast as light.
