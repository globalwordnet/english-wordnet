simpleMeaning: A band of thin material fixed along the edge where a door or a window closes, to shut out
  the cold.
scope: Also called weather strip, weather stripping and weatherstripping. It is a band of material, not
  the door or window it is fixed to.
examples:
- They fixed weatherstrip along the bottom of the door.
- The weatherstrip on the window was worn and thin.
