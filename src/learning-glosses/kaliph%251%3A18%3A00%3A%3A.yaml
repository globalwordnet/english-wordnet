simpleMeaning: The ruler who governs a Muslim state and leads its worship, thought to speak for Allah
  on earth.
scope: The word is also spelled caliph, calif, kalif, khalif, or khalifah.
examples:
- The kaliph met the council of ministers each morning.
- Crowds cheered when the kaliph rode through the city gates.
