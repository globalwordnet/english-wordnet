simpleMeaning: A person who argues that historic places, wild land, and living things at risk should be
  kept safe and left as they are.
scope: It is a person, not the place or living thing being kept safe.
examples:
- The preservationist fought to save the old forest from being cut down.
- As a preservationist, they work to protect historic buildings.
