simpleMeaning: Said of something that is like a colloid, a mix in which tiny bits stay spread through
  a liquid instead of dissolving in it.
scope: This one is about a kind of mix.
examples:
- The colloidal gold stayed spread through the water instead of settling at the bottom.
- The milk stayed smooth because its fat was in a colloidal form.
