senseId: 'hypervitaminosis%1:26:00::'
synsetId: 14222311-n
simpleMeaning: Illness caused by taking in excessive amounts of vitamins. Too much vitamin A or D, or
  certain forms of vitamin K, can cause serious harm.
scope: Too much of certain nutrients, taken in, puts the body in a wrong state, and that state is what
  this name fits.
examples:
- Hypervitaminosis followed taking in too many vitamins.
- Hypervitaminosis can be grave when the vitamins are A, D, or K.
