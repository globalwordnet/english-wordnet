synsetId: 05099498-n
simpleMeaning: The likelihood that a thing happens, on the supposition that one or more other events have
  taken place.
scope: This one is also called conditional probability.
examples:
- The contingent probability of rain goes up once the clouds have gathered.
- The team worked out the contingent probability that the train would be late, given that it had already
  left the station late.
