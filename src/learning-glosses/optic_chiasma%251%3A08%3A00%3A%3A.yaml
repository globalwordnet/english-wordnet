simpleMeaning: The place low in the brain where the nerves of the two eyes cross over each other.
scope: Also called optic chiasm or chiasma opticum. It is a noun.
examples:
- The doctor traced the optic chiasma on the brain scan.
- A tumor pressing on the optic chiasma can dim sight in both eyes.
