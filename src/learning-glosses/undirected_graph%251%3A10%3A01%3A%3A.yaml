simpleMeaning: In mathematics, the lines in this graph join points but point neither way.
scope: In mathematics, this name is for a set of points joined by lines, unlike one whose lines point
  one way.
examples:
- A tree is an undirected graph in which any two points are joined by just one path.
- In the undirected graph, every line joined two points without showing a direction.
