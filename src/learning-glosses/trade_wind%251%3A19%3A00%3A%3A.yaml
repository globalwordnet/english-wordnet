simpleMeaning: One of the steady winds that blow generally from east to west on either side of the equator.
scope: Also called trade, this is the steady flow of air from east to west on both sides of the equator,
  not air that shifts with the seasons.
examples:
- The ship caught the trade winds and sailed west.
- They counted on the trade winds to carry them west across the ocean.
