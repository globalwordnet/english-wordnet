simpleMeaning: A set of written orders for a computer that looks for harmful bits of code in it and stops
  them from spreading.
scope: This set of written orders guards a computer against harmful bits of code, and it is not one of
  those harmful bits itself.
examples:
- The office installed a new anti-virus program on every machine.
- The anti-virus program found two harmful files and stopped them spreading.
