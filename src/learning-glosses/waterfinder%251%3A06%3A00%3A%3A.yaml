simpleMeaning: A forked stick believed by some to dip when held over underground water or oil.
scope: A divining rod, a dowser, a dowsing rod and a water finder are other names for this one, which
  does not bring up what lies under the ground.
examples:
- They watched the waterfinder dip down over the spot where the well would go.
- The waterfinder in the shed had a forked end and was used to find the clear liquid under the ground.
