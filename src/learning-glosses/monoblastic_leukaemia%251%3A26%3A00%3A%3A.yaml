senseId: 'monoblastic_leukaemia%1:26:00::'
synsetId: 14268208-n
simpleMeaning: A blood cancer in which monocytes, a type of white blood cell, and their immature forms,
  called monoblasts, multiply in the blood.
scope: A sickness of the blood in which one kind of white blood cell and its young form grow in number;
  histiocytic leukaemia, histiocytic leukemia, monoblastic leukemia, monocytic leukaemia and monocytic
  leukemia are other names for this, not a blood sickness with too few white cells.
examples:
- The blood test showed monoblastic leukaemia.
- Monoblastic leukaemia fills the blood with young white cells.
