senseId: 'fenestra_ovalis%1:08:00::'
synsetId: 05333154-n
simpleMeaning: Shaped like an egg, this opening in the inner ear has the base of the stapes, a tiny bone,
  fixed to it.
scope: This one is also called fenestra of the vestibule, fenestra vestibuli, and oval window.
examples:
- The surgeon peered through the fenestra ovalis to reach the inner ear.
- Fluid leaked from the fenestra ovalis after the injury.
