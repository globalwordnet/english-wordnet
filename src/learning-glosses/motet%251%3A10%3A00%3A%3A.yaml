simpleMeaning: Sacred music written for a choir to sing without instruments during a church service. This
  form dates from the 1200s.
scope: A piece of music for voices alone with holy words, meant to be sung in church, that first appeared
  in the 1200s.
examples:
- The choir sang a motet during the service.
- The motet was sung by voices alone.
