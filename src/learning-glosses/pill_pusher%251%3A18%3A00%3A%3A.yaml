simpleMeaning: An informal term for a pharmacist, a healthcare professional trained to prepare and dispense
  medicines.
scope: Also called pharmacist, chemist, apothecary, druggist, and pill roller. It names a trained health
  worker, not a person who takes the drugs.
examples:
- The pill pusher made up the medicine for the sick child.
- Ask the pill pusher for the right dose.
