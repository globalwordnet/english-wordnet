senseId: 'sleek_over%2:39:00::'
synsetId: 02152539-v
simpleMeaning: To make sure no one else hears about a minor bad deed, a slip, or a mistake.
scope: Also called whitewash, gloss over, and hush up. It is a verb.
examples:
- The manager tried to sleek over the error before the meeting, but someone had already seen the report.
- They sleeked over the whole affair and hoped no one would ask questions.
