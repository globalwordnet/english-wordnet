senseId: 'reaction_formation%1:22:00::'
synsetId: 13567619-n
simpleMeaning: A psychological defense in which someone unconsciously hides urges they find unacceptable
  by developing attitudes or behavior opposite to those urges.
scope: In psychiatry, for hidden urges covered up by views and deeds that run counter to them.
examples:
- Reaction formation hides buried urges.
- Reaction formation grows views that run counter to buried urges.
