senseId: 'syllabize%2:32:00::'
synsetId: 00982020-v
simpleMeaning: A speaker gives each small sound part of a word its own clear sound, saying the word part
  by part.
scope: This names the act of sounding out words part by part, also called syllabise, not the act of cutting
  words up into their sound parts.
examples:
- The reader would syllabize the verses when reading them aloud.
- The tutor asked the learners to syllabize the words one by one.
