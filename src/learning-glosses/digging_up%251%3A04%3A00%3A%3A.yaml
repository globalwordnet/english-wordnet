simpleMeaning: The act of digging something buried out of the ground, especially a dead body.
scope: Also called disinterment and exhumation, this is not about putting a thing into the ground to bury
  it.
examples:
- The digging up of the grave shocked the village.
- Workers found old coins during the digging up of the garden.
