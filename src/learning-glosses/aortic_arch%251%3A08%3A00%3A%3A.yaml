senseId: 'aortic_arch%1:08:00::'
synsetId: 05343925-n
simpleMeaning: The part of the body's main blood vessel, which carries blood out from the heart, where
  it bends over and heads down.
scope: This one is not about the lower part of the main blood vessel that runs straight down.
examples:
- The scan showed the aortic arch curving over the top of the heart.
- Blood leaves the heart and passes through the aortic arch on its way down.
