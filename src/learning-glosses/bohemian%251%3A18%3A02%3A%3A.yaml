simpleMeaning: An outdated term for a Romani person. The Romani people trace their origins to northern
  India and now live worldwide, especially in Europe, North Africa, and North America.
scope: Not a native of Bohemia; also called Gypsy, Gipsy, Roma, Romani, Romany and Rommany.
