simpleMeaning: An informal British name for the pound, the main unit of money in the United Kingdom, worth
  100 pence.
scope: The main unit of British money; pound, British pound, British pound sterling and pound sterling
  are other names for this sense; not a chewable wad of tobacco.
examples:
- That book costs ten quid.
- He paid five quid for the ticket.
