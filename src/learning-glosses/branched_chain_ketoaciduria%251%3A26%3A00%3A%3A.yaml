simpleMeaning: An inherited metabolic disorder that makes urine smell like maple syrup. Without treatment
  it can cause intellectual disability and death in early childhood.
scope: This sense is also called maple syrup urine disease.
examples:
- Branched chain ketoaciduria makes the urine smell of maple syrup.
- The child had branched chain ketoaciduria.
