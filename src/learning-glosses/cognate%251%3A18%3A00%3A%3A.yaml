simpleMeaning: A person joined to another by blood or by birth, above all by a shared ancestor.
scope: This one is also called sib, blood relation, and blood relative.
examples:
- They found a cognate in the next village who shared their grandfather.
- The two families knew they were cognate through a common ancestor.
