senseId: apothegmatic%5:00:00:concise:00
synsetId: 00549171-s
simpleMeaning: Said of a remark that is short and clever, like a maxim.
scope: Also called aphoristic and epigrammatic, this one is about a saying that is itself short and clever,
  not about a person given to such sayings, which is the other sense of this word.
examples:
- The apothegmatic line at the end of the speech drew a laugh and a nod.
- They quoted an apothegmatic remark that summed up the whole debate in a few words.
