simpleMeaning: A flat board on a table, joined by a hinge, that can be lifted up and held by a small support.
scope: This one is about a part of a table.
examples:
- Someone lifted the drop-leaf of the table so that six people could sit down to eat.
- When the guests left, the drop-leaf was lowered and the table was pushed against the wall.
