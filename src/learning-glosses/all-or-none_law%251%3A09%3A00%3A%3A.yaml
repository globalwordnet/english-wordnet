simpleMeaning: Once a stimulus is strong enough to trigger a nerve impulse, the impulse has the same strength
  however much stronger the stimulus becomes.
scope: 'Of nerve sparks: a weak push gives as strong a spark as a strong push.'
examples:
- An all-or-none law ruled the nerve.
- All-or-none laws govern sparks.
