simpleMeaning: An organism that lives in or on another organism and obtains food from it at the host’s
  expense, usually while the host remains alive.
scope: Here parasite names an organism in a biological relationship with its host.
examples:
- The parasite lives in the fish and feeds on its blood.
- Ticks are parasites that live on the skin of animals.
