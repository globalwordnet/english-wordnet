simpleMeaning: A golf club of the type called a wood, with a metal head in place of the traditional wooden
  one.
scope: A golf club with a hard head, not one with a head cut from a tree and not a long-handled iron.
examples:
- He swung a metal wood off the tee.
- A metal wood hits the ball farther than an old wooden club.
