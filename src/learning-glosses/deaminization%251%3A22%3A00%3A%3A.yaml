simpleMeaning: The removal of an amino group from an amino acid or another compound that contains one.
scope: Deamination is another name for this taking of the NH2 part off a protein building block or another
  chemical with the same part.
examples:
- Deaminization takes the NH2 part off an amino acid.
- In deaminization, the NH2 part comes off a chemical with the same part.
