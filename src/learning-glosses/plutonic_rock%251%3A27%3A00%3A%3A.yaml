simpleMeaning: A large body of stone formed from melted matter that is thought to have hardened deep below
  the ground.
scope: Also called a batholite, a batholith, or a pluton. It is one kind of stone.
examples:
- Geologists found plutonic rock deep under the mountain, where it had cooled and hardened.
- The builders cut through plutonic rock when they dug the tunnel.
