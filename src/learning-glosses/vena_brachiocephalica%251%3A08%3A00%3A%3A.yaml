senseId: 'vena_brachiocephalica%1:08:00::'
synsetId: 05367064-n
simpleMeaning: 'Two blood vessels that carry blood back toward the heart meet and join into one: the vessel
  from the neck and the vessel from under the collar bone.'
scope: These blood vessels are also called the brachiocephalic vein or the innominate vein, not ones that
  run on their own without joining.
examples:
- The surgeon traced the vena brachiocephalica to the point where the neck vessel and the vessel under
  the collar bone meet.
- They found the vena brachiocephalica where the vessel from the neck joins the vessel under the collar
  bone.
