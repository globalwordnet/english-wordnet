simpleMeaning: A record made when a money period ends, showing the full amount a firm made or gave up,
  with costs still in or already taken out.
scope: Also called profit and loss account. It is a record.
examples:
- The profit and loss showed a good year for the firm.
- They read the profit and loss before the meeting.
