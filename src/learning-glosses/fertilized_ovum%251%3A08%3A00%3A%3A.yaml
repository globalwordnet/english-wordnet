senseId: 'fertilized_ovum%1:08:00::'
synsetId: 05439502-n
simpleMeaning: The cell formed when a sperm and egg join, combining one set of chromosomes from each parent.
  It can also refer to the organism developing from that cell.
scope: This cell is also called a zygote, and it differs from an unjoined egg cell by holding two sets.
examples:
- A fertilized ovum holds two sets, one from each parent cell.
- The fertilized ovum grew into a living thing.
