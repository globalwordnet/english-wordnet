simpleMeaning: A person or animal that eats fungi, above all mushrooms.
scope: It is also called a mycophagist.
examples:
- The squirrel is a mycophage and eats the mushrooms it finds on the forest floor.
- Many beetles are mycophages that feed on fungi in rotting wood.
