simpleMeaning: Material made for people to watch, read, or listen to, spread over many different platforms
  and channels, all made to feel like one world that pulls the audience in.
scope: This is about the same material turning up on many platforms at once, not a single film or book
  on its own.
examples:
- The transmedium story of the hero runs through films, books, and games.
- They built the transmedium world so fans could follow it on television and in books.
