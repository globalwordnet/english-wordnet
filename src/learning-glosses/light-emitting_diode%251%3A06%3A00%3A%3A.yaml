simpleMeaning: A diode that emits light where two semiconductor regions meet. Its brightness is proportional
  to the current, and its color depends on the material.
scope: This is the circuit part that gives out rays where two kinds of matter meet, the hue of the rays
  resting on the matter used.
examples:
- The light-emitting diode gives out rays where two kinds of matter meet.
- The hue of its rays rests on the matter used in the light-emitting diode.
