simpleMeaning: Through software on this computer, people post messages and find out things of general
  interest.
scope: BBS, bulletin board, and electronic bulletin board are other names for this thing, not the other
  sense of the same word, which names a panel for notices hung on a wall.
examples:
- They logged into the bulletin board system.
- The bulletin board system stores old messages.
