simpleMeaning: A member of the Indigenous Maya people of Yucatán, Belize, and Guatemala, known especially
  for architecture, pottery, and astronomy during their Classic period, around AD 300–900.
scope: Here Mayan refers to an individual member of the Maya people.
examples:
- The guide described the ancient potter as a Mayan from Yucatan.
- She is a Mayan whose family has lived in Belize for generations.
