simpleMeaning: A large baleen whale of cold waters, including the Arctic. Its name is traditionally linked
  to hunters who valued its oil and baleen.
scope: This is the big whale of the far north, said to be the one hunters sought for the worth of its
  bone and oil.
examples:
- The right whale was once hunted for the whalebone in its mouth.
- Right whales were the ones hunters sought for their bone and oil.
