simpleMeaning: To take the body from a thing, so that it cannot be touched.
scope: Also called immaterialise, immaterialize, and unsubstantialise. It is an action, not a state.
examples:
- The writer would unsubstantialize the hero until only a voice remained.
- The dream seemed to unsubstantialize the house, and its walls turned to mist.
