simpleMeaning: A hormone from the hypothalamus, at the base of the brain, that prompts the front part
  of the pituitary gland to release thyroid-stimulating hormone.
scope: This is a body chemical from a part of the brain that makes the front of a gland under the brain
  give out the chemical that starts the thyroid gland, also called protirelin, thyrotropin-releasing factor,
  thyrotropin-releasing hormone or TRF; other body chemicals from the brain act on different glands.
examples:
- TRH tells the front of the pituitary gland to give out the chemical that starts the thyroid gland.
- Without TRH, the pituitary gland would not give out its thyroid-starting chemical.
