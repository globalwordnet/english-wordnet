simpleMeaning: One or more computers, with the programs that go with them, sharing one store of information,
  make up this system.
scope: Also called computer system, computing system, ADP system, and ADPS, this one is a set of computers
  that share one store of information.
examples:
- The automatic data processing system stored all the office records in one place.
- They moved the files onto the new automatic data processing system.
