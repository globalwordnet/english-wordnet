simpleMeaning: Sodium, a soft, waxy, silvery alkali metal abundant in natural compounds. It burns yellow
  and reacts violently with water. Its salts occur in seawater and halite.
scope: 'Also called Na and sodium: a soft, shiny metal of the alkali group, not a hard grey metal and
  not a gas.'
examples:
- Sodium has atomic number 11.
- The metal with atomic number 11 burns with a yellow flame.
