simpleMeaning: A firm takes money from its gains and holds it back to meet changes in the worth of the
  things it owns.
scope: Also called allowance, an allowance account, and a valuation reserve, this is money a firm keeps
  for later, not money it pays out.
examples:
- The firm set up a valuation account to cover changes in the worth of its land.
- They moved part of the year's gains into a valuation account.
