simpleMeaning: A lamp that emits ultraviolet radiation, which has wavelengths just beyond the violet end
  of visible light.
scope: Also called ultraviolet source, this light sends out rays the eye cannot see, not rays the eye
  can see.
examples:
- They turned on the ultraviolet lamp above the table.
- They kept an ultraviolet lamp on the desk for their work.
