simpleMeaning: A heavy, silvery, toxic element that forms compounds in the +1 and +2 oxidation states.
  It is the only metal liquid at ordinary room temperature.
scope: 'Also called quicksilver, atomic number 80, Hg, and hydrargyrum: a heavy silvery poisonous metal,
  liquid at everyday temperatures, not silver and not lead.'
examples:
- Mercury is the only metal that is liquid at room temperature.
- Old thermometers held mercury in a glass tube.
