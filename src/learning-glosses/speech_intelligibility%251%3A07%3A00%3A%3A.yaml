simpleMeaning: How well spoken words can be made out when noise or a fault in the sound gets in the way,
  most often tested in such bad conditions.
scope: This rates how clearly spoken words come through when noise or a fault in the sound gets in the
  way.
examples:
- Noise in the room lowered speech intelligibility.
- A fault in the sound can spoil speech intelligibility.
