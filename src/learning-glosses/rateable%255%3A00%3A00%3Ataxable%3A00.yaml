simpleMeaning: Liable for the tax a place puts on buildings and land, set by the place itself.
scope: Also called ratable, this word is used for buildings and land that owe the tax a place puts on
  property.
examples:
- The rateable value of the shop was set by the town.
- That field is rateable land, so the tax falls on it.
