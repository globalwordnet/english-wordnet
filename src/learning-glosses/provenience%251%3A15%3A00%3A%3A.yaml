simpleMeaning: The place where something first came into being, or where it was looked after while still
  young.
scope: Also called birthplace, provenance, place of origin, or cradle. It is a place.
examples:
- The provenience of the old map was a small town in the north.
- They traced the provenience of the painting to a workshop in Florence.
