simpleMeaning: With male and female parts for making new plants mixed together in one group on the plant.
scope: This word marks a plant with both kinds of parts for making new plants mixed in a single group,
  also called synoicous.
examples:
- The plant was synoecious, with the two kinds of parts jumbled together in one cluster.
- The gardener found the plant synoecious, with male and female parts sharing one group.
