simpleMeaning: An inherited disease caused by changes in one gene. Thick mucus affects the lungs, intestines
  and pancreas. Treatments help manage it, but there is currently no cure.
scope: An older name for cystic fibrosis. In other contexts, pancreatic fibrosis can simply mean scarring
  of the pancreas.
examples:
- An old textbook listed pancreatic fibrosis as a name for cystic fibrosis.
- The glossary linked pancreatic fibrosis, in this older sense, to changes in the CFTR gene.
