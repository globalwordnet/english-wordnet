simpleMeaning: Describing or relating to words that sound the same and have the same spelling but differ
  in meaning.
scope: 'Also called homonymic: having to do with words that sound or look the same but mean different
  things, not having to do with words that rhyme.'
examples:
- The homonymous pair 'to' and 'two' confused him.
- She studied homonymous words in class.
