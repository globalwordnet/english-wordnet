simpleMeaning: Telling buyers about goods and winning orders by talking with them over a wire, with each
  side able to answer the other at once.
scope: This is also called telecommerce or telemarketing.
examples:
- The firm used teleselling to win new orders from buyers far away.
- A seller using teleselling can talk with a buyer and answer questions at once.
