simpleMeaning: In bankruptcy, the duty of the person appointed to run a bankrupt's affairs to act for
  the good of those owed money
scope: It is the duty of the person put in charge, in bankruptcy, to act for the good of those owed money.
examples:
- The receiver-creditor relation set out what the trustee had to do for the people owed money.
- When the business failed, the receiver-creditor relation meant the trustee had to act for the good of
  those owed money.
