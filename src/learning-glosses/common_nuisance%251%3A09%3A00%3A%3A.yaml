senseId: 'common_nuisance%1:09:00::'
synsetId: 05839890-n
simpleMeaning: An annoyance that hinders a right everyone shares, without good reason.
scope: Public nuisance is another name for this thing, and it is not about a right that belongs to one
  person alone.
examples:
- The factory's smoke was ruled a common nuisance because it spoiled the air everyone breathes.
- Residents complained that the open sewer was a common nuisance, spoiling the water they all used.
