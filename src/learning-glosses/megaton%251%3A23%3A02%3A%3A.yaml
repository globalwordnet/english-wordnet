senseId: 'megaton%1:23:02::'
synsetId: 13668971-n
simpleMeaning: A unit of explosive energy, especially for nuclear weapons, equal to the energy released
  by one million tons of TNT.
scope: The blast of an atom bomb is counted in these units, not the weight of the bomb.
examples:
- The blast was counted as two megatons.
- They spoke of the blast in megatons.
