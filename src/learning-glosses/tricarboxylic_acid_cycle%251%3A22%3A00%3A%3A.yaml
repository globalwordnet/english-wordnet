simpleMeaning: A series of enzyme-driven reactions in plant and animal mitochondria that break down acetyl
  compounds and help produce energy-rich phosphate compounds that cells use.
scope: This sense is also called citric acid cycle.
examples:
- A tricarboxylic acid cycle gives cells power.
- Tricarboxylic acid cycles burn sour stuff.
