simpleMeaning: Linked to a weak, bulging spot in the wall of a blood vessel, or harmed by such a spot.
scope: Also called aneurismal, aneurismatic, or aneurysmal, this one does not name the weak spot itself.
examples:
- The aneurysmatic tissue around the vessel showed signs of strain.
- The surgeon removed the aneurysmatic section of the artery.
