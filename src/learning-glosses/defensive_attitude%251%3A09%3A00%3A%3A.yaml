simpleMeaning: A way of thinking in which a person acts as if they are being blamed or attacked, and tries
  to keep themselves safe.
scope: Also called defensive. It is about a state of mind.
examples:
- When asked about the mistake, their defensive attitude showed in every answer.
- A defensive attitude can stop a team from hearing good advice.
