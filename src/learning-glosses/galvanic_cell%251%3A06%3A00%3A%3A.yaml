senseId: 'galvanic_cell%1:06:00::'
synsetId: 04548047-n
simpleMeaning: A cell that converts chemical energy into electricity. The primary cell meant here cannot
  be recharged once its chemicals are used up.
scope: Rechargeable cells also act as galvanic cells while they supply electricity. This sense describes
  the disposable type.
examples:
- The galvanic cell gave power until its chemicals ran out.
- The torch stopped working when its galvanic cell ran out.
