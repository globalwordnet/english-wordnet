simpleMeaning: Old remains of a thing that lived in one stretch of the earth's past, marking the age of
  the stone layer around them.
scope: Also called a guide fossil.
examples:
- The fossil showed the stone around it came from one age of the earth.
- They found a fossil that marks the age of the layer it lay in.
