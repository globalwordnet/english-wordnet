simpleMeaning: Short woolly hairs lie in a thick mat over it.
scope: Also called tomentous, this is a covering of hairs, not one of fine threads.
examples:
- They rubbed the tomentose leaf between their fingers and felt the mat of short woolly hairs.
- They laid the tomentose leaves side by side, and the thick mat of hairs stood out on each one.
