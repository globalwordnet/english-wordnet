simpleMeaning: People who show love and fondness in the open by hugging and holding are called this word,
  often in a critical way.
scope: This word is for people who show love by holding others close, not just by saying loving words.
examples:
- They called the new manager touchy-feely because of all the hugs.
- A touchy-feely greeting made them smile.
