simpleMeaning: No drug made to kill germs can kill this kind of germ.
scope: This word names a germ that drugs cannot kill, not a kind of crop pest.
examples:
- The superbug lived on after drug after drug failed to kill it.
- They could not kill the superbug with any drug they tried.
