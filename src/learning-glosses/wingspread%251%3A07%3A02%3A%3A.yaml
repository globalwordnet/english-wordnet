simpleMeaning: The straight-line distance from one end to the other of the flat part that lifts a plane
  through the air.
scope: Also called wingspan. It is about a plane, not a bird or an insect.
examples:
- The wingspread of the glider was wider than the hangar door.
- They measured the wingspread before the first flight.
