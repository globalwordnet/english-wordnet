simpleMeaning: A crystalline amino acid found in proteins, especially keratin, the protein in hair and
  nails. It was first discovered in bladder stones.
scope: This is a crystal-like building block found in body proteins, above all in hair and nails, first
  found in bladder stones.
examples:
- Cystine is one of the building blocks found in hair.
- Cystine turns up in stones taken from the bladder.
