simpleMeaning: the look of a surface with little or no contrast, and no shine or bright spots
scope: The look of a surface with little or no contrast and no shine, not a thick pad and not a tangled
  mass; also called matt.
examples:
- The mat of the paper gave the image a subdued appearance.
- She preferred the soft mat of the unpolished surface to the gloss of the polished one.
