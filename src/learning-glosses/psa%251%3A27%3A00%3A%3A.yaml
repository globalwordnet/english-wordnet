simpleMeaning: A protein made only by the prostate that thins semen so sperm can swim. High blood levels
  are associated with benign prostate enlargement and prostate cancer.
scope: Not other proteins made by the body, nor other signs of prostate trouble; also called prostate
  specific antigen.
examples:
- PSA levels are checked in a blood test.
- High PSA can point to prostate trouble.
