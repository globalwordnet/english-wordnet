simpleMeaning: An old folk form in which pairs step in time to music, grouped in sets or standing across
  from each other in a line.
scope: Also called contra danse, contradance, contredanse or country-dance, this one is about pairs stepping
  in time to music.
examples:
- The country dancing at the village fair went on until dark.
- They learned the country dancing steps from their grandparents.
