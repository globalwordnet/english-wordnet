simpleMeaning: Speakers use this term to hold back from a plain statement, and it leaves what is said
  open to two readings.
scope: This term is used instead of a plain statement, and what it says stays open to two readings.
examples:
- They called it a weasel word because it let the speaker avoid a plain yes or no.
- The report used a weasel word to soften the claim that the plan had failed.
