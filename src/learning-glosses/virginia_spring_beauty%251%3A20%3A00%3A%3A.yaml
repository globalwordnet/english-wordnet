simpleMeaning: A small perennial grown from a swollen underground stem for its low rosette of fleshy leaves
  and clusters of pink-tinged white flowers. It comes from eastern North America.
scope: A small bulb plant of eastern North America, grown for its low ring of fleshy leaves and pink-tinged
  white blooms; also called Claytonia virginica.
examples:
- Virginia spring beauty opened its pink-white flowers in April.
- The Virginia spring beauty formed a low rosette in the damp wood.
