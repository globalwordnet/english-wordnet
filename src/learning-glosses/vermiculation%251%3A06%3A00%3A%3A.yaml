simpleMeaning: Lines that wind like worms are cut into a surface as a pattern.
scope: This decoration is made of worm-like carvings, not the wavelike movement that pushes food along.
examples:
- The vermiculation on the stone wall was made of lines winding like worms.
- They copied the vermiculation from an old church, lines like worms cut into stone.
