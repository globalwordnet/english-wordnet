simpleMeaning: Taking the answer as true and working back to the facts that would show it is so.
scope: Also called regress, it is thinking that takes the answer as true and works back to the facts.
examples:
- In reasoning backward, you start with the answer and ask what facts must lead to it.
- By reasoning backward from the answer, they worked out which facts would show it is true.
