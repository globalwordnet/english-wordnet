simpleMeaning: A family of shrubs and trees with leathery leaves and small white flowers in elongated
  clusters. Its two genera are Cyrilla and Cliftonia.
scope: Also called titi family, this is a group of bushes and trees with tough leaves and small white
  flowers in long clusters.
examples:
- They placed the new shrub in the cyrilla family.
- Botanists put the shrub in the cyrilla family.
