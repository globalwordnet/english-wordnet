simpleMeaning: An eastern North American creeping shrub with white bell-shaped flowers followed by spicy
  red berry-like fruits. Its shiny, fragrant leaves yield wintergreen oil.
scope: Another name for the low eastern North American wintergreen shrub, not the spicy red berry it bears
  and not the unrelated scarlet-flowered shrub sometimes placed in genus Styphelia. Creeping wintergreen,
  mountain tea and teaberry are other names for the same plant.
examples:
- Checkerberry spread in a low mat beneath the pines.
- The checkerberry leaves smelled sharply spicy when crushed.
