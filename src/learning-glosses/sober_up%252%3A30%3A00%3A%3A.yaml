simpleMeaning: After drinking far too much, a person stops being drunk and thinks clearly again.
scope: This change is also called sober, and takes a person back to a clear head after drinking far too
  much.
examples:
- He stayed in bed until he sobered up.
- He sobered up after the drinking stopped.
