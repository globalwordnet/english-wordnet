simpleMeaning: The removal of an amino group from an amino acid or another compound containing such a
  group.
scope: Deaminization is another name for taking the NH2 part off a protein building block or another chemical
  that holds the same part.
examples:
- Deamination takes the NH2 part off an amino acid.
- The NH2 part comes off an amino acid through deamination.
