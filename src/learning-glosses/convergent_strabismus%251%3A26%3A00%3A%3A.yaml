simpleMeaning: A squint in which one eye, or both eyes, turn inward toward the nose.
scope: Also called cross-eye, crossed eye, and esotropia; this one is about a squint.
examples:
- The baby had convergent strabismus, and one eye turned in toward the nose.
- The doctor noticed the convergent strabismus when both eyes turned in together.
