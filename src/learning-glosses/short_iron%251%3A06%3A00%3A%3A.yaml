simpleMeaning: For hitting the ball high over a small distance, this club has a handle that is not long
  and a face that slants sharply.
scope: This is the club with a handle that is not long and a sharply slanted face, made for hits that
  rise high and land close by rather than for driving the ball far.
examples:
- The player took a short iron from the bag for the next shot.
- The player chose a short iron and sent the ball high into the air.
