simpleMeaning: A member of the clergy who holds more than one church office with an income at the same
  time.
scope: It is a church worker, not a thinker who says no one account explains all of nature or a person
  with a view about groups living together.
examples:
- The pluralist drew pay from two parishes at once.
- The bishop warned the pluralist about holding two posts.
