simpleMeaning: A person who brings down the worth, the goodness, or the standing of a thing, as when cheap
  metal is mixed into coins.
scope: This person is also called a debaser.
examples:
- The degrader mixed cheap metal into the coins, and buyers soon saw their worth fall.
- The degrader was fined for adding cheap metal to coins.
