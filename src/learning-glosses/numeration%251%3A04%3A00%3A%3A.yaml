simpleMeaning: The act of naming numbers one after another, starting with the smallest and moving up.
scope: Also called count, counting, tally, reckoning, and enumeration. It is a noun.
examples:
- The numeration went on until every box in the room had a number.
- Their numeration started at one and rose by one each time.
