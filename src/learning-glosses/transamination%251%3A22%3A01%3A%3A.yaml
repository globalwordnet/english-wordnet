simpleMeaning: The movement of an amino group from one position to another within a chemical compound.
scope: The group stays in the one compound it started in, and does not pass to another.
examples:
- They found transamination at work in the sample, moving the group within the compound.
- The group shifted to a new spot inside the compound during transamination.
