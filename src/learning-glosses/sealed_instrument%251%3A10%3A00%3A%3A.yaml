simpleMeaning: The signer's wax mark is fixed to it, and it is a written agreement that has been signed.
scope: Also called contract under seal and special contract, this is a signed written agreement carrying
  the signer's wax mark, and not an unsigned paper.
examples:
- We signed the sealed instrument and fixed a wax mark to it.
- Once signed, the sealed instrument was put away.
