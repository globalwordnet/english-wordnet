simpleMeaning: Its wood is used in the west for roofing; this small tree of the eastern and central United
  States sheds its leaves yearly, with leaves that shine like laurel.
scope: Also called laurel oak and Quercus imbricaria, this is a small tree of the eastern and central
  United States whose leaves shine like laurel and whose wood is used in the west for roofing.
examples:
- They planted a shingle oak.
- They cut a shingle oak for its wood.
