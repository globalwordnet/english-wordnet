simpleMeaning: A part of a cell's plans for life that tells the cell how to make one protein or a short
  chain of protein bits.
scope: This is the name for a cell part that guides the making of one protein or a short chain of protein
  bits.
examples:
- They traced the fault to one structural gene.
- A structural gene was switched on in the cell.
