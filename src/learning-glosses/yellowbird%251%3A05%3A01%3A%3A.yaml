simpleMeaning: A finch of North America, the male of which has gold feathers on its body in summer.
scope: Also called goldfinch, New World goldfinch, and Spinus tristis. It is a finch, not a warbler.
examples:
- We watched a yellowbird eating seeds at the feeder.
- The male yellowbird shows gold feathers on its body in summer.
