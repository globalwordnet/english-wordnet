simpleMeaning: The number of live babies born in a place for every thousand people living there, counted
  over one year.
scope: Also called fertility, birthrate, fertility rate, and natality, this one names a number.
examples:
- The birth rate in the town was higher than in the city.
- They worked out the birth rate from the town's records.
