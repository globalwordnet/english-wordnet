simpleMeaning: In motion pictures, the picture on the surface is much broader than it is tall.
scope: This is not a picture nearly as tall as it is broad.
examples:
- They watched the film in wide-screen, the picture filling the whole wall.
- The wide-screen version shows more of the scene at the sides.
