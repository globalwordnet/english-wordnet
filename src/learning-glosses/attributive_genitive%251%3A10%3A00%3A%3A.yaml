simpleMeaning: A word that shows whose a thing is, put before a noun to say more about it.
scope: Attributive genitive case is another name for this sense, not the adjective sense of this word.
examples:
- In 'John's mother', 'John's' is an attributive genitive.
- The teacher pointed out the attributive genitive in 'Mary's book'.
