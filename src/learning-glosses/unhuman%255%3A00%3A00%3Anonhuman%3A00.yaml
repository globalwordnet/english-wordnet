simpleMeaning: Said of a person or a thing that has lost the qualities that belong to people.
scope: Also called dehumanized and dehumanised. It is used of people and things, not of how they look.
examples:
- An unhuman stare showed no feeling at all.
- The unhuman treatment of the prisoners shocked everyone who saw it.
