senseId: 'symbolization%1:09:00::'
synsetId: 05773412-n
simpleMeaning: People agree, or link by habit, that a thing in view stands for a thing out of sight.
scope: This is also called a symbol, a symbolic representation, or a symbolisation, and it is not the
  act of giving things a hidden meaning or the use of signs to carry a meaning.
examples:
- The eagle stands as a symbolization of the United States.
- The dove is a symbolization of peace.
