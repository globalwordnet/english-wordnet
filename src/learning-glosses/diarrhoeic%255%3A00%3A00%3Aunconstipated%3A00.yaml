simpleMeaning: Having to do with the passing of loose, watery waste from the gut.
scope: Also called diarrheal, diarrheic, diarrhetic, diarrhoeal, and diarrhoetic. It is a describing word.
examples:
- The diarrhoeic child drank water often.
- Diarrhoeic trouble spread through the camp.
