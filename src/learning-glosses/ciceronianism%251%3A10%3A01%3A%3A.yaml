senseId: 'ciceronianism%1:10:01::'
synsetId: 92462372-n
simpleMeaning: Imitation of, or resemblance to, Cicero's style of public speaking or writing, especially
  among his followers in the early Renaissance.
scope: A way of writing and speaking after Cicero, not a plain direct style of one's own.
examples:
- His Ciceronianism shows in every long balanced sentence.
- The essay's Ciceronianism pleased the old scholars.
