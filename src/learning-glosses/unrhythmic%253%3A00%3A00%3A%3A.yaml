senseId: 'unrhythmic%3:00:00::'
synsetId: 02028263-a
simpleMeaning: Said of a thing whose beats do not fall in a steady pattern, and whose stresses are uneven.
scope: Also called unrhythmical. It is a word for a thing, not for a person.
examples:
- The unrhythmic drumming made it hard to dance.
- The unrhythmic steps of the marchers kept breaking the line.
