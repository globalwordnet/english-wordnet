simpleMeaning: The part of medical science that studies why some bodies react badly to things that are
  usually harmless, and how to treat them.
scope: This one is a field of study, not the bad reactions themselves.
examples:
- They studied allergology to help people with bad reactions to food.
- The allergology clinic tested people for reactions to pollen.
