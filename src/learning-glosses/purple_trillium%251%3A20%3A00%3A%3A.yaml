simpleMeaning: An eastern North American plant with foul-smelling pink to purple flowers and a root that
  was traditionally used during childbirth and makes the mouth feel dry.
scope: Also called birthroot or red trillium. The reference to childbirth describes historical folk medicine.
examples:
- Older herbal books record the traditional use of purple trillium during childbirth.
- Purple trillium flowers smell foul.
