simpleMeaning: Gonorrhea, a common sexually transmitted infection caused by the bacterium Neisseria gonorrhoeae.
  Symptoms include painful urination and pain around the urethra, the tube that carries urine out.
scope: This is a disease you can catch through sex, not hitting your hands together to show you liked
  a show and not a sharp loud noise.
