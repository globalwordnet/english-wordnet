simpleMeaning: A shrub covered in silvery hairs, found in the central and southern United States and Mexico.
  It can be a troublesome weed on grazing land.
scope: A silver-haired shrub of the middle and south of the United States and Mexico, also called sand
  sage and silvery wormwood, a hard weed on open grassland.
