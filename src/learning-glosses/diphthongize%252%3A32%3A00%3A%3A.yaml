simpleMeaning: To turn one vowel sound into a pair of vowel sounds spoken as one sound.
scope: Also called diphthongise. It is about a change, not the sound.
examples:
- This vowel diphthongized in Germanic.
- In that dialect, the vowel diphthongized.
