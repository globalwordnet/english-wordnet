senseId: 'antipodal_opposition%1:24:00::'
synsetId: 13851456-n
simpleMeaning: This is how two things lie exactly across from each other, at the two ends of a line drawn
  straight through the middle.
scope: Also called antipodal and diametrical opposition, this one is not about two things on the same
  side.
examples:
- The antipodal opposition of the two towns put them on opposite sides of the world.
- They drew the antipodal opposition as a line straight through the middle of the circle.
