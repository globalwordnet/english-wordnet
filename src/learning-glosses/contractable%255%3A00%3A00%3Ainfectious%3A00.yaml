simpleMeaning: Describing an illness that can move from someone ill to others through infection.
scope: Also called catching, communicable, contagious, transmissible, and transmittable; this one is about
  an illness.
examples:
- A cold is contractable, so the sick child stayed home from school.
- Measles is contractable among children who have not had the shot.
