simpleMeaning: The joining of two vowel sounds into one sound that starts as one vowel and glides into
  another.
scope: Also called synaeresis. It is not the sense about liquid coming out of a gel.
examples:
- The class talked about syneresis in the lesson on vowel sounds.
- The teacher explained syneresis with two vowel sounds on the board.
