simpleMeaning: Behaviour that follows high ideals and takes no account of what can really be done.
scope: Also called knight errantry. It is a kind of behaviour.
examples:
- Their quixotism led them to spend all their savings on a hopeless plan.
- Quixotism made them turn down a safe job for a plan that could never work.
