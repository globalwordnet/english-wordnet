senseId: 'metonymy%1:10:00::'
synsetId: 07122361-n
simpleMeaning: Using the word for a mark or a feature of a thing to mean the thing itself, as when people
  are counted as 'heads'.
scope: It is a figure of speech.
examples:
- The writer used metonymy when the sailors were called 'hands'.
- The old saying uses metonymy, letting 'the pen' stand for writing.
