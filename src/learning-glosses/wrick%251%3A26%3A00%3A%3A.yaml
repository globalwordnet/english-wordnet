simpleMeaning: A sudden, painful tightening of a muscle, especially in the neck or back. Wrick and rick
  are British terms.
scope: This sudden hard pull in a muscle, also called rick, kink and crick, is a British name for a painful
  spasm, above all in the neck or back.
examples:
- A wrick in the neck hurt.
- The wrick in the back hurt too.
