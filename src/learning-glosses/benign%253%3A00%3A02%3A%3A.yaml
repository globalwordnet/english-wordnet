simpleMeaning: Generally posing little danger to health, especially of a noncancerous tumor unlikely to
  progress or recur.
scope: Not harmful and not growing worse, above all of a lump in the body, not kind in manner.
examples:
- The doctor said the benign lump would not harm her.
- A benign growth needs no cutting out, the nurse said.
