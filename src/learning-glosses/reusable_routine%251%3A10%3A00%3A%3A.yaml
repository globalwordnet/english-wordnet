senseId: 'reusable_routine%1:10:00::'
synsetId: 06596432-n
simpleMeaning: A set of steps that needs to be loaded only once and can then be run over and over.
scope: This is a set of steps loaded once and run over and over, not a set of steps loaded fresh each
  time it is needed.
examples:
- The program called the reusable routine each time it needed the same steps.
- Once the reusable routine was loaded, it could be run over and over.
