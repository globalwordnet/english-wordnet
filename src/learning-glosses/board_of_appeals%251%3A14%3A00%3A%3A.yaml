simpleMeaning: A group of appointed officials who hear requests to reconsider decisions without serving
  as judges.
scope: This one is also called an appeal board, and an appeals board.
examples:
- The board of appeals overturned the fine after hearing the shopkeeper's case.
- They took their case to the board of appeals when the permit was refused.
