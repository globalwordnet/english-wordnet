simpleMeaning: The muscles of the buttocks on both sides of the body are drained by blood vessels carrying
  blood back toward the heart.
scope: These are blood vessels of the muscles of the buttocks, also called gluteal vein, not ones on one
  side of the body only.
examples:
- Blood leaves the muscles of the buttocks through the vena gluteus on each side of the body.
- The vena gluteus on the left side of the body carries blood back from the buttock muscles.
