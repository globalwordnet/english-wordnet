senseId: remittent%5:00:00:decreased:00
synsetId: 00886430-s
simpleMeaning: Of a sickness, easing off for a time, then growing bad again
scope: This is a sickness that eases off for a time and then grows bad again, and not one that stays bad
  without a break.
examples:
- A remittent fever eased by morning and came back strong by night.
- The doctor called it a remittent sickness because the pain would ease and then return.
