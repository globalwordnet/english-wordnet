senseId: 'tra-la-la%1:10:00::'
synsetId: 07064419-n
simpleMeaning: Sounds with no sense in them that people hum while they sing the repeated part of a song.
scope: Also called tra-la, this is wordless humming that goes with a song's repeated part, not a line
  of words that mean something.
examples:
- They hummed tra-la-la in place of the words of the chorus.
- They hummed tra-la-la while the others sang the words of the refrain.
