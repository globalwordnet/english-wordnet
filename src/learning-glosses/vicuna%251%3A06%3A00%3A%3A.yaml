simpleMeaning: Soft woolen fabric made from the fleece of the vicuña, a wild South American relative of
  the llama.
scope: This is a cloth, not the animal itself and not the wool it gives.
examples:
- They wore a vicuna coat, soft and warm, made from the animal's fleece.
- They chose vicuna cloth for the coat because it was so soft.
