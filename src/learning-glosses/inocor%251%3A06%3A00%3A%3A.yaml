simpleMeaning: A brand of inamrinone, a medicine given into a vein for heart failure that increases the
  force of the heart’s contractions.
scope: A drug given into a vein when the heart fails, also called amrinone, which makes the heart muscle
  squeeze harder.
examples:
- The nurse gave Inocor into a vein when his heart failed.
- Inocor helped her heart muscle squeeze harder.
