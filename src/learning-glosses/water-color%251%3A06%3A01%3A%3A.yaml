simpleMeaning: A paint that mixes with water and holds pigments that dissolve in water, used by artists.
scope: Also called watercolor, watercolour, and water-colour. It is a paint, not the art of painting or
  a finished picture.
examples:
- They bought a tube of water-color for the new picture.
- This water-color stays bright once it has dried.
