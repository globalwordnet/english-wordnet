simpleMeaning: An odd noise from the organ in the chest that pumps blood, which can at times show that
  its valves are not working as they should.
scope: This sound is also called a murmur or a cardiac murmur.
examples:
- The doctor heard a murmur when listening to the child's chest.
- The doctor listened to the patient's chest and noted a soft murmur.
