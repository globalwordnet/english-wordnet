simpleMeaning: A religious movement among Arab Shiite Muslims in seventeenth-century Iraq that opposed
  the Usuli movement.
scope: This is a faith group of Arab Shiite Muslims in Iraq in the 1600s, set against the Usuli, and not
  the Usuli themselves.
examples:
- The Akhbari movement began in 17th century Iraq.
- Akhbari Muslims in Iraq stood against the Usuli.
