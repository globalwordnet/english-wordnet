senseId: 'unfaithfully%4:02:00::'
synsetId: 00225252-r
simpleMeaning: In a way that breaks trust and cannot be counted on.
scope: Also called undependably and unreliably, this word is for acting, not for acting that can be counted
  on.
examples:
- They acted unfaithfully, telling their friends one thing and doing another.
- The firm acted unfaithfully, breaking every promise it made.
