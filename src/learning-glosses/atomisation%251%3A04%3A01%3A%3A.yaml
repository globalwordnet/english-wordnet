simpleMeaning: This is the wiping out of a thing by breaking it down into the tiniest bits of matter.
scope: Also called atomization, this one is not the building up of a thing from small parts.
examples:
- The ray caused the atomisation of the rock, leaving nothing but dust behind.
- In the story, the atomisation of the whole town took only a moment.
