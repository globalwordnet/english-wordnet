simpleMeaning: The apparent shift of a body in the sky when viewed from a pair of spots on the turning
  earth's surface.
scope: This sense is also called diurnal parallax.
examples:
- Geocentric parallax lets astronomers work out how far away the moon is.
- They measured the geocentric parallax of the planet from two places on the earth.
