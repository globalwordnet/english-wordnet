senseId: 'torpidity%1:07:00::'
synsetId: 04644238-n
simpleMeaning: A state of doing little, from a heavy, sleepy feeling and a lack of strength.
scope: Torpor, listlessness and torpidness are other names for it, not a state in which feeling itself
  is partly cut off.
examples:
- They could not shake off the torpidity that came over them.
- They sat still in their torpidity, with no wish to move.
