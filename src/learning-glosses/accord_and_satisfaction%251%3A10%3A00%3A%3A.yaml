simpleMeaning: A deal in which a debt is closed for less than the full sum, the rest treated as paid.
scope: This one is not settled by paying the whole amount that was asked for.
examples:
- They reached an accord and satisfaction after the shop agreed to take half the sum.
- The accord and satisfaction closed the old debt, though the creditor had asked for more.
