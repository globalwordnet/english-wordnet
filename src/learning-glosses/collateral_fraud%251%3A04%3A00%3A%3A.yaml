synsetId: 00779514-n
simpleMeaning: Dishonest dealing that stops a person in a trial knowing their rights or getting a fair
  chance to put their case.
scope: This one is also called extrinsic fraud.
examples:
- The lawyer said the collateral fraud kept the client from a fair hearing.
- The court found the collateral fraud had stopped one side from putting its case.
