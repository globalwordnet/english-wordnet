synsetId: 13356989-n
simpleMeaning: Shares that give their owners priority when dividends are paid and carry no voting rights.
scope: These are parts of a firm whose owners are promised to be paid first out of the profits, but who
  have no say in how the firm is run; preference shares and preferred stock are other names for them,
  not ordinary parts of a firm with a vote.
examples:
- He bought preferred shares for the steady income.
- Preferred shares are paid first out of the profits.
