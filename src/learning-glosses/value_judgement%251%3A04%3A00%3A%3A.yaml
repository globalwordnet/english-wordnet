senseId: 'value_judgement%1:04:00::'
synsetId: 00877516-n
simpleMeaning: This kind of judgement tells you more about what the person making it thinks matters than
  about the thing itself.
scope: Also called a value judgment, this is one person's view of a thing, not a plain account of the
  thing itself.
examples:
- Their value judgement of the plan said more about their own beliefs than about the plan itself.
- The value judgement in the report showed what the writer thought mattered, not what the facts showed.
