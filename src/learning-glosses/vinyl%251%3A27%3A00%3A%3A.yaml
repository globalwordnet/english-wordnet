simpleMeaning: A group of atoms derived from ethylene by removing one hydrogen atom, leaving one place
  where the group can bond to another atom.
scope: In chemistry, a group of atoms with one free link from ethylene; not the shiny plastic used for
  floors.
examples:
- The vinyl group joins to the chain in the reaction.
- Chemists write vinyl as a small group of atoms.
