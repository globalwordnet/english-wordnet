simpleMeaning: Said of a thing that has to do with criminology, the study of why people break the law
  and how the law deals with them.
scope: It is about the study of law-breaking, not about the law-breaking itself.
examples:
- The criminological study looked at why young people break the law.
- The criminological report explained why the thefts happened.
