simpleMeaning: The showing of things, above all a god, as having the shape or ways of a human being.
scope: Also called anthropomorphism. It is not the belief that Jesus was both human and divine.
examples:
- The painting showed theanthropism in its image of a god with a human face.
- The old stories are full of theanthropism, with gods who eat and argue like people.
