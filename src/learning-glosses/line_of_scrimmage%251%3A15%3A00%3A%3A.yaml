simpleMeaning: In American football, the row where two teams face each other when a play starts, running
  the same way as the end marks on the field.
scope: It is also called a scrimmage line.
examples:
- The runner was tackled at the line of scrimmage.
- Both teams took their places at the line of scrimmage.
