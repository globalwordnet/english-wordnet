simpleMeaning: Said of stone that was made or lies below the earth's top layer.
scope: This one is also called endogenetic, and it is not about things that come from inside.
examples:
- These endogenic rocks formed beneath the surface of the earth.
- The quarry cut through endogenic rock that lay under the ground.
