simpleMeaning: Any of several blood vessels draining blood from the sides of the head.
scope: Also called temporal vein. It is a blood vessel, not an artery.
examples:
- The surgeon tied off the vena temporalis during the operation on the side of the head.
- The doctor pressed on the vena temporalis to slow the bleeding at the side of the head.
