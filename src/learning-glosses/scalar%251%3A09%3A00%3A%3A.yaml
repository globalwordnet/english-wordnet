senseId: 'scalar%1:09:00::'
synsetId: 05872935-n
simpleMeaning: A variable quantity described by a single number, without separate directional components.
scope: It is one amount with no parts inside it, not the adjective that says a size has no direction.
examples:
- The scalar in the sum stands for a single amount, not a set of parts.
- In the formula, the scalar can change while the rest stays the same.
