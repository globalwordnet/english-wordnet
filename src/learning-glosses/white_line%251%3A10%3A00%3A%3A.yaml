simpleMeaning: A band the colour of snow that runs down the middle of a road to show where one stream
  of traffic ends and the next begins.
scope: It is a mark on a road.
examples:
- The white line down the middle of the road had faded, so drivers crossed it without noticing.
- Painters repainted the white line after the road was resurfaced.
