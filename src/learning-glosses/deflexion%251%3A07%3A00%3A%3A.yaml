simpleMeaning: The state of being bent or turned aside.
scope: Also called deflection. It is about how a thing is shaped, not how much a wave bends.
examples:
- The deflexion of the beam showed how much weight it could bear.
- Engineers measured the deflexion of the bridge under the heavy load.
