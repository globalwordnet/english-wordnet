simpleMeaning: An annual sunflower grown for silage, a stored livestock feed, and for its oil-rich seeds.
  It is common throughout the United States and much of North America.
scope: Also called the common sunflower or mirasol; a sunflower grown for feed and oil seed, common through
  the United States and much of North America.
