simpleMeaning: A severe form of alcohol withdrawal that can cause confusion, shaking, agitation, and hallucinations
  when someone dependent on alcohol suddenly stops or cuts down.
scope: A severe alcohol withdrawal syndrome following a sudden reduction in alcohol use.
examples:
- The hospital treated the patient for delirium tremens after alcohol withdrawal.
- Delirium tremens can bring shaking and frightening visions.
