simpleMeaning: Things that happen without keeping to a fixed time, or to a time anyone can foresee, beside
  other events.
scope: This one is not about things that happen on a set schedule.
examples:
- The asynchronous operation ran whenever the data arrived, with no set time beside the other jobs.
- Several asynchronous operations finished in no fixed order.
