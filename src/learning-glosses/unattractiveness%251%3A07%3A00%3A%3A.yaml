senseId: 'unattractiveness%1:07:00::'
synsetId: 04698824-n
simpleMeaning: The state of looking ugly, so that people do not like to look at it.
scope: It is a matter of looks alone, not of what a thing does or how it works.
examples:
- The unattractiveness of the old coat kept it hanging on the shop rail for months.
- They did not mind the unattractiveness of the chair; it was the seat they liked.
