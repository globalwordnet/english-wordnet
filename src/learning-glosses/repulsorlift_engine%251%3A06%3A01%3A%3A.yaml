simpleMeaning: The made-up power unit from the Star Wars stories that drives a craft to hover in the air
  above the ground.
scope: A repulsor and a repulsorlift are other names for it, and it is the power unit that drives a craft
  to hover in the air above the ground.
examples:
- The repulsorlift engine kept the craft floating above the ground.
- When the repulsorlift engine failed, the craft sank back to the ground.
