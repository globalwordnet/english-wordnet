simpleMeaning: Used when hard work or strong feeling sends blood to the skin, most of all on the head,
  or only makes it seem so, and turns it rose-pink.
scope: This word is also called red, flushed, crimson or reddened, and it is used when the skin turns
  rose-pink from feeling or hard work, not only when someone is embarrassed or ashamed.
examples:
- They were red-faced after running up the stairs.
- The red-faced speaker paused to catch breath.
