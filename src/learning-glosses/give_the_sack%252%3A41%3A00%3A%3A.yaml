simpleMeaning: To end a worker's job, or to take their post from them.
scope: This sense is also called can, fire, sack, dismiss, displace, terminate, force out, give notice,
  give the axe, and send away.
examples:
- The firm will give the clerk the sack at the end of the week.
- Workers feared the firm would give them the sack before Christmas.
