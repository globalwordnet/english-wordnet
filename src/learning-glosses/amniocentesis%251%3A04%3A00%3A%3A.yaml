simpleMeaning: A test, usually after the fifteenth week of pregnancy, that samples the fluid around the
  fetus with a needle to check for developmental or genetic conditions.
scope: Also called amnio, during pregnancy, drawing womb fluid by needle from a woman with child, past
  the fifteenth week, to help spot faults in a child yet unborn.
examples:
- Amniocentesis is done after the fifteenth week.
- Amniocentesis helps spot faults before birth.
