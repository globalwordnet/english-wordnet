simpleMeaning: One of three arteries in the brain that form part of a ring of blood vessels called the
  circle of Willis.
scope: Also called arteria communicans, this one is about a vessel in the head.
examples:
- The communicating artery linked two larger vessels in the brain.
- A scan showed the communicating artery joining the ring of vessels.
