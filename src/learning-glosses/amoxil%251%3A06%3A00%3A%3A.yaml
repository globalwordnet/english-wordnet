simpleMeaning: A brand of amoxicillin, an antibiotic. This semisynthetic oral penicillin treats bacterial
  infections. Brands include Amoxil, Larotid, Polymox and Trimox. Augmentin combines amoxicillin with
  clavulanate.
scope: Amoxicillin is the oral penicillin antibiotic in this sense. Augmentin contains it together with
  clavulanate.
examples:
- The doctor gave her Amoxil for the bacterial infection.
- Amoxil is taken by mouth to fight a bacterial infection.
