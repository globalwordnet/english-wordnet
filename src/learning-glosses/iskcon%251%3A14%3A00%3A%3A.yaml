simpleMeaning: The Hare Krishna movement, founded in America in 1966. Its teachings draw on Vedic scriptures.
  Devotees chant Krishna's names and traditionally wear saffron robes, practice celibacy, and eat vegetarian
  food.
scope: 'Also called Hare Krishna and the International Society for Krishna Consciousness: a religious
  group started in the United States in 1966, not a Hindu temple and not a single worshipper.'
examples:
- ISKCON was started in 1966.
- ISKCON members chant in the park.
