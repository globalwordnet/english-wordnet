simpleMeaning: Where a cut is to go in wood or metal, this tool marks the line with its sharp point.
scope: Scribe and scratch awl are other names for this sharp-pointed marking tool, not a tool for cutting.
examples:
- The scriber left a thin line on the metal.
- A scriber marked where the wood was to be cut.
