senseId: 'lumen%1:23:00::'
synsetId: 13662778-n
simpleMeaning: A unit of light output equal to the light emitted into one steradian by a point source
  shining evenly in all directions at one candela.
scope: 'Also called lm: a unit for measuring light, not a unit for measuring length or weight.'
examples:
- This bulb gives out 800 lumen.
- The lamp is rated at 1,200 lumen.
