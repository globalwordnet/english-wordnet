simpleMeaning: A cortisol-related steroid with less hydrogen, sold as Orasone, Deltasone, Liquid Pred,
  or Meticorten. It reduces arthritis inflammation and suppresses the immune system.
scope: For treating joint pain and holding back the body's defences, as a drug made from cortisol.
examples:
- Prednisone eases joint pain.
- Prednisone holds back the body's defences.
