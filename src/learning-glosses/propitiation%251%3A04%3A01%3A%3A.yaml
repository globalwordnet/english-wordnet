simpleMeaning: The act of making amends for a sin or wrongdoing, especially by seeking to appease a god.
scope: 'Also called atonement or expiation: making up for a sin or wrong, not just calming a person and
  winning back their trust.'
examples:
- The priest spoke of propitiation for the sins of the people.
- Through prayer and gifts, they sought propitiation from their god.
