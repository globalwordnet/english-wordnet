simpleMeaning: A cancerous tumor of the testis, usually occurring in adults, often somewhat later than
  other testicular germ cell tumors.
scope: Also called testicular cancer, it is a growth in a man's testis, not a harmless lump and not a
  growth elsewhere in the body.
examples:
- A seminoma was found in the man's testis.
- A seminoma most often turns up in older men.
