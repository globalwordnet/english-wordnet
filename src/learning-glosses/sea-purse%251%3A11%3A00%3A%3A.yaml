senseId: 'sea-purse%1:11:00::'
synsetId: 07418861-n
simpleMeaning: The water drags back out from the shore in a pull below the surface once the waves have
  broken.
scope: This pull of water is also called undertow, sea-poose, sea-puss, sea purse, and sea puss.
examples:
- The sea-purse dragged the water back out once the wave had broken.
- After the waves broke, the sea-purse pulled beneath the surface.
