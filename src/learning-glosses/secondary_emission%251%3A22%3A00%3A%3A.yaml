senseId: 'secondary_emission%1:22:00::'
synsetId: 13574961-n
simpleMeaning: The release of electrons from a surface when higher-energy electrons strike it.
scope: The bits a surface gives off when stronger bits strike it are set apart from the striking bits
  themselves.
examples:
- Stronger charged bits struck the surface, and a secondary emission followed.
- The secondary emission came from the surface, not from the bits that struck it.
