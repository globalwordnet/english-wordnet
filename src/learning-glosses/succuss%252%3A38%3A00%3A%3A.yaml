simpleMeaning: To shake something, especially a patient, to find out if there is fluid or air inside the
  body.
scope: Also called shake up. It is the medical word for the shake, not the everyday word shake.
examples:
- The doctor succussed the patient to check for fluid.
- They succussed the patient and listened for air in the chest.
