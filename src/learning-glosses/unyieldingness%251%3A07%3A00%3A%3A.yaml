schema: oewn-learning-gloss-v2
senseId: 'unyieldingness%1:07:00::'
synsetId: 04871024-n
simpleMeaning: A person with this quality stays firm in what they have decided and will not bend or give
  in.
scope: This quality is also called obduracy and adamance, and it does not change when others push against
  it.
examples:
- Their unyieldingness kept the team on the same plan even when the work grew hard.
- The talks broke down over one side's unyieldingness on every point.
