simpleMeaning: An abnormal rise in the number of lymphocytes, a type of white blood cell, in circulating
  blood.
scope: It is a state of the blood, and not a fall in the number of white blood cells.
examples:
- The doctor noted lymphocytosis in the blood test results.
- The lymphocytosis was found during a routine blood test.
