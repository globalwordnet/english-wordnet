simpleMeaning: A large fast-growing Chinese tree bearing both sexes, flat bright-green deciduous leaves
  and small round cones. Commonly grown ornamentally in America, it was known from fossils before discovery
  in China.
scope: Also called dawn redwood and metasequoia; a large Chinese tree often grown for show in the United
  States, first known from fossils.
examples:
- Metasequoia glyptostrodoides towers over the garden.
- We planted a Metasequoia glyptostrodoides in the park.
