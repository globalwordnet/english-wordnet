simpleMeaning: A lipoprotein that carries cholesterol in blood, with much protein and little cholesterol.
  Higher levels may mean lower risk of coronary heart disease and plaque buildup in arteries.
scope: 'Also called an alpha-lipoprotein and a high-density lipoprotein: a fat-carrying part in the blood
  that moves cholesterol, made of much protein and little cholesterol.'
examples:
- High HDL levels are thought to lower the chance of heart disease.
- The test showed her HDL was high.
