simpleMeaning: An operation to take out one or both of the tubes that carry eggs from the ovaries to the
  womb.
scope: This operation removes the tubes that carry eggs, and leaves the womb itself in place.
examples:
- The salpingectomy took out one tube.
- After the salpingectomy, both tubes were gone.
