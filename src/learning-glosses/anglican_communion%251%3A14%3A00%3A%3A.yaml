simpleMeaning: The Church of England and churches abroad that share its beliefs. Canterbury is their historic
  center. The British monarch is the Church of England's supreme governor.
scope: The Anglican Communion includes the Church of England and affiliated churches abroad. The British
  monarch is supreme governor of the Church of England.
examples:
- The Anglican Communion has its see in Canterbury.
- She was married in the Anglican Communion.
