simpleMeaning: A tiny member of Cycliophora that attaches to a lobster's mouthparts with a disc, feeds
  through a ring of fine hairs, and reproduces both sexually and asexually.
scope: A sea animal that lives on a lobster, not other small animals of the sea; it is the only known
  kind of its group.
examples:
- Symbion pandora lives on the lip of a lobster.
- Scientists found Symbion pandora feeding through its hairy mouth ring.
