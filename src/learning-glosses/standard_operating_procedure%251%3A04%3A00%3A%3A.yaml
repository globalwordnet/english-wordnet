simpleMeaning: A list of steps set down to be followed every time.
scope: Also called standard procedure, standing operating procedure, and SOP. It is a way of working.
examples:
- Rote memorization has been the educator's standard operating procedure for centuries.
- The nurses follow the standard operating procedure for every new patient.
