senseId: 'galvanisation%1:22:00::'
synsetId: 13507171-n
simpleMeaning: Stimulation of a nerve or muscle with a direct electric current.
scope: This is using an electric current to stir something into action; galvanization is another name
  for this sense, not coating metal with zinc and not stirring a person to lively action.
examples:
- The doctor used galvanisation to test the muscle.
- Galvanisation of the nerve made the hand twitch.
