senseId: 'acentric_chromosome%1:08:00::'
synsetId: 05452186-n
simpleMeaning: A chromosome without a centromere, the region where its two copies normally join before
  they separate.
scope: This one is the opposite of one whose two halves are joined in the middle.
examples:
- Under the microscope, they spotted an acentric chromosome with no middle part joining its halves.
- The acentric chromosome was easy to pick out, since its two halves had nothing holding them together.
