simpleMeaning: Too many words, because the same things keep being said again and again
scope: Also called repetitiveness, it names the wordiness of saying the same things too often.
examples:
- Readers complained about the repetitiousness of the long report.
- The repetitiousness was cut from the draft by taking out lines that said the same thing again.
