simpleMeaning: Pressure, or force divided by the area it acts on. It is measured in pascals in SI units
  or dynes per square centimeter in the CGS system.
scope: Pressure is force divided by area. One pascal is one newton per square meter.
examples:
- The force per unit area on the wall grew as the gas was squeezed.
- Engineers work out the force per unit area before they build the tank.
