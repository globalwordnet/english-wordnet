simpleMeaning: The unlawful acts a person has already been found guilty of, set out as a list.
scope: Also called record, this one is about a list, not about one unlawful act.
examples:
- He ruled that the criminal record of the defendant could not be disclosed to the court.
- The prostitute had a record a mile long.
