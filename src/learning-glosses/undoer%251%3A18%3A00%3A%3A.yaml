simpleMeaning: A person who wrecks what they touch, spoiling it or leaving it in ruins.
scope: Destroyer, waster, ruiner, and uprooter are other names for it, not names for one who unfastens
  things.
examples:
- The invaders were undoers of every town they passed through.
- Greed was the undoer of the whole firm.
