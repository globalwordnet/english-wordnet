simpleMeaning: Describing a road whose surface has not been leveled or drained, making travel difficult
  during some seasons.
scope: Also called dirt, this word is used of a road that has not been leveled or drained, not of a road
  that has been made smooth and dry.
examples:
- The ungraded road was rough and full of puddles.
- They drove slowly down the ungraded track, the wheels splashing through standing water.
