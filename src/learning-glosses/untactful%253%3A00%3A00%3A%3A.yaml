senseId: 'untactful%3:00:00::'
synsetId: 02393411-a
simpleMeaning: A person has no feeling for the right and kind thing to say or do with others, and their
  words and acts show it.
scope: Tactless is another name for this, and it is not a way of speaking that takes care to spare the
  feelings of others.
examples:
- It was untactful to ask her age in front of all the guests.
- That untactful remark about the dress left the whole room silent.
