simpleMeaning: An Australian tree with featherlike leaves, orange-yellow flowers, and large woody pods
  holding three or four chestnut-like seeds. It yields strong, dark wood.
scope: Also called Australian chestnut; an Australian tree with feather-like leaves and large woody pods,
  yielding dark strong wood.
examples:
- The Moreton Bay chestnut stood tall in the park.
- Moreton Bay chestnuts dropped their large pods in autumn.
