simpleMeaning: A drug that makes the body pass more water, used to bring down swelling from fluid held
  in the body and sold under one named trade name.
scope: This one is also called Edecrin.
examples:
- The doctor gave them ethacrynic acid to bring down the swelling in their legs.
- The nurse checks the ethacrynic acid dose twice before giving it.
