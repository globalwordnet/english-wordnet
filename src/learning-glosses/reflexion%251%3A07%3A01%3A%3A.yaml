simpleMeaning: The power of a thing to bounce back beams or rays that hit it.
scope: Also called reflection and reflectivity. It is a quality.
examples:
- The reflexion of this metal is high, so it throws back most light.
- They tested the reflexion of the new coating before using it on the walls.
