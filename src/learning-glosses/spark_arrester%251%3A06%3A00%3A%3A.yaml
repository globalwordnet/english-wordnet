simpleMeaning: Over an open fire or a chimney sits this wire net, keeping small burning bits from escaping.
scope: Also called sparker, this wire net keeps small burning bits from escaping an open fire or a chimney,
  not a device that cuts down flashes when electrical contacts are opened or closed.
examples:
- A spark arrester covered the mouth of the fireplace.
- They fitted a spark arrester to the top of the smokestack.
