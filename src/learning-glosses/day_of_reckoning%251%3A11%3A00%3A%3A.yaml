simpleMeaning: An unpleasant fate that lies ahead, possibly ending in disaster.
scope: Doom, doomsday, and the end of the world are other names for this; it is not the New Testament
  time when God judges every person after Armageddon.
examples:
- They knew their day of reckoning had come at last.
- They all knew the day of reckoning was near.
