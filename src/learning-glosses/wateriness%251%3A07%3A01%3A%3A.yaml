schema: oewn-learning-gloss-v2
senseId: 'wateriness%1:07:01::'
synsetId: 05121229-n
simpleMeaning: A thinness or lack of substance caused by too much water in food, or figuratively by too
  little substance in writing.
scope: Thin, weak quality from too much liquid, not richness and not plain dryness.
examples:
- The wateriness of his long speech bored the listeners.
- No one enjoys the wateriness of potatoes boiled in too much water.
