simpleMeaning: A device that reads information stored as a pattern of holes in a tape.
scope: Also called paper tape reader, punched paper tape reader or punched tape reader. It is a kind of
  machine.
examples:
- The tape reader used compressed air, which passed through the holes and was directed into certain mechanisms
  of the caster.
- The tape reader turned the holes in the strip into facts the machine could use.
