simpleMeaning: In chemistry, undergoing no chemical reaction under the conditions described.
scope: It is a word for a thing in chemistry, not for a person or a thing that does not answer when stirred.
examples:
- The unreactive gas did not change when it was mixed with air.
- An unreactive metal can sit in acid without changing.
