simpleMeaning: The measure of how much space a surface covers within its edges, usually given in square
  units.
scope: Area and expanse are also names for this measure of how much room a flat shape takes up inside
  its edges.
examples:
- They worked out the surface area of the rectangle.
- The room had a surface area of about 500 square feet.
