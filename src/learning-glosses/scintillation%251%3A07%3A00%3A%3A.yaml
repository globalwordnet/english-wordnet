simpleMeaning: The bright, reflected shine of a thing, seen when light bounces off it.
scope: Also called glitter, sparkle, glisten, and glister. It is a shine.
examples:
- The scintillation of the lake at noon was hard to look at.
- Polished silver has a scintillation that catches the eye.
