simpleMeaning: One of two branches of the Finno-Ugric languages. It includes Finnish and Estonian, while
  Hungarian belongs to the other branch.
scope: 'Also called Fennic, Finnic and Non-Ugric: one of two arms of the Finno-Ugric tongues, a family
  that takes in Finnish and Estonian but not Hungarian.'
examples:
- Finnish and Estonian both belong to Baltic-Finnic.
- Baltic-Finnic is one of two arms of the Finno-Ugric tongues.
