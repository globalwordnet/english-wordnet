simpleMeaning: A member of an advanced group of theropod dinosaurs, including meat-eating forms. Birds
  are the group's living descendants.
scope: A late meat-eating dinosaur, not a plant-eating dinosaur and not a bird itself.
examples:
- The maniraptor hunted for meat.
- Birds are thought to come from the maniraptor line.
