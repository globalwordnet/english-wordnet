simpleMeaning: A number of protons or neutrons that gives an atomic nucleus exceptional stability. The
  numbers are 2, 8, 20, 28, 50, 82 and 126.
scope: A count of protons or neutrons associated with an especially stable atomic nucleus.
examples:
- The magic number 82 marks a very stable nucleus.
- Physicists found that the magic number 20 gives a stable atom.
