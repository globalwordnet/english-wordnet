simpleMeaning: A good or bad result that is fully earned and suits the case.
scope: Also called a comeuppance, a comeupance, or just deserts. It is a result.
examples:
- It was poetic justice when the cheat lost all their money.
- The poetic justice of the story pleased everyone.
