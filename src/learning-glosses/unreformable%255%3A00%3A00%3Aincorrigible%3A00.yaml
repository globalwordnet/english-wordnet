simpleMeaning: Said of a person who shows no sorrow for wrongdoing and cannot be changed for the better.
scope: Also called unregenerate. It is said of a person, not of a thing.
examples:
- The judge called the prisoner an unreformable criminal.
- Years in prison left the unreformable thief unchanged.
