simpleMeaning: A flood of words that keeps pouring out in a sick way, far more than is needed, and often
  with no clear sense.
scope: It is also called logomania.
examples:
- The patient's logorrhea filled the whole evening with talk.
- Logorrhea is hard to stop once it starts.
