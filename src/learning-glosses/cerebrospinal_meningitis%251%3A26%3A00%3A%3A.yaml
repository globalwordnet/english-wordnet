simpleMeaning: A sickness that makes the thin covers round the backbone and the brain swell up, brought
  on when germs get in, and that often ends in death.
scope: Brain fever, cerebrospinal fever and epidemic meningitis are other names for this sickness.
examples:
- The patient was rushed to hospital with cerebrospinal meningitis.
- The nurse watched for signs of cerebrospinal meningitis in the other children.
