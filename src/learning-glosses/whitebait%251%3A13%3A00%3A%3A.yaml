simpleMeaning: Small fish from fresh water or the sea, such as minnows, that people most often cook whole,
  above all herring.
scope: These are not only the young of herrings, sprats, and smelts.
examples:
- They cooked whitebait whole and ate the small fish for lunch.
- The cook fried whitebait whole and served the small fish hot.
