simpleMeaning: A tool for giving a sharp edge to a scythe, a long curved blade used to cut grass.
scope: It is a tool, not a rod for leveling grain in a measure or a tool for shaping a mold in sand.
examples:
- They used a strickle to sharpen the scythe before cutting the field.
- They sharpened the old scythe with a strickle and went out to the field.
