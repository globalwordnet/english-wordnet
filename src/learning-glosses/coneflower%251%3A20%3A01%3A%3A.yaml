simpleMeaning: Any of several long-lived eastern US plants with thick, rough leaves and showy, long-stalked
  flowers whose outer rays droop around a cone-shaped center.
scope: A plant of the eastern United States with showy flowers around a pointed middle, not the yellow
  daisy plant of the same name grown in gardens.
examples:
- Coneflower grew along the edge of the field.
- The coneflower had showy flowers with a pointed middle.
