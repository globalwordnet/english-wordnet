simpleMeaning: A land that depends on another land to run it, watched over by the United Nations.
scope: Trusteeship is another name for it; it is not a country that rules itself.
examples:
- The island was a trust territory until it chose its own government.
- The United Nations watched over the trust territory while the other country ran it.
