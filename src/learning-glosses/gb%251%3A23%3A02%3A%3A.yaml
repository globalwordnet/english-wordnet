simpleMeaning: A unit of information equal to 1,024 mebibytes, or 2 to the 30th power (1,073,741,824)
  bytes.
scope: A unit of information, also called gigabyte, gibibyte, G or GiB, not the decimal gigabyte of one
  thousand megabytes.
examples:
- The file is two GB in size.
- This drive holds 500 GB of data.
