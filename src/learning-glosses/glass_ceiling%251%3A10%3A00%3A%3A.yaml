senseId: 'glass_ceiling%1:10:00::'
synsetId: 06670658-n
simpleMeaning: An invisible barrier at work that keeps women and members of minority groups from reaching
  leadership positions because of unfair attitudes or practices.
scope: This is the hidden block at work that keeps women and members of small groups from the top jobs.
examples:
- The glass ceiling kept her from the top job.
- Many women face a glass ceiling at work.
