simpleMeaning: Any of several small blood vessels that drain blood from the gland at the front of the
  neck.
scope: Also called thyroid vein. It is a blood vessel, not an artery.
examples:
- The surgeon worked near the vena thyroidea during the operation on the neck.
- The doctor pressed on the vena thyroidea to slow the bleeding in the neck.
