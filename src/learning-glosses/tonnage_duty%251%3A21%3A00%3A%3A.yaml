simpleMeaning: A tax charged on ships that come into the United States, set by how big each ship is.
scope: Also called tonnage and tunnage. It is a tax on ships.
examples:
- The ship paid tonnage duty when it entered the port of New York.
- The new law raised the tonnage duty on ships entering the United States.
