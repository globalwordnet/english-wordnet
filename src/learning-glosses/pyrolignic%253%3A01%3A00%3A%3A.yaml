simpleMeaning: Said of something got from wood by heat, above all when the wood is heated with no air
  and breaks apart.
scope: Also called pyroligneous. It is an adjective.
examples:
- The pyrolignic oil was got from wood heated with no air.
- Pyrolignic tar comes from wood that is heated until it breaks apart.
