simpleMeaning: A negatively charged elementary particle with an average lifetime of about 2.2 microseconds
  that decays into an electron, a neutrino, and an antineutrino.
scope: Here the term refers to the negative muon.
examples:
- The mu-meson carries the same electric charge as an electron.
- The physicist measured the average lifetime of the mu-meson.
