simpleMeaning: A computer that records bets and shares out all the money bet between the winners.
scope: Also called totalisator, totaliser, totalizator, or totalizer. It is a computer.
examples:
- The pari-mutuel machine added up all the bets and worked out each winner's share.
- A clerk fed the day's bets into the pari-mutuel machine.
