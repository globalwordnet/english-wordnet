simpleMeaning: A way of saying things by going round about them, not straight at them.
scope: Also called circumlocution or periphrasis, this one is about words, not deeds.
examples:
- Their answer was full of ambage, circling the question without ever meeting it.
- The letter used ambage where a plain yes or no would have done.
