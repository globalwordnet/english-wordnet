simpleMeaning: The note G above middle C sits on the second line of a set of five lines when this sign
  is in place.
scope: Also called treble staff and G clef, this is a sign placed on the staff, not the set of lines itself.
examples:
- They found the G above middle C on the second line, where the treble clef put it.
- The treble clef showed them which line held the G above middle C.
