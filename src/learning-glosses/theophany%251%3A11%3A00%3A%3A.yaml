simpleMeaning: A god appears to a person in a form that can be seen, though what appears need not be made
  of matter.
scope: A person sees a god, though what they see need not be made of matter.
examples:
- They told others about the theophany they had seen with their own eyes.
- After the theophany, they said a god had come to them.
