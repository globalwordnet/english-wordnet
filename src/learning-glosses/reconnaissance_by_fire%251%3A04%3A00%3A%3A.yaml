senseId: 'reconnaissance_by_fire%1:04:00::'
synsetId: 00987602-n
simpleMeaning: Shooting at a place where the enemy may be hiding, to make them show themselves when they
  move or shoot back.
scope: This is a probing method that shoots at a suspected enemy position, unlike a strong attack sent
  in to test how strong the enemy is.
examples:
- The unit used reconnaissance by fire to make the enemy show themselves.
- The commander ordered reconnaissance by fire on the suspected position.
