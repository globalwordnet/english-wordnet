simpleMeaning: A boat built to carry goods packed in large metal boxes.
scope: Also called a container vessel and a containership; this one is about a boat for boxes of goods,
  not one for loose goods.
examples:
- The weight of the documentation of all the consignments on board a contemporary container ship can exceed
