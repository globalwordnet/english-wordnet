simpleMeaning: A condition in which bone loss leaves bones porous and fragile. Too little calcium can
  contribute. It is most common in women after menopause.
scope: Bone loss that leaves bones weak and full of holes, from too little calcium.
examples:
- Osteoporosis made her hip break in a small fall.
- The doctor checked her bones for osteoporosis.
