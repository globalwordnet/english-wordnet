simpleMeaning: The tendency to see a familiar object as its actual size even when viewing distance changes
  the size of its image on the retina.
scope: Of seeing a known thing at its true size, whatever its distance.
examples:
- Size constancy lets us see a known thing at its true size.
- Size constancy holds despite distance.
