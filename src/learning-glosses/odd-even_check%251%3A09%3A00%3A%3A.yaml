simpleMeaning: A check for computer errors that tests whether a group of bits contains the expected odd
  or even number of ones.
scope: Also called a parity check or a redundancy check. It is a noun.
examples:
- The odd-even check caught a fault in the data before the file was saved.
- They ran an odd-even check on the numbers the machine had stored.
