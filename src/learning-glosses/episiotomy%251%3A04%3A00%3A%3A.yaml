simpleMeaning: A surgical cut in the perineum, the area between the vaginal opening and anus, to widen
  the opening and ease childbirth.
scope: 'In childbirth surgery: a cut to widen the birth passage.'
examples:
- Their episiotomy eased the birth.
- The episiotomy was done at dawn.
