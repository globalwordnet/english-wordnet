simpleMeaning: A tropical timber tree of the Meliaceae family, especially the genus Swietenia, prized
  for hard yellowish-brown to reddish-brown wood that is easy to shape and polish.
scope: A tropical timber tree, not the wood it gives.
examples:
- Mahogany trees grow in the warm forests of Central America.
- The garden was planted with young mahogany trees.
