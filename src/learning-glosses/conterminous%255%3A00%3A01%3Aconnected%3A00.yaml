senseId: conterminous%5:00:01:connected:00
synsetId: 00568607-s
simpleMeaning: Said of places or things that lie against each other and touch along a shared edge, with
  one ending where the other begins.
scope: This one is also called adjacent, contiguous, neighboring, and neighbouring, and it is not about
  things that are equal in extent or time.
examples:
- The side of Germany conterminous with France touches France along a shared edge.
- The two fields are conterminous, sharing one long fence.
