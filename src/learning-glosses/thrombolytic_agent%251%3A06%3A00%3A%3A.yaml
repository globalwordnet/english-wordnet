simpleMeaning: By breaking up clots, this medicine can let blood reach the heart muscle.
scope: This drug is also called a clot buster and a thrombolytic, and it works on clots that are already
  there, not by stopping new ones from forming.
examples:
- A thrombolytic agent was given to break up the clot that was blocking blood flow to the heart muscle.
- They checked the blood flow to the heart muscle after the thrombolytic agent broke up the clot.
