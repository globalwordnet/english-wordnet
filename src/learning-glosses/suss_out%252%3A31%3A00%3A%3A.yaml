simpleMeaning: To probe a thing with care to learn how good or true it is, or what state it is in.
scope: It is also called check, check into, check out, check over, check up on, go over, and look into.
examples:
- They sussed out the fault before the car left the garage.
- The team sussed out the plan by reading every page twice.
