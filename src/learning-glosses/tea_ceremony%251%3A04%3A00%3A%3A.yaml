simpleMeaning: A very old set way of making a hot drink from dried leaves, giving it out, and drinking
  it.
scope: Also called chanoyu. It is a ritual, not a quick drink.
examples:
- They watched a tea ceremony in a quiet room.
- The tea ceremony took a long time, with each step done in order.
