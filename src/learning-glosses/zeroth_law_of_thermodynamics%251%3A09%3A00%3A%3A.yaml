simpleMeaning: The law before the first, about heat and energy, says two bodies at the same temperature
  as a third, with no heat passing between them, share it with each other.
scope: This one concerns two bodies and a third, not one body on its own.
examples:
- The zeroth law of thermodynamics is taught before the first law.
- Two cups of water at the same temperature as a third cup show the zeroth law of thermodynamics at work.
