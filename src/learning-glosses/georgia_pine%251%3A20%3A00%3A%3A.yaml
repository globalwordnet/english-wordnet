simpleMeaning: Large southeastern US pine with very long needles in threes and gnarled, twisted branches.
  Its reddish-brown bark has deep ridges. It is an important source of timber.
scope: 'Also called a longleaf pine, a pitch pine, a southern yellow pine, and Pinus palustris: a big
  three-needle tree of the south-east United States, not a short-needle tree.'
examples:
- Georgia pine grows tall in the south-east United States.
- We planted a Georgia pine behind the house.
