simpleMeaning: A South African tree with large, featherlike leaves that it sheds and many fragrant orange-yellow
  flowers. It yields red sap and heavy, strong wood that lasts well.
scope: This sense is also called kiaat.
examples:
- Bloodwood tree has orange-yellow flowers.
- Bloodwood tree gives red juice.
