simpleMeaning: A waxy mineral made of a mixture of hydrocarbons and found alongside petroleum. Some kinds
  are used to make ceresin, a refined wax, and candles.
scope: 'Also called ader wax, earth wax, ozocerite, and ozokerite: a wax from the ground found with oil.'
examples:
- Mineral wax oozed from the rocks.
- They made candles from mineral wax.
