simpleMeaning: A dangerous state in which too little blood or fluid reaches the body's organs, after severe
  loss of blood or fluid.
scope: This word is used of a dangerous state of the body.
examples:
- The accident victim went into hypovolemic shock after losing a lot of blood.
- Doctors treated the hypovolemic shock with fluids and blood.
