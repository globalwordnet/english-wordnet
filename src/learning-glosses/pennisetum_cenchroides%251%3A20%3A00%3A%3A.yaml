simpleMeaning: A grass that grows upright in thick clumps year after year. It has prickly seed heads and
  is widely grown to feed livestock, especially in South Africa and Australia.
scope: 'Also called buffel grass and Cenchrus ciliaris: a straight grass that grows in thick tufts, with
  spiky seed heads, much used in South Africa and Australia as food for farm animals.'
examples:
- The Pennisetum cenchroides stood in thick tufts on the dry plain.
- Farmers in Australia sow Pennisetum cenchroides for their sheep.
