simpleMeaning: An itchy rash of raised patches, sometimes pale in the middle with red edges, that can
  follow an allergic reaction to insect bites, food, or medicines.
scope: This sense is also called hives, nettle rash, and urticaria.
examples:
- Urtication itched and reddened the skin.
- An urtication came from a sting.
