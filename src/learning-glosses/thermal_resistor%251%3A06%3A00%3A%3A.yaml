senseId: 'thermal_resistor%1:06:00::'
synsetId: 04427341-n
simpleMeaning: A semiconductor component whose electrical resistance changes with temperature, allowing
  a circuit to compensate for temperature changes in other components.
scope: A part whose push-back shifts with heat, also called thermistor; it steadies other parts in a set
  of wires.
examples:
- The thermal resistor kept the radio steady as the room grew hot.
- A thermal resistor changes its push-back when the heat changes.
