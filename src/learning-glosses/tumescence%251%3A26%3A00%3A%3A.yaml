simpleMeaning: A part of the body grows bigger and fuller because blood or some other fluid has built
  up in it.
scope: This is a swelling in a part of the body.
examples:
- The arm showed tumescence after blood had built up inside it.
- Fluid gathering in the leg caused tumescence there.
