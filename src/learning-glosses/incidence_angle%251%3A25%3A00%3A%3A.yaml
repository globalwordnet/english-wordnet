simpleMeaning: The measure of the turn between a line and a second line standing square to a surface,
  taken where the first line meets it.
scope: Also called an angle of incidence.
examples:
- The incidence angle grows as the ray tilts away from the normal.
- They worked out the incidence angle before drawing the ray.
