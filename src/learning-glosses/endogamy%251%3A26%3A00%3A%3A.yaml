senseId: 'endogamy%1:26:00::'
synsetId: 13988398-n
simpleMeaning: The practice of taking a husband or wife only from one's own tribe or group, because custom
  or the law says so.
scope: Inmarriage and intermarriage are names for this sense.
examples:
- In some villages, endogamy is the rule, and people marry within their own group.
- The anthropologist wrote about endogamy in the village, where custom expected people to marry among
  their own.
