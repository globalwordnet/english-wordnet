simpleMeaning: A life-threatening reaction to infection that can damage organs, sometimes involving bacteria
  or their toxins in the blood or tissues.
scope: Germs that make pus, or the poisons they give off, present in the blood or tissues.
examples:
- The wound led to sepsis, and he was rushed to hospital.
- Doctors treated the sepsis with strong drugs to kill the germs.
