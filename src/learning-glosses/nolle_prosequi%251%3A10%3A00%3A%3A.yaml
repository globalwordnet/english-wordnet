senseId: 'nolle_prosequi%1:10:00::'
synsetId: 06517243-n
simpleMeaning: A note put in the court record saying that the person who brought the case, or the lawyer
  for the state, will not go on with it.
scope: Also called nol pros. It is the note itself, not the act of dropping a case.
examples:
- The state's lawyer filed a nolle prosequi when the main witness could not be found.
- The judge read the nolle prosequi aloud and closed the case.
