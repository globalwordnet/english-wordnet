simpleMeaning: Seeking knowledge by working to understand the meaning of single, unrepeatable events that
  could have been different and often rest on one person's view of them.
scope: Another name for this is idiographic approach.
examples:
- Idiographic science builds its knowledge from single cases studied in depth.
- Their work in idiographic science followed one family over many years.
