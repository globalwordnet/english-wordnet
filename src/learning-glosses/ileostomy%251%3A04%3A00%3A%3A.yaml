synsetId: 00682324-n
simpleMeaning: Surgery creating an opening from the ileum through the abdominal wall so stool can leave
  the body, used for conditions such as colon cancer or ulcerative colitis.
scope: An operation that makes a new way out for waste through the belly wall.
examples:
- After the ileostomy, waste left her body through the new opening.
- His ileostomy was done because of cancer of the colon.
