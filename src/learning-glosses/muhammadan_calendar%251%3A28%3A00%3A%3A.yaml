simpleMeaning: The Islamic lunar calendar counts years from the Hijra in AD 622. Its new year moves earlier
  through the seasons, circling them in roughly 33 solar years.
scope: The Hijra was Muhammad’s migration from Mecca to Medina.
examples:
- The Muhammadan calendar counts its years from 622 AD.
- The new year of the Muhammadan calendar falls earlier each solar year.
