simpleMeaning: A tall, stout herb of the genus Angelica with featherlike divided leaves and small white
  or greenish flowers in branching, umbrella-shaped clusters.
scope: Also called angelica, one of several stout, tall herbs of the genus Angelica whose leaves are leaflets
  set in a row on a stalk, with flowers small and white or pale green, in clusters of clusters.
examples:
- Angelique grows tall and stout.
- Angelique bears small white flowers.
