simpleMeaning: A state of the body in which the blood spreads badly and fails to reach all parts of it.
scope: It is about blood flow, not a sudden fright.
examples:
- The patient went into distributive shock after the infection spread.
- In distributive shock, the blood fails to reach the fingers and toes.
