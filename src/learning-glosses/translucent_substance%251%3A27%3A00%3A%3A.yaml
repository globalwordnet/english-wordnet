senseId: 'translucent_substance%1:27:00::'
synsetId: 15103117-n
simpleMeaning: A material that lets some light through but spreads it out, so things cannot be seen clearly
  through it.
scope: Transparent substance is another name for this sense, which is about a material that admits light,
  not one that shuts it out.
examples:
- Frosted glass is a translucent substance that lets light in but hides what is behind it.
- They used a translucent substance for the lamp cover so the light would spread out.
