simpleMeaning: The look or ways of an animal with hands and a face much like a person's, found in a person.
scope: Ape is another name for this sense, which is about a person, not about the animal itself.
examples:
- The clown's anthropoid walk made the crowd laugh.
- That anthropoid face reminded visitors of a monkey.
