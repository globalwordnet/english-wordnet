senseId: 'animadvert%2:32:00::'
synsetId: 01029677-v
simpleMeaning: Saying plainly what one thinks, with no fear and no holding back.
scope: Also called opine, sound off, speak out, or speak up, it is not silence and not blame, which is
  the other sense of this word.
examples:
- At the meeting, they animadverted on the plan without fear.
- They animadvert freely whenever the rules are discussed.
