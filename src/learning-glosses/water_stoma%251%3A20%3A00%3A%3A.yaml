senseId: 'water_stoma%1:20:00::'
synsetId: 13174524-n
simpleMeaning: A tiny hole in a leaf lets out the clear liquid that falls as rain, from the flat face
  or the edge, in plants with stems and leaves.
scope: A hydathode and a water pore are other names for this one, which never takes in the clear liquid
  that falls as rain.
examples:
- Drops came out of the water stomas on the edges of the leaves.
- The water stoma on the tip of the leaf gave off drops.
