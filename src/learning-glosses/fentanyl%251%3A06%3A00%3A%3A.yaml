simpleMeaning: A very strong opioid pain medicine, also sold under trade names; it acts on the central
  nervous system, can be addictive, and is used in surgery and by vets.
scope: Fentanyl is a strong opioid medicine. The frozen source misclassifies it as a trade name and gives
  an unsafe weapons claim.
examples:
- The vet gave the dog Fentanyl before the operation.
- Fentanyl is sometimes misused as a street drug.
