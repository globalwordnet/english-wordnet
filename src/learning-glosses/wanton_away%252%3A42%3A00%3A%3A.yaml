senseId: 'wanton_away%2:42:00::'
synsetId: 02713983-v
simpleMeaning: To spend time in a wasteful way, doing nothing useful.
scope: Also called trifle, wanton, piddle, and piddle away. It is said of time, not of money.
examples:
- Don't wanton away the whole afternoon - get started.
- They wantoned away their youth on idle games.
