senseId: 'death_rate%1:28:00::'
synsetId: 15302104-n
simpleMeaning: The number of lives that end in a place, set against the people living there, given for
  each thousand people each year.
scope: This one is also called deathrate, fatality rate, mortality, and mortality rate.
examples:
- The death rate in the town fell as living conditions got better.
- Officials watched the death rate each year.
