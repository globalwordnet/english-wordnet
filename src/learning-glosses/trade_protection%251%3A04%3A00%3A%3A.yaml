senseId: 'trade_protection%1:04:00::'
synsetId: 01130195-n
simpleMeaning: A government puts taxes or limits on goods from abroad to shield its own industries from
  outside competition.
scope: Also called protection, this is the taxes or limits a country puts on goods from abroad, not open
  buying and selling with no limits at all.
examples:
- They put trade protection in place to shield local firms from goods made abroad.
- The new trade protection set limits on goods from abroad.
