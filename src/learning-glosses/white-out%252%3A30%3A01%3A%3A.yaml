synsetId: 00547478-v
simpleMeaning: To lose sight of things in daylight when thick fog, snow, or rain hides them.
scope: This loss of daylight sight in thick fog, snow, or rain is also called a whiteout, not a loss of
  sight at night.
examples:
- In the heavy snow, we began to white-out and could no longer see the trail.
- Drivers can white-out in thick fog and lose sight of the road ahead.
