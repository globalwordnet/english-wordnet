senseId: 'demonetisation%1:04:00::'
synsetId: 00155905-n
simpleMeaning: The ending of a thing, such as gold or silver, as money that the law says people must take
  in payment.
scope: This one is also called demonetization.
examples:
- The demonetisation of silver coins left traders unsure what to accept.
- After the demonetisation, gold could no longer be used to pay taxes.
