simpleMeaning: An insulting slang term for a psychiatric hospital.
scope: This sense is also called madhouse, sanatorium, nuthouse, booby hatch, crazy house, cuckoo's nest,
  funny house, loony bin, nut house, snake pit, and Bedlam.
examples:
- The neighbours called the old hospital a funny farm.
- They spoke of the funny farm on the hill with a shudder.
