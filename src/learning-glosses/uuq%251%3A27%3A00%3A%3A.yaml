simpleMeaning: A former temporary symbol for flerovium, the radioactive element with atomic number 114.
scope: An element past uranium with the number one hundred and fourteen, also called atomic number 114,
  element 114, and ununquadium; not the lighter elements.
examples:
- Uuq has the atomic number 114.
- Uuq is a heavy element past uranium.
