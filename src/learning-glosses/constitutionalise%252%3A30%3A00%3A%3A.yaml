senseId: 'constitutionalise%2:30:00::'
synsetId: 00569738-v
simpleMeaning: To put something into the set of rules by which a country is governed, so that it becomes
  part of those rules.
scope: Constitutionalize is another name for this sense; this is about a country's rules, not about taking
  a walk.
examples:
- The country decided to constitutionalise free schooling in its basic law.
- Parliament voted to constitutionalise the right to clean water.
