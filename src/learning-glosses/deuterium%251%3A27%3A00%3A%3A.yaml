simpleMeaning: A form of hydrogen whose nucleus contains one proton and one neutron. Ordinary hydrogen
  has a proton but no neutron.
scope: Heavy hydrogen is another name for it.
examples:
- Deuterium has one neutron where plain hydrogen has none.
- Scientists use deuterium to study how water moves through the body.
