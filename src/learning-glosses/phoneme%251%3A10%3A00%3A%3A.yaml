simpleMeaning: A sound from the small group of speech sounds that speakers of one language hear as different
  from one another.
scope: It belongs to one language, not to every language.
examples:
- The phoneme at the start of 'pat' is different from the one at the start of 'bat'.
- In this language, the phoneme 'ng' at the end of 'sing' is one sound, not two.
