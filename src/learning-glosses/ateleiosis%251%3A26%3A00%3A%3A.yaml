simpleMeaning: The body does not grow to full size, though the mind works as it should.
scope: Also called ateliosis, this is a state of the body, not of the mind.
examples:
- The patient with ateleiosis stayed small as the years passed.
- They learned as fast as anyone at school, though ateleiosis kept their body small.
