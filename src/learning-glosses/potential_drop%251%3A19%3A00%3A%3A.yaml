simpleMeaning: A decrease in electrical energy per unit of charge from one point in a circuit to another,
  measured in volts.
scope: A meter can measure the drop across one part of a circuit.
examples:
- The meter showed a potential drop of two volts across the wire.
- They measured the potential drop across each lamp.
