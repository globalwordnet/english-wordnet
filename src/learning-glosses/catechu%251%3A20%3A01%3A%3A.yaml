simpleMeaning: A thorny East Indian tree with twice-divided leaves, yellow flowers, and flat pods that
  develop after flowering. It supplies black catechu.
scope: The tree itself, not the dark extract taken from it.
examples:
- Catechu grows wild in the dry hills of India.
- The catechu tree bore yellow flowers that spring.
