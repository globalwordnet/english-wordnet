simpleMeaning: A condition in which the kidneys cannot adequately remove waste or keep salts in the blood
  in balance.
scope: Also called kidney failure. It can develop suddenly or gradually.
examples:
- Renal failure left waste building up in his blood.
- The doctor treated her renal failure with a special diet.
