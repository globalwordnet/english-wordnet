simpleMeaning: Describing a lifeless thing or an animal that is shown with a person's feelings, looks,
  or ways.
scope: This sense is also called anthropomorphic, and humanlike is another name for the same sense.
examples:
- The old fable is full of anthropomorphous trees that whisper warnings to travellers.
- In the picture, anthropomorphous clouds wear frowning faces.
