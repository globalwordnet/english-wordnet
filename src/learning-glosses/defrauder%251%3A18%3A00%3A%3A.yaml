simpleMeaning: A person who cheats you by tricking you or by lying to you.
scope: This person is also called a swindler, a grifter, a scammer, a chiseler, a chiseller, or a gouger.
examples:
- The defrauder tricked the buyer into paying for work that was never done.
- The defrauder sold goods that did not exist and kept the money.
