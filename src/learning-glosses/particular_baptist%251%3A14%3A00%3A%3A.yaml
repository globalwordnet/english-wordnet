simpleMeaning: Baptist congregations that follow the French theologian John Calvin's teaching on predestination,
  the belief that God has already determined who will be saved.
scope: 'Also called Calvinistic Baptist: a group of churches that follow the teaching of John Calvin,
  a French church teacher who taught that all is fixed in advance.'
examples:
- The Particular Baptist church in town follows Calvin's teaching.
- She joined a Particular Baptist congregation that holds to strict predetermination.
