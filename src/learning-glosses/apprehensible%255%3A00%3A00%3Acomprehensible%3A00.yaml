simpleMeaning: Said of something that can be taken in by the mind, or made sense of.
scope: This sense is also called understandable, intelligible, graspable, and perceivable.
examples:
- The idea was apprehensible to anyone who read the short note.
- They made the rules apprehensible by giving clear examples.
