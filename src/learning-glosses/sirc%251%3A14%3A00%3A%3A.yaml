simpleMeaning: A former Canadian government committee that reviewed the activities of the Canadian Security
  Intelligence Service, including investigations involving privacy and national security.
scope: This is a Canadian government body that watches the country's criminal spy services; Security Intelligence
  Review Committee is another name for it, and its nearest neighbours are Canada's other government watch
  bodies.
examples:
- SIRC looked into the spy service's work.
- A complaint went to SIRC.
