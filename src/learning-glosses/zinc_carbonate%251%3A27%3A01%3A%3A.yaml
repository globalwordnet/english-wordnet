simpleMeaning: Zinc carbonate (ZnCO3), a compound used in skin dusting powders for its mild tightening
  effect on the skin.
scope: A mild powder that tightens the skin, put on the skin in dusting powders; not a talc and not a
  cream.
examples:
- Zinc carbonate is dusted on the skin to tighten it.
- The powder contained zinc carbonate.
