simpleMeaning: A worker whose work is taking the money paid for passing.
scope: Also called toll agent, toll collector, toll taker, tollgatherer, and tollkeeper. It is not the
  person who rings church bells.
examples:
- The toller lifted the barrier after the driver paid.
- They spoke to the toller about the price.
