simpleMeaning: The part of the study of human life that looks at the customs of peoples and the groups
  they form.
scope: Also called cultural anthropology. It is a field of study.
examples:
- Social anthropology looks at how peoples live and how their customs differ.
- They took a course in social anthropology at the university.
