simpleMeaning: The sudden, unexpected death of an apparently healthy infant during sleep that remains
  unexplained after investigation.
scope: Cot death, crib death, infant death, and SIDS are other names for it.
examples:
- They lost their baby to sudden infant death syndrome.
- The baby died in sleep from sudden infant death syndrome.
