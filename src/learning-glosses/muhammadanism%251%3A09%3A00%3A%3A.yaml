simpleMeaning: An older name for Islam, a religion with one God, founded in Arabia in the seventh century
  and based on the teachings of Muhammad in the Quran.
scope: This is the faith itself, not its people or its holy book alone; also called Islam, Islamism, Mohammedanism
  and Muslimism.
examples:
- Muhammadanism began in Arabia in the 7th century.
- The teachings of Muhammad lie at the heart of Muhammadanism.
