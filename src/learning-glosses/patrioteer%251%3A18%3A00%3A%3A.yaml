simpleMeaning: A person who loves their own country in an extreme way and is eager for war with other
  countries.
scope: Also called a chauvinist, a flag-waver, a hundred-percenter, a jingo, or a jingoist. It is a person.
examples:
- The patrioteer cheered every call for war.
- A patrioteer sees every other country as an enemy.
