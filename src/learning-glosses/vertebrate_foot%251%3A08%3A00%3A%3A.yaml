simpleMeaning: The far end of a leg or an arm in an animal with a backbone.
scope: Also called pedal extremity. It is a part of the body, not a whole leg or arm.
examples:
- The frog's vertebrate foot pushed against the mud as it jumped.
- A bird stands on its vertebrate foot when it lands.
