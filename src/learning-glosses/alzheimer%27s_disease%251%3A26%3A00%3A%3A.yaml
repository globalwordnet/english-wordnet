simpleMeaning: Progressive dementia that in its early-onset form can begin in the forties or fifties.
  Memory usually declines first, followed by thinking and speech, eventually leading to complete dependence
  on others.
scope: Also called Alzheimer's and Alzheimers; a disease of the mind that slowly worsens from the forties
  or fifties to full helplessness, unlike the loss of mind that only comes with old age.
examples:
- Her grandmother's Alzheimer's disease began with forgetting names.
- Alzheimer's disease took his memory first, then his speech.
