simpleMeaning: A digitalis drug sold as Lanoxin, used to treat congestive heart failure and irregular
  heart rhythms. It helps the heart beat more strongly.
scope: A digitalis preparation, trade name Lanoxin, for heart failure or arrhythmia.
examples:
- Their digoxin steadied the heart.
- The digoxin was given at noon.
