simpleMeaning: A mouth-like opening, especially one made by surgery through the skin so that an organ
  inside the body can be reached.
scope: It is an opening made by surgery, not a tiny pore in a leaf or stem.
examples:
- After the operation, a stoma was made in the patient's belly.
- The nurse cleaned the skin around the stoma.
