simpleMeaning: Using, containing, or resembling an allegory, a story in which people and events stand
  for ideas.
scope: Also called allegoric, this one is not about a tale that means just what it says.
examples:
- The allegorical story was really about how power corrupts.
- They read the allegorical poem as a warning about pride.
