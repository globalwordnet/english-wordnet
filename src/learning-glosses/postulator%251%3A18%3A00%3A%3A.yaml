senseId: 'postulator%1:18:00::'
synsetId: 10477010-n
simpleMeaning: A person who takes a claim as true without proof, to build an argument on it.
scope: It is not the church sense, one who puts forward a candidate for sainthood.
examples:
- The postulator began the talk by taking one claim as true.
- As a postulator, they took the first claim as true and built on it.
