simpleMeaning: An orchid with spikes of fragrant white flowers on upright leafy stems, found in wetlands
  across much of western and northern North America.
scope: This sense is also called bog candles, an orchid from wet, boggy ground across most of the West
  and north North America, its leafy upright stems bearing many scented white blooms in spikes.
examples:
- Bog rein orchids bloom white on wet ground.
- The bog rein orchid grows on leafy stems.
