simpleMeaning: A title for one small part of a piece of writing, printed among the words of the writing
  itself.
scope: Crossheading is another name for this thing.
examples:
- The crosshead told the reader that a new part of the chapter had begun.
- The writer put a crosshead above the first words of the new section.
