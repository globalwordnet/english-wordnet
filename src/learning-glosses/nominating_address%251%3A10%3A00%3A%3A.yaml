simpleMeaning: A speech, usually given at a political convention, that puts forward a person's name as
  someone to stand for election.
scope: Also called nomination or nominating speech. It is a speech.
examples:
- The nominating address lasted only five minutes but won the hall over.
- The nominating address put the party's choice for governor before the convention.
