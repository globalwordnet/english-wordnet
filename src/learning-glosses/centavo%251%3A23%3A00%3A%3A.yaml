synsetId: 13687361-n
simpleMeaning: A subdivision of currency, usually one hundredth of the main unit, used in several Latin
  American countries and the Philippines, and formerly in Portugal and elsewhere.
scope: This is a small money unit used in several countries, not the main money unit itself and not the
  centime of France and other lands.
examples:
- The price was fifty centavos.
- He paid in centavos at the market in Mexico.
