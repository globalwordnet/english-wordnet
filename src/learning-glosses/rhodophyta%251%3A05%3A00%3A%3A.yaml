simpleMeaning: Red algae, once grouped among the lower plants. Their cells have nuclei, and most species
  live in the sea, often near shore.
scope: A group of lower plants, mostly marine and shore-living algae, also called division Rhodophyta,
  and not the higher plants with true roots and leaves.
examples:
- Rhodophyta grows on rocks by the sea.
- Rhodophyta includes the algae that grow on the shore.
