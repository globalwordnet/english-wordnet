senseId: 'morpheme%1:10:00::'
synsetId: 06317223-n
simpleMeaning: The smallest unit of language with a meaning or grammatical function, such as dog or the
  plural ending in dogs. It has no smaller meaningful parts.
scope: The smallest bit of language that means something, not a whole word and not a letter with no meaning
  of its own.
examples:
- The morpheme 'un-' in 'unhappy' means 'not'.
- Each morpheme in the word carries its own bit of meaning.
