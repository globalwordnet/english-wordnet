simpleMeaning: One of many kinds of quick, watchful lizard found in the New World.
scope: Also called a whiptail lizard, this creature is one of numerous very agile and alert kinds of the
  New World, not a slow kind from the Old World.
examples:
- They spotted a whiptail darting across the hot sand before it vanished under a rock.
- They watched a whiptail pause, lift its head, and then race off through the dry grass.
