simpleMeaning: A narrow space at the front of the body, between the large outer folds of a woman's sex
  organs.
scope: Also called pudendal cleavage, pudendal cleft, pudendal slit, rima pudendi, rima vulvae, and vulvar
  slit. It is a part of the female body.
examples:
- The doctor pointed out the urogenital cleft on the diagram.
- The anatomy textbook labels the urogenital cleft in its drawing of the female body.
