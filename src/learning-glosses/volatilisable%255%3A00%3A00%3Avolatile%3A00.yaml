simpleMeaning: Used of a substance that can rise into the air as a gas.
scope: Also called evaporable, vaporific, vaporizable, vapourific, vapourisable, and volatilizable. It
  is said of a substance, not of a person.
examples:
- Alcohol is a volatilisable liquid that vanishes quickly from an open dish.
- The chemist stored the volatilisable solvent in a sealed jar.
