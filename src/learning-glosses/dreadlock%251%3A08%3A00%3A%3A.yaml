senseId: 'dreadlock%1:08:00::'
synsetId: 05266226-n
simpleMeaning: One of many long, ropelike locks of hair formed as strands mat together. Rastafarians helped
  popularize the style.
scope: One long thin braid of hair in this style, not loose hair and not one thick braid that covers the
  whole head.
examples:
- He wears his hair in long dreadlocks.
- One dreadlock fell over her shoulder.
