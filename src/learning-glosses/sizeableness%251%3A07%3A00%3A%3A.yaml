senseId: 'sizeableness%1:07:00::'
synsetId: 05111848-n
simpleMeaning: Largeness well past what is usual, in how much room a thing takes, how far it spreads,
  or how many there are.
scope: Also called greatness, vastness, immensity, grandness, wideness, enormousness, and immenseness.
  It is a noun.
examples:
- The sizeableness of the hall surprised them.
- They marvelled at the sizeableness of the harvest.
