simpleMeaning: If you look at a tall woody plant, this is one of the large parts that come off its main
  stem or off another large part.
scope: Also called limb, this is a main part that grows from the trunk or a bough, not a small twig.
examples:
- They cut the tree branch back to the trunk.
- A tree branch grew out of a bough.
