simpleMeaning: This Asian bush or small tree is large and showy, and its big flowers, single or double,
  are red or deep red.
scope: Shoe black, China rose, Chinese hibiscus, Hibiscus rosa-sinensis, and Rose of China are other names
  for this bush or small tree, whose big flowers, single or double, are red or deep red.
examples:
