synsetId: 11557018-n
simpleMeaning: A plant that forms seeds with no joining of male and female cells, or is grown from such
  seeds.
scope: This is not about a plant that needs male and female cells to join before it can make seeds.
examples:
- The apomict spread across the field from a single parent plant.
- They found an apomict among the grasses that kept its form from one year to the next.
