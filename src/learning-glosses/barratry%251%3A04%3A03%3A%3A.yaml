simpleMeaning: Buying and selling church posts or the favours that come with them.
scope: Also called simony, this one is about the church, not about a judge or a ship.
examples:
- The bishop was accused of barratry for selling church offices.
- The reformers denounced barratry wherever church posts changed hands for money.
