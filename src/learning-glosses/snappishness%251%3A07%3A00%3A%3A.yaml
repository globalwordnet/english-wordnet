simpleMeaning: A way of being in which anger breaks out again and again, with no check on it.
scope: Temper, irritability, peevishness, surliness, biliousness, and pettishness are other names for
  this way of being, in which anger breaks out again and again.
examples:
- His snappishness was well known to everyone at work.
- They had learned to expect his snappishness.
