simpleMeaning: A brand of lithium carbonate, a white powder used in glass and ceramics. As a medicine
  it treats mania and some forms of depression, under names including Lithane and Lithonate.
scope: A white powder drug, also called lithium carbonate, Lithane, and Lithonate.
examples:
- The doctor prescribed Eskalith for her depression.
- Eskalith comes as a white powder pressed into tablets.
