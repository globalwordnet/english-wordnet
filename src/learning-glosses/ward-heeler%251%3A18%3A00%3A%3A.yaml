senseId: 'ward-heeler%1:18:00::'
synsetId: 10298502-n
simpleMeaning: A small group is in charge of a party for its own ends, not the people's, and this politician
  is one of them.
scope: This is also called a hack, a machine politician, or a political hack, and it is not a politician
  who works for the good of all.
examples:
- The ward-heeler did what the small group told them, keeping the party under its control.
- People said the ward-heeler cared more for the group's own gain than for the voters.
