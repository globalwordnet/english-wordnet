simpleMeaning: Someone with normal color vision in one eye and two working types of color receptor in
  the other. This rare difference helps researchers study color vision.
scope: This is a person with eyes that see in different ways, not a person whose two eyes see alike.
examples:
- With one eye the uniocular dichromat saw the full range of colours, and with the other only two.
- The team asked the uniocular dichromat to look at the colour charts with each eye in turn.
