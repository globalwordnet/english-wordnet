synsetId: 06045687-n
simpleMeaning: A statistical link between two things that arises because both relate to another factor.
scope: For a link between two things with no straight tie between them, only ties to other things.
examples:
- A spurious correlation links motors and marks.
- Spurious correlations fool us.
