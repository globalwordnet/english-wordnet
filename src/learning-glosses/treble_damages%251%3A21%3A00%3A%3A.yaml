simpleMeaning: The sum a court makes one side pay, three times what the hurt side would usually get.
scope: It is a kind of payment.
examples:
- The judge awarded treble damages to the shop owner who had been cheated.
- The court ordered treble damages, three times the loss the shop had suffered.
