simpleMeaning: Another name for tungsten, a heavy gray-white metal found in ores including wolframite
  and scheelite. Pure tungsten is used in electrical equipment.
scope: A heavy grey-white metal used most of all in electric work, close to other heavy grey metals, and
  found in several ores; also called W, tungsten and atomic number 74.
examples:
- Wolfram is used in the thin wires of old light bulbs.
- Miners dug wolfram from the hard rock.
