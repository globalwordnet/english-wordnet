senseId: 'demurrer%1:04:00::'
synsetId: 01201240-n
simpleMeaning: A reply in court in which the person charged says the charges are not true.
scope: This one is also called defense, denial, and defence, and it is the charged person's own reply,
  not a formal objection to the other side's papers.
examples:
- The demurrer was filed before the trial began.
- The judge read the demurrer and set a date to hear it.
