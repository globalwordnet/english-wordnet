simpleMeaning: Said of an idea or a plan that is plain and easy to tell apart from others.
scope: It is about an idea in the mind, not a thing seen or heard.
examples:
- The report gave clear-cut evidence that the lock had been forced.
- They drew a clear-cut line between right and wrong.
