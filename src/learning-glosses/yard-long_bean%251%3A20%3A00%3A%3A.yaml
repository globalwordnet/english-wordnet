simpleMeaning: A bean with very long, juicy pods, grown in South America and elsewhere.
scope: This one is also called an asparagus bean, Vigna sesquipedalis, and Vigna unguiculata sesquipedalis.
examples:
- They grew a yard-long bean in the garden and picked pods nearly three feet in length.
- The yard-long bean in their garden had pods so long they trailed on the ground.
