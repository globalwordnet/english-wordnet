simpleMeaning: Said of a claim that does not follow sound reasoning, and so does not hold together.
scope: Also called illogical. It is a word for a claim or an argument.
examples:
- The unlogical argument fell apart as soon as the speaker tried to explain it.
- A single unlogical step can spoil a whole proof.
