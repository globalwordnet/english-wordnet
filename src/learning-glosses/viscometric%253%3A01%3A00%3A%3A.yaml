simpleMeaning: Said of a thing that has to do with measuring how thick a liquid is, or how slowly it flows.
scope: Also called viscosimetric. It is said of a thing, not of a person.
examples:
- The viscometric test took an hour to run.
- A viscometric reading showed the oil was thick.
