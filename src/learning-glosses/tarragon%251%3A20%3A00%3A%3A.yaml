simpleMeaning: A strong-smelling plant from the south-east of Russia that lives for years.
scope: This is also called estragon or Artemisia dracunculus, and it is the plant itself, not its leaves
  used to flavour food.
examples:
- The tarragon in the south-east of Russia comes back year after year.
- The strong smell of tarragon lasts through the years.
