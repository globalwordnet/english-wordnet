simpleMeaning: The angle across the part of a scene a camera lens can capture.
scope: Also called view angle, it belongs to the lens, not to the scene.
examples:
- With a wide angle of view, the lens took in the whole beach at once.
- They chose a lens with a narrow angle of view for the close shots of birds.
