simpleMeaning: A fortune-teller who claims to predict the future by reading the lines on a person's palms.
scope: Also called a chiromancer or a palmist. It is a person.
examples:
- The palmister studied the lines on my hands and said I would travel far.
- They went to a palmister to hear what the lines on their hands might mean.
