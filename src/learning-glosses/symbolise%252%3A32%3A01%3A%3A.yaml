senseId: 'symbolise%2:32:01::'
synsetId: 00989629-v
simpleMeaning: A thing gets a sign that names it or stands for it.
scope: This sense is the act of using a sign to stand for a thing, also called symbolize, not the act
  of showing a thing in a roundabout way through a picture, a shape, or a model.
examples:
- The poet chose to symbolise love in this poem.
- These painters believed that artists should symbolise.
