synsetId: 02012080-v
simpleMeaning: To go up until it can go no higher, and to reach its greatest strength and busiest state.
scope: Also called peak. It is not about going down.
examples:
- Sales topped out in June and never went higher.
- Bids for the painting topped out at $50 million.
