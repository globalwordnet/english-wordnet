simpleMeaning: A new lump of tissue that grows in a way that is not normal and does nothing useful for
  the body.
scope: Also called tumor or tumour. It is a lump of tissue, not the process that makes it.
examples:
- The scan showed a neoplasm in one lung.
- Doctors removed the neoplasm and sent it for tests.
