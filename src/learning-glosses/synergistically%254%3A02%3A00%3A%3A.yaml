senseId: 'synergistically%4:02:00::'
synsetId: 00518214-r
simpleMeaning: In a way where drugs or muscles join their work and each makes the other stronger.
scope: This word marks drugs or muscles acting as one, each one making the other stronger, not the way
  a group acts together.
examples:
- The drugs acted synergistically, and together they had a stronger effect than either one on its own.
- The muscles worked synergistically, and together they gave more power than either one on its own.
