simpleMeaning: A recurring stage of sleep without rapid eye movements, during which dreaming is possible.
  It accounts for about three quarters of normal sleep time.
scope: Also called nonrapid eye movement, nonrapid eye movement sleep, orthodox sleep and NREM; a sleep
  state with no quick eye moves and no dreams, not the sleep state with quick eye moves and dreams.
examples:
- NREM sleep takes up most of the night's sleep.
- During NREM sleep, her eyes stayed still and she did not dream.
