simpleMeaning: To win a person's favor, often with behavior that is not honest.
scope: Also called cotton up, cozy up, play up, shine up, or sidle up. It is a way of behaving toward
  a person, not a way of taking in liquid.
examples:
- They suck up to the chairman with false praise.
- They were sucking up to the boss, saying things they did not mean.
