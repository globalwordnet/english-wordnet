simpleMeaning: An arrangement of wheels inside a machine, especially a series of connected gears.
scope: This mechanical device is an arrangement of round parts inside a machine, above all a set of gears,
  not the machine itself.
examples:
- The old clock stopped because the wheelwork inside it had worn down.
- They opened the back of the watch to look at the wheelwork turning the hands.
