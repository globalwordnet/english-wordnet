simpleMeaning: The separation of a liquid into its parts by heating it until it turns to vapour and then
  cooling the vapour back into liquid.
scope: This one is about a process.
examples:
- The plant uses fractional distillation to separate crude oil into petrol and diesel.
- Chemists use fractional distillation to split a mix of liquids by their boiling points.
