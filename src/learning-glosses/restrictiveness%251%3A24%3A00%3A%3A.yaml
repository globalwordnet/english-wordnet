senseId: 'restrictiveness%1:24:00::'
synsetId: 13823252-n
simpleMeaning: In grammar, how a word or phrase makes a meaning more exact, as 'red hat' means something
  narrower than 'hat'.
scope: This is the grammar term for how a word or phrase makes a meaning more exact, not a strict way
  of keeping behaviour within set limits.
examples:
- The restrictiveness of 'red' in 'red hat' narrows the meaning to one kind of hat.
- Without that restrictiveness, 'hat' could mean any hat at all.
