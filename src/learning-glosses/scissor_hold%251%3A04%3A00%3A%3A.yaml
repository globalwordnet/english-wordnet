simpleMeaning: In wrestling, the feet meet as the legs wind round the other person's body or head and
  press tight.
scope: This is also called scissors, scissor grip, scissors grip and scissors hold, and it traps the other
  person with the legs alone.
examples:
- The wrestler trapped the other in a scissor hold.
- A scissor hold held the other wrestler fast.
