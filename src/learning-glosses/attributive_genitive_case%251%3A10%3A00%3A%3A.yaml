simpleMeaning: The form a word takes when it shows whose a thing is and stands before a noun to tell us
  more about it.
scope: Attributive genitive is another name for this sense.
examples:
- '''Mary''s'' in ''Mary''s book'' is an attributive genitive case.'
- The teacher called 'Mary's' an attributive genitive case in 'Mary's book'.
