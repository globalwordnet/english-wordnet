simpleMeaning: Short for patrol torpedo boat, a small, fast torpedo boat with light armament and no armor.
scope: Also called mosquito boat, mosquito craft, and motor torpedo boat; a small fast war craft with
  light guns built to fire torpedoes.
examples:
- The PT boat raced across the bay to fire its torpedoes.
- A PT boat carried light guns and no armour.
