simpleMeaning: A place where goods sell for less than the usual price.
scope: This place is also called discount house, discount store, and discounter, and it is not a shop
  that sells at full price.
examples:
- They bought the chairs from a wholesale house for less than the shop price.
- They went to the wholesale house to buy chairs for the new office.
