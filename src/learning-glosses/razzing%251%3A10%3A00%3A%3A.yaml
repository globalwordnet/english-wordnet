simpleMeaning: a burst of mocking noise, sounded to show scorn for what has just happened
scope: Also called a bird, a hiss, a snort, a hoot, a boo, a raspberry, a razz and a Bronx cheer, it is
  a burst of mocking noise sounded to show scorn.
examples:
- The razzing from the crowd grew louder after the bad call.
- The speaker left the stage to a chorus of razzing.
