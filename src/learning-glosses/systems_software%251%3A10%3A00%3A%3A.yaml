simpleMeaning: This software takes charge of part of a computer's work, whether the main orders that run
  it, a tool that turns code into machine orders, or a helper tool.
scope: This is also called system program or systems program.
examples:
- The systems software runs the printer and the disk while you work.
- The systems software manages the disk and the screen.
