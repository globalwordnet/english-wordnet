simpleMeaning: A bird resembling a larger eastern kingbird that breeds in the southeastern United States
  and spends winter in tropical America.
scope: Grey kingbird and petchary are other names for this kingbird, which is bigger than the eastern
  kingbird.
examples:
- The gray kingbird spent the winter in tropical America.
