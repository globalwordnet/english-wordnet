simpleMeaning: A noblewoman who holds, in her own right, the noble rank just below an earl and above a
  baron.
scope: It is a title of the peerage, not one gained by marriage.
examples:
- The viscountess opened the new hall in person.
- The viscountess took her seat in the upper house.
