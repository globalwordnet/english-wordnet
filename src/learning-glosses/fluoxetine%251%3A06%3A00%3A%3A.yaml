simpleMeaning: An antidepressant sold as Prozac or Sarafem. It slows the reabsorption of serotonin, leaving
  more of this chemical available to carry signals between brain cells.
scope: A drug given to lift low mood, also called fluoxetine hydrocholoride, not a drug that puts a person
  to sleep.
examples:
- Her doctor gave her fluoxetine for her low mood.
- Fluoxetine is sold under the name Prozac.
