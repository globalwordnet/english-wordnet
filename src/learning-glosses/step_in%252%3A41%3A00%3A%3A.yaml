simpleMeaning: To get involved so as to change or hold back what someone is doing, or by using force or
  the threat of force.
scope: It is also called interfere, intervene, or interpose.
examples:
- They had to step in when the argument got worse.
- They stepped in to stop the fight before anyone got hurt.
