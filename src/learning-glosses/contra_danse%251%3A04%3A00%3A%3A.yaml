senseId: 'contra_danse%1:04:00::'
synsetId: 00540158-n
simpleMeaning: A folk form in which couples gather in groups, or stand in a line facing one another, and
  move to music.
scope: This one is also called contradance, contredanse, country dancing, and country-dance; it names
  a form, not the act of performing it.
examples:
- The couples formed two lines for the contra danse.
- They learned the steps of the contra danse in one afternoon.
