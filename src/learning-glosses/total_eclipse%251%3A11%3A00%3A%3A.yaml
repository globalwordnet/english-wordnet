senseId: 'total_eclipse%1:11:00::'
synsetId: 07383806-n
simpleMeaning: The blocking of the light of one body in the sky by another, seen from a place where the
  covered body is hidden from sight in full.
scope: It is not one in which the body is only partly hidden.
examples:
- We watched the total eclipse from the hill.
- The total eclipse hid the moon from sight for an hour.
