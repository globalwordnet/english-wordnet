senseId: 'anastomotic%3:01:00::'
synsetId: 02959700-a
simpleMeaning: To do with, or showing, a joining of two tubes or blood vessels.
scope: This is not about two tubes that stay apart with no join between them.
examples:
- The surgeon checked the anastomotic join where the two blood vessels had been sewn together.
- The report described the anastomotic link between the two tubes that now carried blood as one path.
