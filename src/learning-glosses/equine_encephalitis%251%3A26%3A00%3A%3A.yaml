senseId: 'equine_encephalitis%1:26:00::'
synsetId: 14366287-n
simpleMeaning: Brain inflammation caused by a virus carried by mosquitoes that have bitten an infected
  horse.
scope: This is a swelling of the brain brought on by a germ from a sick horse; equine encephalomyelitis
  is another name for this sense, not a swelling of the brain from a head blow and not a horse sickness
  spread by touch.
examples:
- The horse died of equine encephalitis after the mosquito season.
- Vets watch for equine encephalitis when mosquitoes are thick.
