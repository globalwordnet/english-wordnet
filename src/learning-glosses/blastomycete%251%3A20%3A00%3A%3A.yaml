simpleMeaning: Any of several yeastlike fungi of the genus Blastomyces that reproduce by budding and cause
  disease in humans and other animals.
scope: These tiny yeast-like living things grow by budding and cause sickness in people and other animals.
examples:
- A blastomycete can cause sickness in people and other animals.
- A blastomycete grew by budding and made the animals sick.
