simpleMeaning: An American songbird known for imitating other birds' songs, formerly grouped with the
  wood warblers.
scope: Also called Icteria virens, this one is the warbler that copies the songs of other birds, unlike
  other warblers.
examples:
- They heard a yellow-breasted chat copying the call of a robin in the bushes.
- A yellow-breasted chat sang from the top of the bush, copying one bird after another.
