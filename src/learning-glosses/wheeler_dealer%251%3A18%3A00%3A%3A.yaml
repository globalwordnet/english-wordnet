simpleMeaning: A dealer who makes things happen by finding a way around problems, whether by cleverness
  or by dishonest moves.
scope: Also called an operator or a hustler, this person works around problems with cleverness or with
  moves that bend the rules.
examples:
- When the bank said no, the wheeler dealer still found a way to push the sale through.
- They knew the wheeler dealer would find some way to close the deal, even when the rules stood in their
  way.
