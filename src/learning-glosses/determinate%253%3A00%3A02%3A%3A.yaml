senseId: 'determinate%3:00:02::'
synsetId: 00744659-a
simpleMeaning: Said of growth that stops at the tip and does not go on growing without end.
scope: This one is about growth that stops, not about something fixed by a rule or a final settlement.
examples:
- The determinate growth of the shoot stopped at the tip.
- The gardener noted the determinate growth of the plant.
