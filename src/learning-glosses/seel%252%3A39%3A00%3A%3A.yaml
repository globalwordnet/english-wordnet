simpleMeaning: To stitch a hawk's or falcon's lids together so the bird cannot see.
scope: Only a hawk's or a falcon's lids are stitched in this way.
examples:
- Its eyelids were seeled, and the hawk could not see.
- The falcon's eyelids were seeled shut.
