simpleMeaning: In the forest of the eastern United States grows a poppy with yellow flowers that comes
  back year after year.
scope: This one is also called celandine poppy and Stylophorum diphyllum, and it grows in a forest, unlike
  one of open fields.
examples:
- They found a wood poppy with yellow flowers growing in the forest behind the house.
- The wood poppy comes back every spring in the same shady corner.
