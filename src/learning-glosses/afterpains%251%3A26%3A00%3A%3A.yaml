simpleMeaning: Pains a woman feels once her baby is born, tied to the tightening of the part of her body
  where the baby grew.
scope: This one is not about the hurt of giving birth itself.
examples:
- The afterpains came on the next day, once her baby was born.
- She felt the afterpains most when she held her newborn baby.
