simpleMeaning: A name added after a person's own name, or a word put after it, as in 'Ferdinand the Great'.
scope: This one comes after the name, not before it.
examples:
- The name 'the Great' is an agnomen added after Ferdinand's name.
- The old soldier earned an agnomen that told of their bravery.
