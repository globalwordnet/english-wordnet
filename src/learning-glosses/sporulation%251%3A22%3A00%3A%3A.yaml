senseId: 'sporulation%1:22:00::'
synsetId: 13538402-n
simpleMeaning: Making new living things with no mating, from cells that are made, let go, and grow into
  new ones.
scope: Also called monogenesis. It is a process, not a thing.
examples:
- Sporulation lets the fungus spread without a mate.
- The mould spread by sporulation.
