simpleMeaning: A light, silver-white, ductile metal forming doubly charged ions. Pure magnesium burns
  brilliant white. Naturally it occurs in compounds, including magnesite, dolomite, carnallite, spinel,
  and olivine.
scope: Not aluminium or calcium; also called Mg and atomic number 12.
examples:
- Magnesium burns with a bright white flame.
- Magnesium is found in dolomite rock.
