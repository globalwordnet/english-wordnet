senseId: 'due_care%1:04:00::'
synsetId: 01134115-n
simpleMeaning: The attention a sensible person would give in the same situation, used as the measure of
  what the law asks of a person.
scope: This one is also called ordinary care and reasonable care.
examples:
- The court said the driver had not taken due care on the wet road.
- The judge asked whether the company had taken due care before the accident.
