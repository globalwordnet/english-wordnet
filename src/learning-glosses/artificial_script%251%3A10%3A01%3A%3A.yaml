simpleMeaning: A new writing system made on purpose by one person or a group, not one that grew on its
  own inside a language or a culture.
scope: Also called constructed script, this is a writing system, not a natural one.
examples:
- Balin-Silel is an artificial script made up in 2014 to write a made-up language.
- The artificial script was drawn up by a small group of friends.
