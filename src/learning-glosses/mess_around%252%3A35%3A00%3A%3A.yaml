simpleMeaning: To do odd jobs or other things with no plan, or to let the time pass with nothing useful
  done.
scope: Monkey, tinker, potter, putter, monkey around, muck about, and muck around are other names for
  it.
examples:
- They spent the whole afternoon messing around in the garage.
- They mess around with old radios on Sundays, taking them apart and putting them back together.
