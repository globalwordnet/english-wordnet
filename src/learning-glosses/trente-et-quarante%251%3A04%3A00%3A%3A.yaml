simpleMeaning: Players can bet on the color of the cards or on which of two rows dealt comes nearer to
  one number in this card game.
scope: Also called rouge et noir, this is a card game with two rows dealt, not a game with one row.
examples:
- They played trente-et-quarante and bet on which row would come nearer.
- They bet on the color of the cards in a game of trente-et-quarante.
