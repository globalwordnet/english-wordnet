simpleMeaning: Said of a bird's foot whose first and fourth toes point back while its second and third
  point forward.
scope: This one is said of feet, not of wings.
examples:
- The woodpecker's zygodactyl feet gripped the bark.
- Parrots have zygodactyl feet, with two toes pointing back.
