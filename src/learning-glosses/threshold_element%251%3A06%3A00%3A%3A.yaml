simpleMeaning: A logic element that acts when a set mark is reached.
scope: This is also called a threshold gate, and it is not a part that works without a set mark to pass.
examples:
- They fitted a threshold element where the work had to wait for a set mark.
- The threshold element did nothing until the set mark was reached.
