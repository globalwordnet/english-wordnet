simpleMeaning: a note or a run of notes played by plucking the strings with a finger
scope: A note or run of notes played by plucking strings with a finger, not a note played with a bow and
  not a direction telling a player to pluck.
examples:
- A brief pizzicato interrupted the long, bowed melody.
- She played the pizzicato with the tip of her finger.
