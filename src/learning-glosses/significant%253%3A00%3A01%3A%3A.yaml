schema: oewn-learning-gloss-v2
senseId: 'significant%3:00:01::'
synsetId: 02173212-a
simpleMeaning: In statistics, describing an observed relationship that would be unlikely under a model
  assuming no relationship.
scope: A statistical result unlikely to be due to chance, not something important or meaningful, nor something
  large in amount or worth.
examples:
- The difference between the two groups was statistically significant.
- The effect remained significant after the researchers adjusted for age.
