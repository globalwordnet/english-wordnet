simpleMeaning: A performer wins the crowd's eye with this worked-out turn, bringing it back time after
  time.
scope: Also called shtick, schtick or schtik, this is the worked-out turn a performer brings back time
  after time to win the crowd's eye, not a devious trick and not a prank.
examples:
- They told him to play it straight with no shtik.
- The comic kept the same shtik in every show.
