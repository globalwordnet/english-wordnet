simpleMeaning: Said of a person who feels ill from movement in a plane.
scope: People also call this airsick, seasick, or carsick, and it is felt up in the sky, not at sea or
  on the road.
examples:
- They felt air sick halfway through the flight and asked for a bag.
- The bumpy ride left them air sick, and they sat still with their eyes closed.
