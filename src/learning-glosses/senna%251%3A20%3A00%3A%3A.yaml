simpleMeaning: A plant in the genus Senna, with leaves divided into paired leaflets and showy, usually
  yellow flowers. Many species have medicinal uses.
scope: Any of the plants of the group it is named for — the group Senna —, with feather-like compound
  leaves and showy, usually yellow, flowers, many used as medicine.
examples:
- Their senna bloomed in the yard.
- The senna was used at dawn.
