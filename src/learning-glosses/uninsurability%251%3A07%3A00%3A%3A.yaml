senseId: 'uninsurability%1:07:00::'
synsetId: 04725582-n
simpleMeaning: The state of not being able to get protection against loss, and the facts about a person
  that make a company refuse to sell it, by its own rules.
scope: It is a state, not a thing you can buy.
examples:
- The uninsurability of the old house meant no company would cover it.
- The uninsurability of the driver came from a long record of claims.
