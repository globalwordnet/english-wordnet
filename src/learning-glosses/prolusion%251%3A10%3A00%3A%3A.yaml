senseId: 'prolusion%1:10:00::'
synsetId: 06409546-n
simpleMeaning: A short piece of writing that introduces a book, placed before its main text.
scope: Also called a preface or a foreword. It is not exercise done to get the body ready for hard work.
examples:
- The prolusion explains why the author wrote the book.
- They read the prolusion first, then started the opening chapter.
