simpleMeaning: A white crystalline compound in the amide family, derived from acrylic acid. It can damage
  the nervous system and has caused cancer in laboratory animals.
scope: This white crystal-like chemical, made from propenoic acid, can harm the nerves and cause cancer
  in lab animals, not the acid it comes from.
examples:
- They claimed that acrylamide is made when some foods are baked or fried at high heat.
- Lab tests showed that acrylamide can cause cancer in animals.
