simpleMeaning: To take a tale as having a meaning beyond its plain words.
scope: Also called allegorise. It is not about making a story into one.
examples:
- The critic liked to allegorize the novel, finding a second meaning in it.
- They allegorize the old myths in class, reading each god as a human fault.
