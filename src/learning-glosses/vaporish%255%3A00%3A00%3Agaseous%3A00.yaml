senseId: vaporish%5:00:00:gaseous:00
synsetId: 02271247-s
simpleMeaning: Said of a thing that is like a thin mist, or has the nature of one.
scope: Also called vaporous, vaporific, vapourific, vapourish, and vapourous. It is said of a thing, not
  of the mist itself.
examples:
- A vaporish mist hung over the river at dawn.
- The vaporish air made the hills look soft and far away.
