simpleMeaning: A rank in biology for living things, set below an order and above the group just below
  it.
scope: It names a rank in the sorting of living things, not the living things themselves.
examples:
- Scientists placed the new beetles in a superfamily above the old group.
- The superfamily sits between an order and the ranks below it.
