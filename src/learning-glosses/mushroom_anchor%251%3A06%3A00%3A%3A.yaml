simpleMeaning: An anchor for keeping a boat moored in one place for long periods. Its bowl-shaped head
  digs in however the anchor lands.
scope: This bowl-headed piece, used for moorings that stay put a long time, digs in however it falls.
examples:
- The mushroom anchor dug in however it fell.
- They used a mushroom anchor for a mooring that would stay put a long time.
