simpleMeaning: A small waxy white or pinkish woodland plant nourished by fungi, with scalelike leaves
  and a single drooping flower. It turns black with age.
scope: Also called waxflower and Indian pipe; a small waxy white woodland plant that feeds on dead matter,
  with scale-like leaves and one nodding flower.
examples:
- Monotropa uniflora turns black with age.
- Monotropa uniflora grows in the woods with one nodding flower.
