simpleMeaning: An artery that carries blood to the cerebellum at the back of the brain.
scope: Also called cerebellar artery, this one is not a vessel that carries blood away from the lower
  back part of the brain.
examples:
- Without the arteria cerebelli, the lower back part of the brain would get no blood.
- The scan showed the arteria cerebelli feeding the lower back part of the brain.
