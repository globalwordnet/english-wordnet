simpleMeaning: The part of a glycerol molecule left when its three hydroxyl groups are removed, leaving
  three points where it can bond.
scope: This names the chemical piece with three free links, taken from a thick sweet liquid by taking
  away its three hydroxyl parts.
examples:
- Glyceryl links to three other parts in the compound.
- The formula showed glyceryl with three free links.
