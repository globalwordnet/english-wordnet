simpleMeaning: The stopping of a woman's monthly bleeding, after she has had it before.
scope: It is a stopping, not a case where bleeding never started.
examples:
- After the illness, they had secondary amenorrhea for six months.
- The clinic treats women with secondary amenorrhea.
