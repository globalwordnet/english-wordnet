simpleMeaning: A sticky, soft-haired plant with clusters of bright pink trumpet-shaped flowers. In sandy
  desert soil, it can carpet miles after heavy rain from the southwestern US to northern Mexico.
scope: Not other desert plants, nor other pink-flowered plants of sandy soil; also called desert sand
  verbena.
examples:
- Abronia villosa carpets the desert after rain.
- The pink flowers of Abronia villosa are bright.
