simpleMeaning: A colorless, oily liquid formed when two acetaldehyde molecules join. It contains both
  an alcohol group (-OH) and an aldehyde group (-CHO).
scope: This sense is also called aldehyde-alcohol.
examples:
- Aldol held an alcohol part.
- An aldol came from acetaldehyde.
