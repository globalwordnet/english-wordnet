simpleMeaning: A game played with 48 cards, using two copies of each card from nine through ace in each
  suit. Players take tricks as in whist.
scope: Also called pinochle, bezique, or penuchle. It is a card game, not whist itself.
examples:
- They sat down for a game of pinocle after dinner.
- They won the last hand of pinocle.
