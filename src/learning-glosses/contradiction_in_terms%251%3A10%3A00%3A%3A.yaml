senseId: 'contradiction_in_terms%1:10:00::'
synsetId: 07221547-n
simpleMeaning: A set of words that cannot be true, because one part takes back what another part says.
scope: Also called a contradiction; this one is about a set of words.
examples:
- Saying 'it is raining and it is not raining' at once is a contradiction in terms.
- Calling the plan both secret and public is a contradiction in terms.
