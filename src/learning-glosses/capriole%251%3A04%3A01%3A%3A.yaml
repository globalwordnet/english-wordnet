simpleMeaning: A light, quick jump made just for fun.
scope: Caper is another name for this, while the other senses of the same word name a trained horse's
  high jump with a kick of its back legs, a horse making such a jump, and a leap in ballet.
examples:
- The child gave a capriole of joy on hearing the news.
- With a capriole, the child cleared the puddle.
