simpleMeaning: Said of words or ideas used so often that they sound stale and worn from use.
scope: Also called tired, stock, threadbare, commonplace, banal, trite, timeworn, hackneyed, shopworn,
  or well-worn. It is an adjective.
examples:
- The old-hat joke got no laugh from the crowd.
- Their old-hat excuse did not fool anyone.
