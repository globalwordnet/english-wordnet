senseId: 'probability%1:07:01::'
synsetId: 05098974-n
simpleMeaning: A number measuring how likely an event is. For equally likely outcomes, divide the number
  of outcomes producing the event by the total number of possible outcomes.
scope: 'Also called chance: how likely an event is to happen, shown as a number, not the mere quality
  of being probable.'
examples:
- The probability that an unbiased coin will fall with the head up is 0.5.
- The probability of rain tomorrow is high, so take an umbrella.
