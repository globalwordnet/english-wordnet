simpleMeaning: This person says things out loud in words, above all one who speaks in public or talks
  on and on.
scope: This person is also called a speaker, a talker, an utterer, or a verbalizer, not one who only writes.
examples:
- The verbaliser at the meeting talked on and on long after the others had stopped listening.
- They asked the verbaliser to give the public speech at the start of the day.
