simpleMeaning: The group of people who make new laws, change laws already in force, or take laws away.
scope: It is also called legislature, general assembly, law-makers, or legislative body.
examples:
- The legislative assembly passed a new law on Monday.
- Members of the legislative assembly debated the bill all night.
