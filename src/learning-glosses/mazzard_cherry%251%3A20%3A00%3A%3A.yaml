simpleMeaning: A sweet stone fruit from wild trees or from seed, kept as the rooted plant onto which a
  grower joins a cutting.
scope: Gean and mazzard are other names for this.
examples:
- The mazzard cherry in the back field gives growers strong roots for grafting.
- They grafted the new kind onto a mazzard cherry in the spring.
