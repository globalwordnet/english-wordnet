simpleMeaning: Bent or curved so that it points toward the back.
scope: Also called retroflexed. It is a word for a shape, not for how a sound is made.
examples:
- The retroflex tip of the leaf points back toward the stem.
- The retroflex hairs on the stem curve back toward the plant.
