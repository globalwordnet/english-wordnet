senseId: 'arbitrational%3:01:00::'
synsetId: 02648381-a
simpleMeaning: Describing something tied to a dispute settled by a person picked by both sides, or that
  comes out of such a settling.
scope: Also called arbitral, this one is not about a dispute that the two sides settle on their own.
examples:
- The two firms accepted the arbitrational ruling and ended their dispute.
- They agreed to an arbitrational settlement and both sides kept to its terms.
