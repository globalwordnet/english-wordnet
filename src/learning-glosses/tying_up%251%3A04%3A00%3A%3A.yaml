simpleMeaning: A boat coming in is held still by ropes.
scope: Also called docking, moorage, and dockage, this name is for the act of making a boat stay put,
  not for the ropes that do the holding.
examples:
- They tied up the boat and went ashore.
- The crew used ropes for tying up the ship.
