senseId: 'vitrification%1:27:00::'
synsetId: 15137132-n
simpleMeaning: A substance that has been turned into glass, or the glass-like matter that such a change
  leaves behind.
scope: This is a glass-like substance, not the change itself.
examples:
- The vitrification of the clay gave the pot a hard, shiny coat.
- The vitrification left the ash fused into a dark, glass-like lump.
