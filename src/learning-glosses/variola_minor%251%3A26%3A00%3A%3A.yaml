simpleMeaning: A weaker kind of the smallpox virus brings on this mild form of the disease.
scope: This sickness is also called alastrim, milk pox, pseudosmallpox, pseudovariola, white pox, Cuban
  itch, Kaffir pox and West Indian smallpox, not the virus itself.
examples:
- They caught variola minor and felt ill for only a short time.
- People with variola minor had a light case and got better fast.
