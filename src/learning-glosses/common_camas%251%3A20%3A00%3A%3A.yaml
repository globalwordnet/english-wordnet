simpleMeaning: A western North American plant with a large edible bulb, narrow basal leaves, and tall
  green stalks bearing rows of star-shaped flowers ranging from pale to deep violet-blue.
scope: Of western North America, for a plant with a big eatable bulb and star-shaped blooms on tall green
  stalks.
examples:
- Common camas grows in western North America.
- The common camas bears star-shaped blooms.
