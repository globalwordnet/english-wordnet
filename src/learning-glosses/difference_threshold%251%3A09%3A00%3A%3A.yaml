simpleMeaning: The smallest shift in what reaches the senses that a person is able to pick up.
scope: This one is also called difference limen, differential limen, and differential threshold.
examples:
- The difference threshold for the two sounds was crossed when the second tone grew louder.
- The nurse raised the heat in small steps to find the difference threshold where the patient first felt
  warmer.
