synsetId: 03038018-a
simpleMeaning: Having or resembling flower clusters whose stalks spread from a common point, or consisting
  of such clusters.
scope: Also called umbellar, this is about flower heads on stalks from one point, not only a thing that
  looks like them.
examples:
- The umbellate flowers grew on stalks from one point.
- The umbellate head of flowers stood on a stalk.
