simpleMeaning: People grind lapis lazuli, a stone that gives this colour, into a sky-coloured powder for
  colouring things.
scope: Also called ultramarine, this sky-coloured powder comes from ground lapis lazuli, not from any
  other stone.
examples:
- They mixed ultramarine blue into the paint for the sky in the picture.
- They bought some ultramarine blue to colour the cloth.
