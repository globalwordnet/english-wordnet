simpleMeaning: Gregory XIII’s 1582 solar calendar skipped October 5–14. Only century years divisible by
  400 are leap years. Britain and its American colonies adopted this widely used calendar in 1752.
scope: Also called New Style calendar; the sun count now in use, not the Julian count it replaced and
  not a moon count.
examples:
- The Gregorian calendar is used in most countries today.
- Britain took up the Gregorian calendar in 1752.
