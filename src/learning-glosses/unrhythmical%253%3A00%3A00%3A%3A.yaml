senseId: 'unrhythmical%3:00:00::'
synsetId: 02028263-a
simpleMeaning: Said of a sound or a movement that has no steady beat, with stresses that fall at uneven
  times.
scope: Also called unrhythmic. It is a word for a thing, not for a person.
examples:
- The unrhythmical chant of the crowd rose and fell without a pattern.
- An unrhythmical pulse in the music made the song hard to follow.
