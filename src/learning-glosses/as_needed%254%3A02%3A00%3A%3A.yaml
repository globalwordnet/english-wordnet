simpleMeaning: Whenever necessary. On prescriptions, doctors may abbreviate this as PRN.
scope: Also called as required, pro re nata, and PRN, this one is not done on a fixed timetable.
examples:
- Add water as needed while you stir.
- They took the medicine as needed when the pain came back.
