senseId: chatoyant%5:00:00:colorful:00
synsetId: 00404149-s
simpleMeaning: Said of something whose colour changes as the light on it changes, or as you move round
  it.
scope: Shot, iridescent and changeable are other names for this.
examples:
- The chatoyant silk of the dress changed from green to gold as the wearer moved across the room.
- The chatoyant stone in the ring seemed blue from one side and green from the other.
