simpleMeaning: A family planning method that identifies fertile days by changes in the amount and texture
  of cervical mucus. Near ovulation it increases, changing from sticky to clear and slippery.
scope: This sense is also called ovulation method of family planning, for natural birth-spacing, the fruitful
  days read from shifts in the kind and amount of neck mucus, egg-release marked by more mucus that turns
  sticky, then clearer and slipperier.
examples:
- Ovulation methods read mucus signs.
- An ovulation method tracks fruitful days.
