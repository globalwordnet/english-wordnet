senseId: 'exclusive_right%1:07:00::'
synsetId: 05186242-n
simpleMeaning: An entitlement kept for a single person or group, above all one that runs in a family or
  comes with an official post.
scope: This one is also called privilege, prerogative, and perquisite.
examples:
- Only the eldest son held the exclusive right to use the family mill.
- The exclusive right to print the book belonged to one publisher alone.
