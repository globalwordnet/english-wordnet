simpleMeaning: An insect of the group that includes bees, wasps, and ants. Winged forms have two pairs
  of thin wings, and females may have a piercing or stinging egg-laying structure.
scope: It names the four-winged stinging kind, also called hymenopter, hymenopteran, and hymenopteron.
examples:
- The hymenopterous insect flew past the window.
- A hymenopterous insect stung him.
