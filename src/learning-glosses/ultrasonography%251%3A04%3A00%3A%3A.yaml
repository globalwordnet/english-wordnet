simpleMeaning: An imaging technique that uses echoes of high-frequency sound waves to create pictures
  inside the body, often to monitor fetal growth or examine organs.
scope: This sense is also called ultrasound, echography, and sonography.
examples:
- Ultrasonography shaped a sonogram.
- An ultrasonography watched the babe grow.
