schema: oewn-learning-gloss-v2
senseId: 'octave%1:10:00::'
synsetId: 06872451-n
simpleMeaning: The musical interval between one note and the next higher or lower note of the same name,
  spanning eight scale notes counted inclusively.
scope: The musical distance between a note and the same note eight steps higher; not a group of eight
  singers and not a verse of eight lines.
examples:
- Her voice rose a full octave in the song.
- The two notes are an octave apart.
