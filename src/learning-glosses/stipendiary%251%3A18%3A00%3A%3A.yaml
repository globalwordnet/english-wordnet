simpleMeaning: The Home Secretary picks a paid judge in the United Kingdom to hear cases in a police court.
scope: This sense is also called stipendiary magistrate, and it is not a word for someone who gets a regular
  payment.
examples:
- The stipendiary heard the police case.
- A stipendiary was chosen by the Home Secretary to hear the case.
