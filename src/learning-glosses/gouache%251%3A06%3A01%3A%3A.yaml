simpleMeaning: A watercolor paint made with gum that covers the surface so the color underneath does not
  show through.
scope: Here the word names the paint. Gouache can have bright or muted colors.
examples:
- The gouache dried to a flat red.
- She mixed white gouache into the blue paint.
