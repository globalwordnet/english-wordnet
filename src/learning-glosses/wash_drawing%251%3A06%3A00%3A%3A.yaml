simpleMeaning: The artist builds this picture from thin coats of watercolour in one colour, each laid
  over the one before.
scope: This picture is also called a wash, and it is made in one colour, not in many.
examples:
- The wash drawing on the wall showed a misty valley in one colour, layer over layer.
- They made a wash drawing of the old bridge, layer over layer.
