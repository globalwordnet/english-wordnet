simpleMeaning: Any one of three shades that, taken from white, leaves one of the three main shades behind.
scope: Also called primary subtractive colour for light. It is a shade.
examples:
- The primary subtractive colors for light are magenta, cyan, and yellow.
- In class we mixed magenta and yellow, two of the primary subtractive colors for light.
