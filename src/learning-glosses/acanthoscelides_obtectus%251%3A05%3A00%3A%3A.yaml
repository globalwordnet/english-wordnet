simpleMeaning: A beetle whose young live in and feed on beans, either while the beans are growing or after
  they are stored.
scope: 'Also called bean weevil: its young live in beans and eat them, not the grown one.'
examples:
- The Acanthoscelides obtectus larvae ate holes in the stored beans.
- Farmers found Acanthoscelides obtectus in the beans they had put away for winter.
