simpleMeaning: A gas that produces general anesthesia, making a person unconscious and unable to feel
  pain during a procedure.
scope: Inhalation anaesthetic, inhalation general anaesthetic and inhalation general anesthetic are other
  names for this gas.
examples:
- The nurse prepared the inhalation anesthetic before the surgery began.
- Inhalation anesthetic works quickly once it is breathed in.
