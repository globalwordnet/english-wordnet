simpleMeaning: Neon, a colorless, odorless gas that glows red in a vacuum tube. It belongs to the inert
  noble gases and occurs in small amounts in air.
scope: This is the gas with no color or smell giving a red glow, not the gas with no color that fills
  most of the air or the pale metal that gives off rays, and it is also called neon and atomic number
  10.
examples:
- Ne glows red in the tube.
- The sign was filled with Ne.
