simpleMeaning: Said of a thing that helps bring about a change that makes something fit or work better.
scope: It is said of a thing, not of a person.
examples:
- The adjustive knob on the chair lets you set the height just right.
- They made an adjustive change to the plan so it would fit the new dates.
