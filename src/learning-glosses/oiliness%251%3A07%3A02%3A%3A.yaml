simpleMeaning: A show of earnest concern that seems smug and serves the speaker’s own interests.
scope: Also called unction, fulsomeness, oleaginousness, smarminess, or unctuousness. It is a noun.
examples:
- The oiliness in their voice put everyone off.
- They saw through the oiliness at once.
