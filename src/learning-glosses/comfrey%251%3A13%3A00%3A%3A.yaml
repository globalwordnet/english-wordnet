simpleMeaning: Leaves of the comfrey plant, traditionally used for herbal tea, salads, or cooked greens.
  Eating comfrey can harm the liver.
scope: Leaves for a hot drink, and young leaves eaten in salads or cooked; not the plant itself.
examples:
- She grew comfrey by the back wall for tea.
- Young comfrey leaves went into the salad.
