simpleMeaning: Sexual activity between women involving genital rubbing, historically described as resembling
  heterosexual intercourse.
scope: This is a way for two women to have sex together that copies how a man and a woman have sex, not
  sex between a man and a woman itself.
examples:
- The two women practised tribadism, copying the sex act of a man and a woman.
- They had never heard of tribadism, and they asked how two women could copy a man and a woman.
