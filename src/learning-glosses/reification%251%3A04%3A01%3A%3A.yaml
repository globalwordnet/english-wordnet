senseId: 'reification%1:04:01::'
synsetId: 00934113-n
simpleMeaning: treating a person as if they were a mere object, with no feelings, wishes, or life of their
  own
scope: Also called depersonalisation or depersonalization, it is the act of stripping a person of feelings
  and choices and handling them as a mere thing.
examples:
- The book warned that reification turns workers into mere tools.
- According to Marx, treating labor as a commodity was an example of reification.
