simpleMeaning: Players stake chips on A, K, Q, J of different suits from another deck. Play rises from
  a hand's lowest same-suit card until blocked. Matching layout cards wins their chips.
scope: 'Also called stops, boodle, Michigan, and Newmarket: a card game, not the city, and not poker.'
examples:
- We played Chicago until midnight.
- Chicago needs a separate deck for the layout.
