simpleMeaning: A common yellow-flowered iris native to Europe and North Africa, widely grown in gardens
  and established in the wild in the United States.
scope: A common bright-gold flowered iris, also called yellow iris and yellow water flag; not a white
  iris and not a garden lily.
examples:
- Yellow flag grows by the pond and shows bright gold flowers.
- The yellow flag in the marsh blooms in June.
