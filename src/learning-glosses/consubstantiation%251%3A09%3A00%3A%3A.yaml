simpleMeaning: The belief, associated with some High Anglicans, that Christ's body and blood are present
  alongside the bread and wine after these are consecrated in the Eucharist.
scope: Of the High Anglican doctrine on the Eucharist.
examples:
- Consubstantiation teaches Christ's body lives with the bread.
- The consubstantiation joins body and bread.
