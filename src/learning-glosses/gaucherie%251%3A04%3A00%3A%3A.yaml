simpleMeaning: An awkward thing done among other people, showing no tact.
scope: This sense is also called a slip, a gaffe, a faux pas, and a solecism.
examples:
- The gaucherie at the dinner embarrassed everyone at the table.
- A gaucherie during the meeting made the room go quiet.
