simpleMeaning: A psychological test using inkblots whose two halves mirror each other. People describe
  what they see in each one.
scope: Also called the inkblot test and Rorschach, this projective mind check studies what a person says
  they see in ink marks the same on both sides.
examples:
- She took the Rorschach test.
- The Rorschach test uses inkblots.
