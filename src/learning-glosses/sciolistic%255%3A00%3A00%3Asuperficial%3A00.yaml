senseId: sciolistic%5:00:00:superficial:00
synsetId: 01880299-s
simpleMeaning: Showing only a light, surface-level interest in a subject, without the care of someone
  who does it for a living.
scope: Also called dilettante, dilettanteish, and dilettantish. It is a kind of interest.
examples:
- A sciolistic interest in painting never went beyond buying a brush.
- The talk was sciolistic, full of easy remarks and short on real study.
