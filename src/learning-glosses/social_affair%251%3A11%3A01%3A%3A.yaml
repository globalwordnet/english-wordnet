simpleMeaning: A gathering of people, or a ceremony of people, of a formal or official kind.
scope: Also called a function, an occasion, an affair, a social function, a social gathering, and a social
  occasion. It is a meeting.
examples:
- They held a grand affair to mark the firm's fiftieth year.
- The affair drew guests from every part of the country.
