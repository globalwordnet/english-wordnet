simpleMeaning: A legally recognized partnership that two adults of the same sex enter voluntarily and
  intend to last for life unless legally dissolved.
scope: This one is about a partnership.
examples:
- parties to a civil union have all the same benefits, protections, and responsibilities under Vermont
  law as spouses in a marriage
- The couple signed the papers for a civil union.
