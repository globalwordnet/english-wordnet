synsetId: 05912907-n
simpleMeaning: A method of choosing in which each electoral district sends only one person to the law-making
  body, chosen by the people who live there.
scope: Also called scrutin uninomial system, single-member system, uninominal system, and uninominal voting
  system. It is a noun.
examples:
- In the last election, the north district sent one person to the law-making body under the scrutin uninominal
  voting system.
- People in each area pick a single person to speak for them under the scrutin uninominal voting system.
