simpleMeaning: A very dense star formed when a star collapses under its own gravity. It consists mainly
  of neutrons, particles with no electric charge.
scope: A bright ball in the sky that has fallen in on itself, not an ordinary bright ball in the sky and
  not a black hole.
examples:
- The neutron star spins fast and gives out strong radio waves.
- Light from the neutron star took years to reach us.
