simpleMeaning: A long band of material that reacts to light, hundreds of feet long and wrapped around
  a spool, for use in a camera that takes moving pictures.
scope: It is also called cine-film and motion-picture film.
examples:
- The movie film broke as it ran through the projector.
- They loaded the movie film onto the spool before the show.
