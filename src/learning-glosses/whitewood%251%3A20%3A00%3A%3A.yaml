simpleMeaning: A light material from a tulip tree, easy to shape, used to make furniture and thin layers
  that cover it.
scope: Also called true tulipwood, tulipwood, white poplar, and yellow poplar. It is a material.
examples:
- The whitewood table was light enough to move with one hand.
- They cut the whitewood into thin sheets to cover the old chest.
