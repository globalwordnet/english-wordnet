simpleMeaning: A unit in the traditional system of weights used in pharmacy. An ounce equals 480 grains,
  and a pound equals 12 ounces.
scope: Also called apothecaries' weight, this is one of the weights used by old drug-makers.
examples:
- The old recipe gave the dose in apothecaries' units.
- An apothecaries' unit, the ounce, holds 480 grains.
