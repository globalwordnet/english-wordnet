senseId: 'affixation%1:09:00::'
synsetId: 06187639-n
simpleMeaning: A word that comes from adding a small part to the start or end of another word.
scope: It is not the making of a word, and not the act of fixing one thing to another.
examples:
- The word 'unhappiness' is an affixation built from 'happy' with parts added at both ends.
- An affixation like 'darkness' shows a plain word with a part added at the end.
