simpleMeaning: Bismuth, a heavy, brittle, weakly magnet-repelling metal with valence three, chemically
  similar to arsenic and antimony. It is usually recovered while processing other metal ores.
scope: A heavy metal, not arsenic and not antimony; also called atomic number 83 and bismuth.
