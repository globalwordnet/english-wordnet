simpleMeaning: Relating to the region near the equator or to either of its boundaries, the Tropic of Cancer
  and the Tropic of Capricorn.
scope: Of the lands near the equator, not a figure of speech and not hot, wet weather.
examples:
- A tropical year is the time the sun takes to return to the same place.
- The tropical zone lies between the two tropics.
