simpleMeaning: A painful, weakening infection from drinking still water containing young Guinea worms.
  They can mature in the belly and emerge through painful skin blisters.
scope: 'Also called dracunculiasis and Guinea worm: a painful sickness caught from still water, not the
  worm itself.'
examples:
- Guinea worm disease comes from drinking still water.
- She fell ill with Guinea worm disease after drinking from the pond.
