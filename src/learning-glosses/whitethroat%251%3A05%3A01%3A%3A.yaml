simpleMeaning: A grayish-brown Old World warbler with a white throat and white underparts.
scope: This bird is also called greater whitethroat, Curruca communis, and Sylvia communis, and it is
  not the North American finch of the same name.
examples:
- They heard a whitethroat sing from the bushes at dawn.
- In spring, the whitethroat sang from the top of a bush, its pale mark showing in the sun.
