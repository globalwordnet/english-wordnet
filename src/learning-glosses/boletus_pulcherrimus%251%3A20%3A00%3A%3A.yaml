simpleMeaning: An attractive but poisonous mushroom with a brown cap, bright red pores underneath, and
  a thick stalk marked with a netlike pattern.
scope: A lovely but poisonous fungus with a scarlet pore face, not a safe brown-capped mushroom and not
  a red-gilled toadstool.
examples:
- Boletus pulcherrimus is beautiful but poisonous, so we left it alone.
- The scarlet pore surface gave the Boletus pulcherrimus away.
