simpleMeaning: The making of a word by adding a small part to its start or end.
scope: It is not the act of fixing one thing to another, and not the finished word itself.
examples:
- Affixation turns 'happy' into 'unhappy' by adding 'un' at the start.
- The students learned about affixation when they added 'ness' to 'kind'.
