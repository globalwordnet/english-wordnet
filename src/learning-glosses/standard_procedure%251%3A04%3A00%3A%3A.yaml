simpleMeaning: A set of steps laid down in advance, to be followed the same way every time.
scope: Also called standard operating procedure, standing operating procedure, and SOP. It is a way of
  working.
examples:
- The office has a standard procedure for handling complaints, and everyone follows it.
- They checked the standard procedure before starting the job.
