simpleMeaning: Said of a part of the body that has to do with mucin, the stuff that makes the lining of
  the nose and gut slimy, or holds it.
scope: It is an adjective.
examples:
- The mucinous glands in the gut give out the liquid that keeps its lining wet.
- Mucinous tissue lines the nose and makes the stuff that keeps it moist.
