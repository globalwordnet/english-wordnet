synsetId: 92443807-n
simpleMeaning: Opposition to the Aesthetic movement in art, which placed special value on beauty.
scope: This word stands on the side against the art movement that put beauty first, not on the side of
  that movement.
examples:
- Seye's photographs of Samb's courtyard can be read as expanding the anti-aestheticism of Samb's work
  in several ways.
- The essay defends the anti-aestheticism of artists who refuse to make beautiful things.
