simpleMeaning: Describing something that is linked to the small open spaces in soft tissue, or looks like
  them, or is cut into them.
scope: This word is also called areolar.
examples:
- The areolate surface of the leaf was marked with small round pits.
- The areolate patch on the sample showed a grid of tiny spaces.
