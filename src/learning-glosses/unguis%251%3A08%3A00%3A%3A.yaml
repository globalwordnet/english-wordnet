simpleMeaning: Keratin, the tough stuff that forms nails, claws, and hair, makes up most of this hard
  part of the body.
scope: Also called a horny structure, this word names a body part, not a soft part.
examples:
- The unguis on the animal's foot was hard and curved.
- A thick unguis covered the end of the toe.
