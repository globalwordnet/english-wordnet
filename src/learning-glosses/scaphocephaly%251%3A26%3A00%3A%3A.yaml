simpleMeaning: A condition present at birth that gives the skull a long, narrow shape. Some affected children
  also experience developmental difficulties.
scope: The head is long and narrow from birth in this state, not a hurt got later in life.
examples:
- The baby was born with scaphocephaly.
- The child with scaphocephaly learned slowly.
