synsetId: 13751538-n
simpleMeaning: A number involving i, the square root of minus one. A purely imaginary number has the form
  bi, where b is real.
scope: The wider class of complex numbers has the form a + bi. Purely imaginary numbers have zero real
  part, as in 3i.
examples:
- The teacher showed how an imaginary number can be drawn on a graph.
- You need an imaginary number to solve this equation, since no ordinary value works.
