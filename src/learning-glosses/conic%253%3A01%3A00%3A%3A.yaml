simpleMeaning: Describing something wide at the bottom that tapers to a fine tip.
scope: Also called cone-shaped, conelike, and conical, this one is about a shape, not the curve made where
  a flat surface cuts through a cone.
examples:
- The roof had a conic shape that rose to a point.
- They built a conic tower with a wide base and a pointed top.
