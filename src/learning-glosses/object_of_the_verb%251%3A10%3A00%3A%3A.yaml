simpleMeaning: The word or phrase directly affected by a verb's action, such as the window in she opened
  the window.
scope: Also called a direct object. It is a noun.
examples:
- In 'They kicked the ball', 'ball' is the object of the verb.
- The word 'cake' is the object of the verb in 'They baked a cake'.
