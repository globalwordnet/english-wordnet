simpleMeaning: A line across a billiard table behind which players place the cue balls at the start of
  a game.
scope: Also called a baulk-line or a string line, this one names a mark on the table.
examples:
- The balkline kept the cue balls behind it until the break.
- They racked the balls behind the balkline before the game began.
