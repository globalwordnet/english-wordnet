simpleMeaning: A long smoothing tool that a woodworker uses to shape the edges of boards so the boards
  fit together.
scope: It is also called a jointer or a jointer plane, and a long plane is another name for it.
examples:
- The carpenter ran the jointing plane along the board until the edge was smooth.
- The jointing plane is the tool for flattening a board edge.
