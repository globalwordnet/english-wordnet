simpleMeaning: A muscle tightens in a sudden hard tug, above all when something is wrong with the nerves.
scope: This is also called a twitch or twitching, and it is not a slow tightening.
examples:
- A vellication in their eyelid made it hard to keep their eye open.
- A vellication in their arm came on when something went wrong with their nerves.
