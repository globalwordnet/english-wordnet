senseId: 'reinsure%2:32:01::'
synsetId: 00893062-v
simpleMeaning: to agree, as a second firm, to carry all or part of a risk that another firm has already
  covered, so the first firm is covered again
scope: It is agreeing, as a second firm, to carry a risk another firm has already covered, not handing
  on a risk you have already covered.
examples:
- The larger firm agreed to reinsure the small company's flood risk.
- The group agreed to reinsure part of the risk the smaller firm already covered.
